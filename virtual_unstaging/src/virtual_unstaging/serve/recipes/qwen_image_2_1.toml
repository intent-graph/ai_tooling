# Qwen-Image-2.1: text-to-image and editing in one pipeline; condition images in a list, no mask argument.
# Verified: pipeline class (model_index.json; the class exists in diffusers 0.41.0), the __call__ arguments
# (diffusers source), the card's example (bfloat16, .to("cuda"), 40 steps), commit and licence.
# Unverified: see `unverified`.
name = "qwen_image_2_1"
adapter = "diffusers"
licence = "Qwen Research License (non-commercial)"
unverified = ["placement", "max_images", "output_side", "text_only"]
notes = [
  "The card says up to ten reference images; the vLLM-Omni documentation says four condition images.",
  "The pipeline has no mask argument (signature read): a mask is a condition image, in request order.",
  "A 7.1B transformer and an 8.8B text encoder (32.4 GB in bfloat16) move to the GPU in turn. Sized to share one 80 GB GPU with an FP8 judge (about 36 GB): the generator must peak under about 40 GB.",
  "negative_prompt only acts when true_cfg_scale is above 1; the recipe leaves it out.",
]

[pipeline]
class = "QwenImage21Pipeline"
repository = "Qwen/Qwen-Image-2.1"
revision = "d26bb61231c349cf6b7896fa83353113880e1ba3"
dtype = "bfloat16"
placement = "model_cpu_offload"

[inputs]
roles = ["original", "reference", "removal_mask", "protected_mask"]
max_images = 4
native_mask = false
image_argument = "image"
image_passing = "list"
prompt_argument = "prompt"
seed_argument = "generator"
text_only = true            # also text to image (no image sent): the image argument is left out; not run yet

[output]
side = 1024
multiple = 32
width_argument = "width"
height_argument = "height"

[settings]
steps_argument = "num_inference_steps"

[settings.defaults]
num_inference_steps = 40
true_cfg_scale = 1.0
