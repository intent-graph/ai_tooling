[project]
name = "clutter-pairs"
version = "0.1.0"
description = "Pairs of images of the same view, clean and cluttered, made by generator-and-judge loops, fully auditable"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "virtual-unstaging",  # imported, never copied (design C10); its surface: design/components.md
    "numpy>=1.26",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "import-linter>=2.1",
]

[project.scripts]
cpairs = "clutter_pairs.cli:main"

[tool.uv.sources]
virtual-unstaging = { path = "../virtual_unstaging", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clutter_pairs"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["clutter_pairs"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["virtual_unstaging", "virtual_unstaging.*"]
follow_untyped_imports = true  # the imported package is typed (strict mypy) but ships no py.typed marker

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers"

# Declared layering (design/components.md), checked by `lint-imports` with the tests.
[tool.importlinter]
root_package = "clutter_pairs"

[[tool.importlinter.contracts]]
name = "Layers: presentation, application, adapters, pure core, domain"
type = "layers"
layers = [
    "clutter_pairs.cli",
    "clutter_pairs.run | clutter_pairs.plan | clutter_pairs.export | clutter_pairs.audit | clutter_pairs.report | clutter_pairs.gpu",
    "clutter_pairs.dataset",
    "clutter_pairs.models | clutter_pairs.recorder | clutter_pairs.store | clutter_pairs.config | clutter_pairs.fakes",
    "clutter_pairs.compose | clutter_pairs.pairs | clutter_pairs.lessons | clutter_pairs.engine | clutter_pairs.space",
    "clutter_pairs.domain",
]
