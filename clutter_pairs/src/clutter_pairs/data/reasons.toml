# Reason codes for findings: the stage they apply to and their fixed severity. The verdict rule reads the severity
# here, never the judge's own call (design/loops.md, "The verdict and the stop rule"). A code's severity never
# changes once used: a different severity is a new code. The judges' answer schemas list the codes of their stage;
# the pixel tests raise the codes marked `by = "pixels"`.
# Split (owner, 2026-10-22): a judge code that can be serious or slight has a `_minor` twin with its own meaning, so
# the judge's choice of code carries the severity and the verdict still reads it here.
# Openings (owner, 2026-10-22: "inventing openings ... is the biggest no no"): `opening_changed` never has a
# `_minor` twin.

[not_empty]
stage = "clean"
severity = "blocking"
by = "judge"
meaning = "a movable item (furniture, belonging) is in the clean image"

[room_off_spec]
stage = "clean"
severity = "blocking"
by = "judge"
meaning = "the room type, style, light or camera is not the one specified"

[room_off_spec_minor]
stage = "clean"
severity = "minor"
by = "judge"
meaning = "the room is the one specified, with a slight drift: light a little off, framing a little wider or tighter"

[implausible]
stage = "both"
severity = "blocking"
by = "judge"
meaning = "the image is not plausible as a photograph: broken geometry, impossible light, melted objects"

[artifact]
stage = "both"
severity = "minor"
by = "judge"
meaning = "a small rendering flaw that does not change what the image shows"

[clutter_off_spec]
stage = "clutter"
severity = "blocking"
by = "judge"
meaning = "the clutter does not match its spec: wrong items, wrong density"

[clutter_off_spec_minor]
stage = "clutter"
severity = "minor"
by = "judge"
meaning = "the clutter matches its spec, with a slight drift: an item of a close kind (an armchair for a sofa), a density a little off"

[item_missing]
stage = "clutter"
severity = "blocking"
by = "judge"
meaning = "a specified item is not in the cluttered image"

[placement_violation]
stage = "clutter"
severity = "blocking"
by = "judge"
meaning = "an item breaks its placement rule"

[placement_violation_minor]
stage = "clutter"
severity = "minor"
by = "judge"
meaning = "an item's placement is debatable but not wrong: close to a window or a door without blocking it"

[scene_changed]
stage = "clutter"
severity = "blocking"
by = "judge"
meaning = "something other than the added clutter changed: a wall, a fixture, the light, the framing"

[scene_changed_minor]
stage = "clutter"
severity = "minor"
by = "judge"
meaning = "a slight change outside the clutter that changes nothing a decluttering tool must learn: a reflection, a shadow on the floor next to an item"

[misaligned]
stage = "clutter"
severity = "blocking"
by = "pixels"
meaning = "the edit is shifted against the clean image, or not at its size"

[global_repaint]
stage = "clutter"
severity = "blocking"
by = "pixels"
meaning = "the edit changed colour or levels across the whole image"

[change_share_off]
stage = "clutter"
severity = "blocking"
by = "pixels"
meaning = "the change mask covers a share of the image outside the range its density implies: too little, or a rebuilt room"

[unexplained_change]
stage = "clutter"
severity = "blocking"
by = "pixels"
meaning = "a numbered region of the change mask holds no listed item by the judge's answer"

[opening_changed]
stage = "clutter"
severity = "blocking"
by = "judge"
meaning = "a door, window or passage appeared, vanished, moved, changed size or changed kind; one partly hidden behind an added item is not a change"
