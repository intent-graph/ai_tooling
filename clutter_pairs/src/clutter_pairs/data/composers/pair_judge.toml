# The pair judge's request: its instruction, the clutter spec, the clean image, the cluttered image, and the cluttered
# image with the change mask's numbered regions drawn (judge aid A2).
role = "judge"
request = "chat"
renderer = "spec_text"
renderer_version = 1
schema = "schema"
settings = ["temperature", "max_tokens"]

[[messages]]
role = "system"
content = [{ slot = "instruction" }, { slot = "knowledge" }]

[[messages]]
role = "user"
content = [
  { slot = "spec", header = "Specification:" },
  { slot = "clean", header = "The clean image:" },
  { slot = "cluttered", header = "The cluttered image:" },
  { slot = "regions", header = "The cluttered image with the numbered regions where the two images differ:" },
]
