# The clean writer's request: its instruction, the scene's spec, the lessons of its arm; free-text answer.
role = "write"
request = "chat"
renderer = "spec_text"
renderer_version = 1
schema = "schema"
settings = ["temperature", "max_tokens"]

[[messages]]
role = "system"
content = [{ slot = "instruction" }]

[[messages]]
role = "user"
content = [
  { slot = "spec", header = "The room to photograph:" },
  { slot = "lesson", header = "Lessons learned from earlier images, to follow:" },
]
