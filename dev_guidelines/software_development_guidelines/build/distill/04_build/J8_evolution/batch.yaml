  - build/research/12_evolution/result.md::EVOL-C20
  - ../web_architecture_guidelines/build/research/07_architecture_styles/result.md::ARCH-C02
  - ../web_architecture_guidelines/build/research/07_architecture_styles/result.md::ARCH-C44
  - ../web_architecture_guidelines/build/research/07_architecture_styles/result.md::ARCH-C33
- op: node.create
  uid: EVOLUTION.DEBT.3
  name: Finding and Inventorying Debt
  intent: Debt is inventoried as items, each with cause, consequence, affected artefact and impact, and
    managed by recognising, analysing, monitoring and measuring. Because no validated automatic metric
    predicts where debt hinders, a periodic survey of engineers is the main signal of where it hurts,
    with tools (smells, coupling, dependency analysis) and measurable maintainability signals as trend
    tracking. The inventory is one list kept where the team plans its work, so repayment competes with
    features in the same plan; a code marker carries only the item's id as a pointer, and a decision record
    holds a debt item only where the debt came from a recorded decision.
  parent: EVOLUTION.DEBT
  epistemic_state: 'inferred: survey primacy (summary of an unread paper), item fields and inventory placement
    | known part: the limits of tools'
  constraints:
  - Every deliberate debt item and every unfinished migration appears in the inventory
  design_notes: 'Positions: P1 tool-detected smells (cheap, trend tracking, misses design debt; best as
    the supplement). P2 survey of engineers (what hinders them, deliberate debt, investment in reduction;
    subjective, survey fatigue). P3 inventory with item fields, in a tracker, an in-code marker or a decision
    record. P4 measurable maintainability signals: searchability, time to change code in another team''s
    area, duplicate and unused code, version consistency, length of the dependency upgrade cycle (L1027,
    single source REG-1015; the upgrade cycle is the debt-side view of OWNERSHIP.LIFECYCLE.3 and .5).
    Sources: REG-1006, REG-1025, REG-1030 (L1022); REG-1006, REG-1027, REG-1028, REG-1030 (L1023, inferred).
    Final pass R20: survey sentence opens with ''Because no validated automatic metric predicts where
    debt hinders''; context: where a validated metric exists for a kind of debt it replaces the survey
    for that kind (L1022''s condition). R21 (judge flag F1, undecided, now settled): the inventory is
    one list where the team plans its work (no tool named); the marker''s force (proximity to the code)
    is kept by the pointer and the record''s by the link, so nothing either serves is lost, not a genuine
    trade-off. Rejected: P1 as the primary signal (misses design debt; best as the supplement); P2 alone
    (subjective and fatiguing, so paired with measured trends). Certainty: inferred as stated; grounded
    for tool limits. Realizes OWNERSHIP.LIFECYCLE (L1027 see also L052); see CHANGE_FLOW.MEASURE. MD-01,
    MD-03.'
  impl_pointers:
  - build/distill/03_judge/J8_evolution/judged.md::EVOLUTION.DEBT.3
