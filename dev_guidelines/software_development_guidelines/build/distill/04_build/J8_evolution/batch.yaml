- op: node.create
  uid: EVOLUTION.INCREMENTAL.5
  name: Lifespan, Consumers and Cost of Change
  intent: The life of a system is a series of changes it must absorb, so the investment in changeability
    is set by its expected lifespan. The cost of change and removal grows with the number of consumers,
    because they depend on observable behaviour; so owners of shared infrastructure can change it without
    tracking each consumer only through reliance-capturing tests. Changeability is thus bought where life
    and reach justify it, and change does not silently break dependants.
  parent: EVOLUTION.INCREMENTAL
  epistemic_state: known
  constraints:
  - The expected lifespan and the consumers of a shared interface are stated where the investment is decided
  design_notes: 'Positions: P1 lifespan decides the investment (L1015; consensus; REG-1014). P2 cost of
    change grows with consumers; counter with reliance tests in CI, the mechanism being ASSURANCE.CONTRACTS.2
    (L1016; consensus; REG-1002, REG-1014). Forces: cost of ownership over time, consumer predictability.
    Grounds: lifespan multiplies every maintainability cost (same stance as OWNERSHIP.STANCE.4); the more
    consumers, the more behaviours are relied on (Hyrum''s Law, ASSURANCE.CONTRACTS.1). Review R06: outcome
    kept here, mechanism in CONTRACTS.2. Rejected: none; the two are not rivals. A fixed investment regardless
    of lifespan is best for neither a throwaway nor a decades-long system. Context: none (lifespan and
    consumer count are the inputs). Certainty: grounded (consensus). Evidence gap: the figure REG-1031
    was not read from the original and is not used. Realizes OWNERSHIP.STANCE.4, OWNERSHIP.LIFECYCLE,
    OWNERSHIP.SELECTION, ASSURANCE.CONTRACTS.1 and .2. MD-01, MD-03.'
  impl_pointers:
  - build/distill/03_judge/J8_evolution/judged.md::EVOLUTION.INCREMENTAL.5
  - build/research/12_evolution/result.md::EVOL-C15
  - build/research/12_evolution/result.md::EVOL-C16
- op: node.create
  uid: EVOLUTION.INCREMENTAL.6
  name: Conventions Applied Forward Only
  intent: A new convention applies to new objects, and existing objects are not renamed where the surface
    has many consumers. A deprecated item is marked where its consumers and their tools see it, in machine-readable
    metadata of the item, and in its name only where renaming it breaks no consumer; it stays, with documented
    deprecation and its relationships, until a later planned removal. Where consumers are few and reachable
    and the rename is mechanical and verified by tests, one coordinated rename avoids a permanently split
    convention; so consistency is bought at the lowest cost to consumers.
  parent: EVOLUTION.INCREMENTAL
  epistemic_state: 'known | inferred part: the few-consumer exception (no row states it)'
  constraints:
  - A deprecated item is marked where its consumers and their tools see it (machine-readable metadata;
    in its name only where renaming it breaks no consumer) and remains until its planned removal
  design_notes: 'Positions: P1 MAINT: forward only, deprecated items marked and removed later (L296, MAINT-C32,
    REG-181, not citable; majority in public practice). P2 retroactive rename (consistency at a cost of
    risk; best where consumers are few, reachable and the change is tool-made and tested). Maintainer''s
    codified practice won as the base rule (forward only, many consumers). Two refinements go beyond it
    and are listed for the maintainer to object (maintainer_points item 18, settled, no answer awaited):
    R15, the deprecation mark is placed in machine-readable metadata, and in the name only where a rename
    breaks no consumer, since CONTRACTS.1 classes a rename as breaking; and the few-consumer exception,
    which follows from settled CONTRACTS.1 (few, in-house, reachable consumers: a breaking change is coordinated
    and deployed together) and INCREMENTAL.4, extends the maintainer''s practice and does not go against
    it (R16, unchanged text). Rejected: P2 for a surface with many consumers (risk without a matching
    gain). Forces: cost, reversibility, consistency. Context: CONSUMER_COUNT (L296). Certainty: grounded
    for forward-only; the few-consumer exception inferred. See DECOMMISSION.3, INCREMENTAL.4. MD-01.'
  impl_pointers:
