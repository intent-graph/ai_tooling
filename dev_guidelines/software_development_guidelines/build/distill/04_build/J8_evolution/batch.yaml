- op: node.create
  uid: EVOLUTION.TECHNOLOGY.1
  name: Adding as Replacing
  intent: 'The number of different tools solving the same problem is held down: a new technology is introduced
    as a replacement, with the retirement of the older one planned and owned, because the long-term cost
    of keeping an extra system reliable exceeds the convenience of building with it. A few tools that
    cover the whole domain are preferred, so shared platform work benefits all. How firmly this holds
    follows TECHNOLOGY.3: for few, independently operated components, fit to the problem counts as the
    stated need that allows adding alongside; so the count does not grow by default.'
  parent: EVOLUTION.TECHNOLOGY
  epistemic_state: known
  constraints:
  - Introducing a technology records what it replaces, or why it replaces nothing, and the retirement
    owner
  design_notes: 'Positions: P1 hold the number of tools per problem down, plan migration. P2 add as replacement,
    plan retirement (L026, L1038; majority, same normative claim; REG-013, REG-1002, REG-1022). P3 few
    tools covering the domain (L1229; majority; REG-1022; shared platform work scales with few tools).
    This node carries out, at the level of the whole estate, the entry rule of OWNERSHIP.SELECTION.2 (novelty
    spent only where the existing tool cannot solve the need, with an exit or migration plan); this node
    holds the replacement commitment, that rule holds the entry test (MD-03). Final pass R24: firmness
    sentence added. Rejected: adding alongside, best only where the new technology serves a problem the
    present ones cannot, which SELECTION.2 requires to be documented. Context: see TECHNOLOGY.3. Certainty:
    grounded (majority, three sources). Realizes OWNERSHIP.SELECTION; see TECHNOLOGY.3, DECOMMISSION.2.
    MD-01, MD-03.'
  impl_pointers:
  - build/distill/03_judge/J8_evolution/judged.md::EVOLUTION.TECHNOLOGY.1
  - build/research/01_sourcing/result.md::SRC-C26
  - build/research/12_evolution/result.md::EVOL-C38
  - ../web_architecture_guidelines/build/research/07_architecture_styles/result.md::ARCH-C31
- op: node.create
  uid: EVOLUTION.TECHNOLOGY.2
  name: Standing Position per Technology
  intent: The team keeps a shared register of the technologies in use, each with a position (standard,
    being evaluated, held for retirement) and a decision trail linking its record. Where the organisation
    has capacity for experiments the four-ring vocabulary (adopt, trial, assess, hold) is used; a small
    or operations-heavy team keeps the register without the evaluation rings. The register holds technologies
    and the team's position on each; it is neither the sanctioned list of admitted dependencies (the gate)
    nor the inventory of what is deployed, since position, admission and presence are three facts, each
    held once. So anyone can see what the team standardises on, tries and is moving away from, and why.
  parent: EVOLUTION.TECHNOLOGY
  epistemic_state: 'known | inferred part: the decision trail'
  constraints:
  - Each technology in use has a position and a link to its record
  design_notes: 'Position: P1 an explicit shared position per technology with a decision trail (L1039;
    majority; REG-015, REG-1024). Grounds: grounded for the rings, inferred for the decision trail. The
    scale of the practice follows OWNERSHIP.SELECTION.2, which keeps standing rings as the way novelty
    is run where the capacity exists, not as a default for every team. Final pass R25: register-scope
    sentence and the two links added (technologies, languages, frameworks, stores, platforms; admission
    gate is OWNERSHIP.SELECTION.1, deployed inventory is OWNERSHIP.LIFECYCLE.5). Rejected: standing rings
    for every team (best where capacity for experiments and tolerance for churn exist, SELECTION.2); an
    implicit, unrecorded stance (best never, since newcomers cannot tell what is standard). Context: EXPERIMENT_CAPACITY
    (from OWNERSHIP.SELECTION.2): rings only where there is capacity. Certainty: grounded for the register;
    inferred for the trail. Realizes OWNERSHIP.SELECTION (L1039 see also L025, L024); see DECISIONS.3,
    OWNERSHIP.SELECTION.1, OWNERSHIP.LIFECYCLE.5. MD-01, MD-03.'
  impl_pointers:
  - build/distill/03_judge/J8_evolution/judged.md::EVOLUTION.TECHNOLOGY.2
  - build/research/12_evolution/result.md::EVOL-C39
- op: node.create
  uid: EVOLUTION.TECHNOLOGY.3
  name: How Firmly the Stack Is Held
  intent: 'The set of technologies is held as firmly as the cost of a departure is shared. Wherever a
    platform or on-call is shared, a supported default set is kept: a departure whose whole operating
    cost stays with the team that chose it is permitted and unsupported (paved path), and a departure
    whose cost would land on the shared platform or on-call needs a recorded decision naming who carries
    it (mandate). Where components run independently and nothing is shared, each is chosen by fit within
    the default of the selection rule; so the cost of an extra technology is carried by whoever chooses
    it.'
  parent: EVOLUTION.TECHNOLOGY
  epistemic_state: 'inferred: contested row'
  constraints:
  - A departure from the default set whose operating cost would land on the shared platform or on-call
    has a recorded decision naming who carries it
  design_notes: 'Positions: P1 mandate a small set (cognitive load, upgrade cost, shared operations; costs
    local fit; REG-106, REG-013). P2 paved path, departures unsupported (autonomy with a cheap default;
    a tail of unsupported variants; REG-1023). P3 polyglot freedom per component (local fit, learning;
    heterogeneity; REG-1016). Row L1040 is contested; the three positions differ on one variable, who
    carries the operating cost, which the row names as the force; shared platform and on-call turn a local
    choice into a shared cost. Final pass R26: decision replaced; the ''between the two'' condition, stated
    by no source, is dropped; the constraint was edited consequently so it no longer contradicts the paved-path
    sentence. Rejected: P1 for a departure whose cost stays with its team; P2 for a departure that would
    land on a shared on-call; P3 for a shared platform. Review R12: a rejection of multiple versions deleted;
    version choice per dependency is OWNERSHIP.LIFECYCLE.2 and one version of each shared component is
    CHANGE_FLOW.INTEGRATION.1. Context: where the operating cost of a departure lands (L1040). Certainty:
    inferred. See TECHNOLOGY.1; realizes OWNERSHIP.SELECTION. MD-01.'
  impl_pointers:
  - build/distill/03_judge/J8_evolution/judged.md::EVOLUTION.TECHNOLOGY.3
  - build/research/12_evolution/result.md::EVOL-C40
- op: node.create
  uid: EVOLUTION.TECHNOLOGY.4
  name: One General-Purpose Store for Several Roles
  intent: One mature general-purpose data store is preferred for queue, cache, search and documents while
    it meets the need now with headroom. A specialised system is added when a stated requirement (very
    low latency cache, large-scale search relevance, scale) exceeds what the store delivers, shown by
    measurement or by a documented limit of the store, not by the team's expectation. So there are fewer
    systems to operate, and each added system has a measured reason.
  parent: EVOLUTION.TECHNOLOGY
  epistemic_state: 'inferred: no top-tier or second-tier source states the rule | gap: contested row resting
    on one-project or commercially interested sources, limits of the store not verified from primary sources;
    no final-pass resolution addressed it (judge flag F8)'
  constraints:
  - A specialised store is added with the requirement it meets and the measurement or documented limit
    showing the general store falls short
  design_notes: 'Positions: P1 one general-purpose store until limits are reached (L1232; REG-1126 T1,
    REG-1128 and REG-1129 T4, one with commercial interest; fewer failure points, less context switching).
    P2 specialised system from the start (best where a stated requirement is known at the start to exceed
    the general store: sub-millisecond cache, large-scale search). The T1 source documents the limits
    of the one store for queue-like use and says it is not for general-purpose work. It is the data-store
    case of OWNERSHIP.STANCE.4 (no building for presumed needs) and of TECHNOLOGY.1. The proponent''s
    headroom figure (about ten times) is one source''s and not adopted. Review R13: ''by measurement or
    by a documented limit of the store''. Rejected: P2 as a default (adds systems on a prediction). Context:
    LOAD_AND_TEAM_SIZE (L1232): small team and modest load. Certainty: inferred. Stack pointer: origin
    stack was a relational database, restated stack-neutral by the ledger; boundary DATA. Open flag F8.
    Realizes OWNERSHIP.STANCE.4, OWNERSHIP.SELECTION; see TECHNOLOGY.1. MD-01.'
  impl_pointers:
  - build/distill/03_judge/J8_evolution/judged.md::EVOLUTION.TECHNOLOGY.4
  - ../web_architecture_guidelines/build/research/07_architecture_styles/result.md::ARCH-C34
