  - build/research/07_maintainer_doctrine/result.md::MAINT-C32
- op: node.create
  uid: EVOLUTION.DEBT.1
  name: What Counts as Debt
  intent: 'Debt is any design or implementation choice, or unfinished piece of work, that makes future
    change more costly or impossible, whether taken knowingly or not. The inventory is wider than code
    quality: it includes design trade-offs invisible to code metrics, unfinished migrations, missing or
    stale documentation, missing tests, dead code, out-of-date dependencies, concentrated team expertise
    and a weak release process. So debt that hurts change is weighed even when no tool shows it.'
  parent: EVOLUTION.DEBT
  epistemic_state: 'known | inferred part: the full list of items (secondary source for the breadth)'
  constraints:
  - An unfinished migration and an out-of-date dependency are debt items when they raise the cost of change
  design_notes: 'Positions: P1 debt limited to internal qualities, maintainability and evolvability (L1018;
    consensus; REG-1001, REG-1005, REG-1006; a contingent liability). P2 debt wider than code (L1021;
    REG-1006, REG-1025, REG-1030; the most significant debt comes from design trade-offs not visible in
    code metrics). Both state one idea at two widths; the wider one serves the purpose, which is to decide
    what gets inventoried and weighed. Rejected: P1 as the whole definition: best where the aim is only
    to talk about code structure; it omits debt that code metrics cannot see. Context: none. Certainty:
    grounded for the definition; the full list inferred. Review R04: unfinished-migration-as-debt is kept
    here and in DEBT.3, INCREMENTAL.2 points here. See CHANGE_FLOW.DATA_CHANGE, INCREMENTAL.2, OWNERSHIP.LIFECYCLE.5.
    MD-01, MD-03.'
  impl_pointers:
  - build/distill/03_judge/J8_evolution/judged.md::EVOLUTION.DEBT.1
  - build/research/12_evolution/result.md::EVOL-C18
  - build/research/12_evolution/result.md::EVOL-C21
- op: node.create
  uid: EVOLUTION.DEBT.2
  name: Taking Debt Versus Investing in Quality
  intent: Internal quality is invested in from the start for anything that will be changed, because the
    payoff of good design arrives in weeks and does not trade against speed beyond the smallest scope.
    Debt is taken deliberately only for a short-lived or exploratory deliverable, knowingly, recorded,
    and then repaid as DEBT.5 sets or dropped with the deliverable. The system is kept simple with minimal,
    modular interfaces and small releases; so debt is a recorded choice with a repayment, not an accident.
  parent: EVOLUTION.DEBT
  epistemic_state: 'inferred: contested source claim, payoff point unproven | known part: the knowing-and-recorded
    rule'
  constraints:
  - Deliberate debt is recorded as an inventory item (DEBT.3), repaid as DEBT.5 sets, or dropped with
    the deliverable
  - A deliverable that outlives its stated short life is re-judged as a lasting one
  design_notes: 'Positions: P1 a little debt speeds development if repaid promptly (best for a short-lived
    or exploratory deliverable). P2 quality is not a trade-off (anything that will be changed). P3 prudent
    versus reckless; deliberate only knowingly (L1237, REG-1130). P4 simplicity as a reliability property
    (L1231, REG-1132). Rows L1020 and L1207 (REG-1001, REG-1005, REG-1007, REG-1120, REG-1121): contested;
    the author of the payoff claim states there is no objective proof, so the decision is conditional
    on the lifetime of the work, not a universal. Repayment timing is DEBT.5 (REG-1130, REG-1001, fetched
    in review: interest is paid only when working in the area; final pass R19). Deletion of code is held
    in DECOMMISSION.1, small releases in INCREMENTAL.1. L308 (MAINT, OWNERSHIP.STANCE.1) states the cost-of-lasting-liability
    stance this node realizes. Rejected: P1 as a general policy (best for a short-lived or exploratory
    deliverable, the condition kept); quality as a universal free good (the payoff point is unproven,
    so a throwaway may rightly skip it). Review R07: constraint points to the inventory item. Context:
    SCOPE_AND_LIFETIME (L1020). Certainty: inferred. Evidence gap: payoff point unproven. Realizes OWNERSHIP.STANCE
    (L1231 see also L308). MD-01, MD-03.'
  impl_pointers:
