operations:
- op: node.create
  uid: EVOLUTION.DECISIONS
  name: Decision Records
  intent: A significant decision gets a short record stored beside the code, stating the forces, the alternatives,
    the decision and the costs it accepts; an accepted record is superseded, never rewritten. Each record
    has a status and an owner and is consulted in review, and a separate proposal precedes the record
    only where many stakeholders deliberate. The reason is that the motivation of past decisions is among
    the hardest things to recover, and its loss makes a team obey outdated decisions or reverse them blindly.
  parent: EVOLUTION
  epistemic_state: 'known | inferred part: the immutability-versus-living split and the proposal split'
  constraints:
  - Children DECISIONS.1 to .6 hold the rules; this node states none of its own.
  design_notes: 'Roll-up of DECISIONS.1 to .6; states no fact of its own (MD-03). Forces of the branch:
    delivery continuity, reversibility, cost of ownership over time, confidence in past decisions, consumer
    predictability, cognitive load. Certainty: grounded (consensus across the architecture-record sources);
    inferred for the immutability-versus-living split and the proposal split. Realizes OWNERSHIP.SELECTION.1
    (the reason for a selection is stored as a record). MD-01, MD-02, MD-03.'
  impl_pointers:
  - build/distill/03_judge/J8_evolution/judged.md::EVOLUTION.DECISIONS
- op: node.create
  uid: EVOLUTION.INCREMENTAL
  name: Incremental Change
  intent: Change is made in steps that keep the system releasable and teach early, and every incompatible
    change runs as expand, migrate, contract with the contract step part of the change. A system is replaced
    piece by piece behind its interface and rewritten only under stated conditions; a mass change has
    one accountable owner with capacity. Investment in changeability follows expected lifespan and consumer
    count, and a new convention applies forward only where many consumers depend on the surface.
  parent: EVOLUTION
  epistemic_state: 'known | inferred part: the rewrite conditions and the owner split'
  constraints:
  - Children INCREMENTAL.1 to .6 hold the rules; this node states none of its own.
  design_notes: 'Roll-up of INCREMENTAL.1 to .6; states no fact of its own (MD-03). Certainty: grounded
    for step size, expand-migrate-contract and mass-change mechanics; inferred for the rewrite conditions
    and the owner split. Realizes OWNERSHIP.STANCE.4, OWNERSHIP.LIFECYCLE, ASSURANCE.CONTRACTS. MD-01,
    MD-02, MD-03.'
  impl_pointers:
  - build/distill/03_judge/J8_evolution/judged.md::EVOLUTION.INCREMENTAL
- op: node.create
  uid: EVOLUTION.DEBT
  name: Technical Debt and Refactoring
  intent: Debt is anything that makes future change more costly, wider than code quality, and it is inventoried.
    Speed is bought with debt only knowingly, for short-lived or exploratory work; debt is made visible
    mainly by engineers' reports, with tools as support. Refactoring runs in small behaviour-preserving
    steps, and repayment is timed by where code changes, with explicit capacity for debt no change touches.
  parent: EVOLUTION
  epistemic_state: 'known | inferred part: the speed-versus-quality payoff and the repayment timing (contested
    or single-source rows)'
  constraints:
  - Children DEBT.1 to .5 hold the rules; this node states none of its own.
  design_notes: 'Roll-up of DEBT.1 to .5; states no fact of its own (MD-03). Certainty: grounded for the
    definition and the refactoring step size; inferred for the speed-versus-quality payoff and the repayment
    timing (contested or single-source rows). Realizes OWNERSHIP.STANCE, OWNERSHIP.LIFECYCLE, ASSURANCE.BEHAVIOUR.
    MD-01, MD-02, MD-03.'
  impl_pointers:
  - build/distill/03_judge/J8_evolution/judged.md::EVOLUTION.DEBT
- op: node.create
  uid: EVOLUTION.DECOMMISSION
  name: Decommissioning
  intent: Removal is planned engineering work with an owner and a budget. A retirement is decided on stated
    grounds and recorded, announced in two stages (deprecation, then sunset) with machine-readable, actionable
    warnings, and given a published support window where consumers are many. It has a deadline unless
    the replacement sells itself, and is executed by verifying use, restricting reversibly, then removing
    everything attached.
  parent: EVOLUTION
  epistemic_state: 'known | inferred part: the owner-and-budget synthesis and the support-window context'
  constraints:
  - Children DECOMMISSION.1 to .6 hold the rules; this node states none of its own.
  design_notes: 'Roll-up of DECOMMISSION.1 to .6; states no fact of its own (MD-03). Certainty: grounded
    for the staging, the announcement and the execution checklist (consensus); inferred for the owner-and-budget
    synthesis and the window context. Realizes OWNERSHIP.STANCE, OWNERSHIP.SERVICES, ASSURANCE.CONTRACTS.
    Provider-side evolution policies are held in ASSURANCE.CONTRACTS.1 and the consumer side in OWNERSHIP.SERVICES.2
    (X7, supersedes X3). MD-01, MD-02, MD-03.'
  impl_pointers:
  - build/distill/03_judge/J8_evolution/judged.md::EVOLUTION.DECOMMISSION
- op: node.create
  uid: EVOLUTION.TECHNOLOGY
  name: Keeping Technologies Few
  intent: A technology is added as a replacement, with the retirement of what it replaces planned and
    owned. The team keeps a shared register of the technologies in use, each with a position and a decision
    trail; how firmly the set is held follows how much platform and on-call is shared, and one mature
    general-purpose store serves several roles until a stated need exceeds it.
  parent: EVOLUTION
  epistemic_state: 'known | inferred part: the firmness conditions and the one-store rule'
  constraints:
  - Children TECHNOLOGY.1 to .4 hold the rules; this node states none of its own.
  design_notes: 'Roll-up of TECHNOLOGY.1 to .4; states no fact of its own (MD-03). Certainty: grounded
    for the replacement rule and the register; inferred for the firmness conditions and the store rule.
    Realizes OWNERSHIP.SELECTION, OWNERSHIP.STANCE. MD-01, MD-02, MD-03.'
  impl_pointers:
  - build/distill/03_judge/J8_evolution/judged.md::EVOLUTION.TECHNOLOGY
- op: node.create
  uid: EVOLUTION.DECISIONS.1
  name: Content of a Record
  intent: A decision record states the forces at play, the decision, the serious alternatives with why
    the rejected ones were rejected (dissent included), and the consequences including the costs it accepts,
    in one fixed structure shared by all records. This lets a later reader tell why it was decided, what
    would have to change to revisit it, and whether new information justifies reopening.
  parent: EVOLUTION.DECISIONS
  epistemic_state: 'known | inferred part: named forces as the revisit trigger (P4, one origin, no source
    tests it)'
  constraints:
  - A record states the decision and its reason
  - A record states the alternatives rejected and the costs accepted
  design_notes: 'Positions: P1 record the reasons (L1001; consensus; REG-1011, REG-1012, REG-154). P2
    add alternatives, confidence and dissent (L1002; REG-1011, REG-1013, REG-1019, REG-1020, REG-1114).
    P3 fixed template: title, context, decision, status, consequences (L1233; REG-154). P4 name the forces,
    technical, political, social, project-local, written value-neutrally (L1009; inferred; REG-1019, REG-154).
    P5 MAINT: state the accepted costs (L324, REG-181, not citable). Forces: confidence, reversibility,
    cognitive load. Grounds: motivation is among the hardest things to recover and its loss makes a team
    obey outdated decisions or reverse them blindly; alternatives and dissent keep the same discussion
    from reopening without new information; one structure lowers reading cost; named forces make a change
    in them the revisit trigger; stated accepted costs give a strong reason a concrete counterweight.
    Maintainer''s codified practice (L324) agrees with public practice and is the best form of the consequences
    part: it won, nothing lost. Rejected: nothing; the five practices are parts of one record, each serving
    a distinct failure (lost reason, reopened argument, unreadable variety, unseen trigger, unweighed
    cost). A reason-only record without alternatives is best only for a decision with no real alternative,
    which DECISIONS.2 excludes from a record. Context: none. Certainty: grounded for P1 to P3 and P5;
    inferred for P4. Realizes OWNERSHIP.SELECTION.1 (L1001, L1002, L1009 see also L029). MD-01, MD-02.
    Evidence gaps: none.'
  impl_pointers:
  - build/distill/03_judge/J8_evolution/judged.md::EVOLUTION.DECISIONS.1
  - build/research/12_evolution/result.md::EVOL-C01
  - build/research/12_evolution/result.md::EVOL-C02
  - ../web_architecture_guidelines/build/research/07_architecture_styles/result.md::ARCH-C39
  - build/research/12_evolution/result.md::EVOL-C09
  - ../web_architecture_guidelines/build/research/07_architecture_styles/result.md::ARCH-C36
  - build/research/07_maintainer_doctrine/result.md::MAINT-C60
- op: node.create
  uid: EVOLUTION.DECISIONS.2
  name: Significance Threshold
  intent: 'A decision gets its own record when it is architecturally significant (structure, non-functional
    requirements, dependencies, interfaces, construction techniques) and a later maintainer could not
    recover its reason from an existing policy or standard: several options were weighed, or no existing
    basis supplied the answer. A decision a recorded policy settles points to the policy; a workaround
    or an experiment gets no record; a deliberate, temporary shortcut is recorded as a debt item. So the
    records that exist are the ones a later reader would otherwise have to guess, and none is noise.'
  parent: EVOLUTION.DECISIONS
  epistemic_state: 'inferred: the bar reads the sources'' two positions as a floor and a ceiling; no source
    gives a numeric or structural threshold'
  constraints:
  - A significant decision with no policy basis, or with options weighed, has a record
  - A workaround, an experiment or a policy-backed decision has no record of its own
  design_notes: 'Positions: P1 every architecturally significant decision, short records (L1004 a; confidence,
    onboarding; costs authoring time; best with many contributors or long life; REG-1011, REG-1114, REG-154,
    REG-163). P2 only when no existing basis or options were weighed (L1004 b; low overhead; best for
    a small team with standards; REG-1012). P3 skip workarounds and experiments (REG-1028, T4). Decision
    replaced in the final pass (R14): combined test, a floor and a ceiling. Rejected: P1 as stated, since
    recording what a policy already carries restates its reason (MD-03); it is best only where the policy
    itself is not recorded where readers find it. Reversibility is not part of the test (review R01: no
    row states it). P2 alone, for a small team with standards, is kept as the baseline. Context: none;
    with many contributors or a long life more decisions meet the test, since what is obvious to the team
    today is not to a newcomer; the test scales, no second bar is needed. Certainty: inferred. Realizes
    OWNERSHIP.SELECTION (L1004 see also L029); OWNERSHIP.SELECTION.1 is the dependency instance. MD-01,
    MD-03.'
  impl_pointers:
  - build/distill/03_judge/J8_evolution/judged.md::EVOLUTION.DECISIONS.2
  - build/research/12_evolution/result.md::EVOL-C04
  - ../web_architecture_guidelines/build/research/07_architecture_styles/result.md::ARCH-C35
- op: node.create
  uid: EVOLUTION.DECISIONS.3
  name: Form and Storage
  intent: A decision record is short (one or two pages), covers one decision, is numbered monotonically
    with no number reused, is written as prose to a future reader in lightweight text markup, and is stored
    in version control in the repository of the code it governs; a wiki mirror serves wider reach only,
    the repository stays the source. So the record travels with the code, has history and is found by
    anyone who reads the code.
  parent: EVOLUTION.DECISIONS
  epistemic_state: known
  constraints:
  - Records live in the repository of what they govern
  - A record number is never reused
  design_notes: 'Position: P1 short, numbered, in the source repository (L1003; consensus across six sources,
    no competing practice recorded; REG-1012, REG-1013, REG-1024, REG-1028, REG-1114, REG-154). Forces:
    cognitive load, cost of ownership. Grounds: proximity to the code and history are what make a record
    survive. Rejected: none recorded; a wiki as the source is best only where the records must be read
    and edited by people outside the repository, at the cost of drifting from the code. Context: none.
    Certainty: grounded. Used by TECHNOLOGY.2 (the decision trail) and DECOMMISSION.2. MD-01.'
  impl_pointers:
  - build/distill/03_judge/J8_evolution/judged.md::EVOLUTION.DECISIONS.3
  - build/research/12_evolution/result.md::EVOL-C03
  - ../web_architecture_guidelines/build/research/07_architecture_styles/result.md::ARCH-C37
- op: node.create
  uid: EVOLUTION.DECISIONS.4
  name: Changing an Accepted Record
  intent: 'An accepted decision record is not rewritten: a changed decision is a new record that supersedes
    the old one, which stays in place marked superseded, so history is never wrong, only superseded. Only
    corrections that do not change the decision (a typo, a broken link) edit an accepted record; a document
    that describes the current state (how-to, reference) is living and is kept current by ownership and
    checks. So a reader can reconstruct what was decided when and why, and always see which record is
    current.'
  parent: EVOLUTION.DECISIONS
  epistemic_state: 'known | inferred part: the assignment of the two models per document type (from L232)'
  constraints:
  - An accepted record is never rewritten to change its decision
  - A superseded record carries a link to its successor
  design_notes: 'Positions: P1 immutable log with supersession (L232 a, L1005 a; best with many readers
    relying on the record, regulated review, rationale documents; REG-154, REG-163, REG-1011). P2 mutable
    living document with dated additions, kept current by CI and ownership (L232 b, L1005 b; accuracy
    of the current picture, less authoring friction; best where the record is the only place readers look
    and a few people own it; how-to and reference documents; REG-1028, REG-1012). Agreement recorded:
    majority (L232), contested (L1005 EVOL-C05), consensus (WEB:ARCH-C38). Forces: audit, confidence,
    accuracy of the current picture, cost of ownership. Grounds: a record is rationale at a moment and
    history that is rewritten cannot be audited; the contrary evidence (REG-1028, mutability has worked
    better) concerns documents readers use as the current truth, the living-document type, not a decision
    record; in version control history survives edits, which lowers the cost of mutation, but the status
    stays machine-readable only when records are superseded (inferred, L1005 note). Rejected: P2 for decision
    records, since it loses the order of decisions and the status; best for how-to and reference documents,
    assigned to TRANSVERSE.DOCS. Context: DOCUMENT_TYPE (L232): rationale documents immutable with supersession,
    how-to and reference documents living. Certainty: grounded for supersession (consensus on the rule,
    contested only on the alternative); the assignment per document type inferred. See DECOMMISSION.2.
    MD-01, MD-03.'
  impl_pointers:
  - build/distill/03_judge/J8_evolution/judged.md::EVOLUTION.DECISIONS.4
  - build/research/06_transverse/result.md::TRANS-C23
  - build/research/12_evolution/result.md::EVOL-C05
  - ../web_architecture_guidelines/build/research/07_architecture_styles/result.md::ARCH-C38
- op: node.create
  uid: EVOLUTION.DECISIONS.5
  name: Status, Ownership and Use in Review
  intent: Each record has a status (proposed, accepted, rejected, superseded, deprecated), a named owner
    accountable for its upkeep and a review before acceptance. During code and design review the accepted
    records are consulted, and a change that violates one is linked to it and either conforms or arrives
    with a new record that supersedes it. So a decision that was accepted is checked at the moment a change
    could break it.
  parent: EVOLUTION.DECISIONS
  epistemic_state: 'known | inferred part: consulting records in review (one source, no dissent found)'
  constraints:
  - Every record has a status and a named owner
  - A change that contradicts an accepted record cites it
  design_notes: 'Positions: P1 status, owner and review before acceptance (L1006; consensus, single practice
    recorded; REG-1011, REG-1013, REG-154). P2 consult accepted records during review (L1007; one source,
    no dissent; REG-1011). Forces: confidence, accountability. Grounds: status, owner and review are the
    minimum for a record to be trusted; a record nobody consults at review has no effect; it matches the
    review that binds of ASSURANCE.RULES.4. Rejected: none; the two are complementary and no source argues
    against either. A record without owner or status is best only for a throwaway note, which DECISIONS.2
    excludes. Routing note: L1007 stays here (consulting records in review sits with the record''s status
    and ownership). Context: none. Certainty: grounded for P1; inferred for P2. See CHANGE_FLOW.REVIEW
    and ASSURANCE.RULES.4. MD-01.'
  impl_pointers:
  - build/distill/03_judge/J8_evolution/judged.md::EVOLUTION.DECISIONS.5
  - build/research/12_evolution/result.md::EVOL-C06
  - build/research/12_evolution/result.md::EVOL-C07
- op: node.create
  uid: EVOLUTION.DECISIONS.6
  name: Proposal Versus Record
  intent: Where many stakeholders must be heard, the decision is prepared in a proposal written before
    it is made (drawbacks, alternatives, unresolved questions, a backward-compatibility section, a named
    decider), and the record keeps only the outcome and its reason, linking the proposal. Where few stakeholders
    are involved the lightweight record alone is the whole practice. So deliberation and outcome each
    reach the reader who needs them, and a small team does not pay for a process it does not need.
  parent: EVOLUTION.DECISIONS
  epistemic_state: 'inferred: single-origin synthesis of two open-source projects; no source measures
    either practice'
  constraints:
  - A proposal names its decider
  - A decision made through a proposal links it from the record
  design_notes: 'Positions: P1 separate proposal and record (best for changes with many stakeholders;
    confidence, speed; REG-1012, REG-1013, REG-1020). P2 one document serves both, as in a language-enhancement
    process (fewer artifacts, history in version control, cognitive load; best in open projects with many
    contributors; REG-1013). P3 lightweight record only (lowest overhead; best for small teams; REG-154,
    REG-1012). Grounds: deliberation and outcome serve different readers, and a record that grows into
    a discussion is no longer short. Rejected: P2, best where the proposal itself is the permanent versioned
    history and carries a final status, as in an open project with many contributors, because it avoids
    duplicating the reasoning; P3 for many stakeholders loses the deliberation (review R02 deleted a variant
    clause from this rejection). Context: STAKEHOLDER_COUNT (L1008): many stakeholders, proposal then
    record; small team, lightweight record. Certainty: inferred. See DECISIONS.1 and DECISIONS.5. MD-01,
    MD-02.'
  impl_pointers:
  - build/distill/03_judge/J8_evolution/judged.md::EVOLUTION.DECISIONS.6
  - build/research/12_evolution/result.md::EVOL-C08
- op: node.create
  uid: EVOLUTION.INCREMENTAL.1
  name: Step Size and Feedback
  intent: Change proceeds in steps that keep the system releasable at every step, using an interface that
    supports both versions or an abstraction with two suppliers, rather than a long-lived branch or one
    switch-over. Each step is released and its effect checked against the effect it was meant to have,
    because many presumed improvements do not move their metric. So the system is never held back by a
    half-finished change, and a wrong direction is found while it is cheap to reverse.
  parent: EVOLUTION.INCREMENTAL
  epistemic_state: known
  constraints:
  - Every step leaves the system releasable
  - A step's intended effect is stated and checked after release
  design_notes: 'Positions: P1 releasable steps (L1010; consensus; REG-1004, REG-105). P2 short feedback
    beats up-front analysis: only about a third of presumed features improved their target metric (L1236;
    majority; REG-034). Forces: delivery continuity, reversibility, delivery speed, evidence of value.
    Grounds: releasable steps keep continuous integration and rollback possible; build-to-learn is the
    evidence-backed use of a step and carries OWNERSHIP.STANCE.4 (no building for presumed needs) to the
    unit of change. Rejected: a long-lived branch or a single switch-over; see INCREMENTAL.2 for when
    a switch-over is best (review R03). Skipping analysis entirely is not what P2 says: analysis proportional
    to the cost of being wrong stays (STANCE.4 on costly-to-reverse structures). Routing note: L1236 stays
    here, its subject being step size and feedback; L1208 is held in OWNERSHIP.STANCE.4. Context: none.
    Certainty: grounded for P1; grounded for P2 on one source. Realizes OWNERSHIP.STANCE.4; see CHANGE_FLOW.INTEGRATION,
    CHANGE_FLOW.ROLLBACK. MD-01.'
  impl_pointers:
  - build/distill/03_judge/J8_evolution/judged.md::EVOLUTION.INCREMENTAL.1
  - build/research/12_evolution/result.md::EVOL-C10
  - ../web_architecture_guidelines/build/research/07_architecture_styles/result.md::ARCH-C43
- op: node.create
  uid: EVOLUTION.INCREMENTAL.2
  name: Expand, Migrate, Contract
  intent: 'An incompatible interface or schema change runs as expand, migrate, contract: first support
    old and new together (for a schema, deploy a form that supports both application versions, verify,
    then deploy the application that uses the new one), then move consumers, then remove the old form.
    The removal step belongs to the change, because supporting two versions is a recurring cost that ends
    only at removal; an unfinished migration is debt. So rollback stays possible during the move and the
    old form does not become permanent.'
  parent: EVOLUTION.INCREMENTAL
  epistemic_state: 'known | inferred part: an unfinished migration is itself debt (P2)'
  constraints:
  - 'The plan of an incompatible change names its removal step and owner (owner and capacity: DECOMMISSION.1)'
  design_notes: 'Positions: P1 expand, migrate, contract (L1011; consensus; REG-087, REG-1004, REG-105,
    REG-244). P2 an unfinished migration is itself debt, held in DEBT.1 (L1012; inferred; REG-1030, REG-105).
    Forces: reversibility, delivery continuity, cost of ownership. Grounds: expanding first keeps rollback;
    a migration without removal is debt. What counts as breaking is ASSURANCE.CONTRACTS.1; the mechanics
    for stored data are CHANGE_FLOW.DATA_CHANGE (MD-03). Final pass R18: owner and capacity principle
    held in DECOMMISSION.1. Rejected: a single coordinated switch-over: best where one release unit contains
    every consumer and a short outage or lock is acceptable (the few-reachable-consumers case of CONTRACTS.1),
    at the price of no rollback during the switch. Context: none beyond the consumer-reach context decided
    in CONTRACTS.1. Certainty: grounded for P1; inferred for P2. Realizes ASSURANCE.CONTRACTS.1; see CHANGE_FLOW.DATA_CHANGE,
    CHANGE_FLOW.ROLLBACK, DEBT.1 (inventoried by DEBT.3). MD-01, MD-03.'
  impl_pointers:
  - build/distill/03_judge/J8_evolution/judged.md::EVOLUTION.INCREMENTAL.2
  - build/research/12_evolution/result.md::EVOL-C11
  - ../web_architecture_guidelines/build/research/06_operations/result.md::OPS-C40
  - build/research/12_evolution/result.md::EVOL-C12
- op: node.create
  uid: EVOLUTION.INCREMENTAL.3
  name: Replacement Versus Rewrite
  intent: A system is replaced incrementally while it keeps running, at seams and behind its existing
    interface (the strangler pattern). A full rewrite is justified only when the old platform is obsolete,
    the old system runs in parallel until the new one is proven, and the migration is slow and verified;
    a big-bang cut-over is not a practice. So users keep a working system, the hidden knowledge in the
    old behaviour is preserved, and the old system is removed only once the new one is shown equivalent.
  parent: EVOLUTION.INCREMENTAL
  epistemic_state: 'known | inferred part: the conditions for a full rewrite (it is open whether any position
    wins in general)'
  constraints:
  - A replacement keeps the old system serving until the new one is verified against the old behaviour
  - A full rewrite carries a recorded reason that the platform is obsolete
  design_notes: 'Positions: P1 never rewrite, refactor in place (best when the system ships, its behaviour
    is poorly specified and no replacement need exists; REG-1021). P2 rewrite when changing the old costs
    more than new (best when the platform is obsolete and the old system runs in parallel; threshold unverified;
    REG-1029). P3 incremental replacement, full rewrite only under stated conditions with parallel running
    (REG-033, REG-1004). P4 big-bang wholesale rewrite (no source argues for it; best, inferred, only
    where the system is small, every consumer sits in one release unit, equivalence is verified and a
    short outage is acceptable). Rows L039 (ADOPT-C06) and L1017 (EVOL-C17, WEB:ARCH-C42). EVOL-C17 records
    the incremental form as contested against never-rewrite and rewrite; WEB:ARCH-C42 states it as consensus.
    Forces: continuity, replacement, reversibility, delivery speed. The rewrite rule of thumb (25 percent)
    is one unverified source and is not adopted. Final pass R17: ''or no seam exists'' dropped from the
    decision and constraint; grounds: REG-033 (strangler fig article, fetched in the final pass) describes
    seams as ones that can be inserted into the system and a transitional architecture whose cost the
    reduced risk and earlier value outweigh, so a missing seam is a cost to pay, not a condition for a
    rewrite. Context: none; the conditions for the rewrite exception are part of the decision. Certainty:
    grounded for the positions; the conditions for a full rewrite inferred (review R05 stated the P4 condition).
    See OWNERSHIP.STANCE (L038), INCREMENTAL.1, DECOMMISSION. MD-01.'
  impl_pointers:
  - build/distill/03_judge/J8_evolution/judged.md::EVOLUTION.INCREMENTAL.3
  - build/research/02_adoption/result.md::ADOPT-C06
  - build/research/12_evolution/result.md::EVOL-C17
  - ../web_architecture_guidelines/build/research/07_architecture_styles/result.md::ARCH-C42
- op: node.create
  uid: EVOLUTION.INCREMENTAL.4
  name: Mass Change and Migration Ownership
  intent: A mechanical change across a large codebase is generated with tools, split into independently
    testable and reviewable shards, with the old pattern blocked from reappearing; small single-owner
    code can change in one step. A migration across many consumers has one accountable owner, usually
    the party that wants the change, and a finish condition. Consumers migrate on their own only where
    the replacement is transformatively better, since an unfunded mandate stalls; so the change completes
    and consumers carry little of the load.
  parent: EVOLUTION.INCREMENTAL
  epistemic_state: 'known | inferred part: the boundary between the sharded, owned form and a single step'
  constraints:
  - A migration has a named owner and a finish condition
  - 'The old pattern is blocked by a check once the migration is done (owner and capacity: DECOMMISSION.1)'
  design_notes: 'Positions: P1 generate, shard, block the old pattern (L1013; REG-1003). P2 central owner
    with staffed capacity (L1014; REG-1002, REG-1003). P3 consumers migrate themselves (best when the
    replacement is transformatively better). Grounds: the largest atomic change shrinks as codebase and
    contributors grow, so mechanical sharding scales and review stays possible; an unfunded mandate becomes
    organic migration that rarely completes. Accountability is stated as an outcome (a named owner with
    capacity), not as a rule about who writes code (MD-02). Rejected: P3 as default (autonomy; best when
    the replacement is transformatively better so consumers move unprompted); P2 for few consumers (capacity
    not needed where consumers are few and reachable); one atomic change for a large codebase (best only
    for small single-owner code). Final pass R18: the owner-and-capacity principle is held in DECOMMISSION.1,
    this node keeps ''usually the party that wants the change; a finish condition''. Context: CONSUMER_COUNT_AND_OWNER_COUNT
    (L1013, L1014). Certainty: grounded for P1 and P2 (REG-1002, REG-1003, T2 practice); the context boundary
    inferred. OWNERSHIP.LIFECYCLE (L058, L052) carries the dependency-update analogue. See CHANGE_FLOW.INTEGRATION,
    DECOMMISSION.5. MD-01, MD-02, MD-03.'
  impl_pointers:
