- op: node.create
  uid: EVOLUTION.DEBT.4
  name: Refactoring Step Size
  intent: Refactoring proceeds only in small steps that preserve behaviour, with the checks green after
    each, so the system is never left broken for more than minutes of work. Behaviour not pinned by tests
    is pinned first; a larger rearrangement is restructuring and runs as an incremental change with its
    own controls. So a refactoring can be stopped or reverted at any step and behaviour never changes
    unnoticed.
  parent: EVOLUTION.DEBT
  epistemic_state: known
  constraints:
  - Each refactoring step leaves the checks green
  - A refactoring never changes observable behaviour
  design_notes: 'Position: P1 small behaviour-preserving steps (L1024; consensus, single practice; REG-1008,
    REG-1009). Grounds: small, behaviour-preserving steps are the definition of the practice; the check
    that detects a behaviour change is ASSURANCE.BEHAVIOUR, characterization before change is BEHAVIOUR.5
    (L107; review R08). Rejected: a large unverified rearrangement called refactoring is not a refactoring;
    best treated as a restructuring with its own staging (INCREMENTAL.1, INCREMENTAL.3). Context: none.
    Certainty: grounded (two sources). Realizes ASSURANCE.BEHAVIOUR.5 and .1; see CHANGE_FLOW.REVIEW.
    MD-01.'
  impl_pointers:
  - build/distill/03_judge/J8_evolution/judged.md::EVOLUTION.DEBT.4
  - build/research/12_evolution/result.md::EVOL-C24
- op: node.create
  uid: EVOLUTION.DEBT.5
  name: Timing and Responsibility of Repayment
  intent: 'Maintainability debt is repaid where code is changed, because interest accrues only there:
    tidy before a change when tidying plus the change costs less than the change alone, tidy after, later
    or never otherwise, and never in code that will not change again. Refactoring is opportunistic and
    ordinary work where tests are strong and ownership is shared; structural debt that spans teams, which
    no one touches in passing, gets explicit capacity or a programme with an owner. A tidy lands as its
    own change; so effort goes where it lowers the cost of the next change and cross-team debt is not
    left to feature pressure.'
  parent: EVOLUTION.DEBT
  epistemic_state: 'inferred: single-author source for most of it; the cost inequality is unproven'
  constraints:
  - Maintainability debt in code that will not change again is not repaid
  - Debt that carries risk (code left on production, vulnerable or end-of-life dependencies) is not governed
    by this rule and follows DECOMMISSION.1 and OWNERSHIP.LIFECYCLE.3 and .5
  - Cross-team debt has a named owner and capacity
  design_notes: 'Positions: P1 interest only where changed (L1019; REG-1001, REG-1006). P2 time tidying
    by cost comparison (L1025; majority; REG-1008, REG-1010; options and ''never'' grounded, the inequality
    inferred). P3 opportunistic only. P4 opportunistic plus explicit capacity (L1026; REG-1008; REG-1015,
    REG-1030 secondary; best with strong tests and shared ownership for opportunistic; explicit capacity
    for cross-team debt, a day or two for a gnarly lump). Rejected: P3 alone for cross-team debt (nobody
    touches it in passing; best when tests are strong and ownership shared); a standing debt sprint for
    all debt (argued by no source; best only as the explicit capacity for structural debt). Review R09:
    rule scoped to maintainability debt, risk-carrying debt follows DECOMMISSION.1 and LIFECYCLE. Review
    R10: separate tidy changes decided in CHANGE_FLOW.REVIEW.2; judge flag F2 closed (the skeleton''s
    possible-tension link with review is resolved there, so the link is See). Context: OWNERSHIP_OF_CODE_AND_TEST_STRENGTH
    (L1026). Certainty: inferred. See CHANGE_FLOW.REVIEW.2, INCREMENTAL.4. MD-01, MD-03.'
  impl_pointers:
  - build/distill/03_judge/J8_evolution/judged.md::EVOLUTION.DEBT.5
  - build/research/12_evolution/result.md::EVOL-C19
  - build/research/12_evolution/result.md::EVOL-C25
  - build/research/12_evolution/result.md::EVOL-C26
- op: node.create
  uid: EVOLUTION.DECOMMISSION.1
  name: Why Remove
  intent: Code is a liability whose value lies in the functionality it provides, so the aim is more functionality
    per unit of code, and obsolete code is removed. Removal and migration work is ordinary engineering
    work with a named owner and capacity in the plan, planned alongside features and not left over after
    them, because without them it stalls. Code no longer meant to be used is not left on a production
    system, so it cannot be activated by accident.
  parent: EVOLUTION.DECOMMISSION
  epistemic_state: 'known | inferred part: removal as one rule with owner and budget (no source states
    it as one rule); that removal prevents the whole class of accidental activation'
  constraints:
  - Removal and migration work has a named owner and capacity in the plan
  - Code not intended to run on production is removed from it
  design_notes: 'Positions: P1 code is a liability (L1028; consensus; REG-1002; matches OWNERSHIP.STANCE.1).
    P2 do not leave retired code on production systems (L1029; one T1 case, REG-1017: a regulator found
    missing controls against activating retired code a contributing failure in an incident that lost over
    460 million dollars in 45 minutes). P3 removal is ordinary work with owner and budget (L1041; majority,
    inferred synthesis; REG-1002, REG-1003, REG-1006, REG-1008, REG-1021). This node holds the owner-and-capacity
    principle (final pass R18; stalls without them, REG-1002); INCREMENTAL.2, INCREMENTAL.4, DECOMMISSION.5
    and .6 point here (MD-03). Rejected: removal as leftover work done when capacity allows (best never;
    it is what stalls); keeping dormant code for possible reuse (best only where a recorded reuse is planned,
    with an owner). Context: none. Certainty: grounded for P1 and for P2''s case; P3 inferred. Realizes
    OWNERSHIP.STANCE (L1028 see also L037, L001); see CHANGE_FLOW.DEPLOY (L1029 see also L166). MD-01,
    MD-03.'
  impl_pointers:
  - build/distill/03_judge/J8_evolution/judged.md::EVOLUTION.DECOMMISSION.1
  - build/research/12_evolution/result.md::EVOL-C28
  - build/research/12_evolution/result.md::EVOL-C29
  - build/research/12_evolution/result.md::EVOL-C41
- op: node.create
  uid: EVOLUTION.DECOMMISSION.2
  name: Grounds to Retire
  intent: 'A retirement is decided on stated grounds: a replacement of comparable or better function exists,
    the upkeep cost exceeds the value, the technology is out of date, the strategy has changed, or use
    is low. It is recorded as a decision record that supersedes the adoption record. So a retirement has
    a reason that can be checked and that a later reader finds.'
  parent: EVOLUTION.DECOMMISSION
  epistemic_state: 'known | inferred part: recording the retirement as a decision record (from the practice
    of DECISIONS.1 to .4)'
  constraints:
  - A retirement names its ground and is recorded
  design_notes: 'Position: P1 retire on stated grounds and record it (L1037; consensus for the grounds;
    REG-1002, REG-1011, REG-1026, REG-154). Rejected: retirement by neglect or by the departure of the
    maintainer, which states no ground and is best never, since consumers cannot plan. Context: none.
    Certainty: grounded for the grounds; inferred for the record. See DECISIONS.4 and DECISIONS.3. MD-01.'
  impl_pointers:
  - build/distill/03_judge/J8_evolution/judged.md::EVOLUTION.DECOMMISSION.2
  - build/research/12_evolution/result.md::EVOL-C37
- op: node.create
  uid: EVOLUTION.DECOMMISSION.3
  name: Announcing Retirement
  intent: 'A team retiring an interface or form it offers announces it in two stages with distinct signals:
    deprecation (no longer recommended, still working) and sunset (stops at a stated time), the sunset
    never earlier than the deprecation. Warnings are actionable and relevant, since excess causes alert
    fatigue, and are exposed in machine-readable form so that remaining users are found. So every consumer
    can learn the state and the date by machine, and the owner can see who still uses the form.'
  parent: EVOLUTION.DECOMMISSION
  epistemic_state: known
  constraints:
  - The sunset is not earlier than the deprecation
  - A deprecation is visible to a machine as well as a reader
  design_notes: 'Positions: P1 two stages (L1030; consensus; REG-1026, REG-182, REG-183). P2 actionable,
    relevant, machine-readable warnings (L1032; consensus; REG-008, REG-1002). The principle is neutral;
    stack pointers: L1030 HTTP header fields for deprecation and sunset; L1032 the machine forms (a response
    warning, an audit annotation, a usage metric labelled with the removal version) are Kubernetes and
    HTTP specific. The consumer side (reading these signals, routing them to an alert) is decided in OWNERSHIP.SERVICES.2;
    what counts as a breaking change is ASSURANCE.CONTRACTS.1 (X7: ''see'', not ''realizes'', for SERVICES.2).
    Rejected: a single ''removed in a future release'' notice: best only for an internal item with one
    reachable consumer, who is told directly. Context: none. Certainty: grounded. Realizes ASSURANCE.CONTRACTS.1;
    see OWNERSHIP.SERVICES.2, INCREMENTAL.6. MD-01, MD-03.'
  impl_pointers:
  - build/distill/03_judge/J8_evolution/judged.md::EVOLUTION.DECOMMISSION.3
  - build/research/12_evolution/result.md::EVOL-C30
  - build/research/12_evolution/result.md::EVOL-C32
- op: node.create
  uid: EVOLUTION.DECOMMISSION.4
  name: Support Window Before Removal
  intent: 'Where consumers are many or external, a support policy is published by stability tier with
    fixed minimum windows: a stable interface is deprecated but not removed within a major version, a
    pre-release one has a fixed period, an experimental one may go at any release. Where consumers are
    few and known, the window is set case by case with them. An infrastructure-like API with a large consumer
    base and the funds to carry old behaviour is held as an indefinitely compatible, date-pinned surface,
    which has no window; that case is held in ASSURANCE.CONTRACTS.1. So consumers can plan from a published
    rule and maintainers do not carry old forms without limit.'
  parent: EVOLUTION.DECOMMISSION
  epistemic_state: 'known | gap: no general durations; the concrete numbers (nine months, three releases)
    are one project''s and are not adopted'
  constraints:
  - A published window states, per tier, how long a deprecated form stays
  - No form is removed before its stated window
  design_notes: 'Positions: P1 tiered fixed windows in a published policy (L1031; REG-008, REG-030; predictability
    for consumers, at the cost of carrying old forms). P2 case by case (best with few known consumers,
    where a conversation is faster than a policy). The minor-release rule before removal in a major is
    ASSURANCE.CONTRACTS.1 (review R11); the indefinitely compatible case is held there too (X7, L353 b).
    Rejected: P2 for many external consumers (they cannot plan). Context: CONSUMER_COUNT (L1031): many
    external consumers, a published tiered window; few known consumers, case by case. Certainty: grounded
    for the tiered policy; the numbers are one project''s, not general. Realizes ASSURANCE.CONTRACTS.1;
    see OWNERSHIP.SERVICES.2. MD-01, MD-03.'
  impl_pointers:
  - build/distill/03_judge/J8_evolution/judged.md::EVOLUTION.DECOMMISSION.4
  - build/research/12_evolution/result.md::EVOL-C31
- op: node.create
  uid: EVOLUTION.DECOMMISSION.5
  name: Advisory or Compulsory Deprecation
  intent: When the old form is to be removed, the retirement is compulsory with a firm deadline, so the
    deprecation stage ends in a sunset. Advisory deprecation without a deadline is right only when the
    replacement sells itself or the old form is cheap to carry and no removal is intended. So a retirement
    that is meant to happen does happen, at a known load on consumers.
  parent: EVOLUTION.DECOMMISSION
  epistemic_state: known
  constraints:
  - 'A compulsory retirement has a firm deadline (owner and capacity: DECOMMISSION.1)'
  design_notes: 'Positions: P1 advisory, no deadline (autonomy, no central load, but the form stays; best
    when the replacement is transformatively better). P2 compulsory, firm deadline plus a staffed migration
    team (L1033; REG-1002). Grounds: advisory deprecation rarely completes unless the replacement is transformatively
    better; a compulsory one completes and removes the cost, at the risk of an unfunded mandate, which
    the owner and capacity of INCREMENTAL.4 answer. Final pass R18: this node keeps only ''a firm deadline''.
    Rejected: P1 as the default for a removal. Context: none; the condition for advisory is part of the
    decision. Certainty: grounded (one T2 source, consistent with the other incremental rows). See OWNERSHIP.SERVICES.2
    (X7), INCREMENTAL.4, DECOMMISSION.3. MD-01, MD-03.'
  impl_pointers:
  - build/distill/03_judge/J8_evolution/judged.md::EVOLUTION.DECOMMISSION.5
  - build/research/12_evolution/result.md::EVOL-C33
- op: node.create
  uid: EVOLUTION.DECOMMISSION.6
  name: Carrying Out the Retirement
  intent: 'Before switching a system off, who or what still uses it is verified and access is restricted
    reversibly for a period to flush out remaining users, restorable backups and recorded metadata are
    kept per the retention rules, neither shorter nor longer, and only then is it removed. Removal is
    the owner''s primary objective, with measurable intermediate milestones, and everything attached is
    removed: licences, attached storage, DNS entries, domain membership, and entries in configuration,
    monitoring, automation and security tooling, checked against compliance requirements. So nothing used
    is cut off, nothing attached is left behind, and the retirement can be undone until it is final.'
  parent: EVOLUTION.DECOMMISSION
  epistemic_state: known
  constraints:
  - Usage is verified before switch-off
  - A retirement lists and removes its attachments
  - 'Backups kept after retirement follow the retention rules, neither shorter nor longer (owner and capacity:
    DECOMMISSION.1)'
  design_notes: 'Positions: P1 verify use, restrict reversibly, keep backups, then remove (L1034; consensus;
    REG-1018, REG-1026). P2 explicit owner with measurable milestones, such as deleting key sub-components
    (L1035; single source; REG-1002). P3 cover everything attached (L1036; single source; REG-1018). The
    three are steps of one process: check use, finish with an owner, leave nothing attached. Cross-unit
    X8: retention is held in OPERATION.RECOVERY.2 and TRANSVERSE.PRIVACY.2, erased data in a backup in
    TRANSVERSE.PRIVACY.3; this node reads ''per the retention rules, neither shorter nor longer''. Final
    pass R18: owner and capacity principle in DECOMMISSION.1. Rejected: an abrupt switch-off (best never
    for a system with possible users); immediate removal is best only for something provably unused. Context:
    none. Certainty: grounded for P1; P2 and P3 single-source consensus. See OPERATION.RECOVERY.2, TRANSVERSE.PRIVACY.2
    and .3, CHANGE_FLOW.DATA_CHANGE, ASSURANCE.DATA_INTEGRITY. MD-01, MD-03.'
  impl_pointers:
