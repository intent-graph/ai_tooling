operations:
- op: node.set
  uid: ROOT
  epistemic_state: 'inferred: the whole as one claim, no source states the seven-branch guideline; the
    order and split of the branches are the maintainer''s decisions | gap: 40 open items kept at the L2
    and L3 nodes (cadences, numeric thresholds, one-source minority views, and one point still open, the
    single-store rule at EVOLUTION.TECHNOLOGY.4); a contested position settled by a stated condition is
    a decision, not an open item; none contradicts a decision at this height'
  design_notes: 'Decision: A team owns the outcome by deciding, for each capability, whether it writes,
    adopts or rents it, and by pricing the way out before it depends on it (OWNERSHIP). It knows each
    property holds because each property has a named mechanism, at a named stage, that runs on every change,
    has a trustworthy signal and cannot be skipped (ASSURANCE). It constructs code that is correct at
    its boundaries and changes in few places (CONSTRUCTION); changes the system in small, reviewed, reversible
    steps that promote one built artifact (CHANGE_FLOW); operates it against stated objectives, with recovery
    proven before it is needed (OPERATION); and lets it evolve by recorded decisions, incremental change,
    repaid debt, announced retirement and a small set of technologies (EVOLUTION); documentation, security
    practice, configuration and secrets, and development environments carry the same discipline across
    all of these (TRANSVERSE). Outcome, whoever does the work (MD-02): the design was good, the testing
    was good, the review was trustworthy, and what runs is what was reviewed.

    Grounds: Roll-up of the seven L1 records below; the order and the split are the maintainer''s decisions
    (MD-01 to MD-05, `target_hierarchy.md`). The unifying claim, that no single control is relied on and
    a pass is believable, rests on the ASSURANCE grounds (L1538, L1550, L1558, L1562, L1546).

    Positions: The choices made at this height, from the maintainer''s decisions: P1 two decision branches
    first (OWNERSHIP, ASSURANCE), then the realization branches in the order construct, change, operate,
    evolve, then the cross-cutting branch last. P2 one branch per lifecycle stage (code, build, release,
    operate) with each property''s checks inside the stage that runs them. P3 one branch per quality property
    with its practice inside it. P4 a branch for who does the work (human team or AI agent contributors).

    Rejected: P2 as the top split: the guarantee of one property (documentation, security, data, availability)
    would be spread over several stages and have no single home, which breaks one location per fact (MD-03);
    it is best as the realization view, which CHANGE_FLOW and OPERATION already give. P3 as the top split:
    it merges "how we know it holds" with "how we do it" for each property, which MD-03 keeps apart; best
    for a guideline about one property only. P4: who writes the code is not a principle (MD-02); AI contributors
    enter as the outcomes the other branches require when change arrives at volume or from a non-human
    author. EVOLUTION folded into CHANGE_FLOW: ruled out by MD-04; change over time, decisions and retirement
    are a branch of their own. Regulated contexts and software that is not a hosted service: deferred
    (MD-05); best in a guideline written for them.

    Context: None at this level. There is no default team (MD-02); the conditions that move a decision
    (criticality, consumer reach, change volume, team and platform sharing, threat model) are on the L2
    and L3 nodes that carry them.

    Certainty: Grounded for the order and the split (maintainer decisions). Inferred for the whole as
    one claim: no source states the seven-branch guideline, and the unification rests on each branch''s
    own certainty. The 40 open items (see "Still open") are cadences, numeric thresholds, one-source minority
    views and one flag; none contradicts a decision at this height.

    Flags: none at this height; the one flag still open sits on EVOLUTION.TECHNOLOGY.4.

    Links: children OWNERSHIP, ASSURANCE, CONSTRUCTION, CHANGE_FLOW, OPERATION, EVOLUTION, TRANSVERSE.'
- op: node.set
  uid: ASSURANCE
  epistemic_state: 'inferred: roll-up of nine L2 records, no source states the nine-property set as a
    whole; the principle that a pass is believable and no control stands alone is grounded | gap: open
    at eight places (RULES.4 two, BEHAVIOUR.1, BEHAVIOUR.6, SECURITY.3, AVAILABILITY.4, AVAILABILITY.5,
    ARTIFACT.1)'
  design_notes: 'Decision: Every property that must hold has a named mechanism at a named stage that runs
    on every change, and none rests on one control or on the author''s own judgement. A check blocks while
    its measured false-alarm rate is within the budget the team states, and a check that needs judgement
    advises in review under a budget; a pass can be believed, gates cannot be skipped, review is independent
    and binds the exact content, and every change meets one bar with evidence (RULES). Behaviour is pinned
    by self-testing code whose power is measured (BEHAVIOUR); interface compatibility has a definition,
    a contract test and one source of description (CONTRACTS); stored data is protected where every write
    path converges (DATA_INTEGRITY); documentation cannot drift because it travels with the change and
    is gated (DOCS_SYNC); security is verified at a depth set by risk and limits on automation are enforced
    in tooling (SECURITY); speed and capacity are verified against the real workload with a baseline (PERFORMANCE);
    a degraded mode, a bounded call and a proven restore guarantee availability and recovery (AVAILABILITY);
    and what runs is tied to reviewed source by a protected mainline and verified build provenance (ARTIFACT).
    Outcome: the design was good, the testing was good, the review was trustworthy, and what runs is what
    was reviewed (MD-02).

    Grounds: Roll-up of all nine L2 records (RULES, BEHAVIOUR, CONTRACTS from J2; DATA_INTEGRITY, DOCS_SYNC,
    SECURITY from J3; PERFORMANCE, AVAILABILITY, ARTIFACT from J4), 44 L3 records under nine L2 records,
    as cross-unit fix X2 requires. The shared claim "no single control is relied on and a pass is believable"
    rests on L1538, L1550, L1558, L1562, L1546; the untested-is-absent rule on L032, L1097, L451, L120;
    the artifact claim on L1063 (REG-1037, REG-114), L151, L1244.

    Positions: Choices at this height: P1 one placement node per property (decision), with the practice
    in a realization branch (MD-03); P2 one assurance practice per lifecycle stage; P3 a single global
    quality gate. The competing practices per property are at the L3 nodes.

    Rejected: P2 and P3: they leave a property without one owner of its guarantee, so a gap in one stage
    is invisible; P3 also makes the signal a single point of failure; best as the realization view (CHANGE_FLOW)
    and as the floor RULES.5 sets for every change. A property list without the common rules: each property
    would re-decide trust, placement and skippability.

    Context: Criticality, change volume, consumer reach and suite maturity move individual decisions (RULES.2,
    RULES.4, CONTRACTS.1, BEHAVIOUR.1, BEHAVIOUR.6); recorded at the L3 nodes. None at this height.

    Certainty: Inferred as a roll-up: no source states the nine-property set as a whole. Grounded for
    the principle that a pass is believable and no control stands alone; grounded for the nine children''s
    cores, with inferred numeric defaults. Open at eight places (RULES.4 two, BEHAVIOUR.1, BEHAVIOUR.6,
    SECURITY.3, AVAILABILITY.4, AVAILABILITY.5, ARTIFACT.1).

    Flags: The reviewer question at RULES.4 is decided (MD-08). The earlier flag F9 (re-roll after J3
    and J4) is closed by this record.

    Links: children RULES, BEHAVIOUR, CONTRACTS, DATA_INTEGRITY, DOCS_SYNC, SECURITY, PERFORMANCE, AVAILABILITY,
    ARTIFACT; carried out by CONSTRUCTION, CHANGE_FLOW, OPERATION, TRANSVERSE.'
