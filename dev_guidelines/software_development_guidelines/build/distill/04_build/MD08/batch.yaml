  epistemic_state: 'known | gap: inferred, the author-neutral form of depth by evidence of understanding
    and the escalation criterion (maintainer practice agreeing with common practice)'
- op: node.set
  uid: ASSURANCE.RULES.4
  intent: Every change to mainline is checked before integration by a party other than whoever authored,
    pushed or requested it, working from its own context, and the check is recorded on the development
    platform. That party is a person other than the author by default; an automated reviewer working from
    its own context is the independent check only for a tier of low-risk changes the team declares in
    advance. A named person stays accountable for each change, approves it and is able to defend it, and
    an approval binds the exact final content, so a new commit that changes the diff voids earlier approvals.
    Only a tier the team defines in advance, in a team whose mainline is kept releasable by automated
    gates and fast revert, may be checked after merge; per-change approval by an external board is not
    used.
  epistemic_state: 'known: maintainer decision MD-08 | gap: the reason for rejecting review of uncertain
    changes only is inferred; whether a given regulation still requires an external board was not read'
  constraints:
  - The approver MUST differ from the author
  - An automated reviewer MUST NOT be the independent check outside the declared low-risk tier
  - An approval MUST lapse when the diff changes
  - A named person MUST be accountable and MUST approve every change
  design_notes: 'Decision as judged, with the maintainer decision MD-08 (replacing the earlier default,
    R27) merged with the tier sentence (R16): every change gets an independent check before or after merge,
    and that check is a person other than the author by default, an automated reviewer working from its
    own context only for a tier of low-risk changes the team declares in advance; the post-merge tier
    is only a tier defined in advance (changes that follow an established pattern, an unremarkable fix,
    documentation) in a team whose mainline is kept releasable by automated gates and fast revert; separation
    of duties is met by peer review, automated testing and monitoring, with the form of review set by
    the risk of the change.

    MAINTAINER DECISION (MD-08, answered; was F2, R27): the research row says ''independent human check''
    (L136) while MD-02 says who does the work is not a principle. Decided: a person other than the author
    is the independent check by default; an automated reviewer working from its own context is the independent
    check only for a tier of low-risk changes the team declares in advance; a named person stays accountable
    and approves every change. Accepted cost: the team keeps a declared list of low-risk change classes,
    and a team of one cannot meet the rule for its own higher-risk changes.

    Positions: P1 independent check on every change (dissent: Ship, Show, Ask, review only the uncertain);
    P2 no external board; P3 named accountability; P4 approver differs from author; P5 approval binds
    to the final content; P6 a person is the independent check by default, an automated reviewer only
    for a declared low-risk tier.

    Grounds: independent check as a feature of the platform record (L136; REG-083, REG-094, REG-098, REG-115,
    REG-116). Approver differs from the author, and approval binds to content (L1046, L1047; REG-1036,
    REG-114, T1). Accountability attaches to the submitter, not the tool (L1043; REG-1035, REG-1037, REG-1040).
    DORA found no correlation of external review with lower failure rates and a negative effect on delivery
    performance (L143; REG-094). The tier conditions are grounded in REG-098 (one practitioner source,
    fetched in review).

    Rejected, with the condition under which each would be best: an automated reviewer as the independent
    check for every change (independence by context alone): the author and the reviewer may be models
    of the same kind with overlapping blind spots; best never as the general rule under MD-08, admitted
    for the declared low-risk tier. A person only, with no low-risk tier: a team of one could never meet
    the rule; best where no change class can be declared low-risk. review only for uncertain changes (P1
    dissent) leaves the classification to the author at the moment of the change, while a tier defined
    in advance removes that discretion (inferred, X14: CHANGE_FLOW.REVIEW.1 points here for this reason);
    it is best, in a post-merge ''show'' form, for the tier of the Decision (consistent with L143 ''by
    risk''). ''Ship'' with no review at all: best never under this node, since every change gets an independent
    check before or after merge. External approval board: best where a regulation requires one; regulated
    contexts are deferred (MD-05) and whether a given regulation still requires a board was not read (open).

    Context: risk. The default is blocking pre-merge review; the post-merge tier applies only where gates
    and revert are automatic (L136, L143). Links: index to CHANGE_FLOW.REVIEW (how review is carried out);
    realized for the mainline by ASSURANCE.ARTIFACT.2 (L131, L1063); the mechanism terms of a platform
    (L1046, L1047) are stack pointers only. Flags: none on the record beyond the maintainer point.'
- op: node.set
  uid: CHANGE_FLOW.REVIEW.4
  intent: 'Format, lint, tests and build run before the human reviewer so attention goes to design and
    logic. A second automated reviewer may be added as an extra layer and never as the approving party:
    a named person approves every change. It is the independent check only for the tier of low-risk changes
    the team declares in advance (ASSURANCE.RULES.4); every other change is checked by a person other
    than its author.'
  epistemic_state: 'known | gap: no study read on the accuracy of an automated second reviewer; inferred,
    the second automated reviewer as an extra layer (vendor statements only)'
  constraints:
  - Automated checks MUST run before the reviewer is asked
  - An automated reviewer MUST NOT be the approving party
  - An automated reviewer MUST NOT be the independent check outside the declared low-risk tier
  design_notes: 'Decision (judge record, final): Format, lint, tests and build run before human review
    so the reviewer spends attention on design and logic. A second model reviewing in a fresh context
    may be added as an extra layer, never as the approver: a named person approves every change. It is
    the independent check only for the low-risk tier the team declares in advance (RULES.4, MD-08); every
    other change is checked by a person other than its author, and the extra layer substitutes for no
    part of that check. Outcome: the human review is spent where machines cannot judge, and approval stays
    accountable.


    Grounds: Automation first (L141, consensus; REG-083, REG-085); second reviewer as added layer under
    human accountability (L1049 a; REG-1038); human gate for approval for independence of failure modes
    (L1049 b; REG-1036, REG-1040); RULES.4 settled that a machine may assist but is never the accountable
    party.


    Positions considered: P1 automation first. P2 second model as extra layer. P3 human-only gate for
    approval.


    Rejected, each with the condition under which it would be best: A second model as the approving party:
    best never under RULES.4 (accountability attaches to a person or role). P2 as a replacement for part
    of the human review: best for the declared low-risk tier (MD-08), where it can be the independent
    check while a named person still approves; outside that tier the person''s check stays in force and
    P3 alone governs approval.


    Context conditions: Scale (volume beyond human capacity favours the extra layer) and criticality (high
    risk keeps the human gate sole).


    Certainty (judge record): Grounded for P1; inferred for P2 (vendor statements only; no study read
    on AI-reviewer accuracy: open).


    Maintainer decisions: MD-01 (the best practice for the node''s purpose, not the average; every weaker
    position is kept with its winning condition); MD-02 (a second model is an assisting layer, accountability
    is for a responsible party).


    Links and stack pointers (judge record): Related ASSURANCE.RULES.2 and RULES.4, BUILD.1.'
