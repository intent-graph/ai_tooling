- op: node.create
  uid: ASSURANCE.AVAILABILITY.5
  name: Exercising Recovery
  intent: 'Recovery is exercised on a ladder: tabletop and functional exercises, then a dry run in a non-production environment, then production-level drills for complex or critical paths, with unannounced game days added once the procedure has passed announced exercises. Restore or failover time and the achieved recovery point are measured in every exercise against the objectives, and an after-action report updates the plan.'
  parent: ASSURANCE.AVAILABILITY
  epistemic_state: 'known | gap: no source gives a frequency for production drills (regularly and after changes only); the ordering of unannounced game days after announced exercises is inferred'
  constraints:
  - MUST measure restore time and recovery point in every exercise
  - MUST compare with the objectives
  - MUST update the plan from the after-action report
  - MUST exercise again after changes to the system or the plan
  design_notes: |-
    Grounds: L451 (REG-222, REG-228); cadence: REG-1056, REG-1064 fetched in review; L1102 (REG-1056, REG-1058 T1 AWS; REG-1064 T1 Azure; REG-1059 T1 NIST); L1103 (REG-1059, REG-1064); L1104 (REG-250, REG-1053, REG-1064). The two vendor positions agree that a production-level drill is needed for critical paths and differ on whether to start in non-production; the ladder follows REG-1064 and is compatible with REG-1056 for critical paths.
    Positions: P1 realistic conditions and tests from gaps; P2 production failover regularly (AWS: realism); P3 non-production first (Azure: safety, since production drills can cause severe failures); P4 ladder plus unannounced game days; P5 ladder with after-action report; P6 measured times.
    Rejected: production drills first and without a rehearsal (P2 alone): best for critical, complex paths once the procedure is proven and a staged environment cannot reproduce load or quotas. Non-production only (P3 alone): the objectives cannot be shown in real conditions; best when a failed drill's blast radius is unacceptable and no safe production form exists. Estimated recovery times as the planning basis (P6).
    Context: complexity and criticality of the recovery path, blast radius of a failed drill, novelty of the procedure (L1102): new procedure or high blast radius: climb from the lower rungs first; complex, critical path: include the production-level rung.
    Certainty: grounded for the ladder, the measurement and the after-action report (T1 consensus); inferred for the sequencing of unannounced game days after proven procedures; open: no source gives the drill frequency in production.
    Links in the judge record: Index link OPERATION.RECOVERY and OPERATION.INCIDENTS; related AVAILABILITY.3, AVAILABILITY.4; ASSURANCE.BEHAVIOUR.5 holds the tests for gaps found.
    Maintainer decisions: MD-01 (best practice for the purpose, not the average), MD-02 (outcomes, whoever does the work).
    Final pass: flag-5 and cross-unit X13 applied (game-day ordering inferred with its reason; cadence unsourced; the tests a gap calls for are written under ASSURANCE.BEHAVIOUR.5).
    Judge flags: none open (all settled in review and final pass).
