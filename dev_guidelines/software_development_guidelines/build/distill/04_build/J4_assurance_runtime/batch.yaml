  - build/research/11_performance_readiness/result.md::PERF-C16
  - ../web_architecture_guidelines/build/research/06_operations/result.md::OPS-C19
  - ../web_architecture_guidelines/build/research/06_operations/result.md::OPS-C20
  - ../javascript_guidelines/build/handoff/to_software_guideline/package.md::RUNTIME
  - ../javascript_guidelines/build/handoff/to_software_guideline/package.md::RUNTIME.MEASURE
  - ../javascript_guidelines/build/handoff/to_software_guideline/package.md::RUNTIME.METHOD
- op: node.create
  uid: ASSURANCE.AVAILABILITY.1
  name: Tolerating a Degraded Dependency
  intent: 'Each non-essential dependency has a designed and regularly exercised degraded mode, hard dependencies are made soft where possible and kept few, and overload behaviour is defined: reject early when out of quota or capacity, serve degraded responses before errors, and a client that sees much of its recent traffic rejected for quota limits its own outgoing traffic. One slow or failed non-essential dependency, or a load beyond capacity, then reduces service instead of ending it.'
  parent: ASSURANCE.AVAILABILITY
  epistemic_state: 'known | gap: graceful-degradation detail is inferred'
  constraints:
  - MUST define the degraded mode for each non-essential external dependency
  - MUST exercise it
  - MUST define behaviour at quota or capacity exhaustion
  - MUST have a client that is rejected for quota limit its own outgoing traffic
  design_notes: |-
    Grounds: L032 (REG-007 T1, REG-185 T1, REG-203 T2, REG-209 T2; consensus); L442 (REG-220 T2, REG-225 T2, REG-228 T1; consensus). The row places verification here and design in application architecture; this node holds the verification obligation and the design rule in one line.
    Positions: P1 loose coupling and degraded mode per non-essential dependency; P2 designed and tested overload behaviour, including client-side throttling (REG-220: a client that detects a significant share of recent requests rejected as out of quota self-regulates and caps its outgoing traffic).
    Rejected: none competes; a client that keeps sending at full rate into quota rejection is rejected (it adds load to an overloaded provider; best never); they are two parts of one outcome (dependency failure, overload). Failing hard on a dependency is the best only for an essential dependency (no degraded mode exists), which then needs the bounds of AVAILABILITY.2.
    Context: none. Which dependencies are essential is a per-system fact, not a condition on the rule.
    Certainty: grounded for the degraded mode (REG-007) and overload behaviour; inferred for graceful-degradation detail (as the row says).
    Links in the judge record: Conflicts with none; related AVAILABILITY.2 (retry caps, held there), AVAILABILITY.3 (exercise under real conditions); design held in CONSTRUCTION.
    Maintainer decisions: MD-01 (best practice for the purpose, not the average), MD-02 (outcomes, whoever does the work).
    Retry caps are stated once, in ASSURANCE.AVAILABILITY.2.
    Judge flags: none open (all settled in review and final pass).
  impl_pointers:
  - build/distill/03_judge/J4_assurance_runtime/judged.md::ASSURANCE.AVAILABILITY.1
  - build/research/01_sourcing/result.md::SRC-C32
  - build/research/09_external_services/result.md::EXT-C09
  - build/research/11_performance_readiness/result.md::PERF-C24
- op: node.create
  uid: ASSURANCE.AVAILABILITY.2
  name: Protecting Remote Calls
  intent: Every remote call is bounded by connection and request timeouts sized from the dependency's measured latency percentile and by a deadline propagated across calls; retries are limited to transient failures, capped, made at one layer only, safe for non-read operations only if idempotent, and bounded system-wide by a retry budget. A circuit breaker is added only where a dependency fails slowly or is shared by many callers, so a failing dependency cannot exhaust the caller's resources and retries cannot amplify an outage.
  parent: ASSURANCE.AVAILABILITY
  epistemic_state: 'known | gap: honouring back-pressure signals is inferred in part (the protocol semantics were not read in full); the idempotency-key mechanism is contested and left to the interface'
  constraints:
  - MUST use the provider's tested client where one exists and verify what it retries by default
  - MUST set both timeouts on every remote call
  - MUST NOT retry permanent errors or non-idempotent operations without a key
  - MUST retry at one layer
  - MUST bound system-wide retries
  - MUST log breaker state changes
  design_notes: |-
    Grounds: L332 (REG-194 T1, REG-203, REG-211); L339 (REG-203 T2); L333 (REG-203, REG-205 T2, REG-211 T3; consensus; retries are "selfish": caller success against provider load, so the cap and budget serve the provider as well as the caller); L334 (REG-184 T1, REG-205, REG-206, REG-211); L335 (REG-184, REG-185); L336 (REG-201, REG-211); L337 (REG-203, REG-211, consensus); L338 (REG-185 T1, REG-209 T2, REG-203, REG-211; contested, conditions stated by the row).
    Positions: P1 timeouts and deadline; P2 bounded retry; P3 idempotency; P4 honour throttling signals; P5 provider SDK; P6 retry budget; P7 circuit breaker (protection of own resources, fast failure); P8 retry budget alone (simplicity, cognitive load); P9 neither (queue and dead-letter, or platform).
    Rejected: retrying without limits or on permanent errors (amplifies; no condition). Retrying at several layers (multiplies attempts; best never, one layer owns it). Blind retry against a 429 or 503 (P4). Hand-written socket code (P5), best only when no SDK exists, then the same bounds are implemented by hand and what the SDK would retry is documented. Circuit breaker everywhere (P7) is rejected as a default: it earns its complexity under the stated condition. Retry budget as the only protection (P8) is the best only when the dependency tolerates retries and callers are few; the budget itself is not an alternative to the breaker but the baseline that the breaker adds to. Neither (P9) is the best in message-driven designs with dead-letter queues or a mesh that already breaks circuits.
    Context: dependency failure mode and number of callers (L338): slow-failing, synchronous, many callers: add a breaker with half-open probing, logged state changes and a fallback; event-driven: queue and dead-letter; otherwise the retry budget is the protection.
    Certainty: grounded for timeouts, retry, budget, deadline (T1 and T2 consensus); grounded for the breaker conditions; inferred in part for P4 (HTTP semantics not read in full; the neutral form is "honour back-pressure signals"); the idempotency mechanism is contested (header not standardised, REG-206 an expired draft), so the decision states the principle and leaves the key mechanism to the API.
    Links in the judge record: Related AVAILABILITY.1 (degraded mode); OWNERSHIP.CONTAINMENT (adapter); OPERATION.TELEMETRY (breaker signals); stack pointer L335 (HTTP).
    Maintainer decisions: MD-01 (best practice for the purpose, not the average), MD-02 (outcomes, whoever does the work).
    Final pass: flag-7 applied (breaker trigger is slow failure or many callers; a long timeout is shortened first).
    Judge flags: none open (all settled in review and final pass).
  impl_pointers:
  - build/distill/03_judge/J4_assurance_runtime/judged.md::ASSURANCE.AVAILABILITY.2
  - build/research/09_external_services/result.md::EXT-C01
  - build/research/09_external_services/result.md::EXT-C02
  - build/research/09_external_services/result.md::EXT-C03
  - build/research/09_external_services/result.md::EXT-C04
  - build/research/09_external_services/result.md::EXT-C05
  - build/research/09_external_services/result.md::EXT-C06
  - build/research/09_external_services/result.md::EXT-C07
  - build/research/09_external_services/result.md::EXT-C08
- op: node.create
  uid: ASSURANCE.AVAILABILITY.3
  name: Verifying Resilience Under Real Conditions
  intent: Resilience is verified by automated experiments built on a steady-state hypothesis over measurable outputs, in pre-production by default and on production traffic only when the steady state is measurable, rollback is proven and the blast radius is bounded. Every production test shares the same guardrails, including isolated and removed test data, and a gap an experiment finds is a defect handled like any other.
  parent: ASSURANCE.AVAILABILITY
  epistemic_state: 'known | gap: the preference for production-first experiments rests on one source and is inferred; the ladder (pre-production first, production on conditions) is grounded'
  constraints:
  - MUST state a steady-state hypothesis over measurable outputs or an abort criterion
  - MUST have a proven rollback
  - MUST bound blast radius
  - MUST isolate and mark test data from real data and remove it after the run
  - MUST suppress or undo any other durable effect
  - MUST treat a gap found as a defect handled by BEHAVIOUR.5
  design_notes: |-
    Grounds: L120 (REG-069 T3, one source: states the production preference; no counter-source read); L119 (REG-051 T2, REG-069: valuable and risky; issues found there already affect users, test data can become visible); REG-228 (T1, cited directly: a team does not know how a system reacts until it has failed; a gap found is a defect to fix and test; L451 leaves this node's grounds and stays a row of AVAILABILITY.5). The maturity condition is the row's own ("wins with mature observability and rollback").
    Positions: P1 testing in production, bounded; P2 chaos experiments, ideally in production, continuously (authenticity of confidence); P3 pre-production only (safety; unsourced).
    Rejected: production experiments without measurable steady state, proven rollback or bounded blast radius (a failure there is a user-visible incident, not a finding). Pre-production only (P3) is the best when observability or rollback is immature, or the system is safety-critical or has low recovery capability; it is also the entry step of the ladder for everyone. Ad hoc fault injection without a hypothesis (no measurable result).
    Context: observability and rollback maturity, and safety criticality (L120): mature: production experiments allowed; immature or safety-critical: pre-production only.
    Certainty: grounded for the ladder (pre-production by default, production only on conditions): REG-228 (T1, cited through L451) says to start in non-production and move to production only after non-production insight is exhausted and safeguards limit blast radius and allow quick rollback. Inferred for the production-first preference of L120, which stays one T3 source (REG-069); P3 as a stand-alone position (never production) is unsourced and rejected above with its condition.
    Links in the judge record: Related AVAILABILITY.5 (recovery drills); required by PERFORMANCE.4 (its production load tests apply these guardrails); ASSURANCE.BEHAVIOUR.7 holds the durable-data rule, ASSURANCE.BEHAVIOUR.5 holds gap-to-test (load and locks are transient effects, governed by the guardrails here, not by BEHAVIOUR.7's d1); CHANGE_FLOW.DEPLOY holds canary analysis.
    Maintainer decisions: MD-01 (best practice for the purpose, not the average), MD-02 (outcomes, whoever does the work).
    Final pass: flag-1, flag-2, flag-3 with cross-unit X5 and X13 applied (guardrails every production test shares; a gap found is a defect handled by ASSURANCE.BEHAVIOUR.5).
    Judge flags: none open (all settled in review and final pass).
