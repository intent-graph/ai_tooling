- op: node.create
  uid: ASSURANCE.AVAILABILITY.4
  name: Proving Restore
  intent: A backup counts only if a restore from it was tested end to end, regularly and automatically, by the procedure of a real recovery, against criteria fixed beforehand (data present, uncorrupted, accessible and within the recovery point; restore complete within the recovery time). Backup integrity is verified before restore and restored assets before service is declared restored, so the recovery objectives are shown by test and not assumed.
  parent: ASSURANCE.AVAILABILITY
  epistemic_state: 'known | gap: no source fixes the restore-test cadence beyond regular; it is left to the team''s objectives'
  constraints:
  - MUST test restore by the real-recovery procedure
  - MUST fix criteria beforehand
  - MUST verify integrity before and after
  - MUST NOT route restore through schema-change tooling
  design_notes: |-
    Grounds: L389 (REG-250 T2, REG-251 T1); L1078 (REG-1053 T1, REG-1073 T3 case: backups that did not restore, no ownership); L1097 (REG-1053, REG-1059, REG-1060, REG-1061, REG-1064, REG-1065 T1); L1098 (REG-1053, REG-250); L1099 (REG-1053, REG-1060); L1100 (REG-1056, REG-1058 T1, REG-250). All consensus; the rows are consistent and nested, not competing.
    Positions: P1 backup defined by restore; P2 regular automated end-to-end test; P3 criteria fixed beforehand; P4 verify before declaring restored; P5 exercise every path, few paths.
    Rejected: counting a completed backup job as success (the case REG-1073 shows). Restore tests on an ad hoc basis or from procedures that differ from the real recovery (the test then proves a different system). No position competes; no condition makes them best.
    Context: none.
    Certainty: grounded (T1 consensus, several sources). Open: no source fixes the cadence beyond "regular"; the cadence is left to the team's objectives.
    Links in the judge record: Index link OPERATION.RECOVERY (practice: backup, RPO and RTO, strategy); related AVAILABILITY.5 (exercise), DATA_INTEGRITY (soft deletion and layered protection).
    Maintainer decisions: MD-01 (best practice for the purpose, not the average), MD-02 (outcomes, whoever does the work).
    Judge flags: none open (all settled in review and final pass).
