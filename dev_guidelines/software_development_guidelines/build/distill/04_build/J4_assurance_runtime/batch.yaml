- op: node.create
  uid: ASSURANCE.PERFORMANCE.1
  name: Targets and Budgets
  intent: A performance target is derived from user need and the service objective and stated as a measurable pass or fail threshold on a percentile, never from current performance as a final value, so a test verdict means something to a user. Where a request crosses layers, the budget is split per layer so a failing test names the layer to optimize.
  parent: ASSURANCE.PERFORMANCE
  epistemic_state: known
  constraints:
  - MUST state target as threshold on percentile
  - MUST NOT derive from current performance as a final value
  - MUST name the layer budget when a layered path is tested
  design_notes: |-
    Grounds: L420 (REG-125 T2, REG-226 T1, consensus); L421 (REG-226 T1, single source, practice follows from the layering argument).
    Positions: P1 targets from user need and SLO (outcome relevance); P2 per-layer budgets (diagnosability); P3 enforced artefact-size and timing budgets in the build (cost of regressions caught early, client-delivered software).
    Rejected: targets set from current performance as a final value (L420 states it is wrong: it ratifies whatever exists; best never). P3 is not rejected: it is the same decision where the artefact is delivered to a client, see Context.
    Context: for client-delivered software (web front end pointer, L435; REG-240, T3 single source) add budgets on artefact size and timing metrics enforced in the build, block or optimize the addition when exceeded. Other software: not applicable.
    Certainty: grounded for P1; grounded but single-source for P2 and P3. P3 is a stack pointer for the JavaScript and web guidelines.
    Links in the judge record: Refines OPERATION.RELIABILITY (SLO owner; RELIABILITY.1 holds percentiles, RELIABILITY.2 holds the provisional start); L435 pointer to the web guideline.
    Maintainer decisions: MD-01 (best practice for the purpose, not the average), MD-02 (outcomes, whoever does the work).
    Final pass: cross-unit X11 applied (percentile rule held in OPERATION.RELIABILITY.1; the provisional start from measured history follows OPERATION.RELIABILITY.2).
    Judge flags: none open (all settled in review and final pass).
  impl_pointers:
