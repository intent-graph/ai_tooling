- op: node.create
  uid: ASSURANCE.ARTIFACT.1
  name: Build Provenance and Match to Source
  intent: Every deployed or distributed artifact is produced by a hosted build platform that emits signed provenance, and that provenance is verified before the artifact is used. The level rises to hardened, isolated builds where insider or credential-compromise risk matters or the software is distributed to others, and to bit-identical reproducible builds with independent rebuild only at the highest assurance; executable objects deployed without a build artifact are compared mechanically with their source, and each release is archived with its provenance.
  parent: ASSURANCE.ARTIFACT
  epistemic_state: 'known | gap: the second-level floor is grounded for one platform and inferred for others; the content of release archiving is inferred'
  constraints:
  - MUST produce provenance from a hosted build platform
  - MUST verify provenance before use
  - MUST declare the level and the gap where below L2
  - MUST detect drift of objects that bypass the build
  design_notes: |-
    Grounds: L151 (REG-023, REG-086 T1; at least L1, L2 for anything distributed, L3 where risk), L1244 (REG-086, REG-1135 T1; at least L2 and verify), L369 (REG-086; L2 and L3 properties), L048 (REG-041, REG-035 T1: reproducible rebuild, adopted at the highest tier only; REG-023: trust signed provenance, most teams); L152 (REG-004 T1, names only: PS.1 to PS.3 protect code, release integrity, archive); L285 (REG-181, maintainer; public practice read as majority, drift detection). Provenance is useless unless verified, which L1244 adds to L151. GitHub documentation (fetched in the final pass): "Artifact attestations by itself provides SLSA v1.0 Build Level 2" (one workflow step, three permissions, one CLI command to verify); this is one platform's fact, inferred for others. The L2 floor is not the most demanding option (L3 and reproducible rebuilds stay conditional); it is the floor because on a hosted platform it costs one step, while L1 provenance can be produced by whoever runs the build. L1 stays best only without a hosted build platform.
    Positions: P1 reproducible builds (security, control; build discipline); P2 trust signed provenance (cost); P3 level by risk from L1; P4 at least L2 and verify; P5 SSDF protection and archive; P6 L2/L3 build service properties; P7 maintainer: drift comparison of deployed objects against source.
    Rejected: reproducible rebuilds as the default (P1): best for high-assurance or widely distributed artifacts, costing build discipline. Provenance without signing, L1 only (P3 floor): best only where no hosted build platform is in use, where it is the achievable floor and the gap is declared. Trusting provenance unverified (nothing is guaranteed until a verifier checks it). SSDF names as a standalone rule (P5): its content is open; only the archive point is kept.
    Context: risk of insider or credential compromise, and breadth of distribution (L151, L048, L369): raises the level from L2 to L3, and from signed provenance to reproducible rebuild. The maintainer's drift check (P7) applies where deployed definitions can change outside the pipeline.
    Certainty: grounded for the L2 floor on one platform (GitHub documentation), inferred in general; grounded for L2, L3 and reproducibility conditions (T1); the L151 and L1244 difference on the floor is resolved by the platform-cost argument above; inferred for archiving (REG-004 names only, open on content); P7 grounded as maintainer practice, inferred as public practice, a PostgreSQL tool is a stack pointer.
    Links in the judge record: Realized by CHANGE_FLOW.BUILD and CHANGE_FLOW.RELEASE; Related OWNERSHIP.SERVICES.6 (CI service as supply chain, kept there), SECURITY.5 (consumed code); stack pointer L285 (PostgreSQL tool).
    Maintainer decisions: MD-01 (best practice for the purpose, not the average), MD-02 (outcomes, whoever does the work).
    Final pass: flag-4 applied (decision unchanged; fetched platform fact replaces an uncited cost claim; grounded for one platform, inferred in general). Maintainer practice (MAINT-C21, drift comparison of deployed database objects) is kept as position P7: grounded as maintainer practice, inferred as public practice (MD-01).
    Judge flags: none open (all settled in review and final pass).
