  - build/research/11_performance_readiness/result.md::PERF-C17
- op: node.create
  uid: ASSURANCE.PERFORMANCE.2
  name: Load Test Design
  intent: A load test exercises the whole workload end to end with a representative request mix and realistic data, in an environment that matches production on the properties that decide the result, driven at a constant arrival rate and run past expected load to the breaking point, so its result predicts real behaviour including how and where the system fails. Test types are chosen by risk and widened as risk and experience grow, and overload is read as goodput, not server throughput.
  parent: ASSURANCE.PERFORMANCE
  epistemic_state: 'known | gap: open-loop generation as a normative rule is inferred (one source, mechanism stated); the choice of environment fidelity is contested between sources and settled by criticality'
  constraints:
  - MUST test end to end
  - MUST use a representative mix and realistic data
  - MUST record the environment fidelity chosen and which third parties were real
  - MUST report tail latency under an open-loop or corrected generator
  - MUST know the breaking point and its early-warning metrics
  design_notes: |-
    Grounds: L423 (REG-228, REG-229, REG-230, T1, consensus); L424 (REG-226, REG-229, REG-230 T1, REG-104 T2); L425 (REG-203, REG-225, REG-229, REG-230, REG-238); L426 (REG-226, REG-238 T1); L422 (REG-226, REG-229, REG-203); L430 (REG-239): a closed-loop generator waits on a stalled response and stops sending, so it records fewer slow samples than real users would; this is a mechanism, not a taste, so it is a validity condition of the measurement; L431 (REG-225 T2).
    Positions: P1 production-identical environment (fidelity); P2 scaled-down (cost); P3 test in production (realism, user impact; judged in PERFORMANCE.4); P4 end to end; P5 representative mix, real vs mocked third parties (realism vs repeatability); P6 to the breaking point; P7 several types by risk; P8 open-loop; P9 goodput.
    Rejected: isolated-component load tests as the only evidence (P4: they miss the interactions that fail first; best as a diagnostic after the end-to-end result localizes a layer). A small safety factor above expected load as the ceiling (P6: it hides the failure mode and the early-warning metrics). Closed-loop generation without correction (P8: understates tail latency; acceptable only when the generator is known not to stall, which is rare). Server-side throughput alone under overload (P9).
    Context: (a) Environment: production-identical when the workload is mission-critical or the result gates capacity spend (cloud elasticity lowers the cost); a scaled-down production-like environment when criticality is low and load behaviour is known to scale predictably; record the choice (L422). (b) Third-party calls: include the real dependency when it is critical and the provider permits load tests; stub or mock it when the provider's policy forbids load or to isolate own code, and say which calls were mocked (L424).
    Certainty: grounded for P4, P5 (mix and data), P6, P7 (T1 consensus); grounded for the fidelity-by-criticality condition (contested between sources, conditions stated by the row); inferred for P8 as a normative rule (one T3 source, but the mechanism is stated); P9 grounded, single T2.
    Links in the judge record: Requires PERFORMANCE.1 (thresholds); see PERFORMANCE.4 (production tests), OPERATION.CAPACITY (consumes the breaking point).
    Maintainer decisions: MD-01 (best practice for the purpose, not the average), MD-02 (outcomes, whoever does the work).
    Judge flags: none open (all settled in review and final pass).
  impl_pointers:
