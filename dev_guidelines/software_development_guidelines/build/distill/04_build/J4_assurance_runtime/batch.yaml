  - build/research/11_performance_readiness/result.md::PERF-C13
- op: node.create
  uid: ASSURANCE.PERFORMANCE.3
  name: When Tests Run and Baselines
  intent: 'Each performance test is placed by its cost and noise: fast, stable checks gate every change, while long, expensive or noisy tests run on a schedule or before anticipated events, and a noisy test does not gate until its variance is below the threshold it enforces. Every run is compared with a recorded baseline of normal performance, so a regression is found within one scheduled interval and, for the cheap tier, on the change that caused it.'
  parent: ASSURANCE.PERFORMANCE
  epistemic_state: known
  constraints:
  - MUST compare each run with a baseline
  - MUST refresh the baseline after architectural or scaling change
  - MUST NOT gate a change on a signal whose noise exceeds the threshold it enforces (REG-242)
  - MUST check production configuration, not only code
  design_notes: |-
    Grounds: L427 (REG-226, REG-230 T1, REG-238 T1; REG-242 T3, read: shared CI runners are too noisy to gate on, a 2.66 percent coefficient of variation gives about a 45 percent false-positive chance at a 2 percent threshold, and the source's remedy is lower-variance infrastructure, not scheduling); L428 (REG-226, REG-230); L108 (REG-051, REG-067 T2); L429 (REG-226 T1). The split follows the placement rule of ASSURANCE.RULES.2 (feedback speed against cost), applied per test type; it is the one the row itself states.
    Positions: P1 regression tests plus production configuration checks (drift); P2 gate every change (speed of feedback, attribution); P3 scheduled or event-driven (cost, low noise); P4 baseline and comparison; P5 hypothesis validation for high-impact changes.
    Rejected: gating every change on the full load suite (P2 as the only placement: a noisy or slow signal on every change trains the team to ignore it; best when the harness is stable, low-variance and fast). Scheduled-only (P3 as the only placement: loses attribution to one change; best when tests are long, expensive or noisy, which is the tier it keeps). Hypothesis validation for every change (P5: cost; kept for high-impact changes only).
    Context: harness variance and test cost move a test between the per-change tier and the scheduled tier (L427); a harness whose variance is below the gating threshold may gate. A change predicted to move performance materially (high impact) is validated as a hypothesis: state the prediction, run the same load test on baseline and variant, compare measured results.
    Certainty: grounded for the baseline (consensus T1), for regression tests and for the hypothesis method (one T1 source); grounded for the noise rule (REG-242 T3, read); the scheduling of expensive tests is justified by cost and duration (REG-226, REG-238), not by noise.
    Links in the judge record: Requires PERFORMANCE.5 (distribution-aware comparison, L1565); Realized by CHANGE_FLOW.BUILD (pipeline stages); L453 synthetic monitoring held in OPERATION.TELEMETRY.
    Maintainer decisions: MD-01 (best practice for the purpose, not the average), MD-02 (outcomes, whoever does the work).
    Judge flags: none open (all settled in review and final pass).
  impl_pointers:
  - build/distill/03_judge/J4_assurance_runtime/judged.md::ASSURANCE.PERFORMANCE.3
  - build/research/03_verification/result.md::VERIFY-C29
  - build/research/11_performance_readiness/result.md::PERF-C09
  - build/research/11_performance_readiness/result.md::PERF-C10
  - build/research/11_performance_readiness/result.md::PERF-C11
- op: node.create
  uid: ASSURANCE.PERFORMANCE.4
  name: Testing in Production for Performance
  intent: Pre-production tests are the base; controlled production tests add what only production has (real data, network, third parties, state such as caches and request affinity), except where a faithful replica is affordable and the system is high impact. Every production test applies the shared production-test guardrails, and a load test adds off-peak timing, a ramp from a small share of traffic and reserved capacity.
  parent: ASSURANCE.PERFORMANCE
  epistemic_state: known
  constraints:
  - MUST apply the production-test guardrails of AVAILABILITY.3
  - MUST, for load, run off-peak, ramp from a small share and reserve capacity
  design_notes: |-
    Grounds: L432 (REG-104 T2, REG-203 T2, REG-226 T1, REG-229 T1); L433 (REG-104 T2, single source, mechanism stated).
    Positions: P1 pre-production only (user safety, reversibility); P2 controlled production tests (realism); P3 canary on organic traffic (state coverage).
    Rejected: production tests without the guardrails (the force is realism, the cost is user impact, so the guardrails of AVAILABILITY.3 are the condition of the practice, never optional). Pre-production only is the best when the system is high-impact and a faithful replica exists and is affordable.
    Context: impact class of the system and affordability of a faithful replica (L432): replica faithful and affordable, high impact: pre-production only; replica unaffordable: controlled production tests.
    Certainty: grounded (the contested split is resolved by the row's own condition); P3 single-source but mechanism stated.
    Links in the judge record: Requires AVAILABILITY.3 (the guardrails every production test shares); held in CHANGE_FLOW.DEPLOY: canary analysis and rollback (L118, moved there); load and locks are transient effects governed by those guardrails, while the durable-data rule (a functional test never runs against production data unless every durable effect is provably undone) is held in ASSURANCE.BEHAVIOUR.7 (L265).
    Maintainer decisions: MD-01 (best practice for the purpose, not the average), MD-02 (outcomes, whoever does the work).
    Final pass: flag-1 and flag-2 with cross-unit X5 applied (guardrails held once in ASSURANCE.AVAILABILITY.3; the durable-data rule held in ASSURANCE.BEHAVIOUR.7; load and locks are transient effects governed by the guardrails).
    Judge flags: none open (all settled in review and final pass).
  impl_pointers:
  - build/distill/03_judge/J4_assurance_runtime/judged.md::ASSURANCE.PERFORMANCE.4
  - build/research/11_performance_readiness/result.md::PERF-C14
  - build/research/11_performance_readiness/result.md::PERF-C15
- op: node.create
  uid: ASSURANCE.PERFORMANCE.5
  name: Measurement Before Optimization
  intent: Optimization targets only what measurement on the real workload has shown to be critical, prioritized with field data and tested with lab data before release. A measurement counts as evidence only when reported as a distribution across several runs, and a performance belief becomes a rule only after such a measurement.
  parent: ASSURANCE.PERFORMANCE
  epistemic_state: 'known | gap: transfer of the two measurement methods from the runtimes they were studied on to other runtimes is inferred; warm-up separation is a scope that applies only where warm-up exists (inferred)'
  constraints:
  - MUST measure before optimizing
  - MUST report a distribution, not one number
  - MUST prioritize by field data where it exists
  design_notes: |-
    Grounds: L1563 (origin node intent, no claim of its own; rolled up by L1564 and L1565); L434 and L1178 (REG-241 T3 secondary, REG-138 T3, REG-1105 T1; REG-224 T2, REG-226 T1 for the design-time estimate); L1179 (REG-1105 T1); L1564 (REG-1571 to REG-1577, one T2 body; rule inferred, as its origin says); L1565 (REG-1578, REG-1579 T2, Java and C; transfer inferred); L177 (distributions). Origin: judged in the JavaScript guideline, re-examined here; its position is kept in substance because two independent measurement studies show setup bias can flip conclusions, and dropped as to the JavaScript-specific parts.
    Positions: P1 measure first, optimize the critical few (delivery speed, cost); P2 estimate from design onward (avoided rework); P3 field data to prioritize, lab data to test; P4 belief becomes rule only by measurement (conflict: restructuring on mechanism alone); P5 distribution-aware measurement.
    Rejected: optimizing from belief or from the description of a mechanism (P4 conflict: the origin gives no condition under which it is best, and its own source says the studied differences are usually too small to measure; it is the best only when the claimed mechanism is itself confirmed by a measurement on this workload, which makes it P4). Measurement-only with no design-time estimation (P1 alone): best when architecture is cheap to change or load is low.
    Context: design-time estimation is added when architecture is hard to change and load is high (L434). Warm-up separation applies where the runtime or system has warm-up (compiled-on-demand code, caches, pools); elsewhere report the distribution only.
    Certainty: grounded for P1 and P3; grounded for the two measurement methods (two T2 sources) with transfer to other runtimes inferred. The rule that a belief about implementation internals becomes a rule only after measurement is an instance of measure before optimising (P1, grounded); the T2 body (REG-1571 to REG-1577) shows the case for internals advice. Warm-up separation is a scope (it applies where warm-up exists), inferred.
    Links in the judge record: Requires (within node) L1565 by L1564; Required by PERFORMANCE.3 (baseline comparison); Related: OPERATION.TELEMETRY (L1177 which signals exist).
    Maintainer decisions: MD-01 (best practice for the purpose, not the average), MD-02 (outcomes, whoever does the work).
    Final pass: flag-6 applied (decision unchanged; the belief-becomes-rule point is an instance of measure before optimising; warm-up separation a scope). Origin: judged in the JavaScript guideline, re-examined here (MD-01).
    Judge flags: none open (all settled in review and final pass).
  impl_pointers:
