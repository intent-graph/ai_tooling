- op: node.create
  uid: ASSURANCE.ARTIFACT.2
  name: Protected Mainline Binds Every Actor
  intent: The mainline is protected mechanically by required review and required status checks before merge, no force push and restricted push rights, and these rules bind every actor, including bots and administrators. Automation pushes only to a restricted, non-protected target and cannot bypass the rules through the access it holds, so what is merged was reviewed and checked, whoever pushed it.
  parent: ASSURANCE.ARTIFACT
  epistemic_state: known
  constraints:
  - MUST enforce review and checks by the platform, not by convention
  - MUST apply them to bots and administrators
  - MUST restrict automation to a non-protected target
  design_notes: |-
    Grounds: L131 (REG-091 T1, REG-094 T2, REG-114 T1; consensus); L1063 (REG-1037, REG-114; consensus); L1070 (REG-1036, REG-1037 T1 vendor documentation; majority).
    Positions: P1 protect the mainline; P2 rules bind every actor; P3 automation writes only to a restricted target.
    Rejected: advisory review or checks that an administrator or bot can bypass (they guarantee nothing about what ran); best never for the guarantee "what runs is what was reviewed". No competing position; the three rows are layers of one mechanism.
    Context: signed commits where provenance of authorship is required (L131). Whether a mechanism enforces the rules is platform-specific (GitHub terms in the sources; neutral in principle).
    Certainty: grounded (T1 documentation, consensus; L1070 majority, from vendor documentation of two products).
    Links in the judge record: Index to CHANGE_FLOW.INTEGRATION (carries it out); related RULES.3 and RULES.4, SECURITY.6 (limits on automation and access, J3); stack pointers L131, L1063, L1070 (GitHub terms).
    Maintainer decisions: MD-01 (best practice for the purpose, not the average), MD-02 (outcomes, whoever does the work).
    Judge flags: none open (all settled in review and final pass).
