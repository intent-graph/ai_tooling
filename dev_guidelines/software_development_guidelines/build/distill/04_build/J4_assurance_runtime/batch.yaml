# Batch for unit J4_assurance_runtime: 15 node.create (breadth-first) then 8 intra-unit link.create.
operations:
- op: node.create
  uid: ASSURANCE.PERFORMANCE
  name: Performance
  intent: Speed and capacity hold under the real workload because targets derive from user need, load tests resemble real use and run at the stage that fits their cost, every run is compared with a baseline, production supplies what replicas cannot, and no speed claim stands without measurement. A regression is caught on the change that caused it.
  parent: ASSURANCE
  epistemic_state: 'inferred: roll-up of the five child decisions, each with its own certainty; the weakest children are .3 (cost and noise argument) and .5 (method transfer)'
  design_notes: |-
    Grounds: rolled up from PERFORMANCE.1 to .5; the claim is inferred from the five child decisions, each with its own certainty.
    Positions: see children.
    Rejected: see children.
    Context: see children (criticality, harness stability, replica affordability, client-delivered software).
    Certainty: inferred (roll-up); the weakest children are .3 (cost and noise argument) and .5 (method transfer).
    Maintainer decisions: MD-01 (best practice for the point's purpose, not the average), MD-02 (outcomes, whoever does the work).
    Judge flags: none open (all settled in review and final pass).
  impl_pointers:
  - build/distill/03_judge/J4_assurance_runtime/judged.md::ASSURANCE.PERFORMANCE
- op: node.create
  uid: ASSURANCE.AVAILABILITY
  name: Availability and Recovery
  intent: The system keeps serving when a dependency fails because each dependency has a designed degraded mode and a bounded call, and recovery is guaranteed by restores proven against criteria fixed beforehand and by exercised procedures with measured times. An untested mode, backup or plan is treated as absent.
  parent: ASSURANCE
  epistemic_state: 'inferred: roll-up of the five child decisions; .4 is grounded, .3 is the weakest'
  design_notes: |-
    Grounds: rolled up from AVAILABILITY.1 to .5; the shared claim (verified, not assumed) is stated by L032, L1097, L451, L120.
    Positions and Rejected: see children.
    Context: see children.
    Certainty: inferred (roll-up); .4 grounded, .3 weakest.
    Links in the judge record: Index link OPERATION.RECOVERY holds the practice (backup, objectives, strategy, failover); this node holds the proof (MD-03). OPERATION.RELIABILITY and OPERATION.READINESS realize.
    Maintainer decisions: MD-01, MD-02, MD-03 (this node holds the proof; the practice of backup, objectives, strategy and failover is held in OPERATION.RECOVERY and pointed to, not repeated).
    Judge flags: none open (all settled in review and final pass).
  impl_pointers:
  - build/distill/03_judge/J4_assurance_runtime/judged.md::ASSURANCE.AVAILABILITY
