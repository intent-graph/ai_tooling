operations:
- op: node.set
  uid: ROOT
  intent: a team delivers, and keeps delivering, a system that does what is intended, at a cost it can
    sustain.
  epistemic_state: 'inferred: the whole as one claim, no source states the seven-branch guideline; order
    and split grounded in maintainer decisions MD-01 to MD-05 | gap: 41 open items (cadences, numeric
    thresholds, one-source minority views, two flags) kept at the L2 and L3 nodes, none contradicts a
    decision at this height'
  constraints:
  - no property that must hold lacks a mechanism, a stage and a recurring trigger
  - no capability enters without a recorded decision
  - no change reaches production except through the reviewed, gated path
  - no guideline decision depends on who wrote the code
  design_notes: |-
    Decision: A team owns the outcome by deciding, for each capability, whether it writes, adopts or rents it, and by pricing the way out before it depends on it (OWNERSHIP). It knows each property holds because each property has a named mechanism, at a named stage, that runs on every change, has a trustworthy signal and cannot be skipped (ASSURANCE). It constructs code that is correct at its boundaries and changes in few places (CONSTRUCTION); changes the system in small, reviewed, reversible steps that promote one built artifact (CHANGE_FLOW); operates it against stated objectives, with recovery proven before it is needed (OPERATION); and lets it evolve by recorded decisions, incremental change, repaid debt, announced retirement and a small set of technologies (EVOLUTION); documentation, security practice, configuration and secrets, and development environments carry the same discipline across all of these (TRANSVERSE). Outcome, whoever does the work (MD-02): the design was good, the testing was good, the review was trustworthy, and what runs is what was reviewed.
    Grounds: Roll-up of the seven L1 records below; the order and the split are the maintainer's decisions (MD-01 to MD-05, `target_hierarchy.md`). The unifying claim, that no single control is relied on and a pass is believable, rests on the ASSURANCE grounds (L1538, L1550, L1558, L1562, L1546).
    Positions: The choices made at this height, from the maintainer's decisions: P1 two decision branches first (OWNERSHIP, ASSURANCE), then the realization branches in the order construct, change, operate, evolve, then the cross-cutting branch last. P2 one branch per lifecycle stage (code, build, release, operate) with each property's checks inside the stage that runs them. P3 one branch per quality property with its practice inside it. P4 a branch for who does the work (human team or AI agent contributors).
    Rejected: P2 as the top split: the guarantee of one property (documentation, security, data, availability) would be spread over several stages and have no single home, which breaks one location per fact (MD-03); it is best as the realization view, which CHANGE_FLOW and OPERATION already give. P3 as the top split: it merges "how we know it holds" with "how we do it" for each property, which MD-03 keeps apart; best for a guideline about one property only. P4: who writes the code is not a principle (MD-02); AI contributors enter as the outcomes the other branches require when change arrives at volume or from a non-human author. EVOLUTION folded into CHANGE_FLOW: ruled out by MD-04; change over time, decisions and retirement are a branch of their own. Regulated contexts and software that is not a hosted service: deferred (MD-05); best in a guideline written for them.
    Context: None at this level. There is no default team (MD-02); the conditions that move a decision (criticality, consumer reach, change volume, team and platform sharing, threat model) are on the L2 and L3 nodes that carry them.
    Certainty: Grounded for the order and the split (maintainer decisions). Inferred for the whole as one claim: no source states the seven-branch guideline, and the unification rests on each branch's own certainty. The 41 open items (see "Still open") are cadences, numeric thresholds, one-source minority views and two flags; none contradicts a decision at this height.
    Flags: none at this height; the two flags still open sit on ASSURANCE.RULES.4 and EVOLUTION.TECHNOLOGY.4.
    Links: children OWNERSHIP, ASSURANCE, CONSTRUCTION, CHANGE_FLOW, OPERATION, EVOLUTION, TRANSVERSE.
  impl_pointers:
  - build/distill/03_judge/rollup/judged.md::ROOT
- op: node.create
  parent: ROOT
  uid: OWNERSHIP
  name: Ownership
  intent: for each capability, the team writes it, adopts it (a library or tool it runs) or rents it (an
    external service or API) only when a stated reason outweighs the ongoing cost, and keeps the choice
    reversible in proportion to what it would cost to be wrong.
  epistemic_state: 'inferred: roll-up of six L2 records; lifecycle, licence-reading and rented-service
    mechanics grounded, proportionality scaling inferred | gap: open at CONTAINMENT.4, SERVICES.2, SERVICES.5,
    LICENCE.3'
  constraints:
  - no dependency, layer or service is adopted without a recorded reason
  - no adopted artifact is installed from anything but the lock
  - no rented service is adopted without a tested way out proportional to its criticality
  design_notes: |-
    Decision: Nothing is added by default: every external capability enters through a recorded, per-need decision (STANCE, SELECTION). Once in, it is declared, locked, watched and updated as a managed liability, and licence obligations are known before the code is used (LIFECYCLE, LICENCE). Its effect is bounded and its exit is priced in proportion to what failure would cost, not assumed (CONTAINMENT); a rented service is chosen on commitments, stability promise, exit and contract terms and vendor posture (SERVICES). Outcome: the team knows what it depends on, why, and what leaving would cost.
    Grounds: Roll-up of the six L2 records (29 L3 records): the cost-of-ownership default, the lifecycle and licence mechanics and the rented-service checks are consensus rows; the proportionality scaling (criticality, switching likelihood) is inferred.
    Positions: Choices at this height: the six sub-questions are ordered by the life of a dependency (need, choice, upkeep, bounding and exit, rented services, licence); P1 the default is not to add; P2 add where it saves time (speed-first). The competing practices per question are at the L3 nodes.
    Rejected: P2 as a default: it counts the benefit and omits the lasting cost; best where the capability is neither core nor critical and the exit is cheap, which STANCE.2 already treats as the lowest-ownership case of the cost test. Splitting services and licences into other branches: a rented service is one of the three ways to hold a capability, so it stays with the other two.
    Context: Criticality and replaceability of the component set vetting depth, exit capability and vendor assessment; recorded at the L2 and L3 nodes.
    Certainty: Inferred as a roll-up. Grounded for the lifecycle, licence-reading and rented-service mechanics; inferred for the scaling; open at four nodes (CONTAINMENT.4, SERVICES.2, SERVICES.5, LICENCE.3).
    Flags: none.
    Links: children STANCE, SELECTION, LIFECYCLE, CONTAINMENT, SERVICES, LICENCE; carried out by EVOLUTION (decommissioning, technology count), CHANGE_FLOW, TRANSVERSE.CONFIG.
  impl_pointers:
  - build/distill/03_judge/rollup/judged.md::OWNERSHIP
- op: node.create
  parent: ROOT
  uid: ASSURANCE
  name: Assurance
  intent: for each property that must hold, which mechanism, at which stage, guarantees it, running on
    every change so that it stays true; one placement node per property, plus the rules common to every
    property.
  epistemic_state: 'inferred: roll-up of nine L2 records, no source states the nine-property set as a
    whole; the principle that a pass is believable and no control stands alone is grounded | gap: open
    at eight places (RULES.4 two, BEHAVIOUR.1, BEHAVIOUR.6, SECURITY.3, AVAILABILITY.4, AVAILABILITY.5,
    ARTIFACT.1) | unvalidated: awaiting maintainer, can an automated reviewer in its own context be the
    independent check (RULES.4, default applied: different-kind reviewer for high-risk changes)'
  constraints:
  - MUST every property have a mechanism, a stage and a recurring trigger
  - MUST every check have a measured false-alarm budget
  - MUST no gate be skippable
  - MUST every approval bind the exact content that ships
  design_notes: |-
    Decision: Every property that must hold has a named mechanism at a named stage that runs on every change, and none rests on one control or on the author's own judgement. A check blocks while its measured false-alarm rate is within the budget the team states, and a check that needs judgement advises in review under a budget; a pass can be believed, gates cannot be skipped, review is independent and binds the exact content, and every change meets one bar with evidence (RULES). Behaviour is pinned by self-testing code whose power is measured (BEHAVIOUR); interface compatibility has a definition, a contract test and one source of description (CONTRACTS); stored data is protected where every write path converges (DATA_INTEGRITY); documentation cannot drift because it travels with the change and is gated (DOCS_SYNC); security is verified at a depth set by risk and limits on automation are enforced in tooling (SECURITY); speed and capacity are verified against the real workload with a baseline (PERFORMANCE); a degraded mode, a bounded call and a proven restore guarantee availability and recovery (AVAILABILITY); and what runs is tied to reviewed source by a protected mainline and verified build provenance (ARTIFACT). Outcome: the design was good, the testing was good, the review was trustworthy, and what runs is what was reviewed (MD-02).
    Grounds: Roll-up of all nine L2 records (RULES, BEHAVIOUR, CONTRACTS from J2; DATA_INTEGRITY, DOCS_SYNC, SECURITY from J3; PERFORMANCE, AVAILABILITY, ARTIFACT from J4), 44 L3 records under nine L2 records, as cross-unit fix X2 requires. The shared claim "no single control is relied on and a pass is believable" rests on L1538, L1550, L1558, L1562, L1546; the untested-is-absent rule on L032, L1097, L451, L120; the artifact claim on L1063 (REG-1037, REG-114), L151, L1244.
    Positions: Choices at this height: P1 one placement node per property (decision), with the practice in a realization branch (MD-03); P2 one assurance practice per lifecycle stage; P3 a single global quality gate. The competing practices per property are at the L3 nodes.
    Rejected: P2 and P3: they leave a property without one owner of its guarantee, so a gap in one stage is invisible; P3 also makes the signal a single point of failure; best as the realization view (CHANGE_FLOW) and as the floor RULES.5 sets for every change. A property list without the common rules: each property would re-decide trust, placement and skippability.
    Context: Criticality, change volume, consumer reach and suite maturity move individual decisions (RULES.2, RULES.4, CONTRACTS.1, BEHAVIOUR.1, BEHAVIOUR.6); recorded at the L3 nodes. None at this height.
    Certainty: Inferred as a roll-up: no source states the nine-property set as a whole. Grounded for the principle that a pass is believable and no control stands alone; grounded for the nine children's cores, with inferred numeric defaults. Open at eight places (RULES.4 two, BEHAVIOUR.1, BEHAVIOUR.6, SECURITY.3, AVAILABILITY.4, AVAILABILITY.5, ARTIFACT.1).
    Flags: The maintainer point on RULES.4 (can an automated reviewer be the independent check; default applied) is open; see "Still open". The earlier flag F9 (re-roll after J3 and J4) is closed by this record.
    Links: children RULES, BEHAVIOUR, CONTRACTS, DATA_INTEGRITY, DOCS_SYNC, SECURITY, PERFORMANCE, AVAILABILITY, ARTIFACT; carried out by CONSTRUCTION, CHANGE_FLOW, OPERATION, TRANSVERSE.
  impl_pointers:
  - build/distill/03_judge/rollup/judged.md::ASSURANCE
- op: node.create
  parent: ROOT
  uid: CONSTRUCTION
  name: Construction
  intent: how code is structured, in its language-neutral form, so that it is correct and stays changeable;
    it carries out what OWNERSHIP and ASSURANCE decide and re-decides none of it.
  epistemic_state: 'inferred: roll-up of ten L2 records, sources largely practitioner essays and maintainer
    practice; parse-at-the-edge and data-not-code cores grounded | gap: open at BOUNDARY.3, STATE.4, DEPENDENCY_DIRECTION.2,
    DATA_NOT_CODE.3'
  constraints:
  - no untrusted data reaches an interpreter as code, command, query, path or object
  - no module cycle
  - no effect at module load
  - a credential or token is accepted only if every step its specification requires passes
  design_notes: |-
    Decision: Design is derived from usage down to code in the order of the cost of reversing each decision, and effort goes where error is costly (DESIGN). The system starts as the simplest shape that serves and is cut by the decision each module hides and by business concept (SYSTEM_SHAPE, HIDING). What crosses a trust boundary is parsed once into a precise form under a positive definition of valid, and never reaches an interpreter as code (BOUNDARY, DATA_NOT_CODE). Each fact has one place, dependencies flow one way and are checked, names carry concepts (STATE, DEPENDENCY_DIRECTION, NAMING); logic is placed by the property it must have (PARADIGM); and a process can be stopped and replaced at any time (PROCESS). Outcome: the code is correct at its boundaries and a change touches few places.
    Grounds: Roll-up of the ten L2 records (37 L3 records, 87 rows). Grounded core: parse at the edge (consensus, two T1 sources), data kept from becoming code (T1 consensus); the rest is practitioner essay and maintainer practice.
    Positions: Choices at this height: P1 language-neutral principles with the scope condition stated where the evidence is one language's; P2 per-language rules. The competing practices per question are at the L3 nodes.
    Rejected: P2: MD-05 admits code design only where it holds for every language; best in a per-language guideline. Restating decisions of ASSURANCE.CONTRACTS or DATA_INTEGRITY here: BOUNDARY holds the form a boundary takes, CONTRACTS holds how compatibility is verified (MD-03).
    Context: Team count and release independence move SYSTEM_SHAPE; consumer reach moves BOUNDARY; hosted-service scope bounds PROCESS (MD-05).
    Certainty: Inferred as a roll-up: the sources are largely practitioner essays and maintainer practice, with no controlled evidence for the structure rules. Grounded for the parse-at-the-edge and data-not-code cores. Open at four nodes (BOUNDARY.3, STATE.4, DEPENDENCY_DIRECTION.2, DATA_NOT_CODE.3).
    Flags: none.
    Links: children DESIGN, SYSTEM_SHAPE, HIDING, BOUNDARY, STATE, DEPENDENCY_DIRECTION, NAMING, PARADIGM, DATA_NOT_CODE, PROCESS; realizes ASSURANCE.CONTRACTS, ASSURANCE.DATA_INTEGRITY, ASSURANCE.RULES; related ASSURANCE.SECURITY, TRANSVERSE.SECURITY, TRANSVERSE.CONFIG, EVOLUTION.INCREMENTAL.
  impl_pointers:
  - build/distill/03_judge/rollup/judged.md::CONSTRUCTION
- op: node.create
  parent: ROOT
  uid: CHANGE_FLOW
  name: Change Flow
  intent: 'how a change travels from a developer to production and back out again: version control and
    integration, review, build, release, deploy, rollback, data and schema change, and the measurement
    of delivery.'
  epistemic_state: 'inferred: roll-up of eight L2 records; build-once, small batches and review principles
    grounded, numeric defaults and much of DATA_CHANGE inferred (single-source practice) | gap: open at
    INTEGRATION.1, INTEGRATION.4, REVIEW.4, RELEASE.2, DEPLOY.4, MEASURE.1'
  constraints:
  - no change reaches production except from reviewed mainline through the one pipeline
  - the deployed artifact is the one that was built
  - every change has a named way back before it ships
  - no schema or data change is applied as hand-typed SQL
  design_notes: |-
    Decision: Everything needed to build, deploy and restore lives in version control, and work is integrated into one mainline in small, frequent, attributable changes (INTEGRATION). Review is independent, accountable and bound to the exact content, its depth following risk (REVIEW). One scripted, hermetic build produces one artifact that is promoted unchanged (BUILD); releases are small, identified by what the identifier promises and separable from deployment where needed (RELEASE); deployment is automated by the same process in every environment, exposes a release progressively and replaces instances rather than modifying them (DEPLOY). The way back is decided before the change ships (ROLLBACK); every schema and data change is a reviewed, versioned, once-only script, ordered compatibly with the code, rehearsed and watched (DATA_CHANGE); and delivery is judged by outcomes, never by volume of code (MEASURE). Outcome: what ships was reviewed, built once and is reversible, and going back is a rehearsed move.
    Grounds: Roll-up of the eight L2 records (34 L3 records) written here (no L1 record existed in J6); the branch carries out ASSURANCE.RULES, ARTIFACT, DATA_INTEGRITY and AVAILABILITY and re-decides none of them. Build, release and review rest on consensus rows; DATA_CHANGE (48 rows) rests mostly on one maintainer practice that public practice is read as agreeing with.
    Positions: Choices at this height: P1 one mainline with one promoted artifact and one pipeline; P2 long-lived branches or per-environment builds. The competing practices per question are at the L3 nodes.
    Rejected: P2: it delays integration and tests something other than what ships; best where releases are cut from supported maintenance lines, which INTEGRATION.3 holds as the release-branch condition.
    Context: Release model moves INTEGRATION.3 and RELEASE; scale and downtime tolerance move DATA_CHANGE; criticality and test maturity move RELEASE.4; recorded at the L3 nodes.
    Certainty: Inferred as a roll-up. Grounded for build-once, small batches and the review principles; inferred for the numeric defaults and for much of DATA_CHANGE (single-source practice). Open at six nodes (INTEGRATION.1, INTEGRATION.4, REVIEW.4, RELEASE.2, DEPLOY.4, MEASURE.1).
    Flags: none.
    Links: children INTEGRATION, REVIEW, BUILD, RELEASE, DEPLOY, ROLLBACK, DATA_CHANGE, MEASURE; realizes ASSURANCE.RULES, ASSURANCE.ARTIFACT, ASSURANCE.DATA_INTEGRITY, ASSURANCE.AVAILABILITY; related OPERATION.FEEDBACK, CONSTRUCTION.PROCESS.
  impl_pointers:
  - build/distill/03_judge/rollup/judged.md::CHANGE_FLOW
- op: node.create
  parent: ROOT
  uid: OPERATION
  name: Operation
  intent: how the running system is kept within its reliability targets and recovered when it fails.
  epistemic_state: 'inferred: roll-up of nine L2 records; objective, symptom-paging, incident-process
    and recovery-ladder cores grounded, small-team treatments of large-operator figures inferred | gap:
    open at RELIABILITY.3, ALERTING.2, TELEMETRY.6, INCIDENTS.1, CAPACITY.2, READINESS.3, RUNBOOKS.2,
    RECOVERY.5, FEEDBACK'
  constraints:
  - no page without a human action needed now
  - no workload launched without a readiness review
  - no backup, plan or restore treated as present until tested (ASSURANCE.AVAILABILITY)
  - no target set on the delivery measures of FEEDBACK
  design_notes: |-
    Decision: The running system is held to a stated reliability objective below 100 percent, measured as users experience it, with the gap governed by an agreed rule (RELIABILITY). A human is paged only for what needs a human now (ALERTING); the system is observable well enough to answer questions nobody planned, at a cost the team can afford (TELEMETRY); incidents are declared on written conditions, run by named roles and learned from (INCIDENTS). Capacity is planned against a measured breaking point (CAPACITY); a workload launches only after a readiness review (READINESS) with procedures that were run before they were needed (RUNBOOKS); recovery is designed backward from stated objectives (RECOVERY); and delivery feedback from production is tracked per service and never made a target (FEEDBACK). Outcome: the system stays within its objectives at a cost and load the team can sustain, and when it fails it is restored within them.
    Grounds: Roll-up of the nine L2 records (31 L3 records, 109 rows); the branch carries out ASSURANCE.AVAILABILITY and PERFORMANCE: AVAILABILITY holds the proof, OPERATION holds the practice (MD-03). Reliability, alerting, incident and recovery mechanics rest on consensus and a few authoritative practitioner sources (SRE literature, cloud-provider guidance, DORA).
    Positions: Choices at this height: P1 reliability stated as an objective users would recognise, traded by rule; P2 maximise availability without a stated target. The competing practices per question are at the L3 nodes.
    Rejected: P2: it has no stopping rule, so cost and speed are traded by argument; best never for a service with any cost of change.
    Context: Objective consequence, team size, load shape, threat model and criticality, at the L3 nodes.
    Certainty: Inferred as a roll-up. Grounded for the objective, symptom-paging, incident-process and recovery-ladder cores; inferred for small-team treatments of large-operator figures; open at nine nodes (RELIABILITY.3, ALERTING.2, TELEMETRY.6, INCIDENTS.1, CAPACITY.2, READINESS.3, RUNBOOKS.2, RECOVERY.5, FEEDBACK).
    Flags: none.
    Links: children RELIABILITY, ALERTING, TELEMETRY, INCIDENTS, CAPACITY, READINESS, RUNBOOKS, RECOVERY, FEEDBACK; realizes ASSURANCE.AVAILABILITY, ASSURANCE.PERFORMANCE; related TRANSVERSE.PRIVACY (backup retention), TRANSVERSE.SECURITY_MONITORING.
  impl_pointers:
  - build/distill/03_judge/rollup/judged.md::OPERATION
- op: node.create
  parent: ROOT
  uid: EVOLUTION
  name: Evolution
  intent: how the system and its decisions change over time, so that it keeps working and stays changeable
    at a cost the team can sustain.
  epistemic_state: 'inferred: roll-up of five L2 records; decision records, expand-migrate-contract and
    staged retirement grounded, debt timing and technology firmness inferred | gap: open at INCREMENTAL.3
    | unvalidated: contested single-store row at TECHNOLOGY.4 rests on one-project or commercially interested
    sources, no final-pass resolution addressed it'
  constraints:
  - no significant decision without a record that outlives its author
  - no incompatible change without a removal step and an owner
  - no retirement without verified usage and a stated deadline
  - no technology added without the retirement of what it replaces or a stated reason none exists
  design_notes: |-
    Decision: The reasons for significant decisions are recorded where the code lives and are superseded, never rewritten (DECISIONS). Change is made in steps that keep the system releasable, and every dual-support phase ends with a removal (INCREMENTAL). Debt is a known, inventoried liability repaid where code changes (DEBT); obsolete forms are retired on stated grounds in two announced stages by an owner with a budget (DECOMMISSION); and the set of technologies stays small because each addition is a replacement (TECHNOLOGY). Outcome: the system keeps working while it changes, the reasons for past decisions can be recovered, and nothing old stays by neglect.
    Grounds: Roll-up of the five L2 records (27 L3 records). Grounded: decision records (consensus across architecture-record sources), expand-migrate-contract, two-stage deprecation and the retirement checklist. Inferred: debt-repayment timing, rewrite conditions, technology-firmness conditions (single-source or contested rows).
    Positions: Choices at this height: P1 a top-level branch (MD-04); P2 a section of CHANGE_FLOW; P3 left to each team's judgment.
    Rejected: P2: change over time is longer-lived than a delivery pipeline and concerns decisions, debt and retirement that no pipeline stage owns; MD-04 rules it out. P3: without recorded decisions and an owner, retirement and debt repayment do not happen; best for a throwaway prototype with a known end.
    Context: Expected lifespan and consumer count move INCREMENTAL; shared platform and on-call move TECHNOLOGY.3; consumer reach moves DECOMMISSION.
    Certainty: Inferred as a roll-up. Grounded for the record, expand-migrate-contract and staged-retirement mechanics; inferred for debt timing and technology firmness. Open at two places (TECHNOLOGY.4 flag, INCREMENTAL.3).
    Flags: The contested single-store row at TECHNOLOGY.4 is open; see "Still open".
    Links: children DECISIONS, INCREMENTAL, DEBT, DECOMMISSION, TECHNOLOGY; realizes OWNERSHIP.STANCE, SELECTION, LIFECYCLE, SERVICES, ASSURANCE.BEHAVIOUR, ASSURANCE.CONTRACTS; see CHANGE_FLOW.INTEGRATION, DATA_CHANGE, ROLLBACK, REVIEW, TRANSVERSE.PRIVACY.
  impl_pointers:
  - build/distill/03_judge/rollup/judged.md::EVOLUTION
- op: node.create
  parent: ROOT
  uid: TRANSVERSE
  name: Transverse
  intent: 'the practices that cut across every branch: documentation practice, security practice (including
    monitoring, privacy and retention), configuration and secrets, development environments.'
  epistemic_state: 'inferred: roll-up of six L2 records of grounded components | gap: open at DOCS.4,
    SECURITY.1, SECURITY.2, SECURITY.6, PRIVACY.2, PRIVACY.3, PRIVACY.4, CONFIG.1'
  constraints:
  - no configuration or secret in code or artifact
  - no exposed secret treated as safe
  - no personal data kept without a recorded purpose and period
  - no development environment that can reach production by accident
  design_notes: |-
    Decision: Each cross-cutting concern is an owned, recorded practice whose guarantee is held elsewhere (documentation sync and security verification are in ASSURANCE). Documentation is sized by its readers and organised by their need (DOCS). Security is anchored in a published framework, modelled at design time, owned, and answered by one vulnerability loop (SECURITY); security events are logged, protected, detected on and kept apart from the business audit trail (SECURITY_MONITORING). Personal data is minimised, retained on a recorded schedule and erasable (PRIVACY). Configuration and secrets stay out of code and artifact and reach the process through short-lived, audited custody (CONFIG); development environments are code, separated from production and hardened (ENVIRONMENTS). Outcome: the guarantees ASSURANCE decides have a practice that can be carried out and checked.
    Grounds: Roll-up of the six L2 records (29 L3 records). Grounded in published frameworks and cheat sheets (OWASP, regulator guidance, platform documentation); each branch states only what ASSURANCE.DOCS_SYNC and ASSURANCE.SECURITY do not (MD-03).
    Positions: Choices at this height: P1 one cross-cutting branch after the realization branches; P2 each concern inside the branch it touches (config in CHANGE_FLOW, privacy in OPERATION, and so on).
    Rejected: P2: the same practice would be restated in several branches, or placed in only one of the several that need it; best for a guideline small enough that one team owns every branch. A separate branch for each concern: six branches of two to six nodes each add structure without a distinct outcome.
    Context: Regulated contexts are deferred (MD-05); the EU legal text is restated neutrally; criticality and platform shape move CONFIG.2.
    Certainty: Inferred as a roll-up of grounded components. Open at eight nodes (DOCS.4, SECURITY.1, SECURITY.2, SECURITY.6, PRIVACY.2, PRIVACY.3, PRIVACY.4, CONFIG.1).
    Flags: none.
    Links: children DOCS, SECURITY, SECURITY_MONITORING, PRIVACY, CONFIG, ENVIRONMENTS; realizes ASSURANCE.DOCS_SYNC, ASSURANCE.SECURITY; see OPERATION.TELEMETRY, OPERATION.ALERTING, OPERATION.RECOVERY, CHANGE_FLOW.BUILD, CHANGE_FLOW.DEPLOY.
  impl_pointers:
  - build/distill/03_judge/rollup/judged.md::TRANSVERSE
