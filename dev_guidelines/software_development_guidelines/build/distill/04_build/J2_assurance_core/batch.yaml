operations:
- op: node.create
  uid: ASSURANCE.RULES
  name: Rules Common to Every Property
  intent: A check is worth running only if its failure means a real defect, and it runs as low and as early as it can catch that failure; a rule that matters is enforced by a gate that cannot be skipped. Review of a change is independent, accountable and bound to the exact content, and every change meets one bar and shows its completion by evidence. So a pass can be believed, a finding is acted on, and the review was trustworthy.
  parent: ASSURANCE
  epistemic_state: 'known | gap: every numeric default is inferred (one organisation''s or one source''s figure)'
  design_notes: 'Roll-up of RULES.1 to RULES.5 (31 rows); the node holds no rows, positions or rejected positions of its own (they are on the children). Context: change volume moves RULES.2, risk moves RULES.4. Certainty as a roll-up: grounded for the principles (T1/T2 sources under each child), inferred for every numeric default. Used by BEHAVIOUR, CONTRACTS and every other property node. No flags.'
  impl_pointers:
  - build/distill/03_judge/J2_assurance_core/judged.md::ASSURANCE.RULES
- op: node.create
  uid: ASSURANCE.BEHAVIOUR
  name: Behaviour
  intent: 'The software is self-testing: an automated suite runs on every change and a pass means no substantial defects. Types and static checks form the cheapest blocking layer, the mix of test levels is chosen for confidence per unit of time, tests observe behaviour and are built as production code, and tests are triggered by change events. The suite''s power is measured rather than assumed, no test leaves a durable effect on data, and defect classes that survive review are caught on production-shaped data.'
  parent: ASSURANCE
  epistemic_state: 'known | gap: effect claims of BEHAVIOUR.6, and BEHAVIOUR.7 and .8 are inferred (maintainer-only support)'
  design_notes: 'Roll-up of BEHAVIOUR.1 to BEHAVIOUR.8 (61 rows); no rows or positions of its own. Outcome stated by the judge: the testing was good. Context: criticality and suite maturity (BEHAVIOUR.1, .6), where complexity lives (BEHAVIOUR.3). Certainty as a roll-up: grounded for BEHAVIOUR.1 to .4, inferred for the effect claims of .6 and for .7 and .8. Requires RULES.1 to RULES.3; the property-specific tests are held in ASSURANCE.ARTIFACT, DATA_INTEGRITY, SECURITY and PERFORMANCE (cross links). Flags F3, F4 and F5 were settled in the final pass (R28, R29, R22).'
  impl_pointers:
  - build/distill/03_judge/J2_assurance_core/judged.md::ASSURANCE.BEHAVIOUR
- op: node.create
  uid: ASSURANCE.CONTRACTS
  name: Interfaces and Contracts
  intent: Compatibility has a definition, is verified between independently released components by contract tests rather than shared integrated environments, and each interface has one machine-readable source of description from which documentation, stubs and tests derive, with an automated diff catching breaking changes. So a change to an interface cannot silently break a consumer.
  parent: ASSURANCE
  epistemic_state: 'known | gap: the style choices (which evolution policy, which contract-test style, code-first or design-first) are inferred, each resolved by context'
  design_notes: 'Roll-up of CONTRACTS.1 to CONTRACTS.3 (18 rows); no rows or positions of its own. Context: number and reach of consumers and the independence of release cadences move CONTRACTS.1 and .2. Certainty as a roll-up: grounded for the definition and the contract-test principle, inferred for the style choices. Requires RULES.3 (a blocking diff), carried as the link of CONTRACTS.3. F6 settled at CONTRACTS.1 (R30, X7). CONSTRUCTION.BOUNDARY realizes contracts in code (cross link).'
  impl_pointers:
  - build/distill/03_judge/J2_assurance_core/judged.md::ASSURANCE.CONTRACTS
- op: node.create
  uid: ASSURANCE.RULES.1
  name: Trustworthy Signal
  intent: 'A failing check must mean a real defect, so a pass can be believed and a finding is acted on: non-determinism is prevented at its cause, and a flaky test that already exists is a defect of the pipeline, taken out of the blocking gate into a quarantine with an owner, a numeric cap and a time limit, then fixed or deleted. A check blocks while its measured false-alarm rate is within the budget the team states for it, a lower-confidence check is shown in review as advice also under a budget, and a check over budget in either mode is fixed or removed.'
  parent: ASSURANCE.RULES
  epistemic_state: 'known | gap: every numeric threshold is inferred (one organisation each); transfer of the Java-dominated studies to other languages is inferred'
  constraints:
  - MUST a check, blocking or advisory, have a stated false-alarm budget
  - MUST a check over its budget be fixed or removed
  - MUST a quarantined test have an owner, a cap and an end date
  - MUST NOT a rerun hide a failure
  design_notes: 'Decision as judged (R15, R26 applied): prevent non-determinism at its cause as in the examples; quarantine with owner, cap and time limit; block-or-advise under a team-stated false-alarm budget (X4: this node holds the rule, BEHAVIOUR.2 and SECURITY.2 apply it).

    Positions: P1 quarantine with cap and limit; P2 remove at once; P3 rerun only marked-flaky tests; P4 classify, retry or disable during investigation; P5 prevent the cause; P6 track flake rate, act near 1%; P7 false-positive budget for static checks; P8 hand-written clean-up of shared state (L1560).

    Grounds: a test or finding that fails without a defect teaches people to ignore it (L109 consensus; REG-048, REG-054, REG-056; L147 REG-085). Causes of flakiness are known and preventable: asynchronous waits were 45% (74 of 161) of classified fixes, and 74% (14 of 19) of order-dependent flaky tests were fixed by cleaning shared state (L1559, L1560; REG-1570, T2, mostly Java; L111 REG-051, REG-054); that figure shows the state must be clean, not that hand-written clean-up is the better mechanism. Quarantine with a cap and deadline keeps the gate trustworthy while causes are found (L110; REG-054). A budget for static-check false positives is operated at scale (L086, L1132; REG-052, REG-1086, REG-1092, REG-1099; the secure-development framework REG-004 asks for a human reviewing tool findings).

    Rejected, with the condition under which each would be best: P2 immediate removal is quarantine with a zero time limit; best when the test is of low value or nobody will own the quarantine, then delete. P3 rerun marked tests: a rerun that turns red to green hides the defect; acceptable only as a recorded, capped part of quarantine, or for a failure traced to infrastructure. P4: folded into the decision as quarantine (temporary disable); retry alone is rejected for the reason of P3. P6: kept as an example only; the 1% threshold and the 0.15% figure are one organisation''s figures (L1561, single source REG-048, origin marked risky), not a standard; best as the budget when a team has no better data. P7: adopted as a budget; the 10% figure is one organisation''s policy (L1132), so the value is the team''s to state. P8: a bug in clean-up code shows up as a failure in another test (REG-054); best only where neither a rebuild nor a platform undo is available, and then each test checks its precondition at its start (inferred).

    Maintainer: the rule ''no durable effect anywhere'' is the maintainer''s own (L265), so this is not against the maintainer''s practice; the maintainer''s rollback on shared data is the platform undo, under BEHAVIOUR.7 d1''s own condition. Conflict with BEHAVIOUR.7 (L265 against L111) is resolved here. Context: none. Flags: none (F7 closed by review: numeric defaults stated as one organisation''s; F1 settled R15, R26, X5).'
  examples:
  - 'Prevention of the cause: each test establishes the state it needs instead of relying on another test''s clean-up; where rebuilding per test costs too much, the undo is done by the platform (a rolled-back transaction, a snapshot restore), never by hand-written clean-up code.'
  - 'Further preventions: wait on events or polling rather than bare sleeps, wrap the clock, double remote services, shrink large tests, check a new test repeatedly when it is added.'
  impl_pointers:
  - build/distill/03_judge/J2_assurance_core/judged.md::ASSURANCE.RULES.1
  - build/research/03_verification/result.md::VERIFY-C07
  - build/research/03_verification/result.md::VERIFY-C30
  - build/research/03_verification/result.md::VERIFY-C31
  - build/research/03_verification/result.md::VERIFY-C32
  - build/research/04_delivery/result.md::DELIVER-C24
  - build/research/15_security_depth/result.md::SECD-C14
  - ../javascript_guidelines/build/handoff/to_software_guideline/package.md::VERIFICATION.TEST_STABILITY
  - ../javascript_guidelines/build/handoff/to_software_guideline/package.md::VERIFICATION.TEST_STABILITY.1
  - ../javascript_guidelines/build/handoff/to_software_guideline/package.md::VERIFICATION.TEST_STABILITY.2
  - ../javascript_guidelines/build/handoff/to_software_guideline/package.md::VERIFICATION.TEST_STABILITY.3
- op: node.create
  uid: ASSURANCE.RULES.2
  name: Placement and Feedback Speed
  intent: Each check runs at the lowest level and the earliest stage that can catch the failure it exists for, and a defect that a higher-level test finds and no lower-level test caught produces the lower-level test. Blocking feedback returns in minutes (about ten), the build runs on every commit, a broken build is fixed first, and which analyses and tests run at which stage for which risk is recorded. Different kinds of check are combined and none is relied on alone, so failures are cheap, quickly located, and no single mechanism is the only line of defence.
  parent: ASSURANCE.RULES
  epistemic_state: 'known | gap: combining and layering are inferred (one taxonomy, one dated study); the ten-minute figure is a default, not a measured optimum'
  constraints:
  - MUST the blocking set return in minutes
  - MUST every higher-level miss produce a lower-level test
  - MUST a stage policy be recorded per risk
  design_notes: 'Positions: P1 lowest level possible; P2 minutes of feedback, build on every commit; P3 gate on the fast and reliable, run the slow after merge and roll back (accepts some coverage loss); P4 staged pipeline, slower stages more thorough; P5 recorded policy per stage and risk; P6 combine kinds of check; P7 layer controls; P8 machines find forgotten defects.

    Grounds: lower is cheaper, faster and more precise (L091, L1183 consensus; REG-044, REG-072). Minutes-long feedback and priority repair of a broken build are DORA capabilities and Google''s practice (L112; REG-056, REG-057, REG-085). A recorded per-stage, per-risk policy is a secure-development-framework practice (L121; REG-004). Dynamic checks found on average 49 problems per site that static analysis missed, on over 200 sites (2015, dated; L1550; REG-1561, REG-1564); layering controls follows from a taxonomy of 107 attack vectors against 33 safeguards (L1538; REG-1554, T2, inferred); machines catch what people forget to look for (L1546).

    Rejected: nothing outright. P3 and P4 are two answers to one question (what blocks the merge versus what runs later); the choice depends on context. P7 and P8 restate P6 at the level of principle and are kept as grounds.

    Context: change volume and rollback. With very high change volume, a build cop and automatic rollback, gate on what is fast and reliable and run slower tests after merge with automatic revert on failure (P3, L145); with smaller volume, run later stages before release in a staged pipeline (P4, L145). In both cases what ships has passed the full set. DORA pitfall: blocking tests longer than ten minutes. The ten-minute figure and the 95% presubmit pass are single-source or one organisation''s figures (F7 closed by review).

    Links: requires BEHAVIOUR.1 (L1550 requires L1552); uses RULES.3 for blocking; CHANGE_FLOW.BUILD realizes the pipeline. Flags: none.'
  impl_pointers:
  - build/distill/03_judge/J2_assurance_core/judged.md::ASSURANCE.RULES.2
  - build/research/03_verification/result.md::VERIFY-C12
  - build/research/03_verification/result.md::VERIFY-C42
  - build/research/04_delivery/result.md::DELIVER-C22
  - build/research/03_verification/result.md::VERIFY-C33
  - ../web_architecture_guidelines/build/research/06_operations/result.md::OPS-C25
  - ../javascript_guidelines/build/handoff/to_software_guideline/package.md::DEPENDENCIES.TRUST.3
  - ../javascript_guidelines/build/handoff/to_software_guideline/package.md::VERIFICATION
  - ../javascript_guidelines/build/handoff/to_software_guideline/package.md::VERIFICATION.STATIC_BASELINE.3
- op: node.create
  uid: ASSURANCE.RULES.3
  name: Gates That Cannot Be Skipped
  intent: 'A rule that matters is a blocking automated check, not a convention: module boundaries and fitness properties (performance, security, operability) are checked automatically, the gate always runs, and a skipped, neutral or missing required check counts as a failure, never a pass. Nothing a rule forbids reaches the mainline, whoever authored the change.'
  parent: ASSURANCE.RULES
  epistemic_state: 'known | gap: fitness functions as the mechanism are inferred (REG-1117 plus REG-1119, majority); the skipped-check fact rests on one platform (REG-114)'
  constraints:
  - MUST a required check fail closed (skipped or missing counts as failed)
  - MUST NOT a blocking check be a noisy one (RULES.1)
  design_notes: 'Positions: P1 enforce boundaries by automated checks (L1216); P2 fitness functions (L1234); P3 a gate always runs and a skip is not a pass (L1562).

    Grounds: a check changes behaviour only when failing it stops the merge; some platforms treat a skipped required check as passing (L1562; REG-114, T1, one platform''s fact stated generally, F11 closed by review: other platforms may differ, the principle holds regardless). Boundaries kept by tooling rather than convention (Shopify) and fitness functions that make fit explicit, non-functional properties included (L1216, L1234; REG-1117, REG-1119, REG-1134).

    Rejected: convention or review alone for a mechanizable rule; best only when the rule cannot be expressed as a check (judgement on whether a design is appropriate), and then it belongs to review (RULES.4). Small increments in P2 (L1234) is an evolution practice: its first clause is indexed to EVOLUTION.INCREMENTAL (MD-03).

    Context: none. Required by BEHAVIOUR.1 and BEHAVIOUR.2 (L1547, L1551 require L1562); CHANGE_FLOW.INTEGRATION and ASSURANCE.ARTIFACT.2 realize protection of the mainline. Flags: none.'
  impl_pointers:
  - build/distill/03_judge/J2_assurance_core/judged.md::ASSURANCE.RULES.3
  - ../web_architecture_guidelines/build/research/07_architecture_styles/result.md::ARCH-C11
  - ../web_architecture_guidelines/build/research/07_architecture_styles/result.md::ARCH-C40
  - ../javascript_guidelines/build/handoff/to_software_guideline/package.md::VERIFICATION.ENFORCEMENT
- op: node.create
  uid: ASSURANCE.RULES.4
  name: Independent Review That Binds
  intent: Every change to mainline is checked before integration by a party other than whoever authored, pushed or requested it, working from its own context (a person or an automated reviewer; for a change the team's risk tier marks high, a reviewer of a different kind from the author), and the check is recorded on the development platform. A named person or role stays accountable for each change, approves it and is able to defend it, and an approval binds the exact final content, so a new commit that changes the diff voids earlier approvals. Only a tier the team defines in advance, in a team whose mainline is kept releasable by automated gates and fast revert, may be checked after merge; per-change approval by an external board is not used.
  parent: ASSURANCE.RULES
  epistemic_state: 'known | gap: the reason for rejecting review of uncertain changes only is inferred; whether a given regulation still requires an external board was not read | unvalidated: awaiting maintainer, can an automated reviewer be the independent check'
  constraints:
  - MUST the approver differ from the author
  - MUST an approval lapse when the diff changes
  - MUST a named person or role be accountable
  design_notes: 'Decision as judged, with the maintainer default (R27) merged with the tier sentence (R16): every change gets an independent check before or after merge; the post-merge tier is only a tier defined in advance (changes that follow an established pattern, an unremarkable fix, documentation) in a team whose mainline is kept releasable by automated gates and fast revert; separation of duties is met by peer review, automated testing and monitoring, with the form of review set by the risk of the change.

    MAINTAINER POINT (open, F2, R27): the research row says ''independent human check'' (L136) while MD-02 says who does the work is not a principle. The default applied is that independence is a property of the reviewer''s context, not of its kind, and that a named person stays accountable and approves; no row covers a team of one. The question awaiting the maintainer: can an automated reviewer be the independent check. Until answered the default stands, marked inferred.

    Positions: P1 independent check on every change (dissent: Ship, Show, Ask, review only the uncertain); P2 no external board; P3 named accountability; P4 approver differs from author; P5 approval binds to the final content.

    Grounds: independent check as a feature of the platform record (L136; REG-083, REG-094, REG-098, REG-115, REG-116). Approver differs from the author, and approval binds to content (L1046, L1047; REG-1036, REG-114, T1). Accountability attaches to the submitter, not the tool (L1043; REG-1035, REG-1037, REG-1040). DORA found no correlation of external review with lower failure rates and a negative effect on delivery performance (L143; REG-094). The tier conditions are grounded in REG-098 (one practitioner source, fetched in review).

    Rejected, with the condition under which each would be best: review only for uncertain changes (P1 dissent) leaves the classification to the author at the moment of the change, while a tier defined in advance removes that discretion (inferred, X14: CHANGE_FLOW.REVIEW.1 points here for this reason); it is best, in a post-merge ''show'' form, for the tier of the Decision (consistent with L143 ''by risk''). ''Ship'' with no review at all: best never under this node, since every change gets an independent check before or after merge. External approval board: best where a regulation requires one; regulated contexts are deferred (MD-05) and whether a given regulation still requires a board was not read (open).

    Context: risk. The default is blocking pre-merge review; the post-merge tier applies only where gates and revert are automatic (L136, L143). Links: index to CHANGE_FLOW.REVIEW (how review is carried out); realized for the mainline by ASSURANCE.ARTIFACT.2 (L131, L1063); the mechanism terms of a platform (L1046, L1047) are stack pointers only. Flags: none on the record beyond the maintainer point.'
  impl_pointers:
  - build/distill/03_judge/J2_assurance_core/judged.md::ASSURANCE.RULES.4
  - build/research/04_delivery/result.md::DELIVER-C13
  - build/research/04_delivery/result.md::DELIVER-C20
  - build/research/13_change_authors/result.md::AUTH-C02
  - build/research/13_change_authors/result.md::AUTH-C05
  - build/research/13_change_authors/result.md::AUTH-C06
- op: node.create
  uid: ASSURANCE.RULES.5
  name: One Bar and Evidence for Every Change
  intent: Every change, whatever its author, meets the same bar for design, testing and review; before a change is produced, its intent, scope, interfaces, out-of-scope items and acceptance check are fixed, in proportion to its size. Every change comes with an executable pass-or-fail check independent of the author's judgement that it is done, and completion is shown as evidence (test output, command and result, screenshot), not asserted. Tests and the code under test come from independent contexts where practicable.
  parent: ASSURANCE.RULES
  epistemic_state: 'known | gap: intent-and-acceptance-first and independent contexts are inferred (a vendor guide, one DORA capability); the executable check and the evidence rest on one T1 vendor source, no consensus claim'
  constraints:
  - MUST every change carry an executable check
  - MUST completion be shown by evidence
  - MUST NOT a change be exempt by its author
  design_notes: 'Positions: P1 same bar; P2 intent and acceptance fixed first; P3 executable check; P4 evidence; P5 independent contexts for tests and code.

    Grounds: same bar, no exemption (L1042; REG-1035, REG-1036, REG-1040, T1, consensus). Executable check and evidence over assertion (L1051, L1052; REG-1038, one T1 vendor guide, L1052 recorded single-source; consistent with L123 and L269 on recorded, self-reporting results). Fixing intent and acceptance first (L1045; REG-1038, REG-1041; a vendor guide plus one DORA capability). Independent contexts so one set of assumptions does not validate itself (L1053; REG-1038, inferred, a vendor recommendation with no study of effect).

    Rejected: no competing practice recorded. Exemption for generated or trusted-author change: best never; the bar is a property of the change.

    Context: cost and speed of producing a change; the cheaper and faster the production, the more necessary it is to fix the acceptance check first (L1045). Links: requires RULES.1 and RULES.4; refined by BEHAVIOUR.1; ''evidence'' is realized in CHANGE_FLOW.REVIEW. Maintainer decision cited: MD-02 (the outcomes hold whoever authors the change). Flags: none.'
  impl_pointers:
  - build/distill/03_judge/J2_assurance_core/judged.md::ASSURANCE.RULES.5
  - build/research/13_change_authors/result.md::AUTH-C01
  - build/research/13_change_authors/result.md::AUTH-C04
  - build/research/13_change_authors/result.md::AUTH-C10
  - build/research/13_change_authors/result.md::AUTH-C11
  - build/research/13_change_authors/result.md::AUTH-C12
- op: node.create
  uid: ASSURANCE.BEHAVIOUR.1
  name: What the Suite Must Promise
  intent: 'Code is self-testing: the automated suite can be run at any time, on every change, and a pass means no substantial defects; without that there is no continuous integration. Everything the team does not want to break has a test, in the strict form where criticality is high or consumers are many and as enough tests to change the code confidently, scaled to risk, otherwise. The team keeps a written test policy, the suite has an accountable owner, its results are recorded, and it is judged by what it detects, not what it executes.'
  parent: ASSURANCE.BEHAVIOUR
  epistemic_state: 'known | gap: the strict/weak split is inferred (one formulation per form); whether the maintainer''s practice has an automated trigger is open (inferred absence, not confirmed), decision unchanged'
  constraints:
  - MUST the suite run on every change and be runnable in the language's standard way
  - MUST a written test policy exist (new functionality and every fix come with automated tests); the evidence that it is followed is the tests in each change, visible in its review, with no separate artefact
  - MUST NOT a pass be read as proof of reliability
  design_notes: 'Decision as judged (R17 applied): the strict form means every behaviour, performance, accessibility and security property tested; the policy costs one line and makes the rule reviewable, while a separate evidence artefact would be the most demanding reading, not the best. Results, root causes and triage are recorded in the team''s workflow. Outcome: the testing was good, and change is safe and fast.

    Positions: P1 self-testing code; P2 strict (Google) against weaker (Fowler) coverage of ''everything not to break''; P3 tests first for safe change; P4 written policy, the tests in each change as evidence; P5 developers own acceptance tests, testers explore; P6 maintainer: no stated trigger or regression catch.

    Grounds: L081 consensus (REG-056, REG-057, REG-063); L080 the purpose of tests is safe change and speed, bug-catching secondary (REG-048, REG-063); L083 a pass does not prove reliability, a failure proves its absence (REG-067); strict and weak forms scaled by criticality (L082; REG-048, REG-064); written policy and adequacy by detection (L1551, L1552; REG-1563, T1 criteria); recorded results (L123; REG-004). L122 (who writes acceptance tests) is restated as an outcome per MD-02: someone is accountable for each suite and its upkeep; exploratory and usability testing cannot be automated and complement it.

    Rejected, with the condition under which each would be best: P6, the maintainer''s doctrine states how a test is built and run but not who runs it, when, on what trigger (practice appears to be on-demand runs): it contradicts L081, L106 and L144 and an on-demand suite does not guard change; adequate only for one-off code never changed again. P5 as a rule about who writes tests: outside the principles (MD-02); only the outcome (owner, upkeep, exploratory complement) is kept. The strict form of P2 for every team: best only under high criticality or many consumers (L082), else the weaker form.

    Settled against the maintainer''s practice (R28, F3, unchanged): self-testing code on every change is consensus (L081, L106, L144) whether or not the maintainer''s practice has an automated trigger (L331). R29 (F4): L080 is a consensus row read as ''tests exist before the change is trusted'', consistent with L101.

    Context: criticality and number of consumers. Links: requires RULES.3 and RULES.1 (L1551 requires L1562 and L1558); refines RULES.5; realized in CHANGE_FLOW.BUILD. Flags: none.'
  impl_pointers:
  - build/distill/03_judge/J2_assurance_core/judged.md::ASSURANCE.BEHAVIOUR.1
  - build/research/03_verification/result.md::VERIFY-C01
  - build/research/03_verification/result.md::VERIFY-C02
  - build/research/03_verification/result.md::VERIFY-C03
  - build/research/03_verification/result.md::VERIFY-C04
  - build/research/03_verification/result.md::VERIFY-C43
  - build/research/03_verification/result.md::VERIFY-C44
  - build/research/07_maintainer_doctrine/result.md::MAINT-C67
  - ../javascript_guidelines/build/handoff/to_software_guideline/package.md::VERIFICATION.TEST_SUITE
