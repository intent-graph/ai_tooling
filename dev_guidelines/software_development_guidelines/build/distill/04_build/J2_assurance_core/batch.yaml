- op: node.create
  uid: ASSURANCE.BEHAVIOUR.2
  name: Static Layer
  intent: 'Type checking, linting and analysis form the first and cheapest test layer and run on every change: type checks, compiler warnings and the linter rules the team adopts block, and analyses whose findings need judgement advise in review, each under the false-alarm budget of RULES.1. Builds run with warnings enabled and treated as errors, every linter warning is addressed, and at least one analyser beyond compiler warnings runs before a major release. Analysis is incremental and reports newly introduced issues first, and types are enforced for large long-lived code and introduced gradually on existing code.'
  parent: ASSURANCE.BEHAVIOUR
  epistemic_state: 'known | gap: ''types as the first test layer'' is inferred (the sources are T3 or tool documentation); the trend practice rests on one observational study; rejection of tests-alone rests on absence of a source'
  constraints:
  - MUST type checks, compiler warnings and the adopted linter rules block, and analyses whose findings need judgement advise in review, each under the false-alarm budget of RULES.1
  - MUST a warning be fixed or suppressed with a reason
  design_notes: 'Decision as judged (X4 applied: ''block the merge'' for all static checks is replaced by the stated split; RULES.1 holds the rule, SECURITY.2 applies it to security findings).

    Positions: P1 enforce types; P2 gradual typing; P3 tests alone suffice; P4 warnings as errors plus analysis; P5 incremental analysis in review; P6 gates and trend; P7 every project analyses code statically and acts on it.

    Grounds: types as first test layer (L084, majority; REG-047, REG-065, REG-075); gradual adoption (L085 consensus; REG-065, REG-075); warnings as errors and continuous analysis (L088; REG-004); linter MUST and analyser before release (L1548, L1549; REG-1563 T1 criteria); incremental, new-first analysis (L087; REG-052); trend watching (L1054; REG-1035, REG-1046, one observational study, practice inferred); type checks, warnings and adopted linter rules block (L1547, requires RULES.3), judgement analyses advise under the budget of RULES.1 (X4).

    Rejected: P3 tests alone, no source holds it strongly; best only for small, short-lived code where annotation cost exceeds the defects prevented (not evidenced by a row, stated as the condition). P1 against P2 are not rivals: strict enforcement is the end state for large long-lived code, gradual is the route on existing code.

    Context: existing versus new code; gradual with an escape hatch on existing code (L085), enforced from the start on new, large, long-lived code (L084). Links: requires RULES.3 (L1547 requires L1562); stack pointer L085 (gradual typing in Python, TypeScript, Flow). Certainty detail: REG-047 and REG-065 are T3, REG-075 is tool documentation attesting gradual typing, not the layer claim. Flags: none.'
  examples:
  - 'Gradual introduction on existing code: annotate incrementally, keep an escape hatch, no rewrite.'
  - Analysis reports newly introduced issues first, appears in review, offers automated fixes; the trend of warnings and complexity is watched against volume-driven drift.
  impl_pointers:
