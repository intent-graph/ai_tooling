- op: node.create
  uid: ASSURANCE.BEHAVIOUR.3
  name: Test Level Mix
  intent: 'The mix of small, integrated and end-to-end tests follows from placing each check at the lowest level that catches its failure: where logic lives inside units, many small fast tests and progressively fewer broader ones; where failures arise between services, the weight moves to integration tests; for user-interface code, to static checks plus integration tests. End-to-end tests stay few, on critical journeys, and the proportions are recorded as a team decision with the reason. Confidence is chosen per unit of time and cost; exact ratios matter less than fast, reliable, meaningful-failure tests.'
  parent: ASSURANCE.BEHAVIOUR
  epistemic_state: 'known | gap: which shape fits which context is inferred (each shape held by its own proponents, no comparison study); the mapping from RULES.2 to each shape is inferred'
  constraints:
  - MUST the mix be recorded
  - MUST end-to-end tests be few and for critical journeys unless fast, reliable and cheap
  design_notes: 'Decision as judged (R19 applied: the first sentence is replaced; one repeated sentence about interactions and user-interface code was left as it was, a redundancy only). Larger tests are added where fidelity matters (configuration, load, cross-service behaviour), choosing the system under test by fidelity against flakiness; tests are described on two separate axes, size and scope. Outcome: confidence is chosen per unit of time and cost, with the mix recorded.

    Positions: P1 pyramid; P2 honeycomb; P3 trophy; P4 numbers matter less, record the mix; P5 minimal end-to-end (Fowler counter-note); P6 larger tests where fidelity matters; P7 describe on two axes.

    Grounds: direction and the inverted-cone warning (L089, L1182 consensus; REG-044, REG-045, REG-048, REG-072); the three models agree numbers matter less than speed, reliability and meaningful failures (L090; REG-045, REG-046, REG-047, REG-048); end-to-end tests are slow, flaky and costly to debug (L092, L1188; REG-044, REG-045, REG-048, REG-072); hermetic single process wins on speed and determinism, shared environments on fidelity (L117; REG-051); size and scope are independent axes (L093; REG-048, REG-072). No shape is the default by popularity; each follows from where failures arise.

    Rejected, with the condition under which each would be best: a fixed ratio 70/20/10 or 80/15/5 as a rule is team-specific, Google-like infrastructure (L1554, single source REG-048, REG-049, one organisation''s position). Honeycomb or trophy as the general shape: best where complexity lives in interactions or the code is user-interface. Minimal end-to-end: loses where high-level tests are fast, reliable and cheap to change (L092 counter-note, L1188).

    Context: where complexity lives, logic density, team size, environment speed (L090): logic-dense code, large teams and slow environments favour the pyramid; microservices the honeycomb; user-interface applications the trophy. Links: follows from RULES.2; shared with BEHAVIOUR.4 (L1554 ratio); CONTRACTS.2 for cross-service seams. Flags: none.'
