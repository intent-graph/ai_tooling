- op: node.create
  uid: ASSURANCE.BEHAVIOUR.6
  name: Measuring Adequacy and Probing for Faults
  intent: 'Coverage is used to find code no test executes and is never a quality score, a merge gate or a target; this holds for security-relevant code too, where no numeric coverage floor applies. For security-relevant code the requirement is instead fuzzing of input-handling code, tests derived from threats and past bugs, and review of every unexecuted security-relevant branch that coverage reveals. The suite''s detection power is probed directly: mutation testing where criticality is high and the suite is mature, and property-based testing for code with a describable input range. This node is the one location of the coverage decision.'
  parent: ASSURANCE.BEHAVIOUR
  epistemic_state: 'known | gap: the rule for security-relevant code is inferred (it follows from the study and Google''s report, no source tests a floor on security code); mutation and property-based testing effect is inferred (no effect size) | gap: effect size of mutation testing is open'
  constraints:
  - MUST NOT a coverage number gate a merge, set a quality target or serve as a security floor
  - MUST input-handling code of security relevance be fuzzed
  design_notes: 'Decision as judged (R21, F10, X1: settled unchanged): the L1126 row of SECURITY.3 (a developer security floor with structural tests to at least 80% statement coverage, derived from the secure-development framework) is decided here as P8 and rejected; SECURITY.3 points here and states no coverage figure of its own. The principle that adequacy is judged by detection, not execution, is stated in BEHAVIOUR.1 (MD-03, R08). Outcome: a team knows what its suite detects, not only what it executes.

    Positions: P1 coverage as a diagnostic; P2 coverage floor; P3 OpenSSF suggests covering most or all branches; P4 mutation testing; P5 skip or run offline; P6 property-based testing; P7 fuzzing; P8 (from SECURITY.3, row L1126, SECD-C08; REG-1081, REG-1086, REG-1094) developer security floor with structural tests to at least 80% statement coverage.

    Grounds: correlation of coverage with effectiveness is low to moderate once suite size is controlled (31,000 suites, five large Java systems; L1553; REG-1565, T2; transfer inferred); coverage is easy to inflate (L113; REG-048, REG-059, REG-074); Google reports engineers treat 80% as a ceiling, not a floor (REG-048, fetched in review); mutation score measures what coverage cannot show and is applied incrementally at scale (L114, L1556; REG-058, REG-074, REG-1566, REG-1567); property-based testing exposes edge cases examples miss (L115, L1557; REG-060, REG-1568, REG-1569); fuzzing is required by frameworks for security-relevant code (L116; REG-004, REG-066, T1).

    Rejected, with the condition under which each would be best: a coverage threshold as a gate (P2) and the 80% statement floor (P8) neither measure detection and both reward inflation, the evidence (REG-1565, REG-048) is against them; P2 is best, if at all, for low-trust or fast-growing teams as management visibility (inferred from the wording of REG-048); P8 is best as a conformance minimum when a security baseline or contract mandates the number, stated as conformance and not as a quality claim: NIST IR 8397 (REG-1086), fetched in the final pass, states ''at least 80%'' as a minimum standard, and regulated contexts are deferred (MD-05). The OpenSSF branch-coverage suggestion (P3) is compatible and wins only for a project adopting those criteria. Skipping mutation testing (P5): best where compute or noise dominates, or the suite is immature (mutating a weak suite measures nothing useful).

    Context: criticality and suite maturity (mutation as a routine review signal for high-criticality code and mature suites; offline or skipped otherwise, L114); a mandated baseline (the number is met as conformance, P8). Links: stack pointers L115 (Hypothesis, Python), L116 (OSS-Fuzz languages); dataflow to BEHAVIOUR.1 (adequacy by detection); SECURITY.3 (J3) points here. Flags: none (F10 resolved).'
  examples:
  - 'The rejected figure: a floor of 80% of statements, as a security-testing floor or as a gate.'
  - Mutation testing run diff-based on changed code in review, with mutants filtered; property-based generators following the real data distribution, failures shrunk; fuzzing continuously where possible.
  impl_pointers:
  - build/distill/03_judge/J2_assurance_core/judged.md::ASSURANCE.BEHAVIOUR.6
