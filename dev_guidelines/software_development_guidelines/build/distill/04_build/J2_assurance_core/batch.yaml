- op: node.create
  uid: ASSURANCE.BEHAVIOUR.4
  name: Test Construction
  intent: A test observes behaviour through the public interface, one test per behaviour, and never changes unless requirements change; test code is production code, readable and descriptive over strictly DRY, with no loops or conditionals and one condition per test. Real collaborators are used when fast, deterministic and simple, otherwise a fake owned by the team that owns the real thing, mocks and stubs last; integration tests run against a real backing service of the production kind. The team states what a unit is and where tests start and stop, and records its double style, so tests survive refactoring and fail only for real defects.
  parent: ASSURANCE.BEHAVIOUR
  epistemic_state: 'known | gap: sub-decisions d5, d6 and d8 are inferred (maintainer practice only); the classical-versus-mockist default is inferred (contested); the real-engine rule beyond databases is stated generally from a database case'
  constraints:
  - MUST the double style and the unit definition be recorded
  - MUST a test not change when only structure changes
  - MUST integration tests use the production kind of backing service
  design_notes: 'Decision as judged, with d5, d6, d8 moved here from BEHAVIOUR.7 (R22): sub-decisions of test construction, inferred, maintainer practice only; d5 (L269), d6 (L270), d8 (L272; platform mechanics are a stack pointer). The twelve properties of a good test (L100, REG-068) are kept as the aid for judging trade-offs between tests (no test needs all, some pairs conflict), without conflict with the decision (R07).

    Positions: P1 team-defined unit; P2 observable behaviour; P3 classical; P4 mockist; P5 state over interaction verification; P6 real, then fake, then mock, with an 80/15/5 mix; P7 real backing service; P8 tests are code; P9 twelve properties; P10 self-reported verdict (d5); P11 colocated against mirrored tests (d6); P12 named fixture variables (d8).

    Grounds: behaviour through public interfaces (L095; REG-046, REG-048, REG-049, REG-068); real implementations first, fakes, then mocks, because over-mocking produced tests costly to maintain and rarely finding bugs (L097; REG-049, REG-050); state verification (L096; REG-049, REG-050, REG-062); tests as code and DAMP (L099, L1189; REG-044, REG-049); real backing service of the production kind (L1184; REG-044, REG-1106, REG-1109; mocks or a different engine hide engine behaviour); twelve properties as trade-offs for judging a test (L100; REG-068). d5, d6, d8 rest on maintainer practice (REG-181), public practice read as consensus or majority for d5 and contested for d6 (L270), not fetched; no public source cited, so inferred.

    Rejected, with the condition under which each would be best: mirrored test tree as the general rule (P11), best where the language has a test runner; colocated best where the tooling lacks a test tree. Mockist as the default (P4): contested, Fowler is a convinced classicist but many skilled practitioners prefer it; best when driving design from the outside in and collaborators are costly to build (L098, L096). Interaction verification as the default: best for state-changing calls not otherwise observable. In-memory or different-engine databases in integration tests: best only where the production engine cannot be run locally or in CI. The 80/15/5 mix as a rule: acceptable only with Google-like infrastructure (L1554, single source, one organisation''s position, origin marked risky). P9 is not rejected: it is the judging aid.

    Context: style of design (outside-in design with role interfaces favours the mockist double style; frequent refactoring and small object graphs favour classical, L098); tooling (a test tree or not) moves d6. Links: stack pointers L1184 (origin stack postgres, restated neutral) and L272 (PostgreSQL, d8); BEHAVIOUR.3 holds the mix. Flags: none.'
  examples:
  - Verify state rather than interactions, except for state-changing calls that cannot be observed otherwise; arrange-act-assert.
  - 'Sub-decision d5: a test reports its own verdict in a fixed, searchable shape carrying unit and scenario identity.'
  - 'Sub-decision d6: tests live where they change together with the unit and are discoverable; colocated where the tooling has no test tree, in a separate mirrored tree where the language has a test runner.'
  - 'Sub-decision d8: fixture values reused across a test are named and set once, not hard-coded per statement.'
