- op: node.create
  uid: ASSURANCE.CONTRACTS.1
  name: What Counts as Compatible
  intent: 'A producer declares its public interface precisely and defines compatibility: additive change is compatible, and removal, rename, type change, default change and behavioural change are breaking within a major version; a breaking change is never silent. The evolution policy a provider follows depends on consumer reach and artifact kind: for few, in-house, reachable consumers, additive change and a coordinated deploy without version numbers; for many, external or independently released consumers, explicit versioning with a deprecation window; for an infrastructure-like API with a large consumer base and the funds to carry old behaviour, an indefinitely compatible, date-pinned surface. A consumer can tell what will and will not break.'
  parent: ASSURANCE.CONTRACTS
  epistemic_state: 'known | gap: the consumer-count threshold has no numeric boundary in any row (inferred); the mapping of artifact kind to policy is inferred; the maintainer''s additive-plus-coordination practice is inferred (public practice contested)'
  constraints:
  - MUST the public interface be declared
  - MUST a breaking change be coordinated or deprecated, never silent
  design_notes: 'Decision as judged with X7 applied (X7 supersedes X3): this node holds which evolution policy a provider follows; L353 is a row of this node, and its (a) ''few or controlled'' is read as external consumers that are few or bound by contract, the explicit-major branch. The consumer side (read the promise, prefer stated notice, consume deprecation signals, pin the version; any stated promise is acceptable to depend on) stays on OWNERSHIP.SERVICES.2, which points here for the policies and when each is best. Because users depend on all observable behaviour (Hyrum''s Law), automated tests detect new implicit dependencies but cannot remove them, so API change is planned accordingly.

    Positions: P1 semantic versioning with deprecation; P2 additive is compatible, the rest breaks; P3 Hyrum''s Law; P4 explicit versioning (consumers choose when to move); P5 maintainer: additive, coordinated, no version numbers, dated change log; P6 (L353) the choice by consumer reach and artifact kind.

    Grounds: semantic versioning, precise public API, deprecation window (L060; REG-030); definition of breaking change (L352; REG-204); Hyrum''s Law (L105; REG-071); the maintainer''s additive-plus-coordination practice serves cost of ownership and wins with few reachable consumers (L295; REG-181), while explicit versioning serves consumer independence and exit risk (L295 alternative a); the service and infrastructure-API cases come from L353 (EXT-C24).

    Rejected, with the condition under which each would be best: P5 as the general rule cannot hold when consumers release independently or are external, since a simultaneous deploy is then impossible (conflict with L102, partial tension with L060); it is best, and chosen, for few in-house consumers reachable by review and conversation. P4 for every interface: best for many or external consumers; costly (multiple live versions) where consumers are few. The indefinitely compatible, date-pinned surface for every provider: best only with a large consumer base and the funds to carry old behaviour (L353 b).

    Context: number and reach of consumers and artifact kind (L295, L353). A single-version service deployed as one unit is compatible with the maintainer''s practice (L135, coverage check). Settled against the maintainer''s practice (R30, F6): ''no version numbers'' holds for few, in-house, reachable consumers only. Links: conflicts CONTRACTS.2 (L295 against L102, resolved by the consumer-reach context); OWNERSHIP.SERVICES.2 keeps only the consumer side; EVOLUTION.DECOMMISSION.4 points here for the indefinitely compatible case; CONSTRUCTION.BOUNDARY and OWNERSHIP.CONTAINMENT for the consumer side. Flags: none.'
  examples:
  - 'Few, in-house, reachable consumers: additive and backward-compatible by default, a breaking change coordinated with every consumer and deployed together, no version numbers, a dated change log per unit.'
  - 'Many, external or independently released consumers, installed artifact (library): semantic versioning, deprecation through at least one minor release before removal in a major.'
  - 'Many, external or independently released consumers, running service: a breaking change ships as a new major version served alongside the old one for a stated deprecation window.'
  - 'Infrastructure-like API with a large consumer base and the funds to carry old behaviour: an indefinitely compatible, date-pinned surface (L353 b).'
  impl_pointers:
  - build/distill/03_judge/J2_assurance_core/judged.md::ASSURANCE.CONTRACTS.1
  - build/research/02_adoption/result.md::ADOPT-C30
  - build/research/03_verification/result.md::VERIFY-C26
