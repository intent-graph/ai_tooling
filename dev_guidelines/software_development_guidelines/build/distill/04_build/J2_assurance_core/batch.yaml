- op: node.create
  uid: ASSURANCE.BEHAVIOUR.5
  name: Tests Driven by Change
  intent: 'Every reported defect becomes a test that fails first and passes after the fix, and code that is poorly understood is pinned by characterization tests of its actual behaviour before it is changed. A scheduled job is tested before it is scheduled like any other unit, and its first runs on real data are bounded and inspected. Writing tests before code is a team decision by context, not a requirement: what is required is that the test exists, was seen to fail for the right reason where it guards a fix, and runs on every change; a gap found by an experiment in production is such a defect.'
  parent: ASSURANCE.BEHAVIOUR
  epistemic_state: 'known | gap: the ordering question (test first or not) is contested, inferred; the pre-schedule test of a job is inferred (maintainer practice only)'
  constraints:
  - MUST a fixed defect have a regression test
  - MUST a scheduled job pass its tests before it is scheduled
  design_notes: 'Decision as judged (R20 applied: decision clause and constraint; the reduced-scope mode is one example because L316 is maintainer-only: the outcome holds, the mechanism is one example). X13: this node holds ''a gap found becomes a test'': a gap found by an experiment in production (ASSURANCE.AVAILABILITY.3, REG-228) is a defect handled here the same way; AVAILABILITY.5 points here for the tests. Outcome: the regression suite is built from operational experience and change is safe.

    Positions: P1 test-first is a team decision (Beck for it in some contexts; DHH against; Fowler contextual); P2 bug to failing test; P3 characterization tests; P4 maintainer''s pre-schedule test.

    Grounds: bug becomes a failing test (L106 consensus; REG-004, REG-067, REG-072); characterization before change (L107; REG-063, REG-073); test-first is contested: all agree on self-testing code and disagree on the ordering mechanics, and DORA''s evidence is of test automation in general, not of test-first ordering (L101; REG-056, REG-063, REG-064); scheduled job tested before it is scheduled, first runs bounded (L316, maintainer-only, public practice read as majority, not fetched); a gap found in production becomes a test (REG-228, cited by AVAILABILITY.3).

    Rejected, with the condition under which each would be best: mandatory test-first is best for compilers, API design and tangled interfaces (Beck, L101), where fast design feedback pays; not general because the evidence is of test automation, not ordering, and DHH names design damage in MVC web code. Never testing before the change for a fix: rejected, a fix without a failing test cannot show it fixes anything.

    Context: test-first ordering is best when writing compilers, designing an API, or untangling interfaces; elsewhere the order is free (L101). Links: requires BEHAVIOUR.1; scheduled-job placement in CONSTRUCTION.PARADIGM. L080 is a consensus row, not a maintainer row (F4, R29 settled, unchanged). Flags: none.'
  examples:
  - 'Bounded first runs of a scheduled job: a reduced-scope test mode (one example of the mechanism; the outcome is what holds).'
