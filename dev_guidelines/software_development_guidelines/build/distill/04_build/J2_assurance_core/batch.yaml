- op: node.create
  uid: ASSURANCE.BEHAVIOUR.8
  name: Defect Classes That Survive Review
  intent: 'Passing review, static analysis and deployment is not evidence that code works: code whose behaviour depends on the shape of the data (queries, parsing, conversions, code on platforms that coerce or truncate) is exercised on production-shaped data, its edge values included, before it ships, and inputs are guarded at boundaries always. A platform limit that fails silently has a check, unclear platform behaviour that a design relies on is verified empirically and recorded with its scope, and a pitfall catalogue grows after any defect found twice. A blanket search-and-replace is never applied across a file that holds two syntactic contexts.'
  parent: ASSURANCE.BEHAVIOUR
  epistemic_state: 'inferred: the lead claim is corroborated by one dated study (L1550, which shows only that static checks miss a run-time class of defect); the five practices rest on maintainer practice alone'
  constraints:
  - MUST data-dependent code be exercised on production-shaped data before it ships
  - MUST a platform limit that fails silently have a check
  - MUST a pitfall found twice be catalogued
  design_notes: 'Decision as judged (R23 applied): ''every branch'' was a coverage target, which BEHAVIOUR.6 rejects, so the scope is L274''s own defect classes; the constraint reads ''data-dependent code'', not ''every branch''. Where public documentation is unclear about a platform behaviour a design relies on, verify empirically on a live instance and record the finding with its scope; anchor on context and re-check the dependants instead of a blanket search-and-replace. Outcome: classes of defect that review cannot see are caught before users meet them.

    Positions: P1 static analysis and types catch part of the class against the maintainer: they do not catch these; P2 pitfall catalogue; P3 no blanket search-and-replace; P4 verify platform behaviour empirically; P5 hard rule for silent truncation.

    Grounds: dynamic checks find what static analysis misses (figure in RULES.2, L1550; REG-1561, REG-1564, dated 2015); this corroborates only that static checks miss a run-time class and does not support the production-shaped-data practice itself (R12, R13); characterization tests of actual behaviour (L277 reads as the platform-level case of L107; REG-063, REG-073); the rest is maintainer practice (L274 to L278; REG-181), public practice read as majority or consensus, not fetched; L275 corresponds to blameless post-mortem knowledge capture.

    Rejected: reliance on static analysis and types alone for these classes; best for the part they do catch (name errors, type errors), which is why they stay as the first layer (BEHAVIOUR.2); the decision combines both rather than choosing.

    Routing note (F8, R31 settled, unchanged): L275 (pitfall catalogue) and L276 (no blanket search-and-replace) catch defect classes that review misses, which is this node''s purpose; the objection to route L275 to OPERATION.INCIDENTS was kept (its trigger is any defect, not a production incident); OPERATION.FEEDBACK links here rather than holding them. Context: none. Links: requires BEHAVIOUR.2 (static layer first); stack pointers L278, L274, L277 (PostgreSQL). Flags: none.'
  examples:
  - A pitfall catalogue indexed by error code or symptom; a platform that silently truncates identifiers over a length limit (L278, a PostgreSQL case, stack pointer).
