- op: node.create
  uid: ASSURANCE.BEHAVIOUR.7
  name: Tests Without Durable Effect on Data
  intent: 'A test never leaves a durable effect on data that anyone relies on: the default mechanism is a separate disposable data store per run, never the production one, with each test isolated. Running on shared or production-sized data behind a boundary guaranteed to be undone is best only when the dataset cannot be cloned or its shapes cannot be synthesized and the platform can undo every effect of the test, and a functional test never runs against production data unless every durable effect is provably undone. Test data and configuration are kept apart from production, and re-runs behave identically.'
  parent: ASSURANCE.BEHAVIOUR
  epistemic_state: 'known | gap: d2, d3, d7 and d9 are inferred (maintainer practice only, public practice read not fetched); the d1 default rests on one framework''s documentation plus the rebuild-state principle (consensus recorded, not several T1 sources); d4 is a platform fact of one stack'
  constraints:
  - MUST NOT a test commit a durable change to shared data
  - MUST NOT production code read the test namespace
  - MUST a mutating automated test on shared or production-sized data run as one rolled-back unit
  design_notes: 'Decision as judged: lead plus sub-decisions per row (the leaf constraints).

    d1 (L1185, L265): the default above; a rollback boundary is a second line of defence, and a functional test never runs against production data unless every durable effect (rows, sequences, notifications, external calls) is provably undone; load and locks are transient effects governed by the guardrails of ASSURANCE.AVAILABILITY.3, not by d1 (X5; AVAILABILITY.3 holds the guardrails every production test shares, PERFORMANCE.4 points to it).

    d2 (L266): default to synthetic fixtures or factories per test (explicit, hermetic); use a curated, catalogued set of real records selected by queryable attributes where shapes are rich and costly to fabricate; never invent rows or pick arbitrary production rows; real records are subject to the privacy rules held in TRANSVERSE.PRIVACY (index only, MD-03); a persistent new shape is feature work by a separate idempotent script.

    d3 (L267): choose the execution vehicle by risk and by runner: read-only tests as plain queries; tests that can mutate or fail run, when automated, as one atomic unit that is rolled back; an open-transaction wrapper only for a human at the keyboard.

    d4 (L268): stack pointer only, not a decision. d5, d6, d8 moved to BEHAVIOUR.4 (R22). d7 (L271): test configuration lives in a namespace disjoint from the production context and production code never reads it. d9 (L273): shaping mutations are conditional on an actual change, so re-runs behave identically and write volume drops.

    Positions: P1 disposable store per run; P2 maintainer rollback on shared or production-sized data; P3 synthetic fixtures against curated real records; P4 vehicle by risk and runner; P5 final error as verdict; P8 disjoint test configuration; P10 conditional mutations (P6 self-reported verdict, P7 colocated against mirrored tests, P9 named fixture variables moved to BEHAVIOUR.4).

    Grounds: disposable store and per-test isolation (L1185; REG-1106, one framework''s documentation) and no shared state, no risk to real data (L265 position a); rebuild state rather than clean up (L111; REG-051, REG-054). The maintainer''s forced-rollback practice (L265 position b, REG-181) rests on realism and cost of cloning and states its own condition (data large, shapes unsynthesizable, platform can undo every effect); it is the platform undo of RULES.1, so ''no durable effect anywhere'', the maintainer''s own rule, is respected. d2, d3, d7, d9 rest on maintainer practice with public practice read as consensus or majority for d7 and d9, not fetched.

    Rejected, with the condition under which each would be best: P2 as the general rule: real shapes are a real need, but it puts at risk every effect a rollback cannot undo and conflicts with rebuild-over-cleanup (L111); best exactly under its stated condition. Synthetic factories as the only source (P3): best where the domain is small and shapes easy to construct; curated real records win where shapes are rich.

    Context: size and cloneability of the data and the platform''s ability to undo every effect move d1; richness of data shapes moves d2; a human at the keyboard moves d3. Links: conflicts RULES.1 (L265 against L111, resolved there); stack pointer L268 (PostgreSQL); TRANSVERSE.PRIVACY (real records, index). Flags: none (F1 settled R15, R26, X5; F5 settled R22).'
  examples:
  - 'd4 (stack pointer only): on one platform, the idiom that every outcome rolls back (a final error whose message is the verdict) realizes d3.'
  impl_pointers:
  - build/distill/03_judge/J2_assurance_core/judged.md::ASSURANCE.BEHAVIOUR.7
  - build/research/07_maintainer_doctrine/result.md::MAINT-C01
  - build/research/07_maintainer_doctrine/result.md::MAINT-C02
  - build/research/07_maintainer_doctrine/result.md::MAINT-C03
  - build/research/07_maintainer_doctrine/result.md::MAINT-C04
