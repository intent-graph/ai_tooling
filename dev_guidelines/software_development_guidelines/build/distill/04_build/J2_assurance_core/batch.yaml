  - build/research/09_external_services/result.md::EXT-C23
  - build/research/09_external_services/result.md::EXT-C24
- op: node.create
  uid: ASSURANCE.CONTRACTS.2
  name: Contract Tests
  intent: Compatibility between independently released components is verified by contract tests, so teams deploy autonomously without a shared integrated environment. Every double of an external service is backed by a contract test against the real service, run on the rhythm of the supplier's changes, whose failure triggers a realignment task and need not break the build. Consumer-driven contracts serve a provider with known consumers under internal control, and provider-side schema validation serves unknown consumers with a published specification; a provider with known consumers uses both.
  parent: ASSURANCE.CONTRACTS
  epistemic_state: 'known | gap: the single-team seam rule (P5) is inferred (L1187 open; the test that decides is whether an old client can stay live); the style choice is contested, resolved by known versus unknown consumers'
  constraints:
  - MUST a double of an external service have a contract test against the real service
  - MUST a contract-test failure create a realignment task
  design_notes: 'Decision as judged (R25 applied). The two styles answer different questions: a schema describes all possible states and catches provider drift; a consumer contract covers only what the consumer uses and is replayed against the provider. A single-team application whose client and server always deploy together, with no old client left in use, verifies its own seam with integration tests and the description diff of CONTRACTS.3, without consumer-driven contracts; where old clients stay in use after a server deploy, client and server release independently in effect and the independent-release rule applies. Doubles of external services follow the contract-test rule in both cases. Outcome: independent release is safe.

    Positions: P1 contract tests instead of shared environments; P2 consumer-driven contracts; P3 provider schema validation; P4 use both; P5 single-team application: decide whether its own client and server interfaces need consumer-driven tests; P6 contract-test every double on the supplier''s rhythm.

    Grounds: contract tests instead of shared integrated environments (L102, L1186; REG-044, REG-046, REG-053, REG-070); consumer-driven contracts'' precision and cost (hidden coupling made explicit, risk of eroding conceptual integrity) (L103, L1281; REG-044, REG-053, REG-1152); both for different questions (L1282; REG-053, REG-1157); contract tests on doubles on the supplier''s rhythm (L104, L1283; REG-054, REG-070).

    Rejected, with the condition under which each would be best: P2 alone for unknown consumers cannot know what they use; best where consumers are many and under internal control. P3 alone for known consumers shows only possible drift, not whether this consumer still works; its lower setup cost and published specification win for unknown consumers (strongest version not independently sourced, open). Shared integrated environments for compatibility: best only when all consumers deploy together as one unit (the maintainer''s single-version case, L295, L135).

    Context: number of consumers and independence of release cadences; the more consumers or independent cadences, the stronger the case for consumer-driven contracts (L1187). Links: conflicts CONTRACTS.1 (L295 against L102, resolved there); BEHAVIOUR.3 (cross-service tests); OWNERSHIP.CONTAINMENT and OWNERSHIP.SERVICES for rented services. Flags: none (the open point on single-team applications is recorded in the epistemic state, decided, inferred).'
  examples:
  - Run the contract test of a double daily, when the supplier changes about that often; a failure may lead to a conversation with the supplier.
  - Cached web clients and installed applications are old clients that stay in use after a server deploy.
  impl_pointers:
  - build/distill/03_judge/J2_assurance_core/judged.md::ASSURANCE.CONTRACTS.2
  - build/research/03_verification/result.md::VERIFY-C23
  - build/research/03_verification/result.md::VERIFY-C24
  - build/research/03_verification/result.md::VERIFY-C25
  - ../web_architecture_guidelines/build/research/06_operations/result.md::OPS-C28
  - ../web_architecture_guidelines/build/research/06_operations/result.md::OPS-C29
  - ../web_architecture_guidelines/build/research/17_data_contracts/result.md::DCON-C19
  - ../web_architecture_guidelines/build/research/17_data_contracts/result.md::DCON-C17
  - ../web_architecture_guidelines/build/research/17_data_contracts/result.md::DCON-C18
  - ../web_architecture_guidelines/build/research/17_data_contracts/result.md::DCON-C20
- op: node.create
  uid: ASSURANCE.CONTRACTS.3
  name: One Source of Description
  intent: Each interface has one machine-readable description from which the reference documentation, client and server stubs, types and tests are derived, never hand-copied. The description is linted in CI against a team ruleset, and CI diffs it against the main-branch version and fails on incompatible change; since the diff covers the description only, behaviour and semantics still need contract tests. The description originates in a typed model when one team owns both ends and is authored first when independent consumers depend on it, and the team records where the chain of types starts.
  parent: ASSURANCE.CONTRACTS
  epistemic_state: 'known | gap: lint and the CI diff are grounded as tool capability only (T3 tool pages), ''CI blocks'' is inferred; the origin condition, the ''should'' of lint and the ''description only'' limit are inferred; code-first against design-first is contested'
  constraints:
  - MUST the description have one source
  - MUST a generated description not be hand-edited
  - MUST CI block an incompatible change in the description
  design_notes: 'Decision as judged (R14 applied to the certainty). Outcome: documentation, stubs and tests cannot drift from the interface.

    Positions: P1 derive from one description, origin undecided; P2 code-first; P3 design-first; P4 choose and record the chain start, one class against separate models; P5 lint in CI; P6 diff in CI.

    Grounds: one description as single source (L220; REG-147 T1, REG-164 T3); lint (L221; REG-158); breaking-change diff (L222, L1284; REG-160, REG-1158); code-first with generated artifact (L1271; REG-1150, REG-1154) against design-first (Zalando and the OpenAPI Initiative flag generated descriptions as incomplete); chain start and model separation (L1277; REG-1150, REG-1154, REG-1159, REG-1160).

    Rejected, with the condition under which each would be best: hand-maintained duplicates of the description: best never. Code-first for independent consumers: generated descriptions are flagged as incomplete; best for one team owning both ends. Design-first for one team owning both ends: an authored description adds a second thing to keep in sync; best for independent consumers. One class for table and validation once the interface shape differs from storage: couples storage to the interface.

    Context: who owns both ends (one team: code-first; independent consumers: design-first, L1271); complexity of the interface shape against storage moves the model separation (L1277). Links: stack pointers L220 (OpenAPI for HTTP), L221 (OpenAPI, AsyncAPI, Spectral), L222 (OpenAPI 3, openapi-diff), L1284, L1271, L1277 (restated neutral); TRANSVERSE.DOCS holds the authoring of reference documentation (MD-03); requires RULES.3. Flags: none.'
  examples:
  - 'Code-first: the generated description is a build artifact, committed or checked, never hand-edited.'
  - 'Chain start: storage schema, server models or the description file; one class for table and validation in simple CRUD, separate storage, input and output models once the interface shape differs from storage.'
  impl_pointers:
  - build/distill/03_judge/J2_assurance_core/judged.md::ASSURANCE.CONTRACTS.3
  - build/research/06_transverse/result.md::TRANS-C11
  - build/research/06_transverse/result.md::TRANS-C12
  - build/research/06_transverse/result.md::TRANS-C13
  - ../web_architecture_guidelines/build/research/17_data_contracts/result.md::DCON-C06
  - ../web_architecture_guidelines/build/research/17_data_contracts/result.md::DCON-C12
  - ../web_architecture_guidelines/build/research/17_data_contracts/result.md::DCON-C21
