- op: node.create
  uid: CHANGE_FLOW.ROLLBACK.1
  name: Detecting and Deciding to Roll Back
  intent: Bad releases are detected automatically and, per change class and in advance, either rolled back from alarms (backward compatible and reversible by redeploy) or fixed forward (not reversible by redeploy, such as a data migration past its last reversible point). Recovery time is short and the choice is not made under stress.
  parent: CHANGE_FLOW.ROLLBACK
  epistemic_state: 'known | inferred: the decision rule by reversibility (no source states it)'
  constraints:
  - MUST the rollback-or-fix-forward choice be decided per change class before shipping
  design_notes: |-
    Decision (judge record, final): Detect bad releases automatically and decide in advance, per change class, between the two: a change that is backward compatible and reversible by redeploy is rolled back automatically from alarms; a change that is not reversible by redeploy (a data migration past its last reversible point) is fixed forward, with the undo decided at ROLLBACK.3. Outcome: recovery time is short and the choice is not made under stress.

    Grounds: Automated rollback on alarm (L162; REG-104, REG-113, REG-115); fix forward under continuous deployment with a very fast pipeline (REG-078, REG-106). No source states the decision rule; the rule by reversibility is inferred from both wins-when conditions, which fit together.

    Positions considered: P1 automatic rollback from alarms (reversibility, recovery time). P2 fix forward (simplicity).

    Rejected, each with the condition under which it would be best: P2 for a reversible change when a rollback is available and faster: best with a very fast pipeline, and for changes not reversible by redeploy. P1 for a change whose redeploy cannot restore the data: best never; rolling back code against changed data can corrupt.

    Context conditions: Reversibility by redeploy (backward compatible or not).

    Certainty (judge record): Grounded for both positions; inferred for the decision rule (no source states it).

    Maintainer decisions: MD-01 (the best practice for the node's purpose, not the average; every weaker position is kept with its winning condition).

