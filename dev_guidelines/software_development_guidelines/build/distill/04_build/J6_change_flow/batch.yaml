- op: node.create
  uid: CHANGE_FLOW.DEPLOY.3
  name: Environment Parity
  intent: Every environment is kept alike production in kind (type and version of backing services, operating system, libraries) with a short commit-to-deploy time and no stand-ins that hide differences, but never with production credentials. Differences that cannot be afforded (scale, data volume, permissions, production-only schemas) are written down, and changes that depend on them are routed to rehearsal on production-shaped data and to the gated lane.
  parent: CHANGE_FLOW.DEPLOY
  epistemic_state: 'known | inferred: the split by axis, kind and version against scale and data (reasoned from the rows, not stated by a source); the documented-divergence rule is maintainer practice, single source'
  constraints:
  - MUST backing-service type and version match production in every environment
  - MUST the list of known environment differences be written down and referenced by the changes it affects
  - MUST NOT parity extend to production credentials
  design_notes: |-
    Decision (judge record, final): Keep every environment alike production in kind: same type and version of backing services, operating system and libraries, a short time from commit to deploy, authors taking part in deploying; do not rely on adapters or lightweight stand-ins to hide differences. Parity does not extend to production credentials or access. Where parity of scale, data volume, permissions or external or shared schemas present only in production cannot be afforded, record the known differences as a list, and route every change whose behaviour depends on them (time, locks, plan, permission) to a rehearsal on production-shaped data (DATA_CHANGE.7) and to the gated lane (DATA_CHANGE.3). Outcome: a pass in an earlier environment means what it says, and each place where it cannot is known and covered.

    Grounds: Tests pass on a lighter database and still fail in production (L165, L1194; REG-077, REG-092, REG-103, REG-1109); the same row says "as alike as practical", which admits residual divergence. The maintainer's rule (L328, REG-181) documents and routes the divergence that cannot be removed; it contradicts parity only where it is read as abandoning parity of kind. The two apply to different axes (kind and version against scale and data), which is why they are kept together.

    Positions considered: P1 production parity in all environments (confidence, correctness). P2 reduce pre-production, test in production with canary and safe rollback (cost, real traffic). P3 lightweight stand-ins in development (speed, cost). P4 maintainer: accept divergence, document it, route to manual environment-specific migration.

    Rejected, each with the condition under which it would be best: P3: the source argues against it and no row supports its merit; best when the adapter surface is narrow and production-like tests exist elsewhere in the pipeline. P2 as the answer for stateful data change: a canary does not make a schema change safe; best with high traffic, strong monitoring and fast rollback for stateless change. P4 stated as "rather than pursuing identical environments" across the board: best only for the axes it names (data volume, permissions, missing schemas, performance) when production-sized data is unaffordable to replicate.

    Context conditions: Affordability of production-sized data (L328); traffic, monitoring and rollback maturity for P2 (L165).

    Certainty (judge record): Grounded for P1 (Twelve-Factor and DORA); inferred for the split by axis (reasoned from the rows, not stated by a source); P4 is maintainer practice, single source.

    Maintainer decisions: MD-01 (the best practice for the node's purpose, not the average; every weaker position is kept with its winning condition); MD-03 (schema parity is guaranteed in the data-integrity and data-change nodes, this node holds environment parity).

    Final pass FL3: 'schema' in the parity-of-scale clause narrowed to external or shared schemas present only in production (schema parity is guaranteed at DATA_CHANGE.1 and .2). FL6 (judge flag F4): settled, record unchanged; the twelve-factor source confirms parity of backing-service type and version and says nothing on data volume; listed against the maintainer's practice for the case where the maintainer's rule was meant to cover type or version.

    Links and stack pointers (judge record): Related TRANSVERSE.ENVIRONMENTS, DATA_CHANGE.3 and .7.
