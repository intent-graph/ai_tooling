- op: node.create
  uid: CHANGE_FLOW.DATA_CHANGE.1
  name: Form and Source of a Change
  intent: Every schema and data change is a migration script in version control, ordered, applied once, recorded, and run by automation with the same process in every environment, never by hand-typed statements. Changes are as small as possible and the reviewed script is the script deployed.
  parent: CHANGE_FLOW.DATA_CHANGE
  epistemic_state: 'known | inferred: idempotent DDL as defence in depth and the separate stream for frequent urgent data fixes (maintainer practice and one practitioner source, conditions reasoned)'
  constraints:
  - MUST every database change be a script in version control applied by tooling
  - MUST NOT a change be hand-typed
  - MUST each migration name its ticket
  - MUST the reviewed script be the deployed script
  design_notes: |-
    Decision (judge record, final): Every schema and data change is a migration script in version control, ordered by a unique sequence, applied once and recorded, run by automation (or the human-triggered run of DATA_CHANGE.3) and never by hand-typed ad-hoc SQL; migrations are kept with the application, run by the same process in every environment as an explicit step of the release, and each names its ticket. Each change is as small as possible so errors are quick to spot. The deployed artifact is the reviewed versioned script: where a declarative desired-state source is used for the developer loop, the generated script is what is reviewed and deployed. DDL is written so a re-run is safe wherever a step can be partially applied or the target's state may differ (steps outside a transaction, environments with known differences), except one-time data migrations and operations that must fail when their precondition does not hold. Where urgent data fixes are frequent and must not wait for the release train, keep them in their own stream, recorded in the same audit. Outcome: no change enters a database that was not reviewed, ordered and recorded.

    Grounds: Migration script in version control, sequence, automation (L379, consensus; REG-244, REG-245, REG-253); the maintainer's reason, earlier inconsistent environments and untracked manual changes (L286; REG-181); same process in every environment as a release step (L1196; REG-244, REG-1109, REG-1110); small changes (L1197, L385; consensus; REG-244, REG-257); ordered scripts give auditability, determinism, offline CI and the exact SQL that runs (L381 b; REG-253), declarative gives a faster developer loop (L381 a; the vendor recommends a hybrid with generated versioned files, one source); idempotent DDL as defence in depth against partial application (L289, maintainer; once-only tooling already serves the transactional case; REG-181); separate stream for urgent data fixes (L406, one T2 source; REG-244). ASSURANCE.ARTIFACT.1 (settled) requires what runs to match reviewed source, which is why the generated script, not the declared state, is the deployed unit.

    Positions considered: P1 migration in version control, ordered, automated. P2 maintainer: ordered, once-only, history-table tracked, never manual. P3 versioned scripts with the application, same process everywhere. P4 declarative desired state as source (cognitive load, iteration speed). P5 ordered change scripts as source (auditability, determinism). P6 idempotent DDL. P7 smallest possible change. P8 separate stream for urgent data fixes.

    Rejected, each with the condition under which it would be best: P4 as the deployed unit: a plan computed at deploy time was not what was reviewed; best for fast local loops when CI can reach the database, and as the authoring form when the generated script is reviewed. P6 stated as a rule for every statement: for transactional all-or-nothing steps the once-only tool already serves and the cost is verbosity; best for steps that can be partially applied and for scripts run against environments known to differ. P8 as a default: a second stream is a second delivery truth to keep consistent; best when urgent fixes are frequent and must not wait for the release train.

    Context conditions: Compliance and distribution (L381): compliance, many instances or packaged software require the ordered scripts as source; a fast local loop may author declaratively.

    Certainty (judge record): Grounded for P1 to P3 and P7 (consensus); inferred for P6 and P8 (maintainer and one T2 source, conditions reasoned); P4 versus P5: grounded as positions, the hybrid is one vendor's recommendation.

    Maintainer decisions: MD-01 (the best practice for the node's purpose, not the average; every weaker position is kept with its winning condition); MD-03 (this branch holds the procedure; the guarantees stay in the data-integrity decision nodes).

    Judge flag F5 settled: idempotent DDL narrowed to steps that can be partially applied or run against environments known to differ; this goes against the maintainer's practice and is listed there by the final pass. Review fix FX3: the separate urgent-fix stream is conditioned on frequent urgent fixes.

    Links and stack pointers (judge record): Related DEPLOY.1, DATA_CHANGE.2; ASSURANCE.ARTIFACT.1 (deployed objects compared with source); stack pointers L289 (SQL form), L1196 (relational origin, statement generic).
