  uid: CHANGE_FLOW.DEPLOY.2
  name: Rollout Strategy and Canary Evaluation
  intent: A release is exposed progressively, sized by blast radius and the cost of the strategy, and a canary is judged against a concurrent control on a few user-impact metrics, not by before-and-after comparison, with automatic detection and halt or rollback. A regression is caught on a small share of users and the call to proceed rests on evidence.
  parent: CHANGE_FLOW.DEPLOY
  epistemic_state: 'known | inferred: the concurrent-control rule is general (one source)'
  constraints:
  - MUST a rollout have an automatic halt or rollback criterion
  - MUST a canary compare with a concurrent control
  design_notes: |-
    Decision (judge record, final): Expose each release progressively, sized by blast radius and the cost of the strategy, and judge a canary against a concurrent control group on a few metrics tied to user impact, not by a before-and-after comparison; one canary at a time, population and duration sized to traffic and velocity, with automatic detection and rollback. Outcome: a regression is caught on a small share of users, and the call to proceed is based on evidence.

    Grounds: Blue-green for stateful, downtime-sensitive applications with budget for two environments (L160; REG-087); canary for high traffic with good metrics (REG-088); one-box then waves with bake time for multi-region (REG-115, REG-084); concurrent control and few user-impact metrics (L161, one source; REG-104); identical-traffic comparison to catch regressions (L118, majority; REG-051, REG-067); most outages come from changes to a live system, so progressive rollout, fast detection and safe rollback (L173; REG-113).

    Positions considered: P1 blue-green. P2 canary. P3 one-box then waves. P4 canary against a concurrent control. P5 old versus new on identical traffic. P6 progressive rollout plus fast detection plus playbooks.

    Rejected, each with the condition under which it would be best: No strategy is rejected: each is best under its row's condition (above). Exposing a release to all traffic at once: best only with no live traffic to protect or where the change cannot be split. A canary judged by before-and-after metrics: best never, drift in traffic mix is read as a regression or hides one. The "threefold faster repair with playbooks" is one operator's figure, kept as an example, not a standard.

    Context conditions: Statefulness and downtime tolerance, traffic volume and metric quality, number of regions (L160).

    Certainty (judge record): Grounded for the strategies and for the control-group rule (one source, REG-104, inferred as general); grounded for P6 as principle (one T2 source).

    Maintainer decisions: MD-01 (the best practice for the node's purpose, not the average; every weaker position is kept with its winning condition).

    Links and stack pointers (judge record): Realizes ASSURANCE.AVAILABILITY; Related ROLLBACK.1, OPERATION.RUNBOOKS (playbook clause of L173), ASSURANCE.AVAILABILITY.3.
  examples:
  - One operator's figure, a threefold faster repair with playbooks, kept as an example and not as a standard.
