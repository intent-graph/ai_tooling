- op: node.create
  uid: CHANGE_FLOW.DATA_CHANGE.6
  name: Bulk and Backfill Design
  intent: A change that finishes in minutes is a plain migration; a change over very large data is cut into bounded, throttled, re-runnable batches, decided by batching key, work list, fan-out and observe-and-recover, in their own step apart from schema steps. Where it runs is decided and recorded by duration, so it can be interrupted, repeated and verified without corruption.
  parent: CHANGE_FLOW.DATA_CHANGE
  epistemic_state: 'known | inferred: the four-decision procedure, the re-runnable batch rules and the standard-tools rule (maintainer practice, single source, public practice agrees or extends); place by duration is contested and decided by duration'
  constraints:
  - MUST a bulk batch be re-runnable with the same result
  - MUST a batch not run inside a long DDL transaction
  - MUST the place a backfill runs be recorded with its reason
  design_notes: |-
    Decision (judge record, final): If one statement finishes in minutes, run it as a migration. A change over data too large for that (order of ten million rows and more) is run as four decisions in order: the batching key (an indexed key part, then a numeric range, modulo last), a work list generated from the data, fan-out by workers, observe and recover. Batches are bounded, throttled, in their own step and never inside a long DDL transaction; every batch is re-runnable in isolation with the same result (a self-limiting predicate in preference to external bookkeeping, absolute not relative updates, upsert not insert, partition by a fixed key, never read "latest" data inside the job, one logical unit in one statement, no automatic retries of non-idempotent batches). Data steps stay apart from schema steps in transaction and timing. Where the backfill runs is decided and recorded: inside a migration step with a time budget for minutes of work, as an application background job triggered by a migration for long work, offline from a snapshot for very large multi-table moves with analytic tooling. Standard command-line tools composed and verified part by part suit a one-off job; a framework suits a job that recurs. Outcome: a large data change can be interrupted, repeated and verified without corruption.

    Grounds: Four-decision procedure and size gate (L299, maintainer; REG-181); bounded throttled batches in their own step (L398, consensus; REG-255, REG-257, REG-258); re-runnable batches (L300, maintainer; L399, majority, transfer from scheduled tasks inferred; REG-254, REG-181); place by duration (L401, contested; each held by a different T3 source; REG-255, REG-257, REG-258); standard tools (L307, maintainer; REG-181); data apart from schema (L407, majority; REG-255, REG-258). One long transaction serves simplicity and costs locks, bloat and an open transaction of hours; the size gate decides.

    Positions considered: P1 four-decision procedure with size gate. P2 bounded throttled batches. P3 batches re-runnable, self-limiting predicate. P4 re-runnable with upsert, fixed partition, no "latest". P5 place by duration: in-migration, background job, offline snapshot. P6 compose standard tools, not a framework. P7 data apart from schema.

    Rejected, each with the condition under which it would be best: One long transaction over very large data: best when it finishes in minutes. A framework for a one-off job: best when the job recurs (repeatability against cost of ownership). External bookkeeping instead of a self-limiting predicate: best when the data cannot carry its own progress. An offline backfill: best only for very large multi-table moves (zero production load against a copy that must be reconciled). Each place in P5 is best at its duration (no single winner).

    Context conditions: Data volume (L299) and duration of the work (L401).

    Certainty (judge record): Grounded for P2 and P7 (consensus, majority); inferred for P1, P3 and P6 (maintainer practice, single source, public practice read as agreeing or extending); P5 contested, decided by duration (inferred).

    Maintainer decisions: MD-01 (the best practice for the node's purpose, not the average; every weaker position is kept with its winning condition); MD-03 (this branch holds the procedure; the guarantees stay in the data-integrity decision nodes).

    Links and stack pointers (judge record): Related DATA_CHANGE.5 (L304), DATA_CHANGE.8; ASSURANCE.DATA_INTEGRITY.2 (explicit scope for bulk operations); stack pointers L299 (named database client and parallel runner), L398, L399, L307.
