- op: node.create
  uid: CHANGE_FLOW.DEPLOY.1
  name: Automated Deployment Path
  intent: Deployment uses the same automated, versioned, idempotent process for every environment, production included, and any authorized person can deploy any version on demand. One-off administrative processes run with the same code, environment and isolation as the application, and a human trigger on a stage for a risky change class is a gate within the process, not a different process.
  parent: CHANGE_FLOW.DEPLOY
  epistemic_state: 'known | inferred: the maintainer''s human-triggered lane is compatible with the same process (reasoned, see DATA_CHANGE.3)'
  constraints:
  - MUST production be deployed by the same scripted process as every other environment
  - MUST deployment scripts be versioned
  - MUST admin code ship with the application
  design_notes: |-
    Decision (judge record, final): Automate deployment with the same process for every environment, production included: any authorized person can deploy any version on demand, steps are idempotent and order-independent, scripts are versioned. One-off administrative processes (migrations included) run with the same code, environment and dependency isolation as the application, and their code ships with it. "The same process" means the same scripts and the same tooling; a human authorization or a human trigger on a stage for a risky class of change (RELEASE.4, DATA_CHANGE.3) is a gate within that process, not a different process. Outcome: what is deployed to production was exercised by the process that deployed it earlier, and no step depends on one person's memory.

    Grounds: Same process, on demand, idempotent, versioned (L159, consensus; REG-077, REG-082, REG-092); admin processes as the application (L1198; REG-1109). The coverage check's contradiction by L290 and L328 dissolves once "automatic" and "same process" are separated: the maintainer's lane is a human-triggered run of the same tooling for a risky class (DATA_CHANGE.3), which L159 permits ("any authorized person can deploy on demand").

    Positions considered: P1 same automated process in every environment. P2 admin processes isolated like the application.

    Rejected, each with the condition under which it would be best: A different or hand-driven process for production: best never; it makes production the one environment never exercised. A fully hand-typed production step: banned by L286 and L159 alike.

    Context conditions: none.

    Certainty (judge record): Grounded (consensus); inferred that the maintainer's manual lane is compatible with it (reasoned, see DATA_CHANGE.3).

    Maintainer decisions: MD-01 (the best practice for the node's purpose, not the average; every weaker position is kept with its winning condition).

    Links and stack pointers (judge record): Related RELEASE.4, DATA_CHANGE.1 (L1196), DATA_CHANGE.3 (resolved there); no remaining conflict.
