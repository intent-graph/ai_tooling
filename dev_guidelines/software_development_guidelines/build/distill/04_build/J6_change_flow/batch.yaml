- op: node.create
  uid: CHANGE_FLOW.RELEASE.5
  name: Who May Release and When
  intent: Who may perform release operations is a recorded policy, while release itself stays self-service for the teams that own the system. Deployment proceeds only when someone able to respond is available, and during an active incident only a change that remediates it ships, through a stated exception path.
  parent: CHANGE_FLOW.RELEASE
  epistemic_state: 'inferred: one practitioner source (REG-115) plus the argument that a change needs someone able to respond to its failure; restriction of release operations is grounded on one source'
  constraints:
  - MUST the set of release-permitted people be a recorded policy
  - MUST an incident exception path exist
  design_notes: |-
    Decision (judge record, final): Restrict by policy who can perform release operations while keeping release itself self-service for the teams that own the system. Deployment proceeds only when someone able to respond is available; during an active incident only a change that remediates it is deployed, through a stated exception path. Outcome: no release is made by someone unauthorized or blind.

    Grounds: Restrict operations, keep self-service (L157, consensus, one source; REG-082); block during incidents and outside responder hours (L164; REG-115, one T3 source, not cross-checked).

    Positions considered: P1 restrict by policy, self-service. P2 block during incidents and off-hours.

    Rejected, each with the condition under which it would be best: A fixed off-hours blackout where automated rollback and round-the-clock response exist: best only where nobody can respond. A deployment freeze that also blocks the remediation of the incident itself: best never.

    Context conditions: none.

    Certainty (judge record): Grounded for P1 (one source); inferred: one T3 source (REG-115), plus the argument that a change needs someone able to respond to its failure. The MUST on the incident exception path stays: without it the block would stop the remediation itself.

    Maintainer decisions: MD-01 (the best practice for the node's purpose, not the average; every weaker position is kept with its winning condition).

    Final pass FL8 (judge flag F12): settled; decision and MUST unchanged, Certainty reworded to inferred (one practitioner source plus the respond-to-failure argument).

