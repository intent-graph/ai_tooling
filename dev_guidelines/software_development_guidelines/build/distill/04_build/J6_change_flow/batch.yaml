operations:
- op: node.create
  uid: CHANGE_FLOW.INTEGRATION
  name: Version Control and Integration
  intent: Everything needed to build, deploy and restore lives in version control, and work reaches one mainline in small, frequent, attributable changes, with a broken mainline fixed before anything else. The repository stays a complete source of the system, history serves reading and reversal, and every change has a known author and approver.
  parent: CHANGE_FLOW
  epistemic_state: 'inferred: roll-up of INTEGRATION.1 to .6; principles grounded in the children, numeric defaults inferred'
  design_notes: |-
    Roll-up node: the intent summarizes its children; no ledger rows attach here.

    Decision (judge record, final): Everything needed to build, deploy and restore lives in version control; work is integrated into one mainline in small, frequent, attributable changes, and a broken mainline is fixed before anything else. Outcome: the repository alone rebuilds the system, history serves reading and reversal, and each change has a known author and approver.

    Grounds: Roll-up of INTEGRATION.1 to .6 (18 rows).

    Positions considered: None here (roll-up).

    Rejected, each with the condition under which it would be best: Not applicable (roll-up).

    Context conditions: None here; contributor model moves .2, release model moves .3.

    Certainty (judge record): Inferred as a roll-up (own certainty); principles grounded in the children, numeric defaults inferred.

    Maintainer decisions: MD-01 (the best practice for the node's purpose, not the average; every weaker position is kept with its winning condition).

    Links and stack pointers (judge record): Realizes ASSURANCE.RULES (mechanism for RULES.3 and RULES.4 on the mainline is ARTIFACT.2).
  impl_pointers:
  - build/distill/03_judge/J6_change_flow/judged.md::CHANGE_FLOW.INTEGRATION
- op: node.create
  uid: CHANGE_FLOW.INTEGRATION.1
  name: Repository Content and Shape
  intent: The repository holds everything needed to build, deploy and restore, so a clean machine rebuilds the system from it alone. Each deployable has one codebase, code shared across applications is a versioned library, and whatever repository layout is chosen keeps one version of each shared component at any time.
  parent: CHANGE_FLOW.INTEGRATION
  epistemic_state: 'known | inferred: a monorepo holds one codebase per application as one unit per deployable with its own build and deploy | gap: which repository layout wins in general is open, the layout debate rests on one practitioner source'
  constraints:
  - MUST a clean checkout build and deploy without machine-specific state
  - MUST one version of each shared component hold at any time
  design_notes: |-
    Decision (judge record, final): Keep everything needed to build, deploy and restore (source, scripts, infrastructure and application configuration, dependency declarations) in version control; a clean machine builds from the repository alone. Each deployable application has one codebase and many deploys; code shared across applications is a versioned library, and whatever repository layout is chosen keeps one version of each shared component at any time. Outcome: reproducible rebuild and recovery from one place, and consistent dependencies.

    Grounds: Consensus on content (L124; REG-077, REG-092, REG-095) and on one codebase per deployable (L1190; REG-1109). The one-version invariant is what L132 states for every layout (REG-106, single T2 source for the layout debate).

    Positions considered: P1 everything in version control (reproducibility). P2 one codebase per application (ownership). P3 monorepo (atomic cross-project change). P4 multiple repositories (control, security). P5 virtual monorepo (one version across repositories).

    Rejected, each with the condition under which it would be best: No layout is rejected as such: the layout is a means to the invariant. Monorepo is best for one organization with tooling investment and many interdependent projects; multiple repositories are best for regulated or access-segmented work; a virtual monorepo is best when separate repositories are required and one version still must hold. A repository that omits scripts, configuration or infrastructure needed to rebuild: best never.

    Context conditions: Access segmentation (L132): regulated or access-segmented work moves the layout to multiple repositories; the invariant stays.

    Certainty (judge record): Grounded for P1 and P2 (consensus); inferred that a monorepo holds "one codebase per application" as one unit per deployable with its own build and deploy; the layout debate rests on one T2 source (open on which layout wins in general).

    Maintainer decisions: MD-01 (the best practice for the node's purpose, not the average; every weaker position is kept with its winning condition).

    Links and stack pointers (judge record): Related OWNERSHIP.LIFECYCLE (the one-version rule is a dependency rule).
  impl_pointers:
  - build/distill/03_judge/J6_change_flow/judged.md::CHANGE_FLOW.INTEGRATION.1
  - build/research/04_delivery/result.md::DELIVER-C01
  - ../web_architecture_guidelines/build/research/06_operations/result.md::OPS-C32
  - build/research/04_delivery/result.md::DELIVER-C09
- op: node.create
  uid: CHANGE_FLOW.INTEGRATION.2
  name: Integration Frequency and Branch Life
  intent: Work is integrated into the mainline at least daily and a branch lives hours to a couple of days; unfinished work that spans longer is merged hidden, not held in a branch. Deferred integration costs more in conflicts, isolation and late feedback than continuous integration does.
  parent: CHANGE_FLOW.INTEGRATION
  epistemic_state: 'known | inferred: the three-or-fewer active branches figure is a default bound, not a rule'
  constraints:
  - MUST a branch be merged or deleted within days (the limit is the team's, default a couple of days)
  - MUST unfinished work on the mainline be hidden and its toggle carry an owner and an expiry (RELEASE.3)
  design_notes: |-
    Decision (judge record, final): Integrate into one mainline at least daily; a branch lives hours to a couple of days, and long-lived development branches are avoided. Work that spans more than the integration interval is merged hidden behind a flag, dark launch, keystone or branch by abstraction, not held in a branch. Outcome: early feedback, small conflicts, and a mainline that always holds the latest integrated work.

    Grounds: Many small integrations reduce conflict cost and give early feedback (L125; REG-057, REG-077, REG-078, REG-079, REG-106); long-lived branches cost more in merges, regression isolation and large-scale change (L128, consensus; REG-079, REG-106, REG-110); hiding unfinished work keeps integration continuous (L129; REG-077, REG-078, REG-089, REG-096). The strongest argument is the cost curve of deferred integration; the opposing position is a condition, not a rival.

    Positions considered: P1 daily integration, short branches (feedback). P2 feature branches merged when complete (control, low coordination cost). P3 avoid long-lived branches. P4 hide unfinished work in the mainline (carrying cost of toggles).

    Rejected, each with the condition under which it would be best: P2 as the general rule: it defers integration risk rather than removing it. Best for open source with many untrusted or part-time contributors, and for features of one to two days (L125; REG-110). Daily integration without good automated tests: it only multiplies conflict-free merges of unchecked code; best preceded by the trust signal of RULES.1.

    Context conditions: Contributor model (full-time team versus sparse or untrusted contributors) and test maturity (L125): sparse contributors and short features keep a feature branch merged when complete; full-time teams with good tests integrate daily.

    Certainty (judge record): Grounded (consensus on avoiding long-lived branches, majority on daily merge, DORA); the "three or fewer active branches" figure is a DORA default, inferred as a bound.

    Maintainer decisions: MD-01 (the best practice for the node's purpose, not the average; every weaker position is kept with its winning condition).

    Links and stack pointers (judge record): Related RELEASE.3 (flags), ASSURANCE.RULES.2 (small feedback loops).
  examples:
  - 'One research programme''s default: three or fewer active branches, merged at least daily.'
  impl_pointers:
  - build/distill/03_judge/J6_change_flow/judged.md::CHANGE_FLOW.INTEGRATION.2
  - build/research/04_delivery/result.md::DELIVER-C02
  - build/research/04_delivery/result.md::DELIVER-C05
  - build/research/04_delivery/result.md::DELIVER-C06
- op: node.create
  uid: CHANGE_FLOW.INTEGRATION.3
  name: Branching Model and Release Branches
  intent: 'The branching model follows the release model: one continuously delivered live version uses short branches off one mainline and fixes go forward, while explicitly versioned or multi-version software cuts a release branch just in time, fixes on the mainline, cherry-picks into it and deletes it after release. A branch exists only as long as a version needs separate fixes.'
  parent: CHANGE_FLOW.INTEGRATION
  epistemic_state: 'known | inferred: the just-in-time release branch is the form a release branch takes, not a rival to it'
  constraints:
  - MUST a release branch (when it exists) receive fixes by cherry-pick from the mainline, not by merge back
  design_notes: |-
    Decision (judge record, final): Follow the release model. For one live version delivered continuously: trunk-based flow with short-lived branches and no release branch; a defect is fixed on the mainline and redeployed (fix forward). Where software is explicitly versioned or several versions are supported in the field: a release branch, cut only just in time, defects fixed on the mainline and cherry-picked into it, deleted after release and never merged back. Outcome: one place where change happens, and a branch that exists only for as long as a version needs separate fixes.

    Grounds: Trunk or GitHub flow for continuous delivery, including its originator's own retraction for that case (L126; REG-078, REG-090, REG-091, REG-106); release branches by the number of versions in the field (L126; REG-090); just-in-time cut, cherry-pick, delete (L127; REG-078, REG-082, REG-106).

    Positions considered: P1 trunk or GitHub flow (speed, low cognitive load). P2 release branches git-flow style (control, several versions). P3 just-in-time release branch. P4 no release branch, fix forward (simplicity).

    Rejected, each with the condition under which it would be best: Standing release branches for a single live version: they add merge cost for no version to support; best only when versions are in the field. P4 for a supported-versions product: a fix to an old version has nowhere to land; best when the release cycle is hours.

    Context conditions: Release model (L126): continuous single live version versus several supported versions. P3 is how P2 is done, not a rival to it.

    Certainty (judge record): Grounded for the split by release model (T1/T2 sources, the originator's own statement); inferred that P3 is the form P2 takes.

    Maintainer decisions: MD-01 (the best practice for the node's purpose, not the average; every weaker position is kept with its winning condition).

    Links and stack pointers (judge record): Related RELEASE.1, ROLLBACK.1 (fix forward).
  impl_pointers:
  - build/distill/03_judge/J6_change_flow/judged.md::CHANGE_FLOW.INTEGRATION.3
  - build/research/04_delivery/result.md::DELIVER-C03
  - build/research/04_delivery/result.md::DELIVER-C04
- op: node.create
  uid: CHANGE_FLOW.INTEGRATION.4
  name: Merge Method and Commit Practice
  intent: A change is one logical unit that can be read and reverted as one, each commit is atomic and says what changed and why, and one merge method is chosen and recorded per repository. A structured message format is used only where tools generate releases from history.
  parent: CHANGE_FLOW.INTEGRATION
  epistemic_state: 'known | inferred: the squash default follows from small units and simple revert | gap: which of the three merge methods wins is open, no source ranks them'
  constraints:
  - MUST one merge method be recorded per repository
  - MUST a commit be atomic and say what and why
  design_notes: |-
    Decision (judge record, final): The unit of integration is one logical change that can be read and reverted as one unit; each commit is atomic and complete, and its message says what changed and why; unrelated changes go in separate branches or pull requests. One merge method is chosen per repository and recorded: squash for small one-logical-unit changes (the default when changes are kept small, INTEGRATION.5 and REVIEW.2), rebase when commits are well-structured atomic commits worth keeping, merge commit when integration events must be traced. A structured message format (Conventional Commits) is used only when release notes or version bumps are generated from history. Outcome: history that can be read, bisected, reverted and, where needed, read by tools.

    Grounds: Atomic commits with what and why (L133, consensus; REG-083, REG-091); the three methods each trade fidelity against simplicity (L130; REG-109, REG-114); structured messages serve automation only when automation exists (L134; REG-030, REG-102). No source ranks the three methods; the squash default follows from small units and simple revert and is inferred.

    Positions considered: P1 squash (cognitive load, reversibility). P2 rebase (bisect granularity). P3 merge commit (fidelity, audit). P4 atomic commits with what and why. P5 Conventional Commits when releases are generated. P6 free-form what and why.

    Rejected, each with the condition under which it would be best: Each method is best under its row's condition (above). A mandatory structured format without a generator: it costs every author and serves nobody. Several methods mixed in one repository without record: the history then has no reading rule; best never.

    Context conditions: Whether integration events must be traced (merge commit), whether commits are well structured (rebase), whether history is parsed by automation (structured message).

    Certainty (judge record): Grounded for atomic commits and the structured-message condition; inferred for the squash default; open on a winner among the three methods (no source read ranks them). The maintainer's mandatory unit header with a dated change log (L318, routed elsewhere) is in partial tension with free-form messages and is not decided here.

    Maintainer decisions: MD-01 (the best practice for the node's purpose, not the average; every weaker position is kept with its winning condition).

    Links and stack pointers (judge record): stack pointer L130 (GitHub terms); Related INTEGRATION.5.
  impl_pointers:
  - build/distill/03_judge/J6_change_flow/judged.md::CHANGE_FLOW.INTEGRATION.4
  - build/research/04_delivery/result.md::DELIVER-C07
  - build/research/04_delivery/result.md::DELIVER-C10
  - build/research/04_delivery/result.md::DELIVER-C11
- op: node.create
  uid: CHANGE_FLOW.INTEGRATION.5
  name: Mainline Health and Batch Size
  intent: 'A broken mainline is the highest-priority work: the faulty change is reverted and a named person owns the fix. Batches stay small, commits frequent and rollback routine, more so as change volume rises, so version control remains the safety net whoever or whatever produces the change.'
  parent: CHANGE_FLOW.INTEGRATION
  epistemic_state: 'known | inferred: the causal link from change volume to oversized batches'
  constraints:
  - MUST a broken mainline be reverted or fixed before new work merges
  design_notes: |-
    Decision (judge record, final): A broken mainline is the highest-priority work: the faulty change is reverted to restore it and a named person owns the fix. Batches stay small, commits frequent and rollback routine, and the rule tightens as change volume rises, whoever or whatever produces the change. Outcome: the mainline is always releasable and any change can be undone cheaply.

    Grounds: Fix or revert a broken build first (L146; consensus, REG-057, REG-077, REG-085); small batches and routine rollback at volume (L1057; REG-1041, REG-181) and the same rule for generated code (L172; REG-095, REG-096), merged here as one author-neutral rule.

    Positions considered: P1 broken mainline first (consensus). P2 small batches, frequent commits, routine rollback (majority). P3 the same for generated code.

    Rejected, each with the condition under which it would be best: No competing position recorded. Letting a broken mainline wait for the author: best never, since every later integration is blind.

    Context conditions: none.

    Certainty (judge record): Grounded for P1 (consensus); grounded as majority for P2 (one program plus the maintainer); the causal link volume to oversized batches is inferred.

    Maintainer decisions: MD-01 (the best practice for the node's purpose, not the average; every weaker position is kept with its winning condition); MD-02 (author-neutral: the rule is stated for any producer of change).

    Links and stack pointers (judge record): Related REVIEW.2 (small units protect review), ROLLBACK.2 (routine rollback).
  impl_pointers:
  - build/distill/03_judge/J6_change_flow/judged.md::CHANGE_FLOW.INTEGRATION.5
  - build/research/04_delivery/result.md::DELIVER-C23
  - build/research/04_delivery/result.md::DELIVER-C49
  - build/research/13_change_authors/result.md::AUTH-C16
- op: node.create
  uid: CHANGE_FLOW.INTEGRATION.6
  name: Change Attribution and Actor Rules
  intent: Every change carries a recorded trail of its author, its approver and, for an automated author, the tool and session; automation uses identities distinct from human ones, and a change not attributable to a person needs approval by a named accountable person. The bar is the same whatever the origin of a change, so no disclosure rule is needed.
  parent: CHANGE_FLOW.INTEGRATION
  epistemic_state: 'known | inferred: the author-neutral phrasing of the actor boundaries and the choice of no disclosure rule over disclosure (one maintainer ruling, one inference)'
  constraints:
  - MUST an automated author use an identity distinct from a human one
  - MUST an unattributed change be approved by a named person
  - MUST NOT the bar depend on who authored
  design_notes: |-
    Decision (judge record, final): Every change carries a platform-recorded trail: who or what authored it, who approved it, and, for an automated author, which tool and session. Automation uses identities distinct from human ones; a change not attributable to a person needs an additional approval by a named, accountable person; the actors (human, bot, agent) and what each may do in the change flow are stated. No disclosure rule is needed: the same bar and the same gates apply to every change, and the recorded trail gives the benefit of disclosure without relying on declarations. Outcome: any change is traceable to an accountable party, and the bar does not depend on origin.

    Grounds: Attributable record (L1061; REG-1036, REG-1040, REG-114), distinct identities and added approval (L1062; REG-1036, one vendor, platform-specific mechanism), stated actor boundaries (L1076; REG-1035, REG-1037, REG-1041); one bar for everyone is ASSURANCE.RULES.5 (L1042) and a named accountable person is ASSURANCE.RULES.4 (L1043). The row-level note that a platform trail gives P4's benefit is the deciding argument against a declaration rule.

    Positions considered: P1 attributable record. P2 distinct identities, added approval. P3 stated actor boundaries. P4 mandatory disclosure of tool use (reviewer calibration, provenance). P5 no disclosure rule, same bar (simplicity).

    Rejected, each with the condition under which it would be best: P4 as the general rule: declarations can be omitted and add friction; best where reviewer time is scarce and intake is public (open contribution), where it lets a reviewer calibrate depth (L1077 a). Shared human-and-bot identities: best never, attribution is lost.

    Context conditions: Reviewer capacity and public intake (L1077): scarce reviewers with public intake favour a recorded disclosure on top of the trail.

    Certainty (judge record): Grounded for the trail and distinct identities (majority, vendor documentation, mechanism platform-specific); inferred for the author-neutral phrasing of L1076 and for the choice of P5 over P4 (one maintainer ruling, one inference).

    Maintainer decisions: MD-01 (the best practice for the node's purpose, not the average; every weaker position is kept with its winning condition); MD-02 (the bar and the attribution do not depend on who or what authored the change).

    Links and stack pointers (judge record): Related ASSURANCE.SECURITY.6 and ARTIFACT.2 (limits and mainline binding), REVIEW.1; stack pointer L1062 (one hosting platform's mechanism).
  impl_pointers:
  - build/distill/03_judge/J6_change_flow/judged.md::CHANGE_FLOW.INTEGRATION.6
  - build/research/13_change_authors/result.md::AUTH-C20
  - build/research/13_change_authors/result.md::AUTH-C21
  - build/research/13_change_authors/result.md::AUTH-C35
  - build/research/13_change_authors/result.md::AUTH-C36
- op: node.create
  uid: CHANGE_FLOW.REVIEW
  name: Review
  intent: 'Review realizes independent, accountable review bound to the exact content: the mechanism follows team and risk, depth follows risk and evidence of understanding, units are small and answered quickly, and automation runs first while a second model only assists. Review stays trustworthy and review capacity does not become the constraint.'
  parent: CHANGE_FLOW
  epistemic_state: 'inferred: roll-up of REVIEW.1 to .4; grounded in the settled independent-review decision and the children'
  design_notes: |-
    Roll-up node: the intent summarizes its children; no ledger rows attach here.

    Decision (judge record, final): Review realizes ASSURANCE.RULES.4: independent, accountable, bound to the exact content. The mechanism (asynchronous approval, synchronous review or pairing, show-after-merge for the low-risk tier) follows team and risk; depth follows risk and evidence of understanding; units are small and answered quickly; automation runs first and a second model assists but never approves. Outcome: the review was trustworthy and review capacity is not the constraint.

    Grounds: Roll-up of REVIEW.1 to .4 (11 rows).

    Positions considered: None here (roll-up).

    Rejected, each with the condition under which it would be best: Not applicable (roll-up).

    Context conditions: Team size and trust, criticality, scale (on the children).

    Certainty (judge record): Inferred as a roll-up; grounded in the settled RULES.4 and the children.

    Maintainer decisions: MD-01 (the best practice for the node's purpose, not the average; every weaker position is kept with its winning condition).

    Links and stack pointers (judge record): Realizes ASSURANCE.RULES.
  impl_pointers:
  - build/distill/03_judge/J6_change_flow/judged.md::CHANGE_FLOW.REVIEW
- op: node.create
  uid: CHANGE_FLOW.REVIEW.1
  name: Mechanism and Depth by Risk
  intent: One bar applies to every change and an independent party checks each change before integration; the mechanism (asynchronous approval, synchronous review or pairing, post-merge show for the defined low-risk tier) is chosen per team and recorded. Depth rises with risk and wherever the submitter's understanding cannot be assumed, and a high-blast-radius change is approved by named approvers qualified for that class.
  parent: CHANGE_FLOW.REVIEW
  epistemic_state: 'known | inferred: the author-neutral form of depth by evidence of understanding and the escalation criterion (maintainer practice agreeing with common practice)'
  constraints:
  - MUST a high-blast change name its approvers
  - MUST NOT depth be reduced because the author is trusted or automated
  design_notes: |-
    Decision (judge record, final): One bar for every change (RULES.5), an independent party checks each change before integration (RULES.4); the mechanism is chosen per team and recorded: mandatory asynchronous approval, or synchronous review or pairing recorded on the platform, with show-after-merge allowed only for the low-risk tier RULES.4 defines. Depth is set by risk and by evidence that the submitter understands the change, and rises where that cannot be assumed. A change with a large blast radius (it holds locks, runs longer than the team's time budget, or can affect availability) is approved by named approvers qualified for that class; who may run it is held at DATA_CHANGE.3 and RELEASE.5. Outcome: review effort sits where it pays and no high-blast change is approved by someone unqualified for it.

    Grounds: Mandatory approval gives confidence, knowledge sharing and a trail (L137; REG-083, REG-114, REG-115); synchronous review removes the queue (L137; REG-079, REG-116); Ship, Show, Ask is the post-merge tier under strong gates (L137; REG-098), which RULES.4 already admits; depth by evidence of understanding (L1044 b; REG-1040, REG-1043, REG-1044); escalation by risk with named senior approvers (L298, maintainer; agrees with common practice, REG-181).

    Positions considered: P1 mandatory asynchronous approval. P2 synchronous review or pairing. P3 Ship, Show, Ask. P4 one uniform bar, depth by risk. P5 depth by evidence of understanding. P6 escalate by risk with named senior approvers.

    Rejected, each with the condition under which it would be best: P3 as the general rule: settled against at RULES.4, which holds the reason; best as the post-merge tier for low-risk change with automatic gates and revert. P1 in a small trusted team that pairs: pairing satisfies independence when the second person is recorded; best for larger or less-trusting teams, regulated change control, many contributors. P2 where reviewers are distributed or contributors many. P4 and P5 are one rule seen from two sides (a bar that does not move, an effort that does). "Senior" as a title in P6: restated as a named approver qualified for the class; the title form is best with a small trusted senior group and few critical changes (L298).

    Context conditions: Team size and trust (mechanism); criticality (depth); whether submitter understanding can be assumed (P5): public intake, high volume and many contributors make the deeper review the default.

    Certainty (judge record): Grounded for independence and the mechanism conditions (consensus, DORA warns against heavy multi-approval review); inferred for the author-neutral form of L1044 b and for the escalation criterion (maintainer practice agreeing with common practice).

    Maintainer decisions: MD-01 (the best practice for the node's purpose, not the average; every weaker position is kept with its winning condition); MD-02 (depth tracks evidence of understanding, not the kind of author).

    Final pass: cross-unit X14 applied (rejection of the post-merge show as the general rule points to the settled review decision for the reason, no restated wording; MD-03).

    Links and stack pointers (judge record): Related INTEGRATION.6, DATA_CHANGE.3 and .8 (L298 and L303 name senior review of locking or long changes), ASSURANCE.RULES.4, RULES.5.
  impl_pointers:
  - build/distill/03_judge/J6_change_flow/judged.md::CHANGE_FLOW.REVIEW.1
  - build/research/04_delivery/result.md::DELIVER-C14
  - build/research/13_change_authors/result.md::AUTH-C03
  - build/research/07_maintainer_doctrine/result.md::MAINT-C34
- op: node.create
  uid: CHANGE_FLOW.REVIEW.2
  name: Unit of Review and Response Speed
  intent: A unit of review is small enough to be read meaningfully, with refactoring in separate changes and tests beside the logic they cover, and a reviewer answers within a bounded time. When production volume rises, review capacity is the binding constraint, so reviews must stay real and waiting must stay bounded.
  parent: CHANGE_FLOW.REVIEW
  epistemic_state: 'known | inferred: the numeric thresholds are defaults (sources differ, 100 and 200 lines) and the causal reading of review capacity as the constraint'
  constraints:
  - MUST a unit of review be small enough to be read in one sitting
  - MUST a reviewer answer within the team's stated bound
  design_notes: |-
    Decision (judge record, final): Keep each unit of review small enough to be read meaningfully (about 100 lines typical, around 1000 too large; the thresholds are the team's), with refactoring in separate changes and tests in the same change as the logic they cover; treat review capacity as the binding constraint when production volume rises. Respond to a review request within one business day at most, preferring quick individual responses and optimising team throughput over one author's speed. Outcome: reviews are real, and waiting is bounded.

    Grounds: Small changes (L140, consensus; REG-083, REG-096, REG-100), review capacity as constraint when volume rises (L1048; REG-1041, REG-1042, REG-1047), response within a business day (L139, consensus; REG-083, REG-099).

    Positions considered: P1 small changes with thresholds. P2 review capacity as constraint, small units. P3 respond within one business day.

    Rejected, each with the condition under which it would be best: No competing position recorded. Large reviews approved by skim: best never, the review signal then proves nothing (RULES.1).

    Context conditions: none.

    Certainty (judge record): Grounded for P1 and P3 (consensus; thresholds differ between sources, 100 and 200 lines, so numbers are inferred defaults); P2 majority, the causal reading inferred.

    Maintainer decisions: MD-01 (the best practice for the node's purpose, not the average; every weaker position is kept with its winning condition).

    Links and stack pointers (judge record): Related INTEGRATION.5 (L172, L1057).
  examples:
  - 'Thresholds one source gives: about 100 lines typical, around 1000 too large; another source says 200.'
  impl_pointers:
  - build/distill/03_judge/J6_change_flow/judged.md::CHANGE_FLOW.REVIEW.2
  - build/research/04_delivery/result.md::DELIVER-C17
  - build/research/13_change_authors/result.md::AUTH-C07
  - build/research/04_delivery/result.md::DELIVER-C16
- op: node.create
  uid: CHANGE_FLOW.REVIEW.3
  name: What the Reviewer Reads and Approves
  intent: A change is approved when it definitely improves overall code health even if imperfect, facts overrule preference, and a second reader must be able to understand it. Review is guided by an owned, freshness-checked catalog of defect patterns read by type of change, which doubles as an audit list.
  parent: CHANGE_FLOW.REVIEW
  epistemic_state: 'known | inferred: the maintained defect catalog (maintainer practice, public review checklists not fetched)'
  constraints:
  - MUST a second reader be able to understand the change
  - MUST the catalog have an owner
  design_notes: |-
    Decision (judge record, final): Approve a change when it definitely improves overall code health, even if imperfect; technical facts and data overrule preference, and optional suggestions are marked as such. Review also serves understanding: a second reader must be able to understand the change. Review is guided by a maintained catalog of defect patterns read by type of change (table, function, query, index and so on), and the catalog has an owner and is checked for staleness; it doubles as an audit list. Outcome: approvals mean the change is understandable and better, and recurring defect classes are looked for deliberately.

    Grounds: Improve code health, facts over preference (L138; REG-080, one T2 source, no opposing source found); review as understanding and knowledge transfer (L142, consensus; REG-083, REG-108); catalog read by change type (L297, maintainer; read as majority public practice via review checklists; REG-181). The cost noted by the row, a catalog not kept current misdirects review, is the reason for the owner and the freshness check.

    Positions considered: P1 improve code health. P2 understanding and knowledge transfer. P3 maintained anti-pattern catalog by change type.

    Rejected, each with the condition under which it would be best: No competing position recorded. A catalog without an owner: best never (it then misdirects review). Perfection as the approval bar: slows delivery for no gain in health (P1).

    Context conditions: none.

    Certainty (judge record): Grounded for P1 and P2 (consensus, one T2 source for P1); inferred for P3 (maintainer practice; public checklists not fetched).

    Maintainer decisions: MD-01 (the best practice for the node's purpose, not the average; every weaker position is kept with its winning condition).

    Links and stack pointers (judge record): Related ASSURANCE.BEHAVIOUR.8 (defect classes that survive review).
