- op: node.create
  uid: CHANGE_FLOW.DATA_CHANGE.2
  name: Migration History and Immutability
  intent: 'Each database records in itself which migrations ran, and an applied migration is never edited: a failed one is fixed and rerun, a wrong one is corrected by a new migration, and a recorded checksum enforces this. Reference data is kept with the migrations, so any environment''s state is knowable and reproducible.'
  parent: CHANGE_FLOW.DATA_CHANGE
  epistemic_state: 'known | inferred: the checksum as a general mechanism and the strict never-edit form'
  constraints:
  - MUST an applied migration not change
  - MUST the history live in the target database
  design_notes: |-
    Decision (judge record, final): Keep a per-database record, in the target database itself, of which migrations ran, and never edit an applied migration: if it failed, fix it and rerun; if it succeeded but was wrong, add a new one; a recorded checksum enforces this, and forced replay is rare and administrator-only. Sample and reference data are kept with the migrations so every environment is consistent. Outcome: any environment's state is knowable and reproducible, and history is not rewritten.

    Grounds: Per-database record, correct with a new migration (L380; REG-245, REG-252, REG-253; the strict "never edit" form is inferred from REG-252 and REG-253); the maintainer's form with checksum (L287; REG-181); state in the target and reference data with migrations (L418, consensus; REG-244, REG-245). The strict form wins wherever more than one environment has applied the change, since an edit there makes the environments differ silently.

    Positions considered: P1 record and no edit of applied. P2 maintainer: checksum-enforced immutability. P3 state in the target, reference data with migrations.

    Rejected, each with the condition under which it would be best: Editing an applied migration after rolling it back (one tool allows it): best when only one environment has applied it. Unrecorded history: best never.

    Context conditions: none beyond "more than one environment".

    Certainty (judge record): Grounded for the record and the new-migration rule (majority); inferred for the checksum as general mechanism (maintainer; the strict form is inferred).

    Maintainer decisions: MD-01 (the best practice for the node's purpose, not the average; every weaker position is kept with its winning condition); MD-03 (this branch holds the procedure; the guarantees stay in the data-integrity decision nodes).

    Links and stack pointers (judge record): Stack pointer L287 (one migration tool's model); Related DATA_CHANGE.1.
