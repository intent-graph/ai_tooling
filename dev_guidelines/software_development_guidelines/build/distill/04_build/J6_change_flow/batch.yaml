- op: node.create
  uid: CHANGE_FLOW.RELEASE.1
  name: Cadence and Batch Size
  intent: 'Prefer small, frequent releases over large infrequent ones, with cadence following the release model: every merge for one live version with strong automation, a regular train for many coordinated components, explicit versions for shipped products. Frequency is raised only together with the supporting practices, because small batches cut blast radius and difficulty while frequency alone raises failures.'
  parent: CHANGE_FLOW.RELEASE
  epistemic_state: 'known | inferred: the cadence per release model rests on a few sources'
  constraints:
  - MUST the batch size per release be kept as small as the model allows
  design_notes: |-
    Decision (judge record, final): Prefer small, frequent releases over large infrequent ones. The cadence follows the release model: one release per merge for one live version with automation and strong tests; a regular train for many components coordinated across teams; explicit versions for shipped products and libraries with several supported. Frequency is raised only together with the supporting practices. Outcome: small blast radius, easy reversal and lower difficulty per release.

    Grounds: Small and frequent (L1200, consensus; REG-082, REG-1110); continuous (L153; REG-082, REG-084, REG-097, REG-112), train (REG-084), explicit versions (REG-090); DORA warning that more frequency without supporting practices raises failure rate and burnout (REG-097, REG-093).

    Positions considered: P1 continuous (speed, reversibility). P2 scheduled train (predictability). P3 explicit versions (consumer control). P4 the principle across the three.

    Rejected, each with the condition under which it would be best: Large infrequent releases: best never as a goal; a long interval is accepted only as the consequence of P2 or P3. Continuous without tests and automation: raises failure and burnout; best preceded by those practices.

    Context conditions: Release model (L153): every merge, a regular train, or explicit versions.

    Certainty (judge record): Grounded for the principle (consensus); the cadence per model rests on a few sources (majority).

    Maintainer decisions: MD-01 (the best practice for the node's purpose, not the average; every weaker position is kept with its winning condition).

    Links and stack pointers (judge record): Related INTEGRATION.3, MEASURE.1 (L170).
