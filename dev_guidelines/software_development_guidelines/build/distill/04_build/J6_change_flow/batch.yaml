  - build/research/04_delivery/result.md::DELIVER-C30
- op: node.create
  uid: CHANGE_FLOW.RELEASE.2
  name: Version Identity
  intent: 'A release identifier promises only what is true: a compatibility-promising version scheme only for an artifact with a declared public interface consumed by others, and a plain build or time identifier with no compatibility promise for a deployed service with one live version. A consumer can then trust what a version number says.'
  parent: CHANGE_FLOW.RELEASE
  epistemic_state: 'known | inferred: the plain release identifier for a single live service | gap: calendar versioning is not read in any source, open and not rejected'
  constraints:
  - MUST every release have a unique identifier
  - MUST a version number that promises compatibility be backed by a declared public interface
  design_notes: |-
    Decision (judge record, final): An identifier promises only what is true: Semantic Versioning only for an artifact with a declared public API consumed by others; for a deployed service with one live version a release identifier (build number or timestamp) that makes no compatibility promise. Outcome: a consumer can trust what a version number says, and a service carries no false promise.

    Grounds: Semantic Versioning for consumed public API (L135; REG-030); build identifier for a single live version (REG-081); the service rule is inferred from REG-030 plus REG-081, and fits CONTRACTS.1 (explicit versioning where consumers are many, external or independent).

    Positions considered: P1 Semantic Versioning for public API. P2 release identifier for a single live service. P3 calendar versioning (not read in any source).

    Rejected, each with the condition under which it would be best: Semantic Versioning on an internal service nobody consumes by version: it promises a compatibility nobody checks; best when consumers choose when to move. P3: no source read; open, not rejected.

    Context conditions: Release model (L135): single live version versus consumed public API.

    Certainty (judge record): Grounded for P1; inferred for P2; open for P3.

    Maintainer decisions: MD-01 (the best practice for the node's purpose, not the average; every weaker position is kept with its winning condition).

    Links and stack pointers (judge record): Related BUILD.2, ASSURANCE.CONTRACTS.1.
