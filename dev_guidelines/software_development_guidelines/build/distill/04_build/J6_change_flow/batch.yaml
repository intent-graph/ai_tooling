  uid: CHANGE_FLOW.DEPLOY.4
  name: Instance Replacement and Desired State
  intent: Running instances are replaced rather than modified, and the declared state of images and infrastructure is versioned code, so the running system equals what is declared and drift cannot persist. Either agents reconcile declared state continuously or a scripted push is paired with drift detection; no source decides between the two.
  parent: CHANGE_FLOW.DEPLOY
  epistemic_state: 'known | gap: pull-based reconcile versus scripted push with drift detection is open, no source compares them'
  constraints:
  - MUST declared state be in version control
  - MUST NOT an instance be modified in place without the change recorded back into the declared state
  design_notes: |-
    Decision (judge record, final): Replace deployed instances rather than modify them, and keep the declared state of images and infrastructure as versioned code, so the running system equals what is declared and drift cannot persist. Two forms serve this: agents that pull and continuously reconcile declared state, or a scripted push deploy from CI with drift detection; no source compares them, so no switch between them is decided. Outcome: what runs matches what was declared, and a bad instance is replaced, not repaired.

    Grounds: Replace, do not modify; immutable images (L166, majority; REG-081, REG-095, REG-111); pull-based reconcile corrects drift and leaves an auditable history (L167; REG-101); scripted push is the cheap form (REG-077, REG-092). No source compares pull and push.

    Positions considered: P1 replace instances (consistency, reversibility). P2 managed mutable servers (stateful hosts, drift risk). P3 declarative desired state with pull reconcile (control, security). P4 push from CI (cost of ownership).

    Rejected, each with the condition under which it would be best: P2: best for stateful hosts where replacement is costly (inferred), with drift detection. P4 without drift detection: it cannot correct drift; no source says when push or pull is best (open).

    Context conditions: none; pull versus push is open.

    Certainty (judge record): Grounded for P1 (majority); open for pull versus push (no source compares).

    Maintainer decisions: MD-01 (the best practice for the node's purpose, not the average; every weaker position is kept with its winning condition).

    Links and stack pointers (judge record): Stack pointers L166 (image-based provisioning), L167 (orchestrators).
