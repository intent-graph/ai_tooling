- op: node.create
  uid: CHANGE_FLOW.MEASURE
  name: Measuring Delivery
  intent: Delivery is judged by outcomes (lead time, deployment frequency, recovery time, change fail rate, rework), used to guide improvement and not to rank people, and never by the volume of code produced. A measured gain from automation is checked against an independent baseline, and the fundamentals of the delivery system are treated as preconditions.
  parent: CHANGE_FLOW
  epistemic_state: 'inferred: roll-up of MEASURE.1 and .2'
  design_notes: |-
    Roll-up node: the intent summarizes its children; no ledger rows attach here.

    Decision (judge record, final): Delivery is judged by outcomes (lead time, deployment frequency, recovery time, change fail rate, rework), used to guide improvement not to rank people, never by volume of code produced; a measured gain from automation is verified against an independent baseline, and the fundamentals of the delivery system are treated as preconditions. Outcome: delivery performance is measured by what reaches users and holds, not by output.

    Grounds: Roll-up of MEASURE.1 and .2 (5 rows).

    Positions considered: None here (roll-up).

    Rejected, each with the condition under which it would be best: Not applicable.

    Context conditions: Foundation practices (on MEASURE.1).

    Certainty (judge record): Inferred as a roll-up.

    Maintainer decisions: MD-01 (the best practice for the node's purpose, not the average; every weaker position is kept with its winning condition).

    Links and stack pointers (judge record): Realizes ASSURANCE.RULES; Related OPERATION.FEEDBACK.
  impl_pointers:
  - build/distill/03_judge/J6_change_flow/judged.md::CHANGE_FLOW.MEASURE
- op: node.create
  uid: CHANGE_FLOW.MEASURE.1
  name: Outcomes That Judge Delivery
  intent: Delivery is measured with five outcome metrics (change lead time, deployment frequency, failed-deployment recovery time, change fail rate, deployment rework rate), used to guide improvement and not to rank people. Speed and stability move together only with supporting practices, and the change flow is judged by outcomes, never by the volume of code or changes produced.
  parent: CHANGE_FLOW.MEASURE
  epistemic_state: 'known | gap: the net effect of automation on delivery outcomes is contested (small samples, vendor sources) and not decided'
  constraints:
  - MUST delivery be judged on the outcome measures
  - MUST NOT the metrics be used to rank individuals
  design_notes: |-
    Decision (judge record, final): Measure with the five DORA metrics (change lead time, deployment frequency, failed deployment recovery time, change fail rate, deployment rework rate) and use them to guide improvement, not to rank people. Treat speed and stability as correlated, not traded off, but only with supporting practices: raising frequency alone yields failures and burnout. Judge the change flow by delivery outcomes, not by the volume of code or pull requests produced; the net effect of automation on those outcomes depends on the foundation practices and is not settled by the sources. Outcome: a team improves what reaches users, and no measure becomes a target that distorts it.

    Grounds: Five metrics (L169, consensus; REG-093; "not to rank people" inferred); speed and stability correlated with supporting practices (L170, majority; REG-093, REG-097); outcomes, not volume (L1058; REG-1041, REG-1042, REG-1043, REG-1047). The contested net effect: automation raises throughput and satisfaction with instability a fixable side effect (REG-1041), or gains vanish at organisation level or are negative for experienced developers in mature code (REG-1043, sixteen developers, REG-1047); sample and vendor caveats apply.

    Positions considered: P1 five DORA metrics. P2 speed and stability correlated with supporting practices. P3 outcomes, not volume; net effect contested (a) positive, (b) vanishes or negative.

    Rejected, each with the condition under which it would be best: Output volume (code, pull requests) as the measure: best never, it measures activity. The conventional speed-versus-stability trade-off: no source read defends it. The net effect is not decided: (a) is best in teams with version control, small batches, testing, a platform and a clear policy; (b) elsewhere (L1058).

    Context conditions: Foundation practices (L1058): present means (a), absent means (b).

    Certainty (judge record): Grounded for P1 and P2; grounded for the outcome-not-volume principle; open on the net effect of automation (contested, small samples, vendor sources).

    Maintainer decisions: MD-01 (the best practice for the node's purpose, not the average; every weaker position is kept with its winning condition); MD-02 (outcomes, not who writes the code).

    Links and stack pointers (judge record): Related OPERATION.RELIABILITY (L169, L208), RELEASE.1.
  impl_pointers:
  - build/distill/03_judge/J6_change_flow/judged.md::CHANGE_FLOW.MEASURE.1
  - build/research/04_delivery/result.md::DELIVER-C46
  - build/research/04_delivery/result.md::DELIVER-C47
  - build/research/13_change_authors/result.md::AUTH-C17
- op: node.create
  uid: CHANGE_FLOW.MEASURE.2
  name: Independent Baselines and Preconditions
  intent: A claimed gain from automation, in speed or security, is measured against a baseline not produced by the claimant. Version control, small batches, testing, a platform and a clear policy are preconditions, because automation magnifies existing strengths and weaknesses.
  parent: CHANGE_FLOW.MEASURE
  epistemic_state: 'known | inferred: the independent baseline as a principle (findings from small samples)'
  constraints:
  - MUST a claimed gain be measured against a baseline not produced by the claimant
  design_notes: |-
    Decision (judge record, final): Do not rely on self-reported speed or security gains from automation: measure them against an independent baseline. Treat the delivery system's fundamentals (version control, small batches, testing, platform, clear policy) as preconditions: automation magnifies existing strengths and weaknesses. Outcome: a claimed gain is a measured gain, and automation is added where it will help.

    Grounds: Independent baseline (L1059; REG-1043, REG-1044, REG-1050; findings from small samples, principle inferred); fundamentals as preconditions (L1060, majority; REG-1041, REG-1042).

    Positions considered: P1 independent baseline. P2 preconditions.

    Rejected, each with the condition under which it would be best: No competing position recorded. Self-reported gain as evidence: best never for a decision about adoption.

    Context conditions: none.

    Certainty (judge record): Grounded for P2 (majority); inferred for P1 as principle (small samples).

    Maintainer decisions: MD-01 (the best practice for the node's purpose, not the average; every weaker position is kept with its winning condition); MD-02 (outcomes, not who writes the code).

    Links and stack pointers (judge record): Related MEASURE.1, RELEASE.1.
  impl_pointers:
  - build/distill/03_judge/J6_change_flow/judged.md::CHANGE_FLOW.MEASURE.2
  - build/research/13_change_authors/result.md::AUTH-C18
  - build/research/13_change_authors/result.md::AUTH-C19
