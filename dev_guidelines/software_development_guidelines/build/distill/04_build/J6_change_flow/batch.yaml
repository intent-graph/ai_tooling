- op: node.create
  uid: CHANGE_FLOW.DATA_CHANGE.7
  name: Rehearsal and Time Budget
  intent: A data change is rehearsed before production on data whose size and shape make the measured time, lock behaviour and plan representative, and the measurements are kept with the change; for small data a developer database with sample data suffices. Migrations have a time budget by class, and personal data is masked and side effects blocked in any copy of production.
  parent: CHANGE_FLOW.DATA_CHANGE
  epistemic_state: 'known | inferred: the restored-dump rehearsal on every request, the condition on skipped migrations and the time-budget figures'
  constraints:
  - MUST measure duration and lock behaviour on a rehearsal copy before production and keep the figures with the change
  - MUST a migration with a skip marker be rehearsed elsewhere
  - MUST personal data be masked in a copy of production
  design_notes: |-
    Decision (judge record, final): Rehearse a data change before production on data whose size and shape make the measured time, lock behaviour and plan representative, and keep the measurements with the change; for small data, developer-owned databases with versioned sample data suffice. On every change request, restore a dump of development data and apply every migration of the request; a migration that cannot work on the partial dump carries a skip marker with its reason and is rehearsed on production-shaped data before its production run. Migrations have a time budget by class (the budget is the team's, the same value as the gate criterion of DATA_CHANGE.3) so long ones are identified before deploy. When production data is copied for a rehearsal, personal data is masked before the copy leaves production and side effects (mail, analytics) are blocked in the copy. Outcome: duration, locks and plan are known before production, and no skipped rehearsal is left unrehearsed.

    Grounds: Production-sized or production-shaped data (L403 a; GitLab, Postgres.ai, Neon: vendor sources are interested parties; REG-244, REG-255, REG-261, REG-262) against developer-owned data with sample data for small data (L403 b; REG-244); the maintainer's restore of a dump on every request (L293; agrees with migration CI on a representative dataset; REG-181); measure and keep (L405, majority; REG-255, REG-256, REG-261); time budget (L402, majority, one T3 source; REG-255); mask and block side effects (L404, single vendor; REG-262). A skip marker that would leave a migration never rehearsed fails the guarantee of the rehearsal; the added condition closes it.

    Positions considered: P1 production-sized or production-shaped data. P2 developer-owned databases with sample data. P3 rehearsal in a rolled-back transaction on shared real data (maintainer, no public source; pointer from L403, row routed elsewhere). P4 maintainer: restored dump of development data on every request, skip marker. P5 measure and keep. P6 time budget by class. P7 mask and block side effects.

    Rejected, each with the condition under which it would be best: P1 for small data: costs cloning and personal-data risk for no gain; best for large tables and where plans or lock duration depend on volume. P2 for large tables: timings do not transfer. P3: decided against as the general rule at BEHAVIOUR.7 (disposable store by default; the rollback boundary only where data cannot be cloned and every effect can be undone). Figures in P6 (3, 10 minutes, one second): one team's; the maintainer's five minutes is a value of the same kind.

    Context conditions: Data volume (L403): P1 for large tables, P2 for small data.

    Certainty (judge record): Grounded for P1, P2, P5 (several sources, vendor caveat); inferred for P4 as general (maintainer, agrees with common practice) and for the condition on skipped migrations; P6 numbers inferred; P3 undecided here, settled in J2.

    Maintainer decisions: MD-01 (the best practice for the node's purpose, not the average; every weaker position is kept with its winning condition); MD-03 (this branch holds the procedure; the guarantees stay in the data-integrity decision nodes).

    Judge flag F10 settled: the skip marker is conditioned (a migration that cannot work on the partial dump is rehearsed on production-shaped data before its production run); this goes against the maintainer's practice and is listed there by the final pass.

    Links and stack pointers (judge record): Related TRANSVERSE.PRIVACY (L404), ASSURANCE.BEHAVIOUR.7 (test data management), DATA_CHANGE.3 (budget as gate criterion).
  examples:
  - Time-budget figures of one team (3 and 10 minutes, one second); the maintainer's five minutes is a value of the same kind.
