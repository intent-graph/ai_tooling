- op: node.create
  uid: CHANGE_FLOW.RELEASE.4
  name: Staged Pipeline and Human Gates
  intent: The path to production is one automated pipeline of stages, early ones giving fast feedback and later ones more confidence, and authorization after a reviewed merge is automatic by default. A human gate sits on a stage only where the change class warrants it (low confidence in automation or monitoring, high criticality or regulation, or a change not reversible by redeploy), and access control on who may release applies in either case.
  parent: CHANGE_FLOW.RELEASE
  epistemic_state: 'known | inferred: placing the irreversible data class under human gates'
  constraints:
  - MUST every gate state its criterion
  - MUST NOT a gate be skippable by a person with a different route to production (RULES.3)
  design_notes: |-
    Decision (judge record, final): One automated pipeline of stages: early stages give fast feedback, later stages more confidence. Authorization after a reviewed merge is automated by default; a human authorization gate sits on a stage only where the change class warrants it: low confidence in automation or monitoring, high criticality or regulation, or a change not reversible by redeploy (the risky class of data change, DATA_CHANGE.3). Access control on who may release applies in either case. Outcome: speed where automation can be trusted and a person where being wrong is irreversible.

    Grounds: One pipeline of staged confidence (L1199, consensus; REG-107, REG-1110; same as the staging half of L156); hands-off with review the last manual gate wins with mature automation and monitoring (L156; REG-115); human gates win at high criticality, regulation, low confidence (L156; REG-107; REG-082 for access control).

    Positions considered: P1 one staged pipeline. P2 hands-off (speed, reduced error). P3 human gates on some stages (control).

    Rejected, each with the condition under which it would be best: A manual gate on every stage: it makes the gate a ritual and removes the speed argument; best under regulation that requires it. Fully hands-off for irreversible classes: best never where a mistake cannot be rolled back.

    Context conditions: Criticality and regulation, and test maturity (L156): P3 at high criticality, regulation or low confidence; P2 with mature automation and monitoring.

    Certainty (judge record): Grounded for P1; grounded for the conditions of P2 and P3 (single contested row, T1 and T3 sources); inferred for placing the irreversible data class under P3.

    Maintainer decisions: MD-01 (the best practice for the node's purpose, not the average; every weaker position is kept with its winning condition).

    Links and stack pointers (judge record): Related DATA_CHANGE.3 (the maintainer's manual lane sits inside the contested range of L156), DEPLOY.1.
