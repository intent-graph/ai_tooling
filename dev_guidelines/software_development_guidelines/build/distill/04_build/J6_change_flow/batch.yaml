- op: node.create
  uid: CHANGE_FLOW.REVIEW.4
  name: Automated and Second-Model Layers
  intent: 'Format, lint, tests and build run before the human reviewer so attention goes to design and logic. A second automated reviewer may be added as an extra layer but never as the approving party: accountable approval stays with an independent responsible party.'
  parent: CHANGE_FLOW.REVIEW
  epistemic_state: 'known | inferred: the second automated reviewer as an extra layer (vendor statements only) | gap: no study read on the accuracy of an automated second reviewer'
  constraints:
  - MUST automated checks run before the reviewer is asked
  - MUST NOT an automated reviewer be the approving party
  design_notes: |-
    Decision (judge record, final): Format, lint, tests and build run before human review so the reviewer spends attention on design and logic. A second model reviewing in a fresh context may be added as an extra layer, never as the approver: the accountable approval stays with an independent responsible party, and the extra layer substitutes for no part of it at high risk. Outcome: the human review is spent where machines cannot judge, and approval stays accountable.

    Grounds: Automation first (L141, consensus; REG-083, REG-085); second reviewer as added layer under human accountability (L1049 a; REG-1038); human gate for approval for independence of failure modes (L1049 b; REG-1036, REG-1040); RULES.4 settled that a machine may assist but is never the accountable party.

    Positions considered: P1 automation first. P2 second model as extra layer. P3 human-only gate for approval.

    Rejected, each with the condition under which it would be best: A second model as the approving party: best never under RULES.4 (accountability attaches to a person or role). P2 as a replacement for part of the human review: best when volume exceeds human capacity and risk is low, and only as a layer (the human review stays in force); where risk is high P3 alone governs approval.

    Context conditions: Scale (volume beyond human capacity favours the extra layer) and criticality (high risk keeps the human gate sole).

    Certainty (judge record): Grounded for P1; inferred for P2 (vendor statements only; no study read on AI-reviewer accuracy: open).

    Maintainer decisions: MD-01 (the best practice for the node's purpose, not the average; every weaker position is kept with its winning condition); MD-02 (a second model is an assisting layer, accountability is for a responsible party).

    Links and stack pointers (judge record): Related ASSURANCE.RULES.2 and RULES.4, BUILD.1.
