- op: node.create
  uid: CHANGE_FLOW.DATA_CHANGE.8
  name: Running and Watching a Production Data Job
  intent: A production bulk job is declared done by a written convergence query that returns zero remaining work, not by the process returning, and it does not start until a pre-start checklist holds (ticket, index-backed plan, idempotent batches, written convergence query, detached run with a ledger, qualified review where it holds locks, a stop plan). It is ramped with a halt on the first failure, paced on the target system's health, and watched on lock waits and replica lag.
  parent: CHANGE_FLOW.DATA_CHANGE
  epistemic_state: 'inferred: maintainer practice, single source, public practice agrees or extends it | gap: no public counterpart found for the convergence query (L413) and for identifying a statement to its change (L412)'
  constraints:
  - MUST a convergence query be written before the job starts
  - MUST the first production run halt on the first failure
  - MUST a bulk job keep a ledger
  - MUST a long-running statement be identifiable to its change in activity views and logs (for example the ticket key in a comment)
  design_notes: |-
    Decision (judge record, final): A bulk change is declared done by a written convergence query that returns zero remaining work, not by the job process returning; a non-zero result means skipped or silently failed batches, and re-runs must strictly decrease it. Who triggers a production run of the risky class is held at DATA_CHANGE.3, which points to ASSURANCE.SECURITY.6; this node holds how the job runs once started. A production bulk job does not start until a checklist holds: a ticket exists and long-running statements are identifiable to it; a full development run at one worker, then a few; the batch predicate is index-backed (verified by a plan); every batch idempotent or the predicate convergent; the convergence query written; the job detached with a ledger; senior review (a qualified approver, REVIEW.1) if it holds locks or runs long; a stop plan naming what to cancel and whether partial completion is acceptable. Concurrency is never guessed and is raised only with a reason and a metric; the recommended ramp is one batch by hand with its plan inspected, one worker, a modest default; on the first production run halt on the first failure, keep a ledger of batches with exit codes and separate error and progress streams, bound workers by connections, headroom and replica lag. The job is pausable and paced on the target system's health, replica lag first, with mid-run adjustment of batch size and lag limit; watch the target (lock waits, per-batch runtime climbing, dead-tuple growth, replica lag) and escalate on those signals. A long-running statement is identifiable to its change in activity views and logs during an incident (for example the ticket key in a comment). The procedure scales with blast radius; a job that finishes in minutes is a plain migration (DATA_CHANGE.6). Outcome: a production data job is started only when it can be stopped and finished only when proven complete.

    Grounds: Convergence query (L301, maintainer, extends common practice; no public counterpart found, L413 open; nearest REG-257 shadow comparison, REG-254 idempotence; REG-181); ramp and halt rules (L302, maintainer; agrees with progressive rollout, extends it; REG-181); the checklist (L303; REG-181); pausable, paced on replica lag (L400, majority, single T3 source plus a sleep between batches in REG-258; REG-256, REG-258); watch the target (L305; agrees with common practice; REG-181); identifiability of statements to their change (L306, inferred: the outcome query tagging serves; no public counterpart found, L412 open; REG-181). The strongest argument for the convergence query is that a returning process proves only that the process finished.

    Positions considered: P1 convergence query as done. P2 ramp, halt, ledger, detach. P3 pre-start checklist. P4 pausable, health-paced. P5 watch the target system. P6 ticket key in the statement.

    Rejected, each with the condition under which it would be best: "Done" when the job returns: best never; it cannot see skipped batches. Guessing concurrency: best never. Watching only the job's shell: misses lock waits and lag. The full checklist for a job of minutes: best only at large blast radius; the size gate decides.

    Context conditions: none stated by a row beyond blast radius (the size gate of DATA_CHANGE.6).

    Certainty (judge record): Grounded as maintainer practice (single source) for P1 to P3, P5, P6, inferred as best practice (public practice agrees or extends; no counterpart found for P1, P2, P6); grounded as majority for P4 (one T3 source).

    Maintainer decisions: MD-01 (the best practice for the node's purpose, not the average; every weaker position is kept with its winning condition); MD-03 (this branch holds the procedure; the guarantees stay in the data-integrity decision nodes).

    Final pass FL9 (judge flag F13): the MUST on the ticket key is replaced by identifiability of a long-running statement to its change (the ticket key is an example); the ramp steps are a recommendation, while 'concurrency is raised only with a reason and a metric' stays a MUST; cross-unit X6: who triggers a production run of the risky class is held at DATA_CHANGE.3, which points to the security principle.

    Links and stack pointers (judge record): Related OPERATION.TELEMETRY (L305), OPERATION.INCIDENTS (L306), REVIEW.1 (L303), DATA_CHANGE.3 (authorization stage, run outside the pipeline), DATA_CHANGE.6, ASSURANCE.SECURITY.6 (a large-blast-radius job is a reviewed script, its run authorized and triggered by the accountable group through the guarded path); stack pointers L305 (dead tuples), L400 (a MySQL tool).
  examples:
  - 'Identifying a long-running statement to its change: the ticket key in a comment of the statement.'
