- op: node.create
  uid: CHANGE_FLOW.RELEASE.3
  name: Separating Release From Deployment
  intent: 'Where a feature must be turned off without redeploying, or work spans more than the integration interval, release is decoupled from deployment with flags. Each flag is inventory with a carrying cost: classified, created with an expiry and a removal task, and its production-reachable states tested.'
  parent: CHANGE_FLOW.RELEASE
  epistemic_state: 'known | inferred: toggles as inventory as the general rule (single source)'
  constraints:
  - MUST a release toggle carry an expiry and a removal task
  - MUST the states that can occur in production be tested
  design_notes: |-
    Decision (judge record, final): Where a feature needs to be turned off without redeploying, or work spans more than the integration interval, decouple release from deployment with flags. Every toggle is inventory with a carrying cost: classified (release, experiment, ops, permission), a release toggle created with an expiry and a removal task at introduction, and the relevant toggle states tested. Outcome: a feature is reversible without a deploy, and toggles do not accumulate.

    Grounds: Flags decouple release from deployment (L154, majority; REG-084, REG-089, REG-096, REG-112; L1201 "where needed", REG-089); toggles as inventory (L155, L1201; REG-089, single source, no dissent found).

    Positions considered: P1 flags (reversibility). P2 no flags, small batches released immediately (cost of ownership). P3 toggles as inventory.

    Rejected, each with the condition under which it would be best: P2 as a universal: best when batches are small, rollback by redeploy is fast and no work spans the integration interval. Flags without expiry: best never, every toggle then adds a state to test forever.

    Context conditions: none stated beyond "where needed" above.

    Certainty (judge record): Grounded for P1 (majority); P3 single source (REG-089), inferred as the general rule.

    Maintainer decisions: MD-01 (the best practice for the node's purpose, not the average; every weaker position is kept with its winning condition).

    Links and stack pointers (judge record): Related INTEGRATION.2 (L129), EVOLUTION.DECOMMISSION (toggle expiry).
