- op: node.create
  uid: CHANGE_FLOW.DATA_CHANGE.3
  name: Delivery Path and Gating of Database Change
  intent: 'Database change travels in the same pipeline as application change, as the same reviewed script with one history and one audit trail, not as a separate manual track. A recorded criterion classes each change: ordinary changes apply automatically through every environment, while the risky class passes an authorization stage where a named, qualified group approves the production run on the exact script and a member triggers it.'
  parent: CHANGE_FLOW.DATA_CHANGE
  epistemic_state: 'known | inferred: the named, qualified group that approves and triggers the authorization stage (no public source), the risk-based split as the general rule, the size criterion, and the idempotent authoring script for configuration-like content | gap: no public counterpart found for configuration-like content on its own path (L411)'
  constraints:
  - MUST the same reviewed script, not a retyped one, run in production
  - MUST the classification criterion be recorded
  - MUST NOT a risky-class change start from an automatic merge
  - MUST a production run of the risky class name who runs it and be approved on the exact script
  design_notes: |-
    Decision (judge record, final): Database change is a primary delivery risk and travels in the same pipeline as application change, as the same reviewed script with one history and one audit trail; it is not a separate manual track. The pipeline classifies each change by a recorded criterion (runs longer than the team's time budget, takes locks, is environment-specific, cannot run in a transaction, needs monitoring, is irreversible, touches a table above a size the team records, or has not had its duration measured on production-shaped data (DATA_CHANGE.7)). Ordinary changes apply automatically through every environment, production included. Changes in the risky class pass an authorization stage of the same pipeline: a named, qualified group approves the production run on the exact script and a member of it triggers the stage, which runs the script with the same tooling, credential scope and audit trail as every other change (never hand-typed SQL; principle at ASSURANCE.SECURITY.6). A run started outside the pipeline is allowed only where the pipeline cannot reach the target or the job needs supervised ramping (DATA_CHANGE.8), and is then recorded in the same history. The people who manage the production database are involved beforehand and pending changes are visible across teams and environments. Configuration-like registry content travels through the same one history; an idempotent authoring script may be its source where the run is recorded in that history. Outcome: what runs in production is what was reviewed and rehearsed, and a risky change is never started by an automatic merge.

    Grounds: Database change as primary delivery risk in the same pipeline (L168; REG-087, REG-097, REG-105, REG-244, REG-245); automation of everything is safer when changes are small, fast, compatible, reversible and rolled out in stages (L290 a, L410; REG-244, REG-245, REG-255; DORA); a human gate serves reversibility and control for long, locking, irreversible changes (L290 b, L410; maintainer, REG-181), its volume condition carried per change by the criterion (a table above the recorded size, an unmeasured duration) instead of a blanket rule with no threshold; the authorization stage is a stage of the one pipeline that requires human authorization (REG-107, Fowler's deployment pipeline, fetched in review) and database change goes through automated, version-controlled scripts (REG-245, DORA, fetched in review); GitLab supports separating risky changes from the release train and a release manager's discretion over timing (REG-255), not a named-group trigger, which rests on the maintainer and the SECURITY.6 argument; the public "never manual" rule bans hand-typed SQL, not a human-triggered run of an automated script (L410); involving production-database owners and making pending changes visible (L408, consensus; REG-245); configuration-like content (L294, maintainer; L411 records no public counterpart, open). The deciding argument is that the guarantee needed is "what runs is what was reviewed" (ARTIFACT) and "a risky change does not start unwatched" (SECURITY.6 requires such a job to run under guards or from a reviewed script by a person); a risk-based gate delivers both while keeping automatic delivery for the changes it is safe for, whereas manual production for all changes adds delay and a path nobody exercises in routine, which is the failure L159 and the maintainer's own L286 give for manual change. Contradiction with L168, L159 and L156 (coverage check) is resolved: the manual lane is a gate inside the pipeline for a class (RELEASE.4), not a second track.

    Positions considered: P1 same pipeline, database change as primary risk (majority/consensus). P2 fully automated, every change through the pipeline (speed, consistency). P3 maintainer: split by risk, production applied manually by a small group (reversibility, control). P4 maintainer path: feature branch with ticket key, migration, manual test on development, pull request approved, automatic apply on development, verification on staging, release pull request approved but not merged, manual production run, then application deploy. P5 configuration-like content through the same pipeline. P6 maintainer: such content has an idempotent authoring script as source of truth, deployed by running it. P7 maintainer: document environment differences and route to a manual or conditional migration. P8 involve production-database owners, make pending changes visible.

    Rejected, each with the condition under which it would be best: P2 for the risky class: best with small, fast, compatible, reversible changes, staged rollouts and high deploy frequency; it is the default for the ordinary class. P3 as stated, production manual for every change: best where most tables exceed the recorded size, which the criterion already routes to the risky class change by change, so no separate rule is kept. P4's unmerged release approval: not a principle; it is a mechanism that keeps the mainline equal to what is applied in production, best when merging to the mainline triggers production deployment (inferred). P6 as a separate delivery truth: two paths mean two histories; best when the content is data-like, small and often re-authored, provided the run is recorded in the same history (inferred; L411 records no public counterpart, open). P7 is decided at DEPLOY.3.

    Context conditions: Data volume moves the classification: in a store where most tables exceed the recorded size, most changes fall in the risky class through the criterion, with no separate rule (L290 b, L410); criticality and table size move the gate.

    Certainty (judge record): The authorization stage inside the one pipeline is grounded (REG-107, REG-245); the named, qualified group that approves and triggers it has no public source and is inferred. Grounded for P1, P8 and the ban on hand-typed SQL (consensus, T1 and T2 sources); grounded as maintainer practice (single source) for P3 and P4; inferred for the risk-based split as the general rule, for the size criterion, and for P6 (no public counterpart).

    Maintainer decisions: MD-01 (the best practice for the node's purpose, not the average; every weaker position is kept with its winning condition); MD-03 (this branch holds the procedure; the guarantees stay in the data-integrity decision nodes).

    Final pass FL1 (cross-unit X6): the risky class passes an authorization stage of the same pipeline (a stage requiring human authorization, REG-107; database change through automated, version-controlled scripts, REG-245), so the split is a gate of the one pipeline (RELEASE.4), not a second track; this node holds the database procedure and points to the security principle for large-blast-radius jobs. FL2 (judge flag F1 closed): the volume condition is carried per change by the recorded criterion (table size above a recorded value, an unmeasured duration), so the decision does not depend on which context the maintainer's store is in. Review fixes FX1 (configuration-like content through the same one history) and FX2 (the named-group trigger rests on the maintainer and the security argument, not on public sources).

    Links and stack pointers (judge record): Realizes ASSURANCE.DATA_INTEGRITY; Related RELEASE.4, REVIEW.1 (L298), DEPLOY.1 and DEPLOY.3 (conflicts resolved), ASSURANCE.SECURITY.6.
