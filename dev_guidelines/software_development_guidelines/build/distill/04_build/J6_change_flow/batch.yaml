- op: node.create
  uid: CHANGE_FLOW.DATA_CHANGE.4
  name: Order and Compatibility With Running Code
  intent: A schema change deploys separately from and before the code that needs it, and an incompatible structural change is made as expand, migrate, contract with an owned, scheduled contract step, because old and new code run against the same data during the deploy window. An application deploy is gated on the schema version it declares and fails if the history lacks it.
  parent: CHANGE_FLOW.DATA_CHANGE
  epistemic_state: 'known | inferred: the minimum-schema-version gate as the general form (single maintainer source) and the choice among compatibility surfaces'
  constraints:
  - MUST schema change deploy before the code that needs it
  - MUST the contract step have an owner and a date
  - MUST an application deploy fail if the schema history lacks the minimum version it declares
  design_notes: |-
    Decision (judge record, final): Deploy a schema change separately from, and before, the application version that needs it; the first schema step supports both old and new versions. A backward-incompatible change (rename, type change, split, move) is made as expand, migrate, contract: add the new structure beside the old, move writers and readers, backfill, then remove the old; the contract step is scheduled and owned (an unfinished contract leaves a state worse than the start). Old and new application versions run against the same data over the deploy window, so every stored-data change is readable and writable by both. Before dropping a column or table, stop the application reading it (and any framework cache of it) and drop in a later deploy. An application deploy is gated on the schema state it needs: a declared minimum schema version is checked before rollout and the deploy fails if the target history lacks it. When a shared structure must change, old and new access patterns are supported during the transition behind a stable compatibility surface, with database access behind a clear layer in code. Outcome: schema and code can change in either order of rollout without a window of failure, and the contract step is not forgotten.

    Grounds: Schema first, supports both (L382; REG-087, REG-244, REG-245); expand, migrate, contract (L383; REG-105, REG-245, REG-257, REG-260); schedule and own the contract (L384; REG-105, REG-260); old and new on the same data (L386; REG-087, REG-105); stop reading before dropping (L419, tool-specific, generalisation inferred; REG-258); a minimum-schema-version gate (L292, maintainer; REG-087, REG-181; public sources support the order, not an explicit gate): it turns an ordering convention into a blocking check, the principle of RULES.3; compatibility layer (L409; REG-105, REG-244).

    Positions considered: P1 schema first, separate. P2 expand, migrate, contract. P3 own the contract. P4 old and new on the same data. P5 maintainer: minimum-schema-version gate. P6 stop reading before dropping. P7 compatibility layer: views or triggers (Fowler and Sadalage), a function with a signature (maintainer), versioned interfaces for remote APIs (REG-105).

    Rejected, each with the condition under which it would be best: Code and schema deployed together in one step for an incompatible change: best never in a deployment with rolling or rollback. P5 stated as a replacement for ordering: the gate checks the order, it does not substitute for it. P7 forms: views win when consumers read shape (declarative, plannable, read-only reporting with several consumers); a function interface wins when consumers are many and diverse (absorbs change; no public source, maintainer practice, L309); versioned interfaces apply to remote APIs, not to a database structure.

    Context conditions: Consumers of the shared structure (L409): their number and diversity pick the compatibility surface.

    Certainty (judge record): Grounded for P1 to P4 (consensus); grounded for P6 as a tool fact, inferred as general; inferred for P5 as the general form (single maintainer source) and for the choice among P7 forms.

    Maintainer decisions: MD-01 (the best practice for the node's purpose, not the average; every weaker position is kept with its winning condition); MD-03 (this branch holds the procedure; the guarantees stay in the data-integrity decision nodes).

    Links and stack pointers (judge record): Realizes ASSURANCE.DATA_INTEGRITY; Related ROLLBACK.2 (generic rule L163), ASSURANCE.CONTRACTS, CONSTRUCTION.HIDING (second clause of L409); stack pointer L419 (one web framework).
