    Decision (judge record, final): Every schema and data change is a reviewed, versioned, once-only script tracked in the target's history and never applied by hand-typed SQL, delivered through one pipeline with a risk-based human trigger for the risky class, ordered before and compatibly with the code, made without blocking locks, bulk work done in re-runnable bounded batches, rehearsed on production-shaped data against a time budget, and run and watched against stated signals until a convergence query says it is done. Outcome: a data change that ships was reviewed, rehearsed and watched, and what runs in production is what was reviewed.

