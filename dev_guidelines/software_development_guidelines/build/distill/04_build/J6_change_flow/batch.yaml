- op: node.create
  uid: CHANGE_FLOW.DATA_CHANGE.5
  name: Locks and Online Schema Change
  intent: The lock a statement takes is known before it runs on a shared database; migrations use a per-session lock timeout with retry, prefer the non-blocking form of each change, run non-transactional operations in their own step, and use an online schema change tool on large tables where in-place change blocks. A schema change never holds a blocking lock longer than a stated bound.
  parent: CHANGE_FLOW.DATA_CHANGE
  epistemic_state: 'known | inferred: the starvation reason for the lock timeout with retry; do-not-shard-schema-changes is maintainer practice read as consensus'
  constraints:
  - MUST the lock taken by a statement be known before a run on a shared database
  - MUST a migration set a session-level lock timeout
  - MUST a statement that cannot run in a transaction run in its own step
  design_notes: |-
    Decision (judge record, final): Know the lock a statement takes before running it on a shared database. Run migrations with a per-session lock timeout (not set globally) and retry on timeout so a blocked statement does not queue and starve the table; prefer the non-blocking form of each change (add a constraint unvalidated then validate separately, build indexes concurrently, add columns without volatile defaults, request metadata-only or in-place algorithms with an explicit no-lock clause); run operations that cannot execute in a transaction in their own non-transactional step; for large tables where in-place change blocks, use an online schema change tool that copies and swaps, chosen by write rate (log-based and pausable on high-write masters, trigger-based when simpler and writes are light, native when the operation is metadata-only). Do not shard schema changes: use the platform's concurrent variant in a manual migration and shard only data changes. Outcome: a schema change never holds a lock that blocks the database longer than a stated bound.

    Grounds: Know the lock (L392, consensus; REG-246, REG-247, REG-249); lock timeout and retry (L393, majority; REG-246, REG-248, REG-255); non-blocking forms (L394, consensus; REG-247, REG-249, REG-258, REG-259); separate non-transactional step (L395, consensus; REG-255, REG-258); online schema change tools (L397, majority; REG-245, REG-246, REG-249, REG-256); do not shard schema changes (L304; maintainer, consensus per row; REG-181).

    Positions considered: P1 know the lock. P2 session lock timeout and retry. P3 non-blocking forms. P4 non-transactional step apart. P5 online schema change tool: trigger-based, log-based, native. P6 do not shard schema changes.

    Rejected, each with the condition under which it would be best: A global lock timeout: affects unrelated sessions; best never for migrations. A trigger-based tool on a high-write master: adds write overhead and cannot pause; best when writes are light and simplicity wins. In-place change on a large table where it blocks: best never.

    Context conditions: Table size and write rate, and whether the operation is metadata-only (L397).

    Certainty (judge record): Grounded for P1, P3, P4 (consensus); grounded for P2 and P5 (majority; the starvation reason is inferred); P6 maintainer practice read as consensus.

    Maintainer decisions: MD-01 (the best practice for the node's purpose, not the average; every weaker position is kept with its winning condition); MD-03 (this branch holds the procedure; the guarantees stay in the data-integrity decision nodes).

    Links and stack pointers (judge record): Related DATA_CHANGE.6 (sharding applies to data changes only); stack pointers L392 to L397, L304 (Postgres, MySQL names).
