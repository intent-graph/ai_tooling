- op: node.create
  uid: CHANGE_FLOW.ROLLBACK.3
  name: Undoing a Data Change
  intent: 'Before a data or schema change ships its undo is decided and recorded: leave a backward-compatible expand step and roll the application back, carry a rehearsed written reverse where script reversal is faster than a restore, or otherwise roll forward or use the tested restore. A change that can lose data is undone only by tested restore, and the last reversible point is named.'
  parent: CHANGE_FLOW.ROLLBACK
  epistemic_state: 'known | inferred: the choice among undo forms and the faster-than-restore condition; forward-only with a prepared undo is single-source maintainer practice generalised'
  constraints:
  - MUST every data change record its undo before it ships
  - MUST the last reversible point be named
  - MUST a destructive change rely on a tested restore
  design_notes: |-
    Decision (judge record, final): Before a data or schema change ships, its undo is decided and recorded in the change: a backward-compatible expand step is undone by rolling the application back and leaving the structure; a change whose reversal by script is faster than a restore (a data correction on few rows with its prior values saved, a metadata-only change) carries a written reverse prepared ahead and rehearsed with the forward script (DATA_CHANGE.7); a reverse that was not rehearsed does not count as the undo; otherwise the recorded undo is a roll-forward fix or the tested restore; a change that destroys or can lose data is undone by the tested restore of ASSURANCE.DATA_INTEGRITY.3. The last reversible point is named: the state before the old structure is removed and before reads move irreversibly; after new-only data accumulates, going back loses it. Outcome: no data change ships without a known, tested way back or an honest statement that there is none.

    Grounds: Reverse for every migration versus compatibility plus roll-forward plus restore (L387; REG-244, REG-251, REG-252, REG-255); the maintainer's forward-only with a prepared undo (L288, L387 c; REG-181); last reversible point (L390; REG-087, REG-260). The strongest argument is that an automatic undo is untested code that cannot restore lost data and hides data loss, while a prepared, documented undo and a tested restore are exercised and honest; DATA_INTEGRITY.3 (settled) already treats a destructive change as undone by restore only.

    Positions considered: P1 written reverse for every migration (reversibility, downgrade after a vulnerability). P2 compatibility plus roll-forward plus restore (cost of ownership, honesty). P3 maintainer: forward-only with documented undo prepared ahead. P4 last reversible point.

    Rejected, each with the condition under which it would be best: P1 as the default: best for regulated or packaged software with many installed versions, where a customer must downgrade (DISTRIBUTION). Automatic down migrations as the common alternative: best for pure schema changes with no data to lose, where one command reverses; best never for a change that loses data. A written reverse for every change: reverse migrations are not worth writing all the time (REG-244) and work poorly for data changes (REG-251); best for packaged software with many installed versions (DISTRIBUTION).

    Context conditions: Distribution (L387): packaged software with many installed versions needs a written reverse for every migration; a continuously deployed service with one production uses the decision as stated.

    Certainty (judge record): Grounded for P2 and P4 (majority, several sources); inferred for P3 as the general form (maintainer practice, single source); the choice among undo forms is inferred, and so is the faster-than-restore condition.

    Maintainer decisions: MD-01 (the best practice for the node's purpose, not the average; every weaker position is kept with its winning condition); MD-03 (this node holds the undo procedure; the guarantee that a destructive change is undone by tested restore stays in the data-integrity decision).

    Final pass FL4: reversible-form clause replaced (script reversal faster than a restore, written reverse rehearsed with the forward script; an unrehearsed reverse does not count); rejection added of a written reverse for every change (REG-244, REG-251; best for packaged software with many installed versions); the faster-than-restore condition is inferred.

    Links and stack pointers (judge record): Realizes ASSURANCE.DATA_INTEGRITY; Conflicts none (L288 versus L162 resolved at ROLLBACK.1); Related DATA_CHANGE.4.
  impl_pointers:
  - build/distill/03_judge/J6_change_flow/judged.md::CHANGE_FLOW.ROLLBACK.3
  - build/research/07_maintainer_doctrine/result.md::MAINT-C24
  - build/research/10_data_change/result.md::DATA-C10
  - build/research/10_data_change/result.md::DATA-C13
