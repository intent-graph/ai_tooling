- op: node.create
  uid: OWNERSHIP.LIFECYCLE.4
  name: Channels, Mirrors and Supply-Chain Integrity
  intent: Artifacts are obtained only through controlled, trusted channels with lock and hashes, with an internal mirror for larger, regulated or production-critical contexts. The supply chain of the team's own tooling and build tools is pinned, vetted and changed only through audited change management, and publishing and developer accounts are protected by multi-factor authentication.
  parent: OWNERSHIP.LIFECYCLE
  epistemic_state: 'known | inferred: the tooling pinning rule and the account-protection scope beyond the cited sources'
  constraints:
  - Artifacts MUST be obtained only through controlled, trusted channels, with lock and hashes.
  - Provenance verification MUST be applied recursively, and a removed upstream MUST be addressed separately by a mirror, cache or vendored copy.
  - Any artifact whose binary provenance cannot be confirmed MUST be rebuilt from verified source (the single statement of the rebuild rule); every deployed open-source artifact MUST be rebuilt from source in the team's own infrastructure for critical infrastructure or supply-chain-targeted organisations.
  - The automation's own tools, plugins and descriptors, and build tools and compilers, MUST be pinned, vetted, changed only through audited change management, not auto-updated without review, and kept on versions that still receive security fixes.
  - Two-factor authentication MUST protect publishing accounts of any registry, and phishing-resistant multi-factor authentication MUST protect developer accounts after compromises.
  design_notes: |-
    Ledger rows: L062, L064, L065, L076, L1074, L1243, L1545, L263.
    Decision (judge record, in full): Obtain artifacts only through controlled, trusted channels (authenticity checks are in `SELECTION.5`), with lock and hashes. Add an internal repository or mirror of sanctioned components in larger or regulated organisations and for production-critical builds, which also covers upstream unavailability; a small team may pull from the public registry with lock and hashes. Apply provenance verification recursively and address a removed upstream separately by a mirror, cache or vendored copy. Rebuild every deployed open-source artifact from source in the team's own infrastructure only for critical infrastructure or supply-chain-targeted organisations, and rebuild from verified source any artifact whose binary provenance cannot be confirmed (this is the single statement of the rebuild rule). The automation's own tools, plugins and descriptors, and build tools and compilers, are pinned, vetted, changed only through audited change management and not auto-updated without review, while staying on versions that still receive security fixes. Two-factor authentication protects publishing accounts of any registry, and phishing-resistant multi-factor authentication protects developer accounts after compromises. Outcome: the supply chain of what is shipped, and of what builds it, is controlled and recoverable.
    Grounds: L062 (REG-004, REG-031, REG-032, REG-035, REG-037) and L1243 (consensus; REG-025): the two channel modes are each best under an organisation-size condition. L064 (consensus; REG-022, REG-023). L065 (REG-031, REG-032, REG-035, REG-037): large engineering effort, so conditional. L076 (majority; REG-022, REG-035, REG-037). L1074 (majority; REG-1034, REG-1037; pinning rule inferred), L263 (majority; REG-004, REG-014, REG-178; the pinned versus up-to-date tension is inferred). L1545 (consensus; REG-1557, REG-1556, REG-1562, REG-1558; JavaScript guideline).
    Positions considered: P1 (a) controlled channel with mirror (control, availability); (b) direct with lock and hashes (cost). P2 (a) rebuild everything (security, control); (b) prebuilt verified artifacts (cost). P3 provenance is recursive and does not address removal. P4 (a) cache, mirror or vendor (availability); (b) immutable public proxy (cost). P5 own tooling pinned. P6 publishing-account protection. P7 build tools pinned and changed under change management.
    Rejected, with the condition under which each would be best: P1b for larger or regulated organisations and production-critical builds; P2a for everyone else (large effort); P4b where the registry does guarantee immutability and builds are not production-critical.
    Context conditions: ORGANISATION_SIZE_AND_CRITICALITY (above).
    Certainty (judge record): grounded for the channel rule and P3; inferred for the tooling pinning rule and the account-protection scope beyond the cited sources.
    Applied after judging: R07 (rebuild rule stated once here).
    Binding: MD-01 (the best practice for the purpose, not the average), MD-02 (outcomes, whoever does the work).
