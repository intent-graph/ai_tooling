- op: node.create
  uid: OWNERSHIP.SELECTION.5
  name: Authenticity, Provenance and Known Vulnerabilities at Adoption
  intent: 'Before adoption, what is adopted is verified to be the thing that was vetted: no known unfixed vulnerability for the intended deployment, authentic source and name, and provenance per component. Provenance is required for high-criticality use and is a preferred selection signal elsewhere.'
  parent: OWNERSHIP.SELECTION
  epistemic_state: 'known | inferred: the claim that ecosystem coverage of provenance is partial'
  constraints:
  - A candidate whose current version has known unfixed vulnerabilities for the intended deployment MUST be rejected or deferred.
  - 'Authenticity MUST be verified: official source over a secure link, signatures where available, the name checked against look-alikes and compromised forks, and a generated or suggested name resolved to the intended vetted package.'
  - Provenance (bill of materials, source composition, signatures) MUST be obtained for high-criticality use, and integrity checks applied.
  - Where binary provenance cannot be confirmed, the rebuild rule of LIFECYCLE.4 MUST apply.
  design_notes: |-
    Ledger rows: L010, L012, L013, L1056, L1541.
    Decision (judge record, in full): Before adoption, reject or defer a candidate whose current version has known unfixed vulnerabilities for the intended deployment; verify authenticity (official source over a secure link, signed packages where available, the name checked against look-alikes and compromised forks, and, for a name that was generated or suggested, that it resolves to the intended vetted package); and obtain provenance per component (SBOM, source composition, signatures, signed releases, hosting-platform protections) and apply integrity checks. Provenance is required for high-criticality use; elsewhere it is a preferred selection signal. Where binary provenance cannot be confirmed, the rebuild rule of `LIFECYCLE.4` applies. Outcome: what is adopted is the thing that was vetted.
    Grounds: L010 (consensus; REG-001, REG-003, REG-004, REG-005), L012 (REG-001, REG-003, REG-004, REG-005, REG-025), L1056 (majority; REG-1035, REG-1045), L1541 (JavaScript guideline, three T1 sources REG-1555, REG-003, REG-1556): no competing position. L013 (majority; REG-001, REG-004, REG-035): (a) require for all (security; best for high criticality) and (b) preferred signal (cost; ecosystem coverage partial, inferred) are each stated with a condition.
    Positions considered: P1 reject known unfixed vulnerabilities. P2 verify authenticity and name resolution. P3 (a) require provenance (security); (b) preferred signal (cost).
    Rejected, with the condition under which each would be best: requiring provenance for every component: best only at high criticality, because ecosystem coverage is partial.
    Context conditions: criticality moves provenance from preferred to required (above).
    Certainty (judge record): grounded for P1 and P2; inferred for the ecosystem-coverage claim.
    Applied after judging: R07 (rebuild rule held once in LIFECYCLE.4).
    Binding: MD-01 (the best practice for the purpose, not the average), MD-02 (outcomes, whoever does the work).
