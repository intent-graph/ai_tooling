- op: node.create
  uid: OWNERSHIP.LICENCE.3
  name: Network Copyleft and Separate Components
  intent: Network-copyleft code is decided separately from other copyleft, since modifying it and letting users interact with it over a network triggers a source offer, and it is never accepted by default. A copyleft service run as a separate network component is a different question from linking it, settled by the interface and, where the boundary matters, by legal review.
  parent: OWNERSHIP.LICENCE
  epistemic_state: 'known | gap: applying the interface test to a given case rests with legal review'
  constraints:
  - Network-copyleft code MUST be decided separately from other copyleft and MUST NOT be accepted by default.
  - A separate-component claim MUST NOT be assumed; where the boundary matters it MUST be settled with legal review.
  design_notes: |-
    Ledger rows: L374, L375.
    Decision (judge record, in full): Decide network-copyleft code (AGPL) separately from GPL: modifying it and letting users interact with it over a network triggers a source offer. Treat an unmodified copyleft service run as a separate network component as a different question from linking it into the program: the question is the interface, not the proximity, and is settled with legal review where the boundary matters. Pipes, sockets and command-line arguments are normally communication between separate programs, while intimate exchange of complex internal data structures may make one combined work (REG-188). Outcome: network copyleft is never accepted by default and a separate-component claim is never assumed.
    Grounds: L374 (majority; REG-188, REG-189, REG-210). L375 (REG-188, fetched at review: pipes, sockets and command-line arguments are normally between separate programs; intimate exchange of complex internal data structures may make one combined work; grounded in part).
    Positions considered: P1 AGPL special case. P2 separate component differs from linking.
    Rejected, with the condition under which each would be best: none competing.
    Context conditions: none.
    Certainty (judge record): grounded for P1; grounded in part for P2 (the interface test by REG-188), the application to a given case stays with legal review.
    Applied after judging: R06 (interface test grounded in part), F4 settled.
    Binding: MD-01 (the best practice for the purpose, not the average), MD-02 (outcomes, whoever does the work).
  examples:
  - Pipes, sockets and command-line arguments are normally communication between separate programs; intimate exchange of complex internal data structures may make one combined work.
