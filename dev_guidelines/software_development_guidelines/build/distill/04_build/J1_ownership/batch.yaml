- op: node.create
  uid: OWNERSHIP.CONTAINMENT.2
  name: Adapter Between Code and Dependency
  intent: A thin wrapper holding only what the project needs separates the code from a dependency or external system when substitution is plausible or the dependency is volatile, security-sensitive, single-vendor or modelled differently from the domain; none is built for a stable standard interface. The team's own data and public interfaces are keyed on its own identifiers and types, so a swap or a vendor change touches one place.
  parent: OWNERSHIP.CONTAINMENT
  epistemic_state: 'known | inferred: the identifier rule'
  constraints:
  - Where a wrapper exists, a vendor type MUST NOT cross the team's public interface (inferred).
  - External types and parsing of the external payload MUST stay inside the wrapper, in one place.
  - A vendor's identifier MUST be stored only as an attribute of the team's entity that refers out, never as the key of the team's data or as a type in its public interface.
  design_notes: |-
    Ledger rows: L035, L068, L342, L344, L345.
    Decision (judge record, in full): Put a thin wrapper, containing only what the project needs, between the code and a dependency or external system when substitution is plausible, or the dependency is volatile, security-sensitive or single-vendor, or its model differs from the domain (an anti-corruption layer that keeps business rules out); a rented service reached through a proprietary interface falls under these conditions, while a backing service reached through a stable standard interface (SQL, SMTP) is an attached resource (`CONTAINMENT.3`) and gets no wrapper of its own. Keep external types and parsing of the external payload inside the wrapper, in one place. Use a stable standard interface directly when switching is unlikely and the dependency is core. Key the team's own data and public interfaces on its own identifiers and types: a vendor's identifier is stored only as an attribute of the team's entity that refers out (that attribute is the mapping the team owns), never as the key of the team's data or as a type in its public interface. Outcome: a swap or a vendor change touches one place.
    Grounds: L068 (REG-012, REG-026, REG-034, REG-039): wrap wins for volatile, security-sensitive or single-vendor and external services; not wrapping wins when switching probability is low and the interface standard (REG-026, REG-034: speculative abstraction costs). L344 (REG-026, REG-186): same condition for the domain-versus-foreign-model case. L035 (T4 plus one T2, inferred), L342 (majority; REG-186, REG-208), L345 (inferred, no source states it as a rule). Final pass: L068's own condition (not wrapping wins for a stable, standard interface); REG-186 fetched in review ("might not be suitable when ... no significant semantic differences"); L343 for attached resources. REG-186 states translation at the boundary, not a storage rule; the defensible core is that the foreign model stays out of the team's keys and interfaces, while storing an external reference is unavoidable and is itself the owned mapping.
    Positions considered: P1 (a) wrap, keep exit path; (b) use directly for speed. P2 (a) wrap; (b) do not wrap. P3 (a) mandatory anti-corruption layer; (b) call directly. P4 one boundary object for parsing. P5 no vendor types in own data without a mapping.
    Rejected, with the condition under which each would be best: the layer as mandatory for every dependency: it adds latency and something to operate, and is best for multi-stage migrations, differing semantics, critical-path or uncertain vendors; direct use best when the service is core, stable and switching unlikely.
    Context conditions: SWITCH_PROBABILITY_AND_VOLATILITY (above).
    Certainty (judge record): grounded for the conditional wrap decision; inferred for the identifier rule (P5).
    Applied after judging: R08, R19 and F5 (conditions and identifier rule; constraint added).
    Binding: MD-01 (the best practice for the purpose, not the average), MD-02 (outcomes, whoever does the work).
  examples:
  - 'Stable standard interfaces that need no wrapper of their own: SQL, SMTP.'
