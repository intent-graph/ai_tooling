- op: node.create
  uid: OWNERSHIP.SERVICES.5
  name: Vendor Assessment
  intent: A vendor's security and supply-chain posture is assessed before depending on it, to a depth that scales with criticality and data sensitivity, and repeated through the contract life. Third-party assurance reports are evidence of controls, not proof of fit, and non-library tools and platforms are evaluated with the same criteria.
  parent: OWNERSHIP.SERVICES
  epistemic_state: 'known | inferred: the scaling of depth | gap: the reading of assurance reports (L365) and the same-criteria rule for tools (L378) have no source'
  constraints:
  - A vendor's posture (authentication options, intrusion evidence with logs retained at least six months, bill of materials and open-source governance, vulnerability disclosure policy and CVE practice, patch support) MUST be assessed before depending on it.
  - The assessment MUST be repeated through the contract life, not only at selection.
  - A small team without capacity to triage MUST use the uniform baseline checklist for every vendor.
  design_notes: |-
    Ledger rows: L363, L364, L365, L378.
    Decision (judge record, in full): Assess a vendor's security and supply-chain posture before depending on it (authentication options, evidence of intrusion with logs retained at least six months, SBOM and open-source governance, vulnerability disclosure policy and CVE practice, patch support). Scale the depth to criticality and data sensitivity and repeat it through the contract life, not only at selection; a small team without capacity to triage uses the uniform baseline checklist for every vendor. Treat third-party assurance reports (SOC 2, ISO/IEC 27001) as evidence of a vendor's controls, not proof of fit: read scope, period and exceptions (inferred, L365 has no source). Evaluate non-library tools and platforms (dev tools, CI service, hosting) with the same criteria as services (inferred, composed, L378). Outcome: the vendor's posture is known and re-checked, to the depth the damage would justify.
    Grounds: Final pass: the two inline-marked sentences each follow from a grounded rule of this node (the SLA is a commercial instrument; CI and hosting are supply chain, `SERVICES.6`) but none is sourced. L363 (consensus; REG-194, REG-196, REG-199), L364 (REG-196, REG-199; lifecycle grounded, scaling inferred), L365 (open, not assessable, no source id), L378 (open, composed; REG-086, REG-195, REG-200).
    Positions considered: P1 baseline posture. P2 (a) depth by criticality (speed, cost); (b) uniform baseline (simplicity, fairness). P3 reports are evidence. P4 same criteria for tools and platforms.
    Rejected, with the condition under which each would be best: P2b as a general rule: best for small teams without capacity to triage; P2a best when vendors are many and most low-risk.
    Context conditions: CRITICALITY_AND_DATA_SENSITIVITY (above).
    Certainty (judge record): grounded for P1; inferred for P2's scaling; open for P3 and P4 (no source, composed).
    Applied after judging: R15 (two sentences marked inferred).
    Binding: MD-01 (the best practice for the purpose, not the average), MD-02 (outcomes, whoever does the work).
