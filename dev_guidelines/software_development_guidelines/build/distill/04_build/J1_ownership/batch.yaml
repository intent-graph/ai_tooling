  epistemic_state: 'known | inferred: the release-age cooldown and the range-edge testing for library consumers'
  constraints:
  - No adopted artifact MUST be installed from anything but the lock.
  design_notes: |-
    Rolled-up decision (judge record): every environment gets the same verified artifacts from a complete manifest and a lock; versions are constrained according to whether the artifact is a deployable or a library; updates are frequent, small, tested and automated with security fixes urgent; artifacts come through controlled channels with an answer to upstream disappearance; the team knows what it depends on and watches it until end of life.
    Certainty (judge record): grounded (consensus rows), with the cooldown and the range-edge testing for library consumers inferred.
