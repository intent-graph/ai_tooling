# J1_ownership: nodes of the OWNERSHIP branch below the L1 node (6 L2 and 29 L3) and the intra-unit links.
operations:
- op: node.create
  uid: OWNERSHIP.STANCE
  name: Necessity and Default Stance
  intent: 'The default is not to add: a dependency or layer enters only when a stated reason outweighs its lasting cost, and each need is decided between writing, adopting and renting on coreness, security criticality and size. Carried code stays tied to its origin, and design effort goes to today''s need except where a structural choice is costly to reverse.'
  parent: OWNERSHIP
  epistemic_state: 'known | inferred: the reconciliation of build-for-today with probable use (STANCE.4)'
  constraints:
  - No dependency or layer MUST be added without a recorded reason.
  design_notes: |-
    Rolled-up decision (judge record): the default is not to add; a dependency or layer is added when a stated reason outweighs its lasting cost; write, adopt or rent is decided per need on coreness, security criticality and size; carried code stays tied to its origin; build for today's need and make change cheap, except where a structural choice is costly to reverse.
    Certainty (judge record): grounded for the cost-of-ownership default; inferred for the reconciliation on `STANCE.4`.
    Roll-up of its children; it states no fact of its own (MD-03).
    Binding: MD-01 (the best practice for the purpose, not the average), MD-02 (outcomes, whoever does the work).
  impl_pointers:
  - build/distill/03_judge/J1_ownership/judged.md::OWNERSHIP.STANCE
