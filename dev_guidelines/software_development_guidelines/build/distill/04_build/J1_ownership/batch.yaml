  - Each component MUST be confirmed maintained and not at end of life, and a plan MUST exist for components that stop being maintained.
  - Where law applies, due diligence on third-party components, an inventory and reporting of component vulnerabilities to their maintainers MUST be done.
  design_notes: |-
    Ledger rows: L009, L066, L067, L079, L1242.
    Decision (judge record, in full): Keep a machine-generated inventory (SBOM, direct and transitive, and where each is deployed) and scan it continuously against vulnerability databases for as long as the software is in service, with a triage and update plan. For each component confirm it is maintained and not at end of life and keep a plan for components that stop being maintained. Where law applies (for example the EU Cyber Resilience Act), due diligence on third-party components, an SBOM and reporting component vulnerabilities to their maintainers are duties, not options. Outcome: a disclosed flaw or an abandonment maps to the systems affected in hours, not days.
