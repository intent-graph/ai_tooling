- op: node.create
  uid: OWNERSHIP.LICENCE.1
  name: Reading and Classifying Licences
  intent: Before adoption a dependency's licence is checked as present, clear and acceptable for the intended use, and classified by licence family and by the team's distribution model, because obligations are triggered by what is done with the code (ship, link, modify, run as a service). Compatibility is directional and pair-specific, and a source-available licence with a field-of-use restriction is not open source.
  parent: OWNERSHIP.LICENCE
  epistemic_state: known
  constraints:
  - The licence MUST be present, clear and acceptable for the intended use before adoption.
  - A dependency MUST be classified by licence family and by the team's distribution model.
  - Licence variants (the 'or later' forms, exceptions) MUST be stated with standard machine-readable licence expressions.
  - A source-available licence with a field-of-use restriction MUST NOT be treated as open source.
  design_notes: |-
    Ledger rows: L036, L362, L370, L371, L372.
    Decision (judge record, in full): Before adoption, check that the licence is present, clear and acceptable for the intended use, and classify the dependency by licence family and by the team's distribution model, because obligations are triggered by what is done with the code (ship, link, modify, run as a service). Treat compatibility as directional and pair-specific, distinguish the "or later" variants and exceptions and state them with SPDX expressions, and do not treat a source-available licence with a field-of-use restriction as open source. Outcome: no dependency's obligations surprise the team after use.
    Grounds: L036 (consensus; REG-001, REG-003, REG-012, REG-017), L370 (consensus; REG-188, REG-189, REG-210), L371 (consensus; REG-188, REG-202; the FSF list could not be fetched), L372 (consensus; REG-191), L362 (consensus on the OSI definition, application to a named licence inferred; REG-190, REG-212). No competing position.
    Positions considered: P1 present and acceptable. P2 obligations by use. P3 directional compatibility. P4 "or later" variants and SPDX. P5 source-available is not open source.
    Rejected, with the condition under which each would be best: none competing.
    Context conditions: DISTRIBUTION_MODEL is the input of the classification itself, not a condition on the decision.
    Certainty (judge record): grounded; compatibility analysis itself is not covered by L036 and relies on L371.
    Binding: MD-01 (the best practice for the purpose, not the average), MD-02 (outcomes, whoever does the work).
