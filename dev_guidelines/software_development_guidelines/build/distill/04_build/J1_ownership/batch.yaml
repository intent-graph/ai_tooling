- op: node.create
  uid: OWNERSHIP.LIFECYCLE.2
  name: Version Constraints and Resolution
  intent: Deployables nobody else installs pin all dependencies exactly with an update bot, while libraries declare ranges and test the range edges; a lock never replaces constraints. A version number is an estimate of compatibility and tests are the evidence, so the installed set equals the tested set whichever resolution rule the ecosystem applies.
  parent: OWNERSHIP.LIFECYCLE
  epistemic_state: 'known | inferred: the testing of both range edges and the neutrality toward the resolution rule'
  constraints:
  - Applications and services nobody else installs MUST pin all dependency types exactly, each bump being a reviewable change.
  - Libraries MUST declare ranges and MUST test the lowest and newest versions their ranges admit in their own CI.
  - The manifest range MUST still exclude known-broken versions.
  - A version MUST change only through an explicit, reviewable change to the lock.
  design_notes: |-
    Ledger rows: L047, L049, L050, L051, L059, L061.
    Decision (judge record, in full): Applications and services nobody else installs pin all dependency types exactly (with an update bot so each bump is a reviewable change); libraries consumed by others declare ranges and test the range edges in their own CI; a lock never replaces constraints, so the manifest range still excludes known-broken versions. Treat a version number as an estimate of compatibility and tests as the evidence (Hyrum's Law): trust the range more as the API is narrow and well declared. The guarantee does not depend on the resolution rule: whichever rule the ecosystem's tool applies, a version changes only through an explicit, reviewable change to the lock. The rule matters only where ranges are resolved without the team's lock, that is for a library's consumers: there the library tests both the lowest and the newest versions its ranges admit, so a consumer resolving by either rule (minimal version selection or newest compatible) gets a tested set. A diamond conflict is resolved by moving versions forward or backward or patching locally. Outcome: the installed set equals the tested set and drift is visible.
    Grounds: L049 (majority; REG-001, REG-028, REG-031): the lock-only alternative only delays a bad range (REG-028). L050 (majority; REG-011, REG-028): exact pins in libraries are defended by no source (open). L051 (consensus; REG-028). L059 (REG-011, REG-030): (b) is the stronger argument and (a) stays as a condition. L047 (REG-011, REG-028, REG-031, REG-037; both resolution rules, each with its condition), L061 (consensus; REG-011); the resolution-rule neutrality follows from L047, L049 and L051 and from the node's own test of the range edges.
    Positions considered: P1 (a) minimal version selection (correctness); (b) newest-compatible plus lock (speed). P2 (a) exact pins plus bot (confidence, security); (b) ranges plus lock (low noise). P3 libraries declare ranges. P4 lock does not replace constraints. P5 (a) SemVer is a usable contract (speed); (b) SemVer is an estimate, tests the evidence. P6 diamond resolution.
    Rejected, with the condition under which each would be best: P2b: best when review capacity is scarce, but it only delays a bad range. P5a: best when the API is narrow and well declared, stated as the condition. Exact pins in libraries: no source defends it. Ranking the two resolution rules: the rule comes with the ecosystem, not from the team, and testing both range edges makes either safe.
    Context conditions: ARTIFACT_KIND (deployable versus library) moves pin versus range.
    Certainty (judge record): grounded for pins, ranges and L051; inferred for the test-the-edges half and for the resolution-rule neutrality (the lock, not the rule, carries the guarantee).
    Stack pointers: L047 (Go MVS), L049 (npm).
    Applied after judging: R10 and F6 (resolution-rule neutrality, ranking of the two rules rejected).
    Binding: MD-01 (the best practice for the purpose, not the average), MD-02 (outcomes, whoever does the work).
  impl_pointers:
