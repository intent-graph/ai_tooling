- op: node.create
  uid: OWNERSHIP.CONTAINMENT.1
  name: How Much Reversibility to Buy
  intent: 'Lock-in is a spectrum priced by the cost and the likelihood of switching: it is accepted when it buys a commensurate pay-off, and switching cost is reduced only to where insurance is cheaper than the expected loss. A rented service gets an exit path defined before adoption in proportion to its criticality, and a tested exit where regulation or a critical function requires it.'
  parent: OWNERSHIP.CONTAINMENT
  epistemic_state: 'known | inferred: the proportionality of the exit requirement (the EU exit-strategy requirement is known only from summaries)'
  constraints:
  - The exit path of a rented service (data export, replacement candidate, contract notice) MUST be defined before adopting it, in proportion to its criticality.
  - A tested exit and an alternative MUST be required where regulation requires them and for critical functions, where the expected loss of being unable to leave exceeds the cost of testing the exit.
  design_notes: |-
    Ledger rows: L073, L074, L075, L078.
    Decision (judge record, in full): Treat lock-in as a spectrum and price it by two quantities, the cost of switching and the likelihood of switching: accept lock-in when it buys a commensurate pay-off and reduce switching cost only to where the insurance is cheaper than the expected loss; portability beyond that point raises total cost. For a rented service define the exit path (data export, replacement candidate, contract notice) before adopting it, in proportion to its criticality, and require a tested exit and an alternative where regulation requires them (for example EU financial entities; primary text not read) and for critical functions, where the expected loss of being unable to leave exceeds the cost of testing the exit (inferred from the pricing rule above). Outcome: exit risk is a priced, recorded choice.
    Grounds: L073 (majority; REG-011, REG-012, REG-026), L074 (REG-026), L075 (REG-012, REG-026, REG-039, REG-187, REG-216): (a) accept priced lock-in wins when switching likelihood is low and unique utility high; (b) minimise wins for long-lived systems and critical services; (c) a tested exit wins for regulated and critical functions: one rule with the likelihood and criticality as its condition. L078 (inferred, not assessable; REG-004, REG-026).
    Positions considered: P1 spectrum. P2 two quantities. P3 (a) accept priced lock-in; (b) minimise by wrapping and open standards; (c) tested exit for regulated and critical. P4 exit path before adopting.
    Rejected, with the condition under which each would be best: minimise portability everywhere (elaborate multi-cloud forfeits the platform and creates new lock-in, REG-026); best for long-lived or regulated systems and critical rented services.
    Context conditions: SWITCHING_LIKELIHOOD_AND_REGULATION (above).
    Certainty (judge record): grounded for P1 to P3; inferred for P4's proportionality (the EU exit-strategy requirement is known only from summaries).
    Applied after judging: R16 (tested exit by expected loss versus test cost).
    Binding: MD-01 (the best practice for the purpose, not the average), MD-02 (outcomes, whoever does the work).
  examples:
