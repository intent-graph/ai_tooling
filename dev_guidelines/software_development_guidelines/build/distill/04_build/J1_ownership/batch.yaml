- op: node.create
  uid: OWNERSHIP.SELECTION.4
  name: Dependency Weight
  intent: 'The weight a candidate drags in is part of its cost: transitive dependencies, tiny packages and the concentration of maintainer accounts on its registry. Trivial functionality is inlined, and a small package is taken when it carries non-trivial, tested behaviour.'
  parent: OWNERSHIP.SELECTION
  epistemic_state: 'known | inferred: generalisation beyond the evidence of one ecosystem (L021, L022)'
  constraints:
  - Transitive dependencies MUST be counted as part of a candidate's cost.
  - Trivial functionality the team can own in a few lines MUST be inlined instead of taken as a package.
  - The registry's maintainer-account concentration MUST be counted as part of the exposure.
  design_notes: |-
    Ledger rows: L020, L021, L022.
    Decision (judge record, in full): Count transitive dependencies as part of the cost and prefer candidates with few unnecessary indirect ones. Inline trivial functionality the team can own in a few lines instead of taking a package for it; take a small package when it carries non-trivial, tested behaviour. Count the registry's maintainer-account concentration as part of the exposure. Outcome: the trust surface of a selection is measured, not assumed.
    Grounds: L020 (consensus; REG-003, REG-012, REG-018, REG-019). L021 (Kula et al., Pike; REG-018, REG-019, REG-020): the case for avoiding trivial packages rests on supply-chain exposure evidence; the counter (reuse and tested readability) is open, not read in a source. L022 (npm evidence; REG-003, REG-005, REG-018): the registry-wide principle is inferred.
    Positions considered: P1 count transitive. P2 (a) avoid or inline trivial packages (control, security, cost); (b) small shared packages (reuse, speed). P3 registry concentration.
    Rejected, with the condition under which each would be best: P2b: best where reuse of a tested small package avoids a real error risk (cryptographic or parsing helpers), but no source argues it as a rule.
    Context conditions: none.
    Certainty (judge record): grounded for P1; inferred for generalisation beyond the npm evidence (L021, L022).
    Stack pointers: L021, L022 (npm evidence, generalisable).
    Binding: MD-01 (the best practice for the purpose, not the average), MD-02 (outcomes, whoever does the work).
