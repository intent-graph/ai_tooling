- op: node.create
  uid: OWNERSHIP.LIFECYCLE.1
  name: Declare and Lock
  intent: Every dependency is declared completely and exactly in a manifest, and a committed lock records the exact resolved tree with artifact hashes. Every environment installs the same artifacts, so what runs is what was tested.
  parent: OWNERSHIP.LIFECYCLE
  epistemic_state: known
  constraints:
  - Dependencies MUST be declared completely and exactly in a manifest and run in an isolated environment, never relying on implicitly installed packages.
  - A lock recording the exact resolved tree, direct and transitive, MUST be committed.
  - CI and production MUST install from the lock only, and the build MUST fail when lock and manifest disagree.
  - Artifacts MUST be verified by a cryptographic hash recorded in the lock, covering transitive dependencies; a require-hashes mode MUST be used in deploys where the tool supports it.
  - A new developer MUST need only the runtime, the dependency manager and one command.
  design_notes: |-
    Ledger rows: L043, L044, L045, L046, L1241.
    Decision (judge record, in full): Declare all dependencies completely and exactly in a manifest and run in an isolated environment, never relying on implicitly installed packages. Commit a lock recording the exact resolved tree, direct and transitive; install in CI and production from the lock only and fail when lock and manifest disagree; verify artifacts by a cryptographic hash recorded in the lock, covering transitive dependencies, with a require-hashes mode in deploys where the tool supports it. Outcome: what runs is what was tested, on every machine.
    Grounds: L043 (consensus; REG-014), L044 (consensus; REG-031, REG-037), L045 (REG-028, REG-031; the guarantee is grounded, the generalisation inferred), L046 and L1241 (REG-025, REG-031, REG-032, REG-037, REG-1135). No competing position in any row.
    Positions considered: P1 complete manifest. P2 committed lock. P3 install from lock only. P4 hash verification.
    Rejected, with the condition under which each would be best: none competing.
    Context conditions: none.
    Certainty (judge record): grounded.
    Stack pointers: named tools in L043 to L046.
    Binding: MD-01 (the best practice for the purpose, not the average), MD-02 (outcomes, whoever does the work).
