- op: node.create
  uid: OWNERSHIP.SELECTION.6
  name: Vetting Depth and Delegated Audit
  intent: Hands-on vetting depth scales with criticality and exposure, risk being judged as cost times probability of each bad outcome. Low-criticality replaceable parts get metadata and score checks; components handling untrusted input, credentials or cryptography get tests, sandboxed behaviour checks and code review; audits by trusted organisations are reused and only version differences reviewed.
  parent: OWNERSHIP.SELECTION
  epistemic_state: 'inferred: the scaling rule; the individual checks are grounded'
  constraints:
  - Components that handle untrusted input, credentials or cryptography MUST get the candidate's tests run, sandboxed behaviour tests and code review for install scripts, exfiltration, obfuscation and unfinished security gaps.
  - A candidate MUST be tested in isolation for unexpected indirect dependencies.
  - Example code shipped with a package MUST be treated as untrusted until reviewed.
  design_notes: |-
    Ledger rows: L027, L077, L1540, L1542.
    Decision (judge record, in full): Scale vetting depth to criticality and exposure, judging risk as cost times probability of each bad outcome: metadata and scores for low-criticality replaceable parts; for components that handle untrusted input, credentials or cryptography, run the candidate's tests, sandboxed behaviour tests and code review for install scripts, exfiltration, obfuscation and unfinished security gaps. Reuse audits by trusted organisations and review only version differences instead of auditing everything. Test a candidate in isolation for unexpected indirect dependencies, and treat example code shipped with a package as untrusted until reviewed. Outcome: audit effort goes where the damage would be.
    Grounds: L027 (contested SRC-C27, consensus ADOPT-C12; REG-003, REG-004, REG-012, REG-040; scaling rule inferred) with the two depths each best under a stated condition. L077 (majority; REG-004, REG-038). L1540, L1542 (single-source, REG-003, REG-1556; JavaScript guideline, adopted as practice since consistent with L027).
    Positions considered: P1 (a) metadata only; (b) deep review. P2 delegate audit. P3 isolation test and untrusted examples.
    Rejected, with the condition under which each would be best: full manual audit of every dependency: too much work (L077); best never as a rule, only for P1b components.
    Context conditions: CRITICALITY_AND_EXPOSURE (above).
    Certainty (judge record): inferred (scaling rule), grounded for the individual checks.
    Stack pointers: L077 (cargo-vet), L1540, L1542.
