- op: node.create
  uid: OWNERSHIP.STANCE.1
  name: What a New Dependency or Layer Must Earn
  intent: A new dependency or layer is justified by a stated reason before its quality is assessed, because it is a lasting liability (maintenance, upgrades, security exposure, platform shifts) and not a one-time saving. The default is not to add it, and a layer is created only when at least one strong reason outweighs its cost.
  parent: OWNERSHIP.STANCE
  epistemic_state: 'known | inferred: the layer reasons are the maintainer''s formulation (L308), inferred as general'
  constraints:
  - The reason for a new dependency or layer MUST be written before the quality evaluation starts.
  - A layer MUST NOT be created unless at least one strong reason outweighs its cost.
  design_notes: |-
    Ledger rows: L001, L037, L308.
    Decision (judge record, in full): Justify a new dependency or layer by a stated reason before assessing its quality, and treat it as a lasting liability (maintenance, upgrades, security exposure, platform shifts), not a one-time saving; the default is not to add it, and a layer is created only when at least one strong reason outweighs its cost (for example reuse across consumers, hiding internals behind a business-level verb, keeping a query tunable by its owner, enforcing integrity once). Outcome: every added moving part has a recorded reason that can be tested later.
    Grounds: L001 and L037 (consensus; REG-003, REG-011, REG-012): the cost is attack surface and ownership beyond the effort saved. L308 (MAINT, REG-181) states the same test for layers and agrees with public practice (build-versus-not discipline); it is the best formulation for layers because it names the reasons that count.
    Positions considered: P1 justify by necessity first (cost of ownership, security exposure). P2 MAINT: create a layer only against a strong reason; the row's competing position is to default to the layer (database-centric; fit, a single place for logic).
    Rejected, with the condition under which each would be best: default to the layer: no source in the branch argues its cost is lower; it would be best only where the layer's reasons (integrity once, reuse) already hold, which is the P2 condition, not a default.
    Context conditions: none.
    Certainty (judge record): grounded for the dependency half (L001, L037); the layer reasons are the maintainer's formulation (L308), inferred as general.
    Applied after judging: R13 (layer reasons became examples, Certainty split).
    Binding: MD-01 (the best practice for the purpose, not the average), MD-02 (outcomes, whoever does the work).
  examples:
  - 'Reasons that can outweigh a layer''s cost: reuse across consumers; hiding internals behind a business-level verb; keeping a query tunable by its owner; enforcing integrity once.'
  impl_pointers:
  - build/distill/03_judge/J1_ownership/judged.md::OWNERSHIP.STANCE.1
  - build/research/01_sourcing/result.md::SRC-C01
  - build/research/02_adoption/result.md::ADOPT-C08
  - build/research/02_adoption/result.md::ADOPT-C01
  - build/research/07_maintainer_doctrine/result.md::MAINT-C44
- op: node.create
  uid: OWNERSHIP.STANCE.2
  name: Write, Adopt or Rent per Need
  intent: Each need is decided explicitly between a platform built-in, a vetted component, a rented service and in-house code, with no default either way. A built-in that meets the need is preferred because it adds no new owner; vetted or rented options suit complex, security-critical or non-core needs; in-house code is for core functions, needs no third party meets better, and small stable functionality.
  parent: OWNERSHIP.STANCE
  epistemic_state: 'known | inferred: the built-in preference and the renting rule (sources address rented software only through outsourcing)'
  constraints:
  - Custom code chosen over a built-in or a vetted component MUST carry a recorded reason.
  - When custom code is chosen over a built-in, the missing capability MUST be recorded and the choice revisited if the need shrinks to what the built-in does.
  - Renting MUST pass the same cost test as adopting, plus the control cost.
  design_notes: |-
    Ledger rows: L002, L040, L310.
    Decision (judge record, in full): Decide each need explicitly: a capability the platform already in use provides (a built-in) is preferred over both new code and a new dependency when it meets the stated need, because it adds no new owner (the lowest-ownership case of the cost test); a vetted component or service is preferred for complex or security-critical domains (cryptography, protocols) and for non-core, well-understood functions; write it in-house only for core functions that carry competitive advantage, for needs no third-party option meets better, and for small stable functionality whose dependency cost exceeds its code cost. Renting is adoption with the same cost test plus the control cost, so core functions are built or kept under control and non-core ones are rented. When custom code is chosen over a built-in, record the missing capability and revisit if the need shrinks to what the built-in does. Outcome: each need has a recorded basis for its ownership mode.
    Grounds: L002 (SRC-C02 contested, ADOPT-C02 majority, ADOPT-C03 consensus; NIST PW.4.2, Google SWE ch. 21, REG-004, REG-011, REG-012, REG-020, REG-027): P1, P2 and P3 each win under a stated condition and P4 is the source's own reconciliation, so the decision is a conditional, not an average. L040 (REG-027, REG-026): rent non-core. L310 (MAINT, REG-181): the built-in rule is the lowest-ownership case of the same rule and the maintainer's custom exception (granularity, per-entry strategies) is the stated condition; coverage check shows no contradiction with L002.
    Positions considered: P1 reuse by default (security, speed, cost, correctness). P2 minimise dependencies (cost of ownership, control, exit risk). P3 build the core (control, differentiation). P4 build only what third parties cannot better meet. P5 rent: (a) non-core only (control, differentiation); (b) rent broadly and accept lock-in (speed, cost). P6 MAINT built-in over custom.
    Rejected, with the condition under which each would be best: reuse as an unconditional default and minimise as an unconditional default: each is best only under its condition (security-critical or non-core, versus small stable long-lived); rent broadly (P5b): best where the lock-in pay-off is commensurate, handled by `CONTAINMENT.1`.
    Context conditions: CORENESS (L002 ADOPT-C02 b, L040): whether the function carries competitive advantage moves it from adopt or rent toward write.
    Certainty (judge record): grounded for L002 and L310; inferred for the built-in preference (from L001 and L037, cost of ownership and consensus; the maintainer's L310 agrees) and for renting (L040 inferred: sources address SaaS only through outsourcing).
    Applied after judging: R12 (built-in preference replaces the ranking across modes).
    Binding: MD-01 (the best practice for the purpose, not the average), MD-02 (outcomes, whoever does the work).
  examples:
  - 'Domains where a vetted component is preferred: cryptography, protocols.'
  impl_pointers:
  - build/distill/03_judge/J1_ownership/judged.md::OWNERSHIP.STANCE.2
  - build/research/01_sourcing/result.md::SRC-C02
  - build/research/02_adoption/result.md::ADOPT-C02
  - build/research/02_adoption/result.md::ADOPT-C03
  - build/research/02_adoption/result.md::ADOPT-C07
  - build/research/07_maintainer_doctrine/result.md::MAINT-C46
- op: node.create
  uid: OWNERSHIP.STANCE.3
  name: Bringing Code Inside - Copy, Vendor, Upstream
  intent: Code is copied or reimplemented only for a tiny used surface of non-security-critical code; otherwise it is consumed from a registry with a lock, or vendored when the team has the tooling to carry it. Whatever is carried keeps a record of its origin and version and fixes go upstream, so it does not silently diverge.
  parent: OWNERSHIP.STANCE
  epistemic_state: 'known | inferred: the scope of the cryptography exception and the vendoring condition'
  constraints:
  - Copied or vendored code MUST keep a record of its origin and version.
  - Fixes MUST go upstream and MUST NOT live in a private fork.
  - Cryptography and protocols MUST depend on the vetted component, not on a copy.
  design_notes: |-
    Ledger rows: L070, L071, L072.
    Decision (judge record, in full): Copy or reimplement only a tiny used surface of non-security-critical code; for cryptography and protocols depend on the vetted component even then. Consume from a registry with a lock by default; vendor (or use a monorepo) when the team has the tooling to carry it or needs the copy for availability (`LIFECYCLE.4`). Whatever is carried keeps a record of its origin and version, and fixes go upstream instead of living in a private fork. Outcome: carried code can be traced to its source and does not silently diverge from upstream fixes.
    Grounds: L070 (REG-012 for the tiny surface, REG-004 PW.4 for cryptography; the opposing arguments, lost upstream fixes REG-011, are inferred, so the crypto exception is the safer side where the row is contested). L071 (REG-011 monorepo; REG-031, REG-037 registry with lock). L072 (majority; REG-011, REG-035, REG-040): no opposing position recorded.
    Positions considered: P1 copy a tiny surface (attack surface, exit risk). P2 depend even then (correctness, upstream fixes). P3 vendor or monorepo (control, visibility). P4 registry with lock (cost of ownership). P5 upstream, no private forks.
    Rejected, with the condition under which each would be best: copy everywhere: loses upstream fixes beyond the tiny, non-critical case; vendor as default: needs tooling and large-codebase scale (condition stated); P2 as absolute: cost of a dependency for a handful of lines exceeds the saving (REG-012).
    Context conditions: none beyond the conditions above (used surface size, security criticality, tooling), which are in the decision.
    Certainty (judge record): grounded for P1 and P5; inferred for the crypto exception's scope and the vendoring condition.
    Binding: MD-01 (the best practice for the purpose, not the average), MD-02 (outcomes, whoever does the work).
  impl_pointers:
  - build/distill/03_judge/J1_ownership/judged.md::OWNERSHIP.STANCE.3
  - build/research/02_adoption/result.md::ADOPT-C42
  - build/research/02_adoption/result.md::ADOPT-C43
  - build/research/02_adoption/result.md::ADOPT-C44
- op: node.create
  uid: OWNERSHIP.STANCE.4
  name: Speculative Building and Probable Use
  intent: Functionality, or a substitute for a dependency, is not built for presumed future needs; effort goes into making change cheap (tests, refactoring, continuous delivery). Where a structural choice is costly to reverse, probable use is part of today's requirement and is weighed in the choice, without speculative optimisation.
  parent: OWNERSHIP.STANCE
  epistemic_state: 'inferred: the reconciliation of build-for-today with probable use rests on the maintainer''s own condition (one source); the two halves taken singly are grounded'
  constraints:
  - Functionality MUST NOT be built for a presumed future need.
  - A structural choice that is costly to reverse MUST be weighed against probable use when it is made.
  design_notes: |-
    Ledger rows: L038, L330, L1208.
    Decision (judge record, in full): Do not build functionality, or a substitute for a dependency, for presumed future needs; invest instead in making the software easy to modify (tests, refactoring, continuous delivery). Where a structural choice is costly to reverse (the shape of a very large stored data set), the probable use is part of today's requirement and is weighed in the choice, without speculative optimisation. Outcome: the cost of change stays low where it can, and a costly-to-reverse structure is not chosen blind.
    Grounds: L038 (consensus; REG-026, REG-034: four distinct costs), L1208 (consensus; REG-034: same claim plus the enabling investment). L330 (MAINT, REG-181) contradicts L038 on its face (coverage check section 5), but L330 states the condition itself (build only for today wins when change is cheap; probable use wins when changes to structure are costly, a very large relational store); the two are one rule with that reversibility condition, not a blend. The reconciliation rests on L330's own condition only.
    Positions considered: P1 no speculative functionality (speed, cost). P2 MAINT: design for probable use (reversibility; large relational store). P3 no presumed features, invest in modifiability (reversibility, cost).
    Rejected, with the condition under which each would be best: P2 as a general rule: speculation is usually wrong and carries complexity (REG-034); it is the best when reversal is costly, which the decision states. P1 as stated without the enabling investment: leaves change expensive.
    Context conditions: COST_OF_STRUCTURAL_CHANGE moves the answer: cheap change, build for today; costly change, weigh probable use.
    Certainty (judge record): inferred for the reconciliation (the maintainer's condition is one source); grounded for the two halves taken singly.
    Applied after judging: R01 (published contract removed), R02 (grounds rest on the maintainer's own condition), F1 settled unchanged.
    Binding: MD-01 (the best practice for the purpose, not the average), MD-02 (outcomes, whoever does the work).
  examples:
  - 'A structural choice costly to reverse: the shape of a very large stored data set.'
  impl_pointers:
  - build/distill/03_judge/J1_ownership/judged.md::OWNERSHIP.STANCE.4
  - build/research/02_adoption/result.md::ADOPT-C04
  - build/research/07_maintainer_doctrine/result.md::MAINT-C66
  - ../web_architecture_guidelines/build/research/07_architecture_styles/result.md::ARCH-C03
- op: node.create
  uid: OWNERSHIP.SELECTION.1
  name: Evaluation Process and Admission Gate
  intent: 'Every dependency is judged against an explicit written criteria set in the context of its intended use, and the reason for each non-trivial selection is recorded. It enters through a gate: a central sanctioned list where many teams, regulation or high criticality are involved, otherwise a reviewed proposal with light visibility.'
  parent: OWNERSHIP.SELECTION
  epistemic_state: 'known | inferred: the written-selection and recorded-reason practices (one study, synthesis)'
  constraints:
  - Candidates MUST be judged against a written criteria set in the context of intended use, repeated when the use changes substantially.
  - The reason for each non-trivial selection (alternatives, criteria, accepted risks) MUST be stored as a decision record where later maintainers find it (EVOLUTION.DECISIONS).
  - A dependency MUST enter only through the gate.
  - Aggregators MUST serve only discovery and first screening.
  design_notes: |-
    Ledger rows: L003, L004, L005, L028, L029, L030, L042, L1537, L1539.
    Decision (judge record, in full): Judge each candidate against an explicit written criteria set (design and documentation, code quality, tests that run and pass, bug handling, maintenance, usage, security exposure and secure defaults, licence, transitive dependencies) in the context of its intended use, and repeat when the use changes substantially. Record the reason for each non-trivial selection (alternatives, criteria, accepted risks) where later maintainers find it. A dependency enters only through a gate: a central sanctioned list with provenance data where many teams or regulated or high-criticality software are involved; otherwise a reviewed proposal with light visibility. Aggregators serve discovery and first screening only. Outcome: every dependency has a recorded, reviewable basis and a known introducer.
    Grounds: L003, L004, L042 (consensus; REG-003, REG-004, REG-011, REG-012): no competing position. L005 (one study REG-017, recommendation inferred) and L029 (majority; REG-004, REG-013, REG-017): written selection. L028 (REG-004, REG-011, REG-013): the two admission modes are each best under a stated condition. L030 (majority): aggregators change or stop, so they never substitute for criteria. L1537, L1539 (judged in the JavaScript guideline, node intents, no own claim): consistent, adopted as framing only.
    Positions considered: P1 explicit criteria in context. P2 systematic, written selection. P3 written reason per selection. P4 (a) central sanctioned list (security, control, consistency); (b) team choice (speed, cognitive load); a reviewed proposal as a third mode. P5 aggregators for discovery. P6 prior JavaScript framing.
    Rejected, with the condition under which each would be best: team choice with light visibility is best for small teams with low regulation; central list best for regulated or high-criticality contexts and many teams; both are kept as the stated condition. Ad hoc selection: rejected by L005's evidence.
    Context conditions: REGULATION_AND_SCALE moves the gate (above).
    Certainty (judge record): grounded for P1; inferred for P2 and P3 (single study, synthesis).
    Binding: MD-01 (the best practice for the purpose, not the average), MD-02 (outcomes, whoever does the work).
