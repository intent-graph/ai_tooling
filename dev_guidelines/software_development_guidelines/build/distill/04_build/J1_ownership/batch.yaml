- op: node.create
  uid: OWNERSHIP.CONTAINMENT
  name: Containment and Exit
  intent: Exit capability is bought only up to where insurance costs less than the expected loss, and a thin adapter isolates substitutable, volatile or foreign-model dependencies while none is built for stable standard ones. External systems are attached resources, third-party responses are untrusted input, and risky dependencies are isolated at runtime.
  parent: OWNERSHIP
  epistemic_state: 'known | inferred: the proportionality of exit capability'
  constraints:
  - No rented service MUST be adopted without a tested way out proportional to its criticality.
  design_notes: |-
    Rolled-up decision (judge record): exit capability is bought only up to where insurance is cheaper than the expected loss (a tested exit for critical or regulated functions); a thin adapter isolates substitutable, volatile or foreign-model dependencies and none is built for stable standard ones; external systems are attached resources; third-party responses are untrusted and risky dependencies are isolated at runtime.
    Certainty (judge record): grounded for the containment mechanisms; inferred for the proportionality.
    Roll-up of its children; it states no fact of its own (MD-03).
    Binding: MD-01 (the best practice for the purpose, not the average), MD-02 (outcomes, whoever does the work).
