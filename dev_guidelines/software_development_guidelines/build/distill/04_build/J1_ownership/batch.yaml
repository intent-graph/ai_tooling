  uid: OWNERSHIP.SELECTION.3
  name: Project Health and Compatibility Signals
  intent: Observable health signals (recent activity, responsiveness, disclosure policy, compatibility promise, maintainer diversity) are inputs to judgment, never the verdict, weighted by how critical and how replaceable the component is. A popularity or aggregate score is a weak proxy, and a pre-1.0 label is a prompt to check release history and compatibility policy, not an automatic rejection.
  parent: OWNERSHIP.SELECTION
  epistemic_state: 'known | inferred: the stance on pre-1.0 labels and the remark on screening by score at scale'
  constraints:
  - Several maintainers from several organisations MUST be required when the component is on a critical path or hard to replace.
  - A single-maintainer component outside the small, stable, easily replaced case MUST carry a recorded compensating reason or an exit plan.
  - A popularity or aggregate score MUST NOT be treated as proof of quality or fit.
  design_notes: |-
    Ledger rows: L006, L007, L008, L011, L014, L015, L016, L017, L018, L019, L041.
    Decision (judge record, in full): Treat health signals as inputs to judgment, never as the verdict: recent commits and releases within about twelve months and visible communication; responsiveness (open bugs, resolution speed, security backports or long-term-support versions); a vulnerability-disclosure policy and reporting channel; the candidate's compatibility promise (none, source, binary, automated migration), because it sets the cost of every update; interfaces stable and secure by default. Require several maintainers from several organisations when the component is on a critical path or hard to replace; tolerate a single-author project when it is small, stable and easily replaced or vendorable; a single-maintainer component outside that case needs a recorded compensating reason or an exit plan (L007). A 0.x or alpha label is evidence of a weak stability promise to be checked against release history and compatibility policy, not an automatic reject. A popularity or aggregate score is a weak proxy and never proof of quality or fit. Outcome: health claims in a selection rest on observed signs weighed by criticality.
    Grounds: L006, L041 (consensus; REG-001, REG-003, REG-011, REG-012, REG-017); L007 (contested; REG-001, REG-003, REG-012, REG-018): the two positions each win under the stated replaceability condition. L008, L011, L014, L015 (REG-001, REG-003, REG-011, REG-012): no competing position. L016 (OpenSSF REG-003): label guidance; the counter (many mature tools stay 0.x) is inferred, so the label is evidence, not a gate. L017 (Scorecard's own documentation says input not verdict, REG-001, REG-002), L018 (one study REG-016: process scores explain 9 to 12 percent of vulnerability outcomes, replication not checked), L019 (REG-003, REG-011, REG-012, REG-013, REG-017): all support input-not-verdict.
    Positions considered: P1 activity. P2 several maintainers (exit risk, security, continuity). P3 tolerate small (cost, fit). P4 responsiveness and disclosure. P5 compatibility promise. P6 (a) avoid 0.x (correctness, reversibility); (b) labels not uniform (fit). P7 (a) score as input; (b) score as a gate (consistency, speed at scale). P8 (a) popularity weak proxy; (b) popularity as hype.
    Rejected, with the condition under which each would be best: P6a as a rule: no source read shows labels are uniform, and mature tools stay 0.x; best as a prompt to check, not a gate. P7b gate on score: not argued in any source read, and the low explanatory power (L018) undermines it; it would be best only at a scale where per-package review is impossible, and then as a screen. P2 as a universal requirement: best only when the component is critical or hard to replace.
    Context conditions: REPLACEABILITY moves the maintainer-diversity requirement (above).
    Certainty (judge record): grounded for P1, P4, P5, P7a, P8a; inferred for the 0.x stance and the screen-at-scale remark.
    Applied after judging: R04 (single-maintainer condition).
    Binding: MD-01 (the best practice for the purpose, not the average), MD-02 (outcomes, whoever does the work).
