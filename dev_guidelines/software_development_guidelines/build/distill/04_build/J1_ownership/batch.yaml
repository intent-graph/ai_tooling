  intent: Every environment gets the same verified artifacts from a complete manifest and a lock, and versions are constrained by whether the artifact is deployed or consumed as a library. Updates are small, frequent, tested and automated with security fixes urgent, artifacts arrive through controlled channels, and the team knows what it depends on and watches it until end of life.
