- op: node.create
  uid: OWNERSHIP.SERVICES.6
  name: CI and Hosting Services as Supply Chain
  intent: 'Build, CI and hosting services execute with the team''s secrets and produce what it ships, so they are held to supply-chain standards: third-party components pinned to an immutable identifier, least-privilege default permissions, and no self-hosted runners on untrusted code.'
  parent: OWNERSHIP.SERVICES
  epistemic_state: 'known | inferred: the generalisation beyond one platform''s guidance'
  constraints:
  - Third-party CI components MUST be pinned to an immutable identifier (a full commit hash from the official repository, not a fork) and their source audited.
  - The default token permission MUST be read-only and raised per job.
  - Self-hosted runners MUST NOT run untrusted code such as public repositories.
  design_notes: |-
    Ledger rows: L366, L367, L368.
    Decision (judge record, in full): Treat a CI or hosting service as part of the supply chain: pin third-party CI components to an immutable identifier (a full commit hash from the official repository, not a fork), audit their source, set the default token permission to read-only and raise it per job, and do not run self-hosted runners on untrusted code such as public repositories, since they are not guaranteed ephemeral and clean. Outcome: a compromised third-party action or runner cannot reach the team's secrets or artifacts.
    Grounds: L366, L367, L368 (consensus; REG-195, REG-200). No competing position.
    Positions considered: P1 supply-chain view. P2 pin and least privilege. P3 no self-hosted runners on untrusted code.
    Rejected, with the condition under which each would be best: none competing.
    Context conditions: none.
    Certainty (judge record): grounded (one platform's guidance, REG-195; the generalisation to other CI services is a stack pointer, inferred).
    Stack pointers: L367, L368 (one CI platform; pointer for equivalents).
    Binding: MD-01 (the best practice for the purpose, not the average), MD-02 (outcomes, whoever does the work).
