  uid: OWNERSHIP.SERVICES.1
  name: Availability Fit and Commitments
  intent: A rented service's availability target must be at least the team's own, because hard dependencies multiply availabilities, and its SLA is read as a commercial instrument, not a promise. The team owns its availability target and design, and keeps its internal objective tighter than the SLA.
  parent: OWNERSHIP.SERVICES
  epistemic_state: 'known | inferred: the remedy-versus-loss mitigation (L347), planning from observed behaviour and per-service monitoring (L033, no source)'
  constraints:
  - A service's availability target MUST be at least the team's own.
  - Where SLA credits cannot cover the team's loss, the team MUST mitigate by design (fallback, redundancy).
  - The internal objective MUST be tighter than the SLA signed or advertised.
  - Reachability, latency and errors of each service MUST be monitored as part of adopting it.
  design_notes: |-
    Ledger rows: L031, L033, L346, L347, L348, L349, L350.
    Decision (judge record, in full): Pick a service whose availability target is at least the team's own, because hard dependencies multiply availabilities. Read an SLA as a commercial instrument (measured uptime, a credit scale, a claim procedure, exclusions, credits as the sole remedy), not a promise; compare the remedy to the team's loss and, where credits cannot cover it, mitigate by design (fallback, redundancy) (inferred, L347). The team owns its availability target and design; the provider owns only what its published SLA defines. Keep the internal SLO tighter than the SLA signed or advertised, plan from the dependency's observed behaviour as well as its stated target, and monitor reachability, latency and errors of each service as part of adopting it (inferred, L033 has no source). Outcome: the team's promise is not larger than what its dependencies can honestly support.
    Grounds: L031 (consensus; REG-007, mathematically general), L346 (consensus; REG-125, REG-197), L348 (consensus; REG-197, REG-201), L349 (consensus; REG-125), L350 (majority; REG-125), L347 (inferred, not assessable; REG-197, REG-201), L033 (consensus, inferred, no source id). Final pass: the two inline-marked sentences follow from a grounded rule of this node but none is sourced. No competing position in any row.
    Positions considered: P1 target at least yours. P2 SLA as commercial instrument. P3 remedy versus loss. P4 own your availability. P5 SLO tighter than SLA. P6 observed behaviour. P7 monitor.
    Rejected, with the condition under which each would be best: none competing.
    Context conditions: none.
    Certainty (judge record): grounded for P1, P2, P4, P5; inferred for P3, P6 (majority) and P7 (no source id).
    Applied after judging: R15 (two sentences marked inferred); mechanisms and monitoring held elsewhere (MD-03).
    Binding: MD-01 (the best practice for the purpose, not the average), MD-02 (outcomes, whoever does the work).
