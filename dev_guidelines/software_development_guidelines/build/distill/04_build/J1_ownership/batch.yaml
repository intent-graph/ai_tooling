- op: node.create
  uid: OWNERSHIP.LICENCE.2
  name: Policy and Process
  intent: 'Licence classes (allowed, notice-only, review-needed, prohibited) are written down by distribution model with a named decider: conservative where the team ships client or embedded software or must keep code closed, looser for teams that only host. A defined compliance process with identified roles keeps the policy working over time.'
  parent: OWNERSHIP.LICENCE
  epistemic_state: 'known | inferred: the permissive policy for host-only teams and the process details'
  constraints:
  - Licence classes MUST be written down by distribution model with a named decider.
  - A defined compliance process with identified roles MUST exist and be kept working over time.
  design_notes: |-
    Ledger rows: L373, L377.
    Decision (judge record, in full): Write down the licence classes (allowed, notice-only, review-needed, prohibited) by distribution model with a named decider. Where the team ships client or embedded software or holds code it must keep closed, the classes are conservative; one organisation's published policy is the example (notice licences allowed, strong copyleft only server-side or internal, network copyleft, SSPL and non-commercial licences prohibited), not a standard. Teams hosting only, or publishing their own code under compatible terms, may allow copyleft where obligations are understood and met. Run a defined compliance process with identified roles and a way to keep it working over time; ISO/IEC 5230 (OpenChain) is the standard and can be self-certified. Outcome: licence acceptance is a recorded policy applied by a known person.
    Grounds: L373 (contested; REG-188, REG-189, REG-210; the conservative example is one organisation's choice, (b) inferred), L377 (majority; REG-193; summary grounded, details inferred).
    Positions considered: P1 (a) conservative class policy (control of own source, audit cost); (b) allow copyleft with understood obligations (speed, reuse). P2 compliance process.
    Rejected, with the condition under which each would be best: neither policy is rejected; the distribution model selects it.
    Context conditions: DISTRIBUTION_MODEL moves the policy (above).
    Certainty (judge record): grounded for P1a; inferred for P1b and the process details.
    Applied after judging: R14 (conservative classes stated as one organisation's example).
    Binding: MD-01 (the best practice for the purpose, not the average), MD-02 (outcomes, whoever does the work).
  examples:
