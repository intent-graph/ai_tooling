- op: node.create
  uid: OWNERSHIP.LIFECYCLE.3
  name: Updating
  intent: Updates are small, frequent, automated, grouped and gated by the project's own tests, with security fixes applied urgently and separately; where verification is weak, updating on need is a recorded debt and not a policy. Routine updates of deployables wait out a release-age cooldown, and after a supply-chain compromise every developer credential is treated as exposed.
  parent: OWNERSHIP.LIFECYCLE
  epistemic_state: 'known | inferred: the cooldown length and benefit (one analysis of ten attacks), the interim cadence under weak verification, and the post-compromise trigger (single source)'
  constraints:
  - Each update MUST be gated by the project's own tests (including integration tests for the team's usage) and release-note or diff review, and MUST be deployed through staged rollouts.
  - Fixes for known vulnerabilities MUST be applied urgently, bypassing any scheduled delay, and kept separate from feature updates.
  - Routine non-security updates of deployables MUST be held for a release-age cooldown of at least seven days; security fixes MUST NOT be held.
  - Where verification is weak or deployment costly, updating on need MUST be recorded as debt to repay (EVOLUTION.DEBT).
  - After a worm-style supply-chain compromise, every developer credential MUST be treated as exposed, lockfiles reviewed and versions pinned to before the incident; rotation is held by TRANSVERSE.CONFIG.6.
  design_notes: |-
    Ledger rows: L052, L053, L054, L055, L056, L057, L058, L1543, L1544.
    Decision (judge record, in full): Update in small, frequent, automated, grouped increments, each gated by the project's own tests (including integration tests for the team's usage) and release-note or diff review, and deployed through staged rollouts; where verification is weak or deployment costly, update on need (security fixes, end of life, a needed change) rather than routinely, and record the weak verification as debt to repay (`EVOLUTION.DEBT`): the low cadence is a consequence of missing tests, never a policy. Apply fixes for known vulnerabilities urgently, bypassing any scheduled delay, and keep security updates separate from feature updates. Hold routine (non-security) updates of deployables for a release-age cooldown of at least seven days, never for security fixes; the cooldown complements lock, hashes and review and replaces none of them. Its benefit rests on one analysis of ten attacks (eight of ten malicious versions removed within a week, nine within fourteen days) and is otherwise unmeasured: inferred. After a worm-style supply-chain compromise, treat every developer credential as exposed, review the lockfiles and pin to versions published before the incident; the revocation, rotation and investigation of the exposed credentials are held by `TRANSVERSE.CONFIG.6`. Outcome: updates arrive fast enough to carry fixes and slowly enough to be vetted, and the pipeline detects a bad one.
    Grounds: L052 (REG-001, REG-011, REG-012, REG-025, REG-035): small frequent updates win when tests are trustworthy; "update only when needed" wins when verification is weak, which is a condition on the tests, so the decision fixes the cause. L053 (consensus; REG-001, REG-012, REG-029, REG-035, REG-043), L055 (consensus), L056 (consensus; REG-012), L057 (consensus; REG-025), L1543 (majority). L054 (contested; REG-029, REG-035, REG-036, REG-043): the cooldown costs only the staleness of fixes that ship as ordinary releases, which the security bypass removes; update-immediately wins when most updates are security fixes. L058 (REG-011, REG-028, REG-030). L1544 (CISA, single T2 source REG-1558; JavaScript guideline). Final pass: the cooldown length rests on REG-036 (recommends seven days minimum, "not a panacea") and L1543 (benefit unmeasured); the interim cadence follows L052's own condition ("strengthen first" had no row and cannot happen at once).
    Positions considered: P1 (a) frequent automated (security, cost); (b) only when needed (control, stability). P2 automate and group. P3 urgent security fixes. P4 (a) cooldown; (b) immediate. P5 review and re-test. P6 staged rollout. P7 (a) live at head (speed of feedback); (b) pinned SemVer (control). P8 post-compromise response.
    Rejected, with the condition under which each would be best: P1b: best while verification is weak or deployment costly and exposure is lower than the risk of change, as a temporary state (now in the Decision). P4b: best when most updates are security fixes or the pipeline detects malicious content itself. P7a: best in a monorepo with provider-run downstream tests at organisation scale.
    Context conditions: TEST_TRUST_AND_EXPOSURE moves the cadence and the cooldown (above).
    Certainty (judge record): grounded for P2, P3, P5, P6; inferred for the cooldown (one T3 analysis of 10 attacks REG-036, vendor figures; stated as inferred in the Decision), for the interim cadence under weak verification and for the post-compromise trigger (single source).
    Stack pointers: L054, L055, L1543, L1544 (named tools and ecosystem).
    Applied after judging: R09 (update-on-need as debt), R11 and F2 (cooldown of at least seven days), X10 (rotation held by TRANSVERSE.CONFIG.6; MD-03).
    Binding: MD-01 (the best practice for the purpose, not the average), MD-02 (outcomes, whoever does the work).
