  name: Commercial and Contract Terms
  intent: 'The legal and cost position of renting is known before dependence: a written processor contract where personal data is processed, price risk treated as part of selection with a named cost owner, and, for each critical dependency, a record of who controls its licence with a decision made in advance for a change of terms.'
