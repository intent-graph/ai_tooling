  intent: The team keeps a machine-generated inventory of what it depends on, direct and transitive and where deployed, scanned continuously against vulnerability databases for as long as the software is in service. Each component is confirmed maintained and not at end of life, with a plan for abandonment, so a disclosed flaw maps to the affected systems in hours.
