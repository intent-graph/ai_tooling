  - Where a service processes personal data, a written processor contract (documented instructions only, confidentiality, security measures, authorised sub-processors, assistance with data-subject rights, deletion or return at the end, audit rights) MUST be in place, with processors giving sufficient guarantees.
  - Cost MUST have an owner, and the pricing model, unit economics and egress MUST be understood as part of selection.
  - For each critical open-source or hosted dependency, who controls its licence MUST be recorded and the response to changed terms decided in advance.
  design_notes: |-
    Ledger rows: L358, L360, L361.
    Decision (judge record, in full): Where a service processes personal data, require a written processor contract (documented instructions only, confidentiality, security measures, authorised sub-processors, assistance with data-subject rights, deletion or return at the end, audit rights) and choose processors giving sufficient guarantees. Treat price risk as part of selection: understand the pricing model, unit economics and egress, give cost an owner and expect unmetered cost exposure from usage-based services. For each critical open-source or hosted dependency record who controls its licence and decide in advance what to do if terms change; prefer foundation-governed or multi-vendor projects when the team builds services that could be read as competitive or must outlive the vendor, and accept a single-vendor project for non-competitive end-user use with a credible rationale. Outcome: the legal and cost position of a rented service is known before dependence.
    Grounds: L358 (consensus; EU GDPR; unofficial copy of the text; REG-198), L360 (majority; no T1 or T2 source on contractual price caps, open; REG-185, REG-187, REG-214), L361 (REG-212, REG-215; the rule is inferred): (a) wins for end-user use, (b) wins for competitive or outliving use.
    Positions considered: P1 processor contract. P2 price risk in selection. P3 (a) single-vendor acceptable (speed, features); (b) foundation or multi-vendor (exit risk, control).
    Rejected, with the condition under which each would be best: P3a as a default: best for non-competitive end-user use; P3b as a default: best where the dependency may be read as competitive or must outlive the vendor (T4 source).
    Context conditions: JURISDICTION: the processor contract is stated for the EU (GDPR), apply the local equivalent where one applies.
    Certainty (judge record): grounded for P1; inferred for P2 (no T1 or T2 source on price caps) and P3's rule.
    Binding: MD-01 (the best practice for the purpose, not the average), MD-02 (outcomes, whoever does the work).
