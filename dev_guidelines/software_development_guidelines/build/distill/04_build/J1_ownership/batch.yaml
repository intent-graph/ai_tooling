- op: node.create
  uid: OWNERSHIP.SELECTION.2
  name: Fit, Maturity and Novelty
  intent: Selection is for fit to the real requirements, with proven technology the team already operates as the default, because its failure modes are known. Novelty is spent only where the business needs it and the existing tool demonstrably cannot solve the problem, introduced in stages with an exit or migration plan.
  parent: OWNERSHIP.SELECTION
  epistemic_state: 'known | inferred: the staged-versus-boring reconciliation and the reversible entry'
  constraints:
  - Before novelty is spent, why the existing tool cannot solve the problem MUST be documented.
  - Novelty MUST be introduced in stages (limited production trial, then adopt or hold) with an exit or migration plan.
  - The perpetual operating cost of a new technology MUST be weighed against the convenience of adoption.
  design_notes: |-
    Ledger rows: L023, L024, L025, L312, L1227, L1228, L1230.
    Decision (judge record, in full): Select for fit to the actual requirements and constraints, not features or fashion (a core technology is chosen by problem fit, not dogma). Default to proven technology the team already operates, because its failure modes are known; spend novelty only where the business needs it (what differentiates the product, not infrastructure) and the existing tool demonstrably cannot solve the problem, after documenting why. An organisation with standing capacity for experiments and tolerance for churn may run a standing trial ring (assess, trial, adopt, hold) and spend more novelty, still through the staged, reversible entry; a small, operations-heavy or long-lived system stays at the default. When novelty is spent, introduce it in stages (trial in limited production use, then adopt or hold) with an exit or migration plan, and weigh its perpetual operating cost rather than the convenience of adoption. Outcome: new technology enters rarely, deliberately, and reversibly.
    Grounds: L023 (consensus; REG-003, REG-013, REG-017), L312 (MAINT, public practice consensus, agrees with L023). L024, L1227, L1228 (REG-004, REG-011, REG-013, REG-1022, REG-1132): the boring-first default is supported by cost-of-ownership arguments and REG-013 itself admits the exit-plan exception. The staged mechanism (L024 b, L025; REG-013, REG-015 Thoughtworks Radar) does not oppose the default; it is the form novelty takes when spent. REG-013 is cited only for documenting why existing tools cannot solve the need and for the commitment to migrate old functionality to the new system; that REG-013 admits an exit plan from the new tool is not supported (the page says to commit to migrating). A reversible entry (stages, exit path) is inferred from the reversibility force of P2 and P3. L1230 (majority; REG-1022): perpetual cost.
    Positions considered: P1 fit. P2 boring first (cognitive load, operational cost, reversibility). P3 staged novelty (learning, speed through better tools). P4 weigh perpetual cost, talk to others.
    Rejected, with the condition under which each would be best: standing assess/trial/adopt rings as the default for every team: best where capacity for experiments and tolerance for churn exist (stated as condition); the row (L025) notes no source opposes it, but L024 a discourages novelty at all, so the ring practice is kept as the how, not the default.
    Context conditions: EXPERIMENT_CAPACITY: organisations with capacity for experiments may run standing rings and spend more novelty; small, operations-heavy or long-lived systems stay at the default.
    Certainty (judge record): grounded (T2 and T3 sources, aligned on cost); the staged-versus-boring reconciliation is inferred.
    Applied after judging: R03 (REG-013 cited only for the documentation and migration points), R18 (standing trial ring sentence).
    Binding: MD-01 (the best practice for the purpose, not the average), MD-02 (outcomes, whoever does the work).
  examples:
  - An organisation with standing capacity for experiments may run a standing trial ring (assess, trial, adopt, hold).
  impl_pointers:
