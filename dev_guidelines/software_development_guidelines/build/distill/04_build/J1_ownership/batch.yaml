  name: API Stability and Deprecation
  intent: Before depending on a service API, the team reads its stability tiers and deprecation policy, prefers providers that publish a minimum notice and keep two versions side by side, and consumes machine-readable deprecation signals into an alert. It pins the API version where the provider allows it; any stated promise is acceptable to depend on, and a published deprecation window is a goal, not a guarantee.
  parent: OWNERSHIP.SERVICES
  epistemic_state: 'known | inferred: real notice is shorter than the stated policy | gap: whether consumers act on deprecation signals'
  constraints:
  - The stability tiers and deprecation policy of a service API MUST be read before depending on it.
  - Machine-readable deprecation signals MUST be consumed and routed to an alert.
  - The API version MUST be pinned where the provider allows it, and upgraded deliberately.
  design_notes: |-
    Ledger rows: L034, L351, L354, L355 (L353 is a row of `ASSURANCE.CONTRACTS.1`).
    Decision (judge record, in full): Before depending on a service API, read its stability tiers and deprecation policy and prefer providers that publish a minimum notice and keep two versions working side by side during a transition. Consume machine-readable deprecation signals (Deprecation and Sunset headers) and route them to an alert, pin the API version where the provider allows it and upgrade deliberately, and treat a published deprecation window as a goal, not a guarantee. Outcome: the removal of an API is detected and absorbed before it breaks the service. Which evolution policy a provider follows, and when each is best, is held by `ASSURANCE.CONTRACTS.1`; any stated promise is acceptable to depend on.
    Grounds: L034 (consensus; REG-008, REG-009, REG-021; practice in the wild is weaker), L351 (consensus; REG-182, REG-183; that consumers act on signals is open), L354 (majority; REG-009, REG-213), L355 (majority, inferred; REG-021, REG-182, REG-183).
    Positions considered: P1 read policy, prefer notice. P2 consume deprecation headers. P3 provider evolution policies (held by `ASSURANCE.CONTRACTS.1`). P4 pin the version. P5 real notice is shorter than the policy.
    Rejected, with the condition under which each would be best: none here; the policies and their conditions are in `ASSURANCE.CONTRACTS.1`.
    Context conditions: none for the consumer decision.
    Certainty (judge record): grounded for P1 and P4; inferred for P5; open for whether consumers act on the signals.
