  uid: CONSTRUCTION.STATE.2
  name: Normal Form for Stored Data
  intent: 'Design relational tables to the normal form that removes the update anomalies of their actual dependencies: third normal form by default, with repeating groups moved to a child table, and a higher form where candidate keys overlap or independent multi-valued facts share a table. Denormalise deliberately and only for a measured performance requirement, with the redundancy guarded by a synchronisation plan, and prefer a derived read structure over distorting the base tables. Each fact is stored and changed in one place and any redundancy is chosen, measured and guarded.'
  parent: CONSTRUCTION.STATE
  epistemic_state: 'known | gap: the Boyce-Codd clause is grounded by definition; the dependency-driven use of higher forms is inferred'
  constraints:
  - MUST NOT denormalise without a measured need and a sync plan
  design_notes: |-
    Decision (full record text): Design relational tables to the normal form that removes the update anomalies of their actual dependencies: third normal form by default (every non-key field states a fact about the key, the whole key and nothing but the key), with repeating groups moved to a child table; a higher form (Boyce-Codd, fourth, fifth) where candidate keys overlap or independent multi-valued facts share a table, because there third normal form still permits anomalies. Denormalise deliberately and only for a measured performance requirement, with the redundancy guarded by the synchronisation plan of ASSURANCE.DATA_INTEGRITY.4; prefer a derived read structure over distorting the base tables. Outcome: each fact is stored and changed in one place, and any redundancy is chosen, measured and guarded.
    Grounds: Third normal form by default (L1263; consensus; REG-1144, REG-1146); purpose, no redundancy, update anomalies, inconsistent dependencies (L1264; REG-1144, REG-1146); deliberate denormalisation under measured need (L1265; consensus; REG-1144, REG-1146); third normal form the practical target, higher forms for specific designs (L1266; majority; REG-1146 T3 says rarely considered, REG-1144 covers 3NF, 4NF and 5NF without ranking; 3NF grounded, "specific designs" inferred; the Boyce-Codd clause is grounded by definition (it follows from the definition of the forms, a definitional fact that needs no empirical source), REG-1144 does not cover it, and REG-1146 calls 4NF "Boyce-Codd" wrongly); remove repeating groups (L1267; REG-1146). The maintainer's practice (3NF and beyond by default) is the same as the first clause; the dependency-driven rule and the maintainer's "3NF+" coincide: where keys do not overlap and no independent multi-valued facts share a table, the higher forms equal third normal form.
    Positions: P1 3NF default. P2 normalise to remove anomalies. P3 denormalise for measured need. P4 3NF the practical target. P5 child table for repeating groups.
    Rejected: A higher form chosen without the dependency that needs it: adds nothing. Denormalising by anticipation: best never; best when a measured requirement exists and the guard is in place.
    Context: Measured performance requirement (L1265); overlapping candidate keys or independent multi-valued facts (higher forms).
    Certainty: Grounded for 3NF default and measured denormalisation (consensus); grounded by definition for the Boyce-Codd clause; inferred for the dependency-driven use of higher forms.
    Note: technology-bound to relational storage, not to a programming language; for other stores STATE.1 holds.
    Ledger rows: L1263, L1264, L1265, L1266, L1267.
