- op: node.create
  uid: CONSTRUCTION.BOUNDARY.5
  name: Call Shape and Evolvable Interfaces
  intent: 'Choose the form of an interface by who composes the result: an operation with a signature where the consumer asks a question or requests a change and the owner composes the answer, a shape-bound read surface where consumers must filter, join and aggregate the result themselves; writes always go through operations. In both, output is evolved additively, a call carries meaning by name, and the interface is strict for callers it controls and tolerant for providers it does not control. A consumer binds to what it needs and the owner can evolve the rest.'
  parent: CONSTRUCTION.BOUNDARY
  epistemic_state: 'inferred: the maintainer''s row is the only source for the form, so the decision rests on who composes the result; the tolerant-reader family is grounded (consensus, two sources)'
  constraints:
  - MUST evolve an interface's output additively, and remove only under the rule of CONTRACTS.1 for the consumer reach
  - MUST NOT generate consumers from the full schema of a provider the consumer does not control; own-provider stubs follow CONTRACTS.3
  design_notes: |-
    Decision (full record text): Choose the form of an interface by who composes the result: an operation with a signature (parameters, optional parameters) where the consumer asks a question or requests a change and the owner composes the answer, which lets the owner change how the result is produced and add inputs; a shape-bound read surface where consumers must filter, join and aggregate the result themselves (reporting, several readers), since a signature cannot be composed by the caller or planned with the caller's own query. Writes always go through operations. In both, the output shape is evolved additively and removal follows the rule of ASSURANCE.CONTRACTS.1 for the consumer reach. A call carries its meaning by name: past a small number of parameters they are passed by name or as a named structure. The output model limits what leaves (the split of input and output models is held in ASSURANCE.CONTRACTS.3); a response that fails its declared output is a server defect (BOUNDARY.6). The interface is strict for what it accepts from callers it controls (unknown fields rejected) and tolerant for what it reads from a provider it does not control (read what you use, ignore the rest, validate the fields you use for type, range and size). Outcome: a consumer binds to what it needs and the owner can evolve the rest.
    Grounds: Signature over shape (L309; MAINT-S01, REG-181, grounded as the maintainer's position, public practice contested: views are commonly offered as a stable interface). Final pass: L309 is the maintainer's alone and its own sub-position (a) is the shape-bound case; a view also hides how its result is produced, so the remaining differences are input parameters and caller-side composition, and those decide by who composes; the "prefer a signature" default is removed. Names over positions (L1509; one T1 tool documentation, inferred; REG-1506). Separate input and output models (L1272; REG-1150; settled alongside CONTRACTS.3). Open for readers, closed for writers (L1279; REG-1147, inferred). Tolerant reader (L1278, L341; REG-1152, REG-208) against strict validation of all received (REG-194): the synthesis (L341, inferred) is the decision, and drift is detected by contract tests (ASSURANCE.CONTRACTS.2), not by breaking at run time.
    Positions: P1 signature over shape (change absorption; sub-positions: view for read-only reporting, function for many dependents). P2 name over position. P3 separate input and output models. P4 open for readers, closed for writers. P5 read what you use. P6 tolerant reader against strict schema validation.
    Rejected: A signature as the default for every interface, and a shape-bound surface as the default: the form follows who composes the result. A shape-bound surface is best for read-only reporting with several consumers and for introspection or throwaway owner use. A signature everywhere: loses composability where consumers must filter and join, and is opaque to the caller's own planning. Generating consumers from the full producer schema: trades resilience for convenience; best where producer and consumer release together or drift detection matters more than uptime. Fully tolerant parsing of data that feeds an interpreter: best never (validate what you use).
    Context: Read-only reporting for several consumers (shape-bound acceptable); consumers composing the result themselves; data that crosses a trust boundary or feeds an interpreter (validate the fields used).
    Certainty: Inferred: L309 is the maintainer's alone, so the decision rests on who composes the result, not on the maintainer's row as a default; grounded for the tolerant-reader family (consensus, two sources).
    Ledger rows: L309, L1509, L1272, L1279, L1278, L341.
