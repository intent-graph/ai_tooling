- op: node.create
  uid: CONSTRUCTION.BOUNDARY
  name: Boundary Contracts and Call Shape
  intent: What crosses a trust boundary is parsed once into a precise form under a positive definition of valid; a boundary is written as an explicit contract readable without the producer's code; stored data is exposed to several consumers only through a published interface; a call is shaped so it carries meaning and can change; and a failure is explicit and diagnosable. Code past a boundary may rely on what it receives, and an interface can change without breaking its consumers.
  parent: CONSTRUCTION
  epistemic_state: 'known | gap: the parse-at-the-edge core is grounded (consensus, two top-tier sources); the shape and call rules are inferred'
  design_notes: |-
    Decision (full record text): What crosses a trust boundary is parsed once into a precise form (BOUNDARY.1) under a positive definition of valid (.2); a boundary is written as an explicit contract readable without the producer's code (.3), the stored data is exposed to several consumers only through a published interface (.4), a call is shaped so it carries meaning and can change (.5), and a failure is explicit and diagnosable (.6). Outcome: code past a boundary may rely on what it receives, and an interface can change without breaking its consumers.
    Grounds: Roll-up of BOUNDARY.1 to .6 (23 rows) and L1503 (the origin's roll-up with no claim of its own).
    Context: Consumer reach moves BOUNDARY.3 and .4 (as in ASSURANCE.CONTRACTS.1).
    Certainty: Grounded for the parse-at-the-edge core (consensus, two T1 sources); inferred for the shape and call rules.
    Ledger rows: L1503.
