- op: node.create
  uid: CONSTRUCTION.DATA_NOT_CODE
  name: Keeping Data From Becoming Code
  intent: 'Every sink that interprets data as code, a command, a query, a path, a destination or a serialised object is treated as dangerous: data reaches it only as data, hostile data is narrowed at each sink, and a second layer of least privilege and containment limits what slips through. Hostile data cannot become an instruction or a location an interpreter acts on.'
  parent: CONSTRUCTION
  epistemic_state: 'inferred: roll-up of .1 to .4; the children are grounded (consensus, top-tier sources)'
  design_notes: |-
    Decision (full record text): Every sink that interprets data as code, a command, a query, a path, a destination or a serialised object is treated as dangerous: data reaches it only as data (separately passed values, allowlisted shapes, pure data formats), hostile data is narrowed at each sink and a second layer (least privilege, containment) limits what slips through. Outcome: hostile data cannot become an instruction or a location an interpreter acts on.
    Grounds: Roll-up of .1 to .4 (7 rows) and L1527, L1528 (origin roll-up and node intent, no claim of their own); secrets drawn, compared, stored and logged only through audited mechanisms is held in TRANSVERSE.CONFIG (L1535 moved there).
    Certainty: Grounded for the children (consensus, T1 sources); inferred as a roll-up.
    Ledger rows: L1527, L1528.
  impl_pointers:
  - build/distill/03_judge/J5_construction/judged.md::CONSTRUCTION.DATA_NOT_CODE
  - ../javascript_guidelines/build/handoff/to_software_guideline/package.md::DEFENSE
