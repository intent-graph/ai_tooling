  uid: CONSTRUCTION.DATA_NOT_CODE.2
  name: Queries
  intent: A query reaches its engine as fixed text plus separately passed values, in every store, SQL or not; untrusted values are never concatenated or templated into the text, identifiers, keywords and sort order are redesigned or mapped through a fixed allowlist, and the application's store account has least privilege as a second layer. Input cannot change the structure of a query.
  parent: CONSTRUCTION.DATA_NOT_CODE
  epistemic_state: known
  constraints:
  - MUST NOT build query text from untrusted values
  design_notes: |-
    Decision (full record text): A query reaches its engine as fixed text plus separately passed values, in every store, SQL or not; untrusted values are never concatenated or templated into the text, identifiers, keywords and sort order are redesigned or mapped through a fixed allowlist, and the application's store account has least privilege as a second layer. Outcome: input cannot change the structure of a query.
    Grounds: L1531 (consensus for parameterisation, identifiers and non-immunity; single source for least privilege and the rejection of escaping; REG-1533 to REG-1542).
    Positions: P1 fixed text plus separate values (injection resistance). P2 escaping all input as the primary defence. P3 the belief that non-SQL stores are immune.
    Rejected: P2: fragile, not guaranteed to stop all injections; best only as a last layer where a parameter cannot be used (inferred). P3: false.
    Certainty: Grounded.
    Ledger rows: L1531.
