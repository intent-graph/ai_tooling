- op: node.create
  uid: CONSTRUCTION.DATA_NOT_CODE.4
  name: Structured Payloads
  intent: Data crossing a trust boundary is exchanged in a pure data format that carries neither types nor code and is never deserialised into executable structures; when the expected messages are known, serialised data is signed and verified before deserialising, and a new object is populated from validated fields. Untrusted XML is parsed with document type definitions disabled, and where two components read the same bytes their parsers must agree, so control and delimiter characters that can alter structure never reach a field value. Payload content cannot become executable structure or desynchronise two parsers.
  parent: CONSTRUCTION.DATA_NOT_CODE
  epistemic_state: 'known | gap: the signing step and the protocol rule are single-source'
  constraints:
  - MUST NOT deserialise untrusted data into executable structures
  design_notes: |-
    Decision (full record text): Data crossing a trust boundary is exchanged in a pure data format that carries neither types nor code and is never deserialised into executable structures; when the set of expected messages is known, serialised data is signed and verified before deserialising; a new object is populated from validated fields; when untrusted XML is parsed, document type definitions are disabled (and, where required, external entities and external definitions disabled and entity expansion limited). Where two components read the same bytes their parsers must agree: control and delimiter characters that can alter structure never reach a field value (reject the message or neutralise them at the first parser). Outcome: payload content cannot become executable structure or desynchronise two parsers.
    Grounds: Format, signing, populating a new object, XML (L1533; consensus for the format rule and the XML rule, single source for signing and the new object; REG-1545, REG-1536, REG-1528, REG-1546 to REG-1549); parser disagreement and control characters in a protocol field (L1536; single source RFC section, T1; REG-184; protocol-level, kept here as injection of protocol structure).
    Positions: P1 pure data format, never executable. P2 parsers agree, control characters rejected.
    Rejected: Native object serialisation across a trust boundary: best only inside one trust zone where both ends are one release (inferred).
    Certainty: Grounded for the format and XML rules (consensus); single-source for the signing step and the protocol rule.
    Ledger rows: L1533, L1536.
