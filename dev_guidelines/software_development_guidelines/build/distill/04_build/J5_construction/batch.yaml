- op: node.create
  uid: CONSTRUCTION.DATA_NOT_CODE.1
  name: Code and Commands
  intent: 'Never build code from strings: dynamic evaluation of attacker-influenced text executes it with the caller''s privileges, and a template system that evaluates expressions makes template source code, not data. Start a process without a shell and with a program not chosen by input, prefer library functions to operating-system commands, and where a command is unavoidable allowlist the executable and its arguments and run it with least privilege. Input cannot cause execution.'
  parent: CONSTRUCTION.DATA_NOT_CODE
  epistemic_state: 'known | gap: the case of user-authored logic is inferred (the rows do not cover it)'
  constraints:
  - MUST NOT evaluate attacker-influenced text as code
  - MUST NOT start a process through a shell with input-derived text
  design_notes: |-
    Decision (full record text): Never build code from strings: dynamic evaluation of attacker-influenced text executes it with the caller's privileges, through whatever interface offers it, and a template system that evaluates expressions makes template source code, not data. Start a process without a shell and with a program not chosen by input, so arguments stay arguments; prefer library functions to operating-system commands; where a command is unavoidable, allowlist the executable and its arguments and run it with least privilege. Outcome: input cannot cause execution.
    Grounds: Dynamic evaluation (L1529; grounded for the rule, consensus, four T1 sources; template injection single source T3 and T2; REG-1526 to REG-1531); process start without a shell (L1530; single T1 source, principles only; REG-1532); adjacent L325 (least privilege at the lowest layer, SECURITY.6, settled).
    Positions: P1 never build code from strings. P2 no shell, no input-chosen programs.
    Rejected: Escaping or sanitising input to be evaluated: best never as the defence. Where a product must run user-authored logic: a restricted language recognised by a parser (BOUNDARY.2), confined with least privilege (inferred; the rows do not cover it).
    Certainty: Grounded for the rule (four T1 sources); inferred for the user-authored logic case.
    Ledger rows: L1529, L1530.
  impl_pointers:
