  design_notes: |-
    Decision (full record text): A process starts in seconds and, on a request to stop, stops accepting new work, finishes or returns its in-flight work, and exits; work that cannot finish within the stop window is checkpointed or resumable. Outcome: releases and scaling are cheap and no work is lost.
