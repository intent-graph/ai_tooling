  uid: CONSTRUCTION.STATE
  name: State, Values and Load-Time Effects
  intent: Each fact has one authoritative place, stored relational data is normalised to remove update anomalies and denormalised only for measured need, shared derived state is treated as derived with a plan, values state their precision and changeability, and loading a module has no effect. State cannot silently drift and loading code cannot change behaviour.
  parent: CONSTRUCTION
  epistemic_state: 'inferred: roll-up of STATE.1 to .5'
  design_notes: |-
    Decision (full record text): One authoritative place per fact (STATE.1), stored relational data normalised to remove update anomalies and denormalised only for measured need (STATE.2), shared derived state treated as derived with a plan (STATE.3), values that state their precision and changeability (STATE.4), and no effect when a module is loaded (STATE.5). Outcome: state cannot silently drift and loading code cannot change behaviour.
    Grounds: Roll-up of STATE.1 to .5 (13 rows).
    Certainty: Inferred (roll-up).
  impl_pointers:
  - build/distill/03_judge/J5_construction/judged.md::CONSTRUCTION.STATE
