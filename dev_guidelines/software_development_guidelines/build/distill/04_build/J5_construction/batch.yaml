operations:
- op: node.create
  uid: CONSTRUCTION.DESIGN
  name: Design Derivation
  intent: Design is derived from what the system must do down to code, with effort concentrated on the decisions that are costly to get wrong and those taken no earlier than the product is understood. Required properties lead, structural constraints that induce them are tested against every change, and the design is sized for a stated growth horizon and kept replaceable part by part. This keeps costly decisions from being taken blind.
  parent: CONSTRUCTION
  epistemic_state: 'inferred: roll-up of DESIGN.1 to .4; the children are mostly single-source or maintainer rows'
  design_notes: |-
    Decision (full record text): Design is derived from what the system must do down to code, in order of the cost of reversing each decision (DESIGN.1); effort concentrates on the decisions costly to get wrong and takes them no earlier than the product is understood (DESIGN.2); the required properties lead and the structural constraints that induce them are tested against every change (DESIGN.3); the design is sized for a stated growth horizon and kept replaceable part by part (DESIGN.4). Outcome: the design was good before the code existed, and costly decisions were not taken blind.
    Grounds: Roll-up of DESIGN.1 to .4 (5 rows).
    Certainty: Inferred (roll-up; children mostly single-source or maintainer).
  impl_pointers:
  - build/distill/03_judge/J5_construction/judged.md::CONSTRUCTION.DESIGN
- op: node.create
  uid: CONSTRUCTION.SYSTEM_SHAPE
  name: System Shape
  intent: A system starts as one deployable unit with module boundaries inside, pays the distribution premium knowingly and consolidates again when its cost outgrows its benefit. Unit boundaries are placed only after the domain is understood and are designed to deploy independently, and team structure and module structure are designed together. The system is no more distributed than its forces require, and a boundary once drawn is cheap to live with.
  parent: CONSTRUCTION
  epistemic_state: 'inferred: roll-up of SYSTEM_SHAPE.1 to .4; the sources are practitioner essays, no controlled evidence'
  design_notes: |-
    Decision (full record text): Start as one deployable unit with module boundaries inside (SHAPE.1), pay the distribution premium knowingly and consolidate again when its cost outgrows its benefit (SHAPE.2), place unit boundaries only after the domain is understood and make them deployable independently (SHAPE.3), and design team and module structure together (SHAPE.4). Outcome: the system is no more distributed than its forces require and a boundary, once drawn, is cheap to live with.
    Grounds: Roll-up of SHAPE.1 to .4 (10 rows).
    Context: Team count and independence of release moves SHAPE.1 and .3.
    Certainty: Inferred (roll-up; the sources are practitioner essays, no controlled evidence).
  impl_pointers:
  - build/distill/03_judge/J5_construction/judged.md::CONSTRUCTION.SYSTEM_SHAPE
