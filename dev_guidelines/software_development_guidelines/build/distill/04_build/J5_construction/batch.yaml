  design_notes: |-
    Decision (full record text): A numeric type carries exactly only the values within its precision and range; a value beyond them (money, counters, identifiers) uses a type that represents it exactly, and where a type rounds, equality of computed values is not restored by an arbitrary fixed tolerance (it is arbitrary and not transitive), a tolerance being justified only when derived from the known error of a measured quantity. The code states whether a value cannot change at all or may be changed only by some holders, and what states it also enforces it; no preference between the two is derived. Outcome: no value is silently altered by its representation, and who may change a shared value is known.
    Grounds: Precision and range (L1501; Goldberg 1991, T2, single source; REG-1501; grounded for the tolerance point, inferred for the positive statement; scope: any language with a type that rounds, the row's own); immutability against read-only restriction (L1502; one T2 taxonomy; REG-1502; open for any preference).
    Positions: P1 exact representation beyond precision. P2 a fixed tolerance as the general cure (rejected). P3 state immutability or restriction.
    Rejected: P2 as general cure: best when the quantity is a measurement with a known error and the bound comes from it. A stated preference for immutability over restriction: no admitted source states it; open.
    Context: none beyond the row's own scope (types that round).
    Certainty: Grounded for the tolerance point (one T2 source); inferred for the positive statement; open for any preference between immutability and restriction.
