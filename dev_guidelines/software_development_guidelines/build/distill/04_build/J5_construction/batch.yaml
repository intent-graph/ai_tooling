- op: node.create
  uid: CONSTRUCTION.DESIGN.1
  name: Derivation Order
  intent: 'Derive the design from the outside in and from the costly to the cheap to reverse: usage and scenarios, data flow, structure of the stored data, shape of the system, implementation strategy, and only then code. Test-first or emergent design legitimately fills in the parts cheap to reverse once that frame exists, and a throwaway probe is legitimate to learn usage, never as the keeper. The order follows how the decisions depend on each other, so what is costly to change is decided against real usage, not discovered in code.'
  parent: CONSTRUCTION.DESIGN
  epistemic_state: 'inferred: the order rests on one maintainer row and the reversal-cost argument; no source measures it'
  constraints:
  - MUST decide the data structure and the system boundaries against stated usage before the code that depends on them is kept
  design_notes: |-
    Decision (full record text): Derive the design from the outside in and from the costly to the cheap to reverse: the usage and scenarios the system must serve, the data flow they imply, the structure of the stored data, the shape of the system, the implementation strategy (why and how, stated abstractly), and only then the code. Test-first or emergent design is a legitimate way to fill in the parts that are cheap to reverse once that frame exists (a test encodes a usage scenario; the ordering of tests and code is decided in ASSURANCE.BEHAVIOUR.5), and a throwaway probe is legitimate to learn usage before it is understood, never as the keeper. The order is the order in which the decisions depend on each other; when each is taken is governed by DESIGN.2 (no earlier than the product is understood) and SYSTEM_SHAPE.3. Outcome: what is costly to change was decided against real usage, not discovered in code.
    Grounds: Design first serves correctness and reversibility (L329; MAINT-S01, REG-181, public practice read as majority, differs from test-first or emergent). The ordering is not arbitrary: each step fixes what the next must obey, and the cost of reversal grows from the code (cheap) through the stored-data structure and the system shape (costly). Ordering of tests against code is decided in ASSURANCE.BEHAVIOUR (F4 there: by context).
    Positions: P1 maintainer: derive in the stated order, strategy before tactics (correctness, reversibility). P2 test-first or emergent design (speed of feedback).
    Rejected: P2 as the way to derive the costly-to-reverse structure: feedback arrives after the data and the boundaries exist; best for parts cheap to change (internal logic, small modules), and for exploration when usage is unknown. P1 as a fixed sequence for everything: unnecessary ceremony where reversal is cheap.
    Context: Cost of reversal per part: costly (stored data structure, boundaries) follows the order; cheap (internal logic) may emerge.
    Certainty: Inferred: the order rests on one maintainer row (grounded as the maintainer's practice) and the reversal-cost argument; no source measures it.
    Flags: none. The naming half of L329 is decided in NAMING.3 (MD-03).
    Ledger rows: L329.
  impl_pointers:
  - build/distill/03_judge/J5_construction/judged.md::CONSTRUCTION.DESIGN.1
  - build/research/07_maintainer_doctrine/result.md::MAINT-C65
- op: node.create
  uid: CONSTRUCTION.DESIGN.2
  name: Effort and Timing on Costly Decisions
  intent: Architecture is the shared understanding of the decisions that are costly to get wrong, and design effort is spent there. A hard-to-reverse decision is taken as late as the product's understanding allows and no later than the point where deferring it costs more than deciding; when it cannot wait, the probable use is weighed in it without speculative optimisation. Effort and certainty go where an error would be expensive, and cheap decisions stay cheap.
  parent: CONSTRUCTION.DESIGN
  epistemic_state: 'known | gap: the rule "no later than deferral costs more" is inferred'
  constraints:
  - MUST record a hard-to-reverse decision with its reason
  design_notes: |-
    Decision (full record text): Architecture is the shared understanding of the important decisions, those costly to get wrong, and design effort is spent there. A hard-to-reverse decision is taken as late as the product's understanding allows and no later than the point where deferring it costs more than deciding; when it cannot wait (stored data already in use), the probable use is weighed in it without speculative optimisation. Outcome: effort and certainty are spent where an error would be expensive, and the cheap decisions stay cheap.
    Grounds: Effort at the costly decisions (L1206; REG-1121); deferral until understood, no distributed boundaries up front (L1209; REG-1112); the structure for probable use where reversal is costly (L330, MAINT, held and decided in OWNERSHIP.STANCE.4, J1: consistent).
    Positions: P1 effort at costly decisions (cost of error). P2 defer the hard to reverse (reversibility). They answer two questions, how much effort and when, and do not compete.
    Rejected: Deciding early to remove uncertainty: best when the decision cannot be deferred (a shared interface already published) or when a platform imposes it. Deferring everything: best never; some decisions block the work that produces the understanding.
    Certainty: Grounded (two consensus principle rows); inferred for "no later than deferral costs more".
    Ledger rows: L1206, L1209.
  impl_pointers:
  - build/distill/03_judge/J5_construction/judged.md::CONSTRUCTION.DESIGN.2
  - ../web_architecture_guidelines/build/research/07_architecture_styles/result.md::ARCH-C01
  - ../web_architecture_guidelines/build/research/07_architecture_styles/result.md::ARCH-C04
- op: node.create
  uid: CONSTRUCTION.DESIGN.3
  name: Properties First, Then Constraints
  intent: Choose the system's required properties first, stated so they can be checked, then adopt the set of architectural constraints that induces them, and test each proposed change against those constraints. Where a constraint can be checked mechanically it is a blocking check. The structure then fits the properties the system must have, and a change cannot erode it unnoticed.
  parent: CONSTRUCTION.DESIGN
  epistemic_state: 'known | gap: moderate strength, the two register sources come from one body of design writing'
  constraints:
  - MUST name the property a constraint serves
  design_notes: |-
    Decision (full record text): Choose the system's required properties first (stated so they can be checked), then adopt the set of architectural constraints that induces them, and test each proposed change against those constraints; where a constraint can be checked mechanically it is a blocking check (ASSURANCE.RULES.3). Outcome: the structure fits the properties the system must have, and a change cannot erode it unnoticed.
    Grounds: L1226 (consensus; REG-1124, REG-1125; origin wording HTTP-framed, the principle is neutral); mechanical enforcement of boundaries and fitness properties is settled in ASSURANCE.RULES.3.
    Positions: P1 properties, then constraints, then test changes against them (fit between structure and properties). No competing position recorded.
    Rejected: Constraints chosen by habit or fashion without a property they serve: best never.
    Certainty: Grounded (consensus, two register sources); the single-source origin is one body of design writing, so strength is moderate.
    Ledger rows: L1226.
  impl_pointers:
  - build/distill/03_judge/J5_construction/judged.md::CONSTRUCTION.DESIGN.3
  - ../web_architecture_guidelines/build/research/07_architecture_styles/result.md::ARCH-C22
- op: node.create
  uid: CONSTRUCTION.DESIGN.4
  name: Growth Horizon
  intent: Size the structures that are costly to reverse (stored data layout, partitioning, system shape, published interfaces) for a stated growth horizon, commonly about ten times the present need, and write down the horizon and the measured signal that will end it; parts cheap to change are sized to the present need. Keep parts replaceable behind their boundaries so replacement is part by part, and a part may be knowingly sacrificial if kept modular. The result is no over-design now and no surprise when the horizon is reached.
  parent: CONSTRUCTION.DESIGN
  epistemic_state: 'inferred: one source for the figures, and they illustrate the principle (an order of magnitude), not a measured threshold'
  constraints:
  - MUST state the horizon and the signal for each structure costly to reverse
  design_notes: |-
    Decision (full record text): Size the structures that are costly to reverse (stored data layout, partitioning, system shape, published interfaces) for a stated growth horizon (a common heuristic: about 10x the present need) and write the horizon and the measured signal that will end it down; parts cheap to change are sized to the present need (OWNERSHIP.STANCE.4). Keep parts replaceable behind their boundaries so replacement, when the signal comes, is part by part (EVOLUTION.INCREMENTAL decides rewrite against replacement); a part may be knowingly sacrificial if it is kept modular. Outcome: no over-design now, and no surprise when the horizon is reached.
    Grounds: L1235 (majority; REG-1118: roughly 10x, rewrite before 100x, sacrificial parts); incremental replacement behind the existing interface (L039; REG-033, EVOLUTION.INCREMENTAL).
    Positions: P1 design for 10x, plan the rewrite before 100x (avoid over-design). P2 replace incrementally, not wholesale (reversibility, delivery speed).
    Rejected: A wholesale rewrite as the plan: best when behaviour is well specified, the old system is small, or the architecture itself is the obstacle (EVOLUTION.INCREMENTAL holds the condition). Designing for the final scale now: best when the final scale is already contracted or the structure cannot change later (stored data at very large size, L330).
    Certainty: Inferred: one source for the figures (REG-1118) and they are an example of the principle (an order of magnitude), not a measured threshold.
    Ledger rows: L1235.
  impl_pointers:
  - build/distill/03_judge/J5_construction/judged.md::CONSTRUCTION.DESIGN.4
  - ../web_architecture_guidelines/build/research/07_architecture_styles/result.md::ARCH-C41
- op: node.create
  uid: CONSTRUCTION.SYSTEM_SHAPE.1
  name: Initial Shape, One Unit or Several
  intent: 'A new service starts as one deployable unit with module boundaries inside, and a unit is split out only when a named force requires it: independent scaling, independent release by separate teams, fault isolation that matters, or a different runtime need. Services from the start are the best choice only when the domain boundaries are already known and the team and platform can carry the distribution. The complexity of distribution is thus paid only for a measured benefit.'
  parent: CONSTRUCTION.SYSTEM_SHAPE
  epistemic_state: 'known | gap: direction grounded by majority practitioner sources and case studies without controlled evidence; the list of split triggers and the services-first condition are inferred'
  constraints:
  - MUST state the force that justifies a split
  design_notes: |-
    Decision (full record text): A new service starts as one deployable unit with module boundaries inside (HIDING.2), and a unit is split out only when a named force requires it: independent scaling, independent release by separate teams, fault isolation that matters, or a different runtime need. Outcome: complexity of distribution is paid only for a measured benefit.
    Grounds: One unit first (L1210; majority; REG-1016, REG-1112, REG-1113, REG-1116, REG-1122); no services unless too complex to manage as one (L1211; REG-1113); avoid distributing computation, remote calls cost more and move complexity into the connections (L1214; REG-1016, REG-1116); the small-team "one head" criterion (L1218; REG-1112, REG-1116) is one practitioner's and is not adopted as a test: Fowler agrees on direction only.
    Positions: P1 one unit first (simplicity, cost). P2 not services unless forced (same direction, trigger stated). P3 services from the start (fault isolation, independent scaling; evidence sparse, large organisations report success). P4 avoid distribution. P5 small team integrates.
    Rejected: P3 as the default: pays the distribution premium before any force exists; best when the domain boundaries are already known (rebuilding an existing system), the team already has reasonable experience of building a system of services (REG-1112), and, inferred, several teams must release independently from the first day and the supporting platform (deployment automation, monitoring) already exists. Copying large-organisation patterns in a small team: best never as a reason.
    Context: Team count and independence, and system complexity (L1218, L1211): the split triggers above are the conditions that move the answer.
    Certainty: Grounded for the direction (majority, several practitioner sources, T3 case studies, no controlled evidence); inferred for the list of split triggers and for the services-first condition.
    Ledger rows: L1210, L1211, L1214, L1218.
  impl_pointers:
  - build/distill/03_judge/J5_construction/judged.md::CONSTRUCTION.SYSTEM_SHAPE.1
  - ../web_architecture_guidelines/build/research/07_architecture_styles/result.md::ARCH-C05
  - ../web_architecture_guidelines/build/research/07_architecture_styles/result.md::ARCH-C06
  - ../web_architecture_guidelines/build/research/07_architecture_styles/result.md::ARCH-C09
  - ../web_architecture_guidelines/build/research/07_architecture_styles/result.md::ARCH-C13
- op: node.create
  uid: CONSTRUCTION.SYSTEM_SHAPE.2
  name: Distribution Premium and Its Reversal
  intent: 'Before a unit is split off, the distribution premium is budgeted and in place: automated deployment, monitoring, failure handling and a stated answer to eventual consistency. The shape is not a one-way door: when operating cost grows with the number of units faster than the benefit, units are consolidated, accepting less fault isolation. A split is never taken on without the means to run it, and a bad split can be undone.'
  parent: CONSTRUCTION.SYSTEM_SHAPE
  epistemic_state: 'known | gap: the consolidation rule is inferred (one case study, no source states it as a rule)'
  constraints:
  - MUST have deployment automation, monitoring and failure handling before a split goes live
  design_notes: |-
    Decision (full record text): Before a unit is split off the distribution premium is budgeted and in place: automated deployment, monitoring, failure handling, and a stated answer to eventual consistency. The shape is not a one-way door: when operating cost grows with the number of units faster than the benefit, units are consolidated, accepting less fault isolation. Outcome: a split is never taken on without the means to run it, and a bad split can be undone.
    Grounds: Budget the premium (L1212; consensus; REG-1016, REG-1113); consolidation legitimate when cost grows with unit count (L1219; majority; one case study, REG-1122).
    Positions: P1 budget the premium (cost of operation). P2 consolidate back (cost of operation; loses fault isolation).
    Rejected: Splitting now and building the premium later: best never, the failure modes arrive first. Never consolidating: best only where fault isolation or independent scaling is worth more than the operating cost.
    Context: Number of units against operating cost.
    Certainty: Grounded for the premium (consensus); inferred for the consolidation rule (one T3 case, no T2 source states it as a rule; it follows from the symmetric argument that a cost is reversible).
    Ledger rows: L1212, L1219.
  impl_pointers:
  - build/distill/03_judge/J5_construction/judged.md::CONSTRUCTION.SYSTEM_SHAPE.2
  - ../web_architecture_guidelines/build/research/07_architecture_styles/result.md::ARCH-C07
  - ../web_architecture_guidelines/build/research/07_architecture_styles/result.md::ARCH-C14
- op: node.create
  uid: CONSTRUCTION.SYSTEM_SHAPE.3
  name: Placing Service Boundaries
  intent: A boundary between deployable units is placed only once the domain is understood, because moving functionality across one is far costlier than within one, and units across a boundary are designed to deploy independently without lock-step upgrades. Two units that can only ever change and deploy together are a boundary in the wrong place and are merged or the boundary moved; a coordinated breaking change stays legitimate only as the exception that the contract-evolution decision allows for few, in-house, reachable consumers. A boundary thus buys independent change instead of hiding a coupled system behind a network.
  parent: CONSTRUCTION.SYSTEM_SHAPE
  epistemic_state: 'known | gap: "lock-step is a signal of a misplaced boundary" is inferred (follows from the two positions, no row states it)'
  constraints:
  - MUST NOT place a unit boundary before the domain is understood without recording why
  design_notes: |-
    Decision (full record text): A boundary between deployable units is placed only once the domain is understood, because moving functionality across one is far costlier than within one. Units across a boundary are designed to deploy independently, without orchestrated lock-step upgrades (compatibility defined and verified as ASSURANCE.CONTRACTS.1 and .2 decide). Where two units can only ever change and deploy together, that is a boundary in the wrong place: they are merged or the boundary is moved; coordinated breaking changes deployed together stay legitimate only for the case ASSURANCE.CONTRACTS.1 states (few, in-house, reachable consumers) and are the exception, not the operating mode. Outcome: a boundary buys independent change instead of hiding a coupled system behind a network.
    Grounds: Boundaries after understanding (L1213; consensus; REG-1016, REG-1112); independent deployability among the strongest predictors of continuous delivery (L171; consensus; REG-092, REG-097); the maintainer's additive-plus-coordination practice (L295; REG-181) wins with few reachable consumers and is already placed by the settled CONTRACTS.1, which this decision follows.
    Positions: P1 boundaries after the domain is understood (reversibility). P2 independently deployable units (delivery speed). P3 additive evolution plus coordinated breaking change deployed together (cost of ownership; contradicts P2 when consumers release independently).
    Rejected: P3 as the general rule: impossible when consumers release independently or are external; best, and kept, for few in-house reachable consumers. P2 as an absolute: costly where the units are one team's and release together, in which case the boundary itself is the question.
    Context: Number and reach of consumers (settled in CONTRACTS.1).
    Certainty: Grounded for P1 and P2 (consensus; REG-092, REG-097 are delivery-research sources for loose coupling); inferred for "lock-step is a signal of a misplaced boundary" (follows from P2 and P3, no row states it).
    Flags: none. Settled in the final pass: independent deployability is the purpose of a boundary (L171, consensus); the coordinated breaking change of CONTRACTS.1 stays legitimate as an exception.
    Ledger rows: L171, L1213.
