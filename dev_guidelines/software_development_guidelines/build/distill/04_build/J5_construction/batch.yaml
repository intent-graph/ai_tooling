    Grounds: No admitted evidence supports a paradigm mandate (L1526; REG-1523, REG-1524, REG-1509, REG-1525): the defect-rate studies compare languages, not paradigms within one language, with exceedingly small effects and a contested reproduction (T3, not peer-reviewed); the maintainer chooses per part by intent (L312, MAINT-S01, REG-181), which agrees with the evidence.
    Positions: P1 by intent (fit to the problem). P2 by defect-rate evidence (rejected in the origin; contested).
    Rejected: P2: the evidence does not support it; best when a paradigm-level effect on defects is shown inside one language.
    Certainty: Inferred (from the absence of evidence scoped to a paradigm choice; the contested fact is recorded as contested).
    Ledger rows: L1526.
