- op: node.create
  uid: CONSTRUCTION.PARADIGM.2
  name: Placement of Domain Logic
  intent: 'Place each piece of logic by the property it must have: a rule that must hold whichever code writes is declared in the store; domain logic that changes with the product, is branching or algorithmic, or must be tested fast lives in the application first, and a proven hot spot moves into the data tier as a set-based query. Scheduled work runs where the data lives only when it acts on that store''s state as bounded statements and needs no operating-system commands, no retries beyond a rerun and no cross-system dependencies; otherwise it runs in the application tier or an orchestrator, and it is monitored. Each kind of logic is where it holds, changes and is tested at least cost.'
  parent: CONSTRUCTION.PARADIGM
  epistemic_state: 'inferred: placement by property follows from grounded rows and the settled split; the scheduler clause is single-source maintainer practice, the application-first clause is contested, the set-oriented clause has no row'
  constraints:
  - MUST test logic placed in the store against a real store
  - MUST monitor scheduled work (OPERATION.TELEMETRY.8)
  design_notes: |-
    Decision (full record text): Place each piece of logic by the property it must have. A rule that must hold whichever code writes is declared in the store (settled, ASSURANCE.DATA_INTEGRITY.1). Domain logic that changes with product decisions, is branching or algorithmic, or must be tested fast lives in the application first, and a proven measured hot spot moves into the data tier as a set-based query, not as domain rules. A set-oriented transformation of stored data, where moving the data costs measurably more or atomicity with the data is needed, runs in the data tier (inferred: no row states it). Team skill is a legitimate tie-breaker between placements that meet the properties equally, never a reason to leave an invariant out of the store. Scheduled work runs where the data lives when it acts only on that store's state as bounded statements or batches, and needs no operating-system commands, no retries beyond a rerun and no cross-system dependencies or backfills; otherwise it runs in the application tier or an orchestrator. Scheduled work is monitored through the scheduled-work signals of OPERATION.TELEMETRY.8. Logic placed in the data tier is versioned and tested against a real disposable store. Outcome: each kind of logic is where it holds, changes and is tested at least cost.
    Grounds: Application first, profile, move hot spots into SQL (L1259; contested; REG-1143, T2, 2003; database-heavy position not found at T1 or T2 as an argument for domain logic; consensus that constraints and keys belong in the store); team skill (L1260; REG-1143; kept a tie-breaker: a cost-of-ownership force, not a rule about who writes code, MD-02); testability, in memory behind a replaceable interface against a database needed to test (L1261; REG-1143); scheduled work where the data lives, with the limits that send it elsewhere (L311; MAINT-S01, REG-181, public practice read as contested, a dedicated orchestrator being the usual norm). The decision does not choose between "application" and "database" as camps: the settled DATA_INTEGRITY.1 already splits by kind, and this node extends the same split to the remaining kinds of logic.
    Positions: P1 application first (modifiability; wins with no measured hot spot). P2 logic in the database (correctness across writers, data locality). P3 team skill as input. P4 application logic tests faster. P5 scheduled work in the store against an external orchestrator (cost of ownership and consistency against control and scale).
    Rejected: Database-first for domain rules that change with the product: they change at product speed and need a store to test; best for invariants across writers and for set-based data transformations. Application-only for invariants: leaves migrations and ad-hoc access unguarded (settled). An external orchestrator for every job: best for multi-system pipelines and jobs with retries and dependencies; costs one more system to run for a bounded in-store job.
    Context: Measured hot spot; team comfort with the store's language (L1260); bounded in-store job against multi-system pipeline (L311).
    Certainty: Inferred: placement by property follows from grounded rows and the settled split; the scheduler clause is single-source maintainer practice with no public claim to confirm it; the application-first clause is contested (one T2 source); the set-oriented transformation clause has no row and is inferred.
    Note: technology-bound (a store with a query language), not language-bound.
    Ledger rows: L1259, L1260, L1261, L311.
  impl_pointers:
