- op: node.create
  uid: CONSTRUCTION.DATA_NOT_CODE.3
  name: Paths and Destinations
  intent: 'A file location chosen from input stays inside its base directory: paths are built from internally generated or trusted names, user-supplied names are used only under strict allowlist validation, and containment is checked on the resolved location actually used. A server fetches only destinations it allows: the host is matched against an allowlist, the resolved addresses are validated against the permitted networks, the connection goes only to the validated address, and redirect targets are re-checked. Input cannot name a location outside what was allowed.'
  parent: CONSTRUCTION.DATA_NOT_CODE
  epistemic_state: 'known | gap: the clause "checked after resolution and used without a race" is open in the origin and kept as the logical form of the containment check (inferred)'
  constraints:
  - MUST check containment on the resolved location used
  design_notes: |-
    Decision (full record text): A file location chosen from input stays inside its base directory: paths are built from internally generated or trusted names, user-supplied names are unavoidable only under strict allowlist validation, and containment is checked on the resolved location that is then actually used. A server fetches only destinations it allows: match the host against an allowlist and build the request itself, do not accept complete URLs from users where avoidable, validate the resolved addresses against the permitted networks and connect only to the validated address, and re-check redirect targets. Outcome: input cannot name a location outside what was allowed.
    Grounds: Paths (L1532; consensus for the constraint, single source for one clause; REG-1536, REG-1543, REG-1529, REG-1544); destinations (L1534; consensus for the allowlist, single source for the URL and DNS points; REG-1550, REG-1535, REG-1536); adjacent L340 (redirect allowlist, OWNERSHIP.CONTAINMENT.4, settled).
    Positions: P1 paths stay in the base directory. P2 allowlisted destinations checked at the connected address.
    Rejected: A hostname check alone: not enough, the name can resolve elsewhere; best never alone.
    Certainty: Grounded for the constraints; open for "checked after resolution and used without a race" as a clause (no claim grounds it; kept as the logical form of the containment check, inferred).
    Ledger rows: L1532, L1534.
  impl_pointers:
  - build/distill/03_judge/J5_construction/judged.md::CONSTRUCTION.DATA_NOT_CODE.3
  - ../javascript_guidelines/build/handoff/to_software_guideline/package.md::DEFENSE.INJECTION.4
