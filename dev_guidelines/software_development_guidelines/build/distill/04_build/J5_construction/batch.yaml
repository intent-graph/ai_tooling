  uid: CONSTRUCTION.BOUNDARY.3
  name: What a Contract States
  intent: 'A data contract is an explicit artifact, readable without the producer''s source, stating structure and meaning: names, types, nullability, units, invariants, an owner, and the version or change-log form the contract-evolution decision sets for the consumer reach. Types are stated logically and the store''s, server''s and client''s types are derived from the one place where the chain of types starts, never hand-copied; each contract has one owner, one authoritative provider description and a lifecycle status. A consumer knows what it may rely on and what to ask the owner.'
  parent: CONSTRUCTION.BOUNDARY
  epistemic_state: 'known | gap: derivation of physical types and the checklist reading of the data-engineering contract format are inferred; the latter is open in the origin'
  constraints:
  - MUST state structure and meaning without the producer's source
  - MUST give each contract one owner
  - MUST NOT hand-copy a type across tiers
  design_notes: |-
    Decision (full record text): A data contract is an explicit artifact, readable without the producer's source, stating structure and meaning: names, types, nullability, units, invariants, an owner, and the version or change-log form that ASSURANCE.CONTRACTS.1 decides for the consumer reach. A schema alone is not enough: units, time zone, precision and rounding are written in the contract or enforced by constraints, and "may be null" is declared separately from "may be absent". Types are stated logically in the contract, and the store's, server's and client's types are derived from the one place where the team records that the chain of types starts (ASSURANCE.CONTRACTS.3), never hand-copied; every contract has one owner, one authoritative provider description and a lifecycle status (proposed, active, deprecated, retired). For one application database, take the data-engineering contract format as a checklist (owner, meaning, quality rules, freshness or availability promise, lifecycle) and adopt the full format only when data leaves the application for a platform team. Outcome: a consumer knows what it may rely on and what to ask the owner.
    Grounds: Explicit artifact (L1268; consensus; REG-1149, REG-1153); schema not sufficient, units and precision (L1269; REG-1148, REG-1154); null against absent (L1270; REG-1147, REG-1154); logical type, derive physical (L1288; REG-1153; separation grounded, derivation inferred); owner, version, lifecycle (L1289; REG-1152, REG-1153); data-engineering format as a checklist (L1287; open, REG-1153). The version rule is held in the settled CONTRACTS.1 (over L295, MAINT-C31) and is not restated; the chain-of-types origin is held in CONTRACTS.3.
    Positions: P1 explicit artifact. P2 schema insufficient. P3 null against absent. P4 logical type, physical mapping. P5 owner, version, lifecycle (MAINT: no version numbers). P6 data-engineering format.
    Rejected: A contract that lives in the producer's code: best never for an interface with more than one consumer. The full data-engineering format for one application database: best when data leaves the application for a platform team (data pipelines are deferred by MD-05).
    Context: Consumer reach (versioning, as in CONTRACTS.1); whether data leaves the application for a platform team (format).
    Certainty: Grounded for P1 to P3 (consensus, T2 and standards sources); inferred for the derivation of physical types and for the checklist reading (L1287 open).
