- op: node.create
  uid: CONSTRUCTION.BOUNDARY.6
  name: Errors at the Boundary
  intent: 'A failure is explicit, never silent: mandatory inputs are validated first, and an error names the component and offending values and carries a stable code. Detail is scoped to the audience: full detail goes to the log and to a trusted caller, an untrusted caller receives the stable code and field names, not secrets or internals; a response that fails its own declared output is a defect of the producer, answered with a server error and an alert, never a malformed body. A failure is diagnosable by its owner and a malformed answer never passes as a success.'
  parent: CONSTRUCTION.BOUNDARY
  epistemic_state: 'known | gap: returning the stable code and field names to untrusted callers is inferred'
  constraints:
  - MUST give an error a stable code
  - MUST NOT return a malformed body as a success
  design_notes: |-
    Decision (full record text): A failure is explicit, never silent: mandatory inputs are validated first, and an error names the component and the offending values and carries a stable code (the violated constraint maps to a stable contract error, ASSURANCE.DATA_INTEGRITY.1). Detail is audience-scoped: the full detail (values, internals) goes to the log and to a trusted caller, while an untrusted caller receives the stable code and field names, not secrets or internals. A response that fails its own declared output is a defect in the producing code: return a server error and alert, never a malformed body. Outcome: a failure is diagnosable by its owner and a malformed answer never passes as a success.
    Grounds: Errors name component and values, stable codes, validate mandatory inputs first, explicit failure (L315; MAINT-S01, REG-181, public practice agrees); output that fails the model is a server defect (L1273; REG-1150). The audience scoping is not in a row; it follows from BOUNDARY.1 (an untrusted party must not be handed what feeds an attack). Final pass: the OWASP Error Handling Cheat Sheet, fetched, says "the error details are logged server side for investigation, and not returned to the user"; settled against the maintainer's practice, narrowing L315.
    Positions: P1 diagnosable, stable-coded explicit errors (diagnosability). P2 malformed output is a server defect.
    Rejected: Echoing offending values to every caller: best only where the caller is trusted and the values are not sensitive. Repairing a malformed output silently: best never.
    Context: Trust level of the recipient of the error.
    Certainty: Grounded for P1 core and P2 (agreeing practice, one source for P2) and for withholding internals from untrusted callers (OWASP); inferred for returning the stable code and field names.
    Ledger rows: L315, L1273.
