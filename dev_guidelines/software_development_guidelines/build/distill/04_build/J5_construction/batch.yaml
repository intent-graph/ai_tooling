  uid: CONSTRUCTION.PROCESS.2
  name: Fail Fast Under Supervision
  intent: 'After a failure the program cannot repair, its state is undefined: it records the failure, releases what it owns and ends, and restarting is the job of something outside it; failures the program can repair are handled where they occur. A broken process does not keep serving on undefined state, and recovery does not depend on the broken code.'
  parent: CONSTRUCTION.PROCESS
  epistemic_state: 'inferred: grounded for the one runtime whose documentation states it (one top-tier page), general principle inferred'
  constraints:
  - MUST end the process after an unrepairable failure and record it
  design_notes: |-
    Decision (full record text): After a failure the program cannot repair, its state is undefined: it records the failure, releases what it owns and ends, and restarting is the job of something outside it; failures the program can repair (expected, bounded) are handled where they occur. Outcome: a broken process does not keep serving on undefined state, and recovery does not depend on the broken code.
    Grounds: L1510 (single T1 page, grounded by the origin's merged rule; REG-1507; the origin names runtime hooks, dropped here).
    Positions: P1 end and let a supervisor restart. No competing position recorded.
    Rejected: Continuing after an unrepairable failure: best never. Restart loops with no alert: best never; the supervisor's restart policy and crash-loop alert belong to OPERATION (inferred).
    Certainty: Grounded for the one runtime whose documentation states it (one T1 page, REG-1507); inferred as a general principle.
    Ledger rows: L1510.
