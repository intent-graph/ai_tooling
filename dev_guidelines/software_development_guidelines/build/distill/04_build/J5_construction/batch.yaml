- op: node.create
  uid: CONSTRUCTION.BOUNDARY.4
  name: The Contract Over Stored Data
  intent: The base structures of a store are internal and consumers bind to a published interface. When one application owns the store and all access passes through it, that application's interface is the contract; when several consumers need the data, the owner publishes an application interface by default, or a dedicated published layer in the store where consumers need direct query access or privileges must be separated in the store itself. A change to the stored structure then cannot break an unknown consumer.
  parent: CONSTRUCTION.BOUNDARY
  epistemic_state: 'inferred: contested (one source family against one practice); the conditions are inferred and are the row''s own condition made explicit'
  constraints:
  - MUST NOT expose base structures to a consumer other than the owner
  design_notes: |-
    Decision (full record text): The base structures of a store are internal; consumers bind to a published interface. When one application owns the store and all access passes through it, that application's interface is the contract and no second layer is added (migration discipline carries change). When several consumers need the data, the owner publishes an interface: an application interface by default; a dedicated published layer in the store, with the base structures private, where consumers need direct query access (set queries, reporting) or privileges must be separated in the store itself. Both are interfaces the owner publishes (HIDING.4); neither is an integration database, which binds consumers to the base structures. Which form that layer takes (a shape-bound read surface or an operation with a signature) is decided in BOUNDARY.5. Outcome: a change to the stored structure cannot break an unknown consumer.
    Grounds: Database as contract: a dedicated schema for consumers, base structures private (L1285; contested, one source family, REG-1156, T3); the condition is the row's own (several consumers or strict privilege separation favour it; a single owning server does not need it, WL187 now read); the owner-only structure follows HIDING.4 (L1225; REG-1133). Final pass: REG-1133 fetched in review (integration databases avoided, application-level interfaces preferred); REG-1156 (T3) gives the store layer with no conditions; the conditions are inferred.
    Positions: P1 the store is the contract (independent change of internals). P2 an application API over base tables with migration discipline (no second layer). P3 signature over shape (maintainer, BOUNDARY.5).
    Rejected: P1 for a single owning application: adds a layer and a second place for logic with no consumer to benefit. P2 for several direct consumers or privilege separation: the base structures become the contract and ossify; best only while there is one owner.
    Context: Number of consumers with direct access and whether privilege separation is required (L1285).
    Certainty: Inferred: contested (one T3 source family against one practice), condition inferred in the row; the decision is the row's own condition made explicit.
    Ledger rows: L1285.
