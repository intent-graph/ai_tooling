  name: Shared Derived State
  intent: A cache is derived state and never the source of truth or permanent storage; it has an owner, an explicit expiry or invalidation plan and versioned or prefixed keys. State read by several processes lives in a cache they share, and a per-process cache is used only for data whose divergence is tolerable within a stated staleness. Processes agree on shared derived data and an invalidation failure is bounded.
  parent: CONSTRUCTION.STATE
  epistemic_state: 'known | gap: the invalidation rule is inferred'
  constraints:
  - MUST give every cache an expiry or invalidation plan
  design_notes: |-
    Decision (full record text): A cache is derived state and never the source of truth or permanent storage; it has an owner, an explicit expiry or invalidation plan and versioned or prefixed keys. State read by several processes lives in a cache shared by them; a per-process cache is used only for data whose divergence between processes is tolerable within a stated staleness (immutable data, short expiry). Outcome: processes agree on shared derived data, and an invalidation failure is bounded.
    Grounds: Shared cache in multi-process production, never permanent storage (L1204; consensus; REG-1107, REG-1109); expiry or invalidation plan, versioned keys (L1205; practice, inferred, REG-1107; REG-1111 is a proverb's attribution, not evidence).
    Positions: P1 shared cache (coherence across processes). P2 per-process memory as the cache. P3 explicit invalidation plan.
    Rejected: P2 for mutable data read by several processes: they diverge; best for immutable or short-lived data and for a single process. A cache with no plan: best never.
    Context: Single process or tolerable staleness (per-process acceptable).
    Certainty: Grounded for shared against local in multi-process production; inferred for the invalidation rule.
    Ledger rows: L1204, L1205.
