  name: Value Precision and Mutability
  intent: A numeric type carries exactly only the values within its precision and range; a value beyond them (money, counters, identifiers) uses a type that represents it exactly, and equality of rounded values is not restored by an arbitrary fixed tolerance. The code states whether a value cannot change at all or may be changed only by some holders, and what states it also enforces it. No value is silently altered by its representation and who may change a shared value is known.
  parent: CONSTRUCTION.STATE
  epistemic_state: 'known | gap: the tolerance point is grounded (one source), the positive statement is inferred, and any preference between immutability and restriction is open (no admitted source)'
  constraints:
