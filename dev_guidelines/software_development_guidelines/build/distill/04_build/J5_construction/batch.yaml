- op: node.create
  uid: CONSTRUCTION.BOUNDARY.1
  name: Parse or Validate at the Edge
  intent: Every datum that crosses a trust boundary, including data from internal services, queues, stored records and third-party responses, is converted once at the boundary into the most precise representation the code needs, rejecting what does not fit, before any of it is acted on. Code past the boundary relies on that representation, and a check done by the untrusted party does not count as the boundary; coercion is decided per boundary, strict by default. Partly processed invalid data cannot get past the edge.
  parent: CONSTRUCTION.BOUNDARY
  epistemic_state: known
  constraints:
  - MUST parse at every trust boundary before use
  - MUST NOT rely on a check performed by the party being checked
  design_notes: |-
    Decision (full record text): Every datum that crosses a trust boundary, including data from internal services, queues, stored records and third-party responses, is converted once at the boundary into the most precise representation the code needs, rejecting what does not fit, before any of it is acted on; code past the boundary relies on that representation and does not re-check its structure (narrowing at each sink stays under DATA_NOT_CODE), and a check done by the untrusted party does not count as the boundary. Coercion is decided explicitly per boundary: strict by default, coercing only where the source cannot produce the type (a form or query string), done in one place. Outcome: partly processed invalid data cannot get past the edge.
    Grounds: Parse, do not validate: scattered re-checking lets partly processed data through (L1274; consensus, single source; REG-1151); validate all trust-boundary data including internal sources (L1505; two T1 sources; REG-1503, REG-1504); the parse is the same act as the validation, so L1274 and L1505 do not differ in outcome: validation is the rejecting half of parsing; precise structure carried by types at the boundary and by store constraints (L1275; REG-1139, REG-1151; the store half is settled in DATA_INTEGRITY.1); coercion per boundary (L1280; REG-1155); the intent row L1504 (inferred).
    Positions: P1 parse once at the edge (correctness past the edge). P2 parse every datum into the expected shape. P3 validate all boundary data before use. P4 most precise structure, illegal states unrepresentable. P5 decide coercion per boundary.
    Rejected: Validation scattered through the code: best never as the defence (it is still needed for rules that depend on current state, which are domain rules, not boundary checks). Trusting internal sources without checking: best only where the producer and the consumer are one release and one owner (inferred; REG-1503 states internal sources are checked). Always coercing: best where the source cannot produce the type; always strict: best for a machine API.
    Context: Strict against coercing parsing by boundary kind (L1280).
    Certainty: Grounded (consensus; two T1 sources for P3); grounded for "the untrusted party's check is not the boundary" (REG-1503: client-side validation is bypassable; the architecture half of L1505 stays deferred to the sibling web-architecture guideline and is not judged here).
    Ledger rows: L1504, L1505, L1274, L1275, L1280.
