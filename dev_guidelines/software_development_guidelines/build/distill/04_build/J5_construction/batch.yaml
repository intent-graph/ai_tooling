  design_notes: |-
    Decision (full record text): Valid is defined by a positive rule (an allowlist of values, a pattern, a range, a comparison with an expected structure) and everything else is rejected; validity covers syntax and meaning, including combinations of related fields. Input languages are kept simple enough to be recognised completely before anything is computed from them; for a complex input language a real parser is used, not a hand-written list of allowed or denied patterns. A credential or token is valid only if every cryptographic and validation step its specification requires passes; otherwise it is rejected whole, never trusted in part. Outcome: what is accepted is exactly what was specified, nothing by omission.
