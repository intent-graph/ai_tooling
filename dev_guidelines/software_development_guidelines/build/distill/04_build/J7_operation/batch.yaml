- op: node.create
  uid: OPERATION.RECOVERY
  name: Backup, Restore and Disaster Recovery
  intent: 'Recovery is designed backward from stated recovery objectives per workload: backups that the failure or attacker threatening production cannot take, a strategy and failover rule chosen by tier against cost, a recovery that does not depend on what failed, and an owner and plan kept current. The system can thus be restored within its objectives, and the proof that it can (held in the assurance branch) has stated criteria to test against.'
