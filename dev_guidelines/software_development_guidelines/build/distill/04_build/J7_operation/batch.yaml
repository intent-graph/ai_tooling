- op: node.create
  uid: OPERATION.RECOVERY.3
  name: Backup Protection and Isolation
  intent: At least one backup copy lies outside the failure and attack domain of production, and an attacker already holding production credentials is in the backup threat model, so a backup reachable with production credentials is not independent. The isolation form is chosen by the stated threat and restore-speed requirement (separate account, region or provider; platform-enforced immutable retention; offline copy), backups are encrypted with restricted rights, and no single credential or person can delete every copy or shorten its retention (dual authorisation, or platform-enforced immutable retention).
  parent: OPERATION.RECOVERY
  epistemic_state: 'known | inferred: the 3-2-1-1-0 extension (vendor-originated, T3)'
  constraints:
  - MUST keep one copy independent of production credentials
  - MUST state the threat model and who can delete backups or shorten retention
  - MUST encrypt backups
  - MUST ensure no single credential or person can delete every copy or shorten its retention (dual authorisation, or platform-enforced immutable retention)
  design_notes: |-
    Grounds: independence (L1087; REG-1051, REG-1061, REG-1062, REG-1063, REG-1067, REG-250); form by threat (L1088; REG-1051, REG-1062, REG-1063, REG-1067, contested, conditions stated by the row); baseline and extension (L1089; REG-1062, REG-1063, REG-1067, REG-1077 vendor T3, extension inferred); protection (L1090; REG-1061, REG-1062; the outcome of L1090 holds for a team of one, where dual authorisation is impossible, hence the immutable-retention alternative); credential-holding attacker (L1117; REG-1062, REG-1063, REG-1076, percentages T3 not used).
    Positions considered: P1 independent copy. P2 offline. P3 immutable. P4 separate account, region or provider. P5 3-2-1. P6 3-2-1-1-0. P7 protect confidentiality, integrity, availability. P8 production-credential attacker.
    Rejected positions, with the condition under which each would be best: any copy reachable with production credentials counted as independent (best never). Offline-only where restores must be fast (best when the adversary is destructive and time allows). Immutability where the platform account is unprotected (best when it is protected). 3-2-1 alone where destructive attack is in scope (best for hardware, site or operator error). Separate provider for every system (cost; best when vendor-level loss is in the threat model).
    Context conditions: threat model and restore-speed requirement (L1088, L1089).
    Maintainer decisions: Final pass R-17 and MD-02: the outcome of the dual-authorisation row holds for a team of one, hence the immutable-retention alternative. Cross-unit X8: retention is held in RECOVERY.2, erasure in backups (including an immutable copy, the lock's expiry being its schedule) in TRANSVERSE.PRIVACY.3.
    Certainty (judge record): grounded for independence, protection and the credential-holding attacker; grounded for 3-2-1; inferred for the 3-2-1-1-0 extension.
    Links as recorded: Related TRANSVERSE.SECURITY (L1090 boundary), ASSURANCE.SECURITY.6, OWNERSHIP.SERVICES (L359); retention in RECOVERY.2 and ASSURANCE.DATA_INTEGRITY.3, erasure in TRANSVERSE.PRIVACY.3; stack example L1088 (object-storage compliance modes).
    Ledger rows: L1087, L1088, L1089, L1090, L1117.
  examples:
