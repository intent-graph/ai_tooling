    Grounds: cost to design (L456; REG-119, REG-235, REG-237, consensus); bounded labels (L457; REG-235, REG-237); filtering (L458; REG-237, single vendor); broad instrumentation, benchmark only the hottest code (L459; REG-235); the ledger's tension between breadth and cardinality is resolved in REG-235 by bounding labels. The explicit per-service budget (L460) has no normative source: adopted as the cost counterpart of the objective, inferred.
