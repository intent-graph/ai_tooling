- op: node.create
  uid: OPERATION.RECOVERY.2
  name: Backup Scope and Design
  intent: 'Replication and redundancy are availability measures, not recovery: versioned or point-in-time copies are kept, because replication propagates damage. All data sources are classified and what cannot be recreated is backed up (a reproducible source instead has a tested reproduction path meeting the recovery time objective), together with everything needed to rebuild the service and the cryptographic keys, on storage independent of the encrypted data. Frequency follows the recovery point, locality the recovery time, retention is tiered by age and bounded by undetected-corruption windows, legal retention and privacy periods, and platform state that is the source of truth is backed up and its restore tested.'
  parent: OPERATION.RECOVERY
  epistemic_state: 'known | inferred: that a platform''s own availability does not replace backing up its state'
  constraints:
  - MUST keep point-in-time or versioned copies
  - MUST test the reproduction path where backup is skipped
  - MUST back up keys separately from the data they protect
  - MUST back up platform state where it is the source of truth
  design_notes: |-
    Grounds: L1079 (REG-1051, REG-1055, REG-250); L1085 (REG-1052, REG-1054); L1086 (REG-1051, REG-1061, REG-1062); L1091 (REG-1068, one source); L1092 (retention tiered by age, cross-unit line X8); L1093 and L1094 (REG-1051, REG-1052, REG-1066, REG-250); L1118 (REG-1051, REG-1071, REG-250). Consensus; the seven positions cover different scopes.
    Positions considered: P1 versioned copies, not replication. P2 classify, back up the irreplaceable. P3 test a reproduction path instead. P4 back up the rebuild set. P5 keys separately. P6 frequency, locality, point-in-time. P7 platform state.
    Rejected positions, with the condition under which each would be best: relying on replication as backup (propagates damage; best never). Backing up reproducible data with no tested path (best never skipping; skipping is best only with the tested path and RTO met). A logical dump alone where point-in-time is needed (cannot provide it).
    Context conditions: none.
    Maintainer decisions: Cross-unit X8 and MD-03: this node holds how long backups are kept (tiered by age; oldest copy at least as long as corruption may go undetected and as legal retention requires, no longer than the periods of TRANSVERSE.PRIVACY.2; no row gives a number). What to verify of a rented service's backups is held in OWNERSHIP.SERVICES.
    Certainty (judge record): grounded; "HA does not replace it" for platform state inferred.
    Links as recorded: Related OWNERSHIP.SERVICES (L1112 held there); TRANSVERSE.PRIVACY.2 (periods), .3 (erasure in backups); ASSURANCE.DATA_INTEGRITY.3 (points here for retention); stack pointers L1094 (PostgreSQL), L1118 (Kubernetes).
    Ledger rows: L1079, L1085, L1086, L1091, L1093, L1094, L1118.
