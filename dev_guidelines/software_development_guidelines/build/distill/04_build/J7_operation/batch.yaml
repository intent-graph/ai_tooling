- op: node.create
  uid: OPERATION.RELIABILITY.1
  name: Indicators
  intent: Reliability is defined through a handful of simple indicators measured from the user's point of view and anchored on critical user journeys; one is added only for a coverage gap. Latency is stated as a percentile or distribution, never as an average alone, so the number the team watches moves when users are hurt and the tail is not hidden.
  parent: OPERATION.RELIABILITY
  epistemic_state: known
  constraints:
  - MUST measure indicators from the user's side
  - MUST state latency as a percentile or distribution
  - MUST keep the indicator set small
  design_notes: |-
    Grounds: user-view, journeys, few and simple (L175, L176, L178, L1174; REG-117, REG-125, REG-134, consensus); percentiles (L177, L1173; REG-124, REG-125, REG-226, consensus). The percentile rule is held here (cross-unit line X11): ASSURANCE.PERFORMANCE.1 keeps its threshold on a percentile and points here; PERFORMANCE.5 keeps its own run-to-run distribution rule.
    Positions considered: P1 user-view indicators on journeys (fit to user need, cognitive load). P2 latency as distribution (realism of the signal).
    Rejected positions, with the condition under which each would be best: infrastructure metrics as the definition of reliability (they do not show user experience; best as diagnostic signals, see TELEMETRY.1). Averages alone (hide the tail; best never as a sole statement).
    Context conditions: none.
    Maintainer decisions: MD-03 and cross-unit X11: this node holds the percentile rule; ASSURANCE.PERFORMANCE.1 keeps its threshold on a percentile and points here.
    Certainty (judge record): grounded.
    Links as recorded: Requires nothing; required by RELIABILITY.2 and ALERTING.2; holds the percentile rule that ASSURANCE.PERFORMANCE.1 points to; see ASSURANCE.PERFORMANCE.5.
    Ledger rows: L175, L176, L177, L178, L1173, L1174.
  impl_pointers:
