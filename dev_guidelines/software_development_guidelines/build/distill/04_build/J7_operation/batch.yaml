- op: node.create
  uid: OPERATION.TELEMETRY.3
  name: Instrumentation and Log Emission
  intent: Code is instrumented against a vendor-neutral API with standard semantic conventions, using automatic instrumentation for framework, HTTP and database-client coverage and code-based instrumentation only for business logic; libraries depend on the instrumentation API only, never on an implementation. The application writes logs as an unbuffered, structured event stream to standard output and does not own routing or storage; the execution environment collects and routes them.
  parent: OPERATION.TELEMETRY
  epistemic_state: 'known | inferred: the vendor-SDK and file-logging alternatives and their conditions (unargued in any source read)'
  constraints:
  - MUST use a vendor-neutral instrumentation API
  - MUST NOT make a library depend on an instrumentation implementation
  - MUST NOT route or store logs in application code where the environment does
  design_notes: |-
    Grounds: neutral API (L196; REG-120, REG-121, majority); combined instrumentation (L197, L1168; REG-121, REG-1104); libraries depend on the API (L198; REG-121); stdout event stream (L201, L1166; REG-137, REG-1103, REG-1109). Structured form inferred from TELEMETRY.4 (ids in every record).
    Positions considered: P1 vendor-neutral API (exit risk). P2 vendor SDK (time to value). P3 zero-code plus code-based. P4 libraries depend on the API. P5 stdout event stream (separation of concerns). P6 logging libraries writing to files or collectors.
    Rejected positions, with the condition under which each would be best: the vendor SDK as default (unsourced against REG-120; best when one backend is fixed and a vendor feature outweighs exit cost, then behind the neutral API where possible; inferred). Application-managed log files and routing where an environment collector exists (best never there; best where no execution environment collects output, with routing configured outside the code, inferred).
    Context conditions: process-based application with a collecting environment: stdout; otherwise log to a file or collector as structured events (L201).
    Certainty (judge record): grounded for P1, P3, P4; grounded for P5 for process-based apps; inferred for P2 and P6 (unargued in a read source).
