- op: node.create
  uid: OPERATION.TELEMETRY.5
  name: Trace Sampling
  intent: 'Sampling is decided explicitly: every trace is kept while volume is low, metrics are aggregate-only or retention obligations apply; when volume forces sampling, head sampling suits healthy, predictable traffic and tail sampling (or a hybrid) is used where rare error and slow traces must all be kept, accepting a heavier, stateful pipeline. At a public boundary the sampling decision of an untrusted caller is never continued blindly.'
  parent: OPERATION.TELEMETRY
  epistemic_state: 'known | inferred: the order of the ladder (start with head, add tail with volume)'
  constraints:
  - MUST state the sampling rule
  - MUST NOT honour an untrusted caller's sampling flag at a public boundary unexamined
  design_notes: |-
    Grounds: the three forms and their conditions (L200; REG-119, REG-141, REG-237, contested; REG-119 calls tail sampling almost always necessary in larger systems and a hybrid common); start with head, add tail with volume (L1169, inferred); untrusted caller (L1170; REG-122). The volume hint of about 1,000 traces per second is one documentation's illustration, not adopted as a threshold.
    Positions considered: P1 head. P2 tail. P3 none. P4 head then tail. P5 distrust the caller's decision.
    Rejected positions, with the condition under which each would be best: head sampling where every error trace must be kept (cannot guarantee it; best under healthy predictable traffic). Tail sampling where the team cannot run the infrastructure (best when it can). No sampling at high volume (cost; best at low volume or under retention obligation).
    Context conditions: trace volume, rarity of errors that must be kept, retention obligations, capacity to run the tail pipeline (L200).
    Certainty (judge record): grounded for forms and conditions; inferred for the ladder order; grounded for P5 (one source).
    Links as recorded: Related TELEMETRY.6 (cost); stack pointer L1170 (HTTP).
    Ledger rows: L200, L1169, L1170.
  examples:
  - One documentation illustrates head sampling above about 1,000 traces per second; not adopted as a threshold.
