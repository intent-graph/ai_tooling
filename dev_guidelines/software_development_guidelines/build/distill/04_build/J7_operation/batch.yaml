- op: node.create
  uid: OPERATION.RELIABILITY.2
  name: Objective Level and Starting Point
  intent: The objective is set below 100 percent from user need and the cost of each extra step, never copied from current performance as a final value. Where no objective exists and user need is not yet known, a provisional objective from what is cheaply measurable (existing logs) is allowed if marked provisional and reviewed on a fixed cadence until one derived from user need replaces it.
  parent: OPERATION.RELIABILITY
  epistemic_state: known
  constraints:
  - MUST NOT set the objective at 100 percent
  - MUST derive the objective from user need or mark it provisional with a review date
  - MUST set the objective on an indicator of OPERATION.RELIABILITY.1
  design_notes: |-
    Grounds: below 100 percent (L174; REG-128, REG-134, consensus); not from history, with a way to iterate (L179, L1174; REG-125, REG-134). The two Google sources are reconciled by "start, then review" (ledger note on L179): they disagree on the starting point only, so the decision keeps one rule with the start as its stated condition, not a blend.
    Positions considered: P1 below 100, cost-weighed (cost of ownership, fit). P2 from user need (reliability fit). P3 start from the measurable and iterate (delivery speed, feedback).
    Rejected positions, with the condition under which each would be best: 100 percent (cost rises steeply, users cannot tell; best never). An objective fixed from history with no review (ratifies what exists; best never). Waiting for a perfect user-need study before any objective (best never: no feedback loop exists meanwhile).
    Context conditions: user need known (contracts, known users): set from need directly; not known and no objective exists: provisional start as above (L179 states both conditions).
    Maintainer decisions: MD-01: the two sources disagree only on the starting point; one rule is kept with the start as its stated condition, not a blend. Cross-unit X11: ASSURANCE.PERFORMANCE.1 follows this node for the provisional start.
    Certainty (judge record): grounded.
    Links as recorded: Requires RELIABILITY.1; required by RELIABILITY.3, ALERTING.2.
    Ledger rows: L174, L179.
  impl_pointers:
  - build/distill/03_judge/J7_operation/judged.md::OPERATION.RELIABILITY.2
  - build/research/05_operation/result.md::OPERATE-C01
  - build/research/05_operation/result.md::OPERATE-C06
- op: node.create
  uid: OPERATION.RELIABILITY.3
  name: Error Budget as Trade Mechanism
  intent: 'The gap between 100 percent and the objective is an error budget: a written policy, agreed by those who decide release speed and those who answer for reliability, states how the remaining budget governs release decisions; without that agreement the objective is only a report. Consumption of the budget is one of the written postmortem triggers, with thresholds set in the policy, so that velocity and reliability are traded by a rule both sides accepted before the dispute.'
  parent: OPERATION.RELIABILITY
  epistemic_state: 'known | gap: the no-budget minority position (judgment alone) has no source; the example trigger numbers illustrate one policy only'
  constraints:
  - MUST write the budget policy and have it agreed
  - MUST name the consumption levels that trigger a postmortem
  design_notes: |-
    Grounds: budget as shared objective rule (L180; REG-113, REG-128, majority); written and agreed (L181; REG-134 and REG-128 state that product and operations must agree; REG-133 is an example policy and is kept for the freeze and the postmortem trigger, not for the agreement rule; consensus); postmortem trigger from consumption (L183; REG-133, one example policy). The row's own condition (separate parties needing a depoliticised rule) is where the budget earns most; the written-policy requirement holds wherever more than one party decides.
    Positions considered: P1 budget as shared rule (velocity and reliability jointly). P2 no budget, judgment (unsourced minority). P3 written, agreed policy (binding effect). P4 postmortem triggers from consumption (ties learning to the budget).
    Rejected positions, with the condition under which each would be best: judgment without a budget: best when one party owns both speed and reliability and the choice is its own (inferred; the row records no source, open). An unwritten or unagreed budget (a report, not a rule; best never as a trade mechanism). The numbers of the example trigger (20 percent in four weeks) are illustrative of one policy and are not adopted as a threshold.
    Context conditions: none beyond the separate-parties note above.
    Certainty (judge record): grounded for P1 and P3; grounded as an example for P4; open for P2.
    Links as recorded: Requires RELIABILITY.2; refines INCIDENTS.2 (L205 holds the trigger list).
    Ledger rows: L180, L181, L183.
  examples:
  - 'Example postmortem trigger from one published policy (illustrative, not adopted as a threshold): a single incident consuming more than 20 percent of the budget within four weeks.'
  impl_pointers:
  - build/distill/03_judge/J7_operation/judged.md::OPERATION.RELIABILITY.3
  - build/research/05_operation/result.md::OPERATE-C07
  - build/research/05_operation/result.md::OPERATE-C08
  - build/research/05_operation/result.md::OPERATE-C10
- op: node.create
  uid: OPERATION.RELIABILITY.4
  name: Budget Exhaustion Consequence
  intent: The consequence of exhausting the budget is decided in advance, written in the budget policy and binding, so that the response is automatic and not a negotiation. With many consumers, strict commitments or a weak safety culture it is a freeze of changes except top-priority and security fixes, with disputes escalated to a named person; in a small, high-trust team it may be self-regulation (the team slows and adds testing), still stated beforehand.
  parent: OPERATION.RELIABILITY
  epistemic_state: 'known | gap: the culture condition is inferred from one pair of sources; neither form was measured'
  constraints:
  - MUST state the consequence before exhaustion
  - MUST name the escalation owner where a freeze applies
  design_notes: |-
    Grounds: L182 (REG-128, REG-133); the row names both forms and the conditions under which each wins. Contested; both are conditional best, neither is the average of the other.
    Positions considered: P1 hard freeze (control, reliability). P2 self-regulation (delivery speed, autonomy).
    Rejected positions, with the condition under which each would be best: no stated consequence (the budget then does not bind; best never). Freeze in a small high-trust team is not wrong but costs speed it does not need (P2 is best there); self-regulation with many consumers or strict commitments gives no assurance (P1 is best there).
    Context conditions: number of consumers, strictness of commitments, safety culture (L182).
    Maintainer decisions: MD-02: team and consumer context moves the answer only through the stated conditions (consumers, commitments, safety culture).
    Certainty (judge record): grounded for the need to decide in advance; inferred for the culture condition (one pair of sources, no measurement of either form).
    Links as recorded: Requires RELIABILITY.3.
    Ledger rows: L182.
  impl_pointers:
  - build/distill/03_judge/J7_operation/judged.md::OPERATION.RELIABILITY.4
  - build/research/05_operation/result.md::OPERATE-C09
- op: node.create
  uid: OPERATION.ALERTING.1
  name: Paging Criterion and Rule Hygiene
  intent: Page only for a condition that is urgent, actionable and actively or imminently user-visible; everything else is a ticket or a log. Every page needs human judgment (a page answerable by a mechanical response is automated or removed), and rules and signals never exercised or never exposed are removed while rules that catch real incidents stay simple and predictable.
  parent: OPERATION.ALERTING
  epistemic_state: known
  constraints:
  - MUST classify every alert as page, ticket or log
  - MUST automate or remove a page answerable by script
  - MUST review rules for never-exercised ones
  design_notes: |-
    Grounds: L184, L1175 (REG-113, REG-124, consensus); L186 (REG-124); L188 (REG-124). The three are one outcome seen from the page, the response and the rule set, not competing practices.
    Positions considered: P1 page criterion (cognitive load). P2 human judgment required. P3 prune unexercised rules.
    Rejected positions, with the condition under which each would be best: paging on any threshold breach or on every cause signal (each page costs attention; best never as paging, kept as ticket or diagnosis). Retaining rarely exercised rules for completeness (best never).
    Context conditions: none.
    Certainty (judge record): grounded (one source family, REG-124, for the last two clauses).
    Links as recorded: Related RUNBOOKS.2 (automation), INCIDENTS.3 (alert-to-incident ratio).
    Ledger rows: L184, L1175, L186, L188.
  impl_pointers:
  - build/distill/03_judge/J7_operation/judged.md::OPERATION.ALERTING.1
  - build/research/05_operation/result.md::OPERATE-C11
  - ../web_architecture_guidelines/build/research/06_operations/result.md::OPS-C15
  - build/research/05_operation/result.md::OPERATE-C13
  - build/research/05_operation/result.md::OPERATE-C15
- op: node.create
  uid: OPERATION.ALERTING.2
  name: Alert Basis
  intent: Page on user-visible symptoms and keep cause signals for diagnosis; a cause signal pages only when it predicts imminent user-visible failure the symptom cannot yet show (a failure masked by retries, a resource about to run out). Where an objective exists and false pages are costly, express the symptom alert as budget burn rate over several windows (page for fast burn, ticket for slow burn); where no objective exists, simple threshold alerts on the symptom suffice; where traffic is too low for a burn rate to be meaningful, use synthetic traffic or combine services under one objective rather than simple thresholds.
  parent: OPERATION.ALERTING
  epistemic_state: 'known | gap: burn-rate alerting rests on a single authority with no independent measurement | inferred: the imminent-failure reconciliation of symptom and cause alerts'
  constraints:
  - MUST page on a symptom, or on a cause with a stated imminent user-visible consequence
  - MUST NOT use burn-rate alerts without an objective
  design_notes: |-
    Grounds: symptoms, with white-box for imminent or retry-masked failures (L185; REG-124, REG-131, majority); burn rate versus thresholds (L187; REG-132, one authority, simpler strategies documented as inferior on precision, recall and reset time; the low-traffic remedies are from the same source, fetched in the final pass review). The ledger's early-warning-against-noise tension is resolved by the criterion of ALERTING.1, not by a blend.
    Positions considered: P1 symptoms only (cognitive load). P2 symptoms plus white-box cause alerts (early warning). P3 simple thresholds (maintenance cost). P4 multiwindow burn rate (precision).
    Rejected positions, with the condition under which each would be best: cause alerts as a default page (noise; best only under the imminent-failure condition). Thresholds when an objective exists and false pages cost much (P4 is better; best where no objective exists). Burn-rate alerts with no objective (nothing to burn; best never).
    Context conditions: whether an objective exists and the cost of a false page (L187); on-call capacity moves how many cause alerts can be afforded (L185).
    Maintainer decisions: MD-02: service size is not a context variable here (final pass R-08); the condition is whether an objective exists and whether traffic is high enough for a burn rate.
    Certainty (judge record): grounded for symptoms; grounded on a single authority for burn rate (no independent measurement; open); inferred for the imminent-failure reconciliation.
    Links as recorded: Requires RELIABILITY.2, .3.
    Ledger rows: L185, L187.
  impl_pointers:
  - build/distill/03_judge/J7_operation/judged.md::OPERATION.ALERTING.2
  - build/research/05_operation/result.md::OPERATE-C12
  - build/research/05_operation/result.md::OPERATE-C14
- op: node.create
  uid: OPERATION.TELEMETRY.1
  name: 'What Is Measured - Service and Resource Signals'
  intent: 'The standard set is latency, traffic, errors and saturation: latency, traffic and errors are the request signals every service exposes alike, so anyone can be on call for code they did not write, and saturation is read per resource (utilisation, saturation, errors). Resources are read this way as a quick first check and, when a bottleneck is investigated, by enumerating resources first and checking each; per-statement database statistics are enabled so slow queries are found by measurement.'
  parent: OPERATION.TELEMETRY
  epistemic_state: 'known | inferred: the minimal per-service set is stated by T3 sources, with the T2 golden signals as counterpart'
  constraints:
  - MUST expose latency, traffic, errors and saturation per user-facing service
  design_notes: |-
    Grounds: four golden signals (L190, L1172; REG-124, REG-138); minimal per-service set, T3 sources with the T2 golden signals as counterpart (L191); USE as first check, not a full method (L192, L1180; REG-138); statistics (L1177; REG-1108). The four positions answer different questions (which signals, for which resource, which queries), so each stands. Vantage points are held in TELEMETRY.7 and scheduled-work signals in TELEMETRY.8 (cross-unit line X12; split of the former eleven-row node).
    Positions considered: P1 golden signals. P2 minimal per-service set (on-call familiarity). P3 USE as first check. P4 per-statement statistics.
    Rejected positions, with the condition under which each would be best: USE as a complete diagnostic method (REG-138 says it is not).
    Context conditions: none.
    Maintainer decisions: Cross-unit X12: split of the former eleven-row node; vantage points moved to TELEMETRY.7, scheduled-work signals to TELEMETRY.8. The name is the final-pass name (the skeleton name 'What Is Measured and From Where' no longer fits after the split).
    Certainty (judge record): grounded for P1, P3, P4; P2 as stated by T3 sources with the T2 signals as counterpart.
    Links as recorded: Related TELEMETRY.7, TELEMETRY.8, ASSURANCE.PERFORMANCE.3, .5; stack pointer L1177 (PostgreSQL statistics).
    Ledger rows: L190, L191, L192, L1172, L1180, L1177.
