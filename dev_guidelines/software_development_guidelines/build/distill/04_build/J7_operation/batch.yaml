- op: node.create
  uid: OPERATION.RECOVERY.4
  name: Recovery Strategy, Failover and Failback
  intent: The recovery strategy is chosen per tier from the ladder (backup and restore, pilot light, warm standby, active/active) by the objectives against cost and complexity, never a rung stricter than needed, and every recovery path relied on is exercised; a standby that cannot be exercised realistically is converted to failover (both paths carrying traffic continuously) where the objectives justify it, or removed. Failover is started by a person through an automated push-button procedure where a false alarm costs availability or data, and is automatic on health signals, with trained oversight and tuned thresholds, only where the objective is shorter than a human can meet; failback is planned as its own process.
  parent: OPERATION.RECOVERY
  epistemic_state: 'known | inferred: the reconciliation of a maintained standby against a single production path'
  constraints:
  - MUST choose the rung by tier and objectives
  - MUST exercise every recovery path relied on, converting to failover or removing a standby that cannot be exercised
  - MUST state the failover trigger rule
  - MUST plan failback separately
  design_notes: |-
    Grounds: ladder (L1105; REG-1051, REG-1055, REG-1059, REG-1064, REG-1065; rung boundaries are one vendor's figures, not used); standby versus no-fallback (L1101; REG-1051, REG-1055, REG-1056, REG-1075 T3, fetched in review: convert fallback to failover, exercise both code paths continuously): the sources agree an unexercised path is a liability and differ on exercise versus removal, reconciled by the objective and cost condition (REG-1055: active/active only when business requirements necessitate it); active/active versus warm (L1106; REG-1051, REG-1055); trigger (L1107; REG-1051, REG-1055, REG-1064); failback (L1110; REG-1055, REG-1064).
    Positions considered: P1 ladder by tier. P2 standby, rehearsed. P3 production path only. P4 active/active. P5 warm standby. P6 human-started automated failover. P7 automatic failover. P8 separate failback.
    Rejected positions, with the condition under which each would be best: an unexercised standby (best never; P2 requires the rehearsal of ASSURANCE.AVAILABILITY.5). Active/active chosen for resilience alone at its cost (best only under the stated condition). Automatic failover with untuned thresholds (best never). Failback treated as failover reversed (best never).
    Context conditions: objectives against cost, and recovery time against human response time (L1105, L1107).
    Maintainer decisions: Final pass R-10: an unexercised fallback is a liability; the sources agree on that and differ on exercise versus removal, reconciled by the objective and cost condition.
