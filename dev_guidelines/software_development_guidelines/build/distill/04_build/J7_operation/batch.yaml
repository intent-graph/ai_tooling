- op: node.create
  uid: OPERATION.RECOVERY.5
  name: Recoverability of Recovery Itself
  intent: 'Recovery is independent of what failed: operations kept simple and available, pre-provisioned capacity, and recovery tooling, runbooks, credentials, certificates, pipelines and contact paths placed where the failure cannot take them away, with offline copies for the worst case. Infrastructure and environment are defined as code and can be rebuilt from source on a clean machine or account, the recovered environment is held to the production security baseline with the root cause addressed first, and the trade-off between hardening recovery-critical systems and recovery speed is an explicit per-system decision that defaults to accepting slower recovery for rare events.'
  parent: OPERATION.RECOVERY
  epistemic_state: 'known | inferred: the default toward hardening (one T3 source states and accepts the trade-off); the stated per-system decision is the rule | gap: the opposite position (favour recovery speed) is argued in no source read'
  constraints:
  - MUST keep recovery tooling and credentials outside the failure domain
  - MUST be able to rebuild from source
  - MUST state the hardening-against-speed decision per system
  - MUST hold the recovered environment to the production baseline
  design_notes: |-
    Grounds: independence (L1108; REG-1051, REG-1057, REG-1062, REG-1064, REG-1074; control-plane vocabulary is one vendor's, principle neutral); rebuild from source (L1109; REG-1051, REG-1062, REG-1072); baseline and root cause (L1116; REG-1064, REG-1065); trade-off (L1115; REG-1074, single T3 large operator; the opposite position is argued in no source read).
    Positions considered: P1 independent recovery. P2 rebuild from source. P3 accept slower recovery for security. P4 favour recovery speed. P5 baseline and root cause.
    Rejected positions, with the condition under which each would be best: recovery tooling stored inside the system it recovers (best never). Favouring speed over hardening as the default (unsourced, open; best when the objective cannot be met by the hardened path, then the objective or the design is revisited, inferred). Recovering into a weaker environment and fixing later (best never).
    Context conditions: none beyond the stated trade-off.
    Certainty (judge record): grounded for P1, P2 and P5; the default toward hardening is inferred (one T3 source states and accepts the trade-off, REG-1074); the stated per-system decision is the rule.
    Links as recorded: Related CHANGE_FLOW (infrastructure as code), TRANSVERSE.SECURITY; ASSURANCE.AVAILABILITY.4 (restore path independent of schema tooling).
    Ledger rows: L1108, L1109, L1115, L1116.
