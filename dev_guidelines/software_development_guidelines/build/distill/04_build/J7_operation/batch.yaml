# Batch for unit J7_operation: 40 node.create (9 L2, 31 L3), then intra-unit link.create.
operations:
- op: node.create
  uid: OPERATION.RELIABILITY
  name: Reliability Targets
  intent: Reliability is defined as an objective below 100 percent on a few indicators measured as users experience them, and the gap to that objective is a written, agreed rule that trades release speed against reliability, with its consequence decided before it is needed. Speed and reliability are thereby traded by rule, not by argument.
  parent: OPERATION
  epistemic_state: 'inferred: roll-up of its four children, each carrying its own certainty (grounded, except one open minority view under the error budget)'
  design_notes: |-
    Grounds: roll-up of RELIABILITY.1 to .4.
    Positions and rejected: see the children.
    Context conditions: see children (.4 only).
    Certainty (judge record): inferred (roll-up); children grounded except one open minority view in .3.
    Links as recorded: Realizes ASSURANCE.AVAILABILITY (objectives and budget the availability proof is read against); refined by ASSURANCE.PERFORMANCE.1 (targets for tests); index only here.
  impl_pointers:
  - build/distill/03_judge/J7_operation/judged.md::OPERATION.RELIABILITY
- op: node.create
  uid: OPERATION.ALERTING
  name: Alerting
  intent: A human is paged only for what needs a human now, on the symptom users feel, and the rule set is pruned to that, so that every page is worth waking someone for.
  parent: OPERATION
  epistemic_state: 'inferred: roll-up of its two children'
  design_notes: |-
    Grounds: roll-up of ALERTING.1 and .2.
    Positions and rejected: see the children.
    Context conditions: see .2.
    Certainty (judge record): inferred (roll-up).
    Links as recorded: Realizes ASSURANCE.PERFORMANCE (alerts on the objective); index only here.
  impl_pointers:
  - build/distill/03_judge/J7_operation/judged.md::OPERATION.ALERTING
- op: node.create
  uid: OPERATION.TELEMETRY
  name: Telemetry
  intent: Every service exposes the signals that show user harm and resource strain, observed from inside, from outside and from real users, emitted through a vendor-neutral path, joined by one correlation context, sampled by an explicit rule and bounded as a cost; scheduled work is watched on its own signals. Any incident can then be reconstructed and any slow query or silent failure found, at a volume the team can afford.
  parent: OPERATION
  epistemic_state: 'inferred: roll-up of its eight children; the observability model and the cost bound carry open parts'
  design_notes: |-
    Grounds: roll-up of TELEMETRY.1 to .8.
    Positions and rejected: see the children.
    Context conditions: see .5 (volume, retention).
    Certainty (judge record): inferred (roll-up); .2 and .6 carry open parts.
    Links as recorded: Realizes ASSURANCE.PERFORMANCE (signals, L1177), required by ASSURANCE.DATA_INTEGRITY.4 through TELEMETRY.8 (job signals); index only here.
  impl_pointers:
  - build/distill/03_judge/J7_operation/judged.md::OPERATION.TELEMETRY
- op: node.create
  uid: OPERATION.INCIDENTS
  name: Incidents
  intent: Incidents are declared on written conditions, run by named roles and learned from by blameless review with tracked actions, and the human cost of operating is bounded and measured. An incident is handled at low cost, repeats less, and the people handling it can sustain it.
  parent: OPERATION
  epistemic_state: 'inferred: roll-up of its three children'
  design_notes: |-
    Grounds: roll-up of INCIDENTS.1 to .3.
