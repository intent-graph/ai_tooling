- op: node.create
  uid: OPERATION.TELEMETRY.2
  name: Observability Model and Pipeline Health
  intent: Monitoring (predefined questions, for alerting) and observability (the ability to ask questions nobody defined, for unknown failures) are both provided, designed in across every tier as correlated signals of one system, and every developer is proficient with them. The storage model is chosen by condition (separate metrics, logs and traces where metric alerting dominates and cardinality is low; wide structured events as a single store where failures are novel and distributed and high-cardinality questions routine), and the pipeline itself is checked so that its silence is detected.
  parent: OPERATION.TELEMETRY
  epistemic_state: 'known | inferred: the pipeline check mechanism (a heartbeat or known test event that must arrive) and the condition split for the storage model, argued and not measured'
  constraints:
  - MUST design correlation in
  - MUST detect a silent failure of the telemetry pipeline
  design_notes: |-
    Grounds: both needed (L193; REG-117, REG-136); correlated signals designed in (L1163, L1181; REG-044, REG-118, REG-1103, REG-1110, L1181 inferred); storage model contested (L194; REG-118, REG-140 vendor T3, REG-141): evidence is argued, not measured; shared proficiency (L195; REG-136); monitor the monitoring (L455; REG-217, single T2, one line). The decision states the required outcome (exploration across high-cardinality data, bounded cost) and gives each store its stated condition.
    Positions considered: P1 both. P2 replace the three-pillars model (vendor). P3 separate stores. P4 wide events. P5 trade-off framing. P6 correlated, designed in. P7 shared proficiency. P8 monitor the monitoring.
    Rejected positions, with the condition under which each would be best: the claim that the three-pillars model is to be replaced as a universal (vendor interest, T3; the underlying point, correlation and high-cardinality questions, is kept in the decision). Wide events as the universal store (best in the stated condition; the cost premise is disputed by REG-141). Separate stores as the universal (best in the stated condition). Observability as an operations-only task (best never: code authors hold the context).
    Context conditions: alerting load against failure novelty and cardinality (L194).
    Certainty (judge record): grounded for both-needed, correlation and proficiency; inferred for the pipeline check mechanism (a heartbeat or known test event that must arrive, not stated in the source) and for the condition split (argued, not measured).
    Links as recorded: Related SECURITY.7 (probe that detection works, J3); TELEMETRY.4 (correlation).
    Ledger rows: L193, L194, L195, L1163, L1181, L455.
