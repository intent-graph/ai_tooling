- op: node.create
  uid: TRANSVERSE.PRIVACY.2
  name: Retention Periods
  intent: Retention is a recorded decision per purpose and data class, long enough for the purpose and no longer than the legal, contractual or purpose limit, with deletion automated by class and backup copies included. Nothing is kept without a stated reason and nothing is deleted before its stated need.
  parent: TRANSVERSE.PRIVACY
  epistemic_state: 'known | gap: no source gives a retention period'
  constraints:
  - MUST record the period and its reason per class
  - MUST automate deletion by class
  design_notes: |-
    Decision: Retention is a recorded decision per purpose and data class: long enough for the purpose, investigation included, and no longer than the legal, regulatory, contractual or purpose limit; deletion is automated by retention class and runs on schedule; the periods hold for personal data in backup copies too (OPERATION.RECOVERY.2 keeps a backup no longer than they allow). For logs that hold personal data, retain the legal minimum and delete; for logs that can be pseudonymised, where dwell time is long, retain longer and tier by age. Outcome: nothing is kept without a stated reason and nothing is deleted before its stated need.
    Grounds: per purpose, delete on schedule, automate by class (L1154; REG-1080, REG-1095); recorded decision, two log positions with their conditions (L1150; REG-1089, REG-1093, REG-1095); neither source gives a number, both agree the period is recorded and bounded.
    Positions: P1 legal minimum then delete (privacy, cost). P2 retain long, tier by age (investigation power). P3 per purpose with scheduled, automated deletion.
    Rejected: P1 for logs that are pseudonymised and have long dwell time: P2 is best there. P2 for logs holding personal data: best never. Keep everything indefinitely: best never.
    Context: whether logs hold personal data and how long dwell time is (L1150).
    Certainty: grounded for the rule and conditions; open: no source gives a period.
    Cross-unit fix X8: periods hold for backup copies too; OPERATION.RECOVERY.2 keeps a backup no longer than they allow. No source gives a number.
