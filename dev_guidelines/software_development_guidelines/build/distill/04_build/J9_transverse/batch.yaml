# J9_transverse: 35 nodes (6 L2, 29 L3) and the intra-unit links. Built from judged.md; see result.md.
operations:
- op: node.create
  uid: TRANSVERSE.DOCS
  name: Documentation Practice
  intent: Documentation is sized by its consumers, life and turnover, kept in small documents organised by reader need and reached from an index, and written in layers for each audience, with release changes recorded for readers. Documentation is then found, read at the depth the reader needs and cheap enough to keep current; the mechanisms that keep it true are held in ASSURANCE.DOCS_SYNC.
  parent: TRANSVERSE
  epistemic_state: 'inferred: roll-up of grounded components; no source states the set'
  design_notes: 'Index node (MD-03): holds only authoring and organisation practice; the mechanisms that keep documentation true (same-change delivery, gates, owners, executable examples, one canonical document per topic) are stated once in ASSURANCE.DOCS_SYNC.'
  impl_pointers:
  - build/distill/03_judge/J9_transverse/judged.md::TRANSVERSE.DOCS
- op: node.create
  uid: TRANSVERSE.SECURITY
  name: Security Practice
  intent: The security programme is anchored in a published framework chosen by the question asked, risk is modelled at design time at a depth set by risk, responsibility is explicit and owned from the top, and every vulnerability follows one loop with a published intake. Security work is then covered across the lifecycle, owned and learns from each finding; verification and enforcement are held in ASSURANCE.SECURITY.
  parent: TRANSVERSE
  epistemic_state: 'inferred: roll-up of grounded components; no source states the set'
  design_notes: 'Index node (MD-03): holds only programme practice; verification depth, blocking, tests, scanning and limits on automation are stated once in ASSURANCE.SECURITY.'
  impl_pointers:
  - build/distill/03_judge/J9_transverse/judged.md::TRANSVERSE.SECURITY
- op: node.create
  uid: TRANSVERSE.SECURITY_MONITORING
  name: Security Monitoring and Audit Trail
  intent: Security-relevant events are logged with enough content to reconstruct who did what, when and where; logs are protected and free of what must not be in them; active attacks and the stopping of logging are detected and escalated; and the business audit trail is a separate artifact from the security event log. An attack is then seen in time, can be reconstructed, and a change to data can be accounted for.
  parent: TRANSVERSE
  epistemic_state: 'inferred: roll-up of grounded components; no source states the set'
  design_notes: |-
    Roll-up record (judge): security-relevant events are logged with enough content to reconstruct who did what, when and where; logs are protected and free of what must not be in them; detection and escalation exist for active attacks and for logging stopping; the business audit trail is a separate artifact from the security event log. Outcome: an attack is seen in time, can be reconstructed, and a change to data can be accounted for.
    Certainty (judge): inferred (roll-up).
    Roll-up of its five children. Verification that detection works is held in ASSURANCE.SECURITY.7 (MD-03).
  impl_pointers:
