- op: node.create
  uid: TRANSVERSE.SECURITY_MONITORING.5
  name: Business Audit Trail
  intent: The security event log (what was attempted, for detection) and the business audit trail (what changed, for accountability and queries) are two artifacts designed apart, because they differ in storage, integrity and retention. The audit record is written in the same transaction as the change, and a high-value trail is append-only with tamper detection.
  parent: TRANSVERSE.SECURITY_MONITORING
  epistemic_state: 'inferred: the split into a security event log and a business audit trail is stated by no source; the same-transaction audit use is inferred, the rest is grounded'
  constraints:
  - MUST write the audit record in the transaction of the change
  - MUST give a high-value trail append-only integrity and tamper detection
  design_notes: |-
    Decision: The security event log (who tried what, for detection) and the business audit trail (what changed, for accountability and queries) are two artifacts, designed apart because they differ in storage, integrity needs and retention. The audit record is written in the same transaction as the audited change, so both commit or roll back together; a high-value transaction has an audit trail with integrity controls against tampering or deletion (append-only storage) and tamper detection; entries carry the actual date and the record date. The history mechanism follows how tightly history is queried: an audit log by default, temporal properties or objects when integrated temporal queries are frequent. Outcome: every change to important data can be accounted for, and the account itself cannot be silently altered.
    Grounds: the split (L1252; inferred, no source states it; REG-1089, REG-1090, REG-1142); tamper-resistant trail for high-value transactions (L1246; REG-1089, REG-1090); two dates (L1249; REG-1142); mechanism by query frequency (L1250; REG-1142); same transaction (L1251; REG-1090, REG-1140; grounded for the mechanism, inferred for the audit use, restated stack-neutral from a PostgreSQL origin), and the atomic audit declared in the store is already ASSURANCE.DATA_INTEGRITY.1.
    Positions: P1 two artifacts. P2 integrity-controlled trail for high-value transactions. P3 two dates. P4a audit log, P4b temporal model. P5 same-transaction write.
    Rejected: one log for both purposes: best never (conflicting retention and integrity). Temporal model as default: best when history is queried tightly and integrated with current data. Audit written after commit by a separate process: best never where the account must match the change.
    Context: how tightly history is queried (L1250).
    Certainty: inferred for the split; grounded for the rest, same-transaction audit grounded for the mechanism and inferred for the use.
  impl_pointers:
  - build/distill/03_judge/J9_transverse/judged.md::TRANSVERSE.SECURITY_MONITORING.5
  - ../web_architecture_guidelines/build/research/14_thin_spots/result.md::THIN-C13
