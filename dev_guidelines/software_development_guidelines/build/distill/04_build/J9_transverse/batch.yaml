  constraints:
  - MUST state response and fix times only the team can meet
  - MUST publish a private reporting channel
  design_notes: |-
    Decision: Any system reachable by outsiders publishes a disclosure policy: how to report, a private channel, an acknowledgement within a stated time, a fix of known medium-or-higher vulnerabilities within a stated time, and the contact in a standard place (security.txt with Contact and Expires). The day counts are the team's own commitments, with 14 days to answer and 60 to fix as one project's reference values. A paid bounty is added only after weighing cost, competence and maturity, when triage is mature and the attack surface wide; a periodic penetration test alone is best only when the system cannot be exposed to outside researchers. Outcome: a finder knows where to report and what to expect, and the team can meet what it promised.
    Grounds: publish how to report, private channel, times, standard place (L1141; REG-1094, REG-1097, REG-1098); policy first, bounty after weighing (L1142; REG-1094, REG-1097). No source compares bounty yield.
