- op: node.create
  uid: TRANSVERSE.CONFIG.4
  name: Central Secret Custody and Lifecycle
  intent: Secrets are centralized in one managed solution with fine-grained least-privilege access per service and automated creation, rotation, revocation and expiry, short-lived dynamic secrets are preferred, and every access is audited with logs queryable for a recorded period. One place answers who holds which secret, who read it and when it expires.
  parent: TRANSVERSE.CONFIG
  epistemic_state: known
  constraints:
  - MUST audit every access
  - MUST NOT share one credential across services
  design_notes: |-
    Decision: Secrets are centralized and standardized in one managed secrets solution, with fine-grained least-privilege access per service and automated handling of creation, rotation, revocation and expiry; short-lived dynamic secrets are preferred (CONFIG.5); every access is audited, the logs queryable for a recorded period (one source: at least 90 days, with longer cold storage) set under TRANSVERSE.PRIVACY.2; a platform default store is hardened, not trusted as is. Outcome: one place answers who holds which secret, who read it and when it expires.
    Grounds: L257 (REG-166, REG-173) and L1239 (REG-166), the same normative thing kept apart by the ledger; stated once here. The 90 days queryable with longer cold storage is one source's figure (CI/CD tooling context); the period itself falls under the retention decision of PRIVACY.2, where no source gives a number.
    Positions: P1 central managed solution with lifecycle (L257). P2 central, per-service least privilege, dynamic secrets, audited access (L1239).
    Rejected: secrets per application or per team in ad hoc stores: best never at scale; best on a single small service, where the platform's own store is the managed store.
    Context: none.
    Certainty: grounded (one family of sources, consensus).
    The queryable audit period (one source: at least 90 days, longer cold storage) is one source's figure from CI/CD tooling context; the period falls under the retention decision of TRANSVERSE.PRIVACY.2 (review F07).
  impl_pointers:
  - build/distill/03_judge/J9_transverse/judged.md::TRANSVERSE.CONFIG.4
  - build/research/06_transverse/result.md::TRANS-C49
  - ../web_architecture_guidelines/build/research/05_identity_security/result.md::SEC-C52
- op: node.create
  uid: TRANSVERSE.CONFIG.5
  name: Credential Lifetime and Pipeline Identity
  intent: Credentials are short-lived and issued dynamically where the platform supports it, and every non-human identity authenticates with federated short-lived tokens rather than long-lived stored credentials, holds only the permissions its job needs, is scoped per environment and is kept out of the environment that runs untrusted code. A leaked credential expires by itself and a compromised pipeline reaches only its own scope.
  parent: TRANSVERSE.CONFIG
  epistemic_state: 'known | inferred: the merit of static rotated secrets'
  constraints:
  - MUST NOT store a long-lived cloud credential in the CI system where federation is available
  - MUST scope credentials per environment
  design_notes: |-
    Decision: Credentials are short-lived and issued dynamically with a time to live and automatic revocation where the platform supports it; static secrets rotated on a schedule are acceptable for few services of low criticality or where dynamic issue is unavailable. Every non-human identity (CI and deployment workflows, automated authors) authenticates with federated short-lived tokens (OIDC) rather than long-lived credentials stored in the pipeline, holds only the permissions its job needs, is scoped per environment, and is kept out of the environment that executes generated or untrusted code; no secret appears in pipeline output; the CI/CD system is treated as production. Outcome: a leaked credential expires by itself, and a compromised pipeline reaches only its own scope.
    Grounds: short-lived dynamic credentials, blast radius contained by revoking a lease prefix (L258; REG-166, REG-175; the merit of static secrets inferred); federated tokens, least permissions (L259; REG-176, REG-177); CI/CD as production (L1240; REG-025, REG-166); automation credentials (L1069; REG-1037). The limit on what automation may do is stated once, in ASSURANCE.SECURITY.6.
    Positions: P1 dynamic short-lived (security, blast radius). P2 static rotated (cost, load). P3 OIDC federation. P4 narrowly scoped automation credentials outside the code-executing environment. P5 CI/CD as production.
    Rejected: P1 where the platform cannot issue dynamic credentials or services are few and low criticality: P2 is best. Long-lived credentials duplicated into the CI system: best never.
    Context: number of services and criticality; platform support (L258).
    Certainty: grounded; static secrets' merit inferred.
    The limit on what automation may do is stated once, in ASSURANCE.SECURITY.6 (MD-03).
  impl_pointers:
  - build/distill/03_judge/J9_transverse/judged.md::TRANSVERSE.CONFIG.5
  - build/research/06_transverse/result.md::TRANS-C50
  - build/research/06_transverse/result.md::TRANS-C51
