- op: node.create
  uid: TRANSVERSE.PRIVACY.1
  name: Minimisation, Classification and Design-In
  intent: Only the personal data necessary for each stated purpose is collected by default, sensitive data is classified into protection levels with safeguards per level, and data protection is built into design and defaults scaled to risk. What is not collected cannot leak, and what is held has stated protection.
  parent: TRANSVERSE.PRIVACY
  epistemic_state: known
  constraints:
  - MUST state the purpose for each personal data field collected
  - MUST NOT put personal data in trace context
  design_notes: |-
    Decision: Only the personal data necessary for each stated purpose is collected and processed, by default. Sensitive data, in its encoded forms too, is classified into protection levels with the safeguards documented per level (encryption, integrity, retention, logging, database security, privacy). Data protection is built into design and defaults with measures scaled to the state of the art, cost, and the nature, scope, context and risk of the processing. Where logs support investigation but not identification, identifiers are pseudonymised. Personal or sensitive data never goes into propagated trace context and trace identifiers are never seeded from user-identifiable data. Outcome: what is not collected cannot leak, and what is held has stated protection.
    Grounds: minimisation (L1153; REG-1095; legal basis EU, practice stated neutral); pseudonymised investigation (L1152; REG-1093); classification (L1155; REG-1080); design and defaults scaled by risk (L1156; REG-1080, REG-1095); trace context (L1171; REG-122; restated neutral; how trace context is propagated is in OPERATION.TELEMETRY).
    Positions: P1 minimisation. P2 pseudonymised logs. P3 classification with safeguards per level. P4 protection by design and default. P5 no personal data in trace context.
    Rejected: none competes. Collect now, decide purpose later: best never.
    Context: none.
    Certainty: grounded.
    Legal basis of minimisation is EU text restated as neutral practice (MD-05). How trace context is propagated is held in OPERATION.TELEMETRY.
