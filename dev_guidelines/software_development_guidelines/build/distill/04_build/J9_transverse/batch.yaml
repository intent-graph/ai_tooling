- op: node.create
  uid: TRANSVERSE.DOCS.1
  name: Documentation Budget
  intent: 'The amount of documentation is a recorded decision and its upkeep is budgeted as part of delivery. The level follows the system: minimal where the team is small and the system short-lived, living documentation where the knowledge is in the code, full documentation with owners and gates where consumers are many, life long and people turn over.'
  parent: TRANSVERSE.DOCS
  epistemic_state: 'known | inferred: context mapping of the three levels and the causal reading of documentation quality as a capability driver'
  constraints:
  - MUST record the chosen level
  - MUST record the upkeep budget
  design_notes: |-
    Decision: The amount of documentation is a recorded decision, and upkeep is budgeted as part of delivery, not left to goodwill. The level follows the system: minimal and conversation-first where the team is small, co-located and the system short-lived; living documentation generated or extracted from code and tests where the domain knowledge is already in the code; full docs-as-code with owners and gates (ASSURANCE.DOCS_SYNC) where consumers are many, life is long and people turn over. Whatever the level, effort is allocated so that accuracy-critical text is written by someone who knows the system and specialist writing effort goes to documents that cross interface boundaries and to shared guidance. Outcome: the volume of documentation is one the team can keep true, and the readers who pay most for its absence are covered first.
    Grounds: documentation quality is read as a driver of delivery capability (L231; REG-152; correlational survey data, causality inferred); three levels each win under a stated condition, context mapping marked inferred by the ledger (L236; REG-150, REG-155, REG-164); allocation of effort (L229; REG-150, REG-152), restated as an outcome per MD-02 and consistent with the audience-review rule of ASSURANCE.DOCS_SYNC.2.
    Positions: P1 invest and budget (delivery capability, cost of ownership). P2 minimal, conversation first (cost, speed). P3 living documentation (no manual sync). P4 full docs-as-code with owners and gates (confidence, newcomer load). P5 engineers write, writers focus on cross-boundary documents and guidelines.
    Rejected: P2 as a universal default: best for small co-located teams and short-lived systems. P3 as a universal default: best where the knowledge is in the code; it cannot hold why, context or decisions. P4 as a universal default: best with many consumers, long life, turnover; costs more than a small system can keep up. P5 as a rule about who writes: not stated as a rule (MD-02); kept as the allocation outcome.
    Context: scope and life of the system (many consumers, long life, turnover against a small co-located team, short-lived system); the single variable L236 shows moving the answer.
    Certainty: grounded for the positions and their conditions; the context mapping and the causal reading of P1 are inferred.
    Maintainer decisions: MD-02 (who writes the documentation is not a principle; the allocation of effort is kept as an outcome); MD-03 (levels that rely on owners and gates point to ASSURANCE.DOCS_SYNC). Review F08: a constraint on generated output was removed and a pointer to ASSURANCE.DOCS_SYNC.3 added.
  impl_pointers:
  - build/distill/03_judge/J9_transverse/judged.md::TRANSVERSE.DOCS.1
  - build/research/06_transverse/result.md::TRANS-C22
  - build/research/06_transverse/result.md::TRANS-C27
  - build/research/06_transverse/result.md::TRANS-C20
- op: node.create
  uid: TRANSVERSE.DOCS.2
  name: Organisation and Structure
  intent: Documents are small and modular, each organised by one reader need, reached from an index that is updated in the same change, and improved in small increments. Size caps are enforced mechanically and line-number annotations are never kept by hand, because small documents get updated and hand-kept annotations rot.
  parent: TRANSVERSE.DOCS
  epistemic_state: 'known | inferred: the generated-only condition for line counts and tables of contents; organisation by reader need rests on one taxonomy source'
  constraints:
  - MUST keep an index updated in the change that adds or moves a document
  - MUST NOT keep line-number annotations by hand
  design_notes: |-
    Decision: Documents are small and modular, each organised by one reader need (tutorial, how-to, reference, explanation), reached from an index by role and situation, with cross-references kept and the index updated in the same change as the documents. The set is improved in small increments published at once, never by one large restructuring. Where a formal model exists, each guideline links to the model node it derives from. Size caps are enforced mechanically; a line-number table of contents or line count is acceptable only if generated and checked by a tool, never kept by hand. Outcome: a reader finds the one document for their need, and each document is small enough that its owner updates it.
    Grounds: small documents get updated, large ones do not (L233; REG-150, REG-154); organisation by reader need and incremental improvement (L234; REG-157; one framework read, other taxonomies not); router set with index by role and situation, size cap and links to the model (L321; MAINT, REG-181). The three are facets of one structure (size, axis of organisation, navigation), not rivals; no sentence here blends competing answers. The ledger notes that line counts and tables of contents rot, which is why they are admitted only when checked by a machine (ASSURANCE.DOCS_SYNC.4).
    Positions: P1 small modular documents (keeping documents current). P2 organise by reader need, increments (reader fit). P3 router set with size cap and tables of contents (maintainer; navigation).
    Rejected: hand-kept line-number tables of contents and line counts: best never, they rot unchecked; best when generated and verified by a tool. One large specification: best never for living documentation (it is not updated).
    Context: none.
    Certainty: grounded for P1 and P2 (one taxonomy source for P2); P3 grounded as maintainer practice agreeing with common practice; the generated-only condition is inferred.
    Maintainer decisions: MD-01, MD-03. Where the maintainer's codified practice lost in part: row L321 (MAINT-C57; router set with index, size cap, links to the model, tables of contents) is kept for its router, size cap and links, but hand-kept line counts and line-number tables of contents are admitted only when a tool generates and checks them, since unchecked they rot (best never by hand; best when machine-checked, ASSURANCE.DOCS_SYNC.4). Listed in the final pass for the maintainer's objection; settled, no answer awaited.
  impl_pointers:
  - build/distill/03_judge/J9_transverse/judged.md::TRANSVERSE.DOCS.2
  - build/research/06_transverse/result.md::TRANS-C24
  - build/research/06_transverse/result.md::TRANS-C25
  - build/research/07_maintainer_doctrine/result.md::MAINT-C57
- op: node.create
  uid: TRANSVERSE.DOCS.3
  name: Layered Writing and Audience Split
  intent: 'Text is written at layered depth with diagrams at three zoom levels, so each reader stops at the depth they need, and the durable explanation of a code unit lives with the unit: comments carry why, a unit with many callers carries a structured header. Change history is not kept in the header, because version control already holds it and a second copy would diverge.'
  parent: TRANSVERSE.DOCS
  epistemic_state: 'known | inferred: the choice against the dated header change log rests on L133, L216, L218 and one maintainer row; the deployed-definition case'
  constraints:
  - MUST NOT state in an inline comment what the next line does
  - MUST NOT hold change history in two places
  - MUST give an interface consumed by many callers a structured header
  design_notes: |-
    Decision: Write at layered depth (one sentence, one paragraph, then full what, why and how) with diagrams at three zoom levels (macro, flow, detail), so that a non-engineer can take the why and an engineer the how, with technical vocabulary confined to the internal part. In code, the durable explanation of a unit lives with the unit: inline comments carry only why, invariant or gotcha, never what the next line does; a unit consumed by many callers carries a structured header (summary, parameters, returns, notes, examples with expected output) because its readers will not read its body; long logic gets short step banners mirrored in the header. History is not kept in the header: version control holds it, except where readers cannot see the repository history. Outcome: each reader stops at the depth they need, and the explanation of a unit cannot drift into a second, divergent source of history.
    Grounds: layering and audience split (L322; MAINT, REG-181; agrees with common practice per the ledger); one durable explanation per unit and why-only inline comments (L318; MAINT, REG-181, the ledger reads public practice as contested); the header change log and its dating duplicate version history (partial tension with L133 and L218 per the ledger, agreement on dating with L216), so history is not duplicated in the header (one origin per fact, L218; ASSURANCE.DOCS_SYNC.3). Final pass: settled unchanged; one origin per fact (MD-03, ASSURANCE.DOCS_SYNC.3) and commits carrying what and why (L133) put history in version control; the maintainer's own condition (L318: readers who cannot see the repository history) is honoured, and covers definitions read where they are deployed, such as a function read from a database catalogue (inferred). Listed under "Settled against your practice" for code read inside the repository.
    Positions: P1 layered detail and audience split (maintainer). P2 mandatory structured header, why-only inline comments, step banners (cognitive load, durability). P3 self-documenting code, history in version control (cost of ownership).
    Rejected: mandatory header on every unit: best when the unit is called by many consumers and lives apart from its history; for a private helper P3 is best. Dated change log in the header: best only where readers cannot see repository history. Self-documenting code as the whole answer: best when the unit is small, local and its contract is obvious from its name and types; fails on why and on invariants.
    Context: whether the unit is called by many consumers and lives apart from its history (the row's own condition).
    Certainty: grounded for P1 (maintainer, agrees with common practice); inferred for the choice against the header change log (rests on L133, L216, L218 tension, one maintainer row).
    Maintainer decisions: MD-01, MD-03. Where the maintainer's codified practice lost in part: row L318 (MAINT-C54) puts a dated change log in the unit header; it is kept only where readers cannot see the repository history (for example a definition read from a database catalogue), elsewhere version control holds history, one origin per fact (ASSURANCE.DOCS_SYNC.3, L133). Layered writing (L322, MAINT-C58) won. Final pass T1: settled unchanged and listed for the maintainer's objection; settled, no answer awaited. Review F03: dated verification in a header dropped from the grounds.
  impl_pointers:
  - build/distill/03_judge/J9_transverse/judged.md::TRANSVERSE.DOCS.3
  - build/research/07_maintainer_doctrine/result.md::MAINT-C58
  - build/research/07_maintainer_doctrine/result.md::MAINT-C54
- op: node.create
  uid: TRANSVERSE.DOCS.4
  name: Release Changelog
  intent: Each release has a changelog written for its readers, grouped by change type, with an unreleased section filled in the change that introduces each entry. A list generated from commit messages may seed the draft but is not the record, because commit logs are noisy and a changelog tells readers the noteworthy differences.
  parent: TRANSVERSE.DOCS
  epistemic_state: 'known | gap: the condition under which a commit-generated changelog would be best is inferred and open'
  constraints:
  - MUST fill the Unreleased section in the change that introduces the entry
  design_notes: |-
    Decision: Each release has a changelog written for its readers, grouped by change type, with an "Unreleased" section filled as changes land, so the release note is assembled from entries made in the change itself (presence enforced by the chore rule in ASSURANCE.DOCS_SYNC.4). A list generated from commit messages may seed the draft but is not the record, because commit logs are noisy and document the evolution of the source, while a changelog tells readers the noteworthy differences (REG-162). Outcome: a reader sees what changed for them, per release, without reading history.
    Grounds: human-written, grouped by type, Unreleased section (L235; REG-161, REG-162); entry-present chore rule (ASSURANCE.DOCS_SYNC.4, L226). The reason against the generated list is grounded in REG-162: commit log diffs are full of noise; commits document the evolution of the source, a changelog tells readers the noteworthy differences.
    Positions: P1 human-written per release (reader fit). P2 generated from commit conventions (cost of ownership; recorded, not read).
    Rejected: P2 as the record: best when every commit is held to a convention written for readers and the readers are the developers of the same code (the condition is inferred).
    Context: none shown by a row.
    Certainty: grounded for the rule and for the reason against the generated record (REG-162); the condition under which P2 would be best is inferred and open.
    Review F04: the reason against commit-generated lists is grounded in the source REG-162; flag narrowed to the open condition under which a generated changelog would be best.
  impl_pointers:
  - build/distill/03_judge/J9_transverse/judged.md::TRANSVERSE.DOCS.4
  - build/research/06_transverse/result.md::TRANS-C26
- op: node.create
  uid: TRANSVERSE.DOCS.5
  name: Basis and Evolution of Guidelines
  intent: Every rule records its basis, observed practice with its evidence or a principle with the outcome it guarantees, and a rule that overrides an earlier one states which rule and for which objects. A reader can then tell why a rule exists, how much evidence stands behind it and what it replaced.
  parent: TRANSVERSE.DOCS
  epistemic_state: 'known | inferred: the basis record and the deduced-unconfirmed marker follow from the guideline''s own method'
  constraints:
  - MUST state the basis of each rule
  - MUST state the overridden rule and its objects
  design_notes: |-
    Decision: Every rule records its basis: observed practice, with the evidence, or a principle, with the outcome it guarantees. In a mature codebase rules are induced from analysis of real production code and updated as practice evolves; where there is no mature practice yet, they are deduced from principles and marked as such until practice confirms them. A rule that overrides an earlier one states which rule and for which objects. Outcome: a reader can tell why a rule exists, how much evidence stands behind it, and what it replaced.
    Grounds: induced from real code, overrides stated (L323; MAINT, REG-181; wins in a mature codebase; the ledger records an internal tension with deduction and no public claim for or against). The override note is common to both bases and is the grounded core.
    Positions: P1 induced from practice (what works and is adopted; cost). P2 deduced from principles (correctness, consistency).
    Rejected: P1 in an immature codebase: it codifies habits, not good practice. P2 as the only basis: best when no practice exists to observe; it never tests the rule against reality.
    Context: maturity of the codebase (L323: wins in a mature codebase).
    Certainty: grounded for the override note (L323); the basis record and the 'deduced, unconfirmed' marker are inferred from the guideline's own method: a rule without a stated basis cannot be re-judged (MD-01).
    Maintainer decisions: MD-01. The maintainer's codified practice (L323, MAINT-C59) won as stated for a mature codebase; deduction applies where no practice exists yet. Final pass F11: settled, decision unchanged.
  impl_pointers:
  - build/distill/03_judge/J9_transverse/judged.md::TRANSVERSE.DOCS.5
  - build/research/07_maintainer_doctrine/result.md::MAINT-C59
- op: node.create
  uid: TRANSVERSE.SECURITY.1
  name: Anchor Framework
  intent: 'The secure-development practice is anchored in a published framework used as a list of outcomes to cover, chosen by the question the team needs answered: a requirements standard for one application or supplier, a prescriptive maturity model with an outcome list for a programme across many teams. A descriptive benchmark is evidence of what peers do, never the rule for what to adopt.'
  parent: TRANSVERSE.SECURITY
  epistemic_state: 'known | inferred: the mapping of framework to question | gap: requirements-standard level definitions were not read'
  constraints:
  - MUST name the anchor framework and the question it answers
  - MUST NOT use a descriptive benchmark as the verdict on what to adopt
  design_notes: |-
    Decision: The practice is anchored in a published framework used as a list of outcomes to cover across the lifecycle, not as a prescription of tools, and the framework is chosen by the question: a requirements standard (ASVS) to specify and verify the technical requirements of an application or a supplier, selected by level from the application's risk; a prescriptive maturity model (SAMM) to assess and plan a programme across many teams, with an outcome framework (SSDF) as the list of outcomes the programme covers (P1); a descriptive benchmark (BSIMM) only as evidence of what peers do, never as the rule for what to do. Outcome: the anchor answers a real question and no practice is adopted because peers have it.
    Grounds: outcome list, not tools (L240; REG-004, REG-171); the choice by question (L1120, inferred synthesis of what each source says it is for; REG-1078, REG-1084, REG-1085, REG-171, REG-180); verifiable catalogue serving requirements and testing (L250; REG-180); common practice is not best practice for the benchmark (L1120 on BSIMM). Final pass: L1120 places only SAMM in the assess-and-plan role; L240 treats SSDF as an outcome list. ASVS level shares (about 20%, 50%, 30%; L1121, REG-1078) are reference facts, not decision content.
    Positions: P1 outcome list (coverage). P2 requirements standard (correctness, control). P3 prescriptive maturity model (programme at scale). P4 descriptive benchmark (comparison).
    Rejected: P2 as the programme anchor for many teams: best for one application or a supplier contract. P3 for one application: best with many teams. P4 as a decision rule: best only to justify investment to a sponsor.
    Context: scope of the programme (single application or supplier contract against many teams), shown by L1120.
    Certainty: grounded for what each framework is for; inferred for the mapping by question (marked inferred by the ledger); open: ASVS level definitions were not read (L250).
    Final pass F13: a prescriptive maturity model alone is placed in the assess-and-plan role, the outcome framework is the list of outcomes the programme covers. Requirement-standard level shares (about 20%, 50%, 30%; L1121) are reference facts, not decision content.
  impl_pointers:
  - build/distill/03_judge/J9_transverse/judged.md::TRANSVERSE.SECURITY.1
  - build/research/06_transverse/result.md::TRANS-C31
  - build/research/06_transverse/result.md::TRANS-C41
  - build/research/15_security_depth/result.md::SECD-C02
  - build/research/15_security_depth/result.md::SECD-C03
- op: node.create
  uid: TRANSVERSE.SECURITY.2
  name: Maturity Targets and Cycle
  intent: A maturity model is run as a cycle of assessing, setting a target per practice from context, building a roadmap and taking prescriptive activities. A maturity score or requirement level measures activity and coverage, not security outcomes, so it is paired with outcome measures and never reported as proof that the system is safer.
  parent: TRANSVERSE.SECURITY
  epistemic_state: 'known | inferred: benchmark as evidence and pairing scores with outcome measures | gap: no source shows that higher maturity scores or requirement levels reduce incidents'
  constraints:
  - MUST set targets per practice
  - MUST NOT present a score as an outcome measure
  design_notes: |-
    Decision: A maturity model is run as a cycle: assess current practice, set a target per practice from context (a high level in one practice does not require it in the others), build a roadmap, take the model's prescriptive activities. Descriptive benchmark data is evidence of what peers do, not the verdict. A maturity score or an ASVS level measures programme activity and requirements coverage, not security outcomes, so it is paired with outcome measures (time to detect, a managed figure in TRANSVERSE.SECURITY_MONITORING.4; defects found per stage and closed findings, inferred) and is not reported as evidence that the system is safer. Outcome: effort goes where context needs it, and no score is read as more than it measures.
    Grounds: target per practice (L1123; REG-1084); cycle (L1125; REG-1084, REG-171); benchmark as evidence (L1124; REG-1085; inferred consequence); no source shows higher scores reduce incidents (L1162; REG-1078, REG-1084, REG-1085, REG-171; open). Pairing with outcome measures follows from L1162 and is inferred; ASSURANCE.SECURITY.7 holds only that effectiveness is itself tested.
    Positions: P1 target per practice. P2 cycle. P3 benchmark as evidence.
    Rejected: one uniform level across all practices: best never as a policy (spends where context does not need it). Score as proof of security: best never on current evidence.
    Context: none shown by a row.
    Certainty: grounded for P1 and P2; inferred for P3 and for the pairing with outcome measures; open: whether maturity or level raises outcomes.
    Open evidence gap: no source shows that higher maturity scores or requirement levels reduce incidents (L1162). Review closed the flag; the gap stays in epistemic_state. ASSURANCE.SECURITY.7 holds only that effectiveness is itself tested (review F01).
  impl_pointers:
  - build/distill/03_judge/J9_transverse/judged.md::TRANSVERSE.SECURITY.2
  - build/research/15_security_depth/result.md::SECD-C05
  - build/research/15_security_depth/result.md::SECD-C06
  - build/research/15_security_depth/result.md::SECD-C07
  - build/research/15_security_depth/result.md::SECD-C44
- op: node.create
  uid: TRANSVERSE.SECURITY.3
  name: Design-Time Risk Modelling
  intent: Security risk is modelled during design and again whenever a design change touches data sensitivity, authentication, access control, credentials or a trust boundary, at a depth set by risk. Each model answers four questions and its risks and mitigations are tracked in the team's workflow, so the model is not stale at the next change.
  parent: TRANSVERSE.SECURITY
  epistemic_state: 'known | inferred: the trigger rule for remodelling'
  constraints:
  - MUST track mitigations in the team's workflow
  - MUST remodel on a design change that touches a trust boundary
  design_notes: |-
    Decision: Security risk is modelled during design and again whenever a design change touches data sensitivity, authentication, access control, credentials or a trust boundary; the depth is set by risk: lightweight per change by default, deeper assessment for the high-risk areas and under criticality or regulation. Each model answers four questions (what are we working on, what can go wrong, what are we going to do about it, did we do a good enough job), and its risks and mitigations are tracked in the team's workflow. Outcome: the model is not stale at the next change and effort sits where the cost of error is.
    Grounds: a one-off model is stale at the next change (L241 position a; REG-004, REG-165); effort proportioned to risk (L241 position b, SSDF); the ledger states the two are compatible and the choice is trigger and cadence, which this decision sets as design change and risk; four questions and tracking (L242; REG-004, REG-165). The trigger wording is inferred.
    Positions: P1 continuous, lightweight (correctness over time, feedback speed). P2 deeper, risk-triggered (cost). P3 four questions, tracked.
    Rejected: P1 alone for high-risk areas: best for fast-changing products with an engaged team where risk is moderate. P2 alone: best under criticality or regulation, but a model refreshed only on a risk trigger goes stale on the lower-risk changes between.
    Context: criticality or regulation sets the depth (L241).
    Certainty: grounded for the positions and the four questions; inferred for the trigger rule.
