- op: node.create
  uid: TRANSVERSE.CONFIG.6
  name: Response to a Leaked Secret
  intent: 'A secret found in code, history or logs is treated as compromised: it is revoked at once, rotated by an automated process, removed from the exposed locations, and the audit logs are used to investigate its use. Revocation does not wait for cleanup, so the window in which an exposed credential works is as short as the revocation path.'
  parent: TRANSVERSE.CONFIG
  epistemic_state: known
  constraints:
  - MUST revoke before cleaning
  - MUST be able to rotate without manual steps
  design_notes: |-
    Decision: A secret found in code, history or logs is treated as compromised: it is revoked at once, rotated through an automated process, removed from the exposed locations, and the audit logs are used to investigate what it was used for between exposure and revocation. Revocation does not wait for cleanup of the exposed copy. Outcome: the window in which an exposed credential works is as short as the revocation path.
    Grounds: L252 (REG-166), single source, no counter-position found; investigation use of audit logs follows the stated purpose of keeping them; ASSURANCE.SECURITY.5 states that a secret found in history is rotated.
    Positions: P1 treat as compromised, revoke, rotate, remove, keep audit logs.
    Rejected: cleaning the history and keeping the secret: best never.
    Context: none.
    Certainty: grounded (single source).
    Cross-unit fix X10: this node holds how an exposed credential is revoked, rotated and investigated; OWNERSHIP.LIFECYCLE.3 keeps the supply-chain trigger and points here. A secret found in history is rotated (ASSURANCE.SECURITY.5).
