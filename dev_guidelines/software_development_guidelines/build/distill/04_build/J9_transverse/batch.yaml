  design_notes: |-
    Decision: Development, build, test and production are separated and protected from each other; production and development secrets are isolated; non-production minimizes use of production services; human access to build services is minimized and audited. Parity with production is of kind and version, isolation is of instance and credentials. Outcome: an action in a lower environment cannot affect production and a lower environment cannot read a production secret.
    Grounds: L260 (REG-004, REG-103, REG-166); the parity-versus-isolation synthesis is inferred by the ledger.
