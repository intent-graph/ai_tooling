- op: node.create
  uid: TRANSVERSE.CONFIG.3
  name: Shape of Per-Environment Configuration
  intent: Per-environment configuration is a set of independent granular values; with many deployments each takes its own values, and with a few fixed environments a named environment may be one reviewed file of values. Code never branches on an environment name, so adding a deployment does not multiply configuration.
  parent: TRANSVERSE.CONFIG
  epistemic_state: 'known | inferred: the argument for named bundles and the no-branching rule'
  constraints:
  - MUST NOT branch application code on environment name
  design_notes: |-
    Decision: Per-environment configuration is a set of independent granular values. With many deployments (previews, per tenants) each deployment takes its own values; with a few fixed environments a named environment may be kept as one reviewed file of those values, so that the whole of it is read in one place. Code never branches on an environment name. Outcome: adding a deployment does not multiply configuration, and a fixed environment remains reviewable.
    Grounds: independent values scale with deployments (L255; REG-167, REG-174, Twelve-Factor); named bundles reviewable in one place, the source calls it the traditional approach, argument inferred (L255); the no-branching constraint is inferred from the combinatorial harm of bundles.
    Positions: P1 granular values (scalability, cost). P2 named bundles (reviewability, control).
    Rejected: P1 alone for a handful of fixed environments: P2 is best there. P2 for many deployments: best never (combinatorial growth).
    Context: number of deployments (L255).
    Certainty: grounded for P1; inferred for the argument for P2 and for the no-branching rule.
