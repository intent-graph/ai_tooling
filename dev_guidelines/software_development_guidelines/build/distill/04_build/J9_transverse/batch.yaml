- op: node.create
  uid: TRANSVERSE.SECURITY_MONITORING.1
  name: Events Logged
  intent: Security-relevant events (authentication, authorization, validation and session failures, administrative actions, sensitive data access, higher-risk functionality, errors, control failures and bypass attempts) are logged regardless of the verification level a standard asks for, and every action of an automated actor is logged in a reviewable audit trail. Attacks, misuse and automation can then be reconstructed.
  parent: TRANSVERSE.SECURITY_MONITORING
  epistemic_state: known
  constraints:
  - MUST log authentication, authorization and validation failures
  - MUST log automation actions to a trail a person can review
  design_notes: |-
    Decision: Log security-relevant events: authentication successes and failures, authorization failures, input and output validation failures, session management failures, administrative actions, sensitive data access, use of higher-risk functionality, application errors, and security control failures and bypass attempts. Every action taken by an automated actor (command, tool call, plan change) is logged in a reviewable audit trail. Data-change events are logged per need, as part of the business audit trail (.5), not as security events. Outcome: attacks and misuse leave a record, and automation can be reconstructed.
    Grounds: event list (L1143; REG-1079, REG-1089, REG-1090); automation audit trail (L1073; REG-1034, REG-1036, REG-1037); logging is the precondition for detection (L1146) and for breach determination (PRIVACY.4, inferred link). The note that ASVS 5.0 requires these only at levels 2 and 3 is a fact about what the standard verifies, not about what to log.
    Positions: P1 security event list (detection, reconstruction). P2 log every automated action (accountability).
    Rejected: logging only what the verification level of the standard requires: best never; an application at level 1 still needs the record to detect and to bound a breach.
    Context: none shown by a row.
    Certainty: grounded for the lists; grounded for setting logging independently of the ASVS level: the OWASP Logging Cheat Sheet, fetched in review, says to log these events without levels; ASVS levels set what is verified, not what is needed; ASSURANCE.SECURITY.1 (depth by risk) governs verification depth, not whether security events are recorded.
    Final pass T5: settled unchanged, certainty raised to grounded; the Logging Cheat Sheet (fetched in review) says to log these events without levels, and verification levels set what is verified, not what is needed (ASSURANCE.SECURITY.1 governs verification depth).
