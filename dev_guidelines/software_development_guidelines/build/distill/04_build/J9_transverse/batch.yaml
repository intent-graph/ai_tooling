- op: node.create
  uid: TRANSVERSE.PRIVACY.3
  name: Erasure and Deletion Mechanism
  intent: Deletion is decided per entity from the reason the data is kept and recorded, and the team keeps an inventory of where each personal data field has copies and how an erasure request reaches each. Erased data in a backup is put beyond use until the copy expires on schedule, so an erasure request has a defined path to every copy.
  parent: TRANSVERSE.PRIVACY
  epistemic_state: 'inferred: the per-entity choice from the reason is a synthesis; the erasure log and the handling of a locked backup are inferred | gap: whether erasure must reach logs and every copy on request is contested, no source read settles it'
  constraints:
  - MUST record the deletion choice per entity
  - MUST tell the data subject what happens to backups
  - MUST keep a legally required purge possible (ASSURANCE.DATA_INTEGRITY.3)
  design_notes: |-
    Decision: Deletion is decided per entity from the reason the data is kept, and the choice is recorded: no need, hard delete; recovery or audit of deleted records, form per ASSURANCE.DATA_INTEGRITY.3; queryable past values, temporal model; time-bounded bulk expiry, drop or detach time partitions rather than bulk delete. The team keeps an inventory of where each personal data field has copies (caches, logs, derived stores, third parties, backups) and states for each class how an erasure request reaches it. Backups follow a retention schedule (OPERATION.RECOVERY.2). Erased data in a backup is put beyond use: no other use or access, no restore without re-applying every erasure recorded since the backup was taken (an erasure log kept outside the backup), deletion when the copy expires on schedule; a copy locked as immutable (OPERATION.RECOVERY.3) is handled the same way, the lock's expiry being its schedule. The data subject is told what happens to the backup. Outcome: an erasure request has a defined path to every copy, and deletion is by a mechanism chosen for the reason, not by habit.
    Grounds: per entity from the reason (L1258; REG-1137, REG-1138, REG-1142, REG-1145; inferred synthesis, consistent with ASSURANCE.DATA_INTEGRITY.3 which prefers delete plus same-transaction archive over a flag); partition drop (L1257; REG-1137; restated neutral); copies are an open decision (L1157; REG-1095); backups beyond use (L1114; REG-1069; ICO, one regulator; the erasure log is inferred), text held here for the backup rule (cross-unit X8; ASSURANCE.DATA_INTEGRITY.3, OPERATION.RECOVERY.3 and EVOLUTION.DECOMMISSION.6 point here).
    Positions: P1 decide per reason. P2 partition drop for time-bounded data. P3 erasure reaches copies (open, contested). P4 backups beyond use until the copy expires on schedule.
    Rejected: the form for recovery and audit cases is decided in ASSURANCE.DATA_INTEGRITY.3, not here. Bulk DELETE of time-bounded data: best on small tables where partitioning costs more than it saves (inferred). Treating erasure as complete after the live system: best never.
    Context: none beyond the reasons of P1.
