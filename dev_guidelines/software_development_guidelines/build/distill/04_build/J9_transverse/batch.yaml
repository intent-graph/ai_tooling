- op: node.create
  uid: TRANSVERSE.CONFIG.2
  name: Delivery Channel to the Running Software
  intent: Non-secret configuration is versioned, reviewed and applied at deploy, so the artifact is the same in every environment; secrets live in a managed store and reach the process by runtime injection as mounted files or through the store interface. An environment variable is used only where the platform offers neither or where the process environment is shown not to leak, and the channel and its reason are recorded.
  parent: TRANSVERSE.CONFIG
  epistemic_state: 'known | inferred: the leak vectors of environment variables and the separation of custody from delivery channel'
  constraints:
  - MUST record the channel and its reason
  - MUST NOT deliver a secret inside the artifact
  design_notes: |-
    Decision: Non-secret configuration is versioned and reviewed (CONFIG.1) and applied at deploy as environment values or files, so the artifact is the same in every environment. Secrets live in a managed store (CONFIG.4) and reach the process by runtime injection as mounted files or through the store API; an environment variable is used only where the platform offers neither, or where the process environment is shown not to leak (no child process inherits it, no diagnostics or dumps include it) and a restart suffices to rotate. The channel and the reason are recorded. Outcome: a secret reaches the process without entering the artifact, and its channel is as strong as its criticality.
    Grounds: environment variables are universal, simple, portable, not committed by accident (L254, L1238, L1193; REG-166, REG-167, REG-173, REG-174, REG-082, REG-1109); files or store API allow subscription to change, OWASP is cautious about environment variables (L254, L1238; REG-166, REG-173, REG-174; process-listing and child-process leak vectors inferred, not read); reviewed versioned non-secret configuration promoted with the release (L1193; REG-082, REG-1109; the reconciliation is inferred by the ledger).
    Positions: P1 environment variables (portability, simplicity). P2 mounted files or store API (security, rotation, audit). P3 non-secret configuration in source control with strict review, packaged with binaries, or in an external store for dynamic values.
    Rejected: P1 "environment variables as the default channel for secrets": they are "generally accessible to all processes and may be included in logs or system dumps" (REG-166, OWASP, fetched in review); best only under the condition above. P3 "configuration packaged per environment with the binary": best never (the artifact would differ per environment); non-secret configuration of every environment packaged with the binary and selected at deploy: best where it must change and roll back atomically with the code that reads it (L1193; condition inferred), the artifact staying one.
    Context: criticality of the secret and platform and team size (L254, L1238).
    Certainty: grounded for the positions; inferred for the leak vectors and for the separation of custody from channel.
    Final pass T8: custody (the managed store, CONFIG.4) is split from delivery channel; this split is the judge's reconciliation of two contested rows (L254, L1238), inferred. The earlier rejection of mounted files for a small service on a platform that injects from a managed store was dropped because the new decision supersedes it.
