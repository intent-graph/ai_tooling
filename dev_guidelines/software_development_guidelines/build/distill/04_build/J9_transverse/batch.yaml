- op: node.create
  uid: TRANSVERSE.ENVIRONMENTS.2
  name: Definition Mechanism
  intent: 'The development environment is defined as versioned code and reproducible by anyone on a clean machine, using the cheapest mechanism that gives the reproducibility needed: dependency manifests for a single-language project, a container definition for mixed-skill teams and native dependencies, a pinned package set where byte-level control is required. A new machine then builds and runs the project like every other.'
  parent: TRANSVERSE.ENVIRONMENTS
  epistemic_state: 'known | inferred: the comparative costs and the ladder of mechanisms'
  constraints:
  - MUST keep the definition in version control
  - MUST be able to rebuild from a clean machine
  design_notes: |-
    Decision: The development environment is defined as versioned code and is reproducible by anyone, on a clean machine, from that definition, so that toolchain versions match across machines (and CI where the mechanism allows). The mechanism is the cheapest that gives the reproducibility needed: dependency manifests with language-level isolation for a single-language project with no native dependencies; a container definition (Dev Container) for mixed-skill teams, cloud IDEs and native dependencies; a pinned package set (Nix) where byte-level control of package versions across machines and CI is required and the team accepts the learning cost. Outcome: a new machine builds and runs the project the same way as every other.
    Grounds: three mechanisms, each with its winning condition (L262; REG-014, REG-168, REG-178); the ordering by cost is inferred from the stated costs (comparative costs inferred by the ledger; limits of the Nix pin on host OS and kernel not stated).
    Positions: P1 container definition (onboarding speed, load). P2 pinned package set (reproducibility, control). P3 manifests only (lowest cost; system tools vendored).
    Rejected: P3 with native dependencies or mixed languages: best only for single-language projects with no native dependencies. P2 for a team without the need for byte-level control: best when reproducibility is that strict. P1 as universal: best for mixed-skill teams and cloud IDEs.
    Context: team skill mix and project languages (L262).
    Certainty: grounded for the features; inferred for the comparative costs and the ladder.
    Final pass F12: settled unchanged; the added conditions follow by contraposition from the source row (L262); the limits of the pinned package set on host OS and kernel are not stated by the sources.
  impl_pointers:
  - build/distill/03_judge/J9_transverse/judged.md::TRANSVERSE.ENVIRONMENTS.2
  - build/research/06_transverse/result.md::TRANS-C56
