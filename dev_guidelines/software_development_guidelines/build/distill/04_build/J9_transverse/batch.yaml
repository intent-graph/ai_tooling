- op: node.create
  uid: TRANSVERSE.SECURITY_MONITORING.2
  name: Entry Content, Time and Format
  intent: Every log entry records who, what, when and where, with one event vocabulary and one format across systems, UTC-anchored standard timestamps, synchronized server clocks, an inventory of what is logged at each layer and only documented destinations. Events from many systems can then be sequenced and monitoring can key on stable terms.
  parent: TRANSVERSE.SECURITY_MONITORING
  epistemic_state: 'known | inferred: the receipt-time clause for clients whose clocks cannot be synchronized'
  constraints:
  - MUST use UTC-anchored ISO 8601 timestamps
  - MUST keep one event vocabulary
  design_notes: |-
    Decision: Every entry records who, what, when and where (timestamp, application and address, source address and authenticated identity, event type, severity, affected object, result and reason). One event vocabulary (category prefix plus action) and one format are used across systems, timestamps are ISO 8601 in UTC or with an explicit UTC offset, server clocks are synchronized, an inventory states what is logged at each layer, and logs go only to documented destinations. Where clocks cannot be synchronized (remote clients), the server's receipt time is recorded as well (inferred). Outcome: events from many systems can be sequenced, and monitoring can key on stable terms.
    Grounds: who, what, when, where, inventory, UTC, common format, documented destinations (L1144; REG-1079, REG-1089); vocabulary and ISO 8601 (L1245; REG-1136); synchronized server time, impossible for remote clients (L1248; REG-1089); receipt time is this judge's inference from that limit.
    Positions: P1 entry content and inventory. P2 vocabulary and timestamps. P3 time synchronization.
    Rejected: none competes; three parts of one entry design. Free-text entries: best never where monitoring must key on the terms.
    Context: none.
    Certainty: grounded; the receipt-time clause inferred.
