  uid: TRANSVERSE.SECURITY.6
  name: Disclosure Policy and Bounty
  intent: Any system reachable by outsiders publishes a disclosure policy with a private channel, a stated acknowledgement time, a stated fix time for known medium-or-higher vulnerabilities and the contact in a standard place. A paid bounty is added only after weighing cost, competence and maturity, so a finder knows where to report and the team can meet what it promised.
