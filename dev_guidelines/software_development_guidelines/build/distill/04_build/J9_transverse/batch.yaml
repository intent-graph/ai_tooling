- op: node.create
  uid: TRANSVERSE.PRIVACY.4
  name: Privacy Risk, Impact Assessment and Breach
  intent: 'Privacy is managed as a risk through a framework, not as compliance alone: an impact assessment runs before high-risk processing, the team can determine within a short stated clock what a breach touched, and every breach is recorded with facts, effects and remedial action.'
  parent: TRANSVERSE.PRIVACY
  epistemic_state: 'known | inferred: the neutral restatement of EU text and the link to logging and classification | gap: the framework body was not read'
  constraints:
  - MUST assess before high-risk processing starts
  - MUST record every breach
  design_notes: |-
    Decision: Privacy is managed as a risk through a framework, not as compliance alone. A privacy impact assessment is run before high-risk processing, covering the processing and its purposes, necessity and proportionality, risks to individuals and mitigating measures. The team can determine within a short stated clock what a breach touched, and records every breach with facts, effects and remedial action (EU reference: notification to the authority within 72 hours where feasible). Outcome: high-risk processing is examined before it starts, and a breach can be bounded and accounted for.
    Grounds: risk framework (L1161; REG-1096; grounded as to purpose, open as to detail); assessment (L1158; REG-1095; EU text, inferred as neutral practice); breach determination and record (L1159; REG-1095; link to logging and classification inferred).
    Positions: P1 privacy as risk through a framework. P2 impact assessment before high-risk processing. P3 breach determination and record within a clock.
    Rejected: compliance-only: best never as a substitute for risk management; sufficient where only a legal minimum is demanded and the processing is low risk.
    Context: whether regulation applies (L1158); legal obligations themselves are out of scope (MD-05).
    Certainty: grounded as to purpose; inferred for the neutral restatement and for the link to logging and classification; open: framework body not read.
    Legal obligations themselves are out of scope (MD-05); the EU 72-hour notification is given as a reference value only.
