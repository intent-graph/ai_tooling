  name: Separation and Isolation
  intent: 'Development, build, test and production are separated and protected from each other: secrets are isolated, non-production minimizes use of production services and human access to build services is minimized and audited. Parity with production is of kind and version, isolation is of instance and credentials.'
  parent: TRANSVERSE.ENVIRONMENTS
  epistemic_state: 'known | inferred: the parity-versus-isolation reconciliation'
  constraints:
