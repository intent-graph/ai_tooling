- op: node.create
  uid: TRANSVERSE.SECURITY_MONITORING.4
  name: Detection and Escalation
  intent: 'Logging without alerting and response is a failure: active attacks are detected and escalated in near real time, the stopping of logging is itself detected, and time to detect is a managed figure with a target measured on the team''s own exercises. Detection rules are kept tool-neutral where the platform may change.'
  parent: TRANSVERSE.SECURITY_MONITORING
  epistemic_state: 'known | inferred: the exit-risk argument for tool-neutral rules (one source) | gap: the dwell-time figure is dated, open as a current value'
  constraints:
  - MUST detect when logging stops
  - MUST be able to show a known probe raises an alert (ASSURANCE.SECURITY.7)
  design_notes: |-
    Decision: Logging without alerting and response is a failure: active attacks are detected and escalated in near real time, and the stopping of logging is itself detected. Time to detect is a managed figure with a target, because months of delay raise the damage; the figure is measured on the team's own exercises and incidents, not taken from a quoted average. Where the detection platform may change, detection rules are kept in a tool-neutral format so they survive a platform exit. Outcome: an attack is escalated while it is happening and the team knows how long it takes to see one.
    Grounds: alerting is part of logging, gap noted that the leading standard does not verify alerting (L1146; REG-1079, REG-1089, REG-1090), which is why ASSURANCE.SECURITY.7 requires a known probe to raise an alert; dwell time is the cost to manage (L1147; REG-1082, REG-1093; about 200 days is a dated figure, open as a current value); tool-neutral rules (L1149; REG-1100; one T3 source, exit-risk argument inferred).
    Positions: P1 alert and escalate in near real time. P2 time to detect as the managed cost. P3 tool-neutral rules (exit risk).
    Rejected: tool-native rules only: best when the platform is a stable, deliberate dependency and the rule set is small (inferred). Logging with review after the fact only: best never.
    Context: whether the detection platform may change (P3).
    Certainty: grounded for P1; grounded as quoted for P2 (dated); inferred for P3.
    Review F01: time to detect is managed here; ASSURANCE.SECURITY.7 holds that a known probe must raise an alert. The dwell-time figure of about 200 days is a dated source value, open as a current value.
