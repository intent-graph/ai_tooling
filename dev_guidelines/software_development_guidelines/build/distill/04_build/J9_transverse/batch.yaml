  name: Privacy and Retention
  intent: Personal data is collected only for stated purposes, classified with safeguards per level, retained on a recorded schedule per purpose and deleted by mechanism, with an inventory of copies so erasure can reach them; privacy is managed as a risk, assessed before high-risk processing and answered when a breach occurs. The team holds only the personal data it needs, for as long as it needs it.
  parent: TRANSVERSE
