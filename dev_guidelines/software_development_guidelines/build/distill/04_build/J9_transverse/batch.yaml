- op: node.create
  uid: TRANSVERSE.CONFIG.1
  name: Separation of Configuration from Code and Secrets
  intent: Configuration is kept strictly separate from code and from the deployable package, the test being that the codebase could be open-sourced at any moment without exposing a credential. Secrets are never hardcoded or committed and are kept apart from non-secret configuration, so no credential is recoverable from source, history or artifact.
  parent: TRANSVERSE.CONFIG
  epistemic_state: 'known | gap: the clause on audited platform mechanisms for drawing, comparing, storing and logging secrets is grounded by no claim except in part (audit of access in CONFIG.4, never-log in SECURITY_MONITORING.3)'
  constraints:
  - MUST NOT commit a secret to source or configuration
  - MUST keep one build for every environment
  design_notes: |-
    Decision: Configuration is kept strictly separate from code and from the deployable package: configuration varies across deployments and code does not, and the test is that the codebase could be open-sourced at any moment without exposing a credential. Secrets are never hardcoded in source or committed configuration, and are kept apart from non-secret configuration; confidential data is not held in a plain configuration object. Configuration expressed as code lives in a repository with least-privilege access and tracked, attributable changes, as source does; secrets stay out of it. Outcome: no credential is recoverable from the source, history or artifact, and configuration changes are attributable.
    Grounds: separation and open-source test (L158 and L1192, the same normative thing kept apart by the ledger; REG-092, REG-166, REG-167, REG-174, REG-082, REG-1109); secrets apart from configuration (L256; REG-173, REG-174); configuration as code (L261; REG-004, REG-167); secrets clause of L1535 (REG-166, REG-1551, REG-1552, REG-1553, judged in the JavaScript guideline; its first clause is L158; the prior verdict is one position, here re-examined and confirmed for the two grounded constraints). The second half of L1535 (token acceptance) is held in CONSTRUCTION.BOUNDARY.2 (cross-unit X9).
    Positions: P1 strict separation (L158, L1192). P2 secrets apart from configuration. P3 configuration as code with least-privilege access. P4 L1535: no hardcoded secrets, secrets only through audited mechanisms (the token-acceptance half is held in CONSTRUCTION.BOUNDARY.2).
    Rejected: configuration baked into the artifact per environment: best never (the artifact would differ from what was reviewed). Secrets in a private repository: best never (a private repository is not custody).
    Context: none.
    Certainty: grounded for the separation, the secrets rules and the first clause of P4 (L1535); open for the clause "drawn, compared, stored and logged only through audited platform mechanisms", which no claim grounds except in part: audit of every access is held in CONFIG.4 (L1239) and the never-log rule in SECURITY_MONITORING.3.
    Cross-unit fix X9 (final pass T7): the second half of L1535, token acceptance (a token is valid only if every cryptographic and validation step passes, else rejected whole), is not a configuration rule and moved to CONSTRUCTION.BOUNDARY.2; this node keeps only a link. The prior verdict on L1535 in the JavaScript guideline is one position, re-examined and confirmed here for the two grounded constraints.
