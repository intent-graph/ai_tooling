- op: node.create
  uid: TRANSVERSE.SECURITY_MONITORING.3
  name: Log Protection and Sanitising
  intent: Logs are protected at rest and in transit against modification, injection and unauthorized access, and shipped to a logically separate system where possible; secrets, session identifiers and unneeded personal data are never logged, and client-supplied text is treated as untrusted and sanitized. Logs then cannot be altered by the party they record, cannot be used to attack the reader and do not become a store of secrets.
  parent: TRANSVERSE.SECURITY_MONITORING
  epistemic_state: known
  constraints:
  - MUST NOT log secrets or session identifiers
  - MUST sanitize client-supplied text before writing
  - MUST keep the log writer unable to modify what it has written
  design_notes: |-
    Decision: Logs are protected at rest and in transit: encoded against log injection, protected from modification (an early copy made beyond reach of the writer, for example read-only media), access restricted and recorded, the origin of logs received from outside verified, and logs shipped to a logically separate system for analysis, detection and alerting. Where there is no central collector, logs are kept apart from application data at the least (a separate partition or a write-only account with very restrictive permissions). Passwords, tokens, keys, connection strings, payment data and session identifiers are never logged (a hash of the identifier where tracking is needed); personal data is not logged without need or legal justification (pseudonymisation of investigation logs is held in TRANSVERSE.PRIVACY.1); events arriving from clients are treated as untrusted input, validated and sanitized against CR, LF and delimiters, and encoded for the output format; logging follows the data's protection level. Outcome: logs cannot be altered by the party they record, cannot be used to attack the reader, and do not become a store of secrets.
    Grounds: protection (L1145; REG-1079, REG-1089, REG-1090, REG-1093); separation (L1247; REG-1089); never-log list and sanitising (L1151; REG-1079, REG-1089, REG-1136); client events untrusted (L1254; REG-1089, REG-1090). L1151 and L1254 share the injection clause; it is stated once here.
    Positions: P1 protect at rest and in transit. P2 keep apart from application data. P3 never log secrets and personal data. P4 client events untrusted.
    Rejected: logs in the application's own store with application permissions: best never as protection. Separate partition or write-only account without a central collector: the minimum, best on a small single-host system.
    Context: none.
    Certainty: grounded.
    Review F05: the never-log list stays here, pseudonymisation of investigation logs points to TRANSVERSE.PRIVACY.1.
