  - MUST NOT combine the three conditions in one session without a human gate
  - MUST record the execute-or-write-only decision for a large-blast-radius job
  design_notes: |-
    Binding: MD-01 (the best practice for the point's purpose, not the average), MD-02 (principles and outcomes, whoever does the work), MD-03 (one location per fact; this node holds the mechanism, the index pointers hold the rest).
    Decision (full): Limits on automation and on data access are enforced in the tooling at the lowest layer every path passes through, never by instruction in a prompt; an automated actor does not itself execute a job whose guards cannot be applied or whose effects are irreversible. Two sub-decisions follow. (a) Automation: it gets the least functionality, permission and autonomy its task needs, through a sandbox, scoped credentials, deny rules and deterministic hooks, a scoped workspace and no network egress by default; no single session combines untrusted input, access to sensitive systems or data, and the ability to change state or communicate externally without a human gate; any text an automated actor reads is untrusted input; files that steer an automated actor are versioned and reviewed like code and read-only to it where possible; per-action human approval is paired with enforced boundaries, never the only control. (b) Data access: for a data system, a single sanctioned path with single statements, read-only on production, a statement timeout and an audit log; least-privilege roles separate from application permissions, one standard owner for objects, a catalogue query that finds violations. Starting a job with a large blast radius: the decision to execute under guards or to write only is recorded; execution under enforced guards where the guards can be applied and the effects are reversible; otherwise the job is a reviewed script, and its run is authorized and triggered by the accountable person or named group (RULES.4) through the guarded path, the pipeline wherever it reaches the target; a run from a terminal only where no pipeline reaches the target or supervised ramping is needed, recorded in the same history (a person at their own terminal is an example, not the rule); the database procedure is held in CHANGE_FLOW.DATA_CHANGE.3. Outcome: what an automated actor or an ad-hoc path can touch is bounded by something it cannot argue with, and an executor cannot bypass the guards because the script was reviewed.
    Grounds: enforce in tooling (L1066, L326; REG-1033, REG-1037, REG-1038, REG-181; consensus); least privilege (L1065, L1067; REG-1033, REG-1034, REG-1036, REG-1037, REG-1039); human approval fades (L1050; REG-1037, REG-1038, REG-1044); the three conditions (L1068; REG-1033, REG-1036, REG-1049, generalisation inferred); untrusted input (L1075); steering files (L1064); lowest-layer data access (L325, REG-181); blast-radius decision (L327, L1071; REG-181, REG-1033, REG-1037).
    Positions considered (ledger ids as cited by the judge): P1 tooling, not prompts. P2 approval not the only control. P3 least functionality. P4 never all three. P5 untrusted input. P6 steering files reviewed. P7 lowest-layer data access, maintainer. P8 execute versus write-only for large blast radius.
    Rejected, each with the condition under which it would be the best: application-only authorization: serves speed and misses direct paths (best when the store is reachable only through that application). Agent executes under a classifier or sandbox: best when guards can be applied and the effect is reversible. The maintainer's write-only rule is the best when guards cannot be applied or effects are irreversible; it is stated here as an outcome (the executor cannot bypass the guards and the script was reviewed), not as a rule about who writes.
    Context conditions: blast radius and reversibility of the job (L1071, L327), the one variable that moves P8.
    Certainty (judge): grounded for the enforcement principles and each position of P8; inferred for the framing of P8 as a recorded decision and for the generalisation of P4.
    Flags: none..
    Links (as judged): Requires TRANSVERSE.SECURITY, CHANGE_FLOW.INTEGRATION (attribution, L1062), ASSURANCE.RULES.4 (the accountable person or named group); see CHANGE_FLOW.DATA_CHANGE.3 (database procedure, an authorization stage of the one pipeline) and DATA_CHANGE.8, ASSURANCE.ARTIFACT.2.
