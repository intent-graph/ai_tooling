- op: node.create
  uid: ASSURANCE.SECURITY.6
  name: Enforced Limits on Automation and Access
  intent: Limits on automation and on data access are enforced in tooling at the lowest layer every path passes through, never by instruction in a prompt, and an automated actor does not itself execute a job whose guards cannot be applied or whose effects are irreversible. Automation gets the least functionality, permission and autonomy its task needs and never combines untrusted input, access to sensitive systems and outward state change without a human gate; data access goes through one guarded path with least-privilege roles. What an automated actor or an ad-hoc path can touch is thus bounded by something it cannot argue with.
