- op: node.create
  uid: ASSURANCE.SECURITY.2
  name: Stage Placement and Blocking Policy
  intent: A recorded policy states per stage and risk which security checks run and who reviews findings, and each check runs at the earliest stage it can. A check blocks only while its measured false-alarm rate is within the budget the team states for it (rule held in the trustworthy-signal node), every block carries an audited waiver whose grantors are configured explicitly, and for public-facing or regulated software confirmed exploitable findings above a severity also block at release. A check developers trust therefore cannot be bypassed silently, and a noisy check does not erode trust in the others.
  parent: ASSURANCE.SECURITY
  epistemic_state: 'inferred: positions grounded, the synthesis is inferred; the threshold that makes a check blockable is the team''s stated budget (settled in ASSURANCE.RULES.1)'
  constraints:
  - MUST record the policy and the waiver rule
  - MUST NOT make a check blocking before developers trust its output
  design_notes: |-
    Binding: MD-01 (the best practice for the point's purpose, not the average), MD-02 (principles and outcomes, whoever does the work), MD-03 (one location per fact; this node holds the mechanism, the index pointers hold the rest).
    Decision (full): A recorded policy states, per stage and risk, which checks run and who reviews findings; each check runs at the earliest stage it can (secrets and lint before commit; static, composition and infrastructure scanning at build; dynamic and interactive testing against a running instance; compliance audit after deployment). Whether a finding blocks or advises follows ASSURANCE.RULES.1: a check blocks only while its measured false-positive rate is within the false-alarm budget the team states for it; the one published operating figure is about 10 percent of findings judged not useful, one organisation's (REG-052). A block carries an audited waiver whose categories are recorded; who may waive a block is configured explicitly, since on common platforms anyone with write access can bypass by default (REG-170). For public-facing or regulated software, confirmed exploitable findings above a severity also block at release. Findings are triaged in the normal workflow and tool findings are reviewed by a human who remediates. Outcome: a check that developers trust cannot be bypassed silently, and a noisy check does not erode trust in the others.
    Grounds: earliest-stage placement (L245; REG-004, REG-169; tool mapping inferred); blocking policy: block on a curated high-confidence set and advise on the rest, which wins when noise is nonzero, almost always (L246, L1131; REG-052, REG-1086, REG-1092), the rule itself held in ASSURANCE.RULES.1; push protection blocks and audited bypass keeps control and speed (L246; REG-170, REG-179); release-time block (L1131, REG-1094); policy decided, not left (L244, REG-004).
    Positions considered (ledger ids as cited by the judge): P1 policy per stage and risk. P2 earliest stage. P3 blocking gate (security, confidence). P4 advisory (adoption, trust). P5 block with audited waiver. P6 release block on exploitable findings. P7 leave to the team (team cognitive load, costs consistency).
    Rejected, each with the condition under which it would be the best: P3 for every check: erodes trust when noisy; best for high-confidence low-noise checks and regulated contexts. P4 for every check: nothing is guaranteed; best for noisy analyses. P7: loses consistency; best only where one team owns the whole pipeline and still records its policy.
    Context conditions: noise of the check (moves block/advise); public-facing or regulated (adds release block).
    Certainty (judge): grounded for positions; inferred for the synthesis; the threshold that makes a check blockable is the team's stated budget (RULES.1), settled.
    Flags: none..
    Links (as judged): Requires ASSURANCE.RULES.1 (block or advise, under a false-alarm budget), RULES.2 (placement), RULES.3 (gates that cannot be skipped); Realize: CHANGE_FLOW.BUILD.
