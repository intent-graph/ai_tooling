operations:
- op: node.create
  uid: ASSURANCE.DATA_INTEGRITY
  name: Data Integrity Under Change
  intent: Stored data stays valid and in step through change because integrity that must hold whatever writes the data is enforced where every write path converges, a change that can widen scope or destroy data states its scope and is recoverable by a tested restore, derived data has a sync plan with detection before it exists, and a new structure or invariant is checked against the old and brought into force observe-first when known violators exist. Stored data is therefore valid and in step after any change, including a mistaken one.
  parent: ASSURANCE
  epistemic_state: 'inferred: a roll-up of five decisions, grounded cores with inferred parts in .1, .2 and .3; no source states the set as a whole'
  design_notes: |-
    Binding: MD-01 (the best practice for the point's purpose, not the average), MD-02 (principles and outcomes, whoever does the work), MD-03 (one location per fact; this node holds the mechanism, the index pointers hold the rest).
    Decision (rolled up, full): integrity that must hold whatever writes the data is enforced where every write path converges; a change that can widen scope or destroy data states its scope explicitly and is recoverable by a tested restore; derived data has a sync plan with detection before it exists; a new structure or invariant is checked against the old and brought into force observe-first when known violators exist. Outcome: stored data is valid and in step after any change, including a mistaken one.
    Certainty (judge): inferred (a roll-up of five decisions: grounded cores, with inferred parts in .1, .2 and .3; no source states the set as a whole).
    Links (as judged): CHANGE_FLOW.DATA_CHANGE holds the procedures (batching, rehearsal), this node holds which mechanism guarantees (MD-03); OPERATION.RECOVERY holds backup practice.
  impl_pointers:
  - build/distill/03_judge/J3_assurance_integrity/judged.md::ASSURANCE.DATA_INTEGRITY
- op: node.create
  uid: ASSURANCE.DOCS_SYNC
  name: Documentation in Sync
  intent: Documentation cannot drift because each fact has one origin, documentation travels with the change it describes, a change that needs documentation cannot merge or ship without it (a recorded waiver being the only exception), machines check what they can while a reviewer verifies accuracy, and every hand-written document has an owner and a dated verification. Process, review rules and CI/CD guarantee the sync whichever order design and code come in; accuracy is verified by review, and the residual risk of semantic drift in hand-written text is owned and scheduled for review.
  parent: ASSURANCE
  epistemic_state: 'inferred: the ordering of mechanisms by strength is the judge''s synthesis; each part is grounded'
  design_notes: |-
    Binding: MD-01 (the best practice for the point's purpose, not the average), MD-02 (principles and outcomes, whoever does the work), MD-03 (one location per fact; this node holds the mechanism, the index pointers hold the rest).
    Maintainer ruling on documentation (verbatim, binds DOCS_SYNC): "how do we make sure that doc is always up to date ... What remains true is that we must have process, review rules, ci/cd that make sure doc is in sync". The question 'design-first or code-first' is ruled the wrong question and is not decided here.
    Decision (rolled up, full): documentation cannot drift because (a) a fact has one origin and derived forms are generated or checked, (b) documentation travels with the change it describes, (c) a change that needs documentation cannot merge, or ship, without it, with a recorded waiver as the only exception, (d) machines check what they can (examples, references, links, missing edits) and a reviewer verifies accuracy, which machines cannot, (e) every hand-written document has an owner and a dated verification. Outcome: no released behaviour lacks its documentation; accuracy is verified by review, and the residual risk (semantic drift in hand-written text) is owned and scheduled for review. Design-first versus code-first is not a decision here: the origin of each fact is chosen per fact, and only the guarantee is fixed.
    Certainty (judge): inferred (the ordering of mechanisms by strength is this judge's synthesis; each part is grounded).
    Links (as judged): TRANSVERSE.DOCS holds authoring and organisation (MD-03); ASSURANCE.CONTRACTS.3 holds one source of description for interfaces; ASSURANCE.RULES.3, .5.
  impl_pointers:
  - build/distill/03_judge/J3_assurance_integrity/judged.md::ASSURANCE.DOCS_SYNC
- op: node.create
  uid: ASSURANCE.SECURITY
  name: Security
  intent: Security verification depth is set per application from its risk and written down; each check runs at the earliest stage it can, high-confidence low-noise checks block with an audited waiver and the rest advise; every change passes a floor of security testing whoever wrote it; consumed code and secrets are verified like own code; limits on automation and data access are enforced in tooling, not by instruction; and verification is itself verified. Security properties are thus checked on every change at a depth proportioned to risk, and a failed check or a bypass is visible.
  parent: ASSURANCE
  epistemic_state: 'inferred: roll-up; components grounded | gap: the period of penetration testing is open'
  design_notes: |-
    Binding: MD-01 (the best practice for the point's purpose, not the average), MD-02 (principles and outcomes, whoever does the work), MD-03 (one location per fact; this node holds the mechanism, the index pointers hold the rest).
    Decision (rolled up, full): verification depth is set per application from its risk and written down; each check runs at the earliest stage it can, high-confidence low-noise checks block with an audited waiver and the rest advise; every change passes a floor of security testing whoever wrote it; consumed code and secrets are verified like own code; limits on automation and data access are enforced in tooling, not by instruction; and verification is itself verified. Outcome: security properties are checked on every change at a depth proportioned to risk, and a failed check or a bypass is visible.
    Certainty (judge): inferred (roll-up; components grounded; the period of penetration testing open).
    Links (as judged): TRANSVERSE.SECURITY holds programme practice (MD-03); ASSURANCE.RULES.3, .5; ASSURANCE.ARTIFACT.
  impl_pointers:
  - build/distill/03_judge/J3_assurance_integrity/judged.md::ASSURANCE.SECURITY
- op: node.create
  uid: ASSURANCE.DATA_INTEGRITY.1
  name: Where Integrity Rules Live
  intent: Rules that must hold whichever code writes (keys, not-null, foreign keys, row-local checks, atomic audit) are declared in the store in addition to validation at the edge, while rules that change with product decisions live in the application. This holds because migrations, administrative tools and ad-hoc statements bypass application code; constraints are named so a violation maps to a stable contract error, and an invalid state cannot be written by any path.
  parent: ASSURANCE.DATA_INTEGRITY
  epistemic_state: 'inferred: core grounded (L279, L1286 semantics); the split of the middle zone is inferred (L1262 is recorded inferred and contested)'
  constraints:
  - MUST declare in the store every invariant that must hold across writers
  - MUST name constraints (inferred)
  - MUST validate at the edge as well
  - MUST NOT put policy that changes with product decisions in the store
  design_notes: |-
    Binding: MD-01 (the best practice for the point's purpose, not the average), MD-02 (principles and outcomes, whoever does the work), MD-03 (one location per fact; this node holds the mechanism, the index pointers hold the rest).
    Decision (full): Rules that must hold whichever code writes (keys, NOT NULL, foreign keys, row-local checks, atomic audit) are declared in the store, in addition to validation at the edge; rules that change with product decisions (workflow, policy) live in the application. Constraints are named explicitly and the application maps a violation to a stable contract error. Outcome: an invalid state cannot be written by a migration, an administrative tool, an ad-hoc statement or a second application.
    Grounds: the maintainer's reason is a fact about paths, not taste: migrations, administrative tools and ad-hoc statements bypass application code (L279, REG-181); the split by kind keeps the application where rules change (L1262, REG-1139, REG-1140, REG-1143); constraint semantics are grounded, the mirror and naming advice inferred (L1286, REG-1139). The maintainer position and the split agree on the core (declared constraints); the split adds only where product policy goes. A declarative constraint is checked by the engine on every write path and cannot be forgotten by one of them; a procedural mechanism can be disabled, mis-ordered or bypassed by bulk paths; so the least powerful form that expresses a cross-writer rule wins.
    Positions considered (ledger ids as cited by the judge): P1 invariants in the application domain layer (force: cognitive load, one place for logic). P2 integrity at the store, maintainer (force: correctness across writers). P3 split by kind (force: correctness without freezing policy in the store). P4 constraints as the contract half, named and mirrored (force: stable errors).
    Rejected, each with the condition under which it would be the best: P1 as sole location: the best when a single application owns the store (L279), a condition that rarely holds because migrations and ad-hoc access exist. P2 stated without the split: pushes workflow and policy into the store where they change at product speed.
    Context conditions: a single application owning the store (L279) moves the best toward application-layer invariants.
    Certainty (judge): grounded for the core (L279, L1286 semantics); inferred for the split of the middle zone (L1262 is recorded inferred and contested).
    Flags: none..
    Links (as judged): Requires CONSTRUCTION.BOUNDARY (edge validation); index to CHANGE_FLOW.DATA_CHANGE.
  impl_pointers:
  - build/distill/03_judge/J3_assurance_integrity/judged.md::ASSURANCE.DATA_INTEGRITY.1
  - build/research/07_maintainer_doctrine/result.md::MAINT-C15
  - ../web_architecture_guidelines/build/research/14_thin_spots/result.md::THIN-C31
  - ../web_architecture_guidelines/build/research/17_data_contracts/result.md::DCON-C23
- op: node.create
  uid: ASSURANCE.DATA_INTEGRITY.2
  name: Guarding Bulk and Destructive Operations
  intent: 'Scope is stated, never inferred: a destructive or bulk operation of unbounded scope requires an explicit opt-in from its caller plus validation of mandatory keys, key order and timestamp sanity, and a schema change is linted in CI against unsafe operations and passes only with an explicit override assertion. Omitting a filter or running an unsafe migration therefore cannot silently widen the effect.'
  parent: ASSURANCE.DATA_INTEGRITY
  epistemic_state: 'known | inferred part: that application-level opt-in and the schema-change lint are one principle (L414)'
  constraints:
  - MUST require the opt-in at the operation's interface, not in documentation
  - MUST record an override as an explicit, reviewable assertion in the change
  design_notes: |-
    Binding: MD-01 (the best practice for the point's purpose, not the average), MD-02 (principles and outcomes, whoever does the work), MD-03 (one location per fact; this node holds the mechanism, the index pointers hold the rest).
    Decision (full): Scope is stated, never inferred. A destructive or bulk operation of unbounded scope requires an explicit opt-in from its caller plus validation of mandatory keys, key order and timestamp sanity; a schema change is linted in CI against a list of unsafe operations and passes only with an explicit assertion that overrides the rule. Outcome: omitting a filter or running an unsafe migration cannot silently widen the effect.
    Grounds: the maintainer rule (L280, REG-181) and the migration lint (L396, L414, REG-258, REG-259) apply one principle at two layers (application operations, schema operations); L414 records the lint as the nearest public form of L280, inferred.
    Positions considered (ledger ids as cited by the judge): P1 explicit opt-in flag (force: correctness against a slip). P2 migration lint with explicit override (force: blocks DDL that locks or destroys; cost: tool niche, T3).
    Rejected, each with the condition under which it would be the best: none competes; they cover different operations. Applying only P2 leaves application-level bulk operations unguarded (best only where no application issues bulk writes).
    Context conditions: none.
    Certainty (judge): grounded for each (L280, L396); inferred that they are one principle (L414).
    Flags: none..
    Links (as judged): Refines ASSURANCE.RULES.3 (a gate with an explicit, visible override); CHANGE_FLOW.DATA_CHANGE.
  impl_pointers:
  - build/distill/03_judge/J3_assurance_integrity/judged.md::ASSURANCE.DATA_INTEGRITY.2
  - build/research/07_maintainer_doctrine/result.md::MAINT-C16
  - build/research/10_data_change/result.md::DATA-C19
  - build/research/10_data_change/result.md::DATA-C38
- op: node.create
  uid: ASSURANCE.DATA_INTEGRITY.3
  name: Layered Protection and Deletion Form
  intent: 'Data is defended in layers because every single strategy eventually fails: deletion reversible for a stated window, backups, and early detection of corruption; a destructive change is not reversible by script, so its undo is a restore prepared and tested before the change runs. Where recovery or audit of deleted records is needed the row is deleted and archived in the same transaction, and a deleted flag is kept only when undelete is a user-facing feature whose costs are paid.'
  parent: ASSURANCE.DATA_INTEGRITY
  epistemic_state: 'inferred: layers grounded (T2, consensus rows L416, L1092); the deletion form is inferred'
  constraints:
  - MUST test the restore before a destructive change runs
  - MUST state the retention window
  - MUST keep a legally required purge possible
  design_notes: |-
    Binding: MD-01 (the best practice for the point's purpose, not the average), MD-02 (principles and outcomes, whoever does the work), MD-03 (one location per fact; this node holds the mechanism, the index pointers hold the rest).
    Decision (full): Defend in layers because every single strategy eventually fails: a first layer that makes deletion reversible for a stated retention window, after which the kept copy is purged (periods for personal data: TRANSVERSE.PRIVACY.2), a second of backups kept and erased as OPERATION.RECOVERY.2 and TRANSVERSE.PRIVACY.3 set, a third of early detection of corruption. A destructive change (drop, delete, truncate) is treated as not reversible by script: its undo is a restore that was prepared and tested before the change ran. Where recovery or audit of deleted records is needed, delete the row and write a copy to an archive in the same transaction; keep a deleted flag on the row only when undelete is a user-facing feature and its costs are paid (every query excludes deleted rows by default, children of a deleted parent are handled explicitly, a legally required purge remains possible). Outcome: a mistaken or malicious destruction is recoverable within a stated window without breaking referential integrity.
    Grounds: layers and tested restore are consensus and grounded (L417, L416, L388, L1092; REG-250, REG-251, REG-252, REG-1051). REG-250 (T2) states soft deletion as the primary defence against developer error, with a window of 15 to 60 days: that is the case for the layer, reversibility for a window, which both forms give. The form is chosen on referential integrity and query safety: a flag puts a predicate in every query and stops foreign keys protecting parent and child (L1255, REG-1145, T3), an archive keeps the live table clean and its keys working (L1256, REG-1142, REG-1145).
    Positions considered (ledger ids as cited by the judge): P1 layers (force: survival of any single failure). P2 destructive = restore, tested (force: honest reversibility). P3 soft deletion or retention window first (force: cheap recovery). P4 soft-deletion costs. P5 hard delete plus same-transaction archive.
    Rejected, each with the condition under which it would be the best: soft deletion as the default form: best when undelete is a product feature (the mitigation of a view or default scope for the predicate is inferred, no row states it). Retention-window reversibility through backups alone: best when deleted rows have no audit value and point-in-time restore is fast enough for the stated window.
    Context conditions: need for undelete as a feature, or a legal purge obligation (shortens the window or forbids retaining the copy); both move the form, not the layering.
    Certainty (judge): layer grounded (T2, consensus rows L416, L1092); form inferred.
    Flags: none..
    Links (as judged): index to OPERATION.RECOVERY (backup practice); see OPERATION.RECOVERY.2 (how long backups are kept), TRANSVERSE.PRIVACY.2 (retention periods for personal data, backup copies included) and TRANSVERSE.PRIVACY.3 (erasure in backups); Requires ASSURANCE.AVAILABILITY.4 (proving restore); Requires TRANSVERSE (privacy and retention); see DATA_INTEGRITY.5 (third layer, detection).
  impl_pointers:
  - build/distill/03_judge/J3_assurance_integrity/judged.md::ASSURANCE.DATA_INTEGRITY.3
  - build/research/10_data_change/result.md::DATA-C11
  - build/research/10_data_change/result.md::DATA-C40
  - build/research/10_data_change/result.md::DATA-C41
  - build/research/14_recovery/result.md::RECOV-C15
  - ../web_architecture_guidelines/build/research/14_thin_spots/result.md::THIN-C21
  - ../web_architecture_guidelines/build/research/14_thin_spots/result.md::THIN-C22
- op: node.create
  uid: ASSURANCE.DATA_INTEGRITY.4
  name: Derived Data Sync and Staleness
  intent: No derived or denormalized data exists without a synchronisation plan, chosen from a ladder (documentation only, declared constraints, detection queries, scheduled refresh, same-transaction triggers) by impact of divergence, change frequency and tolerable staleness. The plan states the freshness target, how drift is found and fixed and what alerts, and exists before the data does, so divergence is bounded, found, and fixed by a known action.
  parent: ASSURANCE.DATA_INTEGRITY
  epistemic_state: known
  constraints:
  - MUST write the plan before the data exists
  - MUST state the freshness target and the alert
  - MUST NOT treat "eventual" as unstated
  design_notes: |-
    Binding: MD-01 (the best practice for the point's purpose, not the average), MD-02 (principles and outcomes, whoever does the work), MD-03 (one location per fact; this node holds the mechanism, the index pointers hold the rest).
    Decision (full): No derived or denormalized data exists without a synchronisation plan, chosen from a ladder by cost and strength (documentation only, declared constraints, detection queries, scheduled refresh, same-transaction triggers) by the impact of divergence, change frequency and tolerable staleness. The plan answers up front: what, sync level, freshness target, change frequency, impact of divergence, how drift is found and fixed, what alerts. Detection queries run on a schedule set by importance with a stated action on divergence; timestamps for staleness detection and monitoring hooks exist before first production use, and "no invalidation" and "no monitoring" are defects. Outcome: divergence is bounded, found, and fixed by a known action.
    Grounds: the maintainer ladder (L281, L282, L314; REG-181), L282 and L314 agree with public practice (reconciliation jobs); L281 extends it. Same-transaction versus eventual is a context question, not a rival: always-consistent serves correctness at write latency and coupling; eventual with a stated window serves delivery speed and cost.
    Positions considered (ledger ids as cited by the judge): P1 ladder (force: proportion). P2 always consistent. P3 eventual with window. P4 scheduled detection. P5 staleness as designed property.
    Rejected, each with the condition under which it would be the best: P2 as universal: best when divergence is costly and writes are few. P3 as universal: best when divergence is cheap and the window is stated and monitored. A plan stated after the data exists: always rejected, since the cost of retrofitting detection is highest then.
    Context conditions: impact of divergence, change frequency, tolerable staleness (L281: wins by criticality and change rate).
    Certainty (judge): grounded (single maintainer source, practice agrees).
    Flags: none..
    Links (as judged): Requires OPERATION.TELEMETRY.8 (Scheduled Work Signals: duration, failure, backlog, missed runs; L313 sits there); index to CHANGE_FLOW.DATA_CHANGE.
  impl_pointers:
  - build/distill/03_judge/J3_assurance_integrity/judged.md::ASSURANCE.DATA_INTEGRITY.4
  - build/research/07_maintainer_doctrine/result.md::MAINT-C17
  - build/research/07_maintainer_doctrine/result.md::MAINT-C18
  - build/research/07_maintainer_doctrine/result.md::MAINT-C50
- op: node.create
  uid: ASSURANCE.DATA_INTEGRITY.5
  name: Checking Old Against New and Rolling Out Checks
  intent: Before an old structure is removed, the new data is validated against the old (side-by-side reads, independent validation jobs), and every convention ships with a check that finds its violations. A new invariant check is enforced at once when no known violator exists, and runs observe-only first, with an owner and an exit condition, when known violators exist in production, so a migration or new rule cannot corrupt or block production unseen.
  parent: ASSURANCE.DATA_INTEGRITY
  epistemic_state: 'known | inferred part: the owner of observe-only mode (no row states it)'
  constraints:
  - MUST give observe-only mode an exit condition (L284) and an owner (inferred)
  - MUST NOT remove the old structure before validation passes
  design_notes: |-
    Binding: MD-01 (the best practice for the point's purpose, not the average), MD-02 (principles and outcomes, whoever does the work), MD-03 (one location per fact; this node holds the mechanism, the index pointers hold the rest).
    Decision (full): Before the old structure is removed, the new data is validated against the old (side-by-side read comparison with an alert on mismatch where reads are cut over; out-of-band validation jobs independent of application logic). Conventions are self-auditing: each rule ships with a query or script that finds its violations. A new invariant check is enforced immediately when no known violator exists; when known violators exist in production it first runs observe-only (records findings, autofix is a dry run, nothing raises), and is enforced once the open defects are removed, with an owner (inferred, no row states it) and an exit condition (L284: enforce after open defects are removed). Outcome: a migration or new rule cannot corrupt or block production unseen.
    Grounds: validation against old and out-of-band jobs (L391, L415; REG-250, REG-257, REG-260, one T3 for shadow reads); self-auditing conventions (L283, REG-181); observe-first (L284, REG-181), agreeing with shadow mode and feature flags. Immediate enforcement (P4) serves correctness and wins when nothing known would trip it.
    Positions considered (ledger ids as cited by the judge): P1 shadow read. P2 validate old against new, continuous jobs. P3 self-auditing conventions. P4 enforce at once (correctness). P5 observe-only first (reversibility, delivery speed).
    Rejected, each with the condition under which it would be the best: P4 when known violators exist: it blocks production on defects the team knows about. Observe-only without an owner or exit: the maintainer records that a kill-switch defaulting to observe tolerates defects and is not the fix; best never.
    Context conditions: existence of known violators in production (moves P4 to P5).
    Certainty (judge): grounded.
    Flags: none..
    Links (as judged): Requires CHANGE_FLOW.DATA_CHANGE (rehearsal, rollout); see DATA_INTEGRITY.3 (detection layer).
  impl_pointers:
  - build/distill/03_judge/J3_assurance_integrity/judged.md::ASSURANCE.DATA_INTEGRITY.5
  - build/research/07_maintainer_doctrine/result.md::MAINT-C19
  - build/research/07_maintainer_doctrine/result.md::MAINT-C20
  - build/research/10_data_change/result.md::DATA-C14
  - build/research/10_data_change/result.md::DATA-C39
- op: node.create
  uid: ASSURANCE.DOCS_SYNC.1
  name: Delivery with the Change
  intent: Documentation is plain text in version control, in the repository of what it documents, changed through the same review and CI as code, and a change that alters documented behaviour carries its documentation in the same merge request. Where documentation ships only with a release it may travel separately, provided a release gate blocks any feature without it, so there is no window in time between a change and its documentation.
  parent: ASSURANCE.DOCS_SYNC
  epistemic_state: 'known | inferred part: the motivation of the reduced pipeline for documentation-only changes'
  constraints:
  - MUST keep documentation in version control beside the code
  - MUST NOT run a reduced pipeline over checks that execute documentation examples or verify references
  design_notes: |-
    Binding: MD-01 (the best practice for the point's purpose, not the average), MD-02 (principles and outcomes, whoever does the work), MD-03 (one location per fact; this node holds the mechanism, the index pointers hold the rest).
    Maintainer ruling on documentation (verbatim, binds DOCS_SYNC): "how do we make sure that doc is always up to date ... What remains true is that we must have process, review rules, ci/cd that make sure doc is in sync". The question 'design-first or code-first' is ruled the wrong question and is not decided here.
    Decision (full): Documentation is plain text in version control, in the repository of the thing it documents, changed through the same review and CI as code. A change that alters documented behaviour carries its documentation in the same merge request. Where documentation ships only with a release (release trains, many contributors, a docs team working in parallel), it may travel in a separate request, and the release gate in DOCS_SYNC.2 then blocks the release of a feature without it. A documentation-only change runs a reduced pipeline so that updating documentation is cheap. Outcome: no window in time between a change and its documentation (accuracy is verified by DOCS_SYNC.2 and .4, not by delivery alone).
    Grounds: docs as code, consensus (L210; REG-150, REG-153, REG-156); same-request delivery leaves no window of disagreement (L211; REG-148, REG-150, REG-153); reuse of the existing workflow (L230; REG-150, REG-156); reduced pipeline lowers the cost of upkeep (L238; REG-153, motivation inferred).
    Positions considered (ledger ids as cited by the judge): P1 docs as code. P2 same request (correctness, confidence). P3 separate request on a release branch (control, delivery speed for code). P4 reuse developer workflow. P5 reduced pipeline.
    Rejected, each with the condition under which it would be the best: P3 as default: best when a release train and a docs team make same-request delivery impractical, provided the release gate holds. A parallel documentation process outside the tracker, review and CI: best never; it removes the mechanisms that guarantee sync.
    Context conditions: continuously deployed product (same request, no gate at release) versus release train (separate request, gate at release). This is the single condition a row shows moving the answer.
    Certainty (judge): grounded for P1, P2, P4; inferred for P5 motivation.
    Flags: none..
    Links (as judged): Requires DOCS_SYNC.2; index TRANSVERSE.DOCS.
  impl_pointers:
  - build/distill/03_judge/J3_assurance_integrity/judged.md::ASSURANCE.DOCS_SYNC.1
  - build/research/06_transverse/result.md::TRANS-C01
  - build/research/06_transverse/result.md::TRANS-C02
  - build/research/06_transverse/result.md::TRANS-C21
  - build/research/06_transverse/result.md::TRANS-C29
- op: node.create
  uid: ASSURANCE.DOCS_SYNC.2
  name: Gates and Review of Documentation
  intent: The team states which changes require documentation, each change declares its documentation impact, a CI rule fails the merge when the trigger is met and no documentation changed, and a reviewer able to verify it checks accuracy. A waiver is a recorded declaration granted independently of the author, with a follow-up issue, never a skipped check, so a change that needs documentation does not merge or ship without it or without a tracked and owned exception.
  parent: ASSURANCE.DOCS_SYNC
  epistemic_state: 'inferred: each component grounded; the combination of declared documentation impact checked by CI plus reviewer verification is the judge''s synthesis (sources split on hard versus soft gate)'
  constraints:
  - MUST define the trigger
  - MUST make the waiver a visible recorded exception
  - MUST NOT let a check that only detects absence stand in for accuracy review
  design_notes: |-
    Binding: MD-01 (the best practice for the point's purpose, not the average), MD-02 (principles and outcomes, whoever does the work), MD-03 (one location per fact; this node holds the mechanism, the index pointers hold the rest).
    Maintainer ruling on documentation (verbatim, binds DOCS_SYNC): "how do we make sure that doc is always up to date ... What remains true is that we must have process, review rules, ci/cd that make sure doc is in sync". The question 'design-first or code-first' is ruled the wrong question and is not decided here.
    Decision (full): The team states which changes require documentation (user- or admin-visible features, interface changes, changed workflows, deprecation and removal; internal-only exempt). Every change declares its documentation impact (updated, or not needed and why), a CI rule fails the merge when the declared trigger is met and no documentation path changed, and review verifies accuracy and that docs of deleted or deprecated code are removed. A waiver is an explicit declaration in the change (documentation deferred, with a follow-up issue opened at once and assigned to author and reviewer), granted by the reviewer who approves the change, independent of its author (RULES.4); it is never a skipped check, and the CI rule passes on that declaration as on an override assertion (DATA_INTEGRITY.2). Accuracy review is blocking and done by someone able to verify it; audience and writing review are non-blocking by default and blocking for customer-facing or cross-boundary documentation. Where documentation ships on a release train, the release gate removes a feature without documentation from the release. Documentation paths map to owners and owner review is required by branch protection where the platform supports it. Outcome: a change that needs documentation does not merge or ship without it, or without a tracked and owned exception.
    Grounds: the maintainer ruling requires a mechanism that guarantees, not goodwill. The only mechanism that does not rely on goodwill is a blocking gate (L214, REG-153, REG-156), but a path rule detects the absence of an edit, not its accuracy (L226, REG-161), so the gate is paired with reviewer verification (L212, REG-151, REG-153) and a recorded waiver with follow-up issue takes the place of a silent skip (waiver: L214 position (b), REG-153; L239, REG-150, REG-153, grounds only the follow-up issue when documentation merges without the required reviewer); trigger definition (L213, REG-150, REG-151, REG-153); owners (L227, REG-145); who reviews what (L228, REG-150, REG-153); release gate (L237, REG-148). A gate with a recorded, independently granted override is the pattern of RULES.3 and DATA_INTEGRITY.2, not a blend: the soft gate (P4) leaves the outcome to whoever gives way, the waiver records who granted it and why.
    Positions considered (ledger ids as cited by the judge): P1 trigger. P2 review includes docs check. P3 hard merge gate (correctness, confidence). P4 encouraged and reviewer-enforced with waiver (delivery speed, team load). P5 release gate. P6 follow-up issue. P7 code owners. P8 three kinds of review.
    Rejected, each with the condition under which it would be the best: P4 as the whole policy: it is advisory, so drift passes whenever a reviewer or a deadline gives way; best only where documentation is not part of the product contract and the follow-up is reliably tracked. P5 as the only gate: late, it lets the merge and the docs diverge for the length of a release cycle; best when release trains make merge-time gates impractical, as an addition to the merge check. Writers approving every change: best only for customer-facing or cross-boundary documents (L228).
    Context conditions: documentation as user-facing contract or regulated (blocking audience review); release train (release gate added).
    Certainty (judge): grounded for each component; inferred for the combination (declared documentation impact checked by CI plus reviewer verification is this judge's synthesis from L213, L214, L226, L212, L239, and from the maintainer ruling; sources are split on hard versus soft gate, GitLab encourages).
    Flags: none..
    Links (as judged): Requires ASSURANCE.RULES.3, ASSURANCE.RULES.4; see DOCS_SYNC.4 (mechanical checks), TRANSVERSE.DOCS.
