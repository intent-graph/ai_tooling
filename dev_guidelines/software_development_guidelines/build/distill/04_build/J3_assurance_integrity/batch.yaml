- op: node.create
  uid: ASSURANCE.SECURITY.3
  name: Verification Techniques
  intent: Every change passes a floor of security verification whoever produced it (tests of the security features and secure defaults, static scan, secret search, tests from specifications, threats and past bugs, protections of the toolchain enabled, fuzzing of untrusted-input parsers, a dynamic scan for web interfaces), combined with manual expert testing aimed first at the highest-risk components. Penetration testing is regular where criticality or regulation is high and triggered by a significant change to a high-risk component's attack surface. A baseline of verification thus holds on every change and manual depth goes where the risk is.
  parent: ASSURANCE.SECURITY
  epistemic_state: 'inferred: floor and techniques grounded; the manual-testing sequence and the penetration-test trigger are inferred | gap: no source gives a penetration-test period, and none supports ''as the practice matures'' as a trigger'
  constraints:
  - MUST apply the floor to every change
  - MUST test the default configuration
  design_notes: |-
    Binding: MD-01 (the best practice for the point's purpose, not the average), MD-02 (principles and outcomes, whoever does the work), MD-03 (one location per fact; this node holds the mechanism, the index pointers hold the rest).
    Decision (full): Every change passes a floor of security verification whoever produced it, on the assumption that code may carry vulnerabilities: functional tests of the security features themselves in a sandboxed environment where appropriate, tests of the secure default configuration, a static scan, a search for hardcoded secrets, tests derived from specifications, threats and past bugs, builds and test runs that enable the checks and protections the language, compiler and runtime provide, and fuzzing of components that parse untrusted input (pre-release at minimum, continuous where practical); a web interface adds a dynamic or interactive scan against a running instance. Automated testing is combined with manual expert testing, directed first at the highest-risk components, with regular penetration testing where criticality or regulation is high (L1126, fuller programmes). Penetration testing of a high-risk component is triggered by a significant change to its attack surface and repeated on a recorded cycle; no source read gives a period (open). Outcome: a baseline of verification holds on every change, and manual depth goes where the risk is.
    Grounds: test the security features and use sandbox (L247, REG-004); secure default tested (L248, REG-004); built-in checks and protections (REG-1086, NIST IR 8397: "Run the program with built-in checks and protections (2.5)"); every change, author-neutral (L1055; REG-1035, REG-1044, REG-1048); floor (L1126; REG-1081, REG-1086, REG-1094); fuzz (L1133; REG-1086, REG-1092); web scan (L1134; REG-1086, REG-1094, REG-169); automated plus manual (L1136; REG-1081, REG-1091); manual at highest risk first (L1137, inferred; no frequency given).
    Positions considered (ledger ids as cited by the judge): P1 test executable code. P2 secure default. P3 test every change. P4 developer floor against fuller programmes. P5 fuzz. P6 dynamic scan if web. P7 automated plus manual. P8 manual at highest risk first.
    Rejected, each with the condition under which it would be the best: the fuller programme (application-specific automation, regular penetration tests) for all applications: best under high criticality or regulation (L1126, SAMM levels 2 and 3). A structural-coverage target stated as a security requirement: this node states no coverage figure; ASSURANCE.BEHAVIOUR.6 decides it (no coverage floor, security-relevant code included; a conformance minimum only where a mandated baseline requires it). Dynamic scan for non-web software: not applicable.
    Context conditions: criticality or regulation (fuller programme); web interface (dynamic scan); input-parsing components (fuzzing).
    Certainty (judge): grounded for the floor and the techniques; inferred for the manual-testing sequence and the penetration-test trigger; open: no source gives a penetration-test period, and none supports "as the practice matures" as a trigger.
    Flags: none..
    Links (as judged): Requires ASSURANCE.BEHAVIOUR.3 (levels); see ASSURANCE.BEHAVIOUR.6 (adequacy, the coverage decision); see SECURITY.1 (depth), SECURITY.4.
