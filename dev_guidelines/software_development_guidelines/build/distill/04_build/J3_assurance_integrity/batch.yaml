    Decision (full): Verification depth is set per application from its risk profile and the assurance target is written down and revisited when risk changes (new personal data, new regulatory scope). The design is reviewed for security, by a qualified person or by automated processes against the risk model, before implementation proceeds, and the threat-model output selects test cases and the code that gets focused review. Outcome: the effort spent on security matches the risk and the design was reviewed before it was built.
