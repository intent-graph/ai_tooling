- op: node.create
  uid: ASSURANCE.SECURITY.7
  name: Closing the Loop on Findings
  intent: 'Security verification is itself verified: a test or scan that raises no alert is treated as a detection failure, and a regular process evaluates the effectiveness of the measures, including the ability to restore availability and access to data. A defect found is fixed, the process is changed to catch its class earlier and, where possible, an approach is chosen that precludes the class, so each defect improves the process.'
  parent: ASSURANCE.SECURITY
  epistemic_state: known
  constraints:
  - MUST test that a known probe raises an alert
  design_notes: |-
    Binding: MD-01 (the best practice for the point's purpose, not the average), MD-02 (principles and outcomes, whoever does the work), MD-03 (one location per fact; this node holds the mechanism, the index pointers hold the rest).
    Decision (full): Security verification is itself verified: a penetration test or scan that raises no alert is treated as a detection failure; a regular process tests and evaluates the effectiveness of the measures, including the ability to restore availability and access to data. A bug found by verification is fixed, the process is changed to catch the class earlier, and where possible an approach is chosen that precludes the class. Outcome: each defect improves the process, and a silent failure of detection is itself found.
    Grounds: detection check (L1138, REG-1090); fix, change the process, preclude the class (L1139, REG-1086); regular effectiveness process including restore (L1160, REG-1095).
    Positions considered (ledger ids as cited by the judge): P1 detection works. P2 fix, change process, preclude. P3 regular effectiveness process.
    Rejected, each with the condition under which it would be the best: none competes; they are three links of one loop. Fixing the instance without changing the process: best never.
    Context conditions: none.
    Certainty (judge): grounded.
    Flags: none..
    Links (as judged): Requires ASSURANCE.AVAILABILITY.4 (proving restore); see ASSURANCE.BEHAVIOUR.8 (defect classes); OPERATION.INCIDENTS.
  impl_pointers:
  - build/distill/03_judge/J3_assurance_integrity/judged.md::ASSURANCE.SECURITY.7
  - build/research/15_security_depth/result.md::SECD-C20
  - build/research/15_security_depth/result.md::SECD-C21
  - build/research/15_security_depth/result.md::SECD-C42
