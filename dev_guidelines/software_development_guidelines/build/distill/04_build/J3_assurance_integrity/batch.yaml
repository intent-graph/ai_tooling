- op: node.create
  uid: ASSURANCE.SECURITY.4
  name: Static and Scheduled Analysis Practice
  intent: Static analysis runs as soon as code is written and repeats automatically per commit or in review, so no new weakness goes unreported; an analysis too slow for that runs on a schedule, nightly or at least daily. Because static analysis has blind spots and false positives, the team standardises on tools, keeps a must-fix list, and triages and suppresses deliberately.
  parent: ASSURANCE.SECURITY
  epistemic_state: known
  constraints:
  - MUST keep a must-fix list
  - MUST suppress a finding deliberately and visibly
  design_notes: |-
    Binding: MD-01 (the best practice for the point's purpose, not the average), MD-02 (principles and outcomes, whoever does the work), MD-03 (one location per fact; this node holds the mechanism, the index pointers hold the rest).
    Decision (full): Static analysis runs as soon as code is written and repeats automatically per commit or in code review, so no new weakness goes unreported; an analysis too slow for that (whole-system analysis, sanitizers, run-time assertions) runs on a schedule, nightly or at least daily. Because static analysis has blind spots and false positives, the team standardises on tools, keeps a must-fix list, triages and suppresses deliberately, and uses more than one analyser where weakness classes differ. Outcome: fast checks give feedback within the change and slow checks still run on every day's code, with noise controlled.
    Grounds: per commit or in review (L1129, REG-052); scheduled slow runs (L1129, L1135; REG-1092, REG-1094); blind spots and noise (L1130; REG-1086, REG-1092). The same sources hold P1 and P2 for different tool speeds, so cost of the analysis is the condition, not a contest.
    Positions considered (ledger ids as cited by the judge): P1 per change (speed of feedback). P2 nightly or daily (cost of ownership). P3 noise handling.
    Rejected, each with the condition under which it would be the best: running slow analyses on every change: best when the analysis is cheap enough to give feedback inside the change. Per-change only: best never for sanitizers and whole-system runs, which are too slow.
    Context conditions: runtime cost of the analysis (fast: per change; slow: scheduled).
