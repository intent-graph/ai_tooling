- op: node.create
  uid: ASSURANCE.DOCS_SYNC.3
  name: Ownership, Freshness and Single Source
  intent: Each fact has one canonical origin and is stated once; a derived or generated document is read-only and never copied back into its source. Every hand-written document has a named owner, a date and the target it was verified against, a scheduled review tracked as a bug, and removal when obsolete, so a reader can tell who answers for a document, how old its verification is, and which copy is true.
  parent: ASSURANCE.DOCS_SYNC
  epistemic_state: known
  constraints:
  - MUST name an owner per document
  - MUST state the verification date and target
  - MUST NOT edit a generated document or copy it back into its source
  design_notes: |-
    Binding: MD-01 (the best practice for the point's purpose, not the average), MD-02 (principles and outcomes, whoever does the work), MD-03 (one location per fact; this node holds the mechanism, the index pointers hold the rest).
    Maintainer ruling on documentation (verbatim, binds DOCS_SYNC): "how do we make sure that doc is always up to date ... What remains true is that we must have process, review rules, ci/cd that make sure doc is in sync". The question 'design-first or code-first' is ruled the wrong question and is not decided here.
    Decision (full): Each fact has one canonical origin and is stated once; competing copies are consolidated into it. A derived or generated document is read-only and is never copied back into its source; an expanded copy written into a registry that resolves references is not allowed to shadow its source. Every hand-written document has a named owner, carries a date and what it was verified against ("verified live on a date"), is reviewed on a schedule tracked as a bug, and is removed or marked obsolete when it no longer serves a purpose. Fast-moving topics point to the more current tracker; open known violations are recorded with status and mitigation, and a mitigation is never presented as a fix. Outcome: a reader can tell who answers for a document, how old its verification is, and which copy is true.
    Grounds: owner (L215, REG-150); freshness dates and review as tracked bugs (L216, L217; REG-150, REG-154); dated verification, maintainer (L319, REG-181, agrees with L216 on dating); one canonical document per topic (L218, REG-150); derived is read-only (L320, REG-181). One origin per fact is also MD-03 applied to documentation.
    Positions considered (ledger ids as cited by the judge): P1 owner. P2 freshness dates, bug-tracked. P3 live-verified stamps, maintainer. P4 one canonical document. P5 derived is read-only.
    Rejected, each with the condition under which it would be the best: dates as a guarantee of truth: a date states when someone last verified, not that the text is true; best never as the only mechanism, which is why DOCS_SYNC.2 and .4 exist. A copy for convenience that is edited by hand: best never.
    Context conditions: none.
    Certainty (judge): grounded.
    Flags: none..
    Links (as judged): Requires ASSURANCE.CONTRACTS.3 (one source for interface descriptions); OPERATION.RECOVERY (upkeep of recovery plan and runbooks sits there, L1111); index TRANSVERSE.DOCS.
