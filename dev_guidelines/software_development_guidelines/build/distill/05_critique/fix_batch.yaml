# fix_batch.yaml: every `fix` of findings.md, applied with
#   ig-tool apply -g intent_graphs/software_development_philosophy.ig.yaml --batch build/distill/05_critique/fix_batch.yaml -o <out> --role critic -m "critique fixes"
# One fix is not expressible as a batch operation (no node.reorder op); run it as a separate command (finding F-ORDER):
#   ig-tool node reorder -g <graph> --parent ASSURANCE --children ASSURANCE.RULES ASSURANCE.BEHAVIOUR ASSURANCE.CONTRACTS ASSURANCE.DATA_INTEGRITY ASSURANCE.DOCS_SYNC ASSURANCE.SECURITY ASSURANCE.PERFORMANCE ASSURANCE.AVAILABILITY ASSURANCE.ARTIFACT -o <out>
# Dry-run check on a scratch copy: 93 operations applied, graph 292 nodes and 407 links, `ig-tool validate`: errors 0, warnings 0.
operations:
- op: node.set
  uid: ASSURANCE.ARTIFACT.1
  constraints:
  - MUST produce provenance from a hosted build platform
  - MUST verify provenance before use
  - MUST declare the level reached and the gap to the stated floor where below it
  - MUST detect drift of objects that bypass the build
- op: node.set
  uid: ASSURANCE.ARTIFACT
