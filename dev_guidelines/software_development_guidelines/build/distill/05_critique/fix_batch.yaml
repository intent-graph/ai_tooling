  uid: OWNERSHIP.STANCE.1
  epistemic_state: 'known | inferred: the layer reasons are the maintainer''s formulation, inferred as general'
- op: node.set
  uid: TRANSVERSE.DOCS.3
  epistemic_state: 'known | inferred: the choice against the dated header change log rests on a small set of sources and one maintainer row; the deployed-definition case'
- op: node.set
  uid: OWNERSHIP.LIFECYCLE.1
  constraints:
  - Dependencies MUST be declared completely and exactly in a manifest and run in an isolated environment, never relying on implicitly installed packages.
  - A lock recording the exact resolved tree, direct and transitive, MUST be committed.
  - CI and production MUST install from the lock only, and the build MUST fail when lock and manifest disagree.
  - Artifacts MUST be verified by a cryptographic hash recorded in the lock, covering transitive dependencies; an install mode that rejects any artifact lacking a recorded hash MUST be used in deploys where the tool supports it.
  - A new developer MUST need only the runtime, the dependency manager and one command.
- op: node.set
  uid: ASSURANCE.DOCS_SYNC.1
  intent: Documentation is plain text in version control, in the repository of what it documents, changed through the same review and CI as code, and a change that alters documented behaviour carries its documentation in the same change. Where documentation ships only with a release it may travel separately, provided a release gate blocks any feature without it, so there is no window in time between a change and its documentation.
- op: node.set
  uid: OPERATION.TELEMETRY.8
  intent: 'Scheduled and derived-data work is monitored on four signals: duration against a documented expectation, any failure, backlog (queue size and age of the oldest entry), and missed runs (not run within twice the interval). A job reports its failure to the scheduler instead of swallowing it, so that the scheduler records the failure; a job that did not run, ran too long or failed is therefore noticed.'
- op: node.set
  uid: OWNERSHIP.LICENCE.4
  constraints:
  - The licence and copyright of every file MUST be declared machine-readably.
  examples:
  - Identifiers in file headers and licence texts in a licences directory.
- op: node.set
  uid: CHANGE_FLOW.REVIEW
  intent: 'Review realizes independent, accountable review bound to the exact content: the mechanism follows team and risk, depth follows risk and evidence of understanding, units are small and answered quickly, and automation runs first while a second automated reviewer only assists. Review stays trustworthy and review capacity does not become the constraint.'
- op: node.set
  uid: CHANGE_FLOW.REVIEW.4
  name: Automated and Second-Reviewer Layers
- op: node.set
  uid: EVOLUTION.DECOMMISSION.4
  intent: 'Where consumers are many or external, a support policy is published by stability tier with fixed minimum windows: a stable interface is deprecated but not removed within a major version, a pre-release one has a fixed period, an experimental one may go at any release. Where consumers are few and known, the window is set case by case with them. The indefinitely compatible, date-pinned surface has no window and is held in ASSURANCE.CONTRACTS.1. So consumers can plan from a published rule and maintainers do not carry old forms without limit.'
- op: node.set
  uid: CONSTRUCTION.SYSTEM_SHAPE.4
  constraints:
  - MUST design team boundaries and module boundaries together
  - MUST organise a team around a capability, not around a technical layer
- op: node.set
  uid: ASSURANCE
  constraints:
  - MUST every property have a mechanism, a stage and a recurring trigger
  - MUST every check have a stated false-alarm budget against which its measured rate is held
  - MUST no gate be skippable
  - MUST every approval bind the exact content that ships
