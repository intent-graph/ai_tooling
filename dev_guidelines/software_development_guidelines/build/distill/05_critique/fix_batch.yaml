- op: link.set
  uid: OPERATION.RECOVERY.6_OPERATION.TELEMETRY.8
  intent: Backup and restore jobs are scheduled work and are monitored on the four job signals.
- op: link.set
  uid: OPERATION.RELIABILITY.2_OPERATION.RELIABILITY.1
