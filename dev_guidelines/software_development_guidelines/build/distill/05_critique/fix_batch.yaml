- op: node.set
  uid: EVOLUTION.DECISIONS
  epistemic_state: 'inferred: roll-up of DECISIONS.1 to .6; DECISIONS.3 is grounded, DECISIONS.1, .4 and .5 are grounded with inferred parts, and the significance threshold (DECISIONS.2) and the proposal split (DECISIONS.6) are inferred'
- op: node.set
  uid: EVOLUTION.TECHNOLOGY
  epistemic_state: 'inferred: roll-up of TECHNOLOGY.1 to .4; adding-as-replacing (TECHNOLOGY.1) is grounded and the register (TECHNOLOGY.2) is grounded except its decision trail, while the firmness conditions (TECHNOLOGY.3, contested row) and the one-store rule (TECHNOLOGY.4) are inferred | unvalidated: contested single-store row at TECHNOLOGY.4 rests on one-project or commercially interested sources, no final-pass resolution addressed it'
- op: node.set
  uid: OWNERSHIP.SELECTION
  epistemic_state: 'inferred: roll-up of SELECTION.1 to .6; SELECTION.1 to .5 are grounded with inferred parts, SELECTION.6 is inferred, and the scaling of vetting and signals by criticality is inferred'
- op: node.set
  uid: OWNERSHIP.STANCE
  epistemic_state: 'inferred: roll-up of STANCE.1 to .4; STANCE.1 to .3 are grounded with inferred parts, and the reconciliation of build-for-today with probable use (STANCE.4) is inferred'
- op: node.set
  uid: ASSURANCE.SECURITY
  epistemic_state: 'inferred: roll-up of the seven child decisions; techniques and floor grounded, the stage-policy synthesis (SECURITY.2) and the manual-testing and penetration-test triggers (SECURITY.3) inferred | gap: the period of penetration testing is open'
- op: node.set
  uid: ASSURANCE.RULES
  epistemic_state: 'known | gap: every numeric default is inferred (one organisation''s or one source''s figure) | unvalidated: awaiting maintainer, can an automated reviewer be the independent check (RULES.4, default applied)'
- op: node.set
  uid: ROOT
  epistemic_state: 'inferred: the whole as one claim, no source states the seven-branch guideline; order and split grounded in maintainer decisions MD-01 to MD-05 | gap: 41 open items (cadences, numeric thresholds, one-source minority views, two flags) kept at the L2 and L3 nodes, none contradicts a decision at this height | unvalidated: awaiting maintainer, can an automated reviewer be the independent check (ASSURANCE.RULES.4, default applied)'
- op: node.set
  uid: CHANGE_FLOW
  intent: Everything needed to build, deploy and restore lives in version control, and small, independently reviewed changes are integrated into one mainline; one hermetic build produces one artifact that is promoted unchanged, released and deployed progressively by the same automated process everywhere. Schema and data changes travel the same path as code, as reviewed scripts rehearsed on production-shaped data, and delivery is judged by outcomes, never by the volume of code produced. The way back is decided before a change ships, so what ships was reviewed, built once and is reversible.
- op: node.set
  uid: CONSTRUCTION
  intent: Design is derived from usage down to code, with effort where error is costly; the system starts as the simplest shape that serves, is cut by the decision each module hides, and parses what crosses a trust boundary once into a precise form that never reaches an interpreter as code. Names are derived from concepts, the paradigm is chosen by what the problem is, and a process starts fast, stops cleanly and holds no state it cannot lose. Each fact has one place and dependencies flow one way, so the code is correct at its boundaries and a change touches few places.
- op: node.set
  uid: OPERATION
  intent: The running system is held to a stated reliability objective below 100 percent, measured as users experience it and governed by an agreed rule, and a human is paged only for what needs a human now. Every service exposes the signals that show user harm and resource strain, capacity is planned against a measured breaking point, procedures are owned documents that a responder who did not write them can follow, and production feeds delivery measures back to development without making them targets. Incidents follow written conditions and named roles, workloads launch after a readiness review, and recovery is designed from stated objectives and proven before it is needed, so the system stays within its objectives and, when it fails, is restored within them.
  constraints:
  - no page without a human action needed now
  - no workload launched without a readiness review
  - no backup, plan or restore treated as present until tested (ASSURANCE.AVAILABILITY)
  - no target is set on the delivery measures that production feeds back to development
- op: node.set
  uid: ASSURANCE.AVAILABILITY
  intent: The system keeps serving when a dependency fails because each dependency has a designed degraded mode and a bounded call, resilience is verified by hypothesis-driven experiments under real conditions, and recovery is guaranteed by restores proven against criteria fixed beforehand and by exercised procedures with measured times. An untested mode, backup or plan is treated as absent.
- op: node.set
  uid: TRANSVERSE.DOCS
  intent: Documentation is sized by its consumers, life and turnover, kept in small documents organised by reader need and reached from an index, and written in layers for each audience, with release changes recorded for readers, and every guideline rule records its basis and what it replaced. Documentation is then found, read at the depth the reader needs and cheap enough to keep current; the mechanisms that keep it true are held in ASSURANCE.DOCS_SYNC.
- op: node.set
  uid: EVOLUTION.DEBT
  unset:
  - constraints
- op: node.set
  uid: EVOLUTION.DECISIONS
  unset:
  - constraints
- op: node.set
  uid: EVOLUTION.DECOMMISSION
  unset:
  - constraints
- op: node.set
  uid: EVOLUTION.INCREMENTAL
  unset:
  - constraints
- op: node.set
  uid: EVOLUTION.TECHNOLOGY
  unset:
  - constraints
- op: node.set
  uid: OWNERSHIP.CONTAINMENT
  constraints:
  - No rented service is adopted without a tested way out proportional to its criticality.
- op: node.set
  uid: OWNERSHIP.STANCE
  constraints:
  - No dependency or layer is added without a recorded reason.
- op: node.set
  uid: OWNERSHIP.LIFECYCLE
  constraints:
  - No adopted artifact is installed from anything but the lock.
- op: node.set
  uid: ASSURANCE.DATA_INTEGRITY.1
  constraints:
  - MUST declare in the store every invariant that must hold across writers
  - MUST name constraints
  - MUST validate at the edge as well
  - MUST NOT put policy that changes with product decisions in the store
- op: node.set
  uid: ASSURANCE.DATA_INTEGRITY.5
  constraints:
  - MUST give observe-only mode an exit condition and an owner
  - MUST NOT remove the old structure before validation passes
- op: node.set
  uid: ASSURANCE.PERFORMANCE.3
  constraints:
  - MUST compare each run with a baseline
  - MUST refresh the baseline after architectural or scaling change
  - MUST NOT gate a change on a signal whose noise exceeds the threshold it enforces
  - MUST check production configuration, not only code
- op: node.set
  uid: OPERATION.CAPACITY.3
  constraints:
  - MUST drop unused indexes only on usage evidence covering a full workload cycle
  - MUST rebuild without blocking writes
- op: node.set
  uid: OPERATION.RUNBOOKS.2
  intent: Runbooks and playbooks mature from text toward scripts and then automatic remediation, starting with short, frequently used, low-risk ones; a script is validated and exercised like any procedure before it runs unattended.
- op: node.set
  uid: OPERATION.TELEMETRY.6
  intent: 'Telemetry volume and cardinality are treated as a designed cost: metric label cardinality is bounded (no unbounded values such as user ids; per-entity detail goes to logs or traces), low-value telemetry is filtered and detail coarsened with a stated loss of granularity, and instrumentation stays broad because the bound is on labels, not on metrics. Each service should have a stated, reviewed bound on volume, series count and retention.'
  constraints:
  - MUST bound label cardinality
  - SHOULD state a volume or series bound per service
- op: node.set
  uid: OWNERSHIP.CONTAINMENT.2
  constraints:
  - Where a wrapper exists, a vendor type MUST NOT cross the team's public interface.
  - External types and parsing of the external payload MUST stay inside the wrapper, in one place.
  - A vendor's identifier MUST be stored only as an attribute of the team's entity that refers out, never as the key of the team's data or as a type in its public interface.
- op: node.set
  uid: CHANGE_FLOW.DEPLOY.4
  intent: Running instances are replaced rather than modified, and the declared state of images and infrastructure is versioned code, so the running system equals what is declared and drift cannot persist. Either agents reconcile declared state continuously or a scripted push is paired with drift detection.
- op: node.set
  uid: ASSURANCE.BEHAVIOUR.8
  examples:
  - A pitfall catalogue indexed by error code or symptom; a platform that silently truncates identifiers over a length limit (a stack pointer, not a decision).
- op: node.set
  uid: ASSURANCE.CONTRACTS.1
  examples:
  - 'Few, in-house, reachable consumers: additive and backward-compatible by default, a breaking change coordinated with every consumer and deployed together, no version numbers, a dated change log per unit.'
  - 'Many, external or independently released consumers, installed artifact (library): semantic versioning, deprecation through at least one minor release before removal in a major.'
  - 'Many, external or independently released consumers, running service: a breaking change ships as a new major version served alongside the old one for a stated deprecation window.'
  - 'Infrastructure-like API with a large consumer base and the funds to carry old behaviour: an indefinitely compatible, date-pinned surface.'
- op: node.set
  uid: ASSURANCE.BEHAVIOUR.4
  intent: A test observes behaviour through the public interface, one test per behaviour, and never changes unless requirements change; test code is production code, readable and descriptive over strictly DRY, with no loops or conditionals and one condition per test. Real collaborators are used when fast, deterministic and simple, otherwise a fake owned by the team that owns the real thing, mocks and stubs last; integration tests run against a real backing service of the production kind. A test reports its own verdict in a fixed, searchable shape, lives where it changes together with its unit, and sets fixture values once by name. The team states what a unit is and where tests start and stop, and records its double style, so tests survive refactoring and fail only for real defects.
  examples:
  - Verify state rather than interactions, except for state-changing calls that cannot be observed otherwise; arrange-act-assert.
  - A test reports its own verdict in a fixed, searchable shape carrying unit and scenario identity.
  - 'Tests live where they change together with the unit and are discoverable: colocated where the tooling has no test tree, in a separate mirrored tree where the language has a test runner.'
  - Fixture values reused across a test are named and set once, not hard-coded per statement.
  epistemic_state: 'known | gap: the verdict shape, the test location and the named fixture values are inferred (maintainer practice only); the classical-versus-mockist default is inferred (contested); the real-engine rule beyond databases is stated generally from a database case'
- op: node.set
  uid: ASSURANCE.BEHAVIOUR.7
  intent: 'A test never leaves a durable effect on data that anyone relies on: the default mechanism is a separate disposable data store per run, never the production one, with each test isolated. Running on shared or production-sized data behind a boundary guaranteed to be undone is best only when the dataset cannot be cloned or its shapes cannot be synthesized and the platform can undo every effect of the test, and a functional test never runs against production data unless every durable effect is provably undone. Test records are synthetic and built per test by default, with a curated, catalogued set of real records only where shapes are rich and costly to fabricate, and real records stay under the privacy rules. Test data and configuration are kept apart from production, and re-runs behave identically.'
  examples:
  - 'Stack pointer only: on one platform, the idiom that every outcome rolls back (a final error whose message is the verdict) realizes the rolled-back unit.'
  epistemic_state: 'known | gap: the synthetic-versus-curated records default, the execution vehicle, the disjoint test configuration and the conditional mutations are inferred (maintainer practice only, public practice read not fetched); the disposable-store default rests on one framework''s documentation plus the rebuild-state principle (consensus recorded, not several T1 sources); the rollback idiom is a platform fact of one stack'
- op: node.set
  uid: ASSURANCE.BEHAVIOUR.8
  epistemic_state: 'inferred: the lead claim is corroborated by one dated study, which shows only that static checks miss a run-time class of defect; the five practices rest on maintainer practice alone'
- op: node.set
  uid: ASSURANCE.CONTRACTS.2
  epistemic_state: 'known | gap: the single-team seam rule is inferred and open (the test that decides is whether an old client can stay live); the style choice is contested, resolved by known versus unknown consumers'
- op: node.set
  uid: ASSURANCE.DATA_INTEGRITY.1
  epistemic_state: 'inferred: core grounded; the split of the middle zone is inferred and contested'
- op: node.set
  uid: ASSURANCE.DATA_INTEGRITY.2
  epistemic_state: 'known | inferred part: that application-level opt-in and the schema-change lint are one principle'
- op: node.set
  uid: ASSURANCE.DATA_INTEGRITY.3
  epistemic_state: 'inferred: layers grounded (T2, consensus rows); the deletion form is inferred'
- op: node.set
  uid: ASSURANCE.RULES.3
  epistemic_state: 'known | gap: fitness functions as the mechanism are inferred (majority position); the skipped-check fact rests on one platform'
- op: node.set
  uid: CHANGE_FLOW.DATA_CHANGE.3
  epistemic_state: 'known | inferred: the named, qualified group that approves and triggers the authorization stage (no public source), the risk-based split as the general rule, the size criterion, and the idempotent authoring script for configuration-like content | gap: no public counterpart found for configuration-like content on its own path'
- op: node.set
  uid: CHANGE_FLOW.DATA_CHANGE.8
  epistemic_state: 'inferred: maintainer practice, single source, public practice agrees or extends it | gap: no public counterpart found for the convergence query and for identifying a statement to its change'
- op: node.set
  uid: CHANGE_FLOW.RELEASE.5
  epistemic_state: 'inferred: one practitioner source plus the argument that a change needs someone able to respond to its failure; restriction of release operations is grounded on one source'
- op: node.set
  uid: EVOLUTION.DECISIONS.1
  epistemic_state: 'known | inferred part: named forces as the revisit trigger (one origin, no source tests it)'
- op: node.set
  uid: EVOLUTION.DECISIONS.4
  epistemic_state: 'known | inferred part: the assignment of the two models per document type'
- op: node.set
  uid: EVOLUTION.INCREMENTAL.2
  epistemic_state: 'known | inferred part: an unfinished migration is itself debt'
- op: node.set
  uid: EVOLUTION.TECHNOLOGY.4
  epistemic_state: 'inferred: no top-tier or second-tier source states the rule | gap: contested row resting on one-project or commercially interested sources, limits of the store not verified from primary sources; no final-pass resolution addressed it'
