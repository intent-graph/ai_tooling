- op: node.set
  uid: OWNERSHIP.LIFECYCLE
  constraints:
  - An adopted artifact MUST NOT be installed from anything but the lock
  epistemic_state: 'inferred: roll-up of LIFECYCLE.1 to .5; the cores are grounded | gap: inferred, the release-age cooldown and the range-edge testing for library consumers'
- op: node.set
  uid: OWNERSHIP.LIFECYCLE.1
  constraints:
  - Dependencies MUST be declared completely and exactly in a manifest and run in an isolated environment, never relying on implicitly installed packages
  - A lock recording the exact resolved tree, direct and transitive, MUST be committed
  - CI and production MUST install from the lock only, and the build MUST fail when lock and manifest disagree
  - Artifacts MUST be verified by a cryptographic hash recorded in the lock, covering transitive dependencies; an install mode that rejects any artifact lacking a recorded hash MUST be used in deploys where the tool supports it
  - A new developer MUST need only the runtime, the dependency manager and one command
- op: node.set
  uid: OWNERSHIP.LIFECYCLE.2
  constraints:
  - Applications and services nobody else installs MUST pin all dependency types exactly, each bump being a reviewable change
  - Libraries MUST declare ranges and MUST test the lowest and newest versions their ranges admit in their own CI
  - The manifest range MUST still exclude known-broken versions
  - A version MUST change only through an explicit, reviewable change to the lock
  epistemic_state: 'known | gap: inferred, the testing of both range edges and the neutrality toward the resolution rule'
- op: node.set
  uid: OWNERSHIP.LIFECYCLE.3
  constraints:
  - Each update MUST be gated by the project's own tests (including integration tests for the team's usage) and release-note or diff review, and MUST be deployed through staged rollouts
  - Fixes for known vulnerabilities MUST be applied urgently, bypassing any scheduled delay, and kept separate from feature updates
  - Routine non-security updates of deployables MUST be held for a release-age cooldown of at least seven days; security fixes MUST NOT be held
  - Where verification is weak or deployment costly, updating on need MUST be recorded as debt to repay (EVOLUTION.DEBT)
  - After a worm-style supply-chain compromise, every developer credential MUST be treated as exposed, lockfiles reviewed and versions pinned to before the incident; rotation is held by TRANSVERSE.CONFIG.6
  epistemic_state: 'known | gap: inferred, the cooldown length and benefit (one analysis of ten attacks), the interim cadence under weak verification, and the post-compromise trigger (single source)'
- op: node.set
  uid: OWNERSHIP.LIFECYCLE.4
  constraints:
  - Artifacts MUST be obtained only through controlled, trusted channels, with lock and hashes
  - Provenance verification MUST be applied recursively, and a removed upstream MUST be addressed separately by a mirror, cache or vendored copy
  - Any artifact whose binary provenance cannot be confirmed MUST be rebuilt from verified source (the single statement of the rebuild rule); every deployed open-source artifact MUST be rebuilt from source in the team's own infrastructure for critical infrastructure or supply-chain-targeted organisations
  - The automation's own tools, plugins and descriptors, and build tools and compilers, MUST be pinned, vetted, changed only through audited change management, not auto-updated without review, and kept on versions that still receive security fixes
  - Two-factor authentication MUST protect publishing accounts of any registry, and phishing-resistant multi-factor authentication MUST protect developer accounts after compromises
  epistemic_state: 'known | gap: inferred, the tooling pinning rule and the account-protection scope beyond the cited sources'
- op: node.set
  uid: OWNERSHIP.LIFECYCLE.5
  constraints:
  - A machine-generated inventory MUST be kept and scanned continuously against vulnerability databases for as long as the software is in service, with a triage and update plan
  - Each component MUST be confirmed maintained and not at end of life, and a plan MUST exist for components that stop being maintained
  - Where law applies, due diligence on third-party components, an inventory and reporting of component vulnerabilities to their maintainers MUST be done
  epistemic_state: 'known | gap: inferred, the exact wording of the legal duty (primary text not read)'
- op: node.set
  uid: OWNERSHIP.SELECTION
  constraints:
  - A candidate MUST be judged against written criteria before it is admitted
- op: node.set
  uid: OWNERSHIP.SELECTION.1
  intent: 'Every dependency is judged against an explicit written criteria set in the context of its intended use, and the reason for each non-trivial selection is recorded. Aggregator catalogues serve discovery and first screening only. It enters through a gate: a central sanctioned list where many teams, regulation or high criticality are involved, otherwise a reviewed proposal with light visibility.'
  constraints:
  - Candidates MUST be judged against a written criteria set in the context of intended use, repeated when the use changes substantially
  - The reason for each non-trivial selection (alternatives, criteria, accepted risks) MUST be stored as a decision record where later maintainers find it (EVOLUTION.DECISIONS)
  - A dependency MUST enter only through the gate
  - Aggregators MUST serve only discovery and first screening
  epistemic_state: 'known | gap: inferred, the written-selection and recorded-reason practices (one study, synthesis)'
- op: node.set
  uid: OWNERSHIP.SELECTION.2
  constraints:
  - Before novelty is spent, why the existing tool cannot solve the problem MUST be documented
  - Novelty MUST be introduced in stages (limited production trial, then adopt or hold) with an exit or migration plan
  - The perpetual operating cost of a new technology MUST be weighed against the convenience of adoption
  epistemic_state: 'known | gap: inferred, the staged-versus-boring reconciliation and the reversible entry'
- op: node.set
  uid: OWNERSHIP.SELECTION.3
  constraints:
  - Several maintainers from several organisations MUST be required when the component is on a critical path or hard to replace
  - A single-maintainer component outside the small, stable, easily replaced case MUST carry a recorded compensating reason or an exit plan
  - A popularity or aggregate score MUST NOT be treated as proof of quality or fit
  epistemic_state: 'known | gap: inferred, the stance on pre-1.0 labels and the remark on screening by score at scale'
- op: node.set
  uid: OWNERSHIP.SELECTION.4
  constraints:
  - Transitive dependencies MUST be counted as part of a candidate's cost
  - Trivial functionality the team can own in a few lines MUST be inlined instead of taken as a package
  - The registry's maintainer-account concentration MUST be counted as part of the exposure
  epistemic_state: 'known | gap: inferred, generalisation beyond the evidence of one ecosystem'
- op: node.set
  uid: OWNERSHIP.SELECTION.5
  constraints:
  - A candidate whose current version has known unfixed vulnerabilities for the intended deployment MUST be rejected or deferred
  - 'Authenticity MUST be verified: official source over a secure link, signatures where available, the name checked against look-alikes and compromised forks, and a generated or suggested name resolved to the intended vetted package'
  - Provenance (bill of materials, source composition, signatures) MUST be obtained for high-criticality use, and integrity checks applied
  - Where binary provenance cannot be confirmed, the rebuild rule of LIFECYCLE.4 MUST apply
  epistemic_state: 'known | gap: inferred, the claim that ecosystem coverage of provenance is partial'
- op: node.set
