# batch.yaml: final pass on the critique flags Y01 to Y23 (see verdicts.md beside this file).
# Apply with:
#   ig-tool apply -g intent_graphs/software_development_philosophy.ig.yaml --batch build/distill/05_critique/final/batch.yaml -o <out> --role final-pass -m "final pass on critique flags Y01-Y23"
# node.set replaces whole lists (constraints, examples); old text read from the graph through ig-tool query.
operations:
- op: node.set
  uid: ASSURANCE
  constraints:
  - Every property MUST have a mechanism, a stage and a recurring trigger
  - Every check MUST have a stated false-alarm budget against which its measured rate is held
  - A gate MUST NOT be skippable
  - Every approval MUST bind the exact content that ships
- op: node.set
  uid: ASSURANCE.AVAILABILITY.2
  intent: Every remote call is bounded by connection and request timeouts sized from the dependency's measured latency percentile and by a deadline propagated across calls; retries are limited to transient failures, capped, made at one layer only, safe for non-read operations only if idempotent, and bounded system-wide by a retry budget. A circuit breaker, whose state changes are logged, is added only where a dependency fails slowly or is shared by many callers, so a failing dependency cannot exhaust the caller's resources and retries cannot amplify an outage.
- op: node.set
  uid: ASSURANCE.AVAILABILITY.3
  intent: Resilience is verified by automated experiments built on a steady-state hypothesis over measurable outputs, in pre-production by default and on production traffic only when the steady state is measurable, rollback is proven and the blast radius is bounded. These guardrails govern the transient effects that every production test shares; durable effects on data fall under the rule held in BEHAVIOUR.7, and a gap an experiment finds is a defect handled like any other.
  constraints:
  - MUST state a steady-state hypothesis over measurable outputs or an abort criterion
  - MUST have a proven rollback
  - MUST bound blast radius
  - MUST treat a gap found as a defect handled by BEHAVIOUR.5
- op: node.set
  uid: ASSURANCE.AVAILABILITY.4
  intent: A backup counts only if a restore from it was tested end to end, regularly and automatically, by the procedure of a real recovery, against criteria fixed beforehand (data present, uncorrupted, accessible and within the recovery point; restore complete within the recovery time). A restore runs by its own path, independent of schema-change tooling. Backup integrity is verified before restore and restored assets before service is declared restored, so the recovery objectives are shown by test and not assumed.
- op: node.set
  uid: ASSURANCE.BEHAVIOUR.1
  constraints:
  - The suite MUST run on every change and be runnable in the language's standard way
  - A written test policy MUST exist (new functionality and every fix come with automated tests); the evidence that it is followed is the tests in each change, visible in its review, with no separate artefact
  - A pass MUST NOT be read as proof of reliability
- op: node.set
  uid: ASSURANCE.BEHAVIOUR.2
  constraints:
  - Type checks, compiler warnings and the adopted linter rules MUST block, and analyses whose findings need judgement MUST advise in review, each under the false-alarm budget of RULES.1
  - A warning MUST be fixed or suppressed with a reason
  epistemic_state: 'known | gap: ''types as the first test layer'' is inferred (the sources are third-tier or tool documentation); the trend practice rests on one observational study; rejection of tests-alone rests on absence of a source'
- op: node.set
  uid: ASSURANCE.BEHAVIOUR.3
  constraints:
  - The mix MUST be recorded
  - End-to-end tests MUST be few and for critical journeys unless fast, reliable and cheap
- op: node.set
  uid: ASSURANCE.BEHAVIOUR.4
  constraints:
  - The double style and the unit definition MUST be recorded
  - A test MUST NOT change when only structure changes
  - Integration tests MUST use the production kind of backing service
- op: node.set
  uid: ASSURANCE.BEHAVIOUR.5
  constraints:
  - A fixed defect MUST have a regression test
  - A scheduled job MUST pass its tests before it is scheduled
- op: node.set
  uid: ASSURANCE.BEHAVIOUR.6
  constraints:
  - A coverage number MUST NOT gate a merge, set a quality target or serve as a security floor
  - Input-handling code of security relevance MUST be fuzzed
  epistemic_state: 'known | gap: the rule for security-relevant code is inferred (it follows from the study and Google''s report, no source tests a floor on security code); mutation and property-based testing effect is inferred (no effect size); effect size of mutation testing is open'
- op: node.set
  uid: ASSURANCE.BEHAVIOUR.7
  intent: 'A test never leaves a durable effect on data that anyone relies on: the default mechanism is a separate disposable data store per run, never the production one, with each test isolated. Running on shared or production-sized data behind a boundary guaranteed to be undone is best only when the dataset cannot be cloned or its shapes cannot be synthesized and the platform can undo every effect of the test, and no test, functional or experimental, runs against production data unless every durable effect is provably undone: its records isolated and marked apart from real data and removed after the run, and any other durable effect suppressed or undone. Test records are synthetic and built per test by default, with a curated, catalogued set of real records only where shapes are rich and costly to fabricate, and real records stay under the privacy rules. Test data and configuration are kept apart from production, and re-runs behave identically.'
  constraints:
  - A test MUST NOT commit a durable change to shared data
  - Production code MUST NOT read the test namespace
  - A mutating automated test on shared or production-sized data MUST run as one rolled-back unit
  - A test on production data MUST isolate and mark its records and remove them after the run
  examples:
  - 'Stack-specific, not a decision: on one platform, the idiom that every outcome rolls back (a final error whose message is the verdict) realizes the rolled-back unit.'
  epistemic_state: 'known | gap: the synthetic-versus-curated records default, the execution vehicle, the disjoint test configuration and the conditional mutations are inferred (maintainer practice only, public practice read not fetched); the disposable-store default rests on one framework''s documentation plus the rebuild-state principle (consensus recorded, not several top-tier sources); the rollback idiom is a platform fact of one stack'
- op: node.set
  uid: ASSURANCE.BEHAVIOUR.8
  intent: 'Passing review, static analysis and deployment is not evidence that code works: code whose behaviour depends on the shape of the data (queries, parsing, conversions, code on platforms that coerce or truncate) is exercised on production-shaped data, its edge values included, before it ships, beyond the parsing at boundaries that CONSTRUCTION.BOUNDARY.1 holds. A platform limit that fails silently has a check, unclear platform behaviour that a design relies on is verified empirically and recorded with its scope, and a pitfall catalogue grows after any defect found twice. A blanket search-and-replace is never applied across a file that holds two syntactic contexts.'
  constraints:
  - Data-dependent code MUST be exercised on production-shaped data before it ships
  - A platform limit that fails silently MUST have a check
  - A pitfall found twice MUST be catalogued
  examples:
  - A pitfall catalogue indexed by error code or symptom; a platform that silently truncates identifiers over a length limit (stack-specific, not a decision).
- op: node.set
  uid: ASSURANCE.CONTRACTS
  epistemic_state: 'inferred: roll-up of CONTRACTS.1 to .3; the definition and the contract-test principle are grounded | gap: the style choices (which evolution policy, which contract-test style, code-first or design-first) are inferred, each resolved by context'
- op: node.set
  uid: ASSURANCE.CONTRACTS.1
  constraints:
  - The public interface MUST be declared
  - A breaking change MUST be coordinated or deprecated, never silent
  epistemic_state: 'known | gap: the consumer-count threshold has no numeric boundary in any source (inferred); the mapping of artifact kind to policy is inferred; the maintainer''s additive-plus-coordination practice is inferred (public practice contested)'
- op: node.set
  uid: ASSURANCE.CONTRACTS.2
  constraints:
  - A double of an external service MUST have a contract test against the real service
  - A contract-test failure MUST create a realignment task
- op: node.set
  uid: ASSURANCE.CONTRACTS.3
  intent: Each interface has one machine-readable description from which the reference documentation, client and server stubs, the types of every tier and tests are derived, never hand-copied. The description is linted in CI against a team ruleset, and CI diffs it against the main-branch version and fails on incompatible change; since the diff covers the description only, behaviour and semantics still need contract tests. The description originates in a typed model when one team owns both ends and is authored first when independent consumers depend on it, and the team records where the chain of types starts.
  constraints:
  - The description MUST have one source
  - A generated description MUST NOT be hand-edited
  - CI MUST block an incompatible change in the description
  - A type MUST NOT be hand-copied across tiers
  epistemic_state: 'known | gap: lint and the CI diff are grounded as tool capability only (third-tier tool pages), ''CI blocks'' is inferred; the origin condition, the ''should'' of lint and the ''description only'' limit are inferred; code-first against design-first is contested; the derivation of physical types in every tier is inferred'
- op: node.set
  uid: ASSURANCE.DATA_INTEGRITY.2
  epistemic_state: 'known | gap: inferred, that application-level opt-in and the schema-change lint are one principle'
- op: node.set
  uid: ASSURANCE.DATA_INTEGRITY.3
  epistemic_state: 'inferred: layers grounded (second-tier, consensus claims); the deletion form is inferred'
- op: node.set
  uid: ASSURANCE.DATA_INTEGRITY.5
  epistemic_state: 'known | gap: inferred, the owner of observe-only mode (no source states it)'
- op: node.set
  uid: ASSURANCE.DOCS_SYNC
  epistemic_state: 'inferred: the ordering of mechanisms by strength is a synthesis of this guideline; each part is grounded'
- op: node.set
  uid: ASSURANCE.DOCS_SYNC.1
  epistemic_state: 'known | gap: inferred, the motivation of the reduced pipeline for documentation-only changes'
- op: node.set
  uid: ASSURANCE.DOCS_SYNC.2
  epistemic_state: 'inferred: each component grounded; the combination of declared documentation impact checked by CI plus reviewer verification is a synthesis of this guideline (sources split on hard versus soft gate)'
- op: node.set
  uid: ASSURANCE.DOCS_SYNC.4
  epistemic_state: 'known | gap: inferred, the reasons marked inferred (link checks on a schedule, others)'
- op: node.set
  uid: ASSURANCE.PERFORMANCE
  epistemic_state: 'inferred: roll-up of the five child decisions, each with its own certainty; the weakest child is .5 (transfer of its measurement methods to other runtimes)'
- op: node.set
  uid: ASSURANCE.PERFORMANCE.4
  constraints:
  - MUST apply the production-test guardrails of AVAILABILITY.3
  - A production load test MUST run off-peak, ramp from a small share and reserve capacity
- op: node.set
  uid: ASSURANCE.RULES
  epistemic_state: 'inferred: roll-up of RULES.1 to .5; the principles are grounded under each child | gap: every numeric default is inferred (one organisation''s or one source''s figure) | unvalidated: awaiting maintainer, can an automated reviewer be the independent check (RULES.4, default applied)'
- op: node.set
  uid: ASSURANCE.RULES.1
  intent: 'A failing check must mean a real defect, so a pass can be believed and a finding is acted on: non-determinism is prevented at its cause, each test establishing the state it needs instead of relying on another test''s clean-up and, where rebuilding per test costs too much, the platform doing the undo (a rolled-back transaction, a snapshot restore), never hand-written clean-up code; a flaky test that already exists is a defect of the pipeline, taken out of the blocking gate into a quarantine with an owner, a numeric cap and a time limit, then fixed or deleted. A check blocks while its measured false-alarm rate is within the budget the team states for it, a lower-confidence check is shown in review as advice also under a budget, and a check over budget in either mode is fixed or removed.'
  constraints:
  - A check, blocking or advisory, MUST have a stated false-alarm budget
  - A check over its budget MUST be fixed or removed
  - A quarantined test MUST have an owner, a cap and an end date
  - A rerun MUST NOT hide a failure
  examples:
  - 'Further preventions: wait on events or polling rather than bare sleeps, wrap the clock, double remote services, shrink large tests, check a new test repeatedly when it is added.'
- op: node.set
  uid: ASSURANCE.RULES.2
  constraints:
  - The blocking set MUST return in minutes
  - Every higher-level miss MUST produce a lower-level test
  - A stage policy MUST be recorded per risk
- op: node.set
  uid: ASSURANCE.RULES.3
  constraints:
  - A required check MUST fail closed (skipped or missing counts as failed)
  - A blocking check MUST NOT be a noisy one (RULES.1)
- op: node.set
  uid: ASSURANCE.RULES.4
  constraints:
  - The approver MUST differ from the author
  - An approval MUST lapse when the diff changes
  - A named person or role MUST be accountable
  epistemic_state: 'known | gap: the reviewer-kind clause (a person or an automated reviewer; for a high-risk change, a reviewer of a different kind from the author) is the default applied and inferred; the reason for rejecting review of uncertain changes only is inferred; whether a given regulation still requires an external board was not read | unvalidated: awaiting maintainer, can an automated reviewer be the independent check (default applied)'
- op: node.set
  uid: ASSURANCE.RULES.5
  constraints:
  - Every change MUST carry an executable check
  - Completion MUST be shown by evidence
  - A change MUST NOT be exempt by its author
  epistemic_state: 'known | gap: intent-and-acceptance-first and independent contexts are inferred (a vendor guide, one DORA capability); the executable check and the evidence rest on one top-tier vendor source, no consensus claim'
- op: node.set
  uid: ASSURANCE.SECURITY.1
  epistemic_state: 'known | gap: inferred, the revisit trigger of the assurance target'
- op: node.set
  uid: ASSURANCE.SECURITY.5
  constraints:
  - MUST layer secret scanning
  - MUST give a bypass the audited waiver of SECURITY.2
  - A secret found in history MUST be rotated (practice in TRANSVERSE)
- op: node.set
  uid: ASSURANCE.SECURITY.6
  intent: 'Limits on what any actor can touch, a person, a script or an automated agent, are enforced in tooling at the lowest layer every path passes through, never by an instruction the actor is asked to follow. The condition that moves the rest is whether the actor acts without a person''s judgement at the moment of action: such an actor gets the least functionality, permission and autonomy its task needs, does not itself execute a job whose guards cannot be applied or whose effects are irreversible, and never combines untrusted input, access to sensitive systems and outward state change without a human gate. Data access goes through one guarded path with least-privilege roles, whoever uses it. What an actor or an ad-hoc path can touch is thus bounded by something it cannot argue with.'
  constraints:
  - Limits MUST be enforced in tooling, never by instruction
  - An actor that acts without a person's judgement MUST NOT combine untrusted input, access to sensitive systems and outward state change without a human gate
  - MUST record the execute-or-write-only decision for a large-blast-radius job
  examples:
  - An instruction in an automated agent's prompt is not a limit; a deny rule in its sandbox is.
  epistemic_state: 'known | gap: inferred, the framing of the execute-or-write-only choice as a recorded decision, the generalisation of the three-condition rule, and its condition stated as acting without a person''s judgement at the moment of action'
- op: node.set
  uid: CHANGE_FLOW
  constraints:
  - A change MUST NOT reach production except from reviewed mainline through the one pipeline
  - The deployed artifact MUST be the one that was built
  - Every change MUST have a named way back before it ships
  - A schema or data change MUST NOT be applied as hand-typed statements
  epistemic_state: 'inferred: roll-up of eight L2 records; build-once, small batches and review principles grounded, numeric defaults and much of DATA_CHANGE inferred (single-source practice) | gap: open at INTEGRATION.1, INTEGRATION.4, REVIEW.4, RELEASE.2, DEPLOY.4, MEASURE.1 | unvalidated: awaiting maintainer, can an automated reviewer be the independent check (ASSURANCE.RULES.4, default applied)'
- op: node.set
  uid: CHANGE_FLOW.BUILD.1
  constraints:
  - Every push to the mainline MUST trigger the build and suite
  - A build MUST depend on no machine-specific state
- op: node.set
  uid: CHANGE_FLOW.BUILD.2
  intent: Build, release and run are separate stages; a release is immutable and uniquely identified, built once and promoted unchanged to every environment, with environment configuration kept outside it as TRANSVERSE.CONFIG.1 holds and its provenance verified before use as ASSURANCE.ARTIFACT.1 holds. What runs in production is then the artifact that was tested and reviewed.
  constraints:
  - An artifact MUST be promoted by identity, not rebuilt
  epistemic_state: 'known | gap: inferred, the wording of the build-once-promote rule'
- op: node.set
  uid: CHANGE_FLOW.DATA_CHANGE.1
  intent: Every schema and data change is a migration script in version control, ordered, applied once, recorded, and run by the automated deployment process of DEPLOY.1, never by hand-typed statements. Changes are as small as possible and the reviewed script is the script deployed.
  constraints:
  - Every database change MUST be a script in version control applied by tooling
  - A change MUST NOT be hand-typed
  - Each migration MUST name its ticket
  - The reviewed script MUST be the deployed script
  epistemic_state: 'known | gap: inferred, idempotent DDL as defence in depth and the separate stream for frequent urgent data fixes (maintainer practice and one practitioner source, conditions reasoned)'
- op: node.set
  uid: CHANGE_FLOW.DATA_CHANGE.2
  constraints:
  - An applied migration MUST NOT change
  - The history MUST live in the target database
  epistemic_state: 'known | gap: inferred, the checksum as a general mechanism and the strict never-edit form'
- op: node.set
  uid: CHANGE_FLOW.DATA_CHANGE.3
  intent: 'Database change travels in the same pipeline as application change, as the reviewed script of DATA_CHANGE.1 with one history and one audit trail, not as a separate manual track. A recorded criterion classes each change: ordinary changes apply automatically through every environment, while the risky class passes an authorization stage where a named, qualified group approves the production run on the exact script and a member triggers it.'
  constraints:
  - The classification criterion MUST be recorded
  - A risky-class change MUST NOT start from an automatic merge
  - A production run of the risky class MUST name who runs it and be approved on the exact script
  epistemic_state: 'inferred: the decision core is inferred, the named, qualified group that approves and triggers the authorization stage (no public source) and the risk-based split as the general rule, as are the size criterion and the idempotent authoring script for configuration-like content; one pipeline and one history for database and application change are grounded | gap: no public counterpart found for configuration-like content on its own path'
- op: node.set
  uid: CHANGE_FLOW.DATA_CHANGE.4
  intent: A schema change deploys separately from and before the code that needs it, and an incompatible structural change follows expand, migrate, contract as EVOLUTION.INCREMENTAL.2 holds, with a scheduled contract step, because old and new code run against the same data during the deploy window. An application deploy is gated on the schema version it declares and fails if the history lacks it.
  constraints:
  - A schema change MUST deploy before the code that needs it
  - 'The contract step of a schema change MUST have a date (its owner: EVOLUTION.INCREMENTAL.2)'
  - An application deploy MUST fail if the schema history lacks the minimum version it declares
  epistemic_state: 'known | gap: inferred, the minimum-schema-version gate as the general form (single maintainer source) and the choice among compatibility surfaces'
- op: node.set
  uid: CHANGE_FLOW.DATA_CHANGE.5
  constraints:
  - The lock taken by a statement MUST be known before a run on a shared database
  - A migration MUST set a session-level lock timeout
  - A statement that cannot run in a transaction MUST run in its own step
  epistemic_state: 'known | gap: inferred, the starvation reason for the lock timeout with retry; do-not-shard-schema-changes is maintainer practice read as consensus'
- op: node.set
  uid: CHANGE_FLOW.DATA_CHANGE.6
  constraints:
  - A bulk batch MUST be re-runnable with the same result
  - A batch MUST NOT run inside a long schema-change transaction
  - The place a backfill runs MUST be recorded with its reason
  epistemic_state: 'known | gap: inferred, the four-decision procedure, the re-runnable batch rules and the standard-tools rule (maintainer practice, single source, public practice agrees or extends); place by duration is contested and decided by duration'
- op: node.set
  uid: CHANGE_FLOW.DATA_CHANGE.7
  constraints:
  - MUST measure duration and lock behaviour on a rehearsal copy before production and keep the figures with the change
  - A migration with a skip marker MUST be rehearsed elsewhere
  - Personal data MUST be masked in a copy of production
  epistemic_state: 'known | gap: inferred, the restored-dump rehearsal on every request, the condition on skipped migrations and the time-budget figures'
- op: node.set
  uid: CHANGE_FLOW.DATA_CHANGE.8
  constraints:
  - A convergence query MUST be written before the job starts
  - The first production run MUST halt on the first failure
  - A bulk job MUST keep a ledger
  - A long-running statement MUST be identifiable to its change in activity views and logs (for example the ticket key in a comment)
- op: node.set
  uid: CHANGE_FLOW.DEPLOY.1
  constraints:
  - Production MUST be deployed by the same scripted process as every other environment
  - Deployment scripts MUST be versioned
  - Admin code MUST ship with the application
  epistemic_state: 'known | gap: inferred, the maintainer''s human-triggered lane is compatible with the same process (reasoned, see DATA_CHANGE.3)'
- op: node.set
  uid: CHANGE_FLOW.DEPLOY.2
  constraints:
  - A rollout MUST have an automatic halt or rollback criterion
  - A canary MUST compare with a concurrent control
  epistemic_state: 'known | gap: inferred, the concurrent-control rule is general (one source)'
- op: node.set
  uid: CHANGE_FLOW.DEPLOY.3
  intent: Every environment is kept alike production in kind (type and version of backing services, operating system, libraries) with a short commit-to-deploy time and no stand-ins that hide differences, while credentials stay isolated per environment as TRANSVERSE.ENVIRONMENTS.1 holds. Differences that cannot be afforded (scale, data volume, permissions, production-only schemas) are written down, and changes that depend on them are routed to rehearsal on production-shaped data and to the gated lane.
  constraints:
  - Backing-service type and version MUST match production in every environment
  - The list of known environment differences MUST be written down and referenced by the changes it affects
  epistemic_state: 'inferred: the split by axis (kind and version against scale and data) is reasoned from the source claims, not stated by a source, and the documented-divergence rule is the maintainer''s practice, single source; parity of kind and version is grounded'
- op: node.set
  uid: CHANGE_FLOW.DEPLOY.4
  constraints:
  - Declared state MUST be in version control
  - An instance MUST NOT be modified in place without the change recorded back into the declared state
- op: node.set
  uid: CHANGE_FLOW.INTEGRATION.1
  intent: The repository holds everything needed to build, deploy and restore, so a clean machine rebuilds the system from it alone through the hermetic build of BUILD.1. Each deployable has one codebase, code shared across applications is a versioned library, and whatever repository layout is chosen keeps one version of each shared component at any time.
  constraints:
  - The repository MUST hold everything needed to build, deploy and restore
  - One version of each shared component MUST hold at any time
  epistemic_state: 'known | gap: which repository layout wins in general is open, the layout debate rests on one practitioner source; inferred, a monorepo holds one codebase per application as one unit per deployable with its own build and deploy'
- op: node.set
  uid: CHANGE_FLOW.INTEGRATION.2
  constraints:
  - A branch MUST be merged or deleted within days (the limit is the team's, default a couple of days)
  - Unfinished work on the mainline MUST be hidden and its toggle carry an owner and an expiry (RELEASE.3)
  epistemic_state: 'known | gap: inferred, the three-or-fewer active branches figure is a default bound, not a rule'
- op: node.set
  uid: CHANGE_FLOW.INTEGRATION.3
  intent: 'The branching model follows the release model: one continuously delivered live version uses short branches off one mainline and fixes go forward, while explicitly versioned or multi-version software cuts a release branch just in time, fixes on the mainline, copies each fix into it and deletes it after release. A branch exists only as long as a version needs separate fixes.'
  constraints:
  - A release branch (when it exists) MUST receive fixes copied from the mainline, not by merge back
  examples:
  - In a version-control system that offers it, the copy of a mainline fix into a release branch is a cherry-pick.
  epistemic_state: 'known | gap: inferred, the just-in-time release branch is the form a release branch takes, not a rival to it'
- op: node.set
  uid: CHANGE_FLOW.INTEGRATION.4
  constraints:
  - One merge method MUST be recorded per repository
  - A commit MUST be atomic and say what and why
  epistemic_state: 'known | gap: which of the three merge methods wins is open, no source ranks them; inferred, the squash default follows from small units and simple revert'
- op: node.set
  uid: CHANGE_FLOW.INTEGRATION.5
  constraints:
  - A broken mainline MUST be reverted or fixed before new work merges
  epistemic_state: 'known | gap: inferred, the causal link from change volume to oversized batches'
- op: node.set
  uid: CHANGE_FLOW.INTEGRATION.6
  constraints:
  - An automated author MUST use an identity distinct from a human one
  - An unattributed change MUST be approved by a named person
  - The bar MUST NOT depend on who authored
  epistemic_state: 'inferred: the author-neutral phrasing of the actor boundaries and the choice of no disclosure rule over disclosure (one maintainer ruling, one inference); the recorded trail and distinct automation identities are grounded'
- op: node.set
  uid: CHANGE_FLOW.MEASURE.1
  intent: Delivery is measured with five outcome metrics (change lead time, deployment frequency, failed-deployment recovery time, change fail rate, deployment rework rate), used as signals to guide improvement and not to rank people; the two that production feeds back are never made targets (OPERATION.FEEDBACK). Speed and stability move together only with supporting practices, and the change flow is judged by outcomes, never by the volume of code or changes produced.
  constraints:
  - Delivery MUST be judged on the outcome measures
  - The metrics MUST NOT be used to rank individuals
- op: node.set
  uid: CHANGE_FLOW.MEASURE.2
  constraints:
  - A claimed gain MUST be measured against a baseline not produced by the claimant
  epistemic_state: 'known | gap: inferred, the independent baseline as a principle (findings from small samples)'
- op: node.set
  uid: CHANGE_FLOW.RELEASE.1
  constraints:
  - The batch size per release MUST be kept as small as the model allows
  epistemic_state: 'known | gap: inferred, the cadence per release model rests on a few sources'
- op: node.set
  uid: CHANGE_FLOW.RELEASE.2
  constraints:
  - Every release MUST have a unique identifier
  - A version number that promises compatibility MUST be backed by a declared public interface
  epistemic_state: 'known | gap: calendar versioning is not read in any source, open and not rejected; inferred, the plain release identifier for a single live service'
- op: node.set
  uid: CHANGE_FLOW.RELEASE.3
  constraints:
  - A release toggle MUST carry an expiry and a removal task
  - The states that can occur in production MUST be tested
  epistemic_state: 'known | gap: inferred, toggles as inventory as the general rule (single source)'
- op: node.set
  uid: CHANGE_FLOW.RELEASE.4
  constraints:
  - Every gate MUST state its criterion
  - A gate MUST NOT be skippable by a person with a different route to production (RULES.3)
  epistemic_state: 'known | gap: inferred, placing the irreversible data class under human gates'
- op: node.set
  uid: CHANGE_FLOW.RELEASE.5
  constraints:
  - The set of release-permitted people MUST be a recorded policy
  - An incident exception path MUST exist
- op: node.set
  uid: CHANGE_FLOW.REVIEW
  epistemic_state: 'inferred: roll-up of REVIEW.1 to .4; grounded in the settled independent-review decision and the children | unvalidated: awaiting maintainer, can an automated reviewer be the independent check (ASSURANCE.RULES.4, default applied)'
- op: node.set
  uid: CHANGE_FLOW.REVIEW.1
  intent: Every change meets the one bar of ASSURANCE.RULES.5 and the independent check before integration of RULES.4; the mechanism (asynchronous approval, synchronous review or pairing, post-merge show for the defined low-risk tier) is chosen per team and recorded. Depth rises with risk and wherever the submitter's understanding cannot be assumed, and a high-blast-radius change is approved by named approvers qualified for that class.
  constraints:
