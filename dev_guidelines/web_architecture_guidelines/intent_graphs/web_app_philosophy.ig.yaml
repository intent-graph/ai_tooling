- uid: INTERACTION.AGENT
  name: Agent Access
  intent: An agent is one more user with bounded authority, served through an adapter
    on the same core that translates and shapes but never decides. Tokens are audience-bound
    and never forwarded, scopes are the narrowest, tools few and purpose-specific,
    consumption is limited by quota per agent identity, harmful flows are protected
    by name, and every agent action is audited on the server.
  epistemic_state: 'known | unvalidated: L648 applied to agents the application runs
    or serves (inferred); the identify-then-limit synthesis of L652 (inferred) | open:
    the list of scarce-goods flows where agents are excluded or a human must complete
    the flow, recorded per project'
  constraints:
  - The agent surface is an adapter to a backend that only translates and shapes;
    rules, validation, authorization and state transitions never live in the adapter
    or in prompts (RULES.4).
  - Agents never connect to the database.
  - 'Agents never decide access: model output and client-supplied hints (tool annotations,
    claimed identity, client name) are untrusted input; the backend and the writer
    functions decide (GUARD.3).'
  - The server accepts only tokens issued for it and never forwards a caller's token;
    downstream calls use its own token.
  - Each agent holds its own short-lived, revocable credential (GUARD.4).
  - Narrowest scopes, read scopes first, elevation on demand through a precise insufficient-scope
    challenge, no wildcard or omnibus scope; every request still authorized in server
    code.
  - Few purpose-specific tools, each with only the permissions it needs; no raw shell,
    raw SQL or arbitrary URL fetch on the live system.
  - Where the application runs or hosts an agent, no session holds untrusted input,
    private data and the power to change state or send outward together; if all three
    are needed, a supervised step or a split session.
  - For agents the team does not run, no tool sends data to an arbitrary destination,
    and consequential or external effects go through the approval of irreversible
    or external effects above.
  - Irreversible or external effects require approval by the owning user, shown the
    exact action on the application's own page; the effect's writer function refuses
    an agent-originated operation without it, and an approval dialog in the agent
    host is a client hint, never the gate.
  - Agents that identify and authenticate themselves are admitted to every flow their
    scopes allow and limited by quota per agent identity.
  - 'Flows whose automation harms the business (purchase, sign-up, booking, referral)
    are named and protected: per-flow limits for identified agents, anonymous automation
    denied or challenged.'
  - On a flow that hands out scarce goods or rewards automation per account, completing
    the flow requires a human, or agents are excluded, whatever their identity; the
    list of such flows is a decision recorded per project.
  - Every mutation offered to agents that is not idempotent by design takes an idempotency
    key, recorded with the effect (GUARD.6).
  - Every agent action is logged on the server with acting identity, delegating subject,
    operation, correlation id and outcome, never only in a model transcript; agent-originated
    writes are marked in the data (ACT.4).
  design_notes: 'Decides: how agents act as users with bounded authority, verifiable
    identity and limited consumption.

    Rows: L640, L642, L645, L648, L652. Cited: L633, L644, L650, L646, L651, L658,
    L659, L034.

    Positions:

    - Tokens: P1 the server accepts only tokens issued for it and obtains its own
    for downstream calls (L640); P2 forwarding the client''s token downstream (rejected
    in L640).

    - Scopes: P3 narrowest scopes, read first, elevation on demand (L642); P4 coarser
    scopes (acceptable in L642 for trusted first-party agents).

    - Tools: P5 few purpose-specific tools (L645); P6 open-ended tools: raw shell,
    raw SQL, arbitrary URL fetch (acceptable in L645 only inside a sandbox, SRC-398).

    - Session capabilities: P7 never untrusted input, private data and the power to
    change state or communicate externally in one session (L648); P8 rely on filtering
    the input (L649, pig-web: filters as an additional layer only).

    - Automated traffic: P9 deny non-human patterns on sensitive flows (L652 a, L034);
    P10 admit automated clients that identify and authenticate themselves, limited
    by quota (L652 b); P11 blanket bot blocking (rejected in L652).

    Forces: P1, P3, P5, P7 serve security and audit clarity (bounded authority), at
    the cost of consent friction, step-up round trips and fewer things an agent can
    do in one call. P4 and P6 serve capability and fewer round trips, at the cost
    of blast radius. P9 serves business integrity on flows whose automation harms
    the business; P10 serves agents as intended users; the ledger row states this
    trade-off itself ("serves business integrity against agent access", L652), and
    each side wins under its own condition. P11 serves neither once agents are users.

    Decision grounds: P1, P3, P5, P7, P10 with P9 as conditioned below; one core (RULES.4,
    L633); agents never decide access (GUARD.3; L644, L650); duplicate-safe (GUARD.6);
    accountable (ACT.4; L658; the backend asserts the user and the agent as the actor,
    R1-3 of the allocation records). Quotas are partitioned per agent identity so
    one runaway agent cannot exhaust its user''s allowance (L651, pig-web). The application
    of L648 to external agents (tool shape and approval design instead of session
    control) is inferred.

    Rejected:

    - P2: wins never (L640).

    - P4: acceptable when the agent is first-party (built and run by the team) and
    every request is still authorized in server code (L642).

    - P6: acceptable only inside a sandbox that holds no authority and no connection
    to the system of record (L645, SRC-398; RECORD.2 forbids agent connections to
    the database).

    - P8 as the only control: wins never (L649); filters stay an additional layer.

    - P9 as the default for all automated traffic: rejected, since agents are intended
    users in the default context. P9 wins on the named harmful flows for anonymous
    automation, and wins outright on a flow that hands out scarce goods or rewards
    automation per account (limited stock, referral credit): per-agent quotas and
    owner approval do not stop one party running many accounts each with its own approved
    agent (L652 a: wins for scarce-inventory or abuse-prone flows; L034). The contest
    is resolved per flow by this condition, not dissolved.

    - P11: wins never where agents are intended users (L652).

    Realizes: requires ALLOCATION.RULES.4 (one more adapter on the same core); ALLOCATION.GUARD.3
    (agents never decide access); ALLOCATION.GUARD.6 (agent retries absorbed by keys
    recorded with the effect); ALLOCATION.ACT.4 (agent actions recorded where history
    is written, both session role and claimed actor).

    Hand-offs: protocol and transport (PIG-WEB-INTERACTION.AGENT.1), discovery (.2),
    identity, delegation and agent-write marking (.3), approval designs and injection
    containment (.4, L646, L649), rate-limit partition and agent-shaped errors (.5,
    L651, L656, L657); scarce-goods flows closed to agents or requiring a human (.5).

    Maintainer decisions: MD-03 shapes the node (agents never connect to the database;
    the backend asserts the actor).

    Evidence gaps: L648 applied to agents the application runs or serves is inferred;
    the identify-then-limit synthesis of L652 is inferred.


    Lifted from the stack-neutral clause of PIG-WEB-INTERACTION.AGENT.4 in pig-web-defaults,
    wording kept; the verdict is that record''s, not re-judged here. Clause: irreversible
    or external effects need the owning user''s approval, on the application''s own
    page, checked by the effect''s writer.'
