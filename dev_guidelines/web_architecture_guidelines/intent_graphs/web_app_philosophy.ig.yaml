- uid: TRANSVERSE
  name: Transverse Concerns
  intent: Properties that span every tier are stated once and designed in across browser,
    backend, database and every other consumer of the data, not added per tier. Security
    is a set of verifiable properties with every threat owned by a tier the requester
    cannot modify; performance truth is field measurement; every contract is an explicit
    artifact that changes additively; the system is observed, tested and delivered
    as one whole; and it evolves through recorded decisions, small increments, few
    mature technologies and teams cut by capability.
  epistemic_state: 'known | gap: owns no row (roll-up)'
  constraints:
  - State each property that spans every tier once here and design it in across browser,
    backend, database and every other database consumer, not per tier.
  - Turn each cross-tier property into an automated check where one exists (interface
    drift gate, function-API catalogue diff, page budgets, module-boundary checks,
    tests at every tier).
  - Leave stack choices to the stack graph; tier branches realize these properties
    and do not restate them.
  design_notes: 'DECISION:

    the roll-up of its five children. Each property that spans every tier is stated
    once, here, and designed in across browser, backend, database and every other
    database consumer, not added per tier (L096). Each is turned into an automated
    check where one exists (fitness functions, L110): the interface drift gate (MD-02),
    the function-API catalogue diff (RECORD.3), page budgets, module-boundary checks,
    tests at every tier. Tier branches realize these properties and do not restate
    them; the stack choices sit in `pig-web-defaults` under PIG-WEB-TRANSVERSE.


    PLACEMENTS REALIZED:

    through its children (RULES.3, FORCES.3, FORCES.4, RECORD.3, ACT.4).


    REVIEW FIXES:

    children''s claims updated after M2, M3 (X5) and M4.'
