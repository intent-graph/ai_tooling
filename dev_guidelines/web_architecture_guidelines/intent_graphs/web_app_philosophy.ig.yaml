- uid: LOGIC
  name: Business Logic Tier
  intent: 'The backend is the trusted entry and the workflow tier of the application:
    it secures entry for every caller, enforces its share of the business logic in
    a core separable from transport and storage, runs as stateless disposable processes,
    and exposes one HTTP interface per backend. It does not decide invariants, multi-table
    operations, state transitions or per-user write rules decidable from the stored
    row (the database does), holds no cache beyond one request, and resolves no write
    conflict.'
  epistemic_state: 'known (roll-up): MD-05'
  constraints:
  - 'It secures entry: authenticates every caller, parses every input into precise
    types, enforces product policy deny by default on every request, and bounds what
    each caller can consume (LOGIC.SECURE).'
  - 'It enforces its share of the business logic in a core separable from transport
    and storage: workflow across operations, product policy not stored in the data,
    external calls; for every operation on stored data it calls the database function
    API through a port, one call per operation in its own transaction (LOGIC.ENFORCE;
    ACT.1).'
  - It runs as stateless, disposable processes of distinct types, with every durable
    fact (sessions included) in backing services (LOGIC.PROCESS).
  - 'It exposes one HTTP interface per backend with the protocol''s defined meanings:
    HTML hypermedia for browsers, a described resource-oriented structured-data interface
    and an agent adapter on the same core (LOGIC.EXPOSE).'
  - It does not decide invariants, multi-table operations, state transitions or per-user
    write rules decidable from the row (database, GUARD.2, ACT.1, GUARD.3); its checks
    of those are tested copies for early feedback (RULES.1). It holds no cache beyond
    one request (DERIVE.3) and resolves no write conflict (the database detects, GUARD.5).
  design_notes: 'Decision: the backend is the trusted entry and the workflow tier
    of the application.

    Positions:

    owns no row; roll-up of LOGIC.SECURE, LOGIC.ENFORCE, LOGIC.PROCESS, LOGIC.EXPOSE.
    One competing framing comes from the placements: the backend as the home of all
    business logic (application-first, L215, L066) against the backend as the workflow,
    policy and entry tier over a database that owns operations and transitions (L527,
    L528, L584, L596; MD-03).

    Forces: enforcement and security (the role''s purpose); changeability of product
    policy; scalability (stateless backends scale out, the database scales up, L615).

    Rejected:

    the backend as the authority for all business rules (P1 of ACT.1): rejected by
    MD-03; acceptable when a single backend is the only database consumer and the
    team''s SQL skill is low (ACT.1''s condition, L041, L215).

    Realizes: through its children GUARD.1, GUARD.3, GUARD.4, ACT.1, RULES.4, RECORD.2,
    GUARD.6; constrained by GUARD.4 and DERIVE.3.

    Skeleton note: the intent text of the link LOGIC.EXPOSE realizes ALLOCATION.RECORD.2
    (''when the placement routes them through the backend'') predates MD-03; under
    MD-03 the backend''s interface is the route for browsers and agents, and for an
    outside consumer that needs deploys independent of the database. The link stands.

    Source tensions narrowed to settled placements, recorded in the children: L063
    (LOGIC.ENFORCE), L066''s boundary (LOGIC.ENFORCE), strict client-held session
    state (LOGIC.EXPOSE.2).'
