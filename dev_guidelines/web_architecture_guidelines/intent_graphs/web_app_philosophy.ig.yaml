- uid: ALLOCATION.RULES.5
  name: Atomicity Ends at the Transaction
  intent: Atomicity exists only inside one database transaction. One business operation
    is one function call in its own transaction and a backend never wraps several
    calls; a step that must be atomic with another becomes a new function, and anything
    that spans an external system is reconciled, never committed in a distributed
    way.
  epistemic_state: 'known | unvalidated: the single-Postgres reading of Helland is
    inferred; the no-wrapping rule is inferred from L066, L584, L623'
  constraints:
  - One business operation is one function call in its own transaction; a backend
    never opens a transaction around several API calls.
  - A step that must be atomic with another is a new business operation, hence a new
    function.
  - A function may call other domains' published functions in the same transaction;
    direct access to another domain's tables is forbidden.
  - Workflows across operations advance through state columns and the outbox, with
    idempotent steps.
  - Anything spanning the database and an external system is reconciled (outbox, idempotency
    keys), never a distributed commit.
  - Keep aggregates addressable by key so that a later split stays possible.
  design_notes: 'Positions: P1 atomicity scoped to one entity, messages across entities
    (Helland, L477); P2 full cross-table transactions inside one Postgres (L477''s
    single-database reading, L125, L590).


    Decision: atomicity exists only inside one database transaction (L623). Within
    one Postgres, use cross-table transactions, which the function API makes one call
    (MD-03, L584). One business operation is one function call in its own transaction;
    a backend never opens a transaction around several API calls (R1-4; L066, L584).
    A step that must be atomic with another step is a new business operation, hence
    a new function; that function may call another domain''s published functions inside
    the same transaction, so composition across domains happens in the database (X3).
    What is forbidden across domains is direct access to another domain''s tables,
    not calling its published functions. Workflows across operations advance through
    state columns and the outbox (ACT.2), with idempotent steps (GUARD.6). Anything
    that spans the database and an external system is a request to reconcile (outbox,
    idempotency keys), never a distributed commit. Keep aggregates addressable by
    key so that a later split stays possible.


    Rejected: P1 as a constraint today; wins when a split of the data across nodes
    or services is planned (L477). Backend transactions wrapping several API calls:
    the boundary would have two owners (L066 against L584), and the backend would
    compose a multi-table write after all; wins never in the MD-03 default.


    Changed (R2): one operation, one call, one transaction; workflows through state
    columns and the outbox (R1-4).


    Changed (R3): cross-domain composition through published functions in the same
    transaction (X3).'
