- uid: TRANSVERSE.EVOLUTION.5
  name: Team-Shaped Structure
  intent: Teams are cross-functional around a capability, not organised by layer,
    and system structure is cut together with team structure. The database owner is
    a named role inside the team; when teams multiply each capability team owns its
    domain schema, its functions and its backend, one owner role holds what spans
    schemas, and cross-domain business operations are composed inside the database.
  epistemic_state: 'known | unvalidated: ownership per domain schema when teams multiply;
    cross-schema business functions owned by the workflow''s team'
  constraints:
  - Organise teams cross-functionally around a capability; never organise by layer
    or let a database team write other teams' business operations.
  - Hold the database owner as a named role inside the team, not a layer team.
  - When teams multiply, give each capability team its domain schema, functions and
    backend, with one named owner role for conventions, roles, grants and review of
    the function API catalogue diff.
  - Compose a cross-domain business operation inside the database by published functions
    (ALLOCATION.RULES.5), never by direct access to another domain's tables.
  - Give a cross-schema business function to the team that owns the workflow, reviewed
    by the database owner role.
  - Cut module and schema boundaries with the team boundaries.
  design_notes: "POSITIONS:\n  - P1 teams are not organised by layer; teams are cross-functional,\
    \ around a capability (L068).\n  - P2 structure copies communication; design team\
    \ and module structure together (L069).\n  - Read against L515 (MAINT): the function\
    \ API's implementation belongs to the database owner, who can change it without\
    \ redeploying consumers. A separate database team would be a team by layer.\n\n\
    FORCES:\nP1 and P2 serve delivery without hand-offs. L515 serves one owner for\
    \ the shared data's integrity (MD-03).\n\nDECISION:\nP1 and P2, with the database\
    \ owner as a role, not a layer team.\n  - Default context, one team: the team\
    \ is cross-functional, and the database owner is a named role inside it.\n  -\
    \ When teams multiply: each capability team owns its domain schema, its functions\
    \ and its backend (L513: schemas carry team ownership). One named owner role holds\
    \ what spans schemas: conventions, roles and grants, review of the function API's\
    \ catalogue diff (RECORD.3). Inferred.\n  - Cross-domain business operations:\
    \ one business operation is one database function call in its own transaction\
    \ (J1 R1-4); backends never compose several calls into one operation. A database\
    \ function may call another domain's published functions inside the same transaction,\
    \ so composition across domains happens in the database. What is forbidden across\
    \ domains is direct access to another domain's tables, not calling its published\
    \ functions (X3).\n  - Ownership of a cross-schema business function: the team\
    \ that owns the workflow, reviewed by the owner role (inferred). This multi-team\
    \ arrangement is the condition that refines RECORD.2's single \"database owner\"\
    ; in the default context (one team) the single owner of RECORD.2 holds.\n  - Module\
    \ and schema boundaries are cut with the team boundaries (L069; EVOLUTION.3).\n\
    \nREJECTED:\nteams by layer, a database team writing other teams' business operations\
    \ (L068). Acceptable never in this context; an owner role for conventions is not\
    \ a layer team.\n\nPLACEMENTS REALIZED:\nno skeleton link to a placement; rests\
    \ on RECORD.2 (the database owner of the function API, L515).\n\nREVIEW FIXES:\n\
    m5 (owner of cross-schema business functions named; the multi-team arrangement\
    \ marked as the condition that refines RECORD.2's single owner); B1 and X3 (composition\
    \ across domains happens in the database; only direct access to another domain's\
    \ tables is forbidden)."
