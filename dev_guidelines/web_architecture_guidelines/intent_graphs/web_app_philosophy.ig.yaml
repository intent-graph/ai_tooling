- uid: ALLOCATION.ACT.2
  name: Side Effects and Integrations
  intent: The database function that changes state also writes the intent of its side
    effects (an outbox row or staged job) in the same transaction, and a backend worker
    delivers it after commit to idempotent consumers. External calls are made by backends,
    never by the database, and no transaction stays open across a remote call.
  epistemic_state: 'known | unvalidated: the few-seconds in-request exception is inferred
    (L013, L589)'
  constraints:
  - 'Authority: backend (delivery, external calls), database (the staged intent, written
    by the operation)'
  - 'Copies: none'
  - 'Forbidden: third-party credentials in the browser (inferred); calls to external
    systems from inside the database; dual writes to the database and a broker; remote
    calls inside an open transaction; a foreign call in the request without its intent
    recorded first; post-commit hooks for foreign effects'
  - Write the intent in the operation's transaction; deliver after commit, idempotently.
  - Foreign mutations (a payment, a remote API write) run as atomic phases with recovery
    points and an idempotency key, in a worker behind a 202 response with a status
    resource.
  - 'In the request only when the user waits for the outcome in the same response
    and the call is expected to finish within a few seconds, under the request timeout:
    the database function records the intent first and commits; the request performs
    the call as one atomic phase and marks the row done; a worker completer picks
    up the row if the request dies.'
  - Post-commit hooks only for losable work that touches no foreign system.
  design_notes: "Positions: P1 backend effects staged in the database and delivered\
    \ after commit (L624, L409, L410); P2 post-commit hooks in the request process\
    \ (L600, L233); P3 atomic phases with recovery points (L589, L234, L246); P4 sagas\
    \ with compensation (L590, L480).\n\nForces: correctness (no lost or doubled effect)\
    \ against request latency.\n\nDecision: P1. The database function that performs\
    \ the state change writes the intent (outbox row or staged job) in the same transaction\
    \ (L624, L409); a backend worker delivers it after commit to idempotent consumers\
    \ (L410, L599). External calls are made by backends, never by the database. No\
    \ database transaction stays open across a remote call (L234).\n  - Foreign mutations\
    \ (a payment, a remote API write) run as atomic phases with recovery points and\
    \ an idempotency key passed to the foreign system (P3 as a complement: L589, L234,\
    \ L246), in a worker behind a 202 response with a status resource (ACT.3, L271,\
    \ L602).\n  - (superseded by MD-09) In the request only when the user must see\
    \ the outcome within a few seconds, under the request timeout (MD-09) (L013):\
    \ the database function still records the intent (outbox row) first and commits;\
    \ the request then performs the call as one atomic phase with the idempotency\
    \ key and marks the row done. If the request dies, the worker's completer picks\
    \ the row up (L589). (Revision 3: adopted from the logic unit's realization, M4.)\n\
    \nRejected: P2 (post-commit hook): acceptable only for losable work that touches\
    \ no foreign system, such as cache invalidation (L600); a losable notice to a\
    \ foreign system still goes through the outbox, which costs one row. P4: only\
    \ when one business transaction spans services with separate databases (L590,\
    \ L480).\n\nChanged (R1): intent written by the database function (MD-03).\n\n\
    (superseded by MD-09) Changed (R3): tension with ACT.3 resolved: foreign mutations\
    \ in a worker behind 202; in the request only for an outcome needed within a few\
    \ seconds, under the request timeout (MD-09), intent recorded first; post-commit\
    \ hooks only for losable work touching no foreign system (logic review M4).\n\n\
    (superseded by MD-09) Would move it: an outcome the user must see within a few\
    \ seconds, under the request timeout (MD-09) (in-request phase, intent recorded\
    \ first); a business transaction crossing services with their own databases (saga)\n\
    \nCorrected by MD-09 (re-audit under MD-08): the in-request exception applies\
    \ when the user waits for the outcome in the same response and the call is expected\
    \ to finish within a few seconds, under the request timeout; intent recorded first,\
    \ unchanged. Foreign mutations still default to a worker."
