- uid: LOGIC.PROCESS
  name: Processing Model
  intent: The backend runs as stateless, disposable processes of distinct types (web,
    worker) built once, with every durable fact, sessions included, in backing services.
    This is what lets processes be added, replaced and killed freely, and it protects
    the database from per-client connections and transactions.
  epistemic_state: 'known | unvalidated: L093''s reconciliation of stateless processes
    with long-lived connections (inferred by its slot)'
  constraints:
  - 'Each process is disposable and replaceable: durable state, sessions (GUARD.4)
    and shared caches (DERIVE.3) live in backing services; process memory caches nothing
    beyond one request.'
  - Several backends may share the database (MD-03); each backend is one deployable,
    not split into services without a measured need.
  - 'Distinct process types from one build: web processes serve requests; worker processes
    run deferred work and schedules, claim jobs from the queue the database holds
    (ACT.3), and return an unfinished job on SIGTERM.'
  - Each backend reaches the database as its own role, neither owner nor an all-powerful
    role, located and credentialled by configuration; a small pool per process; never
    a connection or an open transaction per connected client, and never a transaction
    held across a remote call (ACT.1, ACT.2).
  - A supervisor owns the process lifecycle; a reverse proxy faces the internet and
    enforces the outermost limits of LOGIC.SECURE; one concern per container.
  - 'Long-lived connections (real-time channels, agent streams) are the one tolerated
    per-process state: clients reconnect to any process and resync from the backing
    services.'
  - No file is readable before a clean scan.
  design_notes: 'Decision: adopt P1 to P9 together; no position contests another.

    Positions:

    (all owned rows, consensus unless stated):

    - P1 stateless, share-nothing processes; anything durable, sessions included,
    in a backing service; no sticky sessions; process memory or disk at most a single-request
    cache (L086).

    - P2 scale out by process type (web, worker) from one codebase, release and configuration,
    scaled independently under an external process manager (L087).

    - P3 disposability: start in seconds, stop gracefully on SIGTERM (stop accepting,
    finish in-flight work, return the current job to the queue), tolerate sudden death
    (L088).

    - P4 the database and every other backing service is an attached resource located
    and credentialled by configuration, swappable without code changes (L089).

    - P5 an external supervisor starts and restarts processes; no self-daemonizing
    or PID files (L090).

    - P6 the application server never faces the public internet; a reverse proxy or
    routing layer sits in front (L091).

    - P7 containers are disposable and hold one concern each (L092).

    - P8 a long-lived connection is disposable state held by one process; truth lives
    in backing services; clients reconnect to any process and resync (L093; majority,
    reconciliation inferred).

    - P9 never a database connection or transaction per connected client; client count
    independent of the small server-side pool (L094; inferred from sources).

    Forces: scalability and availability (P1-P3); security (P6, P4''s credentials
    in configuration); correctness under failure (P3, P8); database protection (P9).

    Rejected:

    - Sticky sessions and in-memory sessions: never in this context (L086, GUARD.4).

    - Process-memory caches shared beyond one request: never in multi-process production
    (DERIVE.3, L417).

    - Self-daemonizing processes, PID files: never (L090).

    - Application server facing the internet: acceptable only for local development
    (inferred from L091''s production framing).

    - Per-client database connections: never (L094).

    Realizes: constrains GUARD.4 (sessions in a backing service) and DERIVE.3 (no
    process cache beyond one request). Refined by PIG-WEB-TRANSVERSE.TOPOLOGY. Not
    linked in the skeleton, though the placements give this node work: ACT.2 (the
    backend delivers side effects from the outbox) and ACT.3 (workers execute deferred
    work); see the note in `result.md`.

    Placements that give this node work but are not linked in the skeleton: ACT.2
    (the backend delivers side effects from the outbox) and ACT.3 (workers execute
    deferred work). A realizes link from LOGIC.PROCESS to each would make the philosophy
    graph self-contained; proposed, not created.

    Refined by PIG-WEB-TRANSVERSE.TOPOLOGY.

    Evidence gap: L093 reconciliation of stateless processes with long-lived connections
    is inferred by its research slot; L094 inferred from sources.


    Lifted from the stack-neutral clause of PIG-WEB-LOGIC.PROCESS.5 in pig-web-defaults,
    wording kept; the verdict is that record''s, not re-judged here. Clause: no file
    readable before a clean scan.'
