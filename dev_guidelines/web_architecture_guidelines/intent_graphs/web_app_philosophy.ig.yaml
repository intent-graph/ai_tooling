- uid: TRANSVERSE.OPERABILITY.3
  name: Reproducible Delivery
  intent: One codebase per application is built once and the same immutable artifact
    is promoted through every environment, with configuration and secrets kept apart
    from code and environments as similar as possible. Schema and function-API changes
    are versioned migrations promoted through the same pipeline, and releases are
    small and frequent.
  epistemic_state: 'known | unvalidated: the database''s schema and function API as
    their own codebase; migrations before code within the release window'
  constraints:
  - Keep one codebase per application in version control with many deploys.
  - Separate build, release and run; build once, assets included, and promote the
    same immutable artifact everywhere.
  - Keep configuration apart from code and secrets out of source.
  - Run every environment on the same database engine and version as production, with
    no adapters hiding differences.
  - Keep schema and function-API changes as versioned migrations in version control,
    run once per release before the new code starts and additive across the release
    window.
  - Release in small, frequent increments.
  design_notes: "FORCES:\nreproducibility and safe change, at the cost of pipeline\
    \ and environment work. No force in the evidence opposes them.\n\nDECISION:\n\
    all five, extended to the database tier.\n  - Schema and function-API changes\
    \ are versioned migrations in version control (L519, MAINT), promoted through\
    \ the same environments as the code. They run once per release before the new\
    \ code starts (L405), additive across the release window (CONTRACTS: expand, migrate,\
    \ contract).\n  - Under MD-03 the database's schema and function API have one\
    \ owner (L515). Treating them as their own codebase, with the backends' typed\
    \ wrappers generated from its catalogue in CI (RECORD.3, TYPE_CHAIN), is inferred\
    \ from L100 (\"one codebase per app\").\n  - Every environment runs Postgres at\
    \ the production version (L103), which OPERABILITY.2's tests need.\n\nREJECTED:\n\
    rebuilding per environment, mutating a release, secrets in the repository, a different\
    \ engine in development or test, large infrequent releases. None wins in this\
    \ context.\n\nPLACEMENTS REALIZED:\nno skeleton link to a placement; rests on\
    \ RECORD.2 and RECORD.3 (generated wrappers, catalogue diff in CI)."
