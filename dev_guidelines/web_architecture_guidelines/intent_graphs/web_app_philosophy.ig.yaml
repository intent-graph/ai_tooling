- uid: INTERACTION.ENVIRONMENT.5
  name: Unreliable Network
  intent: 'The network is assumed unreliable, slow, limited and heterogeneous: any
    request may fail, time out, arrive late or arrive twice, so the core paths work
    as plain HTML requests, the client shows pending and failed states and keeps the
    user''s input, and it retries only what is idempotent or carries an idempotency
    key.'
  epistemic_state: 'known | unvalidated: fallacies list read through a T4 copy (L014);
    input kept across failure inferred'
  constraints:
  - Assume any request may fail, time out, arrive late or twice.
  - Core paths work as plain HTML requests, so a failed script does not remove them
    (ENVIRONMENT.1).
  - The client shows pending and failed states and keeps the user's input across a
    failure.
  - The client retries only what is idempotent or carries an idempotency key (GUARD.6).
  - Real-time channels reconnect and catch up by cursor (COLLABORATE).
  design_notes: 'Decides: how the client keeps core function when requests or scripts
    fail.

    Rows: L014 (resilience T1/T2 grounded; fallacies list via a T4 copy). Cited: L003,
    L294, GUARD.6.

    Positions: P1 assume the network unreliable, slow, limited and heterogeneous;
    fail gracefully and keep core function when requests or scripts fail (L014); P2
    assume success (rejected in L014). No other position was found.

    Forces: P1 serves the user''s ability to keep working and not lose input, at the
    cost of handling pending, failed and repeated requests; P2 serves only simplicity.

    Decision: P1. Input kept across failure is inferred from L014 with L294.

    Rejected: P2 wins never.

    Realizes: ALLOCATION.GUARD.6 (safe retries depend on the duplicate-suppression
    placement); link inferred, the skeleton draws none.

    Evidence gap: fallacies list read only through a T4 copy; the resilience half
    is T1/T2.'
