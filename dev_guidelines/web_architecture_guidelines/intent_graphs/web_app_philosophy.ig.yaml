- uid: LOGIC.EXPOSE.1
  name: Protocol Semantics
  intent: 'The interface means what HTTP says it means: safe methods never change
    state, mutations use methods with their defined idempotence, a successful form
    POST answers 303 to a GET page, and every error carries a stable machine-readable
    identifier separate from its human message. Crawlers, prefetchers, caches and
    retrying agents rely on these meanings.'
  epistemic_state: 'known | unvalidated: L053''s RFC 9110 wording (grounded via MDN
    and RFC 7231)'
  constraints:
  - Safe methods never change state; mutations use POST, PUT, PATCH or DELETE with
    their defined idempotence; a successful form POST answers 303 to a GET page.
  - Browser forms submit only GET and POST, so HTML mutations are POST, each one made
    safe to repeat by GUARD.6's layers (inferred from the HTML platform).
  - Status codes carry their defined meaning, the precondition codes included for
    concurrency (412, 428; GUARD.5).
  - Every error has a stable machine-readable identifier separate from its human message,
    in a standard problem format whose detail helps the caller correct the request.
  design_notes: 'Decision: the interface means what HTTP says it means.

    Positions:

    - P1 methods by their defined semantics: GET and HEAD safe, PUT and DELETE idempotent,
    POST for non-idempotent processing; never change state through GET or another
    safe method (L050).

    - P2 each error carries a stable machine-readable identifier (a `type` URI, `ErrorInfo.reason`,
    an error code) separate from the human-readable message (L052).

    - P3 303 redirects to a different resource that answers the request indirectly,
    fetched with GET (L053; RFC 9110 wording seen only in an extract).

    - Cited, owned elsewhere: retried operations idempotent by method or key (L051,
    GUARD.6); stale writes rejected with 412 and preconditions required with 428 (L260,
    GUARD.5); 303 after a successful POST (L582, GUARD.6); problem details with correction
    hints for agent tools (L656).

    - Competing practice in the field, without a ledger row defending it: tunnelling
    every operation through POST (RPC style); custom methods are admitted only where
    standard ones do not fit (L264, owned by PIG-WEB-LOGIC.EXPOSE.1).

    Forces: correctness and safety (crawlers, prefetchers, caches and retrying agents
    rely on safe and idempotent meanings); machine handling of errors by programs
    and agents; changeability (error ids survive message rewording).

    Rejected:

    - State change through GET (links that delete or confirm): never (L050).

    - Human-readable messages as the only error signal: never; programs and agents
    cannot branch on them (L052).

    - RPC-style tunnelling of every operation through POST in the JSON interface:
    rejected as the default; acceptable for an operation no standard method fits,
    as a custom method (L264).

    Realizes: GUARD.6 through LOGIC.EXPOSE (safe and idempotent semantics); GUARD.5
    (412 and 428 carry the version check to the caller).

    Competing practice in the field, without a ledger row defending it: tunnelling
    every operation through POST (RPC style); custom methods are admitted only where
    standard ones do not fit (L264).

    Evidence gap: L053''s RFC 9110 wording on 303 was seen only in a search-result
    extract; the verdict stands on MDN and RFC 7231.'
