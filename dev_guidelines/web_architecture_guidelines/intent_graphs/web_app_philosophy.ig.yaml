- uid: TRANSVERSE.EVOLUTION.2
  name: Incremental Change
  intent: The system grows in small increments with internal quality kept from the
    start, building no capability for presumed future features but investing in ease
    of change. Capacity has headroom for about ten times the current load, fit is
    made explicit as automated fitness checks, debt is taken only knowingly and recorded,
    and replacement happens at seams, never by big-bang rewrite.
  epistemic_state: 'known | unvalidated: features against capacity as the split between
    L108 and L111; L111 rests on one source'
  constraints:
  - Keep internal quality from the start.
  - Never build capabilities for presumed future features; invest in tests, refactoring
    and continuous delivery.
  - Design capacity headroom for about 10x the current load and plan reaching about
    100x as a rewrite of the part concerned, not anticipate it in code.
  - Make fit explicit as automated fitness functions, non-functional ones included.
  - Take debt only as prudent, deliberate and recorded.
  - Replace at seams, never by big-bang rewrite.
  design_notes: "POSITIONS:\n  - P1 internal quality from the start; it pays back\
    \ in weeks (L107).\n  - P2 no capabilities for presumed future features, but investment\
    \ in ease of change: tests, refactoring, continuous delivery (L108); build to\
    \ learn, since about a third of presumed features improve their metric (L112,\
    \ majority).\n  - P3 prudent, deliberate debt only knowingly (L109).\n  - P4 small\
    \ increments, with \"fit\" made explicit as automated fitness functions, non-functional\
    \ ones included (L110).\n  - P5 design for about 10x growth, plan a rewrite before\
    \ 100x; early parts may be sacrificial (L111, majority, one T2 source).\n\nFORCES:\n\
    P1, P2 and P4 serve changeability; P5 serves capacity headroom; P2 and P5 look\
    \ opposed: build nothing for the future, versus design for growth.\n\nDECISION:\n\
    all five, with P2 and P5 split by object.\n  - P2 governs features: none built\
    \ for presumed needs.\n  - P5 governs capacity: the design has headroom for about\
    \ 10x the current load; reaching about 100x is planned as a rewrite of the part\
    \ concerned, not anticipated in code. This is inferred: no source states the split;\
    \ L108 and L111 address different objects.\n  - Fit is automated (L110), and the\
    \ checks already named are its realizations: the interface drift gate (MD-02),\
    \ the function-API catalogue diff (RECORD.3), page budgets (L296), module-boundary\
    \ checks (L123), the drift guard on denormalised data (L533, MAINT).\n  - Debt\
    \ is taken only as prudent, deliberate debt, recorded (L109; EVOLUTION.1).\n \
    \ - Replacement happens at seams, never by big-bang rewrite (L119).\n\nREJECTED:\n\
    features built ahead of need (never, L108); trading quality for speed (rejected\
    \ by L107); reckless debt (L109); a big-bang rewrite (L119).\n\nPLACEMENTS REALIZED:\n\
    none in the skeleton."
