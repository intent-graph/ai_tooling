- uid: LOGIC.EXPOSE.2
  name: Self-Contained Requests
  intent: 'Every request is self-contained with respect to the process that serves
    it: it carries its credential and every parameter its use case needs, and anything
    it references is resolved from backing services, never from the memory of an instance.
    Server-held state is limited to the revocable session; client and server are coupled
    only through the interface contract.'
  epistemic_state: 'known | tension: L054''s strict reading (client-held session state)
    yields to GUARD.4 | unvalidated: workflow state as resource state (inferred from
    L661, L318, ACT.1)'
  constraints:
  - It carries its credential (the opaque session identifier or the agent's token,
    in a cookie or a header, never in the URL; short-lived, single-purpose, scope-limited
    signed URLs for file delivery are the one exception, with their lifetime and scope
    stated) and every parameter its use case needs; anything it references is resolved
    from backing services, never from the memory of the instance that served the previous
    request.
  - The server-held state is limited to identity and security state (the session,
    revocable; GUARD.4). Workflow progress is resource state in the database (state
    columns, ACT.1), addressed by identifiers in the request, never hidden in a session
    or a connection.
  - Client and server are coupled only through the interface contract (HTML links
    and forms, or the described structured-data interface), so either can change behind
    it.
  design_notes: 'Decision: every request is self-contained with respect to the process
    that serves it.

    Positions:

    - P1 each request carries all the information needed to understand it, so any
    server instance can serve it; the repeated per-request data is the price of scalability,
    visibility and recovery (L054).

    - P2 client and server stay separated so UI and server-side logic and storage
    evolve independently (L055).

    - Strict reading of P1 (Fielding, SRC-244): session state is kept entirely on
    the client, so the server holds no session.

    - Cited: server-held, revocable sessions behind an opaque cookie (GUARD.4; L022,
    L315); an agent surface with no hidden per-connection session, cross-call state
    as an explicit server-minted handle validated against the caller (L661); no application
    state in cookies, narrow sense kept by J1 (L318).

    Forces: scalability and recovery (any instance serves any request); security (revocation
    needs server-held state, L022); changeability (P2).

    Rejected:

    - Strict client-held session state with no server session (stateless signed tokens
    or cookie sessions): rejected because it cannot be revoked (L022), against the
    settled GUARD.4 placement; acceptable when no backend can hold sessions (GUARD.4''s
    moving condition).

    - Hidden server-side conversational or workflow state per session or per connection:
    never (L661; inferred for the browser case).

    Realizes: no direct link in the skeleton; follows GUARD.4 (session held by the
    backend, in a backing service) and is bounded by LOGIC.PROCESS (stateless processes).

    Tension recorded: L054''s strict reading (Fielding: session state kept entirely
    on the client) yields to the server-held revocable session of GUARD.4.

    No direct skeleton link; follows GUARD.4 and is bounded by LOGIC.PROCESS.'
