- uid: ALLOCATION.DERIVE.2
  name: Filtering, Sorting, Paging and Search
  intent: The database reduces many rows to the few a client needs, set-based, in
    one statement or read function, so only the result travels; it also owns the collation
    of every order it serves. The server enforces a maximum page size; structured-data
    and agent collections and any list over a large or growing set page by keyset
    behind an opaque continuation, while a human-facing HTML list over a bounded result
    may page by offset with page numbers.
  epistemic_state: 'known | gap: P3 unargued; browser-copy condition inferred | unvalidated:
    collation choice open (DATA)'
  constraints:
  - 'Authority: database, including collation'
  - 'Copies: the browser over rows already loaded, same collation'
  - 'Forbidden: loading full sets into a backend or browser to reduce them; queries
    in loops; a browser re-sort with another collation'
  - Filter, sort, aggregate and page in the database.
  - Enforce a maximum page size. Structured-data and agent collections, and any list
    over a large or growing set, page by keyset behind an opaque continuation. A human-facing
    HTML list over a bounded result may page by offset with page numbers; offset never
    for deep pages or bulk work.
  - The database owns the collation of every order it serves; a browser re-sort over
    rows already loaded uses the same collation or none.
  - Reads that need no domain behaviour may be plain queries.
  design_notes: 'Positions: P1 with the data, set-based (L613, L614); P2 reads bypass
    the domain model (L237); P3 in the backend or browser on a loaded set (no row;
    skeleton gap 2).


    Forces: performance and latency against scalability (L615 exempts reductions that
    return small results).


    (superseded by MD-09) Decision: the database reduces many rows to the few a client
    needs, set-based, in one statement or read function; only the result travels (L613,
    L614). The server enforces a maximum page size and pages by keyset behind an opaque
    continuation (L265, L266, L541). Reads that need no domain behaviour may be plain
    queries (P2, L237; L516). Search follows the same placement and stays deferred.
    Collation (F11): the database owns the collation of every order it serves, declared
    per column or per query; which collation is open, under DATA.


    Gap handling (P3): no row argues for it; rejected as an authority on L613, L614,
    L615. Kept only as a copy: the browser may re-sort or filter rows it already holds,
    for instant feedback, with the same locale as the database''s collation or not
    at all (F11), never deciding which rows exist beyond them. This condition is inferred.


    Changed (R1): collation owned here (F11).


    Would move it: data volume against result size; write load


    Corrected by MD-09 (re-audit under MD-08): keyset is required where it is grounded
    (structured-data and agent collections, large or growing sets, bulk work); offset
    with page numbers is acceptable for a human HTML list over a bounded result. Rejected:
    keyset on every surface: wins for any list over a large or growing set. Inferred;
    no ledger row argues either method for HTML lists.'
