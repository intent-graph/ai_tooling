- uid: TRANSVERSE.EVOLUTION.1
  name: Explicit Decisions
  intent: The decisions that are costly to get wrong are identified early, chosen
    from the properties they must induce, decided when enough is known, and recorded
    with their forces, alternatives and the condition that would reverse them. Later
    changes are tested against the constraints the decision set, automatically where
    a check exists.
  epistemic_state: known
  constraints:
  - Identify the costly decisions early and record each with its forces, alternatives
    and the condition that would reverse it.
  - Decide each hard-to-reverse choice when enough is known, not up front for every
    one.
  - Record per-project decisions the same way, including the interface origin direction
    with its criteria and any adoption of row-level security with its conditions.
  - Test changes against the constraints the decision set, automatically where a check
    exists.
  design_notes: "POSITIONS:\n  - P1 architecture is the shared understanding of the\
    \ decisions that are costly to get wrong; design effort goes there (L105).\n \
    \ - P2 choose the properties first, then the constraints that induce them, and\
    \ test proposed changes against those constraints (L106).\n  - At stack level:\
    \ one short decision record per architecturally significant decision, never edited\
    \ once accepted, only superseded (L129 to L133, owned by PIG-WEB-TRANSVERSE.EVOLUTION.3).\n\
    \  - Read with L073 (EVOLUTION.3): defer hard-to-reverse decisions until the product\
    \ is understood.\n\nFORCES:\nP1 and P2 serve getting the irreversible parts right;\
    \ the cost is writing them down. L073 serves not fixing what is not yet known.\n\
    \nDECISION:\nP1 and P2, recorded, with their constraints checked automatically\
    \ where possible.\n  - The costly decisions are named early. The allocation placements\
    \ are the first of them, decided from the forces (target hierarchy).\n  - Each\
    \ is decided when enough is known (L073) and recorded with its forces, its alternatives\
    \ and the condition that would reverse it: the same form as the judge record and\
    \ as J1's \"would move it\".\n  - The per-project decisions the maintainer requires\
    \ are recorded the same way: the interface origin direction with its criteria\
    \ (MD-02); the adoption of row-level security under its three conditions (MD-01).\n\
    \  - Changes are tested against the constraints the decision set, automatically\
    \ where a check exists (L106, L110).\n  - Identifying a decision early is not\
    \ deciding it early: L073 governs the timing, P1 the attention.\n\nREJECTED:\n\
    decisions left implicit in code (against L105); deciding every hard-to-reverse\
    \ choice up front (against L073). Neither wins in this context.\n\nPLACEMENTS\
    \ REALIZED:\nno skeleton link to a placement; the allocation placements are its\
    \ first application."
