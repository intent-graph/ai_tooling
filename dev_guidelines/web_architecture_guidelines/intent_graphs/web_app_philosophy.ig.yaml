- uid: ALLOCATION
  name: Allocation of Responsibilities
  intent: 'Every responsibility of the application is placed before any tier is designed:
    its placement record names the one tier that is its authority, the copies other
    tiers may hold and why, the tiers forbidden to hold it, and the context that would
    move it. By default the database is the authority for the truth of stored data
    and for everything that must hold whoever touches it, each backend for product
    policy not stored in the data, its users'' identity and its workflows, and browsers
    and agent clients for nothing durable.'
  epistemic_state: 'known | unvalidated: the record format is a synthesis (L610 inferred)'
  constraints:
  - 'Every responsibility has one placement record: authority, permitted copies with
    their purpose, forbidden tiers, moving context.'
  - Decide placements before designing any tier; tier branches realize a placement
    and never re-decide it.
  - Exactly one tier is the authority for each responsibility; every other tier holds
    at most a copy.
  - Browsers and agent clients decide nothing durable.
  design_notes: "Positions: one. L610: each placement records its authority, permitted\
    \ copies and forbidden tiers, because a rule can legitimately exist in three tiers\
    \ (feedback, decision, last guard) and only one decides.\n\nForces: correctness\
    \ (one decider), changeability (the record makes the decision reviewable).\n\n\
    Decision: every responsibility gets one placement record (authority, permitted\
    \ copies with their purpose, forbidden tiers, moving context), decided before\
    \ any tier is designed. Roll-up of the 26 placements for the default context:\n\
    \  - Postgres is the authority for the truth of stored data and for everything\
    \ that must hold whoever touches it: system of record, invariants, multi-table\
    \ operations and state transitions behind the function API (one call, one transaction),\
    \ per-user write rules decidable from the row and the actor, per-role privileges,\
    \ concurrency detection, derived data, audit with role and claimed actor (MD-03;\
    \ R1-1, R1-3, R1-4).\n  - Each backend is the authority for decisions about its\
    \ users and its workflow: validation at entry, authorization for product policy\
    \ not stored in the data and for identity (MD-01; per-user write rules decidable\
    \ from the row belong to the writer functions, R1-1), sessions, orchestration\
    \ across operations, side-effect delivery, deferred work, HTML rendering.\n  -\
    \ Browsers and agent clients are the authority for nothing durable: they hold\
    \ the view, ephemeral state and copies for feedback and latency.\n\nRejected:\
    \ none (no competing position).\n\nChanged (R1): the database half widened to\
    \ operations, privileges and audit (MD-03).\n\nChanged (R2): per-user write rules\
    \ moved to the database half (R1-1)."
