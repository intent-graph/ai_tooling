- uid: TRANSVERSE.EVOLUTION.3
  name: Deployable Boundaries
  intent: 'One deployable per backend first: several backends may share the database,
    but a backend is split into services only when a team needs independent releases,
    the boundary has proven stable and the distribution premium is budgeted. Bounded
    contexts map to domain schemas in the shared database, and any new deployable
    reaches data through the function API with its own role, never holding a second
    system of record.'
  epistemic_state: 'known | unvalidated: bounded contexts as domain schemas in the
    shared database; a later split moves no data | conflict: L044 and L116 (separate
    data per application or service) against MD-03, recorded by J1 and realized here'
  constraints:
  - Make each backend one deployable, modular by business concept; never split it
    into services without a measured need.
  - Split off a further deployable only when a team needs independent releases, the
    boundary has proven stable and the distribution premium is budgeted.
  - Map bounded contexts to domain schemas in the shared database, each with its own
    functions and roles.
  - Give a new deployable access to data only through the function API with its own
    role; never write tables beside it or hold a second system of record.
  design_notes: "POSITIONS:\n  - P1 one deployable first. Defer hard-to-reverse boundaries\
    \ (L073), place service boundaries only once the domain is understood (L075),\
    \ avoid distribution when possible (L076), integrate in a small team (L078). At\
    \ stack level: L113 to L116, the four-source default.\n  - P2 services from the\
    \ start when the domain is well known, the system needs distribution, and the\
    \ parts can develop and deploy independently (L117, Tilkov; contested).\n  - P3\
    \ the goal of a split is independent deployability, not the count; start with\
    \ one or two (L080); budget the distribution premium first (L074).\n  - P4 bounded\
    \ contexts with explicit mappings, not one unified model (L077).\n  - P5 all advice\
    \ here is tentative: the evidence is anecdotal, and a modular monolith does not\
    \ make extraction free (L079).\n  - Read against RECORD.1 and RECORD.2 (J1, MD-03):\
    \ one shared system of record behind a function API. Also L044 (one application\
    \ owns its database), rejected by J1 in this context, and L116 (keep separate\
    \ data schemas for likely future services).\n\nFORCES:\nP1 serves changeability\
    \ while the domain is unknown and saves the distribution premium; P2 serves team\
    \ independence when the domain is known; P3 and P4 serve keeping each split meaningful.\n\
    \nDECISION:\nP1 by default, P3 and P4 for any split, and the data seam given by\
    \ the allocation.\n  - Several backends may share the database (MD-03). Each backend\
    \ is one deployable, modular by business concept (stack level); it is not split\
    \ into services without a measured need (X5). MD-03's several backends do not\
    \ by themselves license splitting a backend. A further deployable is split off\
    \ only when a team needs independent releases, the boundary has proven stable,\
    \ and the distribution premium is budgeted (L080, L074, L114).\n  - Because the\
    \ data seam is already the function API, a later split of a backend does not move\
    \ data. Only deploy independence and the distribution premium of L074 remain to\
    \ be weighed, so a split costs less than the research rows assume (inferred; L074\
    \ and L076 price a data split this context does not have).\n  - Bounded contexts\
    \ (L077) map to domain schemas in the shared database, each with its own functions\
    \ and roles (L513, MAINT: schemas are business-domain namespaces with ownership\
    \ and permissions). This is how L116's \"separate data schemas for likely future\
    \ services\" is realized under MD-03; inferred.\n  - A new deployable reaches\
    \ the data through the function API with its own role (RECORD.2). It never writes\
    \ tables beside it and never holds a second system of record (RECORD.1 forbids\
    \ a consumer writing two stores).\n  - The confidence of this verdict is bounded\
    \ by L079: anecdotal evidence.\n\nREJECTED:\n  - P2 services-first: acceptable\
    \ when all of these hold: the domain is well known (ideally a second version),\
    \ the size requires distribution, the parts develop and deploy independently,\
    \ and the team already runs distributed systems (L117, L115, L116).\n  - A database\
    \ per service: rejected in this context by RECORD.2 and MD-03. It wins only under\
    \ J1's \"would move it\": a consumer outside the team that needs independent deploys\
    \ gets that team's service interface.\n\nPLACEMENTS REALIZED:\nno skeleton link\
    \ to a placement; rests on RECORD.1 and RECORD.2 (MD-03).\n\nREVIEW FIXES:\nM3\
    \ and X5 (\"one backend deployable first\" replaced by: several backends may share\
    \ the database, each backend one deployable, not split into services without a\
    \ measured need; the lower cost of a later split weighed, inferred)."
