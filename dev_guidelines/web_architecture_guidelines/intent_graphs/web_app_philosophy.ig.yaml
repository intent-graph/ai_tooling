- uid: DATA.GUARD
  name: Guarded Consistency
  intent: 'The database keeps data valid and consistent under concurrent and partial
    change: every rule a declarative constraint can express is declared, because only
    declarative constraints bind every writer; the remaining rules are checked inside
    one transaction under an isolation level or lock that makes the check correct.
    Concurrency conflicts are detected by the store, and the consistency model is
    stated per operation.'
  epistemic_state: 'known: MD-05 | conflict: against L471 (MAINT) on optional CHECK
    constraints, inherited from J1 GUARD.2 | unvalidated: the stack form of fencing
    (L476) and "no deciding read on a replica" are inferred'
  constraints:
  - 'Declare every rule a declarative constraint can express: NOT NULL unless absence
    is a meaningful state; row-local CHECK paired with NOT NULL; foreign keys; unique,
    partial unique and exclusion constraints for cross-row rules; domains for value
    types used in several places. Constraints are named, so a violation maps to a
    stable error. Required, not optional.'
  - Rules no constraint can express (other multi-row rules, legal transitions, dependencies
    lost by a Boyce-Codd decomposition when no declarative form exists) are checked
    in the writer function or a constraint trigger, under Serializable isolation with
    retry or after locking the governing row; the function or trigger asserts the
    isolation it needs, set per consumer role. The default isolation level is the
    stack's choice.
  - Each business operation is one function call in its own transaction (ALLOCATION.RULES.5).
  - Concurrent change is detected inside the writer function, which takes the expected
    version as a parameter; no transaction or lock is held across user think time.
  - 'Mutual exclusion that guards correctness is enforced by the store: row version,
    unique constraint or row lock inside the transaction; a lease is checked by the
    writer function as a fencing token. A lock outside the database is acceptable
    only to save duplicate work.'
  - 'The consistency model is stated per operation: which isolation, whether it reads
    the primary or a replica, and what staleness it accepts. A check that decides
    a write never reads a replica. A datastore is never labelled "CP" or "AP".'
  - 'Access guarding: each consumer has its own role, neither owner nor an all-powerful
    role; grants bound which functions it may call and which tables and columns it
    may read; state columns are revoked from direct update so the writer function
    is the only path. Row-level security is not a default (MD-01).'
  design_notes: 'Question: how the database keeps data valid and consistent under
    concurrent and partial change.

    Positions: P1 model data with the most precise structure available so illegal
    states cannot be represented: NOT NULL, CHECK, foreign keys and domains in the
    database, precise types at the boundary (L485; SRC-338 T2, SRC-134 T1); placement:
    ALLOCATION.GUARD.2 requires declarative constraints (L040, L473, L471 maintainer
    doctrine). P2 application-side validation as the guard (common practice, L040''s
    note; rejected by J1 in GUARD.2: check-then-write is correct only under serializable
    isolation, L473). P3 state the consistency model per operation (L043; SRC-232
    T2) against P3'' classifying the datastore as "CP" or "AP" (the practice L043
    rejects). P4 a lock that guards correctness carries a fencing token the storage
    checks; in this stack the row version or a unique constraint is the fencing, preferred
    to an external lock service (L476; SRC-346 T2); against P4'' a lease-based lock
    service without fencing; P4'''' a best-effort lock used only to save duplicate
    work (L476 allows it).

    Forces: P1, P3, P4 serve integrity under concurrency and partial failure. P2 serves
    changeability (rules tested in memory, L042) and loses integrity whenever a second
    writer or a concurrent request exists (L473), which MD-03 makes the default. P3''
    serves brevity and hides latency and multi-object transactions (L043). P4'' serves
    availability of the lock and loses correctness when a paused holder acts after
    its lease expired (L476). P4'''' serves efficiency only.

    Decision: six ways, each the realization of a J1 verdict (GUARD.2 for constraints
    and procedural rules; RULES.5 and ACT.1 for one transaction per operation, L584
    doctrine, MD-03, cross-branch resolution X3: one business operation is one database
    function call in its own transaction, J1 R1-4, and composition across domains
    happens in the database; GUARD.5 and L475 for version detection and no lock across
    think time; L476 for fencing by the store; L043 for the consistency model per
    operation). Reports on a replica accept snapshot anomalies (L573, via GUARD.2);
    "no deciding read on a replica" is inferred from L573. Only declarative constraints
    bind every writer, owner-run migrations and human-run jobs included (J1, GUARD.2);
    constraints are named so violations map to stable errors (L495).

    Access guarding (realization of GUARD.3''s database layer; not in the node''s
    question as worded, see gap 1): realized in the defaults graph''s roles and privileges
    node (J6). MD-01 and MD-03 apply.

    decided by MD-05 (changed after review, B1, X1): decided by MD-05, read visibility
    of rows with per-user rules when several backends share the database ("a draft
    is visible only to its author"; J1''s Q1). Not settled here. The graph records
    J1''s stated default word for word: A provisional, with one written specification
    per rule and a shared denial suite; B acceptable when a per-user read rule must
    hold for two or more backends. That is: each backend filters these reads from
    one shared written specification, with a shared denial-test suite every backend
    runs; database read functions that receive the verified actor (verified by the
    backend, still a claim to the database, J1 R1-3) are acceptable when a per-user
    read rule must hold for two or more backends, which under MD-03 can easily be
    the case. The database''s part otherwise is the per-role grants. Consequence:
    Before the maintainer answered, the reporting role gets no SELECT on comment content
    or narrower-audience comments, the operator role sees every row, and any other
    role that may SELECT the base tables sees every row unless its own role is restricted.
    Where B''s condition holds, the filter lives in read functions of the database
    function API and DATA.GUARD''s clause then reads "read functions filter by the
    acting user" for those tables.

    Maintainer doctrine: L471 adopted on authority (database enforcement is the source
    of truth; application validation an optimisation). J1''s partial verdict against
    L471 ("triggers and CHECK constraints optional as defence in depth") is inherited
    and realized here; no new verdict.

    Rejected: P2 for any rule that must hold for every writer: never (GUARD.2); application
