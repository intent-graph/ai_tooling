- uid: DATA
  name: Durable Data
  intent: 'The database is the system of record and holds everything that must hold
    whoever touches the data: it organizes facts so each is stored once, guards them
    under concurrent and partial change, keeps structure correct over time, derives
    instead of storing, and offers every consumer one function API as the contract
    to the data. Several backends and other consumers (reporting, admin consoles,
    scripts) may share it, so what must hold for every consumer lives in the database,
    not in any one backend.'
  epistemic_state: 'known | gap: data lifecycle (retention) has no principle row'
  constraints:
  - 'Organize: each fact stored once, in tables normalized at least to third normal
    form (DATA.ORGANIZE).'
  - 'Guard: every rule a declarative constraint can express is declared; the rest
    is checked by writer functions under an isolation level or lock that makes the
    check correct (DATA.GUARD).'
  - 'Maintain: structure changes only through versioned migrations applied by automation;
    incompatible changes go expand, migrate, contract; the live database is the truth
    for structure (DATA.MAINTAIN).'
  - 'Derive: store the minimum and compute the rest; every stored derived value is
    a copy with a stated sync and staleness (DATA.DERIVE).'
  - 'Offer: one function API is the contract every consumer calls, one business operation
    per call (DATA.INTERFACE).'
  design_notes: 'Roll-up of its four children; owns no ledger row, so it has no positions
    of its own. Judged under the work J1 and MD-03 give the database (default context:
    several consumers share the database; operations that change several tables as
    one business operation are the database''s responsibility; everything that must
    hold whoever touches the data lives in the database).

    Realizes, through its children: ALLOCATION.RECORD.1, ALLOCATION.RECORD.3, ALLOCATION.GUARD.2,
    ALLOCATION.GUARD.5, ALLOCATION.DERIVE.1.

    Rejected: none at this level; each child records its own.

    Gap 1 (structure): under MD-03 no philosophy DATA node realizes ALLOCATION.RECORD.2
    (the database function API as default contract), the database share of ALLOCATION.ACT.1
    (each business operation one function call; one writer function per state column,
    L584, L596), the per-role layer of ALLOCATION.GUARD.3, or ALLOCATION.ACT.4 (audit).
    The target hierarchy places the database function API under DATA; the skeleton
    has it only in the defaults graph (database interface node), which has no philosophy
    counterpart. Proposal to the skeleton owner, not applied: a philosophy node DATA.INTERFACE
    (realizes RECORD.2 and the database share of ACT.1; refined by the defaults graph''s
    database interface node), judged as a realization of J1''s verdicts because it
    would own no row.

    Gap 3: data lifecycle (retention, deletion, recovery) has no principle-level row;
    it exists only in the defaults graph (maintenance nodes for deletion, retention,
    history, bulk jobs, recovery).'
