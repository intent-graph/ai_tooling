- uid: LOGIC.SECURE
  name: Secured Entry
  intent: 'The backend is the one gate every caller passes, human or agent, and decides
    nothing on the caller''s word: it authenticates every caller, authorizes every
    request deny by default, parses all input into precise types at entry, bounds
    consumption at two depths, and requires a second factor where the account or the
    operation warrants it. This holds because every client can be hostile or wrong,
    and an agent as a principal makes loops and retries likelier.'
  epistemic_state: 'known: MD-05 | unvalidated: MFA scope by account privilege and
    by the project''s risk level (inferred from L033 and TRANSVERSE.SECURITY)'
  constraints:
  - 'Authenticate every caller, then authorize every request. Humans by the server-held
    session of GUARD.4; agents by their own short-lived, revocable tokens, accepted
    only when issued for this server (audience check), never forwarded downstream
    (GUARD.4). An ID token proves a login to the client and is never accepted as an
    API credential. Authorization is a separate, central mechanism, deny by default,
    object level, applied to every request from every client, for what the backend
    owns: product policy not stored in the data and identity (GUARD.3).'
  - Assert the actor, do not decide for the database. For every call into the function
    API the backend sets the acting user it has verified (scoped to the transaction,
    from the verified identity, never a client-supplied id; GUARD.3); per-user write
    rules decidable from the row are decided by the writer function, and the backend's
    identical check is a generated or tested copy for early feedback (GUARD.3, RULES.1).
  - 'Treat all input as untrusted and parse it at entry into the most precise type,
    once per process boundary (GUARD.1): request bodies, query parameters, headers,
    uploaded files, payloads read back from queues, and anything a model or agent
    produced. Client hints, tool annotations and claimed identities are never enforcement.'
  - 'Bound consumption at two depths: identity-blind size, rate, read-rate and time
    limits at the outermost layer, answering 413 or 408 there, with the client''s
    own size check as a feedback copy; identity-aware limits in the backend, per operation
    and per business need, with tighter limits on operations that cost money, trigger
    third parties or are expensive for agents to loop on.'
  - 'Protect harmful automation by flow, not by client kind: name the flows whose
    automation harms the business (sign-up, purchase, booking, referral) and protect
    each specifically; no blanket bot blocking, because agents are intended users
    in this context.'
  - 'Defend logins in layers: MFA first, then breached-password checks, then device
    signals and challenges known to be spoofable; never IP blocking alone. Offer MFA
    on every human account, phishing-resistant authenticators (passkeys, WebAuthn)
    preferred. Require it on privileged accounts (operator, owner, administrator)
    and before sensitive operations (step-up). Whether it is required on every account
    follows the security level the project chooses by risk (TRANSVERSE.SECURITY).'
  - 'Per-user read visibility (MD-05): simple reads that carry no logic are written
    by the backend directly; sensitive, complex, high-impact or shared reads, per-user
    visibility rules included, go through database functions that receive the verified
    actor (ALLOCATION.GUARD.3).'
  - Server-side fetches of client- or agent-named URLs cannot reach private, loopback
    or link-local addresses.
  design_notes: 'Decision: the backend is the one gate every caller passes, human
    or agent, and decides nothing on the caller''s word.

    Positions:

    - P1 authentication is not authorization; an OpenID Connect ID token is for the
    client, never an access credential to APIs (L021).

    - P2 every client-supplied part of an upload is untrusted: allowlisted extensions,
    actual signature checked, stored name generated by the server (L023).

    - P3 bound every resource a client can make the server consume (rate, payload
    size, memory, concurrency, time, third-party spend), each limit tuned to the operation
    and the business need; agents as principals make loops and retries likelier, so
    expensive operations get their own limits (L031).

    - P4 maximum body size, minimum read rate and read timeouts enforced at the outermost
    layer with 413 or 408, plus a size check in the client because browsers show the
    proxy''s error poorly (L032).

    - P5 credential stuffing defended in layers: MFA first, breached-password checks,
    device fingerprinting and CAPTCHA understood as spoofable, never IP blocking alone
    (L033).

    - P6 identify the business flows whose automation harms the business and protect
    those specifically, machine-to-machine APIs included (L034); cited, owned by INTERACTION.AGENT:
    do not apply blanket bot blocking where agents are intended users (L652).

    - Placement rows cited, owned elsewhere: deny by default (L020); one central mechanism
    on every request (L305); object-level rules (L306); model output is untrusted
    input, never an authorization decision (L644); client hints are not enforcement
    (L650); a server accepts only tokens issued for it and never forwards a client''s
    token (L640); parse once at each entry (L484, L612).

    Forces: security (all positions); availability and cost control (P3, P4); usability
    of login (P5''s MFA) and openness to agents (P6 against blanket blocking).

    Rejected:

    - Accepting ID tokens, forwarded tokens or client-declared identity as API credentials:
    never (L021, L640, L650).

    - Validation or authorization decided in the browser, the agent client or model
    output: never (GUARD.1, GUARD.3; L019, L644).

    - IP blocking as the only login defence, and IP alone as the limiting key: never
    (L033).

    - Blanket bot blocking: acceptable when no automated client is an intended user
    of the interface concerned (inverse of L652''s condition; inferred).

    - (superseded by MD-09) MFA optional for human accounts: acceptable when the application''s
    audience cannot practically be required to use a second factor; the other layers
    of L033 then carry the defence (condition inferred, not in the ledger row).

    - Limits only at the edge, or only in the application: each misses what the other
    sees (identity-blind volume against per-identity and per-operation cost; L031,
    L032; layering inferred, its stack form owned by PIG-WEB-LOGIC.SECURE.6).

    Realizes: GUARD.1 (the backend''s parsing and request-level meaning); GUARD.3
    (product policy and identity; tested copy of per-user write rules; actor asserted,
    not decided); GUARD.4 (sessions and credentials held by the backend).

    Maintainer decision cited: MD-01 (row-level security is not a default; stays excluded
    here).

    Inherited open clause (X1): per-user read visibility, the maintainer''s question
    Q1 of the allocation judge, is not re-asked here; the former recorded default
    (superseded) and J1''s fallback are in the constraints and the state.

    (superseded by MD-09) Evidence gap: MFA required by default applies the max rule
    to L033 (inferred); the condition for ''optional'' is inferred, not in the ledger
    row.


    Lifted from the stack-neutral clause of PIG-WEB-LOGIC.SECURE.7 in pig-web-defaults,
    wording kept; the verdict is that record''s, not re-judged here. Clause: server-side
    fetches cannot reach internal addresses.


    Corrected by MD-09 (re-audit under MD-08): MFA is offered on every human account
    and required on privileged accounts and at step-up; universal MFA follows the
    project''s risk level. Rejected: MFA required on every human account: acceptable
    when the project''s chosen risk level requires it (a high security level) or when
    the exposure of one account is severe. MFA optional on privileged accounts: never.
    The earlier ground (the most demanding form of L033''s ordering) is replaced by
    MD-08: the best practice for the purpose, not the strictest.'
