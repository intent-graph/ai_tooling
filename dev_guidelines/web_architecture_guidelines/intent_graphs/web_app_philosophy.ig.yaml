- uid: ALLOCATION.GUARD.5
  name: Concurrency Control and Conflict Resolution
  intent: 'The database detects concurrent changes inside the writer function, and
    the conflict policy follows the data shape: optimistic versions for discrete fields
    edited by users, last-writer-wins per property for toggles, leases for frequent
    costly conflicts, a text engine for long collaborative text.'
  epistemic_state: known
  constraints:
  - 'Authority: database (detection in the writer function), with the backend carrying
    the version through its contract'
  - 'Copies: the browser holds the version it read'
  - 'Forbidden: browser or agent resolving conflicts; locks across requests'
  - Detect with constraints, isolation, row locks and version checks inside one short
    transaction in the writer function; isolation level per GUARD.2.
  - 'Discrete fields edited by users: optimistic version; a stale write is rejected
    (412), and the condition is required (428) where a lost update matters; the writer
    function takes the expected version as a parameter.'
  - 'Toggles, status, assignment, ordering: per-property last-writer-wins is acceptable.'
  - 'Frequent conflicts with costly lost work: a lease with owner and expiry, checked
    by the writer function.'
  - 'Long collaborative text: a text engine with the server as central authority.'
  - Never silent whole-record last-writer-wins; never check-then-write without serializable
    isolation or a lock.
  design_notes: "Positions: P1 the database decides (L628, L473, L568); P2 optimistic\
    \ version across requests (L475, L260); P3 pessimistic checkout (L570); P4 silent\
    \ last-writer-wins per property (L674); P5 merge on the client (L677, L302).\n\
    \nForces: correctness (no lost update) against latency and user effort.\n\nDecision:\
    \ the database detects; the conflict policy follows the data shape (L678).\n \
    \ - Detection: constraints, isolation, row locks and version checks inside one\
    \ short transaction, inside the writer function (L628, L473, L475; MD-03). Isolation\
    \ level per GUARD.2 (DATA judge).\n  - Discrete fields edited by users (default):\
    \ optimistic version; ETag and If-Match; a stale write is rejected (412); the\
    \ condition is required (428) where a lost update matters (L475, L260). The writer\
    \ function takes the expected version as a parameter.\n  - Toggles, status, assignment,\
    \ ordering: per-property last-writer-wins is acceptable (L674).\n  - Frequent\
    \ conflicts with costly lost work: a lease with owner and expiry, checked by the\
    \ writer function (L570).\n  - Long collaborative text: a text engine with the\
    \ server as central authority (L677, L679).\n  - Never a transaction or lock held\
    \ across user think time (L475).\n\nRejected: silent whole-record last-writer-wins;\
    \ wins never (L674). P5: wins with local-first data or offline and peer-to-peer\
    \ text (L677). Check-then-write without serializable isolation or a lock; wins\
    \ never (L628).\n\nChanged (R1): detection inside the writer function (MD-03);\
    \ isolation handed to DATA (F4).\n\nWould move it: conflict rate, data shape,\
    \ edit length, offline use"
