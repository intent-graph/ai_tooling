- uid: ALLOCATION.RECORD.2
  name: Data Access Interface
  intent: 'Every consumer reaches the data through a database function API owned by
    the database owner, with one role per consumer: writes go through functions, simple
    reads may query base tables under grants, and browsers and agents never connect
    to the database. The interface is a published contract that evolves additively.'
