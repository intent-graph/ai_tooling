- uid: LOGIC.EXPOSE.3
  name: Hypermedia Controls
  intent: Hypermedia where the client is a browser, a described level-2 resource interface
    where the client is a program or an agent. In the browser the rendered HTML is
    the contract and links and forms drive every transition; for programs and agents
    the machine-readable description kept in sync by process is the contract, and
    the interface is called resource-oriented HTTP, not REST.
  epistemic_state: 'known: browser half (PRESENT.1, L059) | unvalidated: JSON half
    rests on MD-02 and L634 | gap: no row on hypermedia controls for agent clients
    (candidate: server-computed allowed actions, for INTERACTION.AGENT)'
  constraints:
  - 'Browser: the HTML the server renders is the contract: links and forms drive every
    transition, and the server renders only the controls the user may use. The control
    is a cosmetic copy; the request is re-authorized on arrival (GUARD.3, RULES.1).
    This is the hypermedia contract in full, and it follows from PRESENT.1.'
  - 'Programs and agents: a resource-oriented structured-data interface called what
    it is, resource-oriented HTTP, not REST, whose contract is the machine-readable
    description kept in sync by process (MD-02); the same rule holds for the agent
    tool surface''s description. Server-issued links are used where the server mints
    the next step: continuation links for paging, the created resource''s location,
    explicit handles for cross-call state. Clients do not build URLs the description
    does not define.'
  - 'Grounds: MD-02 makes an always-synchronised description the contract programs
    and agents read; it buys the independent evolution that hypermedia seeks by additive
    change and conformance checks, at lower cost per client (inferred). The hypermedia
    trade is accepted where it pays: browser pages.'
  design_notes: 'Decision: hypermedia where the client is a browser; a described,
    level-2 resource interface where the client is a program or an agent.

    Positions:

    - P1 server-provided representations drive client transitions; no fixed, out-of-band
    URL hierarchies; documentation-driven clients are the most frequent violation
    (L059; Fielding; contested).

    - P2 a JSON API without hypermedia controls is resource-oriented HTTP (Richardson
    level 2), not REST (L060; definition agreed).

    - P3 the uniform interface trades efficiency for visibility and independent evolution
    (L061).

    - Common API practice: documented fixed URLs and an out-of-band description (L059''s
    positions column; L634 OpenAPI for humans, generators and agents).

    - Cited: server-rendered HTML by default (PRESENT.1; L252, L629); in a hypermedia
    design the HTML is the contract and an OpenAPI file covers only the JSON endpoints
    that exist (L257, owned by PIG-WEB-LOGIC.EXPOSE.1); the description is always
    in sync (MD-02).

    Forces: changeability (independent evolution of clients over a long horizon, P1,
    P3); efficiency and tooling for program and agent clients (common practice); enforcement
    (the server decides which transitions to offer).

    Rejected:

    - Full hypermedia controls in the JSON interface (links and forms in every representation):
    not the default; acceptable when independently developed clients must keep working
    over a long horizon without a shared, synchronised description (L059, L061; condition
    inferred).

    - A client-rendered browser application driven by an out-of-band JSON description:
    not the default; acceptable under PRESENT.1''s conditions (many interdependent
    UI parts, offline, high-frequency or real-time state; L253).

    - Calling a level-2 JSON interface REST: rejected on definition (L060).

    Realizes: no direct link in the skeleton; follows PRESENT.1 (server-rendered HTML)
    and RECORD.3 with MD-02 (contract origin per project, always in sync).

    Maintainer decision cited: MD-02.

    Evidence gap: no ledger row on hypermedia controls for agent clients; the JSON
    half rests on MD-02 and L634 (inferred).

    No direct skeleton link; follows PRESENT.1 (server-rendered HTML) and RECORD.3
    with MD-02.

    Candidate under the gap: (review m9; no change to the decision): server-computed
    allowed actions for agents, the agent analogue of the browser''s rendered controls,
    which ACT.1 already admits as a permitted copy (the server previews what the caller
    may do; the request is still re-authorized on arrival). Handed to INTERACTION.AGENT''s
    judge with L661 (explicit server-minted handles) as the nearest evidence.


    Paging continuation links are owned by pig-web-defaults (L266).'
