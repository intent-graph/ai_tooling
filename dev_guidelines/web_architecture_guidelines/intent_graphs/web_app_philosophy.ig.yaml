- uid: ALLOCATION.DERIVE.3
  name: Caching
  intent: Every cache is a copy with a stated staleness bound and an expiry or invalidation
    plan; the source stays the authority. Derived-data caches live in database tables
    invalidated in the source transaction; HTTP responses are labelled on purpose;
    server state in client-rendered parts is a client cache with background refresh.
  epistemic_state: known
  constraints:
  - 'Authority: none: the source is the authority'
  - 'Copies: database tables, a shared backend store, HTTP intermediaries, the browser'
  - 'Forbidden: process memory beyond one request; personalised responses in shared
    caches'
  - Every cache states its staleness bound and an expiry or invalidation plan.
  - Derived-data caches are database tables, invalidated in the source transaction.
  - 'Label every HTTP response on purpose: HTML no-cache with validators, fingerprinted
    assets immutable, personalised responses private or no-store, lifetimes set by
    tolerable staleness.'
  - Response and fragment caches shared by processes live in the database by default;
    a cache service only on measured need.
  - Never use a cache as permanent storage.
  design_notes: "Positions: P1 cache tables in the database (L534 MAINT, L535); P2\
    \ shared cache service (L417); P3 HTTP caches in browsers and intermediaries (L010,\
    \ L414-L416); P4 server state cached in the browser (L071, L291).\n\nForces: latency\
    \ and performance against correctness (staleness).\n\nDecision: the positions\
    \ are kinds of cache; each cache is a copy with a stated staleness bound and an\
    \ expiry or invalidation plan (L419, L609).\n  - Derived-data caches: database\
    \ tables, invalidated in the source transaction (L534, MAINT, max).\n  - HTTP:\
    \ every response labelled on purpose; HTML no-cache with validators; fingerprinted\
    \ assets immutable; personalised responses private or no-store; lifetimes set\
    \ by tolerable staleness (L414, L415, L416, L010).\n  - Server state in client-rendered\
    \ parts: a client cache with background refresh (L071, L291).\n  - Response and\
    \ fragment caches shared by processes: Postgres by default under POSTGRES_FIRST\
    \ (L125, inferred), a cache service on measured need (CACHE_STORE; F7).\n\nRejected:\
    \ per-process memory shared beyond one request in multi-process production (L417,\
    \ L086); a cache as permanent storage (L417).\n\nChanged (R1): L534 limited to\
    \ derived-data caches (F7).\n\nWould move it: staleness tolerance, number of processes,\
    \ need for atomic invalidation"
