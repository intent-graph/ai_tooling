- uid: INTERACTION.COLLABORATE
  name: Collaboration on Data
  intent: 'Several users discuss and change the same data and learn of each other''s
    changes through push as a hint over a correct pull: every page is correct on plain
    load and a client catches up from a server cursor that no later commit can fall
    behind. Comments are entities with their own target, author, lifecycle and separately
    checked abilities, and a comment is never more visible than its target on any
    surface the application serves.'
  epistemic_state: 'known: MD-05 | unvalidated: leak-surface list (L687, synthesis);
    channel order from one T3 source (L435) | conflict: L682''s sequence-id cursor
    against L594, resolved for L594'
  constraints:
  - Every page is correct on plain load; a client that missed events catches up by
    fetching changes since a server-issued cursor and never trusts the events it happened
    to receive.
  - The catch-up cursor is one no later commit can fall behind; a sequence id is not
    such a cursor.
  - 'Use the simplest channel that meets direction of flow, update frequency and tolerable
    latency: polling, then long polling or server-sent events, then a two-way channel;
    correctness never depends on the channel.'
  - A stale write is rejected and shown as a conflict with both versions, so the user
    sees the other change and reapplies; it is never merged silently and never a silent
    overwrite of the whole record; the browser and agent clients never resolve a conflict
    on their own (GUARD.5).
  - Per-property last-writer-wins only for toggles, status, assignment and ordering;
    a text engine only for genuinely collaborative long-text fields.
  - 'Presence is ephemeral: broadcast through a channel with a timeout, never written
    to tables; a persisted last-seen is a separate, coarse field (PRESENT.3).'
  - A comment is its own entity with a mandatory target reference, its own author,
    lifecycle and permissions; comments are append-only rows that need no merge.
  - Read, comment, edit, resolve and moderate are separate abilities, deny by default,
    checked per object on every request, streams and exports included; none is implied
    by another.
  - 'A comment is never more visible than its target, may have a narrower audience,
    and the same filter applies on every surface the application serves: counts, notifications,
    search results, history, exports, ETags and real-time channels.'
  - Notifications are created only for recipients who may see the target.
  - A report queue (reports with a status and a decision) is required whenever people
    outside the team read comments.
  - Per-user comment reads go through database functions (MD-05; ALLOCATION.GUARD.3),
    whose written specification lists every secondary surface.
  - The reporting role reads comment content and comments whose audience is narrower
    than their target only through database functions; the operator role sees every
    row.
  - Agent writes are marked as agent-originated and pass the same abilities and visibility
    filters.
  design_notes: "Decides: how several users discuss and change the same data and learn\
    \ of each other's changes.\nRows: L006, L435, L664, L682, L686, L687. Cited: L594\
    \ (pig-web data), L671, L674, L677, L679, L681, L683, L659.\nPositions:\n- Freshness:\
    \ P1 delivered events are the client's state (rejected in L682), or a client replica\
    \ with a sync engine (L302, L677); P2 push is a hint over a correct pull (L682,\
    \ L006).\n- Channel: P3 the simplest channel that meets the need (L435); P4 one\
    \ two-way channel for everything (the WebSocket-first side of L436, owned by pig-web).\n\
    - Comment model: P5 each comment its own entity with a mandatory target (L664);\
    \ P6 comments embedded as columns or JSON in the annotated record (rejected in\
    \ L664).\n- Abilities: P7 five separate abilities, deny by default, per object\
    \ on every request (L686); P8 the comment right implied by the edit right or the\
    \ reverse (rejected in L686).\n- Visibility: P9 a comment never more visible than\
    \ its target, same filter on every secondary surface (L687); P10 the filter on\
    \ the main list only (the leak L687 warns against).\nForces: P2 serves correctness\
    \ under dropped connections and several tabs, at the cost of a catch-up endpoint;\
    \ P1 serves latency and offline use, at the cost of every replica becoming an\
    \ authority (L302). P3 serves simplicity and operability; P4 serves one code path\
    \ and two-way traffic, at the cost of long-lived connection servers. P5 and P7\
    \ serve confidentiality and least privilege (comments are edited, hidden or deleted\
    \ without touching the data; reviewers and customers may comment without editing),\
    \ at the cost of one more entity and more checks. P9 serves confidentiality; P10\
    \ serves only simplicity.\nDecision grounds:\n1. P2 (L682, L006). L682's \"(sequence\
    \ id)\" is rejected as stated: a sequence id does not follow commit order, so\
    \ a reader polling with \"id greater than last seen\" can skip a row forever (L594).\
    \ Realization: PIG-WEB-DATA.CONCURRENCY.5.\n2. P3 (L435), one T3 source for the\
    \ order.\n3. Concurrent edits surface the concurrency placement's policy (GUARD.5;\
    \ L674, L679, L677).\n4. Presence per PRESENT.3 (L681).\n5. P5 (L664); append-only\
    \ rows need no merge (L679).\n6. P7 (L686). Where each check lives follows GUARD.3\
    \ as settled: a rule decidable from the stored row and the actor (an author may\
    \ edit their own comment; the target's author may resolve its threads, L671) is\
    \ decided by the writer function; product roles that grant abilities (reviewer,\
    \ customer, moderator) are each backend's product policy; the browser hides controls\
    \ cosmetically. The unsourced \"thread's opener may resolve\" was dropped (review\
    \ m2).\n7. P9 (L686, L687). Who applies the per-user read filter when several\
    \ backends read the same comments is decided by MD-05, read visibility of rows\
    \ with per-user rules when several backends share the database (ALLOCATION.GUARD.3).\
    \ former recorded default (superseded) (MD-01 as written): each backend filters\
    \ from one shared written specification with a shared denial-test suite. J1's\
    \ fallback stays acceptable: database read functions that receive the verified\
    \ actor, when a per-user read rule must hold for two or more backends. This node\
    \ does not settle it.\n   Consequence of the default (X1): Before the maintainer\
    \ answered, the reporting role gets no SELECT on comment content or narrower-audience\
    \ comments, the operator role sees every row, and any other role that may SELECT\
    \ the base tables sees every row unless its own role is restricted; the guarantee\
    \ covers the surfaces the application serves and claims nothing stronger for those\
    \ roles.\n   Restriction required for comments until the question is answered\
    \ (review M1; inferred from the confidentiality purpose of P9 and from the reporting\
    \ role's column grants excluding personal data by default, J5 TRANSVERSE.SECURITY).\n\
    8. Agents collaborate under the same rules (L659, pig-web).\nRejected:\n- P1,\
    \ delivered events as state: wins never. A client replica with a sync engine wins\
    \ under the system-of-record placement's condition (offline use with user-owned\
    \ data, RECORD.1), and even then catch-up uses a cursor.\n- P4 as the default:\
    \ wins when traffic is two-way at high frequency (L435); the choice of push channel\
    \ among server-sent events and WebSocket is the pig-web channel node's (L436).\n\
    - P6: wins never for comments (they nearly always have other readers or writers\
    \ than the record, L664). A single free-text note edited by exactly the people\
    \ who edit the record is a field, not a comment (inferred).\n- P8: wins never\
    \ (L686). P10: wins never (L687).\nRealizes: ALLOCATION.GUARD.5 (shows conflicts\
    \ with the placement's policy; holds only the version it read); ALLOCATION.PRESENT.3\
    \ (presence on a channel with timeout, drafts in the browser, durable comments\
    \ in the database); requires ALLOCATION.GUARD.3 (abilities and visibility follow\
    \ the authorization placement, its open read clause included).\nHand-offs: commit-ordered\
    \ change cursor (PIG-WEB-DATA.CONCURRENCY.5, L594); push channel default (PIG-WEB-INTERACTION.REALTIME.1,\
    \ L436); anchoring, threads, text engine fields, notification and moderation rows\
    \ (PIG-WEB-INTERACTION.COLLABORATE.1 to .4); comment grants of reporting and operator\
    \ roles (PIG-WEB-DATA.GUARD.2); comments as a named consequence of the read-visibility\
    \ question's default (ALLOCATION.GUARD.3, allocation judge).\nMaintainer decisions:\
    \ MD-01 respected (no row security by default; the read-visibility default is\
    \ MD-01 as written); MD-03 shapes the row-decidable comment rules in writer functions.\n\
    Evidence gaps: leak-surface list (L687) is a synthesis; channel order rests on\
    \ one T3 source (L435); the comment-grant restriction is inferred; L682 conflicts\
    \ with L594, resolved for L594.\n\nLifted from the stack-neutral clause of PIG-WEB-INTERACTION.EDIT\
    \ in pig-web-defaults, wording kept; the verdict is that record's, not re-judged\
    \ here. Clause: a stale write is shown as a conflict with both versions and is\
    \ never merged silently.\n\nLifted from the stack-neutral clause of PIG-WEB-INTERACTION.COLLABORATE.4\
    \ in pig-web-defaults, wording kept; the verdict is that record's, not re-judged\
    \ here. Clause: a report queue whenever outsiders read comments.\n\nRealized in\
    \ pig-web-defaults at PIG-WEB-DATA.CONCURRENCY.5 (commit-safe cursor)."
