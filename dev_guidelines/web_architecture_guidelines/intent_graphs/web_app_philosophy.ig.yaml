- uid: TRANSVERSE.EVOLUTION
  name: Deliberate Evolution
  intent: 'The system changes deliberately: costly decisions are named, chosen from
    the properties they must induce, and recorded; growth happens in small tested
    increments without speculative features, with fit checked automatically. Several
    backends may share the database, each backend is one deployable not split into
    services without a measured need, few mature technologies are adopted, and teams
    are cut by capability with structure following them.'
  epistemic_state: 'known | gap: owns no row (roll-up)'
  constraints:
  - Name, choose from required properties, and record the costly decisions.
  - Grow in small tested increments with fit checked automatically.
  - Never split a backend into services without a measured need.
  - Adopt a new technology only past a measured limit of an existing one.
  - Cut teams by capability, with a cross-schema business function owned by the team
    that owns the workflow and reviewed by the database owner role.
  design_notes: "DECISION:\nthe roll-up of its five children:\n  - the costly decisions\
    \ are named, chosen from the properties they must induce, and recorded;\n  - the\
    \ system grows in small tested increments without speculative features, its fit\
    \ checked automatically;\n  - several backends may share the database (MD-03);\
    \ each backend is one deployable, not split into services without a measured need,\
    \ and a split happens only for independent deployability on proven boundaries;\n\
    \  - it adopts few mature technologies, a new one only past a measured limit;\n\
    \  - teams are cut by capability, and structure follows them; a cross-schema business\
    \ function belongs to the team that owns the workflow.\n\nPLACEMENTS REALIZED:\n\
    through its children (RECORD.1, RECORD.2, POSTGRES_FIRST in the stack graph).\n\
    \nREVIEW FIXES:\ndeployable line replaced after M3 (X5); ownership line after\
    \ m5."
