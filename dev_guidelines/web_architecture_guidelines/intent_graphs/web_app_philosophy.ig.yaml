- uid: TRANSVERSE.OPERABILITY
  name: Operability
  intent: The running system is observed, tested and delivered as one whole across
    every tier, designed in from the start. One correlation id runs from the browser
    to the database transaction, with a separate security event log and a retention
    decision per record type; tests sit at the lowest level that catches each failure,
    with data logic tested on the real engine; one immutable build is promoted everywhere
    with database changes in the same pipeline.
  epistemic_state: 'known | gap: owns no row (roll-up)'
  constraints:
  - Observe, test and deliver the system as one whole across every tier.
  - Carry one correlation id from the browser to the database transaction.
  - Keep the security event log apart from the business audit trail.
  - Promote one immutable build everywhere with database changes in the same pipeline.
  design_notes: "DECISION:\nthe roll-up of its three children. The running system\
    \ is observed, tested and delivered as one whole across browser, backend, database\
    \ and the other database consumers, designed in from the start (L096):\n  - one\
    \ correlation id runs from the browser to the database transaction; a separate\
    \ security event log and a retention decision per record type;\n  - tests at the\
    \ lowest level that catches each failure, the database tier tested on the real\
    \ engine, isolated by rollback by default, with commit-time and concurrent behaviour\
    \ tested in a disposable database;\n  - one immutable build promoted everywhere,\
    \ database changes inside the same pipeline.\n\nPLACEMENTS REALIZED:\nthrough\
    \ its children (ACT.4).\n\nREVIEW FIXES:\ntest line updated after M2 (X4)."
