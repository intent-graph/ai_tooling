- uid: DATA.INTERFACE
  name: Offered Contract
  intent: 'The database offers every consumer one published contract: a function API
    owned by the database owner, one business operation per call in its own transaction,
    one role per consumer, evolving additively. Writes and state transitions go through
    it, simple reads may query base tables under grants, and browsers and agents never
    connect to the database.'
  epistemic_state: 'known: realization of ALLOCATION.RECORD.2 and the database share
    of ALLOCATION.ACT.1 under MD-03 | gap: owns no ledger row'
  constraints:
  - The function API is the contract to the data that every consumer calls; its placement
    is ALLOCATION.RECORD.2.
  - One business operation is one function call in its own transaction, and each state
    column is written only by its writer function (ALLOCATION.RULES.5, ALLOCATION.ACT.1).
  - The contract evolves additively, and its catalogue is an interface description
    kept in sync with the implementation by process (ALLOCATION.RECORD.3).
  design_notes: 'Realization node for the database function API. It owns no ledger
    row: the verdicts it realizes are ALLOCATION.RECORD.2 and the database share of
    ALLOCATION.ACT.1, judged at the allocation step under the shared-database default
    (MD-03). The DATA judge proposed it as DATA.INTERFACE, a realization of those
    verdicts; the target hierarchy places the database function API under DATA. Created
    on the critique''s recommendation so that DATA offers its contract as LOGIC.EXPOSE
    does for the backend. Refined by PIG-WEB-DATA.INTERFACE in pig-web-defaults.'
