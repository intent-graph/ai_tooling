- uid: ALLOCATION.RULES.1
  name: Authority and Copies
  intent: Exactly one tier is the authority for each responsibility; every other copy
    is a snapshot that may be stale without breaking correctness, carries a version
    or timestamp that detects staleness, and never decides. A copy that rejects input
    early, such as a validator, is admitted only when generated from or tested against
    the authority.
  epistemic_state: 'known | unvalidated: the rule on rejecting copies is inferred
    (F3)'
  constraints:
  - Exactly one authority per responsibility.
  - Every copy carries a version or timestamp that detects staleness and never decides.
  - Rejecting copies are generated from or tested against the authority; never hand-maintained.
  - Store the minimum and derive the rest.
  - Where a second copy exists, show the pending state from the status resource or
    the optimistic local value after an asynchronous step.
  design_notes: 'Positions: one (L609, L072, L481).


    Decision: exactly one tier is the authority for each responsibility. Every other
    copy is a snapshot (L609): it may be stale without breaking correctness, carries
    a version or timestamp that detects staleness, and never decides. A copy that
    rejects input early (a validator) is admitted only when generated from or tested
    against the authority, so it can never refuse what the authority accepts (F3).
    Store the minimum and derive the rest (L072). Read-your-writes is a per-operation
    requirement where a second copy exists: after an asynchronous step, show the pending
    state from the status resource or the optimistic local value (L481).


    Rejected: copies without a staleness marker, or hand-maintained rejecting copies;
    win never.


    Changed (R1): rejecting copies must be generated or tested (F3).'
