- uid: INTERACTION.VISUALIZE
  name: Perceivable Interface
  intent: 'Accessibility is a project requirement from the first design: a conformance
    target is stated before building and judged per full page, and the interface starts
    from native HTML semantics and keyboard operation, with users with disabilities
    taking part in early testing. Retrofitting accessibility at the end costs more
    and leaves parts that never conform; formatting for the reader''s locale and time
    zone is placed by ALLOCATION.PRESENT.2.'
  epistemic_state: 'known | unvalidated: one weak T1 row (L005); the native-first
    consequence of PRESENT.1 is inferred | gap: conformance level not grounded (L300)'
  constraints:
  - Accessibility is a requirement from the first design; a conformance target is
    stated before building.
  - Conformance is judged per full page, embedded third-party content included.
  - Start from native HTML semantics and keyboard operation; ARIA only where native
    elements cannot express the control.
  - Formatting for the reader's locale and time zone follows ALLOCATION.PRESENT.2.
  - Users with disabilities take part in early testing, not only at acceptance.
  design_notes: 'Decides: how the interface stays usable by everyone, people with
    disabilities included.

    Rows: L005 (grounded, weak; SRC-165, T1). Cited: L003, L300, L301 (pig-web), L632
    (via PRESENT.2).

    Positions: P1 accessibility as a requirement from the start, users involved early
    (L005); P2 accessibility added at the end as an audit and retrofit (rejected in
    L005).

    Forces: P1 serves the node''s purpose (everyone can perceive and operate the interface)
    at the cost of design effort from the first page; P2 defers that cost and pays
    more later, with parts that never conform (inferred from L300: conformance is
    judged per full page, third-party content included).

    Decision: P1, as the max for the node''s purpose. The native-first rule follows
    from the rendering placement: server-rendered HTML with enhancement (PRESENT.1,
    L003) carries native semantics by default (inferred).

    Rejected: P2 wins never. A retrofit is acceptable only for a page that already
    exists and is brought to the stated target, never as the plan for new pages.

    Realizes: ALLOCATION.PRESENT.1 (renders what the backend renders, enhanced in
    the browser; islands only under L253''s criteria); ALLOCATION.PRESENT.2 (formats
    for the reader where the rendering happens).

    Hand-offs: the conformance level (A, AA or AAA) belongs to PIG-WEB-INTERACTION.VISUALIZE.4,
    which owns L300; the evidence read does not state AA as the default, so that choice
    needs a read source or stays open there.

    Evidence gap: one weak T1 row; business and legal case not found in what was read.'
