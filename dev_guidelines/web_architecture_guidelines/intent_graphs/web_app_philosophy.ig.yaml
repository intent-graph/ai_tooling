- uid: DATA.ORGANIZE
  name: Organized Facts
  intent: Each fact is stored once and changed in one place; the normal forms are
    the tests of that rule. Third normal form is the floor for every table, and Boyce-Codd,
    fourth and fifth normal form apply where they apply, because the anomaly they
    remove is of the same kind.
  epistemic_state: 'known | unvalidated: the Boyce-Codd claim, the declarative form
    for a lost dependency, the co-presence CHECK, and the MD-03 consequence are inferred
    | gap: collation choice has no row (handed to J6)'
  constraints:
  - 'Every table passes third normal form: every non-key field states a fact about
    the key, the whole key and nothing but the key.'
  - Boyce-Codd, fourth and fifth normal form are applied where they apply. Stopping
    at third normal form is acceptable only when every candidate key is a single column,
    and there are no multi-valued facts.
  - 'Where a Boyce-Codd decomposition would lose a dependency, keep the dependency-preserving
    third-normal-form design and enforce every dependency declaratively: the repeated
    determinant is covered by a composite foreign key to the table that owns the pair,
    so it cannot diverge and needs no sync plan. A constraint trigger under DATA.GUARD''s
    rule (Serializable isolation or a lock) only where no declarative form exists.'
  - 'Denormalization is not an organizing choice: a denormalized value is a derived
    copy governed by DATA.DERIVE and exists only with a sync plan recorded before
    it is built (what and why, sync level, freshness, change frequency, impact of
    divergence, drift detection and reconciliation, alerting; recorded in the table
    comment).'
  - 'A new one-to-one attribute is a nullable column by default; a separate table
    only for, in this order: cardinality likely to change, a different permission
    boundary, an independent audit or lifecycle, blast radius on heavily used tables.
    Sparsity and NULL count are never reasons to split.'
  - A column is nullable only when absence is a meaningful state of the fact; where
    several nullable columns must be present together, a CHECK states it.
  - Collation is a declared property of the stored text, not of a consumer.
  design_notes: 'Question: how facts are shaped so that each is stored once and changed
    in one place.

    Positions: P1 third normal form by default (L037; L469 maintainer doctrine). P2
    third normal form as the practical ceiling, higher forms only in specific multi-valued
    or overlapping-key designs (L039, majority; one T3 source says higher forms are
    rarely considered, SRC-254 T2 describes fourth and fifth normal form without ranking
    and has no Boyce-Codd section). P3 denormalize where measured performance requires
    it, the application guarding the redundancy (L168, owned by the defaults graph''s
    derive node; under L469 only with a sync plan chosen before it is built). P4 a
    new one-to-one attribute is a nullable column by default, a separate table only
    for the listed reasons (L470 maintainer doctrine); the opposite position (split
    to avoid NULLs) is named by L470 itself and no ledger row argues for it.

    Forces: all positions serve integrity, the node''s purpose: no update anomaly
    or inconsistent dependency can arise (L038). P2 and P3 trade some of it for design
    effort and read performance (normalization spreads data over several records,
    L168). P4 trades a nullable column against a join on every read that needs the
    attribute.

    Decision: the rule is "each fact once" (L038); the normal forms are its tests.
    Third normal form for every table (L037, L469; doctrine and research agree). Higher
    forms where they apply (L039; the fourth and fifth normal form claim is grounded
    in SRC-254; the Boyce-Codd claim is inferred from standard theory).

    (superseded by MD-09) Changed after review (M4): the higher forms do not cost
    nothing. Where candidate keys overlap, a Boyce-Codd decomposition is not always
    dependency-preserving: a dependency one table''s key enforced in third normal
    form can come to span two tables and can no longer be enforced by a key (inferred
    from standard theory, not in the ledger). The cost is an integrity cost, a rule
    moving from a declarative key to a procedural cross-table check; enforcing it
    by constraint trigger keeps both "each fact once" and "every rule enforced", which
    is the max under the selection rule.

    Denormalization: a derived copy of a fact stored elsewhere, governed by DATA.DERIVE
    and ALLOCATION.DERIVE.1, with L469''s sync plan.

    One-to-one attributes: L470 adopted on authority and as the max choice; its split
    criteria are integrity and security reasons; sparsity is not one, because a split
    states no fact more precisely and adds a join on every read.

    Nullable columns state their meaning (L485; L040 cites the database vendor guidance
    that most columns are NOT NULL, SRC-134 T1); the co-presence CHECK is inferred
    from L485 and L174.

    MD-03: the schema is read directly by reporting and operator roles (RECORD.2 access
    paths); normalization keeps every consumer''s view of a fact identical without
    consumer-side reconciliation (inferred).

    Rejected: P2 as a ceiling, because stopping at third normal form where overlapping
    keys or independent multi-valued facts exist leaves the anomalies L038 exists
    to prevent; acceptable not to analyze beyond third normal form when every candidate
    key is a single column and there are no multi-valued facts (narrowed after review,
    M4: a single composite candidate key is not enough, as Kent''s own fifth-normal-form
    example, an all-key table of agents, companies and products, still needs fifth
    normal form; SRC-254). P3 as an organizing default: never; acceptable as a derived
    copy when measured read performance requires it, with L469''s sync plan, DATA.DERIVE''s
    sync gradient (L532) and drift guard (L533). Splitting a one-to-one attribute
    for sparsity or NULL count: rejected (L470); a split wins only under L470''s criteria.

    Gap, collation: J1 owns collation in ALLOCATION.DERIVE.2 (the database is the
    authority for every order it serves) and left its choice open under DATA. No ledger
    row grounds a choice. Handed, open, to J6 (defaults graph, column types node)
    to decide with evidence or keep open; the philosophy-level consequence of DERIVE.2
    is only that collation is a declared property of the stored text (inferred).

    Realizes: ALLOCATION.RECORD.1 (holds the durable facts in the form the system-of-record
    placement gives the database). Refines python-kb-philosophy:STRUCTURE and :DATACENTRICITY
    (skeleton links).

    Gap 5: the Boyce-Codd claims rest on standard theory, not on a ledger row.


    Corrected by MD-09 (re-audit under MD-08): a lost Boyce-Codd dependency is enforced
    declaratively (composite foreign key from the repeated determinant to the table
    that owns the pair), at any isolation level and for every writer; the constraint
    trigger is the fallback only where no declarative form exists. Rejected: the trigger
    as the first route: wins where no declarative form exists; it needs Serializable
    isolation or a lock on every write to either table, a concurrent test and procedural
    code, and gains no integrity over the declarative form. Inferred from relational
    theory, not in the ledger.'
