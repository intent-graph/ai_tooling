- uid: INTERACTION.ENVIRONMENT.4
  name: Caches Beyond Reach
  intent: 'Responses stored by caches the team cannot purge cannot be recalled, so
    cacheability is declared per URL in advance and lifetimes are set by how stale
    a copy may be: long lifetimes only for immutable, fingerprinted URLs, and no-cache
    with validators for HTML and other in-place content. Every intermediary is accepted
    for what it bounds, with its staleness and added latency counted.'
  epistemic_state: 'known | unvalidated: the owned-CDN condition for P2'
  constraints:
  - Every response is labelled on purpose.
  - Long lifetimes only for immutable, fingerprinted URLs.
  - HTML and other in-place content carry no-cache and validators.
  - Personalised responses are private or no-store.
  - Every intermediary is kept on purpose, with its staleness and added latency counted
    against its benefit.
  design_notes: 'Decides: how responses stored by caches the team cannot purge are
    anticipated.

    Rows: L010, L011. Cited: L414, L415, L416 (pig-web logic), DERIVE.3.

    Positions: P1 declare cacheability per URL in advance and set lifetimes by how
    stale a copy may be, since a stored response cannot be recalled: short or no-cache
    for URLs whose content changes in place (L010); P2 long lifetimes with purging
    on change (the practice L010 rules out for intermediaries); P3 avoid intermediaries;
    L011 states their price (latency, stale data) against their benefit (bounded complexity).

    Forces: P1 serves correctness of what the user sees, at the cost of revalidation
    requests; P2 serves latency and load, and leaves stale copies wherever purge does
    not reach; P3 serves freshness at the cost of latency and scale.

    Decision: P1.

    Rejected: P2: acceptable when the cache is one the team owns and can purge (its
    own CDN) and the lifetime given to browsers and other intermediaries stays short
    (inferred). P3: wins never as a rule; intermediaries are kept on purpose (L011).

    Realizes: constrains ALLOCATION.DERIVE.3 (copies in caches the team does not own
    cannot be recalled, so their staleness bound is set when the response is sent).

    Hand-offs: header practice (PIG-WEB-LOGIC.EXPOSE.4); static assets and CDN (PIG-WEB-TRANSVERSE.TOPOLOGY.4).

    Evidence gap: the owned-CDN condition for P2 is inferred.'
