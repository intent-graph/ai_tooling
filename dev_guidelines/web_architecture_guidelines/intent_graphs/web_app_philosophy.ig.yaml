- uid: TRANSVERSE.CONTRACTS
  name: Standards and Contracts
  intent: Every contract between tiers or consumers is an explicit artifact stating
    structure and meaning, readable without the producer's code, and always in sync
    with the implementation. Contracts change by compatible additions, with usage
    known before removal; a breaking change goes expand, migrate, contract unless
    every consumer ships in the same deployment as the change, because consumers deploy
    separately and old clients linger.
  epistemic_state: 'known | conflict: L517 (MAINT) "deployed together", narrowed to
    the same-deployment condition, otherwise expand, migrate, contract (L047) | unvalidated:
    usage known per consumer role'
  constraints:
  - Make every contract an explicit artifact stating structure and meaning (names,
    types, nullability, units, invariants, owner, version), readable without the producer's
    code.
  - Keep every interface description consumers read always in sync with the implementation
    by process and a CI gate that fails on drift; this covers the HTTP description,
    the function API catalogue and the agent tool surface.
  - Treat the provider's contract as authoritative; consumer-driven contracts are
    tests, never the origin.
  - Change contracts by compatible additions by default, with tolerant readers and
    conservative writers; versioning is the exception.
  - Know how a behaviour is used before changing or removing it; never remove on the
    assumption that nobody uses it.
  - Take a breaking change through expand, migrate, contract, coordinated with every
    consumer, unless every consumer of the changed object ships in the same deployment
    as the migration.
  design_notes: "SCOPE:\nwhat every contract shares. The contracts of the default\
    \ context are the database function API (offered to several backends, consoles\
    \ and scripts; RECORD.2, realized under PIG-WEB-DATA.INTERFACE), the grants and\
    \ meaning of tables BI reads, and the backend's HTTP interface (to its browser\
    \ code, which runs at an older version for days, L009, and to agents; LOGIC.EXPOSE).\n\
    \nPOSITIONS:\n  - P1 an explicit artifact stating structure and meaning (names,\
    \ types, nullability, units, invariants, owner, version), readable without the\
    \ producer's code (L483; L562 and L565 at stack level).\n  - P2 evolve by compatible\
    \ additions; versioning is the exception (L056); readers tolerant, writers conservative\
    \ (L057); before changing or removing a behaviour, find how it is used (L058).\n\
    \  - P3 the provider contract is singular and authoritative; consumer contracts\
    \ are partial and plural, and the one that matters for change is the union of\
    \ what consumers use; consumer-driven contracts fit a closed community (L487).\n\
    \  - P4 a breaking change is coordinated with every consuming team and deployed\
    \ together, with no formal version numbers (L517, MAINT, for the function API).\n\
    \  - P5 a breaking change goes expand (support old and new), migrate (move every\
    \ client), contract (remove the old), so each phase can be released, verified\
    \ and rolled back (L047, owned by DATA.MAINTAIN, grounded); for HTTP, removal\
    \ is announced with machine-readable signals and a support window (L275, L277).\n\
    \nFORCES:\nP1 serves correctness across tiers and readers outside the producer,\
    \ at the cost of writing meaning down. P2 serves independent upgrade of components\
    \ at different times (L056); its cost is carrying old shapes for a while. P3 serves\
    \ conceptual integrity; consumer-driven tests make hidden coupling explicit at\
    \ the cost of a shared channel between teams (L487). P4 serves simplicity (one\
    \ shape at any time, no version bookkeeping); it costs a window of breakage, since\
    \ no deployment across separate deployables is atomic (L009). P5 serves the same\
    \ independence as P2 for the unavoidable break; it costs a period with two shapes.\n\
    \nDECISION:\nP1, P2, P3 and P5; P4's coordination kept, its \"deployed together\"\
    \ replaced.\n  - Every contract is an explicit artifact with structure and meaning,\
    \ readable without the producer's code (L483). Its origin is the one RECORD.3\
    \ names: the database schema for stored facts and for the function API (documentation\
    \ generated from the live database, L474); the project's recorded origin for interface-only\
    \ facts, kept always in sync by a CI gate that fails on drift (MD-02).\n  - \"\
    Always in sync by process\" and the compatibility window apply to every interface\
    \ description consumers read: the HTTP description, the database function API\
    \ catalogue, and the agent tool surface (for example an MCP server's tool list\
    \ and schemas) (MD-02, X7).\n  - The provider's contract is authoritative (L487):\
    \ the database owner's for the function API (L515), the backend's for HTTP.\n\
    \  - Changes are additive by default (L056); readers are tolerant (L057). Before\
    \ a change or removal, usage is known, not assumed (L058). Under MD-03 every database\
    \ consumer has its own role, so usage can be read per consumer: from its grants,\
    \ and from the session role that audit records on every write (ACT.4). Inferred;\
    \ how reads are counted per role is open.\n  - A breaking change to any contract\
    \ goes expand, migrate, contract (L047). For the function API: the new function\
    \ or signature is added beside the old, each consumer moves, and the old one is\
    \ removed once no consumer role calls it. The new name is the expand step, and\
    \ it carries the change, so no formal version number is needed: \"no formal version\
    \ numbers\" is L517's rule, the new name is the expand phase (L047) and the route\
    \ the maintainer's own L512 takes for stored contract schemas (new named version,\
    \ old one soft-deleted, consumers migrate gradually). The coordination with every\
    \ consumer that L517 demands is kept.\n  - \"Deployed together\" (L517) stays\
    \ acceptable only when every consumer of the changed object ships in the same\
    \ deployment as the migration; otherwise a breaking change goes expand, migrate,\
    \ contract (X2).\n  - Grounds for expand, migrate, contract as the default: the\
    \ database, several backends, BI reports and scripts deploy separately (MD-03),\
    \ and backends roll out instance by instance. A browser tab keeps old code for\
    \ days (L009, L278). There is usually a window in which old and new meet.\n  -\
    \ Counting: this is the L517 narrowing, realized here and counted once at its\
    \ owner, PIG-WEB-DATA.INTERFACE.1 (J6). It is narrower than \"against the doctrine\"\
    \ suggests, since L512 already takes this route for stored contract schemas.\n\
    \  - Consumer-driven contract tests where consumers are separate teams in a closed\
    \ community (L487); for the single team's own browser client, whether they add\
    \ value beyond schema checks stays with the stack judge (L560, contested, PIG-WEB-TRANSVERSE.CONTRACTS.1).\n\
    \nREJECTED:\n  - P4 lockstep (\"deployed together\") for a breaking change: acceptable\
    \ only when every consumer of the changed object ships in the same deployment\
    \ as the migration (X2). This is never the case for HTTP contracts with browser\
    \ clients, whose open tabs are consumers that do not ship with the deployment\
    \ (L009), or for contracts BI reports or scripts read.\n  - Versioning as the\
    \ routine way to change (version per release): versioning is the exception (L056);\
    \ when a break is unavoidable, the version sits in one agreed place (L276, stack\
    \ level).\n  - Removing behaviour on the assumption that nobody uses it: never\
    \ (L058).\n  - Consumer-driven contracts as the authority: they are partial views\
    \ (L487); acceptable as tests, never as the origin.\n\nPLACEMENTS REALIZED:\n\
    requires RECORD.3 (skeleton link); required by INTERACTION.ENVIRONMENT.3 (version\
    \ skew). Rests on RECORD.2 (function API as the default contract, MD-03) and MD-02.\
    \ J1's RECORD.3 gate lets a function-API break through when it is marked as coordinated;\
    \ this record fills in what that mark requires (the expand, migrate, contract\
    \ sequence, or the lockstep condition above). No placement is changed.\n\nREVIEW\
    \ FIXES:\nM1 and X2 (one lockstep condition, word for word; the departure cited\
    \ here and counted once at its owner; the new name credited to the expand step\
    \ and L512, not to L517; L512 noted as already taking this route); X7 (sync and\
    \ compatibility window extended to every interface description, the agent tool\
    \ surface included).\n\nThe L517 departure is counted once, at PIG-WEB-DATA.INTERFACE.1\
    \ in pig-web-defaults, for both graphs."
