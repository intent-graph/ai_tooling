- uid: TRANSVERSE.PERFORMANCE
  name: Measured Performance
  intent: Performance is judged on field measurement of real users at the 75th percentile,
    segmented by device class, because only it shows what users experience; lab budgets
    gate each change before release but never override field data. Field metrics are
    joined through a correlation id to server and database time so work placed in
    the database is not invisible.
  epistemic_state: 'known | unvalidated: whole-path join to server and database time
    | gap: owns one row; no row measures server or database time'
  constraints:
  - Judge user-perceived performance on field data at the 75th percentile, segmented
    by device class; never use averages.
  - Enforce lab budgets in the build as a gate, and never let them override field
    data.
  - Optimise only after measurement has named the critical path.
  - Join field page metrics through the correlation id to server timing and database
    time per request.
  design_notes: "POSITIONS:\n  - P1 field (real-user) measurement at the 75th percentile,\
    \ split by mobile and desktop, as the truth that sets priorities; lab tools test\
    \ changes before release and find opportunities (L015; L381 for percentiles over\
    \ averages).\n  - P2 lab budgets enforced in the build (L296, owned by PIG-WEB-TRANSVERSE.PERFORMANCE).\n\
    \  - P3 optimise only after measurement has found the critical path (L097, owned\
    \ by FORCES.3; J1 verdict).\n\nFORCES:\nP1 serves truth about what users experience\
    \ (latency, FORCES.4); its cost is that field data arrives only after release\
    \ and needs traffic. P2 serves prevention before release; its cost is that lab\
    \ conditions miss real devices and cannot measure INP (L015). P3 serves effort.\n\
    \nDECISION:\nP1 is the truth, P2 the gate, P3 the discipline.\n  - User-perceived\
    \ performance is judged on field data at the 75th percentile, segmented by device\
    \ class (L015, L381); it sets the priorities and feeds the allocation forces:\
    \ a performance-driven copy needs a measurement that names the path (RULES.2,\
    \ L607; FORCES.3); round trips are budgeted against FORCES.4.\n  - Lab budgets\
    \ in the build gate each change (L296, a fitness function in the sense of L110)\
    \ and never override field data.\n  - Whole path (max, inferred): field page metrics\
    \ are joined, through the correlation id, to server timing and to database time\
    \ per request (L095, L376, L382). The reason is the default context: the per-request\
    \ work MD-03 places in database functions is invisible to page metrics alone.\n\
    \nREJECTED:\n  - Lab-only measurement: never the truth (cannot measure INP, L015).\
    \ It is acceptable as the primary source before launch, or when traffic is too\
    \ low for a stable 75th percentile (condition inferred).\n  - Averages: never\
    \ (L381).\n  - Optimising up front: never (L097; J1 FORCES.3).\n\nPLACEMENTS REALIZED:\n\
    dataflow to FORCES.3 and FORCES.4 (skeleton links). Rests on RULES.2 (L607)."
