- uid: TRANSVERSE.SECURITY
  name: Security Across Tiers
  intent: The whole site is served over encrypted transport and exposes and logs only
    the minimum data its purpose needs. Every threat category has an owning tier that
    the requester cannot modify, insecure design is answered by a threat model per
    critical flow and trust boundary with misuse-case tests, and each property is
    stated as a verifiable requirement at a level chosen by risk.
  epistemic_state: 'known: MD-05 | unvalidated: the whole tier map, L303''s 7 categories
    and the 3 added here (A06, A08, A10), A04 completed'
  constraints:
  - Serve every page and every API over encrypted transport with strict transport
    enforcement and no mixed content; the same property covers database connections
    of every consumer role.
  - Collect only the data the user's goal needs; never log secrets, session ids, tokens,
    keys, payment data, connection strings or unneeded personal data, trace headers
    included.
  - Give every threat category an owning tier that the requester cannot modify, named
    through the allocation placements.
  - Answer insecure design with a threat model per critical flow and trust boundary
    (authentication, access control, business operations, agent access), revisited
    when a placement on that flow changes, and misuse-case tests per tier.
  - Assign software and data integrity failures to the delivery pipeline and the parsing
    tier for untrusted serialized input; declarative constraints are not that control.
  - State each property as a verifiable requirement with a traceable id, at a level
    chosen by risk; the threat list is an awareness map, never the requirement set.
  - 'Never claim a stronger read-visibility guarantee than the rule of ALLOCATION.GUARD.3
    gives: roles that may read the base tables see every row unless their own role
    is restricted.'
  design_notes: "POSITIONS:\n  - P1 whole-site HTTPS, never mixed with HTTP in a session,\
    \ HSTS (L029); HTTPS as the precondition for browser capabilities (L030).\n  -\
    \ P2 minimal exposure: a visit is safe, only the data the user's goal needs is\
    \ collected (L035); secrets, session ids, tokens, keys, payment data, connection\
    \ strings and unneeded personal data never logged, pseudonymised where identity\
    \ is not needed, logged input sanitised (L036).\n  - P3 the OWASP Top 10:2025\
    \ as an awareness map, each category assigned to an owning tier (L303; tier map\
    \ inferred, SRC-115 does not state it).\n  - P4 a catalogue of verifiable requirements\
    \ (ASVS) at a level chosen by risk (L304, owned by PIG-WEB-TRANSVERSE.SECURITY.1;\
    \ its level definitions are now read from the ASVS 5.0 text, its chapter list\
    \ is not).\n\nFORCES:\nP1 and P2 serve confidentiality and integrity at a low,\
    \ one-off cost; no position in the evidence opposes them. P3 serves coverage (no\
    \ threat without an owner); its cost is that an awareness list is not testable.\
    \ P4 serves verifiability; its cost is effort scaled by the chosen level.\n\n\
    DECISION:\nP1, P2, and P3 completed by P4's demand.\n  - Transport: every page\
    \ and every API over HTTPS with HSTS, no mixed content (L029, L030). Database\
    \ connections from every consumer role are covered by the same property (inferred:\
    \ MD-03 adds consumers outside the request path).\n  - Exposure: collect the minimum\
    \ (L035); log no secret or unneeded personal data (L036), trace headers included\
    \ (L375). The reporting role's column grants exclude personal data by default\
    \ (J1 access paths), which realizes L035 for the MD-03 consumers.\n  - Threat\
    \ map: every Top 10 category has an owning tier that the requester cannot modify\
    \ (RULES.3, L019), named through the allocation placements:\n    - A01 Broken\
    \ Access Control: backend and database, as GUARD.3 settles it: writer functions\
    \ decide per-user write rules; the backend decides product policy and identity;\
    \ the database bounds each consumer by its role (MD-01, MD-03). Decided by MD-05,\
    \ read visibility of rows with per-user rules when several backends share the\
    \ database (not settled here). former recorded default (superseded): each backend\
    \ filters these reads from one shared written specification, with a shared denial-test\
    \ suite every backend runs. Database read functions that receive the verified\
    \ actor are acceptable when a per-user read rule must hold for two or more backends.\
    \ Consequence: Before the maintainer answered, the reporting role gets no SELECT\
    \ on comment content or narrower-audience comments, the operator role sees every\
    \ row, and any other role that may SELECT the base tables sees every row unless\
    \ its own role is restricted; no statement here claims a stronger visibility guarantee.\n\
    \    - A04 Cryptographic Failures: the backend (GUARD.4; L303), the proxy's TLS,\
    \ the database connections of every consumer role, and storage at rest (the review's\
    \ completion of L303's backend-only assignment; inferred).\n    - A07 Authentication\
    \ Failures: backend (GUARD.4; L303).\n    - A05 Injection: backend and database\
    \ (L303): parsing into precise types at every entry and typed function parameters\
    \ (GUARD.1).\n    - A02 Security Misconfiguration: headers, CSP and deployment;\
    \ A03 Supply Chain: the pipeline and dependencies (L303; realized in PIG-WEB-TRANSVERSE.SECURITY\
    \ and OPERABILITY.3).\n    - A09 Logging and Alerting Failures: operations (L303),\
    \ realized in OPERABILITY.1.\n    - Assigned here, inferred:\n      - (superseded\
    \ by MD-09) A06 Insecure Design: a threat model per placement and per critical\
    \ flow (authentication, access control, business operations, agent access), with\
    \ misuse-case tests per tier; OPERABILITY.2's denial tests are their first instance.\
    \ The allocation records (EVOLUTION.1) are the model's input, not the model. Grounded\
    \ in the OWASP Top 10:2025 A06 preventions (threat modelling for authentication,\
    \ access control, business logic and key flows; use-case and misuse-case tests\
    \ per tier), read by the review.\n      - A08 Software or Data Integrity Failures:\
    \ the delivery pipeline (signed provenance, trusted sources, review of code and\
    \ configuration changes, segregated CI/CD; one immutable artifact, L101; realized\
    \ in PIG-WEB-TRANSVERSE.SECURITY.5) and the parsing tier for untrusted serialized\
    \ input (GUARD.1). The OWASP 2025 category is untrusted code or data treated as\
    \ trusted; the database's declarative constraints are not an A08 control and are\
    \ not assigned here.\n      - A10 Mishandling of Exceptional Conditions: the tier\
    \ that holds each check, which fails closed (inferred from RULES.3).\n  - Verifiability\
    \ (max): each property is stated as a verifiable requirement at a level chosen\
    \ by risk, with requirement ids traceable; the catalogue is a stack choice (P4,\
    \ PIG-WEB-TRANSVERSE.SECURITY.1). Its level definitions are grounded: ASVS 5.0\
    \ says most applications should strive for Level 2, and each organisation decides\
    \ its level from its risks. The Top 10 stays the awareness map, not the requirement\
    \ set.\n\nREJECTED:\n  - HTTPS only on login or sensitive pages: never (L029).\n\
    \  - Logging raw identifiers or secrets for debugging: never; a hashed session\
    \ id is acceptable when sessions must be tracked (L036).\n  - The Top 10 as the\
    \ requirement set or a compliance checklist: it is an awareness document (L303);\
    \ wins never as the only catalogue.\n  - Security as a per-tier add-on without\
    \ an owning tier per threat: against RULES.3 and L096.\n  - The recorded allocation\
    \ decisions as the answer to insecure design: they are the threat model's input;\
    \ OWASP's A06 asks for threat modelling and misuse-case tests. Wins never as the\
    \ whole answer.\n\nPLACEMENTS REALIZED:\nrefines RULES.3 (skeleton link). Rests\
    \ on GUARD.1, GUARD.3, GUARD.4, GUARD.2, ACT.4 and the J1 access paths.\n\nREVIEW\
    \ FIXES:\nM4 (A08 reassigned to the pipeline and the parsing tier, declarative\
    \ constraints dropped; A06 as a threat model with misuse-case tests; A04 completed;\
    \ whole map unvalidated); m1 (ASVS level definitions grounded, L304's level part\
    \ no longer open); m7 and X1 (one notation for the pending clause, former recorded\
    \ default (superseded), fallback and consequence stated).\n\nCorrected by MD-09\
    \ (re-audit under MD-08): threat models are per critical flow and trust boundary,\
    \ revisited when a placement on the flow changes; a model per placement repeats\
    \ the flow models and the allocation records, which are the model's input, and\
    \ adds effort without coverage."
