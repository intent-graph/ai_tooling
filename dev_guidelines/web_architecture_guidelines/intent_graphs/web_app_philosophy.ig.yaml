- uid: ALLOCATION.RECORD.1
  name: System of Record
  intent: The server database is the single system of record for governed business
    data. Caches, search indexes, browser state, messages and history derive from
    it in transaction order, because only one global order lets rules such as uniqueness,
    balances and authorization hold for every write.
  epistemic_state: known
  constraints:
  - 'Authority: database'
  - 'Copies: browser server-state cache (versioned, for latency), HTTP caches, cache
    tables, search index, reporting copy, browser drafts of unsent input'
  - 'Forbidden: any copy acting as authority; dual writes from any consumer'
  design_notes: 'Positions: P1 server database as the single system of record (L045,
    L609, L482, L071); P2 client replica primary, local-first (L302); P3 ordered log
    as the truth (L626).


    Forces: P1 serves correctness: rules that need one global order (uniqueness, balances,
    authorization) hold. P2 serves latency, offline availability and user ownership;
    every replica is an authority (L302) and peers cannot enforce server rules (L680).
    P3 serves correctness of many derived stores and scalability, at the cost of stream
    infrastructure.


    Decision: P1. Postgres is the single system of record for governed business data.
    Caches, search indexes, browser state, messages and history derive from it in
    transaction order; no consumer writes two stores (L045, L609). It is the only
    position under which the rules hold for every write, which MD-03''s several consumers
    make decisive.


    Rejected: P2: wins when offline use, multi-device sync or user ownership matter
    more than central enforcement and the data is user-owned (L302). P3: wins with
    many derived stores outside the database at high write rate and a team able to
    run stream infrastructure (L626); in the default, Postgres plus an outbox table
    plays that role (inferred).


    Would move it: offline need with user-owned data; many external derived stores
    at high write rate'
