- uid: ALLOCATION.DERIVE.1
  name: Derived Data and Aggregation
  intent: 'The tier for derived data follows the required freshness and atomicity,
    in this order: compute on read when affordable; maintain it in the database in
    the same transaction as the source when it must change atomically; keep database
    cache tables with an invalidation queue or scheduled refresh when a stated staleness
    is acceptable.'
  epistemic_state: 'known | unvalidated: the order of options is a synthesis (L625
    inferred)'
  constraints:
  - 'Authority: database'
  - 'Copies: derived columns and tables with a stated staleness'
  - 'Forbidden: consumers writing derived stores beside the source'
  - 'Order of options: compute on read, then same-transaction maintenance in the database,
    then cache tables with a stated staleness.'
  design_notes: 'Positions: P1 inside the database with the source (L176, L532, L534,
    L536); P2 from an ordered log by a dedicated process (L626, L045); P3 computed
    on read (L488 MAINT).


    Forces: correctness against performance and scalability.


    Decision: choose the tier by required freshness and atomicity (L625), in this
    order (my order, F6): compute on read when affordable (L488, L072); when it must
    change atomically with the source, maintain it in the database in the same transaction
    (generated column, trigger: L176, L532); when a stated staleness is acceptable,
    database cache tables with an invalidation queue or scheduled refresh (L532, L535,
    L536, all MAINT). The doctrine is the max choice here.


    Rejected: P2: wins with many derived stores outside the database, a high write
    rate and a team able to run stream infrastructure (L626). Dual writes by any consumer:
    never (L045).


    Changed (R1): order marked as mine (F6).


    Would move it: number of external derived stores, write rate, staleness tolerance'
