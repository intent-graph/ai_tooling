  - Backends, consoles and scripts write through API functions; at most read access
    on base tables for simple reads.
  - 'One direct-write exception: a single-table write grant for a table that only
    one consumer writes and that has no state column or multi-table effect.'
  - Reporting reads through a read-only role with table and column grants, on a replica
    or reporting copy when its load matters.
  - Evolution is additive; breaking changes are coordinated with every consumer; 'deployed
    together' holds only when every consumer of the changed object ships in the same
    deployment as the migration, otherwise expand, migrate, contract.
  - A consumer outside the owning team gets the function API as a published contract.
  design_notes: "Positions: P1 one application owns the database; others go through\
    \ its service or a read-only reporting copy (L044, L622, L621); P2 shared database\
    \ behind a database function API owned by the database owner (L515 MAINT, L517,\
    \ L617, L616); P3 the schema is the API, views and functions (L518, L618, L187);\
    \ P4 base tables through the ORM (L187, L516).\n\nForces: changeability (coupling,\
    \ deploy autonomy) against correctness (one rule for every consumer) and security\
    \ (per-consumer grants).\n\nDecision: P2 is the default contract (MD-03; L515,\
    \ L517; MAINT, max).\n  - Every consumer has its own role (access paths table\
    \ above). Backends, consoles and scripts write through the API functions; consumer\
    \ roles get EXECUTE on the API schema, and on base tables at most SELECT for simple\
    \ reads (L516). One exception, as in DB_API (R1-5): a direct single-table write\
    \ grant for a table that only one consumer writes and that has no state column\
    \ or multi-table effect.\n  - BI and reporting read through a read-only role with\
    \ table and column grants, on a replica or reporting copy when its load matters.\
    \ Reports bind to table shapes; the coupling is accepted because reports are not\
    \ part of the operational contract and break visibly (inferred; tension with L622\
