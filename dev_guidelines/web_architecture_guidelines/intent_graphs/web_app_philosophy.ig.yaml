- uid: ALLOCATION.FORCES
  name: Allocation Forces
  intent: 'The forces act in order, not on one scale: correctness and security are
    vetoes that decide which tiers may be the authority; among the admissible tiers,
    the force whose loss is hardest to repair later wins (changeability of the rule''s
    location, then performance, then scalability); latency and performance justify
    copies in other tiers, never a move of authority.'
  epistemic_state: 'known | unvalidated: the order and the repairability criterion
    are a synthesis of L606-L609, L019, L097, L125'
  constraints:
  - Correctness and security veto a tier before any other force is weighed.
  - Among admissible tiers, the force whose loss is hardest to repair later decides.
  - Latency and performance justify copies, never a move of authority.
  - Each placement settled among the choosing forces names the force it preferred.
  - Never reduce the forces to a weighted sum per placement.
  design_notes: "Positions: no row; roll-up of the six forces.\n\nDecision: the forces\
    \ act in order, not on one scale.\n  1. Correctness and security decide which\
    \ tiers may be the authority; a tier that cannot see every writer, or that the\
    \ requester controls, is vetoed (L606, L608, L019).\n  2. Among admissible tiers,\
    \ the force whose loss is hardest to repair later wins (F10). In the default context\
    \ that orders them: changeability of the contract and of the rule's location (a\
    \ rule placed in the wrong tier, or copied across consumers, needs every consumer\
    \ changed to repair) before performance (repairable later by a measured move,\
    \ L097, L215) before scalability (repairable at a measured limit, L125).\n  3.\
    \ Latency and performance justify copies in other tiers, never a move of authority\
    \ (L607, L609, L012).\n  Each placement settled at step 2 names the force it preferred.\n\
    \nRejected: a weighted sum of forces per placement: it is the average the maintainer\
    \ rejected; it wins never as a rule.\n\nChanged (R1): criterion among the choosing\
    \ forces added (F10)."
