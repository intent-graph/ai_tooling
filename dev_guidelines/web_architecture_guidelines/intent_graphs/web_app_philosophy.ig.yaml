- uid: ALLOCATION.GUARD.2
  name: Invariants
  intent: 'Rules that must hold whatever writes the data are enforced by the database:
    declarative constraints for every rule they can express, and, beyond them, procedural
    checks run under serializable isolation with retry or after locking the governing
    row. Only declarative constraints bind every writer, owner-run migrations included.'
  epistemic_state: 'known | conflict: against L471 (MAINT) on optional CHECK constraints
    | unvalidated: default isolation level belongs to the DATA judge'
  constraints:
  - 'Authority: database'
  - 'Copies: generated or tested backend validators and types, browser feedback'
  - 'Forbidden: application-only enforcement of any rule that must hold for every
    writer; a procedural check under Read Committed without a lock'
  - Declarative constraints (NOT NULL, CHECK, UNIQUE, foreign keys, domains) are required
    for every rule they can express; CHECK constraints are not optional.
  - Cross-row rules use a partial unique index or an exclusion constraint first.
  - Other multi-row rules (including legal state transitions) run in a constraint
    trigger or the writer function under serializable isolation with retry, or after
    locking the governing row; the trigger asserts the isolation level it needs.
  - Read Committed alone admits violations and Repeatable Read admits write skew;
    never a procedural check under Read Committed without a lock.
  - Set the default isolation per consumer role; writer functions assert their isolation
    level; reports on a replica accept snapshot anomalies.
  - Backend and browser validators are generated from or tested against the constraints;
    named constraints map violations to stable errors.
  design_notes: "Positions: P1 declare in the database (L040, L473, L471 MAINT); P2\
    \ application-only validation (common practice, rejected by L473 for uniqueness);\
    \ P3 database functions and triggers for multi-row rules (L528 MAINT, L471).\n\
    \nForces: correctness against changeability (testing needs a live database, tooling).\n\
    \nDecision: rules that must hold whatever writes the data are enforced by the\
    \ database (MD-03).\n  - Declarative constraints (NOT NULL, CHECK, UNIQUE, foreign\
    \ keys, domains) for every rule they can express: required. For cross-row rules,\
    \ a partial unique index or an exclusion constraint first (L174, L175); these\
    \ are safe under concurrent writers at any isolation level and bind every writer,\
    \ owner-run migrations included.\n  - Rules beyond them (other multi-row rules,\
    \ legal state transitions): a constraint trigger or the writer function, run under\
    \ Serializable isolation with retry, or after locking the governing row; the trigger\
    \ asserts the isolation level it needs (F4; L569, L577, SRC-331). Read Committed\
    \ alone admits violations, and Repeatable Read admits write skew (L577).\n  -\
    \ The default isolation is handed to the DATA judge (PIG-WEB-DATA.CONCURRENCY.1)\
    \ with this constraint; the review recommends L568 (a), Serializable with retry\
    \ as the default (L569), and I concur (inferred). Hand-off conditions (R1-9; L573):\
    \ set the default isolation per consumer role, because a lower-isolation transaction\
    \ from any writing role voids the Serializable guarantee; writer functions assert\
    \ the isolation level, as triggers do; reports on a replica cannot be Serializable\
    \ and accept snapshot anomalies.\n  - Backend and browser validators are generated\
    \ from or tested against the constraints (F3, RULES.1); named constraints map\
    \ violations to stable errors (L495).\n\nMAINT: L471 adopted on authority. Against\
    \ L471 on \"triggers and CHECK constraints optional as defence in depth\": procedural\
    \ checks, inside a function or a trigger, need serializable isolation or a lock\
    \ to be correct (L473, L577), and only declarative constraints bind every writer,\
    \ owner-run migrations and human-run jobs included; the function API's privilege\
    \ wall does not cover the owner role.\n\nRejected: P2 for any rule that must hold\
    \ for every writer; wins never.\n\nChanged (R1): multi-row branch under Serializable\
    \ or a lock (F4); ground against L471 narrowed (F4); copies generated or tested\
    \ (F3); several writers per MD-03 (F5).\n\nChanged (R2): isolation bound per consumer\
    \ role; writer functions assert it; replica reports accept snapshot anomalies\
    \ (R1-9, L573).\n\nWould move it: nothing in the default"
