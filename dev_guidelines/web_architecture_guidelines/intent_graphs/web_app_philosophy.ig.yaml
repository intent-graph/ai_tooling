- uid: ALLOCATION.RECORD.3
  name: Type and Contract Definitions
  intent: 'Every fact has one origin: facts about stored data originate in the database
    schema and the function API''s contract is its signatures, while the interface
    description consumers read is always in sync with the implementation by process.
    Which side originates an interface-only fact, description or code, is decided
    per project with recorded criteria.'
  epistemic_state: 'known: MD-02 | unvalidated: generators for persistence models
    and interface fields not read'
  constraints:
  - 'Authority: database for every stored fact and for the function API''s contract;
    the project''s recorded origin for interface-only facts'
  - 'Copies: generated persistence models, generated or checked interface models and
    description, generated browser types (build-time only)'
  - 'Forbidden: hand-copied types without a CI comparison; drift between description
    and implementation; the browser as an origin'
  - One origin per fact; a fact about stored data (type, nullability, enum values,
    ranges, lengths) originates in the database schema, in versioned migrations.
  - Persistence models are generated from the live schema; interface fields echoing
    a stored fact are generated from the catalogue or checked against it in CI.
  - Every interface description consumers read (HTTP description, function API catalogue,
    agent tool surface) is always in sync with the implementation.
  - 'Sync is guaranteed by process: one origin per fact, the other side generated
    or conformance-checked, review rules on contract diffs, a CI/CD gate that fails
    on drift.'
  - A catalogue diff in CI fails on a removed function or an incompatible signature
    unless every consumer of the changed object ships in the same deployment; otherwise
    expand, migrate, contract.
  - 'Record the origin direction per project with its criteria: description first
    for independent consumers, several implementations or a contract agreed before
    code; code first when every consumer is code the team ships together.'
  design_notes: "Positions: P1 database schema first (L474 MAINT, L485, L549); P2\
    \ application models first, code-first (L548, L549); P3 interface description\
    \ first, design-first (L272, L634); P4 readers take only what they use (L556).\n\
    \nForces: correctness (no drift between tiers) against changeability (who can\
    \ change a shape, and how fast).\n\nDecision:\n  - One origin per fact (L486;\
    \ F3). A fact about stored data (type, nullability, enum values, ranges, lengths)\
    \ originates in the database schema, in versioned migrations; the live database\
    \ is the truth for structure (L474, MAINT, max). Persistence models are generated\
    \ from the live schema; interface fields that echo a stored fact are generated\
    \ from the catalogue or checked against it in CI. Which generator: open (none\
    \ read). A hand-written mirror with a CI comparison is acceptable only when no\
    \ generator fits.\n  - The database function API's contract is the function signatures;\
    \ its documentation is generated from the live database (L474). MD-02's process\
    \ applies to it too (R1-7): a catalogue diff in CI fails on a removed function\
    \ or an incompatible signature unless every consumer of the changed object ships\
    \ in the same deployment as the migration; otherwise the change goes expand, migrate,\
    \ contract (L517, X2); the backends' typed wrappers are generated from the same\
    \ catalogue (TYPE_CHAIN).\n  - Every interface description consumers read is always\
    \ in sync with the implementation (MD-02, X7): the HTTP description (OpenAPI or\
    \ equivalent), the database function API catalogue, and the agent tool surface\
    \ (for example an MCP server's tool list and schemas). This is guaranteed by process:\
    \ one origin per fact; the other side generated or conformance-checked; review\
    \ rules on contract diffs; a CI/CD gate that fails on drift.\n  - The origin direction\
    \ of the interface is a per-project decision, recorded with its criteria (MD-02):\n\
    \    - description first when consumers are independent of the producing team\
    \ (third parties, other teams, agent hosts the team does not control: L634, L635),\
    \ when several implementations must agree, or when the contract must be agreed\
    \ before the code (L272; SRC-241 says code-first descriptions are incomplete);\n\
    \    - code first when every consumer is code the team builds and ships together\
    \ and the description is a by-product of typed models (L548).\n\nRejected: P1\
    \ for the interface (one class for table and API): acceptable when the API shape\
    \ equals the storage shape, as in simple CRUD (L549); otherwise fields leak (L553).\
    \ P4 is a reading discipline for independent consumers (L556), not an origin.\
    \ The judge's former code-first default and the review's design-first default\
    \ (F2) are both replaced by MD-02.\n\nChanged (R1): origin per fact (F3); sync\
    \ by process and per-project direction (MD-02, F2).\n\nChanged (R2): drift gate\
    \ on the function API's signatures (R1-7).\n\nChanged (R3): every interface description\
    \ consumers read, agent tool surface included (X7); drift gate condition per X2.\n\
    \nWould move it: project type (MD-02 criteria)"
