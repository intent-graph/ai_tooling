- uid: INTERACTION.ENVIRONMENT
  name: Web Environment
  intent: 'Seven properties of the web are accepted as given, each with the design
    response that keeps users able to work with the data: the runtime is unknown,
    pages have an unstable lifecycle, deployment is not atomic, stored responses cannot
    be recalled, the network fails, URLs are public and long-lived, and page script
    may be hostile.'
  epistemic_state: known
  constraints:
  - 'The runtime is unknown: core content and function work as HTML, enhanced in layers
    (.1).'
  - 'Pages are restored, frozen, discarded and opened in several tabs: the server
    stays the arbiter (.2).'
  - 'Deployment is not atomic: every client-server contract, the agent tool surface
    included, has an explicit compatibility window (.3).'
  - 'Stored responses cannot be recalled: cacheability is declared per URL, long lifetimes
    only for immutable URLs (.4).'
  - 'The network fails: the client degrades gracefully and retries only what is safe
    (.5).'
  - 'URLs are public and long-lived: stable, implementation-free, carrying navigable
    state, never a session token, bearer token or long-lived credential; short-lived
    single-purpose signed URLs for file delivery are the one exception (.6).'
  - 'Page script may be hostile: no credential readable by script, escaping first,
    CSP second, CSRF independent of CORS, uploads on another site (.7).'
  design_notes: 'Roll-up of the seven children; no owned ledger rows. Decides: which
    properties of browsers, networks, caches and URLs the design must accept as given.

    Each property with its design response:

    - unknown runtime: core content and function as HTML, enhanced in layers (.1);

    - unstable page lifecycle: the server stays the arbiter, the page refreshes and
    saves on lifecycle events (.2);

    - non-atomic deployment: explicit compatibility window per contract; a breaking
    change goes expand, migrate, contract (.3);

    - caches beyond reach: cacheability declared per URL (.4);

    - unreliable network: graceful degradation, retry only what is safe (.5);

    - URL as public interface: stable, implementation-free, navigable state, no credential
    in a URL, the signed-file-URL exception (.6);

    - hostile page script: no credential readable by script, escaping first, CSP second,
    CSRF independent of CORS, uploads on another site (.7).

    Review fix M2 (with X6): the credential-in-URL rule and its single exception are
    stated here and detailed in .6.'
