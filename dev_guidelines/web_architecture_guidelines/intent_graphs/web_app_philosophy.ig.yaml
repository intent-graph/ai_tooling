- uid: TRANSVERSE.OPERABILITY.2
  name: Proportioned Testing
  intent: 'Tests are proportioned by one rule: test at the lowest level that can catch
    the failure, which usually yields many small tests, fewer coarse ones and very
    few end-to-end journeys. Logic that lives in the database is tested on a real
    engine of the production kind, isolated by rollback by default, with commit-time
    and concurrent behaviour tested with committing sessions in a disposable database;
    authorization is tested by denial.'
  epistemic_state: 'known: MD-05 | unvalidated: concurrency tests required by GUARD.2
    | gap: no row on concurrency testing'
  constraints:
  - Test at the lowest level that can catch the failure, and add the low-level test
    when a high-level test finds a bug; ratios are not prescribed.
  - Test logic placed in the database on a real engine of the production kind; never
    mock the database or use another engine for it.
  - Isolate each data test, by a rolled-back transaction by default; tests that mutate
    shared data run in a boundary that never commits.
  - Test behaviour that only shows at commit or between sessions with concurrent committing
    sessions in a disposable database, never a shared one.
  - Give every invariant enforced procedurally (serializable with retry, or a lock)
    a concurrent test, part of the default suite.
  - 'Test authorization by denial: each role and actor is refused what it may not
    do.'
  - Keep end-to-end tests few, on critical journeys.
  design_notes: "POSITIONS:\n  - P1 a pyramid: many small fast tests, some coarser,\
    \ very few high-level; ratios team-specific (L099).\n  - P2 if high-level tests\
    \ are fast, reliable and cheap, fewer low-level tests are needed (Fowler, SRC-198,\
    \ noted in L099).\n  - P3 test at the lowest level that can catch the failure;\
    \ when a high-level test finds a bug, add the low-level test (L396); end-to-end\
    \ tests few, on critical journeys (L397).\n  - P4 integration tests against a\
    \ real engine of the production kind, never mocks or another engine (L399); a\
    \ disposable database, each test isolated (L400); a test that mutates shared data\
    \ runs in a boundary that never commits (L567, MAINT).\n  - Read against FORCES.6\
    \ (J1): logic in the application tests in memory; logic in the database needs\
    \ a database to test (L042, L472 MAINT).\n\nFORCES:\nP1 and P3 serve fast, precise\
    \ feedback; their cost is many tests to write. P2 serves fewer tests when tooling\
    \ allows; it fails when high-level tests are slow or flaky (L397). P4 serves fidelity\
    \ (the constraints, isolation and functions are the real ones); its cost is a\
    \ running database in every test run.\n\nDECISION:\nP3 as the rule, P1 as its\
    \ usual result, P4 for every test that touches data.\n  - Proportion follows \"\
    the lowest level that catches the failure\" (L396). The pyramid is what that rule\
    \ usually yields (L099); ratios are not prescribed.\n  - In the MD-03 default\
    \ the database holds the business operations, the writer functions, the invariants\
    \ and the audit. Their low-level tests run on the real engine of the production\
    \ kind (L399). Each test is isolated: a rolled-back transaction by default (L400\
    \ gives it as its example). Logic tests on shared data run in never-committing\
    \ transactions (L567). Behaviour that only shows at commit or between sessions\
    \ (serialization failures and retries, lock waits, deferred constraints, the outbox)\
    \ is tested with concurrent committing sessions in a disposable database, never\
    \ a shared one (L567 governs shared environments; X4). They cover constraints,\
    \ writer functions, the actor pairing and the refusal of writes without an actor\
    \ (ACT.4).\n  - Every invariant that GUARD.2 enforces procedurally, under Serializable\
    \ with retry or under a lock, has a concurrent test. These concurrency tests are\
    \ part of the default test suite, not a gap (inferred from GUARD.2: a placement\
    \ whose correctness depends on concurrent behaviour needs a test of that behaviour).\n\
    \  - Backend product policy and request parsing are tested in memory (L042).\n\
    \  - Authorization is tested by denial: each role and actor is refused what it\
    \ may not do (GUARD.3); these denial tests are the first misuse-case tests the\
    \ threat model asks for (SECURITY, A06). Decided by MD-05, read visibility of\
    \ rows with per-user rules when several backends share the database (not settled\
    \ here). former recorded default (superseded): each backend filters these reads\
    \ from one shared written specification, with a shared denial-test suite every\
    \ backend runs. Database read functions that receive the verified actor are acceptable\
    \ when a per-user read rule must hold for two or more backends. The denial suite\
    \ does not cover roles that may SELECT the base tables: Before the maintainer\
    \ answered, the reporting role gets no SELECT on comment content or narrower-audience\
    \ comments, the operator role sees every row, and any other role that may SELECT\
    \ the base tables sees every row unless its own role is restricted.\n  - Contract\
    \ tests at the seams (stack judge); a few end-to-end tests on critical journeys\
    \ (L397).\n\nREJECTED:\n  - P2 as the default: acceptable when high-level tests\
    \ are measured fast, reliable and cheap (L099's note).\n  - A fixed ratio (for\
    \ example 70/20/10) as a rule: ratios are team-specific (L099).\n  - Mocking the\
    \ database, or another engine, for logic placed in the database: never (L399,\
    \ L103). In-memory tests stay for logic the backend owns.\n  - End-to-end-heavy\
    \ suites: never as the default (L397).\n\nPLACEMENTS REALIZED:\nno skeleton link\
    \ to a placement; rests on FORCES.6 (L042, L472), GUARD.2, GUARD.3, ACT.1 and\
    \ ACT.4, whose database realizations it tests.\n\nREVIEW FIXES:\nM2 and X4 (each\
    \ test isolated, rollback by default; commit-time and concurrent behaviour tested\
    \ with committing sessions in a disposable database; concurrency tests required\
    \ by GUARD.2 in the default suite; the gap kept only for the missing source row);\
    \ m7 and X1 (pending clause added to the state, one notation, default, fallback\
    \ and consequence stated)."
