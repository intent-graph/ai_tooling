    a store label hides the per-operation guarantee that matters (L043). P4'' for
    correctness: never (L476). P4'''': acceptable when the lock only avoids duplicate
    work and a duplicate is harmless, or is caught by a constraint.

    Realizes: ALLOCATION.GUARD.2 (invariants), ALLOCATION.GUARD.5 (concurrency control).
    Links proposed, not created: realizes ALLOCATION.GUARD.3 (database layer per consumer
    role) and ALLOCATION.RULES.5 (atomicity ends at the transaction).


    The default isolation level is decided by the stack graph (pig-web-defaults PIG-WEB-DATA.CONCURRENCY),
    judged in the Postgres data unit.'
