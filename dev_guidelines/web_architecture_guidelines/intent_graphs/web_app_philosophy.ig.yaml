- uid: TRANSVERSE.OPERABILITY.1
  name: Whole-Path Observability
  intent: Logs, metrics and traces are signals of one system, designed to be correlated
    by one id carried from the browser through the backend into the database transaction.
    Security events form their own record, apart from the business audit trail, and
    retention is a recorded decision per record type set by obligations, no shorter
    and no longer; secrets and unneeded personal data are never logged.
  epistemic_state: 'known | unvalidated: correlation id carried into the database
    transaction and audit rows (L371, L566, L658)'
  constraints:
  - Carry one correlation id per user interaction from the browser through the backend
    into the database transaction, stamped on every log record, span, client event
    and audit row.
  - Give database consumers outside the request path their identity and ticket id
    in the session.
  - Record validation failures, authentication successes and failures, authorization
    failures, session failures, application errors and use of higher-risk functions
    in a security event log with its own store, integrity and retention.
  - Treat changes to privileges, roles, credentials, grants and the role-to-actor
    pairing as security events; never put business data changes in the security log.
  - Record a retention decision per record type, set by legal, regulatory and contractual
    obligations, no shorter and no longer.
  - Never log or place in trace context anything secret or unneeded and personal.
  design_notes: "POSITIONS:\n  - P1 logs, metrics and traces are one system's signals,\
    \ designed to be correlated (L095), across browser, server and database (L096;\
    \ inferred synthesis).\n  - P2 always log validation failures, authentication\
    \ successes and failures, authorization failures, session failures, application\
    \ errors and use of higher-risk functions; data-change events are optional extras\
    \ (L098).\n  - P3 retention is a recorded decision set by legal, regulatory and\
    \ contractual obligations: no shorter, no longer (L048).\n  - Read against ACT.4\
    \ (J1): business history is mandatory, written by database triggers in the same\
    \ transaction, and kept apart from the security event log (L049, L392).\n\nFORCES:\n\
    P1 serves diagnosis across tiers; its cost is propagating context everywhere.\
    \ P2 serves detection of attacks. P3 serves accountability and privacy (L035)\
    \ against the convenience of keeping everything.\n\nDECISION:\nP1, P2 and P3,\
    \ with the two records apart.\n  - One correlation id per user interaction, carried\
    \ from the browser through the backend into the database transaction. It is stamped\
    \ on every log record, span and client event (L371, L382), and on audit rows (L658\
    \ requires a correlation id for agent actions). Carrying it into the transaction\
    \ alongside the actor (L566's transaction-local settings) is inferred; it reaches\
    \ the work MD-03 places in database functions.\n  - Database consumers outside\
    \ the request path are part of the path: operator and owner sessions carry their\
    \ identity and ticket id (L545; J1 access paths).\n  - The security event log\
    \ records P2's list (L098) and is a separate record with its own store, integrity\
    \ and retention (L049, L392). Business data changes stay out of it: the business\
    \ audit trail is the database's (ACT.4). Security-relevant changes (privileges,\
    \ roles, credentials, grants, the role-to-actor pairing) are security events:\
    \ they are data changes that L098 lists as \"use of higher-risk functionality\"\
    . L098's \"optional\" applies to the security log only, so there is no conflict\
    \ with ACT.4.\n  - Retention is a recorded decision per record type (application\
    \ logs, traces, security event log, audit trail), set by obligations, no shorter\
    \ and no longer (L048). Where no obligation exists, the decision still has to\
    \ be recorded; the period is set per project (open, by design).\n  - Nothing secret\
    \ or unneeded and personal is logged or placed in trace context (L036, L375).\n\
    \nREJECTED:\n  - Per-tier silos of logs, metrics and traces: never (L095).\n \
    \ - Data-change events in the security log as the business history: forbidden\
    \ by ACT.4 (application-only audit).\n  - Keeping logs indefinitely \"in case\"\
    : against L048 and L035; acceptable never without a recorded obligation.\n\nPLACEMENTS\
    \ REALIZED:\nconflicts ACT.4 (skeleton link: the security event log and the business\
    \ audit trail are kept apart). Rests on ACT.4's actor and role recording (J1 R1-3).\n\
    \nREVIEW FIXES:\nm4 (only business data changes stay out of the security log;\
    \ security-relevant changes are security events)."
