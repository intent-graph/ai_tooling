- uid: ALLOCATION.ACT.3
  name: Deferred and Scheduled Work
  intent: Inside the request go validation, authorization, every change atomic with
    what the user sees next, and the persisted intent of deferred work, in one transaction;
    core writes are never asynchronous. Foreign effects, work expected to last more
    than a few seconds or past the request timeout, fan-out and derived data are deferred
    to workers fed from the database-staged queue, or to scheduled work inside the
    database for pure data work.
  epistemic_state: 'known | unvalidated: the few-seconds threshold follows L601; a
    lower cut-off needs measured worker capacity'
  constraints:
  - 'Authority: backend (what is deferred) and database (staged intent, data schedules)'
  - 'Copies: the status resource shows the pending state'
  - 'Forbidden: deferring core writes; foreign effects inside the request, except
    ACT.2''s in-request phase'
  - 'Foreign mutations are deferred as ACT.2 places them: in a worker behind 202,
    except ACT.2''s in-request phase.'
  - 'Deferred: foreign effects, fan-out, derived data, and work expected to last more
    than a few seconds or past the request timeout; about 1 s stays the design target
    for interactive responses (FORCES.4), not the cut-off for deferral; a lower cut-off
    follows measured worker capacity.'
  - An operation that outlasts the request answers 202 with a status resource.
  - Every asynchronous stream states its staleness window and a convergence check.
  - In-process background tasks only for small tasks that may be lost.
  design_notes: "Positions: P1 inside the request what the user sees next (L601);\
    \ P2 separate worker processes (L406, L407); P3 scheduled work inside the database\
    \ (L604 MAINT); P4 asynchrony only for derived data and bulk jobs (L482 MAINT,\
    \ L545).\n\nForces: latency against correctness and scalability.\n\nDecision:\n\
    \  - Inside the request: validation, authorization, every change atomic with what\
    \ the user sees next, and the persisted intent of deferred work, in one transaction,\
    \ which is one function call when the change is a database operation (L601, MD-03).\
    \ Core writes are never asynchronous (L482, MAINT, max).\n  - (superseded by MD-09)\
    \ Deferred: foreign effects, work that would push the response past a few seconds\
    \ or the request timeout (MD-09) (L013, L271), fan-out, derived data. Foreign\
    \ mutations run as atomic phases in a worker behind 202; the one in-request exception\
    \ is ACT.2's: an outcome the user must see within a few seconds, under the request\
    \ timeout (MD-09), with the intent recorded by the database function first.\n\
    \  - Host: workers fed from the database-staged queue (L406, L407, L409); scheduled\
    \ pure data work inside the database (L604; JOB_HOST).\n  - An operation that\
    \ outlasts the request answers 202 with a status resource (L271, L602). Every\
    \ asynchronous stream states its staleness window and a convergence check (L482).\n\
    \nRejected: in-process background tasks: only for small tasks that may be lost\
    \ (L407). P3 for everything: not for Python logic, foreign effects, highly parallel\
    \ or OS-level work (L604).\n\nChanged (R3): in-request exception aligned with\
    \ ACT.2 (logic review M4).\n\nWould move it: duration, foreign effects, set-based\
    \ data work\n\nCorrected by MD-09 (re-audit under MD-08): deferral threshold is\
    \ work expected to exceed a few seconds or the request timeout (L601's wording);\
    \ 1 s stays the interactive-response target, not the cut-off. Rejected: a 1 s\
    \ cut-off: wins where measured synchronous-worker capacity on slow I/O is the\
    \ binding force."
