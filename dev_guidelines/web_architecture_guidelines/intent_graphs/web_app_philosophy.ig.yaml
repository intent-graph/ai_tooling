- uid: ALLOCATION.RULES
  name: Allocation Rules
  intent: 'Five rules turn forces and context into a placement and apply to every
    responsibility in the same order: who may decide at all (trust boundary), which
    end can complete it (end-to-end), one authority with safe copies, one core for
    every client, and atomicity ending at the transaction. The first two are the security
    and correctness vetoes of the forces.'
  epistemic_state: 'known | unvalidated: the order is a synthesis'
  constraints:
  - 'Apply the rules in order: RULES.3, RULES.2, RULES.1, RULES.4, RULES.5.'
  design_notes: 'Decision: roll-up. The rules apply to every placement in this order:
    RULES.3 (who may decide at all) → RULES.2 (which end can complete it) → RULES.1
    (one authority; copies carry staleness) → RULES.4 (one core for every client)
    → RULES.5 (atomicity ends at the transaction). The first two are the security
    and correctness vetoes of FORCES.'
