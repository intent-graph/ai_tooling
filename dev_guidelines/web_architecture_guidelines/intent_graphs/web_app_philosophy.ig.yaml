- uid: ALLOCATION.GUARD.3
  name: Authorization
  intent: 'Authorization has two layers divided by where the rule''s facts live: the
    database function that writes a column decides per-user write rules decidable
    from the stored row and the acting user; each backend decides product policy not
    stored in the data and who the user is; the database bounds every consumer by
    role. Row-level security is not used by default; simple reads are written by each
    backend directly, while reads that are sensitive, complex or shared, per-user
    visibility rules included, go through database functions.'
  epistemic_state: 'known: two layers per MD-01; write rules in writer functions (MD-03);
    read visibility per MD-05 | conflict: L619, L688 favour row security when several
    consumers share the database (MD-03)'
  constraints:
  - 'Authority: writer function for per-user write rules decidable from the row and
    the actor; backend for product policy not stored in the data and for identity;
    database per consumer role'
  - 'Copies: the backend''s check of per-user write rules (generated or tested, early
    feedback); the browser hides controls the user may not use (cosmetic)'
  - 'Forbidden: browser, agent client, model output, client hints; row security by
    default (MD-01); any consumer role owning tables or bypassing grants; a write
    without an actor, or with an actor its role may not assert'
  - Per-user write rules decidable from the stored row and the acting user are decided
    by the column's writer function; a backend's identical check is a generated or
    tested copy for early feedback.
  - 'Each backend decides product policy not stored in the data (product roles, plan
    limits, feature flags, workflow steps) and identity: one central mechanism, deny
    by default, object level, on every request from every client.'
  - Each consumer has its own role, neither owner nor an all-powerful role; grants
    say which API functions it may call and which tables and columns it may read;
    state columns are revoked from direct update so the writer function is the only
    path.
  - Functions read the acting user that the backend asserted for the transaction from
    its verified identity, treat it as a claim, refuse a write without an actor, check
    that the session role may assert that kind of actor (a backend an end user, an
    operator or owner role only itself), and record both the session role and the
    claimed actor.
  - No row-level security by default; acceptable only when the data model is simple,
    the scoping key is present in every table the policy covers, in practice composite
    primary keys led by that key, and no all-powerful administrator role must read
    or write across scopes.
  - 'Per-user read visibility (MD-05): simple reads that carry no logic (a basic select,
    a few joins) are written by each backend directly; a read that is sensitive, complex,
    high-impact, built by a function, or an abstraction several backends share goes
    through a database function that receives the verified actor, and per-user visibility
    rules count as sensitive reads. Roles: the reporting role reads comment content
    and comments with a narrower audience than their target only through database
    functions; the operator role (administrators, all-powerful by the maintainer''s
    model) sees every row; any other role that may read the base tables sees every
    row unless its own role is restricted.'
  examples:
  - A draft is visible only to its author (per-user read rule; comments on restricted
    targets are covered by the same rule).
  - 'Only the assignee may close a task (per-user write rule decidable from the stored
    row and the acting user: decided by the writer function).'
  design_notes: "Positions: P1 backend only (L020, L620, L305, L306); P2 the database\
    \ enforces through roles and row-level security (L619, L620, L688); P3 two layers:\
    \ database permissions limit objects, application permissions decide business\
    \ actions (L468 MAINT, L620, L128).\n\nForces: security against changeability\
    \ of policy.\n\nDecision: P3, two layers (MD-01; L468, MAINT, max). With several\
    \ consumers the work divides by where the rule's facts live (R1-1; inferred from\
    \ MD-03 and L608).\n  - The writer function decides per-user write rules that\
    \ can be decided from the stored row and the acting user (author, owner, assignee:\
    \ \"only the assignee may close a task\") and that must hold for every consumer\
    \ (MD-03, L596, ACT.1). A backend's identical check is a copy for early feedback,\
    \ generated or tested under RULES.1.\n  - Each backend decides product policy\
    \ that is not stored in the data: product roles, plan limits, feature flags, workflow\
    \ steps; and who the human or agent is. One central mechanism per backend, deny\
    \ by default, object level, on every request from every client (L020, L305, L306,\
    \ L644).\n  - The database decides per consumer: each consumer has its own role,\
    \ neither owner nor superuser. Grants say which API functions it may EXECUTE,\
    \ which tables and columns it may SELECT, and that it writes no table directly\
    \ except under DB_API's exception; state columns are revoked from UPDATE so the\
    \ writer function is the only path (L468, L310, L596). This bounds what every\
    \ backend, BI tool, console and script can do whatever its code.\n  - Functions\
    \ run with their owner's rights only where they must write tables the caller cannot.\
    \ They read the acting user from a transaction-local setting (L311, L566). That\
    \ actor is the consumer's claim, not a verified fact (R1-3): functions refuse\
    \ a write without an actor, check that the session role may assert that kind of\
    \ actor (a backend an end user, an operator or owner role only itself; default-context\
    \ table), and record both the session role and the claimed actor.\n  - Row-level\
    \ security is not used by default (MD-01). It is acceptable only when the data\
    \ model is simple, the scoping key is present in every table the policy covers,\
    \ in practice composite primary keys led by that key, and no all-powerful administrator\
    \ role must read or write across scopes (MD-01).\n\nFormerly undecided clause\
    \ (Q1): `decided by MD-05, read visibility of rows with per-user rules when several\
    \ backends share the database`. Read visibility of rows that carry per-user rules\
    \ (\"a draft is visible only to its author\"; comments on restricted targets are\
    \ covered by the same rule). Under MD-01 as written each backend filters reads,\
    \ one copy per backend, against RULES.4 (L633). Writes are not in the question:\
    \ they are settled above under MD-03.\n  - former recorded default (superseded):\
    \ each backend filters these reads from one shared written specification, with\
    \ a shared denial-test suite every backend runs (X1).\n  - Fallback kept, not\
    \ forbidden: database read functions that receive the verified actor are acceptable\
    \ when a per-user read rule must hold for two or more backends (X1). Under MD-03\
    \ several backends share the database by default, so this condition is always\
    \ met: the fallback is available wherever MD-03's default holds. The actor is\
    \ verified by the backend that asserts it and is a claim to the database (R1-3).\n\
    \  - Consequence, under either position: Before the maintainer answered, the reporting\
    \ role gets no SELECT on comment content or narrower-audience comments, the operator\
    \ role sees every row, and any other role that may SELECT the base tables sees\
    \ every row unless its own role is restricted. No statement in this guideline\
    \ claims stronger visibility than this (X1).\n\nTension (MD-01 against evidence):\
    \ L619 and L688 call for row security when several applications or agents read\
    \ the database, which MD-03 makes the default. MD-01 overrides; the residual risk\
    \ is that a consumer with SELECT on a table sees every user's rows, and that each\
    \ backend's read filter is the only per-user gate on reads.\n\nRejected: P1 without\
    \ the database layer; wins never (L468). P2 as sole authority: loses product policy\
    \ that lives in application code (L468); row-level security wins only under MD-01's\
    \ conditions. The backend as authority for per-user write rules decidable from\
    \ the row: two authorities for one rule (R1-1); the backend keeps a tested copy.\n\
    \nChanged (R1): division of work with several consumers (MD-03); row security\
    \ per MD-01 (F1 closed); new clause Q1.\n\nChanged (R3): Q1 notation unified;\
    \ former recorded default (superseded) and fallback reworded; comments covered;\
    \ visibility of SELECT-capable roles stated (X1).\n\nChanged (R2): one authority\
    \ per per-user write rule, the writer function; backend check is a tested copy;\
    \ backend owns product policy not stored in data (R1-1). Actor treated as a claim,\
    \ pairing checked, writes without actor refused (R1-3). Q1 narrowed to read visibility,\
    \ decided by MD-05 (R1-2).\n\nWould move it: MD-01's three conditions (row security\
    \ becomes acceptable); Q1's answer (read visibility into read functions)\n\nRecommendation\
    \ for the open clause: database read functions that receive the verified actor,\
    \ for data with per-user visibility; each backend filtering stays acceptable for\
    \ data without per-user rules. former recorded default (superseded) if unanswered:\
    \ each backend filters from one shared written specification with a shared denial-test\
    \ suite. Consequence for roles that read the base tables, Before the maintainer\
    \ answered: the reporting role gets no read access to comment content or narrower-audience\
    \ comments; the operator role sees every row; any other role sees every row unless\
    \ its own role is restricted.\n\nDecided (MD-05): simple reads that carry no logic\
    \ are written by each backend directly; a read that is sensitive, complex, high-impact,\
    \ built by a function, or an abstraction several backends share is wrapped in\
    \ a database function; per-user visibility rules are sensitive reads, so the former\
    \ fallback (database read functions that receive the verified actor) is the rule\
    \ for them. The earlier recommendation (read functions for data with per-user\
    \ visibility, backend filtering acceptable for data without) and the former recorded\
    \ default (each backend filters from one shared specification with a denial-test\
    \ suite) are superseded. The interim comment rule is decided under MD-05: the\
