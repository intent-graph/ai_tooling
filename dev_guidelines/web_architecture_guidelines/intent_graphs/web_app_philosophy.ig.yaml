- uid: INTERACTION
  name: Interaction
  intent: 'The interaction tier lets humans and agents see, edit and discuss the data
    through clients the team does not control, and decides nothing durable: it holds
    copies for feedback and latency, and every decision reaches a backend. Its four
    branches cover a perceivable interface, collaboration on shared data, agents as
    bounded users, and the properties of the web environment accepted as given.'
  epistemic_state: 'known: MD-05'
  constraints:
  - The interaction tier decides nothing durable; every decision reaches a backend
    (RULES.3).
  - Agents are users through an adapter on the same core, never a second implementation
    of the rules.
  design_notes: 'Roll-up of the four children; no owned ledger rows. Decides: how
    users, human or agent, see, edit and discuss the data through clients the team
    does not control.

    Children at claim:

    - VISUALIZE: server-rendered HTML that works for everyone, people with disabilities
    included, enhanced where the browser supports it; values formatted for the reader
    by the tier that renders them.

    - COLLABORATE: pages correct on plain load, push as a hint, conflicts and visibility
    per the allocation placements; comments are entities with their own abilities
    and never more visible than their target on any surface the application serves;
    roles that may SELECT the base tables see what their grants allow, so their comment
    grants are restricted.

    - AGENT: agents are users through an adapter on the same core, with audience-bound
    tokens, narrow scopes, few purpose-specific tools, quotas, server-side audit,
    and no decision of their own.

    - ENVIRONMENT: seven properties accepted as given and designed for: unknown runtime,
    unstable page lifecycle, version skew, unrecallable caches, unreliable network,
    public URLs, hostile page script.

    Grounds: RULES.3 (L019, the browser cannot hold deciding checks).

    Realizes, through its children: ALLOCATION.PRESENT.1 to .3, GUARD.3, GUARD.5,
    GUARD.6, ACT.4, RULES.3, RULES.4, DERIVE.3. No conflict with any J1 placement.

    Inherited open clause: decided by MD-05, read visibility of rows with per-user
    rules when several backends share the database (from ALLOCATION.GUARD.3, through
    COLLABORATE).

    Maintainer decisions: MD-01 respected (no row security by default), MD-03 shapes
    AGENT and COLLABORATE, MD-02 reaches the unit through ENVIRONMENT.3.

    Evidence gaps of the branch (5): VISUALIZE rests on one weak row (L005) and the
    conformance level is not grounded; L682''s sequence-id cursor contradicts L594;
    L014''s fallacies list read through a T4 copy; L648 applied to agents the application
    runs or serves is inferred; L687''s leak-surface list is a synthesis.'
