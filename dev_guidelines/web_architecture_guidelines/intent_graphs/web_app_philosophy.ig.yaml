- uid: INTERACTION.ENVIRONMENT.7
  name: Hostile Page Script
  intent: 'Script running in the page holds the application''s privileges, so the
    design assumes it may be hostile: no long-lived credential is readable by script
    (an opaque HttpOnly, Secure, SameSite cookie), output is escaped by default with
    CSP as the second layer, CSRF defence stands independent of CORS, and user uploads
    are served from a distinct registrable domain. No check that grants access or
    protects integrity runs in the page.'
  epistemic_state: 'known | unvalidated: rendering of model output as untrusted inferred
    from L644'
  constraints:
  - 'No long-lived credential is readable by page script: the session cookie of ALLOCATION.GUARD.4
    is opaque and unreadable by script.'
  - Output is escaped by default by the templates; CSP is the second layer, not the
    first.
  - XSS prevention comes before CSRF defence, because XSS defeats every CSRF defence.
  - CORS is not access control; CSRF defence stands on its own.
  - User-uploaded content is served from a distinct registrable domain, so the same-origin
    policy contains any script in an upload.
  - Content written by other users or by models (comments, agent output) is untrusted
    wherever it is rendered.
  - No check that grants access or protects integrity runs in the page (RULES.3).
  design_notes: 'Decides: how the design limits what script running in the page with
    the application''s privileges can do.

    Rows: L024, L025, L026, L027, L028. Cited: L019, L644, GUARD.4.

    Positions:

    - Credentials: P1 assume malicious script has the application''s privileges, so
    no long-lived credential is readable by script (L024); P2 tokens in script-readable
    storage (acceptance rows L320, L321, rejected by GUARD.4).

    - XSS defence: P3 escaping by default in output encoding and templates first,
    CSP as a second layer (L026), XSS prevention as a precondition to CSRF defence
    (L025); P4 CSP as the primary defence (rejected in L026).

    - Cross-origin: P5 CORS only relaxes the read block and is not access control;
    CSRF defence needed independently (L027); P6 CORS treated as access control (rejected
    in L027).

    - Uploads: P7 user-uploaded content from a distinct registrable domain (L028,
    majority); P8 a different host of the same site (the weaker T1 in L028).

    Forces: P1, P3, P5, P7 serve the integrity of the user''s data and session against
    injected script, at the cost of cookie-based sessions, template discipline, CSRF
    tokens and a second domain; P2, P4, P6, P8 serve convenience and leave a successful
    injection with more reach.

    Decision: P1, P3, P5, P7. Rendering of model output as untrusted is inferred from
    L644.

    Rejected: P2: wins only when no backend is possible (GUARD.4''s condition, L314).
    P4: wins never as the first layer. P6: wins never. P8: the weaker T1 states only
    "different host" and does not address cookie and same-site reach shared within
    one registrable domain (inferred); no condition under which it wins was found
    in the evidence.

    Realizes: constrains ALLOCATION.RULES.3 (the browser cannot hold deciding checks);
    ALLOCATION.GUARD.4 (credentials out of script reach; second link inferred, the
    skeleton draws none).

    Hand-offs: CSP and security headers (PIG-WEB-TRANSVERSE.SECURITY.3); CSRF defence
    (PIG-WEB-LOGIC.SECURE.3); CORS (PIG-WEB-LOGIC.EXPOSE.5); upload serving (PIG-WEB-LOGIC.PROCESS.6).'
