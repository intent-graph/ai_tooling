- uid: ALLOCATION.ACT.4
  name: Audit and History
  intent: Business history is written by the database in the same transaction as the
    change, recording both the consumer's role, which the database verifies, and the
    actor the consumer claims; the security event log is a separate record. The backend
    supplies the actor and any business event that row changes do not express.
  epistemic_state: 'known: MD-03 | gap: L684 cites no source; evidence for the trigger
    placement is inferred (L627)'
  constraints:
  - 'Authority: database (history, transitions logged by writer functions); backend
    supplies actor and business events; a separate log sink holds security events'
  - 'Copies: none'
  - 'Forbidden: application-only audit; audit only in a model transcript; an actor
    taken from a client-supplied id; a write without an actor; an actor the session
    role may not assert'
  - History is written by triggers into append-only history tables in the same transaction
    as the change; writer functions log each transition.
  - Record both the session role and the claimed actor; refuse a write with no actor;
    check that the session role may assert that kind of actor (a backend an end user;
    operator and owner roles only themselves, with the ticket id for owner-run jobs).
  - Agent actions record acting identity, delegating subject, operation, correlation
    id and outcome, on the server; agent-originated writes are marked in the data.
  - Keep the security event log as a separate record with its own store, integrity
    and retention.
  design_notes: "Positions: P1 written where writes converge, atomically, actor passed\
    \ in (L627, L684, L212, L566); P2 application-level history (L627, L208); P3 two\
    \ separate records, security event log and business audit trail (L049, L392).\n\
    \nForces: correctness (completeness) against changeability (hidden behaviour,\
    \ testability).\n\nDecision: P1 and P3; audit is the database's (MD-03).\n  -\
    \ Business history is written by database triggers into append-only history tables,\
    \ in the same transaction as the change (L627, L212). The writer functions log\
    \ each transition (L596).\n  - Actor (R1-3): each history row records both the\
    \ session role, which the database verifies, and the claimed actor from the transaction-local\
    \ setting (L566 MAINT, L311), which the consumer sets. Triggers and writer functions\
    \ refuse a write with no actor, and check that the session role may assert that\
    \ kind of actor (default-context table: a backend may assert an end user; operator\
    \ and owner roles only themselves, with the ticket id for owner-run jobs, L545).\n\
    \  - Agent actions carry acting identity, delegating subject, operation, correlation\
    \ id and outcome, on the server (L658); agent-originated writes are marked in\
    \ the data (L659).\n  - Business events that row changes do not express (reason,\
    \ intent) are passed by the backend to the function, which records them in the\
    \ same transaction.\n  - The security event log is a separate record with its\
    \ own store, integrity and retention (L049, L392).\n\nEvidence note (F12): L684\
    \ is marked grounded in the ledger with no source; flagged to the ledger owner.\
    \ Until fixed, the verdict rests on MD-03, L627 (inferred) and L212 (grounded\
    \ for the mechanism).\n\nRejected: P2 alone: wins when only one application writes\
    \ and business events matter more than row changes (L627); never in the MD-03\
    \ default.\n\nChanged (R1): decided by MD-03; evidence note (F12); label (F6).\n\
    \nChanged (R2): session role and claimed actor both recorded; writes without actor\
    \ refused; actor pairing checked (R1-3).\n\nWould move it: nothing in the default\
    \ (several writers by MD-03)"
