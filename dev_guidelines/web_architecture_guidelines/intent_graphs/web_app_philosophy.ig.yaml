    \ from L517 is counted once, at PIG-WEB-DATA.INTERFACE.1).\n  - Browsers and agents\
    \ never connect; they reach data through a backend.\n  - A consumer outside the\
    \ owning team gets the function API as a published contract under L517's rules;\
    \ a service interface wins where that team needs independent deploys from the\
    \ database (L622, L044).\n\nRejected:\n  - P1: wins when one backend is truly\
    \ the only consumer and the team wants no SQL interface (L044, research consensus).\
    \ Tension recorded: MD-03 sets the shared database as the default against L044\
    \ and SRC-216; the doctrine mitigates with the function contract, constraints\
    \ and roles (L515).\n  - P3: views bind consumers to a name and exact shape with\
    \ nothing to absorb change (L516). Wins when a CRUD-dominant application is served\
    \ by a database-as-API server with a strong Postgres team (L618).\n  - P4 for\
    \ writes by any consumer: bypasses the operations MD-03 places in the database.\n\
    \nChanged (R1): function API is the default, not the two-backend exception (MD-03);\
    \ reporting resolved (F5).\n\nChanged (R2): direct-write exception aligned with\
    \ DB_API (R1-5).\n\nChanged (R3): breaking-change condition per X2, departure\
    \ counted at PIG-WEB-DATA.INTERFACE.1.\n\nWould move it: a single consumer (P1\
    \ possible); a consumer outside the team needing independent deploys (service\
    \ interface); team SQL skill"
