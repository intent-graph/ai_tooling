- uid: LOGIC.EXPOSE
  name: Backend Interface
  intent: 'Each backend offers one HTTP interface over its one core: server-rendered
    HTML whose links and forms are the contract for browsers, and a resource-oriented
    structured-data interface plus an agent adapter on the same use cases for programs
    and agents. Every interface description consumers read is kept in sync with the
    implementation by process, and repeated requests are safe.'
  epistemic_state: known (roll-up)
  constraints:
  - Browsers get server-rendered HTML whose links and forms are the contract (PRESENT.1,
    LOGIC.EXPOSE.3).
  - 'Programs and agents get a resource-oriented structured-data interface on the
    same use cases, described machine-readably and kept in sync with the implementation
    by process: one origin per fact, the other side generated or conformance-checked,
    a CI gate that fails on drift; the origin direction is recorded per project (MD-02).
    An agent protocol adapter, where offered, sits on the same core.'
  - 'MD-02 covers every interface description consumers read: "always in sync by process"
    and the compatibility window apply to the HTTP description, to the database function
    API catalogue and to the agent tool surface.'
  - Every endpoint uses HTTP's defined meanings (LOGIC.EXPOSE.1), and every request
    is self-contained (LOGIC.EXPOSE.2).
  - 'Repeated requests are safe: safe methods change nothing, PUT and DELETE are idempotent,
    non-idempotent mutations offered to agents carry an idempotency key that the database
    function records with the effect (GUARD.6).'
  examples:
  - An MCP server's tool list and schemas are an agent tool surface description.
  design_notes: 'Decision: each backend offers one HTTP interface over its one core.

    Positions:

    owns no row; roll-up of LOGIC.EXPOSE.1 to .3. Framing from the placements: under
    MD-03 the database function API is the contract to the data for backends, consoles
    and scripts (RECORD.2); the backend''s interface is the contract for browsers
    and agents, and for a consumer outside the team that needs deploys independent
    of the database (RECORD.2''s moving condition).

    Forces: security and correctness of what callers can do (safe and idempotent semantics,
    GUARD.6); changeability (independent evolution of client and server); readability
    for every client kind, human, program and agent (L634).

    Rejected:

    browsers or agents reaching the database directly: never (RECORD.2). A separate
    rule-bearing core per client kind: never (RULES.4).

    Realizes: RECORD.2 (the backend half: the interface through which browsers and
    agents reach data); GUARD.6 (safe and idempotent request semantics, keys passed
    to the database).

    Maintainer decision cited: MD-02 (interface documentation always in sync; origin
    per project), extended to every interface description consumers read (X7).

    Skeleton note: the intent text of the realizes link to RECORD.2 predates MD-03;
    under MD-03 the backend interface is the route for browsers and agents, and for
    an outside consumer that needs deploys independent of the database.'
