- uid: ALLOCATION.GUARD.1
  name: Validation
  intent: Input is parsed into the most precise type once, at every point where data
    enters a process from outside its type system, and trusted inside that process;
    meaning is checked by the tier that holds the state. At the function API the parameter
    types and domains are the precise types, so every consumer's input is checked
    by the database.
  epistemic_state: 'known | unvalidated: the reconciliation of P1 and P2 is a synthesis'
  constraints:
  - 'Authority: backend (parsing, request-level meaning) and database (function parameters,
    meaning about stored data)'
  - 'Copies: browser checks, for feedback'
  - 'Forbidden: browser, agent client or model output as the deciding check'
  - 'Parse at every entry: browser to backend, agent to backend, queue or stored payload
    to worker, any consumer to a database function.'
  - 'Meaning sits with the tier that holds the state: constraints and functions for
    stored rows, the backend for rules needing the end user or policy.'
  - Checks in the browser or an agent client are feedback copies, generated from or
    tested against the authority.
  design_notes: 'Positions: P1 re-validate at every trust crossing, internal transports
    and stored records included (L612, OWASP); P2 parse once at the boundary into
    a precise type and trust it after (L484); P3 split by kind: syntax at the edge,
    meaning with the state (L611).


    Forces: security and correctness against latency of feedback and changeability.


    Decision: parse at every point where data enters a process from outside its type
    system (browser to backend, agent to backend, queue or stored payload to worker,
    any consumer to a database function) into the most precise type, once, and trust
    the type inside that process (L484; L612). At the function API the precise types
    are the parameter types and domains, so every consumer''s input is checked by
    the database (MD-03, L485). Meaning sits with the tier that holds the state: database
    constraints and functions decide rules about stored rows (GUARD.2), the backend
    decides rules that need the end user or policy (L611). Checks in the browser or
    an agent client are feedback copies, generated from or tested against the authority
    (L019, RULES.1).


    Reconciliation: P1 and P2 disagree only on what a boundary is; taking every deserialisation
    point as a boundary gives both.


    Changed (R1): function API as a crossing (MD-03); label inferred in the matrix
    (F6).


    Would move it: tiers with different owners or trust levels (more crossings)'
