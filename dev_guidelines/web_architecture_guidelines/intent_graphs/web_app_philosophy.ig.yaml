- uid: ALLOCATION.ACT.1
  name: Business Rules and State Transitions
  intent: 'Everything that must hold whoever writes is in the database: every operation
    that changes several tables as one business operation is one database function,
    and each state column has exactly one authoritative writer function that every
    entry point routes through. The backend keeps workflow orchestration across operations,
    product policy not stored in the data, external calls, presentation, sessions
    and authentication.'
  epistemic_state: 'known: MD-03, L584 | conflict: L215, L066 (research, application
    first)'
  constraints:
  - 'Authority: database for operations, transitions, invariants and per-user write
    rules decidable from the row; backend for workflow, product policy not stored
    in the data and external calls'
  - 'Copies: the backend''s check of per-user write rules (generated or tested); the
    browser previews which actions are allowed (feedback)'
  - 'Forbidden: multi-table writes composed in a backend; a backend transaction wrapping
    several API calls; business rules in the browser, agent adapters or prompts; a
    second writer of a state column, owner-run jobs included unless a recorded exception'
  - Multi-table operations are database functions.
  - Each state column has exactly one authoritative writer function, which logs each
    transition; consumer roles hold no direct update right on state columns or direct
    writes on tables with multi-table effects.
  - Per-user write rules decidable from the stored row and the acting user are decided
    by the writer function; a backend's check is a generated or tested copy.
  - One business operation is one function call in its own transaction (ALLOCATION.RULES.5).
  - Owner-run jobs change a state column only through its writer function, or as a
    recorded exception under the data-job checklist, with the operator and ticket
    id set as actor.
  - External calls never run inside a database transaction; they stay in the backend.
  design_notes: "Positions: P1 application first; profile, move proven hot spots to\
    \ SQL; the use-case layer owns the transaction (L215, L066, L226); P2 split by\
    \ kind, middle zone disputed (L214); P3 database behind a cost-benefit gate, with\
    \ a listed in-database band and one writer per state column (L527, L528, L584,\
    \ L596, all MAINT); P4 thick database, SmartDB (L616, L617).\n\nForces: correctness\
    \ across several writers, round trips and lock time (L614) against changeability\
    \ (testability, tooling, skill: L042, L472).\n\nDecision: P3, with MD-03 meeting\
    \ L527's gate by default (reuse by two or more consumers).\n  - Database: everything\
    \ that must hold whoever writes: constraints and multi-row invariants (GUARD.2);\
    \ every operation that changes several tables as one business operation, as one\
    \ database function (L584, MD-03); state transitions, each state column with exactly\
    \ one authoritative writer function that every entry point (backends, consoles,\
    \ ingestion, agents through a backend) routes through and that logs each transition\
    \ (L596); per-user write rules decidable from the stored row and the acting user\
    \ (author, owner, assignee), decided by that writer function, with any backend\
    \ check a generated or tested copy (R1-1); set-based algorithms over large data\
    \ (L528, L613).\n  - Owner-run jobs (R1-6): the owner role bypasses grants and\
    \ column revokes, but not constraints or triggers (GUARD.2). A data job that changes\
    \ a state column calls its writer function, or is a recorded exception under L545's\
    \ checklist, with the operator and ticket id set as actor (R1-3).\n  - Backend:\
    \ workflow orchestration across operations, product policy not stored in the data\
    \ (product roles, plan limits, feature flags, workflow steps: R1-1), external\
    \ calls, presentation, sessions and authentication (L528's application half).\n\
    \  - Unit of work (R1-4): one business operation is one function call in its own\
    \ transaction; a backend never opens a transaction around several API calls. A\
    \ step that must be atomic with another is a new business operation, so a new\
    \ function, which may call other domains' published functions in the same transaction\
    \ (X3); direct access to another domain's tables is forbidden. A workflow across\
    \ operations advances through state columns and the outbox (ACT.2), each step\
    \ idempotent (GUARD.6). L066's \"one boundary per operation\" holds, with the\
    \ function as its owner (L584).\n  - Enforcement: consumer roles hold no UPDATE\
    \ on state columns and no direct write on tables with multi-table effects; the\
    \ writer functions do (L596; F8).\n  - L584 stands (MD-03); L527, L528 and L596\
    \ are the max choice.\n\nCosts weighed (F8): one round trip per operation instead\
    \ of one per statement (L614), and locks held for one call instead of across round\
    \ trips, which also lowers retries under Serializable (inferred); against that,\
    \ tests need a live database (L042, L472) — already true for any use case whose\
    \ invariants the database guards (GUARD.2) — and tooling and onboarding costs\
    \ (L472), paid with versioned migrations and CI against a live database (FORCES.6).\n\
    \nTension (MD-03 against evidence): research puts domain logic in the application\
    \ first, profiling hot spots into SQL (L215, Fowler, T2), and keeps the transaction\
    \ boundary in the use-case layer (L066); the doctrine's heavier-database position\
    \ is what L214 calls the disputed middle zone. MD-03 decides it for this guideline.\n\
    \nRejected:\n  - P1: wins when one backend is the only writer, the team's SQL\
    \ skill is low (L041), and policy changes faster than migrations can follow (L215).\n\
    \  - P4 (workflow and external calls in the database too): external calls cannot\
    \ run inside a database transaction (L234) and stay in the backend (L528).\n\n\
    Changed (R1): re-judged under MD-03; the verdict against L584 is withdrawn; costs\
    \ weighed (F8); column privileges as enforcement (F8).\n\nChanged (R2): per-user\
    \ write rules in the writer function, backend product policy defined (R1-1); one\
    \ operation, one call, one transaction, no wrapping (R1-4); owner-run jobs through\
    \ the writer function or a recorded exception (R1-6).\n\nChanged (R3): cross-domain\
    \ composition through published functions (X3).\n\nWould move it: a single consumer\
    \ with low SQL skill (P1); latency-critical multi-statement operations reinforce\
    \ the database placement"
