- uid: INTERACTION.ENVIRONMENT.1
  name: Uncontrolled Client Runtime
  intent: The design copes with browsers of unknown capability, speed and script completion
    by delivering core content and function as HTML that works without the latest
    capabilities, enhanced with CSS and JavaScript where supported. Everybody is a
    non-JavaScript user until the script has loaded, so the core read and write paths
    work as forms and links, and no feature works in only one browser, OS or device
    class.
  epistemic_state: known
  constraints:
  - Core read and write paths work as HTML forms and links.
  - Enhancement is added by feature detection, in loosely coupled layers, and fails
    without taking the core down.
  - No feature works in one browser, OS or device class only.
  - Client-rendered islands, where the rendering placement admits them under its island
    criteria, sit inside a page whose surrounding content and navigation still work
    as HTML.
  design_notes: 'Decides: how the design copes with browsers of unknown capability,
    speed and script completion.

    Rows: L002, L003, L004. Cited: L253, L016.

    Positions: P1 design for a range of support: core content and function as HTML
    that works without the latest capabilities, enhanced with CSS and JavaScript where
    supported, layers loosely coupled (L002, L003), no single-browser feature (L004);
    P2 one target runtime, core function requiring script (the client-rendered application,
    L253, as the default product shape).

    Forces: P1 serves everyone''s ability to reach the data (everybody is a non-JavaScript
    user until the script has loaded, L003) and interaction latency through a small
    script budget (L016), at the cost of building the HTML path first; P2 serves rich
    interaction and one code path, at the cost of a blank or broken page whenever
    script is late, blocked or failing.

    Decision: P1 (consensus, T1 and T2). The island rule is inferred from PRESENT.1.

    Rejected: P2 as the default: wins only where most of the product meets L253''s
    criteria (PRESENT.1''s condition); even then no feature is limited to one browser,
    OS or device class (L004).

    Realizes: ALLOCATION.PRESENT.1 (the HTML-first rendering the placement gives the
    backend, enhanced in the browser).

    Hand-offs: feature detection and lifecycle mechanics (PIG-WEB-INTERACTION.ENVIRONMENT.1);
    rendering technique per page (PIG-WEB-INTERACTION.VISUALIZE.1).'
