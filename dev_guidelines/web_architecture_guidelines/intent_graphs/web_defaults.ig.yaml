- uid: PIG-WEB-INTERACTION.AGENT
  name: Agent Surface
  intent: Agents reach the application through one HTTP core described by OpenAPI
    and kept always in sync, with an MCP adapter for third-party agent hosts, over
    OAuth. An agent has its own identity and acts for a user with both recorded; irreversible
    or external effects are approved by the owning user on the application's own page
    and checked on the server; responses and quotas are shaped for agent callers.
  epistemic_state: 'known | unvalidated: moving specifications (.1 to .3)'
  constraints:
  - 'Surface and Protocol: one HTTP core described by OpenAPI, always in sync (MD-02),
    with an MCP adapter over it for third-party agent hosts whose tool list and schemas
    have one origin, a CI drift gate and additive evolution under the compatibility
    window; a stateless surface over OAuth.'
  - 'Discovery and Registration: protected-resource metadata, verifiable client identity,
    client ID metadata documents.'
  - 'Identity and Delegation: agents with their own identity acting for a user, both
    recorded, short-lived credentials with an owner, sender-constrained tokens wherever
    the client can hold a key, and consequential operations of bearer-only clients
    only through server-held approval.'
  - 'Approval and Injection Defense: irreversible or external effects approved by
    the owning user on the application''s own page and checked on the server, credentials
    collected out of band, structural injection defence.'
  - 'Agent-Shaped Responses and Limits: problem-detail errors, agent-shaped responses,
    quotas per agent within the user''s allowance, and scarce-goods flows that a human
    completes or agents are excluded from.'
  design_notes: 'Decides: how agents reach, identify themselves to, act through and
    are limited by the application.

    Rows: none (roll-up).

    Decision: roll-up of .1 to .5. One HTTP core described by OpenAPI, always in sync
    (MD-02), with an MCP adapter over it for third-party agent hosts whose tool list
    and schemas have one origin, a CI drift gate and additive evolution under the
    compatibility window; a stateless surface over OAuth (.1); protected-resource
    metadata, verifiable client identity, client ID metadata documents (.2); agents
    with their own identity acting for a user, both recorded, short-lived credentials
    with an owner, sender-constrained tokens wherever the client can hold a key (MD-09)
    (.3); irreversible or external effects approved by the owning user on the application''s
    own page and checked on the server, credentials collected out of band, structural
    injection defence (.4); problem-detail errors, agent-shaped responses, quotas
