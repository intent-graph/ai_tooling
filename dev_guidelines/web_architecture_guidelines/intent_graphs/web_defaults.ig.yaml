- uid: PIG-WEB-TRANSVERSE.SECURITY
  name: Security Defaults
  intent: Security is verified against ASVS 5.0 at a recorded level, with HTTPS terminated
    at the proxy, a strict nonce-based CSP rolled out report-only first, secrets held
    in a managed store per consumer role (file fallback until one exists), and a pinned,
    scanned supply chain with signed SLSA Build L3 provenance. The point is that each
    security property is testable and has one owner.
  epistemic_state: 'known | gap: owns no row (roll-up)'
  constraints:
  - ASVS 5.0 as the verifiable catalogue at a recorded level (Level 2 by default,
    grounded in the ASVS 5.0 text).
  - HTTPS terminated at the proxy, HSTS with a long max-age on the application's host,
    includeSubDomains once its subdomains serve HTTPS, preload only as a recorded
    decision.
  - a strict nonce-based CSP rolled out report-only first, plus a small header baseline.
  - secrets held in a managed store, per consumer role, rotated and audited, with
    a file fallback in force until a store is added on self-managed hosting (MD-06).
  - dependencies pinned with hashes, an SBOM scanned continuously, signed provenance
    at SLSA Build L3 verified before deploy, Build L2 acceptable when the build platform
    cannot isolate runs.
  design_notes: 'Rows: none (roll-up).

    Decision (lead): the roll-up of its five children: ASVS 5.0 as the verifiable
    catalogue at a recorded level (Level 2 by default, grounded in the ASVS 5.0 text);
    HTTPS terminated at the proxy, HSTS with a long max-age on the application''s
    host, includeSubDomains once its subdomains serve HTTPS, preload only as a recorded
