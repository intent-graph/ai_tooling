- uid: PIG-WEB-ALLOCATION.DB_API
  name: Database Function API
  intent: 'The default contract to the data is a function API in a dedicated Postgres
    schema: every multi-table operation and state transition is a function, each consumer
    role gets EXECUTE on the functions it uses and no write on base tables, and views
    are never contract objects. This lets the database owner change internals without
    redeploying consumers (MD-03).'
  epistemic_state: 'known: MD-03 | conflict: views as contract (L187, L518) rejected
    in favour of L516 (MAINT)'
  constraints:
  - A dedicated API schema of functions; each consumer role has EXECUTE on the functions
    it uses and nothing to write on base tables.
  - State columns are written only by their writer functions.
  - 'Writes go through functions: every multi-table operation and every state transition
    (MD-03).'
  - A direct single-table write grant is acceptable only for a table that one consumer
    writes and that has no state column or multi-table effect.
  - Simple reads may query base tables under SELECT grants; use read functions where
    a read must apply a rule.
  - A procedure only where transaction control is needed.
  - Evolution is additive and breaking changes are coordinated with every consumer;
    no formal version numbers, a new function name carries the change.
  - Deployed together is acceptable only when every consumer of the changed object
    ships in the same deployment as the migration; otherwise expand, migrate, contract.
  - 'Drift gate: a catalogue diff in CI fails on a removed function or an incompatible
    signature unless that condition holds; typed wrappers are generated from the same
    catalogue.'
  - One business operation is one API call in its own transaction (PIG-WEB-DATA.INTERFACE.1).
  - Functions live in versioned migrations and are tested against a live database
    in CI.
  - 'Authority: the Postgres function API.'
  - 'Forbidden: direct consumer writes outside the exception above; views as contract;
    consumer roles owning objects.'
  design_notes: 'Positions: P1 function API, backend of backends (L515 MAINT, L617);
    P2 schema as the API, views and functions (L518, L618, L187); P3 ORM over base
    tables, views off the contract path (L187, L516 MAINT). Forces: changeability
    against correctness for several consumers. Decision: P1 is the default contract
    (MD-03; L515, L517, L617; MAINT, max). Direct single-table write exception is
    inferred (L527''s default). Rejected: P2, because views bind consumers to a name
    and exact shape (L516); it wins when a CRUD-dominant application is served by
    a database-as-API server with a strong Postgres team (L618). P3 is rejected for
    writes (bypasses the operations MD-03 places in the database), kept for simple
    reads (L516). Would move it: a single consumer (direct queries become the default
    again, L527); team SQL skill. Maintainer decisions: MD-03, MD-02 (drift gate).
    Revisions: R1 function API becomes the default (MD-03); R2 drift gate on signatures
    (R1-7) and no transaction around several calls (R1-4); R3 X2 wording for breaking
    changes, departure from L517 counted at PIG-WEB-DATA.INTERFACE.1. Conflict recorded:
    views as contract (L187, L518) against L516. Tension: MD-03 against L044 and L622
    (one application owns its database).'
