- uid: PIG-WEB-INTERACTION.VISUALIZE.3
  name: Page Performance
  intent: 'Every page template follows one release rule: the largest-contentful-paint
    element and its resource are in the server HTML and never lazy-loaded or client-rendered,
    the DOM stays small, long handlers are split into tasks, and space is reserved
    for late content. This keeps loading, interaction and layout fast and stable;
    targets and field measurement belong to the performance node.'
  epistemic_state: known
  constraints:
  - the LCP element is in the server HTML, its resource referenced there (preloaded
    when not discoverable early), never lazy-loaded and never rendered by an island;
  - the DOM stays small; event handlers yield and split long work into separate tasks;
    no large HTML rendered in the browser (consistent with VISUALIZE.1);
  - images, embeds and late content have reserved dimensions.
  - 'Measurement and thresholds are the performance node''s: field measurement against
    the Web Vitals targets (LCP 2.5 s, INP 200 ms, CLS 0.1).'
  design_notes: 'Decides: which page techniques keep loading, interaction and layout
    fast and stable.

    Rows: L297, L298, L299. Cited: L013, L016, L282.

    Positions: P1 the page techniques of the three rows: LCP resource discoverable
    in the initial HTML, never lazy-loaded, LCP element not client-rendered (L297);
    small DOM, long handlers split into tasks, no large HTML rendered by client JavaScript
    (L298); space reserved for late content (L299); all consensus, T1 and T2. P2 client-rendered
    main content with lazy loading everywhere (the practice L297 and L298 rule out).

    Forces: P1 serves the user''s time to see and act on the data (L013''s perceived
    limits), at the cost of discipline in templates and handlers; P2 serves only uniform
    client code.

    Decision (the rules are the constraints): P1 entirely, as a release rule for every
    page template:

    Rejected: P2: wins never for the main content; lazy loading is kept for below-the-fold
    media only (inferred from L297).

    Realizes: J4 INTERACTION.VISUALIZE; ALLOCATION.FORCES.4 latency (proposed link).

    Hand-offs: targets and field measurement (PIG-WEB-TRANSVERSE.PERFORMANCE, PIG-WEB-TRANSVERSE.OPERABILITY.2).'
