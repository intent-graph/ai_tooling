- uid: PIG-WEB-INTERACTION.AGENT.5
  name: Agent-Shaped Responses and Limits
  intent: 'Rate limits are nested: each agent identity has its own quota inside its
    user''s allowance, each client application has a ceiling, and interactive traffic
    is counted apart. Errors are machine-readable problem details, responses are paginated,
    size-capped and high-signal with ownership-checked handles, and flows that hand
    out scarce goods need a human step or refuse agents.'
  epistemic_state: 'known | unvalidated: L651 inferred; the nested partition is a
    synthesis | open: the list of scarce-goods flows, recorded per project'
  constraints:
  - 'Nested partitions: each agent identity has its own quota inside its user''s allowance,
    so a runaway agent exhausts only its own share; each client application has a
    ceiling across its users; the user''s own interactive traffic is counted apart
    from their agents'' (nesting inferred). The flows whose automation harms the business
    carry their own per-flow limits.'
  - 'Scarce-goods flows are closed to agents or need a human (web-app-philosophy:INTERACTION.AGENT):
    quotas and owner approval do not stop one party running many accounts, each with
    its own approved agent. On a flow that hands out scarce goods or rewards automation
    per account (limited stock, referral credit), completing the flow requires a human
    step in the application''s own page, or agent credentials are refused there, whatever
    their identity; the list of such flows is recorded per project.'
  - 'Problem details for every error: stable type, status, detail and extensions;
    tool execution errors say what to change in the call.'
  - 'Agent-shaped responses: paginated and filtered by default, size-capped, high-signal
    fields; readable labels beside opaque handles; every handle checked for ownership
    on the server.'
  design_notes: 'Decides: how responses, errors and rate-limit partitions are shaped
    for agent callers.

    Rows: L651, L656, L657. Cited: L652 (J4), L034, L052, L269.

    Positions: rate-limit partition (L651, contested): P1 per user; P2 per agent identity;
    P3 per client application; P4 a combination. Errors: P5 machine-readable problem
    details (type, status, detail, extensions), tool errors that tell the model how
    to correct the call (L656, consensus). Responses: P6 paginated and filtered by
    default, high-signal fields, size caps, readable labels beside opaque, unguessable
    handles, ownership checked on the server (L657).

    Forces: P1 is fair among humans and lets a delegated agent starve its user; P2
    isolates agents and needs agent identity (.3); P3 protects the service from one
    integration. P5 serves recoverability and fewer wasted calls; P6 serves token
    cost and accuracy.

    Decision (the rules are the constraints):

    Rejected: P1, P2 or P3 alone: each leaves one of the failure cases L651 names;
    P1 alone wins never where agents act for users.

    Realizes: J4 INTERACTION.AGENT decision 7; ALLOCATION.GUARD.6 (proposed: rate-limited
    retries carry idempotency keys).

    Hand-offs: limiter storage and enforcement (PIG-WEB-LOGIC.SECURE.6); error format
    of the HTTP interface (PIG-WEB-LOGIC.EXPOSE.2).'
