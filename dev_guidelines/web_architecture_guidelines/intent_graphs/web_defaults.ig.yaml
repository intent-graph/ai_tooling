- uid: PIG-WEB-INTERACTION.VISUALIZE.2
  name: Client State
  intent: 'Browser state is held by kind: on server-rendered pages the HTML is the
    copy; inside client-rendered islands a dedicated server-state cache keeps each
    record''s read version; navigable view state lives in the URL through the History
    API; unsaved form input is saved on page hide. Credentials and any state that
    must survive as data never enter browser storage, because the browser only holds
    copies of what the server owns.'
  epistemic_state: 'known | unvalidated: P1 rests on one vendor T3 source (L291)'
  constraints:
  - 'Server data on server-rendered pages: the HTML is the copy; freshness by validators
    and the HTTP cache rules of the response caching node.'
  - 'Server data inside a client-rendered island: a dedicated server-state cache (deduplication,
    background refresh, explicit staleness), never a general-purpose store. Each cached
    record keeps the version it was read at, so a write from the island carries it
    (GUARD.5).'
  - 'Navigable view state (filters, sort, page, selected tab, open record): in the
    URL, through the History API; fragments only for in-page anchors.'
  - 'Form state: in the browser until submitted; unsaved input is persisted as PIG-WEB-INTERACTION.ENVIRONMENT.1
    sets.'
  - 'Presence: on the real-time channel with a timeout, never in tables (PRESENT.3).'
  - 'Never in browser storage: credentials or session tokens (GUARD.4), or any state
    that must survive as data (RECORD.1).'
  design_notes: 'Decides: where server data and navigable view state are held in the
    browser.

    Rows: L291, L292. Cited: L070, L071, L631, L681 (PRESENT.3), L284, L294, L260.

    Positions: P1 server state in a dedicated server-state cache with deduplication,
    background refresh and staleness (L291, majority, one vendor source); P2 server
    state in a general-purpose client state store (rejected in L291); P3 server-rendered
    pages rely on the browser''s HTTP cache for server state (L291''s note); P4 navigable,
    bookmarkable or shareable view state in the URL via the History API, fragments
    not used to load content (L292, consensus); P5 navigable state in client memory
    only (rejected in L292).

    Forces: P1 and P3 treat server data as a stale-able copy (L071), at the cost of
    a cache layer in islands; P2 makes the client look like an owner of data it only
    copies, and drifts. P4 serves back, reload, sharing and agents that follow links,
    at the cost of URL design; P5 serves only simpler client code.

    Decision (the rules are the constraints): state is held by kind, as PRESENT.3
    places it:

    Rejected: P2: wins never for server data. P5: acceptable for ephemeral view state
    nobody navigates to or shares (PRESENT.3).

    Realizes: ALLOCATION.PRESENT.3 (skeleton link); ALLOCATION.GUARD.5 (the island
    keeps the version it read) and GUARD.4 (no credentials in script-readable storage)
    (proposed links).

    Hand-offs: response cache headers (PIG-WEB-LOGIC.EXPOSE.4).'
