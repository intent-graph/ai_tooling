- uid: PIG-WEB-INTERACTION.EDIT
  name: Editing Without Loss
  intent: Every state-changing form POSTs and answers 303, and every edit of a user-edited
    record carries the version it read, so a stale write is shown as a conflict with
    both versions and is never merged silently or lost. Duplicate submissions are
    suppressed in layers, unsaved input survives the page.
  epistemic_state: 'known | unvalidated: conflict screen content and hidden-field
    transport inferred (L583 conflict UI inferred); 409 for a stale hidden-field version
    follows the HTTP interface''s mapping (L259); the handling of a form missing its
    version field inferred'
  constraints:
  - Every state-changing form POSTs; success answers 303 to the confirmation or the
    new resource; a failed validation re-renders the form with the user's input kept
    (inferred; status codes are the HTTP interface's). Search and filter forms submit
    with GET, so their state lands in the URL (VISUALIZE.2).
  - 'The version travels with every edit of a user-edited record: a hidden field in
    HTML forms (a plain form cannot send If-Match, inferred), If-Match with the ETag
    from JavaScript and agent clients. The backend passes it to the writer function
    as the expected version. The maximum strictness among the sources is adopted:
    the condition is required, not optional, except for per-property last-writer-wins
    updates (toggles, status, assignment, ordering), which are sent without the record
    version (GUARD.5) and are exempt. If-Match clients: a mismatch answers 412, a
    missing condition answers 428 on every endpoint editing such a record, per-property
    updates excepted (RFC 9110 defines both for conditional header fields). HTML forms:
    a version in a hidden field that no longer matches is a conflict with current
    state, answered 409 with the conflict form of decision 3 (the mapping of PIG-WEB-LOGIC.EXPOSE.2:
    409 for a conflict with current state); a form missing its version field is rejected
    as malformed and re-rendered with current values (inferred).'
  - 'A stale write is shown, never merged silently: the response re-renders the form
    with the user''s input kept and the current values beside it, the fields changed
    by the other writer marked, and the new version embedded; the user reapplies.'
  - A patch applies all or nothing under its precondition.
  - 'Duplicate submission, browser share (GUARD.6): the submit control is disabled
    with a pending state; create forms carry a form token minted at render, sent as
    the idempotency key the writer function records with the effect; 303 after success.'
  - 'Unsaved input survives the page as PIG-WEB-INTERACTION.ENVIRONMENT.1 sets: saved
    on page hide, restored on return, cleared after a successful submit.'
  design_notes: "Decides: how forms submit, and how concurrent and repeated edits\
    \ are detected and shown.\nRows: L258, L260, L583, L675. Cited: L475, L582, L674,\
    \ L676 (DATA), L259, L269, L546, L655 (LOGIC), L292, L294, L600.\nPositions:\n\
    \  - Submission: P1 POST, then 303 See Other to a GET page (L258, consensus T1).\n\
    \  - Lost updates: P2 optimistic concurrency: the version travels with the edit;\
    \ ETag and If-Match; 412 on mismatch; 428 where a lost update matters (L260, consensus\
    \ on mechanism, strictness varies by source); P3 the conflict shown with both\
    \ versions (L583, conflict UI inferred); P4 the server returns current state and\
    \ merges automatically when changed fields are disjoint; a patch carries a precondition\
    \ and applies all or nothing (L675, majority; field-level merge inferred).\n \
    \ - Transactions (L583's Django part): P5 wrap multi-step writes in atomic, durable=True\
    \ for the outermost transaction, on_commit callbacks discarded after a rolled-back\
    \ savepoint.\nForces: P1 serves no resubmission on reload, Back or bookmark. P2\
    \ and P3 serve no silent loss of anyone's work, at the cost of a conflict screen.\
    \ P4 serves fewer conflict screens, at the cost of applying a combination of fields\
    \ no user saw, which per-row invariants catch only if declared. P5 serves atomic\
    \ backend writes; under MD-03 the multi-table write is one database function call.\n\
    Decision (the rules are the constraints): (realizes GUARD.5 and GUARD.6 as settled):\n\
    Rejected:\n  - P4's automatic merge of disjoint fields: acceptable only for the\
    \ properties GUARD.5 puts under per-property last-writer-wins (toggles, status,\
    \ assignment, ordering, L674), which the client sends alone, without the record\
    \ version. For other fields, a merged result nobody saw is not \"without loss\"\
    \ of intent (inferred).\n  - Optional preconditions (the Zalando and Google strictness\
    \ in L260): wins never where a lost update matters, which is every user-edited\
    \ record in the default.\n  - 302 or 307 after POST: wins never (L258).\n  - L583's\
    \ \"wrap multi-step writes\" as several backend writes in one transaction: replaced\
    \ by MD-03 (a database function per business operation); not a conflict with the\
    \ row's intent (atomicity), which the function keeps.\nRealizes: ALLOCATION.GUARD.5\
    \ and GUARD.6 (skeleton links); ALLOCATION.PRESENT.3 (proposed: drafts in the\
    \ browser); J4 INTERACTION.COLLABORATE decision 3.\nHand-offs: the version predicate\
    \ in the write (PIG-WEB-DATA.CONCURRENCY.2, L676); status codes and the idempotency-key\
    \ contract (PIG-WEB-LOGIC.EXPOSE.2, .3, L269, L546); CSRF token on forms (PIG-WEB-LOGIC.SECURE.3);\
    \ transaction handling (PIG-WEB-LOGIC.ENFORCE.2)."
