- uid: PIG-WEB-TRANSVERSE.SECURITY.3
  name: Security Headers and CSP
  intent: Every response carries a strict CSP with a fresh per-response nonce from
    the Python templates (hashes for build-time pages), rolled out report-only first,
    plus a baseline header set with obsolete headers removed. CSP is the second layer
    after template escaping; each header has one setter, and pages carrying a nonce
    are never stored in a shared cache.
  epistemic_state: 'known | unvalidated: one setter per header; no shared caching
    of nonce pages'
  constraints:
  - Python renders the HTML (PRESENT.1, JS_SERVER), so each response gets a fresh
    nonce from the server's templating engine. Pages produced at build time use hashes
    for their inline scripts.
  - A page that carries a nonce is never stored in a shared cache, or the nonce would
    repeat across responses (inferred; consistent with the philosophy's no-store rule
    for personalised pages).
  - 'Rollout: Content-Security-Policy-Report-Only first, violations sent to a Reporting
    API endpoint (OPERABILITY.2), fixed, then enforced.'
  - 'The baseline header set is sent on every response, the obsolete ones removed.
    Each header has one setter: the application for CSP (it holds the nonce), the
    proxy for the static baseline so static files carry it too (inferred).'
  - CSP stays the second layer. Templates escape by default.
  design_notes: "Rows: L334, L335, L336, L337.\nPositions: - P1 a strict CSP: nonce\
    \ or hash with strict-dynamic, object-src 'none', base-uri 'none', no unsafe-inline\
    \ or unsafe-eval (L334).\n  - P2 an allowlist CSP (the alternative L334 ranks\
    \ below P1).\n  - Rollout: report-only first, fix, then enforce (L335). Nonces\
    \ unique per response, injected by a real templating engine; hashes for static\
    \ inline scripts (L336).\n  - Baseline headers: HSTS, nosniff, Referrer-Policy,\
    \ CSP frame-ancestors in place of X-Frame-Options, Permissions-Policy, COOP; remove\
    \ X-XSS-Protection, Expect-CT, Server, X-Powered-By (L337).\nForces: P1 serves\
    \ containment of injected script (the second layer after escaping, L026, J4),\
    \ at the cost of nonce plumbing and refactoring inline handlers. P2 serves ease\
    \ of adoption, and is bypassable through allowed hosts (L334's ranking).\nDecision\
    \ (lead): P1, with nonces from the Python templates.\nRejected: P2: acceptable\
    \ never as the target; tolerated only as a temporary step while inline handlers\
    \ are removed (inferred). X-Frame-Options and X-XSS-Protection as protections:\
    \ never (L337).\nRealizes: refines TRANSVERSE.SECURITY (A02); realizes INTERACTION.ENVIRONMENT.7's\
    \ hand-off (J4); rests on PRESENT.1 and JS_SERVER (server-rendered HTML makes\
    \ nonces available)."
