- uid: PIG-WEB-LOGIC.ENFORCE.1
  name: Use-Case Layer
  intent: 'Application operations are defined once in a use-case layer that every
    entry point calls; a use case holds only the backend''s share (product policy,
    workflow across operations, external calls) and reaches stored data through one
    typed wrapper call per business operation. The domain is decoupled from the ORM:
    ORM models are read mappers, never saved except for single-writer tables under
    the direct-write exception.'
  epistemic_state: 'known | tension: L227''s Active Record narrowed by DB_API and
    L226''s backend transitions by MD-03 | unvalidated: ORM models as read-only mappers
    (inferred)'
  constraints:
  - 'One use-case layer per backend, the only way into its logic: HTML views, JSON
    endpoints, the agent adapter, management commands and job handlers call the same
    use-case functions.'
  - Handlers parse into Pydantic models, call one use case and map its outcome to
    a status and a representation.
  - A use case never composes several API calls into one business operation (PIG-WEB-DATA.INTERFACE.1).
  - The use case, not the adapter, decides whether to set a writer function's override
    flag, after the policy module authorizes it for the actor.
  - State transitions stay in the database; the backend's share scales from a transaction
    script to a domain model of plain Python objects.
  - ORM models are read mappers and are never saved, except for tables under the direct-write
    exception (the session table, other single-writer tables the backend owns).
  - 'Forbidden: orchestration written in each handler; state transitions in backend
    domain objects.'
  design_notes: "Positions: - P1 define application operations in a use-case (service)\
    \ layer that every entry point (HTTP, CLI, jobs) calls; one source notes the layer\
    \ may be unnecessary for web-only applications with controllers alone (L224).\n\
    \  - P2 thin handlers: parse input, call a use case, map outcomes to status codes\
    \ (L225).\n  - P3 scale layering to domain complexity: transaction script for\
    \ simple or CRUD logic, a domain model plus use cases when complex; round 4 adds\
    \ that both keep state transitions in the backend unless the database gate of\
    \ L527 is met, and that team SQL skill is an input (L226).\n  - P4 decouple the\
    \ domain model from the ORM, or use ORM models as the domain (Active Record):\
    \ a recorded decision, contested (L227).\n  - Cited: one core for every client,\
    \ adapters translate only (L633, RULES.4); one function call per business operation\
    \ (ACT.1); MD-03 meets L527's gate by default.\n\nForces: correctness (one rule,\
    \ one place); changeability and testability; the cost of structure on simple logic.\n\
    \nDecision: 1. **One use-case layer per backend, the only way into its logic**\
    \ (P1): HTML views, JSON endpoints, the agent adapter, management commands and\
    \ job handlers call the same use-case functions (RULES.4). Handlers parse into\
    \ Pydantic models (EXPOSE.6), call one use case and map its outcome to a status\
    \ and a representation (P2). The layer is required even for a web-only backend,\
    \ because agents and jobs are entry points in the default context, so P1's objection\
    \ does not apply (inferred).\n  2. **A use case holds the backend's share only**\
    \ (ACT.1): product policy not stored in the data, workflow across operations,\
    \ external calls. Each business operation on stored data is one call through a\
    \ port whose implementation is the typed wrappers generated from the function\
    \ catalogue (DB_API, TYPE_CHAIN). A use case never composes several calls into\
    \ one business operation; composition across domains happens inside the database,\
    \ where a function may call another domain's published functions in its transaction,\
    \ and only direct access to another domain's tables is forbidden (X3).\n     -\
    \ **Overrides of blockable rules** (L530; review M7): the use case, not the adapter,\
    \ decides whether to set a writer function's override flag, after the policy module\
    \ authorizes it for the actor (SECURE.1); an adapter never forwards it from client\
    \ input.\n  3. **Transitions stay in the database**: P3's round-4 condition is\
    \ met, because MD-03 meets L527's gate by default. The backend's own share scales\
    \ with its complexity: a transaction script for simple orchestration, a domain\
    \ model of plain Python objects for complex policy and workflow (P3, J3 LOGIC.ENFORCE).\n\
    \  4. **P4 decided: the domain is decoupled from the ORM.** ORM models are read\
    \ mappers of the tables the backend reads and are never saved, except for tables\
    \ under DB_API's direct-write exception (the session table, other single-writer\
    \ tables the backend owns), because Active Record's save is a direct table write\
    \ that DB_API forbids for shared tables (inferred from DB_API).\n\nRejected: -\
    \ Orchestration written in each handler: never (P1, RULES.4).\n  - ORM models\
    \ as the domain (Active Record): acceptable when one backend is the only database\
    \ consumer and the team's SQL skill is low (ACT.1's condition); L227's \"mostly\
    \ CRUD\" criterion then applies.\n  - State transitions in backend domain objects:\
    \ never in the default context (ACT.1, MD-03).\n\nRealizes: ALLOCATION.ACT.1 (holds\
    \ the use cases the business-rules placement gives the backend)."
