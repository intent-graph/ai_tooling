- uid: PIG-WEB-INTERACTION.REALTIME.3
  name: Long-Lived Connection Servers
  intent: Long-lived connections (server-sent events, WebSocket, long polling) run
    in a dedicated ASGI process type of the same backend deployable, apart from page
    and API workers, and fan out from a Postgres wake-up followed by a table re-read.
    Redis is added only at a measured NOTIFY limit or where the chosen framework's
    only production backend is Redis.
  epistemic_state: 'known | unvalidated: separate process type (L458 inferred) | open:
    the NOTIFY threshold (L127)'
  constraints:
  - 'An ASGI process type dedicated to long-lived connections (SSE, WebSocket, long
    polling), routed by path at the proxy, apart from the page and API workers, each
    scaled on its own measure. It is a process type of the same backend deployable,
    not a separate service: each backend is one deployable and is not split into services
    without a measured need.'
  - 'Fan-out from Postgres: each connection process holds one listening connection
    (.5), wakes on a notification, reads new changes after its last cursor from the
    change table, and pushes to its local subscribers after the per-subscriber filter
    (.4). No Redis in the default (POSTGRES_FIRST).'
  - Redis (or a channel layer on it) when a measured limit is reached (NOTIFY commit
    serialisation) or when the framework chosen for WebSocket groups has Redis as
    its only production backend, with the change still committed to the table first
    (no dual write; RECORD.1).
  design_notes: 'Decides: which server processes hold long-lived connections and how
    they fan out.

    Rows: L455, L456, L457, L458. Cited: L125, L127, L462 to L465 (.5), POSTGRES_FIRST.

    Positions: P1 long-lived connections on an ASGI server (L455, consensus T1); P2
    streaming under WSGI (rejected in L455: a worker held for the whole stream); P3
    long-lived connections in their own process type apart from short-request workers
    (L458, majority, inferred); P4 the same workers serve pages and streams (the alternative
    L458 rejects). Fan-out: P5 an in-process registry (L456: one process only); P6
    a Redis-backed channel layer (L457, Django''s only production backend); P7 a Postgres
    wake-up per process, which re-reads tables and fans out in memory (L465; POSTGRES_FIRST).

    Forces: P1 and P3 serve page requests that never starve behind sockets and independent
    scaling, at the cost of a second process type. P6 serves high fan-out at the cost
    of a second store; P7 serves one store and transactional consistency of the change
    and its notification, up to NOTIFY''s commit serialisation under write concurrency
    (L127).

    Decision (the rules are the constraints):

    Rejected: P2: wins never for long-lived connections (L455). P4: acceptable while
    long-lived connections are few and the whole application already runs on ASGI
    with no synchronous workers (inferred). P5 alone: acceptable with exactly one
    connection process (L456).

    Realizes: PIG-WEB-ALLOCATION.POSTGRES_FIRST (proposed link: Postgres carries the
    wake-up role until a measured limit); ALLOCATION.RECORD.1 (the table is the source,
    push a copy).

    Hand-offs: process types and their placement (PIG-WEB-TRANSVERSE.TOPOLOGY.2, .3);
    the application concurrency model (PIG-WEB-LOGIC.ENFORCE.4).'
