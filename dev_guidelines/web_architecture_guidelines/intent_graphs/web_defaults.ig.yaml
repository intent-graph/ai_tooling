- uid: PIG-WEB-LOGIC.SECURE.6
  name: Abuse and Rate Limits
  intent: 'Consumption is bounded at two depths: identity-blind rate, connection,
    size and time limits at the proxy, and identity-aware, per-operation, cost-weighted
    limits in the backend, with spending caps at every provider, observe-first rollout,
    and 429 answers that let programs and agents pace themselves.'
  epistemic_state: 'known | unvalidated: the two-layer split is a synthesis (L358);
    counters in Postgres by analogy; load shedder from one T3 source | gap: RateLimit
    fields are a draft (T2)'
  constraints:
  - The proxy enforces identity-blind rate, connection, body-size and time limits
    keyed on the address it appends itself (counted from the right of `X-Forwarded-For`).
  - The backend enforces identity-aware limits keyed on account, API key or session
    combined with the address, per operation, tighter and cost-weighted on operations
    that spend money or call third parties, with concurrency limits on heavy endpoints.
  - A spending cap and a billing alert with every external provider, an alert alone
    where no cap exists.
  - Backend limiter counters live in a rebuildable `UNLOGGED` Postgres table and move
    to a shared cache service when measured counter writes load the primary; the proxy
    keeps its own state.
  - Reserve capacity for critical routes (login, core write paths) when workers saturate.
  - Roll out a new limit in observe-only mode, then enforce, with a switch; a challenge
    only on human-only flows; agents get 429, never a challenge.
  - 'Over-limit answers are 429 with a problem-details body, `Retry-After` never earlier
    than the window''s end and `Cache-Control: no-store`; the proxy is configured
    to 429, never 503.'
  - IETF `RateLimit` and `RateLimit-Policy` fields on the JSON interface and the agent
    surface, marked unstable until the draft is published.
  - 'Forbidden: proxy-only or application-only limits; the leftmost `X-Forwarded-For`
    value or the address alone as the key.'
  design_notes: "Positions: - P1 two layers: coarse, identity-blind limits and size\
    \ and time bounds at the proxy or edge; identity-aware limits (per user, API key,\
    \ plan) in the application (L358; synthesis, no source argues the split).\n  -\
    \ P2 tighter per-client limits for operations that cost money or trigger third\
    \ parties (SMS, e-mail, exports, uploads, egress), weighted by cost; spending\
    \ limits and billing alerts with every provider, an alert where a cap is impossible\
    \ (L359).\n  - P3 behind proxies, limit only on addresses appended by a proxy\
    \ you control, counted from the right of `X-Forwarded-For` (L360).\n  - P4 never\
    \ the address alone as the key: combine it with an account, API key, session or\
    \ path (L361).\n  - P5 limit concurrency as well as rate on heavy endpoints; count,\
    \ bytes and concurrency are distinct units (L362).\n  - P6 a load shedder that\
    \ reserves capacity for critical requests (L363; one T3 source).\n  - P7 roll\
    \ out a new limit in observe-only mode, escalate gradually, keep a switch (L364).\n\
    \  - P8 limiter state outside the process (shared cache or the proxy), or accept\
    \ approximate limits (L365).\n  - P9 over-limit answers 429 with an explaining\
    \ body and `Retry-After`; never cache a 429; the proxy set to 429 where it defaults\
    \ to 503; RateLimit fields for programmatic clients (L366).\n  - P10 quota headers,\
    \ contested: (a) IETF `RateLimit` and `RateLimit-Policy` (draft, T2); (b) de facto\
    \ `X-RateLimit-*`; (c) none, 429 and `Retry-After` only (L367).\n  - P11 remaining\
    \ quota is advisory; `Retry-After` takes precedence; a server sends no `Retry-After`\
    \ earlier than the window's end (L368).\n  - Cited: limits at the outermost layer\
    \ (L032), per operation and business need (L031), harmful flows protected by flow\
    \ (L034), no blanket bot blocking where agents are users (L652), all via J3.\n\
    \nForces: availability and cost control; security (brute force, scraping, abuse);\
    \ agents' ability to pace themselves; scalability of where limiter state lives.\n\
    \nDecision: 1. **Two layers** (P1, J3). The reverse proxy enforces identity-blind\
    \ rate, connection, body-size and time limits keyed on the address it appends\
    \ itself (P3). The backend enforces identity-aware limits keyed on account, API\
    \ key or session combined with the address (P4), per operation, tighter and cost-weighted\
    \ on operations that spend money or call third parties (P2), with concurrency\
    \ limits on heavy endpoints (P5).\n  2. **Providers**: a spending cap and a billing\
    \ alert with every external provider, an alert alone where no cap exists (P2).\n\
    \  3. **Limiter state** (P8): the proxy keeps its own; the backend's counters\
    \ live in Postgres, in a rebuildable `UNLOGGED` table, under POSTGRES_FIRST, and\
    \ move to a shared cache service when measured counter writes load the primary\
    \ (CACHE_STORE's moving condition) (by analogy; no source).\n  4. **Load shedding**:\
    \ reserved capacity for critical routes (login, the core write paths) when workers\
    \ saturate (P6).\n  5. **Rollout**: observe-only first, then enforce, with a switch\
    \ (P7). A challenge before blocking (CAPTCHA-like) only on human-only flows named\
    \ under L034; agents, intended users here (L652), get 429 with RateLimit fields,\
    \ never a challenge (review m3).\n  6. **Signalling**: 429 with a problem-details\
    \ body (EXPOSE.2), `Retry-After` never earlier than the window's end, `Cache-Control:\
    \ no-store`; the proxy configured to 429 (P9, P11).\n  7. **Quota headers**: IETF\
    \ `RateLimit` and `RateLimit-Policy` on the JSON interface and the agent surface,\
    \ so programs and agents pace themselves, marked unstable until the draft is published\
    \ (P10 (a), P9's agent merge).\n\nRejected: - Proxy-only or application-only limits:\
    \ never; each misses what the other sees (J3).\n  - The leftmost `X-Forwarded-For`\
    \ value or the address alone as key: never (P3, P4).\n  - Per-process in-memory\
    \ counters: acceptable only for a single-process deployment (P8).\n  - `X-RateLimit-*`\
    \ names: acceptable where existing clients already expect them (P10 (b)).\n  -\
    \ No quota headers: acceptable for HTML pages read by humans (inferred).\n  -\
    \ 503 for an over-limit answer: never (P9).\n\nRealizes: no skeleton link; follows\
    \ J3 LOGIC.SECURE (limits at two depths) and PIG-WEB-ALLOCATION.POSTGRES_FIRST\
    \ and CACHE_STORE (limiter state)."
