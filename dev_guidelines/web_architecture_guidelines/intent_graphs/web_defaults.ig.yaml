- uid: PIG-WEB-INTERACTION.ENVIRONMENT.1
  name: Capability and Page Lifecycle
  intent: Enhancement detects features and varies nothing on User-Agent; no unload
    handlers exist and no-store is used only on pages showing sensitive data; a page
    restored from the back/forward cache refreshes time-sensitive state and re-checks
    the session; unsaved input is saved on visibilitychange or pagehide.
  epistemic_state: 'known | unvalidated: session re-check on restore inferred; draft
    storage, clearing and the per-tab rule for sensitive pages inferred; L294 partly
    single-vendor T3 (SRC-269)'
  constraints:
  - Enhancement checks features and degrades without them; nothing varies on User-Agent.
  - No unload handlers anywhere; no-store only on pages showing sensitive data (authenticated
    personalised pages are private and revalidated).
  - On pageshow from the back/forward cache, the page refreshes time-sensitive state,
    and re-checks the session so a page restored after logout does not stay usable
    (the session re-check inferred).
  - Unsaved input is saved on visibilitychange or pagehide, never unload, and restored
    on return; it sits in per-tab or per-origin browser storage and is cleared after
    a successful submit or at logout; on pages that show sensitive data, drafts go
    to per-tab storage only or are not persisted, so they do not outlive the session
    on a shared device (storage choice, clearing and the per-tab rule inferred).
  design_notes: 'Decides: how pages detect features and survive back-forward restore,
    freezing and discard.

    Rows: L287, L293, L294. Cited: L007 (J4), L416, L414.

    Positions: P1 feature detection; no behaviour or cache key varied on User-Agent
    (L287, consensus); P2 browser sniffing (rejected in L287). P3 no no-store on non-sensitive
    pages and no unload handlers, so pages stay eligible for the back/forward cache
    (L293); P4 no-store everywhere for freshness (rejected in L293). P5 unsaved state
    persisted on visibilitychange or pagehide (L294); P6 on unload (rejected in L294).

    Forces: P1 serves every browser the user may have; P3 serves instant back navigation;
    P5 serves the user''s input when the browser freezes or discards the page. P4
    serves freshness and, for sensitive pages, confidentiality on shared devices.

    Decision (the rules are the constraints): P1, P3, P5.

    Rejected: P2: wins never (L287). P4: acceptable for pages that display sensitive
    data (L293). P6: wins never (L294).

    Realizes: J4 INTERACTION.ENVIRONMENT.1 and .2; ALLOCATION.PRESENT.3 (proposed:
    in-progress state in the browser).

    Hand-offs: cache headers (PIG-WEB-LOGIC.EXPOSE.4).'
