- uid: PIG-WEB-INTERACTION.REALTIME
  name: Real-Time Channels
  intent: 'Push is a hint over a correct pull: pages are correct on plain load and
    clients catch up from a commit-safe cursor. Channels are chosen in order of simplicity
    (none, polling, server-sent events, WebSocket for two-way traffic), held by a
    dedicated ASGI process type, secured per subscription and per event, and woken
    by Postgres notifications with the data in tables.'
  epistemic_state: 'known: MD-05'
  constraints:
  - 'Push is a hint over a correct pull: pages are correct on plain load and clients
    catch up from a commit-safe cursor.'
  - 'Channel Choice: channels in order of simplicity: none, polling, server-sent events,
    WebSocket for two-way traffic.'
  - 'Channel Operation: every stream resumable, kept alive below the shortest idle
    timeout, unbuffered, reconnecting with backoff.'
  - 'Long-Lived Connection Servers: held by an ASGI process type apart from page workers,
    fanned out from a Postgres wake-up.'
  - 'Channel Security: same-origin, authenticated by the session cookie, authorized
    per subscription and per event, bounded.'
  - 'Database Notifications: LISTEN/NOTIFY as a wake-up only, the data in tables.'
  design_notes: 'Decides: how the server pushes changes to the browser.

    Rows: none (roll-up).

    Decision: roll-up of .1 to .5. Push is a hint over a correct pull (J4 COLLABORATE):
    pages are correct on plain load and clients catch up from a commit-safe cursor.
    Channels in order of simplicity: none, polling, server-sent events, WebSocket
    for two-way traffic (.1); every stream resumable, kept alive below the shortest
    idle timeout, unbuffered, reconnecting with backoff (.2); held by an ASGI process
    type apart from page workers, fanned out from a Postgres wake-up (.3); same-origin,
    authenticated by the session cookie, authorized per subscription and per event,
    bounded (.4); LISTEN/NOTIFY as a wake-up only, the data in tables (.5).

    Realizes: refines INTERACTION.COLLABORATE (J4); PIG-WEB-ALLOCATION.POSTGRES_FIRST,
    ALLOCATION.GUARD.3, PRESENT.3 through its children.'
