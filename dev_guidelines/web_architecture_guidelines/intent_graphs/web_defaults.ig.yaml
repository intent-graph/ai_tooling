- uid: PIG-WEB-INTERACTION.AGENT.2
  name: Discovery and Registration
  intent: The application publishes OAuth protected-resource metadata and answers
    unauthenticated calls with WWW-Authenticate carrying resource_metadata. Agent
    clients prove identity through client ID metadata documents or signed requests,
    never a User-Agent string, with per-client consent and exact redirect matching;
    only single-use, PKCE-bound codes travel in redirects.
  epistemic_state: 'known | unvalidated: L653 and L654 rest on drafts and a moving
    specification'
  constraints:
  - Publish protected-resource metadata and answer unauthenticated calls with WWW-Authenticate
    carrying resource_metadata.
  - Agent clients prove who they are through OAuth client identity or signed requests,
    never a User-Agent string; this identity keys the per-agent quota (.5) and the
    agent marking in data (.3).
  - Client ID metadata documents first; dynamic client registration kept only for
    compatibility; pre-registration for closed sets; consent per client and exact
    redirect URI matching always.
  - 'Only one-time codes travel in redirects: the authorization code in the redirect
    URL is single-use, short-lived and bound to the client by PKCE; no session token,
    bearer token or long-lived credential ever travels in a URL (web-app-philosophy:INTERACTION.ENVIRONMENT.6;
    PKCE binding inferred as the condition).'
  - 'Fetching a client''s metadata document is a server-side fetch of a client-named
    URL: private, loopback and link-local ranges are blocked and every redirect hop
    validated.'
  design_notes: 'Decides: how agent clients discover the authorization server and
    register.

    Rows: L637, L653, L654. Cited: L662 (LOGIC.SECURE.7), L652 (J4).

    Positions: P1 OAuth Protected Resource Metadata and WWW-Authenticate with resource_metadata
    on unauthenticated requests (L637, consensus T1); P2 out-of-band configuration
    (the alternative L637 removes). Identity: P3 verifiable client identity (OAuth
    client ID metadata documents, or signed HTTP requests) (L653, majority, draft
    T2); P4 a self-declared User-Agent (rejected in L653). Registration (L654): P5
    client ID metadata documents; P6 dynamic client registration; P7 pre-registration;
    all with per-client consent and exact redirect matching.

    Forces: P1 and P5 serve open-ecosystem interoperability; P3 serves attribution
    and per-agent policy (J4 decision 7); P6 serves compatibility with older clients
    at the cost of registry sprawl; P7 serves a small known set of agents.

    Decision (the rules are the constraints):

    Rejected: P2: acceptable for a closed set of pre-registered agents (P7 condition).
    P4: wins never as identity (L653). P6 as the primary path: wins only for clients
    that cannot publish a metadata document (L654).

    Realizes: ALLOCATION.GUARD.4 (proposed: agents hold their own revocable credentials);
    J4 INTERACTION.AGENT decisions 3 and 7.

    Hand-offs: the authorization server itself and federated login (PIG-WEB-LOGIC.SECURE.4);
    server-side fetch defence (PIG-WEB-LOGIC.SECURE.7).'
