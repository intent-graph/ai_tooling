- uid: PIG-WEB-LOGIC.PROCESS.2
  name: Side Effects and Delivery
  intent: Every effect that must not be lost is an outbox or job row written by the
    database function in the transaction of the change and delivered after commit
    at least once to idempotent consumers; foreign mutations run as atomic phases
    in a worker while the request answers 202 with a status resource, and no transaction
    is held open across a remote call.
  epistemic_state: 'known | tension: L233''s post-commit hooks narrowed to losable
    work by L600; J1''s ACT.2 (in-request phases) against ACT.3 (no foreign effect
    inside the request), resolved by the worker path and in J1 R3 | unvalidated: atomic
    phases rest on one T3 source (L589)'
  constraints:
  - Every effect that must not be lost is an outbox or job row written by the database
    function in the transaction of the change; Python workers deliver it after commit.
  - 'Delivery is at least once and every consumer idempotent: the receiver records
    the processed message id in the transaction of its own state change and answers
    a repeat as the first; late acknowledgement only for idempotent tasks.'
  - 'Foreign mutations run as atomic phases in a worker: the request writes the intent
    with its idempotency key through one API function call and answers 202 with a
    status resource; each local phase is one API function call recording a recovery
    point on the key row; commit before each foreign call; the idempotency key is
    passed to the foreign system; a completer job for abandoned operations and a reaper
    for old keys.'
  - In-request phases are acceptable only when the user must see the foreign outcome
    in the same response and the call is expected to finish within a few seconds,
    under the request timeout (ACT.3).
  - Never a transaction open across a remote call.
  - Post-commit hooks only for losable work, registered as robust so one failure does
    not skip the others.
  - No saga inside one Postgres.
  - 'Forbidden: post-commit hooks as the default carrier; enqueueing to a broker before
    or after commit.'
  design_notes: "Positions: - P1 trigger side effects (e-mail, enqueue, publish, cache\
    \ invalidation) only after commit, through post-commit hooks (L233).\n  - P2 never\
    \ hold a database transaction open across calls to remote services; bracket each\
    \ foreign mutation with its own short local transactions (L234; synthesis).\n\
    \  - P3 a data change and a message cannot be made atomic by two writes: record\
    \ the message or job in the same transaction (outbox, staged job table) and deliver\
    \ after commit (L409).\n  - P4 relays and queues deliver at least once, so consumers\
    \ and tasks are idempotent (processed message ids); late acknowledgement only\
    \ for idempotent tasks (L410).\n  - P5 record the idempotency key and the effect\
    \ atomically (L270, grounded since by L599).\n  - P6 for a request that mutates\
    \ foreign state: atomic phases, a recovery point after each phase and foreign\
    \ call, commit before the foreign call, an idempotency key passed to the foreign\
    \ system, a completer for abandoned requests and a reaper for old keys (L589;\
    \ one T3 source).\n  - P7 within one Postgres, one local ACID transaction, not\
    \ a saga; sagas only across services with separate databases, accepting their\
    \ lack of isolation and hand-written compensations (L590).\n  - P8 the receiver\
    \ records processed messages in the transaction of its state change and answers\
    \ a repeat as it answered the first (L599).\n  - P9 a post-commit hook is not\
    \ part of the transaction: a crash after commit loses the effect, a failing hook\
    \ can skip later ones unless robust; use it for losable work, the outbox when\
    \ the follow-up must not be lost; enqueuing before commit lets a worker see uncommitted\
    \ data, after commit risks a crash between the two (L600).\n\nForces: correctness\
    \ (no lost, early or doubled effect); request latency.\n\nDecision (ACT.2):\n\
    \  1. Every effect that must not be lost is an outbox or job row written by the\
    \ database function in the transaction of the change (P3, ACT.2, MD-03); Python\
    \ workers deliver it after commit (PROCESS.1's claim).\n  2. Delivery is at least\
    \ once and every consumer idempotent: the receiver records the processed message\
    \ id in the transaction of its own state change and answers a repeat as the first\
    \ (P4, P8); late acknowledgement only for idempotent tasks (P4).\n  3. **Foreign\
    \ mutations** (a payment): atomic phases (P6) **run in a worker** (review M4).\
    \ The request writes the intent with its idempotency key through one API function\
    \ call and answers 202 with a status resource (EXPOSE.3, ACT.3); the worker runs\
    \ the phases. Each local phase is one API function call that records a recovery\
    \ point on the key row; commit before each foreign call; the idempotency key passed\
    \ to the foreign system; a completer job for abandoned operations and a reaper\
    \ for old keys (PROCESS.1). The key row carries the recovery point and a lock\
    \ with an expiry, so a duplicate request is answered by EXPOSE.3's multi-phase\
    \ rule (review M3).\n     - (superseded by MD-09) In-request phases are acceptable\
    \ when the user must see the foreign outcome in the same response and the call\
    \ fits ACT.3's few-seconds threshold (MD-09).\n     - Grounds: J1's ACT.2 allows\
    \ in-request atomic phases while ACT.3 forbids foreign effects inside the request;\
    \ the worker path satisfies both, and matches this branch's refusal to hold synchronous\
    \ workers on slow I/O (PROCESS.4, ENFORCE.4). The tension is J1's own and is routed\
    \ to J1's owner.\n  4. Never a transaction open across a remote call (P2).\n \
    \ 5. Post-commit hooks only for losable work (cache invalidation, best-effort\
    \ notices), registered as robust so one failure does not skip the others (P9;\
    \ P1 narrowed).\n  6. No saga inside one Postgres (P7).\n\nRejected: post-commit\
    \ hooks as the default carrier: acceptable for losable work (P9). Enqueueing to\
    \ a broker before or after commit: never (P9, L409). Sagas: win when a business\
    \ transaction spans services with separate databases (P7, L480). Foreign mutations\
    \ inside the request by default: rejected (ACT.3's forbidden column; review M4);\
    \ acceptable under step 3's condition.\n\nRealizes: ALLOCATION.ACT.2 (stages and\
    \ delivers side effects as the placement sets); follows ALLOCATION.ACT.3 (foreign\
    \ effects deferred)."
