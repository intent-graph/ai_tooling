    carries a long max-age on the application's host, with includeSubDomains once
    its subdomains serve HTTPS; preload is a recorded decision only when the team
    controls the registrable domain, because it is slow to undo. Database connections
    across a network hop are encrypted and verified.
  epistemic_state: 'known | unvalidated: staged HSTS ramp (L147); database connection
    encryption | gap: no row on Postgres connection TLS; proxy-to-app re-encryption
    open (L140)'
  constraints:
  - TLS terminates at the single reverse proxy (TOPOLOGY.1). The proxy redirects HTTP
    permanently and forwards only HTTPS-originated requests. It obtains and renews
    certificates itself, or through a tested ACME client. TLS 1.3, with 1.2 kept only
    for clients that need it.
  - 'HSTS is sent on every HTTPS response, set in one place. Default end state: a
    long max-age on the application''s host, reached by raising max-age in steps,
    with includeSubDomains once its subdomains serve HTTPS. The HTTP redirect stays.'
  - 'Preload is the target when the team controls the registrable domain and commits
    every subdomain, internal ones included, to HTTPS for the long term. It is recorded
    as an ADR (EVOLUTION.3) because removal from the preload list takes months to
    reach users. Grounds: the preload list''s operators advise "do not include the
    preload directive by default", and preloading covers every subdomain of the base
    domain, "including internal subdomains that are not publicly accessible" (hstspreload.org);
    the HSTS source calls the scope "a commitment". A web application often runs on
    a subdomain of a domain its team does not control. Preload stays the strongest
    protection of the first request.'
  - Session and CSRF cookies are Secure; no subresource is loaded over HTTP.
  - 'Proxy to application server: a unix domain socket on the same host. Across a
    network hop, re-encryption is open (gap).'
  - Database connections that cross a network hop, from every consumer role (backends,
    BI, consoles, scripts), are encrypted and verify the server's certificate. Inferred
    from web-app-philosophy:TRANSVERSE.SECURITY (MD-03 adds consumers outside the
    request path); no row read on Postgres connection settings (gap).
  design_notes: "Rows: L141, L142, L143, L144, L145, L146, L147, L148.\nPositions:\
    \ - P1 terminate TLS at the proxy or edge (L141, majority: FastAPI docs, Twelve-Factor\
    \ routing, Uvicorn's layered setup).\n  - P2 terminate TLS in the Python server\
    \ (Uvicorn documents certificate options, L141 positions).\n  - Consensus practices:\
    \ HTTP to HTTPS permanent redirect at the proxy, only HTTPS-originated requests\
    \ forwarded (L142); automated certificate issuance and renewal at about two thirds\
    \ of validity (L143); TLS 1.3, 1.2 only for compatibility (L144); Secure cookies,\
    \ no HTTP subresource (L145); HSTS on HTTPS responses only with max-age (L146);\
    \ includeSubDomains and preload only after every subdomain serves HTTPS, max-age\
    \ raised in steps (L147); the redirect stays because HSTS does not cover the first\
    \ request (L148).\nForces: P1 serves one place for certificates, protocol policy\
    \ and the edge limits (L091, J3), at the cost of a plaintext hop to the application\
    \ server. P2 serves end-to-end encryption to the process, and spreads certificates\
    \ over every application process. Preload serves the first request (L148); its\
    \ cost is a commitment that breaks any subdomain still on HTTP (L147).\nDecision\
    \ (lead): P1 with every consensus practice; HSTS on the application's host by\
    \ default, preload as a recorded decision.\nRejected: - P2: acceptable when there\
    \ is no proxy, which only local development allows (L091, J3).\n  - Preload as\
    \ the default end state: rejected; it commits the whole registrable domain, internal\
    \ subdomains included, and is slow to undo. It wins under the recorded condition\
    \ above (team controls the registrable domain, long-term HTTPS commitment for\
    \ every subdomain), as an ADR.\n  - HTTPS only on sensitive pages: never (L029,\
    \ J5).\nRealizes: refines TRANSVERSE.SECURITY (transport; part of the A04 owner:\
    \ the proxy's TLS and the database connection TLS); rests on LOGIC.PROCESS (proxy\
    \ in front, J3) and GUARD.4 (Secure session cookie).\nReview fixes: M6 (default\
    \ end state is HSTS with a long max-age on the application's host, includeSubDomains\
    \ once subdomains serve HTTPS; preload only under its recorded condition, as an\
    \ ADR); M4 (A04 transport owner named)."
