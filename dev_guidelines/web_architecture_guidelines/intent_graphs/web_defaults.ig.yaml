- uid: PIG-WEB-INTERACTION.COLLABORATE.2
  name: Threads and Comment Lifecycle
  intent: Threads are an adjacency list with one displayed reply level and a thread-root
    id set at insert; resolution lives on the root and is reversible; deletion is
    a tombstone through the comment's deletion function with replies kept; every edit
    is an append-only revision shown as edited. Erasure against the archive-copy rule
    is handed to the personal-data node.
  epistemic_state: 'known | unvalidated: L669 contested (T4 comparison), L670 synthesis,
    L673 without source; revisions kept after tombstone inferred | gap: erasure deferred;
    its tension with L525''s archive copy handed to PIG-WEB-DATA.MAINTAIN.6'
  constraints:
  - Adjacency list with one displayed level of replies (the depth most review tools
    use) and a thread-root id set once at insert, so a thread loads in one indexed
    query and resolution, counts and permissions attach to the root.
  - 'Resolution on the thread root, reversible, never a deletion. Who may resolve
    follows GUARD.3 as settled: the row-decidable part (the target''s author) is decided
    by the writer function; users with write rights on the target and the product
    roles that grant "resolve" are each backend''s policy. No source gives the thread''s
    opener a resolve right, so none is stated.'
  - 'Deletion is a tombstone: content cleared, deleted_at and actor kept, replies
    preserved. It is an update through the comment''s deletion function, never a bare
    update or a DELETE grant. Keeping the replies is an explicit, justified deviation
    from the default soft-delete cascade (a cascade equals what a native cascading
    delete would remove unless each deviation is explicit): a thread stays readable
    when one comment goes.'
  - 'Every edit is an append-only revision, shown as "edited": what was said and when
    stays reconstructable; the revision rows are the comment''s history (ACT.4).'
  - A tombstone clears the visible content; earlier revisions stay under the history's
    retention and access rules (moderators only) until a retention or erasure rule
    removes them (inferred; erasure itself is the deferred personal-data node).
  - 'Erasure against the archive rule (recorded tension, not settled here): the maintainer
    doctrine allows hard deletion only for rebuildable derived data or after copying
    the row to an archive in the same operation, and grants no DELETE to application
    roles. An archive copy defeats an erasure that must remove personal data. Hard
    deletion of comment content or revisions for erasure is therefore handed to the
    deferred personal-data node (PIG-WEB-DATA.MAINTAIN.6), which must reconcile it
    with the archive rule. The default deletion mechanism for user-facing data is
    basic soft delete (PIG-WEB-DATA.MAINTAIN.2); a tombstone keeps threads intact
    (inferred).'
  design_notes: 'Decides: how threads are stored and resolved and how comments are
    edited and deleted.

    Rows: L669, L670, L671, L672, L673. Cited: L686 (J4), L684, L205, L209, L523 (MAINT),
    L525 (MAINT), L689.

    Positions: thread storage (L669, contested): P1 adjacency list with a displayed-depth
    cap; P2 path enumeration (ltree); P3 closure table. P4 a denormalized thread-root
    id on each reply (L670). Resolution: P5 state on the root (open or resolved, by
    whom, when), reversible, never a deletion, by the target''s author or users with
    write rights on the target (L671); P6 any commenter resolves (L671, for open discussion
    without an owner). Deletion: P7 tombstone (content cleared, deleted_at and actor
    kept, replies preserved) (L672); P8 hard delete (L672, when erasure overrides).
    Edits: P9 append-only revisions shown as "edited" (L673, no source); P10 an edited
    flag only (L673, casual chat).

    Forces: P1 serves simple writes and integrity at the cost of a recursive read;
    P2 and P3 serve subtree reads at the cost of moves and writes. P4 serves one indexed
    thread read at the cost of a column set once. P5 serves workflow clarity and accountability.
    P7 and P9 serve thread integrity and moderation evidence, at the cost of storage;
    P8 serves privacy erasure.

    Decision (the rules are the constraints):

    Rejected: P2, P3: win when whole-subtree reads dominate and writes and moves are
    rare (L669). P6: acceptable for open discussion without an owner (L671). P8: wins
    when a privacy erasure or retention rule demands it (L672), through a deletion
    function, its tension with L525''s archive copy handed to PIG-WEB-DATA.MAINTAIN.6.
    P10: acceptable for casual chat with no business or regulated use (L673), not
    the default.

    Realizes: J4 INTERACTION.COLLABORATE decisions 5 and 6; ALLOCATION.ACT.4 (proposed:
    revisions are history written in the same transaction); ALLOCATION.GUARD.3 (proposed:
    resolve right).

    Hand-offs: deletion and retention policy per entity (PIG-WEB-DATA.MAINTAIN.2,
    L205); history tables (PIG-WEB-DATA.MAINTAIN.3); personal-data erasure (PIG-WEB-DATA.MAINTAIN.6,
    deferred).'
