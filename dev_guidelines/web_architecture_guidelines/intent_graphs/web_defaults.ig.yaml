- uid: PIG-WEB-INTERACTION.COLLABORATE.1
  name: Comment Anchoring
  intent: A comment is anchored by a mandatory foreign key to its target record, with
    an optional field name, and always records the target version it was written against;
    text ranges are stored with redundant selectors, and the anchor state (anchored,
    moved, orphaned, outdated) is explicit. A comment whose anchor is lost stays visible
    apart, never deleted or silently reattached.
  epistemic_state: 'known | unvalidated: L665 inferred from one T1 model (SRC-376);
    "always record the version" inferred from GUARD.5 and ACT.4'
  constraints:
  - 'Anchor by identity: a mandatory foreign key to the target record, plus an optional
    field name for per-attribute review. A type-and-id pair without a foreign key
    is not an anchor (integrity, inferred; table shape is DATA''s).'
  - 'The target version is always recorded: the default already versions every user-edited
    record (GUARD.5) and writes its history (ACT.4), so the cost the source counts
    is paid; the interface marks a comment written on an earlier version. This takes
    the source''s "when" to "always" (inferred from those two placements).'
  - Ranges only for long text, stored with redundant selectors; offsets alone suffice
    for text immutable per version.
  - 'Anchor state is explicit: anchored, moved, orphaned or outdated; a comment whose
    anchor is lost stays visible in a separate place, never deleted or silently reattached.'
  - 'Comments are written through the comment writer function (MD-03: the comment,
    its notification rows and history are one multi-table operation).'
  design_notes: 'Decides: to what a comment is anchored and how anchors survive edits.

    Rows: L665, L666, L667, L668. Cited: L664 (J4), L684, L260.

    Positions: anchor granularity: P1 record (L665 default), P2 field, P3 version
    (L666), P4 text range (L667); range storage: P5 redundant selectors (exact quote
    with prefix and suffix, character offsets, structural path) (L667), P6 offsets
    alone (rejected in L667 unless text is immutable per version); anchor loss: P7
    explicit states (anchored, moved, orphaned, outdated), comment kept visible apart
    (L668), P8 delete or silently reattach (rejected in L668).

    Forces: P1 serves simple queries and permissions; P3 serves the comment''s meaning
    over time and auditability, at the cost of a version lookup (L666); P5 serves
    anchors that survive edits; P7 serves no silent loss of discussion.

    Decision (the rules are the constraints):

    Rejected: P1 alone (without version): acceptable when the target is not versioned
    (no such target among user-edited records in the default). P6: acceptable when
    the text is immutable per version (L667). P8: wins never (L668).

    Realizes: J4 INTERACTION.COLLABORATE decision 5; ALLOCATION.GUARD.5 and ACT.4
    (proposed links: the version and history it reuses); ALLOCATION.ACT.1 (proposed:
    one writer function).

    Hand-offs: comment and target table shapes (PIG-WEB-DATA.ORGANIZE.1, .2).'
