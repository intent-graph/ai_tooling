- uid: PIG-WEB-INTERACTION.COLLABORATE.4
  name: Notifications and Moderation
  intent: Notifications are rows written by the comment writer function in the comment's
    transaction and delivered after commit; mentions are parsed on the server and
    notify only recipients who may see the target. Moderation actions are always recorded
    with reason, actor and time, removal runs through a deletion function, and a report
    queue is required whenever people outside the team read comments.
  epistemic_state: 'known: MD-05 | open: author edit window value | unvalidated: L683
    and L689 are syntheses | gap: legal moderation obligations not read (L689)'
  constraints:
  - 'Notifications are rows written by the comment writer function in the comment''s
    transaction (MD-03: a multi-table operation; ACT.2''s staged intent), delivered
    after commit from those rows (in-app read state; the real-time wake-up of REALTIME.5);
    external delivery (email, push) is the deferred delivery node.'
  - Mentions are parsed on the server and a notification is created only for a recipient
    who may see the target (notifications are a secondary surface).
  - 'A recipient''s read right (MD-05): the backend that submits the comment checks
    each recipient through the database read function of PIG-WEB-LOGIC.SECURE.1 before
    passing recipients to the writer function.'
  - 'Consequence: the recipient check protects the notifications the application sends,
    nothing stronger; the operator role and any unrestricted role that may SELECT
    the base tables see notification rows too. The reporting role gets no SELECT on
    comment content or on comments with a narrower audience than their target, and
    reads comments only through database functions (grants: PIG-WEB-DATA.GUARD.2).'
  - 'Moderation actions are always recorded: hide and restore with reason, actor and
    time written to history; hide first, remove only under a retention or legal rule;
    authors edit their own comments within a stated window, each edit a revision (.2).
    Removal runs through a deletion function, never a DELETE grant; where a legal
    rule demands erasure rather than an archive copy, the tension with the archive
    rule is the personal-data node''s (PIG-WEB-DATA.MAINTAIN.6, deferred).'
  - A report queue (report rows, status, decision) is required whenever comments are
    visible to people outside the team (customers, the public).
  - Moderate is a separate ability; agent-authored comments are marked and filterable
    as a class.
  design_notes: 'Decides: how collaboration notifications are created and how comments
    are moderated.

    Rows: L683, L689. Cited: L624, L409, L410 (ACT.2), L686, L687 (J4), L659, L525
    (MAINT).

    Positions: notifications: P1 rows (recipient, reason, target, read state) created
    in the same transaction as the comment, delivered asynchronously from those rows;
    mentions parsed on the server and each mentioned user''s right to see the target
    checked before notifying (L683, inferred synthesis); P2 notifications sent directly
    from the request (the lost or phantom case L683 rules out). Moderation: P3 a queue:
    report row, status, action (hide, restore, remove) with reason, actor and time
    written to history; hide first; delete only by a retention or legal rule; authors
    edit their own comments within a stated window (L689, inferred); P4 hide and author
    edit only (L689, internal team comments).

    Forces: P1 serves no lost, phantom or leaking notification; P2 serves only fewer
    rows. P3 serves accountability and appeal, at the cost of a queue and a workflow;
    P4 serves simplicity where nobody outside the team reads or reports.

    Decision (the rules are the constraints):

    Rejected: P2: wins never (L683). P4 (no report queue): acceptable when only team
    members read and write comments (L689); the recorded hide and restore stay.

    Realizes: ALLOCATION.ACT.2 (skeleton link: notifications as staged side effects);
    ALLOCATION.GUARD.3 (proposed, requires: recipient visibility, open read clause
    included); ALLOCATION.ACT.4 (proposed: moderation history).

    Hand-offs: notification delivery worker (PIG-WEB-LOGIC.PROCESS.2); email and push
    (PIG-WEB-LOGIC.PROCESS.7, deferred); comment grants of reporting and operator
    roles (PIG-WEB-DATA.GUARD.2); erasure against the archive rule (PIG-WEB-DATA.MAINTAIN.6,
    deferred).'
