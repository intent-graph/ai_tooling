- uid: PIG-WEB-TRANSVERSE.EVOLUTION.2
  name: Modular Monolith
  intent: 'The backend is cut by business concept with public module interfaces, and
    boundaries are checked in the pipeline: a module never reaches another domain''s
    tables, while the function API (cross-domain operations included, composed in
    the database) is reachable within the role''s grants. A business operation lives
    in its database function; the Python module holds workflow and product policy.'
  epistemic_state: 'known | unvalidated: modules aligned with domain schemas; the
    module rule (tables forbidden, function API reachable within grants) | gap: no
    module-boundary tool read (L123)'
  constraints:
  - The backend is cut by business concept (orders, billing), each module with a public
    interface.
  - The module boundary forbids reaching another domain's **tables** directly. The
    function API is reachable from every module, within its role's grants, the same
    as for a backend in another language (RECORD.2). Inferred, unvalidated.
  - One business operation is one database function call in its own transaction (PIG-WEB-DATA.INTERFACE.1).
  - A cross-domain business operation (for example an order that also creates an invoice)
    is therefore one database function. It is called by the module that owns the workflow
    and owned by the team that owns that workflow, reviewed by the database owner
    role that holds what spans schemas (web-app-philosophy:TRANSVERSE.EVOLUTION.5).
  - The Python module interface carries workflow and product policy, never a second
    path to another domain's data.
  - 'Module boundaries are checked automatically in the pipeline, as a fitness function:
    the check fails on a direct read or write of another domain''s tables. The tool
    is open (gap).'
  - One place per concept. A business operation lives in its database function; the
    Python module holds workflow and product policy, with only tested copies of per-user
    write rules (ACT.1).
  design_notes: "Rows: L122, L123, L124. Cited: L513, L596.\nPositions: (no opposing\
    \ position): modules by business concept with public interfaces (L122); boundaries\
    \ enforced by automated checks (L123, inferred); framework layers loosely coupled,\
    \ each concept or datum in one place (L124).\nForces: changeability and future\
    \ extraction, at the cost of boundary tooling.\nDecision (lead): all three, aligned\
    \ with the database's domains.\nRejected: - Modules by technical layer: never\
    \ (L122). Boundaries by convention alone: never (L123).\n  - A module reaching\
    \ another domain's data only through that module's Python interface: rejected.\
    \ A business operation that writes two domains would then need two calls, either\
    \ in two transactions (atomicity lost) or in one backend transaction wrapping\
    \ several API calls, which ACT.1 forbids (MD-03). It would also give a backend\
    \ in another language more reach than a module of the team's own backend.\nRealizes:\
    \ refines TRANSVERSE.EVOLUTION.2, .3 and .5 (J5); rests on ACT.1 (one call per\
    \ operation, operations in the database, workflow in the backend), RECORD.2 (function\
    \ API per role) and MD-03.\nReview fixes: B1 and X3 (the rule forbids another\
    \ domain's tables only; the function API, cross-domain operations included, is\
    \ reachable from every module within its role's grants; cross-domain operations\
    \ are one database function owned per J5 EVOLUTION.5; the rule marked unvalidated)."
