- uid: PIG-WEB-ALLOCATION
  name: Stack Allocation
  intent: In the default stack Postgres carries the data, the function API every consumer
    calls, the per-role grants and the backing roles (queue, schedules, derived caches,
    sessions) until a measured limit; Python backends own sessions, identity, product-policy
    authorization, workflow and HTML rendering; browser JavaScript enhances; stored
    facts originate in the Postgres schema and typed models are generated from it
    (type chain); there is no JavaScript server tier and no row-level security by
    default. The database is shared by several consumers (MD-03), so what must hold
    whoever touches the data lives in Postgres.
  epistemic_state: 'known: MD-05'
  constraints:
  - Postgres hosts the backing roles (queue, schedules, derived caches, sessions,
    documents) until a measured limit for that role.
  - The database function API in a dedicated schema is the default contract to the
    data; no views in the contract.
  - Stored facts originate in the Postgres schema; the origin of interface-only facts
    is chosen per project and the description stays in sync by process (MD-02).
  - No row-level security by default (MD-01).
  - No request-time JavaScript server in the default; Python renders HTML.
  - Python backends own sessions, per-user authorization of product policy, workflow
    and HTML rendering.
  design_notes: 'Roll-up of the seven placements below; owns no ledger row. Context:
    MD-03 makes a shared database (several backends, BI, consoles, scripts) the default,
    replacing the earlier single-consumer context. Maintainer decisions applied: MD-01
    (row security), MD-02 (interface description sync, origin per project), MD-03
    (shared database, multi-table operations in database functions). Open: one clause,
    read visibility of rows with per-user rules (Q1, ALLOCATION.GUARD.3 in the philosophy
    graph); former recorded default (superseded) is each backend filtering from one
    shared specification with shared denial tests; fallback is database read functions
    receiving the verified actor, acceptable when a per-user read rule must hold for
    two or more backends (always the case under MD-03); roles that may SELECT base
    tables see every row unless their own role is restricted. Revisions: R1 (MD-01,
    MD-03), R2 and R3 changes sit in the children.'
  impl_pointers:
