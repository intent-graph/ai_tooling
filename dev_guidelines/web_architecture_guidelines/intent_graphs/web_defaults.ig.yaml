- uid: PIG-WEB-TRANSVERSE.CONTRACTS.2
  name: Contract Meaning and Ownership
  intent: 'A schema is necessary but not sufficient: units, time zone, precision and
    rounding are enforced by constraints where possible and written next to the object
    otherwise, and every contract records owner, meaning, quality rules, availability
    promise and lifecycle status. The function API carries no formal version number;
    change is carried in new names, the HTTP description in its document version.'
  epistemic_state: 'known | unvalidated: meaning stored in the catalogue; decimal
    form | conflict: L564''s derivation direction against RECORD.3 (J1 wins); L565''s
    version field read through L517 (MAINT); realizes the L517 narrowing, counted
    at PIG-WEB-DATA.INTERFACE.1'
  constraints:
  - 'Meaning is machine-checked where it can be: units, ranges and precision as column
    types and constraints in Postgres, as field constraints in Pydantic. Where it
    cannot, it is written next to the object: units, time zone, precision, rounding.'
  - Every contract records owner, meaning, quality rules, freshness or availability
    promise and lifecycle. This includes the function API and the tables BI reads
    (MD-03). Stored facts are documented from the live database, the meaning text
    kept in the catalogue next to each object (mechanism inferred).
  - 'Owner: the database owner for the function API and granted tables, or a domain
    schema''s owning team when teams multiply; the backend team for HTTP.'
  - 'Version and lifecycle. Each function, granted column and endpoint carries a status:
    active, deprecated, retired. The function API carries no formal version number.
    Change is carried in names: a new function beside the old, which is the expand
    step of the philosophy and the route the maintainer''s own rule takes for stored
    contract schemas, not the coordinated-change text. "Deployed together" stays acceptable
    only when every consumer of the changed object ships in the same deployment as
    the migration; otherwise expand, migrate, contract (the narrowing is counted at
    PIG-WEB-DATA.INTERFACE.1). The HTTP description carries its document version and
    the deprecation signals.'
  - Money and decimals cross JSON as strings with stated precision and currency or
    unit (inferred form).
  design_notes: "Rows: L562, L563, L564, L565. Cited: L474, L483, L517, L512, L275.\n\
    Positions: - P1 a schema is necessary, not sufficient: record units, time zone,\
    \ precision and rounding in the contract text or in constraints (L562; JSON format\
    \ is only an annotation, JSON has no integer or date type, Pydantic emits Decimal\
    \ as a string).\n  - P2 the ODCS document format for data contracts; for one application\
    \ database use its field list as a checklist and skip the format unless data leaves\
    \ for a platform team (L563, open).\n  - P3 keep the logical type in the contract\
    \ and derive the Postgres, Python and TypeScript types from it (L564; derivation\
    \ inferred).\n  - P4 one owner, a version and a lifecycle status per contract\
    \ (L565).\n  - Read against L517 (MAINT): a breaking change is coordinated with\
    \ every consuming team and deployed together; no formal version numbers on the\
    \ function API.\nForces: P1 and P4 serve correct reading by consumers outside\
    \ the producer, at the cost of writing meaning down. P2's format serves exchange\
    \ with data platforms, at the cost of a second document. P3 serves one logical\
    \ origin, against J1's placement of the origin.\nDecision (lead): P1, P4, and\
    \ P2's checklist; P3 as documentation only.\nRejected: - P3's derivation direction\
    \ for stored facts: rejected by RECORD.3 and TYPE_CHAIN (J1), which make the Postgres\
    \ schema the origin. The logical-versus-physical split is kept as documentation\
    \ of each field.\n  - The ODCS format itself: acceptable when data leaves the\
    \ system for a separate data platform team (L563).\n  - A schema without written\
    \ meaning: never (L562, L483).\nRealizes: refines TRANSVERSE.CONTRACTS (explicit\
    \ artifact with meaning); rests on RECORD.3, TYPE_CHAIN, MD-02, DB_API (L517).\n\
    Review fixes: M1 and X2 (the new-name rule credited to J5's expand step and L512,\
