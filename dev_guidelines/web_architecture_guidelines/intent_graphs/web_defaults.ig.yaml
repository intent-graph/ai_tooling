meta:
  name: Web Defaults
  description: Architecture defaults for a JavaScript + Python + Postgres web application
    (PIG-WEB).
nodes:
- uid: ROOT
  name: Web Defaults
  intent: 'Architecture defaults for a JavaScript + Python + Postgres web application
    that realize the web-app philosophy under the maintainer decisions MD-01 (no row-level
    security by default), MD-02 (interface description always in sync, origin per
    project) and MD-03 (a shared database; multi-table operations belong to it). Postgres
    is the authority for what must hold whoever touches the data; Python backends
    own product policy, identity and workflow; the browser enhances server-rendered
    HTML. Branches: stack allocation (which mechanism hosts which role), the Postgres
    data tier, the Python application tier, the browser and agent surface, and transverse
    concerns.'
  epistemic_state: known (roll-up)
  design_notes: 'Maintainer decisions applied: MD-01 (row-level security is not a
    default; acceptable only for a simple data model, with the scoping key in every
    covered table and no all-powerful administrator role), MD-02 (interface documentation
    is always in sync, guaranteed by process; its origin, description or code, is
    chosen per project with criteria for each direction), MD-03 (the database is shared
    by several backends and other consumers; multi-table operations belong to the
    database as functions; the function API is the default contract to the data).
    Each decision overrides the judges on its point and is cited by id in the nodes
    it governs. Open maintainer questions: read visibility of rows with per-user rules
    when several backends share the database; default deletion for user-facing transactional
    data; SameSite value of the session cookie; hosting model of the default context.


    Maintainer answers MD-04 (deletion: basic soft delete by default), MD-05 (reads:
    simple direct, sensitive through database functions), MD-06 (hosting per project)
    and MD-07 (SameSite as judged) closed the four open questions; no clause is decided
    by MD-05.'
  history:
