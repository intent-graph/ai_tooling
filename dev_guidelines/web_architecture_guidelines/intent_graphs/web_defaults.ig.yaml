- uid: PIG-WEB-TRANSVERSE.OPERABILITY.3
  name: Monitoring
  intent: Latency, traffic, errors and saturation are monitored per process type and
    for Postgres as histograms, with black-box probes of critical journeys, objectives
    set from user needs, and pages to a human only when urgent and user-visible. pg_stat_statements
    is on from the first deploy, and the triggers that move the Postgres-first placements
    are measured, not guessed.
  epistemic_state: 'known | unvalidated: per-role database load; placement triggers
    as monitored signals'
  constraints:
  - The four signals per process type (web, worker) and for Postgres, as histograms.
    Black-box probes of the critical journeys.
  - 'Indicators: the page targets of PERFORMANCE at the 75th percentile, availability
    and server latency of the critical journeys. Objectives are set from what users
    need.'
  - Pages go to a human only on urgent, user-visible conditions; everything else is
    a ticket.
  - pg_stat_statements is enabled from the first deploy. Its per-role figures give
    database load per consumer role (backends, BI, operators), which the access-path
    decision needs to decide when BI moves to a replica (inferred).
  - 'The triggers that move POSTGRES_FIRST, JOB_HOST and CACHE_STORE are measured,
    not guessed: queue backlog age and claim contention, commit latency under NOTIFY,
    cache hit latency and load on the primary. Job failures, durations and missed
    runs are monitored; the drift guard on denormalised data alerts on divergence.'
  design_notes: 'Rows: L383, L384, L385, L386, L387, L388, L389. Cited: L605, L533,
    L127.

    Positions: (consensus): latency, traffic, errors and saturation at least (L383);
    percentiles or histograms (L384); a handful of indicators from what users care
    about, objectives not set from current performance (L385); page a human only when
    urgent, actionable and user-visible (L386); white-box and black-box together (L387);
    utilisation, saturation and errors per resource when hunting a bottleneck (L388);
    pg_stat_statements preloaded (L389).

    Forces: detection and diagnosis, at the cost of instrumentation and of alert discipline.

    Decision (lead): all seven, extended to the placements that wait on a measurement.

    Rejected: averages as the latency measure: never (L384). Alerting on every cause:
    never as pages (L386).

    Realizes: refines TRANSVERSE.OPERABILITY; supplies the measurements that POSTGRES_FIRST,
    JOB_HOST and CACHE_STORE name as their triggers (J1) and that RECORD.2''s BI path
    needs.'
