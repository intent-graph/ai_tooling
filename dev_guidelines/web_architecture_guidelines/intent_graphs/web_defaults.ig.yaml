- uid: PIG-WEB-LOGIC.EXPOSE.6
  name: Payload Schemas
  intent: Pydantic models parse every entry (strict for JSON bodies, lax coercion
    for forms and query strings), request models reject unknown fields while responses
    stay open to readers, input and output models are separate, and a response that
    fails its model is a 500 and a defect. OpenAPI 3.1 with JSON Schema 2020-12 stays
    in sync with the models by CI.
  epistemic_state: 'known | unvalidated: the reader and writer rule (L557, inferred);
    L552 to L558 rest on single sources'
  constraints:
  - Pydantic models at every entry, forms and query strings included; strict mode
    for JSON bodies, lax coercion for form and query strings.
  - 'Request models forbid unknown fields (`additionalProperties: false`, `unevaluatedProperties:
    false` when composed); response schemas stay open to readers.'
  - Separate input and output models; request and response schemas published separately
    where they differ; null and absent declared separately.
  - OpenAPI 3.1 with JSON Schema 2020-12 and type arrays, kept in sync with the models
    by CI (MD-02); fields echoing stored facts are generated from the catalogue or
    checked against it; the same always-in-sync rule covers the agent tool surface's
    schemas and the function API catalogue.
  - A new request field is sent by a client only once every server instance accepts
    it.
  - A response that fails its model is a 500 and a defect, never sent malformed.
  - TypeScript types for islands are generated at build time only; whether islands
    validate responses at runtime is the browser tier's decision.
  - Generated clients, agents' included, read only what they use.
  - 'Forbidden: closed response schemas; coercion everywhere or strict everywhere.'
  design_notes: "Positions: - P1 declare \"may be null\" and \"may be absent\" separately;\
    \ a Pydantic `Optional` field allows null (L550).\n  - P2 one schema dialect across\
    \ tiers: OpenAPI 3.1 adopts JSON Schema 2020-12, Pydantic emits schemas compliant\
    \ with both; type arrays instead of the old `nullable` (L551).\n  - P3 publish\
    \ request and response schemas separately where they differ (Pydantic's validation\
    \ and serialization modes) (L552).\n  - P4 separate input and output models, so\
    \ the response model limits what leaves the server (L553).\n  - P5 a response\
    \ that fails its response model is a server defect: a server error, never a malformed\
    \ body (L554).\n  - P6 TypeScript types generated from OpenAPI are runtime-free;\
    \ runtime validation of server responses in the browser is a separate decision\
    \ (L555).\n  - P7 consumers generated from the full producer schema are brittle;\
    \ readers take only what they use (L556).\n  - P8 object schemas open for readers,\
    \ closed for writers: `additionalProperties: false` on request bodies you control,\
    \ not on responses; `unevaluatedProperties` for composed schemas (L557; the rule\
    \ inferred).\n  - P9 decide coercion per boundary: Pydantic coerces by default,\
    \ strict mode errors instead and is looser for JSON than for Python input; strict\
    \ for a JSON API, coercion for forms and query strings (L558).\n  - Placements:\
    \ TYPE_CHAIN (stored facts from the schema; the interface origin recorded per\
    \ project; OpenAPI and Pydantic models in sync by CI, MD-02); GUARD.1 (parse at\
    \ every entry into precise types).\n\nForces: correctness of the contract; security\
    \ (closed inputs, filtered outputs); changeability (tolerant readers).\n\nDecision:\
    \ 1. **Pydantic models at every entry**, forms and query strings included (GUARD.1,\
    \ TYPE_CHAIN): strict mode for JSON bodies, lax coercion for form and query strings\
    \ (P9). Request models forbid unknown fields (`additionalProperties: false`, `unevaluatedProperties:\
    \ false` when composed); response schemas stay open to readers (P8).\n  2. Separate\
    \ input and output models (P4); request and response schemas published separately\
    \ where they differ (P3); null and absent declared separately (P1).\n  3. OpenAPI\
    \ 3.1 with JSON Schema 2020-12 and type arrays (P2), kept in sync with the models\
    \ by MD-02's process (TYPE_CHAIN; the gate in EXPOSE.7); fields that echo stored\
    \ facts are generated from the catalogue or checked against it (TYPE_CHAIN). How\
    \ the description is produced under Django is ENFORCE.5's gap (candidate to verify:\
    \ Django Ninja; review m7). The same always-in-sync rule covers the agent tool\
    \ surface's schemas (for example an MCP server's tool list) and the function API\
    \ catalogue (X7).\n     - Closed request models and deploy skew (review m4): because\
    \ requests are closed to unknown fields, a client sends a new request field only\
    \ once every server instance accepts it (EXPOSE.7 step 4).\n  4. A response that\
    \ fails its model is a 500 and a defect, never sent malformed (P5).\n  5. TypeScript\
    \ types for islands are generated at build time only (TYPE_CHAIN, P6). Whether\
    \ islands validate responses at runtime is the browser tier's decision (PIG-WEB-INTERACTION),\
    \ not this node's; the server's share is P5 plus additive evolution (EXPOSE.7).\n\
    \  6. Generated clients, agents' included, read only what they use (P7).\n\nRejected:\
    \ one model for input and output: acceptable when the shapes are equal, as in\
    \ simple CRUD (L549 via TYPE_CHAIN). Closed response schemas: never (P8). Coercion\
    \ everywhere, or strict everywhere: rejected (P9).\n\nRealizes: PIG-WEB-ALLOCATION.TYPE_CHAIN\
    \ (publishes payload schemas where the type chain assigns); ALLOCATION.GUARD.1\
    \ (parses payloads at the boundary)."
