- uid: PIG-WEB-ALLOCATION.TYPE_CHAIN
  name: Type Definition Chain
  intent: Stored facts originate in the Postgres schema in migrations, with persistence
    models and typed function wrappers generated from the live catalogue; the interface
    description (OpenAPI) and agent tool descriptions are always kept in sync with
    the Pydantic models by process, and which side is the origin is recorded per project
    (MD-02). The default chain starts at HTML form and query input parsed into Pydantic
    models; TypeScript types are generated for client-rendered islands only.
  epistemic_state: 'known: MD-02 | unvalidated: generators not read; no source recommends
    the whole chain (L549)'
  constraints:
  - One origin per fact; stored facts originate in the Postgres schema in migrations.
  - Python persistence models and typed wrappers of API functions are generated from
    the live catalogue.
  - Interface field types that echo a stored fact are generated from it or checked
    against it in CI.
  - 'The OpenAPI description, and the agent tool descriptions derived from the same
    core, are always in sync with the Pydantic models: the other side is generated
    or conformance-checked, contract diffs are reviewed, and a CI/CD gate fails on
    drift (MD-02).'
  - 'Record per project which side is the origin of interface-only facts, with the
    criteria: OpenAPI first for independent consumers or agent hosts the team does
    not control; Pydantic first when every consumer ships with the team.'
  - TypeScript types are generated from the description for client-rendered islands
    only, at build time only.
  - 'Authority: the Postgres schema (stored facts); the project''s recorded origin
    (interface-only facts).'
  - 'Forbidden: hand-written copies without a CI comparison; drift between description
    and models.'
  design_notes: 'Positions: P1 Postgres schema first, one class for table and validation
    (L549); P2 Pydantic models first, OpenAPI generated and committed (L548); P3 OpenAPI
    first, checked in CI (L272). Forces: correctness against changeability. Decision
    (MD-02, F3, F9): per-project origin and sync process; default chain starts at
    form and query input parsed into Pydantic models (the browser receives HTML),
    then reaches the agent surface (L634, L635) and any JSON endpoints; TypeScript
    types for islands only (L555). Rejected: P1''s single class, acceptable for simple
    CRUD where shapes are equal (L549); the former fixed defaults (Pydantic first,
    OpenAPI first) are replaced by MD-02''s per-project decision. Would move it: project
    type (MD-02). Evidence gaps: generators for persistence models, interface fields
    and function wrappers not read; no source recommends the whole chain database
    schema to Python models to OpenAPI to TypeScript (L549). Revision R1: per-project
    origin and sync process; chain starts at HTML forms and the agent surface; stored
    facts from the catalogue.'
