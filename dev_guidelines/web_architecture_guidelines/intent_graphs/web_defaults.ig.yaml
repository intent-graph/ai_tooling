- uid: PIG-WEB-DATA.MAINTAIN.3
  name: History Tables
  intent: Every table holding business data has an AFTER ROW trigger writing an append-only
    history row in the same transaction, recording the session role, the claimed actor,
    the person an agent acts for and the transaction, written by a narrow history-writer
    role and refused when no actor is present. High-value data adds tamper detection,
    and statement-level audit of owner and operator sessions goes to the security
    log, not the history tables.
  epistemic_state: 'known: MD-03 | unvalidated: the narrow history-writer role is
    inferred | gap: tamper-detection mechanism not read; L685 inferred from one source;
    L684 (cited by J1) has no source'
  constraints:
  - 'Audit history for every table that holds business data: an AFTER ROW trigger
    writes an append-only history row in the same transaction: table, key, operation,
    old and new row values, session role (the consumer, verified by the database),
    claimed actor and the person an agent acts for, transaction id, record time as
    `created_at` (ORGANIZE.3), and the business time and reason when the writer function
    passes them (web-app-philosophy:ALLOCATION.ACT.4). Correlation id and outcome
    for agent actions.'
  - 'Append-only by privilege: no consumer role holds UPDATE or DELETE on history;
    the trigger function is owned by the narrow, non-login history-writer role of
    GUARD.2, which holds only INSERT on the history tables, so a fault in it cannot
    disable the triggers or alter past rows. Retention purges are owner-run jobs under
    the data-job checklist.'
  - 'Tamper detection for high-value data: because the owner role owns the history
    tables and so bypasses grants, a detection mechanism (chained row hashes or an
    external anchor) reveals modified or deleted history. Mechanism open, no source
    read; the requirement stands for high-value data.'
  - 'Temporal model where the product queries past values: validity periods with WITHOUT
    OVERLAPS and PERIOD foreign keys on Postgres 18 or later, exclusion constraints
    with ranges before; the version is checked per project.'
  - Statement-level audit of owner and operator sessions (DDL, human-run jobs) by
    pgaudit or logging, routed to the security event log, not the history tables (web-app-philosophy:ALLOCATION.ACT.4,
    the separate sink).
  - Writes with no actor, or with an actor the session role may not assert, are refused
    (GUARD.3).
  design_notes: "Question: how row history and audit records are written and queried\
    \ in Postgres.\nPositions: L208 no native system-versioned tables: trigger-written\
    \ audit tables or application-written history tables, and statement-level \"who\
    \ ran what\" with pgaudit or logging (majority, inferred); L209 high-value transactions\
    \ get an audit trail with integrity controls: append-only tables plus tamper detection\
    \ (consensus); L210 record the actual date and the record date; L211 choose by\
    \ how tightly history is queried: audit log (simple, hard to read) or temporal\
    \ properties (integrated, model cost); L212 audit by trigger commits atomically\
    \ with the change; AFTER sees the final row; L213 Postgres 18 application-time\
    \ constraints (WITHOUT OVERLAPS, PERIOD), exclusion constraints with ranges before;\
    \ L685 record the acting identity and, when a program acts for a person, both,\
    \ passed through a transaction-local setting (majority, inferred, one source).\
    \ Placement ACT.4: trigger-written, append-only, same transaction, session role\
    \ and claimed actor both recorded, writes without actor refused, pairing checked;\
    \ agent actions carry acting identity, delegating subject, operation, correlation\
    \ id, outcome (L658); the security event log apart (L049, L392).\nForces: completeness\
    \ and trustworthiness of history (integrity) against write cost and query convenience.\n\
    Decision and grounds: realization of ACT.4 (MD-03), the max.\n  - Audit history\
    \ for every table that holds business data: an AFTER ROW trigger writes an append-only\
    \ history row in the same transaction (L212, L208): table, key, operation, old\
    \ and new row values, session role (the consumer, verified by the database), claimed\
    \ actor and the person an agent acts for (L685, L566), transaction id, record\
    \ time as `created_at` (ORGANIZE.3), and the business time and reason when the\
    \ writer function passes them (L210; J1 ACT.4). Correlation id and outcome for\
    \ agent actions (L658).\n  - Append-only by privilege: no consumer role holds\
    \ UPDATE or DELETE on history; the trigger function is owned by the narrow, non-login\
    \ history-writer role of GUARD.2, which holds only INSERT on the history tables,\
    \ so a fault in it cannot disable the triggers or alter past rows (changed after\
    \ review, M3: it was owned by the owner role). Retention purges are owner-run\
    \ jobs under L545.\n  - Tamper detection for high-value data (L209): because the\
    \ owner role owns the history tables and so bypasses grants, a detection mechanism\
    \ (chained row hashes or an external anchor) reveals modified or deleted history.\
    \ Mechanism open, no source read; the requirement stands for high-value data.\n\
    \  - Temporal model where the product queries past values (L211, L205): validity\
    \ periods with WITHOUT OVERLAPS and PERIOD foreign keys on Postgres 18 or later,\
    \ exclusion constraints with ranges before (L213); the version is checked per\
    \ project.\n  - Statement-level audit of owner and operator sessions (DDL, human-run\
    \ jobs) by pgaudit or logging, routed to the security event log, not the history\
    \ tables (L208; J1 ACT.4, the separate sink).\n  - Writes with no actor, or with\
    \ an actor the session role may not assert, are refused (GUARD.3).\nRejected:\
    \ application-written history as the only record: rejected under MD-03 (J1 ACT.4);\
    \ acceptable when one application is the only writer (L627 via J1). Audit only\
    \ in logs: rejected for business history (L208 keeps logs for statement-level\
    \ audit).\nRealizes: web-app-philosophy:ALLOCATION.ACT.4 (writes history where\
    \ the audit placement says). Conflicts link of PIG-WEB-TRANSVERSE.OPERABILITY.4\
    \ (security log apart) respected.\n\nBuild narrative moved out of the constraints:\
    \ changed after review, M3: it was owned by the owner role."
