- uid: PIG-WEB-LOGIC.ENFORCE.4
  name: Concurrency Model
  intent: Handlers are synchronous on a synchronous application server by default,
    because async is not inherently faster and Django transactions do not work in
    async mode; asynchronous code is confined to the separate process type that holds
    long-lived connections, or a handler fanning out many concurrent external calls.
  epistemic_state: known
  constraints:
  - HTML and JSON request paths are synchronous.
  - Asynchronous code only in the separate process type that holds long-lived connections,
    or in a handler that fans out many concurrent external calls.
  - 'Under async: nothing blocking on the event loop; every transaction in one synchronous
    function (Django) or one `AsyncSession` per task (SQLAlchemy); `CONN_MAX_AGE`
    0 and a pool sized to in-flight queries; no database work held for a connection''s
    lifetime.'
  - 'Forbidden: blocking calls on the event loop.'
  design_notes: "Positions: - P1 default to synchronous handlers; adopt async only\
    \ where in-process I/O concurrency pays (many external calls, streaming, long-lived\
    \ connections); async is not inherently faster (L238).\n  - P2 never run blocking\
    \ code on the event loop; use `def` handlers or executors for blocking libraries\
    \ (L239).\n  - P3 async data access has hard constraints: Django transactions\
    \ do not work in async mode (wrap transactional code in one synchronous function;\
    \ version-dependent); SQLAlchemy needs one `AsyncSession` per task, no lazy loading,\
    \ `expire_on_commit` off (L240).\n  - P4 under Django's async mode: `CONN_MAX_AGE`\
    \ 0, a pool sized to in-flight query concurrency, database work short and outside\
    \ the lifetime of long-lived connections (L241).\n\nForces: simplicity and correctness\
    \ of transactions; throughput for long-lived connections.\n\nDecision: synchronous\
    \ handlers on a synchronous application server by default (P1): the HTML and JSON\
    \ request paths are synchronous. Asynchronous code only in the separate process\
    \ type that holds long-lived connections (real-time channels, agent streams; PIG-WEB-INTERACTION.REALTIME.3,\
    \ PIG-WEB-TRANSVERSE.TOPOLOGY) or in a handler that fans out many concurrent external\
    \ calls. There P2 to P4 apply: nothing blocking on the loop; every transaction\
    \ in one synchronous function (Django) or one `AsyncSession` per task (SQLAlchemy);\
    \ `CONN_MAX_AGE` 0 and a pool sized to in-flight queries; no database work held\
    \ for a connection's lifetime (L094 via J3 LOGIC.PROCESS).\n\nRejected: async\
    \ everywhere: acceptable when a process is dominated by long-lived connections\
    \ or concurrent external I/O (P1). Blocking calls on the event loop: never (P2).\n\
    \nRealizes: no skeleton link; follows J3 LOGIC.PROCESS (no connection or transaction\
    \ per connected client)."
