- uid: PIG-WEB-INTERACTION.COLLABORATE.3
  name: Collaborative Text Editing
  intent: 'Structured fields keep optimistic versions; only fields people genuinely
    write together (description, notes, document body) get a text engine, which is
    server-authoritative: the server accepts steps only against the current version,
    checks edit rights, and persists through the writer function. A CRDT wins only
    where offline use moves the system of record.'
  epistemic_state: 'known | unvalidated: L679 secondhand (SRC-407); persistence through
    the writer function inferred'
  constraints:
  - Structured fields keep optimistic versions (EDIT); only fields that people genuinely
    write together (description, notes, document body) get a text engine.
  - 'The engine is server-authoritative: clients send steps against the document version
    they hold; the server accepts steps only against the current version, checks the
    user''s edit right on each batch, persists accepted steps and the document through
    the writer function with the expected version (GUARD.5 detection in the database,
    MD-03; persistence path inferred), and broadcasts them; a client behind rebases
    and resends. This is the position the source names for "a classic site with a
    server and permission checks".'
  - 'Steps travel on a WebSocket (REALTIME.1: two-way, high frequency); presence and
    cursors on the same channel with a timeout, never in tables (PRESENT.3).'
  - Comments are append-only rows and need no merge.
  design_notes: 'Decides: which engine merges concurrent edits of long text, and for
    which fields.

    Rows: L677, L679, L680. Cited: L302, L674, L678 (GUARD.5), RECORD.1.

    Positions: (L677, contested): P1 central-authority steps (ProseMirror, Figma:
    the server orders and accepts steps); P2 CRDT (Yjs; offline, multi-device, peer-to-peer,
    end-to-end encryption); P3 operational transformation (only where already invested).
    Scope: P4 optimistic versions for structured fields and a text engine only for
    genuinely collaborative long-text fields (L679); P5 an engine for the whole record
    (the over-engineering L678 warns against). P6 count a CRDT''s cost first: 1.5x
    to 2x storage, no accepted move, peers cannot enforce server rules (L680).

    Forces: P1 serves convergence with server-enforced permissions and history, at
    the cost of always-online editing. P2 serves offline and peer editing, at the
    cost of storage, moves, and rules no server can enforce per operation (L680).
    P4 serves minimum machinery for maximum correctness.

    Decision (the rules are the constraints): P4 with P1.

    Rejected: P2: wins when RECORD.1''s condition moves the system of record (offline
    use, multi-device sync or user-owned data, L302); vetoed while business rules
    must hold on every change (L680). P3: only where an OT implementation is already
    in place (L677). P5: wins never (L678).

    Realizes: ALLOCATION.GUARD.5 (skeleton link: the engine where the conflict policy
    calls for one); ALLOCATION.RECORD.1 (proposed: the server stays the authority);
    ALLOCATION.PRESENT.3 (presence).

    Hand-offs: the long-lived connection process (REALTIME.3); version predicate in
    the write (PIG-WEB-DATA.CONCURRENCY.2).'
