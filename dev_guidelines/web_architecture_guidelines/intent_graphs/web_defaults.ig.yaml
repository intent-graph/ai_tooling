- uid: PIG-WEB-LOGIC.PROCESS
  name: Processing and Side Effects
  intent: Deferred work and side effects are rows that database functions write in
    the transaction of the change, claimed by Python workers and delivered at least
    once to idempotent consumers; foreign mutations run as atomic phases in a worker
    behind a 202 status resource, outbound calls are bounded and retried at one layer,
    and files go directly to object storage, are scanned before anyone can read them
    and are served through an authorization check and a short-lived signed URL.
  epistemic_state: known (roll-up)
  constraints:
  - Job and outbox rows are written by database functions in the transaction of the
    change; no enqueue outside the data transaction.
  - Python workers claim rows with `SKIP LOCKED` inside the job table's writer functions;
    delivery is at least once to idempotent consumers.
  - Foreign mutations run as atomic phases in a worker; the request answers 202 with
    a status resource.
  - Outbound calls have timeouts and are retried at one layer only.
  - File bytes live in object storage; file rows and their state in Postgres with
    one writer function; no file is readable before a clean scan.
  design_notes: 'Positions: owns no row; roll-up of PROCESS.1 to .6 (PROCESS.7 deferred).


    Forces: correctness (no lost or doubled effect); availability; security of files.


    Decision: deferred work and side effects are rows that database functions write
    in the transaction of the change, claimed by Python workers with `SKIP LOCKED`
    inside the job table''s writer functions and delivered at least once to idempotent
    consumers (PROCESS.1, PROCESS.2); foreign mutations run as atomic phases in a
    worker, the request answering 202 with a status resource (PROCESS.2, EXPOSE.3);
    outbound calls are bounded in time and retried at one layer only (PROCESS.3);
    files go directly to object storage under a constrained policy, are tracked as
    rows with a state column and one writer function, are scanned before anyone can
    read them, and are served through an authorization check and a short-lived signed
    URL (PROCESS.4 to .6).


    Realizes: refines LOGIC.PROCESS (J3); through its children PIG-WEB-ALLOCATION.JOB_HOST
    and ALLOCATION.ACT.2.'
