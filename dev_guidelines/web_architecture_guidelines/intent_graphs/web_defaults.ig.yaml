- uid: PIG-WEB-LOGIC.SECURE.7
  name: Server-Side Fetch
  intent: 'Every server-side fetch of a client- or agent-named URL goes through one
    fetch helper that refuses private, loopback and link-local addresses, checks the
    address actually connected to, validates every redirect hop the same way, so a
    client cannot make the server reach internal services or metadata endpoints. Where
    the hosting can enforce outbound rules, a network guard backs the helper: an egress
    proxy with direct egress blocked, or rules that deny the application those ranges.'
  epistemic_state: 'known | unvalidated: connect-time address check inferred; the
    network guard''s ''required when'' condition inferred'
  constraints:
  - One fetch helper for every fetch of a client- or agent-named URL.
  - Refuse private, loopback and link-local ranges, checking the address actually
    connected to rather than the hostname.
  - Validate every redirect hop the same way.
  - 'Network guard, preferred: where the hosting can enforce outbound rules, fetches
    leave through an egress proxy with direct egress blocked, or outbound rules deny
    the application''s processes the private, loopback, link-local and metadata ranges.
    It is required when the server''s network holds internal services or a metadata
    endpoint that answers without a token. Where the hosting cannot enforce outbound
    rules, the helper is the guard.'
  - Run with a timeout and a size cap, and in a worker when the response does not
    need the result.
  - 'Forbidden: fetching without range checks.'
  design_notes: 'Positions: one. P1 any server-side fetch of an agent- or client-supplied
    URL blocks private, loopback and link-local ranges, validates each redirect hop
    and preferably goes through an egress proxy (L662).


    Forces: security (requests forged toward internal services and metadata endpoints)
    against the function itself (metadata documents, webhooks, link previews).


    (superseded by MD-09) Decision: every fetch of a client- or agent-named URL goes
    through one fetch helper that refuses private, loopback and link-local addresses,
    checking the address actually connected to rather than the hostname (inferred),
    validates every redirect hop the same way, and leaves through an egress proxy:
    P1''s "preferably" made required (max). The helper runs with a timeout and a size
    cap (PROCESS.3, SECURE.6), and in a worker when the response does not need the
    result (ACT.3, a foreign effect) (inferred).


    (superseded by MD-09) Rejected: fetching without range checks: never (P1). Direct
    egress without a proxy: acceptable when the deployment has no egress proxy; the
    helper''s checks are then the only guard (inferred).


    Realizes: no skeleton link; follows ALLOCATION.RULES.3 (client-supplied input
    never decides).


    Corrected by MD-09 (re-audit under MD-08): the helper is the required control
    and the network guard is preferred. A proxy adds a guarantee only when direct
    egress is blocked; it is required only where an internal service or an unprotected
    metadata endpoint is reachable (inferred). Rejected: a proxy required for every
    deployment: wins when the server''s network holds internal services or a token-less
    metadata endpoint. Fetching without range checks: never.'
