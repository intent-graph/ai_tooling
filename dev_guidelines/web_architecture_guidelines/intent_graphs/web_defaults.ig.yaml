- uid: PIG-WEB-INTERACTION.VISUALIZE.4
  name: Accessibility
  intent: WCAG 2.2 level AA is the conformance target of every full page, embedded
    third-party content included; AAA criteria are adopted where content allows but
    never required site-wide. Controls use native HTML elements and attributes before
    ARIA, every control is keyboard-operable with visible focus, so that everyone
    can perceive and operate the interface.
  epistemic_state: 'known (AA grounded through the W3C conformance page plus the max
    rule) | unvalidated: test method inferred; the W3C page and the US rule are not
    yet in the source register | gap: accessibility mandates of other jurisdictions
    not read'
  constraints:
  - 'WCAG 2.2 level AA is the conformance target of every full page, embedded third-party
    content included: a widget or embed that cannot meet AA is replaced or given an
    AA alternative on the same page. Grounds: the W3C conformance page plus the max
    rule (above); one legal floor at AA in one jurisdiction (US Department of Justice,
    ADA Title II rule, 2024, WCAG 2.1 AA) agrees.'
  - AAA criteria are adopted where the content allows (for example enhanced contrast
    in the design system), and recorded per project; never stated as a site-wide requirement
    (W3C note above).
  - 'Native HTML first: elements and attributes before ARIA, native semantics unchanged,
    every interactive control keyboard-operable with visible focus. Server-rendered
    HTML (VISUALIZE.1) gives this by default; islands meet the same rules.'
  - 'Checked from the first design (web-app-philosophy:INTERACTION.VISUALIZE): automated
    checks in delivery plus keyboard and screen-reader passes on each new template
    (test method inferred).'
  design_notes: 'Decides: which accessibility level is required and how controls meet
    it.

    Rows: L300, L301. Cited: L005 (J4), L003. Read during judging and confirmed at
    review (not yet in the source register, both to register): W3C, Understanding
    WCAG 2.2, Conformance (T1): "It is not recommended that Level AAA conformance
    be required as a general policy for entire sites because it is not possible to
    satisfy all Level AAA success criteria for some content"; the same page calls
    the choice of level "fundamentally a policy decision" and names no default. US
    Department of Justice, ADA Title II web accessibility rule (2024, T1): adopts
    WCAG 2.1 Level AA as the technical standard for state and local governments, a
    legal floor at AA in one jurisdiction.

    Positions: P1 WCAG 2.2 level A; P2 level AA; P3 level AAA for the whole site (L300
    lists the three; "AA as the usual default is not stated"). Controls: P4 native
    HTML elements and attributes before ARIA, native semantics unchanged, every control
    keyboard-operable (L301, consensus T1); P5 custom controls rebuilt with ARIA (the
    practice L301 ranks second).

    Forces: the node''s purpose is that everyone, people with disabilities included,
    can perceive and operate the interface. P3 serves it most on paper, but W3C states
    that all AAA criteria cannot be met by some content, so a site-wide AAA requirement
    cannot be met or verified as stated. P2 is the most demanding level that can be
    required of every full page. Moving from P1 to P2 needs no outside knowledge:
    AA contains every A criterion, so under the max rule AA dominates A wherever AA
    can be met, and the W3C page rules out only AAA as a site-wide requirement. P1
    serves only a lower effort. P4 serves robustness across assistive technologies
    at no extra cost in server-rendered HTML; P5 costs testing effort and fails silently.

    Decision (the rules are the constraints):

    Rejected: P1: wins never as the target (below the most demanding level every page
    can meet). P3 site-wide: wins never (W3C note); per criterion where content allows,
    as above. P5: acceptable only where no native element expresses the control (L301).

    Realizes: J4 INTERACTION.VISUALIZE (the conformance level it handed to this node);
    ALLOCATION.PRESENT.1 (proposed link: native semantics come from server-rendered
    HTML).

    Hand-offs: accessibility checks in testing (PIG-WEB-TRANSVERSE.OPERABILITY.5).'
