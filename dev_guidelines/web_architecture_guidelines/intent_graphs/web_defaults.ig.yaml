- uid: PIG-WEB-DATA.CONCURRENCY
  name: Concurrency Mechanics
  intent: Every writing role runs Serializable with a whole-transaction retry owned
    by the caller, and user-edited rows also carry a version checked inside the writer
    function. Explicit locks are transaction-scoped and serve contention, queues and
    what Serializable cannot reach; inseparable changes are one statement, sequences
    are treated as gappy, and facts are written before the state label.
  epistemic_state: known
  constraints:
  - 'Default Concurrency Strategy and Isolation Mechanics: every writing role runs
    Serializable with whole-transaction retry by the caller; user-edited rows also
    carry a version checked inside the writer function.'
  - 'Locks: explicit locks are transaction-scoped and serve contention, queues and
    the cases Serializable does not cover.'
  - 'Atomic Statements: inseparable changes are one statement and re-runnable work
    is idempotent by form.'
  - 'Sequences and Commit Order: sequences are gappy and do not follow commit order,
    so readers in commit order use a transaction horizon.'
  - 'State Transition Order: multi-place facts are written facts first, label last.'
  design_notes: 'Question: how Postgres isolation, locks, atomic statements and sequences
    keep concurrent change correct.

    Positions: none of its own; roll-up of CONCURRENCY.1 to .6.

    Decision and grounds: roll-up. Every writing role runs Serializable with whole-transaction
    retry by the caller; user-edited rows also carry a version checked inside the
    writer function (CONCURRENCY.1, .2). Explicit locks are transaction-scoped and
    serve contention, queues and the cases Serializable does not cover (CONCURRENCY.3).
    Inseparable changes are one statement and re-runnable work is idempotent by form
    (CONCURRENCY.4). Sequences are gappy and do not follow commit order, so readers
    in commit order use a transaction horizon (CONCURRENCY.5). Multi-place facts are
    written facts first, label last (CONCURRENCY.6).

    Realizes: web-app-philosophy:ALLOCATION.GUARD.5 (concurrency control the placement
    gives the database); refines web-app-philosophy:DATA.GUARD.'
