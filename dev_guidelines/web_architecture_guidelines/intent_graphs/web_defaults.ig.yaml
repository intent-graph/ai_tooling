- uid: PIG-WEB-ALLOCATION.CACHE_STORE
  name: Cache Store
  intent: Derived-data caches are Postgres tables invalidated in the source transaction;
    response and fragment caches shared by processes also default to Postgres, UNLOGGED
    when rebuildable, because atomic invalidation and one fewer component outweigh
    cache-service latency until measured otherwise. Per-process memory is never shared
    beyond one request and a cache is never permanent storage.
  epistemic_state: 'known | unvalidated: response caches in Postgres rest on L125,
    not on doctrine; hit latency not measured'
  constraints:
  - 'Derived-data caches: Postgres tables, invalidated in the source transaction.'
  - 'Response and fragment caches shared by processes: Postgres by default, UNLOGGED
    when rebuildable.'
  - Per-process memory is never shared beyond one request; a cache is never permanent
    storage.
  - 'Authority: source data; cache store: Postgres.'
  - 'Forbidden: per-process memory caches in multi-process production; caches as permanent
    storage.'
  design_notes: 'Positions: P1 shared cache service, Redis or Memcached (L417); P2
    Postgres cache tables, UNLOGGED for rebuildable data (L534 MAINT, L420). Forces:
    latency against correctness (atomic invalidation) and changeability. Decision
    (F7): P2; L534 covers derived-data caches only; response caches in Postgres under
    POSTGRES_FIRST are inferred, no doctrine row covers them (the ledger''s note on
    L534 sets L417 and L420 apart). Rejected: P1, wins when measured cache latency
    or cache load on the primary demands it, or for ephemeral cross-process state
    the framework requires there. Would move it: number of processes, atomic invalidation
    need, measured hit latency. Evidence gap: hit latency not measured. Revision R1:
