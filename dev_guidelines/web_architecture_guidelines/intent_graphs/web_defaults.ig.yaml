- uid: PIG-WEB-LOGIC.ENFORCE.5
  name: Framework Choice
  intent: 'Django is the default framework for the default context, recorded as a
    decision on criteria taken from settled decisions: server-held revocable sessions
    in Postgres from the framework, built-in CSRF protection, server-rendered HTML
    with forms, synchronous handlers by default, and built-in password hashing and
    validators. FastAPI wins when the backend serves only programs and agents with
    bearer tokens.'
  epistemic_state: 'known | unvalidated: criteria derived from settled verdicts, no
    neutral source (L242) | gap: Pydantic and OpenAPI production under Django not
    read (candidate to verify: Django Ninja, OpenAPI 3.1 output, Pydantic v2)'
  constraints:
  - Django is the default framework, recorded as a decision with its criteria.
  - 'Django''s admin and Active Record are constrained by DB_API: models of shared
    tables are read mappers and an admin console never writes shared tables directly.'
  - Pydantic parsing is added at the boundary; Django's form handling stays for HTML
    rendering.
  - Django's task framework needs a worker backend, here the Postgres queue of PROCESS.1.
  - 'To verify: how Pydantic models and the OpenAPI 3.1 description are produced under
    Django (candidate: Django Ninja, OpenAPI 3.1 output, Pydantic v2), because MD-02''s
    gate depends on it.'
  design_notes: "Positions (L242, contested; no T1 or T2 source gives neutral criteria,\
    \ gap):\n  - P1 Django: batteries included, ORM, loose coupling, Active Record\
    \ models (SRC-009).\n  - P2 Flask: micro, no database layer, thread locals, \"\
    not designed for large applications or asynchronous servers\", async through threads\
    \ at a cost (SRC-124, SRC-126).\n  - P3 FastAPI: ASGI, dependency injection, `def`\
    \ and `async def` handlers, router modules for larger applications (SRC-031, SRC-032,\
    \ SRC-030); its official security tutorial teaches a JWT bearer flow and does\
    \ not address cookies, sessions or revocation (L317).\n  - The row's own rule:\
    \ the framework is a recorded decision whose criteria are the product's needs.\n\
    \nForces: security of the browser path (sessions and CSRF from the framework,\
    \ L323, L330); correctness of the contract chain (Pydantic models, TYPE_CHAIN);\
    \ changeability (one framework the team knows).\n\nDecision: **Django is the default\
    \ for the default context**, recorded as a decision with these criteria, each\
    \ taken from a settled verdict rather than from a source ranking:\n  1. server-held,\
    \ revocable sessions in Postgres from the framework's own session management (GUARD.4,\
    \ L323): Django documents a database session backend (SRC-021); no FastAPI page\
    \ read documents sessions (L317);\n  2. the framework's built-in CSRF protection\
    \ (L330, SECURE.3): documented by Django (SRC-024);\n  3. server-rendered HTML\
    \ with forms as the default contract (PRESENT.1, JS_SERVER);\n  4. synchronous\
    \ handlers by default (L238, ENFORCE.4);\n  5. password hashing and validators\
    \ built in, Argon2 opt-in (L344, L345).\n  - Costs accepted: Django's Active Record\
    \ and admin are constrained by DB_API (models of shared tables are read mappers;\
    \ an admin console does not write shared tables directly, because consoles are\
    \ an operator role calling the API functions); Pydantic parsing (TYPE_CHAIN) is\
    \ added as a library; how Pydantic models and the OpenAPI description are produced\
    \ under Django was not read (gap). MD-02's gate depends on it, so the gap names\
    \ a candidate to verify (review m7): Django Ninja, which builds on Pydantic and\
    \ generates an OpenAPI schema (its front page, fetched by the reviewer); to verify:\
    \ OpenAPI 3.1 output and Pydantic v2 support. Forms keep Django's form handling\
    \ for HTML rendering, with Pydantic as the parsing step at the boundary (EXPOSE.6;\
    \ inferred); Django's task framework needs a worker backend, here PROCESS.1's\
    \ Postgres queue (L408).\n\nRejected: - FastAPI: wins when the backend serves\
    \ only programs and agents with bearer tokens (no browser session, no forms),\
    \ so the session and CSRF criteria fall away and native Pydantic models and OpenAPI\
    \ generation dominate (inferred from L242, L317, TYPE_CHAIN).\n  - Flask: acceptable\
    \ for a small backend not expected to grow; rejected as the default by its own\
    \ design statement (L242).\n\nRealizes: no skeleton link; serves ALLOCATION.GUARD.4,\
    \ ALLOCATION.PRESENT.1 and PIG-WEB-ALLOCATION.TYPE_CHAIN."
