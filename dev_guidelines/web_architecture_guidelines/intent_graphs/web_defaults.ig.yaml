- uid: PIG-WEB-DATA.MAINTAIN.2
  name: Deletion, Retention and Partitioning
  intent: 'Deletion is a per-table design choice, weighed on the data''s importance,
    whether it can be reconstructed easily, how often it changes and its business
    value, and it always runs through functions owned by a narrow non-login deletion
    role that no consumer can use directly. The default is basic soft delete: a deleted_at
    column, no change to the primary key, deleted rows excluded by every consumer;
    hard delete plus a same-transaction archive is the choice for some caches and
    when consumers must be guaranteed unable to reach past data.'
  epistemic_state: 'known: MD-04 | conflict resolved: L520 (MAINT) against L204 and
    the research recommendation, in favour of the doctrine by MD-04 | unvalidated:
    the safeguards are inferred'
  constraints:
  - 'Deletion is a per-table design choice, weighed on the data''s importance, whether
    it can be reconstructed easily (caches can), how often it changes and its business
    value. Per table, recorded: the reason the data is kept selects the mechanism;
    lookup, configuration and ephemeral rows are hard-deleted; rebuildable caches
    are invalidated or dropped, never soft-deleted; bulk expiry of time-bounded data
    is a partition drop or detach, partitioning adopted only when size justifies it,
    partition keys in primary and unique keys; queryable past values use the temporal
    model of MAINTAIN.3.'
  - 'Default (MD-04): basic soft delete, a deleted_at column with no change to the
    primary key; every consumer excludes deleted rows. Soft delete comes in two kinds:
    last-state (the row stays, marked deleted) and full-history (every past state
    is kept). In every case foreign keys are required; where they are not enough (full-history
    soft delete), database functions or triggers maintain the soft-delete logic.'
  - 'Whatever the mechanism: deletion goes only through functions owned by the narrow,
    non-login deletion role of GUARD.2, which holds DELETE on the target tables and
    INSERT on the archive; no consumer role holds DELETE (GUARD.2); a hard delete
    of retained data copies the row to an archive in the same transaction, the history
    trigger of MAINTAIN.3 recording it as well; CASCADE follows GUARD.1.'
  - 'Hard delete plus a same-transaction archive is acceptable for some cache profiles
    and when consumers must be guaranteed unable to reach past, historical or outdated
    data. Its weaknesses: a performance cost at scale and, the biggest, keeping the
    current and archive table schemas in sync.'
  - 'Where soft delete is used, these rules apply whole: deleted_at is a nullable
    timestamptz, never a boolean, NULL means active, every read filters on it, and
    partial indexes over active rows cut index size and write cost; constraints on
    soft-deletable tables exempt deleted rows (row-local checks carry an ''or deleted''
    escape, uniqueness uses a partial unique index over active rows); soft-delete
    cascades shadow the foreign-key graph, so the child set and order equal what a
    native cascading delete would remove unless each deviation is explicit and justified,
    and they run in dedicated functions, not bare updates, that validate business
    rules, invalidate derived caches, report per-table counts and log; soft-delete
    functions are idempotent (deleting an already deleted or missing row affects zero
    rows, no error), polyvalent (one signature serves single and bulk, and bulk requires
    an explicit confirmation flag), reject a deletion time earlier than the row''s
    creation, and exist as a wrapper only where a cascade or business rule exists,
    leaf tables getting the single-table base function only, plus safeguards required
    under MD-03 and MD-04 (inferred): (1) a constraint trigger on the child table
    refuses an active row whose parent is soft-deleted, run under Serializable or
    with a lock on the parent row (CONCURRENCY.1), since no foreign key does; bound
    to the table, it also holds for a direct single-table write under DB_API''s exception
    and for owner-run jobs; (2) the active-row predicate is written once in the shared
    specification every consumer reads with, and the reporting role''s documentation
    names it; (3) a restore re-checks the row against the current constraints, since
    a deleted row escaped them; (4) soft deletion propagates down a hierarchy of soft-deleting
    tables as the model requires, by database functions or triggers, children in order.'
  design_notes: "Question: how rows are deleted, archived or expired per table.\n\
    Positions:\n  - P1 deletion is a recorded decision: soft delete flag, hard delete\
    \ plus an archive written in the same transaction (table name, id, jsonb copy),\
    \ or hard delete only; soft deletion leaks its predicate into every query, stops\
    \ foreign keys from enforcing consistency between deleted parents and children,\
    \ makes a legally required purge harder; undelete is rarely used; applies: soft\
    \ delete when users need undo in the product, otherwise archive (L204, contested;\
    \ critique T3, soft delete defended only in T4 snippets).\n  - P2 decide per entity\
    \ from the reason data is kept: none (hard delete), legal or audit retention (archive\
    \ or append-only audit), user-visible recovery (archive, or soft delete with an\
    \ owner for the predicate), queryable past (temporal model), bulk expiry (partition\
    \ drop) (L205, majority, inferred synthesis).\n  - P3 per-table gradient: full\
    \ version history (rare), partial soft delete (the default for user-facing transactional\
    \ data, about 60% of tables), archive table, hard delete (lookup, configuration,\
    \ ephemeral) (L520 MAINT; contradicts L204 and the research recommendation D2).\n\
    \  - P4 soft delete mechanics: nullable timestamptz `deleted_at`, every read filters,\
    \ partial indexes over active rows; the predicate leak accepted (L521 MAINT);\
    \ checks carry an \"or deleted\" escape and uniqueness is a partial unique index\
    \ over active rows (L522 MAINT); soft-delete cascades shadow the foreign-key graph\
    \ in dedicated functions (L523 MAINT); idempotent, polyvalent functions with a\
    \ bulk confirmation flag, deletion time not before creation (L524 MAINT); hard\
    \ deletion only for rebuildable data or after an archive copy; no DELETE privilege\
    \ for application roles (L525 MAINT).\n  - P5 time-bounded data partitioned by\
    \ time; detach or drop old partitions instead of bulk DELETE (L206); partition\
    \ only when size justifies it (larger than memory); partition keys in primary\
    \ and unique keys (L207).\n  - The doctrine research's synthesis (D2 answer):\
    \ the doctrine is the defender the critique lacked, its mitigations answer the\
    \ critique; suggested record: soft delete by default with the mitigations as conditions.\n\
    Forces: (reframed after review, M1):\n  - Integrity of references and reads for\
    \ every consumer, the node's own force, favours hard delete with archive: foreign\
    \ keys and unique constraints keep working unchanged, and no reader can see a\
    \ deleted row by forgetting a predicate.\n  - Immediate undo and in-place history,\
    \ for users and for reporting, favours soft delete: a user's or an agent's mistake\
    \ is undone by a single update (a force of the INTERACTION branch, the user's\
    \ ability to work with the data), and a reporting consumer that counts deleted\
    \ items in historical figures (last year's orders, including those deleted since)\
    \ finds them in the base table, where under an archive it must union the archive.\n\
    \  - Recoverability as such does not divide them: both options keep deleted data\
    \ recoverable and kept for audit. What differs is the speed and effort of a restore\
    \ (one update against a restore function the team owns) and where the integrity\
    \ cost falls.\n  - MD-03 cuts both ways. It makes the predicate leak (L521) a\
    \ cost for every consumer that reads base tables (each backend, BI, consoles,\
    \ scripts), and foreign keys no longer stop a new active child from referencing\
    \ a soft-deleted parent, a check the cascade functions (L523) do not cover. It\
    \ also adds the reporting consumers who, under an archive, must union it to count\
    \ deleted rows.\n  - A cost both pay: GUARD.1 (L492) forbids CASCADE on core entities,\
    \ so deleting a parent with children needs a deletion function that handles the\
    \ children in order, soft-deleting them under soft delete (L523), archiving and\
    \ removing them under the archive.\nDecision and grounds: (one clause decided\
    \ by MD-04) everything except the default for user-facing transactional data is\
    \ decided.\n  - Per table, recorded (P2, P3 agree): the reason the data is kept\
    \ selects the mechanism; lookup, configuration and ephemeral rows are hard-deleted;\
    \ rebuildable caches are invalidated or dropped, never soft-deleted (L520, L525,\
    \ L538); bulk expiry of time-bounded data is a partition drop or detach, partitioning\
    \ adopted only when size justifies it, partition keys in primary and unique keys\
    \ (L206, L207); queryable past values use the temporal model of MAINTAIN.3 (L205,\
    \ L213).\n  - Whatever the mechanism: deletion goes only through functions owned\
    \ by the narrow, non-login deletion role of GUARD.2, which holds DELETE on the\
    \ target tables and INSERT on the archive (changed after review, M3); no consumer\
    \ role holds DELETE (L525, L514, GUARD.2); a hard delete of retained data copies\
    \ the row to an archive in the same transaction, the history trigger of MAINTAIN.3\
    \ recording it as well (L525, L204); CASCADE follows GUARD.1 (L492).\n  - Where\
    \ soft delete is used: L521 to L524 apply whole, plus three safeguards required\
    \ under MD-03 (inferred): (1) a constraint trigger on the child table refuses\
    \ an active row whose parent is soft-deleted, run under Serializable or with a\
    \ lock on the parent row (CONCURRENCY.1), since no foreign key does; bound to\
    \ the table, it also holds for a direct single-table write under DB_API's exception\
    \ and for owner-run jobs (changed after review, M2: it was a check in the writer\
    \ functions only); (2) the active-row predicate is written once in the shared\
    \ specification every consumer reads with, and the reporting role's documentation\
    \ names it; (3) a restore re-checks the row against the current constraints, since\
    \ a deleted row escaped them (L522).\n  - decided by MD-05 (MD-04): the default\
    \ for user-facing transactional data. Recommendation: hard delete with a same-transaction\
    \ archive by default; soft delete where the product offers users a restore or\
    \ undo on the table (trash, undo), or where reporting consumers must count deleted\
    \ rows in place. Ground: it is the max for the node's force, integrity of references\
    \ and reads for every consumer of a shared database (MD-03), while deleted data\
    \ stays recoverable through a restore function. Why it stays a question: soft\
    \ delete's advantage, immediate undo and in-place history for users and reporting,\
    \ is a force of other branches that the max for DATA does not weigh, and the default\
    \ for most user-facing tables (about 60%, L520) is the maintainer's codified practice.\
    \ The review's preferred fix, deciding the archive as a fifth partial verdict\
    \ against L520, is recorded and not taken: the question goes to the maintainer,\
    \ framed even-handed. The evidence that restores are rare is one T3 practitioner\
    \ critique (L204, SRC-265). If unanswered, the graph records the doctrine's default\
    \ (soft delete for user-facing transactional data, L520) with the three safeguards\
    \ above mandatory, and marks the clause `decided by MD-05`.\nRejected: hard delete\
    \ without archive for retained data: never (L525). Soft delete for caches: never\
    \ (L538). Bulk DELETE of time-bounded data where partitioning applies: rejected\
    \ (L206); acceptable below L207's size threshold. A boolean deleted flag: never\
    \ (L521).\nRealizes: ALLOCATION.ACT.4 (archive and history kept in the database);\
    \ J2 DATA.MAINTAIN (gap 3: lifecycle at stack level only). Personal-data erasure\
    \ (deferred MAINTAIN.6, L526 recorded as input) must reach soft-deleted rows,\
    \ archives and history; noted, not judged.\n\nBuild narrative moved out of the\
    \ constraints: changed after review, M3; changed after review, M2: it was a check\
    \ in the writer functions only."
