- uid: PIG-WEB-DATA.ORGANIZE.2
  name: Keys
  intent: Every table has an identity primary key, composite and led by the scope
    column where rows are scoped to a parent, so a child can never reference a row
    in another scope. Keys are 8-byte identity columns unless the table's size is
    bounded by design, and a UUID needs a stated reason and is then UUIDv7, because
    a key that overflows is repaired by rewriting the table at its largest.
  epistemic_state: 'known | conflict: partly against L503 (MAINT) on default key width
    | unvalidated: cross-scope reference integrity and client identifiers as a UUID
    reason are inferred; UUIDv7 locality rests on T4 benchmarks'
  constraints:
  - Every table has a primary key.
  - 'Shape: a row scoped to a parent that most queries filter by gets a composite
    key led by the scope column, down to the most selective scope level and at most
    about four columns, with a surrogate below that. Foreign keys to it carry every
    key column in order, which also makes a cross-scope reference impossible: a child
    and the row it references share the scope by construction (inferred; the doctrine
    does not list this integrity gain). Top-level entities get a single surrogate
    key.'
  - 'Soft deletion is not a criterion of key shape: the doctrine''s own architecture
    note makes them independent and partial indexes work with any key; only the scope
    question decides.'
  - 'Type: identity columns, never serial; no auto-number for natural or composite
    keys.'
  - 'Width: 8-byte identity by default; a 4-byte key only for a table whose cardinality
    is bounded by design (lookup, status and type tables, configuration), not by a
    forecast. Types identical on both sides of every relationship. Ground: an overflowing
    key refuses writes, which is a loss of availability and changeability, not of
    integrity, since no stored fact becomes wrong. The choice rests on the tie-break
    "the force whose loss is hardest to repair later wins": the narrow width''s failure
    is repaired by a rewrite of the table and of every referencing column at the moment
    the table is largest, while the wide width costs 4 bytes per key column in rows
    and indexes, paid gradually and never needing a repair.'
  - 'UUIDs: only for a stated technical reason: global uniqueness across systems,
    integration with external systems, or avoiding sequence contention; random UUIDs
    are not the default for ordinary tables. When one is used it is UUIDv7, never
    UUIDv4 for a key (index locality; the locality claim rests on benchmarks and is
    to be tested on the workload). Client-supplied identifiers for idempotent creates
    (GUARD.6) are one such reason (integration, inferred). A UUIDv7''s timestamp is
    never the creation time (ORGANIZE.3). A deterministic UUID in a stored generated
    column serves a public identifier over a composite natural key.'
  design_notes: "Question: which primary-key shape and type each table gets.\nPositions:\n\
    \  - P1 every table has a primary key (L170, consensus).\n  - P2 the key type\
    \ is a recorded decision among bigint identity, UUIDv7 and UUIDv4 (L179, contested;\
    \ identity compact but guessable and tied to one database; UUIDv7 time-ordered\
    \ and non-enumerable; UUIDv4 poor locality, T4 benchmarks).\n  - P3 shape by two\
    \ questions: is the row scoped to a parent that most queries filter by, and does\
    \ the table use soft deletion; scoped tables get a composite key led by the scope\
    \ column (L499 MAINT); at most about four columns, foreign keys reference every\
    \ column in order, row-value comparison in joins (L500 MAINT); costs and benefits\
    \ stated (L501 MAINT).\n  - P4 identity columns, not serial; no auto-number where\
    \ a natural key exists or the key is composite (L502 MAINT; agrees L177).\n  -\
    \ P5 integer width by expected cardinality: 4 bytes under about two billion rows,\
    \ 8 bytes for very large tables or keys referenced by large tables; identical\
    \ types on both sides of every relationship (L503 MAINT), against the research\
    \ recommendation of bigint by default (recorded in L503's positions).\n  - P6\
    \ UUID keys only for a stated technical reason (global uniqueness, external integration,\
    \ sequence contention); a deterministic UUID in a stored generated column when\
    \ a public identifier must follow a composite natural key (L504 MAINT).\nForces:\
    \ integrity (a key states identity and, when composite, scope) against index width\
    \ and query discipline (L501). P5's 4-byte default saves 4 bytes per key column\
    \ in rows and indexes and costs a hard write failure at overflow, repaired by\
    \ a table rewrite of the table and of every referencing column (L197, L503's own\
    \ same-type rule) at the moment the table is largest.\nDecision and grounds:\n\
    \  - Every table has a primary key (L170).\n  - Shape (L499 to L501, MAINT, max):\
    \ a row scoped to a parent that most queries filter by gets a composite key led\
    \ by the scope column, down to the most selective scope level and at most about\
    \ four columns, with a surrogate below that (L500). Foreign keys to it carry every\
    \ key column in order (L500), which also makes a cross-scope reference impossible:\
    \ a child and the row it references share the scope by construction (inferred;\
    \ the integrity gain L501 does not list). Top-level entities get a single surrogate\
    \ key.\n  - Soft deletion is not a criterion of key shape: the doctrine's own\
    \ architecture note makes them independent and partial indexes work with any key\
    \ (doctrine-internal tension 1 in the doctrine research result, `build/research/15_maintainer_doctrine/result.md`);\
    \ only the scope question decides.\n  - Type: identity columns, never serial;\
    \ no auto-number for natural or composite keys (L502).\n  - Width (partly against\
    \ L503): 8-byte identity by default; a 4-byte key only for a table whose cardinality\
    \ is bounded by design (lookup, status and type tables, configuration), not by\
    \ a forecast. Types identical on both sides of every relationship (L503). Ground\
    \ (corrected after review, m1): an overflowing key refuses writes, which is a\
    \ loss of availability and changeability, not of integrity, since no stored fact\
    \ becomes wrong. The verdict rests on J1's tie-break, \"the force whose loss is\
    \ hardest to repair later wins\": the narrow width's failure is repaired by a\
    \ rewrite of the table and of every referencing column at the moment the table\
    \ is largest (L197), while the wide width costs 4 bytes per key column in rows\
    \ and indexes, paid gradually and never needing a repair.\n  - UUIDs: only for\
    \ L504's reasons. When one is used it is UUIDv7, never UUIDv4 for a key (L179:\
    \ index locality; SRC-325 is T4, so the locality claim is to be tested on the\
    \ workload). Client-supplied identifiers for idempotent creates (GUARD.6, L655)\
    \ are one such reason (integration, inferred). A UUIDv7's timestamp is never the\
    \ creation time (L178, ORGANIZE.3). A deterministic UUID in a stored generated\
    \ column serves a public identifier over a composite natural key (L504).\n  -\
    \ Whether an internal key may appear outside the system (URLs, agent payloads)\
    \ is the interface's decision (J7, the boundary L179 names); this node only guarantees\
    \ that a non-enumerable alternate key can be added as a unique UUIDv7 or generated\
    \ column.\nRejected:\n  - L503's 4-byte default by forecast: rejected; acceptable\
    \ when the table's cardinality is bounded by design.\n  - UUIDv4 as a key: rejected\
    \ (L179, L504); acceptable never as a primary key; as a random token column it\
    \ is outside this node.\n  - Soft deletion as a key-shape criterion (L499's second\
    \ question): rejected, doctrine-internal tension 1.\n  - Single surrogate keys\
    \ for scoped rows: rejected; acceptable when no query family filters by the parent\
    \ and no cross-scope reference must be prevented.\nRealizes: J2 DATA.ORGANIZE;\
    \ TYPE_CHAIN; supports GUARD.6 (client identifiers). MD-01's composite-key condition\
    \ for row security is met by this shape where a scope exists, without implying\
    \ row security.\n\nBuild narrative moved out of the constraints: corrected after\
    \ review, m1."
