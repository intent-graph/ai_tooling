- uid: PIG-WEB-LOGIC.PROCESS.5
  name: File Scanning and Storage
  intent: Every upload is a Postgres row (key, owner, size, content type, checksum,
    state) with the bytes in object storage; the state column has one writer function,
    and a file becomes available only after its signature check and a clean scan.
    No download URL is issued for a row that is not available.
  epistemic_state: 'known | unvalidated: state machine (L430) and the uploader gate
    inferred | gap: scanning and reconstruction read only as one managed vendor service'
  constraints:
  - Every upload is a Postgres row (key, owner, size, content type, checksum, state);
    the bytes live in object storage; `bytea` only for small files that must commit
    atomically with other data.
  - 'The state column has one writer function: pending at issue; available only after
    storage confirmation and a clean scan; failed or expired otherwise; a scheduled
    sweep expires stale pending rows and deletes their objects.'
  - Before availability the worker verifies the file's actual signature against an
    allowlist of types and sets the stored content type from it, not from the declared
    header; a mismatch moves the row to failed.
  - Scanning runs asynchronously (worker or storage provider's scanner), with content
    disarm and reconstruction for document formats; objects stay unreadable until
    clean; scan results reach the writer function idempotently.
  - No download URL is issued for a row that is not available, to the uploader either.
  - 'Forbidden: serving a file before a clean scan; trusting the declared content
    type.'
  design_notes: "Positions: - P1 scan untrusted uploads with antivirus or a sandbox,\
    \ and apply content disarm and reconstruction to document formats such as PDF\
    \ and Office, before any other user can open them (L428; consensus on scanning,\
    \ majority on mechanism).\n  - P2 for asynchronous scanning in storage, objects\
    \ unreadable until the scan reports clean (tag-based access), and a consumer that\
    \ tolerates duplicate scan results (L429; one vendor).\n  - P3 each upload a Postgres\
    \ row with an explicit state: pending when the URL is issued, available only after\
    \ storage confirmation and a clean scan, failed or expired otherwise; a sweep\
    \ for rows and objects that never complete (L430; inferred, no source gives the\
    \ state machine).\n  - P4 metadata (key, owner, size, content type, checksum,\
    \ state) in Postgres, bytes in object storage; `bytea` only for small files that\
    \ must commit atomically with other data (L431).\n  - Cited: one writer function\
    \ per state column (L596, ACT.1); idempotent consumers (L410).\n\nForces: security\
    \ (malware reaching other users); correctness of each file's state.\n\nDecision:\
    \ 1. Every upload is a Postgres row (key, owner, size, content type, checksum,\
    \ state); the bytes live in object storage (P4).\n  2. **The state column has\
    \ one writer function** (L596, MD-03): pending at issue; available only after\
    \ storage confirmation and a clean scan; failed or expired otherwise. A scheduled\
    \ sweep expires stale pending rows and deletes their objects (P3, PROCESS.1).\n\
    \  3. **Signature check** (review m2; L023 via J3 LOGIC.SECURE P2): before availability,\
    \ the worker verifies the file's actual signature against an allowlist of types\
    \ and sets the stored content type from it, not from the declared header. The\
    \ POST policy's \"exact content type\" binds only the declared header, not the\
    \ bytes (L423). A mismatch moves the row to failed through the writer function.\n\
    \  4. **Scanning** runs asynchronously, in a worker or the storage provider's\
    \ scanner, with content disarm and reconstruction for document formats before\
    \ availability (P1); objects stay unreadable until clean (P2); scan results reach\
    \ the writer function idempotently, duplicates absorbed (P2, L410).\n  5. No download\
    \ URL is issued for a row that is not available, to the uploader either (stricter\
    \ than P1's \"any other user\"; one gate; inferred).\n  6. `bytea` only for small\
    \ files that must commit atomically with other data (P4).\n\nRejected: serving\
    \ a file before a clean scan: never (P1). Trusting the declared content type:\
    \ never (L023). Bytes in Postgres by default: acceptable for small files that\
    \ must commit with other data (P4).\n\nRealizes: no skeleton link; follows ALLOCATION.ACT.1\
    \ (writer function for the upload state; proposed link)."
