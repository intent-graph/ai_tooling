- uid: PIG-WEB-DATA.ORGANIZE.5
  name: JSON Documents
  intent: JSON is stored as JSONB, only where no relational shape exists (an indivisible
    object, a flexible periphery on a normalized core), never for core entities or
    queried fields. Every stored document is validated on write by a trigger against
    schemas held in a registry table, so validation holds for every writer, and a
    breaking schema change adds a new named version beside the old.
  epistemic_state: 'known | unvalidated: binding validation by trigger extends L509
    from L511 | gap: validator mechanism not read'
  constraints:
  - 'Use: JSONB (never json) for semi-structured metadata, configuration, cached aggregates,
    external payloads and event data; not for core entities, not for fields queried
    often (extract them to columns), with no deep nesting (over three levels), no
    binary content, and bounded size for indivisible objects. The legitimate cases
    are an indivisible object (bounded, schema-validated) and a normalized core with
    a flexible periphery (stable contract fields as columns, provider-specific extras
    as JSON). Anything that drives logic, filtering or joins is a column.'
  - 'Validation: every stored JSON document is validated on write by a trigger that
    calls the registry''s validate function; function inputs and outputs that carry
    JSON validate through the same function. A CHECK cannot do it because the validator
    reads the registry and is not immutable. This resolves the tension that a direct
    write can bypass function-level validation toward enforcement at the table, as
    the philosophy does for invariants (web-app-philosophy:ALLOCATION.GUARD.2).'
  - 'Registry: source form, composition by reference, expanded forms regenerated.'
  - 'Evolution: a relaxing change in place; a breaking change as a new named version
    beside the old one, the old one retired after its documents are migrated (the
    same expand, migrate, contract as MAINTAIN.1). A breaking change to a stored document
    schema migrates the stored documents in the same release, so no table holds mixed
    versions.'
  design_notes: "Question: when JSON documents are stored and how their schemas are\
    \ held and evolved.\nPositions:\n  - P1 JSONB, never json, for semi-structured\
    \ metadata, configuration, cached aggregates, external payloads and event data;\
    \ not for core entities or often-queried fields; at most three levels; no binary;\
    \ bounded size (L508 MAINT).\n  - P2 documents crossing a boundary are validated\
    \ against schemas held in a registry table, through one validate function every\
    \ code path calls; schemas compose by reference (L509 MAINT).\n  - P3 registry\
    \ rows hold source form; expanded forms are derived artifacts (L510 MAINT).\n\
    \  - P4 per-scope schemas layer on a base contract and are enforced by a write-time\
    \ trigger; changing one is a data migration done with the schema; versioning planned\
    \ (L511 MAINT).\n  - P5 relax in place; a breaking change adds a new named version\
    \ and soft-deletes the old one (L512 MAINT).\n  - Related: L531 (indivisible object\
    \ and flexible periphery as legitimate JSON uses).\nForces: integrity of documents\
    \ the relational schema cannot describe, against flexibility of semi-structured\
    \ data. Validation that \"every code path calls\" (P2) holds only for writers\
    \ that call it; a trigger (P4) holds for every writer.\nDecision and grounds:\
    \ P1 to P5 adopted (MAINT, max), with validation bound to the table.\n  - Use:\
    \ L508's list and L531's cases (an indivisible object; a normalized core with\
    \ a flexible periphery). Anything that drives logic, filtering or joins is a column\
    \ (L508, L531).\n  - Validation: every stored JSON document is validated on write\
    \ by a trigger that calls the registry's validate function; function inputs and\
    \ outputs that carry JSON validate through the same function. A CHECK cannot do\
    \ it because the validator reads the registry and is not immutable (L174). This\
    \ resolves doctrine-internal tension 4 (a direct write can bypass function-level\
    \ validation) toward enforcement at the table, as J1 did for GUARD.2.\n  - Registry:\
    \ source form, composition by reference, expanded forms regenerated (L510).\n\
    \  - Evolution: a relaxing change in place; a breaking change as a new named version\
    \ beside the old one, the old one retired after its documents are migrated (L512;\
    \ the same expand, migrate, contract as MAINTAIN.1). A breaking change to a stored\
    \ document schema migrates the stored documents in the same release, so no table\
    \ holds mixed versions (L511).\n  - The validator's implementation (extension\
    \ or SQL) was not read: open.\nRejected: json (text) type: never (L508). JSON\
    \ for core entities or queried fields: never. Validation only by convention in\
    \ callers: rejected under MD-03; acceptable when a single writer path exists and\
    \ the document never crosses a boundary (inferred).\nRealizes: J2 DATA.GUARD (precise\
    \ structure); TYPE_CHAIN (document schemas are stored facts of the contract)."
