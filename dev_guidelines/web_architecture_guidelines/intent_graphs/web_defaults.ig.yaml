- uid: PIG-WEB-TRANSVERSE
  name: Transverse Defaults
  intent: 'The stack realizes each cross-tier property once and turns it into an automated
    gate wherever a check exists: ASVS-based security with one TLS edge and managed
    secrets, Core Web Vitals targets, one verification per contract seam, tracing
    from the browser into the database transaction, a buffering reverse proxy in front
    of WSGI workers, and decisions kept in ADRs. Several backends may share the database;
    each backend is one deployable, not split without a measured need.'
  epistemic_state: 'known | gap: owns no row (roll-up)'
  constraints:
  - 'security: ASVS 5.0 as the requirement catalogue; TLS and the header set at one
    edge, HSTS preload only as a recorded decision; secrets from a managed store once
    one exists, a file fallback until then; a pinned, scanned supply chain with signed
    provenance at SLSA Build L3;'
  - 'performance: Core Web Vitals at the 75th percentile as targets, budgets in the
    build;'
  - 'contracts: one verification per seam (catalogue diff and consumer suites for
    the function API, description checks for HTTP, scheduled tests for external doubles);
    meaning, owner and lifecycle recorded with each contract;'
  - 'operations: W3C trace context from the browser into the database transaction;
    the four golden signals plus the placement triggers; a security event log outside
    the application database; tests on real Postgres; a staged pipeline with migrations
    first;'
  - 'topology: one buffering reverse proxy; WSGI with sync workers, threaded workers,
    ASGI or a short timeout for routes with blocking external calls, ASGI where connections
    are long-lived; process manager per unit; static assets built once and served
    outside Python;'
  - 'evolution: several backends may share the database, each backend one deployable,
    not split into services without a measured need; modular by business concept,
    every module reaching data through the function API, never another domain''s tables;
    decisions in ADRs.'
  design_notes: 'Rows: none (roll-up).

    Decision (lead): the roll-up of its five children. The stack realizes each cross-tier
    property of TRANSVERSE once, and turns it into an automated gate where a check
    exists (L110, J5):

    Realizes: refines TRANSVERSE (J5); through its children, ACT.4, JS_SERVER and
    LOGIC.PROCESS.

    Review fixes: children''s lines updated after B1 (X3), M3 (X5), M5, M6, m3, m6.'
  impl_pointers:
  - build/distill/03_judge/J9_pig_transverse/records.md::PIG-WEB.TRANSVERSE
  history:
  - who: agent:builder
    date: 2026-10-13T09:03
