- uid: PIG-WEB-DATA.CONCURRENCY.6
  name: State Transition Order
  intent: Where one fact spans several places, the single writer function of the state
    column writes the facts first and flips the state label last, after a transition
    audit against the data. A new transition is enforced from its first release; observe-only
    checks are a time-boxed migration aid over data that already violates them.
  epistemic_state: 'known | unvalidated: the exit condition for observe-only checks
    is inferred'
  constraints:
  - 'Adopted: the single writer function of the state column (ACT.1) writes the facts
    first and the label last, and its transition audit checks the target state against
    the data before the flip. Order matters within one transaction because the audit
    and constraint triggers run in statement order, and across transactions because
    a workflow advances through several operations (web-app-philosophy:ALLOCATION.ACT.1),
    where a reader sees each committed step.'
  - 'Observe-only enforcement is a migration aid, not a mode: a new transition is
    enforced from its first release. Observe-only is acceptable only when a check
    is introduced over existing data that already violates it, with the violations
    listed and an exit (the release that turns enforcement on) recorded; the time-boxed
    exit is inferred.'
  design_notes: "Question: in which order facts and state labels are written, and\
    \ how transition checks are introduced.\nPositions: L597 where one fact spans\
    \ several places (presence flag, aggregate result, state label), write the facts\
    \ first and flip the label last; teardown mirrors; the transition audit checks\
    \ desired against current data before the flip, so the wrong order fails (MAINT).\
    \ L598 transition checks start in observe-only mode behind an enforcement flag:\
    \ they run, report and dry-run fixes but raise nothing; tolerable for known defects,\
    \ explicitly not the fix; open violations listed in the ownership document (MAINT).\n\
    Forces: integrity of multi-place facts against the cost of introducing checks\
    \ over data that already violates them.\nDecision and grounds:\n  - L597 adopted\
    \ (MAINT, max). The single writer function of the state column (ACT.1, L596) writes\
    \ the facts first and the label last, and its transition audit checks the target\
    \ state against the data before the flip. Order matters within one transaction\
    \ because the audit and constraint triggers run in statement order, and across\
    \ transactions because a workflow advances through several operations (J1 ACT.1),\
    \ where a reader sees each committed step.\n  - L598 kept as a migration aid,\
    \ not a mode: a new transition is enforced from its first release. Observe-only\
    \ is acceptable only when a check is introduced over existing data that already\
    \ violates it, with the violations listed and an exit (the release that turns\
    \ enforcement on) recorded (L598 states it is not the fix; the time-boxed exit\
    \ is inferred).\nRejected: label first, facts after: never (L597). Observe-only\
    \ for new transitions: rejected.\nRealizes: web-app-philosophy:ALLOCATION.ACT.1\
    \ (orders transitions written by their single authoritative writer); J2 DATA.DERIVE\
    \ (L597 cited there)."
