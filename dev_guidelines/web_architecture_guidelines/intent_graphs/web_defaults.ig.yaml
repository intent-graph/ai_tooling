- uid: PIG-WEB-INTERACTION.REALTIME.2
  name: Channel Operation
  intent: Streams are never cached, every event id is the commit-safe change cursor
    so a reconnecting client replays from the change table, and keep-alives run below
    the shortest idle timeout on unbuffered routes over HTTP/2. Clients reconnect
    with exponential backoff and jitter and resync by cursor; one long transaction
    stalls the cursor horizon, a known latency cost that is monitored.
  epistemic_state: 'known | unvalidated: jitter (L454) and the replay-window fallback
    inferred; L445 inferred from the specification; the horizon stall''s bound and
    monitoring inferred'
  constraints:
  - 'No caching of streams: long-poll and streaming responses Cache-Control: no-cache;
    the SSE client uses no-store.'
  - 'Resume by a commit-safe cursor: every event''s id is the change cursor of the
    philosophy (one no later commit can fall behind; a sequence id is not such a cursor);
    on reconnect the server replays from the change table after Last-Event-ID; when
    the cursor is too old to replay, the server tells the client to reload state,
    as the fallback only. The retry field tunes reconnect delay.'
  - 'Known latency cost of the commit-safe cursor: the cursor PIG-WEB-DATA.CONCURRENCY.5
    realizes reads only rows from transactions older than the oldest still in flight
    (the xid8 horizon), so one long transaction on the primary holds back every push
    and every catch-up until it ends. This stall is accepted as the price of never
    skipping a row. The idle-in-transaction timeout ends abandoned transactions; a
    long active transaction is not bounded by it, so the horizon''s lag is monitored
    like the notification queue (.5).'
  - 'Keep-alive below the shortest idle timeout: an SSE comment line about every 15
    s and WebSocket pings, under every hop''s idle timeout; the application''s idle
    timeout above the load balancer''s. HTTP/2 PING frames do not count as activity
    on some balancers.'
  - 'Unbuffered streaming routes only: buffering off at the reverse proxy for SSE,
    long-poll and streaming routes (proxy_buffering off or X-Accel-Buffering: no),
    served by async workers.'
  - HTTP/2 to the browser so SSE escapes the six-connection cap; a shared worker holding
    one stream per origin is acceptable where an HTTP/1.1 hop remains.
  - 'WebSocket through the proxy: Upgrade and Connection set explicitly at nginx;
    the whole chain verified; over HTTP/2 only where every hop enables extended CONNECT,
    HTTP/1.1 upgrade otherwise.'
  - 'Bounded WebSocket input: message size and rate capped in the browser handler
    (no backpressure in the API).'
  - 'Reconnect with exponential backoff and random jitter, then resync by cursor:
    deploys and restarts drop every connection at once.'
  design_notes: 'Decides: how channels resume, stay alive through intermediaries and
    reconnect.

    Rows: L443 to L454 (12 rows). Cited: L682, L594 (DATA), L127, L202.

    Positions: the rows are consensus practices except L454 (majority; jitter not
    in the sources). Competing positions exist on three points: P1 SSE over HTTP/2
    (L447, stream limit negotiated) against P2 one stream per tab shared through a
    shared worker (L447); P3 replay from a store against P4 reload of state on reconnect
    (L445); P5 WebSocket over HTTP/2 extended CONNECT against P6 HTTP/1.1 upgrade
    (L449).

    Forces: all positions serve continuity of the user''s view under dropped and idle
    connections; P1 costs an HTTP/2 edge, P2 costs client complexity; P3 costs a replayable
    store, P4 costs a full reload after every gap.

    Decision (the rules are the constraints):

    Rejected: P4 as the normal path: wins only when the cursor is older than the replay
    window (L445). P6 everywhere: acceptable where any hop lacks extended CONNECT
    (L449).

    Realizes: J4 INTERACTION.COLLABORATE decision 1 and INTERACTION.ENVIRONMENT.5
    (retries and catch-up).

    Hand-offs: the commit-safe cursor and replay table (PIG-WEB-DATA.CONCURRENCY.5);
    proxy buffering, HTTP/2 and idle timeouts at the edge (PIG-WEB-TRANSVERSE.TOPOLOGY.1);
    monitoring of the cursor horizon''s lag (PIG-WEB-TRANSVERSE.OPERABILITY.3).'
