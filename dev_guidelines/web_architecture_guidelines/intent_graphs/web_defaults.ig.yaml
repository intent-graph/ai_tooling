- uid: PIG-WEB-LOGIC.EXPOSE.1
  name: Contract Style and Resources
  intent: 'Browsers get server-rendered HTML as the contract; programs and agents
    get resource-oriented JSON over HTTP with named resources, standard methods and
    custom methods for state transitions, and every collection is paginated with a
    server maximum page size: structured-data collections by an opaque keyset continuation,
    while a human HTML list over a bounded result may use page numbers.'
  epistemic_state: 'known | unvalidated: custom methods for state transitions (inferred
    from L264, L596); the OpenAPI-only-for-JSON corollary (L257, inferred)'
  constraints:
  - The server-rendered HTML is the browser contract; OpenAPI describes only the JSON
    endpoints that exist.
  - Resource-oriented JSON with named resources and standard methods; state transitions
    are custom methods on their resource (a POST naming the transition), each mapped
    to its one writer function, never a PATCH of the state field.
  - Every collection paginated; the server enforces a maximum page size; structured-data
    and agent collections, and any list over a large or growing set, use keyset paging
    in the database behind an opaque continuation token or next link.
  - The token encodes position only and carries no authorization; every page is re-authorized;
    the token is not a credential in the URL.
  - No next link ends the collection; no total count by default, an estimate labelled
    as such where offered.
  - A human-facing HTML list over a bounded, filtered result may page by offset with
    page numbers; larger or growing HTML lists use keyset next links.
  - 'Forbidden: offset and limit for structured-data and agent collections, for deep
    pages and for bulk work; PATCH of a state column owned by a writer function.'
  design_notes: "Positions: - P1 GraphQL as a third option when many clients need\
    \ different field subsets of one graph; its own pages claim versionless evolution\
    \ and say the specification is silent on network, authorization and pagination\
    \ (L256; advocate pages only, T3).\n  - P2 in a hypermedia design the HTML (links,\
    \ forms) is the contract, and an OpenAPI file is needed only for the JSON endpoints\
    \ that exist (L257; inferred).\n  - P3 a data API as a hierarchy of named resources\
    \ manipulated by a small set of standard methods; custom methods only where standard\
    \ ones do not fit; Fielding dissents on fixing hierarchies in advance (L264).\n\
    \  - P4 every collection paginated, the server enforcing a maximum page size and\
    \ coercing larger requests (L265).\n  - P5 paging by a server-issued continuation\
    \ (opaque token or next link), not offset and limit (L266).\n  - P6 page tokens\
    \ opaque, unparseable by clients, carrying no authorization; the end signalled\
    \ by an empty token or no next link (L267).\n  - P7 a total count is optional;\
    \ an estimated total is documented as an estimate (L268).\n\nForces: changeability;\
    \ readability for programs and agents; performance (DERIVE.2); security (tokens\
    \ that carry no authority).\n\nDecision: 1. **Browsers**: the server-rendered\
    \ HTML is the contract (P2; J3 LOGIC.EXPOSE.3); OpenAPI describes only the JSON\
    \ endpoints that exist (P2).\n  2. **Programs and agents**: resource-oriented\
    \ JSON over HTTP with named resources and standard methods (P3). State transitions\
    \ are custom methods on their resource (a POST naming the transition), each mapped\
    \ to its one writer function, never a PATCH of the state field (inferred from\
    \ P3 with L596).\n  3. (superseded by MD-09) **Collections** (P4 to P7): every\
    \ collection paginated, the server's maximum page size enforced; keyset paging\
    \ in the database (DERIVE.2) behind an opaque continuation token or next link;\
    \ the token encodes position only and carries no authorization, so every page\
    \ is re-authorized and the token is not a credential in the URL (X6); no next\
    \ link ends the collection; no total count by default, an estimate labelled as\
    \ such where offered.\n  4. (superseded by MD-09) HTML lists page the same way,\
    \ with next links built from the keyset (inferred).\n\nRejected: GraphQL: acceptable\
    \ when many clients need different field subsets of one graph and the team designs\
    \ authorization, pagination and limits itself (P1). (superseded by MD-09) Offset\
    \ and limit for client-facing collections: never (P5). PATCH of a state column\
    \ owned by a writer function: never (inferred). RPC tunnelling of every operation:\
    \ rejected (J3 LOGIC.EXPOSE.1).\n\nRealizes: ALLOCATION.DERIVE.2 (exposes paging\
    \ and filtering in the contract).\n\nCorrected by MD-09 (re-audit under MD-08):\
    \ keyset for structured-data and agent collections and for large or growing sets;\
    \ offset with page numbers acceptable for a human HTML list over a bounded result\
    \ (philosophy DERIVE.2)."
