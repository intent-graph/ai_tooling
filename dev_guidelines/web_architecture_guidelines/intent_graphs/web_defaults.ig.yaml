- uid: PIG-WEB-INTERACTION.VISUALIZE.1
  name: Rendering Technique
  intent: Pages whose content depends on the request are rendered per request by Python,
    pages whose URL set is known ahead are built ahead, and partial updates are server-rendered
    HTML fragments. JavaScript ships only for interactive parts, client-rendered islands
    exist only under the rendering placement's criteria, nothing is fully rehydrated,
    and no secret reaches the browser bundle. Server and build-time rendering keep
    first content fast and pages crawlable.
  epistemic_state: 'known | unvalidated: the no-secrets-in-bundle extension of L289
    | open: fragment-swap and island libraries (no row compares them)'
  constraints:
  - Per-request HTML from Python for every page whose content depends on the request;
    build-time output for pages whose URL set is known ahead (documentation, marketing,
    help). No request-time JavaScript server (JS_SERVER).
  - 'Partial updates as server-rendered HTML fragments (the hypermedia contract of
    PRESENT.1): enhancement swaps HTML the server rendered; it never renders large
    HTML with client JavaScript and never fully rehydrates a server page.'
  - JavaScript only where a part is interactive, added by feature detection (ENVIRONMENT.1),
    with the page's navigation and core forms working without it (web-app-philosophy:INTERACTION.ENVIRONMENT.1).
  - Client-rendered islands only under the rendering placement's criteria (many interdependent
    controls, very high update frequency, real-time collaboration). Independent widgets
    are independent islands; widgets that share live state get one client-state owner
    for the region or share it through the URL, never state synchronized between islands.
  - Crawled pages are server- or build-time-rendered, which the default already gives;
    an island never renders the page's main content or its error state.
  - 'Secrets never reach the browser bundle: no credential, key or private setting
    is compiled into JavaScript or exposed through build-time variables meant for
    the client; where a framework marks a server/client boundary, it is explicit (the
    bundle rule is inferred for the default, which has no shared-code boundary).'
  design_notes: "Decides: which rendering technique each kind of page uses and what\
    \ JavaScript it ships.\nRows: L282, L283, L284, L285, L286, L289, L290. Cited:\
    \ L252, L253, L629, L016, L288 (J1 placements).\nPositions:\n  - P1 server or\
    \ static rendering, no full rehydration (L282, majority; SRC-181 T1/T2 against\
    \ hydration's cost, SRC-321 a critique).\n  - P2 full client rendering or full\
    \ rehydration of a server-rendered page (accepted by SRC-292 as the normal mechanism;\
    \ rejected in L282 for its interaction cost).\n  - P3 JavaScript only for interactive\
    \ parts, static regions plain HTML (L283).\n  - P4 islands when widgets are independent;\
    \ a single client-state owner or the URL when many widgets share live state (L284).\n\
    \  - P5 build-time rendering when the URL set is known, per-request otherwise\
    \ (L285).\n  - P6 server or pre-rendering for crawled, fast pages; real 404 or\
    \ noindex for client-rendered error pages (L286).\n  - P7 an explicit server/client\
    \ code boundary with secrets on the server side (L289).\n  - P8 if a client-rendered\
    \ React application is chosen, a framework with routing, data loading and server\
    \ rendering rather than an assembled one (L290).\nForces: P1, P3, P5, P6 serve\
    \ fast first content, low interaction latency and crawlability (L016, L297), at\
    \ the cost of building the HTML path first; P2 serves one client code path and\
    \ rich interaction, at the cost of pages that look ready before they respond (TBT,\
    \ INP) and a JavaScript server tier (L288). P4 serves islands' isolation and,\
    \ for shared live state, consistency. P7 serves secret containment. P8 serves\
    \ the team against an ad-hoc framework and request waterfalls, at the cost of\
    \ the framework's server runtime.\nDecision (the rules are the constraints): (realizes\
    \ PRESENT.1 and JS_SERVER as settled):\nRejected:\n  - P2 as the default: wins\
    \ only when PRESENT.1's condition holds for most of the product (L253, L254),\
    \ and then with P8: a framework that provides routing, data loading and server\
    \ rendering (L290), which also triggers JS_SERVER's condition when first load\
    \ or crawlability needs server rendering (L288, L290).\n  - Islands sharing live\
    \ state among themselves: wins never (L284).\n  - Client-rendered error pages\
    \ without a real 404 or noindex: wins never for crawled pages (L286).\nOpen (not\
    \ invented): no owned row chooses the library that swaps server fragments or the\
    \ component library for islands; the choice is recorded per project with the criteria\
    \ above (small script budget, L016; native semantics, VISUALIZE.4).\nRealizes:\
    \ PIG-WEB-ALLOCATION.JS_SERVER (skeleton link); ALLOCATION.PRESENT.1 (proposed\
    \ link: HTML from the backend, islands under L253); J4 INTERACTION.ENVIRONMENT.1.\n\
    Hand-offs: page experience targets (PIG-WEB-TRANSVERSE.PERFORMANCE); fingerprinted\
    \ asset delivery (PIG-WEB-TRANSVERSE.TOPOLOGY.4); generated island types (PIG-WEB-ALLOCATION.TYPE_CHAIN,\
    \ settled)."
