- uid: PIG-WEB-TRANSVERSE.TOPOLOGY.3
  name: Process Placement
  intent: 'One non-root, pinned image per release serves web, worker and admin processes
    with the same config. The hosting model is a per-project choice recorded as a
    decision (MD-06): a prototype takes the fastest secure path, and an orchestration
    platform is added when reliability and scaling are needed. On self-managed hosts
    without an orchestrator, one acceptable route, each unit runs a process manager
    with several workers, workers run as extra units on the web host and a supervisor
    runs everything unprivileged; with an orchestrator, one server process per container
    wins.'
  epistemic_state: 'known: MD-06 | conflict: L157 contested, settled by hosting model
    | unvalidated: roles per kind of process'
  constraints:
  - One image per release, multi-stage, non-root, pinned base. Web, worker and admin
    processes all start from it with the same config.
  - 'On one or a few self-managed hosts without an orchestrator, one acceptable route
    (MD-06): each unit runs a process manager with several workers. Workers run as
    extra units on the web host. A supervisor runs everything as an unprivileged account.'
  - Admin consoles and scripts run from the same release image with the operator role's
    credentials. Migrations and human-run data jobs use the owner role under the data-job
    checklist (inferred).
  - The hosting model is chosen per project and recorded (EVOLUTION.3, MD-06); with
    an orchestrator, one server process per container replaces the process manager,
    and the unprivileged supervisor, same-image and same-config rules still hold.
  design_notes: "Rows: L156, L157, L158, L159, L160.\nPositions: - Images: staged\
    \ builds, non-root, pinned base, minimal context (L156).\n  - Replication (L157,\
    \ contested): P1 a process manager inside the unit (Gunicorn with workers, or\
    \ Uvicorn --workers) for a single server or Compose; P2 one server process per\
    \ container, replicated by an orchestrator or platform.\n  - Supervisor, unprivileged\
    \ account (L158).\n  - Workers: P3 extra units on the web host; P4 separately\
    \ scaled containers or services (L159, synthesis).\n  - Workers and admin processes\
    \ from the same release image, code, dependencies and config; admin code ships\
    \ with the application (L160).\nForces: P1 serves crash containment inside a unit\
    \ without an orchestrator (L152). P2 serves replication and scaling by the platform\
    \ (one concern per container, L092), at the cost of running an orchestrator. P3\
    \ serves simplicity; P4 serves scaling jobs apart from web load.\nDecision (lead):\
    \ the image and supervision practices; P1 and P3 under the assumed hosting.\n\
    Rejected: P2: wins when an orchestrator or platform replicates containers; then\
    \ each container runs one server process (L157). P4: wins when job load differs\
    \ from web load enough to scale apart, measured (L159).\nRealizes: refines LOGIC.PROCESS\
    \ (process types, supervisor, one concern per container); rests on the J1 access\
    \ paths (roles per kind of process).\n\nBuild narrative moved out of the constraints:\
    \ one or a few self-managed hosts, no orchestrator; questions.md, Q1.\n\nMaintainer\
    \ answer MD-06: hosting is chosen per project and recorded as a decision; when\
    \ prototyping, reach something that works fast as long as it is secure; an orchestration\
    \ platform brings reliability and scaling but is not what a prototype needs first.\
    \ The self-managed defaults are one acceptable route; the orchestrated case lists\
    \ what changes (here, TOPOLOGY.4 and SECURITY.4)."
