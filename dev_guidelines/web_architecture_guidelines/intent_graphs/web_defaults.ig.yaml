- uid: PIG-WEB-ALLOCATION.JOB_HOST
  name: Job and Schedule Host
  intent: Jobs with Python logic or foreign effects go through a queue table in Postgres,
    written by the database function in the same transaction as the data change and
    claimed by Python workers with FOR UPDATE SKIP LOCKED; scheduled pure data work
    runs inside Postgres with a scheduler extension calling named functions. This
    keeps the job atomic with the data and one component fewer, until a measured limit.
  epistemic_state: 'known | unvalidated: the contention threshold is open (L126)'
  constraints:
  - Queue table in Postgres, written by the database function in the same transaction
    as the data change, claimed by Python workers with FOR UPDATE SKIP LOCKED.
  - 'Scheduled pure data work: a Postgres scheduler extension whose entries are thin
    calls to named functions.'
  - A schedule that needs Python inserts a job row for the workers.
  - Jobs are short, idempotent and monitored, whatever the host.
  - 'Authority: Postgres (queue and data schedules); Python workers execute.'
  - 'Forbidden: enqueuing to a broker outside the data transaction.'
  design_notes: 'Positions: P1 queue table in Postgres, SKIP LOCKED (L126, L413);
    P2 staged in Postgres, drained to a broker (L126, L409); P3 broker from the start
    (L126, L408); P4 schedules inside Postgres (L604 MAINT). Forces: changeability
    (one component fewer) and correctness (job atomic with data) against scalability.
    Decision: P1 plus P4, with the function writing the queue row (MD-03; L413, L409,
    L604 MAINT, max); a schedule needing Python inserts a job row (inferred); jobs
    short, idempotent, monitored (L605, L410). Rejected: P3, wins at measured lock
    contention, backlog or multi-server fan-out; then P2, never an enqueue outside
    the data transaction (L409). Would move it: job volume, lock contention, multi-server
    fan-out. Evidence gap: the contention threshold is open (L126).'
