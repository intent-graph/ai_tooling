- uid: PIG-WEB-DATA.DERIVE.2
  name: Cache Tables
  intent: Cache data lives in hand-managed tables classified by recomputability, invalidated
    by a key inserted in the source transaction and recomputed set-based by workers
    that claim keys with SKIP LOCKED. UNLOGGED tables are used only for rebuildable
    data no standby reader needs, and cache rows are invalidated or dropped by a narrow
    cache-maintenance role, never soft-deleted.
  epistemic_state: 'known | unvalidated: SKIP LOCKED claiming, the MD-03 limit on
    L538, the narrow cache-maintenance role and the exact standby behaviour of UNLOGGED
    tables are inferred'
  constraints:
  - Classify each cache by recomputability (aggregates of immutable source, outputs
    of logic outside SQL, expensive SQL aggregates); the key follows the query pattern;
    timestamps allow staleness detection; the name carries a cache-class suffix; the
    table comment states sync level, freshness requirement, source and impact of divergence.
  - 'Invalidation: the source change inserts the cache key in the same transaction,
    by a trigger, or by the writer function only when the source table admits no other
    writer (DERIVE.1''s rule); workers claim keys with `FOR UPDATE SKIP LOCKED` in
    bounded batches, so concurrent workers never recompute the same key (inferred);
    recomputation is set-based, not a row loop.'
  - 'Single-owner caches: a cache whose sources are written by other consumers too
    keeps its invalidation in the source''s transaction; full ownership (compute,
    upsert, invalidation) applies only when that service is also the only writer of
    the cache''s sources (inferred under MD-03; consistent with the philosophy''s
    ban on derived stores written beside the source). The service writes the cache
    through its upsert function, with a lease and a terminal failure marker.'
  - 'UNLOGGED only for rebuildable caches that no replica reader needs: the contents
    of UNLOGGED tables are not replicated to standby servers, so they are unavailable
    on a standby to a reporting role reading there.'
  - Materialized views only for an atomic full refresh.
  - Cache rows are invalidated or dropped, never soft-deleted; dropping is done by
    invalidation functions owned by the narrow, non-login cache-maintenance role of
    GUARD.2, not by a consumer's DELETE and not with the owner role's rights.
  design_notes: "Question: how cache tables are classified, invalidated, named and\
    \ refreshed.\nPositions: (MAINT unless noted): L420 rebuildable cache data may\
    \ live in UNLOGGED tables (fast, truncated on crash, not replicated); nothing\
    \ else (consensus); L535 classify by recomputability: aggregates of immutable\
    \ source (no sync), outputs of logic outside SQL (invalidation queue plus scheduled\
    \ recompute), expensive SQL aggregates (scheduled refresh, or invalidate and refresh\
    \ lazily); L536 invalidation queue: the source change inserts the key (conflicts\
    \ ignored); a scheduled worker recomputes a bounded batch, upserts, removes the\
    \ keys; staleness window stated; queue size and oldest age monitored; gap: no\
    \ rule against double work by concurrent consumers; L537 key follows the query\
    \ pattern; timestamps for staleness; cache-class suffix; comment states sync level,\
    \ freshness, source, impact of divergence; L538 when exactly one service owns\
    \ every write path of a cache, it may own compute, upsert and invalidation, with\
    \ a lease timestamp and a terminal failure marker; cache rows invalidated or dropped,\
    \ never soft-deleted; L539 hand-managed cache tables over materialized views;\
    \ a materialized view fits only an atomic full refresh; the doctrine does not\
    \ use them. Placement CACHE_STORE: derived caches in Postgres tables; response\
    \ caches too, UNLOGGED when rebuildable.\nForces: freshness and atomic invalidation\
    \ (integrity of what caches serve) against read latency and load on the primary.\n\
    Decision and grounds: L535 to L539 and L420 adopted (MAINT, max), with three realizations.\n\
    \  - Classification, keys, names, comments per L535 and L537.\n  - Invalidation:\
    \ the source change inserts the cache key in the same transaction (L536), by a\
    \ trigger, or by the writer function only when the source table admits no other\
    \ writer (DERIVE.1's rule, applied here for consistency with M2); workers claim\
    \ keys with `FOR UPDATE SKIP LOCKED` in bounded batches, so concurrent workers\
    \ never recompute the same key (L413, L595; fills the doctrine's gap 6, inferred);\
    \ recomputation is set-based, not a row loop (L530; doctrine-internal tension\
    \ 6).\n  - Single-owner caches (L538): a cache whose sources are written by other\
    \ consumers too keeps its invalidation in the source's transaction; L538's full\
    \ ownership (compute, upsert, invalidation) applies only when that service is\
    \ also the only writer of the cache's sources (inferred under MD-03; consistent\
    \ with J1 DERIVE.1's ban on derived stores written beside the source). The service\
    \ writes the cache through its upsert function, with L538's lease and terminal\
    \ failure marker.\n  - UNLOGGED only for rebuildable caches that no replica reader\
    \ needs: the contents of UNLOGGED tables are not replicated to standby servers,\
    \ so they are unavailable on a standby to a reporting role reading there (L420;\
    \ corrected after review, m5: the earlier \"would read them empty\" was not grounded;\
    \ whether a standby query errors or returns nothing was not checked).\n  - Materialized\
    \ views only for an atomic full refresh (L539).\n  - Cache rows are invalidated\
    \ or dropped, never soft-deleted (L538); dropping is done by invalidation functions\
    \ owned by the narrow, non-login cache-maintenance role of GUARD.2, not by a consumer's\
    \ DELETE and not with the owner role's rights (changed after review, M3).\nRejected:\
    \ a separate cache service by default: rejected (CACHE_STORE); wins at measured\
    \ cache latency or load on the primary (J1). Materialized views for partial or\
    \ per-entry refresh: rejected (L539). UNLOGGED for data that is not rebuildable:\
    \ never (L420).\nRealizes: PIG-WEB-ALLOCATION.CACHE_STORE (holds cache tables\
    \ when the placement keeps caches in Postgres); ALLOCATION.DERIVE.3; ALLOCATION.ACT.3\
    \ (scheduled refresh, with JOB_HOST).\n\nBuild narrative moved out of the constraints:\
    \ L420; corrected after review, m5: the earlier \"would read them empty\" was\
    \ not grounded; whether a standby query errors or returns nothing was not checked;\
    \ changed after review, M3."
