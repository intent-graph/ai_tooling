- uid: PIG-WEB-TRANSVERSE.OPERABILITY.5
  name: Testing
  intent: Tests that touch data run on real Postgres at the production version in
    a disposable database, each inside a rolled-back transaction; in shared environments
    a mutating test runs in a never-committing boundary. Commit-time and concurrent
    behaviour is tested with committing sessions in a disposable database, and database
    tests connect as the consumer role under test.
  epistemic_state: 'known: MD-05 | unvalidated: commit-time behaviour tested in a
    disposable database; concurrency tests required by GUARD.2; tests run as the consumer
    role | gap: no row on concurrency testing'
  constraints:
  - Every test that touches data runs on Postgres at the production version. It uses
    a disposable database per run, never production.
  - Each test runs in a transaction that is rolled back. In any shared environment,
    a mutating test runs in a forced-rollback boundary; a human uses an explicit rollback.
  - 'Behaviour that only shows at commit cannot be tested inside a rolled-back transaction:
    serialisation failures and retries, lock waits between sessions, deferred constraints,
    the outbox and NOTIFY. It is tested with concurrent committing sessions in the
    disposable database, which is then dropped, never in a shared one; the never-committing
    rule governs shared environments, so this does not breach it.'
  - 'Concurrency tests for the rules GUARD.2 requires (Serializable with retry, locks)
    are part of the default test suite, not a gap: every invariant GUARD.2 enforces
    procedurally has a concurrent test (inferred from GUARD.2; web-app-philosophy:TRANSVERSE.OPERABILITY.2).'
  - 'Database tests connect as the consumer role under test, never as the owner (inferred:
    ROW_SECURITY''s "denial tested through the deployed role", generalised to every
    grant). They cover writer functions, constraints, grants per role, the actor pairing
    and the refusal of writes without an actor (web-app-philosophy:TRANSVERSE.OPERABILITY.2,
    ACT.4).'
  - Backend product policy and parsing are tested in memory.
  - 'Per-user read visibility (MD-05): the shared denial-test suite every backend
    runs is part of the default suite, and denial tests of the database read functions
    run against those functions.'
  - End-to-end tests are few, on critical journeys.
  design_notes: 'Rows: L396, L397, L398, L399, L400, L567.

    Positions: (consensus, one MAINT row): lowest level that catches the failure (L396);
    few end-to-end tests on critical journeys (L397); test code cared for like production
    code (L398); a real engine of the production kind (L399); a disposable database,
    each test isolated by a rolled-back transaction (L400); a test that mutates shared
    data runs in a boundary that never commits (L567, MAINT).

    Forces: fidelity and speed. The never-committing boundary serves isolation and
    safety, at the cost of not exercising commit-time behaviour.

    Decision (lead): all six, with L567 adopted as the max (MAINT), and a disposable
    database for what needs a commit.

    Rejected: mocking the database or another engine: never (L399). Tests on the production
    database: never (L400). A committing test in a shared environment: never (L567).

    Realizes: refines TRANSVERSE.OPERABILITY.2 (J5); tests what GUARD.2, GUARD.3,
    ACT.1 and ACT.4 place in the database.

    Review fixes: M2 and X4 (concurrency tests for GUARD.2 part of the default suite,
    not a gap; the gap kept only for the missing source row); m7 and X1 (one notation
    for the pending clause; default, fallback and consequence stated).'
