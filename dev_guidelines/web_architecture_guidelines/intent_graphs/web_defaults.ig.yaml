- uid: PIG-WEB-ALLOCATION.ROW_SECURITY
  name: Row Security Placement
  intent: 'Postgres row-level security is not used by default; authorization follows
    the layers of the philosophy''s authorization placement: writer functions for
    per-user write rules, backend policy for the rest, per-role database privileges
    as the bound on every consumer. Row security is acceptable only when the data
    model is simple, the scoping key is present in every table the policy covers,
    and no all-powerful administrator role must cross scopes (MD-01).'
  epistemic_state: 'known: MD-01 | conflict: L619, L688 favour row security when several
    consumers share the database (MD-03 default)'
  constraints:
  - No row-level security by default (MD-01).
  - 'Acceptable only when all three hold: the data model is simple; the scoping key
    (client, tenant or owner id) is present in every table the policy covers, which
    in practice means composite primary keys led by that key; no all-powerful administrator
    role must read or write across scopes.'
  - Where used, the mechanics are those of PIG-WEB-DATA.GUARD.3.
  - 'Authority: writer functions for per-user write rules decidable from the row and
    the actor; Python backends for product policy not stored in the data and for identity;
    Postgres per consumer role (ALLOCATION.GUARD.3 in the philosophy).'
  - 'Forbidden: row security by default; row security replacing backend checks; a
    request role that owns tables or bypasses policies.'
  design_notes: 'Positions: P1 row security on every path (L619); P2 row security
    only with several consumers (L688); P3 row security as a second line (L128). Forces:
    security (defence in depth per user) against changeability and testability of
    policy, and against the administrator roles and composite keys row policies require.
    Decision: MD-01. The review''s recommendation (F1) is replaced by MD-01; the former
    question on row security is closed. Rejected: P1 and P3 as defaults, they win
    under MD-01''s three conditions; P2''s condition fires in the default context
    (MD-03) but is overridden by MD-01. Would move it: MD-01''s three conditions.
    Tension recorded, not overridden: L619 and L688 favour row security exactly when
    several applications or agents read the database, which MD-03 makes the default;
    L310 records that the sources do not settle row security against application-side
    filtering. Residual risk and mitigation sit with the per-user read visibility
    clause (Q1, ALLOCATION.GUARD.3). Revision R1: decided by MD-01.'
