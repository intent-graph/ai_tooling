- uid: PIG-WEB-DATA.MAINTAIN
  name: Data Maintenance
  intent: Structure changes only through small, re-runnable, online-safe versioned
    migrations with a CI drift gate, and every change leaves trigger-written append-only
    history. Deletion is chosen per table from the reason the data is kept (the default
    is basic soft delete, MD-04), large data changes are human-run batched jobs, and
    recovery to a moment is proven by rehearsed restores.
  epistemic_state: 'known | gap: personal-data erasure and high availability deferred'
  constraints:
  - 'Migrations: structure changes only through small, re-runnable, online-safe versioned
    migrations, with incompatible changes as expand, migrate, contract and a CI gate
    against drift.'
  - 'Deletion, Retention and Partitioning: deletion is chosen per table from the reason
    the data is kept; the default is basic soft delete (MD-04).'
  - 'History Tables: every change leaves trigger-written, append-only history naming
    the consumer role and the claimed actor.'
  - 'Bulk Data Jobs: large data changes are human-run, batched, idempotent jobs with
    a convergence query.'
  - 'Backup and Recovery: recovery to a moment is possible and proven by rehearsed
    restores.'
  design_notes: 'Question: how Postgres schema and data are changed, retired, recorded
    and recovered over time.

    Positions: none of its own; roll-up of MAINTAIN.1 to .5 (.6 and .7 deferred).

    Decision and grounds: roll-up. Structure changes only through small, re-runnable,
    online-safe versioned migrations, with incompatible changes as expand, migrate,
    contract and a CI gate against drift (MAINTAIN.1). Deletion is chosen per table
    from the reason the data is kept; the default for user-facing transactional data
    is basic soft delete (MAINTAIN.2, MD-04). Every change leaves trigger-written,
    append-only history naming the consumer role and the claimed actor (MAINTAIN.3).
    Large data changes are human-run, batched, idempotent jobs with a convergence
    query (MAINTAIN.4). Recovery to a moment is possible and proven by rehearsed restores
    (MAINTAIN.5).

