- uid: PIG-WEB-DATA.GUARD
  name: Declared Integrity
  intent: Every rule a declarative constraint can express is declared and named, because
    only what is bound to the table holds for every writer. Each consumer has its
    own login role with narrow grants and no DELETE, row-level security is not a default,
    the acting user travels as a transaction-local claim that writer functions check,
    and triggers do only a closed list of atomic side work.
  epistemic_state: 'known: MD-05 | conflict: against L471 (inherited from J1), L493
    (GUARD.1) and L529 (GUARD.4)'
  constraints:
  - 'Constraints: every rule a declarative constraint can express is declared and
    named.'
  - 'Roles and Privileges: each consumer has its own login role in narrow group roles,
    no consumer holds DELETE or owns objects, functions that need rights the caller
    lacks are owned by narrow non-login roles, not by the owner role, and state columns
    are revoked from direct update.'
  - 'Request Context and Row Security: the acting user reaches the database only as
    a transaction-local claim that writer functions and audit triggers check; row-level
    security is not a default (MD-01).'
  - 'Triggers: triggers do a closed list of atomic side work and never business transitions.'
  design_notes: 'Question: how Postgres declares integrity and access: constraints,
    roles, row policies and triggers.

    Positions: none of its own; roll-up of GUARD.1 to .4.

    Decision and grounds: roll-up. Every rule a declarative constraint can express
    is declared and named (GUARD.1); each consumer has its own login role in narrow
    group roles, no consumer holds DELETE or owns objects, functions that need rights
    the caller lacks are owned by narrow non-login roles, not by the owner role, and
    state columns are revoked from direct update (GUARD.2); row-level security is
    not a default (MD-01) and the acting user reaches the database only as a transaction-local
    claim that writer functions and audit triggers check (GUARD.3); triggers do a
    closed list of atomic side work and never business transitions (GUARD.4).

    decided by MD-05 (X1): `decided by MD-05, read visibility of rows with per-user
    rules when several backends share the database` (J1 Q1). former recorded default
    (superseded), J1''s word for word: A provisional, with one written specification
    per rule and a shared denial suite; B acceptable when a per-user read rule must
    hold for two or more backends. In this tier: each backend filters these reads
    from one shared written specification, with a shared denial-test suite every backend
    runs; database read functions that receive the verified actor are acceptable when
    a per-user read rule must hold for two or more backends, and where B''s condition
    holds, read functions join INTERFACE.1 and read GUARD.3''s context. Consequence:
    Before the maintainer answered, the reporting role gets no SELECT on comment content
    or narrower-audience comments, the operator role sees every row, and any other
    role that may SELECT the base tables sees every row unless its own role is restricted.
    The database''s part otherwise is the per-role grants of GUARD.2.

    Realizes: refines web-app-philosophy:DATA.GUARD; through its children ALLOCATION.GUARD.2,
    GUARD.3 (per-role layer), ACT.1, ACT.4, ROW_SECURITY.'
