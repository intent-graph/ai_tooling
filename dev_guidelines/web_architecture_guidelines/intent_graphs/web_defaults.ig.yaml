- uid: PIG-WEB-DATA
  name: Postgres Data Tier
  intent: 'Postgres is the system of record and holds everything that must hold whoever
    touches the data, because several backends and other consumers (reporting, consoles,
    scripts) share the database. It does this work in six ways: an organized schema,
    declared integrity and access, concurrency control, data maintenance over time,
    derived data kept in sync, and a function API reached through a pooler.'
  epistemic_state: 'known: MD-05 | gap: collation (ORGANIZE.3)'
  constraints:
  - 'Organize: normalized tables, scope-leading composite keys for scoped rows and
    identity keys elsewhere, precise column types, names that carry role and type,
    bounded JSON validated against schemas held in the database, schemas as domain
    namespaces, and every index justified by a query.'
  - 'Guard: every rule a declarative constraint can express is declared; one role
    per consumer with narrow grants and no DELETE; no row-level security by default
    (MD-01); triggers only for a closed list of atomic side records.'
  - 'Concurrency: Serializable with retry for every writing role, version checks on
    user-edited rows, transaction-scoped locks only, idempotent statements, commit-order-safe
    readers.'
  - 'Maintain: online-safe versioned migrations with a drift gate, deletion chosen
    per table (default basic soft delete), trigger-written append-only history, human-run
    bulk jobs under a checklist, point-in-time recovery proven by restore.'
  - 'Derive: derived copies only with a sync plan and a drift guard, kept by a same-transaction
    trigger where any other writer exists; caches in classified, commented tables.'
  - 'Interface: the function API with its conventions and its compatibility rule,
    reached through a pooler with per-role limits and timeouts.'
  design_notes: "Question: how Postgres realizes the database share of each placement.\n\
    Positions: none of its own (owns no row); roll-up of its six children.\nDecision\
    \ and grounds: roll-up. Postgres is the system of record and holds everything\
    \ that must hold whoever touches the data (RECORD.1, MD-03). It does that work\
    \ in six ways:\n  - organize: normalized tables, scope-leading composite keys\
    \ for scoped rows and identity keys elsewhere, precise column types, names that\
    \ carry role and type, bounded JSON validated against schemas held in the database,\
    \ schemas as domain namespaces, and every index justified by a query (ORGANIZE);\n\
    \  - guard: every rule a declarative constraint can express is declared; one role\
    \ per consumer with narrow grants and no DELETE; no row-level security by default\
    \ (MD-01); triggers only for a closed list of atomic side records (GUARD);\n \
    \ - concurrency: Serializable with retry for every writing role, version checks\
    \ on user-edited rows, transaction-scoped locks only, idempotent statements, commit-order-safe\
    \ readers (CONCURRENCY);\n  - maintain: online-safe versioned migrations with\
    \ a drift gate, deletion chosen per table (default decided by MD-04), trigger-written\
    \ append-only history, human-run bulk jobs under a checklist, point-in-time recovery\
    \ proven by restore (MAINTAIN);\n  - derive: derived copies only with a sync plan\
    \ and a drift guard, kept by a same-transaction trigger where any other writer\
    \ exists; caches in classified, commented tables (DERIVE);\n  - interface: the\
    \ function API with its conventions and its compatibility rule, reached through\
    \ a pooler with per-role limits and timeouts (INTERFACE).\nRejected: none at this\
    \ level.\nRealizes: refines web-app-philosophy:DATA (skeleton link). Through its\
    \ children: RECORD.1, RECORD.2, RECORD.3, GUARD.2, GUARD.3 (per-role layer), GUARD.5,\
    \ GUARD.6, ACT.1, ACT.3, ACT.4, DERIVE.1, DERIVE.3, and the stack placements DB_API,\
    \ TYPE_CHAIN, ROW_SECURITY, CACHE_STORE."
  impl_pointers:
