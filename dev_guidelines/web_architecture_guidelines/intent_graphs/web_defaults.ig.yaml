- uid: PIG-WEB-DATA.GUARD.2
  name: Roles and Privileges
  intent: Each consumer connects with its own login role, a member of narrow NOLOGIN
    group roles per functional branch; no consumer holds DELETE, owns objects or is
    a superuser, and the owner role only owns tables and runs migrations. Functions
    that must write what the caller cannot are owned by narrow non-login roles holding
    only their own DML, so a flaw in one cannot disable triggers or alter history.
  epistemic_state: 'known: MD-03, MD-05 | unvalidated: narrow non-login function-owner
    roles resolving tension 2, grant-matrix check in CI'
  constraints:
  - 'Group roles (NOLOGIN) per functional branch: a read level (SELECT on tables and
    columns), an API level (USAGE on the API schema, EXECUTE on the functions of that
    branch), and an admin level. Under MD-03 the "write" level is EXECUTE on writer
    functions, not table DML; direct INSERT or UPDATE is granted only under DB_API''s
    single-consumer exception, and never on state columns (web-app-philosophy:ALLOCATION.GUARD.3).'
  - 'Login roles: one per consumer (each backend, the reporting tool, the console,
    each script family), neither owner nor superuser, a member of the group roles
    it needs. One login per consumer is what makes the session role in history rows
    (MAINTAIN.3) name the consumer (actor trust). Humans have personal login roles,
    members of the operator or read roles; they assert only themselves as actor.'
  - 'Owner role: owns tables and the other schema objects (one owner per table), runs
    migrations and human-run data jobs, never serves requests. It does not own the
    functions that run with their owner''s rights: a table owner holds rights that
    cannot be granted separately, including disabling the table''s triggers, so a
    bug or injectable dynamic SQL in a function running with the owner''s rights could
    switch off the history and constraint triggers or drop objects.'
  - 'Narrow function-owner roles (inferred): each family of functions that must write
    what the caller cannot is owned by its own NOLOGIN role holding only the DML that
    family executes, for example a deletion role (DELETE on the target tables, INSERT
    on the archive), a history-writer role (INSERT on the history tables) and a cache-maintenance
    role (DELETE and upsert on the cache tables and invalidation queue). No consumer
    role is a member of these roles, and none of them owns a table. This follows the
    doctrine''s "narrow roles for sensitive features can be granted independently",
    its "grant the narrow attributes needed" and its own grant of DELETE to one admin
    role for cache invalidation. It resolves the tension that there is no DELETE grant,
    yet archive-then-delete needs one: DELETE is held by a narrow non-login role that
    owns the deletion functions; the caller does not hold it (inferred).'
  - Functions with their owner's rights run only where they must write what the caller
    cannot (web-app-philosophy:ALLOCATION.GUARD.3), owned by the narrow role above,
    with a fixed search_path and schema-qualified references (inferred for this function
    form).
  - 'Defaults: EXECUTE on functions, CONNECT and TEMPORARY revoked from PUBLIC; default
    privileges set so new objects get the right grants; each REVOKE in the creating
    transaction.'
  - 'Reporting role: SELECT on the tables and columns it needs, personal-data columns
    withheld by default; on a replica when its load matters. It gets no SELECT on
    comment content or on comments with a narrower audience than their target and
    reads them only through database functions (MD-05, PIG-WEB-LOGIC.SECURE.1); the
    operator role sees every row, and any other role that may SELECT a table sees
    every row unless its own role is restricted.'
  - 'Authentication: scram-sha-256, TLS for every remote connection, trust only on
    local sockets.'
  - A function lists a role's effective permissions, and CI checks the grant matrix
    against the role design (inferred).
  - Per-role settings (timeouts, default isolation) are set here, on the role (CONCURRENCY.1,
    INTERFACE.2).
  design_notes: "Question: how database roles, grants and authentication separate\
    \ owners, runtime users and humans.\nPositions:\n  - P1 explicit, minimal search_path;\
    \ revoke CREATE on `public` from PUBLIC (L181).\n  - P2 the owner role that runs\
    \ migrations differs from the runtime role, which gets only the DML it needs (L182,\
    \ inferred synthesis).\n  - P3 privileges granted to NOLOGIN group roles; login\
    \ roles are members (L183).\n  - P4 no superuser for daily work or the application\
    \ (L184).\n  - P5 revoke PUBLIC defaults (CONNECT, TEMPORARY, EXECUTE on functions);\
    \ ALTER DEFAULT PRIVILEGES for future objects; REVOKE in the same transaction\
    \ as the creation (L185).\n  - P6 scram-sha-256; trust only on local sockets;\
    \ TLS (hostssl) for remote connections (L186).\n  - P7 role hierarchy per functional\
    \ branch (read, write, admin), each including the one below; default privileges;\
    \ grants checked at every level; narrow roles for sensitive features; no DELETE\
    \ grants; humans are members of roles; a function lists a user's effective permissions\
    \ (L514 MAINT).\n  - Placement: J1's access paths (one role per consumer; backend,\
    \ reporting, operator, owner) and GUARD.3's per-role layer (EXECUTE per function,\
    \ SELECT per table and column, UPDATE revoked on state columns).\nForces: security\
    \ and integrity (what a consumer can do whatever its code) against administration\
    \ effort.\nDecision and grounds: P1 to P7 adopted, shaped to J1's access paths\
    \ (max).\n  - Group roles (NOLOGIN, L183) per functional branch (L514): a read\
    \ level (SELECT on tables and columns), an API level (USAGE on the API schema,\
    \ EXECUTE on the functions of that branch), and an admin level. Under MD-03 the\
    \ \"write\" level of L514 is EXECUTE on writer functions, not table DML; direct\
    \ INSERT or UPDATE is granted only under DB_API's single-consumer exception, and\
    \ never on state columns (J1 GUARD.3, L596).\n  - Login roles: one per consumer\
    \ (each backend, the reporting tool, the console, each script family), neither\
    \ owner nor superuser (L182, L184), a member of the group roles it needs. One\
    \ login per consumer is what makes the session role in history rows (MAINTAIN.3)\
    \ name the consumer (J1 actor trust). Humans have personal login roles, members\
    \ of the operator or read roles (L514); they assert only themselves as actor (J1).\n\
    \  - Owner role: owns tables and the other schema objects (one owner per table,\
    \ L519), runs migrations and human-run data jobs, never serves requests (J1).\
    \ It does not own the functions that run with their owner's rights (changed after\
    \ review, M3): a table owner holds rights that cannot be granted separately (L182,\
    \ SRC-146), including disabling the table's triggers, so a bug or injectable dynamic\
    \ SQL in a function running with the owner's rights could switch off the history\
    \ and constraint triggers or drop objects.\n  - Narrow function-owner roles (changed\
    \ after review, M3; inferred): each family of functions that must write what the\
    \ caller cannot is owned by its own NOLOGIN role holding only the DML that family\
    \ executes, for example a deletion role (DELETE on the target tables, INSERT on\
    \ the archive), a history-writer role (INSERT on the history tables) and a cache-maintenance\
    \ role (DELETE and upsert on the cache tables and invalidation queue). No consumer\
    \ role is a member of these roles, and none of them owns a table. This follows\
    \ L514's \"narrow roles for sensitive features can be granted independently\"\
    , L184's \"grant the narrow attributes needed\" and the doctrine's own grant of\
    \ DELETE to one admin role for cache invalidation (L525's tension note). It resolves\
    \ doctrine-internal tension 2 (no DELETE grant, yet archive-then-delete needs\
    \ one): DELETE is held by a narrow non-login role that owns the deletion functions;\
    \ the caller does not hold it (inferred).\n  - Functions with their owner's rights\
    \ run only where they must write what the caller cannot (J1 GUARD.3), owned by\
    \ the narrow role above, with a fixed search_path and schema-qualified references\
    \ (L181, L505; inferred for this function form).\n  - Defaults: EXECUTE on functions,\
    \ CONNECT and TEMPORARY revoked from PUBLIC; default privileges set so new objects\
    \ get the right grants; each REVOKE in the creating transaction (L185).\n  - Reporting\
    \ role: SELECT on the tables and columns it needs, personal-data columns withheld\
    \ by default (J1); on a replica when its load matters. Like the operator role,\
    \ it sees every row of a table it may SELECT, rows with per-user rules and comments\
    \ included, unless its own role is restricted (X1).\n  - Authentication: scram-sha-256,\
    \ TLS for every remote connection, trust only on local sockets (L186).\n  - A\
    \ function lists a role's effective permissions (L514), and CI checks the grant\
    \ matrix against the role design (inferred).\n  - Per-role settings (timeouts,\
    \ default isolation) are set here, on the role (CONCURRENCY.1, INTERFACE.2).\n\
    decided by MD-05 (B1, X1): `decided by MD-05, read visibility of rows with per-user\
    \ rules when several backends share the database` (J1 Q1). former recorded default\
    \ (superseded), J1's word for word: A provisional, with one written specification\
    \ per rule and a shared denial suite; B acceptable when a per-user read rule must\
    \ hold for two or more backends. For this node: by default each backend filters\
    \ these reads and this node grants per role; where B's condition holds, consumer\
    \ roles receive EXECUTE on the read functions (INTERFACE.1) and, per role, lose\
    \ direct SELECT on the tables those functions guard. Before the maintainer answered,\
    \ the reporting role gets no SELECT on comment content or narrower-audience comments,\
    \ the operator role sees every row, and any other role that may SELECT the base\
    \ tables sees every row unless its own role is restricted.\nRejected: one shared\
    \ runtime role for all consumers: rejected (J1 access paths; audit could not name\
    \ the consumer). DELETE grants to consumer roles: never (L514, L525). Superuser\
    \ or owner for the application: never (L184, L182). Definer functions owned by\
    \ the owner role: rejected (M3); acceptable never, since a narrow role always\
    \ suffices for a function family's DML.\nRealizes: ALLOCATION.GUARD.3 (database\
    \ layer per consumer role); ALLOCATION.RECORD.2 and PIG-WEB-ALLOCATION.DB_API\
    \ (EXECUTE as the contract's access); ALLOCATION.ACT.4 (session role names the\
    \ consumer). Links proposed, not created: GUARD.2 realizes GUARD.3 and DB_API.\n\
    \nBuild narrative moved out of the constraints: changed after review, M3; changed\
    \ after review, M3; inferred."
