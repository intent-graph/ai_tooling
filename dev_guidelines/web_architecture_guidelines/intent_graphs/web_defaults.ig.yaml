- uid: PIG-WEB-DATA.ORGANIZE.1
  name: Tables and Normalization
  intent: Repeating groups become child tables with a foreign key, vertical splits
    of wide tables are a measured physical choice, and subtype tables share the parent's
    key. An array column is allowed only for a bounded, read-heavy set that references
    nothing, with its rules bound to the column, because no foreign key reaches inside
    an array.
  epistemic_state: 'known | unvalidated: binding the array check to the column is
    a reading of L489 under MD-03'
  constraints:
  - Repeating groups are always a child table.
  - A vertical split of a wide table is a physical choice, made when a measured access
    pattern needs it, with the same key in each part and a one-to-one foreign key
    from each part to the main row (the foreign key is inferred from the "each fact
    once" rule). The integrity and security reasons for splitting one-to-one attributes
    stay those of the philosophy's organized-facts rule (web-app-philosophy:DATA.ORGANIZE).
  - Type-specific tables (subtypes) share the parent's key, which is both their primary
    key and a foreign key to the parent.
  - 'An array column is allowed only for a bounded, read-heavy set of values that
    reference nothing; its bound and element rules are declared, as a CHECK over an
    immutable function where the rule is row-local, or the write-time trigger of GUARD.4
    where it is not. "Validated by a function" is met by binding that function to
    the column, not by asking every writer to call it (inferred; same ground as web-app-philosophy:ALLOCATION.GUARD.2:
    only what is bound to the table holds for every writer under MD-03).'
  design_notes: "Question: how repeating groups, wide tables and arrays are handled\
    \ in table design.\nPositions:\n  - P1 repeating groups (Class1, Class2, Class3)\
    \ move to a child table with a foreign key (L169; SRC-291, single source, no dissent).\n\
    \  - P2 split very wide tables vertically only when needed, by access pattern,\
    \ the same key in each part; type-specific tables share a common key set; arrays\
    \ only for bounded, read-heavy sets validated by a function, never for unbounded\
    \ sets or where references need integrity (L489 MAINT).\n  - Inherited: third\
    \ normal form by default and Boyce-Codd, fourth and fifth normal form where they\
    \ apply, a dependency lost by a Boyce-Codd decomposition being enforced by a constraint\
    \ trigger (J2, DATA.ORGANIZE, L037, L469); one-to-one attributes as nullable columns,\
    \ split only for L470's reasons (J2).\nForces: P1 serves integrity (one fact per\
    \ row, a declared reference per member). P2 serves read and write performance\
    \ of wide rows (vertical split) and query convenience (arrays) at the cost of\
    \ a constraint the database cannot declare: no foreign key reaches inside an array.\n\
    Decision and grounds: P1 and P2, with the array rule bound to the database.\n\
    \  - Repeating groups are always a child table (L169).\n  - A vertical split of\
    \ a wide table is a physical choice, made when a measured access pattern needs\
    \ it, with the same key in each part and a one-to-one foreign key from each part\
    \ to the main row (L489; the foreign key is inferred from J2's \"each fact once\"\
    ). The integrity and security reasons for splitting one-to-one attributes stay\
    \ those of L470 (J2).\n  - Type-specific tables (subtypes) share the parent's\
    \ key, which is both their primary key and a foreign key to the parent (L489).\n\
    \  - An array column is allowed only for a bounded, read-heavy set of values that\
    \ reference nothing; its bound and element rules are declared, as a CHECK over\
    \ an immutable function where the rule is row-local (L174, L494), or the write-time\
    \ trigger of GUARD.4 where it is not. \"Validated by a function\" (L489) is met\
    \ by binding that function to the column, not by asking every writer to call it\
    \ (inferred; same ground as J1 GUARD.2: only what is bound to the table holds\
    \ for every writer under MD-03).\nRejected: arrays for unbounded sets or members\
    \ that reference rows: never (L489; a member cannot carry a foreign key). A vertical\
    \ split without a measured access need: rejected; acceptable when L470's reasons\
    \ apply instead.\nRealizes: J2 DATA.ORGANIZE; TYPE_CHAIN through the parent."
