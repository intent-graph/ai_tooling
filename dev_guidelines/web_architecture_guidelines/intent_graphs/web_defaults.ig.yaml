- uid: PIG-WEB-INTERACTION.AGENT.3
  name: Identity and Delegation
  intent: An agent has its own identity and acts for a user, with tokens carrying
    subject and actor so both are recorded in logs and in the database; agent-originated
    writes are marked as a class. Tokens are short-lived and audience-bound, sender-constrained
    wherever the client can hold a key, and every agent credential has an owner, is
    revocable and has a lifecycle; a bearer-only client reaches consequential operations
    only through the owning user's exact-action approval.
  epistemic_state: 'known | unvalidated: "both is the max" inferred (L638); agent
    parameters of RFC 8693 open (L639); L643 inferred for agents; bearer-only path
    through approval inferred; sender-constraining support across agent hosts not
    read'
  constraints:
  - An agent has its own identity and acts for a user; tokens carry the subject and
    the actor (act claim or its documented equivalent), so downstream services and
    logs see both and any chain.
  - 'Both identities reach the database: the backend asserts the user and the agent
    as the claimed actor in the transaction-local setting, checked against the backend''s
    role and recorded with the session role; agent-originated writes are marked as
    a class.'
  - 'Token binding by client capability: tokens are short-lived and audience-bound
    for every scope. They are sender-constrained (DPoP or mutual TLS) for every client
    that can hold a key, and the authorization server issues bound tokens to every
    client that supports them. A client that can hold only bearer tokens keeps consequential
    scopes, under three conditions: its tokens are short-lived and narrow, revocation
    is held on the server, and every consequential operation it requests runs only
    through the exact-action approval of .4, which the writer function checks (inferred).
    For a bearer-only client, an approved effect whose result returns to the caller
    (a bulk export) is delivered to the approving user in the application, not to
    the token holder (inferred).'
  - 'Consequential operations bound to their details: Rich Authorization Requests
    where the authorization server supports them; otherwise the exact-action approval
    of .4 binds the operation (inferred substitution).'
  - 'Credential lifecycle (GUARD.4): one revocable credential per agent, a recorded
    sponsor, short lifetimes, and removal that leaves no orphaned permission.'
  design_notes: 'Decides: how an agent identity, its delegating user and its credentials
    are represented and recorded.

    Rows: L638, L639, L641, L643, L659, L660. Cited: L022, L311, L566 (MAINT), L685,
    L658, R1-3 of the J1 records.

    Positions: identity (L638): P1 the agent is the user (user token); P2 the agent
    has its own identity and permissions; P3 the agent acts for a user with both recorded,
    the strongest as a delegated token carrying both (RFC 8693 act, L639). Token binding
    (L641, contested): P4 short-lived, sender-constrained tokens (DPoP or mutual TLS);
    P5 plain bearer tokens, short-lived and narrow. P6 authorization bound to the
    transaction details for consequential operations (Rich Authorization Requests,
    L643, inferred for agents). P7 agent-originated writes marked in the data (actor
    type and id next to the user) (L659). P8 agent credentials with an owner and a
    lifecycle: short-lived, one revocable credential per agent, recorded sponsor,
    removal without orphaned permissions (L660).

    Forces: P3 serves audit and least privilege at the cost of design; P1 serves simplicity
    and loses attribution. P4 serves theft resistance at the cost of client complexity;
    P5 serves interoperability with today''s agent clients. P6 serves least privilege
    on irreversible actions at the cost of authorization-server support. P7 and P8
    serve review, undo and containment.

    Decision (the rules are the constraints):

    (superseded by MD-09) Rejected: P1: acceptable for a personal tool where the user
    and the agent are the same accountable party and no consequential scope is granted
    (L638 a). P2 alone: wins for unattended automation with no delegating user (L638
    b), still recorded as the actor. (superseded by MD-09) P5 for consequential scopes:
    wins never; acceptable for the rest. P4 for every scope: wins when every agent
    client can hold a key (L641).

    Realizes: ALLOCATION.GUARD.4 (skeleton link); ALLOCATION.ACT.4 (proposed: both
    identities in the audit, L658); ALLOCATION.GUARD.3 (actor assertion, R1-3).

    Hand-offs: actor columns and history (PIG-WEB-DATA.MAINTAIN.3, L685); token issuance
    (PIG-WEB-LOGIC.SECURE.4).


    Corrected by MD-09 (re-audit under MD-08): sender-constrained tokens wherever
    the client can hold a key; otherwise short-lived, revocable bearer tokens with
    every consequential action behind the owner''s exact-action approval. Rejected:
    sender-constraining required for consequential scopes: wins when every client
    that needs those scopes can hold a key (a closed or certified set of agents),
    or when an approved effect''s result must return to the token holder and cannot
    be delivered in the application. Bearer tokens for consequential scopes without
    the server-held approval: never.'
