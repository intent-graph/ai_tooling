- uid: PIG-WEB-INTERACTION.REALTIME.4
  name: Channel Security
  intent: Long-lived connections use TLS only, an Origin allowlist and the session
    cookie for authentication, with no token ever in a URL; authorization is checked
    per subscription and per event, streams close at session end, and message size,
    rate and connections are capped. Per-user reads go through database read functions
    (MD-05).
  epistemic_state: 'known: MD-05 | unvalidated: identifier-only payloads and the session
    re-check interval inferred'
  constraints:
  - 'Transport and origin: TLS only; the WebSocket handshake and SSE endpoint check
    Origin against an explicit allowlist (cross-site WebSocket hijacking); compression
    off unless measured necessary.'
  - Authentication by the session cookie (HttpOnly, Secure, SameSite; GUARD.4); no
    session token, bearer token or long-lived credential ever travels in a URL (web-app-philosophy:INTERACTION.ENVIRONMENT.6,
    whose one exception, signed file-delivery URLs, does not apply to channels); agent
    clients use their bearer credential in the header on WebSocket-capable transports
    (inferred).
  - 'Authorization per subscription and per event: subscribing to a channel checks
    the user''s right to read its target; each event is filtered per subscriber against
    the target''s read rights before it is sent, with the same filter as every other
    surface. Event payloads carry identifiers, the cursor and a change kind; content
    is fetched through the normal authorized endpoints (inferred), unless it has passed
    the same per-recipient filter.'
  - 'Session end closes the stream: on logout or expiry the connection is closed;
    the connection process re-checks the session at an interval no longer than the
    session''s idle timeout (interval inferred).'
  - 'Bounds: message size, message rate and connections per user and per client capped;
    every inbound message parsed as untrusted input.'
  - 'Per-user reads (MD-05): each event is filtered per subscriber through the database
    read functions of PIG-WEB-LOGIC.SECURE.1, and the shared denial-test suite covers
    the real-time channel.'
  - Per-event filtering protects the channel the application serves, nothing stronger;
    the comment-grant restriction of PIG-WEB-INTERACTION.COLLABORATE.4 (reporting
    role) applies.
  design_notes: 'Decides: how long-lived connections are authenticated, authorized
    and bounded.

    Rows: L459, L460, L461. Cited: L022, L644, L686, L687 (J4), L463.

    Positions: P1 wss only, Origin checked against an allowlist at the handshake,
    no tokens in URLs, compression off unless needed, messages untrusted (L459, consensus);
    P2 authorization once at connect (rejected in L460); P3 authorization of each
    channel and each message against the read rights of the target, connections closed
    at session expiry or logout (L460, merging COLLAB-C24); P4 caps on message size,
    message rate and connections per client (L461).

    Forces: P1, P3, P4 serve confidentiality and availability, at the cost of a check
    per event and per subscription; P2 serves throughput and leaks every change made
    after a right is revoked.

    Decision (the rules are the constraints): P1, P3, P4.

    Rejected: P2: wins never (L460). Tokens in query strings for WebSocket authentication:
    wins never (L459).

    Realizes: ALLOCATION.GUARD.3 (proposed link, requires: per-subscriber filtering
    follows the authorization placement, its open read clause included); ALLOCATION.GUARD.4
    (proposed: session cookie authenticates the channel); J4 INTERACTION.ENVIRONMENT.7.

    Hand-offs: session revocation signal (PIG-WEB-LOGIC.SECURE.2); per-client connection
    limits at the edge (PIG-WEB-LOGIC.SECURE.6); comment grants of reporting and operator
    roles (PIG-WEB-DATA.GUARD.2).'
