- uid: PIG-WEB-DATA.GUARD.1
  name: Constraints
  intent: Every rule that a key, NOT NULL, CHECK, foreign key, unique or exclusion
    constraint, or domain can express is declared and named in Postgres, required
    whatever the backends also check. Foreign keys are strict (NO ACTION by default,
    CASCADE only for components meaningless without their parent), cross-row rules
    end in a constraint trigger under Serializable, and a hierarchy's parent link
    stays a declared foreign key.
  epistemic_state: 'known | conflict: partly against L493 (MAINT) on hierarchy representation;
    against L471 (MAINT, inherited from J1) | unvalidated: the acyclicity trigger,
    the fixed-depth table-per-level rule and the domain-change route are inferred'
  constraints:
  - NOT NULL by default; a nullable column states the absence it means; a group of
    columns that must be present together gets a CHECK.
  - 'Foreign keys, in the stricter form: every reference declared, across schemas
    too, every foreign-key column indexed (ORGANIZE.7); NO ACTION by default; SET
    NULL for optional links; CASCADE only for a component meaningless without its
    parent, never for core entities, soft-deletable tables or cross-schema links.
    Deletion of anything else goes through a deletion function (MAINTAIN.2).'
  - 'CHECK: row-local and immutable, paired with NOT NULL, for ranges, lengths, either-or
    exclusivity, conditional requirements and time ordering; complex row-local rules
    in reusable immutable validation functions called from the CHECK.'
  - 'Cross-row rules: partial unique index, NULLS NOT DISTINCT, exclusion constraint
    first; beyond them, a constraint trigger under Serializable or a lock (GUARD.4,
    CONCURRENCY.1).'
  - Junction tables carry both foreign keys NOT NULL plus a uniqueness constraint
    on the pair (a surrogate id only when the junction has attributes); a junction
    bridging two schemas lives in the schema of the entity it enriches. Outside scoped
    schemas, a simple link table gets a surrogate key plus a unique constraint rather
    than a composite primary key.
  - 'Hierarchies: a fixed-depth hierarchy is one table per level (inferred). An unbounded
    hierarchy stores the parent link as a declared self-referencing foreign key, the
    fact "x''s parent is y" stored once (web-app-philosophy:DATA.ORGANIZE), with acyclicity
    checked by a constraint trigger; acyclicity is a multi-row rule, so the trigger
    runs under Serializable or after locking the rows it reads (CONCURRENCY.1). A
    materialized path, closure table or nested set is a derived read structure kept
    in the same transaction, under DERIVE.1''s sync plan and drift guard, never the
    only representation. Ground, per form: a materialized path or nested set lists
    ancestors with no foreign key on them, so a moved or deleted ancestor leaves rows
    that state a false hierarchy; a closure table does carry foreign keys on both
    ancestor and descendant, but no constraint protects its transitive completeness,
    so a missed or extra pair states a false ancestry (inferred).'
  - Deferrable constraints only for circular dependencies or in-transaction reordering;
    immediate by default.
  - Domains for value types used in several places, check allowing NULL, NOT NULL
    on the column. A domain check is changed so that stored data is rechecked, on
    large tables by the NOT VALID then VALIDATE route of MAINTAIN.1 rather than a
    drop and re-add under an exclusive lock (inferred).
  - Every constraint is named, source and target in the name; the backends' validators
    are generated from or tested against the constraints (web-app-philosophy:ALLOCATION.RULES.1).
  - Same-row derived values are stored generated columns (DERIVE.1).
  design_notes: "Question: which rules are declared as keys, NOT NULL, CHECK, foreign\
    \ keys, unique and exclusion constraints and domains.\nPositions:\n  - P1 most\
    \ columns NOT NULL; nullable needs a reason (L171).\n  - P2 foreign keys declared,\
    \ ON DELETE by ownership: CASCADE for components, RESTRICT or NO ACTION for independent\
    \ objects, SET NULL for optional links (L172) against P2' every foreign key declared,\
    \ including across schemas, and indexed; NO ACTION by default; SET NULL for optional\
    \ metadata links; CASCADE only where the child is meaningless without its parent,\
    \ never for core entities, soft-deletable tables or cross-schema links (L492 MAINT,\
    \ stricter).\n  - P3 CHECK row-local and immutable, paired with NOT NULL; cross-row\
    \ rules by unique index, exclusion constraint or constraint trigger (L174); partial\
    \ unique indexes, NULLS NOT DISTINCT, exclusion constraints (L175).\n  - P4 junction\
    \ tables: both foreign keys NOT NULL, unique pair; surrogate only when the junction\
    \ has attributes; outside scoped schemas a link table gets a surrogate plus a\
    \ unique constraint (L491 MAINT).\n  - P5 avoid self-referential foreign keys:\
    \ only for unbounded hierarchies with no alternative, and then prefer materialized\
    \ path, closure table or nested set; deferrable constraints only for circular\
    \ dependencies or in-transaction reordering (L493 MAINT).\n  - P6 enforce at the\
    \ database: CHECK for ranges, lengths, exclusivity, conditional requirements,\
    \ time ordering; NOT NULL for keys, references, core fields, timestamps, booleans;\
    \ text with CHECK; reusable validation functions for complex row-local rules;\
    \ same-row derived values as stored generated columns (L494 MAINT).\n  - P7 constraints\
    \ are the contract half that holds whatever writes; semantics of NULL in CHECK,\
    \ unique and foreign keys; mirror the Python model's constraints; name constraints\
    \ so violations map to stable errors (L495).\n  - P8 domains for reusable constraints,\
    \ check allowing NULL with NOT NULL on the column; change a domain check by drop,\
    \ adjust, re-add (L496).\n  - Inherited: L471 (MAINT) makes CHECK and triggers\
    \ optional defence in depth; J1 GUARD.2 requires declarative constraints (partial\
    \ verdict against L471).\nForces: integrity for every writer (P1 to P8) against\
    \ migration effort and write cost. P2 and P2' differ on how far a delete reaches\
    \ by itself. P5 trades a declared parent reference for read structures whose correctness\
    \ no constraint fully protects: a materialized path or nested set lists ancestors\
    \ with no foreign key on them; a closure table carries foreign keys on both ancestor\
    \ and descendant, but no constraint protects its transitive completeness.\nDecision\
    \ and grounds: declare every rule a declarative constraint can express, required\
    \ (J1 GUARD.2, MD-03; L040, L471 adopted on authority, its \"optional\" part not).\n\
    \  - NOT NULL by default; a nullable column states the absence it means (L171,\
    \ L485 via J2); a group of columns that must be present together gets a CHECK\
    \ (J2).\n  - Foreign keys: P2' (L492, MAINT, stricter, max): every reference declared,\
    \ across schemas too, every foreign-key column indexed (ORGANIZE.7); NO ACTION\
    \ by default; SET NULL for optional links; CASCADE only for a component meaningless\
    \ without its parent, never for core entities, soft-deletable tables or cross-schema\
    \ links. Deletion of anything else goes through a deletion function (MAINTAIN.2).\n\
    \  - CHECK: row-local and immutable, paired with NOT NULL (L174), for L494's list;\
    \ complex row-local rules in reusable immutable validation functions called from\
    \ the CHECK (L494).\n  - Cross-row rules: partial unique index, NULLS NOT DISTINCT,\
    \ exclusion constraint first (L175); beyond them, a constraint trigger under Serializable\
    \ or a lock (GUARD.4, CONCURRENCY.1).\n  - Junction tables per L491.\n  - Hierarchies\
    \ (partly against L493): a fixed-depth hierarchy is one table per level (inferred;\
    \ L493 does not state it, corrected after review, m2). An unbounded hierarchy\
    \ stores the parent link as a declared self-referencing foreign key, the fact\
    \ \"x's parent is y\" stored once (J2 DATA.ORGANIZE), with acyclicity checked\
    \ by a constraint trigger; acyclicity is a multi-row rule, so the trigger runs\
    \ under Serializable or after locking the rows it reads (CONCURRENCY.1). A materialized\
    \ path, closure table or nested set is a derived read structure kept in the same\
    \ transaction, under DERIVE.1's sync plan and drift guard, never the only representation.\
    \ Ground, per form (corrected after review, m2): a materialized path or nested\
    \ set lists ancestors with no foreign key on them, so a moved or deleted ancestor\
    \ leaves rows that state a false hierarchy; a closure table does carry foreign\
    \ keys on both ancestor and descendant, but no constraint protects its transitive\
    \ completeness, so a missed or extra pair states a false ancestry (inferred from\
    \ L492 and L488).\n  - Deferrable constraints only for circular dependencies or\
    \ in-transaction reordering; immediate by default (L493).\n  - Domains for value\
    \ types used in several places, check allowing NULL, NOT NULL on the column (L496).\
    \ A domain check is changed so that stored data is rechecked (L496), on large\
    \ tables by the NOT VALID then VALIDATE route of MAINTAIN.1 (L195) rather than\
    \ a drop and re-add under an exclusive lock (inferred).\n  - Every constraint\
    \ is named, source and target in the name (L495, L506); the backends' validators\
    \ are generated from or tested against the constraints (L495, J1 RULES.1).\n \
    \ - Same-row derived values are stored generated columns (L494, L176; DERIVE.1).\n\
    Rejected: P2's broader CASCADE: rejected; acceptable for a component meaningless\
    \ without its parent, which P2' keeps. A path, closure table or nested set as\
    \ the only representation of an unbounded hierarchy: rejected; acceptable as a\
    \ derived copy. Application-only enforcement of any rule a constraint can express:\
    \ never (J1 GUARD.2). L471's \"CHECK constraints optional\": rejected (inherited\
    \ from J1).\nRealizes: web-app-philosophy:ALLOCATION.GUARD.2 (declares the invariants\
    \ the placement gives the database); J2 DATA.GUARD.\n\nBuild narrative moved out\
    \ of the constraints: inferred; L493 does not state it, corrected after review,\
    \ m2; corrected after review, m2."
