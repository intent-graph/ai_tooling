- uid: PIG-WEB-DATA.CONCURRENCY.3
  name: Locks
  intent: Explicit locks are transaction-scoped only, taken in one documented order,
    and used for contention on a hot logical key, for the exceptions where Serializable
    cannot reach, and for claiming queue rows with SKIP LOCKED. No lock outlives a
    transaction and none is held across user think time.
  epistemic_state: known
  constraints:
  - 'Under the Serializable default, explicit locks are for: reducing serialization
    failures on a hot logical key; the exceptions of CONCURRENCY.1 (replica-protected
    writes, a job outside Serializable); claiming queue rows (`FOR UPDATE SKIP LOCKED`,
    queue tables only).'
  - Only transaction-scoped locks; session-level advisory locks never.
  - Locks on several objects in one documented order; a lock taken before the first
    query when under Repeatable Read; never a locking call beside a LIMIT at the same
    query level.
  - 'Advisory lock keys: serialise writers of one logical key with a transaction-scoped
    advisory lock whose key is a 64-bit hash of a text built from every key dimension
    (not the two-int4 form, which overflows when a hash is narrowed); the lock is
    released automatically at transaction end.'
  - No lock outlives a transaction, and no transaction spans user think time; a lease
    for long edits is a row the writer function checks, not a lock (web-app-philosophy:ALLOCATION.GUARD.5).
  design_notes: "Question: how row and advisory locks are taken, ordered and released.\n\
    Positions: L578 `FOR UPDATE` semantics; under Repeatable Read lock before the\
    \ first query; L579 one consistent lock order, retry the deadlock victim; L580\
    \ transaction-level advisory locks over session-level ones (which survive rollback\
    \ and break under transaction pooling); no locking function at the query level\
    \ of a LIMIT; L581 serialize writers of one logical key with a transaction-scoped\
    \ advisory lock on a 64-bit hash of every key dimension (MAINT). Related: L475\
    \ (no lock across think time), L413 and L595 (SKIP LOCKED only for queues).\n\
    Forces: correctness and contention control against blocking and deadlocks.\nDecision\
    \ and grounds: all adopted (max; MAINT agrees with the research).\n  - Under the\
    \ Serializable default, explicit locks are for: reducing serialization failures\
    \ on a hot logical key (L581); the exceptions of CONCURRENCY.1 (replica-protected\
    \ writes, a job outside Serializable); claiming queue rows (`FOR UPDATE SKIP LOCKED`,\
    \ L413, L595, queue tables only).\n  - Only transaction-scoped locks; session-level\
    \ advisory locks never (L580, L200).\n  - Locks on several objects in one documented\
    \ order (L579); a lock taken before the first query when under Repeatable Read\
    \ (L578); never a locking call beside a LIMIT at the same query level (L580).\n\
    \  - Advisory lock keys per L581.\n  - No lock outlives a transaction, and no\
    \ transaction spans user think time (L475); a lease for long edits is a row the\
    \ writer function checks, not a lock (J1 GUARD.5, L476 via J2).\nRejected: session-level\
    \ advisory locks: never (L580). Locks held across requests: never (L475).\nRealizes:\
    \ ALLOCATION.GUARD.5; ALLOCATION.ACT.3 (queue claiming, with JOB_HOST)."
