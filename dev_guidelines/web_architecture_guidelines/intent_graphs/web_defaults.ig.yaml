- uid: PIG-WEB-TRANSVERSE.SECURITY.4
  name: Secrets
  intent: 'A managed store is the authority for every secret, with least privilege
    per service and per database consumer role, automated rotation and audited access;
    secrets reach the process at start by file or a non-shared environment. The hosting
    model is a per-project choice (MD-06): on self-managed hosts without an orchestrator,
    one acceptable route, the store is a technology to add and until then a file outside
    source control readable only by the service account is in force; on an orchestrated
    platform its secret store is the managed store.'
  epistemic_state: 'known: MD-06 | conflict: L350 contested (environment variables
    against a managed store), reconciled by authority and delivery | unvalidated:
    the reconciliation; credentials per consumer role'
  constraints:
  - 'Every secret is held in one managed store: the platform''s secret store, or a
    secrets manager. Access is granted per service and per consumer role, least privilege,
    and every access is audited.'
  - 'Each database consumer role of MD-03 has its own credentials: each backend, the
    reporting role, the operator role and the owner role. They are rotated automatically;
    short-lived dynamic credentials are preferred where the store issues them.'
  - 'Delivery: the secret reaches the process at start, as a file readable only by
    the service account or as an environment variable. The environment is acceptable
    when no other process can read it and the framework never dumps it (debug off).
    The delivery rule is reconciled between the two positions (inferred).'
  - The framework signing secret is held like any other, never committed, and rotated.
  - 'CI/CD: least-privilege service accounts, secrets scoped per environment, none
    in pipeline output.'
  - Secret-access logs are kept as long as obligations require, at least 90 days where
    none exists.
  design_notes: "Rows: L350, L351, L352, L353. Cited: L102, L250, L036.\nPositions:\
    \ - P1 secrets in environment variables (Twelve-Factor: simple, language-neutral,\
    \ portable; L350).\n  - P2 runtime injection from a managed store, with access\
    \ control, rotation and audit (OWASP; L350, L351).\n  - Consensus: centralised\
    \ storage, least privilege per service, short-lived dynamic secrets with automated\
    \ rotation, every access audited with logs kept at least 90 days (L351); the framework\
    \ signing secret kept confidential (L352); CI/CD treated as production (L353);\
    \ secrets never in source (L102, L250).\nForces: P2 serves confidentiality, revocation\
    \ and accountability (who read which secret), at the cost of a store to run or\
    \ rent. P1 serves simplicity and portability; environment variables are visible\
    \ to many processes and leak through dumps and error pages (L350). The positions\
    \ answer two different questions: where the secret is held, and how it reaches\
    \ the process.\nDecision (lead): P2 as the authority; delivery at process start\
    \ by file or environment.\nRejected: P1 as the place where secrets are held: acceptable\
    \ when no managed store exists on the platform and adding one is not budgeted\
    \ (EVOLUTION.4). The secret then sits in a file outside source control, readable\
    \ only by the service account (L250), and rotation is a scheduled task.\nUnder\
    \ the assumed hosting: (self-managed hosts, no orchestrator; questions.md, Q1):\
    \ there is no platform store, so the managed store is a technology to add, weighed\
    \ under EVOLUTION.4 (J5: a new technology past a measured need, its operating\
    \ cost budgeted). Until it is added, the file fallback above is in force. On a\
    \ platform that offers a store, the store is the authority from the start.\nRealizes:\
    \ refines TRANSVERSE.SECURITY (exposure, L036); rests on the J1 access paths (one\
    \ role per consumer, MD-03).\nReview fixes: m6 (the default under the assumed\
    \ hosting stated plainly: the store is a technology to add, the file fallback\
    \ in force until then; folded into Q1).\n\nMaintainer answer MD-06 applies: hosting\
    \ is a per-project choice; the file fallback is the self-managed route."
