- uid: PIG-WEB-LOGIC.EXPOSE.7
  name: API Evolution
  intent: 'The API evolves additively: the JSON interface is served under `/v1` from
    the start and its major version does not change while every change is compatible,
    CI fails on drift between description and implementation and on a breaking diff
    not released as a new version, and an unavoidable break ships as `/v2` beside
    `/v1` through a published window announced with `Deprecation` and `Sunset`.'
  epistemic_state: 'known: MD-02 for the gate (X7: every interface description) |
    unvalidated: the URL-path major version, v1 from the start, chosen among contested
    positions; the skew window bound and server-first field rollout (inferred)'
  constraints:
  - CI fails on drift between the description and the implementation and on a breaking
    diff not released as a new version; contract tests cover behaviour; the written
    list of breaking changes is the diff's policy.
  - 'The gate and the compatibility window cover every interface description consumers
    read: the HTTP description, the function API catalogue and the agent tool surface.'
  - JSON served under `/v1` from the start; its major version does not change while
    every change is compatible; no minor version; HTML routes carry no version.
  - 'An unavoidable break: `/v2` beside `/v1`, both served through a published window,
    the old one announced with `Deprecation` and `Sunset`, a documentation link and
    the OpenAPI deprecated flag.'
  - Changes stay additive across a window at least as long as a page can live with
    a valid session (the absolute session timeout); clients tolerate unknown fields.
  - 'A new request field ships server first, then client: clients send it only once
    every server instance accepts it.'
  - 'Forbidden: unversioned JSON paths until the first break.'
  design_notes: "Positions: - P1 check in CI that the implementation conforms to its\
    \ OpenAPI description; design inside what OpenAPI can express (L273).\n  - P2\
    \ write down what counts as breaking: removing or renaming, a new required request\
    \ field, a changed type, default, format or meaning (L274).\n  - P3 announce removal\
    \ with `Deprecation` and `Sunset` headers, a documentation link, the flag in the\
    \ OpenAPI file, and two versions coexisting during the transition (L275).\n  -\
    \ P4 when a break is unavoidable, the version identifier sits in one agreed place;\
    \ contested: a major version in the URL path (Google), a required dated `api-version`\
    \ query parameter (Azure), media-type versioning (Zalando), a dated request header\
    \ with account pinning (Stripe, GitHub), no version and continuous additive evolution\
    \ (GraphQL) (L276).\n  - P5 an explicit skew policy: compatible changes within\
    \ a window, clients tolerant of unknown fields, and either versioned paths or\
    \ routing each client to the server version that served its code; contested, the\
    \ routing option seen only in search snippets (L277).\n  - P6 a first-party browser\
    \ client that ships with the server still sees skew, so changes stay additive\
    \ across that window (L278; inferred).\n  - P7 a breaking-change diff of the description\
    \ in CI (oasdiff); it covers the description only, behaviour needs contract tests\
    \ (L547).\n  - Cited: MD-02 (always in sync, a CI gate on drift); L517 (the function\
    \ API evolves additively without version numbers; its departure is counted once\
    \ at J6's function-API node, X2: \"deployed together\" stays acceptable only when\
    \ every consumer of the changed object ships in the same deployment as the migration;\
    \ otherwise a breaking change goes expand, migrate, contract).\n\nForces: changeability\
    \ without breaking clients; correctness of the contract.\n\nDecision: 1. **MD-02's\
    \ gate**: CI fails on drift between description and implementation (P1) and on\
    \ a breaking diff not released as a new version (P7); contract tests cover behaviour\
    \ (P7); the written list of breaking changes (P2) is the diff's policy. The gate\
    \ and the compatibility window cover every interface description consumers read:\
    \ the HTTP description, the database function API catalogue and the agent tool\
    \ surface (X7).\n  2. **Additive by default**: the JSON interface is served under\
    \ `/v1` from the start, and its major version does not change while every change\
    \ is compatible (review m5; L276's URL-path position, Google: MUST `v1`); no minor\
    \ version (the discipline L517 sets for the function API, applied with X2's condition).\
    \ HTML routes carry no version: their contract is the rendered page (EXPOSE.1).\n\
    \  3. **An unavoidable break**: `/v2` beside `/v1`, both served through a published\
    \ window, the old one announced with `Deprecation` and `Sunset`, a documentation\
    \ link and the OpenAPI deprecated flag (P3; P4's URL-path position).\n  4. **Skew**\
    \ (P5, P6): one team owns both sides. Pages and islands opened before a deploy\
    \ keep working because changes stay additive across a window at least as long\
    \ as a page can live with a valid session, the absolute session timeout (SECURE.2),\
    \ and clients tolerate unknown fields (inferred). Because request models are closed\
    \ (EXPOSE.6), a new request field ships server first, then client: clients send\
    \ it only once every server instance accepts it; otherwise a new island would\
    \ get 422 from an old instance mid-deploy (review m4; L557, L278).\n\nRejected:\
    \ - Media-type versioning: invisible in URLs, logs and agent tool calls, and caches\
    \ must vary on `Accept` (inferred); acceptable when joining an ecosystem that\
    \ uses it.\n  - A dated query parameter (Azure): acceptable when joining that\
    \ ecosystem.\n  - A dated header with account pinning (Stripe, GitHub): acceptable\
    \ when many external integrators must keep working indefinitely and the team can\
    \ maintain transformations between versions (L276; condition inferred).\n  - Routing\
    \ each client to its matching deployment: acceptable where the hosting offers\
    \ it (P5; snippets only).\n  - Unversioned JSON paths until the first break: rejected,\
    \ because they would leave unversioned paths beside `/v2` (review m5); \"no version\"\
    \ stays acceptable for HTML routes.\n\nRealizes: no skeleton link; follows ALLOCATION.RECORD.3\
    \ and PIG-WEB-ALLOCATION.TYPE_CHAIN under MD-02 (proposed link to TYPE_CHAIN)."
