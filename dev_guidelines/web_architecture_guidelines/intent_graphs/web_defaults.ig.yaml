- uid: PIG-WEB-LOGIC.PROCESS.6
  name: File Serving
  intent: A file is served by mapping its id to its row, checking authorization and
    the available state, then redirecting to a short-lived signed URL for that one
    object on the storage host, with the stored content type, `nosniff` and `attachment`
    unless the type is meant to render inline; storage paths are never exposed and
    no bucket is public.
  epistemic_state: 'known: MD-05 | unvalidated: the redirect pattern is a synthesis
    (L434)'
  constraints:
  - The backend maps a file id to its row, checks authorization (product policy and
    the per-user read rule) and the available state, then redirects to a short-lived
    signed URL for that one object.
  - The signed URL is single-purpose (a GET of one object), scope-limited (that object,
    no listing), lifetime minutes (value recorded per project); it is the one allowed
    exception to no credential in a URL.
  - 'Serve from the storage host, an origin other than the application''s, with the
    stored `Content-Type`, `X-Content-Type-Options: nosniff`, and `Content-Disposition:
    attachment` with a sanitized filename unless the type is meant to render inline.'
  - The redirect response is `private, no-store`.
  - 'Per-user read rule (MD-05): the check is the file row''s read through a read
    function with the actor set, and the file table is not read directly for it.'
  - 'Forbidden: a public bucket for private files; exposing storage paths.'
  design_notes: "Positions: - P1 store uploads outside the web root or on another\
    \ host; serve publicly reachable ones through a handler that maps an identifier\
    \ to the stored object, never a file path (L432).\n  - P2 serve with the correct\
    \ stored `Content-Type`, `X-Content-Type-Options: nosniff`, and `Content-Disposition:\
    \ attachment` with a sanitized filename for anything not meant to render inline\
    \ (L433).\n  - P3 serve private files through the application's authorization\
    \ check, redirecting to a short-lived signed download URL instead of proxying\
    \ bytes or exposing a public bucket (L434; the redirect is a synthesis).\n\nForces:\
    \ security (access, content sniffing, script in user content); availability (bytes\
    \ off the application).\n\nDecision: the backend maps a file id to its row (P1),\
    \ checks authorization (SECURE.1: product policy and the per-user read rule, the\
    \ latter `decided by MD-05, read visibility of rows with per-user rules when several\
    \ backends share the database`) and the available state (PROCESS.5), then redirects\
    \ to a short-lived signed URL for that one object (P3), served from the storage\
    \ host, an origin other than the application's (P1, EXPOSE.5), with the stored\
    \ content type, `nosniff`, and `attachment` with a sanitized filename unless the\
    \ type is one meant to render inline (P2). The redirect response is `private,\
    \ no-store` (EXPOSE.4; inferred).\n  - **The signed URL is the one allowed exception\
    \ to \"no credential in a URL\"** (X6): single-purpose (a GET of one object),\
    \ scope-limited (that object, no listing), lifetime minutes, the value recorded\
    \ per project (no source gives a number).\n  - **Under J1's read-function answer**\
    \ (review M1): the per-user check is the file row's read through a read function,\
    \ run with the actor set (ENFORCE.2), instead of the backend's statement; the\
    \ file table loses direct SELECT.\n\nRejected: a public bucket for private files:\
    \ never (P3). Exposing storage paths: never (P1). Proxying the bytes through the\
    \ application: acceptable when the storage cannot sign URLs or the bytes must\
    \ be transformed on the way (inferred).\n\nRealizes: no skeleton link; follows\
    \ ALLOCATION.GUARD.3."
