- uid: PIG-WEB-LOGIC.SECURE
  name: Backend Security
  intent: 'The Python backend is the one gate every caller passes and decides nothing
    on the caller''s word: access is checked by one central policy module, humans
    hold an opaque server-side session in Postgres after a delegated OpenID Connect
    login with MFA offered and required by privilege and risk level, every CSRF layer
    is applied, no credential travels in a URL, consumption is bounded at the proxy
    and per identity, and fetches of client-named URLs cannot reach internal addresses.'
  epistemic_state: 'known (roll-up): MD-05'
  constraints:
  - Access checks are central, deny by default and object level; the backend's checks
    are kept in full because row-level security is off (MD-01).
  - Humans hold an opaque, revocable, server-side session in Postgres; the `SameSite`
    value of its cookie is Lax plus a cross-site navigation check, Strict for operator
    consoles (MD-07).
  - No session token, bearer token or long-lived credential ever travels in a URL;
    the signed upload policy and the signed download URL are the stated exceptions.
  - Agents hold short-lived, audience-bound, revocable tokens.
  - 'Limits apply at two depths: identity-blind at the proxy, identity-aware per identity
    and operation in the backend.'
  - Server-side fetches of client- or agent-named URLs cannot reach private, loopback
    or link-local addresses.
  design_notes: "Positions: owns no row; roll-up of SECURE.1 to .7.\n\nForces: security\
    \ (all children); availability and cost control (SECURE.6); the session's function,\
    \ carrying a login across arrivals into the application (SECURE.2: served by that\
    \ node, because it is what a session is for); login friction (SECURE.4, SECURE.5:\
    \ not a force this branch serves, which is why MFA is required by privilege and\
    \ risk level (MD-09)). The two are kept apart (review M5): friction makes a step\
    \ slower, while dropping the session on arrival defeats the node's function.\n\
    \nDecision: the Python backend is the one gate every caller passes and decides\
    \ nothing on the caller's word (J3 LOGIC.SECURE):\n  - access checked by one central\
    \ policy module, deny by default, object level, the backend's checks kept in full\
    \ because row-level security is off (SECURE.1, MD-01);\n  - humans hold an opaque\
    \ server-side session in Postgres (SECURE.2; its `SameSite` value decided by MD-07),\
    \ protected against forgery by every CSRF layer (SECURE.3), after an OpenID Connect\
    \ login delegated to an identity provider (SECURE.4) that meets SECURE.5's bar,\
    \ the authentication context checked on every login;\n  - no session token, bearer\
    \ token or long-lived credential ever travels in a URL (X6);\n  - agents hold\
    \ short-lived, audience-bound, revocable tokens (SECURE.4);\n  - consumption is\
    \ bounded at the proxy and per identity and operation in the backend (SECURE.6);\n\
    \  - fetches of client-named URLs cannot reach internal addresses (SECURE.7).\n\
    \nRealizes: refines LOGIC.SECURE (J3); through its children ALLOCATION.GUARD.4\
    \ and PIG-WEB-ALLOCATION.ROW_SECURITY."
