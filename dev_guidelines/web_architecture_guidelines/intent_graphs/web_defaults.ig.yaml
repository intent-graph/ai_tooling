- uid: PIG-WEB-DATA.MAINTAIN.1
  name: Migrations
  intent: Schema changes are versioned, reviewed migrations run by automation, each
    small and re-runnable, with online-safe forms for every DDL and schema and data
    changes kept apart. Incompatible changes go expand, migrate, contract across every
    consumer, and a CI drift gate compares a freshly migrated catalogue with production's,
    so the live database never diverges from version control.
  epistemic_state: 'known | unvalidated: drift gate mechanism inferred, no source
    read'
  constraints:
  - 'Path: versioned migrations in version control, reviewed, run by automation as
    a release step in every environment, with a database per developer and the same
    CI pipeline as code.'
  - 'Form: each change small; DDL re-runnable (conditional create and drop, create
    or replace), which also makes a partly applied non-transactional step (a concurrent
    index build) safe to resume; one owner role per table, set in its creation script
    (GUARD.2).'
  - 'Online safety: short lock_timeout with retry on every DDL; a column default added
    only when non-volatile, otherwise the multi-step route; constraints NOT VALID
    then VALIDATE, SET NOT NULL proven by a validated CHECK; indexes built concurrently
    outside a transaction, a failed build dropped and retried; type changes as add,
    backfill, switch, drop.'
  - 'Schema and data apart: a backfill is a separate, batched data step outside the
    schema migration''s transaction; beyond the threshold of MAINTAIN.4 it is a human-run
    job.'
  - 'Incompatible changes: expand, migrate, contract: data moves by dual write, verified
    read switch, write switch, removal; drops and renames only in the contract phase
    once no deployed consumer references the old object. Under MD-03 "deployed" covers
    every consumer: backends, BI queries, consoles and scripts.'
  - 'Drift gate (inferred, no source read): CI applies every migration to an empty
    database and compares its catalogue with production''s (schema objects, grants,
    function signatures); a difference fails the release and is reconciled by a migration,
    never by editing the live database. The function-signature part is DB_API''s catalogue
    diff (INTERFACE.1).'
  design_notes: "Question: how schema changes are written and run against live tables.\n\
    Positions: L189 a database per developer; migrations in the same CI pipeline as\
    \ code; L190 each change as small as possible; L191 data moves: dual write, switch\
    \ reads (verified by comparing), switch writes, remove old; L192 drops and renames\
    \ in the contract phase, after no deployed version references the old name; L193\
    \ short lock_timeout and retry (ALTER TABLE takes ACCESS EXCLUSIVE and the queue\
    \ blocks behind it); L194 metadata-only defaults versus rewrites; L195 constraints\
    \ NOT VALID then VALIDATE; SET NOT NULL skips the scan with a validated CHECK;\
    \ L196 CREATE INDEX CONCURRENTLY outside a transaction; a failed build leaves\
    \ an invalid index to drop; L197 type changes as add, backfill, switch, drop;\
    \ L198 backfills batched outside the schema migration, schema and data never in\
    \ one transaction; L519 versioned migrations, re-runnable DDL, one owner role\
    \ per table in its creation script, long data work outside automated runs (MAINT).\
    \ Inherited from J2: one path of change, live database as truth for structure,\
    \ a drift check (inferred, mechanism handed here), expand, migrate, contract for\
    \ tables and the function API.\nForces: integrity of running code and data across\
    \ releases, against the number of steps per change.\nDecision and grounds: all\
    \ adopted (consensus and MAINT agree; max), plus the drift gate.\n  - Path: versioned\
    \ migrations in version control, reviewed, run by automation as a release step\
    \ in every environment, with a database per developer and the same CI pipeline\
    \ as code (L189, L519, J2).\n  - Form: each change small (L190); DDL re-runnable\
    \ (conditional create and drop, create or replace), which also makes a partly\
    \ applied non-transactional step (a concurrent index build) safe to resume (L519,\
    \ L196); one owner role per table, set in its creation script (L519, GUARD.2).\n\
    \  - Online safety: short lock_timeout with retry on every DDL (L193); a column\
    \ default added only when non-volatile, otherwise the multi-step route (L194);\
    \ constraints NOT VALID then VALIDATE, SET NOT NULL proven by a validated CHECK\
    \ (L195); indexes built concurrently outside a transaction, a failed build dropped\
    \ and retried (L196); type changes as add, backfill, switch, drop (L197).\n  -\
    \ Schema and data apart: a backfill is a separate, batched data step outside the\
    \ schema migration's transaction (L198); beyond the threshold of MAINTAIN.4 it\
    \ is a human-run job (L519, L540, L545).\n  - Incompatible changes: expand, migrate,\
    \ contract (J2): data moves by dual write, verified read switch, write switch,\
    \ removal (L191); drops and renames only in the contract phase once no deployed\
    \ consumer references the old object (L192). Under MD-03 \"deployed\" covers every\
    \ consumer: backends, BI queries, consoles and scripts.\n  - Drift gate (J2 hand-off,\
    \ inferred, no source read): CI applies every migration to an empty database and\
    \ compares its catalogue with production's (schema objects, grants, function signatures);\
    \ a difference fails the release and is reconciled by a migration, never by editing\
    \ the live database. The function-signature part is DB_API's catalogue diff (INTERFACE.1).\n\
    Rejected: hand-applied production changes: never (J2). Schema and data in one\
    \ transaction: never (L198). A blocking ALTER without lock_timeout: never (L193).\
    \ Big-bang renames: rejected (L192).\nRealizes: ALLOCATION.RECORD.3 (structure\
    \ as the origin of stored facts; via J2 DATA.MAINTAIN); PIG-WEB-ALLOCATION.DB_API\
    \ (function changes ship as migrations)."
