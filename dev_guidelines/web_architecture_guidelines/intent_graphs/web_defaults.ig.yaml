- uid: PIG-WEB-LOGIC.SECURE.5
  name: Passwords and Login Throttling
  intent: Passwords, where the backend holds them, follow a length-and-blocklist policy
    with Argon2id hashing, MFA offered on every account (phishing-resistant authenticators
    preferred) and required by privilege and risk level, and login failures are throttled
    per account with growing delays and never a hard lockout. The node is also the
    bar the chosen OpenID Connect server must meet, including emitting the authentication-context
    claims the backend checks.
  epistemic_state: 'known | unvalidated: the provider bar (authentication-context
    claims included) and the Django validator mapping are inferred'
  constraints:
  - Maximum length at least 64, all printable Unicode, no composition rules, no periodic
    rotation, compromised and common-password lists checked; minimum 8 where MFA is
    enforced, 15 for any account a password alone authenticates; the numeric-only
    validator removed.
  - Hash with Argon2id first in the hasher list (at least 19 MiB, 2 iterations, parallelism
    1); upgrade older hashes at login.
  - MFA offered on every human account, passkeys and WebAuthn preferred; required
    on privileged accounts (operator, owner, administrator) and at step-up before
    sensitive operations; required on every account when the project's chosen risk
    level says so.
  - Generic authentication errors; failures counted per account and per source; growing
    delays, never a hard lockout; a recovery path; one-time-code endpoints count failures
    only.
  - The login limit is enforced in the proxy and in the login logic, never by framework
    throttling alone.
  - The chosen OpenID Connect server emits `acr` or `amr` and `auth_time` so the backend
    can verify MFA for privileged accounts and step-up rather than assume it.
  design_notes: "Positions: - P1 password policy: at least 64 characters allowed,\
    \ all printable Unicode, no composition rules, no periodic rotation, checks against\
    \ compromised and common-password lists; minimum length 8 with MFA, 15 without;\
    \ Django's default validators still include a numeric-only check (L344).\n  -\
    \ P2 hash with Argon2id (at least 19 MiB, 2 iterations, parallelism 1), with scrypt,\
    \ bcrypt or PBKDF2 as fallbacks, and upgrade hashes at login; Django's default\
    \ is PBKDF2, Argon2 opt-in; PBKDF2 stays acceptable under FIPS-140 (L345).\n \
    \ - P3 offer MFA and phishing-resistant authenticators (WebAuthn, passkeys) (L346).\n\
    \  - P4 generic authentication errors; failures counted per account, not only\
    \ per source address; growing delays rather than hard lockout; a recovery path;\
    \ the login endpoint rate-limited (L347).\n  - P5 framework throttling is not\
    \ a security control (Django does not throttle authentication; DRF says its throttling\
    \ is not brute-force protection); the real limit sits in the proxy, a dedicated\
    \ limiter or the login logic (L348).\n  - P6 one-time-code and verification endpoints\
    \ count failed attempts only (L349; one T3 source).\n  - (superseded by MD-09)\
    \ Cited: MFA required by default on human accounts (J3 LOGIC.SECURE, max applied\
    \ to L033; superseded by MD-09).\n\nForces: security; login usability, which this\
    \ node does not serve as a force (J3's reasoning on MFA).\n\nDecision: this node\
    \ governs an own credential store (SECURE.4's acceptable fallback) and is the\
    \ bar the chosen OpenID Connect server must meet (selection criterion; inferred).\
    \ That bar includes emitting the authentication-context claims (`acr` or `amr`,\
    \ and `auth_time`) that SECURE.4 checks, so the backend can verify MFA rather\
    \ than assume it (review M6; OpenID Connect Core, not in the ledger).\n  1. **Policy**\
    \ (P1): maximum length at least 64, all printable Unicode, no composition rules,\
    \ no rotation, compromised and common lists checked; minimum 8 where MFA is enforced\
    \ (the default, J3), 15 for any account a password alone authenticates. Django's\
    \ validators are configured to length and list checks only; the numeric-only check,\
    \ a composition rule, is removed (mapping of P1 to Django inferred).\n  2. **Hashing**:\
    \ Argon2id first in the hasher list with the OWASP parameters; older hashes upgraded\
    \ at login (P2).\n  3. (superseded by MD-09) **Second factor**: MFA required;\
    \ passkeys and WebAuthn offered (P3; J3).\n  4. **Throttling**: generic error\
    \ messages; failures counted per account and per source; growing delays, never\
    \ a hard lockout; a recovery path (P4); the limit enforced in the proxy and in\
    \ the login logic, never by framework throttling alone (P5); one-time-code endpoints\
    \ count failures only (P6).\n\nRejected: hard lockout: never, it lets an attacker\
    \ lock users out (P4). Composition rules and periodic rotation: never (P1). PBKDF2\
    \ as the default hasher: acceptable where FIPS-140 applies (P2). Framework throttling\
    \ as the control: never (P5). MFA optional: acceptable when the audience cannot\
    \ practically be required to use a second factor (J3's condition), then minimum\
    \ length 15 (P1).\n\nRealizes: no skeleton link; follows J3 LOGIC.SECURE (layered\
    \ login defence, L033).\n\nCorrected by MD-09 (re-audit under MD-08): MFA is offered\
    \ on every account and required by privilege and risk level (philosophy LOGIC.SECURE).\
    \ Rejected: MFA required on every account: acceptable when the project's chosen\
    \ risk level requires it."
