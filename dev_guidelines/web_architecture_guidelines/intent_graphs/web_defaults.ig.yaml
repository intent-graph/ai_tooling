- uid: PIG-WEB-LOGIC.SECURE.2
  name: Sessions
  intent: Humans hold an opaque, random session identifier whose data lives server-side
    in Postgres through Django's database session backend, carried in a `__Host-`
    cookie with `Secure`, `HttpOnly`, no `Domain` and `Path=/`; the identifier is
    renewed on every privilege change, both timeouts are enforced by the server, and
    deleting a user's session rows revokes every session at once. The `SameSite` value
    trades the session's function against protection and is Lax plus a cross-site
    navigation check, Strict for operator consoles (MD-07).
  epistemic_state: 'known: MD-07 | unvalidated: session table under DB_API''s direct-write
    exception (inferred); the navigation check (inferred, no ledger row)'
  constraints:
  - Use the framework's session management with the database backend, sessions in
    Postgres; no custom mechanism; expired sessions purged by a scheduled job.
  - Identifier framework-generated, random, opaque, carrying no personal data; it
    travels only in the cookie, never in a URL.
  - 'Cookie: `__Host-` prefixed name, `Secure`, `HttpOnly`, an explicit `SameSite`,
    no `Domain`, `Path=/`; never `SameSite=None`, never scoped to a parent domain.'
  - '`SameSite` value (MD-07): `Lax` plus a Fetch Metadata check that refuses or redirects
    cross-site navigations (`Sec-Fetch-Site: cross-site`, `Sec-Fetch-Mode: navigate`)
    to authenticated pages that are not declared entry points; `Strict` for operator
    consoles and other applications never entered from other sites'' links.'
  - Renew the identifier at login, logout, privilege change and step-up.
  - Idle and absolute timeouts both enforced on the server, values recorded per project
    by risk class with the NIST assurance levels as reference.
  - 'Logout deletes the server record; responses that set or contain a session identifier
    are `Cache-Control: no-store`.'
  - 'Forbidden: signed-cookie or stateless JWT sessions in the browser; sessions in
    process memory; a session identifier in a URL.'
  design_notes: "Positions: - P1 use the framework's session management, not a custom\
    \ one, kept updated (L323).\n  - P2 random session identifiers (CSPRNG, at least\
    \ 64 bits), meaningless, carrying no personal data; user data server-side (L322).\n\
    \  - P3 cookie with `Secure`, `HttpOnly`, explicit `SameSite=Lax` or `Strict`,\
    \ the `__Host-` prefix, no `Domain`, the narrowest `Path` (L324); never scoped\
    \ to a parent domain, because sibling subdomains could plant cookies (L329).\n\
    \  - P4 renew the identifier on every privilege change, above all at login (L325).\n\
    \  - P5 idle and absolute timeouts enforced on the server, calibrated to risk;\
    \ numbers differ by body (L326).\n  - P6 logout invalidates the session on the\
    \ server; responses carrying session identifiers are `no-store` (L327).\n  - P7\
    \ the signed-cookie session backend is not for sensitive data: not encrypted,\
    \ replayable until expiry, not revocable (L328).\n  - P8 the framework's JWT bearer\
    \ tutorial leaves token storage, revocation and sessions undecided (L317).\n \
    \ - Placement cited: an opaque server-side session, revocable, in a backing service,\
    \ never in process memory (GUARD.4; L315, L022, L319, L086); sessions in Postgres\
    \ (POSTGRES_FIRST).\n\nForces: security (theft, fixation, revocation, attacker-triggered\
    \ navigations); the session's function, carrying a login across every arrival\
    \ into the application. This node serves both: the second is what a session is\
    \ for, not login friction, which no LOGIC node serves (SECURE roll-up; review\
    \ M5). They pull apart only on the `SameSite` value.\n\nDecision (all but the\
    \ `SameSite` value; that value is formerly undecided and raised):\n  - **Store**:\
    \ Django's session framework with the database backend, sessions in Postgres (P1,\
    \ GUARD.4, POSTGRES_FIRST). The session table is written only by its own backend\
    \ and carries no state column and no multi-table effect, so it falls under DB_API's\
    \ direct-write exception (inferred). Expired sessions are purged by a scheduled\
    \ job (PROCESS.1; inferred).\n  - **Identifier**: framework-generated, random,\
    \ opaque; user data stays server-side (P2). It travels only in the cookie, never\
    \ in a URL (X6).\n  - **Cookie**: a `__Host-`-prefixed name, `Secure`, `HttpOnly`,\
    \ an explicit `SameSite`, no `Domain`, `Path=/` (P3).\n  - **`SameSite` value**\
    \ (formerly undecided, decided by MD-07 in `questions.md`; review M5). L324 admits\
    \ Lax and Strict; the choice trades the session's function against protection,\
    \ both forces of this node.\n    - Strict: the cookie is not sent on any cross-site\
    \ request, top-level navigations included, so an arrival from another site's link\
    \ starts logged out; it closes attacker-opened windows and navigations carrying\
    \ the session, through which reflected script injection or cross-site leaks run\
    \ with the user's session (inferred; the cookie draft, draft-ietf-httpbis-rfc6265bis,\
    \ calls Lax \"only a speedbump\" against them).\n    - Lax: the login holds on\
    \ arrival from links, and cross-site top-level GET navigations carry the session\
    \ (L331).\n    - The earlier claim that Strict's extra protection \"covers only\
    \ safe requests, which change nothing\" is withdrawn: a safe request that changes\
    \ nothing can still render user data or reflect input under the session.\n   \
    \ - **former recorded default (superseded) if unanswered**: `SameSite=Lax`, plus\
    \ a Fetch Metadata check that refuses or redirects cross-site navigations (`Sec-Fetch-Site:\
    \ cross-site`, `Sec-Fetch-Mode: navigate`) to authenticated pages that are not\
    \ declared entry points (inferred; no ledger row); `SameSite=Strict` for operator\
    \ consoles and other applications never entered from other sites' links.\n  -\
    \ **Lifecycle**: identifier renewed at login, logout, privilege change and step-up\
    \ (P4); idle and absolute timeouts both enforced by the server, their values recorded\
    \ per project by risk class with the NIST assurance levels as reference (P5);\
    \ logout deletes the server record, and responses that set or contain a session\
    \ identifier are `Cache-Control: no-store` (P6, L327; personalised responses that\
    \ merely run under the session are `private, no-cache`, EXPOSE.4; review m10).\
    \ Because state is server-held, deleting a user's session rows revokes every session\
    \ at once (L022; inferred use).\n\nRejected: - Signed-cookie sessions and stateless\
    \ JWT sessions in the browser: never (P7, P8, L022, GUARD.4); acceptable when\
    \ no backend can hold sessions (GUARD.4's moving condition).\n  - A custom session\
    \ mechanism: never (P1).\n  - `SameSite=Strict` or `Lax` as the general default:\
    \ not decided here (raised; see the `SameSite` value above). Strict is required\
    \ under the former recorded default (superseded) for applications never entered\
    \ from cross-site links, such as an internal operator console (inferred).\n  -\
    \ `SameSite=None` or a parent-domain scope: never (P3).\n  - A session identifier\
    \ in a URL (query string, path): never (X6).\n  - Sessions in process memory:\
    \ never (L086). A cache service as the session store: acceptable at a measured\
    \ limit of Postgres (POSTGRES_FIRST).\n\nRealizes: ALLOCATION.GUARD.4 (holds sessions\
    \ as the identity placement sets).\n\nMaintainer answer MD-07: the judged recommendation\
    \ is adopted as decided: Lax plus a server-side check rejecting cross-site navigations\
    \ on sensitive pages, Strict for operator consoles."
