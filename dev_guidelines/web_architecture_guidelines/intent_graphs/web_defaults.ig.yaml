- uid: PIG-WEB-LOGIC.ENFORCE.3
  name: Data Access
  intent: 'Writes go only through the generated, typed wrappers of the API functions,
    and reads use one layer under the Django default: the ORM as read-only mappers
    for simple reads on base tables, read functions through the wrappers where a read
    applies a rule. Each use case gathers its data in one statement, and filtering,
    sorting and paging happen in Postgres.'
  epistemic_state: 'known: MD-05 | tension: L235''s ORM-first and L237''s views and
    separate stores narrowed by DB_API, L516 and DERIVE.1'
  constraints:
  - Writes only through the generated, typed wrappers; the ORM writes only tables
    under the direct-write exception.
  - 'Reads: the Django ORM as read-only mappers for simple reads on base tables under
    SELECT grants; read functions through the wrappers where a read must apply a rule,
    in a short read-only transaction when they need the actor.'
  - Each use case gathers its data in one statement or read function, related rows
    joined or eagerly loaded, never queries in loops.
  - Filtering, sorting and paging in the statement; keyset pages for structured-data
    collections and large or growing sets; a server maximum page size.
  - Raw SQL always with bound parameters, never string formatting; identifiers that
    must vary come from an allowlist.
  - 'Per-user read rules (MD-05): sensitive reads go through the read function with
    the actor set, as PIG-WEB-LOGIC.SECURE.1 sets, never by filtering loaded rows
    in Python; the table is not read directly for them.'
  - Derived data from database cache tables or derived columns; no view as a contract;
    no read store outside the database.
  - 'Forbidden: views as a read contract; ORM-first writes; loading full sets into
    Python to reduce them; a second query layer beside the Django ORM.'
  design_notes: "Positions: - P1 an ORM for routine mapping, understanding the relational\
    \ model, with a sanctioned route to hand-written SQL; explore the ORM first (L235).\n\
    \  - P2 raw SQL always uses bound parameters, never string formatting (L236).\n\
    \  - P3 reads that need no domain behaviour may bypass the domain model: hand-written\
    \ SQL, views, denormalized tables, separate read stores (L237).\n  - P4 each extra\
    \ round trip adds latency: fetch related data in one statement, no queries in\
    \ loops (L614).\n  - Cited: writes through the API functions, simple reads on\
    \ base tables under SELECT grants, read functions where a read applies a rule,\
    \ views never a contract (DB_API, L516); reduction in the database, keyset pages,\
    \ a server maximum page size (DERIVE.2); wrappers generated from the catalogue\
    \ (TYPE_CHAIN).\n\nForces: correctness; security (injection); latency; changeability.\n\
    \nDecision: 1. **Writes**: only through the generated, typed wrappers of the API\
    \ functions (DB_API, TYPE_CHAIN); the ORM writes only tables under DB_API's direct-write\
    \ exception.\n  2. **Reads**, one read layer under the Django default (review\
    \ m7): the Django ORM, its models used as read-only mappers, for simple reads\
    \ on base tables under SELECT grants (L516); read functions, called through the\
    \ generated wrappers, where a read must apply a rule (DB_API), in a short read-only\
    \ transaction when they need the actor (ENFORCE.2). Each use case gathers its\
    \ data in one statement or read function, related rows joined or eagerly loaded\
    \ in that statement, never queries in loops (P4; J3's \"data in, decision out\"\
    ). Filtering, sorting and paging in the statement, keyset pages, the server's\
    \ maximum page size (DERIVE.2, EXPOSE.1).\n  3. **Raw SQL**, where the ORM cannot\
    \ express a read, through Django's database connection, always with bound parameters\
    \ (P2); identifiers that must vary come from an allowlist (inferred).\n  4. **Per-user\
    \ read rules** (`decided by MD-05, read visibility of rows with per-user rules\
    \ when several backends share the database`, SECURE.1): at the former recorded\
    \ default (superseded), applied inside the read statement from the shared specification,\
    \ never by filtering loaded rows in Python (DERIVE.2); for collections, the policy\
    \ module's query predicate goes into the statement (SECURE.1, review m8). **Under\
    \ J1's read-function answer** (review M1): the read goes through the read function,\
    \ run with the actor set (ENFORCE.2), and the table loses direct SELECT, so step\
    \ 2's \"simple reads on base tables\" no longer covers it. Before the maintainer\
    \ answered, the reporting role gets no SELECT on comment content or narrower-audience\
    \ comments, the operator role sees every row, and any other role that may SELECT\
    \ the base tables sees every row unless its own role is restricted (X1).\n  5.\
    \ **Read models**: derived data from database cache tables or derived columns\
    \ (DERIVE.1); no view as a contract (L516); no read store outside the database\
    \ (RECORD.1).\n\nRejected: - Views as a read contract (P3's views): never (L516,\
    \ DB_API); acceptable only as throwaway objects no consumer depends on.\n  - Read\
    \ stores outside Postgres (P3's separate stores): acceptable under DERIVE.1's\
    \ condition (many external derived stores at a high write rate).\n  - ORM-first\
    \ writes (P1 as stated): acceptable when one backend is the only consumer (L527's\
    \ default then applies).\n  - Loading full sets into Python to reduce them: never\
    \ (DERIVE.2).\n  - A second query layer (SQLAlchemy Core) beside the Django ORM:\
    \ rejected under the Django default (review m7); acceptable as the read layer\
    \ of a backend whose framework is not Django (inferred).\n\nRealizes: ALLOCATION.DERIVE.2\
    \ (pushes filtering and aggregation to the database)."
