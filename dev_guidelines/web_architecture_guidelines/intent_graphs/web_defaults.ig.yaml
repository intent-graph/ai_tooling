- uid: PIG-WEB-DATA.DERIVE
  name: Derived Data in Postgres
  intent: 'Postgres stores the minimum and derives the rest: a stored derived value
    is a copy chosen in the order generated column, same-transaction trigger, then
    cache table with stated staleness. Every copy has a sync plan in its table comment
    and a drift guard, and caches are classified, invalidated through a queue written
    in the source transaction, and never soft-deleted.'
  epistemic_state: known
  constraints:
  - 'Denormalization and Sync: store the minimum and derive the rest; a stored derived
    value is a copy chosen in the order generated column, same-transaction trigger
    (the writer function only when the source table admits no other writer), cache
    table with a stated staleness; every copy has a sync plan in its table comment
    and a drift guard, except generated columns, which cannot diverge.'
  - 'Cache Tables: caches are tables classified by recomputability, invalidated through
    a queue written in the source transaction, never served from process memory or
    soft-deleted.'
  design_notes: 'Question: how Postgres holds derived values and caches and keeps
    them in sync with their sources.

    Positions: none of its own; roll-up of DERIVE.1 and .2 (.3 deferred).

    Decision and grounds: roll-up. Store the minimum and derive the rest (J2, L488).
    A stored derived value is a copy chosen in DERIVE.1''s order (J1): generated column;
    same-transaction trigger (the writer function only when the source table admits
    no other writer); cache table with a stated staleness. Every copy has the sync
    plan of L469 in its table comment and the drift guard of L533, except generated
    columns, which cannot diverge (DERIVE.1). Caches are tables classified by recomputability,
    invalidated through a queue written in the source transaction, never served from
    process memory or soft-deleted (DERIVE.2).

    Realizes: refines web-app-philosophy:DATA.DERIVE; ALLOCATION.DERIVE.1, DERIVE.3,
    PIG-WEB-ALLOCATION.CACHE_STORE through its children.'
