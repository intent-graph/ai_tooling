- uid: PIG-WEB-LOGIC.PROCESS.3
  name: Resilience
  intent: Every outbound call has a timeout and is retried at exactly one layer with
    bounded, backed-off, jittered retries and only when idempotent or keyed; a circuit
    breaker guards each external dependency called from the request path.
  epistemic_state: known
  constraints:
  - Every outbound call has a timeout shorter than its caller's remaining deadline.
  - Retries only for idempotent operations or calls carrying an idempotency key; exponential
    backoff with jitter.
  - 'One retrying layer: in the request path the outbound client retries within the
    request''s deadline, at most three attempts and a 10% retry budget per client;
    for deferred work the job runner is the one retrying layer, with a failed state
    that monitoring shows; HTTP client libraries do not retry beneath either layer.'
  - A circuit breaker per external dependency called from the request path; business
    errors are handled as business errors.
  - Foreign mutations carry keys and recovery points; database retries follow ENFORCE.2.
  - 'Forbidden: unbounded or immediate retries; retries at several layers; retrying
    a non-idempotent call without a key.'
  design_notes: "Positions: - P1 expect transient faults on calls to external services:\
    \ bounded retries with increasing, spread delay, only for idempotent operations;\
    \ fail fast with few retries in interactive requests, retry more in batch work\
    \ (L243).\n  - P2 retry at one layer only; cap per-request and per-client retries\
    \ (three attempts, a 10% retry ratio) (L244).\n  - P3 for persistent faults, fail\
    \ fast with a circuit breaker and timeouts short enough to protect threads and\
    \ connections; a breaker never replaces business exception handling (L245).\n\
    \  - P4 for calls that mutate foreign state, client-supplied idempotency keys\
    \ and recorded recovery points (L246; one T3 source).\n\nForces: availability;\
    \ correctness (no duplicated foreign effect); latency.\n\nDecision: 1. Every outbound\
    \ call has a timeout shorter than its caller's remaining deadline (P3; \"shorter\
    \ than the deadline\" inferred).\n  2. Retries only for idempotent operations\
    \ or calls that carry an idempotency key (P1, P4, GUARD.6); exponential backoff\
    \ with jitter.\n  3. **One retrying layer** (P2). In the request path, the outbound\
    \ client retries within the request's deadline: at most three attempts and a 10%\
    \ retry budget per client. Foreign mutations are not in the request path by default\
    \ (PROCESS.2 step 3, review M4); request-path retries cover idempotent calls and\
    \ the in-request phases PROCESS.2 admits under its condition. For deferred work,\
    \ the job runner is the one retrying layer, with more attempts and growing delays,\
    \ then a failed state that monitoring shows (PROCESS.1, L605). HTTP client libraries\
    \ do not retry on their own beneath either layer.\n  4. A circuit breaker per\
    \ external dependency called from the request path; business errors are handled\
    \ as business errors (P3).\n  5. Foreign mutations carry keys and recovery points\
    \ (P4, realized by PROCESS.2's atomic phases). Database retries (serialization\
    \ failure, unknown commit) follow ENFORCE.2.\n\nRejected: unbounded or immediate\
    \ retries: never (P1). Retries at several layers: never (P2). Retrying a non-idempotent\
    \ call without a key: never (P1).\n\nRealizes: no skeleton link; follows ALLOCATION.ACT.2\
    \ and GUARD.6."
