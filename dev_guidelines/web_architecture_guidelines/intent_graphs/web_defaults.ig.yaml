- uid: PIG-WEB-LOGIC
  name: Python Application Tier
  intent: 'The Python backend is the gate every caller passes and the workflow tier
    above the Postgres function API: a Django application with synchronous handlers,
    one deployable per backend, deciding nothing on the caller''s word. It calls the
    database through one typed function call per business operation, delivers side
    effects at least once, and exposes HTML to browsers and a described JSON interface
    to programs and agents.'
  epistemic_state: 'known (roll-up): MD-05 | unvalidated: framework choice (ENFORCE.5)'
  constraints:
  - Django with synchronous handlers; asynchronous code only in the process type that
    holds long-lived connections.
  - Each backend is one deployable, not split into services without a measured need;
    several backends may share the database (MD-03).
  - Access is decided by one central, deny-by-default, object-level policy module;
    nothing the caller sends decides access.
  - Each business operation is one call to a generated, typed wrapper of an API function,
    in one transaction that also sets the verified actor.
  - Side effects are rows written by database functions in the transaction of the
    change, delivered at least once to idempotent consumers.
  - Every interface description (OpenAPI, function catalogue, agent tool surface)
    is always in sync with the implementation, gated in CI (MD-02).
  - The backend is not the authority for business rules on shared data and never writes
    shared tables directly (MD-03, ACT.1, DB_API).
  design_notes: "Positions: owns no row; roll-up of SECURE, ENFORCE, PROCESS and EXPOSE\
    \ (PROCESS.7 deferred). One framing contest runs through the children: the Python\
    \ backend as the home of all business logic, with ORM models as the domain and\
    \ the request or use case as the transaction (L226's application-first reading,\
    \ L227's Active Record, L229, L235), against the backend as the workflow, policy\
    \ and entry tier that calls the Postgres function API (DB_API, ACT.1, MD-03).\n\
    \nForces: enforcement and security (the role's purpose); changeability of product\
    \ policy; scalability (stateless backends scale out, L086 via J3).\n\nDecision:\
    \ the Python backend realizes J3's LOGIC verdict as follows.\n  - **Framework\
    \ and runtime**: Django, synchronous handlers; asynchronous code only in the process\
    \ type that holds long-lived connections (ENFORCE.5, ENFORCE.4). Several backends\
    \ may share the database (MD-03); each backend is one deployable, not split into\
    \ services without a measured need (X5).\n  - **Secure**: one central, deny-by-default,\
    \ object-level policy module, which also authorizes any override of a blockable\
    \ rule; Django database sessions in Postgres behind a `__Host-` cookie (its `SameSite`\
    \ value decided by MD-07); every CSRF layer; login delegated to an OpenID Connect\
    \ server through a backend-for-frontend, the required authentication context requested\
    \ and checked; no credential in a URL; limits at the proxy and per identity in\
    \ the backend; guarded server-side fetch (SECURE.1 to .7).\n  - **Enforce**: a\
    \ use-case layer every entry point calls; each business operation one call to\
    \ a generated, typed wrapper of an API function, in one transaction that also\
    \ sets the verified actor; reads that need the actor in a short read-only transaction\
    \ through the same wrapper; reads gathered in one statement, filtered, sorted\
    \ and paged in Postgres (ENFORCE.1 to .3).\n  - **Process**: Python workers claim\
    \ jobs and outbox rows that database functions wrote, through the job table's\
    \ writer functions; delivery at least once to idempotent consumers; foreign mutations\
    \ as atomic phases in a worker behind a 202 status resource; bounded retries at\
    \ one layer; file bytes in object storage, file rows and their state in Postgres\
    \ (PROCESS.1 to .6).\n  - **Expose**: HTML for browsers; resource-oriented JSON\
    \ under `/v1` with problem details, idempotency keys and status resources for\
    \ programs and agents; every response labelled for caches; one origin; Pydantic\
    \ models at every entry; every interface description (OpenAPI 3.1, function catalogue,\
    \ agent tools) in sync; additive evolution (EXPOSE.1 to .7).\n\nRejected: the\
    \ Python backend as the authority for all business rules, with Active Record models\
    \ writing the tables: rejected by MD-03, ACT.1 and DB_API; acceptable when one\
    \ backend is the only database consumer and the team's SQL skill is low (ACT.1's\
    \ condition).\n\nRealizes: refines LOGIC (J3); through its children ALLOCATION.GUARD.1,\
    \ GUARD.4, GUARD.6, ACT.1, ACT.2, ACT.3, DERIVE.2 and PIG-WEB-ALLOCATION.ROW_SECURITY,\
    \ JOB_HOST, CACHE_STORE, TYPE_CHAIN."
  impl_pointers:
  - build/distill/03_judge/J7_pig_logic/records.md::PIG-WEB.LOGIC
  history:
  - who: agent:builder
    date: 2026-10-13T09:03
    note: build pig logic from final judge records
  - who: agent:steward
    date: 2026-10-13T09:32
    note: 'critic fixes m1,m2,B1,M1,M2,m8: one open-question token, roll-ups carry
      open children, strip artifacts'
  - who: agent:steward
    date: 2026-10-13T09:46
    note: 'critic fix M4: judge-record pointers use the record headings'' notation
      (PIG-WEB.AREA) so they resolve'
  - who: agent:steward
    date: 2026-10-13T14:13
    note: 'maintainer answers MD-04 to MD-07: deletion, read visibility, hosting and
      SameSite decided, open clauses closed'
  - who: agent:steward
    date: 2026-10-13T14:13
    note: 'maintainer answers MD-04 to MD-07: wording cleanup after closing the open
