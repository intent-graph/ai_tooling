- uid: PIG-WEB-DATA.ORGANIZE
  name: Schema Organization
  intent: The schema in migrations is the origin of every stored fact and of the function
    API's contract, and persistence models are generated from the live catalogue.
    It is laid out as normalized tables, keys that state scope, the most precise column
    types, names that read without a dictionary, bounded JSON validated in the database,
    schemas as domain namespaces, and indexes that each serve a stated query.
  epistemic_state: 'known | gap: collation (ORGANIZE.3)'
  constraints:
  - The schema in migrations is the origin of every stored fact and of the function
    API's contract; persistence models and function wrappers are generated from the
    live catalogue.
  - 'Tables and Normalization: normalized tables, repeating groups removed.'
  - 'Keys: keys that state scope.'
  - 'Column Types: the most precise column type.'
  - 'Naming: names that read without a dictionary.'
  - 'JSON Documents: JSON only where no relational shape exists, validated in the
    database.'
  - 'Schemas and Tenancy: schemas as domain and access namespaces.'
  - 'Indexes: indexes each serving a stated query.'
  design_notes: 'Question: how tables, keys, column types, names, JSON documents,
    namespaces and indexes are laid out in Postgres.

    Positions: none of its own; roll-up of ORGANIZE.1 to .7.

    Decision and grounds: roll-up. The schema in migrations is the origin of every
    stored fact and of the function API''s contract (TYPE_CHAIN, RECORD.3); persistence
    models and function wrappers are generated from the live catalogue, so every organizing
    choice below is also a choice of what the backends'' types say. The schema follows
    J2''s "each fact once": normalized tables, repeating groups removed (ORGANIZE.1);
    keys that state scope (ORGANIZE.2); the most precise column type (ORGANIZE.3);
    names that read without a dictionary (ORGANIZE.4); JSON only where no relational
    shape exists, validated in the database (ORGANIZE.5); schemas as domain and access
    namespaces (ORGANIZE.6); indexes each serving a stated query (ORGANIZE.7).

    Rejected: none at this level.

    Realizes: PIG-WEB-ALLOCATION.TYPE_CHAIN (supplies the schema the type chain starts
    from: stored facts originate here). Refines web-app-philosophy:DATA.ORGANIZE.'
