- uid: PIG-WEB-DATA.DERIVE.1
  name: Denormalization and Sync
  intent: A denormalized copy exists only when computing on read is measured too costly,
    with a sync plan recorded before it is built and a drift guard that recomputes
    and alerts on divergence. A copy that decides writes is kept by a same-transaction
    trigger, because only what is bound to the table holds for every writer, and the
    database guards the redundancy, not one application.
  epistemic_state: 'known | unvalidated: the order of options is inherited from J1,
    where it is marked inferred; the trigger-first top rung follows this tier''s binding
    rule (inferred)'
  constraints:
  - Of the three legitimate reasons to denormalize, the indivisible object and the
    normalized core with a flexible periphery are organizing choices governed by ORGANIZE.5
    (no fact is stored twice); only the derived summary is a copy governed here.
  - A copy exists only when computing on read is measured too costly, with its sync
    plan recorded in the table comment before it is built.
  - 'Mechanism, in the philosophy''s order: a stored generated column for same-row
    values; when any reader decides a write from the copy or shows it as authoritative,
    a same-transaction trigger, and the writer function only when the source table
    admits no other writer (no direct-write grant, no owner-run job); a cache table
    with a stated staleness otherwise (DERIVE.2). The choice by change frequency and
    divergence harm applies within that order.'
  - 'Every copy other than a generated column gets a drift guard. "Documentation only"
    therefore never stands alone: with the guard it is the periodic-detection rung.'
  - 'The redundancy is guarded by the database (trigger, function, constraint), not
    by "the application": under MD-03 several applications write (web-app-philosophy:ALLOCATION.DERIVE.1).'
  design_notes: "Question: when data is denormalized and which sync mechanism and\
    \ drift check each copy gets.\nPositions: L168 denormalize deliberately, where\
    \ measured performance requires it, the application guarding the redundancy (consensus);\
    \ L176 same-row derivable values as generated columns, stored if read often or\
    \ replicated logically; L531 three legitimate reasons: an indivisible object (bounded,\
    \ schema-validated JSON), a derived summary of disaggregated data (needs sync),\
    \ a normalized core with a flexible periphery (MAINT); L532 the sync gradient:\
    \ documentation only, constraints, periodic detection, scheduled refresh, same-transaction\
    \ triggers; move up with change frequency and divergence harm (MAINT); L533 drift\
    \ guard: a scheduled query recomputes each denormalized aggregate, counts divergence\
    \ and alerts (MAINT). Placement DERIVE.1 (J1): compute on read; same transaction\
    \ when atomic with the source; cache tables with stated staleness; consumers never\
    \ write derived stores beside the source.\nForces: integrity (a copy cannot be\
    \ trusted further than its sync) against read performance.\nDecision and grounds:\
    \ realization of DERIVE.1 and J2 DATA.DERIVE; the doctrine is the max.\n  - Of\
    \ L531's reasons, the indivisible object and the flexible periphery are organizing\
    \ choices governed by ORGANIZE.5 (no fact is stored twice); only the derived summary\
    \ is a copy governed here.\n  - A copy exists only when computing on read is measured\
    \ too costly (L168, J2), with L469's sync plan recorded in the table comment before\
    \ it is built.\n  - Mechanism, in J1's order: a stored generated column for same-row\
    \ values (L176); when any reader decides a write from the copy or shows it as\
    \ authoritative (L532's top rung), a same-transaction trigger, and the writer\
    \ function only when the source table admits no other writer (no direct-write\
    \ grant, no owner-run job) (changed after review, M2: a direct writer under DB_API's\
    \ exception or an owner-run job would skip a function-kept copy; only what is\
    \ bound to the table holds for every writer); a cache table with a stated staleness\
    \ otherwise (DERIVE.2). L532's choice by change frequency and divergence harm\
    \ applies within that order.\n  - Every copy other than a generated column gets\
    \ L533's drift guard (MAINT). \"Documentation only\" therefore never stands alone:\
    \ with the guard it is the periodic-detection rung (L532 read with L533; no conflict).\n\
    \  - The redundancy is guarded by the database (trigger, function, constraint),\
    \ not by \"the application\" of L168: under MD-03 several applications write (J1\
    \ DERIVE.1).\nRejected: denormalization without a measured need: rejected (L168).\
    \ A copy maintained by a consumer beside the source: never (J1 DERIVE.1, L045).\
    \ An ordered-log pipeline: rejected in the default; wins with many external derived\
    \ stores, a high write rate and a team able to run it (L626 via J1).\nRealizes:\
    \ web-app-philosophy:ALLOCATION.DERIVE.1 (keeps denormalized copies in sync as\
    \ the placement sets); J2 DATA.DERIVE.\n\nBuild narrative moved out of the constraints:\
    \ changed after review, M2: a direct writer under DB_API's exception or an owner-run\
    \ job would skip a function-kept copy; only what is bound to the table holds for\
    \ every writer."
