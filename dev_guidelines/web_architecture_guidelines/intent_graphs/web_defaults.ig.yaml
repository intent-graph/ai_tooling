- uid: PIG-WEB-INTERACTION.AGENT.1
  name: Surface and Protocol
  intent: The HTTP interface is described by OpenAPI kept in sync with the implementation,
    and an MCP adapter over the same core serves third-party agent hosts, its tool
    names, schemas and results having one origin checked by the same CI drift gate.
    The surface is stateless over remote HTTP with OAuth, cross-call state is a server-minted
    handle checked on every call, and agents use the API rather than scraping pages.
  epistemic_state: 'known | unvalidated: P4 as default inferred from the default context
    (L635 inferred); content forms speculative (L636 T4); generation or conformance
    check of tool schemas from the core description inferred | open: MCP specification
    moving (L661)'
  constraints:
  - 'One core, one description: the HTTP interface is described by OpenAPI kept always
    in sync with the implementation (MD-02); the origin direction is the project''s
    recorded choice (TYPE_CHAIN). Humans'' pages, JSON clients and agents reach the
    same core (RULES.4).'
  - 'An MCP adapter over the same core for third-party agent hosts: the default context
    has agents as users, which means agents the team does not build; the adapter only
    translates and shapes, so the added surface holds no rule. Tools are few and purpose-specific
    (web-app-philosophy:INTERACTION.AGENT).'
  - 'The tool surface is an interface description too (MD-02 covers every agent-facing
    interface): the tool names, input schemas and result shapes have one origin. They
    are generated from the core description, or checked against it for conformance,
    and the same CI gate fails on drift. They change additively; a breaking tool change
    goes expand, migrate, contract under the compatibility window web-app-philosophy:INTERACTION.ENVIRONMENT.3
    sets, so agents built against the old tools keep working through a deploy.'
  - 'Stateless surface (LOGIC.EXPOSE.2): no hidden per-connection session; cross-call
    state is a server-minted, unguessable handle checked against the caller on every
    call.'
  - 'Transport by trust boundary: the hosted surface is remote HTTP with OAuth; a
    developer-local tool shipped with the product, if any, uses stdio with environment
    credentials in a sandbox; a local HTTP server requires an authorization token.'
  - 'Content for agents: data through the API and the MCP adapter, never by scraping
    pages; pages stay semantic server-rendered HTML (VISUALIZE.1, .4), readable as
    they are. llms.txt is not relied on for discovery.'
  design_notes: "Decides: which protocol surface and content forms agents get, and\
    \ how the surface keeps state.\nRows: L634, L635, L636, L661, L663. Cited: L633\
    \ (RULES.4), L054, MD-02.\nPositions:\n  - Contract: P1 a machine-readable OpenAPI\
    \ description generated from or checked against the implementation (L634, consensus\
    \ T1).\n  - Protocol (L635, contested): P2 an MCP server as the agent surface\
    \ (third-party hosts connect without bespoke integration); P3 plain HTTP and OpenAPI\
    \ only (one surface, less to secure); P4 both layered, MCP over the same HTTP\
    \ core.\n  - Content (L636, contested, T4): P5 publish llms.txt; P6 llms.txt is\
    \ unused by AI services, spend nothing; P7 content negotiation (Accept: text/markdown,\
    \ Vary: Accept) on the same URL.\n  - State: P8 a stateless surface; cross-call\
    \ state as an explicit server-minted handle validated against the caller on every\
    \ call (L661); P9 hidden per-connection session (rejected in L661).\n  - Transport\
    \ (L663): P10 remote HTTP with OAuth; P11 local stdio with environment credentials,\
    \ sandboxed; P12 local HTTP with an authorization token.\nForces: the node's purpose\
    \ is agents' ability to work with the data, bounded. P2 and P4 serve reach (hosts\
    \ the team does not control), at the cost of one more surface to secure and maintain;\
    \ P3 serves a smaller attack surface and loses third-party hosts. P5 to P7 serve\
    \ agent token cost for content, on thin evidence. P8 serves scalability behind\
    \ load balancers and security; P9 serves nothing a handle cannot.\nDecision (the\
    \ rules are the constraints):\nRejected:\n  - P3 alone: wins when every agent\
    \ client is the team's own code (L635 b).\n  - P2 without the HTTP core: wins\
    \ never; MCP sits on the core (L635).\n  - P5: acceptable for a developer-documentation\
    \ site whose readers' coding agents fetch it on purpose (L636 a).\n  - P7: acceptable\
    \ when pages already pass a CDN that converts them (L636 c); its cost in cache\
    \ variants is unweighed.\n  - P9: wins never (L661).\nRealizes: ALLOCATION.RULES.4\
    \ (proposed: one more adapter on the same core); ALLOCATION.RECORD.3 and PIG-WEB-ALLOCATION.TYPE_CHAIN\
    \ (proposed: the description always in sync, MD-02).\nHand-offs: payload schemas\
    \ and API evolution (PIG-WEB-LOGIC.EXPOSE.6, .7); description drift gate in CI,\
    \ extended to the MCP tool list and schemas (PIG-WEB-TRANSVERSE.CONTRACTS.1: the\
    \ contract-verification judge should name the tool surface among the descriptions\
    \ its gate checks)."
