- uid: PIG-WEB-INTERACTION.AGENT.4
  name: Approval and Injection Defense
  intent: Reads and reversible writes proceed under ordinary authorization; irreversible
    or external effects require approval by the owning user, shown the exact action
    on the application's own page, and the effect's writer function refuses an agent-originated
    operation without it. Credentials and payment details are collected out of band,
    injection is contained structurally, and no client hint is enforcement.
  epistemic_state: 'known | unvalidated: L646 is a synthesis; server-held approval
    checked by the writer function inferred'
  constraints:
  - Reads and reversible writes proceed, authorized as every request is (GUARD.3).
  - 'Irreversible or external effects (the consequential list of .3) need approval
    by the user who owns the authority, shown the exact action, on the application''s
    own page (realized out of band): the agent''s call creates a pending operation
    with its exact parameters; the user approves it in the application, authenticated
    by their own session; the writer function that performs the effect refuses an
    agent-originated operation without a matching approval by the delegating user
    (a rule decidable from the stored rows and the actor, so the writer function''s
    under GUARD.3; inferred). An approval dialog in the agent host is a client hint,
    never the gate; for a bearer-only client this approval is the gate for consequential
    operations.'
  - 'Approvals stay rare by scoping: only irreversible or external effects ask, so
    fatigue does not erode them (inferred from a reported 93% approval rate under
    frequent prompts).'
  - Credentials, payment details and third-party authorization are collected on the
    application's own page, bound to the user who started the flow, never through
    the agent.
  - 'Injection is contained structurally: few purpose-specific tools, no agent session
    the application runs holds untrusted input, private data and outward power together,
    filters only as an extra layer.'
  - 'No client hint is enforcement: annotations, claimed identity and client names
    are untrusted.'
  design_notes: 'Decides: how consequential agent actions are approved and how prompt
    injection is contained.

    Rows: L646, L647, L649, L650. Cited: L644, L648 (J4), L643, L659, GUARD.3.

    Positions: approval (L646, contested): P1 per-action human confirmation of the
    exact action; P2 classifier or policy auto-approval (17% false negatives on overeager
    actions, SRC-399 T3); P3 structural limits so approval is rarely needed (Rule
    of Two, CaMeL; costs capability); P4 out-of-band approval on a separate device
    (defeats a compromised client). P5 secrets, payment details and third-party authorization
    collected in the application''s own page, never through the agent''s context,
    bound to the same user (L647). Injection (L649, contested): P6 structural first,
    filters second; P7 filters as the main control. P8 the server never relies on
    client hints (tool annotations, claimed identity, client name) (L650).

    Forces: the node serves security of the user''s data against the agent''s throughput.
    P1 is strongest per action and causes approval fatigue when frequent; P2 keeps
    flow and misses consequential actions; P3 gives the strongest guarantee at a capability
    cost; P4 resists a compromised agent host. P5 keeps credentials out of model context
    and logs. P6 reduces residual risk; P7 alone leaves it.

    Decision (the rules are the constraints): the approval design follows reversibility
    and blast radius (L646), and the approval lives on the server.

    Rejected: P2: acceptable only for recoverable effects in developer tooling (L646
    b), not for this application''s consequential effects. P3 alone: the default for
    agents the application runs that read untrusted content (J4 decision 6), not a
    substitute for approval of irreversible effects. P7: wins never as the only control
    (L649).

    Realizes: ALLOCATION.GUARD.3 (skeleton link, requires: approval never replaces
    the authorization authority); ALLOCATION.ACT.1 (proposed: the effect''s writer
    function checks the approval).

    Hand-offs: pending-operation storage (PIG-WEB-DATA.ORGANIZE); the approval page
    and its session (PIG-WEB-LOGIC.SECURE.2).'
