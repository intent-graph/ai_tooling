- uid: PIG-WEB-DATA.ORGANIZE.3
  name: Column Types
  intent: 'Column types are chosen for precision so the structure itself refuses wrong
    values: timestamptz for time, text with CHECK, numeric for quantities, lookup
    tables for enumerations, positive NOT NULL booleans, and created_at on every table
    with updated_at on those whose rows change. Values are stored canonical and formatted
    only where rendered; the collation choice is left open because no evidence grounds
    it.'
  epistemic_state: 'known | conflict: partly against L498 (MAINT): no updated_at on
    append-only tables | gap: collation has no row; left open with its requirements
    | unvalidated: that updated_at states nothing on append-only tables is inferred'
  constraints:
  - 'time: timestamptz everywhere; event times named for the event (`*_at`, ORGANIZE.4)
    and ordered by CHECK; a UUIDv7 never stands for creation time;'
  - 'text: `text` with a CHECK for any length limit; never char(n) or a length-limited
    varchar;'
  - 'money and quantities: numeric with declared precision; never `money`;'
  - 'enumerations: a lookup table referenced by foreign key; CHECK IN only for short
    sets that are stable by definition;'
  - 'booleans: NOT NULL, a default, a positive name;'
  - '`created_at` on every table, append-only tables included, where it is the record
    time; `updated_at` on every table whose rows are updated, written by the trigger
    of GUARD.4. Partial departure from the doctrine''s rule that every table has `updated_at`:
    append-only tables (history, archive and queue rows) carry no `updated_at`, since
    their rows are never updated and the column would state nothing (inferred). Only
    `updated_at` departs; the record-time name stays `created_at`.'
  - 'Canonical storage: values are stored canonical (UTC instants, plain numbers,
    codes); formatting happens where the text is rendered (PRESENT.2).'
  design_notes: "Question: which column types are used for time, text, numbers, enumerations\
    \ and flags.\nPositions:\n  - P1 timestamptz, text with CHECK for limits, numeric\
    \ (not money), identity columns, over timestamp without time zone, char(n), money\
    \ and serial (L177, consensus).\n  - P2 a UUIDv7 timestamp is not the creation\
    \ time; keep an explicit timestamptz (L178).\n  - P3 lookup table with a foreign\
    \ key over a native enum; CHECK with an IN list only for short stable sets; booleans\
    \ NOT NULL with a default, positively phrased (L497 MAINT).\n  - P4 every table\
    \ carries created_at and updated_at as timestamptz NOT NULL default now(); event\
    \ times named for the event; ordering between timestamps is a CHECK; no timestamp\
    \ without time zone (L498 MAINT).\n  - Native enum types: named by L497 as the\
    \ alternative it rejects; no row defends them.\nForces: all serve integrity through\
    \ precision (L485, J2). P3 trades a join for metadata and change without a type\
    \ migration; native enums are compact but change only by type migration.\nDecision\
    \ and grounds: P1 to P4 adopted (MAINT and research agree; max):\n  - time: timestamptz\
    \ everywhere; event times named for the event (`*_at`, ORGANIZE.4) and ordered\
    \ by CHECK (L498); a UUIDv7 never stands for creation time (L178);\n  - text:\
    \ `text` with a CHECK for any length limit; never char(n) or a length-limited\
    \ varchar (L177, L494);\n  - money and quantities: numeric with declared precision;\
    \ never `money` (L177);\n  - enumerations: a lookup table referenced by foreign\
    \ key; CHECK IN only for short sets that are stable by definition (L497);\n  -\
    \ booleans: NOT NULL, a default, a positive name (L497, L506);\n  - `created_at`\
    \ on every table, append-only tables included, where it is the record time; `updated_at`\
    \ on every table whose rows are updated, written by the trigger of GUARD.4 (L498).\
    \ Partial departure from L498 (recorded after review, m4): append-only tables\
    \ (history, archive and queue rows) carry no `updated_at`, since their rows are\
    \ never updated and the column would state nothing (inferred). Only `updated_at`\
    \ departs; the record-time name stays `created_at`.\n  - Canonical storage: values\
    \ are stored canonical (UTC instants, plain numbers, codes); formatting happens\
    \ where the text is rendered (PRESENT.2, L632).\nRejected: L498's `updated_at`\
    \ on append-only tables: rejected; acceptable when a table described as append-only\
    \ in fact receives updates, which makes it an ordinary table. timestamp without\
    \ time zone, char(n), money, serial: never (L177). Native enums: rejected; acceptable\
    \ when the set is fixed by definition and carries no metadata, and then a CHECK\
    \ IN serves the same purpose without a type (L497). A UUIDv7 as creation time:\
    \ never (L178).\nRealizes: J2 DATA.ORGANIZE and DATA.GUARD (precise structure,\
    \ L485); ALLOCATION.PRESENT.2 (canonical storage); ALLOCATION.DERIVE.2 (collation,\
    \ open).\n\nBuild narrative moved out of the constraints: recorded after review,\
    \ m4."
