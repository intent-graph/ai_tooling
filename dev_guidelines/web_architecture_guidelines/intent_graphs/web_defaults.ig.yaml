- uid: PIG-WEB-ALLOCATION.POSTGRES_FIRST
  name: Postgres First for Backing Roles
  intent: One Postgres carries the job queue, schedules, derived caches, sessions
    and documents until a measured limit for that role, because fewer components and
    sharing the data's transaction serve changeability and correctness. NOTIFY is
    a low-rate wake-up, never the message carrier.
  epistemic_state: 'known | unvalidated: L125 rests on T4 sources and the T1 SKIP
    LOCKED page; thresholds open (L126, L127)'
  constraints:
  - Postgres hosts the job queue, schedules, derived caches, sessions and documents
    until a measured limit for that role.
  - 'Each role names its trigger to leave Postgres: queue lock contention or backlog
    age; NOTIFY commit serialisation under write concurrency; cache latency or cache
    load on the primary.'
  - NOTIFY is a low-rate wake-up, never the message carrier.
  - 'Authority: Postgres per role.'
  - 'Forbidden: a second store written beside Postgres without staging.'
  design_notes: 'Positions: P1 one Postgres until a measured limit (L125, L534, L604);
    P2 specialised services from the start or past the limit (L126, L417, L457). Forces:
    changeability (fewer components) and correctness (backing roles share the data''s
    transaction) against scalability. Decision: P1. Rejected: P2, acceptable past
    a measured limit, or where the framework''s only production backend is a service
    (Django''s channel layer on Redis, L457). Moved by: write concurrency, queue volume,
    fan-out processes. Tension: none recorded. Evidence gaps: L125 rests on T4 sources
    and the T1 SKIP LOCKED page; thresholds for queue contention (L126) and NOTIFY
    (L127) are open.'
