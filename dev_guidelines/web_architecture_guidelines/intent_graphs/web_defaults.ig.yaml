- uid: PIG-WEB-INTERACTION.REALTIME.1
  name: Channel Choice
  intent: Use no push where staleness does not matter, short polling for slow-changing
    views, server-sent events for one-way push (notifications, comment streams, status
    of long work), and WebSocket only for frequent two-way low-latency traffic; long
    polling is a fallback where streaming cannot pass a hop. Because push is only
    a hint, a buffered or failed stream delays updates but never corrupts state.
  epistemic_state: 'known | unvalidated: the order rests on a T3 guide (L435, L437
    inferred); the buffering claim has one vendor source (L436); the silent-stream
    fallback is inferred'
  constraints:
  - No push where a page's data changes rarely or staleness does not matter.
  - Short polling for slow-changing views with second-scale tolerance, ended by a
    status code when done.
  - 'Server-sent events for one-way push (notifications, comment streams, status of
    long work): resume by event id (.2), authentication by the session cookie, which
    fits SSE''s lack of custom headers (GUARD.4).'
  - 'WebSocket only for frequent two-way, low-latency traffic: live cursors and typing,
    the collaborative text engine (COLLABORATE.3).'
  - Long polling only as a fallback where streaming cannot pass a hop.
  - 'The buffering risk that motivates the WebSocket-first position is contained,
    not ignored: the team turns buffering off on its own proxy for streaming routes;
    the client treats a stream that delivers nothing past the heartbeat interval as
    broken and falls back to polling (inferred); because push is only a hint, a buffered
    stream delays updates but never corrupts state.'
  design_notes: "Decides: which channel (polling, long polling, SSE, WebSocket) each\
    \ push need uses.\nRows: L436, L437, L438, L439, L440, L441, L442. Cited: L435,\
    \ L006, L682 (J4), L451, L448, L127, L457.\nPositions: P1 SSE first for server-to-client\
    \ push (L436 a, SRC-302 T3: plain HTTP, automatic reconnect and resume); P2 WebSocket\
    \ first (L436 b, SRC-317 T4 vendor: SSE can be buffered by proxies and CDNs; one\
    \ two-way channel); P3 the order none, polling, SSE, WebSocket only for two-way\
    \ needs (L437, inferred, majority); P4 short polling for infrequent updates at\
    \ second-scale latency (L438, L442: no connection state, works on any process\
    \ model); P5 long polling, timeout about 30 s (L439).\nForces: the node's purpose\
    \ is that users learn of changes in time, without correctness depending on the\
    \ channel. P1 serves operability (ordinary HTTP, built-in resume via Last-Event-ID,\
    \ cookie authentication) at the cost of buffering risk through intermediaries\
    \ the team does not run. P2 serves two-way traffic and robustness through unknown\
    \ intermediaries, at the cost of no built-in resume (L453), a hand-built reconnect,\
    \ upgrade support on every hop (L448) and long-lived connection servers. P4 serves\
    \ simplicity and any process model at the cost of traffic grown by clients times\
    \ frequency (L438).\nDecision (the rules are the constraints): P3 with P1 as the\
    \ push default (J4 decision 2 realized; the WebSocket-first position was handed\
    \ here).\nRejected:\n  - P2 as the default: wins when the path to users crosses\
    \ intermediaries the team cannot configure and buffering is observed there, or\
    \ when traffic is two-way at high frequency (L436's own fit).\n  - L437's \"Redis\
    \ layer when more than one process fans out\": narrowed by POSTGRES_FIRST (settled):\
    \ fan-out starts from a Postgres wake-up and a table re-read (.3, .5); Redis wins\
    \ past a measured NOTIFY limit (L127) or where the chosen framework's only production\
    \ backend is Redis (L457).\nRealizes: J4 INTERACTION.COLLABORATE decisions 1 and\
    \ 2; PIG-WEB-ALLOCATION.POSTGRES_FIRST (proposed link: no Redis by default)."
