- uid: PIG-WEB-LOGIC.ENFORCE.2
  name: Transactions
  intent: One business operation is one transaction holding exactly the transaction-local
    actor setting and one API function call, committed on success and rolled back
    on any exception, with the whole transaction retried on serialization failure
    or deadlock. Reads that need the actor run in a short read-only transaction through
    the same wrapper; nothing is held open across a remote call.
  epistemic_state: 'known | tension: L229''s use-case-scoped transaction narrowed
    to one function call (ACT.1, RULES.5) | unvalidated: transaction-local scoping
    in autocommit and the retryable error codes (Postgres behaviour, not in the ledger)'
  constraints:
  - One transaction per business operation, holding exactly the actor setting and
    one API function call (`transaction.atomic(durable=True)` around those two statements,
    asserting it is outermost, `ATOMIC_REQUESTS` off).
  - Never two API calls in one transaction, never a transaction per request, never
    one open across a remote call or a user's think time.
  - Reads precede the write; the write carries the version it read, so the writer
    function rejects a decision taken on stale data.
  - Plain reads (base tables under SELECT grants, no rule needing the actor) run in
    autocommit; a read needing the actor runs in a short read-only transaction that
    sets the actor and makes one read call through the generated wrapper; read functions
    refuse a missing actor.
  - No exception swallowed inside the atomic block; database errors mapped after it.
  - One connection per thread, never shared; one per task under async.
  - The wrapper retries the whole one-call transaction on SQLSTATE 40001 and 40P01
    at any isolation level, within PROCESS.3's caps; after an unknown commit outcome
    only calls carrying an idempotency key are retried.
  - The isolation level is set per consumer role in the database; the backend never
    lowers it per transaction.
  - Logic tests on shared data run in never-committing transactions; retry paths,
    lock waits, deferred constraints and the outbox are tested with committing sessions
    in a disposable database; concurrency tests are part of the default suite.
  design_notes: "Positions: - P1 keep transactions short (L228).\n  - P2 prefer a\
    \ use-case-scoped transaction over one around the whole request; a request-wide\
    \ transaction is acceptable for simple applications (Django `ATOMIC_REQUESTS`,\
    \ with a warning on overhead) (L229).\n  - P3 the safe path by default: nothing\
    \ persisted unless the use case commits explicitly; roll back on any exception;\
    \ Django's default autocommit is the opposite (L230).\n  - P4 never catch and\
    \ swallow exceptions inside an atomic block (L231).\n  - P5 a database session\
    \ is stateful and not shareable: one per thread, one per task under async, created\
    \ and closed at the entry point (L232).\n  - Cited: one business operation is\
    \ one function call in its own transaction, never several calls wrapped (RULES.5,\
    \ ACT.1, DB_API); the actor in a transaction-local setting from the verified identity\
    \ (L311, L566); no transaction across a remote call (L234); isolation set per\
    \ consumer role, its default with the DATA judge (GUARD.2).\n\nForces: correctness\
    \ (atomicity, the actor bound to the write); latency and lock time; simplicity.\n\
    \nDecision: 1. **One business operation, one transaction**, holding exactly two\
    \ things: the transaction-local actor setting from the verified identity (L311,\
    \ L566) and one API function call. Commit on success, roll back on any exception\
    \ (P1, P3; ACT.1). In Django: `transaction.atomic()` around those two statements,\
    \ `ATOMIC_REQUESTS` off.\n  2. Never two API calls in one transaction, never a\
    \ transaction per request, never one open across a remote call or a user's think\
    \ time (RULES.5, L234, GUARD.5). Backends never compose several calls into one\
    \ business operation; a step that must be atomic with another is a database function,\
    \ which may call another domain's published functions inside its own transaction\
    \ (X3).\n  3. **Reads apart from the write**: a use case reads what it needs in\
    \ one statement or read function (ENFORCE.3); the write then carries the version\
    \ it read, so the writer function rejects a decision taken on stale data (GUARD.5).\n\
    \     - Plain reads (base tables under SELECT grants, no rule needing the actor)\
    \ run in autocommit.\n     - A read that calls a read function needing the actor,\
    \ or under J1's read-function answer any per-user read (SECURE.1 step 4), runs\
    \ in a short read-only transaction that sets the actor and makes the one read\
    \ call, through the same generated wrapper as writes (review M2). In autocommit,\
    \ a transaction-local setting (`set_config(…, true)`, `SET LOCAL`) is its own\
    \ transaction and is gone before the next statement, so a read function would\
    \ see no actor (L311, L566; Postgres scoping inferred, not in the ledger).\n \
    \    - Read functions refuse a missing actor, as writer functions do (GUARD.3,\
    \ R1-3).\n  4. No exception swallowed inside the block (P4); database errors are\
    \ mapped after it (EXPOSE.2).\n  5. One connection per thread, never shared; one\
    \ per task under async (P5).\n  6. **Retries** (review m1): the wrapper always\
    \ retries the whole one-call transaction on a serialization failure (SQLSTATE\
    \ 40001) or a deadlock (40P01), whatever isolation level PIG-WEB-DATA.CONCURRENCY.1\
    \ sets: deadlocks occur at every level and serialization failures under Repeatable\
    \ Read too (Postgres behaviour, inferred, not in the ledger). Retries are bounded\
    \ by PROCESS.3's caps and safe because nothing committed. When the commit outcome\
    \ is unknown (connection lost during COMMIT, L479), only calls carrying an idempotency\
    \ key are retried (GUARD.6) (inferred).\n  7. The isolation level is set per consumer\
    \ role in the database (GUARD.2's hand-off); the backend never lowers it per transaction\
    \ (inferred from J1's R1-9).\n  8. **Tests** (X4): logic tests on shared data\
    \ run in never-committing transactions (L567); the retry path, lock waits, deferred\
    \ constraints and the outbox only show at commit and are tested with committing\
    \ sessions in a disposable database, never a shared one; concurrency tests for\
    \ the rules GUARD.2 requires (Serializable with retry, locks) are part of the\
    \ default test suite, not a gap.\n\nRejected: - A request-wide transaction: it\
    \ would wrap several calls and the whole request; acceptable when one backend\
    \ is the only database consumer (ACT.1's condition) and the request makes no remote\
    \ call (P2, L234).\n  - A use-case transaction spanning several statements composed\
    \ in Python (P2 as stated): acceptable only under the same single-consumer condition\
    \ (narrowed by ACT.1, MD-03).\n  - Autocommit for writes, and for reads that need\
    \ the actor: the actor setting must share the function's transaction (L311, L566;\
    \ review M2; inferred from Postgres scoping).\n  - Retrying only when Serializable\
    \ is set: rejected; 40001 and 40P01 occur outside it (review m1).\n\nRealizes:\
    \ no skeleton link; follows ALLOCATION.ACT.1, RULES.5 and PIG-WEB-ALLOCATION.DB_API\
    \ (proposed link to ACT.1)."
