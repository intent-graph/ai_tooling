- uid: PIG-WEB-INTERACTION.REALTIME.5
  name: Database Notifications
  intent: 'LISTEN and NOTIFY are a wake-up signal only: the writer function that commits
    a change also writes the change row and issues NOTIFY with an identifier payload,
    and consumers re-read the table after their cursor. Each process holds one direct
    session-level listening connection, NOTIFY is issued only for changes with live
    subscribers, a low-frequency poll covers a missed wake-up, and queue usage is
    monitored.'
  epistemic_state: 'known | unvalidated: the writer function as issuer (MD-03), the
    safety-net poll, the monitoring advice (L466) and NOTIFY limited to changes with
    live subscribers inferred | open: NOTIFY threshold (L127)'
  constraints:
  - 'The writer function that commits a change also writes the change row and issues
    NOTIFY with an identifier payload in the same transaction (issuer under MD-03
    inferred): notification is delivered at commit, in commit order, never for a rolled-back
    change.'
  - Consumers LISTEN and commit, then read current state, then rely on notifications;
    on every wake-up they re-read from the table after their cursor; identical notifications
    collapsing to one is harmless.
  - Events that must not be lost are rows (outbox or change table); NOTIFY or a poll
    only wakes the reader. A low-frequency poll of the same table covers a missed
    wake-up (interval inferred).
  - 'NOTIFY only where a change has live subscribers: a full notification queue makes
    committing transactions fail, so with NOTIFY issued from writer functions one
    stuck listener could fail core writes. Only the writer functions whose changes
    feed a real-time channel issue it; others write their change rows without notifying
    (inferred).'
  - One direct, session-level listening connection per process, outside any transaction,
    never through a transaction-pooling pooler; listener sessions run under the idle-in-transaction
    timeout, so a listener stuck in a transaction is ended before it fills the queue.
  - Queue usage is monitored; a listener in a long transaction is an incident.
  - 'Tests: the wake-up path only shows at commit (notification delivered at commit,
    in commit order), so it is tested with committing sessions in a disposable database,
    never a shared one; logic tests on shared data stay in never-committing transactions.'
  design_notes: 'Decides: how Postgres notifications wake application processes.

    Rows: L462 to L467 (6 rows). Cited: L125, L127 (POSTGRES_FIRST), L202, L567, L594,
    L624.

    Positions: P1 LISTEN/NOTIFY as a wake-up signal, data in tables (L462, L463, L467,
    consensus T1); P2 NOTIFY as a message carrier, counter or event log (rejected
    in L462, L464, L467); P3 polling the change table without notifications (L467''s
    fallback). Connection: P4 a direct session-level connection per process (L465);
    P5 through a transaction-pooling pooler (rejected in L465).

    Forces: P1 serves low-latency wake-up without a second store, bounded by at-most-once
    delivery, an 8000-byte payload and a global commit lock under write concurrency
    (L127). P2 loses events with no listener and collapses duplicates. P3 serves robustness
    at the cost of poll latency and load.

    Decision (the rules are the constraints): P1 with P3 as the safety net (POSTGRES_FIRST
    realized).

    Rejected: P2: wins never (L462, L464, L467). P5: wins only with a pooler that
    explicitly supports LISTEN (L465). P3 alone: acceptable when the measured NOTIFY
    limit is reached (L127) or the latency of the poll interval is tolerable.

    Realizes: PIG-WEB-ALLOCATION.POSTGRES_FIRST (skeleton link, requires); ALLOCATION.ACT.2
    (proposed: the staged intent in the function''s transaction, delivered after commit).

    Hand-offs: queue-usage monitoring (PIG-WEB-TRANSVERSE.OPERABILITY.3); the change
    table and its cursor (PIG-WEB-DATA.CONCURRENCY.5); pooler configuration and the
    idle-in-transaction timeout (PIG-WEB-DATA.INTERFACE.2); committing tests in a
    disposable database (PIG-WEB-TRANSVERSE.OPERABILITY.5).'
