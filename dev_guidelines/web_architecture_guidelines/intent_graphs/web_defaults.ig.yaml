- uid: PIG-WEB-LOGIC.SECURE.3
  name: CSRF Defense
  intent: 'Cross-site request forgery is prevented by every layer on every request
    the session cookie authenticates: Django''s synchronizer token, the cookie''s
    `SameSite` attribute, and a Fetch Metadata and `Origin` check; safe methods change
    nothing, and bearer-token endpoints never accept the session cookie.'
  epistemic_state: 'known: MD-07 | unvalidated: the cookie and bearer endpoints kept
    apart (inferred)'
  constraints:
  - Django's CSRF middleware with a synchronizer token in every form and in a request
    header for island scripts; no view that accepts the session cookie is exempted.
  - The session cookie's explicit `SameSite` value (SECURE.2) as a second layer; never
    `SameSite` alone.
  - A Fetch Metadata and `Origin` check rejects cross-site unsafe requests, deployed
    first in logging-only mode, then enforced; requests without the headers fall back
    to the token check.
  - Safe methods change nothing, so GET carries no token.
  - Endpoints authenticated by bearer tokens never accept the session cookie; they
    are the only exemption.
  - 'Forbidden: a custom header alone as the defence; exempting a view that accepts
    the session cookie.'
  design_notes: "Positions: - P1 use the framework's built-in CSRF protection first\
    \ and avoid exempting views (L330).\n  - P2 layer defences: a synchronizer token\
    \ (or a signed double-submit for stateless applications) plus SameSite cookies;\
    \ SameSite alone is insufficient (Lax allows top-level GET, covers the site not\
    \ the origin, does not stop client-side forgery) (L331).\n  - P3 reject cross-site\
    \ unsafe-method requests by `Origin` or `Sec-Fetch-Site` (Fetch Metadata), allowing\
    \ requests that lack the headers, exempting deliberate CORS endpoints, trialled\
    \ in logging-only mode (L332).\n  - P4 a custom request header on script requests\
    \ relies on the CORS preflight; CORS must list explicit origins; it does not replace\
    \ CSRF protection (L333).\n\nForces: security; compatibility with browsers that\
    \ send no Fetch Metadata (P3's allowance).\n\nDecision: every layer, on every\
    \ request that the session cookie authenticates.\n  1. Django's CSRF middleware,\
    \ synchronizer token in every form and in a request header for island scripts;\
    \ no view that accepts the session cookie is exempted (P1, P2, P4).\n  2. The\
    \ session cookie's explicit `SameSite` value (SECURE.2: decided by MD-07, `Lax`\
    \ recorded by default) as a second layer (P2).\n  3. A Fetch Metadata and `Origin`\
    \ check that rejects cross-site unsafe requests, deployed first in logging-only\
    \ mode, then enforced; requests without the headers fall back to the token check\
    \ (P3).\n  4. Safe methods change nothing (EXPOSE.1 via J3, L050), so GET carries\
    \ no token.\n  - Endpoints authenticated by bearer tokens (agents, programs) carry\
    \ no ambient credential and never accept the session cookie, so forgery does not\
    \ apply to them; they are the only exemption, matching P3's deliberate cross-origin\
    \ endpoints (inferred).\n\nRejected: SameSite alone: never (P2). A custom header\
    \ alone: never (P4). Signed double-submit: acceptable when the application holds\
    \ no server session (P2); not this context. Exempting a view that accepts the\
    \ session cookie: never (P1).\n\nRealizes: no skeleton link; follows ALLOCATION.GUARD.4\
    \ (cookie session) and ALLOCATION.RULES.3."
