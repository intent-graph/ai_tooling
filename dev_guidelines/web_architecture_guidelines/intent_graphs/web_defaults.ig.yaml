- uid: PIG-WEB-TRANSVERSE.OPERABILITY.4
  name: Security Event Log
  intent: Security events are written to a central collector outside the application
    database in one vocabulary over secure transport, copied to read-only storage
    with every access recorded, and kept apart from the business audit trail. Refusals
    made inside database functions reach it through the backend log and the shipped
    Postgres log.
  epistemic_state: 'known | unvalidated: database-side refusals reaching the log'
  constraints:
  - The security event log is written to a central collector outside the application
    database, in one vocabulary, over secure transport. It is copied to read-only
    storage as soon as possible, and every access to it is recorded.
  - 'It records the standard list: validation failures, authentication results, authorization
    failures, session failures, errors, use of higher-risk functions. Agent authorization
    failures are included, with the agent''s identity fields.'
  - 'Under MD-03 many authorization refusals happen inside writer functions (GUARD.3)
    and in Postgres privilege checks. The backend logs each refusal it receives with
    actor, role and trace id. Postgres''s own log (authentication failures, privilege
    errors, role changes) is shipped to the same collector, which covers the consumers
    outside a backend: BI, operators, scripts. Inferred.'
  - Business history stays in the database (ACT.4); the two records stay apart.
  design_notes: "Rows: L390, L391, L392, L393, L394, L395. Cited: L049, L098, L658.\n\
    Positions: - Content: when, where, who, what per record (L390); one event vocabulary\
    \ with category prefixes and ISO 8601 timestamps with offset (L391).\n  - Placement:\
    \ P1 a separate partition or a separate database account used only to write logs,\
    \ with very restrictive permissions (L392); P2 a central collector in a standard\
    \ format over secure transport (L392).\n  - Protection: read-only copies as soon\
    \ as possible, every access recorded, origin of external logs verified (L393);\
    \ synchronised clocks (L394); client events validated and sanitised (L395).\n\
    \  - Skeleton link: conflicts ACT.4. The security event log stays apart from the\
    \ business audit trail.\nForces: P2 serves integrity against a compromised application\
    \ or database owner, at the cost of a collector. P1 in the application database\
    \ serves simplicity; the database owner can alter it.\nDecision (lead): P2, with\
    \ every content and protection practice.\nRejected: P1 inside the application\
    \ database: acceptable when no collector exists, as a dedicated append-only table\
    \ written by a log-only role (L392), and only as a stopgap: the owner role can\
    \ still alter it. Data-change events as the security log: never (ACT.4).\nRealizes:\
    \ conflicts ALLOCATION.ACT.4 (skeleton link), realized as two records kept apart;\
    \ refines TRANSVERSE.OPERABILITY.1 (J5)."
