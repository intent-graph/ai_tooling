- uid: PIG-WEB-LOGIC.EXPOSE.3
  name: Retries and Asynchronous Operations
  intent: Idempotency comes first from natural idempotence (PUT to client-chosen identifiers,
    upserts, conditional updates) and otherwise from an `Idempotency-Key` header recorded
    by the API function in the transaction of the effect, scoped to the acting user;
    long operations and foreign mutations return 202 with a status resource whose
    job record is durable before the 202 goes out.
  epistemic_state: 'known | tension: Stripe v1''s replay of failures (L269, L546)
    narrowed by GUARD.6 | unvalidated: the single-call wait and the expired-lock hand-off
    to the completer, and the retention minimum (inferred) | gap: the idempotency-key
    header is an expired IETF draft (T2)'
  constraints:
  - 'Natural idempotence first: PUT to client-chosen identifiers, upserts, conditional
    updates with `If-Match`.'
  - Otherwise an `Idempotency-Key` header, required on every mutation offered to agents
    that is not idempotent by design, on payment-like creates and on 202 submits;
    HTML forms carry the form token minted at render.
  - The key is recorded by the API function in the transaction of the effect, scoped
    to the acting user; same key with another payload gets 422; a missing required
    key gets 400.
  - 'A single-call operation''s concurrent duplicate waits on the key''s unique index,
    then gets the replay; a multi-phase operation commits the key row in the first
    phase with the recovery point and a lock with an expiry: a duplicate finding the
    lock held gets 409 with `Retry-After`, after completion gets the replay, and on
    an expired lock waits for the completer to resume (never re-runs the phases itself).'
  - Retention published, at least 24 hours; keys reaped by a scheduled job.
  - Long operations and foreign mutations answer 202 with `Location` of a status resource
    and `Retry-After`; the job record is written by the API function before the 202;
    the status resource has the closed set pending, running, succeeded, failed, canceled,
    `createdAt` and `lastUpdatedAt`, problem details on failure, an `Expires` retention,
    303 to the result and DELETE to cancel; clients never poll the target resource.
  - 'Forbidden: replaying stored failures; a separate key store.'
  design_notes: "Positions: - P1 design POST and PATCH idempotent by nature (client-supplied\
    \ identifiers, upserts, conditional requests); add a key where impossible; contested\
    \ between natural idempotence (Zalando), a header (Stripe, the IETF draft) and\
    \ a body field `request_id` (AIP-155) (L655).\n  - P2 for POSTs that create or\
    \ charge: a client-generated unique key, the stored first response returned on\
    \ repeat, the same key with another payload rejected, key retention documented;\
    \ header or body-field forms differ by source (L269).\n  - P3 the key contract:\
    \ never reused with another payload (422); a retry arriving while the first runs\
    \ gets 409, or is serialized behind a locked key row (SRC-267); a missing required\
    \ key gets 400; a published expiry; a scoped lookup (per user); the first response\
    \ replayed. Replay positions: the first result including errors (Stripe v1), completing\
    \ the work on retry (Stripe v2), or the current state (AIP-155); retention 24\
    \ hours or a reaper at 72 hours (L546).\n  - P4 operations that may outlast a\
    \ request return 202 with a status-monitor URL; thresholds differ (1 s, 10 s)\
    \ (L271).\n  - P5 the status resource: 202 with `Location` and `Retry-After`;\
    \ a closed status set (pending, running, succeeded, failed, canceled); `createdAt`\
    \ and `lastUpdatedAt`; an RFC 9457 error when failed; a retention policy (`Expires`);\
    \ 303 to the result; DELETE to cancel; never polling the target and reading 404\
    \ as \"not yet\" (L602).\n  - P6 the accepted job record is durable before the\
    \ 202; the submit carries an idempotency key (L603).\n  - Placements: GUARD.6\
    \ (the key recorded by the API function in the effect's transaction; required\
    \ on agent mutations not idempotent by design and on payment-like creates); ACT.3\
    \ (a few-seconds threshold; 202 with a status resource).\n\nForces: correctness\
    \ (no duplicate effect, no lost acceptance); simplicity; interoperability with\
    \ existing clients.\n\nDecision: 1. **Natural idempotence first** (P1; L587, MAINT,\
    \ the doctrine's max: mutations whose re-run affects no further rows, by absolute\
    \ assignments, upserts or conflict-ignoring inserts and self-limiting predicates;\
    \ review m12): PUT to client-chosen identifiers, upserts, conditional updates\
    \ with `If-Match` (GUARD.5).\n  2. **Otherwise an `Idempotency-Key` header** (P2),\
    \ required on every mutation offered to agents that is not idempotent by design,\
    \ on payment-like creates and on 202 submits (GUARD.6, P6). HTML forms carry the\
    \ form token minted at render (GUARD.6; browser share in PIG-WEB-INTERACTION.EDIT);\
    \ the agent adapter maps its tool-call key onto the same field (inferred).\n \
    \ 3. **The key is recorded by the API function in the transaction of the effect,\
    \ scoped to the acting user** (P3, GUARD.6). Consequences (inferred from GUARD.6\
    \ and L270): only committed outcomes are stored and replayed; a request that committed\
    \ nothing leaves no key, so its retry re-executes, which is safe; the same key\
    \ with another payload gets 422; a missing required key gets 400. A duplicate\
    \ arriving while the first is in flight is answered by operation shape (review\
    \ M3):\n     - **Single-call operation** (one function call, one short transaction):\
    \ the duplicate waits on the key's unique index, then gets the replay.\n     -\
    \ **Multi-phase operation** (atomic phases around a foreign call, PROCESS.2, L589):\
    \ the key row is committed in the first phase, before any outcome exists, and\
    \ carries the recovery point and a lock with an expiry. A duplicate that finds\
    \ the key locked gets 409 with `Retry-After` (L546); after completion it gets\
    \ the replay; a duplicate that finds an expired lock does not re-run the phases\
    \ itself: the completer resumes the operation from its recovery point (L589),\
    \ and the duplicate gets 409 with `Retry-After` until then. Re-executing from\
    \ the recovery point in the duplicate's request would run the foreign call twice\
    \ in parallel.\n  4. **Retention**: published, at least 24 hours (P2), keys reaped\
    \ by a scheduled job (PROCESS.1).\n  5. **Long operations and foreign mutations**\
    \ (ACT.3's few-seconds threshold (MD-09); foreign effects are deferred, PROCESS.2\
    \ step 3, review M4): 202 with `Location` of a status resource and `Retry-After`\
    \ (P4, P5); the job record is written by the API function before the 202 goes\
    \ out (P6, JOB_HOST); the status resource has the closed status set, both timestamps,\
    \ problem details on failure, an `Expires` retention, 303 to the result when done\
    \ and DELETE to cancel; clients never poll the target resource (P5).\n\nRejected:\
    \ - The body field `request_id`: acceptable in RPC-style APIs where headers are\
    \ awkward (P1).\n  - Replaying stored failures (Stripe v1): never in this stack,\
    \ because the key commits with the effect (GUARD.6); a separate key store is forbidden\
    \ by GUARD.6.\n  - Answering 409 to a concurrent duplicate of a single-call operation:\
    \ rejected, because one-call transactions are short and waiting yields the replay\
    \ (inferred). 409 with `Retry-After` is the answer for multi-phase operations\
    \ (step 3, L546; review M3).\n  - Returning the current state (AIP-155): acceptable\
    \ for naturally idempotent updates, where the current state is the answer (inferred).\n\
    \  - The 10 s threshold: rejected for ACT.3's few-seconds threshold (MD-09).\n\
    \nRealizes: ALLOCATION.GUARD.6 (idempotency keys in the HTTP contract); ALLOCATION.ACT.3\
    \ (deferred operations in the HTTP contract)."
