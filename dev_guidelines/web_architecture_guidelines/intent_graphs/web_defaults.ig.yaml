- uid: PIG-WEB-TRANSVERSE.EVOLUTION.3
  name: Decision Records
  intent: Every architecturally significant decision is a short, numbered Markdown
    ADR in the repository it governs, with context, decision, status, consequences,
    alternatives with confidence and the reversing condition; accepted ADRs are superseded,
    never edited. Each decision the guideline leaves to the project (ASVS level, HSTS
    preload, secret delivery, replication, CDN) gets one.
  epistemic_state: known
  constraints:
  - One ADR per significant decision, one to two pages, in the repository it governs,
    numbered, in Markdown. Decisions binding every consumer of the shared database
    live with the database's codebase (inferred).
  - 'Fields: context with forces, decision, status, consequences, the alternatives
    with pros and cons, the confidence, and the condition that would reverse it (web-app-philosophy:TRANSVERSE.EVOLUTION.1).'
  - Accepted ADRs are never edited, only superseded.
  - 'The guideline leaves these decisions to each project, and each gets an ADR: the
    interface origin direction (MD-02); row-level security under MD-01''s three conditions;
    the ASVS level (SECURITY.1); secret delivery (SECURITY.4); process replication
    (TOPOLOGY.3); the CDN (TOPOLOGY.4); HSTS preload, under its condition (SECURITY.2);
    adding a managed secret store under the assumed hosting (SECURITY.4); a build
    platform held at SLSA Build L2 rather than L3 (SECURITY.5); every move of a Postgres-first
    role past its measured limit.'
  design_notes: 'Rows: L129, L130, L131, L132, L133.

    Positions: (consensus, one majority): one short ADR per architecturally significant
    decision (L129); title, context, decision, status, consequences (L130); in the
    repository, lightweight markup, numbered (L131); never edited once accepted, superseded
    (L132); serious alternatives with pros and cons and the confidence (L133, majority).

    Forces: shared understanding of costly decisions (J5 EVOLUTION.1), at the cost
    of writing them.

    Decision (lead): all five, in the form J5 requires.

    Rejected: decisions kept only in code or chat: never (L105, J5). Editing an accepted
    record: never (L132).

    Realizes: refines TRANSVERSE.EVOLUTION.1 (J5).

    Review fixes: M6 (HSTS preload added to the per-project ADRs); with M5 and m6,
    the L2 build-level exception and the secret-store addition, which those fixes
    make per-project decisions.'
  impl_pointers:
