- uid: PIG-WEB-TRANSVERSE.OPERABILITY.1
  name: Tracing and Logs
  intent: A W3C trace context follows each user interaction across every boundary,
    including job rows and the database transaction (trace id in a transaction-local
    setting beside the actor); logs are JSON on stdout carrying trace and span ids.
    Every trace is kept while volume allows, then tail sampling keeps every error
    and slow trace.
  epistemic_state: 'known | unvalidated: trace id in the transaction-local setting
    and on audit rows; trace context in job rows; keep-all then tail sampling'
  constraints:
  - 'One W3C trace context per user interaction: from the browser (OPERABILITY.2),
    through the backend, onto every outbound call, and into each job row so workers
    continue the trace (job carrier inferred).'
  - 'Into the database: the backend sets the trace id in a transaction-local setting
    in the reserved namespace, beside the actor. Writer functions and audit triggers
    write it on transition and history rows (a correlation id is required for agent
    actions; ACT.4). Inferred carrier; it gives the work MD-03 places in database
    functions the same id as the request. Owner-run jobs carry the ticket id in the
    statement comment.'
  - 'Logs: one JSON event per line on stdout, unbuffered, with trace and span id.
    Nothing secret or personal in logs or trace headers.'
  - 'Instrumentation: library instrumentation for the framework, HTTP clients and
    the Postgres driver; code spans only around business steps.'
  - 'Public and agent endpoints: an incoming traceparent from an unauthenticated or
    external caller is recorded but does not decide sampling.'
  - 'Sampling: every trace is kept while volume allows. When volume forces sampling,
    tail sampling keeps every error and slow trace. Logs still carry the trace id
    of every error.'
  - Server-Timing carries server and database time to authenticated and authorised
    audiences only.
  design_notes: "Rows: L369, L370, L371, L372, L373, L374, L375, L376. Cited: L566,\
    \ L658, L545, L036.\nPositions: - Sampling: P1 head sampling, simple and cheap,\
    \ cannot guarantee keeping error traces; P2 tail sampling keeps errors and slow\
    \ traces, stateful and harder to run; start with head, add tail with volume (L369,\
    \ \"start with head\" inferred; SRC-095 calls tail \"almost always necessary\"\
    \ at scale).\n  - Consensus: W3C traceparent across every boundary (L370); trace\
    \ and span id in every log record (L371); unbuffered stdout, routing by the environment\
    \ (L372); library instrumentation for framework, HTTP and database client, code\
    \ instrumentation for business logic only (L373); do not continue an untrusted\
    \ caller's sampling decision (L374); no personal data in trace headers (L375);\
    \ Server-Timing only to the audience that may see it (L376).\nForces: diagnosis\
    \ across tiers (J5 whole path), at the cost of propagation work. In sampling,\
    \ P2 serves keeping the traces that matter, at an operating cost; P1 serves simplicity\
    \ and loses error traces once it samples below 100%.\nDecision (lead): every consensus\
    \ practice, the trace carried into the database, and sampling that never drops\
    \ an error trace.\nRejected: head sampling at a ratio below 1: acceptable only\
    \ when the dropped traces are of successful, fast requests and every error is\
    \ still captured in logs with its trace id, and while tail sampling cannot be\
    \ operated (L369). Per-tier silos: never (L095, J5).\nRealizes: refines TRANSVERSE.OPERABILITY.1\
    \ (one correlation id into the transaction); rests on ACT.4 (role and actor recorded,\
    \ J1 R1-3) and GUARD.3 (actor setting)."
