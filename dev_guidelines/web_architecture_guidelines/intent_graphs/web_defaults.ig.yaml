- uid: PIG-WEB-TRANSVERSE.SECURITY.1
  name: Security Requirement Catalogue
  intent: 'ASVS 5.0 is the catalogue of verifiable security requirements, cited by
    versioned id, at a verification level recorded per project by risk: Level 2 by
    default, Level 3 for critical data, never Level 1. A catalogue without a recorded
    level cannot be verified, and the OWASP Top 10 stays an awareness map only.'
  epistemic_state: 'known: MD-05 | gap: ASVS chapter list not read (L304''s level
    part now grounded)'
  constraints:
  - ASVS 5.0 is the catalogue. Requirements are cited by their versioned id in this
    guideline's traces and in the project's tests and reviews.
  - 'The level is a recorded decision per project, by risk (EVOLUTION.3; the source''s
    own rule). Default: Level 2, the level the ASVS 5.0 text says most applications
    should strive for (grounded). The MD-03 context fits it: the application holds
    business data of several consumers and accepts writes from humans and agents.
    Level 3 when a breach would be critical (payments, health, safety; the source''s
    "highest levels of security", the examples inferred). Level 1 is never the default,
    consistent with the source''s "starting point".'
  - 'Each requirement is verified at the tier the placements name. Access control
    is checked where GUARD.3 puts it: writer functions for per-user write rules, the
    backend for product policy and identity, Postgres roles per consumer (MD-01, MD-03),
    database read functions for sensitive reads (MD-05); no access-control requirement
    is marked met on a stronger guarantee than that rule gives.'
  - Where a requirement has an automated check, it runs in the pipeline (OPERABILITY.6).
  design_notes: "Rows: L304 (ledger state open: level definitions and chapter list\
    \ not read from a T1 source upstream). The level definitions are now read from\
    \ the ASVS 5.0 text at tag v5.0.0 (by the TRANSVERSE review): Level 1 \"contains\
    \ the minimum requirements ... a critical starting point\"; Level 2: \"Most applications\
    \ should be striving to achieve this level of security\"; Level 3 \"should be\
    \ the goal for applications looking to demonstrate the highest levels of security\"\
    ; and an organisation \"should analyze its risks and decide what level\". The\
    \ chapter list stays unread.\nPositions: - P1 ASVS 5.0 as the catalogue of verifiable\
    \ requirements, cited by versioned id (for example v5.0.0-1.2.5), at a verification\
    \ level chosen by application risk (L304).\n  - P2 the OWASP Top 10 as the checklist\
    \ (L303, owned by TRANSVERSE.SECURITY; J5 kept it as the awareness map only).\n\
    Forces: P1 serves verifiability (each property testable and traceable), at a cost\
    \ scaled by the level. P2 serves awareness at low cost and is not testable.\n\
    Decision (lead): P1, as J5 requires (a verifiable catalogue at a risk-chosen level).\n\
    Rejected: P2 as the requirement set: never; it stays the awareness map (L303,\
