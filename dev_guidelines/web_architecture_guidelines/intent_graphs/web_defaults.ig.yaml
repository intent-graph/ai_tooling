- uid: PIG-WEB-LOGIC.SECURE.1
  name: Access Control Enforcement
  intent: Access control is one central policy module per backend, deny by default
    and object level, applied to every request whatever its origin; the backend's
    checks are kept in full because row-level security is off by default, and per-user
    write rules decidable from the row are decided by the writer function. Every rule
    has a denial test, and every denial goes to the security event log.
  epistemic_state: 'known: MD-05 | unvalidated: P3''s condition taken as met in the
    default context; collection predicates emitted by the policy module (inferred)'
  constraints:
  - One policy module per backend; middleware refuses any route that declares no permission.
  - Every use case calls the module with actor, action and object for each single
    object it reads or changes.
  - Collection reads apply a query predicate emitted by the policy module inside the
    read statement; never a check on rows already loaded.
  - Product roles for product policy not stored in the data, plus attribute and relationship
    rules evaluated on the object.
  - Setting an override flag on a blockable business rule is an action the policy
    module authorizes per actor; it never comes from client input unchecked and is
    audited with the actor.
  - The backend sets the verified actor for every database call.
  - Per-user write rules decidable from the row are decided by the writer function;
    the backend's identical check is generated from or tested against that function,
    and the function's named denial maps to the same response as the backend's.
  - 'Per-user read visibility (MD-05): simple reads that carry no logic (a basic select,
    a few joins) are written by each backend directly; a read that is sensitive, complex,
    high-impact, built by a function, or an abstraction several backends share goes
    through a database function that receives the verified actor, and per-user visibility
    rules count as sensitive reads. For per-user rules the table is not read directly
    by the roles that must not see every row.'
  - 'Roles: the reporting role reads comment content and comments with a narrower
    audience than their target only through database functions; the operator role
    (administrators, all-powerful by the maintainer''s model) sees every row; any
    other role that may SELECT the base tables sees every row unless its own role
    is restricted. Per-role grants bound which tables and columns a role sees, not
    which users'' rows; the change table, comments and notification rows follow the
    same rule.'
  - A denial test for every rule, at unit level and through the deployed stack against
    a live database under the backend's real role; shared-data tests run in never-committing
    transactions, commit-time behaviour in committing sessions in a disposable database.
  - Every denial goes to the security event log, a sink separate from the business
    audit, with alerting on bursts.
  - 'Forbidden: route- or role-only checks; per-view checks without one module; per-object
    checks on loaded collections; an override flag passed through from client input.'
  design_notes: "Positions: - P1 implement the authorization mechanism once, centrally\
    \ (filters or middleware), and apply it to every request whatever its origin (L305).\n\
    \  - P2 enforce object-level rules (record ownership), not only route or role\
    \ checks (L306).\n  - P3 prefer attribute- or relationship-based control over\
    \ plain role-based control when granularity or tenancy grows (L307; one T1 source,\
    \ no dissent).\n  - P4 test authorization with unit and integration tests including\
    \ denial cases; log access-control failures with alerting (L308).\n  - Placement\
    \ positions cited, settled by MD-01 in ROW_SECURITY: row security on every path\
    \ (L619), only with several consumers (L688), as a second line (L128).\n\nForces:\
    \ security (all positions); changeability of policy (P3's richer model against\
    \ plain roles); detection (P4).\n\nDecision: 1. **One policy module per backend,\
    \ deny by default** (P1; L020 via GUARD.3). Middleware refuses any route that\
    \ declares no permission; every use case calls the module with actor, action and\
    \ object for each single object it reads or changes (P2). For collection reads,\
    \ the module emits a query predicate that the read statement applies (ENFORCE.3),\
    \ never a check on rows already loaded, which would yield short pages and leak\
    \ counts (review m8; DERIVE.2). Central and object-level at once.\n     - **Overrides\
    \ of blockable rules** (L530, MAINT; review M7): a writer function's blockable\
    \ business rule can be overridden by an explicit flag. Setting that flag is an\
    \ action the policy module authorizes per actor, like any other; it never comes\
    \ from client input unchecked, and the override is audited with the actor (ACT.4).\
    \ The use case decides whether to set it (ENFORCE.1).\n  2. **Model**: product\
    \ roles for product policy not stored in the data, plus attribute and relationship\
    \ rules evaluated on the object (owner, author, assignee, plan, flag) (P3). The\
    \ default context already carries per-user rules, so P3's condition holds from\
    \ the start (inferred).\n  3. **Division with the database** (GUARD.3, ROW_SECURITY,\
    \ MD-01): no row-level security, so the backend's checks are kept in full. Per-user\
    \ write rules decidable from the row are decided by the writer function; the backend's\
    \ identical check is a copy generated from or tested against that function (RULES.1),\
    \ and the function's named denial maps to the same response as the backend's (EXPOSE.2).\
    \ The backend sets the verified actor for every call (ENFORCE.2; L311, L566).\n\
    \  4. **Per-user read visibility** (`decided by MD-05, read visibility of rows\
    \ with per-user rules when several backends share the database`): who filters\
    \ reads of rows that carry per-user rules (\"a draft is visible only to its author\"\
    ) is J1's open question (Q1), not re-asked here (X1).\n     - former recorded\
    \ default (superseded): **each backend filters these reads from one shared written\
    \ specification of the visibility rules, inside the read statement (ENFORCE.3),\
    \ with a shared denial-test suite every backend runs**. Row security stays excluded\
    \ by default (MD-01).\n     - J1's fallback, kept: database read functions that\
    \ receive the verified actor are acceptable when a per-user read rule must hold\
    \ for two or more backends (J1 Q1). **Under that answer** (review M1): the read\
    \ goes through the read function, run with the actor set (ENFORCE.2); the table\
    \ loses direct SELECT; this step's filter moves from the backend's statement into\
    \ the function. Note for J1's owner: the fallback's condition, two or more backends,\
    \ already holds in MD-03's default context, so a reader may take it as the fallback\
    \ winning by default; J1 should reword it.\n     - Consequence, stated so no line\
    \ claims more: Before the maintainer answered, the reporting role gets no SELECT\
    \ on comment content or narrower-audience comments, the operator role sees every\
    \ row, and any other role that may SELECT the base tables sees every row unless\
    \ its own role is restricted. Per-role grants bound which tables and columns a\
    \ role sees, not which users' rows.\n  5. **Tests and logs** (P4): a denial test\
    \ for every rule, at unit level and through the deployed stack against a live\
    \ database under the backend's real role, because the database's half of authorization\
    \ cannot be tested otherwise (ACT.1). Those tests run in never-committing transactions\
    \ when the database is shared; behaviour that only shows at commit is tested with\
    \ committing sessions in a disposable database, never a shared one (X4). Every\
    \ denial goes to the security event log, a sink separate from the business audit\
    \ (ACT.4), with alerting on bursts (mechanics owned by PIG-WEB-TRANSVERSE.OPERABILITY.4).\n\
    \nRejected: - Route- or role-only checks: never (P2).\n  - Checks written per\
    \ view without one module: never (P1).\n  - Plain role-based control: acceptable\
    \ when no rule depends on an object's attributes or relations (inverse of P3's\
    \ condition; inferred); not this context.\n  - Row-level security by default,\
    \ or replacing backend checks: never by default (MD-01); acceptable when MD-01's\
    \ three conditions hold, with the backend checks kept (L128).\n  - Per-object\
    \ checks on loaded rows for collections: never (DERIVE.2; review m8).\n  - An\
    \ override flag passed through from client input: never (L530, GUARD.3; review\
    \ M7).\n\nRealizes: PIG-WEB-ALLOCATION.ROW_SECURITY (keeps the backend checks,\
    \ as the placement sets). Follows ALLOCATION.GUARD.3 (no skeleton link; proposed).\n\
    \nMaintainer answer MD-05: simple reads are written by each backend directly;\
    \ sensitive, complex, high-impact, function-built or shared reads go through database\
    \ functions; per-user visibility rules are sensitive. Interim comment rule decided:\
    \ the reporting role reads comment content and narrower-audience comments only\
    \ through database functions; the operator role sees every row; other roles see\
    \ every row unless their own role is restricted."
