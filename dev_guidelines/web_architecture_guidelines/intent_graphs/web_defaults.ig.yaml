- uid: PIG-WEB-TRANSVERSE.OPERABILITY.6
  name: Delivery and Configuration
  intent: Settings load once into a typed, validated object; behaviour config is versioned
    and promoted with the release, deploy-specific values are per deploy, secrets
    come from the store. A staged pipeline runs drift and catalogue gates first, and
    the owner role's migrations ship before dependent consumers and stay additive
    across the compatibility window.
  epistemic_state: 'known | conflict: L251 contested, reconciled by kind of value
    | unvalidated: migration release order across separately deployed consumers'
  constraints:
  - 'Settings: one typed, validated object built at start and injected. With Django,
    the settings module reads it from the environment (framework choice is PIG-WEB-LOGIC.ENFORCE.5''s).'
  - Config that changes behaviour (limits, defaults, toggle defaults) is versioned,
    reviewed and promoted with the release. Deploy-specific values (addresses, credential
    references) are independent variables per deploy. Secrets come from the store
    (SECURITY.4). Reconciled between the two sources' positions; inferred.
  - 'Release gates: debug off and the framework''s deploy check run in the pipeline.'
  - 'Pipeline stages: first lint, unit tests, the interface drift gate (MD-02) and
    the catalogue diff (DB_API); then integration on real Postgres and the consumer
    suites (CONTRACTS.1); then the few end-to-end tests.'
  - 'Migrations: the shared database''s migrations are released before any consumer
    release that depends on them, once, in one process. They stay additive through
    the window, with removals only in the contract phase once no consumer role uses
    the old object. "Deployed together" stays acceptable only when every consumer
    of the changed object ships in the same deployment as the migration (the narrowing
    is counted at PIG-WEB-DATA.INTERFACE.1). Static assets are collected at build
    into the artifact, not at release.'
  - 'Toggles: release toggles are short-lived, each with a removal task created with
    it.'
  design_notes: "Rows: L247, L248, L249, L250, L251, L403, L404, L405. Cited: L101,\
    \ L047, L519.\nPositions: - App construction: explicit factory with injected settings\
    \ (L247, majority: Flask, FastAPI); Django selects a settings module per deploy.\n\
    \  - Variables: P1 independent per deploy (L248, Twelve-Factor); P2 grouped into\
    \ named environments (Django checklist, FastAPI .env).\n  - Settings loaded once\
    \ into a typed, validated object at start (L249). Secrets outside source, debug\
    \ off, the framework's deploy check before release (L250).\n  - Non-secret config:\
    \ P3 environment variables only (Twelve-Factor); P4 reviewed, version-controlled\
    \ config promoted with the release (Google SRE) (L251, contested; reconciliation\
    \ inferred).\n  - Staged pipeline, fast first stages, thorough later stages (L403).\
    \ Feature toggles decouple deploy from release; release toggles are short-lived\
    \ with a removal task (L404). One-time steps run once per release, in one process,\
    \ before the workers start (L405).\nForces: P4 serves review and reproducibility\
    \ of behaviour; P3 serves keeping deploy-specific values out of code. P1 serves\
    \ independent deploys; P2 serves convenience.\nDecision (lead): P1 and P4 split\
    \ by kind of value, and the delivery practices extended to the shared database.\n\
    Rejected: P2 named environment groupings: acceptable for local development files\
    \ (inferred). P3 for behaviour config: acceptable when that config never changes\
    \ between releases of the same build (inferred). Schema changes run by each backend's\
    \ deploy: never under MD-03 (one owner of the database, L515).\nRealizes: refines\
    \ TRANSVERSE.OPERABILITY.3 (J5: database changes inside the pipeline); rests on\
    \ RECORD.2, RECORD.3, DB_API, MD-02.\nReview fixes: M1 and X2 (lockstep condition\
    \ stated word for word; the narrowing realized here is cited, not counted)."
