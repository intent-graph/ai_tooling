- uid: PIG-WEB-TRANSVERSE.TOPOLOGY
  name: Runtime Topology
  intent: One buffering reverse proxy is the only public entry and terminates TLS;
    a WSGI server with sync workers runs under a process manager, with threaded workers,
    ASGI or a short timeout for routes that make blocking external calls, and ASGI
    for long-lived connections. Web and worker processes start from one image under
    a supervisor; static assets are built once, fingerprinted and served outside Python.
  epistemic_state: 'known | gap: owns no row (roll-up)'
  constraints:
  - One buffering reverse proxy is the only public entry, terminating TLS.
  - A WSGI server with sync workers runs under a process manager by default; routes
    that make blocking external calls in the request (the identity provider's code
    exchange at login included) run with threaded workers or on the ASGI process type,
    or carry a short timeout; ASGI serves long-lived connections.
  - Web and worker processes come from the same image, under a supervisor, as an unprivileged
    account.
  - Static assets are built once, fingerprinted and served outside Python, with a
    CDN added on a measured need.
  design_notes: 'Rows: none (roll-up).

