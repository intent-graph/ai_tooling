- uid: PIG-WEB-DATA.CONCURRENCY.4
  name: Atomic Statements
  intent: An inseparable change is one statement, or separate statements inside one
    transaction when one must see another's effect, and re-runnable work is idempotent
    by form (absolute assignments, upserts, self-limiting predicates). Operations
    behind a recorded idempotency key may use relative updates, and insert-or-update
    is ON CONFLICT DO UPDATE, never select-then-branch.
  epistemic_state: 'known | unvalidated: the keyed-operation exception to L587 is
    inferred'
  constraints:
  - 'Inseparable changes: one statement when no step must observe another; separate
    statements inside one transaction, that is inside one writer function, when one
    must. In a writer function both forms are atomic; the single statement is required
    where statements run in their own transactions (batch jobs).'
  - 'Re-runnable work (jobs, migrations, deliveries, anything retried without a recorded
    key) is idempotent by form: absolute assignments, upserts, conflict-ignoring inserts,
    self-limiting predicates.'
  - Keyed operations (behind an idempotency key recorded in the same transaction,
    web-app-philosophy:ALLOCATION.GUARD.6) may use atomic relative updates such as
    `n = n + 1`, because the key prevents a second execution (inferred).
  - Upserts by `ON CONFLICT DO UPDATE`; never select-then-branch, which also fails
    under Serializable as a unique violation after a "key absent" check.
  design_notes: "Question: which changes are expressed as single idempotent statements.\n\
    Positions: L585 inseparable changes are one statement (a move is one data-modifying\
    \ statement, never an insert then a delete), because a sharded job runs each statement\
    \ in its own transaction (MAINT); L586 sibling data-modifying subqueries share\
    \ a snapshot; a step that must see another's effect is a separate statement in\
    \ one transaction (MAINT); L587 mutations idempotent: absolute assignments, upserts,\
    \ conflict-ignoring inserts, self-limiting predicates (MAINT); L588 \"insert or\
    \ update\" as `INSERT ... ON CONFLICT DO UPDATE`, not select-then-branch. Tension\
    \ inside the evidence: L572 recommends the atomic increment (`n = n + 1`), which\
    \ L587's absolute assignment excludes.\nForces: atomicity and safe re-execution\
    \ (integrity) against expressiveness.\nDecision and grounds: all adopted (MAINT\
    \ and research, max), with the tension resolved by where a mutation can be re-run.\n\
    \  - Inseparable changes: one statement when no step must observe another (L585);\
    \ separate statements inside one transaction, that is inside one writer function,\
    \ when one must (L586). In a writer function both forms are atomic; L585's single\
    \ statement is required where statements run in their own transactions (batch\
    \ jobs, L543).\n  - Re-runnable work (jobs, migrations, deliveries, anything retried\
    \ without a recorded key) is idempotent by form: absolute assignments, upserts,\
    \ conflict-ignoring inserts, self-limiting predicates (L587).\n  - Keyed operations\
    \ (behind an idempotency key recorded in the same transaction, J1 GUARD.6) may\
    \ use atomic relative updates such as `n = n + 1` (L572), because the key prevents\
    \ a second execution (inferred).\n  - Upserts by `ON CONFLICT DO UPDATE` (L588);\
    \ never select-then-branch, which also fails under Serializable as a unique violation\
    \ after a \"key absent\" check (L573).\nRejected: two statements for an inseparable\
    \ change outside one transaction: never (L585). Select-then-branch: never (L588).\
    \ Relative updates in re-runnable work without a key: rejected (L587).\nRealizes:\
    \ web-app-philosophy:ALLOCATION.GUARD.6 (mutations as idempotent statements);\
    \ ALLOCATION.ACT.3 (batch jobs)."
