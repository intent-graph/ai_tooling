- uid: PIG-WEB-LOGIC.PROCESS.4
  name: File Upload Path
  intent: File bytes go directly from the browser to object storage under a constrained
    POST policy that the backend issues after authorizing the uploader, so synchronous
    workers are not tied to transfers; the bytes are checked after arrival by the
    scanning path and nobody can read them before. Through the application is acceptable
    when a small file's content must be read within the same request.
  epistemic_state: 'known | unvalidated: direct as the default (no source weighs the
    two, L421); the HTML form posting to storage (inferred) | gap: whether a presigned
    PUT can bound size was not verified (L423)'
  constraints:
  - 'Direct to object storage is the default path: the backend authorizes the uploader,
    records a pending upload row through an API function, and issues a POST policy
    for one random, server-chosen key with a content-length range, an exact content
    type, a key prefix and a short expiry.'
  - 'The signed policy is the one kind of credential allowed in a URL or form target;
    scope: one upload to one key under the policy''s limits; lifetime: minutes, the
    value recorded per project.'
  - 'Large files: multipart or resumable upload with checksums; a lifecycle rule deletes
    incomplete uploads.'
  - 'The endpoint that issues the policy carries the gates: authentication, authorization,
    CSRF, size and filename limits; archives are checked for post-decompression size
    by the scanner.'
  - 'Through the application only when a small file''s content must be read within
    the same request: then streamed, with body-size limits at the proxy and in the
    framework, and the same gates.'
  - 'Forbidden: an unconstrained presigned URL when storage must enforce limits.'
  design_notes: "Positions: - P1 bytes travel from the browser directly to object\
    \ storage; the application authorizes and issues a short-lived credential (L421;\
    \ a capability in vendor documentation, the load benefit inferred).\n  - P2 bytes\
    \ travel through the application, which streams, validates and stores them (L421;\
    \ OWASP and framework documentation assume it).\n  - P3 L421's own split: direct\
    \ for large or numerous files, through the application for small files that need\
    \ synchronous validation; no source weighs the two, the size threshold is open.\n\
    \  - P4 a presigned URL is a bearer token: a random key chosen by the server,\
    \ one operation on one key, a short expiry, the requester authorized first (L422).\n\
    \  - P5 when storage must enforce limits on a browser upload, a POST policy with\
    \ a content-length range, an exact content type and a key prefix (L423).\n  -\
    \ P6 multipart or resumable upload for large files, checksums, and a lifecycle\
    \ rule that deletes incomplete uploads (L424).\n  - P7 gates on the upload endpoint:\
    \ authenticated and authorized uploaders, size and filename-length limits, post-decompression\
    \ size for archives, CSRF protection (L425).\n  - P8 stream uploads in the application\
    \ instead of reading them whole (Django `chunks()`, FastAPI `UploadFile`) (L426).\n\
    \  - P9 set the body-size limit in the web server as well as the framework (L427).\n\
    \nForces: security (validation, abuse); availability (synchronous workers not\
    \ held by transfers); latency of the user's feedback.\n\nDecision: **direct to\
    \ object storage is the default path for user files.**\n  1. The backend authorizes\
    \ the uploader (SECURE.1), records a pending upload row through an API function\
    \ (PROCESS.5), and issues a POST policy for one random server-chosen key with\
    \ a content-length range, an exact content type, a key prefix and a short expiry\
    \ (P4, P5). A plain HTML form can post to it, so the path needs no browser script\
    \ (inferred from P5). This signed policy is the one kind of credential allowed\
    \ in a URL or form target (X6), with its scope and lifetime stated: scope, one\
    \ upload to one key under the policy's limits; lifetime, minutes, the value recorded\
    \ per project (no source gives a number; L422's \"short expiry\" is itself inferred).\n\
    \  2. Large files: multipart or resumable with checksums; a lifecycle rule deletes\
    \ incomplete uploads (P6).\n  3. The bytes are checked after arrival by the scanning\
    \ path, and nobody can read them before (PROCESS.5), so synchronous validation\
    \ in the application adds no safety here (inferred).\n  4. The endpoint that issues\
    \ the policy carries the gates (P7): authentication, authorization, CSRF, size\
    \ and filename limits; archives are checked for post-decompression size by the\
    \ scanner.\n  - **Through the application** is acceptable when a small file's\
    \ content must be read within the same request (an import validated before the\
    \ response): then streamed (P8), with body-size limits at the proxy and in the\
    \ framework (P9), and the same gates (P7).\n\nRejected: through the application\
    \ as the default: it ties synchronous workers (ENFORCE.4) to transfers and puts\
    \ every byte through the backend; wins in the condition above (P3). An unconstrained\
    \ presigned URL when storage must enforce limits: never (P5).\n\nRealizes: no\
    \ skeleton link; follows ALLOCATION.GUARD.1 (every part of an upload untrusted,\
    \ L023 via J3) and GUARD.3."
