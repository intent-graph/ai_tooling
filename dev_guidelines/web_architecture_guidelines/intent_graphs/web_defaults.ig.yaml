- uid: PIG-WEB-LOGIC.PROCESS.1
  name: Background and Scheduled Jobs
  intent: Jobs are rows written by database functions in the transaction of the change
    that needs them and claimed by Python worker processes (a separate process type)
    through the job table's writer functions with `FOR UPDATE SKIP LOCKED`; pure data
    schedules run in the Postgres scheduler and a schedule that needs Python inserts
    a job row. Jobs are idempotent, short, named and monitored.
  epistemic_state: 'known | unvalidated: claim protocol with expiry through writer
    functions (inferred) | gap: no Python runner over a queue table written by database
    functions was read'
  constraints:
  - Job rows are written by the database function in the transaction of the change;
    Python worker processes, a separate process type, claim them with `FOR UPDATE
    SKIP LOCKED`.
  - 'Claim, outcome and expiry go through the job table''s writer functions: the claim
    function selects with `SKIP LOCKED` inside itself and marks the job running with
    an expiry in one short call; no transaction held over the work; a job past its
    expiry is claimable again; on SIGTERM the worker returns its job through the same
    functions.'
  - Pure data schedules run in the Postgres scheduler as calls to named functions;
    a schedule that needs Python inserts a job row.
  - Jobs take ids as arguments and re-fetch; are idempotent (delivery is at least
    once); never wait on another job, chaining by inserting the next job row.
  - Scheduled jobs are short, error-handled so every failure is recorded and visible,
    descriptively named, with no overlapping schedules, a documented expected duration
    and heavy work off-peak.
  - Monitor failures, duration, missed runs (no run within twice the interval) and
    backlog age.
  - In-process background work only for small work that may be lost.
  - 'A framework task backend that enqueues by its own insert from Python, outside
    the database function''s transaction, is not used for work that must not be lost.
    Which runner: open.'
  design_notes: "Positions: - P1 in-process background execution only for small tasks\
    \ that need the same process; a task queue for heavy, durable or multi-server\
    \ work; an async view in a WSGI Flask app cannot spawn tasks (L407).\n  - P2 Django's\
    \ task framework ships no worker and its built-in backends are for development\
    \ and testing; production needs a third-party backend and a separate worker (L408).\n\
    \  - P3 task arguments are small serializable data (ids), re-fetched inside the\
    \ task (L411).\n  - P4 a task never waits synchronously for another; chain instead\
    \ (L412).\n  - P5 a Postgres-backed queue claims rows with `FOR UPDATE SKIP LOCKED`,\
    \ which suits queue-like tables only (L413).\n  - P6 scheduled jobs are short,\
    \ idempotent, error-handled so a failure shows in the job history, descriptively\
    \ named, heavy work off-peak, with no overlapping schedules and a documented expected\
    \ duration; monitor failures, duration, missed runs (no run within twice the interval)\
    \ and backlog (L605, MAINT).\n  - Placement: JOB_HOST (queue table written by\
    \ the database function, claimed by Python workers; data schedules in the Postgres\
    \ scheduler; a schedule that needs Python inserts a job row; no enqueue outside\
    \ the data transaction; L126, L409, L604).\n\nForces: correctness (the job atomic\
    \ with its data); durability; changeability (one component fewer); scalability.\n\
    \nDecision: 1. **Host, as JOB_HOST sets**: job rows written by the database function\
    \ in the transaction of the change that needs them (MD-03); Python worker processes,\
    \ a separate process type (J3 LOGIC.PROCESS), claim them with `FOR UPDATE SKIP\
    \ LOCKED` (P5). Pure data schedules run in the Postgres scheduler as calls to\
    \ named functions (L604); a schedule that needs Python inserts a job row.\n  2.\
    \ **Claim protocol**: job status is a state column, so claim, outcome and expiry\
    \ go through the job table's writer functions (L596, MAINT; review m6). The claim\
    \ function selects with `FOR UPDATE SKIP LOCKED` inside itself and marks the job\
    \ running with an expiry, in one short call; the worker does the work with no\
    \ transaction held over it; it records the outcome through the outcome function;\
    \ a job whose expiry passes is claimable again; on SIGTERM the worker returns\
    \ its job through the same functions (L088 via J3) (inferred from L234, L410,\
    \ L088).\n  3. **Jobs**: ids as arguments, re-fetched (P3); idempotent, because\
    \ delivery is at least once (L410); never waiting on another job, chained by inserting\
    \ the next job row (P4); short, named, error-handled so every failure is recorded\
    \ and visible, no overlapping schedules, a documented expected duration, heavy\
    \ work off-peak (P6, max).\n  4. **Monitoring**: failures, duration, missed runs\
    \ (no run within twice the interval) and backlog age (P6); JOB_HOST's moving condition\
    \ (contention, backlog) is measured from these.\n  5. **In-process background\
    \ work**: only for small work that may be lost (P1, ACT.3).\n  6. **Library**:\
    \ any runner that claims from this table. A framework task backend that enqueues\
    \ by its own insert from Python, outside the database function's transaction,\
    \ is not used for work that must not be lost (L409, JOB_HOST). Which runner: open\
    \ (none read).\n\nRejected: a broker (Celery with Redis or RabbitMQ) from the\
    \ start: wins at measured lock contention, backlog or multi-server fan-out, and\
    \ then as a drain from the Postgres stage, never as an enqueue outside the data\
    \ transaction (JOB_HOST, L126). In-process tasks for durable work: never (P1).\
    \ Tasks blocking on tasks: never (P4).\n\nRealizes: PIG-WEB-ALLOCATION.JOB_HOST\
    \ (runs jobs and schedules on the host the placement names)."
