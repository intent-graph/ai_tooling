- uid: PIG-WEB-DATA.CONCURRENCY.5
  name: Sequences and Commit Order
  intent: 'Sequences are identifiers only: gaps are normal and no value leaves the
    database before commit; gapless business numbers come from a counter row updated
    in the business transaction. Readers that must see every row claim and mark rows
    with SKIP LOCKED, or use an xid8 column and the snapshot horizon where a cursor
    is needed, never a bare id or timestamp cursor.'
  epistemic_state: 'known | unvalidated: claim-and-mark as avoiding the hazard, and
    timestamp cursors under the same rule, are inferred; the polling hazard rests
    on one T3 source'
  constraints:
  - 'Sequences are identifiers only: gaps are normal, never a business count; no value
    leaves the database before commit.'
  - Gapless business numbers (invoices) come from a counter row updated by the writer
    function in the business transaction, accepting serialized writers for that series.
  - 'Readers that must see every row: first, avoid cursors where a claim-and-mark
    design works: queue and outbox rows are claimed with SKIP LOCKED and marked or
    deleted when processed, so every unprocessed row is seen whatever its id (inferred
    that the sequence-order hazard does not arise). Where a cursor is needed (an ordered
    feed to an outside consumer, an incremental export), position (a): an `xid8` column
    and the snapshot horizon filter, a guarantee where (b) is a heuristic wait. Timestamp
    cursors follow the same rule; never a bare `updated_at > last` cursor (inferred).'
  design_notes: "Question: what sequences guarantee and how readers follow rows in\
    \ commit order.\nPositions:\n  - L591 sequences are non-transactional: gaps are\
    \ normal; no gapless numbering from a sequence.\n  - L592 no sequence value exposed\
    \ outside the database before commit.\n  - L593 gapless business numbers from\
    \ a counter row updated inside the business transaction, serializing writers.\n\
    \  - L594 a sequence id does not reflect commit order: a reader polling `id >\
    \ last_seen` can skip a late row forever. Positions: (a) read only rows from transactions\
    \ older than the oldest in flight (`xid8` column against `pg_snapshot_xmin(pg_current_snapshot())`),\
    \ order then follows transaction start (SRC-351 T3, mechanism T1); (b) gap detection\
    \ with a high-water mark and a wait (non-trivial); (c) a locked counter table\
    \ (serializes all writers; rejected by the source). Same hazard plausibly for\
    \ `updated_at` cursors (inferred).\n  - L595 SKIP LOCKED gives an inconsistent\
    \ view, for queues only; under Read Committed ORDER BY with a locking clause can\
    \ return rows out of order.\nForces: correctness of readers that must see every\
    \ row (outbox relays, change feeds, exports, cache workers) against write concurrency.\n\
    Decision and grounds:\n  - Sequences are identifiers only: gaps are normal, never\
    \ a business count; no value leaves the database before commit (L591, L592).\n\
    \  - Gapless business numbers (invoices) come from a counter row updated by the\
    \ writer function in the business transaction, accepting serialized writers for\
    \ that series (L593).\n  - Readers that must see every row: first, avoid cursors\
    \ where a claim-and-mark design works: queue and outbox rows are claimed with\
    \ SKIP LOCKED and marked or deleted when processed, so every unprocessed row is\
    \ seen whatever its id (L413, L595, L409; inferred that the hazard of L594 does\
    \ not arise). Where a cursor is needed (an ordered feed to an outside consumer,\
    \ an incremental export), position (a): an `xid8` column and the snapshot horizon\
    \ filter (L594, mechanism T1, max: it is a guarantee, where (b) is a heuristic\
    \ wait). Timestamp cursors follow the same rule; never a bare `updated_at > last`\
    \ cursor (L594, inferred).\nRejected: (b) gap detection: rejected; acceptable\
    \ when the reader cannot add a column to the source table and tolerates a bounded\
    \ wait. (c) a locked counter for ordering: rejected (L594); it is kept only for\
    \ gapless business numbers (L593). Bare id or timestamp cursors: never.\nRealizes:\
    \ ALLOCATION.ACT.2 (outbox relay reads, with J7's PROCESS.2); ALLOCATION.DERIVE.1\
    \ (cache workers); ALLOCATION.GUARD.5. Link proposed, not created: CONCURRENCY.5\
    \ realizes ALLOCATION.ACT.2."
