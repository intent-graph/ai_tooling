- uid: PIG-WEB-TRANSVERSE.TOPOLOGY.4
  name: Static Assets and CDN
  intent: Assets are built once into the release artifact with fingerprinted names
    and served by the proxy with long-lived immutable caching and compression; fingerprinted
    files of previous releases stay available for the compatibility window. A CDN
    is added only when users are distant or origin load justifies it, and micro-caches
    only anonymous, nonce-free responses.
  epistemic_state: 'known: MD-06 | unvalidated: cumulative asset store across the
    compatibility window; CDN threshold (L165)'
  constraints:
  - Assets are built and collected once into the release artifact, with fingerprinted
    names. The proxy serves them with long-lived immutable caching and compression.
  - Fingerprinted files of previous releases stay available for the compatibility
    window, as long as an old page can stay open. The asset store is cumulative across
    releases and pruned after the window (inferred).
  - A CDN is added when users are distant or origin load justifies it. It caches fingerprinted
    files for the long term. It micro-caches only anonymous responses carrying no
    nonce and no personal data (SECURITY.3).
  - The static-file default is the self-managed route of MD-06 (the proxy on the application
    host serves them); on an orchestrated platform the platform's edge or object store
    may serve the built assets, with the fingerprinting and window rules unchanged
    (inferred).
  design_notes: "Rows: L161, L162, L163, L164, L165, L166, L167. Cited: L009, L101.\n\
    Positions: - Where to serve (L161, majority): P1 from the proxy on the application\
    \ host; P2 a dedicated static server; P3 object storage behind a CDN; P4 in-app\
    \ (WhiteNoise-style) behind a CDN (L164, single T3).\n  - Consensus: collect into\
    \ one directory, serve outside Python request handlers (L162); hashed file names\
    \ rewritten inside CSS and JS (L163); compress at proxy or CDN (L167).\n  - CDN:\
    \ optional, added for distant users or origin load (L165, threshold inferred);\
    \ long-term caching of fingerprinted files, seconds-long micro-caching of anonymous\
    \ dynamic responses, hit ratio watched (L166).\nForces: P1 serves simplicity on\
    \ one region. P3 serves distant users and origin load, at the cost of another\
    \ service. P4 serves platforms without a proxy, and needs a CDN in front.\nDecision\
    \ (lead): P1 by default, with fingerprinting, compression and a kept asset history.\n\
    Rejected: P3: wins when users are geographically distant or origin load is measured\
    \ too high (L165). P4: acceptable on a platform without a proxy, always behind\
    \ a CDN (L164). Serving static files through Python handlers without a CDN: never\
    \ in production (L162).\nRealizes: refines LOGIC.PROCESS through TOPOLOGY; realizes\
    \ J4's hand-offs from INTERACTION.ENVIRONMENT.3 and .4.\n\nMaintainer answer MD-06\
    \ applies: hosting is a per-project choice; the proxy-served default is the self-managed\
    \ route."
