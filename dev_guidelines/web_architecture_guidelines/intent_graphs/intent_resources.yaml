name: "Web Architecture Guidelines Intent Graphs"
description: "Web-app philosophy (product) + JavaScript/Python/Postgres architecture defaults (projection)."

product:
  - id: web-app-philosophy
    name: "Web App Philosophy"
    description: "Stack-neutral principles: allocation of responsibilities across tiers, then data, logic, interaction, transverse."
    file: "web_app_philosophy.ig.yaml"
  - id: python-kb-philosophy
    name: "Python KB Philosophy"
    description: "Eight foundational principles of the Python guidelines; shared principles link to it."
    file: "../../python_guidelines/intent_graphs/python_kb_philosophy.yaml"
  - id: software-development-philosophy
    name: "Software Development Philosophy"
    description: "Stack-neutral software development principles (ownership, assurance, construction, change flow, operation, evolution, transverse); stack-specific nodes link to it."
    file: "../../software_development_guidelines/intent_graphs/software_development_philosophy.ig.yaml"

projection_by_target:
  web:
    - id: pig-web-defaults
      name: "Web defaults"
      description: "Architecture defaults for JavaScript + Python + Postgres (PIG-WEB.*)."
      file: "web_defaults.ig.yaml"
