operations:
- op: node.set
  uid: PIG-WEB-LOGIC.SECURE.7
  intent: 'Every server-side fetch of a client- or agent-named URL goes through one fetch helper that refuses private, loopback and link-local addresses, checks the address actually connected to, validates every redirect hop the same way, so a client cannot make the server reach internal services or metadata endpoints. Where the hosting can enforce outbound rules, a network guard backs the helper: an egress proxy with direct egress blocked, or rules that deny the application those ranges.'
  constraints:
  - One fetch helper for every fetch of a client- or agent-named URL.
  - Refuse private, loopback and link-local ranges, checking the address actually connected to rather than the hostname.
  - Validate every redirect hop the same way.
  - 'Network guard, preferred: where the hosting can enforce outbound rules, fetches leave through an egress proxy with direct egress blocked, or outbound rules deny the application''s processes the private, loopback, link-local and metadata ranges. It is required when the server''s network holds internal services or a metadata endpoint that answers without a token. Where the hosting cannot enforce outbound rules, the helper is the guard.'
  - Run with a timeout and a size cap, and in a worker when the response does not need the result.
  - 'Forbidden: fetching without range checks.'
  epistemic_state: 'known | unvalidated: connect-time address check inferred; the network guard''s ''required when'' condition inferred'
  design_notes: 'Positions: one. P1 any server-side fetch of an agent- or client-supplied URL blocks private, loopback and link-local ranges, validates each redirect hop and preferably goes through an egress proxy (L662).


    Forces: security (requests forged toward internal services and metadata endpoints) against the function itself (metadata documents, webhooks, link previews).


    (superseded by MD-09) Decision: every fetch of a client- or agent-named URL goes through one fetch helper that refuses private, loopback and link-local addresses, checking the address actually connected to rather than the hostname (inferred), validates every redirect hop the same way, and leaves through an egress proxy: P1''s "preferably" made required (max). The helper runs with a timeout and a size cap (PROCESS.3, SECURE.6), and in a worker when the response does not need the result (ACT.3, a foreign effect) (inferred).


    (superseded by MD-09) Rejected: fetching without range checks: never (P1). Direct egress without a proxy: acceptable when the deployment has no egress proxy; the helper''s checks are then the only guard (inferred).


    Realizes: no skeleton link; follows ALLOCATION.RULES.3 (client-supplied input never decides).


    Corrected by MD-09 (re-audit under MD-08): the helper is the required control and the network guard is preferred. A proxy adds a guarantee only when direct egress is blocked; it is required only where an internal service or an unprotected metadata endpoint is reachable (inferred). Rejected: a proxy required for every deployment: wins when the server''s network holds internal services or a token-less metadata endpoint. Fetching without range checks: never.'
- op: node.set
  uid: PIG-WEB-INTERACTION.AGENT.3
  intent: An agent has its own identity and acts for a user, with tokens carrying subject and actor so both are recorded in logs and in the database; agent-originated writes are marked as a class. Tokens are short-lived and audience-bound, sender-constrained wherever the client can hold a key, and every agent credential has an owner, is revocable and has a lifecycle; a bearer-only client reaches consequential operations only through the owning user's exact-action approval.
  constraints:
  - An agent has its own identity and acts for a user; tokens carry the subject and the actor (act claim or its documented equivalent), so downstream services and logs see both and any chain.
  - 'Both identities reach the database: the backend asserts the user and the agent as the claimed actor in the transaction-local setting, checked against the backend''s role and recorded with the session role; agent-originated writes are marked as a class.'
  - 'Token binding by client capability: tokens are short-lived and audience-bound for every scope. They are sender-constrained (DPoP or mutual TLS) for every client that can hold a key, and the authorization server issues bound tokens to every client that supports them. A client that can hold only bearer tokens keeps consequential scopes, under three conditions: its tokens are short-lived and narrow, revocation is held on the server, and every consequential operation it requests runs only through the exact-action approval of .4, which the writer function checks (inferred). For a bearer-only client, an approved effect whose result returns to the caller (a bulk export) is delivered to the approving user in the application, not to the token holder (inferred).'
  - 'Consequential operations bound to their details: Rich Authorization Requests where the authorization server supports them; otherwise the exact-action approval of .4 binds the operation (inferred substitution).'
  - 'Credential lifecycle (GUARD.4): one revocable credential per agent, a recorded sponsor, short lifetimes, and removal that leaves no orphaned permission.'
  epistemic_state: 'known | unvalidated: "both is the max" inferred (L638); agent parameters of RFC 8693 open (L639); L643 inferred for agents; bearer-only path through approval inferred; sender-constraining support across agent hosts not read'
  design_notes: 'Decides: how an agent identity, its delegating user and its credentials are represented and recorded.

    Rows: L638, L639, L641, L643, L659, L660. Cited: L022, L311, L566 (MAINT), L685, L658, R1-3 of the J1 records.

    Positions: identity (L638): P1 the agent is the user (user token); P2 the agent has its own identity and permissions; P3 the agent acts for a user with both recorded, the strongest as a delegated token carrying both (RFC 8693 act, L639). Token binding (L641, contested): P4 short-lived, sender-constrained tokens (DPoP or mutual TLS); P5 plain bearer tokens, short-lived and narrow. P6 authorization bound to the transaction details for consequential operations (Rich Authorization Requests, L643, inferred for agents). P7 agent-originated writes marked in the data (actor type and id next to the user) (L659). P8 agent credentials with an owner and a lifecycle: short-lived, one revocable credential per agent, recorded sponsor, removal without orphaned permissions (L660).

    Forces: P3 serves audit and least privilege at the cost of design; P1 serves simplicity and loses attribution. P4 serves theft resistance at the cost of client complexity; P5 serves interoperability with today''s agent clients. P6 serves least privilege on irreversible actions at the cost of authorization-server support. P7 and P8 serve review, undo and containment.

    Decision (the rules are the constraints):

    (superseded by MD-09) Rejected: P1: acceptable for a personal tool where the user and the agent are the same accountable party and no consequential scope is granted (L638 a). P2 alone: wins for unattended automation with no delegating user (L638 b), still recorded as the actor. P5 for consequential scopes: wins never; acceptable for the rest. P4 for every scope: wins when every agent client can hold a key (L641).

    Realizes: ALLOCATION.GUARD.4 (skeleton link); ALLOCATION.ACT.4 (proposed: both identities in the audit, L658); ALLOCATION.GUARD.3 (actor assertion, R1-3).

    Hand-offs: actor columns and history (PIG-WEB-DATA.MAINTAIN.3, L685); token issuance (PIG-WEB-LOGIC.SECURE.4).


    Corrected by MD-09 (re-audit under MD-08): sender-constrained tokens wherever the client can hold a key; otherwise short-lived, revocable bearer tokens with every consequential action behind the owner''s exact-action approval. Rejected: sender-constraining required for consequential scopes: wins when every client that needs those scopes can hold a key (a closed or certified set of agents), or when an approved effect''s result must return to the token holder and cannot be delivered in the application. Bearer tokens for consequential scopes without the server-held approval: never.'
- op: node.set
  uid: PIG-WEB-INTERACTION.AGENT
  constraints:
  - 'Surface and Protocol: one HTTP core described by OpenAPI, always in sync (MD-02), with an MCP adapter over it for third-party agent hosts whose tool list and schemas have one origin, a CI drift gate and additive evolution under the compatibility window; a stateless surface over OAuth.'
  - 'Discovery and Registration: protected-resource metadata, verifiable client identity, client ID metadata documents.'
  - 'Identity and Delegation: agents with their own identity acting for a user, both recorded, short-lived credentials with an owner, sender-constrained tokens wherever the client can hold a key, and consequential operations of bearer-only clients only through server-held approval.'
  - 'Approval and Injection Defense: irreversible or external effects approved by the owning user on the application''s own page and checked on the server, credentials collected out of band, structural injection defence.'
  - 'Agent-Shaped Responses and Limits: problem-detail errors, agent-shaped responses, quotas per agent within the user''s allowance, and scarce-goods flows that a human completes or agents are excluded from.'
- op: node.set
  uid: PIG-WEB-INTERACTION.AGENT.4
  constraints:
  - Reads and reversible writes proceed, authorized as every request is (GUARD.3).
  - 'Irreversible or external effects (the consequential list of .3) need approval by the user who owns the authority, shown the exact action, on the application''s own page (realized out of band): the agent''s call creates a pending operation with its exact parameters; the user approves it in the application, authenticated by their own session; the writer function that performs the effect refuses an agent-originated operation without a matching approval by the delegating user (a rule decidable from the stored rows and the actor, so the writer function''s under GUARD.3; inferred). An approval dialog in the agent host is a client hint, never the gate; for a bearer-only client this approval is the gate for consequential operations.'
  - 'Approvals stay rare by scoping: only irreversible or external effects ask, so fatigue does not erode them (inferred from a reported 93% approval rate under frequent prompts).'
  - Credentials, payment details and third-party authorization are collected on the application's own page, bound to the user who started the flow, never through the agent.
  - 'Injection is contained structurally: few purpose-specific tools, no agent session the application runs holds untrusted input, private data and outward power together, filters only as an extra layer.'
  - 'No client hint is enforcement: annotations, claimed identity and client names are untrusted.'
- op: node.set
  uid: PIG-WEB-LOGIC.SECURE.4
  intent: Login is delegated to an OpenID Connect server (an external provider or a self-run one), with the Python backend as the confidential backend-for-frontend client using the code flow with PKCE, then an opaque server session; the authentication context required for privileged accounts and step-up is requested and verified. Agents hold short-lived, audience-bound, revocable tokens, and every JWT is verified with pinned algorithms.
  constraints:
  - Login is delegated to an OpenID Connect server, recorded as a decision; an own credential store only when no such server can be used or run.
  - 'The backend is the confidential client (backend-for-frontend): code flow with PKCE, exact redirect-URI match, no open redirector, ID token validated (issuer, audience, expiry, nonce); provider tokens never reach the browser.'
  - The backend requests the authentication context required for privileged accounts (`acr_values`, or a provider MFA policy yielding a known `amr`) and refuses a login of such an account whose ID token lacks it; sensitive operations require a fresh, sufficient context (`max_age`, `auth_time`) for every account.
  - Local identity keyed by issuer plus subject, never by e-mail; reauthenticate before any link change.
  - Agent tokens are issued for this server only (audience), short-lived and revocable; code flow with PKCE when acting for a human, client credentials when acting on their own; refresh tokens rotated or sender-constrained; access tokens sender-constrained (DPoP or mutual TLS) wherever supported.
  - Every JWT verified with pinned algorithms, `none` rejected, issuer, subject and audience checked, explicit `typ`.
  - Downstream calls use the backend's own token, never a forwarded one; an ID token is never an API credential.
  - No session token, bearer token or long-lived credential in a URL; the single-use authorization code in the redirect is not one.
  - 'Forbidden: implicit grant, password grant, shared static keys for agents (static keys only for short scripts), tokens held by browser JavaScript, accepting a login without checking the asserted authentication context.'
  design_notes: "Positions: - P1 choose explicitly between delegating login to an external identity provider (OAuth 2, OpenID Connect, SAML) and operating an own credential store, and record the choice; no source ranks them (L338).\n  - P2 the authorization code grant with PKCE, never the implicit grant; for agents acting for a human, the code flow with PKCE, exact redirect match, HTTPS; client credentials for agents acting on their own behalf; static keys only for short scripts (L339).\n  - P3 redirect URIs matched by exact string, no open redirectors (L340).\n  - P4 rotate or sender-constrain the refresh tokens of public clients; sender-constrain access tokens (mutual TLS or DPoP) (L341).\n  - P5 validate the OpenID Connect ID token: issuer, audience containing the client id, expiry, nonce (L342).\n  - P6 link federated identities by issuer plus subject, never by e-mail; reauthenticate before changing links (L343).\n  - P7 a JWT verifier pins accepted algorithms, rejects `none`, validates issuer, subject and audience, and keeps token kinds distinguishable (L312).\n  - Cited: backend-for-frontend when login goes through a provider (L313, GUARD.4); a server accepts only tokens issued for it and never forwards a client's token (L640); an ID token is never an API credential (L021 via J3).\n\nForces: security (credential handling, token theft, token confusion); the cost and availability of an external dependency (P1's other side).\n\nDecision: 1. **Login is delegated to an OpenID Connect server**, recorded as a decision (P1): an external identity provider or a self-run OpenID Connect server, which removes cost and data-residency objections to a provider (review m11). Grounds: the backend then stores no password, and MFA, phishing-resistant authenticators and breached-password checks (SECURE.5) come from a service built for them; agents as users need OAuth authorization anyway (P2's agent half), which such a server supplies, while an own credential store would also need an own authorization server for agents (inferred).\n  2. **The Python backend is the confidential client, backend-for-frontend** (L313, GUARD.4): code flow with PKCE (P2), exact redirect URIs and no open redirector (P3), ID token validated (P5), then an opaque server session (SECURE.2). Provider tokens never reach the browser. The authorization code in the redirect is single-use, short-lived and bound to PKCE, not a session or bearer token; no session token, bearer token or long-lived credential ever travels in a URL (X6).\n  3. (superseded by MD-09) **The authentication context is verified, not assumed** (review M6; inferred from OpenID Connect Core 1.0, not in the ledger): the backend requests the required context (`acr_values`, or the provider's MFA policy that yields a known `amr`) and refuses a login whose ID token lacks it; for sensitive operations it requires a fresh, sufficient context (step-up with `max_age`, checking `auth_time`). Without this check a provider policy change could drop MFA while every other check passes, which is deciding on the caller's word (J3 LOGIC.SECURE).\n  4. **Local identity** keyed by issuer plus subject; reauthentication before any link change (P6).\n  5. **Agents**: tokens issued for this server only (audience, L640), short-lived and revocable (GUARD.4); code flow with PKCE when acting for a human, client credentials when acting on their own (P2); refresh tokens rotated or sender-constrained; access tokens sender-constrained (DPoP or mutual TLS) wherever the provider and the agent host support it (P4).\n  6. **Every JWT** verified with pinned algorithms, `none` rejected, issuer, subject and audience checked, explicit `typ` (P7).\n  7. Downstream calls use the backend's own token, never a forwarded one (L640).\n\nRejected: - An own credential store: acceptable when no OpenID Connect server can be used or run, a self-run one included (review m11); SECURE.5 then applies in full, MFA included (P1; condition inferred).\n  - (superseded by MD-09) Accepting a login without checking the asserted authentication context: never while MFA is required (review M6).\n  - Implicit grant, password grant, shared static keys for agents: never (P2); static keys only for short-lived scripts (L339).\n  - Account linking by e-mail: never (P6).\n  - Tokens held by browser JavaScript: never by default (GUARD.4).\n  - Bearer-only access tokens: acceptable when the provider or the agent host cannot sender-constrain, with a short lifetime and server-held revocation (inferred).\n\nRealizes: ALLOCATION.GUARD.4 (handles tokens where the identity placement allows them).\n\nCorrected by MD-09 (re-audit under MD-08): the authentication context is requested and checked for privileged accounts and at step-up, not on every login."
- op: node.set
  uid: PIG-WEB-LOGIC.SECURE.5
  intent: Passwords, where the backend holds them, follow a length-and-blocklist policy with Argon2id hashing, MFA offered on every account (phishing-resistant authenticators preferred) and required by privilege and risk level, and login failures are throttled per account with growing delays and never a hard lockout. The node is also the bar the chosen OpenID Connect server must meet, including emitting the authentication-context claims the backend checks.
  constraints:
  - Maximum length at least 64, all printable Unicode, no composition rules, no periodic rotation, compromised and common-password lists checked; minimum 8 where MFA is enforced, 15 for any account a password alone authenticates; the numeric-only validator removed.
  - Hash with Argon2id first in the hasher list (at least 19 MiB, 2 iterations, parallelism 1); upgrade older hashes at login.
  - MFA offered on every human account, passkeys and WebAuthn preferred; required on privileged accounts (operator, owner, administrator) and at step-up before sensitive operations; required on every account when the project's chosen risk level says so.
  - Generic authentication errors; failures counted per account and per source; growing delays, never a hard lockout; a recovery path; one-time-code endpoints count failures only.
  - The login limit is enforced in the proxy and in the login logic, never by framework throttling alone.
  - The chosen OpenID Connect server emits `acr` or `amr` and `auth_time` so the backend can verify MFA for privileged accounts and step-up rather than assume it.
  design_notes: "Positions: - P1 password policy: at least 64 characters allowed, all printable Unicode, no composition rules, no periodic rotation, checks against compromised and common-password lists; minimum length 8 with MFA, 15 without; Django's default validators still include a numeric-only check (L344).\n  - P2 hash with Argon2id (at least 19 MiB, 2 iterations, parallelism 1), with scrypt, bcrypt or PBKDF2 as fallbacks, and upgrade hashes at login; Django's default is PBKDF2, Argon2 opt-in; PBKDF2 stays acceptable under FIPS-140 (L345).\n  - P3 offer MFA and phishing-resistant authenticators (WebAuthn, passkeys) (L346).\n  - P4 generic authentication errors; failures counted per account, not only per source address; growing delays rather than hard lockout; a recovery path; the login endpoint rate-limited (L347).\n  - P5 framework throttling is not a security control (Django does not throttle authentication; DRF says its throttling is not brute-force protection); the real limit sits in the proxy, a dedicated limiter or the login logic (L348).\n  - P6 one-time-code and verification endpoints count failed attempts only (L349; one T3 source).\n  - (superseded by MD-09) Cited: MFA required by default on human accounts (J3 LOGIC.SECURE, max applied to L033).\n\nForces: security; login usability, which this node does not serve as a force (J3's reasoning on MFA).\n\nDecision: this node governs an own credential store (SECURE.4's acceptable fallback) and is the bar the chosen OpenID Connect server must meet (selection criterion; inferred). That bar includes emitting the authentication-context claims (`acr` or `amr`, and `auth_time`) that SECURE.4 checks, so the backend can verify MFA rather than assume it (review M6; OpenID Connect Core, not in the ledger).\n  1. **Policy** (P1): maximum length at least 64, all printable Unicode, no composition rules, no rotation, compromised and common lists checked; minimum 8 where MFA is enforced (the default, J3), 15 for any account a password alone authenticates. Django's validators are configured to length and list checks only; the numeric-only check, a composition rule, is removed (mapping of P1 to Django inferred).\n  2. **Hashing**: Argon2id first in the hasher list with the OWASP parameters; older hashes upgraded at login (P2).\n  3. (superseded by MD-09) **Second factor**: MFA required; passkeys and WebAuthn offered (P3; J3).\n  4. **Throttling**: generic error messages; failures counted per account and per source; growing delays, never a hard lockout; a recovery path (P4); the limit enforced in the proxy and in the login logic, never by framework throttling alone (P5); one-time-code endpoints count failures only (P6).\n\nRejected: hard lockout: never, it lets an attacker lock users out (P4). Composition rules and periodic rotation: never (P1). PBKDF2 as the default hasher: acceptable where FIPS-140 applies (P2). Framework throttling as the control: never (P5). MFA optional: acceptable when the audience cannot practically be required to use a second factor (J3's condition), then minimum length 15 (P1).\n\nRealizes: no skeleton link; follows J3 LOGIC.SECURE (layered login defence, L033).\n\nCorrected by MD-09 (re-audit under MD-08): MFA is offered on every account and required by privilege and risk level (philosophy LOGIC.SECURE). Rejected: MFA required on every account: acceptable when the project's chosen risk level requires it."
- op: node.set
  uid: PIG-WEB-LOGIC.SECURE
  intent: 'The Python backend is the one gate every caller passes and decides nothing on the caller''s word: access is checked by one central policy module, humans hold an opaque server-side session in Postgres after a delegated OpenID Connect login with MFA offered and required by privilege and risk level, every CSRF layer is applied, no credential travels in a URL, consumption is bounded at the proxy and per identity, and fetches of client-named URLs cannot reach internal addresses.'
- op: node.set
  uid: PIG-WEB-LOGIC.PROCESS.2
  constraints:
  - Every effect that must not be lost is an outbox or job row written by the database function in the transaction of the change; Python workers deliver it after commit.
  - 'Delivery is at least once and every consumer idempotent: the receiver records the processed message id in the transaction of its own state change and answers a repeat as the first; late acknowledgement only for idempotent tasks.'
  - 'Foreign mutations run as atomic phases in a worker: the request writes the intent with its idempotency key through one API function call and answers 202 with a status resource; each local phase is one API function call recording a recovery point on the key row; commit before each foreign call; the idempotency key is passed to the foreign system; a completer job for abandoned operations and a reaper for old keys.'
  - In-request phases are acceptable only when the user must see the foreign outcome in the same response and the call is expected to finish within a few seconds, under the request timeout (ACT.3).
  - Never a transaction open across a remote call.
  - Post-commit hooks only for losable work, registered as robust so one failure does not skip the others.
  - No saga inside one Postgres.
  - 'Forbidden: post-commit hooks as the default carrier; enqueueing to a broker before or after commit.'
  design_notes: "Positions: - P1 trigger side effects (e-mail, enqueue, publish, cache invalidation) only after commit, through post-commit hooks (L233).\n  - P2 never hold a database transaction open across calls to remote services; bracket each foreign mutation with its own short local transactions (L234; synthesis).\n  - P3 a data change and a message cannot be made atomic by two writes: record the message or job in the same transaction (outbox, staged job table) and deliver after commit (L409).\n  - P4 relays and queues deliver at least once, so consumers and tasks are idempotent (processed message ids); late acknowledgement only for idempotent tasks (L410).\n  - P5 record the idempotency key and the effect atomically (L270, grounded since by L599).\n  - P6 for a request that mutates foreign state: atomic phases, a recovery point after each phase and foreign call, commit before the foreign call, an idempotency key passed to the foreign system, a completer for abandoned requests and a reaper for old keys (L589; one T3 source).\n  - P7 within one Postgres, one local ACID transaction, not a saga; sagas only across services with separate databases, accepting their lack of isolation and hand-written compensations (L590).\n  - P8 the receiver records processed messages in the transaction of its state change and answers a repeat as it answered the first (L599).\n  - P9 a post-commit hook is not part of the transaction: a crash after commit loses the effect, a failing hook can skip later ones unless robust; use it for losable work, the outbox when the follow-up must not be lost; enqueuing before commit lets a worker see uncommitted data, after commit risks a crash between the two (L600).\n\nForces: correctness (no lost, early or doubled effect); request latency.\n\nDecision (ACT.2):\n  1. Every effect that must not be lost is an outbox or job row written by the database function in the transaction of the change (P3, ACT.2, MD-03); Python workers deliver it after commit (PROCESS.1's claim).\n  2. Delivery is at least once and every consumer idempotent: the receiver records the processed message id in the transaction of its own state change and answers a repeat as the first (P4, P8); late acknowledgement only for idempotent tasks (P4).\n  3. **Foreign mutations** (a payment): atomic phases (P6) **run in a worker** (review M4). The request writes the intent with its idempotency key through one API function call and answers 202 with a status resource (EXPOSE.3, ACT.3); the worker runs the phases. Each local phase is one API function call that records a recovery point on the key row; commit before each foreign call; the idempotency key passed to the foreign system; a completer job for abandoned operations and a reaper for old keys (PROCESS.1). The key row carries the recovery point and a lock with an expiry, so a duplicate request is answered by EXPOSE.3's multi-phase rule (review M3).\n     - (superseded by MD-09) In-request phases are acceptable when the user must see the foreign outcome in the same response and the call fits ACT.3's 1 s budget.\n     - Grounds: J1's ACT.2 allows in-request atomic phases while ACT.3 forbids foreign effects inside the request; the worker path satisfies both, and matches this branch's refusal to hold synchronous workers on slow I/O (PROCESS.4, ENFORCE.4). The tension is J1's own and is routed to J1's owner.\n  4. Never a transaction open across a remote call (P2).\n  5. Post-commit hooks only for losable work (cache invalidation, best-effort notices), registered as robust so one failure does not skip the others (P9; P1 narrowed).\n  6. No saga inside one Postgres (P7).\n\nRejected: post-commit hooks as the default carrier: acceptable for losable work (P9). Enqueueing to a broker before or after commit: never (P9, L409). Sagas: win when a business transaction spans services with separate databases (P7, L480). Foreign mutations inside the request by default: rejected (ACT.3's forbidden column; review M4); acceptable under step 3's condition.\n\nRealizes: ALLOCATION.ACT.2 (stages and delivers side effects as the placement sets); follows ALLOCATION.ACT.3 (foreign effects deferred)."
- op: node.set
  uid: PIG-WEB-LOGIC.EXPOSE.1
  intent: 'Browsers get server-rendered HTML as the contract; programs and agents get resource-oriented JSON over HTTP with named resources, standard methods and custom methods for state transitions, and every collection is paginated with a server maximum page size: structured-data collections by an opaque keyset continuation, while a human HTML list over a bounded result may use page numbers.'
  constraints:
  - The server-rendered HTML is the browser contract; OpenAPI describes only the JSON endpoints that exist.
  - Resource-oriented JSON with named resources and standard methods; state transitions are custom methods on their resource (a POST naming the transition), each mapped to its one writer function, never a PATCH of the state field.
  - Every collection paginated; the server enforces a maximum page size; structured-data and agent collections, and any list over a large or growing set, use keyset paging in the database behind an opaque continuation token or next link.
  - The token encodes position only and carries no authorization; every page is re-authorized; the token is not a credential in the URL.
  - No next link ends the collection; no total count by default, an estimate labelled as such where offered.
  - A human-facing HTML list over a bounded, filtered result may page by offset with page numbers; larger or growing HTML lists use keyset next links.
  - 'Forbidden: offset and limit for structured-data and agent collections, for deep pages and for bulk work; PATCH of a state column owned by a writer function.'
  design_notes: "Positions: - P1 GraphQL as a third option when many clients need different field subsets of one graph; its own pages claim versionless evolution and say the specification is silent on network, authorization and pagination (L256; advocate pages only, T3).\n  - P2 in a hypermedia design the HTML (links, forms) is the contract, and an OpenAPI file is needed only for the JSON endpoints that exist (L257; inferred).\n  - P3 a data API as a hierarchy of named resources manipulated by a small set of standard methods; custom methods only where standard ones do not fit; Fielding dissents on fixing hierarchies in advance (L264).\n  - P4 every collection paginated, the server enforcing a maximum page size and coercing larger requests (L265).\n  - P5 paging by a server-issued continuation (opaque token or next link), not offset and limit (L266).\n  - P6 page tokens opaque, unparseable by clients, carrying no authorization; the end signalled by an empty token or no next link (L267).\n  - P7 a total count is optional; an estimated total is documented as an estimate (L268).\n\nForces: changeability; readability for programs and agents; performance (DERIVE.2); security (tokens that carry no authority).\n\nDecision: 1. **Browsers**: the server-rendered HTML is the contract (P2; J3 LOGIC.EXPOSE.3); OpenAPI describes only the JSON endpoints that exist (P2).\n  2. **Programs and agents**: resource-oriented JSON over HTTP with named resources and standard methods (P3). State transitions are custom methods on their resource (a POST naming the transition), each mapped to its one writer function, never a PATCH of the state field (inferred from P3 with L596).\n  3. (superseded by MD-09) **Collections** (P4 to P7): every collection paginated, the server's maximum page size enforced; keyset paging in the database (DERIVE.2) behind an opaque continuation token or next link; the token encodes position only and carries no authorization, so every page is re-authorized and the token is not a credential in the URL (X6); no next link ends the collection; no total count by default, an estimate labelled as such where offered.\n  4. (superseded by MD-09) HTML lists page the same way, with next links built from the keyset (inferred).\n\nRejected: GraphQL: acceptable when many clients need different field subsets of one graph and the team designs authorization, pagination and limits itself (P1). Offset and limit for client-facing collections: never (P5). PATCH of a state column owned by a writer function: never (inferred). RPC tunnelling of every operation: rejected (J3 LOGIC.EXPOSE.1).\n\nRealizes: ALLOCATION.DERIVE.2 (exposes paging and filtering in the contract).\n\nCorrected by MD-09 (re-audit under MD-08): keyset for structured-data and agent collections and for large or growing sets; offset with page numbers acceptable for a human HTML list over a bounded result (philosophy DERIVE.2)."
- op: node.set
  uid: PIG-WEB-LOGIC.ENFORCE.3
  constraints:
  - Writes only through the generated, typed wrappers; the ORM writes only tables under the direct-write exception.
  - 'Reads: the Django ORM as read-only mappers for simple reads on base tables under SELECT grants; read functions through the wrappers where a read must apply a rule, in a short read-only transaction when they need the actor.'
  - Each use case gathers its data in one statement or read function, related rows joined or eagerly loaded, never queries in loops.
  - Filtering, sorting and paging in the statement; keyset pages for structured-data collections and large or growing sets; a server maximum page size.
  - Raw SQL always with bound parameters, never string formatting; identifiers that must vary come from an allowlist.
  - 'Per-user read rules (MD-05): sensitive reads go through the read function with the actor set, as PIG-WEB-LOGIC.SECURE.1 sets, never by filtering loaded rows in Python; the table is not read directly for them.'
  - Derived data from database cache tables or derived columns; no view as a contract; no read store outside the database.
  - 'Forbidden: views as a read contract; ORM-first writes; loading full sets into Python to reduce them; a second query layer beside the Django ORM.'
- op: node.set
  uid: PIG-WEB-DATA.GUARD.4
  constraints:
  - history rows (AFTER ROW, append-only; MAINTAIN.3, ACT.4);
  - constraint triggers for invariants no declarative constraint expresses, asserting the isolation level they need (GUARD.1, web-app-philosophy:ALLOCATION.GUARD.2), including the refusal of an active child of a soft-deleted parent (MAINTAIN.2) and dependencies lost by a Boyce-Codd decomposition when no declarative form exists (web-app-philosophy:DATA.ORGANIZE);
  - same-transaction maintenance of a derived copy at the top of the sync gradient (DERIVE.1);
  - write-time validation of JSON documents (ORGANIZE.5) and the actor checks of GUARD.3;
  - '`updated_at` (departing from the doctrine''s code-written column): a narrow BEFORE UPDATE trigger sets it, and stamps only when the row changes (`NEW IS DISTINCT FROM OLD`, inferred). Ground: under MD-03 rows are also written by owner-run data jobs and, under DB_API''s exception, by a consumer''s direct single-table write; only a trigger sets the column for every writer, as only a constraint binds every writer (web-app-philosophy:ALLOCATION.GUARD.2). A stale `updated_at` is not cosmetic: cache staleness checks depend on it. Writers skip rows whose values would not change (an `IS DISTINCT FROM` predicate), and the trigger''s stamp-on-change form means a no-op update by any writer re-stamps nothing, which avoids WAL traffic and needless trigger work.'
  - 'Not in triggers: state transitions and multi-table business operations (the writer function, ACT.1), outbox and job rows (written explicitly by the writer function, ACT.2), anything that calls outside the database (ACT.2). Each trigger is documented in its table''s comment, named so that name order is the intended firing order, and does not fire another trigger''s work (the last clause inferred).'
- op: node.set
  uid: PIG-WEB-DATA.MAINTAIN.2
  design_notes: "Question: how rows are deleted, archived or expired per table.\nPositions:\n  - P1 deletion is a recorded decision: soft delete flag, hard delete plus an archive written in the same transaction (table name, id, jsonb copy), or hard delete only; soft deletion leaks its predicate into every query, stops foreign keys from enforcing consistency between deleted parents and children, makes a legally required purge harder; undelete is rarely used; applies: soft delete when users need undo in the product, otherwise archive (L204, contested; critique T3, soft delete defended only in T4 snippets).\n  - P2 decide per entity from the reason data is kept: none (hard delete), legal or audit retention (archive or append-only audit), user-visible recovery (archive, or soft delete with an owner for the predicate), queryable past (temporal model), bulk expiry (partition drop) (L205, majority, inferred synthesis).\n  - P3 per-table gradient: full version history (rare), partial soft delete (the default for user-facing transactional data, about 60% of tables), archive table, hard delete (lookup, configuration, ephemeral) (L520 MAINT; contradicts L204 and the research recommendation D2).\n  - P4 soft delete mechanics: nullable timestamptz `deleted_at`, every read filters, partial indexes over active rows; the predicate leak accepted (L521 MAINT); checks carry an \"or deleted\" escape and uniqueness is a partial unique index over active rows (L522 MAINT); soft-delete cascades shadow the foreign-key graph in dedicated functions (L523 MAINT); idempotent, polyvalent functions with a bulk confirmation flag, deletion time not before creation (L524 MAINT); hard deletion only for rebuildable data or after an archive copy; no DELETE privilege for application roles (L525 MAINT).\n  - P5 time-bounded data partitioned by time; detach or drop old partitions instead of bulk DELETE (L206); partition only when size justifies it (larger than memory); partition keys in primary and unique keys (L207).\n  - The doctrine research's synthesis (D2 answer): the doctrine is the defender the critique lacked, its mitigations answer the critique; suggested record: soft delete by default with the mitigations as conditions.\nForces: (reframed after review, M1):\n  - Integrity of references and reads for every consumer, the node's own force, favours hard delete with archive: foreign keys and unique constraints keep working unchanged, and no reader can see a deleted row by forgetting a predicate.\n  - Immediate undo and in-place history, for users and for reporting, favours soft delete: a user's or an agent's mistake is undone by a single update (a force of the INTERACTION branch, the user's ability to work with the data), and a reporting consumer that counts deleted items in historical figures (last year's orders, including those deleted since) finds them in the base table, where under an archive it must union the archive.\n  - Recoverability as such does not divide them: both options keep deleted data recoverable and kept for audit. What differs is the speed and effort of a restore (one update against a restore function the team owns) and where the integrity cost falls.\n  - MD-03 cuts both ways. It makes the predicate leak (L521) a cost for every consumer that reads base tables (each backend, BI, consoles, scripts), and foreign keys no longer stop a new active child from referencing a soft-deleted parent, a check the cascade functions (L523) do not cover. It also adds the reporting consumers who, under an archive, must union it to count deleted rows.\n  - A cost both pay: GUARD.1 (L492) forbids CASCADE on core entities, so deleting a parent with children needs a deletion function that handles the children in order, soft-deleting them under soft delete (L523), archiving and removing them under the archive.\nDecision and grounds: (one clause decided by MD-04) everything except the default for user-facing transactional data is decided.\n  - Per table, recorded (P2, P3 agree): the reason the data is kept selects the mechanism; lookup, configuration and ephemeral rows are hard-deleted; rebuildable caches are invalidated or dropped, never soft-deleted (L520, L525, L538); bulk expiry of time-bounded data is a partition drop or detach, partitioning adopted only when size justifies it, partition keys in primary and unique keys (L206, L207); queryable past values use the temporal model of MAINTAIN.3 (L205, L213).\n  - Whatever the mechanism: deletion goes only through functions owned by the narrow, non-login deletion role of GUARD.2, which holds DELETE on the target tables and INSERT on the archive (changed after review, M3); no consumer role holds DELETE (L525, L514, GUARD.2); a hard delete of retained data copies the row to an archive in the same transaction, the history trigger of MAINTAIN.3 recording it as well (L525, L204); CASCADE follows GUARD.1 (L492).\n  - Where soft delete is used: L521 to L524 apply whole, plus three safeguards required under MD-03 (inferred): (1) a constraint trigger on the child table refuses an active row whose parent is soft-deleted, run under Serializable or with a lock on the parent row (CONCURRENCY.1), since no foreign key does; bound to the table, it also holds for a direct single-table write under DB_API's exception and for owner-run jobs (changed after review, M2: it was a check in the writer functions only); (2) the active-row predicate is written once in the shared specification every consumer reads with, and the reporting role's documentation names it; (3) a restore re-checks the row against the current constraints, since a deleted row escaped them (L522).\n  - decided by MD-05 (MD-04): the default for user-facing transactional data. Recommendation: hard delete with a same-transaction archive by default; soft delete where the product offers users a restore or undo on the table (trash, undo), or where reporting consumers must count deleted rows in place. Ground: it is the max for the node's force, integrity of references and reads for every consumer of a shared database (MD-03), while deleted data stays recoverable through a restore function. Why it stays a question: soft delete's advantage, immediate undo and in-place history for users and reporting, is a force of other branches that the max for DATA does not weigh, and the default for most user-facing tables (about 60%, L520) is the maintainer's codified practice. The review's preferred fix, deciding the archive as a fifth partial verdict against L520, is recorded and not taken: the question goes to the maintainer, framed even-handed. The evidence that restores are rare is one T3 practitioner critique (L204, SRC-265). If unanswered, the graph records the doctrine's default (soft delete for user-facing transactional data, L520) with the three safeguards above mandatory, and marks the clause `decided by MD-05`.\nRejected: hard delete without archive for retained data: never (L525). Soft delete for caches: never (L538). Bulk DELETE of time-bounded data where partitioning applies: rejected (L206); acceptable below L207's size threshold. A boolean deleted flag: never (L521).\nRealizes: ALLOCATION.ACT.4 (archive and history kept in the database); J2 DATA.MAINTAIN (gap 3: lifecycle at stack level only). Personal-data erasure (deferred MAINTAIN.6, L526 recorded as input) must reach soft-deleted rows, archives and history; noted, not judged.\n\nBuild narrative moved out of the constraints: changed after review, M3; changed after review, M2: it was a check in the writer functions only."
- op: node.set
  uid: PIG-WEB-DATA
  design_notes: "Question: how Postgres realizes the database share of each placement.\nPositions: none of its own (owns no row); roll-up of its six children.\nDecision and grounds: roll-up. Postgres is the system of record and holds everything that must hold whoever touches the data (RECORD.1, MD-03). It does that work in six ways:\n  - organize: normalized tables, scope-leading composite keys for scoped rows and identity keys elsewhere, precise column types, names that carry role and type, bounded JSON validated against schemas held in the database, schemas as domain namespaces, and every index justified by a query (ORGANIZE);\n  - guard: every rule a declarative constraint can express is declared; one role per consumer with narrow grants and no DELETE; no row-level security by default (MD-01); triggers only for a closed list of atomic side records (GUARD);\n  - concurrency: Serializable with retry for every writing role, version checks on user-edited rows, transaction-scoped locks only, idempotent statements, commit-order-safe readers (CONCURRENCY);\n  - maintain: online-safe versioned migrations with a drift gate, deletion chosen per table (default decided by MD-04), trigger-written append-only history, human-run bulk jobs under a checklist, point-in-time recovery proven by restore (MAINTAIN);\n  - derive: derived copies only with a sync plan and a drift guard, kept by a same-transaction trigger where any other writer exists; caches in classified, commented tables (DERIVE);\n  - interface: the function API with its conventions and its compatibility rule, reached through a pooler with per-role limits and timeouts (INTERFACE).\nRejected: none at this level.\nRealizes: refines web-app-philosophy:DATA (skeleton link). Through its children: RECORD.1, RECORD.2, RECORD.3, GUARD.2, GUARD.3 (per-role layer), GUARD.5, GUARD.6, ACT.1, ACT.3, ACT.4, DERIVE.1, DERIVE.3, and the stack placements DB_API, TYPE_CHAIN, ROW_SECURITY, CACHE_STORE."
