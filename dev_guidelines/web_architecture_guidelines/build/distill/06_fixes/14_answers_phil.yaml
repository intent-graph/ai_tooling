- op: node.set
  uid: ALLOCATION.GUARD.3
  epistemic_state: 'known: two layers per MD-01; write rules in writer functions (MD-03); read visibility per MD-05 | conflict: L619, L688 favour row security when several consumers share the database (MD-03)'
  design_notes: "Positions: P1 backend only (L020, L620, L305, L306); P2 the database enforces through roles and row-level security (L619, L620, L688); P3 two layers: database permissions limit objects, application permissions decide business actions (L468 MAINT, L620, L128).\n\nForces: security against changeability of policy.\n\nDecision: P3, two layers (MD-01; L468, MAINT, max). With several consumers the work divides by where the rule's facts live (R1-1; inferred from MD-03 and L608).\n  - The writer function decides per-user write rules that can be decided from the stored row and the acting user (author, owner, assignee: \"only the assignee may close a task\") and that must hold for every consumer (MD-03, L596, ACT.1). A backend's identical check is a copy for early feedback, generated or tested under RULES.1.\n  - Each backend decides product policy that is not stored in the data: product roles, plan limits, feature flags, workflow steps; and who the human or agent is. One central mechanism per backend, deny by default, object level, on every request from every client (L020, L305, L306, L644).\n  - The database decides per consumer: each consumer has its own role, neither owner nor superuser. Grants say which API functions it may EXECUTE, which tables and columns it may SELECT, and that it writes no table directly except under DB_API's exception; state columns are revoked from UPDATE so the writer function is the only path (L468, L310, L596). This bounds what every backend, BI tool, console and script can do whatever its code.\n  - Functions run with their owner's rights only where they must write tables the caller cannot. They read the acting user from a transaction-local setting (L311, L566). That actor is the consumer's claim, not a verified fact (R1-3): functions refuse a write without an actor, check that the session role may assert that kind of actor (a backend an end user, an operator or owner role only itself; default-context table), and record both the session role and the claimed actor.\n  - Row-level security is not used by default (MD-01). It is acceptable only when the data model is simple, the scoping key is present in every table the policy covers, in practice composite primary keys led by that key, and no all-powerful administrator role must read or write across scopes (MD-01).\n\nUndecided clause (Q1): `decided by MD-05, read visibility of rows with per-user rules when several backends share the database`. Read visibility of rows that carry per-user rules (\"a draft is visible only to its author\"; comments on restricted targets are covered by the same rule). Under MD-01 as written each backend filters reads, one copy per backend, against RULES.4 (L633). Writes are not in the question: they are settled above under MD-03.\n  - former recorded default (superseded): each backend filters these reads from one shared written specification, with a shared denial-test suite every backend runs (X1).\n  - Fallback kept, not forbidden: database read functions that receive the verified actor are acceptable when a per-user read rule must hold for two or more backends (X1). Under MD-03 several backends share the database by default, so this condition is always met: the fallback is available wherever MD-03's default holds. The actor is verified by the backend that asserts it and is a claim to the database (R1-3).\n  - Consequence, under either position: Before the maintainer answered, the reporting role gets no SELECT on comment content or narrower-audience comments, the operator role sees every row, and any other role that may SELECT the base tables sees every row unless its own role is restricted. No statement in this guideline claims stronger visibility than this (X1).\n\nTension (MD-01 against evidence): L619 and L688 call for row security when several applications or agents read the database, which MD-03 makes the default. MD-01 overrides; the residual risk is that a consumer with SELECT on a table sees every user's rows, and that each backend's read filter is the only per-user gate on reads.\n\nRejected: P1 without the database layer; wins never (L468). P2 as sole authority: loses product policy that lives in application code (L468); row-level security wins only under MD-01's conditions. The backend as authority for per-user write rules decidable from the row: two authorities for one rule (R1-1); the backend keeps a tested copy.\n\nChanged (R1): division of work with several consumers (MD-03); row security per MD-01 (F1 closed); new clause Q1.\n\nChanged (R3): Q1 notation unified; former recorded default (superseded) and fallback reworded; comments covered; visibility of SELECT-capable roles stated (X1).\n\nChanged (R2): one authority per per-user write rule, the writer function; backend check is a tested copy; backend owns product policy not stored in data (R1-1). Actor treated as a claim, pairing checked, writes without actor refused (R1-3). Q1 narrowed to read visibility, decided by MD-05 (R1-2).\n\nWould move it: MD-01's three conditions (row security becomes acceptable); Q1's answer (read visibility into read functions)\n\nRecommendation for the open clause: database read functions that receive the verified actor, for data with per-user visibility; each backend filtering stays acceptable for data without per-user rules. former recorded default (superseded) if unanswered: each backend filters from one shared written specification with a shared denial-test suite. Consequence for roles that read the base tables, Before the maintainer answered: the reporting role gets no read access to comment content or narrower-audience comments; the operator role sees every row; any other role sees every row unless its own role is restricted.\n\nDecided (MD-05): simple reads that carry no logic are written by each backend directly; a read that is sensitive, complex, high-impact, built by a function, or an abstraction several backends share is wrapped in a database function; per-user visibility rules are sensitive reads, so the former fallback (database read functions that receive the verified actor) is the rule for them. The earlier recommendation (read functions for data with per-user visibility, backend filtering acceptable for data without) and the former recorded default (each backend filters from one shared specification with a denial-test suite) are superseded. The interim comment rule is decided under MD-05: the reporting role reads comment content and narrower-audience comments only through database functions; the operator role sees every row; other roles that read base tables see every row unless their own role is restricted."
  intent: 'Authorization has two layers divided by where the rule''s facts live: the database function that writes a column decides per-user write rules decidable from the stored row and the acting user; each backend decides product policy not stored in the data and who the user is; the database bounds every consumer by role. Row-level security is not used by default; simple reads are written by each backend directly, while reads that are sensitive, complex or shared, per-user visibility rules included, go through database functions.'
  constraints:
  - 'Authority: writer function for per-user write rules decidable from the row and the actor; backend for product policy not stored in the data and for identity; database per consumer role'
  - 'Copies: the backend''s check of per-user write rules (generated or tested, early feedback); the browser hides controls the user may not use (cosmetic)'
  - 'Forbidden: browser, agent client, model output, client hints; row security by default (MD-01); any consumer role owning tables or bypassing grants; a write without an actor, or with an actor its role may not assert'
  - Per-user write rules decidable from the stored row and the acting user are decided by the column's writer function; a backend's identical check is a generated or tested copy for early feedback.
  - 'Each backend decides product policy not stored in the data (product roles, plan limits, feature flags, workflow steps) and identity: one central mechanism, deny by default, object level, on every request from every client.'
  - Each consumer has its own role, neither owner nor an all-powerful role; grants say which API functions it may call and which tables and columns it may read; state columns are revoked from direct update so the writer function is the only path.
  - Functions read the acting user that the backend asserted for the transaction from its verified identity, treat it as a claim, refuse a write without an actor, check that the session role may assert that kind of actor (a backend an end user, an operator or owner role only itself), and record both the session role and the claimed actor.
  - No row-level security by default; acceptable only when the data model is simple, the scoping key is present in every table the policy covers, in practice composite primary keys led by that key, and no all-powerful administrator role must read or write across scopes.
  - 'Per-user read visibility (MD-05): simple reads that carry no logic (a basic select, a few joins) are written by each backend directly; a read that is sensitive, complex, high-impact, built by a function, or an abstraction several backends share goes through a database function that receives the verified actor, and per-user visibility rules count as sensitive reads. Roles: the reporting role reads comment content and comments with a narrower audience than their target only through database functions; the operator role (administrators, all-powerful by the maintainer''s model) sees every row; any other role that may read the base tables sees every row unless its own role is restricted.'
- op: node.set
  uid: TRANSVERSE.OPERABILITY.2
  epistemic_state: 'known: MD-05 | unvalidated: concurrency tests required by GUARD.2 | gap: no row on concurrency testing'
  design_notes: "POSITIONS:\n  - P1 a pyramid: many small fast tests, some coarser, very few high-level; ratios team-specific (L099).\n  - P2 if high-level tests are fast, reliable and cheap, fewer low-level tests are needed (Fowler, SRC-198, noted in L099).\n  - P3 test at the lowest level that can catch the failure; when a high-level test finds a bug, add the low-level test (L396); end-to-end tests few, on critical journeys (L397).\n  - P4 integration tests against a real engine of the production kind, never mocks or another engine (L399); a disposable database, each test isolated (L400); a test that mutates shared data runs in a boundary that never commits (L567, MAINT).\n  - Read against FORCES.6 (J1): logic in the application tests in memory; logic in the database needs a database to test (L042, L472 MAINT).\n\nFORCES:\nP1 and P3 serve fast, precise feedback; their cost is many tests to write. P2 serves fewer tests when tooling allows; it fails when high-level tests are slow or flaky (L397). P4 serves fidelity (the constraints, isolation and functions are the real ones); its cost is a running database in every test run.\n\nDECISION:\nP3 as the rule, P1 as its usual result, P4 for every test that touches data.\n  - Proportion follows \"the lowest level that catches the failure\" (L396). The pyramid is what that rule usually yields (L099); ratios are not prescribed.\n  - In the MD-03 default the database holds the business operations, the writer functions, the invariants and the audit. Their low-level tests run on the real engine of the production kind (L399). Each test is isolated: a rolled-back transaction by default (L400 gives it as its example). Logic tests on shared data run in never-committing transactions (L567). Behaviour that only shows at commit or between sessions (serialization failures and retries, lock waits, deferred constraints, the outbox) is tested with concurrent committing sessions in a disposable database, never a shared one (L567 governs shared environments; X4). They cover constraints, writer functions, the actor pairing and the refusal of writes without an actor (ACT.4).\n  - Every invariant that GUARD.2 enforces procedurally, under Serializable with retry or under a lock, has a concurrent test. These concurrency tests are part of the default test suite, not a gap (inferred from GUARD.2: a placement whose correctness depends on concurrent behaviour needs a test of that behaviour).\n  - Backend product policy and request parsing are tested in memory (L042).\n  - Authorization is tested by denial: each role and actor is refused what it may not do (GUARD.3); these denial tests are the first misuse-case tests the threat model asks for (SECURITY, A06). Undecided: decided by MD-05, read visibility of rows with per-user rules when several backends share the database (not settled here). former recorded default (superseded): each backend filters these reads from one shared written specification, with a shared denial-test suite every backend runs. Database read functions that receive the verified actor are acceptable when a per-user read rule must hold for two or more backends. The denial suite does not cover roles that may SELECT the base tables: Before the maintainer answered, the reporting role gets no SELECT on comment content or narrower-audience comments, the operator role sees every row, and any other role that may SELECT the base tables sees every row unless its own role is restricted.\n  - Contract tests at the seams (stack judge); a few end-to-end tests on critical journeys (L397).\n\nREJECTED:\n  - P2 as the default: acceptable when high-level tests are measured fast, reliable and cheap (L099's note).\n  - A fixed ratio (for example 70/20/10) as a rule: ratios are team-specific (L099).\n  - Mocking the database, or another engine, for logic placed in the database: never (L399, L103). In-memory tests stay for logic the backend owns.\n  - End-to-end-heavy suites: never as the default (L397).\n\nPLACEMENTS REALIZED:\nno skeleton link to a placement; rests on FORCES.6 (L042, L472), GUARD.2, GUARD.3, ACT.1 and ACT.4, whose database realizations it tests.\n\nREVIEW FIXES:\nM2 and X4 (each test isolated, rollback by default; commit-time and concurrent behaviour tested with committing sessions in a disposable database; concurrency tests required by GUARD.2 in the default suite; the gap kept only for the missing source row); m7 and X1 (pending clause added to the state, one notation, default, fallback and consequence stated)."
