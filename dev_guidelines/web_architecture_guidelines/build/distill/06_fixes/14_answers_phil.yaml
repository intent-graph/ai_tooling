  uid: TRANSVERSE
  epistemic_state: 'known | gap: owns no row (roll-up)'
- op: node.set
  uid: ALLOCATION.GUARD
  epistemic_state: 'known: MD-05'
  intent: Deciding checks run in the database for rules about stored data, multi-table operations, concurrent change, duplicate suppression and per-role access, and in the backend for meaning and access that need the end user's identity, policy or request context, and for sessions. Browsers and agent clients only echo checks, for feedback; reads that are sensitive, complex or shared, per-user visibility rules included, go through database functions.
- op: node.set
  uid: DATA.GUARD
  epistemic_state: 'known: MD-05 | conflict: against L471 (MAINT) on optional CHECK constraints, inherited from J1 GUARD.2 | unvalidated: the stack form of fencing (L476) and "no deciding read on a replica" are inferred'
  design_notes: 'Question: how the database keeps data valid and consistent under concurrent and partial change.

    Positions: P1 model data with the most precise structure available so illegal states cannot be represented: NOT NULL, CHECK, foreign keys and domains in the database, precise types at the boundary (L485; SRC-338 T2, SRC-134 T1); placement: ALLOCATION.GUARD.2 requires declarative constraints (L040, L473, L471 maintainer doctrine). P2 application-side validation as the guard (common practice, L040''s note; rejected by J1 in GUARD.2: check-then-write is correct only under serializable isolation, L473). P3 state the consistency model per operation (L043; SRC-232 T2) against P3'' classifying the datastore as "CP" or "AP" (the practice L043 rejects). P4 a lock that guards correctness carries a fencing token the storage checks; in this stack the row version or a unique constraint is the fencing, preferred to an external lock service (L476; SRC-346 T2); against P4'' a lease-based lock service without fencing; P4'''' a best-effort lock used only to save duplicate work (L476 allows it).

    Forces: P1, P3, P4 serve integrity under concurrency and partial failure. P2 serves changeability (rules tested in memory, L042) and loses integrity whenever a second writer or a concurrent request exists (L473), which MD-03 makes the default. P3'' serves brevity and hides latency and multi-object transactions (L043). P4'' serves availability of the lock and loses correctness when a paused holder acts after its lease expired (L476). P4'''' serves efficiency only.

    Decision: six ways, each the realization of a J1 verdict (GUARD.2 for constraints and procedural rules; RULES.5 and ACT.1 for one transaction per operation, L584 doctrine, MD-03, cross-branch resolution X3: one business operation is one database function call in its own transaction, J1 R1-4, and composition across domains happens in the database; GUARD.5 and L475 for version detection and no lock across think time; L476 for fencing by the store; L043 for the consistency model per operation). Reports on a replica accept snapshot anomalies (L573, via GUARD.2); "no deciding read on a replica" is inferred from L573. Only declarative constraints bind every writer, owner-run migrations and human-run jobs included (J1, GUARD.2); constraints are named so violations map to stable errors (L495).

    Access guarding (realization of GUARD.3''s database layer; not in the node''s question as worded, see gap 1): realized in the defaults graph''s roles and privileges node (J6). MD-01 and MD-03 apply.

    decided by MD-05 (changed after review, B1, X1): decided by MD-05, read visibility of rows with per-user rules when several backends share the database ("a draft is visible only to its author"; J1''s Q1). Not settled here. The graph records J1''s stated default word for word: A provisional, with one written specification per rule and a shared denial suite; B acceptable when a per-user read rule must hold for two or more backends. That is: each backend filters these reads from one shared written specification, with a shared denial-test suite every backend runs; database read functions that receive the verified actor (verified by the backend, still a claim to the database, J1 R1-3) are acceptable when a per-user read rule must hold for two or more backends, which under MD-03 can easily be the case. The database''s part otherwise is the per-role grants. Consequence: Before the maintainer answered, the reporting role gets no SELECT on comment content or narrower-audience comments, the operator role sees every row, and any other role that may SELECT the base tables sees every row unless its own role is restricted. Where B''s condition holds, the filter lives in read functions of the database function API and DATA.GUARD''s clause then reads "read functions filter by the acting user" for those tables.

    Maintainer doctrine: L471 adopted on authority (database enforcement is the source of truth; application validation an optimisation). J1''s partial verdict against L471 ("triggers and CHECK constraints optional as defence in depth") is inherited and realized here; no new verdict.

    Rejected: P2 for any rule that must hold for every writer: never (GUARD.2); application validators stay as generated or tested copies, for feedback (RULES.1). P3'': never; a store label hides the per-operation guarantee that matters (L043). P4'' for correctness: never (L476). P4'''': acceptable when the lock only avoids duplicate work and a duplicate is harmless, or is caught by a constraint.

    Realizes: ALLOCATION.GUARD.2 (invariants), ALLOCATION.GUARD.5 (concurrency control). Links proposed, not created: realizes ALLOCATION.GUARD.3 (database layer per consumer role) and ALLOCATION.RULES.5 (atomicity ends at the transaction).


    The default isolation level is decided by the stack graph (pig-web-defaults PIG-WEB-DATA.CONCURRENCY), judged in the Postgres data unit.'
- op: node.set
  uid: LOGIC.SECURE
  epistemic_state: 'known: MD-05 | unvalidated: MFA required by default (max applied to L033)'
  design_notes: 'Decision: the backend is the one gate every caller passes, human or agent, and decides nothing on the caller''s word.

    Positions:

    - P1 authentication is not authorization; an OpenID Connect ID token is for the client, never an access credential to APIs (L021).

    - P2 every client-supplied part of an upload is untrusted: allowlisted extensions, actual signature checked, stored name generated by the server (L023).

    - P3 bound every resource a client can make the server consume (rate, payload size, memory, concurrency, time, third-party spend), each limit tuned to the operation and the business need; agents as principals make loops and retries likelier, so expensive operations get their own limits (L031).

    - P4 maximum body size, minimum read rate and read timeouts enforced at the outermost layer with 413 or 408, plus a size check in the client because browsers show the proxy''s error poorly (L032).

    - P5 credential stuffing defended in layers: MFA first, breached-password checks, device fingerprinting and CAPTCHA understood as spoofable, never IP blocking alone (L033).

    - P6 identify the business flows whose automation harms the business and protect those specifically, machine-to-machine APIs included (L034); cited, owned by INTERACTION.AGENT: do not apply blanket bot blocking where agents are intended users (L652).

    - Placement rows cited, owned elsewhere: deny by default (L020); one central mechanism on every request (L305); object-level rules (L306); model output is untrusted input, never an authorization decision (L644); client hints are not enforcement (L650); a server accepts only tokens issued for it and never forwards a client''s token (L640); parse once at each entry (L484, L612).

    Forces: security (all positions); availability and cost control (P3, P4); usability of login (P5''s MFA) and openness to agents (P6 against blanket blocking).

    Rejected:

    - Accepting ID tokens, forwarded tokens or client-declared identity as API credentials: never (L021, L640, L650).

    - Validation or authorization decided in the browser, the agent client or model output: never (GUARD.1, GUARD.3; L019, L644).

    - IP blocking as the only login defence, and IP alone as the limiting key: never (L033).

    - Blanket bot blocking: acceptable when no automated client is an intended user of the interface concerned (inverse of L652''s condition; inferred).

    - MFA optional for human accounts: acceptable when the application''s audience cannot practically be required to use a second factor; the other layers of L033 then carry the defence (condition inferred, not in the ledger row).

    - Limits only at the edge, or only in the application: each misses what the other sees (identity-blind volume against per-identity and per-operation cost; L031, L032; layering inferred, its stack form owned by PIG-WEB-LOGIC.SECURE.6).

    Realizes: GUARD.1 (the backend''s parsing and request-level meaning); GUARD.3 (product policy and identity; tested copy of per-user write rules; actor asserted, not decided); GUARD.4 (sessions and credentials held by the backend).

    Maintainer decision cited: MD-01 (row-level security is not a default; stays excluded here).

    Inherited open clause (X1): per-user read visibility, the maintainer''s question Q1 of the allocation judge, is not re-asked here; the former recorded default (superseded) and J1''s fallback are in the constraints and the state.

    Evidence gap: MFA required by default applies the max rule to L033 (inferred); the condition for ''optional'' is inferred, not in the ledger row.


    Lifted from the stack-neutral clause of PIG-WEB-LOGIC.SECURE.7 in pig-web-defaults, wording kept; the verdict is that record''s, not re-judged here. Clause: server-side fetches cannot reach internal addresses.'
  constraints:
  - 'Authenticate every caller, then authorize every request. Humans by the server-held session of GUARD.4; agents by their own short-lived, revocable tokens, accepted only when issued for this server (audience check), never forwarded downstream (GUARD.4). An ID token proves a login to the client and is never accepted as an API credential. Authorization is a separate, central mechanism, deny by default, object level, applied to every request from every client, for what the backend owns: product policy not stored in the data and identity (GUARD.3).'
  - Assert the actor, do not decide for the database. For every call into the function API the backend sets the acting user it has verified (scoped to the transaction, from the verified identity, never a client-supplied id; GUARD.3); per-user write rules decidable from the row are decided by the writer function, and the backend's identical check is a generated or tested copy for early feedback (GUARD.3, RULES.1).
  - 'Treat all input as untrusted and parse it at entry into the most precise type, once per process boundary (GUARD.1): request bodies, query parameters, headers, uploaded files, payloads read back from queues, and anything a model or agent produced. Client hints, tool annotations and claimed identities are never enforcement.'
  - 'Bound consumption at two depths: identity-blind size, rate, read-rate and time limits at the outermost layer, answering 413 or 408 there, with the client''s own size check as a feedback copy; identity-aware limits in the backend, per operation and per business need, with tighter limits on operations that cost money, trigger third parties or are expensive for agents to loop on.'
  - 'Protect harmful automation by flow, not by client kind: name the flows whose automation harms the business (sign-up, purchase, booking, referral) and protect each specifically; no blanket bot blocking, because agents are intended users in this context.'
  - 'Defend logins in layers: MFA first, then breached-password checks, then device signals and challenges known to be spoofable; never IP blocking alone. Max applied: MFA is required by default on human accounts (inferred: the source orders MFA first; requiring it is the most demanding form).'
  - 'Per-user read visibility (MD-05): simple reads that carry no logic are written by the backend directly; sensitive, complex, high-impact or shared reads, per-user visibility rules included, go through database functions that receive the verified actor (ALLOCATION.GUARD.3).'
  - Server-side fetches of client- or agent-named URLs cannot reach private, loopback or link-local addresses.
- op: node.set
  uid: INTERACTION.COLLABORATE
  epistemic_state: 'known: MD-05 | unvalidated: leak-surface list (L687, synthesis); channel order from one T3 source (L435); the comment-grant restriction for reporting and operator roles (inferred) | conflict: L682''s sequence-id cursor against L594, resolved for L594'
  design_notes: "Decides: how several users discuss and change the same data and learn of each other's changes.\nRows: L006, L435, L664, L682, L686, L687. Cited: L594 (pig-web data), L671, L674, L677, L679, L681, L683, L659.\nPositions:\n- Freshness: P1 delivered events are the client's state (rejected in L682), or a client replica with a sync engine (L302, L677); P2 push is a hint over a correct pull (L682, L006).\n- Channel: P3 the simplest channel that meets the need (L435); P4 one two-way channel for everything (the WebSocket-first side of L436, owned by pig-web).\n- Comment model: P5 each comment its own entity with a mandatory target (L664); P6 comments embedded as columns or JSON in the annotated record (rejected in L664).\n- Abilities: P7 five separate abilities, deny by default, per object on every request (L686); P8 the comment right implied by the edit right or the reverse (rejected in L686).\n- Visibility: P9 a comment never more visible than its target, same filter on every secondary surface (L687); P10 the filter on the main list only (the leak L687 warns against).\nForces: P2 serves correctness under dropped connections and several tabs, at the cost of a catch-up endpoint; P1 serves latency and offline use, at the cost of every replica becoming an authority (L302). P3 serves simplicity and operability; P4 serves one code path and two-way traffic, at the cost of long-lived connection servers. P5 and P7 serve confidentiality and least privilege (comments are edited, hidden or deleted without touching the data; reviewers and customers may comment without editing), at the cost of one more entity and more checks. P9 serves confidentiality; P10 serves only simplicity.\nDecision grounds:\n1. P2 (L682, L006). L682's \"(sequence id)\" is rejected as stated: a sequence id does not follow commit order, so a reader polling with \"id greater than last seen\" can skip a row forever (L594). Realization: PIG-WEB-DATA.CONCURRENCY.5.\n2. P3 (L435), one T3 source for the order.\n3. Concurrent edits surface the concurrency placement's policy (GUARD.5; L674, L679, L677).\n4. Presence per PRESENT.3 (L681).\n5. P5 (L664); append-only rows need no merge (L679).\n6. P7 (L686). Where each check lives follows GUARD.3 as settled: a rule decidable from the stored row and the actor (an author may edit their own comment; the target's author may resolve its threads, L671) is decided by the writer function; product roles that grant abilities (reviewer, customer, moderator) are each backend's product policy; the browser hides controls cosmetically. The unsourced \"thread's opener may resolve\" was dropped (review m2).\n7. P9 (L686, L687). Who applies the per-user read filter when several backends read the same comments is decided by MD-05, read visibility of rows with per-user rules when several backends share the database (ALLOCATION.GUARD.3). former recorded default (superseded) (MD-01 as written): each backend filters from one shared written specification with a shared denial-test suite. J1's fallback stays acceptable: database read functions that receive the verified actor, when a per-user read rule must hold for two or more backends. This node does not settle it.\n   Consequence of the default (X1): Before the maintainer answered, the reporting role gets no SELECT on comment content or narrower-audience comments, the operator role sees every row, and any other role that may SELECT the base tables sees every row unless its own role is restricted; the guarantee covers the surfaces the application serves and claims nothing stronger for those roles.\n   Restriction required for comments until the question is answered (review M1; inferred from the confidentiality purpose of P9 and from the reporting role's column grants excluding personal data by default, J5 TRANSVERSE.SECURITY).\n8. Agents collaborate under the same rules (L659, pig-web).\nRejected:\n- P1, delivered events as state: wins never. A client replica with a sync engine wins under the system-of-record placement's condition (offline use with user-owned data, RECORD.1), and even then catch-up uses a cursor.\n- P4 as the default: wins when traffic is two-way at high frequency (L435); the choice of push channel among server-sent events and WebSocket is the pig-web channel node's (L436).\n- P6: wins never for comments (they nearly always have other readers or writers than the record, L664). A single free-text note edited by exactly the people who edit the record is a field, not a comment (inferred).\n- P8: wins never (L686). P10: wins never (L687).\nRealizes: ALLOCATION.GUARD.5 (shows conflicts with the placement's policy; holds only the version it read); ALLOCATION.PRESENT.3 (presence on a channel with timeout, drafts in the browser, durable comments in the database); requires ALLOCATION.GUARD.3 (abilities and visibility follow the authorization placement, its open read clause included).\nHand-offs: commit-ordered change cursor (PIG-WEB-DATA.CONCURRENCY.5, L594); push channel default (PIG-WEB-INTERACTION.REALTIME.1, L436); anchoring, threads, text engine fields, notification and moderation rows (PIG-WEB-INTERACTION.COLLABORATE.1 to .4); comment grants of reporting and operator roles (PIG-WEB-DATA.GUARD.2); comments as a named consequence of the read-visibility question's default (ALLOCATION.GUARD.3, allocation judge).\nMaintainer decisions: MD-01 respected (no row security by default; the read-visibility default is MD-01 as written); MD-03 shapes the row-decidable comment rules in writer functions.\nEvidence gaps: leak-surface list (L687) is a synthesis; channel order rests on one T3 source (L435); the comment-grant restriction is inferred; L682 conflicts with L594, resolved for L594.\n\nLifted from the stack-neutral clause of PIG-WEB-INTERACTION.EDIT in pig-web-defaults, wording kept; the verdict is that record's, not re-judged here. Clause: a stale write is shown as a conflict with both versions and is never merged silently.\n\nLifted from the stack-neutral clause of PIG-WEB-INTERACTION.COLLABORATE.4 in pig-web-defaults, wording kept; the verdict is that record's, not re-judged here. Clause: a report queue whenever outsiders read comments.\n\nRealized in pig-web-defaults at PIG-WEB-DATA.CONCURRENCY.5 (commit-safe cursor)."
  constraints:
  - Every page is correct on plain load; a client that missed events catches up by fetching changes since a server-issued cursor and never trusts the events it happened to receive.
  - The catch-up cursor is one no later commit can fall behind; a sequence id is not such a cursor.
  - 'Use the simplest channel that meets direction of flow, update frequency and tolerable latency: polling, then long polling or server-sent events, then a two-way channel; correctness never depends on the channel.'
  - A stale write is rejected and shown as a conflict with both versions, so the user sees the other change and reapplies; it is never merged silently and never a silent overwrite of the whole record; the browser and agent clients never resolve a conflict on their own (GUARD.5).
  - Per-property last-writer-wins only for toggles, status, assignment and ordering; a text engine only for genuinely collaborative long-text fields.
  - 'Presence is ephemeral: broadcast through a channel with a timeout, never written to tables; a persisted last-seen is a separate, coarse field (PRESENT.3).'
  - A comment is its own entity with a mandatory target reference, its own author, lifecycle and permissions; comments are append-only rows that need no merge.
  - Read, comment, edit, resolve and moderate are separate abilities, deny by default, checked per object on every request, streams and exports included; none is implied by another.
  - 'A comment is never more visible than its target, may have a narrower audience, and the same filter applies on every surface the application serves: counts, notifications, search results, history, exports, ETags and real-time channels.'
  - Notifications are created only for recipients who may see the target.
  - A report queue (reports with a status and a decision) is required whenever people outside the team read comments.
  - Per-user comment reads go through database functions (MD-05; ALLOCATION.GUARD.3), whose written specification lists every secondary surface.
  - The reporting role reads comment content and comments whose audience is narrower than their target only through database functions; the operator role sees every row.
  - Agent writes are marked as agent-originated and pass the same abilities and visibility filters.
- op: node.set
  uid: TRANSVERSE.SECURITY
  epistemic_state: 'known: MD-05 | unvalidated: the whole tier map, L303''s 7 categories and the 3 added here (A06, A08, A10), A04 completed'
  design_notes: "POSITIONS:\n  - P1 whole-site HTTPS, never mixed with HTTP in a session, HSTS (L029); HTTPS as the precondition for browser capabilities (L030).\n  - P2 minimal exposure: a visit is safe, only the data the user's goal needs is collected (L035); secrets, session ids, tokens, keys, payment data, connection strings and unneeded personal data never logged, pseudonymised where identity is not needed, logged input sanitised (L036).\n  - P3 the OWASP Top 10:2025 as an awareness map, each category assigned to an owning tier (L303; tier map inferred, SRC-115 does not state it).\n  - P4 a catalogue of verifiable requirements (ASVS) at a level chosen by risk (L304, owned by PIG-WEB-TRANSVERSE.SECURITY.1; its level definitions are now read from the ASVS 5.0 text, its chapter list is not).\n\nFORCES:\nP1 and P2 serve confidentiality and integrity at a low, one-off cost; no position in the evidence opposes them. P3 serves coverage (no threat without an owner); its cost is that an awareness list is not testable. P4 serves verifiability; its cost is effort scaled by the chosen level.\n\nDECISION:\nP1, P2, and P3 completed by P4's demand.\n  - Transport: every page and every API over HTTPS with HSTS, no mixed content (L029, L030). Database connections from every consumer role are covered by the same property (inferred: MD-03 adds consumers outside the request path).\n  - Exposure: collect the minimum (L035); log no secret or unneeded personal data (L036), trace headers included (L375). The reporting role's column grants exclude personal data by default (J1 access paths), which realizes L035 for the MD-03 consumers.\n  - Threat map: every Top 10 category has an owning tier that the requester cannot modify (RULES.3, L019), named through the allocation placements:\n    - A01 Broken Access Control: backend and database, as GUARD.3 settles it: writer functions decide per-user write rules; the backend decides product policy and identity; the database bounds each consumer by its role (MD-01, MD-03). Undecided: decided by MD-05, read visibility of rows with per-user rules when several backends share the database (not settled here). former recorded default (superseded): each backend filters these reads from one shared written specification, with a shared denial-test suite every backend runs. Database read functions that receive the verified actor are acceptable when a per-user read rule must hold for two or more backends. Consequence: Before the maintainer answered, the reporting role gets no SELECT on comment content or narrower-audience comments, the operator role sees every row, and any other role that may SELECT the base tables sees every row unless its own role is restricted; no statement here claims a stronger visibility guarantee.\n    - A04 Cryptographic Failures: the backend (GUARD.4; L303), the proxy's TLS, the database connections of every consumer role, and storage at rest (the review's completion of L303's backend-only assignment; inferred).\n    - A07 Authentication Failures: backend (GUARD.4; L303).\n    - A05 Injection: backend and database (L303): parsing into precise types at every entry and typed function parameters (GUARD.1).\n    - A02 Security Misconfiguration: headers, CSP and deployment; A03 Supply Chain: the pipeline and dependencies (L303; realized in PIG-WEB-TRANSVERSE.SECURITY and OPERABILITY.3).\n    - A09 Logging and Alerting Failures: operations (L303), realized in OPERABILITY.1.\n    - Assigned here, inferred:\n      - A06 Insecure Design: a threat model per placement and per critical flow (authentication, access control, business operations, agent access), with misuse-case tests per tier; OPERABILITY.2's denial tests are their first instance. The allocation records (EVOLUTION.1) are the model's input, not the model. Grounded in the OWASP Top 10:2025 A06 preventions (threat modelling for authentication, access control, business logic and key flows; use-case and misuse-case tests per tier), read by the review.\n      - A08 Software or Data Integrity Failures: the delivery pipeline (signed provenance, trusted sources, review of code and configuration changes, segregated CI/CD; one immutable artifact, L101; realized in PIG-WEB-TRANSVERSE.SECURITY.5) and the parsing tier for untrusted serialized input (GUARD.1). The OWASP 2025 category is untrusted code or data treated as trusted; the database's declarative constraints are not an A08 control and are not assigned here.\n      - A10 Mishandling of Exceptional Conditions: the tier that holds each check, which fails closed (inferred from RULES.3).\n  - Verifiability (max): each property is stated as a verifiable requirement at a level chosen by risk, with requirement ids traceable; the catalogue is a stack choice (P4, PIG-WEB-TRANSVERSE.SECURITY.1). Its level definitions are grounded: ASVS 5.0 says most applications should strive for Level 2, and each organisation decides its level from its risks. The Top 10 stays the awareness map, not the requirement set.\n\nREJECTED:\n  - HTTPS only on login or sensitive pages: never (L029).\n  - Logging raw identifiers or secrets for debugging: never; a hashed session id is acceptable when sessions must be tracked (L036).\n  - The Top 10 as the requirement set or a compliance checklist: it is an awareness document (L303); wins never as the only catalogue.\n  - Security as a per-tier add-on without an owning tier per threat: against RULES.3 and L096.\n  - The recorded allocation decisions as the answer to insecure design: they are the threat model's input; OWASP's A06 asks for threat modelling and misuse-case tests. Wins never as the whole answer.\n\nPLACEMENTS REALIZED:\nrefines RULES.3 (skeleton link). Rests on GUARD.1, GUARD.3, GUARD.4, GUARD.2, ACT.4 and the J1 access paths.\n\nREVIEW FIXES:\nM4 (A08 reassigned to the pipeline and the parsing tier, declarative constraints dropped; A06 as a threat model with misuse-case tests; A04 completed; whole map unvalidated); m1 (ASVS level definitions grounded, L304's level part no longer open); m7 and X1 (one notation for the pending clause, former recorded default (superseded), fallback and consequence stated)."
  constraints:
  - Serve every page and every API over encrypted transport with strict transport enforcement and no mixed content; the same property covers database connections of every consumer role.
  - Collect only the data the user's goal needs; never log secrets, session ids, tokens, keys, payment data, connection strings or unneeded personal data, trace headers included.
  - Give every threat category an owning tier that the requester cannot modify, named through the allocation placements.
  - Answer insecure design with a threat model per placement and per critical flow (authentication, access control, business operations, agent access) and misuse-case tests per tier.
  - Assign software and data integrity failures to the delivery pipeline and the parsing tier for untrusted serialized input; declarative constraints are not that control.
  - State each property as a verifiable requirement with a traceable id, at a level chosen by risk; the threat list is an awareness map, never the requirement set.
  - 'Never claim a stronger read-visibility guarantee than the rule of ALLOCATION.GUARD.3 gives: roles that may read the base tables see every row unless their own role is restricted.'
