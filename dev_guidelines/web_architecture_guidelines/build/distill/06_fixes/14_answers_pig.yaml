  uid: PIG-WEB-DATA.INTERFACE.1
  epistemic_state: 'known: MD-03, MD-05 | conflict: partly against L517 (MAINT) on breaking changes (counted here for both graphs); L187 rejected in favour of L516 | unvalidated: zero-call evidence, the override restriction, procedures limited to jobs'
  design_notes: "Question: how database functions and views are written, named, secured and evolved.\nPositions:\n  - P1 views run with owner's privileges by default; security_invoker when the caller's rights or row policies must apply; security_barrier for row-filter views (L188).\n  - P2 tool ladder: plain query, then a function when a strong reason pays, then a procedure only where transaction control is needed; views off the path, acceptable only as throwaway objects; backends may query base tables for simple reads (L516 MAINT; contradicts L187).\n  - P3 the function API evolves additively; a breaking change is coordinated with every consuming team and deployed together; no formal version numbers (L517 MAINT).\n  - P4 conventions: names read entity, action, variant; mandatory parameters validated first; a validating \"safe\" variant wraps a base operation; errors name the function and carry stable codes, with an override flag for blockable business rules; results return one row per affected table with action and count; a change log per function; set-based statements over loops (L530 MAINT).\n  - P5 a contract schema of views and functions hiding base tables (L187, contested; rejected by J1 in DB_API).\n  - Placement DB_API (MD-03): function API in a dedicated schema; EXECUTE per consumer role; writes through functions, one call per transaction; simple reads on base tables; CI fails on a removed function or incompatible signature unless marked coordinated; wrappers generated from the catalogue. J2 flagged a narrowing of P3.\nForces: integrity of every consumer's access (one operation, one call, one transaction) and changeability of the database behind it, against the coordination cost of an API several consumers deploy against on their own schedules.\nDecision and grounds: realization of DB_API (MD-03), the doctrine as the max except on breaking changes.\n  - One operation, one call (X3): one business operation is one database function call in its own transaction (J1 R1-4); backends never compose several calls into one operation. A database function may call another domain's published functions inside the same transaction: composition across domains happens in the database. What is forbidden across domains is direct access to another domain's tables, not calling its published functions.\n  - Ladder (L516): every write that is a business operation is a function (DB_API, L584, L596); simple reads query base tables, except tables guarded by per-user read functions where B's condition holds (see \"decided by MD-05\"); a procedure only where transaction control is needed, which in practice means owner-run batch jobs (MAINTAIN.4): a procedure that commits inside cannot be a consumer's call, since one call is one transaction (J1 R1-4; inferred).\n  - Views are never contract objects (L516; DB_API); where a throwaway view exists, L188's rules apply (security_invoker when the caller's rights must apply, security_barrier for filters).\n  - Conventions (L530) adopted: entity, action, variant names; parameters validated first; a safe variant over a base operation; errors naming the function with stable codes, which, with named constraints (L495), the backends map to their interface errors (J7); one result row per affected table with action and count; a change log per function; set-based statements, a loop only when justified and documented. The override flag for blockable business rules is honoured only for roles granted it, and its use is recorded in history with the actor (GUARD.2, MAINTAIN.3; inferred: an unrestricted override would let any consumer bypass a rule the database is the authority for).\n  - Parameters the placements require: the expected version for user-edited rows (GUARD.5, CONCURRENCY.2), the idempotency key where the operation is not idempotent by design (GUARD.6), the business reason where history needs it (ACT.4); the actor comes from the transaction-local context, never from a parameter (GUARD.3).\n  - Security: EXECUTE revoked from PUBLIC and granted per consumer role (L185, GUARD.2); its owner's rights only where the function must write what the caller cannot, the owner being a narrow non-login role of GUARD.2, never the owner role, with a fixed search_path (GUARD.2, M3).\n  - Evolution (partly against L517; this departure is counted here, once, for both graphs, X2): additive changes need nothing more (L517): new functions, new parameters with defaults. \"Deployed together\" stays acceptable only when every consumer of the changed object ships in the same deployment as the migration; otherwise a breaking change goes expand, migrate, contract. L517's coordination with every consumer and \"no formal version numbers, a new function name carries the change\" are kept: the new behaviour ships as a new function or variant beside the old one (L530's variant naming), every consuming team is coordinated with, consumers move, and the old function is removed in a change marked coordinated once no consumer calls it, checked by the catalogue diff in CI (DB_API) and by evidence of zero calls over a stated window (function call statistics; inferred, mechanism not read). Ground: under MD-03 backends, BI, consoles and scripts deploy on their own schedules, and the database and its consumers never deploy atomically (J2 DATA.MAINTAIN).\n  - Description in sync (X7, MD-02): \"always in sync by process\" and the compatibility window apply to the database function API catalogue as to every interface description consumers read; the catalogue diff in CI is that process here, and the generated wrappers are its consumer-side copy (TYPE_CHAIN).\n  - Functions ship as migrations (MAINTAIN.1) and are tested against a live database in CI (DB_API), under X4's boundary (CONCURRENCY.2): logic tests in never-committing transactions, commit-only behaviour in a disposable database.\ndecided by MD-05 (B1, X1): `decided by MD-05, read visibility of rows with per-user rules when several backends share the database` (J1 Q1). former recorded default (superseded), J1's word for word: A provisional, with one written specification per rule and a shared denial suite; B acceptable when a per-user read rule must hold for two or more backends. Where B's condition holds, read functions join this API: they receive the verified actor through GUARD.3's context (a claim to the database, checked against the session role), follow these conventions, and the tables they guard lose direct SELECT for the consumer roles that read through them.\nRejected: P5, views as contract (L187): rejected (DB_API, L516); wins when a CRUD-dominant application is served by a database-as-API server with a strong Postgres team (L618 via J1). L517's \"deployed together\" as the general rule: rejected; acceptable under the condition above. An unrestricted override flag: rejected.\nRealizes: PIG-WEB-ALLOCATION.DB_API (writes the functions and views the placement calls for); ALLOCATION.RECORD.2; ALLOCATION.ACT.1 (operations as functions); ALLOCATION.GUARD.5, GUARD.6 (parameters)."
  constraints:
  - 'One operation, one call: one business operation is one database function call in its own transaction; backends never compose several calls into one operation. A database function may call another domain''s published functions inside the same transaction: composition across domains happens in the database. What is forbidden across domains is direct access to another domain''s tables, not calling its published functions.'
  - 'Ladder: every write that is a business operation is a function (DB_API); simple reads query base tables, except sensitive, complex or shared reads and per-user visibility rules, which go through read functions (MD-05, PIG-WEB-LOGIC.SECURE.1); a procedure only where transaction control is needed, which in practice means owner-run batch jobs (MAINTAIN.4): a procedure that commits inside cannot be a consumer''s call, since one call is one transaction (inferred).'
  - Views are never contract objects (DB_API); where a throwaway view exists, the platform's view rules apply (security_invoker when the caller's rights must apply, security_barrier for filters).
  - 'Conventions adopted: entity, action, variant names; parameters validated first; a safe variant over a base operation; errors naming the function with stable codes, which, with named constraints, the backends map to their interface errors; one result row per affected table with action and count; a change log per function; set-based statements, a loop only when justified and documented. The override flag for blockable business rules is honoured only for roles granted it, and its use is recorded in history with the actor (GUARD.2, MAINTAIN.3; inferred: an unrestricted override would let any consumer bypass a rule the database is the authority for).'
  - 'Parameters the placements require: the expected version for user-edited rows (GUARD.5, CONCURRENCY.2), the idempotency key where the operation is not idempotent by design (GUARD.6), the business reason where history needs it (ACT.4); the actor comes from the transaction-local context, never from a parameter (GUARD.3).'
  - 'Security: EXECUTE revoked from PUBLIC and granted per consumer role (GUARD.2); its owner''s rights only where the function must write what the caller cannot, the owner being a narrow non-login role of GUARD.2, never the owner role, with a fixed search_path (GUARD.2).'
  - 'Evolution (partly against the doctrine''s coordinated-change rule; this departure is counted here, once, for both graphs): additive changes need nothing more: new functions, new parameters with defaults. "Deployed together" stays acceptable only when every consumer of the changed object ships in the same deployment as the migration; otherwise a breaking change goes expand, migrate, contract. The doctrine''s coordination with every consumer and "no formal version numbers, a new function name carries the change" are kept: the new behaviour ships as a new function or variant beside the old one, every consuming team is coordinated with, consumers move, and the old function is removed in a change marked coordinated once no consumer calls it, checked by the catalogue diff in CI (DB_API) and by evidence of zero calls over a stated window (function call statistics; inferred, mechanism not read). Ground: under MD-03 backends, BI, consoles and scripts deploy on their own schedules, and the database and its consumers never deploy atomically.'
  - 'Description in sync (MD-02): "always in sync by process" and the compatibility window apply to the database function API catalogue as to every interface description consumers read; the catalogue diff in CI is that process here, and the generated wrappers are its consumer-side copy (TYPE_CHAIN).'
  - 'Functions ship as migrations (MAINTAIN.1) and are tested against a live database in CI (DB_API), under the test boundary of CONCURRENCY.2: logic tests in never-committing transactions, commit-only behaviour in a disposable database.'
- op: node.set
  uid: PIG-WEB-LOGIC.SECURE.1
  epistemic_state: 'known: MD-05 | unvalidated: P3''s condition taken as met in the default context; collection predicates emitted by the policy module (inferred)'
  design_notes: "Positions: - P1 implement the authorization mechanism once, centrally (filters or middleware), and apply it to every request whatever its origin (L305).\n  - P2 enforce object-level rules (record ownership), not only route or role checks (L306).\n  - P3 prefer attribute- or relationship-based control over plain role-based control when granularity or tenancy grows (L307; one T1 source, no dissent).\n  - P4 test authorization with unit and integration tests including denial cases; log access-control failures with alerting (L308).\n  - Placement positions cited, settled by MD-01 in ROW_SECURITY: row security on every path (L619), only with several consumers (L688), as a second line (L128).\n\nForces: security (all positions); changeability of policy (P3's richer model against plain roles); detection (P4).\n\nDecision: 1. **One policy module per backend, deny by default** (P1; L020 via GUARD.3). Middleware refuses any route that declares no permission; every use case calls the module with actor, action and object for each single object it reads or changes (P2). For collection reads, the module emits a query predicate that the read statement applies (ENFORCE.3), never a check on rows already loaded, which would yield short pages and leak counts (review m8; DERIVE.2). Central and object-level at once.\n     - **Overrides of blockable rules** (L530, MAINT; review M7): a writer function's blockable business rule can be overridden by an explicit flag. Setting that flag is an action the policy module authorizes per actor, like any other; it never comes from client input unchecked, and the override is audited with the actor (ACT.4). The use case decides whether to set it (ENFORCE.1).\n  2. **Model**: product roles for product policy not stored in the data, plus attribute and relationship rules evaluated on the object (owner, author, assignee, plan, flag) (P3). The default context already carries per-user rules, so P3's condition holds from the start (inferred).\n  3. **Division with the database** (GUARD.3, ROW_SECURITY, MD-01): no row-level security, so the backend's checks are kept in full. Per-user write rules decidable from the row are decided by the writer function; the backend's identical check is a copy generated from or tested against that function (RULES.1), and the function's named denial maps to the same response as the backend's (EXPOSE.2). The backend sets the verified actor for every call (ENFORCE.2; L311, L566).\n  4. **Per-user read visibility** (`decided by MD-05, read visibility of rows with per-user rules when several backends share the database`): who filters reads of rows that carry per-user rules (\"a draft is visible only to its author\") is J1's open question (Q1), not re-asked here (X1).\n     - former recorded default (superseded): **each backend filters these reads from one shared written specification of the visibility rules, inside the read statement (ENFORCE.3), with a shared denial-test suite every backend runs**. Row security stays excluded by default (MD-01).\n     - J1's fallback, kept: database read functions that receive the verified actor are acceptable when a per-user read rule must hold for two or more backends (J1 Q1). **Under that answer** (review M1): the read goes through the read function, run with the actor set (ENFORCE.2); the table loses direct SELECT; this step's filter moves from the backend's statement into the function. Note for J1's owner: the fallback's condition, two or more backends, already holds in MD-03's default context, so a reader may take it as the fallback winning by default; J1 should reword it.\n     - Consequence, stated so no line claims more: Before the maintainer answered, the reporting role gets no SELECT on comment content or narrower-audience comments, the operator role sees every row, and any other role that may SELECT the base tables sees every row unless its own role is restricted. Per-role grants bound which tables and columns a role sees, not which users' rows.\n  5. **Tests and logs** (P4): a denial test for every rule, at unit level and through the deployed stack against a live database under the backend's real role, because the database's half of authorization cannot be tested otherwise (ACT.1). Those tests run in never-committing transactions when the database is shared; behaviour that only shows at commit is tested with committing sessions in a disposable database, never a shared one (X4). Every denial goes to the security event log, a sink separate from the business audit (ACT.4), with alerting on bursts (mechanics owned by PIG-WEB-TRANSVERSE.OPERABILITY.4).\n\nRejected: - Route- or role-only checks: never (P2).\n  - Checks written per view without one module: never (P1).\n  - Plain role-based control: acceptable when no rule depends on an object's attributes or relations (inverse of P3's condition; inferred); not this context.\n  - Row-level security by default, or replacing backend checks: never by default (MD-01); acceptable when MD-01's three conditions hold, with the backend checks kept (L128).\n  - Per-object checks on loaded rows for collections: never (DERIVE.2; review m8).\n  - An override flag passed through from client input: never (L530, GUARD.3; review M7).\n\nRealizes: PIG-WEB-ALLOCATION.ROW_SECURITY (keeps the backend checks, as the placement sets). Follows ALLOCATION.GUARD.3 (no skeleton link; proposed).\n\nMaintainer answer MD-05: simple reads are written by each backend directly; sensitive, complex, high-impact, function-built or shared reads go through database functions; per-user visibility rules are sensitive. Interim comment rule decided: the reporting role reads comment content and narrower-audience comments only through database functions; the operator role sees every row; other roles see every row unless their own role is restricted."
  constraints:
  - One policy module per backend; middleware refuses any route that declares no permission.
  - Every use case calls the module with actor, action and object for each single object it reads or changes.
  - Collection reads apply a query predicate emitted by the policy module inside the read statement; never a check on rows already loaded.
  - Product roles for product policy not stored in the data, plus attribute and relationship rules evaluated on the object.
  - Setting an override flag on a blockable business rule is an action the policy module authorizes per actor; it never comes from client input unchecked and is audited with the actor.
  - The backend sets the verified actor for every database call.
  - Per-user write rules decidable from the row are decided by the writer function; the backend's identical check is generated from or tested against that function, and the function's named denial maps to the same response as the backend's.
  - 'Per-user read visibility (MD-05): simple reads that carry no logic (a basic select, a few joins) are written by each backend directly; a read that is sensitive, complex, high-impact, built by a function, or an abstraction several backends share goes through a database function that receives the verified actor, and per-user visibility rules count as sensitive reads. For per-user rules the table is not read directly by the roles that must not see every row.'
  - 'Roles: the reporting role reads comment content and comments with a narrower audience than their target only through database functions; the operator role (administrators, all-powerful by the maintainer''s model) sees every row; any other role that may SELECT the base tables sees every row unless its own role is restricted. Per-role grants bound which tables and columns a role sees, not which users'' rows; the change table, comments and notification rows follow the same rule.'
  - A denial test for every rule, at unit level and through the deployed stack against a live database under the backend's real role; shared-data tests run in never-committing transactions, commit-time behaviour in committing sessions in a disposable database.
  - Every denial goes to the security event log, a sink separate from the business audit, with alerting on bursts.
  - 'Forbidden: route- or role-only checks; per-view checks without one module; per-object checks on loaded collections; an override flag passed through from client input.'
- op: node.set
  uid: PIG-WEB-LOGIC.SECURE.2
  epistemic_state: 'known: MD-07 | unvalidated: session table under DB_API''s direct-write exception (inferred); the navigation check (inferred, no ledger row)'
  design_notes: "Positions: - P1 use the framework's session management, not a custom one, kept updated (L323).\n  - P2 random session identifiers (CSPRNG, at least 64 bits), meaningless, carrying no personal data; user data server-side (L322).\n  - P3 cookie with `Secure`, `HttpOnly`, explicit `SameSite=Lax` or `Strict`, the `__Host-` prefix, no `Domain`, the narrowest `Path` (L324); never scoped to a parent domain, because sibling subdomains could plant cookies (L329).\n  - P4 renew the identifier on every privilege change, above all at login (L325).\n  - P5 idle and absolute timeouts enforced on the server, calibrated to risk; numbers differ by body (L326).\n  - P6 logout invalidates the session on the server; responses carrying session identifiers are `no-store` (L327).\n  - P7 the signed-cookie session backend is not for sensitive data: not encrypted, replayable until expiry, not revocable (L328).\n  - P8 the framework's JWT bearer tutorial leaves token storage, revocation and sessions undecided (L317).\n  - Placement cited: an opaque server-side session, revocable, in a backing service, never in process memory (GUARD.4; L315, L022, L319, L086); sessions in Postgres (POSTGRES_FIRST).\n\nForces: security (theft, fixation, revocation, attacker-triggered navigations); the session's function, carrying a login across every arrival into the application. This node serves both: the second is what a session is for, not login friction, which no LOGIC node serves (SECURE roll-up; review M5). They pull apart only on the `SameSite` value.\n\nDecision (all but the `SameSite` value; that value is `undecided` and raised):\n  - **Store**: Django's session framework with the database backend, sessions in Postgres (P1, GUARD.4, POSTGRES_FIRST). The session table is written only by its own backend and carries no state column and no multi-table effect, so it falls under DB_API's direct-write exception (inferred). Expired sessions are purged by a scheduled job (PROCESS.1; inferred).\n  - **Identifier**: framework-generated, random, opaque; user data stays server-side (P2). It travels only in the cookie, never in a URL (X6).\n  - **Cookie**: a `__Host-`-prefixed name, `Secure`, `HttpOnly`, an explicit `SameSite`, no `Domain`, `Path=/` (P3).\n  - **`SameSite` value** (`undecided`, raised in `questions.md`; review M5). L324 admits Lax and Strict; the choice trades the session's function against protection, both forces of this node.\n    - Strict: the cookie is not sent on any cross-site request, top-level navigations included, so an arrival from another site's link starts logged out; it closes attacker-opened windows and navigations carrying the session, through which reflected script injection or cross-site leaks run with the user's session (inferred; the cookie draft, draft-ietf-httpbis-rfc6265bis, calls Lax \"only a speedbump\" against them).\n    - Lax: the login holds on arrival from links, and cross-site top-level GET navigations carry the session (L331).\n    - The earlier claim that Strict's extra protection \"covers only safe requests, which change nothing\" is withdrawn: a safe request that changes nothing can still render user data or reflect input under the session.\n    - **former recorded default (superseded) if unanswered**: `SameSite=Lax`, plus a Fetch Metadata check that refuses or redirects cross-site navigations (`Sec-Fetch-Site: cross-site`, `Sec-Fetch-Mode: navigate`) to authenticated pages that are not declared entry points (inferred; no ledger row); `SameSite=Strict` for operator consoles and other applications never entered from other sites' links.\n  - **Lifecycle**: identifier renewed at login, logout, privilege change and step-up (P4); idle and absolute timeouts both enforced by the server, their values recorded per project by risk class with the NIST assurance levels as reference (P5); logout deletes the server record, and responses that set or contain a session identifier are `Cache-Control: no-store` (P6, L327; personalised responses that merely run under the session are `private, no-cache`, EXPOSE.4; review m10). Because state is server-held, deleting a user's session rows revokes every session at once (L022; inferred use).\n\nRejected: - Signed-cookie sessions and stateless JWT sessions in the browser: never (P7, P8, L022, GUARD.4); acceptable when no backend can hold sessions (GUARD.4's moving condition).\n  - A custom session mechanism: never (P1).\n  - `SameSite=Strict` or `Lax` as the general default: not decided here (raised; see the `SameSite` value above). Strict is required under the former recorded default (superseded) for applications never entered from cross-site links, such as an internal operator console (inferred).\n  - `SameSite=None` or a parent-domain scope: never (P3).\n  - A session identifier in a URL (query string, path): never (X6).\n  - Sessions in process memory: never (L086). A cache service as the session store: acceptable at a measured limit of Postgres (POSTGRES_FIRST).\n\nRealizes: ALLOCATION.GUARD.4 (holds sessions as the identity placement sets).\n\nMaintainer answer MD-07: the judged recommendation is adopted as decided: Lax plus a server-side check rejecting cross-site navigations on sensitive pages, Strict for operator consoles."
  intent: Humans hold an opaque, random session identifier whose data lives server-side in Postgres through Django's database session backend, carried in a `__Host-` cookie with `Secure`, `HttpOnly`, no `Domain` and `Path=/`; the identifier is renewed on every privilege change, both timeouts are enforced by the server, and deleting a user's session rows revokes every session at once. The `SameSite` value trades the session's function against protection and is Lax plus a cross-site navigation check, Strict for operator consoles (MD-07).
  constraints:
  - Use the framework's session management with the database backend, sessions in Postgres; no custom mechanism; expired sessions purged by a scheduled job.
  - Identifier framework-generated, random, opaque, carrying no personal data; it travels only in the cookie, never in a URL.
  - 'Cookie: `__Host-` prefixed name, `Secure`, `HttpOnly`, an explicit `SameSite`, no `Domain`, `Path=/`; never `SameSite=None`, never scoped to a parent domain.'
  - '`SameSite` value (MD-07): `Lax` plus a Fetch Metadata check that refuses or redirects cross-site navigations (`Sec-Fetch-Site: cross-site`, `Sec-Fetch-Mode: navigate`) to authenticated pages that are not declared entry points; `Strict` for operator consoles and other applications never entered from other sites'' links.'
  - Renew the identifier at login, logout, privilege change and step-up.
  - Idle and absolute timeouts both enforced on the server, values recorded per project by risk class with the NIST assurance levels as reference.
  - 'Logout deletes the server record; responses that set or contain a session identifier are `Cache-Control: no-store`.'
  - 'Forbidden: signed-cookie or stateless JWT sessions in the browser; sessions in process memory; a session identifier in a URL.'
