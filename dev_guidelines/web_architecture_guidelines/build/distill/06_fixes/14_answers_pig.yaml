  epistemic_state: 'known: MD-07 | unvalidated: the cookie and bearer endpoints kept apart (inferred)'
- op: node.set
  uid: PIG-WEB-LOGIC.ENFORCE.3
  epistemic_state: 'known: MD-05 | tension: L235''s ORM-first and L237''s views and separate stores narrowed by DB_API, L516 and DERIVE.1'
  design_notes: "Positions: - P1 an ORM for routine mapping, understanding the relational model, with a sanctioned route to hand-written SQL; explore the ORM first (L235).\n  - P2 raw SQL always uses bound parameters, never string formatting (L236).\n  - P3 reads that need no domain behaviour may bypass the domain model: hand-written SQL, views, denormalized tables, separate read stores (L237).\n  - P4 each extra round trip adds latency: fetch related data in one statement, no queries in loops (L614).\n  - Cited: writes through the API functions, simple reads on base tables under SELECT grants, read functions where a read applies a rule, views never a contract (DB_API, L516); reduction in the database, keyset pages, a server maximum page size (DERIVE.2); wrappers generated from the catalogue (TYPE_CHAIN).\n\nForces: correctness; security (injection); latency; changeability.\n\nDecision: 1. **Writes**: only through the generated, typed wrappers of the API functions (DB_API, TYPE_CHAIN); the ORM writes only tables under DB_API's direct-write exception.\n  2. **Reads**, one read layer under the Django default (review m7): the Django ORM, its models used as read-only mappers, for simple reads on base tables under SELECT grants (L516); read functions, called through the generated wrappers, where a read must apply a rule (DB_API), in a short read-only transaction when they need the actor (ENFORCE.2). Each use case gathers its data in one statement or read function, related rows joined or eagerly loaded in that statement, never queries in loops (P4; J3's \"data in, decision out\"). Filtering, sorting and paging in the statement, keyset pages, the server's maximum page size (DERIVE.2, EXPOSE.1).\n  3. **Raw SQL**, where the ORM cannot express a read, through Django's database connection, always with bound parameters (P2); identifiers that must vary come from an allowlist (inferred).\n  4. **Per-user read rules** (`decided by MD-05, read visibility of rows with per-user rules when several backends share the database`, SECURE.1): at the former recorded default (superseded), applied inside the read statement from the shared specification, never by filtering loaded rows in Python (DERIVE.2); for collections, the policy module's query predicate goes into the statement (SECURE.1, review m8). **Under J1's read-function answer** (review M1): the read goes through the read function, run with the actor set (ENFORCE.2), and the table loses direct SELECT, so step 2's \"simple reads on base tables\" no longer covers it. Before the maintainer answered, the reporting role gets no SELECT on comment content or narrower-audience comments, the operator role sees every row, and any other role that may SELECT the base tables sees every row unless its own role is restricted (X1).\n  5. **Read models**: derived data from database cache tables or derived columns (DERIVE.1); no view as a contract (L516); no read store outside the database (RECORD.1).\n\nRejected: - Views as a read contract (P3's views): never (L516, DB_API); acceptable only as throwaway objects no consumer depends on.\n  - Read stores outside Postgres (P3's separate stores): acceptable under DERIVE.1's condition (many external derived stores at a high write rate).\n  - ORM-first writes (P1 as stated): acceptable when one backend is the only consumer (L527's default then applies).\n  - Loading full sets into Python to reduce them: never (DERIVE.2).\n  - A second query layer (SQLAlchemy Core) beside the Django ORM: rejected under the Django default (review m7); acceptable as the read layer of a backend whose framework is not Django (inferred).\n\nRealizes: ALLOCATION.DERIVE.2 (pushes filtering and aggregation to the database)."
  constraints:
  - Writes only through the generated, typed wrappers; the ORM writes only tables under the direct-write exception.
  - 'Reads: the Django ORM as read-only mappers for simple reads on base tables under SELECT grants; read functions through the wrappers where a read must apply a rule, in a short read-only transaction when they need the actor.'
  - Each use case gathers its data in one statement or read function, related rows joined or eagerly loaded, never queries in loops.
  - Filtering, sorting and paging in the statement; keyset pages; a server maximum page size.
  - Raw SQL always with bound parameters, never string formatting; identifiers that must vary come from an allowlist.
  - 'Per-user read rules (MD-05): sensitive reads go through the read function with the actor set, as PIG-WEB-LOGIC.SECURE.1 sets, never by filtering loaded rows in Python; the table is not read directly for them.'
  - Derived data from database cache tables or derived columns; no view as a contract; no read store outside the database.
  - 'Forbidden: views as a read contract; ORM-first writes; loading full sets into Python to reduce them; a second query layer beside the Django ORM.'
- op: node.set
  uid: PIG-WEB-LOGIC.PROCESS.6
  epistemic_state: 'known: MD-05 | unvalidated: the redirect pattern is a synthesis (L434)'
  design_notes: "Positions: - P1 store uploads outside the web root or on another host; serve publicly reachable ones through a handler that maps an identifier to the stored object, never a file path (L432).\n  - P2 serve with the correct stored `Content-Type`, `X-Content-Type-Options: nosniff`, and `Content-Disposition: attachment` with a sanitized filename for anything not meant to render inline (L433).\n  - P3 serve private files through the application's authorization check, redirecting to a short-lived signed download URL instead of proxying bytes or exposing a public bucket (L434; the redirect is a synthesis).\n\nForces: security (access, content sniffing, script in user content); availability (bytes off the application).\n\nDecision: the backend maps a file id to its row (P1), checks authorization (SECURE.1: product policy and the per-user read rule, the latter `decided by MD-05, read visibility of rows with per-user rules when several backends share the database`) and the available state (PROCESS.5), then redirects to a short-lived signed URL for that one object (P3), served from the storage host, an origin other than the application's (P1, EXPOSE.5), with the stored content type, `nosniff`, and `attachment` with a sanitized filename unless the type is one meant to render inline (P2). The redirect response is `private, no-store` (EXPOSE.4; inferred).\n  - **The signed URL is the one allowed exception to \"no credential in a URL\"** (X6): single-purpose (a GET of one object), scope-limited (that object, no listing), lifetime minutes, the value recorded per project (no source gives a number).\n  - **Under J1's read-function answer** (review M1): the per-user check is the file row's read through a read function, run with the actor set (ENFORCE.2), instead of the backend's statement; the file table loses direct SELECT.\n\nRejected: a public bucket for private files: never (P3). Exposing storage paths: never (P1). Proxying the bytes through the application: acceptable when the storage cannot sign URLs or the bytes must be transformed on the way (inferred).\n\nRealizes: no skeleton link; follows ALLOCATION.GUARD.3."
  constraints:
  - The backend maps a file id to its row, checks authorization (product policy and the per-user read rule) and the available state, then redirects to a short-lived signed URL for that one object.
  - The signed URL is single-purpose (a GET of one object), scope-limited (that object, no listing), lifetime minutes (value recorded per project); it is the one allowed exception to no credential in a URL.
  - 'Serve from the storage host, an origin other than the application''s, with the stored `Content-Type`, `X-Content-Type-Options: nosniff`, and `Content-Disposition: attachment` with a sanitized filename unless the type is meant to render inline.'
  - The redirect response is `private, no-store`.
  - 'Per-user read rule (MD-05): the check is the file row''s read through a read function with the actor set, and the file table is not read directly for it.'
  - 'Forbidden: a public bucket for private files; exposing storage paths.'
- op: node.set
  uid: PIG-WEB-INTERACTION.REALTIME.4
  epistemic_state: 'known: MD-05 | unvalidated: identifier-only payloads and the session re-check interval inferred'
  intent: Long-lived connections use TLS only, an Origin allowlist and the session cookie for authentication, with no token ever in a URL; authorization is checked per subscription and per event, streams close at session end, and message size, rate and connections are capped. Per-user reads go through database read functions (MD-05).
  constraints:
  - 'Transport and origin: TLS only; the WebSocket handshake and SSE endpoint check Origin against an explicit allowlist (cross-site WebSocket hijacking); compression off unless measured necessary.'
  - Authentication by the session cookie (HttpOnly, Secure, SameSite; GUARD.4); no session token, bearer token or long-lived credential ever travels in a URL (web-app-philosophy:INTERACTION.ENVIRONMENT.6, whose one exception, signed file-delivery URLs, does not apply to channels); agent clients use their bearer credential in the header on WebSocket-capable transports (inferred).
  - 'Authorization per subscription and per event: subscribing to a channel checks the user''s right to read its target; each event is filtered per subscriber against the target''s read rights before it is sent, with the same filter as every other surface. Event payloads carry identifiers, the cursor and a change kind; content is fetched through the normal authorized endpoints (inferred), unless it has passed the same per-recipient filter.'
  - 'Session end closes the stream: on logout or expiry the connection is closed; the connection process re-checks the session at an interval no longer than the session''s idle timeout (interval inferred).'
  - 'Bounds: message size, message rate and connections per user and per client capped; every inbound message parsed as untrusted input.'
  - 'Per-user reads (MD-05): each event is filtered per subscriber through the database read functions of PIG-WEB-LOGIC.SECURE.1, and the shared denial-test suite covers the real-time channel.'
  - Per-event filtering protects the channel the application serves, nothing stronger; the comment-grant restriction of PIG-WEB-INTERACTION.COLLABORATE.4 (reporting role) applies.
- op: node.set
  uid: PIG-WEB-INTERACTION.COLLABORATE.4
  epistemic_state: 'known: MD-05 | open: author edit window value | unvalidated: L683 and L689 are syntheses | gap: legal moderation obligations not read (L689)'
  constraints:
  - 'Notifications are rows written by the comment writer function in the comment''s transaction (MD-03: a multi-table operation; ACT.2''s staged intent), delivered after commit from those rows (in-app read state; the real-time wake-up of REALTIME.5); external delivery (email, push) is the deferred delivery node.'
  - Mentions are parsed on the server and a notification is created only for a recipient who may see the target (notifications are a secondary surface).
  - 'A recipient''s read right (MD-05): the backend that submits the comment checks each recipient through the database read function of PIG-WEB-LOGIC.SECURE.1 before passing recipients to the writer function.'
  - 'Consequence: the recipient check protects the notifications the application sends, nothing stronger; the operator role and any unrestricted role that may SELECT the base tables see notification rows too. The reporting role gets no SELECT on comment content or on comments with a narrower audience than their target, and reads comments only through database functions (grants: PIG-WEB-DATA.GUARD.2).'
  - 'Moderation actions are always recorded: hide and restore with reason, actor and time written to history; hide first, remove only under a retention or legal rule; authors edit their own comments within a stated window, each edit a revision (.2). Removal runs through a deletion function, never a DELETE grant; where a legal rule demands erasure rather than an archive copy, the tension with the archive rule is the personal-data node''s (PIG-WEB-DATA.MAINTAIN.6, deferred).'
  - A report queue (report rows, status, decision) is required whenever comments are visible to people outside the team (customers, the public).
  - Moderate is a separate ability; agent-authored comments are marked and filterable as a class.
- op: node.set
  uid: PIG-WEB-TRANSVERSE.SECURITY.1
  epistemic_state: 'known: MD-05 | gap: ASVS chapter list not read (L304''s level part now grounded)'
  constraints:
  - ASVS 5.0 is the catalogue. Requirements are cited by their versioned id in this guideline's traces and in the project's tests and reviews.
  - 'The level is a recorded decision per project, by risk (EVOLUTION.3; the source''s own rule). Default: Level 2, the level the ASVS 5.0 text says most applications should strive for (grounded). The MD-03 context fits it: the application holds business data of several consumers and accepts writes from humans and agents. Level 3 when a breach would be critical (payments, health, safety; the source''s "highest levels of security", the examples inferred). Level 1 is never the default, consistent with the source''s "starting point".'
  - 'Each requirement is verified at the tier the placements name. Access control is checked where GUARD.3 puts it: writer functions for per-user write rules, the backend for product policy and identity, Postgres roles per consumer (MD-01, MD-03), database read functions for sensitive reads (MD-05); no access-control requirement is marked met on a stronger guarantee than that rule gives.'
  - Where a requirement has an automated check, it runs in the pipeline (OPERABILITY.6).
- op: node.set
  uid: PIG-WEB-TRANSVERSE.SECURITY.4
  epistemic_state: 'known: MD-06 | conflict: L350 contested (environment variables against a managed store), reconciled by authority and delivery | unvalidated: the reconciliation; credentials per consumer role'
  intent: 'A managed store is the authority for every secret, with least privilege per service and per database consumer role, automated rotation and audited access; secrets reach the process at start by file or a non-shared environment. The hosting model is a per-project choice (MD-06): on self-managed hosts without an orchestrator, one acceptable route, the store is a technology to add and until then a file outside source control readable only by the service account is in force; on an orchestrated platform its secret store is the managed store.'
  design_notes: "Rows: L350, L351, L352, L353. Cited: L102, L250, L036.\nPositions: - P1 secrets in environment variables (Twelve-Factor: simple, language-neutral, portable; L350).\n  - P2 runtime injection from a managed store, with access control, rotation and audit (OWASP; L350, L351).\n  - Consensus: centralised storage, least privilege per service, short-lived dynamic secrets with automated rotation, every access audited with logs kept at least 90 days (L351); the framework signing secret kept confidential (L352); CI/CD treated as production (L353); secrets never in source (L102, L250).\nForces: P2 serves confidentiality, revocation and accountability (who read which secret), at the cost of a store to run or rent. P1 serves simplicity and portability; environment variables are visible to many processes and leak through dumps and error pages (L350). The positions answer two different questions: where the secret is held, and how it reaches the process.\nDecision (lead): P2 as the authority; delivery at process start by file or environment.\nRejected: P1 as the place where secrets are held: acceptable when no managed store exists on the platform and adding one is not budgeted (EVOLUTION.4). The secret then sits in a file outside source control, readable only by the service account (L250), and rotation is a scheduled task.\nUnder the assumed hosting: (self-managed hosts, no orchestrator; questions.md, Q1): there is no platform store, so the managed store is a technology to add, weighed under EVOLUTION.4 (J5: a new technology past a measured need, its operating cost budgeted). Until it is added, the file fallback above is in force. On a platform that offers a store, the store is the authority from the start.\nRealizes: refines TRANSVERSE.SECURITY (exposure, L036); rests on the J1 access paths (one role per consumer, MD-03).\nReview fixes: m6 (the default under the assumed hosting stated plainly: the store is a technology to add, the file fallback in force until then; folded into Q1).\n\nMaintainer answer MD-06 applies: hosting is a per-project choice; the file fallback is the self-managed route."
- op: node.set
  uid: PIG-WEB-TRANSVERSE.OPERABILITY.5
  epistemic_state: 'known: MD-05 | unvalidated: commit-time behaviour tested in a disposable database; concurrency tests required by GUARD.2; tests run as the consumer role | gap: no row on concurrency testing'
  constraints:
  - Every test that touches data runs on Postgres at the production version. It uses a disposable database per run, never production.
  - Each test runs in a transaction that is rolled back. In any shared environment, a mutating test runs in a forced-rollback boundary; a human uses an explicit rollback.
  - 'Behaviour that only shows at commit cannot be tested inside a rolled-back transaction: serialisation failures and retries, lock waits between sessions, deferred constraints, the outbox and NOTIFY. It is tested with concurrent committing sessions in the disposable database, which is then dropped, never in a shared one; the never-committing rule governs shared environments, so this does not breach it.'
  - 'Concurrency tests for the rules GUARD.2 requires (Serializable with retry, locks) are part of the default test suite, not a gap: every invariant GUARD.2 enforces procedurally has a concurrent test (inferred from GUARD.2; web-app-philosophy:TRANSVERSE.OPERABILITY.2).'
  - 'Database tests connect as the consumer role under test, never as the owner (inferred: ROW_SECURITY''s "denial tested through the deployed role", generalised to every grant). They cover writer functions, constraints, grants per role, the actor pairing and the refusal of writes without an actor (web-app-philosophy:TRANSVERSE.OPERABILITY.2, ACT.4).'
  - Backend product policy and parsing are tested in memory.
  - 'Per-user read visibility (MD-05): the shared denial-test suite every backend runs is part of the default suite, and denial tests of the database read functions run against those functions.'
  - End-to-end tests are few, on critical journeys.
- op: node.set
  uid: PIG-WEB-TRANSVERSE.TOPOLOGY.3
  epistemic_state: 'known: MD-06 | conflict: L157 contested, settled by hosting model | unvalidated: roles per kind of process'
  intent: 'One non-root, pinned image per release serves web, worker and admin processes with the same config. The hosting model is a per-project choice recorded as a decision (MD-06): a prototype takes the fastest secure path, and an orchestration platform is added when reliability and scaling are needed. On self-managed hosts without an orchestrator, one acceptable route, each unit runs a process manager with several workers, workers run as extra units on the web host and a supervisor runs everything unprivileged; with an orchestrator, one server process per container wins.'
  constraints:
  - One image per release, multi-stage, non-root, pinned base. Web, worker and admin processes all start from it with the same config.
  - 'On one or a few self-managed hosts without an orchestrator, one acceptable route (MD-06): each unit runs a process manager with several workers. Workers run as extra units on the web host. A supervisor runs everything as an unprivileged account.'
  - Admin consoles and scripts run from the same release image with the operator role's credentials. Migrations and human-run data jobs use the owner role under the data-job checklist (inferred).
  - The hosting model is chosen per project and recorded (EVOLUTION.3, MD-06); with an orchestrator, one server process per container replaces the process manager, and the unprivileged supervisor, same-image and same-config rules still hold.
  design_notes: "Rows: L156, L157, L158, L159, L160.\nPositions: - Images: staged builds, non-root, pinned base, minimal context (L156).\n  - Replication (L157, contested): P1 a process manager inside the unit (Gunicorn with workers, or Uvicorn --workers) for a single server or Compose; P2 one server process per container, replicated by an orchestrator or platform.\n  - Supervisor, unprivileged account (L158).\n  - Workers: P3 extra units on the web host; P4 separately scaled containers or services (L159, synthesis).\n  - Workers and admin processes from the same release image, code, dependencies and config; admin code ships with the application (L160).\nForces: P1 serves crash containment inside a unit without an orchestrator (L152). P2 serves replication and scaling by the platform (one concern per container, L092), at the cost of running an orchestrator. P3 serves simplicity; P4 serves scaling jobs apart from web load.\nDecision (lead): the image and supervision practices; P1 and P3 under the assumed hosting.\nRejected: P2: wins when an orchestrator or platform replicates containers; then each container runs one server process (L157). P4: wins when job load differs from web load enough to scale apart, measured (L159).\nRealizes: refines LOGIC.PROCESS (process types, supervisor, one concern per container); rests on the J1 access paths (roles per kind of process).\n\nBuild narrative moved out of the constraints: one or a few self-managed hosts, no orchestrator; questions.md, Q1.\n\nMaintainer answer MD-06: hosting is chosen per project and recorded as a decision; when prototyping, reach something that works fast as long as it is secure; an orchestration platform brings reliability and scaling but is not what a prototype needs first. The self-managed defaults are one acceptable route; the orchestrated case lists what changes (here, TOPOLOGY.4 and SECURITY.4)."
- op: node.set
  uid: PIG-WEB-TRANSVERSE.TOPOLOGY.4
  epistemic_state: 'known: MD-06 | unvalidated: cumulative asset store across the compatibility window; CDN threshold (L165)'
  constraints:
  - Assets are built and collected once into the release artifact, with fingerprinted names. The proxy serves them with long-lived immutable caching and compression.
  - Fingerprinted files of previous releases stay available for the compatibility window, as long as an old page can stay open. The asset store is cumulative across releases and pruned after the window (inferred).
  - A CDN is added when users are distant or origin load justifies it. It caches fingerprinted files for the long term. It micro-caches only anonymous responses carrying no nonce and no personal data (SECURITY.3).
  - The static-file default is the self-managed route of MD-06 (the proxy on the application host serves them); on an orchestrated platform the platform's edge or object store may serve the built assets, with the fingerprinting and window rules unchanged (inferred).
  design_notes: "Rows: L161, L162, L163, L164, L165, L166, L167. Cited: L009, L101.\nPositions: - Where to serve (L161, majority): P1 from the proxy on the application host; P2 a dedicated static server; P3 object storage behind a CDN; P4 in-app (WhiteNoise-style) behind a CDN (L164, single T3).\n  - Consensus: collect into one directory, serve outside Python request handlers (L162); hashed file names rewritten inside CSS and JS (L163); compress at proxy or CDN (L167).\n  - CDN: optional, added for distant users or origin load (L165, threshold inferred); long-term caching of fingerprinted files, seconds-long micro-caching of anonymous dynamic responses, hit ratio watched (L166).\nForces: P1 serves simplicity on one region. P3 serves distant users and origin load, at the cost of another service. P4 serves platforms without a proxy, and needs a CDN in front.\nDecision (lead): P1 by default, with fingerprinting, compression and a kept asset history.\nRejected: P3: wins when users are geographically distant or origin load is measured too high (L165). P4: acceptable on a platform without a proxy, always behind a CDN (L164). Serving static files through Python handlers without a CDN: never in production (L162).\nRealizes: refines LOGIC.PROCESS through TOPOLOGY; realizes J4's hand-offs from INTERACTION.ENVIRONMENT.3 and .4.\n\nMaintainer answer MD-06 applies: hosting is a per-project choice; the proxy-served default is the self-managed route."
- op: node.set
  uid: PIG-WEB-INTERACTION.COLLABORATE.2
  constraints:
  - Adjacency list with one displayed level of replies (the depth most review tools use) and a thread-root id set once at insert, so a thread loads in one indexed query and resolution, counts and permissions attach to the root.
  - 'Resolution on the thread root, reversible, never a deletion. Who may resolve follows GUARD.3 as settled: the row-decidable part (the target''s author) is decided by the writer function; users with write rights on the target and the product roles that grant "resolve" are each backend''s policy. No source gives the thread''s opener a resolve right, so none is stated.'
  - 'Deletion is a tombstone: content cleared, deleted_at and actor kept, replies preserved. It is an update through the comment''s deletion function, never a bare update or a DELETE grant. Keeping the replies is an explicit, justified deviation from the default soft-delete cascade (a cascade equals what a native cascading delete would remove unless each deviation is explicit): a thread stays readable when one comment goes.'
  - 'Every edit is an append-only revision, shown as "edited": what was said and when stays reconstructable; the revision rows are the comment''s history (ACT.4).'
  - A tombstone clears the visible content; earlier revisions stay under the history's retention and access rules (moderators only) until a retention or erasure rule removes them (inferred; erasure itself is the deferred personal-data node).
  - 'Erasure against the archive rule (recorded tension, not settled here): the maintainer doctrine allows hard deletion only for rebuildable derived data or after copying the row to an archive in the same operation, and grants no DELETE to application roles. An archive copy defeats an erasure that must remove personal data. Hard deletion of comment content or revisions for erasure is therefore handed to the deferred personal-data node (PIG-WEB-DATA.MAINTAIN.6), which must reconcile it with the archive rule. The default deletion mechanism for user-facing data is basic soft delete (PIG-WEB-DATA.MAINTAIN.2); a tombstone keeps threads intact (inferred).'
- op: node.set
  uid: PIG-WEB-TRANSVERSE.TOPOLOGY.1
  constraints:
  - The proxy is the only public entry; the application listens on a unix socket or a private address.
  - It buffers requests and responses, except on streaming routes (SSE, streamed agent responses), where buffering is turned off so events are not held back (inferred).
  - It sets Host and the forwarded scheme itself, overwriting any client copy. The application trusts forwarded headers only from the proxy's address and validates Host against its allowed list.
  - It carries TLS (SECURITY.2), compression (TOPOLOGY.4), static files and the outermost request limits (LOGIC.SECURE).
  - 'Product choice by hosting model (a per-project decision, MD-06). Criteria: full buffering, automatic certificates or a tested ACME client, forwarded-header control. No source ranks them.'
