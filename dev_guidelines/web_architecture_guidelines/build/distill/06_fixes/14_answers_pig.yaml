operations:
- op: node.set
  uid: ROOT
  epistemic_state: known (roll-up)
  design_notes: 'Maintainer decisions applied: MD-01 (row-level security is not a default; acceptable only for a simple data model, with the scoping key in every covered table and no all-powerful administrator role), MD-02 (interface documentation is always in sync, guaranteed by process; its origin, description or code, is chosen per project with criteria for each direction), MD-03 (the database is shared by several backends and other consumers; multi-table operations belong to the database as functions; the function API is the default contract to the data). Each decision overrides the judges on its point and is cited by id in the nodes it governs. Open maintainer questions: read visibility of rows with per-user rules when several backends share the database; default deletion for user-facing transactional data; SameSite value of the session cookie; hosting model of the default context.


    Maintainer answers MD-04 (deletion: basic soft delete by default), MD-05 (reads: simple direct, sensitive through database functions), MD-06 (hosting per project) and MD-07 (SameSite as judged) closed the four open questions; no clause awaits the maintainer.'
- op: node.set
  uid: PIG-WEB-ALLOCATION
  epistemic_state: 'known: MD-05'
  design_notes: 'Roll-up of the seven placements below; owns no ledger row. Context: MD-03 makes a shared database (several backends, BI, consoles, scripts) the default, replacing the earlier single-consumer context. Maintainer decisions applied: MD-01 (row security), MD-02 (interface description sync, origin per project), MD-03 (shared database, multi-table operations in database functions). Open: one clause, read visibility of rows with per-user rules (Q1, ALLOCATION.GUARD.3 in the philosophy graph); former recorded default (superseded) is each backend filtering from one shared specification with shared denial tests; fallback is database read functions receiving the verified actor, acceptable when a per-user read rule must hold for two or more backends (always the case under MD-03); roles that may SELECT base tables see every row unless their own role is restricted. Revisions: R1 (MD-01, MD-03), R2 and R3 changes sit in the children.'
- op: node.set
  uid: PIG-WEB-DATA
  epistemic_state: 'known: MD-05 | gap: collation (ORGANIZE.3)'
  design_notes: "Question: how Postgres realizes the database share of each placement.\nPositions: none of its own (owns no row); roll-up of its six children.\nDecision and grounds: roll-up. Postgres is the system of record and holds everything that must hold whoever touches the data (RECORD.1, MD-03). It does that work in six ways:\n  - organize: normalized tables, scope-leading composite keys for scoped rows and identity keys elsewhere, precise column types, names that carry role and type, bounded JSON validated against schemas held in the database, schemas as domain namespaces, and every index justified by a query (ORGANIZE);\n  - guard: every rule a declarative constraint can express is declared; one role per consumer with narrow grants and no DELETE; no row-level security by default (MD-01); triggers only for a closed list of atomic side records (GUARD);\n  - concurrency: Serializable with retry for every writing role, version checks on user-edited rows, transaction-scoped locks only, idempotent statements, commit-order-safe readers (CONCURRENCY);\n  - maintain: online-safe versioned migrations with a drift gate, deletion chosen per table (default decided by MD-05, question 1), trigger-written append-only history, human-run bulk jobs under a checklist, point-in-time recovery proven by restore (MAINTAIN);\n  - derive: derived copies only with a sync plan and a drift guard, kept by a same-transaction trigger where any other writer exists; caches in classified, commented tables (DERIVE);\n  - interface: the function API with its conventions and its compatibility rule, reached through a pooler with per-role limits and timeouts (INTERFACE).\nRejected: none at this level.\nRealizes: refines web-app-philosophy:DATA (skeleton link). Through its children: RECORD.1, RECORD.2, RECORD.3, GUARD.2, GUARD.3 (per-role layer), GUARD.5, GUARD.6, ACT.1, ACT.3, ACT.4, DERIVE.1, DERIVE.3, and the stack placements DB_API, TYPE_CHAIN, ROW_SECURITY, CACHE_STORE."
  constraints:
  - 'Organize: normalized tables, scope-leading composite keys for scoped rows and identity keys elsewhere, precise column types, names that carry role and type, bounded JSON validated against schemas held in the database, schemas as domain namespaces, and every index justified by a query.'
  - 'Guard: every rule a declarative constraint can express is declared; one role per consumer with narrow grants and no DELETE; no row-level security by default (MD-01); triggers only for a closed list of atomic side records.'
  - 'Concurrency: Serializable with retry for every writing role, version checks on user-edited rows, transaction-scoped locks only, idempotent statements, commit-order-safe readers.'
  - 'Maintain: online-safe versioned migrations with a drift gate, deletion chosen per table (default basic soft delete), trigger-written append-only history, human-run bulk jobs under a checklist, point-in-time recovery proven by restore.'
  - 'Derive: derived copies only with a sync plan and a drift guard, kept by a same-transaction trigger where any other writer exists; caches in classified, commented tables.'
  - 'Interface: the function API with its conventions and its compatibility rule, reached through a pooler with per-role limits and timeouts.'
- op: node.set
  uid: PIG-WEB-LOGIC
  epistemic_state: 'known (roll-up): MD-05 | unvalidated: framework choice (ENFORCE.5)'
- op: node.set
  uid: PIG-WEB-INTERACTION
  epistemic_state: 'known: MD-05'
  design_notes: "Decides: how browser JavaScript and the agent surface realize the interaction share of each placement.\nRows: none (roll-up).\nDecision: roll-up of five children. Browsers get server-rendered HTML from Python, enhanced with JavaScript only where a part is interactive; agents get an OAuth-protected adapter over the same HTTP core. Neither decides anything durable: each holds copies (the version it read, drafts, a server-state cache, its own credential) and every decision reaches a backend and the database's writer functions.\n  - Visualize: per-request HTML from Python, build-time output where the URL set is known, islands only under the rendering placement's criteria; view state in the URL; LCP content in the first HTML; WCAG 2.2 AA (VISUALIZE).\n  - Edit: POST, then 303; the version travels with every edit and a stale write is shown as a conflict with both versions; layered duplicate suppression (EDIT).\n  - Real time: polling, then server-sent events, then WebSocket for two-way traffic; events are hints keyed by a commit-safe cursor; Postgres wakes the connection processes, tables carry the data (REALTIME).\n  - Collaborate: comments anchored by foreign key and target version, threads by parent pointer, tombstones and revisions, notifications as rows written with the comment, moderation as a recorded queue; a text engine only for long collaborative text, server-authoritative (COLLABORATE).\n  - Agent: OpenAPI-described core, an MCP adapter for third-party agent hosts whose tool list and schemas are kept in sync like the description, protected-resource metadata, delegated identity recording user and agent, approval for irreversible effects held on the server, agent-shaped errors and per-agent quotas (AGENT).\n  - Environment: feature detection, back/forward-cache eligibility, input saved on page hide (ENVIRONMENT).\nRealizes: refines INTERACTION (J4); through its children ALLOCATION.PRESENT.1 to .3, GUARD.3 to GUARD.6, ACT.2, ACT.4, RULES.4, PIG-WEB-ALLOCATION.JS_SERVER and POSTGRES_FIRST.\nInherited open clause (from the authorization placement, through REALTIME.4 and COLLABORATE.4): decided by MD-05, read visibility of rows with per-user rules when several backends share the database. former recorded default (superseded): each backend filters these reads from one shared written specification, with a shared denial-test suite every backend runs; database read functions that receive the verified actor stay acceptable when a per-user read rule must hold for two or more backends. Consequence: Before the maintainer answered, the reporting role gets no SELECT on comment content or narrower-audience comments, the operator role sees every row, and any other role that may SELECT the base tables sees every row unless its own role is restricted.\nMaintainer decisions applied: MD-01 (no row-level security by default; authorization stays a backend decision), MD-02 (interface description always in sync, origin per project, extended here to the agent tool surface), MD-03 (several consumers share the database; multi-table operations are database function calls).\nContested rows decided by composing positions along conditions the default context fixes: push channel (L436), token binding (L641), agent protocol surface (L635), approval design (L646); automated traffic (L652) carried into AGENT.5. Two owned rows narrowed to fit settled placements: L437 (Redis only at a measured limit, by POSTGRES_FIRST) and L583 (multi-step writes are database functions, by MD-03).\nEvidence gaps: (1) no ledger row names AA; AA is grounded through the W3C conformance page plus the max rule, one legal floor at AA read (US ADA Title II rule, WCAG 2.1 AA), both sources not yet in the register, other jurisdictions not read; (2) the push-channel debate rests on a T3 guide and a T4 vendor, the SSE buffering claim on one vendor source; (3) the comment model rests mostly on single or inferred sources (L665, L669, L670, L683; L673 has none), legal moderation obligations not read; (4) agent identity and registration rest on moving specifications and drafts, agent-readable content on T4 and secondhand evidence; (5) a separate process type for long-lived connections (L458) and reconnect jitter (L454) are inferred; (6) no owned row chooses the enhancement library or the islands component library: left open; (7) the rate-limit partition (L651) is inferred, its combination a synthesis.\nReview: the adversarial review's findings on this unit are applied (read-visibility notation and consequence, no credentials in URLs, MCP tool schemas under the drift gate, scarce-goods flows, resolve right, POST for state-changing forms, 409 and 412/428 split, AA grounding, tombstones through deletion functions, per-tab drafts on sensitive pages, NOTIFY only for live subscribers, cursor horizon stall)."
- op: node.set
  uid: PIG-WEB-TRANSVERSE
  epistemic_state: 'known | gap: owns no row (roll-up)'
- op: node.set
  uid: PIG-WEB-DATA.GUARD
  epistemic_state: 'known: MD-05 | conflict: against L471 (inherited from J1), L493 (GUARD.1) and L529 (GUARD.4)'
  design_notes: 'Question: how Postgres declares integrity and access: constraints, roles, row policies and triggers.

    Positions: none of its own; roll-up of GUARD.1 to .4.

    Decision and grounds: roll-up. Every rule a declarative constraint can express is declared and named (GUARD.1); each consumer has its own login role in narrow group roles, no consumer holds DELETE or owns objects, functions that need rights the caller lacks are owned by narrow non-login roles, not by the owner role, and state columns are revoked from direct update (GUARD.2); row-level security is not a default (MD-01) and the acting user reaches the database only as a transaction-local claim that writer functions and audit triggers check (GUARD.3); triggers do a closed list of atomic side work and never business transitions (GUARD.4).

    decided by MD-05 (X1): `decided by MD-05, read visibility of rows with per-user rules when several backends share the database` (J1 Q1). former recorded default (superseded), J1''s word for word: A provisional, with one written specification per rule and a shared denial suite; B acceptable when a per-user read rule must hold for two or more backends. In this tier: each backend filters these reads from one shared written specification, with a shared denial-test suite every backend runs; database read functions that receive the verified actor are acceptable when a per-user read rule must hold for two or more backends, and where B''s condition holds, read functions join INTERFACE.1 and read GUARD.3''s context. Consequence: Before the maintainer answered, the reporting role gets no SELECT on comment content or narrower-audience comments, the operator role sees every row, and any other role that may SELECT the base tables sees every row unless its own role is restricted. The database''s part otherwise is the per-role grants of GUARD.2.

    Realizes: refines web-app-philosophy:DATA.GUARD; through its children ALLOCATION.GUARD.2, GUARD.3 (per-role layer), ACT.1, ACT.4, ROW_SECURITY.'
- op: node.set
  uid: PIG-WEB-DATA.MAINTAIN
  epistemic_state: 'known | gap: personal-data erasure and high availability deferred'
  intent: Structure changes only through small, re-runnable, online-safe versioned migrations with a CI drift gate, and every change leaves trigger-written append-only history. Deletion is chosen per table from the reason the data is kept (the default is basic soft delete, MD-04), large data changes are human-run batched jobs, and recovery to a moment is proven by rehearsed restores.
  constraints:
  - 'Migrations: structure changes only through small, re-runnable, online-safe versioned migrations, with incompatible changes as expand, migrate, contract and a CI gate against drift.'
  - 'Deletion, Retention and Partitioning: deletion is chosen per table from the reason the data is kept; the default is basic soft delete (MD-04).'
  - 'History Tables: every change leaves trigger-written, append-only history naming the consumer role and the claimed actor.'
  - 'Bulk Data Jobs: large data changes are human-run, batched, idempotent jobs with a convergence query.'
  - 'Backup and Recovery: recovery to a moment is possible and proven by rehearsed restores.'
- op: node.set
  uid: PIG-WEB-DATA.INTERFACE
  epistemic_state: 'known: MD-03, MD-05'
  design_notes: 'Question: how the database offers itself to its consumers: functions, views and connections.

    Positions: none of its own; roll-up of INTERFACE.1 and .2.

    Decision and grounds: roll-up. The database offers a function API in its own schema, one call per business operation in its own transaction, evolved by expand, migrate, contract under a catalogue gate, with views kept off the contract (INTERFACE.1). Consumers reach it through a pooler in transaction mode, with role-level settings for isolation and timeouts and a connection limit per consumer role (INTERFACE.2).

    decided by MD-05 (B1, X1): `decided by MD-05, read visibility of rows with per-user rules when several backends share the database` (J1 Q1). former recorded default (superseded), J1''s word for word: A provisional, with one written specification per rule and a shared denial suite; B acceptable when a per-user read rule must hold for two or more backends. Where B''s condition holds, read functions join INTERFACE.1 and read GUARD.3''s context.

    Realizes: PIG-WEB-ALLOCATION.DB_API; ALLOCATION.RECORD.2. Gap (J2''s gap 1): no philosophy node holds the database interface; J2 proposed `DATA.INTERFACE` to the skeleton owner; until then this node has no same-branch refines link.'
- op: node.set
  uid: PIG-WEB-LOGIC.SECURE
  epistemic_state: 'known (roll-up): MD-05'
  constraints:
  - Access checks are central, deny by default and object level; the backend's checks are kept in full because row-level security is off (MD-01).
  - Humans hold an opaque, revocable, server-side session in Postgres; the `SameSite` value of its cookie is Lax plus a cross-site navigation check, Strict for operator consoles (MD-07).
  - No session token, bearer token or long-lived credential ever travels in a URL; the signed upload policy and the signed download URL are the stated exceptions.
  - Agents hold short-lived, audience-bound, revocable tokens.
  - 'Limits apply at two depths: identity-blind at the proxy, identity-aware per identity and operation in the backend.'
  - Server-side fetches of client- or agent-named URLs cannot reach private, loopback or link-local addresses.
- op: node.set
  uid: PIG-WEB-LOGIC.ENFORCE
  epistemic_state: 'known (roll-up) | unvalidated: framework choice (ENFORCE.5)'
- op: node.set
  uid: PIG-WEB-LOGIC.PROCESS
  epistemic_state: known (roll-up)
- op: node.set
  uid: PIG-WEB-INTERACTION.REALTIME
  epistemic_state: 'known: MD-05'
- op: node.set
  uid: PIG-WEB-INTERACTION.COLLABORATE
  epistemic_state: 'known: MD-05 | unvalidated: single-source comment model (.1, .2)'
  constraints:
  - 'Comment Anchoring: comments are their own rows, anchored to their target by a foreign key and the target version they were written against, with redundant selectors for text ranges and an explicit anchor state.'
  - 'Threads and Comment Lifecycle: threads by parent pointer with a thread-root id, resolution on the root, tombstones and append-only revisions.'
  - 'Collaborative Text Editing: a server-authoritative text engine only for long collaborative text fields.'
  - 'Notifications and Moderation: notifications as rows written with the comment, moderation as a recorded queue.'
  - Every write is one writer-function call (MD-03); abilities and visibility follow the authorization placement, the read rule of MD-05 included.
- op: node.set
  uid: PIG-WEB-TRANSVERSE.SECURITY
  epistemic_state: 'known | gap: owns no row (roll-up)'
  constraints:
  - ASVS 5.0 as the verifiable catalogue at a recorded level (Level 2 by default, grounded in the ASVS 5.0 text).
  - HTTPS terminated at the proxy, HSTS with a long max-age on the application's host, includeSubDomains once its subdomains serve HTTPS, preload only as a recorded decision.
  - a strict nonce-based CSP rolled out report-only first, plus a small header baseline.
  - secrets held in a managed store, per consumer role, rotated and audited, with a file fallback in force until a store is added on self-managed hosting (MD-06).
  - dependencies pinned with hashes, an SBOM scanned continuously, signed provenance at SLSA Build L3 verified before deploy, Build L2 acceptable when the build platform cannot isolate runs.
- op: node.set
  uid: PIG-WEB-TRANSVERSE.OPERABILITY
  epistemic_state: 'known | gap: owns no row (roll-up)'
- op: node.set
  uid: PIG-WEB-TRANSVERSE.TOPOLOGY
  epistemic_state: 'known | gap: owns no row (roll-up)'
- op: node.set
  uid: PIG-WEB-DATA.GUARD.2
  epistemic_state: 'known: MD-03, MD-05 | unvalidated: narrow non-login function-owner roles resolving tension 2, grant-matrix check in CI'
  design_notes: "Question: how database roles, grants and authentication separate owners, runtime users and humans.\nPositions:\n  - P1 explicit, minimal search_path; revoke CREATE on `public` from PUBLIC (L181).\n  - P2 the owner role that runs migrations differs from the runtime role, which gets only the DML it needs (L182, inferred synthesis).\n  - P3 privileges granted to NOLOGIN group roles; login roles are members (L183).\n  - P4 no superuser for daily work or the application (L184).\n  - P5 revoke PUBLIC defaults (CONNECT, TEMPORARY, EXECUTE on functions); ALTER DEFAULT PRIVILEGES for future objects; REVOKE in the same transaction as the creation (L185).\n  - P6 scram-sha-256; trust only on local sockets; TLS (hostssl) for remote connections (L186).\n  - P7 role hierarchy per functional branch (read, write, admin), each including the one below; default privileges; grants checked at every level; narrow roles for sensitive features; no DELETE grants; humans are members of roles; a function lists a user's effective permissions (L514 MAINT).\n  - Placement: J1's access paths (one role per consumer; backend, reporting, operator, owner) and GUARD.3's per-role layer (EXECUTE per function, SELECT per table and column, UPDATE revoked on state columns).\nForces: security and integrity (what a consumer can do whatever its code) against administration effort.\nDecision and grounds: P1 to P7 adopted, shaped to J1's access paths (max).\n  - Group roles (NOLOGIN, L183) per functional branch (L514): a read level (SELECT on tables and columns), an API level (USAGE on the API schema, EXECUTE on the functions of that branch), and an admin level. Under MD-03 the \"write\" level of L514 is EXECUTE on writer functions, not table DML; direct INSERT or UPDATE is granted only under DB_API's single-consumer exception, and never on state columns (J1 GUARD.3, L596).\n  - Login roles: one per consumer (each backend, the reporting tool, the console, each script family), neither owner nor superuser (L182, L184), a member of the group roles it needs. One login per consumer is what makes the session role in history rows (MAINTAIN.3) name the consumer (J1 actor trust). Humans have personal login roles, members of the operator or read roles (L514); they assert only themselves as actor (J1).\n  - Owner role: owns tables and the other schema objects (one owner per table, L519), runs migrations and human-run data jobs, never serves requests (J1). It does not own the functions that run with their owner's rights (changed after review, M3): a table owner holds rights that cannot be granted separately (L182, SRC-146), including disabling the table's triggers, so a bug or injectable dynamic SQL in a function running with the owner's rights could switch off the history and constraint triggers or drop objects.\n  - Narrow function-owner roles (changed after review, M3; inferred): each family of functions that must write what the caller cannot is owned by its own NOLOGIN role holding only the DML that family executes, for example a deletion role (DELETE on the target tables, INSERT on the archive), a history-writer role (INSERT on the history tables) and a cache-maintenance role (DELETE and upsert on the cache tables and invalidation queue). No consumer role is a member of these roles, and none of them owns a table. This follows L514's \"narrow roles for sensitive features can be granted independently\", L184's \"grant the narrow attributes needed\" and the doctrine's own grant of DELETE to one admin role for cache invalidation (L525's tension note). It resolves doctrine-internal tension 2 (no DELETE grant, yet archive-then-delete needs one): DELETE is held by a narrow non-login role that owns the deletion functions; the caller does not hold it (inferred).\n  - Functions with their owner's rights run only where they must write what the caller cannot (J1 GUARD.3), owned by the narrow role above, with a fixed search_path and schema-qualified references (L181, L505; inferred for this function form).\n  - Defaults: EXECUTE on functions, CONNECT and TEMPORARY revoked from PUBLIC; default privileges set so new objects get the right grants; each REVOKE in the creating transaction (L185).\n  - Reporting role: SELECT on the tables and columns it needs, personal-data columns withheld by default (J1); on a replica when its load matters. Like the operator role, it sees every row of a table it may SELECT, rows with per-user rules and comments included, unless its own role is restricted (X1).\n  - Authentication: scram-sha-256, TLS for every remote connection, trust only on local sockets (L186).\n  - A function lists a role's effective permissions (L514), and CI checks the grant matrix against the role design (inferred).\n  - Per-role settings (timeouts, default isolation) are set here, on the role (CONCURRENCY.1, INTERFACE.2).\ndecided by MD-05 (B1, X1): `decided by MD-05, read visibility of rows with per-user rules when several backends share the database` (J1 Q1). former recorded default (superseded), J1's word for word: A provisional, with one written specification per rule and a shared denial suite; B acceptable when a per-user read rule must hold for two or more backends. For this node: by default each backend filters these reads and this node grants per role; where B's condition holds, consumer roles receive EXECUTE on the read functions (INTERFACE.1) and, per role, lose direct SELECT on the tables those functions guard. Before the maintainer answered, the reporting role gets no SELECT on comment content or narrower-audience comments, the operator role sees every row, and any other role that may SELECT the base tables sees every row unless its own role is restricted.\nRejected: one shared runtime role for all consumers: rejected (J1 access paths; audit could not name the consumer). DELETE grants to consumer roles: never (L514, L525). Superuser or owner for the application: never (L184, L182). Definer functions owned by the owner role: rejected (M3); acceptable never, since a narrow role always suffices for a function family's DML.\nRealizes: ALLOCATION.GUARD.3 (database layer per consumer role); ALLOCATION.RECORD.2 and PIG-WEB-ALLOCATION.DB_API (EXECUTE as the contract's access); ALLOCATION.ACT.4 (session role names the consumer). Links proposed, not created: GUARD.2 realizes GUARD.3 and DB_API.\n\nBuild narrative moved out of the constraints: changed after review, M3; changed after review, M3; inferred."
  constraints:
  - 'Group roles (NOLOGIN) per functional branch: a read level (SELECT on tables and columns), an API level (USAGE on the API schema, EXECUTE on the functions of that branch), and an admin level. Under MD-03 the "write" level is EXECUTE on writer functions, not table DML; direct INSERT or UPDATE is granted only under DB_API''s single-consumer exception, and never on state columns (web-app-philosophy:ALLOCATION.GUARD.3).'
  - 'Login roles: one per consumer (each backend, the reporting tool, the console, each script family), neither owner nor superuser, a member of the group roles it needs. One login per consumer is what makes the session role in history rows (MAINTAIN.3) name the consumer (actor trust). Humans have personal login roles, members of the operator or read roles; they assert only themselves as actor.'
  - 'Owner role: owns tables and the other schema objects (one owner per table), runs migrations and human-run data jobs, never serves requests. It does not own the functions that run with their owner''s rights: a table owner holds rights that cannot be granted separately, including disabling the table''s triggers, so a bug or injectable dynamic SQL in a function running with the owner''s rights could switch off the history and constraint triggers or drop objects.'
  - 'Narrow function-owner roles (inferred): each family of functions that must write what the caller cannot is owned by its own NOLOGIN role holding only the DML that family executes, for example a deletion role (DELETE on the target tables, INSERT on the archive), a history-writer role (INSERT on the history tables) and a cache-maintenance role (DELETE and upsert on the cache tables and invalidation queue). No consumer role is a member of these roles, and none of them owns a table. This follows the doctrine''s "narrow roles for sensitive features can be granted independently", its "grant the narrow attributes needed" and its own grant of DELETE to one admin role for cache invalidation. It resolves the tension that there is no DELETE grant, yet archive-then-delete needs one: DELETE is held by a narrow non-login role that owns the deletion functions; the caller does not hold it (inferred).'
  - Functions with their owner's rights run only where they must write what the caller cannot (web-app-philosophy:ALLOCATION.GUARD.3), owned by the narrow role above, with a fixed search_path and schema-qualified references (inferred for this function form).
  - 'Defaults: EXECUTE on functions, CONNECT and TEMPORARY revoked from PUBLIC; default privileges set so new objects get the right grants; each REVOKE in the creating transaction.'
  - 'Reporting role: SELECT on the tables and columns it needs, personal-data columns withheld by default; on a replica when its load matters. It gets no SELECT on comment content or on comments with a narrower audience than their target and reads them only through database functions (MD-05, PIG-WEB-LOGIC.SECURE.1); the operator role sees every row, and any other role that may SELECT a table sees every row unless its own role is restricted.'
  - 'Authentication: scram-sha-256, TLS for every remote connection, trust only on local sockets.'
  - A function lists a role's effective permissions, and CI checks the grant matrix against the role design (inferred).
  - Per-role settings (timeouts, default isolation) are set here, on the role (CONCURRENCY.1, INTERFACE.2).
- op: node.set
  uid: PIG-WEB-DATA.GUARD.3
  epistemic_state: 'known: MD-01, MD-05 | conflict: L619, L688 favour row security when several consumers share the database (MD-03 default; recorded by J1) | unvalidated: the pairing table and function'
  design_notes: "Question: how row-level security policies and the request context they read behave and are set.\nPositions:\n  - P1 row security semantics: default deny once enabled; USING governs visibility, WITH CHECK written rows; permissive OR, restrictive AND (L309).\n  - P2 skipped for superusers, BYPASSRLS roles and owners unless FORCE; bypassed by unique and foreign-key checks; sub-select policies can race and leak: non-owner, non-superuser request role and a design review; whether to use it rather than application filtering is not settled by the sources (L310).\n  - P3 pass the application user or tenant with transaction-local settings, derived from the verified identity, never from a client id (L311).\n  - P4 functions read request context from transaction-local settings in a reserved namespace; fixtures use a separate namespace production never reads (L566 MAINT).\n  - Placement: ROW_SECURITY decided by MD-01 (not a default; acceptable under three conditions); L619 and L688 favour row security when several consumers share the database (tension recorded by J1).\nForces: security in depth per user, against policy complexity, testability and the administrator roles row policies mesh badly with (MD-01).\nDecision and grounds:\n  - Row-level security is not enabled by default (MD-01). It is acceptable only when the data model is simple, the scoping key is present in every covered table, in practice composite primary keys led by that key (ORGANIZE.2), and no all-powerful administrator role must cross scopes. Where it is used: backend checks are kept (L128); the request role is neither owner nor superuser and FORCE is set where the owner connects (L310); policies get a design review and denial tests through the deployed role and connection path (L128, L310); policy columns are indexed (L619's mechanics, cited via J1).\n  - Request context is always passed, row security or not, because writer functions and audit triggers need the actor (J1 GUARD.3, ACT.4): the backend sets the acting user, and the person an agent acts for, in transaction-local settings (`SET LOCAL` or `set_config(..., true)`) in a reserved namespace, derived from its verified identity (L311, L566, L685). Transaction-local scope is also what keeps context from leaking across pooled connections in transaction mode (L311, L200; INTERFACE.2).\n  - The actor is a claim, not a verified fact (J1 R1-3): writer functions and audit triggers refuse a write with no actor and check that the session role may assert that kind of actor (a backend an end user or agent, an operator or owner role only itself and, for owner-run jobs, a ticket id). The pairing lives in one table read by one function, so every check uses the same rule (inferred realization).\n  - Fixture context lives in a separate namespace that production code never reads (L566).\ndecided by MD-05 (B1, X1): `decided by MD-05, read visibility of rows with per-user rules when several backends share the database` (J1 Q1). former recorded default (superseded), J1's word for word: A provisional, with one written specification per rule and a shared denial suite; B acceptable when a per-user read rule must hold for two or more backends. Where B's condition holds, read functions join INTERFACE.1 and read this node's context: the \"verified actor\" they receive (X1) is the actor the backend derives from its verified identity, which to the database remains a claim checked against the session role (J1 R1-3). Row security stays not a default (MD-01) in either case; it remains acceptable under MD-01's three conditions.\nRejected: row security by default (L619, L688 as defaults): rejected by MD-01; they win under MD-01's three conditions. Session-level settings for context: never (L311). Context from a client-supplied id: never (L311).\nRealizes: PIG-WEB-ALLOCATION.ROW_SECURITY; ALLOCATION.GUARD.3 (actor claim and pairing); ALLOCATION.ACT.4 (actor recorded).\n\nRenamed and reordered at the critique step: the request-context rule applies with or without row security and is used by the roles, interface, transaction, history and observability nodes; row security comes second."
- op: node.set
  uid: PIG-WEB-DATA.MAINTAIN.2
  epistemic_state: 'known: MD-04 | conflict resolved: L520 (MAINT) against L204 and the research recommendation, in favour of the doctrine by MD-04 | unvalidated: the safeguards are inferred'
  design_notes: "Question: how rows are deleted, archived or expired per table.\nPositions:\n  - P1 deletion is a recorded decision: soft delete flag, hard delete plus an archive written in the same transaction (table name, id, jsonb copy), or hard delete only; soft deletion leaks its predicate into every query, stops foreign keys from enforcing consistency between deleted parents and children, makes a legally required purge harder; undelete is rarely used; applies: soft delete when users need undo in the product, otherwise archive (L204, contested; critique T3, soft delete defended only in T4 snippets).\n  - P2 decide per entity from the reason data is kept: none (hard delete), legal or audit retention (archive or append-only audit), user-visible recovery (archive, or soft delete with an owner for the predicate), queryable past (temporal model), bulk expiry (partition drop) (L205, majority, inferred synthesis).\n  - P3 per-table gradient: full version history (rare), partial soft delete (the default for user-facing transactional data, about 60% of tables), archive table, hard delete (lookup, configuration, ephemeral) (L520 MAINT; contradicts L204 and the research recommendation D2).\n  - P4 soft delete mechanics: nullable timestamptz `deleted_at`, every read filters, partial indexes over active rows; the predicate leak accepted (L521 MAINT); checks carry an \"or deleted\" escape and uniqueness is a partial unique index over active rows (L522 MAINT); soft-delete cascades shadow the foreign-key graph in dedicated functions (L523 MAINT); idempotent, polyvalent functions with a bulk confirmation flag, deletion time not before creation (L524 MAINT); hard deletion only for rebuildable data or after an archive copy; no DELETE privilege for application roles (L525 MAINT).\n  - P5 time-bounded data partitioned by time; detach or drop old partitions instead of bulk DELETE (L206); partition only when size justifies it (larger than memory); partition keys in primary and unique keys (L207).\n  - The doctrine research's synthesis (D2 answer): the doctrine is the defender the critique lacked, its mitigations answer the critique; suggested record: soft delete by default with the mitigations as conditions.\nForces: (reframed after review, M1):\n  - Integrity of references and reads for every consumer, the node's own force, favours hard delete with archive: foreign keys and unique constraints keep working unchanged, and no reader can see a deleted row by forgetting a predicate.\n  - Immediate undo and in-place history, for users and for reporting, favours soft delete: a user's or an agent's mistake is undone by a single update (a force of the INTERACTION branch, the user's ability to work with the data), and a reporting consumer that counts deleted items in historical figures (last year's orders, including those deleted since) finds them in the base table, where under an archive it must union the archive.\n  - Recoverability as such does not divide them: both options keep deleted data recoverable and kept for audit. What differs is the speed and effort of a restore (one update against a restore function the team owns) and where the integrity cost falls.\n  - MD-03 cuts both ways. It makes the predicate leak (L521) a cost for every consumer that reads base tables (each backend, BI, consoles, scripts), and foreign keys no longer stop a new active child from referencing a soft-deleted parent, a check the cascade functions (L523) do not cover. It also adds the reporting consumers who, under an archive, must union it to count deleted rows.\n  - A cost both pay: GUARD.1 (L492) forbids CASCADE on core entities, so deleting a parent with children needs a deletion function that handles the children in order, soft-deleting them under soft delete (L523), archiving and removing them under the archive.\nDecision and grounds: (one clause decided by MD-05, question 1) everything except the default for user-facing transactional data is decided.\n  - Per table, recorded (P2, P3 agree): the reason the data is kept selects the mechanism; lookup, configuration and ephemeral rows are hard-deleted; rebuildable caches are invalidated or dropped, never soft-deleted (L520, L525, L538); bulk expiry of time-bounded data is a partition drop or detach, partitioning adopted only when size justifies it, partition keys in primary and unique keys (L206, L207); queryable past values use the temporal model of MAINTAIN.3 (L205, L213).\n  - Whatever the mechanism: deletion goes only through functions owned by the narrow, non-login deletion role of GUARD.2, which holds DELETE on the target tables and INSERT on the archive (changed after review, M3); no consumer role holds DELETE (L525, L514, GUARD.2); a hard delete of retained data copies the row to an archive in the same transaction, the history trigger of MAINTAIN.3 recording it as well (L525, L204); CASCADE follows GUARD.1 (L492).\n  - Where soft delete is used: L521 to L524 apply whole, plus three safeguards required under MD-03 (inferred): (1) a constraint trigger on the child table refuses an active row whose parent is soft-deleted, run under Serializable or with a lock on the parent row (CONCURRENCY.1), since no foreign key does; bound to the table, it also holds for a direct single-table write under DB_API's exception and for owner-run jobs (changed after review, M2: it was a check in the writer functions only); (2) the active-row predicate is written once in the shared specification every consumer reads with, and the reporting role's documentation names it; (3) a restore re-checks the row against the current constraints, since a deleted row escaped them (L522).\n  - decided by MD-05 (question 1): the default for user-facing transactional data. Recommendation: hard delete with a same-transaction archive by default; soft delete where the product offers users a restore or undo on the table (trash, undo), or where reporting consumers must count deleted rows in place. Ground: it is the max for the node's force, integrity of references and reads for every consumer of a shared database (MD-03), while deleted data stays recoverable through a restore function. Why it stays a question: soft delete's advantage, immediate undo and in-place history for users and reporting, is a force of other branches that the max for DATA does not weigh, and the default for most user-facing tables (about 60%, L520) is the maintainer's codified practice. The review's preferred fix, deciding the archive as a fifth partial verdict against L520, is recorded and not taken: the question goes to the maintainer, framed even-handed. The evidence that restores are rare is one T3 practitioner critique (L204, SRC-265). If unanswered, the graph records the doctrine's default (soft delete for user-facing transactional data, L520) with the three safeguards above mandatory, and marks the clause `decided by MD-05`.\nRejected: hard delete without archive for retained data: never (L525). Soft delete for caches: never (L538). Bulk DELETE of time-bounded data where partitioning applies: rejected (L206); acceptable below L207's size threshold. A boolean deleted flag: never (L521).\nRealizes: ALLOCATION.ACT.4 (archive and history kept in the database); J2 DATA.MAINTAIN (gap 3: lifecycle at stack level only). Personal-data erasure (deferred MAINTAIN.6, L526 recorded as input) must reach soft-deleted rows, archives and history; noted, not judged.\n\nBuild narrative moved out of the constraints: changed after review, M3; changed after review, M2: it was a check in the writer functions only."
  intent: 'Deletion is a per-table design choice, weighed on the data''s importance, whether it can be reconstructed easily, how often it changes and its business value, and it always runs through functions owned by a narrow non-login deletion role that no consumer can use directly. The default is basic soft delete: a deleted_at column, no change to the primary key, deleted rows excluded by every consumer; hard delete plus a same-transaction archive is the choice for some caches and when consumers must be guaranteed unable to reach past data.'
  constraints:
  - 'Deletion is a per-table design choice, weighed on the data''s importance, whether it can be reconstructed easily (caches can), how often it changes and its business value. Per table, recorded: the reason the data is kept selects the mechanism; lookup, configuration and ephemeral rows are hard-deleted; rebuildable caches are invalidated or dropped, never soft-deleted; bulk expiry of time-bounded data is a partition drop or detach, partitioning adopted only when size justifies it, partition keys in primary and unique keys; queryable past values use the temporal model of MAINTAIN.3.'
  - 'Default (MD-04): basic soft delete, a deleted_at column with no change to the primary key; every consumer excludes deleted rows. Soft delete comes in two kinds: last-state (the row stays, marked deleted) and full-history (every past state is kept). In every case foreign keys are required; where they are not enough (full-history soft delete), database functions or triggers maintain the soft-delete logic.'
  - 'Whatever the mechanism: deletion goes only through functions owned by the narrow, non-login deletion role of GUARD.2, which holds DELETE on the target tables and INSERT on the archive; no consumer role holds DELETE (GUARD.2); a hard delete of retained data copies the row to an archive in the same transaction, the history trigger of MAINTAIN.3 recording it as well; CASCADE follows GUARD.1.'
  - 'Hard delete plus a same-transaction archive is acceptable for some cache profiles and when consumers must be guaranteed unable to reach past, historical or outdated data. Its weaknesses: a performance cost at scale and, the biggest, keeping the current and archive table schemas in sync.'
  - 'Where soft delete is used, these rules apply whole: deleted_at is a nullable timestamptz, never a boolean, NULL means active, every read filters on it, and partial indexes over active rows cut index size and write cost; constraints on soft-deletable tables exempt deleted rows (row-local checks carry an ''or deleted'' escape, uniqueness uses a partial unique index over active rows); soft-delete cascades shadow the foreign-key graph, so the child set and order equal what a native cascading delete would remove unless each deviation is explicit and justified, and they run in dedicated functions, not bare updates, that validate business rules, invalidate derived caches, report per-table counts and log; soft-delete functions are idempotent (deleting an already deleted or missing row affects zero rows, no error), polyvalent (one signature serves single and bulk, and bulk requires an explicit confirmation flag), reject a deletion time earlier than the row''s creation, and exist as a wrapper only where a cascade or business rule exists, leaf tables getting the single-table base function only, plus safeguards required under MD-03 and MD-04 (inferred): (1) a constraint trigger on the child table refuses an active row whose parent is soft-deleted, run under Serializable or with a lock on the parent row (CONCURRENCY.1), since no foreign key does; bound to the table, it also holds for a direct single-table write under DB_API''s exception and for owner-run jobs; (2) the active-row predicate is written once in the shared specification every consumer reads with, and the reporting role''s documentation names it; (3) a restore re-checks the row against the current constraints, since a deleted row escaped them; (4) soft deletion propagates down a hierarchy of soft-deleting tables as the model requires, by database functions or triggers, children in order.'
