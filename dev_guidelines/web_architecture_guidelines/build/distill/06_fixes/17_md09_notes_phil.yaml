operations:
- op: node.set
  uid: ROOT
  design_notes: 'Source: the J1 allocation judge records, final revision (47 nodes judged, 39 of them in this graph; the allocation placements number 26, 25 decided and 1 undecided).


    Default context (maintainer decision MD-03): a classic website (documents, forms, CRUD), one team, single tenant, humans and agents as users, and a database that may be shared by several backends and by reporting, admin consoles and scripts. Under it the database is the authority for stored-data truth and for what must hold whoever touches the data: each business operation is one function call in its own transaction (which may call other domains'' published functions), each state column has one writer function, per-user write rules decidable from the row and the actor are enforced there, and so are invariants and per-role privileges; audit records both the consumer''s role and the actor it claims. Each backend is the authority for product policy not stored in the data, its users'' identity and its workflows, which advance through state columns and the outbox. Foreign mutations run as atomic phases in a worker behind a 202 response, in the request only when the user must see the outcome within a few seconds, under the request timeout (MD-09) and then with the intent recorded first by the database function. Browsers and agent clients decide nothing durable; no token travels in a URL except a short-lived signed file URL.


    Maintainer decisions applied: MD-01 (row-level security is not a default; acceptable only for a simple data model, with the scoping key in every covered table and no all-powerful administrator role), MD-02 (interface documentation is always in sync, guaranteed by process; its origin, description or code, is chosen per project with criteria for each direction), MD-03 (the default context above).


    Verdict against the maintainer doctrine: one, partial. ALLOCATION.GUARD.2 goes against the doctrine''s "triggers and CHECK constraints optional": only declarative constraints bind every writer, owner-run migrations included, and procedural checks need serializable isolation or a lock.


    Tensions between maintainer decisions and evidence, recorded and not overridden: (a) MD-01 against the research rows that call for row security when several consumers share the database (L619, L688), which MD-03 makes the default; (b) MD-03 against the research rows that keep one application as the owner of its database (L044) and put logic in the application first, testable in memory (L215, L042); (c) MD-01 with MD-03: per-user read filters implemented in each backend become copies across backends, against ALLOCATION.RULES.4 (L633).


    Open question Q1 (ALLOCATION.GUARD.3): decided by MD-05, read visibility of rows with per-user rules when several backends share the database. former recorded default (superseded): each backend filters from one shared specification with shared denial tests; fallback: database read functions that receive the verified actor, acceptable when a per-user read rule must hold for two or more backends (always the case under MD-03). Under either answer, roles that may SELECT the base tables see every row, comments included, unless their own role is restricted.


    Skeleton gaps: ALLOCATION.FORCES.1 and .2 own no ledger row and are judged from the rows owned elsewhere that state their demand; ALLOCATION.DERIVE.2''s backend-or-browser position is unargued and kept only as a browser copy; ALLOCATION.PRESENT.2 has one grounded position and is marked speculative.


    Evidence gaps: the scalability premise (L615) has no primary source (FORCES.5 is speculative); thresholds for queue contention, notification load and the 1 s deferral are unmeasured; generators for persistence models, interface fields and function wrappers were not read; the collation choice is open under the data branch; the operating cost of a JavaScript server is unweighed; L684 cites no source; the role-to-actor pairing check is inferred and no source describes it.


    Judge records: build/distill/03_judge/J1_allocation/records.md (ALLOCATION roll-up record).


    Maintainer answers: MD-04 (deletion), MD-05 (reads), MD-06 (hosting) and MD-07 (SameSite) closed the four open questions; no clause is decided by MD-05.'
- op: node.set
  uid: ALLOCATION.ACT.2
  design_notes: "Positions: P1 backend effects staged in the database and delivered after commit (L624, L409, L410); P2 post-commit hooks in the request process (L600, L233); P3 atomic phases with recovery points (L589, L234, L246); P4 sagas with compensation (L590, L480).\n\nForces: correctness (no lost or doubled effect) against request latency.\n\nDecision: P1. The database function that performs the state change writes the intent (outbox row or staged job) in the same transaction (L624, L409); a backend worker delivers it after commit to idempotent consumers (L410, L599). External calls are made by backends, never by the database. No database transaction stays open across a remote call (L234).\n  - Foreign mutations (a payment, a remote API write) run as atomic phases with recovery points and an idempotency key passed to the foreign system (P3 as a complement: L589, L234, L246), in a worker behind a 202 response with a status resource (ACT.3, L271, L602).\n  - (superseded by MD-09) In the request only when the user must see the outcome within a few seconds, under the request timeout (MD-09) (L013): the database function still records the intent (outbox row) first and commits; the request then performs the call as one atomic phase with the idempotency key and marks the row done. If the request dies, the worker's completer picks the row up (L589). (Revision 3: adopted from the logic unit's realization, M4.)\n\nRejected: P2 (post-commit hook): acceptable only for losable work that touches no foreign system, such as cache invalidation (L600); a losable notice to a foreign system still goes through the outbox, which costs one row. P4: only when one business transaction spans services with separate databases (L590, L480).\n\nChanged (R1): intent written by the database function (MD-03).\n\n(superseded by MD-09) Changed (R3): tension with ACT.3 resolved: foreign mutations in a worker behind 202; in the request only for an outcome needed within a few seconds, under the request timeout (MD-09), intent recorded first; post-commit hooks only for losable work touching no foreign system (logic review M4).\n\n(superseded by MD-09) Would move it: an outcome the user must see within a few seconds, under the request timeout (MD-09) (in-request phase, intent recorded first); a business transaction crossing services with their own databases (saga)\n\nCorrected by MD-09 (re-audit under MD-08): the in-request exception applies when the user waits for the outcome in the same response and the call is expected to finish within a few seconds, under the request timeout; intent recorded first, unchanged. Foreign mutations still default to a worker."
- op: node.set
  uid: ALLOCATION.ACT.3
  design_notes: "Positions: P1 inside the request what the user sees next (L601); P2 separate worker processes (L406, L407); P3 scheduled work inside the database (L604 MAINT); P4 asynchrony only for derived data and bulk jobs (L482 MAINT, L545).\n\nForces: latency against correctness and scalability.\n\nDecision:\n  - Inside the request: validation, authorization, every change atomic with what the user sees next, and the persisted intent of deferred work, in one transaction, which is one function call when the change is a database operation (L601, MD-03). Core writes are never asynchronous (L482, MAINT, max).\n  - (superseded by MD-09) Deferred: foreign effects, work that would push the response past a few seconds or the request timeout (MD-09) (L013, L271), fan-out, derived data. Foreign mutations run as atomic phases in a worker behind 202; the one in-request exception is ACT.2's: an outcome the user must see within a few seconds, under the request timeout (MD-09), with the intent recorded by the database function first.\n  - Host: workers fed from the database-staged queue (L406, L407, L409); scheduled pure data work inside the database (L604; JOB_HOST).\n  - An operation that outlasts the request answers 202 with a status resource (L271, L602). Every asynchronous stream states its staleness window and a convergence check (L482).\n\nRejected: in-process background tasks: only for small tasks that may be lost (L407). P3 for everything: not for Python logic, foreign effects, highly parallel or OS-level work (L604).\n\nChanged (R3): in-request exception aligned with ACT.2 (logic review M4).\n\nWould move it: duration, foreign effects, set-based data work\n\nCorrected by MD-09 (re-audit under MD-08): deferral threshold is work expected to exceed a few seconds or the request timeout (L601's wording); 1 s stays the interactive-response target, not the cut-off. Rejected: a 1 s cut-off: wins where measured synchronous-worker capacity on slow I/O is the binding force."
