operations:
- op: node.set
  uid: PIG-WEB-ALLOCATION.POSTGRES_FIRST
  constraints:
  - Postgres hosts the job queue, schedules, derived caches, sessions and documents until a measured limit for that role.
  - 'Each role names its trigger to leave Postgres: queue lock contention or backlog age; NOTIFY commit serialisation under write concurrency; cache latency or cache load on the primary.'
  - NOTIFY is a low-rate wake-up, never the message carrier.
  - 'Authority: Postgres per role.'
  - 'Forbidden: a second store written beside Postgres without staging.'
- op: node.set
  uid: PIG-WEB-ALLOCATION.DB_API
  constraints:
  - A dedicated API schema of functions; each consumer role has EXECUTE on the functions it uses and nothing to write on base tables.
  - State columns are written only by their writer functions.
  - 'Writes go through functions: every multi-table operation and every state transition (MD-03).'
  - A direct single-table write grant is acceptable only for a table that one consumer writes and that has no state column or multi-table effect.
  - Simple reads may query base tables under SELECT grants; use read functions where a read must apply a rule.
  - A procedure only where transaction control is needed.
  - Evolution is additive and breaking changes are coordinated with every consumer; no formal version numbers, a new function name carries the change.
  - Deployed together is acceptable only when every consumer of the changed object ships in the same deployment as the migration; otherwise expand, migrate, contract.
  - 'Drift gate: a catalogue diff in CI fails on a removed function or an incompatible signature unless that condition holds; typed wrappers are generated from the same catalogue.'
  - One business operation is one API call in its own transaction (PIG-WEB-DATA.INTERFACE.1).
  - Functions live in versioned migrations and are tested against a live database in CI.
  - 'Authority: the Postgres function API.'
  - 'Forbidden: direct consumer writes outside the exception above; views as contract; consumer roles owning objects.'
- op: node.set
  uid: PIG-WEB-ALLOCATION.CACHE_STORE
  constraints:
  - 'Derived-data caches: Postgres tables, invalidated in the source transaction.'
  - 'Response and fragment caches shared by processes: Postgres by default, UNLOGGED when rebuildable.'
  - Per-process memory is never shared beyond one request; a cache is never permanent storage.
  - 'Authority: source data; cache store: Postgres.'
  - 'Forbidden: per-process memory caches in multi-process production; caches as permanent storage.'
- op: node.set
  uid: PIG-WEB-ALLOCATION.JS_SERVER
  constraints:
  - No request-time JavaScript server runtime in the default; Python renders HTML (following the rendering placement PRESENT.1).
  - Build-time rendering is allowed for pages whose URL set is known.
  - 'Authority: Python backend for HTML.'
  - 'Forbidden: a second request-time server runtime without the condition that PRESENT.1 picks a client-rendered application for most of the product and first load or crawlability needs server rendering.'
- op: node.set
  uid: PIG-WEB-INTERACTION.EDIT
  constraints:
  - Every state-changing form POSTs; success answers 303 to the confirmation or the new resource; a failed validation re-renders the form with the user's input kept (inferred; status codes are the HTTP interface's). Search and filter forms submit with GET, so their state lands in the URL (VISUALIZE.2).
  - 'The version travels with every edit of a user-edited record: a hidden field in HTML forms (a plain form cannot send If-Match, inferred), If-Match with the ETag from JavaScript and agent clients. The backend passes it to the writer function as the expected version. The maximum strictness among the sources is adopted: the condition is required, not optional, except for per-property last-writer-wins updates (toggles, status, assignment, ordering), which are sent without the record version (GUARD.5) and are exempt. If-Match clients: a mismatch answers 412, a missing condition answers 428 on every endpoint editing such a record, per-property updates excepted (RFC 9110 defines both for conditional header fields). HTML forms: a version in a hidden field that no longer matches is a conflict with current state, answered 409 with the conflict form of decision 3 (the mapping of PIG-WEB-LOGIC.EXPOSE.2: 409 for a conflict with current state); a form missing its version field is rejected as malformed and re-rendered with current values (inferred).'
  - 'A stale write is shown, never merged silently: the response re-renders the form with the user''s input kept and the current values beside it, the fields changed by the other writer marked, and the new version embedded; the user reapplies.'
  - A patch applies all or nothing under its precondition.
  - 'Duplicate submission, browser share (GUARD.6): the submit control is disabled with a pending state; create forms carry a form token minted at render, sent as the idempotency key the writer function records with the effect; 303 after success.'
  - 'Unsaved input survives the page as PIG-WEB-INTERACTION.ENVIRONMENT.1 sets: saved on page hide, restored on return, cleared after a successful submit.'
- op: node.set
  uid: PIG-WEB-INTERACTION.ENVIRONMENT
  intent: Pages detect features rather than sniff the browser, stay eligible for the back/forward cache, and save unsaved input on page hide. Offline and installable use and internationalization are deferred and recorded only.
  constraints:
  - 'Capability and Page Lifecycle: feature detection, never user-agent sniffing; pages stay eligible for the back/forward cache; unsaved input saved on page hide.'
  - Offline and installable use and internationalization are deferred and recorded only.
- op: node.set
  uid: PIG-WEB-TRANSVERSE.PERFORMANCE
  constraints:
  - 'Targets: the "good" thresholds of Core Web Vitals at the 75th percentile, per device class, from field data (OPERABILITY.2). They are the user-facing service level indicators of OPERABILITY.3.'
  - Build budgets per page type on the lab-measurable vitals (LCP, CLS) and on page weight. A build over budget fails or the page is optimised. INP is gated on field data after release. The budget numbers of a vendor article on performance budgets are not adopted.
  - 'The server''s share of each page is visible: Server-Timing carries server and database time for authorised audiences, joined to field data through the trace id (inferred).'
  - 'Derived server budget (inferred from grounded rows, unvalidated): about 1 s at most for the server''s part of a page at the 75th percentile, and well under 1 s for an interaction''s request. Grounds: the HTML response (TTFB) is about 40% of LCP time against LCP''s 2.5 s; 1 s keeps the flow of thought and 0.1 s feels instantaneous; work over about 1 s is deferred (ACT.3, settled). Database time is part of this server share.'
- op: node.set
  uid: PIG-WEB-TRANSVERSE.CONTRACTS
  constraints:
  - Every contract of the default context has a verification matched to its seam and a written meaning, owner and lifecycle.
  - The contracts are the function API (several consumers), the tables and columns granted to BI, the HTTP interface (own browser code, agents), the agent tool surface and the external services.
  - Each verification runs in the pipeline.
  - Breaking changes follow the philosophy's expand, migrate, contract; "deployed together" stays acceptable only when every consumer of the changed object ships in the same deployment as the migration.
  - This realizes the narrowing of "deployed together", counted at PIG-WEB-DATA.INTERFACE.1, not here.
- op: node.set
  uid: PIG-WEB-DATA.ORGANIZE.1
  constraints:
  - Repeating groups are always a child table.
  - A vertical split of a wide table is a physical choice, made when a measured access pattern needs it, with the same key in each part and a one-to-one foreign key from each part to the main row (the foreign key is inferred from the "each fact once" rule). The integrity and security reasons for splitting one-to-one attributes stay those of the philosophy's organized-facts rule (web-app-philosophy:DATA.ORGANIZE).
  - Type-specific tables (subtypes) share the parent's key, which is both their primary key and a foreign key to the parent.
  - 'An array column is allowed only for a bounded, read-heavy set of values that reference nothing; its bound and element rules are declared, as a CHECK over an immutable function where the rule is row-local, or the write-time trigger of GUARD.4 where it is not. "Validated by a function" is met by binding that function to the column, not by asking every writer to call it (inferred; same ground as web-app-philosophy:ALLOCATION.GUARD.2: only what is bound to the table holds for every writer under MD-03).'
- op: node.set
  uid: PIG-WEB-DATA.ORGANIZE.2
  constraints:
  - Every table has a primary key.
  - 'Shape: a row scoped to a parent that most queries filter by gets a composite key led by the scope column, down to the most selective scope level and at most about four columns, with a surrogate below that. Foreign keys to it carry every key column in order, which also makes a cross-scope reference impossible: a child and the row it references share the scope by construction (inferred; the doctrine does not list this integrity gain). Top-level entities get a single surrogate key.'
  - 'Soft deletion is not a criterion of key shape: the doctrine''s own architecture note makes them independent and partial indexes work with any key; only the scope question decides.'
  - 'Type: identity columns, never serial; no auto-number for natural or composite keys.'
  - 'Width: 8-byte identity by default; a 4-byte key only for a table whose cardinality is bounded by design (lookup, status and type tables, configuration), not by a forecast. Types identical on both sides of every relationship. Ground: an overflowing key refuses writes, which is a loss of availability and changeability, not of integrity, since no stored fact becomes wrong. The choice rests on the tie-break "the force whose loss is hardest to repair later wins": the narrow width''s failure is repaired by a rewrite of the table and of every referencing column at the moment the table is largest, while the wide width costs 4 bytes per key column in rows and indexes, paid gradually and never needing a repair.'
  - 'UUIDs: only for a stated technical reason: global uniqueness across systems, integration with external systems, or avoiding sequence contention; random UUIDs are not the default for ordinary tables. When one is used it is UUIDv7, never UUIDv4 for a key (index locality; the locality claim rests on benchmarks and is to be tested on the workload). Client-supplied identifiers for idempotent creates (GUARD.6) are one such reason (integration, inferred). A UUIDv7''s timestamp is never the creation time (ORGANIZE.3). A deterministic UUID in a stored generated column serves a public identifier over a composite natural key.'
  design_notes: "Question: which primary-key shape and type each table gets.\nPositions:\n  - P1 every table has a primary key (L170, consensus).\n  - P2 the key type is a recorded decision among bigint identity, UUIDv7 and UUIDv4 (L179, contested; identity compact but guessable and tied to one database; UUIDv7 time-ordered and non-enumerable; UUIDv4 poor locality, T4 benchmarks).\n  - P3 shape by two questions: is the row scoped to a parent that most queries filter by, and does the table use soft deletion; scoped tables get a composite key led by the scope column (L499 MAINT); at most about four columns, foreign keys reference every column in order, row-value comparison in joins (L500 MAINT); costs and benefits stated (L501 MAINT).\n  - P4 identity columns, not serial; no auto-number where a natural key exists or the key is composite (L502 MAINT; agrees L177).\n  - P5 integer width by expected cardinality: 4 bytes under about two billion rows, 8 bytes for very large tables or keys referenced by large tables; identical types on both sides of every relationship (L503 MAINT), against the research recommendation of bigint by default (recorded in L503's positions).\n  - P6 UUID keys only for a stated technical reason (global uniqueness, external integration, sequence contention); a deterministic UUID in a stored generated column when a public identifier must follow a composite natural key (L504 MAINT).\nForces: integrity (a key states identity and, when composite, scope) against index width and query discipline (L501). P5's 4-byte default saves 4 bytes per key column in rows and indexes and costs a hard write failure at overflow, repaired by a table rewrite of the table and of every referencing column (L197, L503's own same-type rule) at the moment the table is largest.\nDecision and grounds:\n  - Every table has a primary key (L170).\n  - Shape (L499 to L501, MAINT, max): a row scoped to a parent that most queries filter by gets a composite key led by the scope column, down to the most selective scope level and at most about four columns, with a surrogate below that (L500). Foreign keys to it carry every key column in order (L500), which also makes a cross-scope reference impossible: a child and the row it references share the scope by construction (inferred; the integrity gain L501 does not list). Top-level entities get a single surrogate key.\n  - Soft deletion is not a criterion of key shape: the doctrine's own architecture note makes them independent and partial indexes work with any key (doctrine-internal tension 1 in the doctrine research result, `build/research/15_maintainer_doctrine/result.md`); only the scope question decides.\n  - Type: identity columns, never serial; no auto-number for natural or composite keys (L502).\n  - Width (partly against L503): 8-byte identity by default; a 4-byte key only for a table whose cardinality is bounded by design (lookup, status and type tables, configuration), not by a forecast. Types identical on both sides of every relationship (L503). Ground (corrected after review, m1): an overflowing key refuses writes, which is a loss of availability and changeability, not of integrity, since no stored fact becomes wrong. The verdict rests on J1's tie-break, \"the force whose loss is hardest to repair later wins\": the narrow width's failure is repaired by a rewrite of the table and of every referencing column at the moment the table is largest (L197), while the wide width costs 4 bytes per key column in rows and indexes, paid gradually and never needing a repair.\n  - UUIDs: only for L504's reasons. When one is used it is UUIDv7, never UUIDv4 for a key (L179: index locality; SRC-325 is T4, so the locality claim is to be tested on the workload). Client-supplied identifiers for idempotent creates (GUARD.6, L655) are one such reason (integration, inferred). A UUIDv7's timestamp is never the creation time (L178, ORGANIZE.3). A deterministic UUID in a stored generated column serves a public identifier over a composite natural key (L504).\n  - Whether an internal key may appear outside the system (URLs, agent payloads) is the interface's decision (J7, the boundary L179 names); this node only guarantees that a non-enumerable alternate key can be added as a unique UUIDv7 or generated column.\nRejected:\n  - L503's 4-byte default by forecast: rejected; acceptable when the table's cardinality is bounded by design.\n  - UUIDv4 as a key: rejected (L179, L504); acceptable never as a primary key; as a random token column it is outside this node.\n  - Soft deletion as a key-shape criterion (L499's second question): rejected, doctrine-internal tension 1.\n  - Single surrogate keys for scoped rows: rejected; acceptable when no query family filters by the parent and no cross-scope reference must be prevented.\nRealizes: J2 DATA.ORGANIZE; TYPE_CHAIN; supports GUARD.6 (client identifiers). MD-01's composite-key condition for row security is met by this shape where a scope exists, without implying row security.\n\nBuild narrative moved out of the constraints: corrected after review, m1."
- op: node.set
  uid: PIG-WEB-DATA.ORGANIZE.3
  constraints:
  - 'time: timestamptz everywhere; event times named for the event (`*_at`, ORGANIZE.4) and ordered by CHECK; a UUIDv7 never stands for creation time;'
  - 'text: `text` with a CHECK for any length limit; never char(n) or a length-limited varchar;'
  - 'money and quantities: numeric with declared precision; never `money`;'
  - 'enumerations: a lookup table referenced by foreign key; CHECK IN only for short sets that are stable by definition;'
  - 'booleans: NOT NULL, a default, a positive name;'
  - '`created_at` on every table, append-only tables included, where it is the record time; `updated_at` on every table whose rows are updated, written by the trigger of GUARD.4. Partial departure from the doctrine''s rule that every table has `updated_at`: append-only tables (history, archive and queue rows) carry no `updated_at`, since their rows are never updated and the column would state nothing (inferred). Only `updated_at` departs; the record-time name stays `created_at`.'
  - 'Canonical storage: values are stored canonical (UTC instants, plain numbers, codes); formatting happens where the text is rendered (PRESENT.2).'
  design_notes: "Question: which column types are used for time, text, numbers, enumerations and flags.\nPositions:\n  - P1 timestamptz, text with CHECK for limits, numeric (not money), identity columns, over timestamp without time zone, char(n), money and serial (L177, consensus).\n  - P2 a UUIDv7 timestamp is not the creation time; keep an explicit timestamptz (L178).\n  - P3 lookup table with a foreign key over a native enum; CHECK with an IN list only for short stable sets; booleans NOT NULL with a default, positively phrased (L497 MAINT).\n  - P4 every table carries created_at and updated_at as timestamptz NOT NULL default now(); event times named for the event; ordering between timestamps is a CHECK; no timestamp without time zone (L498 MAINT).\n  - Native enum types: named by L497 as the alternative it rejects; no row defends them.\nForces: all serve integrity through precision (L485, J2). P3 trades a join for metadata and change without a type migration; native enums are compact but change only by type migration.\nDecision and grounds: P1 to P4 adopted (MAINT and research agree; max):\n  - time: timestamptz everywhere; event times named for the event (`*_at`, ORGANIZE.4) and ordered by CHECK (L498); a UUIDv7 never stands for creation time (L178);\n  - text: `text` with a CHECK for any length limit; never char(n) or a length-limited varchar (L177, L494);\n  - money and quantities: numeric with declared precision; never `money` (L177);\n  - enumerations: a lookup table referenced by foreign key; CHECK IN only for short sets that are stable by definition (L497);\n  - booleans: NOT NULL, a default, a positive name (L497, L506);\n  - `created_at` on every table, append-only tables included, where it is the record time; `updated_at` on every table whose rows are updated, written by the trigger of GUARD.4 (L498). Partial departure from L498 (recorded after review, m4): append-only tables (history, archive and queue rows) carry no `updated_at`, since their rows are never updated and the column would state nothing (inferred). Only `updated_at` departs; the record-time name stays `created_at`.\n  - Canonical storage: values are stored canonical (UTC instants, plain numbers, codes); formatting happens where the text is rendered (PRESENT.2, L632).\nRejected: L498's `updated_at` on append-only tables: rejected; acceptable when a table described as append-only in fact receives updates, which makes it an ordinary table. timestamp without time zone, char(n), money, serial: never (L177). Native enums: rejected; acceptable when the set is fixed by definition and carries no metadata, and then a CHECK IN serves the same purpose without a type (L497). A UUIDv7 as creation time: never (L178).\nRealizes: J2 DATA.ORGANIZE and DATA.GUARD (precise structure, L485); ALLOCATION.PRESENT.2 (canonical storage); ALLOCATION.DERIVE.2 (collation, open).\n\nBuild narrative moved out of the constraints: recorded after review, m4."
- op: node.set
  uid: PIG-WEB-DATA.ORGANIZE.4
  constraints:
  - Schema qualification in every production reference also closes the search-path attack for functions that run with their owner's rights (GUARD.2).
  - Constraint names spelling source and target are what lets a violation map to a stable error (GUARD.1).
  - The deprecated-column suffix is the expand phase of MAINTAIN.1; removal is its contract phase.
  - 'Conventions evolve forward only: new objects follow the rule, legacy names change only through expand, migrate, contract (web-app-philosophy:DATA.MAINTAIN).'
- op: node.set
  uid: PIG-WEB-DATA.ORGANIZE.5
  constraints:
  - 'Use: JSONB for semi-structured metadata, configuration, cached aggregates, external payloads and event data, in the cases of an indivisible object or a normalized core with a flexible periphery. Anything that drives logic, filtering or joins is a column.'
  - 'Validation: every stored JSON document is validated on write by a trigger that calls the registry''s validate function; function inputs and outputs that carry JSON validate through the same function. A CHECK cannot do it because the validator reads the registry and is not immutable. This resolves the tension that a direct write can bypass function-level validation toward enforcement at the table, as the philosophy does for invariants (web-app-philosophy:ALLOCATION.GUARD.2).'
  - 'Registry: source form, composition by reference, expanded forms regenerated.'
  - 'Evolution: a relaxing change in place; a breaking change as a new named version beside the old one, the old one retired after its documents are migrated (the same expand, migrate, contract as MAINTAIN.1). A breaking change to a stored document schema migrates the stored documents in the same release, so no table holds mixed versions.'
- op: node.set
  uid: PIG-WEB-DATA.ORGANIZE.6
  constraints:
  - Schemas are domain namespaces; no application object in `public`, and CREATE on `public` revoked.
  - 'The function API''s dedicated schema (DB_API) is a legitimate schema under the "access need" criterion: it is the object that consumer roles receive USAGE and EXECUTE on (GUARD.2). It is the one technical namespace, and it is justified by permissions, not by layering (inferred).'
  - 'Tenancy: the default context is single tenant, so no tenancy mechanism is built. When a project is multi-tenant, the choice is recorded: separate databases where tenants are few and contractual or regulatory isolation is required; otherwise shared tables with the tenant key leading every composite key (ORGANIZE.2), so no row can reference another tenant''s row. Row-level security only under MD-01''s three conditions, with application checks kept and denial tested through the deployed role.'
- op: node.set
  uid: PIG-WEB-DATA.ORGANIZE.7
  constraints:
  - Every foreign-key column (or column list, for composite keys) is the leading part of some index; an existing index whose leading columns are the foreign key covers it (inferred).
  - Every other index names the query pattern it serves, in its comment or migration; unique, partial unique and exclusion constraints count as integrity indexes (GUARD.1).
  - Under Serializable (CONCURRENCY.1) an index on every predicate a writer function filters by also keeps predicate locks narrow, since sequential scans take relation-level predicate locks.
  - Indexes on live tables are built concurrently (MAINTAIN.1).
- op: node.set
  uid: PIG-WEB-DATA.GUARD.1
  constraints:
  - NOT NULL by default; a nullable column states the absence it means; a group of columns that must be present together gets a CHECK.
  - 'Foreign keys, in the stricter form: every reference declared, across schemas too, every foreign-key column indexed (ORGANIZE.7); NO ACTION by default; SET NULL for optional links; CASCADE only for a component meaningless without its parent, never for core entities, soft-deletable tables or cross-schema links. Deletion of anything else goes through a deletion function (MAINTAIN.2).'
  - 'CHECK: row-local and immutable, paired with NOT NULL, for the listed cases; complex row-local rules in reusable immutable validation functions called from the CHECK.'
  - 'Cross-row rules: partial unique index, NULLS NOT DISTINCT, exclusion constraint first; beyond them, a constraint trigger under Serializable or a lock (GUARD.4, CONCURRENCY.1).'
  - Junction tables carry both foreign keys NOT NULL plus a uniqueness constraint on the pair (a surrogate id only when the junction has attributes); a junction bridging two schemas lives in the schema of the entity it enriches. Outside scoped schemas, a simple link table gets a surrogate key plus a unique constraint rather than a composite primary key.
  - 'Hierarchies: a fixed-depth hierarchy is one table per level (inferred). An unbounded hierarchy stores the parent link as a declared self-referencing foreign key, the fact "x''s parent is y" stored once (web-app-philosophy:DATA.ORGANIZE), with acyclicity checked by a constraint trigger; acyclicity is a multi-row rule, so the trigger runs under Serializable or after locking the rows it reads (CONCURRENCY.1). A materialized path, closure table or nested set is a derived read structure kept in the same transaction, under DERIVE.1''s sync plan and drift guard, never the only representation. Ground, per form: a materialized path or nested set lists ancestors with no foreign key on them, so a moved or deleted ancestor leaves rows that state a false hierarchy; a closure table does carry foreign keys on both ancestor and descendant, but no constraint protects its transitive completeness, so a missed or extra pair states a false ancestry (inferred).'
  - Deferrable constraints only for circular dependencies or in-transaction reordering; immediate by default.
  - Domains for value types used in several places, check allowing NULL, NOT NULL on the column. A domain check is changed so that stored data is rechecked, on large tables by the NOT VALID then VALIDATE route of MAINTAIN.1 rather than a drop and re-add under an exclusive lock (inferred).
  - Every constraint is named, source and target in the name; the backends' validators are generated from or tested against the constraints (web-app-philosophy:ALLOCATION.RULES.1).
  - Same-row derived values are stored generated columns (DERIVE.1).
  design_notes: "Question: which rules are declared as keys, NOT NULL, CHECK, foreign keys, unique and exclusion constraints and domains.\nPositions:\n  - P1 most columns NOT NULL; nullable needs a reason (L171).\n  - P2 foreign keys declared, ON DELETE by ownership: CASCADE for components, RESTRICT or NO ACTION for independent objects, SET NULL for optional links (L172) against P2' every foreign key declared, including across schemas, and indexed; NO ACTION by default; SET NULL for optional metadata links; CASCADE only where the child is meaningless without its parent, never for core entities, soft-deletable tables or cross-schema links (L492 MAINT, stricter).\n  - P3 CHECK row-local and immutable, paired with NOT NULL; cross-row rules by unique index, exclusion constraint or constraint trigger (L174); partial unique indexes, NULLS NOT DISTINCT, exclusion constraints (L175).\n  - P4 junction tables: both foreign keys NOT NULL, unique pair; surrogate only when the junction has attributes; outside scoped schemas a link table gets a surrogate plus a unique constraint (L491 MAINT).\n  - P5 avoid self-referential foreign keys: only for unbounded hierarchies with no alternative, and then prefer materialized path, closure table or nested set; deferrable constraints only for circular dependencies or in-transaction reordering (L493 MAINT).\n  - P6 enforce at the database: CHECK for ranges, lengths, exclusivity, conditional requirements, time ordering; NOT NULL for keys, references, core fields, timestamps, booleans; text with CHECK; reusable validation functions for complex row-local rules; same-row derived values as stored generated columns (L494 MAINT).\n  - P7 constraints are the contract half that holds whatever writes; semantics of NULL in CHECK, unique and foreign keys; mirror the Python model's constraints; name constraints so violations map to stable errors (L495).\n  - P8 domains for reusable constraints, check allowing NULL with NOT NULL on the column; change a domain check by drop, adjust, re-add (L496).\n  - Inherited: L471 (MAINT) makes CHECK and triggers optional defence in depth; J1 GUARD.2 requires declarative constraints (partial verdict against L471).\nForces: integrity for every writer (P1 to P8) against migration effort and write cost. P2 and P2' differ on how far a delete reaches by itself. P5 trades a declared parent reference for read structures whose correctness no constraint fully protects: a materialized path or nested set lists ancestors with no foreign key on them; a closure table carries foreign keys on both ancestor and descendant, but no constraint protects its transitive completeness.\nDecision and grounds: declare every rule a declarative constraint can express, required (J1 GUARD.2, MD-03; L040, L471 adopted on authority, its \"optional\" part not).\n  - NOT NULL by default; a nullable column states the absence it means (L171, L485 via J2); a group of columns that must be present together gets a CHECK (J2).\n  - Foreign keys: P2' (L492, MAINT, stricter, max): every reference declared, across schemas too, every foreign-key column indexed (ORGANIZE.7); NO ACTION by default; SET NULL for optional links; CASCADE only for a component meaningless without its parent, never for core entities, soft-deletable tables or cross-schema links. Deletion of anything else goes through a deletion function (MAINTAIN.2).\n  - CHECK: row-local and immutable, paired with NOT NULL (L174), for L494's list; complex row-local rules in reusable immutable validation functions called from the CHECK (L494).\n  - Cross-row rules: partial unique index, NULLS NOT DISTINCT, exclusion constraint first (L175); beyond them, a constraint trigger under Serializable or a lock (GUARD.4, CONCURRENCY.1).\n  - Junction tables per L491.\n  - Hierarchies (partly against L493): a fixed-depth hierarchy is one table per level (inferred; L493 does not state it, corrected after review, m2). An unbounded hierarchy stores the parent link as a declared self-referencing foreign key, the fact \"x's parent is y\" stored once (J2 DATA.ORGANIZE), with acyclicity checked by a constraint trigger; acyclicity is a multi-row rule, so the trigger runs under Serializable or after locking the rows it reads (CONCURRENCY.1). A materialized path, closure table or nested set is a derived read structure kept in the same transaction, under DERIVE.1's sync plan and drift guard, never the only representation. Ground, per form (corrected after review, m2): a materialized path or nested set lists ancestors with no foreign key on them, so a moved or deleted ancestor leaves rows that state a false hierarchy; a closure table does carry foreign keys on both ancestor and descendant, but no constraint protects its transitive completeness, so a missed or extra pair states a false ancestry (inferred from L492 and L488).\n  - Deferrable constraints only for circular dependencies or in-transaction reordering; immediate by default (L493).\n  - Domains for value types used in several places, check allowing NULL, NOT NULL on the column (L496). A domain check is changed so that stored data is rechecked (L496), on large tables by the NOT VALID then VALIDATE route of MAINTAIN.1 (L195) rather than a drop and re-add under an exclusive lock (inferred).\n  - Every constraint is named, source and target in the name (L495, L506); the backends' validators are generated from or tested against the constraints (L495, J1 RULES.1).\n  - Same-row derived values are stored generated columns (L494, L176; DERIVE.1).\nRejected: P2's broader CASCADE: rejected; acceptable for a component meaningless without its parent, which P2' keeps. A path, closure table or nested set as the only representation of an unbounded hierarchy: rejected; acceptable as a derived copy. Application-only enforcement of any rule a constraint can express: never (J1 GUARD.2). L471's \"CHECK constraints optional\": rejected (inherited from J1).\nRealizes: web-app-philosophy:ALLOCATION.GUARD.2 (declares the invariants the placement gives the database); J2 DATA.GUARD.\n\nBuild narrative moved out of the constraints: inferred; L493 does not state it, corrected after review, m2; corrected after review, m2."
- op: node.set
  uid: PIG-WEB-DATA.GUARD.2
  constraints:
  - 'Group roles (NOLOGIN) per functional branch: a read level (SELECT on tables and columns), an API level (USAGE on the API schema, EXECUTE on the functions of that branch), and an admin level. Under MD-03 the "write" level is EXECUTE on writer functions, not table DML; direct INSERT or UPDATE is granted only under DB_API''s single-consumer exception, and never on state columns (web-app-philosophy:ALLOCATION.GUARD.3).'
  - 'Login roles: one per consumer (each backend, the reporting tool, the console, each script family), neither owner nor superuser, a member of the group roles it needs. One login per consumer is what makes the session role in history rows (MAINTAIN.3) name the consumer (actor trust). Humans have personal login roles, members of the operator or read roles; they assert only themselves as actor.'
  - 'Owner role: owns tables and the other schema objects (one owner per table), runs migrations and human-run data jobs, never serves requests. It does not own the functions that run with their owner''s rights: a table owner holds rights that cannot be granted separately, including disabling the table''s triggers, so a bug or injectable dynamic SQL in a function running with the owner''s rights could switch off the history and constraint triggers or drop objects.'
  - 'Narrow function-owner roles (inferred): each family of functions that must write what the caller cannot is owned by its own NOLOGIN role holding only the DML that family executes, for example a deletion role (DELETE on the target tables, INSERT on the archive), a history-writer role (INSERT on the history tables) and a cache-maintenance role (DELETE and upsert on the cache tables and invalidation queue). No consumer role is a member of these roles, and none of them owns a table. This follows the doctrine''s "narrow roles for sensitive features can be granted independently", its "grant the narrow attributes needed" and its own grant of DELETE to one admin role for cache invalidation. It resolves the tension that there is no DELETE grant, yet archive-then-delete needs one: DELETE is held by a narrow non-login role that owns the deletion functions; the caller does not hold it (inferred).'
  - Functions with their owner's rights run only where they must write what the caller cannot (web-app-philosophy:ALLOCATION.GUARD.3), owned by the narrow role above, with a fixed search_path and schema-qualified references (inferred for this function form).
  - 'Defaults: EXECUTE on functions, CONNECT and TEMPORARY revoked from PUBLIC; default privileges set so new objects get the right grants; each REVOKE in the creating transaction.'
  - 'Reporting role: SELECT on the tables and columns it needs, personal-data columns withheld by default; on a replica when its load matters. Like the operator role, it sees every row of a table it may SELECT, rows with per-user rules and comments included, unless its own role is restricted.'
  - 'Authentication: scram-sha-256, TLS for every remote connection, trust only on local sockets.'
  - A function lists a role's effective permissions, and CI checks the grant matrix against the role design (inferred).
  - Per-role settings (timeouts, default isolation) are set here, on the role (CONCURRENCY.1, INTERFACE.2).
  design_notes: "Question: how database roles, grants and authentication separate owners, runtime users and humans.\nPositions:\n  - P1 explicit, minimal search_path; revoke CREATE on `public` from PUBLIC (L181).\n  - P2 the owner role that runs migrations differs from the runtime role, which gets only the DML it needs (L182, inferred synthesis).\n  - P3 privileges granted to NOLOGIN group roles; login roles are members (L183).\n  - P4 no superuser for daily work or the application (L184).\n  - P5 revoke PUBLIC defaults (CONNECT, TEMPORARY, EXECUTE on functions); ALTER DEFAULT PRIVILEGES for future objects; REVOKE in the same transaction as the creation (L185).\n  - P6 scram-sha-256; trust only on local sockets; TLS (hostssl) for remote connections (L186).\n  - P7 role hierarchy per functional branch (read, write, admin), each including the one below; default privileges; grants checked at every level; narrow roles for sensitive features; no DELETE grants; humans are members of roles; a function lists a user's effective permissions (L514 MAINT).\n  - Placement: J1's access paths (one role per consumer; backend, reporting, operator, owner) and GUARD.3's per-role layer (EXECUTE per function, SELECT per table and column, UPDATE revoked on state columns).\nForces: security and integrity (what a consumer can do whatever its code) against administration effort.\nDecision and grounds: P1 to P7 adopted, shaped to J1's access paths (max).\n  - Group roles (NOLOGIN, L183) per functional branch (L514): a read level (SELECT on tables and columns), an API level (USAGE on the API schema, EXECUTE on the functions of that branch), and an admin level. Under MD-03 the \"write\" level of L514 is EXECUTE on writer functions, not table DML; direct INSERT or UPDATE is granted only under DB_API's single-consumer exception, and never on state columns (J1 GUARD.3, L596).\n  - Login roles: one per consumer (each backend, the reporting tool, the console, each script family), neither owner nor superuser (L182, L184), a member of the group roles it needs. One login per consumer is what makes the session role in history rows (MAINTAIN.3) name the consumer (J1 actor trust). Humans have personal login roles, members of the operator or read roles (L514); they assert only themselves as actor (J1).\n  - Owner role: owns tables and the other schema objects (one owner per table, L519), runs migrations and human-run data jobs, never serves requests (J1). It does not own the functions that run with their owner's rights (changed after review, M3): a table owner holds rights that cannot be granted separately (L182, SRC-146), including disabling the table's triggers, so a bug or injectable dynamic SQL in a function running with the owner's rights could switch off the history and constraint triggers or drop objects.\n  - Narrow function-owner roles (changed after review, M3; inferred): each family of functions that must write what the caller cannot is owned by its own NOLOGIN role holding only the DML that family executes, for example a deletion role (DELETE on the target tables, INSERT on the archive), a history-writer role (INSERT on the history tables) and a cache-maintenance role (DELETE and upsert on the cache tables and invalidation queue). No consumer role is a member of these roles, and none of them owns a table. This follows L514's \"narrow roles for sensitive features can be granted independently\", L184's \"grant the narrow attributes needed\" and the doctrine's own grant of DELETE to one admin role for cache invalidation (L525's tension note). It resolves doctrine-internal tension 2 (no DELETE grant, yet archive-then-delete needs one): DELETE is held by a narrow non-login role that owns the deletion functions; the caller does not hold it (inferred).\n  - Functions with their owner's rights run only where they must write what the caller cannot (J1 GUARD.3), owned by the narrow role above, with a fixed search_path and schema-qualified references (L181, L505; inferred for this function form).\n  - Defaults: EXECUTE on functions, CONNECT and TEMPORARY revoked from PUBLIC; default privileges set so new objects get the right grants; each REVOKE in the creating transaction (L185).\n  - Reporting role: SELECT on the tables and columns it needs, personal-data columns withheld by default (J1); on a replica when its load matters. Like the operator role, it sees every row of a table it may SELECT, rows with per-user rules and comments included, unless its own role is restricted (X1).\n  - Authentication: scram-sha-256, TLS for every remote connection, trust only on local sockets (L186).\n  - A function lists a role's effective permissions (L514), and CI checks the grant matrix against the role design (inferred).\n  - Per-role settings (timeouts, default isolation) are set here, on the role (CONCURRENCY.1, INTERFACE.2).\nAwaiting maintainer (B1, X1): `undecided: awaiting maintainer, read visibility of rows with per-user rules when several backends share the database` (J1 Q1). Recorded default, J1's word for word: A provisional, with one written specification per rule and a shared denial suite; B acceptable when a per-user read rule must hold for two or more backends. For this node: by default each backend filters these reads and this node grants per role; where B's condition holds, consumer roles receive EXECUTE on the read functions (INTERFACE.1) and, per role, lose direct SELECT on the tables those functions guard. Roles that may SELECT the base tables (reporting, operator) see every row, comments included, unless their own role is restricted.\nRejected: one shared runtime role for all consumers: rejected (J1 access paths; audit could not name the consumer). DELETE grants to consumer roles: never (L514, L525). Superuser or owner for the application: never (L184, L182). Definer functions owned by the owner role: rejected (M3); acceptable never, since a narrow role always suffices for a function family's DML.\nRealizes: ALLOCATION.GUARD.3 (database layer per consumer role); ALLOCATION.RECORD.2 and PIG-WEB-ALLOCATION.DB_API (EXECUTE as the contract's access); ALLOCATION.ACT.4 (session role names the consumer). Links proposed, not created: GUARD.2 realizes GUARD.3 and DB_API.\n\nBuild narrative moved out of the constraints: changed after review, M3; changed after review, M3; inferred."
- op: node.set
  uid: PIG-WEB-DATA.GUARD.3
  constraints:
  - 'Request context is always passed, row security or not, because writer functions and audit triggers need the actor (web-app-philosophy:ALLOCATION.GUARD.3, ACT.4): the backend sets the acting user, and the person an agent acts for, in transaction-local settings (`SET LOCAL` or `set_config(..., true)`) in a reserved namespace, derived from its verified identity. Transaction-local scope is also what keeps context from leaking across pooled connections in transaction mode (INTERFACE.2).'
  - 'The actor is a claim, not a verified fact: writer functions and audit triggers refuse a write with no actor and check that the session role may assert that kind of actor (a backend an end user or agent, an operator or owner role only itself and, for owner-run jobs, a ticket id). The pairing lives in one table read by one function, so every check uses the same rule (inferred realization).'
  - Fixture context lives in a separate namespace that production code never reads.
  - 'Row-level security is not enabled by default (MD-01); the conditions under which it is acceptable are those of PIG-WEB-ALLOCATION.ROW_SECURITY. Where it is used: backend checks are kept; the request role is neither owner nor superuser and FORCE is set where the owner connects; policies get a design review and denial tests through the deployed role and connection path; policy columns are indexed.'
- op: node.set
  uid: PIG-WEB-DATA.GUARD.4
  constraints:
  - history rows (AFTER ROW, append-only; MAINTAIN.3, ACT.4);
  - constraint triggers for invariants no declarative constraint expresses, asserting the isolation level they need (GUARD.1, web-app-philosophy:ALLOCATION.GUARD.2), including the refusal of an active child of a soft-deleted parent (MAINTAIN.2) and dependencies lost by a Boyce-Codd decomposition (web-app-philosophy:DATA.ORGANIZE);
  - same-transaction maintenance of a derived copy at the top of the sync gradient (DERIVE.1);
  - write-time validation of JSON documents (ORGANIZE.5) and the actor checks of GUARD.3;
  - '`updated_at` (departing from the doctrine''s code-written column): a narrow BEFORE UPDATE trigger sets it, and stamps only when the row changes (`NEW IS DISTINCT FROM OLD`, inferred). Ground: under MD-03 rows are also written by owner-run data jobs and, under DB_API''s exception, by a consumer''s direct single-table write; only a trigger sets the column for every writer, as only a constraint binds every writer (web-app-philosophy:ALLOCATION.GUARD.2). A stale `updated_at` is not cosmetic: cache staleness checks depend on it. Writers skip rows whose values would not change (an `IS DISTINCT FROM` predicate), and the trigger''s stamp-on-change form means a no-op update by any writer re-stamps nothing, which avoids WAL traffic and needless trigger work.'
  - 'Not in triggers: state transitions and multi-table business operations (the writer function, ACT.1), outbox and job rows (written explicitly by the writer function, ACT.2), anything that calls outside the database (ACT.2). Each trigger is documented in its table''s comment, named so that name order is the intended firing order, and does not fire another trigger''s work (the last clause inferred).'
  design_notes: "Question: which work triggers may do and which stays with the writing code.\nPositions:\n  - P1 triggers few, narrow and documented (updated_at, cross-table consistency, audit), because they hide side effects and fire in name order (L216, majority).\n  - P2 a trigger runs in its statement's transaction and rolls back with it; BEFORE may skip or alter the row, AFTER sees the final value; use triggers where an invariant or side record must be atomic with the write (L217).\n  - P3 updated_at is written by the code that updates the row, not a trigger; updates skip rows whose value would not change (L529 MAINT; contradicts L216).\n  - Placements: ACT.1 gives state transitions and multi-table operations to writer functions, one per state column (L584, L596); ACT.4 gives history to triggers; GUARD.2 allows constraint triggers under Serializable or a lock; ACT.2 forbids external calls from inside the database.\nForces: integrity (a side record or value that every writer produces) against transparency (hidden effects, L216) and write cost (L529).\nDecision and grounds: triggers do a closed list of work, each item one that must be atomic with the write and hold for every writer (L217):\n  1. history rows (AFTER ROW, append-only; MAINTAIN.3, ACT.4);\n  2. constraint triggers for invariants no declarative constraint expresses, asserting the isolation level they need (GUARD.1, J1 GUARD.2), including the refusal of an active child of a soft-deleted parent (MAINTAIN.2) and dependencies lost by a Boyce-Codd decomposition (J2 DATA.ORGANIZE);\n  3. same-transaction maintenance of a derived copy at the top of the sync gradient (DERIVE.1, L532);\n  4. write-time validation of JSON documents (ORGANIZE.5, L511) and the actor checks of GUARD.3;\n  5. `updated_at` (against L529): a narrow BEFORE UPDATE trigger sets it, and stamps only when the row changes (`NEW IS DISTINCT FROM OLD`, inferred; added after review, m3). Ground: under MD-03 rows are also written by owner-run data jobs and, under DB_API's exception, by a consumer's direct single-table write; only a trigger sets the column for every writer, as only a constraint binds every writer (J1 GUARD.2). A stale `updated_at` is not cosmetic: cache staleness checks depend on it (L537). (The earlier ground \"timestamp-based readers, L594\" is dropped after review, m3: L594 is about sequence ids, its extension to `updated_at` is inferred, and CONCURRENCY.5 forbids bare timestamp cursors anyway.) L216 lists exactly this use. L529's reason, avoiding WAL traffic and needless trigger work, is met at the table: writers skip rows whose values would not change (an `IS DISTINCT FROM` predicate), and the trigger's stamp-on-change form means a no-op update by any writer re-stamps nothing.\n  Not in triggers: state transitions and multi-table business operations (the writer function, ACT.1, L596), outbox and job rows (written explicitly by the writer function, ACT.2), anything that calls outside the database (ACT.2). Each trigger is documented in its table's comment, named so that name order is the intended firing order, and does not fire another trigger's work (L216; the last clause inferred).\nRejected: L529's code-written `updated_at`: rejected; acceptable when every writer of the table is a writer function that sets it, with no direct-write grant and no owner-run job on that table. Triggers for business transitions: never (ACT.1). Triggers for \"cross-table consistency\" in L216's broad sense: only as items 2 or 3 above.\nRealizes: web-app-philosophy:ALLOCATION.ACT.1 (keeps trigger logic within what the placement allows the database); ALLOCATION.ACT.4; ALLOCATION.GUARD.2.\n\nBuild narrative moved out of the constraints: `NEW IS DISTINCT FROM OLD`, inferred; added after review, m3; The earlier ground \"timestamp-based readers, L594\" is dropped after review, m3: L594 is about sequence ids, its extension to `updated_at` is inferred, and CONCURRENCY.5 forbids bare timestamp cursors anyway.."
- op: node.set
  uid: PIG-WEB-DATA.CONCURRENCY.1
  constraints:
  - Serializable is the default isolation of every writing role, owner role included, set on the role (`ALTER ROLE... SET default_transaction_isolation`), not per session, so it survives transaction pooling. A lower-isolation writer anywhere voids the guarantee for all, hence no writing role is exempt.
  - Writer functions and constraint triggers assert `serializable` and raise otherwise (web-app-philosophy:ALLOCATION.GUARD.2).
  - 'Retry: a serialization failure aborts the transaction, so the function cannot retry itself; the caller retries the whole call (one call is one transaction). Every consumer that calls a writer function owns a bounded retry; the shared specification names it: the backend''s bounded retry wrapper at the use-case boundary, the job runner per idempotent batch, and MD-03''s operator consoles and scripts.'
  - 'User-edited rows: a version column; the writer function takes the expected version and writes with it in the predicate (CONCURRENCY.2); a lease row checked by the writer function where conflicts are frequent or lost work costly (web-app-philosophy:ALLOCATION.GUARD.5).'
  - 'Read-only roles: reporting on the primary reads at Repeatable Read, or `SERIALIZABLE READ ONLY DEFERRABLE` where a report must be serializable; reports on a replica accept snapshot anomalies. No check that decides a write reads a replica.'
  - '(b) where (a) cannot reach: a write that must be protected on a replica uses Repeatable Read plus explicit locks on the primary; a human-run job that cannot run Serializable is a recorded exception under the data-job checklist and takes explicit locks on what it writes, because it voids the guarantee for concurrent traffic while it runs (inferred).'
  design_notes: "Question: which concurrency-control strategy is the default for transactions and for user-edited rows.\nPositions:\n  - P1 a recorded choice among (a) Serializable with retry for all transactions, (b) default isolation plus selected locks and constraints, (c) optimistic version columns on user-edited rows (L568, contested: SRC-331 for (a); SRC-343 selected Serializable or locks; SRC-331 Repeatable Read plus locks where replicas must be protected; SRC-344, SRC-345 by conflict rate).\n  - P2 Serializable for all writes and consistent reads needs no other effort; make it the default (`default_transaction_isolation`) with automatic retry (L569).\n  - P3 optimistic when conflicts are rare, pessimistic (a lease checked by the write path) when frequent or when losing long work is unacceptable (L570).\n  - Hand-off from J1 GUARD.2: the review recommends (a), J1 concurs (inferred); set the default per consumer role; writer functions assert it; replica reports accept snapshot anomalies (L573).\nForces: correctness of every concurrent write (a) against retry handling and throughput under contention; (b) puts correctness on each developer finding each anomaly, and write skew survives Repeatable Read (L577); (c) solves a different problem, lost updates across requests and user think time (L475), and is needed whatever the isolation.\nDecision and grounds: (a) for transactions and (c) for user-edited rows, (b) only where (a) cannot reach.\n  - Serializable is the default isolation of every writing role, owner role included, set on the role (`ALTER ROLE ... SET default_transaction_isolation`), not per session, so it survives transaction pooling (L569, L203, L200). A lower-isolation writer anywhere voids the guarantee for all (L573), hence no writing role is exempt.\n  - Writer functions and constraint triggers assert `serializable` and raise otherwise (J1 GUARD.2).\n  - Retry: a serialization failure aborts the transaction, so the function cannot retry itself; the caller retries the whole call (one call is one transaction, J1 R1-4). Every consumer that calls a writer function owns a bounded retry; the shared specification names it (added after review, m6): the backend's bounded retry wrapper at the use-case boundary (L575, J7), the job runner per idempotent batch (L543), and MD-03's operator consoles and scripts (handed to J9 for console tooling).\n  - User-edited rows: a version column; the writer function takes the expected version and writes with it in the predicate (L676, CONCURRENCY.2); a lease row checked by the writer function where conflicts are frequent or lost work costly (L570, J1 GUARD.5).\n  - Read-only roles: reporting on the primary reads at Repeatable Read, or `SERIALIZABLE READ ONLY DEFERRABLE` where a report must be serializable (L574); reports on a replica accept snapshot anomalies (L573). No check that decides a write reads a replica (J2).\n  - (b) where (a) cannot reach: a write that must be protected on a replica uses Repeatable Read plus explicit locks on the primary (L573); a human-run job that cannot run Serializable is a recorded exception under L545's checklist and takes explicit locks on what it writes, because it voids the guarantee for concurrent traffic while it runs (L573; inferred).\nRejected: (b) as the default: rejected; it leaves write skew to each author (L577). Acceptable as the exceptions above. (c) alone: rejected for transactions; it is a second, complementary layer.\nRealizes: ALLOCATION.GUARD.2 (hand-off: default isolation) and ALLOCATION.GUARD.5; J2 DATA.GUARD.\n\nBuild narrative moved out of the constraints: added after review, m6; handed to J9 for console tooling."
- op: node.set
  uid: PIG-WEB-DATA.CONCURRENCY.2
  constraints:
  - 'The isolation of each operation is recorded: Serializable by default; every deviation named with its reason (CONCURRENCY.1).'
  - 'Read-modify-write never spans the backend and the database: the change is one statement, or a version predicate, inside the writer function. A version write that affects zero rows raises a stable error the backend maps to a precondition failure (web-app-philosophy:ALLOCATION.GUARD.5).'
  - 'Serializable kept cheap: read-only transactions declared, transactions short, connections bounded by the pooler (INTERFACE.2), predicates indexed (ORGANIZE.7), explicit locks that Serializable made redundant removed.'
  - 'Retry: 40001 and 40P01 retried as the whole call, logic included, with a bounded number of attempts and backoff; 23505 not retried blindly (it may be persistent); the wrapper sits in the backend at the use-case boundary (the function owns the transaction, the backend owns the retry), and every other caller of a writer function (job runner, consoles, scripts) owns its own bounded retry, named in the shared specification.'
  - Critical invariants are constraints, not isolation alone, and the server stays on a current minor release.
  - 'Tests: logic tests on shared data run in never-committing transactions. Behaviour that only shows at commit (serialization retries, lock waits, deferred constraints, the outbox) is tested with committing sessions in a disposable database, never a shared one. Concurrency tests for the rules GUARD.2 requires (Serializable with retry, locks) are part of the default test suite, not a gap.'
  design_notes: "Question: how isolation levels behave, what they cost and how failed transactions are retried.\nPositions: (consensus; T1 and T2 sources): L571 choose and record isolation per use case, with the anomalies each level permits; L572 Read Committed re-evaluates a waiting UPDATE, so read-modify-write in code loses updates: one atomic statement, a row lock or a version; L573 Serializable's preconditions and limits; L574 keeping Serializable cheap; L575 retry 40001 and 40P01 as whole transactions, 23505 only with care, bounded attempts, the application owns the wrapper; L576 a documented level is not proof (Jepsen, SSI bugs): patch level current, critical invariants backed by constraints; L577 Repeatable Read is snapshot isolation, write skew remains; L676 the version predicate inside the write, then check the affected-row count.\nForces: correctness under concurrency against throughput and retry cost.\nDecision and grounds: all adopted as the mechanics of CONCURRENCY.1 (max, uncontested).\n  - The isolation of each operation is recorded (L571): Serializable by default; every deviation named with its reason (CONCURRENCY.1).\n  - Read-modify-write never spans the backend and the database: the change is one statement, or a version predicate, inside the writer function (L572, L676). A version write that affects zero rows raises a stable error the backend maps to a precondition failure (J1 GUARD.5; J7).\n  - Serializable kept cheap (L574): read-only transactions declared, transactions short (L228), connections bounded by the pooler (INTERFACE.2), predicates indexed (ORGANIZE.7), explicit locks that Serializable made redundant removed.\n  - Retry (L575): 40001 and 40P01 retried as the whole call, logic included, with a bounded number of attempts and backoff; 23505 not retried blindly (it may be persistent); the wrapper sits in the backend at the use-case boundary (J7, L066 as amended by J1: the function owns the transaction, the backend owns the retry), and every other caller of a writer function (job runner, consoles, scripts) owns its own bounded retry, named in the shared specification (m6; console tooling handed to J9).\n  - Critical invariants are constraints, not isolation alone, and the server stays on a current minor release (L576).\n  - Tests (X4): logic tests on shared data run in never-committing transactions (L567). Behaviour that only shows at commit (serialization retries, lock waits, deferred constraints, the outbox) is tested with committing sessions in a disposable database, never a shared one. Concurrency tests for the rules GUARD.2 requires (Serializable with retry, locks) are part of the default test suite, not a gap.\nRejected: read-modify-write in application code at Read Committed: never (L572, L676). Retrying only the failed statement: never (L575).\nRealizes: ALLOCATION.GUARD.5; ALLOCATION.GUARD.2.\n\nBuild narrative moved out of the constraints: m6; console tooling handed to J9."
- op: node.set
  uid: PIG-WEB-DATA.CONCURRENCY.3
  constraints:
  - 'Under the Serializable default, explicit locks are for: reducing serialization failures on a hot logical key; the exceptions of CONCURRENCY.1 (replica-protected writes, a job outside Serializable); claiming queue rows (`FOR UPDATE SKIP LOCKED`, queue tables only).'
  - Only transaction-scoped locks; session-level advisory locks never.
  - Locks on several objects in one documented order; a lock taken before the first query when under Repeatable Read; never a locking call beside a LIMIT at the same query level.
  - 'Advisory lock keys: serialise writers of one logical key with a transaction-scoped advisory lock whose key is a 64-bit hash of a text built from every key dimension (not the two-int4 form, which overflows when a hash is narrowed); the lock is released automatically at transaction end.'
  - No lock outlives a transaction, and no transaction spans user think time; a lease for long edits is a row the writer function checks, not a lock (web-app-philosophy:ALLOCATION.GUARD.5).
- op: node.set
  uid: PIG-WEB-DATA.CONCURRENCY.4
  constraints:
  - 'Inseparable changes: one statement when no step must observe another; separate statements inside one transaction, that is inside one writer function, when one must. In a writer function both forms are atomic; the single statement is required where statements run in their own transactions (batch jobs).'
  - 'Re-runnable work (jobs, migrations, deliveries, anything retried without a recorded key) is idempotent by form: absolute assignments, upserts, conflict-ignoring inserts, self-limiting predicates.'
  - Keyed operations (behind an idempotency key recorded in the same transaction, web-app-philosophy:ALLOCATION.GUARD.6) may use atomic relative updates such as `n = n + 1`, because the key prevents a second execution (inferred).
  - Upserts by `ON CONFLICT DO UPDATE`; never select-then-branch, which also fails under Serializable as a unique violation after a "key absent" check.
- op: node.set
  uid: PIG-WEB-DATA.CONCURRENCY.5
  constraints:
  - 'Sequences are identifiers only: gaps are normal, never a business count; no value leaves the database before commit.'
  - Gapless business numbers (invoices) come from a counter row updated by the writer function in the business transaction, accepting serialized writers for that series.
  - 'Readers that must see every row: first, avoid cursors where a claim-and-mark design works: queue and outbox rows are claimed with SKIP LOCKED and marked or deleted when processed, so every unprocessed row is seen whatever its id (inferred that the sequence-order hazard does not arise). Where a cursor is needed (an ordered feed to an outside consumer, an incremental export), position (a): an `xid8` column and the snapshot horizon filter, a guarantee where (b) is a heuristic wait. Timestamp cursors follow the same rule; never a bare `updated_at > last` cursor (inferred).'
- op: node.set
  uid: PIG-WEB-DATA.CONCURRENCY.6
  constraints:
  - 'Adopted: the single writer function of the state column (ACT.1) writes the facts first and the label last, and its transition audit checks the target state against the data before the flip. Order matters within one transaction because the audit and constraint triggers run in statement order, and across transactions because a workflow advances through several operations (web-app-philosophy:ALLOCATION.ACT.1), where a reader sees each committed step.'
  - 'Observe-only enforcement is a migration aid, not a mode: a new transition is enforced from its first release. Observe-only is acceptable only when a check is introduced over existing data that already violates it, with the violations listed and an exit (the release that turns enforcement on) recorded; the time-boxed exit is inferred.'
- op: node.set
  uid: PIG-WEB-DATA.MAINTAIN.1
  constraints:
  - 'Path: versioned migrations in version control, reviewed, run by automation as a release step in every environment, with a database per developer and the same CI pipeline as code.'
  - 'Form: each change small; DDL re-runnable (conditional create and drop, create or replace), which also makes a partly applied non-transactional step (a concurrent index build) safe to resume; one owner role per table, set in its creation script (GUARD.2).'
  - 'Online safety: short lock_timeout with retry on every DDL; a column default added only when non-volatile, otherwise the multi-step route; constraints NOT VALID then VALIDATE, SET NOT NULL proven by a validated CHECK; indexes built concurrently outside a transaction, a failed build dropped and retried; type changes as add, backfill, switch, drop.'
  - 'Schema and data apart: a backfill is a separate, batched data step outside the schema migration''s transaction; beyond the threshold of MAINTAIN.4 it is a human-run job.'
  - 'Incompatible changes: expand, migrate, contract: data moves by dual write, verified read switch, write switch, removal; drops and renames only in the contract phase once no deployed consumer references the old object. Under MD-03 "deployed" covers every consumer: backends, BI queries, consoles and scripts.'
  - 'Drift gate (inferred, no source read): CI applies every migration to an empty database and compares its catalogue with production''s (schema objects, grants, function signatures); a difference fails the release and is reconciled by a migration, never by editing the live database. The function-signature part is DB_API''s catalogue diff (INTERFACE.1).'
- op: node.set
  uid: PIG-WEB-DATA.MAINTAIN.2
  constraints:
  - 'Per table, recorded (agree): the reason the data is kept selects the mechanism; lookup, configuration and ephemeral rows are hard-deleted; rebuildable caches are invalidated or dropped, never soft-deleted; bulk expiry of time-bounded data is a partition drop or detach, partitioning adopted only when size justifies it, partition keys in primary and unique keys; queryable past values use the temporal model of MAINTAIN.3.'
  - 'Whatever the mechanism: deletion goes only through functions owned by the narrow, non-login deletion role of GUARD.2, which holds DELETE on the target tables and INSERT on the archive; no consumer role holds DELETE (GUARD.2); a hard delete of retained data copies the row to an archive in the same transaction, the history trigger of MAINTAIN.3 recording it as well; CASCADE follows GUARD.1.'
  - 'Where soft delete is used, the doctrine''s soft-delete rules apply whole (a nullable timestamptz deleted_at, constraints that exempt deleted rows, cascades that follow the foreign-key graph in dedicated functions, idempotent soft-delete functions), plus three safeguards required under MD-03 (inferred): (1) a constraint trigger on the child table refuses an active row whose parent is soft-deleted, run under Serializable or with a lock on the parent row (CONCURRENCY.1), since no foreign key does; bound to the table, it also holds for a direct single-table write under DB_API''s exception and for owner-run jobs; (2) the active-row predicate is written once in the shared specification every consumer reads with, and the reporting role''s documentation names it; (3) a restore re-checks the row against the current constraints, since a deleted row escaped them.'
  design_notes: "Question: how rows are deleted, archived or expired per table.\nPositions:\n  - P1 deletion is a recorded decision: soft delete flag, hard delete plus an archive written in the same transaction (table name, id, jsonb copy), or hard delete only; soft deletion leaks its predicate into every query, stops foreign keys from enforcing consistency between deleted parents and children, makes a legally required purge harder; undelete is rarely used; applies: soft delete when users need undo in the product, otherwise archive (L204, contested; critique T3, soft delete defended only in T4 snippets).\n  - P2 decide per entity from the reason data is kept: none (hard delete), legal or audit retention (archive or append-only audit), user-visible recovery (archive, or soft delete with an owner for the predicate), queryable past (temporal model), bulk expiry (partition drop) (L205, majority, inferred synthesis).\n  - P3 per-table gradient: full version history (rare), partial soft delete (the default for user-facing transactional data, about 60% of tables), archive table, hard delete (lookup, configuration, ephemeral) (L520 MAINT; contradicts L204 and the research recommendation D2).\n  - P4 soft delete mechanics: nullable timestamptz `deleted_at`, every read filters, partial indexes over active rows; the predicate leak accepted (L521 MAINT); checks carry an \"or deleted\" escape and uniqueness is a partial unique index over active rows (L522 MAINT); soft-delete cascades shadow the foreign-key graph in dedicated functions (L523 MAINT); idempotent, polyvalent functions with a bulk confirmation flag, deletion time not before creation (L524 MAINT); hard deletion only for rebuildable data or after an archive copy; no DELETE privilege for application roles (L525 MAINT).\n  - P5 time-bounded data partitioned by time; detach or drop old partitions instead of bulk DELETE (L206); partition only when size justifies it (larger than memory); partition keys in primary and unique keys (L207).\n  - The doctrine research's synthesis (D2 answer): the doctrine is the defender the critique lacked, its mitigations answer the critique; suggested record: soft delete by default with the mitigations as conditions.\nForces: (reframed after review, M1):\n  - Integrity of references and reads for every consumer, the node's own force, favours hard delete with archive: foreign keys and unique constraints keep working unchanged, and no reader can see a deleted row by forgetting a predicate.\n  - Immediate undo and in-place history, for users and for reporting, favours soft delete: a user's or an agent's mistake is undone by a single update (a force of the INTERACTION branch, the user's ability to work with the data), and a reporting consumer that counts deleted items in historical figures (last year's orders, including those deleted since) finds them in the base table, where under an archive it must union the archive.\n  - Recoverability as such does not divide them: both options keep deleted data recoverable and kept for audit. What differs is the speed and effort of a restore (one update against a restore function the team owns) and where the integrity cost falls.\n  - MD-03 cuts both ways. It makes the predicate leak (L521) a cost for every consumer that reads base tables (each backend, BI, consoles, scripts), and foreign keys no longer stop a new active child from referencing a soft-deleted parent, a check the cascade functions (L523) do not cover. It also adds the reporting consumers who, under an archive, must union it to count deleted rows.\n  - A cost both pay: GUARD.1 (L492) forbids CASCADE on core entities, so deleting a parent with children needs a deletion function that handles the children in order, soft-deleting them under soft delete (L523), archiving and removing them under the archive.\nDecision and grounds: (one clause awaiting maintainer, question 1) everything except the default for user-facing transactional data is decided.\n  - Per table, recorded (P2, P3 agree): the reason the data is kept selects the mechanism; lookup, configuration and ephemeral rows are hard-deleted; rebuildable caches are invalidated or dropped, never soft-deleted (L520, L525, L538); bulk expiry of time-bounded data is a partition drop or detach, partitioning adopted only when size justifies it, partition keys in primary and unique keys (L206, L207); queryable past values use the temporal model of MAINTAIN.3 (L205, L213).\n  - Whatever the mechanism: deletion goes only through functions owned by the narrow, non-login deletion role of GUARD.2, which holds DELETE on the target tables and INSERT on the archive (changed after review, M3); no consumer role holds DELETE (L525, L514, GUARD.2); a hard delete of retained data copies the row to an archive in the same transaction, the history trigger of MAINTAIN.3 recording it as well (L525, L204); CASCADE follows GUARD.1 (L492).\n  - Where soft delete is used: L521 to L524 apply whole, plus three safeguards required under MD-03 (inferred): (1) a constraint trigger on the child table refuses an active row whose parent is soft-deleted, run under Serializable or with a lock on the parent row (CONCURRENCY.1), since no foreign key does; bound to the table, it also holds for a direct single-table write under DB_API's exception and for owner-run jobs (changed after review, M2: it was a check in the writer functions only); (2) the active-row predicate is written once in the shared specification every consumer reads with, and the reporting role's documentation names it; (3) a restore re-checks the row against the current constraints, since a deleted row escaped them (L522).\n  - Awaiting maintainer (question 1): the default for user-facing transactional data. Recommendation: hard delete with a same-transaction archive by default; soft delete where the product offers users a restore or undo on the table (trash, undo), or where reporting consumers must count deleted rows in place. Ground: it is the max for the node's force, integrity of references and reads for every consumer of a shared database (MD-03), while deleted data stays recoverable through a restore function. Why it stays a question: soft delete's advantage, immediate undo and in-place history for users and reporting, is a force of other branches that the max for DATA does not weigh, and the default for most user-facing tables (about 60%, L520) is the maintainer's codified practice. The review's preferred fix, deciding the archive as a fifth partial verdict against L520, is recorded and not taken: the question goes to the maintainer, framed even-handed. The evidence that restores are rare is one T3 practitioner critique (L204, SRC-265). If unanswered, the graph records the doctrine's default (soft delete for user-facing transactional data, L520) with the three safeguards above mandatory, and marks the clause `undecided: awaiting maintainer`.\nRejected: hard delete without archive for retained data: never (L525). Soft delete for caches: never (L538). Bulk DELETE of time-bounded data where partitioning applies: rejected (L206); acceptable below L207's size threshold. A boolean deleted flag: never (L521).\nRealizes: ALLOCATION.ACT.4 (archive and history kept in the database); J2 DATA.MAINTAIN (gap 3: lifecycle at stack level only). Personal-data erasure (deferred MAINTAIN.6, L526 recorded as input) must reach soft-deleted rows, archives and history; noted, not judged.\n\nBuild narrative moved out of the constraints: changed after review, M3; changed after review, M2: it was a check in the writer functions only."
- op: node.set
  uid: PIG-WEB-DATA.MAINTAIN.3
  constraints:
  - 'Audit history for every table that holds business data: an AFTER ROW trigger writes an append-only history row in the same transaction: table, key, operation, old and new row values, session role (the consumer, verified by the database), claimed actor and the person an agent acts for, transaction id, record time as `created_at` (ORGANIZE.3), and the business time and reason when the writer function passes them (web-app-philosophy:ALLOCATION.ACT.4). Correlation id and outcome for agent actions.'
  - 'Append-only by privilege: no consumer role holds UPDATE or DELETE on history; the trigger function is owned by the narrow, non-login history-writer role of GUARD.2, which holds only INSERT on the history tables, so a fault in it cannot disable the triggers or alter past rows. Retention purges are owner-run jobs under the data-job checklist.'
  - 'Tamper detection for high-value data: because the owner role owns the history tables and so bypasses grants, a detection mechanism (chained row hashes or an external anchor) reveals modified or deleted history. Mechanism open, no source read; the requirement stands for high-value data.'
  - 'Temporal model where the product queries past values: validity periods with WITHOUT OVERLAPS and PERIOD foreign keys on Postgres 18 or later, exclusion constraints with ranges before; the version is checked per project.'
  - Statement-level audit of owner and operator sessions (DDL, human-run jobs) by pgaudit or logging, routed to the security event log, not the history tables (web-app-philosophy:ALLOCATION.ACT.4, the separate sink).
  - Writes with no actor, or with an actor the session role may not assert, are refused (GUARD.3).
  design_notes: "Question: how row history and audit records are written and queried in Postgres.\nPositions: L208 no native system-versioned tables: trigger-written audit tables or application-written history tables, and statement-level \"who ran what\" with pgaudit or logging (majority, inferred); L209 high-value transactions get an audit trail with integrity controls: append-only tables plus tamper detection (consensus); L210 record the actual date and the record date; L211 choose by how tightly history is queried: audit log (simple, hard to read) or temporal properties (integrated, model cost); L212 audit by trigger commits atomically with the change; AFTER sees the final row; L213 Postgres 18 application-time constraints (WITHOUT OVERLAPS, PERIOD), exclusion constraints with ranges before; L685 record the acting identity and, when a program acts for a person, both, passed through a transaction-local setting (majority, inferred, one source). Placement ACT.4: trigger-written, append-only, same transaction, session role and claimed actor both recorded, writes without actor refused, pairing checked; agent actions carry acting identity, delegating subject, operation, correlation id, outcome (L658); the security event log apart (L049, L392).\nForces: completeness and trustworthiness of history (integrity) against write cost and query convenience.\nDecision and grounds: realization of ACT.4 (MD-03), the max.\n  - Audit history for every table that holds business data: an AFTER ROW trigger writes an append-only history row in the same transaction (L212, L208): table, key, operation, old and new row values, session role (the consumer, verified by the database), claimed actor and the person an agent acts for (L685, L566), transaction id, record time as `created_at` (ORGANIZE.3), and the business time and reason when the writer function passes them (L210; J1 ACT.4). Correlation id and outcome for agent actions (L658).\n  - Append-only by privilege: no consumer role holds UPDATE or DELETE on history; the trigger function is owned by the narrow, non-login history-writer role of GUARD.2, which holds only INSERT on the history tables, so a fault in it cannot disable the triggers or alter past rows (changed after review, M3: it was owned by the owner role). Retention purges are owner-run jobs under L545.\n  - Tamper detection for high-value data (L209): because the owner role owns the history tables and so bypasses grants, a detection mechanism (chained row hashes or an external anchor) reveals modified or deleted history. Mechanism open, no source read; the requirement stands for high-value data.\n  - Temporal model where the product queries past values (L211, L205): validity periods with WITHOUT OVERLAPS and PERIOD foreign keys on Postgres 18 or later, exclusion constraints with ranges before (L213); the version is checked per project.\n  - Statement-level audit of owner and operator sessions (DDL, human-run jobs) by pgaudit or logging, routed to the security event log, not the history tables (L208; J1 ACT.4, the separate sink).\n  - Writes with no actor, or with an actor the session role may not assert, are refused (GUARD.3).\nRejected: application-written history as the only record: rejected under MD-03 (J1 ACT.4); acceptable when one application is the only writer (L627 via J1). Audit only in logs: rejected for business history (L208 keeps logs for statement-level audit).\nRealizes: web-app-philosophy:ALLOCATION.ACT.4 (writes history where the audit placement says). Conflicts link of PIG-WEB-TRANSVERSE.OPERABILITY.4 (security log apart) respected.\n\nBuild narrative moved out of the constraints: changed after review, M3: it was owned by the owner role."
- op: node.set
  uid: PIG-WEB-DATA.MAINTAIN.4
  constraints:
  - 'Below about 10^7 rows a data change is a batched data step outside the schema migration (MAINTAIN.1); above it, a sharded job of four decisions in order: batching key, work list, fan-out, observe and recover.'
  - Each batch is its own transaction under Serializable (CONCURRENCY.1), idempotent by form (CONCURRENCY.4), its statements inseparable where they must be; a procedure with transaction control is the tool for per-batch commits (INTERFACE.1).
  - The job runs as the owner role under the data-job checklist; it sets the operator and ticket id as actor (web-app-philosophy:ALLOCATION.GUARD.3); a state column changes only through its writer function or as a recorded exception.
  - Convergence query at zero before the job is done; staleness window and convergence check stated for any asynchronous stream.
- op: node.set
  uid: PIG-WEB-DATA.MAINTAIN.5
  constraints:
  - 'Point-in-time recovery by default: base backups plus continuous WAL archiving to a repository on another host, with retention and tracked chains; the archive command strict.'
  - Archiving tested and monitored before the first base backup; a backup counts only once a restore of it has been rehearsed, and restores are rehearsed on a schedule.
  - Logical dumps (with roles dumped separately) only for portability and partial copies, never as the recovery plan.
  - Configuration in version control.
  - fsync on, write caches safe; synchronous_commit on by default; off only per transaction or per role for data that may be lost on a crash, such as rebuildable caches (the durability and latency trade-off made explicit; per-transaction scope inferred).
- op: node.set
  uid: PIG-WEB-DATA.MAINTAIN.6
  intent: 'How personal data is erased or anonymized on request. Deferred: out of scope for this guideline, recorded only.'
- op: node.set
  uid: PIG-WEB-DATA.MAINTAIN.7
  intent: 'How the database survives the loss of its primary. Deferred: out of scope for this guideline, recorded only.'
- op: node.set
  uid: PIG-WEB-DATA.DERIVE.1
  constraints:
  - Of the reasons for JSON documents, the indivisible object and the flexible periphery are organizing choices governed by ORGANIZE.5 (no fact is stored twice); only the derived summary is a copy governed here.
  - A copy exists only when computing on read is measured too costly, with its sync plan recorded in the table comment before it is built.
  - 'Mechanism, in the philosophy''s order: a stored generated column for same-row values; when any reader decides a write from the copy or shows it as authoritative, a same-transaction trigger, and the writer function only when the source table admits no other writer (no direct-write grant, no owner-run job); a cache table with a stated staleness otherwise (DERIVE.2). The choice by change frequency and divergence harm applies within that order.'
  - 'Every copy other than a generated column gets a drift guard. "Documentation only" therefore never stands alone: with the guard it is the periodic-detection rung.'
  - 'The redundancy is guarded by the database (trigger, function, constraint), not by "the application": under MD-03 several applications write (web-app-philosophy:ALLOCATION.DERIVE.1).'
  design_notes: "Question: when data is denormalized and which sync mechanism and drift check each copy gets.\nPositions: L168 denormalize deliberately, where measured performance requires it, the application guarding the redundancy (consensus); L176 same-row derivable values as generated columns, stored if read often or replicated logically; L531 three legitimate reasons: an indivisible object (bounded, schema-validated JSON), a derived summary of disaggregated data (needs sync), a normalized core with a flexible periphery (MAINT); L532 the sync gradient: documentation only, constraints, periodic detection, scheduled refresh, same-transaction triggers; move up with change frequency and divergence harm (MAINT); L533 drift guard: a scheduled query recomputes each denormalized aggregate, counts divergence and alerts (MAINT). Placement DERIVE.1 (J1): compute on read; same transaction when atomic with the source; cache tables with stated staleness; consumers never write derived stores beside the source.\nForces: integrity (a copy cannot be trusted further than its sync) against read performance.\nDecision and grounds: realization of DERIVE.1 and J2 DATA.DERIVE; the doctrine is the max.\n  - Of L531's reasons, the indivisible object and the flexible periphery are organizing choices governed by ORGANIZE.5 (no fact is stored twice); only the derived summary is a copy governed here.\n  - A copy exists only when computing on read is measured too costly (L168, J2), with L469's sync plan recorded in the table comment before it is built.\n  - Mechanism, in J1's order: a stored generated column for same-row values (L176); when any reader decides a write from the copy or shows it as authoritative (L532's top rung), a same-transaction trigger, and the writer function only when the source table admits no other writer (no direct-write grant, no owner-run job) (changed after review, M2: a direct writer under DB_API's exception or an owner-run job would skip a function-kept copy; only what is bound to the table holds for every writer); a cache table with a stated staleness otherwise (DERIVE.2). L532's choice by change frequency and divergence harm applies within that order.\n  - Every copy other than a generated column gets L533's drift guard (MAINT). \"Documentation only\" therefore never stands alone: with the guard it is the periodic-detection rung (L532 read with L533; no conflict).\n  - The redundancy is guarded by the database (trigger, function, constraint), not by \"the application\" of L168: under MD-03 several applications write (J1 DERIVE.1).\nRejected: denormalization without a measured need: rejected (L168). A copy maintained by a consumer beside the source: never (J1 DERIVE.1, L045). An ordered-log pipeline: rejected in the default; wins with many external derived stores, a high write rate and a team able to run it (L626 via J1).\nRealizes: web-app-philosophy:ALLOCATION.DERIVE.1 (keeps denormalized copies in sync as the placement sets); J2 DATA.DERIVE.\n\nBuild narrative moved out of the constraints: changed after review, M2: a direct writer under DB_API's exception or an owner-run job would skip a function-kept copy; only what is bound to the table holds for every writer."
- op: node.set
  uid: PIG-WEB-DATA.DERIVE.2
  constraints:
  - Classify each cache by recomputability (aggregates of immutable source, outputs of logic outside SQL, expensive SQL aggregates); the key follows the query pattern; timestamps allow staleness detection; the name carries a cache-class suffix; the table comment states sync level, freshness requirement, source and impact of divergence.
  - 'Invalidation: the source change inserts the cache key in the same transaction, by a trigger, or by the writer function only when the source table admits no other writer (DERIVE.1''s rule); workers claim keys with `FOR UPDATE SKIP LOCKED` in bounded batches, so concurrent workers never recompute the same key (inferred); recomputation is set-based, not a row loop.'
  - 'Single-owner caches: a cache whose sources are written by other consumers too keeps its invalidation in the source''s transaction; full ownership (compute, upsert, invalidation) applies only when that service is also the only writer of the cache''s sources (inferred under MD-03; consistent with the philosophy''s ban on derived stores written beside the source). The service writes the cache through its upsert function, with a lease and a terminal failure marker.'
  - 'UNLOGGED only for rebuildable caches that no replica reader needs: the contents of UNLOGGED tables are not replicated to standby servers, so they are unavailable on a standby to a reporting role reading there.'
  - Materialized views only for an atomic full refresh.
  - Cache rows are invalidated or dropped, never soft-deleted; dropping is done by invalidation functions owned by the narrow, non-login cache-maintenance role of GUARD.2, not by a consumer's DELETE and not with the owner role's rights.
  design_notes: "Question: how cache tables are classified, invalidated, named and refreshed.\nPositions: (MAINT unless noted): L420 rebuildable cache data may live in UNLOGGED tables (fast, truncated on crash, not replicated); nothing else (consensus); L535 classify by recomputability: aggregates of immutable source (no sync), outputs of logic outside SQL (invalidation queue plus scheduled recompute), expensive SQL aggregates (scheduled refresh, or invalidate and refresh lazily); L536 invalidation queue: the source change inserts the key (conflicts ignored); a scheduled worker recomputes a bounded batch, upserts, removes the keys; staleness window stated; queue size and oldest age monitored; gap: no rule against double work by concurrent consumers; L537 key follows the query pattern; timestamps for staleness; cache-class suffix; comment states sync level, freshness, source, impact of divergence; L538 when exactly one service owns every write path of a cache, it may own compute, upsert and invalidation, with a lease timestamp and a terminal failure marker; cache rows invalidated or dropped, never soft-deleted; L539 hand-managed cache tables over materialized views; a materialized view fits only an atomic full refresh; the doctrine does not use them. Placement CACHE_STORE: derived caches in Postgres tables; response caches too, UNLOGGED when rebuildable.\nForces: freshness and atomic invalidation (integrity of what caches serve) against read latency and load on the primary.\nDecision and grounds: L535 to L539 and L420 adopted (MAINT, max), with three realizations.\n  - Classification, keys, names, comments per L535 and L537.\n  - Invalidation: the source change inserts the cache key in the same transaction (L536), by a trigger, or by the writer function only when the source table admits no other writer (DERIVE.1's rule, applied here for consistency with M2); workers claim keys with `FOR UPDATE SKIP LOCKED` in bounded batches, so concurrent workers never recompute the same key (L413, L595; fills the doctrine's gap 6, inferred); recomputation is set-based, not a row loop (L530; doctrine-internal tension 6).\n  - Single-owner caches (L538): a cache whose sources are written by other consumers too keeps its invalidation in the source's transaction; L538's full ownership (compute, upsert, invalidation) applies only when that service is also the only writer of the cache's sources (inferred under MD-03; consistent with J1 DERIVE.1's ban on derived stores written beside the source). The service writes the cache through its upsert function, with L538's lease and terminal failure marker.\n  - UNLOGGED only for rebuildable caches that no replica reader needs: the contents of UNLOGGED tables are not replicated to standby servers, so they are unavailable on a standby to a reporting role reading there (L420; corrected after review, m5: the earlier \"would read them empty\" was not grounded; whether a standby query errors or returns nothing was not checked).\n  - Materialized views only for an atomic full refresh (L539).\n  - Cache rows are invalidated or dropped, never soft-deleted (L538); dropping is done by invalidation functions owned by the narrow, non-login cache-maintenance role of GUARD.2, not by a consumer's DELETE and not with the owner role's rights (changed after review, M3).\nRejected: a separate cache service by default: rejected (CACHE_STORE); wins at measured cache latency or load on the primary (J1). Materialized views for partial or per-entry refresh: rejected (L539). UNLOGGED for data that is not rebuildable: never (L420).\nRealizes: PIG-WEB-ALLOCATION.CACHE_STORE (holds cache tables when the placement keeps caches in Postgres); ALLOCATION.DERIVE.3; ALLOCATION.ACT.3 (scheduled refresh, with JOB_HOST).\n\nBuild narrative moved out of the constraints: L420; corrected after review, m5: the earlier \"would read them empty\" was not grounded; whether a standby query errors or returns nothing was not checked; changed after review, M3."
- op: node.set
  uid: PIG-WEB-DATA.DERIVE.3
  intent: 'How full-text and faceted search is provided. Deferred: out of scope for this guideline, recorded only.'
- op: node.set
  uid: PIG-WEB-DATA.INTERFACE.1
  constraints:
  - 'One operation, one call: one business operation is one database function call in its own transaction; backends never compose several calls into one operation. A database function may call another domain''s published functions inside the same transaction: composition across domains happens in the database. What is forbidden across domains is direct access to another domain''s tables, not calling its published functions.'
  - 'Ladder: every write that is a business operation is a function (DB_API); simple reads query base tables, except tables guarded by per-user read functions where B''s condition holds (see PIG-WEB-LOGIC.SECURE.1); a procedure only where transaction control is needed, which in practice means owner-run batch jobs (MAINTAIN.4): a procedure that commits inside cannot be a consumer''s call, since one call is one transaction (inferred).'
  - Views are never contract objects (DB_API); where a throwaway view exists, the doctrine's view rules apply (security_invoker when the caller's rights must apply, security_barrier for filters).
  - 'Conventions adopted: entity, action, variant names; parameters validated first; a safe variant over a base operation; errors naming the function with stable codes, which, with named constraints, the backends map to their interface errors; one result row per affected table with action and count; a change log per function; set-based statements, a loop only when justified and documented. The override flag for blockable business rules is honoured only for roles granted it, and its use is recorded in history with the actor (GUARD.2, MAINTAIN.3; inferred: an unrestricted override would let any consumer bypass a rule the database is the authority for).'
  - 'Parameters the placements require: the expected version for user-edited rows (GUARD.5, CONCURRENCY.2), the idempotency key where the operation is not idempotent by design (GUARD.6), the business reason where history needs it (ACT.4); the actor comes from the transaction-local context, never from a parameter (GUARD.3).'
  - 'Security: EXECUTE revoked from PUBLIC and granted per consumer role (GUARD.2); its owner''s rights only where the function must write what the caller cannot, the owner being a narrow non-login role of GUARD.2, never the owner role, with a fixed search_path (GUARD.2).'
  - 'Evolution (partly against the doctrine''s coordinated-change rule; this departure is counted here, once, for both graphs): additive changes need nothing more: new functions, new parameters with defaults. "Deployed together" stays acceptable only when every consumer of the changed object ships in the same deployment as the migration; otherwise a breaking change goes expand, migrate, contract. The doctrine''s coordination with every consumer and "no formal version numbers, a new function name carries the change" are kept: the new behaviour ships as a new function or variant beside the old one, every consuming team is coordinated with, consumers move, and the old function is removed in a change marked coordinated once no consumer calls it, checked by the catalogue diff in CI (DB_API) and by evidence of zero calls over a stated window (function call statistics; inferred, mechanism not read). Ground: under MD-03 backends, BI, consoles and scripts deploy on their own schedules, and the database and its consumers never deploy atomically.'
  - 'Description in sync (MD-02): "always in sync by process" and the compatibility window apply to the database function API catalogue as to every interface description consumers read; the catalogue diff in CI is that process here, and the generated wrappers are its consumer-side copy (TYPE_CHAIN).'
  - 'Functions ship as migrations (MAINTAIN.1) and are tested against a live database in CI (DB_API), under the test boundary of CONCURRENCY.2: logic tests in never-committing transactions, commit-only behaviour in a disposable database.'
- op: node.set
  uid: PIG-WEB-DATA.INTERFACE.2
  constraints:
  - 'An external pooler in transaction mode for backends and consoles; the design already avoids session state: context in transaction-local settings (GUARD.3), only transaction-scoped advisory locks, settings on the role, not the session. Prepared statements, LISTEN and WITH HOLD cursors are not used through it, which stays the safe default; a listener for database notifications connects directly or in session mode (REALTIME.5). Two points, neither checked against a source: newer PgBouncer releases are reported to support protocol-level prepared statements in transaction mode; and database drivers that cache prepared statements by default must be configured to match the pooler, in the backends and in consoles and scripts.'
  - Owner-run jobs and migrations use session-mode or direct connections (detachable sessions; concurrent index builds outside a transaction).
  - Pool size from the pooler's documented formula as a starting point, measured on the workload (the formula is a heuristic).
  - 'Per consumer role: a connection limit, so BI or a script cannot starve the backends; statement_timeout, lock_timeout and idle_in_transaction_session_timeout set on the role (short for backends, longer for reporting, short lock_timeout for the owner''s DDL); default isolation on the role (CONCURRENCY.1). Reserved slots keep administration possible.'
  - idle_in_transaction_session_timeout on every role, so an abandoned transaction neither holds locks nor blocks vacuum.
  - Remote connections over TLS with scram-sha-256 (GUARD.2).
  design_notes: "Question: how consumers connect, how connections are pooled and how sessions are bounded.\nPositions: (consensus): L199 small server-side concurrency (rule of thumb: cores times 2 plus effective spindles) enforced by an external pooler; max_connections slightly above the pool total (one T3 source for the formula); L200 transaction-mode pooling breaks session state (SET, LISTEN, WITH HOLD cursors, session advisory locks, prepared statements in PgBouncer's documented modes): avoid them or use session mode; L201 per-role connection limits and reserved slots keep administrative access when the pool saturates; L202 idle_in_transaction_session_timeout set; L203 lock_timeout, statement_timeout and idle timeouts per role or session, not globally.\nForces: availability and integrity under load (no abandoned transaction holding locks, no consumer starving others) against connection convenience.\nDecision and grounds: all adopted (max), shaped to J1's access paths.\n  - An external pooler in transaction mode for backends and consoles; the design already avoids session state: context in transaction-local settings (L311, GUARD.3), only transaction-scoped advisory locks (L580), settings on the role, not the session (L203). Prepared statements, LISTEN and WITH HOLD cursors are not used through it (L200), which stays the safe default; a listener for database notifications connects directly or in session mode (J8, REALTIME.5). Two points added after review (m7), neither checked against a source: newer PgBouncer releases are reported to support protocol-level prepared statements in transaction mode (marked for research); and database drivers that cache prepared statements by default must be configured to match the pooler (handed to J7 for the backends and J9 for consoles and scripts).\n  - Owner-run jobs and migrations use session-mode or direct connections (detachable sessions, L545; concurrent index builds outside a transaction, L196).\n  - Pool size per L199 as a starting point, measured on the workload (the formula is a heuristic).\n  - Per consumer role (L201, L203): a connection limit, so BI or a script cannot starve the backends; statement_timeout, lock_timeout and idle_in_transaction_session_timeout set on the role (short for backends, longer for reporting, short lock_timeout for the owner's DDL, L193); default isolation on the role (CONCURRENCY.1). Reserved slots keep administration possible (L201).\n  - idle_in_transaction_session_timeout on every role, so an abandoned transaction neither holds locks nor blocks vacuum (L202).\n  - Remote connections over TLS with scram-sha-256 (L186, GUARD.2).\nRejected: session-mode pooling for backends: rejected; acceptable when a consumer needs session state the design cannot avoid. Global timeouts in server configuration: rejected (L203).\nRealizes: PIG-WEB-ALLOCATION.DB_API (how consumers reach the API); ALLOCATION.RECORD.2 (one role per consumer, bounded). Topology of the pooler belongs to J9 (TRANSVERSE.TOPOLOGY).\n\nBuild narrative moved out of the constraints: handed to J7 for the backends and J9 for consoles and scripts."
- op: node.set
  uid: PIG-WEB-LOGIC.ENFORCE.2
  constraints:
  - One transaction per business operation, holding exactly the actor setting and one API function call (`transaction.atomic` around those two statements, `ATOMIC_REQUESTS` off).
  - Never two API calls in one transaction, never a transaction per request, never one open across a remote call or a user's think time.
  - Reads precede the write; the write carries the version it read, so the writer function rejects a decision taken on stale data.
  - Plain reads (base tables under SELECT grants, no rule needing the actor) run in autocommit; a read needing the actor runs in a short read-only transaction that sets the actor and makes one read call through the generated wrapper; read functions refuse a missing actor.
  - No exception swallowed inside the atomic block; database errors mapped after it.
  - One connection per thread, never shared; one per task under async.
  - The wrapper retries the whole one-call transaction on SQLSTATE 40001 and 40P01 at any isolation level, within PROCESS.3's caps; after an unknown commit outcome only calls carrying an idempotency key are retried.
  - The isolation level is set per consumer role in the database; the backend never lowers it per transaction.
  - Logic tests on shared data run in never-committing transactions; retry paths, lock waits, deferred constraints and the outbox are tested with committing sessions in a disposable database; concurrency tests are part of the default suite.
- op: node.set
  uid: PIG-WEB-LOGIC.ENFORCE.5
  intent: 'Django is the default framework for the default context, recorded as a decision on criteria taken from settled decisions: server-held revocable sessions in Postgres from the framework, built-in CSRF protection, server-rendered HTML with forms, synchronous handlers by default, and built-in password hashing and validators. FastAPI wins when the backend serves only programs and agents with bearer tokens.'
- op: node.set
  uid: PIG-WEB-LOGIC.PROCESS.7
  intent: Email and push delivery is out of scope for this guideline and recorded only. When taken up it inherits PROCESS.2 (outbox delivery to idempotent consumers) and SECURE.6 (tighter limits and spending alerts on operations that trigger third parties).
  constraints:
  - 'Deferred: recorded only.'
  - When taken up, it inherits PROCESS.2 (outbox delivery to idempotent consumers) and SECURE.6 (tighter per-client limits and spending alerts on operations that trigger third parties).
- op: node.set
  uid: PIG-WEB-INTERACTION.VISUALIZE.1
  constraints:
  - Per-request HTML from Python for every page whose content depends on the request; build-time output for pages whose URL set is known ahead (documentation, marketing, help). No request-time JavaScript server (JS_SERVER).
  - 'Partial updates as server-rendered HTML fragments (the hypermedia contract of PRESENT.1): enhancement swaps HTML the server rendered; it never renders large HTML with client JavaScript and never fully rehydrates a server page.'
  - JavaScript only where a part is interactive, added by feature detection (ENVIRONMENT.1), with the page's navigation and core forms working without it (web-app-philosophy:INTERACTION.ENVIRONMENT.1).
  - Client-rendered islands only under the rendering placement's criteria (many interdependent controls, very high update frequency, real-time collaboration). Independent widgets are independent islands; widgets that share live state get one client-state owner for the region or share it through the URL, never state synchronized between islands.
  - Crawled pages are server- or build-time-rendered, which the default already gives; an island never renders the page's main content or its error state.
  - 'Secrets never reach the browser bundle: no credential, key or private setting is compiled into JavaScript or exposed through build-time variables meant for the client; where a framework marks a server/client boundary, it is explicit (the bundle rule is inferred for the default, which has no shared-code boundary).'
- op: node.set
  uid: PIG-WEB-INTERACTION.VISUALIZE.2
  constraints:
  - 'Server data on server-rendered pages: the HTML is the copy; freshness by validators and the HTTP cache rules of the response caching node.'
  - 'Server data inside a client-rendered island: a dedicated server-state cache (deduplication, background refresh, explicit staleness), never a general-purpose store. Each cached record keeps the version it was read at, so a write from the island carries it (GUARD.5).'
  - 'Navigable view state (filters, sort, page, selected tab, open record): in the URL, through the History API; fragments only for in-page anchors.'
  - 'Form state: in the browser until submitted; unsaved input is persisted as PIG-WEB-INTERACTION.ENVIRONMENT.1 sets.'
  - 'Presence: on the real-time channel with a timeout, never in tables (PRESENT.3).'
  - 'Never in browser storage: credentials or session tokens (GUARD.4), or any state that must survive as data (RECORD.1).'
- op: node.set
  uid: PIG-WEB-INTERACTION.VISUALIZE.3
  constraints:
  - the LCP element is in the server HTML, its resource referenced there (preloaded when not discoverable early), never lazy-loaded and never rendered by an island;
  - the DOM stays small; event handlers yield and split long work into separate tasks; no large HTML rendered in the browser (consistent with VISUALIZE.1);
  - images, embeds and late content have reserved dimensions.
  - 'Measurement and thresholds are the performance node''s: field measurement against the Web Vitals targets (LCP 2.5 s, INP 200 ms, CLS 0.1).'
- op: node.set
  uid: PIG-WEB-INTERACTION.VISUALIZE.4
  constraints:
  - 'WCAG 2.2 level AA is the conformance target of every full page, embedded third-party content included: a widget or embed that cannot meet AA is replaced or given an AA alternative on the same page. Grounds: the W3C conformance page plus the max rule (above); one legal floor at AA in one jurisdiction (US Department of Justice, ADA Title II rule, 2024, WCAG 2.1 AA) agrees.'
  - AAA criteria are adopted where the content allows (for example enhanced contrast in the design system), and recorded per project; never stated as a site-wide requirement (W3C note above).
  - 'Native HTML first: elements and attributes before ARIA, native semantics unchanged, every interactive control keyboard-operable with visible focus. Server-rendered HTML (VISUALIZE.1) gives this by default; islands meet the same rules.'
  - 'Checked from the first design (web-app-philosophy:INTERACTION.VISUALIZE): automated checks in delivery plus keyboard and screen-reader passes on each new template (test method inferred).'
- op: node.set
  uid: PIG-WEB-INTERACTION.REALTIME.1
  constraints:
  - No push where a page's data changes rarely or staleness does not matter.
  - Short polling for slow-changing views with second-scale tolerance, ended by a status code when done.
  - 'Server-sent events for one-way push (notifications, comment streams, status of long work): resume by event id (.2), authentication by the session cookie, which fits SSE''s lack of custom headers (GUARD.4).'
  - 'WebSocket only for frequent two-way, low-latency traffic: live cursors and typing, the collaborative text engine (COLLABORATE.3).'
  - Long polling only as a fallback where streaming cannot pass a hop.
  - 'The buffering risk that motivates the SSE-only position is contained, not ignored: the team turns buffering off on its own proxy for streaming routes; the client treats a stream that delivers nothing past the heartbeat interval as broken and falls back to polling (inferred); because push is only a hint, a buffered stream delays updates but never corrupts state.'
- op: node.set
  uid: PIG-WEB-INTERACTION.REALTIME.2
  constraints:
  - 'No caching of streams: long-poll and streaming responses Cache-Control: no-cache; the SSE client uses no-store.'
  - 'Resume by a commit-safe cursor: every event''s id is the change cursor of the philosophy (one no later commit can fall behind; a sequence id is not such a cursor); on reconnect the server replays from the change table after Last-Event-ID; when the cursor is too old to replay, the server tells the client to reload state, as the fallback only. The retry field tunes reconnect delay.'
  - 'Known latency cost of the commit-safe cursor: the cursor PIG-WEB-DATA.CONCURRENCY.5 realizes reads only rows from transactions older than the oldest still in flight (the xid8 horizon), so one long transaction on the primary holds back every push and every catch-up until it ends. This stall is accepted as the price of never skipping a row. The idle-in-transaction timeout ends abandoned transactions; a long active transaction is not bounded by it, so the horizon''s lag is monitored like the notification queue (.5).'
  - 'Keep-alive below the shortest idle timeout: an SSE comment line about every 15 s and WebSocket pings, under every hop''s idle timeout; the application''s idle timeout above the load balancer''s. HTTP/2 PING frames do not count as activity on some balancers.'
  - 'Unbuffered streaming routes only: buffering off at the reverse proxy for SSE, long-poll and streaming routes (proxy_buffering off or X-Accel-Buffering: no), served by async workers.'
  - HTTP/2 to the browser so SSE escapes the six-connection cap; a shared worker holding one stream per origin is acceptable where an HTTP/1.1 hop remains.
  - 'WebSocket through the proxy: Upgrade and Connection set explicitly at nginx; the whole chain verified; over HTTP/2 only where every hop enables extended CONNECT, HTTP/1.1 upgrade otherwise.'
  - 'Bounded WebSocket input: message size and rate capped in the browser handler (no backpressure in the API).'
  - 'Reconnect with exponential backoff and random jitter, then resync by cursor: deploys and restarts drop every connection at once.'
- op: node.set
  uid: PIG-WEB-INTERACTION.REALTIME.3
  constraints:
  - 'An ASGI process type dedicated to long-lived connections (SSE, WebSocket, long polling), routed by path at the proxy, apart from the page and API workers, each scaled on its own measure. It is a process type of the same backend deployable, not a separate service: each backend is one deployable and is not split into services without a measured need.'
  - 'Fan-out from Postgres: each connection process holds one listening connection (.5), wakes on a notification, reads new changes after its last cursor from the change table, and pushes to its local subscribers after the per-subscriber filter (.4). No Redis in the default (POSTGRES_FIRST).'
  - Redis (or a channel layer on it) when a measured limit is reached (NOTIFY commit serialisation) or when the framework chosen for WebSocket groups has Redis as its only production backend, with the change still committed to the table first (no dual write; RECORD.1).
- op: node.set
  uid: PIG-WEB-INTERACTION.REALTIME.4
  constraints:
  - 'Transport and origin: TLS only; the WebSocket handshake and SSE endpoint check Origin against an explicit allowlist (cross-site WebSocket hijacking); compression off unless measured necessary.'
  - Authentication by the session cookie (HttpOnly, Secure, SameSite; GUARD.4); no session token, bearer token or long-lived credential ever travels in a URL (web-app-philosophy:INTERACTION.ENVIRONMENT.6, whose one exception, signed file-delivery URLs, does not apply to channels); agent clients use their bearer credential in the header on WebSocket-capable transports (inferred).
  - 'Authorization per subscription and per event: subscribing to a channel checks the user''s right to read its target; each event is filtered per subscriber against the target''s read rights before it is sent, with the same filter as every other surface. Event payloads carry identifiers, the cursor and a change kind; content is fetched through the normal authorized endpoints (inferred), unless it has passed the same per-recipient filter.'
  - 'Session end closes the stream: on logout or expiry the connection is closed; the connection process re-checks the session at an interval no longer than the session''s idle timeout (interval inferred).'
  - 'Bounds: message size, message rate and connections per user and per client capped; every inbound message parsed as untrusted input.'
  - 'Who filters reads across backends: undecided: awaiting maintainer, read visibility of rows with per-user rules when several backends share the database (see PIG-WEB-LOGIC.SECURE.1). Each backend''s connection process filters events from the same shared specification, and the shared denial-test suite covers the real-time channel.'
  - Per-event filtering protects the channel the application serves, nothing stronger; the comment-grant restriction of PIG-WEB-INTERACTION.COLLABORATE.4 applies until the question is answered.
- op: node.set
  uid: PIG-WEB-INTERACTION.REALTIME.5
  constraints:
  - 'The writer function that commits a change also writes the change row and issues NOTIFY with an identifier payload in the same transaction (issuer under MD-03 inferred): notification is delivered at commit, in commit order, never for a rolled-back change.'
  - Consumers LISTEN and commit, then read current state, then rely on notifications; on every wake-up they re-read from the table after their cursor; identical notifications collapsing to one is harmless.
  - Events that must not be lost are rows (outbox or change table); NOTIFY or a poll only wakes the reader. A low-frequency poll of the same table covers a missed wake-up (interval inferred).
  - 'NOTIFY only where a change has live subscribers: a full notification queue makes committing transactions fail, so with NOTIFY issued from writer functions one stuck listener could fail core writes. Only the writer functions whose changes feed a real-time channel issue it; others write their change rows without notifying (inferred).'
  - One direct, session-level listening connection per process, outside any transaction, never through a transaction-pooling pooler; listener sessions run under the idle-in-transaction timeout, so a listener stuck in a transaction is ended before it fills the queue.
  - Queue usage is monitored; a listener in a long transaction is an incident.
  - 'Tests: the wake-up path only shows at commit (notification delivered at commit, in commit order), so it is tested with committing sessions in a disposable database, never a shared one; logic tests on shared data stay in never-committing transactions.'
- op: node.set
  uid: PIG-WEB-INTERACTION.COLLABORATE.1
  constraints:
  - 'Anchor by identity: a mandatory foreign key to the target record, plus an optional field name for per-attribute review. A type-and-id pair without a foreign key is not an anchor (integrity, inferred; table shape is DATA''s).'
  - 'The target version is always recorded: the default already versions every user-edited record (GUARD.5) and writes its history (ACT.4), so the cost the source counts is paid; the interface marks a comment written on an earlier version. This takes the source''s "when" to "always" (inferred from those two placements).'
  - Ranges only for long text, stored with redundant selectors; offsets alone suffice for text immutable per version.
  - 'Anchor state is explicit: anchored, moved, orphaned or outdated; a comment whose anchor is lost stays visible in a separate place, never deleted or silently reattached.'
  - 'Comments are written through the comment writer function (MD-03: the comment, its notification rows and history are one multi-table operation).'
- op: node.set
  uid: PIG-WEB-INTERACTION.COLLABORATE.2
  constraints:
  - Adjacency list with one displayed level of replies (the depth most review tools use) and a thread-root id set once at insert, so a thread loads in one indexed query and resolution, counts and permissions attach to the root.
  - 'Resolution on the thread root, reversible, never a deletion. Who may resolve follows GUARD.3 as settled: the row-decidable part (the target''s author) is decided by the writer function; users with write rights on the target and the product roles that grant "resolve" are each backend''s policy. No source gives the thread''s opener a resolve right, so none is stated.'
  - 'Deletion is a tombstone: content cleared, deleted_at and actor kept, replies preserved. It is an update through the comment''s deletion function, never a bare update or a DELETE grant. Keeping the replies is an explicit, justified deviation from the default soft-delete cascade (a cascade equals what a native cascading delete would remove unless each deviation is explicit): a thread stays readable when one comment goes.'
  - 'Every edit is an append-only revision, shown as "edited": what was said and when stays reconstructable; the revision rows are the comment''s history (ACT.4).'
  - A tombstone clears the visible content; earlier revisions stay under the history's retention and access rules (moderators only) until a retention or erasure rule removes them (inferred; erasure itself is the deferred personal-data node).
  - 'Erasure against the archive rule (recorded tension, not settled here): the maintainer doctrine allows hard deletion only for rebuildable derived data or after copying the row to an archive in the same operation, and grants no DELETE to application roles. An archive copy defeats an erasure that must remove personal data. Hard deletion of comment content or revisions for erasure is therefore handed to the deferred personal-data node (PIG-WEB-DATA.MAINTAIN.6), which must reconcile it with the archive rule. The default deletion mechanism for user-facing data awaits the maintainer at PIG-WEB-DATA.MAINTAIN.2; a tombstone keeps threads intact under either answer (inferred).'
- op: node.set
  uid: PIG-WEB-INTERACTION.COLLABORATE.3
  constraints:
  - Structured fields keep optimistic versions (EDIT); only fields that people genuinely write together (description, notes, document body) get a text engine.
  - 'The engine is server-authoritative: clients send steps against the document version they hold; the server accepts steps only against the current version, checks the user''s edit right on each batch, persists accepted steps and the document through the writer function with the expected version (GUARD.5 detection in the database, MD-03; persistence path inferred), and broadcasts them; a client behind rebases and resends. This is the position the source names for "a classic site with a server and permission checks".'
  - 'Steps travel on a WebSocket (REALTIME.1: two-way, high frequency); presence and cursors on the same channel with a timeout, never in tables (PRESENT.3).'
  - Comments are append-only rows and need no merge.
- op: node.set
  uid: PIG-WEB-INTERACTION.COLLABORATE.4
  constraints:
  - 'Notifications are rows written by the comment writer function in the comment''s transaction (MD-03: a multi-table operation; ACT.2''s staged intent), delivered after commit from those rows (in-app read state; the real-time wake-up of REALTIME.5); external delivery (email, push) is the deferred delivery node.'
  - Mentions are parsed on the server and a notification is created only for a recipient who may see the target (notifications are a secondary surface).
  - 'Who checks a recipient''s read right across backends: undecided: awaiting maintainer, read visibility of rows with per-user rules when several backends share the database (see PIG-WEB-LOGIC.SECURE.1). Recorded default: the backend that submits the comment checks each recipient against the shared written specification before passing recipients to the writer function.'
  - 'Consequence of the default: the recipient check protects the notifications the application sends, nothing stronger; roles that may SELECT the base tables see notification rows too. Until the question is answered, the comment-grant restriction applies: those roles get no SELECT on comment content or on comments with a narrower audience than their target, and read comments only through a projection limited to target-wide audiences, or not at all (grants: PIG-WEB-DATA.GUARD.2); otherwise the leak to them is a stated known limit.'
  - 'Moderation actions are always recorded: hide and restore with reason, actor and time written to history; hide first, remove only under a retention or legal rule; authors edit their own comments within a stated window, each edit a revision (.2). Removal runs through a deletion function, never a DELETE grant; where a legal rule demands erasure rather than an archive copy, the tension with the archive rule is the personal-data node''s (PIG-WEB-DATA.MAINTAIN.6, deferred).'
  - A report queue (report rows, status, decision) is required whenever comments are visible to people outside the team (customers, the public).
  - Moderate is a separate ability; agent-authored comments are marked and filterable as a class.
- op: node.set
  uid: PIG-WEB-INTERACTION.AGENT.1
  constraints:
  - 'One core, one description: the HTTP interface is described by OpenAPI kept always in sync with the implementation (MD-02); the origin direction is the project''s recorded choice (TYPE_CHAIN). Humans'' pages, JSON clients and agents reach the same core (RULES.4).'
  - 'An MCP adapter over the same core for third-party agent hosts: the default context has agents as users, which means agents the team does not build; the adapter only translates and shapes, so the added surface holds no rule. Tools are few and purpose-specific (web-app-philosophy:INTERACTION.AGENT).'
  - 'The tool surface is an interface description too (MD-02 covers every agent-facing interface): the tool names, input schemas and result shapes have one origin. They are generated from the core description, or checked against it for conformance, and the same CI gate fails on drift. They change additively; a breaking tool change goes expand, migrate, contract under the compatibility window web-app-philosophy:INTERACTION.ENVIRONMENT.3 sets, so agents built against the old tools keep working through a deploy.'
  - 'Stateless surface (LOGIC.EXPOSE.2): no hidden per-connection session; cross-call state is a server-minted, unguessable handle checked against the caller on every call.'
  - 'Transport by trust boundary: the hosted surface is remote HTTP with OAuth; a developer-local tool shipped with the product, if any, uses stdio with environment credentials in a sandbox; a local HTTP server requires an authorization token.'
  - 'Content for agents: data through the API and the MCP adapter, never by scraping pages; pages stay semantic server-rendered HTML (VISUALIZE.1, .4), readable as they are. llms.txt is not relied on for discovery.'
- op: node.set
  uid: PIG-WEB-INTERACTION.AGENT.2
  constraints:
  - Publish protected-resource metadata and answer unauthenticated calls with WWW-Authenticate carrying resource_metadata.
  - Agent clients prove who they are through OAuth client identity or signed requests, never a User-Agent string; this identity keys the per-agent quota (.5) and the agent marking in data (.3).
  - Client ID metadata documents first; dynamic client registration kept only for compatibility; pre-registration for closed sets; consent per client and exact redirect URI matching always.
  - 'Only one-time codes travel in redirects: the authorization code in the redirect URL is single-use, short-lived and bound to the client by PKCE; no session token, bearer token or long-lived credential ever travels in a URL (web-app-philosophy:INTERACTION.ENVIRONMENT.6; PKCE binding inferred as the condition).'
  - 'Fetching a client''s metadata document is a server-side fetch of a client-named URL: private, loopback and link-local ranges are blocked and every redirect hop validated.'
- op: node.set
  uid: PIG-WEB-INTERACTION.AGENT.3
  constraints:
  - An agent has its own identity and acts for a user; tokens carry the subject and the actor (act claim or its documented equivalent), so downstream services and logs see both and any chain.
  - 'Both identities reach the database: the backend asserts the user and the agent as the claimed actor in the transaction-local setting, checked against the backend''s role and recorded with the session role; agent-originated writes are marked as a class.'
  - 'Token binding by consequence: tokens are short-lived and audience-bound for every scope; scopes that allow consequential operations (payments, transfers, deletions, bulk exports) require a sender-constrained token (DPoP or mutual TLS); short-lived, narrow bearer tokens are accepted for the rest, which keeps open agent clients able to connect.'
  - 'Consequential operations bound to their details: Rich Authorization Requests where the authorization server supports them; otherwise the exact-action approval of .4 binds the operation (inferred substitution).'
  - 'Credential lifecycle (GUARD.4): one revocable credential per agent, a recorded sponsor, short lifetimes, and removal that leaves no orphaned permission.'
- op: node.set
  uid: PIG-WEB-INTERACTION.AGENT.4
  constraints:
  - Reads and reversible writes proceed, authorized as every request is (GUARD.3).
  - 'Irreversible or external effects (the consequential list of .3) need approval by the user who owns the authority, shown the exact action, on the application''s own page (realized out of band): the agent''s call creates a pending operation with its exact parameters; the user approves it in the application, authenticated by their own session; the writer function that performs the effect refuses an agent-originated operation without a matching approval by the delegating user (a rule decidable from the stored rows and the actor, so the writer function''s under GUARD.3; inferred). An approval dialog in the agent host is a client hint, never the gate.'
  - 'Approvals stay rare by scoping: only irreversible or external effects ask, so fatigue does not erode them (inferred from a reported 93% approval rate under frequent prompts).'
  - Credentials, payment details and third-party authorization are collected on the application's own page, bound to the user who started the flow, never through the agent.
  - 'Injection is contained structurally: few purpose-specific tools, no agent session the application runs holds untrusted input, private data and outward power together, filters only as an extra layer.'
  - 'No client hint is enforcement: annotations, claimed identity and client names are untrusted.'
- op: node.set
  uid: PIG-WEB-INTERACTION.AGENT.5
  constraints:
  - 'Nested partitions: each agent identity has its own quota inside its user''s allowance, so a runaway agent exhausts only its own share; each client application has a ceiling across its users; the user''s own interactive traffic is counted apart from their agents'' (nesting inferred). The flows whose automation harms the business carry their own per-flow limits.'
  - 'Scarce-goods flows are closed to agents or need a human (web-app-philosophy:INTERACTION.AGENT, a): quotas and owner approval do not stop one party running many accounts, each with its own approved agent. On a flow that hands out scarce goods or rewards automation per account (limited stock, referral credit), completing the flow requires a human step in the application''s own page, or agent credentials are refused there, whatever their identity; the list of such flows is recorded per project.'
  - 'Problem details for every error: stable type, status, detail and extensions; tool execution errors say what to change in the call.'
  - 'Agent-shaped responses: paginated and filtered by default, size-capped, high-signal fields; readable labels beside opaque handles; every handle checked for ownership on the server.'
- op: node.set
  uid: PIG-WEB-INTERACTION.ENVIRONMENT.1
  constraints:
  - Enhancement checks features and degrades without them; nothing varies on User-Agent.
  - No unload handlers anywhere; no-store only on pages showing sensitive data (authenticated personalised pages are private and revalidated).
  - On pageshow from the back/forward cache, the page refreshes time-sensitive state, and re-checks the session so a page restored after logout does not stay usable (the session re-check inferred).
  - Unsaved input is saved on visibilitychange or pagehide, never unload, and restored on return; it sits in per-tab or per-origin browser storage and is cleared after a successful submit or at logout; on pages that show sensitive data, drafts go to per-tab storage only or are not persisted, so they do not outlive the session on a shared device.
- op: node.set
  uid: PIG-WEB-TRANSVERSE.SECURITY.1
  constraints:
  - ASVS 5.0 is the catalogue. Requirements are cited by their versioned id in this guideline's traces and in the project's tests and reviews.
  - 'The level is a recorded decision per project, by risk (EVOLUTION.3; the source''s own rule). Default: Level 2, the level the ASVS 5.0 text says most applications should strive for (grounded). The MD-03 context fits it: the application holds business data of several consumers and accepts writes from humans and agents. Level 3 when a breach would be critical (payments, health, safety; the source''s "highest levels of security", the examples inferred). Level 1 is never the default, consistent with the source''s "starting point".'
  - 'Each requirement is verified at the tier the placements name. Access control is checked where GUARD.3 puts it: writer functions for per-user write rules, the backend for product policy and identity, Postgres roles per consumer (MD-01, MD-03). Per-user read visibility is undecided: awaiting maintainer, read visibility of rows with per-user rules when several backends share the database (see PIG-WEB-LOGIC.SECURE.1); no access-control requirement is marked met on a stronger guarantee than that default gives.'
  - Where a requirement has an automated check, it runs in the pipeline (OPERABILITY.6).
- op: node.set
  uid: PIG-WEB-TRANSVERSE.SECURITY.2
  constraints:
  - TLS terminates at the single reverse proxy (TOPOLOGY.1). The proxy redirects HTTP permanently and forwards only HTTPS-originated requests. It obtains and renews certificates itself, or through a tested ACME client. TLS 1.3, with 1.2 kept only for clients that need it.
  - 'HSTS is sent on every HTTPS response, set in one place. Default end state: a long max-age on the application''s host, reached by raising max-age in steps, with includeSubDomains once its subdomains serve HTTPS. The HTTP redirect stays.'
  - 'Preload is the target when the team controls the registrable domain and commits every subdomain, internal ones included, to HTTPS for the long term. It is recorded as an ADR (EVOLUTION.3) because removal from the preload list takes months to reach users. Grounds: the preload list''s operators advise "do not include the preload directive by default", and preloading covers every subdomain of the base domain, "including internal subdomains that are not publicly accessible" (hstspreload.org); the HSTS source calls the scope "a commitment". A web application often runs on a subdomain of a domain its team does not control. Preload stays the strongest protection of the first request.'
  - Session and CSRF cookies are Secure; no subresource is loaded over HTTP.
  - 'Proxy to application server: a unix domain socket on the same host. Across a network hop, re-encryption is open (gap).'
  - Database connections that cross a network hop, from every consumer role (backends, BI, consoles, scripts), are encrypted and verify the server's certificate. Inferred from web-app-philosophy:TRANSVERSE.SECURITY (MD-03 adds consumers outside the request path); no row read on Postgres connection settings (gap).
- op: node.set
  uid: PIG-WEB-TRANSVERSE.SECURITY.3
  constraints:
  - Python renders the HTML (PRESENT.1, JS_SERVER), so each response gets a fresh nonce from the server's templating engine. Pages produced at build time use hashes for their inline scripts.
  - A page that carries a nonce is never stored in a shared cache, or the nonce would repeat across responses (inferred; consistent with the philosophy's no-store rule for personalised pages).
  - 'Rollout: Content-Security-Policy-Report-Only first, violations sent to a Reporting API endpoint (OPERABILITY.2), fixed, then enforced.'
  - 'The baseline header set is sent on every response, the obsolete ones removed. Each header has one setter: the application for CSP (it holds the nonce), the proxy for the static baseline so static files carry it too (inferred).'
  - CSP stays the second layer. Templates escape by default.
- op: node.set
  uid: PIG-WEB-TRANSVERSE.SECURITY.4
  constraints:
  - 'Every secret is held in one managed store: the platform''s secret store, or a secrets manager. Access is granted per service and per consumer role, least privilege, and every access is audited.'
  - 'Each database consumer role of MD-03 has its own credentials: each backend, the reporting role, the operator role and the owner role. They are rotated automatically; short-lived dynamic credentials are preferred where the store issues them.'
  - 'Delivery: the secret reaches the process at start, as a file readable only by the service account or as an environment variable. The environment is acceptable when no other process can read it and the framework never dumps it (debug off). The delivery rule is reconciled between the two positions (inferred).'
  - The framework signing secret is held like any other, never committed, and rotated.
  - 'CI/CD: least-privilege service accounts, secrets scoped per environment, none in pipeline output.'
  - Secret-access logs are kept as long as obligations require, at least 90 days where none exists.
- op: node.set
  uid: PIG-WEB-TRANSVERSE.SECURITY.5
  constraints:
  - 'Python: lockfile with hashes, --require-hashes over the whole tree. JavaScript build dependencies: lockfile, installed from it exactly (per-ecosystem flag inferred). Container base images pinned.'
  - SBOM per release artifact, scanned continuously, not only at build. Updates go through the staged pipeline, then a staged or canary rollout (OPERABILITY.6).
  - 'Provenance: signed provenance at SLSA Build L3, verified before deploy: a hardened build platform where runs cannot influence one another and the signing secrets are out of the build steps'' reach. The cited default sets Build L2 as the floor; its source (the SLSA v1.0 levels page) describes Build L3 as "Intended for: Most software releases", while noting it "usually requires significant changes to existing build platforms". Under the max rule L3 is the target for the node''s purpose, the integrity of what runs.'
  - 'Database extensions and the Postgres packages come from official sources at a pinned version (inferred: Postgres hosts the queue scheduler and other backing roles, POSTGRES_FIRST and JOB_HOST).'
- op: node.set
  uid: PIG-WEB-TRANSVERSE.CONTRACTS.1
  constraints:
  - '**Function API** (provider: the database owner; consumers: several backends, consoles, scripts that deploy separately, MD-03): provider side: the catalogue diff in CI fails on a removed function or an incompatible signature unless marked coordinated (DB_API); the mark holds only for the contract phase of expand, migrate, contract, or when every consumer of the changed object ships in the same deployment as the migration; consumer side: each consumer''s typed wrappers are generated from the catalogue (TYPE_CHAIN), and each consumer''s integration suite runs against the candidate schema before a migration is promoted. That suite is its consumer contract: the union of what consumers use is executed, not assumed (mechanism inferred).'
  - '**Tables and columns granted to BI**: the same catalogue diff covers every object granted to a consumer role, so a removed or retyped granted column fails the gate (inferred extension of DB_API''s gate). The change then goes expand, migrate, contract.'
  - '**HTTP interface to the team''s own browser code**: the OpenAPI description is kept in sync with the implementation by the MD-02 gate. A diff against the last released description fails on a breaking change inside the compatibility window. Island types are generated from it at build time (TYPE_CHAIN), so the compile is the consumer check. Consumer-driven tests are not required for this seam; this settles the open question for the default context.'
  - '**Agents**: they run code the team does not control, so no consumer test can be collected. The description, its breaking-change diff and machine-readable deprecation signals are the whole contract (inferred). "Always in sync by process" and the compatibility window apply to every interface description agents read: the HTTP description and the agent tool surface (for example an MCP server''s tool list and schemas) both sit under the MD-02 drift gate and the breaking-change diff.'
  - '**External services**: contract tests of the doubles run daily or on the supplier''s change rhythm; a failure opens a realignment task.'
- op: node.set
  uid: PIG-WEB-TRANSVERSE.CONTRACTS.2
  constraints:
  - 'Meaning is machine-checked where it can be: units, ranges and precision as column types and constraints in Postgres, as field constraints in Pydantic. Where it cannot, it is written next to the object: units, time zone, precision, rounding.'
  - Every contract records owner, meaning, quality rules, freshness or availability promise and lifecycle. This includes the function API and the tables BI reads (MD-03). Stored facts are documented from the live database, the meaning text kept in the catalogue next to each object (mechanism inferred).
  - 'Owner: the database owner for the function API and granted tables, or a domain schema''s owning team when teams multiply; the backend team for HTTP.'
  - 'Version and lifecycle. Each function, granted column and endpoint carries a status: active, deprecated, retired. The function API carries no formal version number. Change is carried in names: a new function beside the old, which is the expand step of the philosophy and the route the maintainer''s own rule takes for stored contract schemas, not the coordinated-change text. "Deployed together" stays acceptable only when every consumer of the changed object ships in the same deployment as the migration; otherwise expand, migrate, contract (the narrowing is counted at PIG-WEB-DATA.INTERFACE.1). The HTTP description carries its document version and the deprecation signals.'
  - Money and decimals cross JSON as strings with stated precision and currency or unit (inferred form).
- op: node.set
  uid: PIG-WEB-TRANSVERSE.OPERABILITY.1
  constraints:
  - 'One W3C trace context per user interaction: from the browser (OPERABILITY.2), through the backend, onto every outbound call, and into each job row so workers continue the trace (job carrier inferred).'
  - 'Into the database: the backend sets the trace id in a transaction-local setting in the reserved namespace, beside the actor. Writer functions and audit triggers write it on transition and history rows (a correlation id is required for agent actions; ACT.4). Inferred carrier; it gives the work MD-03 places in database functions the same id as the request. Owner-run jobs carry the ticket id in the statement comment.'
  - 'Logs: one JSON event per line on stdout, unbuffered, with trace and span id. Nothing secret or personal in logs or trace headers.'
  - 'Instrumentation: library instrumentation for the framework, HTTP clients and the Postgres driver; code spans only around business steps.'
  - 'Public and agent endpoints: an incoming traceparent from an unauthenticated or external caller is recorded but does not decide sampling.'
  - 'Sampling: every trace is kept while volume allows. When volume forces sampling, tail sampling keeps every error and slow trace. Logs still carry the trace id of every error.'
  - Server-Timing carries server and database time to authenticated audiences only.
- op: node.set
  uid: PIG-WEB-TRANSVERSE.OPERABILITY.2
  constraints:
  - The server-rendered page carries the trace id of the request that produced it. Client events and the fetches of islands carry it, or a child traceparent, so a browser error joins the server trace (injection into the page inferred). No dependence on browser OpenTelemetry.
  - 'Errors: both global handlers. Vitals: web-vitals, segmented by device class. Delivery: sendBeacon on visibilitychange.'
  - A Reporting API endpoint receives CSP violations, deprecations, crashes and interventions. It is the report sink of SECURITY.3's rollout.
  - 'The collection endpoint treats every event as untrusted input: validated, sanitised before logging. It collects no personal data.'
- op: node.set
  uid: PIG-WEB-TRANSVERSE.OPERABILITY.3
  constraints:
  - The four signals per process type (web, worker) and for Postgres, as histograms. Black-box probes of the critical journeys.
  - 'Indicators: the page targets of PERFORMANCE at the 75th percentile, availability and server latency of the critical journeys. Objectives are set from what users need.'
  - Pages go to a human only on urgent, user-visible conditions; everything else is a ticket.
  - pg_stat_statements is enabled from the first deploy. Its per-role figures give database load per consumer role (backends, BI, operators), which the access-path decision needs to decide when BI moves to a replica (inferred).
  - 'The triggers that move POSTGRES_FIRST, JOB_HOST and CACHE_STORE are measured, not guessed: queue backlog age and claim contention, commit latency under NOTIFY, cache hit latency and load on the primary. Job failures, durations and missed runs are monitored; the drift guard on denormalised data alerts on divergence.'
- op: node.set
  uid: PIG-WEB-TRANSVERSE.OPERABILITY.4
  constraints:
  - The security event log is written to a central collector outside the application database, in one vocabulary, over secure transport. It is copied to read-only storage as soon as possible, and every access to it is recorded.
  - 'It records the standard list: validation failures, authentication results, authorization failures, session failures, errors, use of higher-risk functions. Agent authorization failures are included, with the agent''s identity fields.'
  - 'Under MD-03 many authorization refusals happen inside writer functions (GUARD.3) and in Postgres privilege checks. The backend logs each refusal it receives with actor, role and trace id. Postgres''s own log (authentication failures, privilege errors, role changes) is shipped to the same collector, which covers the consumers outside a backend: BI, operators, scripts. Inferred.'
  - Business history stays in the database (ACT.4); the two records stay apart.
- op: node.set
  uid: PIG-WEB-TRANSVERSE.OPERABILITY.5
  constraints:
  - Every test that touches data runs on Postgres at the production version. It uses a disposable database per run, never production.
  - Each test runs in a transaction that is rolled back. In any shared environment, a mutating test runs in a forced-rollback boundary; a human uses an explicit rollback.
  - 'Behaviour that only shows at commit cannot be tested inside a rolled-back transaction: serialisation failures and retries, lock waits between sessions, deferred constraints, the outbox and NOTIFY. It is tested with concurrent committing sessions in the disposable database, which is then dropped, never in a shared one; the never-committing rule governs shared environments, so this does not breach it.'
  - 'Concurrency tests for the rules GUARD.2 requires (Serializable with retry, locks) are part of the default test suite, not a gap: every invariant GUARD.2 enforces procedurally has a concurrent test (inferred from GUARD.2; web-app-philosophy:TRANSVERSE.OPERABILITY.2).'
  - 'Database tests connect as the consumer role under test, never as the owner (inferred: ROW_SECURITY''s "denial tested through the deployed role", generalised to every grant). They cover writer functions, constraints, grants per role, the actor pairing and the refusal of writes without an actor (web-app-philosophy:TRANSVERSE.OPERABILITY.2, ACT.4).'
  - Backend product policy and parsing are tested in memory.
  - 'Per-user read visibility is undecided: awaiting maintainer, read visibility of rows with per-user rules when several backends share the database (see PIG-WEB-LOGIC.SECURE.1). The shared denial-test suite every backend runs is part of the default suite; if database read functions are chosen, their denial tests run against those functions.'
  - End-to-end tests are few, on critical journeys.
- op: node.set
  uid: PIG-WEB-TRANSVERSE.OPERABILITY.6
  constraints:
  - 'Settings: one typed, validated object built at start and injected. With Django, the settings module reads it from the environment (framework choice is PIG-WEB-LOGIC.ENFORCE.5''s).'
  - Config that changes behaviour (limits, defaults, toggle defaults) is versioned, reviewed and promoted with the release. Deploy-specific values (addresses, credential references) are independent variables per deploy. Secrets come from the store (SECURITY.4). Reconciled between the two sources' positions; inferred.
  - 'Release gates: debug off and the framework''s deploy check run in the pipeline.'
  - 'Pipeline stages: first lint, unit tests, the interface drift gate (MD-02) and the catalogue diff (DB_API); then integration on real Postgres and the consumer suites (CONTRACTS.1); then the few end-to-end tests.'
  - 'Migrations: the shared database''s migrations are released before any consumer release that depends on them, once, in one process. They stay additive through the window, with removals only in the contract phase once no consumer role uses the old object. "Deployed together" stays acceptable only when every consumer of the changed object ships in the same deployment as the migration (the narrowing is counted at PIG-WEB-DATA.INTERFACE.1). Static assets are collected at build into the artifact, not at release.'
  - 'Toggles: release toggles are short-lived, each with a removal task created with it.'
- op: node.set
  uid: PIG-WEB-TRANSVERSE.TOPOLOGY.1
  constraints:
  - The proxy is the only public entry; the application listens on a unix socket or a private address.
  - It buffers requests and responses, except on streaming routes (SSE, streamed agent responses), where buffering is turned off so events are not held back (inferred).
  - It sets Host and the forwarded scheme itself, overwriting any client copy. The application trusts forwarded headers only from the proxy's address and validates Host against its allowed list.
  - It carries TLS (SECURITY.2), compression (TOPOLOGY.4), static files and the outermost request limits (LOGIC.SECURE).
  - 'Product choice by hosting model. Criteria: full buffering, automatic certificates or a tested ACME client, forwarded-header control. No source ranks them.'
- op: node.set
  uid: PIG-WEB-TRANSVERSE.TOPOLOGY.2
  constraints:
  - WSGI with Gunicorn sync workers serves request and response work. Foreign effects run in workers through the outbox (ACT.2, ACT.3), not in the request, so sync workers fit most of the request path (inferred).
  - 'Some external calls stay in the request: the code-for-token exchange of GUARD.4''s backend-for-frontend login, external reads, and model calls on an agent surface. Routes that make such blocking external calls run with threaded workers or on the ASGI process type, or carry a short timeout (threaded or async workers "for long blocking external calls"; inferred).'
  - Long-lived connections (real-time channels, streamed agent responses) run on an ASGI server, Uvicorn. They run as their own process type routed by the proxy, so request work keeps the sync workers' isolation (inferred). Whether the product needs them is PIG-WEB-INTERACTION's decision.
  - Worker count starts at (2 x cores) + 1 and is tuned by measurement. Memory and connections are budgeted per host. Under MD-03 the connection budget covers every consumer of the database, all backends, BI and operators included; pooling is PIG-WEB-DATA.INTERFACE.2's (inferred link).
  - Workers stop gracefully on SIGTERM. The development server never runs in production.
  - The Python server is the only request-time server runtime. JavaScript runs at build time only (JS_SERVER).
- op: node.set
  uid: PIG-WEB-TRANSVERSE.TOPOLOGY.3
  constraints:
  - One image per release, multi-stage, non-root, pinned base. Web, worker and admin processes all start from it with the same config.
  - 'Under the assumed hosting (one or a few self-managed hosts, no orchestrator): each unit runs a process manager with several workers. Workers run as extra units on the web host. A supervisor runs everything as an unprivileged account.'
  - Admin consoles and scripts run from the same release image with the operator role's credentials. Migrations and human-run data jobs use the owner role under the data-job checklist (inferred).
  - The choice is recorded per project (EVOLUTION.3).
  design_notes: "Rows: L156, L157, L158, L159, L160.\nPositions: - Images: staged builds, non-root, pinned base, minimal context (L156).\n  - Replication (L157, contested): P1 a process manager inside the unit (Gunicorn with workers, or Uvicorn --workers) for a single server or Compose; P2 one server process per container, replicated by an orchestrator or platform.\n  - Supervisor, unprivileged account (L158).\n  - Workers: P3 extra units on the web host; P4 separately scaled containers or services (L159, synthesis).\n  - Workers and admin processes from the same release image, code, dependencies and config; admin code ships with the application (L160).\nForces: P1 serves crash containment inside a unit without an orchestrator (L152). P2 serves replication and scaling by the platform (one concern per container, L092), at the cost of running an orchestrator. P3 serves simplicity; P4 serves scaling jobs apart from web load.\nDecision (lead): the image and supervision practices; P1 and P3 under the assumed hosting.\nRejected: P2: wins when an orchestrator or platform replicates containers; then each container runs one server process (L157). P4: wins when job load differs from web load enough to scale apart, measured (L159).\nRealizes: refines LOGIC.PROCESS (process types, supervisor, one concern per container); rests on the J1 access paths (roles per kind of process).\n\nBuild narrative moved out of the constraints: one or a few self-managed hosts, no orchestrator; questions.md, Q1."
- op: node.set
  uid: PIG-WEB-TRANSVERSE.TOPOLOGY.4
  constraints:
  - Assets are built and collected once into the release artifact, with fingerprinted names. The proxy serves them with long-lived immutable caching and compression.
  - Fingerprinted files of previous releases stay available for the compatibility window, as long as an old page can stay open. The asset store is cumulative across releases and pruned after the window (inferred).
  - A CDN is added when users are distant or origin load justifies it. It caches fingerprinted files for the long term. It micro-caches only anonymous responses carrying no nonce and no personal data (SECURITY.3).
- op: node.set
  uid: PIG-WEB-TRANSVERSE.EVOLUTION.1
  constraints:
  - Several backends may share the database (MD-03). Each backend is one deployable; it is not split into services without a measured need (web-app-philosophy:TRANSVERSE.EVOLUTION.3). The team's own backend is one Python deployable over the shared database; MD-03's several backends do not by themselves license splitting it. The schema and function API are the database owner's codebase and pipeline (web-app-philosophy:TRANSVERSE.OPERABILITY.3).
  - A further deployable is split only when size, complexity or the number of teams make the single unit the bottleneck, on a proven boundary. It reaches the data through the function API with its own role (RECORD.2) and never holds a second system of record (RECORD.1).
  - Because the data seam is already the function API, such a split moves no data; only deploy independence and the distribution premium remain to be weighed (web-app-philosophy:TRANSVERSE.EVOLUTION.3; inferred).
  - Likely future services get their own domain schema now, not their own database (MD-03).
  - 'No BFF deployable: the backend is the browser''s BFF. The agent surface is another client of the same core (RULES.4). Whether it needs its own process type is PIG-WEB-INTERACTION.AGENT''s decision.'
  - No micro frontends; server-side composition if teams multiply. No request-time JavaScript server (JS_SERVER).
  - Replacement at seams. Consolidation is legitimate when operating cost grows with the number of services.
- op: node.set
  uid: PIG-WEB-TRANSVERSE.EVOLUTION.2
  constraints:
  - The backend is cut by business concept (orders, billing), each module with a public interface.
  - The module boundary forbids reaching another domain's **tables** directly. The function API is reachable from every module, within its role's grants, the same as for a backend in another language (RECORD.2). Inferred, unvalidated.
  - One business operation is one database function call in its own transaction (PIG-WEB-DATA.INTERFACE.1).
  - A cross-domain business operation (for example an order that also creates an invoice) is therefore one database function. It is called by the module that owns the workflow and owned by the team that owns that workflow, reviewed by the cross-schema owner role (web-app-philosophy:TRANSVERSE.EVOLUTION.5).
  - The Python module interface carries workflow and product policy, never a second path to another domain's data.
  - 'Module boundaries are checked automatically in the pipeline, as a fitness function: the check fails on a direct read or write of another domain''s tables. The tool is open (gap).'
  - One place per concept. A business operation lives in its database function; the Python module holds workflow and product policy, with only tested copies of per-user write rules (ACT.1).
- op: node.set
  uid: PIG-WEB-TRANSVERSE.EVOLUTION.3
  constraints:
  - One ADR per significant decision, one to two pages, in the repository it governs, numbered, in Markdown. Decisions binding every consumer of the shared database live with the database's codebase (inferred).
  - 'Fields: context with forces, decision, status, consequences, the alternatives with pros and cons, the confidence, and the condition that would reverse it (web-app-philosophy:TRANSVERSE.EVOLUTION.1).'
  - Accepted ADRs are never edited, only superseded.
  - 'The guideline leaves these decisions to each project, and each gets an ADR: the interface origin direction (MD-02); row-level security under MD-01''s three conditions; the ASVS level (SECURITY.1); secret delivery (SECURITY.4); process replication (TOPOLOGY.3); the CDN (TOPOLOGY.4); HSTS preload, under its condition (SECURITY.2); adding a managed secret store under the assumed hosting (SECURITY.4); a build platform held at SLSA Build L2 rather than L3 (SECURITY.5); every move of a Postgres-first role past its measured limit.'
