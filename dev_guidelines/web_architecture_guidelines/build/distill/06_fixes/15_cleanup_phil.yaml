operations:
- op: node.set
  uid: ROOT
  design_notes: 'Source: the J1 allocation judge records, final revision (47 nodes judged, 39 of them in this graph; the allocation placements number 26, 25 decided and 1 undecided).


    Default context (maintainer decision MD-03): a classic website (documents, forms, CRUD), one team, single tenant, humans and agents as users, and a database that may be shared by several backends and by reporting, admin consoles and scripts. Under it the database is the authority for stored-data truth and for what must hold whoever touches the data: each business operation is one function call in its own transaction (which may call other domains'' published functions), each state column has one writer function, per-user write rules decidable from the row and the actor are enforced there, and so are invariants and per-role privileges; audit records both the consumer''s role and the actor it claims. Each backend is the authority for product policy not stored in the data, its users'' identity and its workflows, which advance through state columns and the outbox. Foreign mutations run as atomic phases in a worker behind a 202 response, in the request only when the user must see the outcome within about 1 s and then with the intent recorded first by the database function. Browsers and agent clients decide nothing durable; no token travels in a URL except a short-lived signed file URL.


    Maintainer decisions applied: MD-01 (row-level security is not a default; acceptable only for a simple data model, with the scoping key in every covered table and no all-powerful administrator role), MD-02 (interface documentation is always in sync, guaranteed by process; its origin, description or code, is chosen per project with criteria for each direction), MD-03 (the default context above).


    Verdict against the maintainer doctrine: one, partial. ALLOCATION.GUARD.2 goes against the doctrine''s "triggers and CHECK constraints optional": only declarative constraints bind every writer, owner-run migrations included, and procedural checks need serializable isolation or a lock.


    Tensions between maintainer decisions and evidence, recorded and not overridden: (a) MD-01 against the research rows that call for row security when several consumers share the database (L619, L688), which MD-03 makes the default; (b) MD-03 against the research rows that keep one application as the owner of its database (L044) and put logic in the application first, testable in memory (L215, L042); (c) MD-01 with MD-03: per-user read filters implemented in each backend become copies across backends, against ALLOCATION.RULES.4 (L633).


    Open question Q1 (ALLOCATION.GUARD.3): decided by MD-05, read visibility of rows with per-user rules when several backends share the database. former recorded default (superseded): each backend filters from one shared specification with shared denial tests; fallback: database read functions that receive the verified actor, acceptable when a per-user read rule must hold for two or more backends (always the case under MD-03). Under either answer, roles that may SELECT the base tables see every row, comments included, unless their own role is restricted.


    Skeleton gaps: ALLOCATION.FORCES.1 and .2 own no ledger row and are judged from the rows owned elsewhere that state their demand; ALLOCATION.DERIVE.2''s backend-or-browser position is unargued and kept only as a browser copy; ALLOCATION.PRESENT.2 has one grounded position and is marked speculative.


    Evidence gaps: the scalability premise (L615) has no primary source (FORCES.5 is speculative); thresholds for queue contention, notification load and the 1 s deferral are unmeasured; generators for persistence models, interface fields and function wrappers were not read; the collation choice is open under the data branch; the operating cost of a JavaScript server is unweighed; L684 cites no source; the role-to-actor pairing check is inferred and no source describes it.


    Judge records: build/distill/03_judge/J1_allocation/records.md (ALLOCATION roll-up record).


    Maintainer answers: MD-04 (deletion), MD-05 (reads), MD-06 (hosting) and MD-07 (SameSite) closed the four open questions; no clause is decided by MD-05.'
- op: node.set
  uid: TRANSVERSE.SECURITY
  design_notes: "POSITIONS:\n  - P1 whole-site HTTPS, never mixed with HTTP in a session, HSTS (L029); HTTPS as the precondition for browser capabilities (L030).\n  - P2 minimal exposure: a visit is safe, only the data the user's goal needs is collected (L035); secrets, session ids, tokens, keys, payment data, connection strings and unneeded personal data never logged, pseudonymised where identity is not needed, logged input sanitised (L036).\n  - P3 the OWASP Top 10:2025 as an awareness map, each category assigned to an owning tier (L303; tier map inferred, SRC-115 does not state it).\n  - P4 a catalogue of verifiable requirements (ASVS) at a level chosen by risk (L304, owned by PIG-WEB-TRANSVERSE.SECURITY.1; its level definitions are now read from the ASVS 5.0 text, its chapter list is not).\n\nFORCES:\nP1 and P2 serve confidentiality and integrity at a low, one-off cost; no position in the evidence opposes them. P3 serves coverage (no threat without an owner); its cost is that an awareness list is not testable. P4 serves verifiability; its cost is effort scaled by the chosen level.\n\nDECISION:\nP1, P2, and P3 completed by P4's demand.\n  - Transport: every page and every API over HTTPS with HSTS, no mixed content (L029, L030). Database connections from every consumer role are covered by the same property (inferred: MD-03 adds consumers outside the request path).\n  - Exposure: collect the minimum (L035); log no secret or unneeded personal data (L036), trace headers included (L375). The reporting role's column grants exclude personal data by default (J1 access paths), which realizes L035 for the MD-03 consumers.\n  - Threat map: every Top 10 category has an owning tier that the requester cannot modify (RULES.3, L019), named through the allocation placements:\n    - A01 Broken Access Control: backend and database, as GUARD.3 settles it: writer functions decide per-user write rules; the backend decides product policy and identity; the database bounds each consumer by its role (MD-01, MD-03). Decided by MD-05, read visibility of rows with per-user rules when several backends share the database (not settled here). former recorded default (superseded): each backend filters these reads from one shared written specification, with a shared denial-test suite every backend runs. Database read functions that receive the verified actor are acceptable when a per-user read rule must hold for two or more backends. Consequence: Before the maintainer answered, the reporting role gets no SELECT on comment content or narrower-audience comments, the operator role sees every row, and any other role that may SELECT the base tables sees every row unless its own role is restricted; no statement here claims a stronger visibility guarantee.\n    - A04 Cryptographic Failures: the backend (GUARD.4; L303), the proxy's TLS, the database connections of every consumer role, and storage at rest (the review's completion of L303's backend-only assignment; inferred).\n    - A07 Authentication Failures: backend (GUARD.4; L303).\n    - A05 Injection: backend and database (L303): parsing into precise types at every entry and typed function parameters (GUARD.1).\n    - A02 Security Misconfiguration: headers, CSP and deployment; A03 Supply Chain: the pipeline and dependencies (L303; realized in PIG-WEB-TRANSVERSE.SECURITY and OPERABILITY.3).\n    - A09 Logging and Alerting Failures: operations (L303), realized in OPERABILITY.1.\n    - Assigned here, inferred:\n      - A06 Insecure Design: a threat model per placement and per critical flow (authentication, access control, business operations, agent access), with misuse-case tests per tier; OPERABILITY.2's denial tests are their first instance. The allocation records (EVOLUTION.1) are the model's input, not the model. Grounded in the OWASP Top 10:2025 A06 preventions (threat modelling for authentication, access control, business logic and key flows; use-case and misuse-case tests per tier), read by the review.\n      - A08 Software or Data Integrity Failures: the delivery pipeline (signed provenance, trusted sources, review of code and configuration changes, segregated CI/CD; one immutable artifact, L101; realized in PIG-WEB-TRANSVERSE.SECURITY.5) and the parsing tier for untrusted serialized input (GUARD.1). The OWASP 2025 category is untrusted code or data treated as trusted; the database's declarative constraints are not an A08 control and are not assigned here.\n      - A10 Mishandling of Exceptional Conditions: the tier that holds each check, which fails closed (inferred from RULES.3).\n  - Verifiability (max): each property is stated as a verifiable requirement at a level chosen by risk, with requirement ids traceable; the catalogue is a stack choice (P4, PIG-WEB-TRANSVERSE.SECURITY.1). Its level definitions are grounded: ASVS 5.0 says most applications should strive for Level 2, and each organisation decides its level from its risks. The Top 10 stays the awareness map, not the requirement set.\n\nREJECTED:\n  - HTTPS only on login or sensitive pages: never (L029).\n  - Logging raw identifiers or secrets for debugging: never; a hashed session id is acceptable when sessions must be tracked (L036).\n  - The Top 10 as the requirement set or a compliance checklist: it is an awareness document (L303); wins never as the only catalogue.\n  - Security as a per-tier add-on without an owning tier per threat: against RULES.3 and L096.\n  - The recorded allocation decisions as the answer to insecure design: they are the threat model's input; OWASP's A06 asks for threat modelling and misuse-case tests. Wins never as the whole answer.\n\nPLACEMENTS REALIZED:\nrefines RULES.3 (skeleton link). Rests on GUARD.1, GUARD.3, GUARD.4, GUARD.2, ACT.4 and the J1 access paths.\n\nREVIEW FIXES:\nM4 (A08 reassigned to the pipeline and the parsing tier, declarative constraints dropped; A06 as a threat model with misuse-case tests; A04 completed; whole map unvalidated); m1 (ASVS level definitions grounded, L304's level part no longer open); m7 and X1 (one notation for the pending clause, former recorded default (superseded), fallback and consequence stated)."
- op: node.set
  uid: ALLOCATION.GUARD.3
  design_notes: "Positions: P1 backend only (L020, L620, L305, L306); P2 the database enforces through roles and row-level security (L619, L620, L688); P3 two layers: database permissions limit objects, application permissions decide business actions (L468 MAINT, L620, L128).\n\nForces: security against changeability of policy.\n\nDecision: P3, two layers (MD-01; L468, MAINT, max). With several consumers the work divides by where the rule's facts live (R1-1; inferred from MD-03 and L608).\n  - The writer function decides per-user write rules that can be decided from the stored row and the acting user (author, owner, assignee: \"only the assignee may close a task\") and that must hold for every consumer (MD-03, L596, ACT.1). A backend's identical check is a copy for early feedback, generated or tested under RULES.1.\n  - Each backend decides product policy that is not stored in the data: product roles, plan limits, feature flags, workflow steps; and who the human or agent is. One central mechanism per backend, deny by default, object level, on every request from every client (L020, L305, L306, L644).\n  - The database decides per consumer: each consumer has its own role, neither owner nor superuser. Grants say which API functions it may EXECUTE, which tables and columns it may SELECT, and that it writes no table directly except under DB_API's exception; state columns are revoked from UPDATE so the writer function is the only path (L468, L310, L596). This bounds what every backend, BI tool, console and script can do whatever its code.\n  - Functions run with their owner's rights only where they must write tables the caller cannot. They read the acting user from a transaction-local setting (L311, L566). That actor is the consumer's claim, not a verified fact (R1-3): functions refuse a write without an actor, check that the session role may assert that kind of actor (a backend an end user, an operator or owner role only itself; default-context table), and record both the session role and the claimed actor.\n  - Row-level security is not used by default (MD-01). It is acceptable only when the data model is simple, the scoping key is present in every table the policy covers, in practice composite primary keys led by that key, and no all-powerful administrator role must read or write across scopes (MD-01).\n\nFormerly undecided clause (Q1): `decided by MD-05, read visibility of rows with per-user rules when several backends share the database`. Read visibility of rows that carry per-user rules (\"a draft is visible only to its author\"; comments on restricted targets are covered by the same rule). Under MD-01 as written each backend filters reads, one copy per backend, against RULES.4 (L633). Writes are not in the question: they are settled above under MD-03.\n  - former recorded default (superseded): each backend filters these reads from one shared written specification, with a shared denial-test suite every backend runs (X1).\n  - Fallback kept, not forbidden: database read functions that receive the verified actor are acceptable when a per-user read rule must hold for two or more backends (X1). Under MD-03 several backends share the database by default, so this condition is always met: the fallback is available wherever MD-03's default holds. The actor is verified by the backend that asserts it and is a claim to the database (R1-3).\n  - Consequence, under either position: Before the maintainer answered, the reporting role gets no SELECT on comment content or narrower-audience comments, the operator role sees every row, and any other role that may SELECT the base tables sees every row unless its own role is restricted. No statement in this guideline claims stronger visibility than this (X1).\n\nTension (MD-01 against evidence): L619 and L688 call for row security when several applications or agents read the database, which MD-03 makes the default. MD-01 overrides; the residual risk is that a consumer with SELECT on a table sees every user's rows, and that each backend's read filter is the only per-user gate on reads.\n\nRejected: P1 without the database layer; wins never (L468). P2 as sole authority: loses product policy that lives in application code (L468); row-level security wins only under MD-01's conditions. The backend as authority for per-user write rules decidable from the row: two authorities for one rule (R1-1); the backend keeps a tested copy.\n\nChanged (R1): division of work with several consumers (MD-03); row security per MD-01 (F1 closed); new clause Q1.\n\nChanged (R3): Q1 notation unified; former recorded default (superseded) and fallback reworded; comments covered; visibility of SELECT-capable roles stated (X1).\n\nChanged (R2): one authority per per-user write rule, the writer function; backend check is a tested copy; backend owns product policy not stored in data (R1-1). Actor treated as a claim, pairing checked, writes without actor refused (R1-3). Q1 narrowed to read visibility, decided by MD-05 (R1-2).\n\nWould move it: MD-01's three conditions (row security becomes acceptable); Q1's answer (read visibility into read functions)\n\nRecommendation for the open clause: database read functions that receive the verified actor, for data with per-user visibility; each backend filtering stays acceptable for data without per-user rules. former recorded default (superseded) if unanswered: each backend filters from one shared written specification with a shared denial-test suite. Consequence for roles that read the base tables, Before the maintainer answered: the reporting role gets no read access to comment content or narrower-audience comments; the operator role sees every row; any other role sees every row unless its own role is restricted.\n\nDecided (MD-05): simple reads that carry no logic are written by each backend directly; a read that is sensitive, complex, high-impact, built by a function, or an abstraction several backends share is wrapped in a database function; per-user visibility rules are sensitive reads, so the former fallback (database read functions that receive the verified actor) is the rule for them. The earlier recommendation (read functions for data with per-user visibility, backend filtering acceptable for data without) and the former recorded default (each backend filters from one shared specification with a denial-test suite) are superseded. The interim comment rule is decided under MD-05: the reporting role reads comment content and narrower-audience comments only through database functions; the operator role sees every row; other roles that read base tables see every row unless their own role is restricted."
- op: node.set
  uid: TRANSVERSE.OPERABILITY.2
  design_notes: "POSITIONS:\n  - P1 a pyramid: many small fast tests, some coarser, very few high-level; ratios team-specific (L099).\n  - P2 if high-level tests are fast, reliable and cheap, fewer low-level tests are needed (Fowler, SRC-198, noted in L099).\n  - P3 test at the lowest level that can catch the failure; when a high-level test finds a bug, add the low-level test (L396); end-to-end tests few, on critical journeys (L397).\n  - P4 integration tests against a real engine of the production kind, never mocks or another engine (L399); a disposable database, each test isolated (L400); a test that mutates shared data runs in a boundary that never commits (L567, MAINT).\n  - Read against FORCES.6 (J1): logic in the application tests in memory; logic in the database needs a database to test (L042, L472 MAINT).\n\nFORCES:\nP1 and P3 serve fast, precise feedback; their cost is many tests to write. P2 serves fewer tests when tooling allows; it fails when high-level tests are slow or flaky (L397). P4 serves fidelity (the constraints, isolation and functions are the real ones); its cost is a running database in every test run.\n\nDECISION:\nP3 as the rule, P1 as its usual result, P4 for every test that touches data.\n  - Proportion follows \"the lowest level that catches the failure\" (L396). The pyramid is what that rule usually yields (L099); ratios are not prescribed.\n  - In the MD-03 default the database holds the business operations, the writer functions, the invariants and the audit. Their low-level tests run on the real engine of the production kind (L399). Each test is isolated: a rolled-back transaction by default (L400 gives it as its example). Logic tests on shared data run in never-committing transactions (L567). Behaviour that only shows at commit or between sessions (serialization failures and retries, lock waits, deferred constraints, the outbox) is tested with concurrent committing sessions in a disposable database, never a shared one (L567 governs shared environments; X4). They cover constraints, writer functions, the actor pairing and the refusal of writes without an actor (ACT.4).\n  - Every invariant that GUARD.2 enforces procedurally, under Serializable with retry or under a lock, has a concurrent test. These concurrency tests are part of the default test suite, not a gap (inferred from GUARD.2: a placement whose correctness depends on concurrent behaviour needs a test of that behaviour).\n  - Backend product policy and request parsing are tested in memory (L042).\n  - Authorization is tested by denial: each role and actor is refused what it may not do (GUARD.3); these denial tests are the first misuse-case tests the threat model asks for (SECURITY, A06). Decided by MD-05, read visibility of rows with per-user rules when several backends share the database (not settled here). former recorded default (superseded): each backend filters these reads from one shared written specification, with a shared denial-test suite every backend runs. Database read functions that receive the verified actor are acceptable when a per-user read rule must hold for two or more backends. The denial suite does not cover roles that may SELECT the base tables: Before the maintainer answered, the reporting role gets no SELECT on comment content or narrower-audience comments, the operator role sees every row, and any other role that may SELECT the base tables sees every row unless its own role is restricted.\n  - Contract tests at the seams (stack judge); a few end-to-end tests on critical journeys (L397).\n\nREJECTED:\n  - P2 as the default: acceptable when high-level tests are measured fast, reliable and cheap (L099's note).\n  - A fixed ratio (for example 70/20/10) as a rule: ratios are team-specific (L099).\n  - Mocking the database, or another engine, for logic placed in the database: never (L399, L103). In-memory tests stay for logic the backend owns.\n  - End-to-end-heavy suites: never as the default (L397).\n\nPLACEMENTS REALIZED:\nno skeleton link to a placement; rests on FORCES.6 (L042, L472), GUARD.2, GUARD.3, ACT.1 and ACT.4, whose database realizations it tests.\n\nREVIEW FIXES:\nM2 and X4 (each test isolated, rollback by default; commit-time and concurrent behaviour tested with committing sessions in a disposable database; concurrency tests required by GUARD.2 in the default suite; the gap kept only for the missing source row); m7 and X1 (pending clause added to the state, one notation, default, fallback and consequence stated)."
- op: node.set
  uid: ALLOCATION.RULES.4
  epistemic_state: 'known: MD-05 (per-user read visibility goes through database functions)'
  constraints:
  - Rules, validation, authorization and state transitions exist once; never in an adapter or a prompt.
  - The function API is the core for what must hold for every consumer; each backend's use cases are the core for its own workflow and product policy.
  - Per-user read visibility across backends goes through database read functions (MD-05), so this rule and the ban on default row security do not pull apart.
