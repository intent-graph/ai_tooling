- op: node.set
  uid: LOGIC
  epistemic_state: 'known (roll-up) | undecided: awaiting maintainer, read visibility of rows with per-user rules when several backends share the database (see ALLOCATION.GUARD.3)'
  constraints:
  - 'It secures entry: authenticates every caller, parses every input into precise types, enforces product policy deny by default on every request, and bounds what each caller can consume (LOGIC.SECURE).'
  - 'It enforces its share of the business logic in a core separable from transport and storage: workflow across operations, product policy not stored in the data, external calls; for every operation on stored data it calls the database function API through a port, one call per operation in its own transaction (LOGIC.ENFORCE; ACT.1).'
  - It runs as stateless, disposable processes of distinct types, with every durable fact (sessions included) in backing services (LOGIC.PROCESS).
  - 'It exposes one HTTP interface per backend with the protocol''s defined meanings: HTML hypermedia for browsers, a described resource-oriented structured-data interface and an agent adapter on the same core (LOGIC.EXPOSE).'
  - It does not decide invariants, multi-table operations, state transitions or per-user write rules decidable from the row (database, GUARD.2, ACT.1, GUARD.3); its checks of those are tested copies for early feedback (RULES.1). It holds no cache beyond one request (DERIVE.3) and resolves no write conflict (the database detects, GUARD.5).
- op: node.set
  uid: ALLOCATION.GUARD
  epistemic_state: 'known | undecided: awaiting maintainer, read visibility of rows with per-user rules when several backends share the database (see ALLOCATION.GUARD.3)'
- op: node.set
  uid: INTERACTION.ENVIRONMENT.7
  constraints:
  - 'No long-lived credential is readable by page script: the session cookie of ALLOCATION.GUARD.4 is opaque and unreadable by script (L024).'
  - Output is escaped by default by the templates; CSP is the second layer, not the first (L026).
  - XSS prevention comes before CSRF defence, because XSS defeats every CSRF defence (L025).
  - CORS is not access control; CSRF defence stands on its own (L027).
  - User-uploaded content is served from a distinct registrable domain, so the same-origin policy contains any script in an upload (L028).
  - Content written by other users or by models (comments, agent output) is untrusted wherever it is rendered (L644).
  - No check that grants access or protects integrity runs in the page (RULES.3, L019).
- op: node.set
  uid: DATA
  intent: 'The database is the system of record and holds everything that must hold whoever touches the data: it organizes facts so each is stored once, guards them under concurrent and partial change, keeps structure correct over time, derives instead of storing, and offers every consumer one function API as the contract to the data. Several backends and other consumers (reporting, admin consoles, scripts) may share it, so what must hold for every consumer lives in the database, not in any one backend.'
  constraints:
  - 'Organize: each fact stored once, in tables normalized at least to third normal form (DATA.ORGANIZE).'
  - 'Guard: every rule a declarative constraint can express is declared; the rest is checked by writer functions under an isolation level or lock that makes the check correct (DATA.GUARD).'
  - 'Maintain: structure changes only through versioned migrations applied by automation; incompatible changes go expand, migrate, contract; the live database is the truth for structure (DATA.MAINTAIN).'
  - 'Derive: store the minimum and compute the rest; every stored derived value is a copy with a stated sync and staleness (DATA.DERIVE).'
  - 'Offer: one function API is the contract every consumer calls, one business operation per call (DATA.INTERFACE).'
  epistemic_state: 'known | gap: data lifecycle (retention) has no principle row | undecided (in children): awaiting maintainer, read visibility of rows with per-user rules when several backends share the database (DATA.GUARD)'
- op: node.set
  uid: DATA.MAINTAIN
  epistemic_state: 'known | unvalidated: the drift check between live catalogue and migration history, and expand-contract as the only route under MD-03, are inferred | gap: data lifecycle (retention) has no principle row'
  constraints:
  - Every schema change is a versioned migration kept in version control with the code, ordered, reviewed, and applied only by automation as an explicit step of every release, identically in every environment, never by hand. No production change, structural or data, is ad hoc SQL.
  - Long-running data work is a versioned script outside the automated migration run, launched by a human under a checklist with a ticket id.
  - Migrations are the only origin of change; the live database is the truth for current structure, and documentation, persistence models and function wrappers are generated from it. A structure the migrations would not produce is a defect to reconcile, not a new truth.
  - 'An incompatible change keeps every running consumer working: add the new structure or function beside the old, move every consumer, then remove the old in a change marked coordinated once no deployed consumer references it. This holds for tables and the function API alike.'
  - 'Conventions evolve forward only: new objects follow the new rule, legacy ones are not renamed in bulk.'
  - Recovery to a chosen moment is the default, and a backup counts only once a restore of it has been rehearsed.
  design_notes: 'Question: how schema and data evolve without breaking running code, and what is the source of truth for structure.

    Positions: P1 every schema change is a versioned migration in version control with the code, ordered, applied only by automation, as an explicit release step, the same way in every environment, never by hand (L046; SRC-220 T2, SRC-022 T1, SRC-183 T2, SRC-187 T2); the doctrine agrees and adds re-runnable DDL, one owner role per table, long data work kept out of automated runs (L519, owned by J6). P2 hand-applied or ad hoc changes to production structure (the practice L046 rejects). P3 a backward-incompatible change proceeds expand, migrate, contract, so every phase can be released, verified and rolled back (L047; SRC-186, SRC-190, SRC-220, SRC-311, SRC-278). P3'' a breaking change to the function API is coordinated with every consuming team and deployed together (L517 doctrine, owned and judged by J6 in the defaults graph''s functions and views node; cited, not judged). P4 the live database is the source of truth for structure: table and function documentation is generated from it (L474 doctrine; SRC-220). P5 conventions evolve forward only: new tables follow the new rule, legacy ones are not renamed in bulk (L474), against P5'' bulk renaming to the new convention.

    Forces: integrity of running code and data across releases. P1 and P3 serve it and cost process (each change small, several releases for one incompatible change). P2 serves speed and loses reproducibility and the record of what changed. P3'' serves speed of a coordinated change and, unless every consumer deploys in one step with the migration, leaves a window where old code runs against the new structure. P5'' serves uniformity of names and breaks every consumer of the old names, several under MD-03.

    Decision: one path of change (L046, L519; consensus and doctrine agree; long data work under L545''s checklist, J1''s owner-role access path). Origin of change and truth of state are distinct and must agree (L474; RECORD.3, doctrine, max); a structure the migrations would not produce is a defect (inferred from L046 with L474); the drift check, such as comparing a freshly migrated database''s catalogue with production, has no source read and its mechanism is handed to J6. Incompatible changes go expand, migrate, contract (L047), for tables and the function API alike; the contract phase is the change marked coordinated (L192; RECORD.3''s catalogue diff in CI fails on a removal not so marked). Max: the database and its consumers never deploy atomically, and under MD-03 several consumers (backends, reporting, consoles, scripts) deploy on their own schedules; expand, migrate, contract is the only route that keeps every running version working (inferred from L047 with MD-03). Conventions evolve forward only (L474, doctrine, max): a rename is itself an incompatible change for every consumer.

    Principle-level requirement (changed after review, m8, X2): an incompatible change keeps every running consumer working. How the function API meets it, and the verdict on L517, belong to J6, which counts that departure once for both graphs: "deployed together" stays acceptable only when every consumer of the changed object ships in the same deployment as the migration; otherwise a breaking change goes expand, migrate, contract. This node cites that verdict and does not count it; the former conflict state on L517 is removed.

    Rejected: P2 never. P3'' a breaking change deployed together: not judged here, see above. P5'' acceptable only through expand, migrate, contract, when the inconsistent name costs more than moving every consumer (inferred).

    Out of this node''s rows: retention, deletion, history tables, bulk jobs and recovery are realized in the defaults graph''s maintenance nodes (J6) and have no principle-level row here (gap 3). ALLOCATION.ACT.4 (audit) is realized by the defaults graph''s history tables node; no philosophy link (gap 1).

    Realizes: ALLOCATION.RECORD.3 (keeps the database structure as the origin of every stored fact and of the function API''s contract). Refines python-kb-philosophy:REPRODUCIBILITY (skeleton link). Link proposed, not created: realizes ALLOCATION.ACT.4 through history kept in the database.


    Lifted from the stack-neutral clause of PIG-WEB-DATA.MAINTAIN.5 in pig-web-defaults, wording kept; the verdict is that record''s, not re-judged here. Clause: point-in-time recovery, with backups that count only once a restore has been rehearsed.'
