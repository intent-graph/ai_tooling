operations:
- op: node.set
  uid: ALLOCATION.ACT.1
  constraints:
  - 'Authority: database for operations, transitions, invariants and per-user write rules decidable from the row; backend for workflow, product policy not stored in the data and external calls'
  - 'Copies: the backend''s check of per-user write rules (generated or tested); the browser previews which actions are allowed (feedback)'
  - 'Forbidden: multi-table writes composed in a backend; a backend transaction wrapping several API calls; business rules in the browser, agent adapters or prompts (L633); a second writer of a state column, owner-run jobs included unless a recorded exception'
  - Multi-table operations are database functions.
  - Each state column has exactly one authoritative writer function, which logs each transition; consumer roles hold no direct update right on state columns or direct writes on tables with multi-table effects.
  - Per-user write rules decidable from the stored row and the acting user are decided by the writer function; a backend's check is a generated or tested copy.
  - One business operation is one function call in its own transaction (ALLOCATION.RULES.5).
  - Owner-run jobs change a state column only through its writer function, or as a recorded exception under the data-job checklist, with the operator and ticket id set as actor.
  - External calls never run inside a database transaction; they stay in the backend.
- op: node.set
  uid: DATA.GUARD
  constraints:
  - 'Declare every rule a declarative constraint can express: NOT NULL unless absence is a meaningful state; row-local CHECK paired with NOT NULL; foreign keys; unique, partial unique and exclusion constraints for cross-row rules; domains for value types used in several places. Constraints are named, so a violation maps to a stable error. Required, not optional.'
  - Rules no constraint can express (other multi-row rules, legal transitions, dependencies lost by a Boyce-Codd decomposition) are checked in the writer function or a constraint trigger, under Serializable isolation with retry or after locking the governing row; the function or trigger asserts the isolation it needs, set per consumer role. The default isolation level belongs to J6.
  - Each business operation is one function call in its own transaction (ALLOCATION.RULES.5).
  - Concurrent change is detected inside the writer function, which takes the expected version as a parameter; no transaction or lock is held across user think time.
  - 'Mutual exclusion that guards correctness is enforced by the store: row version, unique constraint or row lock inside the transaction; a lease is checked by the writer function as a fencing token. A lock outside the database is acceptable only to save duplicate work.'
  - 'The consistency model is stated per operation: which isolation, whether it reads the primary or a replica, and what staleness it accepts. A check that decides a write never reads a replica. A datastore is never labelled "CP" or "AP".'
  - 'Access guarding: each consumer has its own role, neither owner nor all-powerful; grants bound which functions it may call and which tables and columns it may read; state columns are revoked from direct update so the writer function is the only path. Row-level security is not a default (MD-01).'
  epistemic_state: 'known | conflict: against L471 (MAINT) on optional CHECK constraints, inherited from J1 GUARD.2 | undecided: awaiting maintainer, read visibility of rows with per-user rules when several backends share the database (see ALLOCATION.GUARD.3) | unvalidated: the stack form of fencing (L476) and "no deciding read on a replica" are inferred'
- op: node.set
  uid: LOGIC.ENFORCE
  constraints:
  - 'Layers (P1, L062): adapters on the outside (HTML views, the structured-data interface, the agent adapter, job runners) translate requests into use-case calls and shape results; they hold no rule (L633). Use cases on the inside carry the backend''s share: workflow across operations, product policy not stored in the data, external calls (ACT.1, GUARD.3).'
  - Ports for every external system, the database function API included (P3, L064). Each business operation is one call in its own transaction (ALLOCATION.RULES.5); a step that must be atomic with another is a new database function.
  - 'Testability, by share (P2, L063): the backend''s own logic (policy, workflow, orchestration of external calls) runs in isolation with fake adapters and no live database. The rules the database owns (invariants, operations, transitions, per-user write rules decidable from the row) are tested against a live database, as ACT.1 accepts (L042, L472); the backend never reimplements them to make its tests pass without one, except as a copy generated from or tested against the function (RULES.1). Test boundary (X4): logic tests on shared data run in never-committing transactions (L567); behaviour that only shows at commit (serialization retries, lock waits, deferred constraints, the outbox) is tested with committing sessions in a disposable database, never a shared one; concurrency tests for the rules GUARD.2 requires (Serializable with retry, locks) are part of the default test suite.'
  - 'Behaviour lives with its authority (P4, L065): rules about stored data live in the database''s writer functions, never in backend objects that would be a second authority; the backend''s own policy and workflow logic, when complex, lives in behaviour-rich domain objects with a thin use-case layer around them. A simple share is a transaction script (L226).'
  - 'Data in, decision out (P5''s first half, with L614): a use case gathers the data it needs in as few calls as possible (one read function or statement, never queries in loops), then decides in code that does no fetching; that keeps the decision testable without I/O and runnable from any driver (online, batch, agent).'
- op: node.set
  uid: TRANSVERSE.EVOLUTION.5
  constraints:
  - Organise teams cross-functionally around a capability; never organise by layer or let a database team write other teams' business operations.
  - Hold the database owner as a named role inside the team, not a layer team.
  - When teams multiply, give each capability team its domain schema, functions and backend, with one named owner role for conventions, roles, grants and review of the function API catalogue diff.
  - Compose a cross-domain business operation inside the database by published functions (ALLOCATION.RULES.5), never by direct access to another domain's tables.
  - Give a cross-schema business function to the team that owns the workflow, reviewed by the owner role.
  - Cut module and schema boundaries with the team boundaries.
- op: node.set
  uid: ALLOCATION.ACT.3
  constraints:
  - 'Authority: backend (what is deferred) and database (staged intent, data schedules)'
  - 'Copies: the status resource shows the pending state'
  - 'Forbidden: deferring core writes; foreign effects inside the request, except ACT.2''s in-request phase'
  - 'Foreign mutations are deferred as ACT.2 places them: in a worker behind 202, except ACT.2''s in-request phase.'
  - An operation that outlasts the request answers 202 with a status resource.
  - Every asynchronous stream states its staleness window and a convergence check.
  - In-process background tasks only for small tasks that may be lost.
- op: node.set
  uid: LOGIC.SECURE
  epistemic_state: 'known | unvalidated: MFA required by default (max applied to L033) | undecided: awaiting maintainer, read visibility of rows with per-user rules when several backends share the database (see ALLOCATION.GUARD.3)'
  constraints:
  - 'Authenticate every caller, then authorize every request. Humans by the server-held session of GUARD.4; agents by their own short-lived, revocable tokens, accepted only when issued for this server (audience check), never forwarded downstream (L640, GUARD.4). An ID token proves a login to the client and is never accepted as an API credential (L021). Authorization is a separate, central mechanism, deny by default, object level, applied to every request from every client (L020, L305, L306), for what the backend owns: product policy not stored in the data and identity (GUARD.3).'
  - Assert the actor, do not decide for the database. For every call into the function API the backend sets the acting user it has verified (scoped to the transaction, from the verified identity, never a client-supplied id; GUARD.3); per-user write rules decidable from the row are decided by the writer function, and the backend's identical check is a generated or tested copy for early feedback (GUARD.3, RULES.1).
  - 'Treat all input as untrusted and parse it at entry into the most precise type, once per process boundary (GUARD.1; L484, L612): request bodies, query parameters, headers, uploaded files (P2, L023), payloads read back from queues, and anything a model or agent produced (L644). Client hints, tool annotations and claimed identities are never enforcement (L650).'
  - 'Bound consumption at two depths (P3, P4): identity-blind size, rate, read-rate and time limits at the outermost layer, answering 413 or 408 there, with the client''s own size check as a feedback copy (L032); identity-aware limits in the backend, per operation and per business need, with tighter limits on operations that cost money, trigger third parties or are expensive for agents to loop on (L031).'
  - 'Protect harmful automation by flow, not by client kind (P6): name the flows whose automation harms the business (sign-up, purchase, booking, referral) and protect each specifically (L034); no blanket bot blocking, because agents are intended users in this context (L652).'
  - 'Defend logins in layers (P5): MFA first, then breached-password checks, then device signals and challenges known to be spoofable; never IP blocking alone (L033). Max applied: MFA is required by default on human accounts (inferred: L033 orders MFA first; requiring it is the most demanding form).'
  - 'Per-user read visibility is undecided: awaiting maintainer, read visibility of rows with per-user rules when several backends share the database; the recorded default, the fallback and the consequence for roles that may read the base tables are those of ALLOCATION.GUARD.3.'
  - Server-side fetches of client- or agent-named URLs cannot reach private, loopback or link-local addresses.
  design_notes: 'Decision: the backend is the one gate every caller passes, human or agent, and decides nothing on the caller''s word.

    Positions:

    - P1 authentication is not authorization; an OpenID Connect ID token is for the client, never an access credential to APIs (L021).

    - P2 every client-supplied part of an upload is untrusted: allowlisted extensions, actual signature checked, stored name generated by the server (L023).

    - P3 bound every resource a client can make the server consume (rate, payload size, memory, concurrency, time, third-party spend), each limit tuned to the operation and the business need; agents as principals make loops and retries likelier, so expensive operations get their own limits (L031).

    - P4 maximum body size, minimum read rate and read timeouts enforced at the outermost layer with 413 or 408, plus a size check in the client because browsers show the proxy''s error poorly (L032).

    - P5 credential stuffing defended in layers: MFA first, breached-password checks, device fingerprinting and CAPTCHA understood as spoofable, never IP blocking alone (L033).

    - P6 identify the business flows whose automation harms the business and protect those specifically, machine-to-machine APIs included (L034); cited, owned by INTERACTION.AGENT: do not apply blanket bot blocking where agents are intended users (L652).

    - Placement rows cited, owned elsewhere: deny by default (L020); one central mechanism on every request (L305); object-level rules (L306); model output is untrusted input, never an authorization decision (L644); client hints are not enforcement (L650); a server accepts only tokens issued for it and never forwards a client''s token (L640); parse once at each entry (L484, L612).

    Forces: security (all positions); availability and cost control (P3, P4); usability of login (P5''s MFA) and openness to agents (P6 against blanket blocking).

    Rejected:

    - Accepting ID tokens, forwarded tokens or client-declared identity as API credentials: never (L021, L640, L650).

    - Validation or authorization decided in the browser, the agent client or model output: never (GUARD.1, GUARD.3; L019, L644).

    - IP blocking as the only login defence, and IP alone as the limiting key: never (L033).

    - Blanket bot blocking: acceptable when no automated client is an intended user of the interface concerned (inverse of L652''s condition; inferred).

    - MFA optional for human accounts: acceptable when the application''s audience cannot practically be required to use a second factor; the other layers of L033 then carry the defence (condition inferred, not in the ledger row).

    - Limits only at the edge, or only in the application: each misses what the other sees (identity-blind volume against per-identity and per-operation cost; L031, L032; layering inferred, its stack form owned by PIG-WEB-LOGIC.SECURE.6).

    Realizes: GUARD.1 (the backend''s parsing and request-level meaning); GUARD.3 (product policy and identity; tested copy of per-user write rules; actor asserted, not decided); GUARD.4 (sessions and credentials held by the backend).

    Maintainer decision cited: MD-01 (row-level security is not a default; stays excluded here).

    Inherited open clause (X1): per-user read visibility, the maintainer''s question Q1 of the allocation judge, is not re-asked here; the recorded default and J1''s fallback are in the constraints and the state.

    Evidence gap: MFA required by default applies the max rule to L033 (inferred); the condition for ''optional'' is inferred, not in the ledger row.


    Lifted from the stack-neutral clause of PIG-WEB-LOGIC.SECURE.7 in pig-web-defaults, wording kept; the verdict is that record''s, not re-judged here. Clause: server-side fetches cannot reach internal addresses.'
