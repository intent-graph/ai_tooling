- op: node.set
  uid: ALLOCATION.GUARD.3
  constraints:
  - 'Authority: writer function for per-user write rules decidable from the row and the actor; backend for product policy not stored in the data and for identity; database per consumer role'
  - 'Copies: the backend''s check of per-user write rules (generated or tested, early feedback); the browser hides controls the user may not use (cosmetic)'
  - 'Forbidden: browser, agent client, model output, client hints; row security by default (MD-01); any consumer role owning tables or bypassing grants; a write without an actor, or with an actor its role may not assert'
  - Per-user write rules decidable from the stored row and the acting user are decided by the column's writer function; a backend's identical check is a generated or tested copy for early feedback.
  - 'Each backend decides product policy not stored in the data (product roles, plan limits, feature flags, workflow steps) and identity: one central mechanism, deny by default, object level, on every request from every client.'
  - Each consumer has its own role, neither owner nor all-powerful; grants say which API functions it may call and which tables and columns it may read; state columns are revoked from direct update so the writer function is the only path.
  - Functions read the acting user from a value scoped to the transaction, taken from the verified identity, refuse a write without an actor, check that the session role may assert that kind of actor (a backend an end user, an operator or owner role only itself), and record both the session role and the claimed actor.
  - No row-level security by default; acceptable only when the data model is simple, the scoping key leads the composite primary key of every table the policy covers, and no all-powerful administrator role must read or write across scopes.
  - Roles that may read the base tables (reporting, operator) see every row, comments included, unless their own role is restricted.
  - 'Recorded default for the open clause: each backend filters per-user reads from one shared written specification with a shared denial-test suite; fallback: database read functions that receive the verified actor, acceptable when a per-user read rule must hold for two or more backends.'
- op: node.set
  uid: ALLOCATION.GUARD.4
  constraints:
  - 'Authority: backend (session store in the database under the backing-roles default)'
  - 'Copies: the browser''s opaque cookie; an agent''s own bearer token'
  - 'Forbidden: tokens in storage readable by page script; any session token, bearer token or long-lived credential in a URL, the one exception being short-lived, single-purpose, scope-limited signed URLs for file delivery, with lifetime and scope stated (X6); session state in process memory; stateless, non-revocable sessions; end users as database roles'
  - 'Default (first-party, same-site browser): an opaque server-side session, revoked on logout, stored in a backing service, never in process memory.'
  - 'Login through an external identity provider: a backend-for-frontend holds the tokens.'
  - 'Agents and other non-browser clients: bearer tokens per delegation, short-lived, with server-held state that can revoke them.'
  - The cookie carries an identifier, never application state.
  - An end user reaches the database only as the actor a backend asserts for the transaction from its verified identity, never from a client-supplied id.
- op: node.set
  uid: ALLOCATION.RECORD.2
  constraints:
  - 'Authority: database function API, owned by the database owner'
  - 'Copies: replica or reporting copy for BI'
  - 'Forbidden: direct writes by consumers to tables with state columns or multi-table effects; database connections from browsers or agents; views as contract'
  - Every consumer has its own role.
  - Backends, consoles and scripts write through API functions; at most read access on base tables for simple reads.
  - 'One direct-write exception: a single-table write grant for a table that only one consumer writes and that has no state column or multi-table effect.'
  - Reporting reads through a read-only role with table and column grants, on a replica or reporting copy when its load matters.
  - Evolution is additive; breaking changes are coordinated with every consumer; 'deployed together' holds only when every consumer of the changed object ships in the same deployment as the migration, otherwise expand, migrate, contract.
  - A consumer outside the owning team gets the function API as a published contract.
- op: node.set
  uid: LOGIC.EXPOSE
  intent: 'Each backend offers one HTTP interface over its one core: server-rendered HTML whose links and forms are the contract for browsers, and a resource-oriented structured-data interface plus an agent adapter on the same use cases for programs and agents. Every interface description consumers read is kept in sync with the implementation by process, and repeated requests are safe.'
  constraints:
  - Browsers get server-rendered HTML whose links and forms are the contract (PRESENT.1, LOGIC.EXPOSE.3).
  - 'Programs and agents get a resource-oriented structured-data interface on the same use cases, described machine-readably and kept in sync with the implementation by process: one origin per fact, the other side generated or conformance-checked, a CI gate that fails on drift; the origin direction is recorded per project (MD-02, L634). An agent protocol adapter, where offered, sits on the same core (L633, L635).'
  - 'MD-02 covers every interface description consumers read (X7): "always in sync by process" and the compatibility window apply to the HTTP description, to the database function API catalogue and to the agent tool surface.'
  - Every endpoint uses HTTP's defined meanings (LOGIC.EXPOSE.1), and every request is self-contained (LOGIC.EXPOSE.2).
  - 'Repeated requests are safe: safe methods change nothing, PUT and DELETE are idempotent, non-idempotent mutations offered to agents carry an idempotency key that the database function records with the effect (GUARD.6, L051).'
  examples:
  - An MCP server's tool list and schemas are an agent tool surface description.
- op: node.set
  uid: LOGIC.EXPOSE.2
  constraints:
  - 'It carries its credential (the opaque session identifier or the agent''s token, in a cookie or a header, never in the URL; X6: short-lived, single-purpose, scope-limited signed URLs for file delivery are the one exception, with their lifetime and scope stated) and every parameter its use case needs; anything it references is resolved from backing services, never from the memory of the instance that served the previous request (L054, L086).'
  - The server-held state is limited to identity and security state (the session, revocable; GUARD.4). Workflow progress is resource state in the database (state columns, ACT.1), addressed by identifiers in the request, never hidden in a session or a connection (L661; inferred from L318's narrow sense and ACT.1).
  - Client and server are coupled only through the interface contract (HTML links and forms, or the described structured-data interface), so either can change behind it (L055).
- op: node.set
  uid: LOGIC.EXPOSE.3
  constraints:
  - 'Browser: the HTML the server renders is the contract: links and forms drive every transition, and the server renders only the controls the user may use. The control is a cosmetic copy; the request is re-authorized on arrival (GUARD.3, RULES.1). This is P1 in full, and it follows from PRESENT.1 (L059, L629).'
  - 'Programs and agents: a resource-oriented structured-data interface called what it is, resource-oriented HTTP, not REST (L060), whose contract is the machine-readable description kept in sync by process (MD-02, L634); the same rule holds for the agent tool surface''s description (X7). Server-issued links are used where the server mints the next step: continuation links for paging (L266), the created resource''s location, explicit handles for cross-call state (L661). Clients do not build URLs the description does not define.'
  - 'Grounds: MD-02 makes an always-synchronised description the contract programs and agents read; it buys the independent evolution P1 seeks by additive change and conformance checks, at lower cost per client (inferred). P3''s trade is accepted where it pays: browser pages.'
  design_notes: 'Decision: hypermedia where the client is a browser; a described, level-2 resource interface where the client is a program or an agent.

    Positions:

    - P1 server-provided representations drive client transitions; no fixed, out-of-band URL hierarchies; documentation-driven clients are the most frequent violation (L059; Fielding; contested).

    - P2 a JSON API without hypermedia controls is resource-oriented HTTP (Richardson level 2), not REST (L060; definition agreed).

    - P3 the uniform interface trades efficiency for visibility and independent evolution (L061).

    - Common API practice: documented fixed URLs and an out-of-band description (L059''s positions column; L634 OpenAPI for humans, generators and agents).

    - Cited: server-rendered HTML by default (PRESENT.1; L252, L629); in a hypermedia design the HTML is the contract and an OpenAPI file covers only the JSON endpoints that exist (L257, owned by PIG-WEB-LOGIC.EXPOSE.1); the description is always in sync (MD-02).

    Forces: changeability (independent evolution of clients over a long horizon, P1, P3); efficiency and tooling for program and agent clients (common practice); enforcement (the server decides which transitions to offer).

    Rejected:

    - Full hypermedia controls in the JSON interface (links and forms in every representation): not the default; acceptable when independently developed clients must keep working over a long horizon without a shared, synchronised description (L059, L061; condition inferred).

    - A client-rendered browser application driven by an out-of-band JSON description: not the default; acceptable under PRESENT.1''s conditions (many interdependent UI parts, offline, high-frequency or real-time state; L253).

    - Calling a level-2 JSON interface REST: rejected on definition (L060).

    Realizes: no direct link in the skeleton; follows PRESENT.1 (server-rendered HTML) and RECORD.3 with MD-02 (contract origin per project, always in sync).

    Maintainer decision cited: MD-02.

    Evidence gap: no ledger row on hypermedia controls for agent clients; the JSON half rests on MD-02 and L634 (inferred).

    No direct skeleton link; follows PRESENT.1 (server-rendered HTML) and RECORD.3 with MD-02.

    Candidate under the gap: (review m9; no change to the decision): server-computed allowed actions for agents, the agent analogue of the browser''s rendered controls, which ACT.1 already admits as a permitted copy (the server previews what the caller may do; the request is still re-authorized on arrival). Handed to INTERACTION.AGENT''s judge with L661 (explicit server-minted handles) as the nearest evidence.


    Paging continuation links are owned by pig-web-defaults (L266).'
- op: node.set
  uid: INTERACTION.ENVIRONMENT.3
  constraints:
  - Every client-server contract has an explicit compatibility window, at least as long as an old page can stay open (L009).
  - Within the window, changes are additive and readers ignore what they do not know; nothing in use is removed (L056, L057).
  - Before removing or changing a behaviour, its current use is found, per consumer role (L058).
  - 'Every surface used by code the team does not redeploy at once is a contract under this window: structured-data endpoints, HTML form fields and URLs posted by old pages, the agent tools and their schemas.'
  - 'Every interface description consumers read is always in sync with the implementation by process (MD-02, extended to every agent-facing interface): the HTTP description, the database function API catalogue and the agent tool surface; the compatibility window applies to each.'
  - 'A breaking change goes expand, migrate, contract: the new shape is added beside the old, each consumer moves, the old one is removed once no consumer uses it (L047); no client is silently broken.'
  - Lockstep deployment ("deployed together") is acceptable only when every consumer of the changed object ships in the same deployment; a browser tab never does.
- op: node.set
  uid: TRANSVERSE.CONTRACTS
  epistemic_state: 'known | conflict: L517 (MAINT) "deployed together", narrowed to the same-deployment condition, otherwise expand, migrate, contract (L047) | unvalidated: usage known per consumer role'
  design_notes: "SCOPE:\nwhat every contract shares. The contracts of the default context are the database function API (offered to several backends, consoles and scripts; RECORD.2, realized under PIG-WEB-DATA.INTERFACE), the grants and meaning of tables BI reads, and the backend's HTTP interface (to its browser code, which runs at an older version for days, L009, and to agents; LOGIC.EXPOSE).\n\nPOSITIONS:\n  - P1 an explicit artifact stating structure and meaning (names, types, nullability, units, invariants, owner, version), readable without the producer's code (L483; L562 and L565 at stack level).\n  - P2 evolve by compatible additions; versioning is the exception (L056); readers tolerant, writers conservative (L057); before changing or removing a behaviour, find how it is used (L058).\n  - P3 the provider contract is singular and authoritative; consumer contracts are partial and plural, and the one that matters for change is the union of what consumers use; consumer-driven contracts fit a closed community (L487).\n  - P4 a breaking change is coordinated with every consuming team and deployed together, with no formal version numbers (L517, MAINT, for the function API).\n  - P5 a breaking change goes expand (support old and new), migrate (move every client), contract (remove the old), so each phase can be released, verified and rolled back (L047, owned by DATA.MAINTAIN, grounded); for HTTP, removal is announced with machine-readable signals and a support window (L275, L277).\n\nFORCES:\nP1 serves correctness across tiers and readers outside the producer, at the cost of writing meaning down. P2 serves independent upgrade of components at different times (L056); its cost is carrying old shapes for a while. P3 serves conceptual integrity; consumer-driven tests make hidden coupling explicit at the cost of a shared channel between teams (L487). P4 serves simplicity (one shape at any time, no version bookkeeping); it costs a window of breakage, since no deployment across separate deployables is atomic (L009). P5 serves the same independence as P2 for the unavoidable break; it costs a period with two shapes.\n\nDECISION:\nP1, P2, P3 and P5; P4's coordination kept, its \"deployed together\" replaced.\n  - Every contract is an explicit artifact with structure and meaning, readable without the producer's code (L483). Its origin is the one RECORD.3 names: the database schema for stored facts and for the function API (documentation generated from the live database, L474); the project's recorded origin for interface-only facts, kept always in sync by a CI gate that fails on drift (MD-02).\n  - \"Always in sync by process\" and the compatibility window apply to every interface description consumers read: the HTTP description, the database function API catalogue, and the agent tool surface (for example an MCP server's tool list and schemas) (MD-02, X7).\n  - The provider's contract is authoritative (L487): the database owner's for the function API (L515), the backend's for HTTP.\n  - Changes are additive by default (L056); readers are tolerant (L057). Before a change or removal, usage is known, not assumed (L058). Under MD-03 every database consumer has its own role, so usage can be read per consumer: from its grants, and from the session role that audit records on every write (ACT.4). Inferred; how reads are counted per role is open.\n  - A breaking change to any contract goes expand, migrate, contract (L047). For the function API: the new function or signature is added beside the old, each consumer moves, and the old one is removed once no consumer role calls it. The new name is the expand step, and it carries the change, so no formal version number is needed: \"no formal version numbers\" is L517's rule, the new name is the expand phase (L047) and the route the maintainer's own L512 takes for stored contract schemas (new named version, old one soft-deleted, consumers migrate gradually). The coordination with every consumer that L517 demands is kept.\n  - \"Deployed together\" (L517) stays acceptable only when every consumer of the changed object ships in the same deployment as the migration; otherwise a breaking change goes expand, migrate, contract (X2).\n  - Grounds for expand, migrate, contract as the default: the database, several backends, BI reports and scripts deploy separately (MD-03), and backends roll out instance by instance. A browser tab keeps old code for days (L009, L278). There is usually a window in which old and new meet.\n  - Counting: this is the L517 narrowing, realized here and counted once at its owner, PIG-WEB-DATA.INTERFACE.1 (J6). It is narrower than \"against the doctrine\" suggests, since L512 already takes this route for stored contract schemas.\n  - Consumer-driven contract tests where consumers are separate teams in a closed community (L487); for the single team's own browser client, whether they add value beyond schema checks stays with the stack judge (L560, contested, PIG-WEB-TRANSVERSE.CONTRACTS.1).\n\nREJECTED:\n  - P4 lockstep (\"deployed together\") for a breaking change: acceptable only when every consumer of the changed object ships in the same deployment as the migration (X2). This is never the case for HTTP contracts with browser clients, whose open tabs are consumers that do not ship with the deployment (L009), or for contracts BI reports or scripts read.\n  - Versioning as the routine way to change (version per release): versioning is the exception (L056); when a break is unavoidable, the version sits in one agreed place (L276, stack level).\n  - Removing behaviour on the assumption that nobody uses it: never (L058).\n  - Consumer-driven contracts as the authority: they are partial views (L487); acceptable as tests, never as the origin.\n\nPLACEMENTS REALIZED:\nrequires RECORD.3 (skeleton link); required by INTERACTION.ENVIRONMENT.3 (version skew). Rests on RECORD.2 (function API as the default contract, MD-03) and MD-02. J1's RECORD.3 gate lets a function-API break through when it is marked as coordinated; this record fills in what that mark requires (the expand, migrate, contract sequence, or the lockstep condition above). No placement is changed.\n\nREVIEW FIXES:\nM1 and X2 (one lockstep condition, word for word; the departure cited here and counted once at its owner; the new name credited to the expand step and L512, not to L517; L512 noted as already taking this route); X7 (sync and compatibility window extended to every interface description, the agent tool surface included).\n\nThe L517 departure is counted once, at PIG-WEB-DATA.INTERFACE.1 in pig-web-defaults, for both graphs."
  constraints:
  - Make every contract an explicit artifact stating structure and meaning (names, types, nullability, units, invariants, owner, version), readable without the producer's code.
  - Keep every interface description consumers read always in sync with the implementation by process and a CI gate that fails on drift; this covers the HTTP description, the function API catalogue and the agent tool surface.
  - Treat the provider's contract as authoritative; consumer-driven contracts are tests, never the origin.
  - Change contracts by compatible additions by default, with tolerant readers and conservative writers; versioning is the exception.
  - Know how a behaviour is used before changing or removing it; never remove on the assumption that nobody uses it.
  - Take a breaking change through expand, migrate, contract, coordinated with every consumer, unless every consumer of the changed object ships in the same deployment as the migration.
- op: node.set
  uid: ALLOCATION.RECORD.1
  constraints:
  - 'Authority: database'
  - 'Copies: browser server-state cache (versioned, for latency), HTTP caches, cache tables, search index, reporting copy, browser drafts of unsent input'
  - 'Forbidden: any copy acting as authority; dual writes from any consumer'
- op: node.set
  uid: ALLOCATION.GUARD.2
  constraints:
  - 'Authority: database'
  - 'Copies: generated or tested backend validators and types, browser feedback'
  - 'Forbidden: application-only enforcement of any rule that must hold for every writer; a procedural check under Read Committed without a lock'
  - Declarative constraints (NOT NULL, CHECK, UNIQUE, foreign keys, domains) are required for every rule they can express; CHECK constraints are not optional.
  - Cross-row rules use a partial unique index or an exclusion constraint first.
  - Other multi-row rules (including legal state transitions) run in a constraint trigger or the writer function under serializable isolation with retry, or after locking the governing row; the trigger asserts the isolation level it needs.
  - Read Committed alone admits violations and Repeatable Read admits write skew; never a procedural check under Read Committed without a lock.
  - Set the default isolation per consumer role; writer functions assert their isolation level; reports on a replica accept snapshot anomalies.
  - Backend and browser validators are generated from or tested against the constraints; named constraints map violations to stable errors.
- op: node.set
  uid: ALLOCATION.GUARD.5
  constraints:
  - 'Authority: database (detection in the writer function), with the backend carrying the version through its contract'
  - 'Copies: the browser holds the version it read'
  - 'Forbidden: browser or agent resolving conflicts; locks across requests'
  - Detect with constraints, isolation, row locks and version checks inside one short transaction in the writer function; isolation level per GUARD.2.
  - 'Discrete fields edited by users: optimistic version; a stale write is rejected (412), and the condition is required (428) where a lost update matters; the writer function takes the expected version as a parameter.'
  - 'Toggles, status, assignment, ordering: per-property last-writer-wins is acceptable.'
  - 'Frequent conflicts with costly lost work: a lease with owner and expiry, checked by the writer function.'
  - 'Long collaborative text: a text engine with the server as central authority.'
  - Never silent whole-record last-writer-wins; never check-then-write without serializable isolation or a lock.
- op: node.set
  uid: ALLOCATION.ACT.2
  constraints:
  - 'Authority: backend (delivery, external calls), database (the staged intent, written by the operation)'
  - 'Copies: none'
  - 'Forbidden: third-party credentials in the browser (inferred, L624); calls to external systems from inside the database; dual writes to the database and a broker; remote calls inside an open transaction; a foreign call in the request without its intent recorded first; post-commit hooks for foreign effects'
  - Write the intent in the operation's transaction; deliver after commit, idempotently.
  - Foreign mutations (a payment, a remote API write) run as atomic phases with recovery points and an idempotency key, in a worker behind a 202 response with a status resource.
  - 'In the request only when the user must see the outcome within about 1 s: the database function records the intent first and commits; the request performs the call as one atomic phase and marks the row done; a worker completer picks up the row if the request dies.'
  - Post-commit hooks only for losable work that touches no foreign system.
- op: node.set
  uid: ALLOCATION.ACT.4
  constraints:
  - 'Authority: database (history, transitions logged by writer functions); backend supplies actor and business events; a separate log sink holds security events'
  - 'Copies: none'
  - 'Forbidden: application-only audit; audit only in a model transcript; an actor taken from a client-supplied id; a write without an actor; an actor the session role may not assert'
  - History is written by triggers into append-only history tables in the same transaction as the change; writer functions log each transition.
  - Record both the session role and the claimed actor; refuse a write with no actor; check that the session role may assert that kind of actor (a backend an end user; operator and owner roles only themselves, with the ticket id for owner-run jobs).
  - Agent actions record acting identity, delegating subject, operation, correlation id and outcome, on the server; agent-originated writes are marked in the data.
  - Keep the security event log as a separate record with its own store, integrity and retention.
- op: node.set
  uid: ALLOCATION.DERIVE.1
  constraints:
  - 'Authority: database'
  - 'Copies: derived columns and tables with a stated staleness'
  - 'Forbidden: consumers writing derived stores beside the source'
  - 'Order of options: compute on read, then same-transaction maintenance in the database, then cache tables with a stated staleness.'
- op: node.set
  uid: ALLOCATION.DERIVE.2
  constraints:
  - 'Authority: database, including collation'
  - 'Copies: the browser over rows already loaded, same collation'
  - 'Forbidden: loading full sets into a backend or browser to reduce them; queries in loops; a browser re-sort with another collation'
  - Filter, sort, aggregate and page in the database.
  - Enforce a maximum page size; page by keyset behind an opaque continuation.
  - The database owns the collation of every order it serves; a browser re-sort over rows already loaded uses the same collation or none.
  - Reads that need no domain behaviour may be plain queries.
- op: node.set
  uid: ALLOCATION.DERIVE.3
  constraints:
  - 'Authority: none: the source is the authority'
  - 'Copies: database tables, a shared backend store, HTTP intermediaries, the browser'
  - 'Forbidden: process memory beyond one request; personalised responses in shared caches'
  - Every cache states its staleness bound and an expiry or invalidation plan.
  - Derived-data caches are database tables, invalidated in the source transaction.
  - 'Label every HTTP response on purpose: HTML no-cache with validators, fingerprinted assets immutable, personalised responses private or no-store, lifetimes set by tolerable staleness.'
  - Response and fragment caches shared by processes live in the database by default; a cache service only on measured need.
  - Never use a cache as permanent storage.
- op: node.set
  uid: ALLOCATION.PRESENT.1
  constraints:
  - 'Authority: backend (HTML and navigation logic)'
  - 'Copies: browser view state and islands'' client state'
  - 'Forbidden: business rules in browser code'
  - Pages work as HTML and are enhanced; a client-rendered island needs the island criteria.
  - Agents use their own adapter over the same core (RULES.4).
- op: node.set
  uid: ALLOCATION.PRESENT.2
  constraints:
  - 'Authority: the rendering tier (formatting), database (canonical values)'
  - 'Copies: none'
  - 'Forbidden: formatted or local-time values stored as data'
  - Store canonical values only.
  - Format in the rendering tier, with the reader's locale and time zone.
  - Internationalisation stays deferred.
- op: node.set
  uid: ALLOCATION.PRESENT.3
  constraints:
  - 'Authority: by kind: browser, URL, database, channel'
  - 'Copies: the browser''s server-state cache'
  - 'Forbidden: presence in database tables; durable state held only in the browser'
  - Ephemeral view state in the browser; form state in the browser until submitted; shareable view state in the URL.
  - Durable or shared state in the database; server state held in the browser is a cache.
  - Presence is broadcast through a channel with a timeout.
- op: node.set
  uid: INTERACTION
  constraints:
  - The interaction tier decides nothing durable; every decision reaches a backend (RULES.3).
  - Agents are users through an adapter on the same core, never a second implementation of the rules.
- op: node.set
  uid: INTERACTION.VISUALIZE
  intent: 'Accessibility is a project requirement from the first design: a conformance target is stated before building and judged per full page, and the interface starts from native HTML semantics and keyboard operation, with users with disabilities taking part in early testing. Retrofitting accessibility at the end costs more and leaves parts that never conform; formatting for the reader''s locale and time zone is placed by ALLOCATION.PRESENT.2.'
  constraints:
  - Accessibility is a requirement from the first design; a conformance target is stated before building (L005, L300).
  - Conformance is judged per full page, embedded third-party content included (L300).
  - Start from native HTML semantics and keyboard operation; ARIA only where native elements cannot express the control (L301).
  - Formatting for the reader's locale and time zone follows ALLOCATION.PRESENT.2.
  - Users with disabilities take part in early testing, not only at acceptance (L005).
- op: node.set
  uid: ALLOCATION.FORCES.5
  constraints:
  - Do not place logic off the database pre-emptively.
  - Move a placement for scalability only on measured write or connection load near the primary's limit.
- op: node.set
  uid: TRANSVERSE
  constraints:
  - State each property that spans every tier once here and design it in across browser, backend, database and every other database consumer, not per tier.
  - Turn each cross-tier property into an automated check where one exists (interface drift gate, function-API catalogue diff, page budgets, module-boundary checks, tests at every tier).
  - Leave stack choices to the stack graph; tier branches realize these properties and do not restate them.
- op: node.set
  uid: DATA.ORGANIZE
  constraints:
  - 'Every table passes third normal form: every non-key field states a fact about the key, the whole key and nothing but the key.'
  - Boyce-Codd, fourth and fifth normal form are applied where they apply. Stopping at third normal form is acceptable only when every candidate key is a single column, and there are no multi-valued facts.
  - Where a Boyce-Codd decomposition loses a dependency, the lost dependency is enforced by a constraint trigger under DATA.GUARD's rule (Serializable isolation or a lock).
  - 'Denormalization is not an organizing choice: a denormalized value is a derived copy governed by DATA.DERIVE and exists only with a sync plan recorded before it is built (what and why, sync level, freshness, change frequency, impact of divergence, drift detection and reconciliation, alerting; recorded in the table comment).'
  - 'A new one-to-one attribute is a nullable column by default; a separate table only for, in this order: cardinality likely to change, a different permission boundary, an independent audit or lifecycle, blast radius on heavily used tables. Sparsity and NULL count are never reasons to split.'
  - A column is nullable only when absence is a meaningful state of the fact; where several nullable columns must be present together, a CHECK states it.
  - Collation is a declared property of the stored text, not of a consumer.
- op: node.set
  uid: TRANSVERSE.SECURITY
  constraints:
  - Serve every page and every API over encrypted transport with strict transport enforcement and no mixed content; the same property covers database connections of every consumer role.
  - Collect only the data the user's goal needs; never log secrets, session ids, tokens, keys, payment data, connection strings or unneeded personal data, trace headers included.
  - Give every threat category an owning tier that the requester cannot modify, named through the allocation placements.
  - Answer insecure design with a threat model per placement and per critical flow (authentication, access control, business operations, agent access) and misuse-case tests per tier.
  - Assign software and data integrity failures to the delivery pipeline and the parsing tier for untrusted serialized input; declarative constraints are not that control.
  - State each property as a verifiable requirement with a traceable id, at a level chosen by risk; the threat list is an awareness map, never the requirement set.
  - Never claim a stronger read-visibility guarantee than the recorded default gives while the maintainer question is open.
- op: node.set
  uid: TRANSVERSE.PERFORMANCE
  constraints:
  - Judge user-perceived performance on field data at the 75th percentile, segmented by device class; never use averages.
  - Enforce lab budgets in the build as a gate, and never let them override field data.
  - Optimise only after measurement has named the critical path.
  - Join field page metrics through the correlation id to server timing and database time per request.
- op: node.set
  uid: TRANSVERSE.OPERABILITY
  constraints:
  - Observe, test and deliver the system as one whole across every tier.
  - Carry one correlation id from the browser to the database transaction.
  - Keep the security event log apart from the business audit trail.
  - Promote one immutable build everywhere with database changes in the same pipeline.
- op: node.set
  uid: TRANSVERSE.EVOLUTION
  constraints:
  - Name, choose from required properties, and record the costly decisions.
  - Grow in small tested increments with fit checked automatically.
  - Never split a backend into services without a measured need.
  - Adopt a new technology only past a measured limit of an existing one.
  - Cut teams by capability, with a cross-schema business function owned by the team that owns the workflow.
- op: node.set
  uid: TRANSVERSE.OPERABILITY.1
  constraints:
  - Carry one correlation id per user interaction from the browser through the backend into the database transaction, stamped on every log record, span, client event and audit row.
  - Give database consumers outside the request path their identity and ticket id in the session.
  - Record validation failures, authentication successes and failures, authorization failures, session failures, application errors and use of higher-risk functions in a security event log with its own store, integrity and retention.
  - Treat changes to privileges, roles, credentials, grants and the role-to-actor pairing as security events; never put business data changes in the security log.
  - Record a retention decision per record type, set by legal, regulatory and contractual obligations, no shorter and no longer.
  - Never log or place in trace context anything secret or unneeded and personal.
- op: node.set
  uid: TRANSVERSE.OPERABILITY.2
  constraints:
  - Test at the lowest level that can catch the failure, and add the low-level test when a high-level test finds a bug; ratios are not prescribed.
  - Test logic placed in the database on a real engine of the production kind; never mock the database or use another engine for it.
  - Isolate each data test, by a rolled-back transaction by default; tests that mutate shared data run in a boundary that never commits.
  - Test behaviour that only shows at commit or between sessions with concurrent committing sessions in a disposable database, never a shared one.
  - Give every invariant enforced procedurally (serializable with retry, or a lock) a concurrent test, part of the default suite.
  - 'Test authorization by denial: each role and actor is refused what it may not do.'
  - Keep end-to-end tests few, on critical journeys.
- op: node.set
  uid: TRANSVERSE.OPERABILITY.3
  constraints:
  - Keep one codebase per application in version control with many deploys.
  - Separate build, release and run; build once, assets included, and promote the same immutable artifact everywhere.
  - Keep configuration apart from code and secrets out of source.
  - Run every environment on the same database engine and version as production, with no adapters hiding differences.
  - Keep schema and function-API changes as versioned migrations in version control, run once per release before the new code starts and additive across the release window.
  - Release in small, frequent increments.
- op: node.set
  uid: TRANSVERSE.EVOLUTION.1
  constraints:
  - Identify the costly decisions early and record each with its forces, alternatives and the condition that would reverse it.
  - Decide each hard-to-reverse choice when enough is known, not up front for every one.
  - Record per-project decisions the same way, including the interface origin direction with its criteria and any adoption of row-level security with its conditions.
  - Test changes against the constraints the decision set, automatically where a check exists.
- op: node.set
  uid: TRANSVERSE.EVOLUTION.2
  constraints:
  - Keep internal quality from the start.
  - Never build capabilities for presumed future features; invest in tests, refactoring and continuous delivery.
  - Design capacity headroom for about 10x the current load and plan reaching about 100x as a rewrite of the part concerned, not anticipate it in code.
  - Make fit explicit as automated fitness functions, non-functional ones included.
  - Take debt only as prudent, deliberate and recorded.
  - Replace at seams, never by big-bang rewrite.
- op: node.set
  uid: TRANSVERSE.EVOLUTION.3
  constraints:
  - Make each backend one deployable, modular by business concept; never split it into services without a measured need.
  - Split off a further deployable only when a team needs independent releases, the boundary has proven stable and the distribution premium is budgeted.
  - Map bounded contexts to domain schemas in the shared database, each with its own functions and roles.
  - Give a new deployable access to data only through the function API with its own role; never write tables beside it or hold a second system of record.
- op: node.set
  uid: TRANSVERSE.EVOLUTION.4
  constraints:
  - Adopt few, mature technologies with known failure modes.
  - Let a new technology in only when an existing one's measured limit is reached and its perpetual operating cost is budgeted.
  - Count runtimes, stores, services and frameworks; the paradigm inside an adopted language is not limited by this rule.
- op: node.create
  uid: DATA.INTERFACE
  name: Offered Contract
  parent: DATA
  intent: 'The database offers every consumer one published contract: a function API owned by the database owner, one business operation per call in its own transaction, one role per consumer, evolving additively. Writes and state transitions go through it, simple reads may query base tables under grants, and browsers and agents never connect to the database.'
  constraints:
  - The function API is the contract to the data that every consumer calls; its placement is ALLOCATION.RECORD.2.
  - One business operation is one function call in its own transaction, and each state column is written only by its writer function (ALLOCATION.RULES.5, ALLOCATION.ACT.1).
  - The contract evolves additively, and its catalogue is an interface description kept in sync with the implementation by process (ALLOCATION.RECORD.3).
  epistemic_state: 'known: realization of ALLOCATION.RECORD.2 and the database share of ALLOCATION.ACT.1 under MD-03 | gap: owns no ledger row'
  design_notes: 'Realization node for the database function API. It owns no ledger row: the verdicts it realizes are ALLOCATION.RECORD.2 and the database share of ALLOCATION.ACT.1, judged at the allocation step under the shared-database default (MD-03). The DATA judge proposed it as DATA.INTERFACE, a realization of those verdicts; the target hierarchy places the database function API under DATA. Created on the critique''s recommendation so that DATA offers its contract as LOGIC.EXPOSE does for the backend. Refined by PIG-WEB-DATA.INTERFACE in pig-web-defaults.'
  impl_pointers:
  - build/distill/03_judge/J2_phil_data/records.md::DATA
