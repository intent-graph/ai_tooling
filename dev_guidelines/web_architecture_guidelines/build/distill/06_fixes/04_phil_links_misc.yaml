  shape:
    type: requires
- op: link.create
  src: LOGIC.EXPOSE.3
  dst: ALLOCATION.PRESENT.1
  intent: The browser half of the hypermedia contract is the rendering placement.
  shape:
    type: requires
- op: link.create
  src: TRANSVERSE.OPERABILITY.2
  dst: ALLOCATION.GUARD.2
  intent: Concurrency tests are required for every invariant enforced procedurally.
  shape:
    type: requires
- op: link.create
  src: TRANSVERSE.OPERABILITY.2
  dst: ALLOCATION.GUARD.3
  intent: Authorization is tested by denial, role by role.
  shape:
    type: requires
- op: link.create
  src: TRANSVERSE.SECURITY
  dst: ALLOCATION.GUARD.3
