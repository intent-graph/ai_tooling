operations:
- op: node.set
  uid: LOGIC.SECURE
  intent: 'The backend is the one gate every caller passes, human or agent, and decides nothing on the caller''s word: it authenticates every caller, authorizes every request deny by default, parses all input into precise types at entry, bounds consumption at two depths, and requires a second factor where the account or the operation warrants it. This holds because every client can be hostile or wrong, and an agent as a principal makes loops and retries likelier.'
  constraints:
  - 'Authenticate every caller, then authorize every request. Humans by the server-held session of GUARD.4; agents by their own short-lived, revocable tokens, accepted only when issued for this server (audience check), never forwarded downstream (GUARD.4). An ID token proves a login to the client and is never accepted as an API credential. Authorization is a separate, central mechanism, deny by default, object level, applied to every request from every client, for what the backend owns: product policy not stored in the data and identity (GUARD.3).'
  - Assert the actor, do not decide for the database. For every call into the function API the backend sets the acting user it has verified (scoped to the transaction, from the verified identity, never a client-supplied id; GUARD.3); per-user write rules decidable from the row are decided by the writer function, and the backend's identical check is a generated or tested copy for early feedback (GUARD.3, RULES.1).
  - 'Treat all input as untrusted and parse it at entry into the most precise type, once per process boundary (GUARD.1): request bodies, query parameters, headers, uploaded files, payloads read back from queues, and anything a model or agent produced. Client hints, tool annotations and claimed identities are never enforcement.'
  - 'Bound consumption at two depths: identity-blind size, rate, read-rate and time limits at the outermost layer, answering 413 or 408 there, with the client''s own size check as a feedback copy; identity-aware limits in the backend, per operation and per business need, with tighter limits on operations that cost money, trigger third parties or are expensive for agents to loop on.'
  - 'Protect harmful automation by flow, not by client kind: name the flows whose automation harms the business (sign-up, purchase, booking, referral) and protect each specifically; no blanket bot blocking, because agents are intended users in this context.'
  - 'Defend logins in layers: MFA first, then breached-password checks, then device signals and challenges known to be spoofable; never IP blocking alone. Offer MFA on every human account, phishing-resistant authenticators (passkeys, WebAuthn) preferred. Require it on privileged accounts (operator, owner, administrator) and before sensitive operations (step-up). Whether it is required on every account follows the security level the project chooses by risk (TRANSVERSE.SECURITY).'
  - 'Per-user read visibility (MD-05): simple reads that carry no logic are written by the backend directly; sensitive, complex, high-impact or shared reads, per-user visibility rules included, go through database functions that receive the verified actor (ALLOCATION.GUARD.3).'
  - Server-side fetches of client- or agent-named URLs cannot reach private, loopback or link-local addresses.
  epistemic_state: 'known: MD-05 | unvalidated: MFA scope by account privilege and by the project''s risk level (inferred from L033 and TRANSVERSE.SECURITY)'
  design_notes: 'Decision: the backend is the one gate every caller passes, human or agent, and decides nothing on the caller''s word.

    Positions:

    - P1 authentication is not authorization; an OpenID Connect ID token is for the client, never an access credential to APIs (L021).

    - P2 every client-supplied part of an upload is untrusted: allowlisted extensions, actual signature checked, stored name generated by the server (L023).

    - P3 bound every resource a client can make the server consume (rate, payload size, memory, concurrency, time, third-party spend), each limit tuned to the operation and the business need; agents as principals make loops and retries likelier, so expensive operations get their own limits (L031).

    - P4 maximum body size, minimum read rate and read timeouts enforced at the outermost layer with 413 or 408, plus a size check in the client because browsers show the proxy''s error poorly (L032).

    - P5 credential stuffing defended in layers: MFA first, breached-password checks, device fingerprinting and CAPTCHA understood as spoofable, never IP blocking alone (L033).

    - P6 identify the business flows whose automation harms the business and protect those specifically, machine-to-machine APIs included (L034); cited, owned by INTERACTION.AGENT: do not apply blanket bot blocking where agents are intended users (L652).

    - Placement rows cited, owned elsewhere: deny by default (L020); one central mechanism on every request (L305); object-level rules (L306); model output is untrusted input, never an authorization decision (L644); client hints are not enforcement (L650); a server accepts only tokens issued for it and never forwards a client''s token (L640); parse once at each entry (L484, L612).

    Forces: security (all positions); availability and cost control (P3, P4); usability of login (P5''s MFA) and openness to agents (P6 against blanket blocking).

    Rejected:

    - Accepting ID tokens, forwarded tokens or client-declared identity as API credentials: never (L021, L640, L650).

    - Validation or authorization decided in the browser, the agent client or model output: never (GUARD.1, GUARD.3; L019, L644).

    - IP blocking as the only login defence, and IP alone as the limiting key: never (L033).

    - Blanket bot blocking: acceptable when no automated client is an intended user of the interface concerned (inverse of L652''s condition; inferred).

    - (superseded by MD-09) MFA optional for human accounts: acceptable when the application''s audience cannot practically be required to use a second factor; the other layers of L033 then carry the defence (condition inferred, not in the ledger row).

    - Limits only at the edge, or only in the application: each misses what the other sees (identity-blind volume against per-identity and per-operation cost; L031, L032; layering inferred, its stack form owned by PIG-WEB-LOGIC.SECURE.6).

    Realizes: GUARD.1 (the backend''s parsing and request-level meaning); GUARD.3 (product policy and identity; tested copy of per-user write rules; actor asserted, not decided); GUARD.4 (sessions and credentials held by the backend).

    Maintainer decision cited: MD-01 (row-level security is not a default; stays excluded here).

    Inherited open clause (X1): per-user read visibility, the maintainer''s question Q1 of the allocation judge, is not re-asked here; the former recorded default (superseded) and J1''s fallback are in the constraints and the state.

    (superseded by MD-09) Evidence gap: MFA required by default applies the max rule to L033 (inferred); the condition for ''optional'' is inferred, not in the ledger row.


    Lifted from the stack-neutral clause of PIG-WEB-LOGIC.SECURE.7 in pig-web-defaults, wording kept; the verdict is that record''s, not re-judged here. Clause: server-side fetches cannot reach internal addresses.


    Corrected by MD-09 (re-audit under MD-08): MFA is offered on every human account and required on privileged accounts and at step-up; universal MFA follows the project''s risk level. Rejected: MFA required on every human account: acceptable when the project''s chosen risk level requires it (a high security level) or when the exposure of one account is severe. MFA optional on privileged accounts: never. The earlier ground (the most demanding form of L033''s ordering) is replaced by MD-08: the best practice for the purpose, not the strictest.'
- op: node.set
  uid: DATA.ORGANIZE
  constraints:
  - 'Every table passes third normal form: every non-key field states a fact about the key, the whole key and nothing but the key.'
  - Boyce-Codd, fourth and fifth normal form are applied where they apply. Stopping at third normal form is acceptable only when every candidate key is a single column, and there are no multi-valued facts.
  - 'Where a Boyce-Codd decomposition would lose a dependency, keep the dependency-preserving third-normal-form design and enforce every dependency declaratively: the repeated determinant is covered by a composite foreign key to the table that owns the pair, so it cannot diverge and needs no sync plan. A constraint trigger under DATA.GUARD''s rule (Serializable isolation or a lock) only where no declarative form exists.'
  - 'Denormalization is not an organizing choice: a denormalized value is a derived copy governed by DATA.DERIVE and exists only with a sync plan recorded before it is built (what and why, sync level, freshness, change frequency, impact of divergence, drift detection and reconciliation, alerting; recorded in the table comment).'
  - 'A new one-to-one attribute is a nullable column by default; a separate table only for, in this order: cardinality likely to change, a different permission boundary, an independent audit or lifecycle, blast radius on heavily used tables. Sparsity and NULL count are never reasons to split.'
  - A column is nullable only when absence is a meaningful state of the fact; where several nullable columns must be present together, a CHECK states it.
  - Collation is a declared property of the stored text, not of a consumer.
  epistemic_state: 'known | unvalidated: the Boyce-Codd claim, the declarative form for a lost dependency, the co-presence CHECK, and the MD-03 consequence are inferred | gap: collation choice has no row (handed to J6)'
  design_notes: 'Question: how facts are shaped so that each is stored once and changed in one place.

    Positions: P1 third normal form by default (L037; L469 maintainer doctrine). P2 third normal form as the practical ceiling, higher forms only in specific multi-valued or overlapping-key designs (L039, majority; one T3 source says higher forms are rarely considered, SRC-254 T2 describes fourth and fifth normal form without ranking and has no Boyce-Codd section). P3 denormalize where measured performance requires it, the application guarding the redundancy (L168, owned by the defaults graph''s derive node; under L469 only with a sync plan chosen before it is built). P4 a new one-to-one attribute is a nullable column by default, a separate table only for the listed reasons (L470 maintainer doctrine); the opposite position (split to avoid NULLs) is named by L470 itself and no ledger row argues for it.

    Forces: all positions serve integrity, the node''s purpose: no update anomaly or inconsistent dependency can arise (L038). P2 and P3 trade some of it for design effort and read performance (normalization spreads data over several records, L168). P4 trades a nullable column against a join on every read that needs the attribute.

    Decision: the rule is "each fact once" (L038); the normal forms are its tests. Third normal form for every table (L037, L469; doctrine and research agree). Higher forms where they apply (L039; the fourth and fifth normal form claim is grounded in SRC-254; the Boyce-Codd claim is inferred from standard theory).

    (superseded by MD-09) Changed after review (M4): the higher forms do not cost nothing. Where candidate keys overlap, a Boyce-Codd decomposition is not always dependency-preserving: a dependency one table''s key enforced in third normal form can come to span two tables and can no longer be enforced by a key (inferred from standard theory, not in the ledger). The cost is an integrity cost, a rule moving from a declarative key to a procedural cross-table check; enforcing it by constraint trigger keeps both "each fact once" and "every rule enforced", which is the max under the selection rule.

    Denormalization: a derived copy of a fact stored elsewhere, governed by DATA.DERIVE and ALLOCATION.DERIVE.1, with L469''s sync plan.

    One-to-one attributes: L470 adopted on authority and as the max choice; its split criteria are integrity and security reasons; sparsity is not one, because a split states no fact more precisely and adds a join on every read.

    Nullable columns state their meaning (L485; L040 cites the database vendor guidance that most columns are NOT NULL, SRC-134 T1); the co-presence CHECK is inferred from L485 and L174.

    MD-03: the schema is read directly by reporting and operator roles (RECORD.2 access paths); normalization keeps every consumer''s view of a fact identical without consumer-side reconciliation (inferred).

    Rejected: P2 as a ceiling, because stopping at third normal form where overlapping keys or independent multi-valued facts exist leaves the anomalies L038 exists to prevent; acceptable not to analyze beyond third normal form when every candidate key is a single column and there are no multi-valued facts (narrowed after review, M4: a single composite candidate key is not enough, as Kent''s own fifth-normal-form example, an all-key table of agents, companies and products, still needs fifth normal form; SRC-254). P3 as an organizing default: never; acceptable as a derived copy when measured read performance requires it, with L469''s sync plan, DATA.DERIVE''s sync gradient (L532) and drift guard (L533). Splitting a one-to-one attribute for sparsity or NULL count: rejected (L470); a split wins only under L470''s criteria.

    Gap, collation: J1 owns collation in ALLOCATION.DERIVE.2 (the database is the authority for every order it serves) and left its choice open under DATA. No ledger row grounds a choice. Handed, open, to J6 (defaults graph, column types node) to decide with evidence or keep open; the philosophy-level consequence of DERIVE.2 is only that collation is a declared property of the stored text (inferred).

    Realizes: ALLOCATION.RECORD.1 (holds the durable facts in the form the system-of-record placement gives the database). Refines python-kb-philosophy:STRUCTURE and :DATACENTRICITY (skeleton links).

    Gap 5: the Boyce-Codd claims rest on standard theory, not on a ledger row.


    Corrected by MD-09 (re-audit under MD-08): a lost Boyce-Codd dependency is enforced declaratively (composite foreign key from the repeated determinant to the table that owns the pair), at any isolation level and for every writer; the constraint trigger is the fallback only where no declarative form exists. Rejected: the trigger as the first route: wins where no declarative form exists; it needs Serializable isolation or a lock on every write to either table, a concurrent test and procedural code, and gains no integrity over the declarative form. Inferred from relational theory, not in the ledger.'
- op: node.set
  uid: DATA.GUARD
  constraints:
  - 'Declare every rule a declarative constraint can express: NOT NULL unless absence is a meaningful state; row-local CHECK paired with NOT NULL; foreign keys; unique, partial unique and exclusion constraints for cross-row rules; domains for value types used in several places. Constraints are named, so a violation maps to a stable error. Required, not optional.'
  - Rules no constraint can express (other multi-row rules, legal transitions, dependencies lost by a Boyce-Codd decomposition when no declarative form exists) are checked in the writer function or a constraint trigger, under Serializable isolation with retry or after locking the governing row; the function or trigger asserts the isolation it needs, set per consumer role. The default isolation level is the stack's choice.
  - Each business operation is one function call in its own transaction (ALLOCATION.RULES.5).
  - Concurrent change is detected inside the writer function, which takes the expected version as a parameter; no transaction or lock is held across user think time.
  - 'Mutual exclusion that guards correctness is enforced by the store: row version, unique constraint or row lock inside the transaction; a lease is checked by the writer function as a fencing token. A lock outside the database is acceptable only to save duplicate work.'
  - 'The consistency model is stated per operation: which isolation, whether it reads the primary or a replica, and what staleness it accepts. A check that decides a write never reads a replica. A datastore is never labelled "CP" or "AP".'
  - 'Access guarding: each consumer has its own role, neither owner nor an all-powerful role; grants bound which functions it may call and which tables and columns it may read; state columns are revoked from direct update so the writer function is the only path. Row-level security is not a default (MD-01).'
- op: node.set
  uid: ALLOCATION.ACT.3
  intent: Inside the request go validation, authorization, every change atomic with what the user sees next, and the persisted intent of deferred work, in one transaction; core writes are never asynchronous. Foreign effects, work expected to last more than a few seconds or past the request timeout, fan-out and derived data are deferred to workers fed from the database-staged queue, or to scheduled work inside the database for pure data work.
  constraints:
  - 'Authority: backend (what is deferred) and database (staged intent, data schedules)'
  - 'Copies: the status resource shows the pending state'
  - 'Forbidden: deferring core writes; foreign effects inside the request, except ACT.2''s in-request phase'
  - 'Foreign mutations are deferred as ACT.2 places them: in a worker behind 202, except ACT.2''s in-request phase.'
  - 'Deferred: foreign effects, fan-out, derived data, and work expected to last more than a few seconds or past the request timeout; about 1 s stays the design target for interactive responses (FORCES.4), not the cut-off for deferral; a lower cut-off follows measured worker capacity.'
  - An operation that outlasts the request answers 202 with a status resource.
  - Every asynchronous stream states its staleness window and a convergence check.
  - In-process background tasks only for small tasks that may be lost.
  epistemic_state: 'known | unvalidated: the few-seconds threshold follows L601; a lower cut-off needs measured worker capacity'
  design_notes: "Positions: P1 inside the request what the user sees next (L601); P2 separate worker processes (L406, L407); P3 scheduled work inside the database (L604 MAINT); P4 asynchrony only for derived data and bulk jobs (L482 MAINT, L545).\n\nForces: latency against correctness and scalability.\n\nDecision:\n  - Inside the request: validation, authorization, every change atomic with what the user sees next, and the persisted intent of deferred work, in one transaction, which is one function call when the change is a database operation (L601, MD-03). Core writes are never asynchronous (L482, MAINT, max).\n  - (superseded by MD-09) Deferred: foreign effects, work that would push the response past the 1 s flow budget (L013, L271), fan-out, derived data. Foreign mutations run as atomic phases in a worker behind 202; the one in-request exception is ACT.2's: an outcome the user must see within about 1 s, with the intent recorded by the database function first.\n  - Host: workers fed from the database-staged queue (L406, L407, L409); scheduled pure data work inside the database (L604; JOB_HOST).\n  - An operation that outlasts the request answers 202 with a status resource (L271, L602). Every asynchronous stream states its staleness window and a convergence check (L482).\n\nRejected: in-process background tasks: only for small tasks that may be lost (L407). P3 for everything: not for Python logic, foreign effects, highly parallel or OS-level work (L604).\n\nChanged (R3): in-request exception aligned with ACT.2 (logic review M4).\n\nWould move it: duration, foreign effects, set-based data work\n\nCorrected by MD-09 (re-audit under MD-08): deferral threshold is work expected to exceed a few seconds or the request timeout (L601's wording); 1 s stays the interactive-response target, not the cut-off. Rejected: a 1 s cut-off: wins where measured synchronous-worker capacity on slow I/O is the binding force."
- op: node.set
  uid: ALLOCATION.ACT.2
  constraints:
  - 'Authority: backend (delivery, external calls), database (the staged intent, written by the operation)'
  - 'Copies: none'
  - 'Forbidden: third-party credentials in the browser (inferred); calls to external systems from inside the database; dual writes to the database and a broker; remote calls inside an open transaction; a foreign call in the request without its intent recorded first; post-commit hooks for foreign effects'
  - Write the intent in the operation's transaction; deliver after commit, idempotently.
  - Foreign mutations (a payment, a remote API write) run as atomic phases with recovery points and an idempotency key, in a worker behind a 202 response with a status resource.
  - 'In the request only when the user waits for the outcome in the same response and the call is expected to finish within a few seconds, under the request timeout: the database function records the intent first and commits; the request performs the call as one atomic phase and marks the row done; a worker completer picks up the row if the request dies.'
  - Post-commit hooks only for losable work that touches no foreign system.
  epistemic_state: 'known | unvalidated: the few-seconds in-request exception is inferred (L013, L589)'
  design_notes: "Positions: P1 backend effects staged in the database and delivered after commit (L624, L409, L410); P2 post-commit hooks in the request process (L600, L233); P3 atomic phases with recovery points (L589, L234, L246); P4 sagas with compensation (L590, L480).\n\nForces: correctness (no lost or doubled effect) against request latency.\n\nDecision: P1. The database function that performs the state change writes the intent (outbox row or staged job) in the same transaction (L624, L409); a backend worker delivers it after commit to idempotent consumers (L410, L599). External calls are made by backends, never by the database. No database transaction stays open across a remote call (L234).\n  - Foreign mutations (a payment, a remote API write) run as atomic phases with recovery points and an idempotency key passed to the foreign system (P3 as a complement: L589, L234, L246), in a worker behind a 202 response with a status resource (ACT.3, L271, L602).\n  - (superseded by MD-09) In the request only when the user must see the outcome within about 1 s (L013): the database function still records the intent (outbox row) first and commits; the request then performs the call as one atomic phase with the idempotency key and marks the row done. If the request dies, the worker's completer picks the row up (L589). (Revision 3: adopted from the logic unit's realization, M4.)\n\nRejected: P2 (post-commit hook): acceptable only for losable work that touches no foreign system, such as cache invalidation (L600); a losable notice to a foreign system still goes through the outbox, which costs one row. P4: only when one business transaction spans services with separate databases (L590, L480).\n\nChanged (R1): intent written by the database function (MD-03).\n\n(superseded by MD-09) Changed (R3): tension with ACT.3 resolved: foreign mutations in a worker behind 202; in the request only for an outcome needed within about 1 s, intent recorded first; post-commit hooks only for losable work touching no foreign system (logic review M4).\n\n(superseded by MD-09) Would move it: an outcome the user must see within about 1 s (in-request phase, intent recorded first); a business transaction crossing services with their own databases (saga)\n\nCorrected by MD-09 (re-audit under MD-08): the in-request exception applies when the user waits for the outcome in the same response and the call is expected to finish within a few seconds, under the request timeout; intent recorded first, unchanged. Foreign mutations still default to a worker."
- op: node.set
  uid: ALLOCATION.DERIVE.2
  intent: The database reduces many rows to the few a client needs, set-based, in one statement or read function, so only the result travels; it also owns the collation of every order it serves. The server enforces a maximum page size; structured-data and agent collections and any list over a large or growing set page by keyset behind an opaque continuation, while a human-facing HTML list over a bounded result may page by offset with page numbers.
  constraints:
  - 'Authority: database, including collation'
  - 'Copies: the browser over rows already loaded, same collation'
  - 'Forbidden: loading full sets into a backend or browser to reduce them; queries in loops; a browser re-sort with another collation'
  - Filter, sort, aggregate and page in the database.
  - Enforce a maximum page size. Structured-data and agent collections, and any list over a large or growing set, page by keyset behind an opaque continuation. A human-facing HTML list over a bounded result may page by offset with page numbers; offset never for deep pages or bulk work.
  - The database owns the collation of every order it serves; a browser re-sort over rows already loaded uses the same collation or none.
  - Reads that need no domain behaviour may be plain queries.
  design_notes: 'Positions: P1 with the data, set-based (L613, L614); P2 reads bypass the domain model (L237); P3 in the backend or browser on a loaded set (no row; skeleton gap 2).


    Forces: performance and latency against scalability (L615 exempts reductions that return small results).


    (superseded by MD-09) Decision: the database reduces many rows to the few a client needs, set-based, in one statement or read function; only the result travels (L613, L614). The server enforces a maximum page size and pages by keyset behind an opaque continuation (L265, L266, L541). Reads that need no domain behaviour may be plain queries (P2, L237; L516). Search follows the same placement and stays deferred. Collation (F11): the database owns the collation of every order it serves, declared per column or per query; which collation is open, under DATA.


    Gap handling (P3): no row argues for it; rejected as an authority on L613, L614, L615. Kept only as a copy: the browser may re-sort or filter rows it already holds, for instant feedback, with the same locale as the database''s collation or not at all (F11), never deciding which rows exist beyond them. This condition is inferred.


    Changed (R1): collation owned here (F11).


    Would move it: data volume against result size; write load


    Corrected by MD-09 (re-audit under MD-08): keyset is required where it is grounded (structured-data and agent collections, large or growing sets, bulk work); offset with page numbers is acceptable for a human HTML list over a bounded result. Rejected: keyset on every surface: wins for any list over a large or growing set. Inferred; no ledger row argues either method for HTML lists.'
- op: node.set
  uid: TRANSVERSE.SECURITY
  intent: The whole site is served over encrypted transport and exposes and logs only the minimum data its purpose needs. Every threat category has an owning tier that the requester cannot modify, insecure design is answered by a threat model per critical flow and trust boundary with misuse-case tests, and each property is stated as a verifiable requirement at a level chosen by risk.
  constraints:
  - Serve every page and every API over encrypted transport with strict transport enforcement and no mixed content; the same property covers database connections of every consumer role.
  - Collect only the data the user's goal needs; never log secrets, session ids, tokens, keys, payment data, connection strings or unneeded personal data, trace headers included.
  - Give every threat category an owning tier that the requester cannot modify, named through the allocation placements.
  - Answer insecure design with a threat model per critical flow and trust boundary (authentication, access control, business operations, agent access), revisited when a placement on that flow changes, and misuse-case tests per tier.
  - Assign software and data integrity failures to the delivery pipeline and the parsing tier for untrusted serialized input; declarative constraints are not that control.
  - State each property as a verifiable requirement with a traceable id, at a level chosen by risk; the threat list is an awareness map, never the requirement set.
  - 'Never claim a stronger read-visibility guarantee than the rule of ALLOCATION.GUARD.3 gives: roles that may read the base tables see every row unless their own role is restricted.'
  design_notes: "POSITIONS:\n  - P1 whole-site HTTPS, never mixed with HTTP in a session, HSTS (L029); HTTPS as the precondition for browser capabilities (L030).\n  - P2 minimal exposure: a visit is safe, only the data the user's goal needs is collected (L035); secrets, session ids, tokens, keys, payment data, connection strings and unneeded personal data never logged, pseudonymised where identity is not needed, logged input sanitised (L036).\n  - P3 the OWASP Top 10:2025 as an awareness map, each category assigned to an owning tier (L303; tier map inferred, SRC-115 does not state it).\n  - P4 a catalogue of verifiable requirements (ASVS) at a level chosen by risk (L304, owned by PIG-WEB-TRANSVERSE.SECURITY.1; its level definitions are now read from the ASVS 5.0 text, its chapter list is not).\n\nFORCES:\nP1 and P2 serve confidentiality and integrity at a low, one-off cost; no position in the evidence opposes them. P3 serves coverage (no threat without an owner); its cost is that an awareness list is not testable. P4 serves verifiability; its cost is effort scaled by the chosen level.\n\nDECISION:\nP1, P2, and P3 completed by P4's demand.\n  - Transport: every page and every API over HTTPS with HSTS, no mixed content (L029, L030). Database connections from every consumer role are covered by the same property (inferred: MD-03 adds consumers outside the request path).\n  - Exposure: collect the minimum (L035); log no secret or unneeded personal data (L036), trace headers included (L375). The reporting role's column grants exclude personal data by default (J1 access paths), which realizes L035 for the MD-03 consumers.\n  - Threat map: every Top 10 category has an owning tier that the requester cannot modify (RULES.3, L019), named through the allocation placements:\n    - A01 Broken Access Control: backend and database, as GUARD.3 settles it: writer functions decide per-user write rules; the backend decides product policy and identity; the database bounds each consumer by its role (MD-01, MD-03). Decided by MD-05, read visibility of rows with per-user rules when several backends share the database (not settled here). former recorded default (superseded): each backend filters these reads from one shared written specification, with a shared denial-test suite every backend runs. Database read functions that receive the verified actor are acceptable when a per-user read rule must hold for two or more backends. Consequence: Before the maintainer answered, the reporting role gets no SELECT on comment content or narrower-audience comments, the operator role sees every row, and any other role that may SELECT the base tables sees every row unless its own role is restricted; no statement here claims a stronger visibility guarantee.\n    - A04 Cryptographic Failures: the backend (GUARD.4; L303), the proxy's TLS, the database connections of every consumer role, and storage at rest (the review's completion of L303's backend-only assignment; inferred).\n    - A07 Authentication Failures: backend (GUARD.4; L303).\n    - A05 Injection: backend and database (L303): parsing into precise types at every entry and typed function parameters (GUARD.1).\n    - A02 Security Misconfiguration: headers, CSP and deployment; A03 Supply Chain: the pipeline and dependencies (L303; realized in PIG-WEB-TRANSVERSE.SECURITY and OPERABILITY.3).\n    - A09 Logging and Alerting Failures: operations (L303), realized in OPERABILITY.1.\n    - Assigned here, inferred:\n      - (superseded by MD-09) A06 Insecure Design: a threat model per placement and per critical flow (authentication, access control, business operations, agent access), with misuse-case tests per tier; OPERABILITY.2's denial tests are their first instance. The allocation records (EVOLUTION.1) are the model's input, not the model. Grounded in the OWASP Top 10:2025 A06 preventions (threat modelling for authentication, access control, business logic and key flows; use-case and misuse-case tests per tier), read by the review.\n      - A08 Software or Data Integrity Failures: the delivery pipeline (signed provenance, trusted sources, review of code and configuration changes, segregated CI/CD; one immutable artifact, L101; realized in PIG-WEB-TRANSVERSE.SECURITY.5) and the parsing tier for untrusted serialized input (GUARD.1). The OWASP 2025 category is untrusted code or data treated as trusted; the database's declarative constraints are not an A08 control and are not assigned here.\n      - A10 Mishandling of Exceptional Conditions: the tier that holds each check, which fails closed (inferred from RULES.3).\n  - Verifiability (max): each property is stated as a verifiable requirement at a level chosen by risk, with requirement ids traceable; the catalogue is a stack choice (P4, PIG-WEB-TRANSVERSE.SECURITY.1). Its level definitions are grounded: ASVS 5.0 says most applications should strive for Level 2, and each organisation decides its level from its risks. The Top 10 stays the awareness map, not the requirement set.\n\nREJECTED:\n  - HTTPS only on login or sensitive pages: never (L029).\n  - Logging raw identifiers or secrets for debugging: never; a hashed session id is acceptable when sessions must be tracked (L036).\n  - The Top 10 as the requirement set or a compliance checklist: it is an awareness document (L303); wins never as the only catalogue.\n  - Security as a per-tier add-on without an owning tier per threat: against RULES.3 and L096.\n  - The recorded allocation decisions as the answer to insecure design: they are the threat model's input; OWASP's A06 asks for threat modelling and misuse-case tests. Wins never as the whole answer.\n\nPLACEMENTS REALIZED:\nrefines RULES.3 (skeleton link). Rests on GUARD.1, GUARD.3, GUARD.4, GUARD.2, ACT.4 and the J1 access paths.\n\nREVIEW FIXES:\nM4 (A08 reassigned to the pipeline and the parsing tier, declarative constraints dropped; A06 as a threat model with misuse-case tests; A04 completed; whole map unvalidated); m1 (ASVS level definitions grounded, L304's level part no longer open); m7 and X1 (one notation for the pending clause, former recorded default (superseded), fallback and consequence stated).\n\nCorrected by MD-09 (re-audit under MD-08): threat models are per critical flow and trust boundary, revisited when a placement on the flow changes; a model per placement repeats the flow models and the allocation records, which are the model's input, and adds effort without coverage."
