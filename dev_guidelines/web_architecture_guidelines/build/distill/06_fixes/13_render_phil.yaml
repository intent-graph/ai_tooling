operations:
- op: node.set
  uid: ALLOCATION.GUARD.3
  constraints:
  - 'Authority: writer function for per-user write rules decidable from the row and the actor; backend for product policy not stored in the data and for identity; database per consumer role'
  - 'Copies: the backend''s check of per-user write rules (generated or tested, early feedback); the browser hides controls the user may not use (cosmetic)'
  - 'Forbidden: browser, agent client, model output, client hints; row security by default (MD-01); any consumer role owning tables or bypassing grants; a write without an actor, or with an actor its role may not assert'
  - Per-user write rules decidable from the stored row and the acting user are decided by the column's writer function; a backend's identical check is a generated or tested copy for early feedback.
  - 'Each backend decides product policy not stored in the data (product roles, plan limits, feature flags, workflow steps) and identity: one central mechanism, deny by default, object level, on every request from every client.'
  - Each consumer has its own role, neither owner nor an all-powerful role; grants say which API functions it may call and which tables and columns it may read; state columns are revoked from direct update so the writer function is the only path.
  - Functions read the acting user that the backend asserted for the transaction from its verified identity, treat it as a claim, refuse a write without an actor, check that the session role may assert that kind of actor (a backend an end user, an operator or owner role only itself), and record both the session role and the claimed actor.
  - No row-level security by default; acceptable only when the data model is simple, the scoping key leads the composite primary key of every table the policy covers, and no all-powerful administrator role must read or write across scopes.
  - 'Until the maintainer answers: the reporting role gets no read access to comment content or to comments with a narrower audience than their target (it reads comments only through a projection limited to target-wide audiences, or not at all); the operator role (administrators, all-powerful by the maintainer''s model) sees every row; any other role that may read the base tables sees every row unless its own role is restricted.'
  - 'Recorded default for the open clause: each backend filters per-user reads from one shared written specification with a shared denial-test suite; fallback: database read functions that receive the verified actor, acceptable when a per-user read rule must hold for two or more backends.'
  epistemic_state: 'undecided: awaiting maintainer, read visibility of rows with per-user rules when several backends share the database (recommendation: database read functions that receive the verified actor, for data with per-user visibility; each backend filtering stays acceptable for data without per-user rules; recorded default: each backend filters these reads from one shared written specification with a shared denial-test suite) | known: two layers per MD-01; write rules in writer functions (MD-03) | conflict: L619, L688 favour row security when several consumers share the database (MD-03)'
  design_notes: "Positions: P1 backend only (L020, L620, L305, L306); P2 the database enforces through roles and row-level security (L619, L620, L688); P3 two layers: database permissions limit objects, application permissions decide business actions (L468 MAINT, L620, L128).\n\nForces: security against changeability of policy.\n\nDecision: P3, two layers (MD-01; L468, MAINT, max). With several consumers the work divides by where the rule's facts live (R1-1; inferred from MD-03 and L608).\n  - The writer function decides per-user write rules that can be decided from the stored row and the acting user (author, owner, assignee: \"only the assignee may close a task\") and that must hold for every consumer (MD-03, L596, ACT.1). A backend's identical check is a copy for early feedback, generated or tested under RULES.1.\n  - Each backend decides product policy that is not stored in the data: product roles, plan limits, feature flags, workflow steps; and who the human or agent is. One central mechanism per backend, deny by default, object level, on every request from every client (L020, L305, L306, L644).\n  - The database decides per consumer: each consumer has its own role, neither owner nor superuser. Grants say which API functions it may EXECUTE, which tables and columns it may SELECT, and that it writes no table directly except under DB_API's exception; state columns are revoked from UPDATE so the writer function is the only path (L468, L310, L596). This bounds what every backend, BI tool, console and script can do whatever its code.\n  - Functions run with their owner's rights only where they must write tables the caller cannot. They read the acting user from a transaction-local setting (L311, L566). That actor is the consumer's claim, not a verified fact (R1-3): functions refuse a write without an actor, check that the session role may assert that kind of actor (a backend an end user, an operator or owner role only itself; default-context table), and record both the session role and the claimed actor.\n  - Row-level security is not used by default (MD-01). It is acceptable only when the data model is simple, the scoping key leads the composite primary key of every table the policy covers, and no all-powerful administrator role must read or write across scopes (MD-01).\n\nUndecided clause (Q1): `undecided: awaiting maintainer, read visibility of rows with per-user rules when several backends share the database`. Read visibility of rows that carry per-user rules (\"a draft is visible only to its author\"; comments on restricted targets are covered by the same rule). Under MD-01 as written each backend filters reads, one copy per backend, against RULES.4 (L633). Writes are not in the question: they are settled above under MD-03.\n  - Recorded default: each backend filters these reads from one shared written specification, with a shared denial-test suite every backend runs (X1).\n  - Fallback kept, not forbidden: database read functions that receive the verified actor are acceptable when a per-user read rule must hold for two or more backends (X1). Under MD-03 several backends share the database by default, so this condition is always met: the fallback is available wherever MD-03's default holds. The actor is verified by the backend that asserts it and is a claim to the database (R1-3).\n  - Consequence, under either position: roles that may SELECT the base tables (reporting, operator) see every row, comments included, unless their own role is restricted. No statement in this guideline claims stronger visibility than this (X1).\n\nTension (MD-01 against evidence): L619 and L688 call for row security when several applications or agents read the database, which MD-03 makes the default. MD-01 overrides; the residual risk is that a consumer with SELECT on a table sees every user's rows, and that each backend's read filter is the only per-user gate on reads.\n\nRejected: P1 without the database layer; wins never (L468). P2 as sole authority: loses product policy that lives in application code (L468); row-level security wins only under MD-01's conditions. The backend as authority for per-user write rules decidable from the row: two authorities for one rule (R1-1); the backend keeps a tested copy.\n\nChanged (R1): division of work with several consumers (MD-03); row security per MD-01 (F1 closed); new clause Q1.\n\nChanged (R3): Q1 notation unified; recorded default and fallback reworded; comments covered; visibility of SELECT-capable roles stated (X1).\n\nChanged (R2): one authority per per-user write rule, the writer function; backend check is a tested copy; backend owns product policy not stored in data (R1-1). Actor treated as a claim, pairing checked, writes without actor refused (R1-3). Q1 narrowed to read visibility, awaiting maintainer (R1-2).\n\nWould move it: MD-01's three conditions (row security becomes acceptable); Q1's answer (read visibility into read functions)\n\nRecommendation for the open clause: database read functions that receive the verified actor, for data with per-user visibility; each backend filtering stays acceptable for data without per-user rules. Recorded default if unanswered: each backend filters from one shared written specification with a shared denial-test suite. Consequence for roles that read the base tables, until the maintainer answers: the reporting role gets no read access to comment content or narrower-audience comments; the operator role sees every row; any other role sees every row unless its own role is restricted."
- op: node.set
  uid: INTERACTION.COLLABORATE
  constraints:
  - Every page is correct on plain load; a client that missed events catches up by fetching changes since a server-issued cursor and never trusts the events it happened to receive.
  - The catch-up cursor is one no later commit can fall behind; a sequence id is not such a cursor.
  - 'Use the simplest channel that meets direction of flow, update frequency and tolerable latency: polling, then long polling or server-sent events, then a two-way channel; correctness never depends on the channel.'
  - A stale write is rejected and shown as a conflict with both versions, so the user sees the other change and reapplies; it is never merged silently and never a silent overwrite of the whole record; the browser and agent clients never resolve a conflict on their own (GUARD.5).
  - Per-property last-writer-wins only for toggles, status, assignment and ordering; a text engine only for genuinely collaborative long-text fields.
  - 'Presence is ephemeral: broadcast through a channel with a timeout, never written to tables; a persisted last-seen is a separate, coarse field (PRESENT.3).'
  - A comment is its own entity with a mandatory target reference, its own author, lifecycle and permissions; comments are append-only rows that need no merge.
  - Read, comment, edit, resolve and moderate are separate abilities, deny by default, checked per object on every request, streams and exports included; none is implied by another.
  - 'A comment is never more visible than its target, may have a narrower audience, and the same filter applies on every surface the application serves: counts, notifications, search results, history, exports, ETags and real-time channels.'
  - Notifications are created only for recipients who may see the target.
  - A report queue (reports with a status and a decision) is required whenever people outside the team read comments.
  - Until the read-visibility question is answered, per-user comment reads follow the recorded default of ALLOCATION.GUARD.3, with a shared written specification that lists every secondary surface.
  - Until the read-visibility question is answered, the reporting role gets no read access to comment content or to comments whose audience is narrower than their target; it reads comments only through a projection limited to target-wide audiences, or not at all. The operator role sees every row. Where a project does not apply this, the leak to the reporting role is a known limit stated where comments are documented.
  - Agent writes are marked as agent-originated and pass the same abilities and visibility filters.
- op: node.set
  uid: TRANSVERSE.EVOLUTION.5
  constraints:
  - Organise teams cross-functionally around a capability; never organise by layer or let a database team write other teams' business operations.
  - Hold the database owner as a named role inside the team, not a layer team.
  - When teams multiply, give each capability team its domain schema, functions and backend, with one named owner role for conventions, roles, grants and review of the function API catalogue diff.
  - Compose a cross-domain business operation inside the database by published functions (ALLOCATION.RULES.5), never by direct access to another domain's tables.
  - Give a cross-schema business function to the team that owns the workflow, reviewed by the database owner role.
  - Cut module and schema boundaries with the team boundaries.
- op: node.set
  uid: TRANSVERSE.EVOLUTION
  constraints:
  - Name, choose from required properties, and record the costly decisions.
  - Grow in small tested increments with fit checked automatically.
  - Never split a backend into services without a measured need.
  - Adopt a new technology only past a measured limit of an existing one.
  - Cut teams by capability, with a cross-schema business function owned by the team that owns the workflow and reviewed by the database owner role.
