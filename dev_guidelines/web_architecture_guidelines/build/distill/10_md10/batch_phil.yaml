operations:
- op: node.set
  uid: TRANSVERSE.EVOLUTION.3
  intent: 'One deployable per backend first: several backends may share the database, but a backend is split into services only when a named force requires it (independent scaling, independent release by separate teams, fault isolation that matters, or a different runtime need), the boundary has proven stable and the distribution premium is budgeted. Bounded contexts map to domain schemas in the shared database, and any new deployable reaches data through the function API with its own role, never holding a second system of record.'
  constraints:
  - Make each backend one deployable, modular by business concept; never split it into services without a measured need.
  - 'Split off a further deployable only when a named force requires it: independent scaling, independent release by separate teams, fault isolation that matters, or a different runtime need. The boundary has proven stable and the distribution premium is budgeted, and the force is stated.'
  - Map bounded contexts to domain schemas in the shared database, each with its own functions and roles.
  - Give a new deployable access to data only through the function API with its own role; never write tables beside it or hold a second system of record.
  design_notes: "POSITIONS:\n  - P1 one deployable first. Defer hard-to-reverse boundaries (L073), place service boundaries only once the domain is understood (L075), avoid distribution when possible (L076), integrate in a small team (L078). At stack level: L113 to L116, the four-source default.\n  - P2 services from the start when the domain is well known, the system needs distribution, and the parts can develop and deploy independently (L117, Tilkov; contested).\n  - P3 the goal of a split is independent deployability, not the count; start with one or two (L080); budget the distribution premium first (L074).\n  - P4 bounded contexts with explicit mappings, not one unified model (L077).\n  - P5 all advice here is tentative: the evidence is anecdotal, and a modular monolith does not make extraction free (L079).\n  - Read against RECORD.1 and RECORD.2 (J1, MD-03): one shared system of record behind a function API. Also L044 (one application owns its database), rejected by J1 in this context, and L116 (keep separate data schemas for likely future services).\n\nFORCES:\nP1 serves changeability while the domain is unknown and saves the distribution premium; P2 serves team independence when the domain is known; P3 and P4 serve keeping each split meaningful.\n\nDECISION:\nP1 by default, P3 and P4 for any split, and the data seam given by the allocation.\n  - Several backends may share the database (MD-03). Each backend is one deployable, modular by business concept (stack level); it is not split into services without a measured need (X5). MD-03's several backends do not by themselves license splitting a backend. A further deployable is split off only when a team needs independent releases, the boundary has proven stable, and the distribution premium is budgeted (L080, L074, L114).\n  - Because the data seam is already the function API, a later split of a backend does not move data. Only deploy independence and the distribution premium of L074 remain to be weighed, so a split costs less than the research rows assume (inferred; L074 and L076 price a data split this context does not have).\n  - Bounded contexts (L077) map to domain schemas in the shared database, each with its own functions and roles (L513, MAINT: schemas are business-domain namespaces with ownership and permissions). This is how L116's \"separate data schemas for likely future services\" is realized under MD-03; inferred.\n  - A new deployable reaches the data through the function API with its own role (RECORD.2). It never writes tables beside it and never holds a second system of record (RECORD.1 forbids a consumer writing two stores).\n  - The confidence of this verdict is bounded by L079: anecdotal evidence.\n\nREJECTED:\n  - P2 services-first: acceptable when all of these hold: the domain is well known (ideally a second version), the size requires distribution, the parts develop and deploy independently, and the team already runs distributed systems (L117, L115, L116).\n  - A database per service: rejected in this context by RECORD.2 and MD-03. It wins only under J1's \"would move it\": a consumer outside the team that needs independent deploys gets that team's service interface.\n\nPLACEMENTS REALIZED:\nno skeleton link to a placement; rests on RECORD.1 and RECORD.2 (MD-03).\n\nREVIEW FIXES:\nM3 and X5 (\"one backend deployable first\" replaced by: several backends may share the database, each backend one deployable, not split into services without a measured need; the lower cost of a later split weighed, inferred).\n\nMD-10: aligned with software-development-philosophy:CONSTRUCTION.SYSTEM_SHAPE.1 by MD-10. The Decision line above that names independent release as the reason to split is superseded.\nReplaced position: a split only when a team needs independent releases (P1 and P3 read as independent deployability alone).\nRejected: independent release as the only reason: still best where scaling, fault isolation and runtime needs are met inside one deployable (process types of one deployable already scale web, worker and long-lived connections separately; inferred), and a split would add distribution cost for no named force.\nKept: proven stable boundary, budgeted distribution premium, domain schemas, function API with its own role, no second system of record. Statements elsewhere that a backend is not split 'without a measured need' stay true: a named force is the need and its benefit is measured."
  epistemic_state: 'known: MD-10 for the reasons to split | unvalidated: bounded contexts as domain schemas in the shared database; a later split moves no data | conflict: L044 and L116 (separate data per application or service) against MD-03, recorded by J1 and realized here'
- op: node.set
  uid: TRANSVERSE.EVOLUTION.4
  intent: The system adopts few, mature technologies, because novelty is a scarce budget and simplicity is a reliability property. A new technology enters as a replacement, with the retirement of the older one planned and owned, and only when an existing one's measured limit is reached and its perpetual operating cost is budgeted; this counts runtimes, stores, services and frameworks, not the choice of paradigm inside an adopted language.
  constraints:
  - Adopt few, mature technologies with known failure modes.
  - Let a new technology in only when an existing one's measured limit is reached and its perpetual operating cost is budgeted.
  - 'Introduce it as a replacement: record what it replaces, or why it replaces nothing, and plan the retirement of the older one with a named owner.'
  - Count runtimes, stores, services and frameworks; the paradigm inside an adopted language is not limited by this rule.
  design_notes: "POSITIONS:\n  - P1 novelty is a scarce budget, spent on what differentiates the product (L081).\n  - P2 prefer mature technology with known failure modes (L082).\n  - P3 few distinct technologies covering the domain (L083, majority).\n  - P4 weigh perpetual operating cost, not adoption convenience; consult others before adopting (L084).\n  - P5 simplicity is a reliability property (L085).\n  - P6, from the skeleton's conflicts link to python-kb-philosophy POLYGLOT: pick the right paradigm per problem.\n\nFORCES:\nP1 to P5 serve operability and reliability at the cost of sometimes using a less specialised tool; P6 serves fit per problem.\n\nDECISION:\nP1 to P5.\n  - The system adopts few, mature technologies. A new technology enters only when an existing one's measured limit is reached and its perpetual operating cost is budgeted (L084).\n  - In this stack that is POSTGRES_FIRST: Postgres hosts queue, schedules, derived caches and sessions until a measured limit; CACHE_STORE and JOB_HOST follow the same rule.\n  - P6 is reconciled by scope, inferred. EVOLUTION.4 counts runtimes, stores, services and frameworks. The choice of paradigm inside an adopted language (POLYGLOT) is not limited by it, so the two do not compete.\n\nREJECTED:\nthe best tool per problem across infrastructure, acceptable when the existing tool's measured limit is reached and the added operating cost is budgeted (L084; POSTGRES_FIRST's \"would move it\").\n\nPLACEMENTS REALIZED:\nno skeleton link to a philosophy placement; realized in the stack graph by PIG-WEB-ALLOCATION.POSTGRES_FIRST, CACHE_STORE and JOB_HOST (J1).\n\nMD-10: aligned with software-development-philosophy:EVOLUTION.TECHNOLOGY.1 by MD-10. The Decision above, admission by measured limit and budgeted cost alone, is superseded.\nReplaced position: a new technology enters when an existing one's measured limit is reached and its operating cost is budgeted, with no statement of what it retires.\nRejected: addition alongside the older technology without a retirement plan: still best when the new technology replaces nothing because it serves a role no adopted technology serves; the record then says why it replaces nothing. The software guideline's allowance for a few independently operated components (EVOLUTION.TECHNOLOGY.3) is not carried: the default context shares one database, one platform and one on-call (inferred).\nKept: the measured-limit and operating-cost conditions, the scope (runtimes, stores, services, frameworks; not the paradigm), POSTGRES_FIRST."
- op: node.set
  uid: TRANSVERSE.EVOLUTION
  constraints:
  - Name, choose from required properties, and record the costly decisions.
  - Grow in small tested increments with fit checked automatically.
  - Never split a backend into services without a measured need.
  - Adopt a new technology only past a measured limit of an existing one, as a replacement whose older technology is retired by plan, with an owner.
  - Cut teams by capability, with a cross-schema business function owned by the team that owns the workflow and reviewed by the database owner role.
- op: node.set
  uid: LOGIC.SECURE
  constraints:
  - 'Authenticate every caller, then authorize every request. Humans by the server-held session of GUARD.4; agents by their own short-lived, revocable tokens, accepted only when issued for this server (audience check), never forwarded downstream (GUARD.4). An ID token proves a login to the client and is never accepted as an API credential. Authorization is a separate, central mechanism, deny by default, object level, applied to every request from every client, for what the backend owns: product policy not stored in the data and identity (GUARD.3).'
  - Assert the actor, do not decide for the database. For every call into the function API the backend sets the acting user it has verified (scoped to the transaction, from the verified identity, never a client-supplied id; GUARD.3); per-user write rules decidable from the row are decided by the writer function, and the backend's identical check is a generated or tested copy for early feedback (GUARD.3, RULES.1).
  - 'Treat all input as untrusted and parse it at entry into the most precise type, once per process boundary (GUARD.1): request bodies, query parameters, headers, uploaded files, payloads read back from queues, and anything a model or agent produced. Client hints, tool annotations and claimed identities are never enforcement.'
  - 'Bound consumption at two depths: identity-blind size, rate, read-rate and time limits at the outermost layer, answering 413 or 408 there, with the client''s own size check as a feedback copy; identity-aware limits in the backend, per operation and per business need, with tighter limits on operations that cost money, trigger third parties or are expensive for agents to loop on.'
  - 'Protect harmful automation by flow, not by client kind: name the flows whose automation harms the business (sign-up, purchase, booking, referral) and protect each specifically; no blanket bot blocking, because agents are intended users in this context.'
  - 'Defend logins in layers: MFA first, then breached-password checks, then device signals and challenges known to be spoofable; never IP blocking alone. Offer MFA on every human account, phishing-resistant authenticators (passkeys, WebAuthn) preferred. Require it on privileged accounts (operator, owner, administrator) and before sensitive operations (step-up). Whether it is required on every account follows the security level the project chooses by risk (TRANSVERSE.SECURITY).'
  - 'Per-user read visibility (MD-05): simple reads that carry no logic are written by the backend directly; sensitive, complex, high-impact or shared reads, per-user visibility rules included, go through database functions that receive the verified actor (ALLOCATION.GUARD.3).'
  - 'Server-side fetches of client- or agent-named URLs reach only destinations they allow: a host allowlist where the hosts are known, otherwise a refusal of private, loopback and link-local addresses; the connection goes only to the validated address and redirect targets are re-checked.'
- op: node.set
  uid: DATA.MAINTAIN
  constraints:
  - Every schema change is a versioned migration kept in version control with the code, ordered, reviewed, and applied only by automation as an explicit step of every release, identically in every environment, never by hand. No production change, structural or data, is ad hoc SQL.
  - Long-running data work is a versioned script outside the automated migration run, launched by a human under a checklist with a ticket id.
  - Migrations are the only origin of change; the live database is the truth for current structure, and documentation, persistence models and function wrappers are generated from it. A structure the migrations would not produce is a defect to reconcile, not a new truth.
  - 'An incompatible change keeps every running consumer working: add the new structure or function beside the old, move every consumer, then remove the old in a change marked coordinated once no deployed consumer references it. This holds for tables and the function API alike.'
  - 'Conventions evolve forward only: new objects follow the new rule, legacy ones are not renamed in bulk.'
  - Recovery follows objectives set per workload or data class and is never stricter than needed; at least one backup copy lies out of reach of production credentials; a backup counts only once a restore from it was tested end to end, regularly and automatically, against criteria fixed beforehand.
- op: node.set
  uid: TRANSVERSE.SECURITY
  constraints:
  - Serve every page and every API over encrypted transport with strict transport enforcement and no mixed content; the same property covers database connections of every consumer role.
  - Collect only the data the user's goal needs; never log secrets, session ids, tokens, keys, payment data, connection strings or unneeded personal data, trace headers included.
  - Give every threat category an owning tier that the requester cannot modify, named through the allocation placements.
  - Answer insecure design with a threat model per critical flow and trust boundary (authentication, access control, business operations, agent access), revisited when a placement on that flow changes, and misuse-case tests per tier.
  - Assign software and data integrity failures to the delivery pipeline and the parsing tier for untrusted serialized input; declarative constraints are not that control.
  - State each property as a verifiable requirement with a traceable id, at a level chosen by risk and paired with outcome measures (a level measures coverage, not outcomes); the threat list is an awareness map, never the requirement set.
  - 'Never claim a stronger read-visibility guarantee than the rule of ALLOCATION.GUARD.3 gives: roles that may read the base tables see every row unless their own role is restricted.'
- op: node.set
  uid: TRANSVERSE.OPERABILITY.3
  epistemic_state: 'known | unvalidated: the database''s schema and function API as their own codebase; migrations before code within the release window | gap: no rollback or fix-forward rule for releases or data changes; principle in software-development-philosophy:CHANGE_FLOW.ROLLBACK (MD-10)'
