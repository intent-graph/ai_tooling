operations:
- op: node.set
  uid: PIG-WEB-TRANSVERSE.SECURITY.4
  intent: 'A managed store is the authority for every secret, with least privilege per service and per database consumer role, automated rotation and audited access; secrets reach the process by runtime injection, as a mounted file readable only by the service account or through the store''s own interface, and an environment variable is an exception with its channel and reason recorded. The hosting model is a per-project choice (MD-06): on self-managed hosts without an orchestrator, one acceptable route, the store is a technology to add and until then a file outside source control readable only by the service account is the recorded exception; on an orchestrated platform its secret store is the managed store.'
  constraints:
  - 'Every secret is held in one managed store: the platform''s secret store, or a secrets manager. Access is granted per service and per consumer role, least privilege, and every access is audited.'
  - 'Each database consumer role of MD-03 has its own credentials: each backend, the reporting role, the operator role and the owner role. They are rotated automatically; short-lived dynamic credentials are preferred where the store issues them.'
  - 'Delivery: the secret reaches the process at start by runtime injection from the store, as a mounted file readable only by the service account or through the store''s own interface; it is never inside the artifact or the repository. An environment variable is an exception, allowed only where the platform offers neither channel or where the process environment is shown not to leak (no other process can read it, the framework never dumps it, debug off); the channel and the reason are recorded as an ADR.'
  - Without a store on self-managed hosting (MD-06), a file outside source control readable only by the service account is the recorded exception, rotated by a scheduled task, until the store is added.
  - The framework signing secret is held like any other, never committed, and rotated.
  - 'CI/CD: least-privilege service accounts, secrets scoped per environment, none in pipeline output.'
  - Secret-access logs are kept as long as obligations require, at least 90 days where none exists.
  design_notes: "Rows: L350, L351, L352, L353. Cited: L102, L250, L036.\nPositions: - P1 secrets in environment variables (Twelve-Factor: simple, language-neutral, portable; L350).\n  - P2 runtime injection from a managed store, with access control, rotation and audit (OWASP; L350, L351).\n  - Consensus: centralised storage, least privilege per service, short-lived dynamic secrets with automated rotation, every access audited with logs kept at least 90 days (L351); the framework signing secret kept confidential (L352); CI/CD treated as production (L353); secrets never in source (L102, L250).\nForces: P2 serves confidentiality, revocation and accountability (who read which secret), at the cost of a store to run or rent. P1 serves simplicity and portability; environment variables are visible to many processes and leak through dumps and error pages (L350). The positions answer two different questions: where the secret is held, and how it reaches the process.\nDecision (lead): P2 as the authority; delivery at process start by file or environment.\nRejected: P1 as the place where secrets are held: acceptable when no managed store exists on the platform and adding one is not budgeted (EVOLUTION.4). The secret then sits in a file outside source control, readable only by the service account (L250), and rotation is a scheduled task.\nUnder the assumed hosting: (self-managed hosts, no orchestrator; questions.md, Q1): there is no platform store, so the managed store is a technology to add, weighed under EVOLUTION.4 (J5: a new technology past a measured need, its operating cost budgeted). Until it is added, the file fallback above is in force. On a platform that offers a store, the store is the authority from the start.\nRealizes: refines TRANSVERSE.SECURITY (exposure, L036); rests on the J1 access paths (one role per consumer, MD-03).\nReview fixes: m6 (the default under the assumed hosting stated plainly: the store is a technology to add, the file fallback in force until then; folded into Q1).\n\nMaintainer answer MD-06 applies: hosting is a per-project choice; the file fallback is the self-managed route.\n\nMD-10: aligned with software-development-philosophy:TRANSVERSE.CONFIG.2 and software-development-philosophy:TRANSVERSE.CONFIG.4 by MD-10. The Decision and Rejected lines above are superseded where they differ.\nReplaced position: file and environment variable as equal delivery channels, reconciled by authority and delivery (inferred). Decision now: the store is authority and primary source; delivery is runtime injection as a mounted file or through the store's interface; the environment variable is an exception with channel and reason recorded.\nRejected: the environment variable as an equal channel: acceptable, and then the simplest and most portable choice (P1), where the platform offers neither a mounted file nor a store interface, or where the process environment is shown not to leak; the exception is recorded as an ADR.\nKept as stack realization: the file outside source control, readable only by the service account, is what the exception looks like on self-managed hosting without a store (MD-06); the software node does not cover a host without a store."
  epistemic_state: 'known: MD-06, MD-10 | conflict: L350 contested (environment variables against a managed store), settled by MD-10 for the store | unvalidated: credentials per consumer role; the file fallback as the recorded exception on self-managed hosting without a store'
- op: node.set
  uid: PIG-WEB-TRANSVERSE.SECURITY.5
  intent: Every artifact the system runs has hash-pinned dependencies, an SBOM scanned continuously, components from official sources, and signed build provenance from a hosted build platform, verified before deploy. The build is hardened and isolated (SLSA Build L3) where insider or credential-compromise risk matters or the software is distributed to others; otherwise Build L2 is the level, and the level is recorded per project.
  constraints:
  - 'Python: lockfile with hashes, --require-hashes over the whole tree. JavaScript build dependencies: lockfile, installed from it exactly (per-ecosystem flag inferred). Container base images pinned.'
  - SBOM per release artifact, scanned continuously, not only at build. Updates go through the staged pipeline, then a staged or canary rollout (OPERABILITY.6).
  - 'Provenance: signed provenance from a hosted build platform, verified before deploy; SLSA Build L2 is the floor. A hardened, isolated build (Build L3: runs cannot influence one another and the signing secrets are out of the build steps'' reach) where insider or credential-compromise risk matters or the software is distributed to others. The level is recorded per project as an ADR, with the level reached and the gap to the stated floor where below it.'
  - 'Database extensions and the Postgres packages come from official sources at a pinned version (inferred: Postgres hosts the queue scheduler and other backing roles, POSTGRES_FIRST and JOB_HOST).'
  design_notes: "Rows: L354, L355, L356, L357.\nPositions: (consensus): lockfiles, and for Python hash-checked installs covering transitive dependencies, optionally binary-only (L354); an SBOM of direct and transitive dependencies, scanned continuously (L355); components only from official sources over secure links, signed where possible, updates rolled out in stages (L356); verifiable build provenance, at least SLSA Build L2 from a hosted build platform, verified before use (L357).\nForces: integrity of what runs, at the cost of pipeline work. No position opposes them.\nDecision (lead): all four, on every artifact the system runs.\nRejected: - Build L2 as the target: acceptable when the build platform cannot isolate runs or keep the signing key from the build steps (L357, SRC-242).\n  - Unpinned installs, builds on developer machines, scanning only at release: none wins in this context.\nRealizes: refines TRANSVERSE.SECURITY (A03 owner, and the pipeline half of the A08 owner: signed provenance, trusted sources, J5 after review); rests on OPERABILITY.3 of J5 (one immutable artifact).\nReview fixes: M5 (Build L3 as the target, L2 under its condition; the \"levels above L2 not weighed\" gap removed: the evidence is in the cited source); M4 (A08 pipeline owner named).\n\nMD-10: aligned with software-development-philosophy:ASSURANCE.ARTIFACT.1 by MD-10. The Decision, Rejected and constraint wording above that make Build L3 the default are superseded.\nReplaced position: signed provenance at Build L3 by default (the max rule applied to the cited default, review fix M5), Build L2 only when the platform cannot isolate runs.\nRejected: Build L3 as the default for every project: best, and then required, where insider or credential-compromise risk matters (a platform on which one run could alter another or reach the signing key) or the software is distributed to others; the level is then recorded as an ADR.\nKept: verification before deploy, hash-pinned dependencies, the SBOM and official sources are unchanged."
  epistemic_state: 'known: MD-10 | unvalidated: extensions and JavaScript lockfile practice by extension of L354; which projects of the default context meet the risk condition for Build L3 (decided per project)'
- op: node.set
  uid: PIG-WEB-LOGIC.SECURE.7
  intent: 'Every server-side fetch of a client- or agent-named URL goes through one fetch helper that fetches only destinations it allows: where the set of hosts is known the host is matched against an allowlist, and where users may name any public host the helper refuses private, loopback and link-local addresses instead; in both cases it validates the resolved addresses, connects only to the validated address and re-checks every redirect hop, so a client cannot make the server reach internal services or metadata endpoints. Where the hosting can enforce outbound rules, a network guard backs the helper: an egress proxy with direct egress blocked, or rules that deny the application those ranges.'
  constraints:
  - One fetch helper for every fetch of a client- or agent-named URL.
  - 'Destination rule where the set of destinations is known (the provider and partner hosts a feature calls): the host is matched against an allowlist and the resolved addresses are validated against the permitted networks.'
  - 'Destination rule where users may name any public host (link previews, webhooks registered by users, a client''s metadata document; examples inferred): no allowlist can exist, so the helper refuses private, loopback, link-local and metadata-endpoint addresses instead.'
  - In both cases the helper connects only to the validated address and checks the address actually connected to rather than the hostname.
  - Re-check every redirect target the same way, hop by hop.
  - 'Network guard, preferred: where the hosting can enforce outbound rules, fetches leave through an egress proxy with direct egress blocked, or outbound rules deny the application''s processes the private, loopback, link-local and metadata ranges. It is required when the server''s network holds internal services or a metadata endpoint that answers without a token. Where the hosting cannot enforce outbound rules, the helper is the guard.'
  - Run with a timeout and a size cap, and in a worker when the response does not need the result.
  - 'Forbidden: fetching without a destination rule (an allowlist, or the range refusal where users may name any public host).'
  design_notes: 'Positions: one. P1 any server-side fetch of an agent- or client-supplied URL blocks private, loopback and link-local ranges, validates each redirect hop and preferably goes through an egress proxy (L662).


    Forces: security (requests forged toward internal services and metadata endpoints) against the function itself (metadata documents, webhooks, link previews).


    (superseded by MD-09) Decision: every fetch of a client- or agent-named URL goes through one fetch helper that refuses private, loopback and link-local addresses, checking the address actually connected to rather than the hostname (inferred), validates every redirect hop the same way, and leaves through an egress proxy: P1''s "preferably" made required (max). The helper runs with a timeout and a size cap (PROCESS.3, SECURE.6), and in a worker when the response does not need the result (ACT.3, a foreign effect) (inferred).


    (superseded by MD-09) Rejected: fetching without range checks: never (P1). Direct egress without a proxy: acceptable when the deployment has no egress proxy; the helper''s checks are then the only guard (inferred).


    Realizes: no skeleton link; follows ALLOCATION.RULES.3 (client-supplied input never decides).


    Corrected by MD-09 (re-audit under MD-08): the helper is the required control and the network guard is preferred. A proxy adds a guarantee only when direct egress is blocked; it is required only where an internal service or an unprotected metadata endpoint is reachable (inferred). Rejected: a proxy required for every deployment: wins when the server''s network holds internal services or a token-less metadata endpoint. Fetching without range checks: never.


    MD-10: aligned with software-development-philosophy:CONSTRUCTION.DATA_NOT_CODE.3 by MD-10. The Decision and Rejected lines above that apply one range refusal to every fetch are superseded.

    Replaced position: one helper refusing private, loopback and link-local ranges for every fetch, every other host allowed.

    Rejected: range refusal alone where the destinations are known: it is the best, and the only possible, rule where users may name any public host (no allowlist can be written); where the set of hosts is known an allowlist is the rule.

    Kept: the connect-time address check, the redirect re-check, the network guard and its ''required when'' condition, the timeout and size cap.'
  epistemic_state: 'known: MD-10 | unvalidated: connect-time address check inferred; the network guard''s ''required when'' condition inferred; the examples of known and open destination sets inferred'
- op: node.set
  uid: PIG-WEB-DATA.MAINTAIN.5
  intent: Recovery is designed from objectives set per workload or data class (how much data may be lost, how long a restore may take) and is never stricter than they need; for the shared system of record that is usually point-in-time recovery, base backups plus continuous WAL archiving to a repository outside the failure and attack domain of production and out of reach of production credentials. A backup counts only once a restore from it is tested end to end, regularly and automatically, against criteria fixed beforehand. Logical dumps serve portability only, fsync is never off, and synchronous_commit is relaxed only for data that may be lost on a crash.
  constraints:
  - 'Objectives: a recovery point objective (how much data may be lost) and a recovery time objective (how long a restore may take) are set per workload or data class from the impact of data loss and downtime, and recorded per project; data recovery and service recovery are stated separately. The strategy follows the objectives and is never stricter than needed.'
  - 'Where the objective on data loss is shorter than the interval between base backups, the strategy is point-in-time recovery: base backups plus continuous WAL archiving, with retention and tracked chains, the archive command strict. This is the usual case for the shared system of record (inferred). Data that can be rebuilt (derived caches) is recovered by rebuild or a periodic backup (inferred).'
  - 'Independence: at least one copy of the base backups and of the WAL archive lies outside the failure and attack domain of production and cannot be reached with production credentials (another account, region or provider, or platform-enforced immutable retention); the threat model and who can delete a copy or shorten its retention are stated; backups are encrypted with restricted rights; no single credential or person can delete every copy or shorten its retention.'
  - Archiving is tested and monitored before the first base backup. A backup counts only once a restore from it is tested end to end, regularly and automatically, by the procedure of a real recovery, against criteria fixed beforehand (data present, uncorrupted and within the recovery point; restore complete within the recovery time). The restore runs by its own path, independent of the migration tooling, and backup integrity is verified before restore.
  - Logical dumps (with roles dumped separately) only for portability and partial copies, never as the recovery plan.
  - Configuration in version control.
  - fsync on, write caches safe; synchronous_commit on by default; off only per transaction or per role for data that may be lost on a crash, such as rebuildable caches (the durability and latency trade-off made explicit; per-transaction scope inferred).
  design_notes: "Question: how the database is backed up and proven restorable.\nPositions: (consensus): L218 recovery to a moment needs a base backup plus continuous WAL archiving; the archive command succeeds only on real success and refuses to overwrite; L219 archiving set up, tested and monitored before the first base backup; restores rehearsed (inferred wording); L220 pg_dump is a logical snapshot of one database, without roles, not point-in-time recovery; L221 configuration files are not restored by WAL replay and live in version control; L222 backup repository on a separate host, with retention and tracked full, differential, incremental chains; L223 fsync never off; safe write caches; synchronous_commit is the explicit durability and latency trade-off.\nForces: durability and recoverability (integrity) against storage cost and commit latency.\nDecision and grounds: all adopted (max, uncontested).\n  - Point-in-time recovery by default: base backups plus continuous WAL archiving to a repository on another host, with retention and tracked chains (L218, L222); the archive command strict (L218).\n  - Archiving tested and monitored before the first base backup; a backup counts only once a restore of it has been rehearsed, and restores are rehearsed on a schedule (L219).\n  - Logical dumps (with roles dumped separately) only for portability and partial copies, never as the recovery plan (L220).\n  - Configuration in version control (L221).\n  - fsync on, write caches safe (L223); synchronous_commit on by default; off only per transaction or per role for data that may be lost on a crash, such as rebuildable caches (L223's trade-off made explicit; per-transaction scope inferred).\nRejected: logical dumps as the only backup: rejected (L220). fsync off: never (L223).\nRealizes: ALLOCATION.RECORD.1 (the system of record survives loss). High availability is deferred (MAINTAIN.7).\n\nMD-10: aligned with software-development-philosophy:OPERATION.RECOVERY.1, OPERATION.RECOVERY.3, OPERATION.RECOVERY.4 and ASSURANCE.AVAILABILITY.4 by MD-10. The Decision lines above that make point-in-time recovery the default, place the repository 'on another host' and rehearse restores 'on a schedule' are superseded; the question's earlier gap (objectives have no row) is closed by OPERATION.RECOVERY.1.\nReplaced positions: point-in-time recovery as the unconditional default; a repository on another host as the independence rule; restores rehearsed on a schedule.\nRejected: point-in-time recovery as an unconditional default: still best for the shared system of record whenever the objective on data loss is shorter than the interval between base backups, the usual case for business data of several consumers (inferred). A repository on another host as the independence rule: sufficient only where that host cannot be reached with production credentials and no single credential can delete every copy. A schedule without automation or fixed criteria: acceptable only where the recovery objectives are loose and the data can be recreated (inferred).\nKept: strict archive command, archiving tested before the first base backup, logical dumps for portability only, configuration in version control, fsync and synchronous_commit rules. High availability stays deferred (MAINTAIN.7)."
  epistemic_state: 'known: MD-10 | unvalidated: per-transaction synchronous_commit scope; point-in-time recovery as the usual strategy for the shared system of record (inferred) | gap: the objectives'' values are set per project, none is given here; no tool for the automated restore test is chosen'
- op: node.set
  uid: PIG-WEB-LOGIC.PROCESS.3
  intent: Every outbound call has a timeout and is retried at exactly one layer with bounded, backed-off, jittered retries and only when idempotent or keyed; a circuit breaker, with its state changes logged, guards a dependency called from the request path only where it fails slowly or is shared by many callers.
  constraints:
  - Every outbound call has a timeout shorter than its caller's remaining deadline.
  - Retries only for idempotent operations or calls carrying an idempotency key; exponential backoff with jitter.
  - 'One retrying layer: in the request path the outbound client retries within the request''s deadline, at most three attempts and a 10% retry budget per client; for deferred work the job runner is the one retrying layer, with a failed state that monitoring shows; HTTP client libraries do not retry beneath either layer.'
  - A circuit breaker, its state changes logged, only for an external dependency called from the request path that fails slowly or is shared by many callers; business errors are handled as business errors.
  - Foreign mutations carry keys and recovery points; database retries follow ENFORCE.2.
  - 'Forbidden: unbounded or immediate retries; retries at several layers; retrying a non-idempotent call without a key.'
  design_notes: "Positions: - P1 expect transient faults on calls to external services: bounded retries with increasing, spread delay, only for idempotent operations; fail fast with few retries in interactive requests, retry more in batch work (L243).\n  - P2 retry at one layer only; cap per-request and per-client retries (three attempts, a 10% retry ratio) (L244).\n  - P3 for persistent faults, fail fast with a circuit breaker and timeouts short enough to protect threads and connections; a breaker never replaces business exception handling (L245).\n  - P4 for calls that mutate foreign state, client-supplied idempotency keys and recorded recovery points (L246; one T3 source).\n\nForces: availability; correctness (no duplicated foreign effect); latency.\n\nDecision: 1. Every outbound call has a timeout shorter than its caller's remaining deadline (P3; \"shorter than the deadline\" inferred).\n  2. Retries only for idempotent operations or calls that carry an idempotency key (P1, P4, GUARD.6); exponential backoff with jitter.\n  3. **One retrying layer** (P2). In the request path, the outbound client retries within the request's deadline: at most three attempts and a 10% retry budget per client. Foreign mutations are not in the request path by default (PROCESS.2 step 3, review M4); request-path retries cover idempotent calls and the in-request phases PROCESS.2 admits under its condition. For deferred work, the job runner is the one retrying layer, with more attempts and growing delays, then a failed state that monitoring shows (PROCESS.1, L605). HTTP client libraries do not retry on their own beneath either layer.\n  4. A circuit breaker per external dependency called from the request path; business errors are handled as business errors (P3).\n  5. Foreign mutations carry keys and recovery points (P4, realized by PROCESS.2's atomic phases). Database retries (serialization failure, unknown commit) follow ENFORCE.2.\n\nRejected: unbounded or immediate retries: never (P1). Retries at several layers: never (P2). Retrying a non-idempotent call without a key: never (P1).\n\nRealizes: no skeleton link; follows ALLOCATION.ACT.2 and GUARD.6.\n\nMD-10: aligned with software-development-philosophy:ASSURANCE.AVAILABILITY.2 by MD-10. Decision item 4 above (a breaker per external dependency) is superseded.\nReplaced position: a circuit breaker on every external dependency called from the request path (P3 as adopted).\nRejected: a breaker on every external dependency: still best wherever a failing dependency can exhaust workers or connections despite its timeout, that is a dependency that fails slowly or is shared by many callers (inferred: with synchronous workers a slow dependency holds a worker until its timeout, TOPOLOGY.2). Elsewhere timeouts and the single retry layer bound the damage.\nKept: timeouts, one retry layer, retry budget, idempotency keys, recovery points."
- op: node.set
  uid: PIG-WEB-LOGIC.EXPOSE.7
  intent: 'The API evolves additively: CI fails on drift between description and implementation and on a breaking diff not released as a new version; where consumers are many, external or independently released, as in the default context (pages that outlive a deploy, agent clients), the JSON interface is served under `/v1` from the start and its major version does not change while every change is compatible; an unavoidable break ships as `/v2` beside `/v1` through a published window announced with `Deprecation` and `Sunset`. For few, in-house, reachable consumers released with the API, additive change and a coordinated deploy need no version numbers.'
  constraints:
  - CI fails on drift between the description and the implementation and on a breaking diff not released as a new version; contract tests cover behaviour; the written list of breaking changes is the diff's policy.
  - 'The gate and the compatibility window cover every interface description consumers read: the HTTP description, the function API catalogue and the agent tool surface.'
  - 'Versioning follows consumer reach. For many, external or independently released consumers the JSON is served under `/v1` from the start, its major version does not change while every change is compatible, and there is no minor version. For few, in-house, reachable consumers released together with the API, additive change and a coordinated deploy without version numbers is enough. The default context is the first case: pages open in browser tabs outlive a deploy, and agent clients run code the team does not release (inferred). HTML routes carry no version.'
  - 'An unavoidable break of a versioned interface: `/v2` beside `/v1`, both served through a published window, the old one announced with `Deprecation` and `Sunset`, a documentation link and the OpenAPI deprecated flag.'
  - Changes stay additive across a window at least as long as a page can live with a valid session (the absolute session timeout); clients tolerate unknown fields.
  - 'A new request field ships server first, then client: clients send it only once every server instance accepts it.'
  - 'Forbidden: unversioned JSON paths for consumers the team does not release together with the API.'
  design_notes: "Positions: - P1 check in CI that the implementation conforms to its OpenAPI description; design inside what OpenAPI can express (L273).\n  - P2 write down what counts as breaking: removing or renaming, a new required request field, a changed type, default, format or meaning (L274).\n  - P3 announce removal with `Deprecation` and `Sunset` headers, a documentation link, the flag in the OpenAPI file, and two versions coexisting during the transition (L275).\n  - P4 when a break is unavoidable, the version identifier sits in one agreed place; contested: a major version in the URL path (Google), a required dated `api-version` query parameter (Azure), media-type versioning (Zalando), a dated request header with account pinning (Stripe, GitHub), no version and continuous additive evolution (GraphQL) (L276).\n  - P5 an explicit skew policy: compatible changes within a window, clients tolerant of unknown fields, and either versioned paths or routing each client to the server version that served its code; contested, the routing option seen only in search snippets (L277).\n  - P6 a first-party browser client that ships with the server still sees skew, so changes stay additive across that window (L278; inferred).\n  - P7 a breaking-change diff of the description in CI (oasdiff); it covers the description only, behaviour needs contract tests (L547).\n  - Cited: MD-02 (always in sync, a CI gate on drift); L517 (the function API evolves additively without version numbers; its departure is counted once at J6's function-API node, X2: \"deployed together\" stays acceptable only when every consumer of the changed object ships in the same deployment as the migration; otherwise a breaking change goes expand, migrate, contract).\n\nForces: changeability without breaking clients; correctness of the contract.\n\nDecision: 1. **MD-02's gate**: CI fails on drift between description and implementation (P1) and on a breaking diff not released as a new version (P7); contract tests cover behaviour (P7); the written list of breaking changes (P2) is the diff's policy. The gate and the compatibility window cover every interface description consumers read: the HTTP description, the database function API catalogue and the agent tool surface (X7).\n  2. **Additive by default**: the JSON interface is served under `/v1` from the start, and its major version does not change while every change is compatible (review m5; L276's URL-path position, Google: MUST `v1`); no minor version (the discipline L517 sets for the function API, applied with X2's condition). HTML routes carry no version: their contract is the rendered page (EXPOSE.1).\n  3. **An unavoidable break**: `/v2` beside `/v1`, both served through a published window, the old one announced with `Deprecation` and `Sunset`, a documentation link and the OpenAPI deprecated flag (P3; P4's URL-path position).\n  4. **Skew** (P5, P6): one team owns both sides. Pages and islands opened before a deploy keep working because changes stay additive across a window at least as long as a page can live with a valid session, the absolute session timeout (SECURE.2), and clients tolerate unknown fields (inferred). Because request models are closed (EXPOSE.6), a new request field ships server first, then client: clients send it only once every server instance accepts it; otherwise a new island would get 422 from an old instance mid-deploy (review m4; L557, L278).\n\nRejected: - Media-type versioning: invisible in URLs, logs and agent tool calls, and caches must vary on `Accept` (inferred); acceptable when joining an ecosystem that uses it.\n  - A dated query parameter (Azure): acceptable when joining that ecosystem.\n  - A dated header with account pinning (Stripe, GitHub): acceptable when many external integrators must keep working indefinitely and the team can maintain transformations between versions (L276; condition inferred).\n  - Routing each client to its matching deployment: acceptable where the hosting offers it (P5; snippets only).\n  - Unversioned JSON paths until the first break: rejected, because they would leave unversioned paths beside `/v2` (review m5); \"no version\" stays acceptable for HTML routes.\n\nRealizes: no skeleton link; follows ALLOCATION.RECORD.3 and PIG-WEB-ALLOCATION.TYPE_CHAIN under MD-02 (proposed link to TYPE_CHAIN).\n\nMD-10: aligned with software-development-philosophy:ASSURANCE.CONTRACTS.1 (and CHANGE_FLOW.RELEASE.2: a version number promises compatibility only for a declared public interface consumed by others) by MD-10. Decision item 2 above and the rejection of unversioned paths are superseded where they differ.\nReplaced position: `/v1` from the start for every JSON interface, unversioned JSON paths forbidden until the first break.\nRejected: version numbers whatever the consumers: still best where consumers are many, external or independently released, as in the default context (pages open in tabs outlive a deploy, agent clients are not released by the team). Unversioned JSON with additive change and a coordinated deploy: acceptable for few, in-house, reachable consumers that deploy with the API; not the default context. The earlier rejection (unversioned paths would sit beside `/v2`) applies only to an interface that is versioned.\nKept: the MD-02 gate, the skew window, server-first field rollout, the deprecation signals."
  epistemic_state: 'known: MD-02 for the gate (X7: every interface description), MD-10 for versioning by consumer reach | unvalidated: the URL-path major version chosen among contested positions; the default context''s consumers counted as independently released (inferred); the skew window bound and server-first field rollout (inferred)'
- op: node.set
  uid: PIG-WEB-TRANSVERSE.EVOLUTION.1
  intent: Each backend is one deployable, split only where a named force requires it (independent scaling that process types cannot give, independent release by separate teams, fault isolation that matters, or a different runtime need) on a proven boundary; a split reaches data through the function API and moves no data. No BFF, no micro frontends and no request-time JavaScript server by default; likely future services get a domain schema, not a database.
  constraints:
  - Several backends may share the database (MD-03). Each backend is one deployable; it is not split into services without a measured need (web-app-philosophy:TRANSVERSE.EVOLUTION.3). The team's own backend is one Python deployable over the shared database; MD-03's several backends do not by themselves license splitting it. The schema and function API are the database owner's codebase and pipeline (web-app-philosophy:TRANSVERSE.OPERABILITY.3).
  - 'A further deployable is split only when a named force requires it: independent scaling that the process types of one deployable cannot give, independent release by separate teams, fault isolation that matters, or a different runtime need; on a proven boundary, with the distribution premium budgeted and the force stated in the ADR. It reaches the data through the function API with its own role (RECORD.2) and never holds a second system of record (RECORD.1).'
  - Because the data seam is already the function API, such a split moves no data; only deploy independence and the distribution premium remain to be weighed (web-app-philosophy:TRANSVERSE.EVOLUTION.3; inferred).
  - Likely future services get their own domain schema now, not their own database (MD-03).
  - 'No BFF deployable: the backend is the browser''s BFF. The agent surface is another client of the same core (RULES.4). Whether it needs its own process type is PIG-WEB-INTERACTION.AGENT''s decision.'
  - No micro frontends; server-side composition if teams multiply. No request-time JavaScript server (JS_SERVER).
  - Replacement at seams. Consolidation is legitimate when operating cost grows with the number of services.
  design_notes: "Rows: L113, L114, L115, L116, L117, L118, L119, L120, L121.\nPositions: - P1 one deployable first; split only on proven boundaries when the single unit is the bottleneck (L113, L114, L115, L116; majority).\n  - P2 services from the start when the domain is well known, the size needs distribution, and the parts develop and deploy independently (L117, Tilkov, contested).\n  - P3 consolidating services back is legitimate when operating cost grows with their number (L118, one T3 case).\n  - P4 replace at seams, never by big-bang rewrite (L119).\n  - P5 a Backend for Frontend only when aggregation or divergent clients justify it; with one browser client over one backend, the backend already is the BFF; an agent surface can be another client (L120).\n  - P6 micro frontends only when several teams are blocked by one frontend; server-rendered teams compose on the server (L121).\nForces: P1 serves changeability while the domain is unknown and saves the distribution premium (J5). P2 serves team independence on a known domain. P5 and P6 serve divergent clients and many teams, at the cost of more pipelines.\nDecision (lead): P1, P3, P4; no BFF and no micro frontends by default.\nRejected: P2: acceptable when all of L117's and L115's conditions hold (known domain, size, independent deploys, operational maturity). A BFF: wins with mobile and web clients or heavy aggregation (L120). Micro frontends: win when several teams are blocked by one frontend and can carry the extra pipelines (L121).\nRealizes: refines TRANSVERSE.EVOLUTION.3 (J5); rests on RECORD.1, RECORD.2, RULES.4, JS_SERVER.\nReview fixes: M3 and X5 (\"one Python backend deployable\" replaced: several backends may share the database, each backend one deployable, not split into services without a measured need; a later split moves no data, inferred).\n\nMD-10: aligned with software-development-philosophy:CONSTRUCTION.SYSTEM_SHAPE.1 by MD-10, through web-app-philosophy:TRANSVERSE.EVOLUTION.3. The condition 'size, complexity or the number of teams make the single unit the bottleneck' is superseded by the named forces.\nReplaced position: a split when size, complexity or the number of teams make the single unit the bottleneck.\nRejected: that bottleneck test as the only reason: still best as the trigger to look for a split, since a named force only matters once the single unit is the constraint; the force must then be named (inferred)."
- op: node.set
  uid: PIG-WEB-ALLOCATION.POSTGRES_FIRST
  constraints:
  - Postgres hosts the job queue, schedules, derived caches, sessions and documents until a measured limit for that role.
  - 'Each role names its trigger to leave Postgres: queue lock contention or backlog age; NOTIFY commit serialisation under write concurrency; cache latency or cache load on the primary.'
  - 'A move out of Postgres is a replacement: the Postgres implementation of that role is retired by plan, with an owner, or the ADR says why it replaces nothing (web-app-philosophy:TRANSVERSE.EVOLUTION.4).'
  - NOTIFY is a low-rate wake-up, never the message carrier.
  - 'Authority: Postgres per role.'
  - 'Forbidden: a second store written beside Postgres without staging.'
  design_notes: 'Positions: P1 one Postgres until a measured limit (L125, L534, L604); P2 specialised services from the start or past the limit (L126, L417, L457). Forces: changeability (fewer components) and correctness (backing roles share the data''s transaction) against scalability. Decision: P1. Rejected: P2, acceptable past a measured limit, or where the framework''s only production backend is a service (Django''s channel layer on Redis, L457). Moved by: write concurrency, queue volume, fan-out processes. Tension: none recorded. Evidence gaps: L125 rests on T4 sources and the T1 SKIP LOCKED page; thresholds for queue contention (L126) and NOTIFY (L127) are open.


    MD-10: a move of a role out of Postgres follows web-app-philosophy:TRANSVERSE.EVOLUTION.4, aligned with software-development-philosophy:EVOLUTION.TECHNOLOGY.1 by MD-10: the older implementation is retired by plan and owner, or the record states why it replaces nothing (for example a framework whose only production backend is a service).'
- op: node.set
  uid: PIG-WEB-TRANSVERSE.EVOLUTION.3
  intent: Every architecturally significant decision is a short, numbered Markdown ADR in the repository it governs, with context, decision, status, consequences, alternatives with confidence and the reversing condition; an accepted ADR is not rewritten to change its decision but superseded by a new one, and only corrections that do not change the decision edit it. Each decision the guideline leaves to the project (ASVS level, HSTS preload, secret delivery, build level, replication, CDN) gets one.
  constraints:
  - One ADR per significant decision, one to two pages, in the repository it governs, numbered, in Markdown. Decisions binding every consumer of the shared database live with the database's codebase (inferred).
  - 'Fields: context with forces, decision, status, consequences, the alternatives with pros and cons, the confidence, and the condition that would reverse it (web-app-philosophy:TRANSVERSE.EVOLUTION.1).'
  - 'An accepted ADR is not rewritten to change its decision: a changed decision is a new ADR that supersedes the old one, which stays in place marked superseded with a link to its successor. Only corrections that do not change the decision (a typo, a broken link) edit an accepted ADR.'
  - 'The guideline leaves these decisions to each project, and each gets an ADR: the interface origin direction (MD-02); row-level security under MD-01''s three conditions; the ASVS level and its outcome measures (SECURITY.1); each environment variable used for a secret, with its channel and reason, and the secret delivery in general (SECURITY.4); process replication (TOPOLOGY.3); the CDN (TOPOLOGY.4); HSTS preload, under its condition (SECURITY.2); adding a managed secret store under the assumed hosting (SECURITY.4); the build level, SLSA Build L2 or L3 by risk (SECURITY.5); every move of a Postgres-first role past its measured limit, with what it replaces and who retires it; every split of a deployable, with its named force (EVOLUTION.1).'
  design_notes: 'Rows: L129, L130, L131, L132, L133.

    Positions: (consensus, one majority): one short ADR per architecturally significant decision (L129); title, context, decision, status, consequences (L130); in the repository, lightweight markup, numbered (L131); never edited once accepted, superseded (L132); serious alternatives with pros and cons and the confidence (L133, majority).

    Forces: shared understanding of costly decisions (J5 EVOLUTION.1), at the cost of writing them.

    Decision (lead): all five, in the form J5 requires.

    Rejected: decisions kept only in code or chat: never (L105, J5). Editing an accepted record: never (L132).

    Realizes: refines TRANSVERSE.EVOLUTION.1 (J5).

    Review fixes: M6 (HSTS preload added to the per-project ADRs); with M5 and m6, the L2 build-level exception and the secret-store addition, which those fixes make per-project decisions.


    MD-10: aligned with software-development-philosophy:EVOLUTION.DECISIONS.4 by MD-10 (K11). The Rejected line above ''editing an accepted record: never'' and the constraint ''never edited'' are superseded.

    Replaced position: accepted ADRs are never edited, only superseded.

    Rejected: the absolute never-edit rule: still best where the ADR set must be a tamper-evident record (an audit or regulatory trail), where even a correction goes in a new record (inferred).

    Kept: a changed decision is a new record, the old one stays marked superseded with a link to its successor.

    The per-project list now also covers the build level (K4), each environment variable used for a secret (K3), the outcome measures beside the ASVS level (K12), the retirement owner of a replaced technology (K10) and the named force of a split (K9).'
- op: node.set
  uid: PIG-WEB-TRANSVERSE.SECURITY.1
  intent: 'ASVS 5.0 is the catalogue of verifiable security requirements, cited by versioned id, at a verification level recorded per project by risk: Level 2 by default, Level 3 for critical data, never Level 1. The level measures activity and coverage, not outcomes, so it is paired with outcome measures and never reported as proof that the system is safer. A catalogue without a recorded level cannot be verified, and the OWASP Top 10 stays an awareness map only.'
  constraints:
  - ASVS 5.0 is the catalogue. Requirements are cited by their versioned id in this guideline's traces and in the project's tests and reviews.
  - 'The level is a recorded decision per project, by risk (EVOLUTION.3; the source''s own rule). Default: Level 2, the level the ASVS 5.0 text says most applications should strive for (grounded). The MD-03 context fits it: the application holds business data of several consumers and accepts writes from humans and agents. Level 3 when a breach would be critical (payments, health, safety; the source''s "highest levels of security", the examples inferred). Level 1 is never the default, consistent with the source''s "starting point".'
  - 'The level measures activity and coverage, not security outcomes: it is recorded beside outcome measures chosen per project (for example open findings by severity and age, time to fix a vulnerability, incidents and their causes; examples inferred, no target values are given) and is never reported as proof that the system is safer.'
  - 'Each requirement is verified at the tier the placements name. Access control is checked where GUARD.3 puts it: writer functions for per-user write rules, the backend for product policy and identity, Postgres roles per consumer (MD-01, MD-03), database read functions for sensitive reads (MD-05); no access-control requirement is marked met on a stronger guarantee than that rule gives.'
  - Where a requirement has an automated check, it runs in the pipeline (OPERABILITY.6).
  design_notes: "Rows: L304 (ledger state open: level definitions and chapter list not read from a T1 source upstream). The level definitions are now read from the ASVS 5.0 text at tag v5.0.0 (by the TRANSVERSE review): Level 1 \"contains the minimum requirements ... a critical starting point\"; Level 2: \"Most applications should be striving to achieve this level of security\"; Level 3 \"should be the goal for applications looking to demonstrate the highest levels of security\"; and an organisation \"should analyze its risks and decide what level\". The chapter list stays unread.\nPositions: - P1 ASVS 5.0 as the catalogue of verifiable requirements, cited by versioned id (for example v5.0.0-1.2.5), at a verification level chosen by application risk (L304).\n  - P2 the OWASP Top 10 as the checklist (L303, owned by TRANSVERSE.SECURITY; J5 kept it as the awareness map only).\nForces: P1 serves verifiability (each property testable and traceable), at a cost scaled by the level. P2 serves awareness at low cost and is not testable.\nDecision (lead): P1, as J5 requires (a verifiable catalogue at a risk-chosen level).\nRejected: P2 as the requirement set: never; it stays the awareness map (L303, J5). A catalogue without a recorded level: never, since the level is what makes the claim verifiable.\nRealizes: refines TRANSVERSE.SECURITY (its verifiability decision); rests on GUARD.3, MD-01, MD-03.\nReview fixes: m1 (Level 2 default grounded in the ASVS 5.0 text; L304's level part moved from open to grounded; \"recorded per project by risk\" kept); m7 and X1 (one notation for the pending clause; default, fallback and consequence stated).\n\nMD-10: aligned with software-development-philosophy:TRANSVERSE.SECURITY.2 by MD-10 (K12).\nReplaced position: the recorded level alone as the verifiability claim.\nRejected: the level alone: acceptable as the reporting form where a contract or regulation demands the level as such; it is then reported as coverage, not as an outcome (inferred).\nKept: ASVS 5.0 as catalogue, Level 2 by default, Level 3 for critical data, never Level 1, requirements cited by id."
  epistemic_state: 'known: MD-05, MD-10 | gap: ASVS chapter list not read (L304''s level part now grounded); the outcome measures are chosen per project, none is given here'
- op: node.set
  uid: PIG-WEB-TRANSVERSE
  constraints:
  - 'security: ASVS 5.0 as the requirement catalogue, at a recorded level paired with outcome measures; TLS and the header set at one edge, HSTS preload only as a recorded decision; secrets from a managed store injected at runtime (an environment variable only as a recorded exception), a file fallback until a store exists; a pinned, scanned supply chain with signed build provenance verified before deploy (SLSA Build L3 where insider or credential-compromise risk matters);'
  - 'performance: Core Web Vitals at the 75th percentile as targets, budgets in the build;'
  - 'contracts: one verification per seam (catalogue diff and consumer suites for the function API, description checks for HTTP, scheduled tests for external doubles); meaning, owner and lifecycle recorded with each contract;'
  - 'operations: W3C trace context from the browser into the database transaction; the four golden signals plus the placement triggers; a security event log outside the application database; tests on real Postgres; a staged pipeline with migrations first;'
  - 'topology: one buffering reverse proxy; WSGI with sync workers, threaded workers, ASGI or a short timeout for routes with blocking external calls, ASGI where connections are long-lived; process manager per unit; static assets built once and served outside Python;'
  - 'evolution: several backends may share the database, each backend one deployable, not split into services without a measured need; modular by business concept, every module reaching data through the function API, never another domain''s tables; decisions in ADRs.'
- op: node.set
  uid: PIG-WEB-TRANSVERSE.SECURITY
  intent: Security is verified against ASVS 5.0 at a recorded level paired with outcome measures, with HTTPS terminated at the proxy, a strict nonce-based CSP rolled out report-only first, secrets held in a managed store per consumer role and injected at runtime (file fallback until one exists), and a pinned, scanned supply chain with signed, verified build provenance whose level follows the risk. The point is that each security property is testable and has one owner.
  constraints:
  - ASVS 5.0 as the verifiable catalogue at a recorded level (Level 2 by default, grounded in the ASVS 5.0 text), paired with outcome measures; the level measures coverage, not outcomes.
  - HTTPS terminated at the proxy, HSTS with a long max-age on the application's host, includeSubDomains once its subdomains serve HTTPS, preload only as a recorded decision.
  - a strict nonce-based CSP rolled out report-only first, plus a small header baseline.
  - secrets held in a managed store, per consumer role, rotated and audited, injected at runtime as a mounted file or through the store's interface, an environment variable only as a recorded exception, with a file fallback in force until a store is added on self-managed hosting (MD-06).
  - dependencies pinned with hashes, an SBOM scanned continuously, signed provenance from a hosted build platform verified before deploy (SLSA Build L2 as the floor, Build L3 where insider or credential-compromise risk matters or the software is distributed).
- op: node.set
  uid: PIG-WEB-TRANSVERSE.EVOLUTION
  constraints:
  - Several backends may share the database (MD-03); each backend is one deployable, not split into services without a measured need.
  - The team's Python backend is one deployable over the shared database, with the schema and function API as the database owner's codebase.
  - 'The backend is modular by business concept, its modules aligned with domain schemas and their boundaries checked automatically: no module touches another domain''s tables, every module may call the function API within its role''s grants, and a cross-domain business operation is one database function.'
  - Every architecturally significant decision, the per-project ones the guideline leaves open included (HSTS preload among them), is a short ADR, superseded rather than rewritten.
- op: node.set
  uid: PIG-WEB-LOGIC.SECURE
  intent: 'The Python backend is the one gate every caller passes and decides nothing on the caller''s word: access is checked by one central policy module, humans hold an opaque server-side session in Postgres after a delegated OpenID Connect login with MFA offered and required by privilege and risk level, every CSRF layer is applied, no credential travels in a URL, consumption is bounded at the proxy and per identity, and fetches of client-named URLs reach only allowed destinations, never internal addresses.'
  constraints:
  - Access checks are central, deny by default and object level; the backend's checks are kept in full because row-level security is off (MD-01).
  - Humans hold an opaque, revocable, server-side session in Postgres; the `SameSite` value of its cookie is Lax plus a cross-site navigation check, Strict for operator consoles (MD-07).
  - No session token, bearer token or long-lived credential ever travels in a URL; the signed upload policy and the signed download URL are the stated exceptions.
  - Agents hold short-lived, audience-bound, revocable tokens.
  - 'Limits apply at two depths: identity-blind at the proxy, identity-aware per identity and operation in the backend.'
  - 'Server-side fetches of client- or agent-named URLs reach only allowed destinations: a host allowlist where the hosts are known, a refusal of private, loopback and link-local addresses where users may name any public host.'
- op: node.set
  uid: PIG-WEB-INTERACTION.AGENT.2
  constraints:
  - Publish protected-resource metadata and answer unauthenticated calls with WWW-Authenticate carrying resource_metadata.
  - Agent clients prove who they are through OAuth client identity or signed requests, never a User-Agent string; this identity keys the per-agent quota (.5) and the agent marking in data (.3).
  - Client ID metadata documents first; dynamic client registration kept only for compatibility; pre-registration for closed sets; consent per client and exact redirect URI matching always.
  - 'Only one-time codes travel in redirects: the authorization code in the redirect URL is single-use, short-lived and bound to the client by PKCE; no session token, bearer token or long-lived credential ever travels in a URL (web-app-philosophy:INTERACTION.ENVIRONMENT.6; PKCE binding inferred as the condition).'
  - Fetching a client's metadata document is a server-side fetch of a client-named URL through the fetch helper of PIG-WEB-LOGIC.SECURE.7; any public host may be named, so private, loopback and link-local ranges are refused and every redirect hop validated.
- op: node.set
  uid: PIG-WEB-LOGIC.EXPOSE
  constraints:
  - HTML for browsers; resource-oriented JSON under `/v1` from the start for programs and agents (versioning follows consumer reach, EXPOSE.7), with named resources, custom methods for state transitions and keyset continuation paging.
  - Errors are RFC 9457 problem details with stable types; function error codes map to them.
  - Idempotency by design or by key recorded with the effect; 202 status resources for long operations and foreign mutations.
  - Every response labelled for caches; application caches in Postgres.
  - One origin; CORS only for real cross-origin consumers.
  - Pydantic models at every entry; every interface description (OpenAPI 3.1, function catalogue, agent tool surface) in sync with the implementation, gated in CI.
  - Additive evolution under a CI gate; server first, then client for new request fields; a new major version only for an unavoidable break.
- op: node.set
  uid: PIG-WEB-DATA.MAINTAIN
  intent: Structure changes only through small, re-runnable, online-safe versioned migrations with a CI drift gate, and every change leaves trigger-written append-only history. Deletion is chosen per table from the reason the data is kept (the default is basic soft delete, MD-04), large data changes are human-run batched jobs, and recovery follows per-workload objectives and is proven by automated restore tests.
  constraints:
  - 'Migrations: structure changes only through small, re-runnable, online-safe versioned migrations, with incompatible changes as expand, migrate, contract and a CI gate against drift.'
  - 'Deletion, Retention and Partitioning: deletion is chosen per table from the reason the data is kept; the default is basic soft delete (MD-04).'
  - 'History Tables: every change leaves trigger-written, append-only history naming the consumer role and the claimed actor.'
  - 'Bulk Data Jobs: large data changes are human-run, batched, idempotent jobs with a convergence query.'
  - 'Backup and Recovery: recovery follows per-workload objectives (point-in-time recovery for the shared system of record, inferred), keeps a copy out of reach of production credentials and is proven by automated restore tests.'
  epistemic_state: 'known | gap: personal-data erasure and high availability: the web realization is deferred, the principle is owned by the software development guideline (MD-10)'
- op: node.set
  uid: PIG-WEB-DATA
  constraints:
  - 'Organize: normalized tables, scope-leading composite keys for scoped rows and identity keys elsewhere, precise column types, names that carry role and type, bounded JSON validated against schemas held in the database, schemas as domain namespaces, and every index justified by a query.'
  - 'Guard: every rule a declarative constraint can express is declared; one role per consumer with narrow grants and no DELETE; no row-level security by default (MD-01); triggers only for a closed list of atomic side records.'
  - 'Concurrency: Serializable with retry for every writing role, version checks on user-edited rows, transaction-scoped locks only, idempotent statements, commit-order-safe readers.'
  - 'Maintain: online-safe versioned migrations with a drift gate, deletion chosen per table (default basic soft delete), trigger-written append-only history, human-run bulk jobs under a checklist, recovery from per-workload objectives proven by automated restore tests.'
  - 'Derive: derived copies only with a sync plan and a drift guard, kept by a same-transaction trigger where any other writer exists; caches in classified, commented tables.'
  - 'Interface: the function API with its conventions and its compatibility rule, reached through a pooler with per-role limits and timeouts.'
