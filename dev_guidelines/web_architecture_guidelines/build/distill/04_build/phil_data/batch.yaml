  - build/research/14_thin_spots/result.md::THIN-C34
  - build/research/01_data_tier/result.md::DATA-C12
  - build/research/15_maintainer_doctrine/result.md::MAINT-C24
  - build/research/15_maintainer_doctrine/result.md::MAINT-C71
