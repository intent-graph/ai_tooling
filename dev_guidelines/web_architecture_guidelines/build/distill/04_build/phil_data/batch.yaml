- op: node.create
  uid: DATA.DERIVE
  name: Derived, Not Stored
  parent: DATA
  intent: 'Store the minimum and derive the rest: a value that is not stored cannot diverge from its facts. A stored derived value is a copy, kept only when computing on read is measured to be too costly, with a stated sync plan and drift guard.'
  epistemic_state: 'known | unvalidated: the order of options is inherited from DERIVE.1, where it is marked inferred; the trigger-first rule for same-transaction copies and the generated-column exception for stored predicates are inferred'
  constraints:
  - 'Compute on read by default: eligibility and other predicates over stored facts are computed, not stored.'
  - A derived outcome (an aggregate result) is stored as its own row, never folded into a state value. Where a state label must agree with such facts, the facts are written first and the label is flipped last by its single writer function.
  - 'A stored derived value is a copy, allowed only when computing on read is measured to be too costly, in this order: same-row values as generated columns; values that must change atomically with their source maintained in the same transaction, by a trigger, or by the writer function only when the source table admits no other writer; values that tolerate a stated staleness in cache tables with scheduled refresh or an invalidation queue.'
  - Each stored copy has the sync plan of DATA.ORGANIZE (recorded before it is built) and a drift guard.
  - A derived outcome or eligibility is never encoded as a state value or flag maintained by code. A stored predicate is acceptable only as a generated column, which cannot diverge, when an index or a consumer needs it stored.
  design_notes: |-
    Question: what is stored and what is derived from stored facts.
    Positions: P1 store the minimum and derive the rest: eligibility for serving is computed from the state plus the deletion marker, not stored; a derived outcome is its own row rather than a state value (L488 doctrine; agrees L072, SRC-304 T3). P2 store derived values for read performance: generated columns for same-row values (L176; SRC-142), derived summaries with a sync mechanism (L531, L532 doctrine), denormalization where measured (L168). P3 encode a derived outcome or eligibility as a stored state value or flag maintained by code (the practice L488 rejects).
    Forces: P1 serves integrity: a value that is not stored cannot diverge from its facts. P2 serves read performance and costs a sync mechanism and a drift risk (L532: triggers never diverge but cost write latency; scheduled refresh has a staleness window). P3 serves query convenience and creates a second, divergent statement of the same fact.
    Decision: realization of ALLOCATION.DERIVE.1 (J1), the doctrine being the max choice. Compute on read by default (L488, L072; DERIVE.1's first option). A derived outcome is a fact of its own; the facts-first, label-last order is L597 and L596 (J6's concurrency state-transition node). A stored derived value is a copy (RULES.1) in DERIVE.1's order: generated columns (L176); same-transaction maintenance by a trigger, or by the writer function only when the source table admits no other writer (L532; aligned with J6's review fix M2, since only what is bound to the table holds for every writer under MD-03); cache tables with scheduled refresh or invalidation queue (L532, L535, L536). Each copy has L469's sync plan and L533's drift guard. Mechanisms belong to J6 (defaults graph, denormalization and cache table nodes).
    Rejected: P2 as a default: rejected; acceptable when measured read cost requires it, under DERIVE.1's order, L469's sync plan and L533's drift guard. P3: never as code-maintained state; a stored predicate is acceptable only as a generated column, which cannot diverge, when an index or a consumer needs it stored (inferred from L176).
    Realizes: ALLOCATION.DERIVE.1 (keeps derived values in the tier and freshness the placement sets).
