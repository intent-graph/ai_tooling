- op: node.create
  uid: PIG-WEB-TRANSVERSE.CONTRACTS.1
  name: Contract Verification
  intent: 'One verification per seam: the function API gets a provider-side catalogue diff plus each consumer''s suite run against the candidate schema; HTTP and the agent tool surface stay in sync with their description under the drift gate and breaking-change diff; external-service doubles are tested on the supplier''s rhythm. Consumer-driven tests are not required for the team''s own browser islands.'
  parent: PIG-WEB-TRANSVERSE.CONTRACTS
  epistemic_state: 'known | unvalidated: consumer suites against the candidate schema; the catalogue gate extended to granted tables and columns | conflict: L560 contested, settled for the default context.'
  constraints:
  - '**Function API** (provider: the database owner; consumers: several backends, consoles, scripts that deploy separately, MD-03): provider side: the catalogue diff in CI fails on a removed function or an incompatible signature unless marked coordinated (DB_API, J1); the mark holds only for the contract phase of expand, migrate, contract, or when every consumer of the changed object ships in the same deployment as the migration (X2, J5); consumer side: each consumer''s typed wrappers are generated from the catalogue (TYPE_CHAIN), and each consumer''s integration suite runs against the candidate schema before a migration is promoted. That suite is its consumer contract: the union of what consumers use (L487) is executed, not assumed (L401, L559; mechanism inferred).'
  - '**Tables and columns granted to BI**: the same catalogue diff covers every object granted to a consumer role, so a removed or retyped granted column fails the gate (inferred extension of DB_API''s gate). The change then goes expand, migrate, contract (J5).'
  - '**HTTP interface to the team''s own browser code**: the OpenAPI description is kept in sync with the implementation by the MD-02 gate. A diff against the last released description fails on a breaking change inside the compatibility window (L009, J4). Island types are generated from it at build time (TYPE_CHAIN), so the compile is the consumer check. Consumer-driven tests are not required for this seam (L402); this settles L560 for the default context.'
  - '**Agents**: they run code the team does not control, so no consumer test can be collected. The description, its breaking-change diff and machine-readable deprecation signals are the whole contract (L634, L275; inferred). "Always in sync by process" and the compatibility window apply to every interface description agents read: the HTTP description and the agent tool surface (for example an MCP server''s tool list and schemas) both sit under the MD-02 drift gate and the breaking-change diff (X7).'
  - '**External services**: contract tests of the doubles run daily or on the supplier''s change rhythm; a failure opens a realignment task (L561).'
  design_notes: "Rows: L401, L402, L559, L560, L561. Cited: L487, L517, L634, L275.\nPositions: - P1 contract tests between independently deployed components; consumer-driven where a provider serves consumers (L401).\n  - P2 for one team's monolith: schema-based API checks plus a few consumer-driven tests suffice (L402, inferred).\n  - P3 consumer-driven tests for any client and front-end pair, even within one team (Pact, L560, contested).\n  - P4 schema checks and consumer contracts answer different questions, so use both (L559).\n  - P5 tests of external-service doubles run on the external service's rhythm, often daily; a failure opens a realignment task (L561).\nForces: P1, P3, P4 serve correctness at each seam; consumer contracts make hidden coupling explicit at the cost of a shared channel between teams (L487). P2 serves effort where both sides ship together. P5 serves catching supplier drift without blocking every commit.\nDecision (lead): one verification per seam, both questions of L559 answered wherever consumers deploy separately.\nRejected: - P3 for the team's own browser islands: wins when the browser client is a separately deployed application or is built by another team, or when several independently released clients consume the same endpoints (L560's condition).\n  - P2 for the function API: rejected because its consumers deploy separately (MD-03); a few tests do not cover the union of what they use.\n  - Consumer contracts as the origin of the provider's contract: never (L487, J5).\nRealizes: refines TRANSVERSE.CONTRACTS (provider authoritative, consumer contracts as tests); rests on DB_API (catalogue gate), TYPE_CHAIN, RECORD.3, MD-02.\nReview fixes: X7 (the agent tool surface under the MD-02 sync gate and the compatibility window); M1 and X2 (what the \"coordinated\" mark requires, word for word)."
  impl_pointers:
  - build/distill/03_judge/J9_pig_transverse/records.md::PIG-WEB-TRANSVERSE.CONTRACTS.1
  - build/research/06_operations/result.md::OPS-C28
