- op: node.create
  uid: PIG-WEB-TRANSVERSE.EVOLUTION.1
  name: Deployables
  intent: Each backend is one deployable, split only on a proven boundary where the single unit is the bottleneck; a split reaches data through the function API and moves no data. No BFF, no micro frontends and no request-time JavaScript server by default; likely future services get a domain schema, not a database.
  parent: PIG-WEB-TRANSVERSE.EVOLUTION
  epistemic_state: 'known | conflict: L117 (services first) contested, rejected as default | unvalidated: future services as domain schemas (MD-03); a split moves no data.'
  constraints:
  - Several backends may share the database (MD-03). Each backend is one deployable; it is not split into services without a measured need (X5, J5 EVOLUTION.3). The team's own backend is one Python deployable over the shared database; MD-03's several backends do not by themselves license splitting it. The schema and function API are the database owner's codebase and pipeline (J5 OPERABILITY.3).
  - A further deployable is split only when size, complexity or the number of teams make the single unit the bottleneck, on a proven boundary (L113, L114). It reaches the data through the function API with its own role (RECORD.2) and never holds a second system of record (RECORD.1).
  - Because the data seam is already the function API, such a split moves no data; only deploy independence and the distribution premium remain to be weighed (J5 EVOLUTION.3; inferred).
  - Likely future services get their own domain schema now, not their own database (L116 read with MD-03 and L513; J5).
  - 'No BFF deployable: the backend is the browser''s BFF. The agent surface is another client of the same core (L120; RULES.4). Whether it needs its own process type is PIG-WEB-INTERACTION.AGENT''s decision.'
  - No micro frontends; server-side composition if teams multiply (L121). No request-time JavaScript server (JS_SERVER).
  - Replacement at seams (L119). Consolidation is legitimate when operating cost grows with the number of services (L118).
  design_notes: "Rows: L113, L114, L115, L116, L117, L118, L119, L120, L121.\nPositions: - P1 one deployable first; split only on proven boundaries when the single unit is the bottleneck (L113, L114, L115, L116; majority).\n  - P2 services from the start when the domain is well known, the size needs distribution, and the parts develop and deploy independently (L117, Tilkov, contested).\n  - P3 consolidating services back is legitimate when operating cost grows with their number (L118, one T3 case).\n  - P4 replace at seams, never by big-bang rewrite (L119).\n  - P5 a Backend for Frontend only when aggregation or divergent clients justify it; with one browser client over one backend, the backend already is the BFF; an agent surface can be another client (L120).\n  - P6 micro frontends only when several teams are blocked by one frontend; server-rendered teams compose on the server (L121).\nForces: P1 serves changeability while the domain is unknown and saves the distribution premium (J5). P2 serves team independence on a known domain. P5 and P6 serve divergent clients and many teams, at the cost of more pipelines.\nDecision (lead): P1, P3, P4; no BFF and no micro frontends by default.\nRejected: P2: acceptable when all of L117's and L115's conditions hold (known domain, size, independent deploys, operational maturity). A BFF: wins with mobile and web clients or heavy aggregation (L120). Micro frontends: win when several teams are blocked by one frontend and can carry the extra pipelines (L121).\nRealizes: refines TRANSVERSE.EVOLUTION.3 (J5); rests on RECORD.1, RECORD.2, RULES.4, JS_SERVER.\nReview fixes: M3 and X5 (\"one Python backend deployable\" replaced: several backends may share the database, each backend one deployable, not split into services without a measured need; a later split moves no data, inferred)."
