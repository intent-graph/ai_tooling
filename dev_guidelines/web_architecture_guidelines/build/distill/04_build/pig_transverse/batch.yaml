- op: node.create
  uid: PIG-WEB-TRANSVERSE.TOPOLOGY.1
  name: Reverse Proxy Edge
  intent: One reverse proxy is the only public entry, buffering requests and responses (except streaming routes), setting Host and the forwarded scheme itself, and carrying TLS, compression, static files and the outermost request limits. The application trusts forwarded headers only from the proxy, validates Host, and listens on a unix socket or private address.
  parent: PIG-WEB-TRANSVERSE.TOPOLOGY
  epistemic_state: 'known | unvalidated: buffering off on streaming routes | gap: proxy-to-app re-encryption across a network hop open (L140).'
  constraints:
  - The proxy is the only public entry; the application listens on a unix socket or a private address (L137, L140; L091, J3).
  - It buffers requests and responses (L135), except on streaming routes (SSE, streamed agent responses), where buffering is turned off so events are not held back (inferred).
  - It sets Host and the forwarded scheme itself, overwriting any client copy (L136, L138). The application trusts forwarded headers only from the proxy's address (L137) and validates Host against its allowed list (L139).
  - It carries TLS (SECURITY.2), compression (TOPOLOGY.4), static files and the outermost request limits (J3, LOGIC.SECURE).
  - 'Product choice by hosting model. Criteria: full buffering, automatic certificates or a tested ACME client (L143), forwarded-header control. No source ranks them (L134).'
  design_notes: "Rows: L134, L135, L136, L137, L138, L139, L140.\nPositions: - P1 one reverse proxy as the single public entry: nginx, Caddy, Traefik, HAProxy or a cloud load balancer (L134, majority: required for sync workers, advice for ASGI).\n  - P2 the ASGI server facing clients directly (Uvicorn can, L134 positions).\n  - Consensus: buffer request and response (L135); pass original Host and scheme (L136); trust forwarded headers only from the proxy, app reachable only through it (L137); the framework reads the scheme from the proxy header, which the proxy overwrites (L138); Host validated at proxy and framework (L139); a unix socket on a shared host (L140).\nForces: P1 serves protection against slow clients, one place for TLS and limits, and header hygiene, at the cost of one component. P2 serves one component fewer.\nDecision (lead): P1 with every consensus practice, for WSGI and ASGI alike.\nRejected: P2: acceptable only in local development (L091, J3).\nRealizes: refines LOGIC.PROCESS (P6: the application never faces the internet)."
