- op: node.create
  uid: PIG-WEB-TRANSVERSE.TOPOLOGY.4
  name: Static Assets and CDN
  intent: Assets are built once into the release artifact with fingerprinted names and served by the proxy with long-lived immutable caching and compression; fingerprinted files of previous releases stay available for the compatibility window. A CDN is added only when users are distant or origin load justifies it, and micro-caches only anonymous, nonce-free responses.
  parent: PIG-WEB-TRANSVERSE.TOPOLOGY
  epistemic_state: 'known | unvalidated: cumulative asset store across the compatibility window; CDN threshold (L165).'
  constraints:
  - Assets are built and collected once into the release artifact (L101, L162), with fingerprinted names (L163). The proxy serves them with long-lived immutable caching and compression (L166, L167).
  - Fingerprinted files of previous releases stay available for the compatibility window, as long as an old page can stay open (L009, J4 hand-off). The asset store is cumulative across releases and pruned after the window (inferred).
  - A CDN is added when users are distant or origin load justifies it (L165). It caches fingerprinted files for the long term. It micro-caches only anonymous responses carrying no nonce and no personal data (L166; SECURITY.3; J4).
  design_notes: "Rows: L161, L162, L163, L164, L165, L166, L167. Cited: L009, L101.\nPositions: - Where to serve (L161, majority): P1 from the proxy on the application host; P2 a dedicated static server; P3 object storage behind a CDN; P4 in-app (WhiteNoise-style) behind a CDN (L164, single T3).\n  - Consensus: collect into one directory, serve outside Python request handlers (L162); hashed file names rewritten inside CSS and JS (L163); compress at proxy or CDN (L167).\n  - CDN: optional, added for distant users or origin load (L165, threshold inferred); long-term caching of fingerprinted files, seconds-long micro-caching of anonymous dynamic responses, hit ratio watched (L166).\nForces: P1 serves simplicity on one region. P3 serves distant users and origin load, at the cost of another service. P4 serves platforms without a proxy, and needs a CDN in front.\nDecision (lead): P1 by default, with fingerprinting, compression and a kept asset history.\nRejected: P3: wins when users are geographically distant or origin load is measured too high (L165). P4: acceptable on a platform without a proxy, always behind a CDN (L164). Serving static files through Python handlers without a CDN: never in production (L162).\nRealizes: refines LOGIC.PROCESS through TOPOLOGY; realizes J4's hand-offs from INTERACTION.ENVIRONMENT.3 and .4."
