- op: node.create
  uid: PIG-WEB-TRANSVERSE.SECURITY.5
  name: Supply Chain
  intent: Every artifact the system runs has hash-pinned dependencies, an SBOM scanned continuously, components from official sources, and signed build provenance at SLSA Build L3 verified before deploy. Build L2 is acceptable only when the build platform cannot isolate runs or keep the signing key from the build steps.
  parent: PIG-WEB-TRANSVERSE.SECURITY
  epistemic_state: 'known | unvalidated: extensions and JavaScript lockfile practice by extension of L354.'
  constraints:
  - 'Python: lockfile with hashes, --require-hashes over the whole tree (L354). JavaScript build dependencies: lockfile, installed from it exactly (L354; per-ecosystem flag inferred). Container base images pinned (L156).'
  - SBOM per release artifact, scanned continuously, not only at build (L355). Updates go through the staged pipeline, then a staged or canary rollout (L356, OPERABILITY.6).
  - 'Provenance: signed provenance at SLSA Build L3, verified before deploy: a hardened build platform where runs cannot influence one another and the signing secrets are out of the build steps'' reach. L357 sets Build L2 as the floor; its source SRC-242 (the SLSA v1.0 levels page) describes Build L3 as "Intended for: Most software releases", while noting it "usually requires significant changes to existing build platforms". Under the max rule L3 is the target for the node''s purpose, the integrity of what runs.'
  - 'Database extensions and the Postgres packages come from official sources at a pinned version (inferred: Postgres hosts the queue scheduler and other backing roles, POSTGRES_FIRST and JOB_HOST).'
  design_notes: "Rows: L354, L355, L356, L357.\nPositions: (consensus): lockfiles, and for Python hash-checked installs covering transitive dependencies, optionally binary-only (L354); an SBOM of direct and transitive dependencies, scanned continuously (L355); components only from official sources over secure links, signed where possible, updates rolled out in stages (L356); verifiable build provenance, at least SLSA Build L2 from a hosted build platform, verified before use (L357).\nForces: integrity of what runs, at the cost of pipeline work. No position opposes them.\nDecision (lead): all four, on every artifact the system runs.\nRejected: - Build L2 as the target: acceptable when the build platform cannot isolate runs or keep the signing key from the build steps (L357, SRC-242).\n  - Unpinned installs, builds on developer machines, scanning only at release: none wins in this context.\nRealizes: refines TRANSVERSE.SECURITY (A03 owner, and the pipeline half of the A08 owner: signed provenance, trusted sources, J5 after review); rests on OPERABILITY.3 of J5 (one immutable artifact).\nReview fixes: M5 (Build L3 as the target, L2 under its condition; the \"levels above L2 not weighed\" gap removed: the evidence is in the cited source); M4 (A08 pipeline owner named)."
