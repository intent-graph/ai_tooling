- op: node.create
  uid: PIG-WEB-TRANSVERSE.TOPOLOGY.3
  name: Process Placement
  intent: One non-root, pinned image per release serves web, worker and admin processes with the same config. Under the assumed hosting (self-managed hosts, no orchestrator) each unit runs a process manager with several workers, workers run as extra units on the web host and a supervisor runs everything unprivileged; with an orchestrator, one server process per container wins.
  parent: PIG-WEB-TRANSVERSE.TOPOLOGY
  epistemic_state: 'known | conflict: L157 contested, settled by hosting model | unvalidated: hosting assumption (Q1); roles per kind of process.'
  constraints:
  - One image per release, multi-stage, non-root, pinned base (L156). Web, worker and admin processes all start from it with the same config (L160).
  - 'Under the assumed hosting (one or a few self-managed hosts, no orchestrator; questions.md, Q1): each unit runs a process manager with several workers (P1, L152). Workers run as extra units on the web host (P3). A supervisor runs everything as an unprivileged account (L158).'
  - Admin consoles and scripts run from the same release image with the operator role's credentials. Migrations and human-run data jobs use the owner role under L545 (J1 access paths; inferred).
  - The choice is recorded per project (L157; EVOLUTION.3).
  design_notes: "Rows: L156, L157, L158, L159, L160.\nPositions: - Images: staged builds, non-root, pinned base, minimal context (L156).\n  - Replication (L157, contested): P1 a process manager inside the unit (Gunicorn with workers, or Uvicorn --workers) for a single server or Compose; P2 one server process per container, replicated by an orchestrator or platform.\n  - Supervisor, unprivileged account (L158).\n  - Workers: P3 extra units on the web host; P4 separately scaled containers or services (L159, synthesis).\n  - Workers and admin processes from the same release image, code, dependencies and config; admin code ships with the application (L160).\nForces: P1 serves crash containment inside a unit without an orchestrator (L152). P2 serves replication and scaling by the platform (one concern per container, L092), at the cost of running an orchestrator. P3 serves simplicity; P4 serves scaling jobs apart from web load.\nDecision (lead): the image and supervision practices; P1 and P3 under the assumed hosting.\nRejected: P2: wins when an orchestrator or platform replicates containers; then each container runs one server process (L157). P4: wins when job load differs from web load enough to scale apart, measured (L159).\nRealizes: refines LOGIC.PROCESS (process types, supervisor, one concern per container); rests on the J1 access paths (roles per kind of process)."
