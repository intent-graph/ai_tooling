- op: node.create
  uid: PIG-WEB-TRANSVERSE.TOPOLOGY.2
  name: Application Server
  intent: Request work is served by WSGI with Gunicorn sync workers; long-lived connections run on Uvicorn ASGI as their own process type; routes making blocking external calls (the login code exchange, external reads, model calls) use threaded workers, the ASGI type or a short timeout. Python is the only request-time server runtime, and the connection budget covers every database consumer.
  parent: PIG-WEB-TRANSVERSE.TOPOLOGY
  epistemic_state: 'known | unvalidated: Gunicorn and Uvicorn as defaults (L150); a separate ASGI process type; total connection budget across consumers; worker type or timeout for routes with blocking external calls.'
  constraints:
  - WSGI with Gunicorn sync workers serves request and response work (L149, L150, L153). Foreign effects run in workers through the outbox (ACT.2, ACT.3), not in the request, so sync workers fit most of the request path (inferred).
  - 'Some external calls stay in the request: the code-for-token exchange of GUARD.4''s backend-for-frontend login, external reads, and model calls on an agent surface. Routes that make such blocking external calls run with threaded workers or on the ASGI process type, or carry a short timeout (L153: threaded or async workers "for long blocking external calls"; inferred).'
  - Long-lived connections (real-time channels, streamed agent responses) run on an ASGI server, Uvicorn (L149, L455). They run as their own process type routed by the proxy, so request work keeps the sync workers' isolation (inferred from L153 and L087). Whether the product needs them is PIG-WEB-INTERACTION's decision.
  - Worker count starts at (2 x cores) + 1 and is tuned by measurement (L154). Memory and connections are budgeted per host (L155). Under MD-03 the connection budget covers every consumer of the database, all backends, BI and operators included; pooling is PIG-WEB-DATA.INTERFACE.2's (inferred link).
  - Workers stop gracefully on SIGTERM (L088, J3). The development server never runs in production (L151).
  - The Python server is the only request-time server runtime. JavaScript runs at build time only (JS_SERVER).
  design_notes: "Rows: L149, L150, L151, L152, L153, L154, L155. Cited: L455, L088.\nPositions: - P1 WSGI by default; ASGI when the application needs long-lived connections or native async I/O; ASGI hosts WSGI, so the choice is reversible (L149).\n  - P2 the whole application on ASGI (the alternative L149 conditions).\n  - Server: Gunicorn for WSGI, Uvicorn for ASGI (L150, inferred default). The development server is never production (L151). A parent owns the socket and several workers (L152). Sync workers behind a buffering proxy; threaded or async workers for long blocking calls or streaming (L153). Start at (2 x cores) + 1 and tune (L154). Memory budget: footprint times workers plus database connections, 50 to 90% use (L155).\n  - Skeleton link: constrains JS_SERVER (a JavaScript server is one more runtime tier).\nForces: P1 serves fault isolation and simple synchronous code. P2 serves one server for request and connection work; threads and async lose some fault isolation (L153).\nDecision (lead): P1 with the consensus practices.\nRejected: P2: acceptable when most routes need native async I/O or long-lived connections, or when the chosen framework runs async end to end (L149). A request-time JavaScript server: rejected by JS_SERVER except under its condition.\nRealizes: constrains JS_SERVER (skeleton link); refines LOGIC.PROCESS (process types, disposability); rests on ACT.2 and ACT.3 (foreign effects off the request path) and GUARD.4 (the login's code exchange, in the request).\nReview fixes: m3 (routes making blocking external calls in the request, login included, run with threaded workers or on the ASGI process type, or carry a short timeout; inferred)."
