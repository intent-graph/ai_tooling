- op: node.create
  uid: PIG-WEB-TRANSVERSE.OPERABILITY.2
  name: Client Telemetry
  intent: Browser errors, field vitals and Reporting API reports come back stamped with release and trace id, sent with sendBeacon on visibilitychange; the rendered page carries the trace id of the request that produced it. The collection endpoint treats every event as untrusted input and collects no personal data.
  parent: PIG-WEB-TRANSVERSE.OPERABILITY
  epistemic_state: 'known | unvalidated: trace id injected into rendered pages; release and trace stamping (L382 inferred).'
  constraints:
  - The server-rendered page carries the trace id of the request that produced it. Client events and the fetches of islands carry it, or a child traceparent, so a browser error joins the server trace (L382, L370; injection into the page inferred). No dependence on browser OpenTelemetry (L377).
  - 'Errors: both global handlers (L378). Vitals: web-vitals, segmented as L381 says. Delivery: sendBeacon on visibilitychange (L379).'
  - A Reporting API endpoint receives CSP violations, deprecations, crashes and interventions (L380). It is the report sink of SECURITY.3's rollout.
  - 'The collection endpoint treats every event as untrusted input: validated, sanitised before logging (L395). It collects no personal data (L035).'
  design_notes: "Rows: L377, L378, L379, L380, L381, L382. Cited: L395, L035.\nPositions: (no competing position; one status caveat):\n  - Browser-side OpenTelemetry is experimental: do not depend on it alone; fall back to a propagated header plus real-user measurements (L377, fallback inferred).\n  - Uncaught errors through the window error event and unhandledrejection (L378).\n  - Send with sendBeacon from visibilitychange, fetch as fallback, about 64 KiB per payload (L379).\n  - Browser-detected problems through the Reporting API with Reporting-Endpoints; not failsafe, not guaranteed (L380).\n  - Field vitals with the web-vitals library, 75th percentile, segmented by device, connection and release, collecting only what is used (L381).\n  - Events stamped with release and trace or request id (L382, inferred).\nForces: visibility of what users experience and of client failures, at the cost of page weight and of an endpoint that receives untrusted data.\nDecision (lead): all six.\nRejected: browser OpenTelemetry as the only correlation path: never while it is experimental (L377). Sending on unload or beforeunload: never (L379).\nRealizes: refines TRANSVERSE.OPERABILITY (and the field truth of TRANSVERSE.PERFORMANCE); feeds PIG-WEB-TRANSVERSE.PERFORMANCE."
