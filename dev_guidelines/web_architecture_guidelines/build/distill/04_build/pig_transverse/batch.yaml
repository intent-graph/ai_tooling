operations:
- op: node.create
  uid: PIG-WEB-TRANSVERSE
  name: Transverse Defaults
  intent: 'The stack realizes each cross-tier property once and turns it into an automated gate wherever a check exists: ASVS-based security with one TLS edge and managed secrets, Core Web Vitals targets, one verification per contract seam, tracing from the browser into the database transaction, a buffering reverse proxy in front of WSGI workers, and decisions kept in ADRs. Several backends may share the database; each backend is one deployable, not split without a measured need.'
  parent: ROOT
  epistemic_state: 'known | gap: owns no row (roll-up).'
  constraints:
  - 'security: ASVS 5.0 as the requirement catalogue; TLS and the header set at one edge, HSTS preload only as a recorded decision; secrets from a managed store once one exists, a file fallback until then; a pinned, scanned supply chain with signed provenance at SLSA Build L3;'
  - 'performance: Core Web Vitals at the 75th percentile as targets, budgets in the build;'
  - 'contracts: one verification per seam (catalogue diff and consumer suites for the function API, description checks for HTTP, scheduled tests for external doubles); meaning, owner and lifecycle recorded with each contract;'
  - 'operations: W3C trace context from the browser into the database transaction; the four golden signals plus the placement triggers; a security event log outside the application database; tests on real Postgres; a staged pipeline with migrations first;'
  - 'topology: one buffering reverse proxy; WSGI with sync workers, threaded workers, ASGI or a short timeout for routes with blocking external calls, ASGI where connections are long-lived; process manager per unit; static assets built once and served outside Python;'
  - 'evolution: several backends may share the database, each backend one deployable, not split into services without a measured need; modular by business concept, every module reaching data through the function API, never another domain''s tables; decisions in ADRs.'
  design_notes: 'Rows: none (roll-up).

    Decision (lead): the roll-up of its five children. The stack realizes each cross-tier property of TRANSVERSE once, and turns it into an automated gate where a check exists (L110, J5):

    Realizes: refines TRANSVERSE (J5); through its children, ACT.4, JS_SERVER and LOGIC.PROCESS.

    Review fixes: children''s lines updated after B1 (X3), M3 (X5), M5, M6, m3, m6.'
  impl_pointers:
  - build/distill/03_judge/J9_pig_transverse/records.md::PIG-WEB-TRANSVERSE
- op: node.create
  uid: PIG-WEB-TRANSVERSE.SECURITY
  name: Security Defaults
  intent: Security is verified against ASVS 5.0 at a recorded level, with HTTPS terminated at the proxy, a strict nonce-based CSP rolled out report-only first, secrets held in a managed store per consumer role (file fallback until one exists), and a pinned, scanned supply chain with signed SLSA Build L3 provenance. The point is that each security property is testable and has one owner.
  parent: PIG-WEB-TRANSVERSE
  epistemic_state: 'known | gap: owns no row (roll-up).'
  constraints:
  - ASVS 5.0 as the verifiable catalogue at a recorded level (Level 2 by default, grounded in the ASVS 5.0 text).
  - HTTPS terminated at the proxy, HSTS with a long max-age on the application's host, includeSubDomains once its subdomains serve HTTPS, preload only as a recorded decision.
  - a strict nonce-based CSP rolled out report-only first, plus a small header baseline.
  - secrets held in a managed store, per consumer role, rotated and audited, with a file fallback in force until a store is added under the assumed hosting.
  - dependencies pinned with hashes, an SBOM scanned continuously, signed provenance at SLSA Build L3 verified before deploy, Build L2 acceptable when the build platform cannot isolate runs.
  design_notes: 'Rows: none (roll-up).

    Decision (lead): the roll-up of its five children: ASVS 5.0 as the verifiable catalogue at a recorded level (Level 2 by default, grounded in the ASVS 5.0 text); HTTPS terminated at the proxy, HSTS with a long max-age on the application''s host, includeSubDomains once its subdomains serve HTTPS, preload only as a recorded decision; a strict nonce-based CSP rolled out report-only first, plus a small header baseline; secrets held in a managed store, per consumer role, rotated and audited, with a file fallback in force until a store is added under the assumed hosting; dependencies pinned with hashes, an SBOM scanned continuously, signed provenance at SLSA Build L3 verified before deploy, Build L2 acceptable when the build platform cannot isolate runs.

    Realizes: refines TRANSVERSE.SECURITY (J5): realizes its transport, exposure and verifiability decisions and the A02 (misconfiguration), A03 (supply chain), A04 (transport: proxy TLS, database connection TLS) and A08 (integrity: signed provenance, trusted sources) owners.

    Review fixes: updated after m1, M4, M5, M6, m6.'
  impl_pointers:
  - build/distill/03_judge/J9_pig_transverse/records.md::PIG-WEB-TRANSVERSE.SECURITY
- op: node.create
  uid: PIG-WEB-TRANSVERSE.PERFORMANCE
  name: Page Experience Targets
  intent: Core Web Vitals at the 75th percentile, per device class and from field data, are the performance targets (LCP 2.5 s, INP 200 ms, CLS 0.1); build budgets per page type are the gate before release. A derived server budget of about 1 s for a page's server part is inferred, not source-stated.
  parent: PIG-WEB-TRANSVERSE
  epistemic_state: 'known | unvalidated: lab budgets limited to LCP, CLS and weight; derived server budget | gap: no source-stated server target; no agent-surface latency target.'
  constraints:
  - 'Targets: the "good" thresholds of L295 at the 75th percentile, per device class, from field data (OPERABILITY.2). They are the user-facing service level indicators of OPERABILITY.3.'
  - Build budgets per page type (L296) on the lab-measurable vitals (LCP, CLS) and on page weight. A build over budget fails or the page is optimised. INP is gated on field data after release (L015). SRC-174's numbers are not adopted (L296).
  - 'The server''s share of each page is visible: Server-Timing carries server and database time for authorised audiences (L376), joined to field data through the trace id (J5 whole path, inferred).'
  - 'Derived server budget (inferred from grounded rows, unvalidated): about 1 s at most for the server''s part of a page at the 75th percentile, and well under 1 s for an interaction''s request. Grounds: the HTML response (TTFB) is about 40% of LCP time (L297) against LCP''s 2.5 s (L295); 1 s keeps the flow of thought and 0.1 s feels instantaneous (L013); work over about 1 s is deferred (ACT.3, settled). Database time is part of this server share.'
  design_notes: "Rows: L295, L296. Cited: L015, L381, L376.\nPositions: - P1 Core Web Vitals as the targets, judged at the 75th percentile and split by mobile and desktop: LCP at most 2.5 s, INP at most 200 ms, CLS at most 0.1 (L295).\n  - P2 budgets per page type enforced in the build, for example Lighthouse CI (L296), with SRC-174's sample numbers (TTI under 5 s, 170 KB, 3G) tied to an old device baseline.\nForces: P1 serves what users experience, measured in the field, after release. P2 serves prevention before release; lab runs cannot measure INP (L015).\nDecision (lead): P1 as the target, P2 as the gate, both on Core Web Vitals.\nRejected: lab-only targets: acceptable before launch or while traffic is too low for a stable 75th percentile (J5). Averages: never (L381). The non-vitals timings of SRC-174 as targets: never (L296).\nRealizes: refines TRANSVERSE.PERFORMANCE (field truth, lab gate); feeds FORCES.3 and FORCES.4 through J5; rests on ACT.3 (deferral of work over about 1 s).\nReview fixes: m2 (derived server budget stated as unvalidated from L297, L295, L013 and ACT.3; the gap kept only for the agent surface and a source-stated server target)."
  impl_pointers:
  - build/distill/03_judge/J9_pig_transverse/records.md::PIG-WEB-TRANSVERSE.PERFORMANCE
  - build/research/04_presentation/result.md::UI-C26
  - build/research/06_operations/result.md::OPS-C21
  - build/research/04_presentation/result.md::UI-C31
  - build/research/04_presentation/result.md::UI-C27
  - build/research/06_operations/result.md::OPS-C20
  - build/research/13_web_principles/result.md::WEB-C15
  - build/research/14_thin_spots/result.md::THIN-C17
  - build/research/14_thin_spots/result.md::THIN-C18
  - build/research/06_operations/result.md::OPS-C17
- op: node.create
  uid: PIG-WEB-TRANSVERSE.CONTRACTS
  name: Contract Verification and Meaning
  intent: Every contract (function API, tables granted to BI, HTTP interface, agent tool surface, external services) has a verification matched to its seam, run in the pipeline, and a written meaning, owner and lifecycle. Breaking changes go expand, migrate, contract; lockstep is acceptable only when every consumer of the changed object ships in the same deployment as the migration.
  parent: PIG-WEB-TRANSVERSE
  epistemic_state: 'known | gap: owns no row (roll-up).'
  constraints:
  - Every contract of the default context has a verification matched to its seam and a written meaning, owner and lifecycle.
  - The contracts are the function API (several consumers), the tables and columns granted to BI, the HTTP interface (own browser code, agents), the agent tool surface and the external services.
  - Each verification runs in the pipeline.
  - Breaking changes follow J5's expand, migrate, contract; "deployed together" stays acceptable only when every consumer of the changed object ships in the same deployment as the migration.
  - This realizes the L517 narrowing, counted at PIG-WEB-DATA.INTERFACE.1 (J6), not here.
  design_notes: 'Rows: none (roll-up).

    Decision (lead): the roll-up of its two children. Every contract of the default context has a verification matched to its seam and a written meaning, owner and lifecycle. The contracts are the function API (several consumers), the tables and columns granted to BI, the HTTP interface (own browser code, agents), the agent tool surface and the external services. Each verification runs in the pipeline. Breaking changes follow J5''s expand, migrate, contract; "deployed together" stays acceptable only when every consumer of the changed object ships in the same deployment as the migration. This realizes the L517 narrowing, counted at PIG-WEB-DATA.INTERFACE.1 (J6), not here.

    Realizes: refines TRANSVERSE.CONTRACTS (J5); rests on RECORD.2, RECORD.3, DB_API, TYPE_CHAIN, MD-02.

    Review fixes: M1 and X2 (narrowing cited, condition word for word); X7 (agent tool surface listed among the contracts).'
  impl_pointers:
  - build/distill/03_judge/J9_pig_transverse/records.md::PIG-WEB-TRANSVERSE.CONTRACTS
- op: node.create
  uid: PIG-WEB-TRANSVERSE.OPERABILITY
  name: Operations
  intent: One W3C trace context runs from the browser through backend and workers into the database transaction, with logs, client telemetry and the four golden signals correlated to it. The security event log sits outside the application database, tests run on real Postgres, and a staged pipeline promotes one artifact with migrations released before the code that needs them.
  parent: PIG-WEB-TRANSVERSE
  epistemic_state: 'known | gap: owns no row (roll-up).'
  constraints:
  - One trace context runs from the browser through the backend and workers into the database transaction. Logs carry its ids on stdout.
  - Client errors and field vitals come back stamped with release and trace id.
  - Monitoring covers the four golden signals, the triggers that move the Postgres-first placements, and database load per consumer role.
  - The security event log sits outside the application database.
  - Tests run on real Postgres at the production version, rolled back by default; commit-time and concurrent behaviour, GUARD.2's concurrency rules included, is tested with committing sessions in a disposable database.
  - A staged pipeline promotes one artifact, with migrations released before the code that needs them.
  design_notes: 'Rows: none (roll-up).

    Decision (lead): the roll-up of its six judged children (OPERABILITY.7 deferred).

    Realizes: refines TRANSVERSE.OPERABILITY (J5); through OPERABILITY.4, ACT.4.

    Review fixes: test line updated after M2 (X4).'
  impl_pointers:
  - build/distill/03_judge/J9_pig_transverse/records.md::PIG-WEB-TRANSVERSE.OPERABILITY
- op: node.create
  uid: PIG-WEB-TRANSVERSE.TOPOLOGY
  name: Runtime Topology
  intent: One buffering reverse proxy is the only public entry and terminates TLS; a WSGI server with sync workers runs under a process manager, with threaded workers, ASGI or a short timeout for routes that make blocking external calls, and ASGI for long-lived connections. Web and worker processes start from one image under a supervisor; static assets are built once, fingerprinted and served outside Python.
  parent: PIG-WEB-TRANSVERSE
  epistemic_state: 'known | gap: owns no row (roll-up).'
  constraints:
  - One buffering reverse proxy is the only public entry, terminating TLS.
  - A WSGI server with sync workers runs under a process manager by default; routes that make blocking external calls in the request (the identity provider's code exchange at login included) run with threaded workers or on the ASGI process type, or carry a short timeout; ASGI serves long-lived connections.
  - Web and worker processes come from the same image, under a supervisor, as an unprivileged account.
  - Static assets are built once, fingerprinted and served outside Python, with a CDN added on a measured need.
  design_notes: 'Rows: none (roll-up).

    Decision (lead): the roll-up of its four children. One buffering reverse proxy is the only public entry, terminating TLS. A WSGI server with sync workers runs under a process manager by default; routes that make blocking external calls in the request (the identity provider''s code exchange at login included) run with threaded workers or on the ASGI process type, or carry a short timeout; ASGI serves long-lived connections. Web and worker processes come from the same image, under a supervisor, as an unprivileged account. Static assets are built once, fingerprinted and served outside Python, with a CDN added on a measured need.

    Realizes: refines LOGIC.PROCESS (J3: stateless disposable processes, proxy in front, process types, supervisor); through TOPOLOGY.2, JS_SERVER.

    Review fixes: worker line updated after m3.'
  impl_pointers:
  - build/distill/03_judge/J9_pig_transverse/records.md::PIG-WEB-TRANSVERSE.TOPOLOGY
- op: node.create
  uid: PIG-WEB-TRANSVERSE.EVOLUTION
  name: Evolution Defaults
  intent: 'Several backends may share the database, each backend is one deployable and is not split into services without a measured need. The backend is modular by business concept with automatically checked boundaries: no module touches another domain''s tables, the function API is reachable from every module within its role''s grants, and every significant decision is an ADR.'
  parent: PIG-WEB-TRANSVERSE
  epistemic_state: 'known | gap: owns no row (roll-up).'
  constraints:
  - Several backends may share the database (MD-03); each backend is one deployable, not split into services without a measured need.
  - The team's Python backend is one deployable over the shared database, with the schema and function API as the database owner's codebase.
  - 'The backend is modular by business concept, its modules aligned with domain schemas and their boundaries checked automatically: no module touches another domain''s tables, every module may call the function API within its role''s grants, and a cross-domain business operation is one database function.'
  - Every architecturally significant decision, the per-project ones the guideline leaves open included (HSTS preload among them), is a short ADR, superseded and never edited.
  design_notes: 'Rows: none (roll-up).

    Decision (lead): the roll-up of its three children. Several backends may share the database (MD-03); each backend is one deployable, not split into services without a measured need. The team''s Python backend is one deployable over the shared database, with the schema and function API as the database owner''s codebase. The backend is modular by business concept, its modules aligned with domain schemas and their boundaries checked automatically: no module touches another domain''s tables, every module may call the function API within its role''s grants, and a cross-domain business operation is one database function. Every architecturally significant decision, the per-project ones the guideline leaves open included (HSTS preload among them), is a short ADR, superseded and never edited.

    Realizes: refines TRANSVERSE.EVOLUTION (J5).

    Review fixes: updated after B1 (X3), M3 (X5) and M6.'
  impl_pointers:
  - build/distill/03_judge/J9_pig_transverse/records.md::PIG-WEB-TRANSVERSE.EVOLUTION
- op: node.create
  uid: PIG-WEB-TRANSVERSE.SECURITY.1
  name: Security Requirement Catalogue
  intent: 'ASVS 5.0 is the catalogue of verifiable security requirements, cited by versioned id, at a verification level recorded per project by risk: Level 2 by default, Level 3 for critical data, never Level 1. A catalogue without a recorded level cannot be verified, and the OWASP Top 10 stays an awareness map only.'
  parent: PIG-WEB-TRANSVERSE.SECURITY
  epistemic_state: 'known | gap: ASVS chapter list not read (L304''s level part now grounded) | undecided: awaiting maintainer, read visibility of rows with per-user rules when several backends share the database.'
  constraints:
  - ASVS 5.0 is the catalogue. Requirements are cited by their versioned id in this guideline's traces and in the project's tests and reviews (L304).
  - 'The level is a recorded decision per project, by risk (EVOLUTION.3; the source''s own rule). Default: Level 2, the level the ASVS 5.0 text says most applications should strive for (grounded). The MD-03 context fits it: the application holds business data of several consumers and accepts writes from humans and agents. Level 3 when a breach would be critical (payments, health, safety; the source''s "highest levels of security", the examples inferred). Level 1 is never the default, consistent with the source''s "starting point".'
  - 'Each requirement is verified at the tier the placements name. Access control is checked where GUARD.3 puts it: writer functions for per-user write rules, the backend for product policy and identity, Postgres roles per consumer (MD-01, MD-03). **Undecided: awaiting maintainer, read visibility of rows with per-user rules when several backends share the database** (not settled here). Recorded default: each backend filters these reads from one shared written specification, with a shared denial-test suite every backend runs. Database read functions that receive the verified actor are acceptable when a per-user read rule must hold for two or more backends. Consequence for verification: roles that may SELECT the base tables (reporting, operator) see every row, comments included, unless their own role is restricted; no access-control requirement is marked met on a stronger guarantee than this.'
  - Where a requirement has an automated check, it runs in the pipeline (OPERABILITY.6; L110).
  design_notes: "Rows: L304 (ledger state open: level definitions and chapter list not read from a T1 source upstream). The level definitions are now read from the ASVS 5.0 text at tag v5.0.0 (by the TRANSVERSE review): Level 1 \"contains the minimum requirements ... a critical starting point\"; Level 2: \"Most applications should be striving to achieve this level of security\"; Level 3 \"should be the goal for applications looking to demonstrate the highest levels of security\"; and an organisation \"should analyze its risks and decide what level\". The chapter list stays unread.\nPositions: - P1 ASVS 5.0 as the catalogue of verifiable requirements, cited by versioned id (for example v5.0.0-1.2.5), at a verification level chosen by application risk (L304).\n  - P2 the OWASP Top 10 as the checklist (L303, owned by TRANSVERSE.SECURITY; J5 kept it as the awareness map only).\nForces: P1 serves verifiability (each property testable and traceable), at a cost scaled by the level. P2 serves awareness at low cost and is not testable.\nDecision (lead): P1, as J5 requires (a verifiable catalogue at a risk-chosen level).\nRejected: P2 as the requirement set: never; it stays the awareness map (L303, J5). A catalogue without a recorded level: never, since the level is what makes the claim verifiable.\nRealizes: refines TRANSVERSE.SECURITY (its verifiability decision); rests on GUARD.3, MD-01, MD-03.\nReview fixes: m1 (Level 2 default grounded in the ASVS 5.0 text; L304's level part moved from open to grounded; \"recorded per project by risk\" kept); m7 and X1 (one notation for the pending clause; default, fallback and consequence stated)."
  impl_pointers:
  - build/distill/03_judge/J9_pig_transverse/records.md::PIG-WEB-TRANSVERSE.SECURITY.1
  - build/research/05_identity_security/result.md::SEC-C60
- op: node.create
  uid: PIG-WEB-TRANSVERSE.SECURITY.2
  name: Transport Security
  intent: TLS terminates at the single reverse proxy, with a permanent HTTP redirect, automated certificates, TLS 1.3 (1.2 for compatibility) and Secure cookies. HSTS carries a long max-age on the application's host, with includeSubDomains once its subdomains serve HTTPS; preload is a recorded decision only when the team controls the registrable domain, because it is slow to undo. Database connections across a network hop are encrypted and verified.
  parent: PIG-WEB-TRANSVERSE.SECURITY
  epistemic_state: 'known | unvalidated: staged HSTS ramp (L147); database connection encryption | gap: no row on Postgres connection TLS; proxy-to-app re-encryption open (L140).'
  constraints:
  - TLS terminates at the single reverse proxy (TOPOLOGY.1). The proxy redirects HTTP permanently and forwards only HTTPS-originated requests (L142). It obtains and renews certificates itself, or through a tested ACME client (L143). TLS 1.3, with 1.2 kept only for clients that need it (L144).
  - 'HSTS is sent on every HTTPS response, set in one place (L146). Default end state: a long max-age on the application''s host, reached by raising max-age in steps, with includeSubDomains once its subdomains serve HTTPS (L147). The HTTP redirect stays (L148).'
  - 'Preload is the target when the team controls the registrable domain and commits every subdomain, internal ones included, to HTTPS for the long term. It is recorded as an ADR (EVOLUTION.3) because removal from the preload list takes months to reach users. Grounds: the preload list''s operators advise "do not include the preload directive by default", and preloading covers every subdomain of the base domain, "including internal subdomains that are not publicly accessible" (hstspreload.org, read by the TRANSVERSE review); L147 calls the scope "a commitment". A web application often runs on a subdomain of a domain its team does not control. Preload stays the strongest protection of the first request (L148).'
  - Session and CSRF cookies are Secure; no subresource is loaded over HTTP (L145).
  - 'Proxy to application server: a unix domain socket on the same host (L140). Across a network hop, re-encryption is open (gap).'
  - Database connections that cross a network hop, from every consumer role (backends, BI, consoles, scripts), are encrypted and verify the server's certificate. Inferred from J5 TRANSVERSE.SECURITY (MD-03 adds consumers outside the request path); no row read on Postgres connection settings (gap).
  design_notes: "Rows: L141, L142, L143, L144, L145, L146, L147, L148.\nPositions: - P1 terminate TLS at the proxy or edge (L141, majority: FastAPI docs, Twelve-Factor routing, Uvicorn's layered setup).\n  - P2 terminate TLS in the Python server (Uvicorn documents certificate options, L141 positions).\n  - Consensus practices: HTTP to HTTPS permanent redirect at the proxy, only HTTPS-originated requests forwarded (L142); automated certificate issuance and renewal at about two thirds of validity (L143); TLS 1.3, 1.2 only for compatibility (L144); Secure cookies, no HTTP subresource (L145); HSTS on HTTPS responses only with max-age (L146); includeSubDomains and preload only after every subdomain serves HTTPS, max-age raised in steps (L147); the redirect stays because HSTS does not cover the first request (L148).\nForces: P1 serves one place for certificates, protocol policy and the edge limits (L091, J3), at the cost of a plaintext hop to the application server. P2 serves end-to-end encryption to the process, and spreads certificates over every application process. Preload serves the first request (L148); its cost is a commitment that breaks any subdomain still on HTTP (L147).\nDecision (lead): P1 with every consensus practice; HSTS on the application's host by default, preload as a recorded decision.\nRejected: - P2: acceptable when there is no proxy, which only local development allows (L091, J3).\n  - Preload as the default end state: rejected; it commits the whole registrable domain, internal subdomains included, and is slow to undo. It wins under the recorded condition above (team controls the registrable domain, long-term HTTPS commitment for every subdomain), as an ADR.\n  - HTTPS only on sensitive pages: never (L029, J5).\nRealizes: refines TRANSVERSE.SECURITY (transport; part of the A04 owner: the proxy's TLS and the database connection TLS); rests on LOGIC.PROCESS (proxy in front, J3) and GUARD.4 (Secure session cookie).\nReview fixes: M6 (default end state is HSTS with a long max-age on the application's host, includeSubDomains once subdomains serve HTTPS; preload only under its recorded condition, as an ADR); M4 (A04 transport owner named)."
  impl_pointers:
  - build/distill/03_judge/J9_pig_transverse/records.md::PIG-WEB-TRANSVERSE.SECURITY.2
  - build/research/09_runtime_topology/result.md::TOPO-C11
  - build/research/09_runtime_topology/result.md::TOPO-C12
  - build/research/09_runtime_topology/result.md::TOPO-C13
  - build/research/09_runtime_topology/result.md::TOPO-C14
  - build/research/09_runtime_topology/result.md::TOPO-C15
  - build/research/09_runtime_topology/result.md::TOPO-C17
  - build/research/09_runtime_topology/result.md::TOPO-C18
  - build/research/09_runtime_topology/result.md::TOPO-C19
- op: node.create
  uid: PIG-WEB-TRANSVERSE.SECURITY.3
  name: Security Headers and CSP
  intent: Every response carries a strict CSP with a fresh per-response nonce from the Python templates (hashes for build-time pages), rolled out report-only first, plus a baseline header set with obsolete headers removed. CSP is the second layer after template escaping; each header has one setter, and pages carrying a nonce are never stored in a shared cache.
  parent: PIG-WEB-TRANSVERSE.SECURITY
  epistemic_state: 'known | unvalidated: one setter per header; no shared caching of nonce pages.'
  constraints:
  - Python renders the HTML (PRESENT.1, JS_SERVER), so each response gets a fresh nonce from the server's templating engine (L336). Pages produced at build time use hashes for their inline scripts (L336, L285).
  - A page that carries a nonce is never stored in a shared cache, or the nonce would repeat across responses (inferred from L336; consistent with J4's no-store rule for personalised pages).
  - 'Rollout: Content-Security-Policy-Report-Only first, violations sent to a Reporting API endpoint (L380, OPERABILITY.2), fixed, then enforced (L335).'
  - 'The baseline headers of L337 are sent on every response, the obsolete ones removed. Each header has one setter: the application for CSP (it holds the nonce), the proxy for the static baseline so static files carry it too (inferred).'
  - CSP stays the second layer. Templates escape by default (L026, J4).
  design_notes: "Rows: L334, L335, L336, L337.\nPositions: - P1 a strict CSP: nonce or hash with strict-dynamic, object-src 'none', base-uri 'none', no unsafe-inline or unsafe-eval (L334).\n  - P2 an allowlist CSP (the alternative L334 ranks below P1).\n  - Rollout: report-only first, fix, then enforce (L335). Nonces unique per response, injected by a real templating engine; hashes for static inline scripts (L336).\n  - Baseline headers: HSTS, nosniff, Referrer-Policy, CSP frame-ancestors in place of X-Frame-Options, Permissions-Policy, COOP; remove X-XSS-Protection, Expect-CT, Server, X-Powered-By (L337).\nForces: P1 serves containment of injected script (the second layer after escaping, L026, J4), at the cost of nonce plumbing and refactoring inline handlers. P2 serves ease of adoption, and is bypassable through allowed hosts (L334's ranking).\nDecision (lead): P1, with nonces from the Python templates.\nRejected: P2: acceptable never as the target; tolerated only as a temporary step while inline handlers are removed (inferred). X-Frame-Options and X-XSS-Protection as protections: never (L337).\nRealizes: refines TRANSVERSE.SECURITY (A02); realizes INTERACTION.ENVIRONMENT.7's hand-off (J4); rests on PRESENT.1 and JS_SERVER (server-rendered HTML makes nonces available)."
  impl_pointers:
  - build/distill/03_judge/J9_pig_transverse/records.md::PIG-WEB-TRANSVERSE.SECURITY.3
  - build/research/05_identity_security/result.md::SEC-C45
  - build/research/05_identity_security/result.md::SEC-C47
  - build/research/05_identity_security/result.md::SEC-C48
  - build/research/05_identity_security/result.md::SEC-C49
- op: node.create
  uid: PIG-WEB-TRANSVERSE.SECURITY.4
  name: Secrets
  intent: A managed store is the authority for every secret, with least privilege per service and per database consumer role, automated rotation and audited access; secrets reach the process at start by file or a non-shared environment. Under the assumed hosting (self-managed hosts, no orchestrator) the store is a technology to add, and until then a file outside source control readable only by the service account is in force.
  parent: PIG-WEB-TRANSVERSE.SECURITY
  epistemic_state: 'known | conflict: L350 contested (environment variables against a managed store), reconciled by authority and delivery | unvalidated: the reconciliation; credentials per consumer role; the file fallback in force under the assumed hosting until a store is added.'
  constraints:
  - 'Every secret is held in one managed store: the platform''s secret store, or a secrets manager. Access is granted per service and per consumer role, least privilege, and every access is audited (L351).'
  - 'Each database consumer role of MD-03 has its own credentials: each backend, the reporting role, the operator role and the owner role (J1 access paths). They are rotated automatically; short-lived dynamic credentials are preferred where the store issues them (L351).'
  - 'Delivery: the secret reaches the process at start, as a file readable only by the service account or as an environment variable. The environment is acceptable when no other process can read it and the framework never dumps it (debug off, L250). It is reconciled from L350, inferred.'
  - The framework signing secret is held like any other, never committed, and rotated (L352).
  - 'CI/CD: least-privilege service accounts, secrets scoped per environment, none in pipeline output (L353).'
  - Secret-access logs are kept as long as obligations require, at least 90 days where none exists (L351 read with L048).
  design_notes: "Rows: L350, L351, L352, L353. Cited: L102, L250, L036.\nPositions: - P1 secrets in environment variables (Twelve-Factor: simple, language-neutral, portable; L350).\n  - P2 runtime injection from a managed store, with access control, rotation and audit (OWASP; L350, L351).\n  - Consensus: centralised storage, least privilege per service, short-lived dynamic secrets with automated rotation, every access audited with logs kept at least 90 days (L351); the framework signing secret kept confidential (L352); CI/CD treated as production (L353); secrets never in source (L102, L250).\nForces: P2 serves confidentiality, revocation and accountability (who read which secret), at the cost of a store to run or rent. P1 serves simplicity and portability; environment variables are visible to many processes and leak through dumps and error pages (L350). The positions answer two different questions: where the secret is held, and how it reaches the process.\nDecision (lead): P2 as the authority; delivery at process start by file or environment.\nRejected: P1 as the place where secrets are held: acceptable when no managed store exists on the platform and adding one is not budgeted (EVOLUTION.4). The secret then sits in a file outside source control, readable only by the service account (L250), and rotation is a scheduled task.\nUnder the assumed hosting: (self-managed hosts, no orchestrator; questions.md, Q1): there is no platform store, so the managed store is a technology to add, weighed under EVOLUTION.4 (J5: a new technology past a measured need, its operating cost budgeted). Until it is added, the file fallback above is in force. On a platform that offers a store, the store is the authority from the start.\nRealizes: refines TRANSVERSE.SECURITY (exposure, L036); rests on the J1 access paths (one role per consumer, MD-03).\nReview fixes: m6 (the default under the assumed hosting stated plainly: the store is a technology to add, the file fallback in force until then; folded into Q1)."
