- op: node.create
  uid: ALLOCATION.FORCES.4
  name: Latency
  intent: 'Latency is a design criterion from the start: count the round trips per interaction, browser to server and backend to database, and budget them against about 0.1 s, 1 s and 10 s and the field vitals targets. Latency justifies copies near the user, never authority; micro-optimisation waits for measurement.'
  parent: ALLOCATION.FORCES
  epistemic_state: known
  constraints:
  - Count round trips per interaction, browser to server and backend to database, at design time.
  - Budget interactions against about 0.1 s, 1 s and 10 s and the field vitals targets.
  - Latency justifies copies under RULES.1, never a move of authority.
  design_notes: |-
    Positions: one (L012, L013).

    Decision: latency is a design criterion from the start (L012). Count round trips per interaction, browser to server and backend to database (L614), and budget them against 0.1 s, 1 s and 10 s and the Web Vitals targets (L013). Latency justifies copies near the user under RULES.1, never authority. The round-trip structure is designed in; micro-optimisation waits for measurement.
  impl_pointers:
