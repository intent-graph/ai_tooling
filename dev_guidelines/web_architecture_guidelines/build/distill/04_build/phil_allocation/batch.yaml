- op: node.create
  uid: ALLOCATION.RULES
  name: Allocation Rules
  intent: 'Five rules turn forces and context into a placement and apply to every responsibility in the same order: who may decide at all (trust boundary), which end can complete it (end-to-end), one authority with safe copies, one core for every client, and atomicity ending at the transaction. The first two are the security and correctness vetoes of the forces.'
  parent: ALLOCATION
  epistemic_state: 'known | unvalidated: the order is mine'
  constraints:
  - 'Apply the rules in order: RULES.3, RULES.2, RULES.1, RULES.4, RULES.5.'
  design_notes: 'Decision: roll-up. The rules apply to every placement in this order: RULES.3 (who may decide at all) → RULES.2 (which end can complete it) → RULES.1 (one authority; copies carry staleness) → RULES.4 (one core for every client) → RULES.5 (atomicity ends at the transaction). The first two are the security and correctness vetoes of FORCES.'
  impl_pointers:
  - build/distill/03_judge/J1_allocation/records.md::ALLOCATION.RULES
- op: node.create
  uid: ALLOCATION.RECORD
  name: Data Authority Placements
  intent: The server database is the one system of record; consumers reach it through the function API and their own roles; each fact has one origin, and every interface description consumers read is kept in sync with the implementation by process.
  parent: ALLOCATION
  epistemic_state: known
  constraints:
  - One system of record.
  - One origin per fact.
  design_notes: |-
    Decision: roll-up. The server database is the one system of record; consumers reach it through the function API and their own roles; each fact has one origin and the interface description is always in sync with the implementation (MD-02).

    Changed (R1): function API default (MD-03); one origin per fact (F3); sync by process (MD-02).
  impl_pointers:
  - build/distill/03_judge/J1_allocation/records.md::ALLOCATION.RECORD
- op: node.create
