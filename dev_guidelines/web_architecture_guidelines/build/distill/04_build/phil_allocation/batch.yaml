  name: Filtering, Sorting, Paging and Search
  intent: The database reduces many rows to the few a client needs, set-based, in one statement or read function, so only the result travels; it also owns the collation of every order it serves. The server enforces a maximum page size and pages by keyset behind an opaque continuation.
