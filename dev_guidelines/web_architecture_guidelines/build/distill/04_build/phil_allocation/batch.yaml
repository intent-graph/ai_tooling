  uid: ALLOCATION.DERIVE.1
  name: Derived Data and Aggregation
  intent: 'The tier for derived data follows the required freshness and atomicity, in this order: compute on read when affordable; maintain it in the database in the same transaction as the source when it must change atomically; keep database cache tables with an invalidation queue or scheduled refresh when a stated staleness is acceptable.'
