- op: node.create
  uid: ALLOCATION.FORCES.5
  name: Scalability
  intent: Scalability weighs each placement against the single write primary, the tier hardest to scale out; set-based reductions that return small results, and database functions that replace several round trips by one, are exempt. It moves a placement only when a measured write or connection load approaches the primary's limit, and is otherwise a tie-breaker.
  parent: ALLOCATION.FORCES
  epistemic_state: 'speculative: the premise lacks a read primary source (L615) | gap: no measured comparison of placements in any source'
  constraints:
  - Do not place logic off the database pre-emptively.
  - Move a placement for scalability only on measured write or connection load near the primary's limit.
  - Treat the premise as speculative until a primary source or a measurement exists.
  design_notes: |-
    Positions: P1 keep per-request computation off the database, because writes scale only through one primary (L615, inferred, no primary source); P2 one Postgres until a measured limit (L125).

    Decision: weigh each placement against the single write primary. Set-based reductions that return small results are exempt (L615's own exception), and so are the database functions MD-03 places there: they replace several round trips by one and do not add work the backend would not send anyway (inferred). Scalability moves a placement only when a measured write or connection load approaches the primary's limit (L125, L097).

    Rejected: placing logic off the database pre-emptively; wins when measured write load is the limit (L615).

    Changed (R1): database functions under MD-03 weighed against L615.
  impl_pointers:
  - build/distill/03_judge/J1_allocation/records.md::ALLOCATION.FORCES.5
  - build/research/06_operations/result.md::OPS-C19
  - build/research/07_architecture_styles/result.md::ARCH-C34
