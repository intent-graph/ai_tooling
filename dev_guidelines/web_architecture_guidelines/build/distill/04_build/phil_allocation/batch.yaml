- op: node.create
  uid: ALLOCATION.FORCES.3
  name: Performance
  intent: Data reduction (filter, aggregate, sort, page) is placed with the data by design, because that is a placement and not an optimisation; every other performance-driven move or copy waits for a measurement that identifies the path.
  parent: ALLOCATION.FORCES
  epistemic_state: known
  constraints:
  - Place data reduction with the data by design.
  - Make no other performance-driven move or copy without a measurement that identifies the path.
  - Never optimise up front.
  design_notes: |-
    Positions: P1 measure before optimising (L097); P2 place set work with its data by design (L613, L614).

    Decision: both, by kind. Data reduction (filter, aggregate, sort, page) is placed with the data by design, because that is a placement, not an optimisation (L613). Every other performance-driven move or copy waits for a measurement that identifies the path (L097, L607).

    Rejected: optimising up front; wins never (L097).
