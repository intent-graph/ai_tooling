- op: node.create
  uid: ALLOCATION.FORCES.1
  name: Correctness
  intent: Correctness demands that the deciding tier sees every writer and every fact the decision needs, and completes the decision atomically with the data it guards. With several consumers writing, rules about stored data and operations spanning tables go to the database; rules that need the end user's identity or the request go to the backend.
  parent: ALLOCATION.FORCES
  epistemic_state: 'known: demand stated by L606, L608, L628 | gap: owns no row'
  constraints:
  - The deciding tier must see every writer of the data it decides about.
  - The decision completes atomically with the data it guards.
  - 'Correctness is a veto force: a tier that cannot meet it cannot be the authority.'
  design_notes: |-
    Positions: no row of its own (skeleton gap 1). The demand is stated by rows owned elsewhere: L606 (the tier with knowledge and finality), L608 (the data store is an end for rules about stored data), L628 (the tier that sees every writer), L473 (check-then-write fails below serializable isolation), L623 (atomicity only inside one transaction).

    Decision: correctness demands that the deciding tier sees every writer and every fact the decision needs, and completes the decision atomically with the data it guards. In the default context several consumers write, so rules about stored data and operations that span tables go to the database (MD-03); rules that need the end user's identity or the request go to the backend. Veto force (FORCES).

    Gap handling: judged as the roll-up of the rule rows that state it; no row invented, no research launched.

    Changed (R1): default context per MD-03.
  impl_pointers:
  - build/distill/03_judge/J1_allocation/records.md::ALLOCATION.FORCES.1
  - build/research/16_consistency_ordering/result.md::CONS-C09
  - build/research/18_allocation/result.md::ALLOC-C01
