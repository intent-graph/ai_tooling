- op: node.create
  uid: ALLOCATION.FORCES.2
  name: Security
  intent: Security demands that a decision that grants access or protects integrity runs in a tier the requester cannot modify, on every access path; model output and client hints are input, never a decision. With several consumers, each is bounded by its own database role.
  parent: ALLOCATION.FORCES
  epistemic_state: 'known: demand stated by L019, L644, L650 | gap: owns no row'
  constraints:
  - Decisions that grant access or protect integrity run only in a tier the requester cannot modify.
  - Model output is never an authorization decision; client hints never enforce.
  - Every consumer is bounded by its own database role.
  - Security is a veto force.
  design_notes: |-
    Positions: no row of its own (skeleton gap 1). Demand stated by L019 (a check that grants access or protects integrity runs in a tier the requester cannot modify), L644 (model output is never an authorization decision), L650 (client hints never enforce), L622 (no schema across a trust boundary), L468 (database permissions cannot be bypassed by ad-hoc SQL).

    Decision: a decision that grants access or protects integrity runs in a tier the requester cannot modify (backend or database), on every access path; model output and client hints are input, never a decision. With several consumers, every consumer is bounded by its own database role (MD-01, MD-03). Veto force.

    Changed (R1): per-consumer roles added (MD-01, MD-03).
  impl_pointers:
