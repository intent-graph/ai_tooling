- op: node.create
  uid: ALLOCATION.GUARD.6
  name: Duplicate Suppression
  intent: 'Duplicate suppression is layered and the database decides: idempotent by design where the domain allows, otherwise an idempotency key recorded with the effect in the same transaction, with a unique constraint as the final backstop. Exactly-once is unavailable across a process or network boundary, so effects are made effectively-once by at-least-once delivery plus idempotence.'
  parent: ALLOCATION.GUARD
  epistemic_state: known
  constraints:
  - 'Authority: database (key and effect in the writer function''s transaction; unique constraint as final arbiter); the backend passes the key through its contract'
  - 'Copies: browser pending state and form token; agent clients send keys'
  - 'Forbidden: the browser as the only guard; a key store separate from the effect'
  - 'Prefer idempotent design: client-supplied identifiers, upserts, absolute assignments.'
  - Otherwise record an idempotency key in the same transaction as the effect; replay the first response and reject a different payload under the same key.
  - Require a key on every mutation offered to agents that is not idempotent by design, and on payment-like creates.
  - A unique constraint is the final arbiter.
  - Browser measures (disable resubmission, 303 after POST, a form token minted at render) only reduce repeats.
  design_notes: |-
    Positions: P1 idempotent by design (L051, L655, L587, L588); P2 idempotency key recorded with the effect (L269, L546, L270, L599); P3 layered across tiers (L582).

    Forces: correctness of effects against simplicity.

    Decision: layered, and the database decides. Ground: exactly-once is unavailable across a process or network boundary, and a lost acknowledgement leaves the caller unsure (L478, L479); effects are made effectively-once by at-least-once delivery plus idempotence where the effect is recorded.
      1. Idempotent by design where the domain allows: client-supplied identifiers, upserts, absolute assignments (L655, L587 MAINT, L588).
      2. Otherwise an idempotency key recorded by the API function in the same transaction as the effect; the first response is replayed and a different payload under the same key is rejected (L269, L546, L270, L599). Required on every mutation offered to agents that is not idempotent by design, and on payment-like creates (L051).
      3. A unique constraint as the backstop (L582).
      The browser layer (disable resubmission, 303 after POST, a form token minted at render) only reduces repeats (L582).

    Rejected: P1 alone: wins when every mutation has a natural idempotent form. A key store apart from the effect; wins never (L270, L479).

    Changed (R1): key recorded inside the API function (MD-03).

    Would move it: automated callers; payment-like or external effects
