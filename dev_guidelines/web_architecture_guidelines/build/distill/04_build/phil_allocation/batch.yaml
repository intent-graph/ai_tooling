- op: node.set
  uid: ROOT
  intent: 'Stack-neutral principles for designing a web application as a whole: who does what across database, backend and browser is decided first, per responsibility, from stated forces, context and rules, and each tier then carries out the share it is given. By default the database is the authority for the truth of stored data and for everything that must hold whoever touches it, each backend is the authority for product policy not stored in the data, its users'' identity and its workflows, and browsers and agent clients are the authority for nothing durable. Interface descriptions stay in sync with the implementation by process, and one clause, read visibility of rows with per-user rules when several backends share the database, awaits the maintainer.'
  design_notes: |-
    Source: the J1 allocation judge records, final revision (47 nodes judged, 39 of them in this graph; the allocation placements number 26, 25 decided and 1 undecided).

    Default context (maintainer decision MD-03): a classic website (documents, forms, CRUD), one team, single tenant, humans and agents as users, and a database that may be shared by several backends and by reporting, admin consoles and scripts. Under it the database is the authority for stored-data truth and for what must hold whoever touches the data: each business operation is one function call in its own transaction (which may call other domains' published functions), each state column has one writer function, per-user write rules decidable from the row and the actor are enforced there, and so are invariants and per-role privileges; audit records both the consumer's role and the actor it claims. Each backend is the authority for product policy not stored in the data, its users' identity and its workflows, which advance through state columns and the outbox. Foreign mutations run as atomic phases in a worker behind a 202 response, in the request only when the user must see the outcome within about 1 s and then with the intent recorded first by the database function. Browsers and agent clients decide nothing durable; no token travels in a URL except a short-lived signed file URL.

    Maintainer decisions applied: MD-01 (row-level security is not a default; acceptable only for a simple data model, with the scoping key in every covered table and no all-powerful administrator role), MD-02 (interface documentation is always in sync, guaranteed by process; its origin, description or code, is chosen per project with criteria for each direction), MD-03 (the default context above).

    Verdict against the maintainer doctrine: one, partial. ALLOCATION.GUARD.2 goes against the doctrine's "triggers and CHECK constraints optional": only declarative constraints bind every writer, owner-run migrations included, and procedural checks need serializable isolation or a lock.

    Tensions between maintainer decisions and evidence, recorded and not overridden: (a) MD-01 against the research rows that call for row security when several consumers share the database (L619, L688), which MD-03 makes the default; (b) MD-03 against the research rows that keep one application as the owner of its database (L044) and put logic in the application first, testable in memory (L215, L042); (c) MD-01 with MD-03: per-user read filters implemented in each backend become copies across backends, against ALLOCATION.RULES.4 (L633).

    Open question Q1 (ALLOCATION.GUARD.3): undecided: awaiting maintainer, read visibility of rows with per-user rules when several backends share the database. Recorded default: each backend filters from one shared specification with shared denial tests; fallback: database read functions that receive the verified actor, acceptable when a per-user read rule must hold for two or more backends (always the case under MD-03). Under either answer, roles that may SELECT the base tables see every row, comments included, unless their own role is restricted.

    Skeleton gaps: ALLOCATION.FORCES.1 and .2 own no ledger row and are judged from the rows owned elsewhere that state their demand; ALLOCATION.DERIVE.2's backend-or-browser position is unargued and kept only as a browser copy; ALLOCATION.PRESENT.2 has one grounded position and is marked speculative.

    Evidence gaps: the scalability premise (L615) has no primary source (FORCES.5 is speculative); thresholds for queue contention, notification load and the 1 s deferral are unmeasured; generators for persistence models, interface fields and function wrappers were not read; the collation choice is open under the data branch; the operating cost of a JavaScript server is unweighed; L684 cites no source; the role-to-actor pairing check is inferred and no source describes it.

    Judge records: build/distill/03_judge/J1_allocation/records.md (ALLOCATION roll-up record).
