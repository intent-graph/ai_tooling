- op: node.create
  uid: ALLOCATION.GUARD.4
  name: Identity and Session State
  intent: Each backend holds the sessions and credentials of its users; the browser holds only an HttpOnly, Secure, SameSite cookie carrying an opaque identifier. Database roles identify consumers, never end users.
  parent: ALLOCATION.GUARD
  epistemic_state: known
  constraints:
  - 'Authority: backend (session store in the database under the backing-roles default)'
  - 'Copies: the browser''s opaque cookie; an agent''s own bearer token'
  - 'Forbidden: tokens in JavaScript-readable storage; any session token, bearer token or long-lived credential in a URL, the one exception being short-lived, single-purpose, scope-limited signed URLs for file delivery, with lifetime and scope stated (X6); session state in process memory; stateless, non-revocable sessions; end users as database roles'
  - 'Default (first-party, same-site browser): an opaque server-side session, revoked on logout, stored in a backing service, never in process memory.'
  - 'Login through an external identity provider: a backend-for-frontend holds the tokens.'
  - 'Agents and other non-browser clients: bearer tokens per delegation, short-lived, with server-held state that can revoke them.'
  - No token in JavaScript-readable storage; no session token, bearer token or long-lived credential in a URL, the one exception being a short-lived, single-purpose, scope-limited signed file URL with its lifetime and scope stated.
  - The cookie carries an identifier, never application state; no stateless, non-revocable sessions.
  - An end user reaches the database only as the actor a backend asserts in a transaction-local setting from its verified identity.
  design_notes: |-
    Positions: P1 server-held opaque session, HttpOnly cookie (L315, L022, L319, L086); P2 backend-for-frontend holds the tokens (L313, L314); P3 browser application holds bearer tokens (L316, L320, L321); P4 no application state in cookies (L318).

    Forces: security (token theft, revocation) against scalability and latency (stateless verification).

    Decision: each backend holds the sessions and credentials of its users; the browser holds only an HttpOnly, Secure, SameSite cookie carrying an opaque identifier.
      - Default (first-party, same-site browser): an opaque server-side session, revoked on logout (L315, L022, L319), stored in a backing service, never in process memory (L086).
      - Login through an external identity provider: backend-for-frontend (L313).
      - Agents and other non-browser clients: bearer tokens per delegation, short-lived, with server-held state that can revoke them (L316, L022).
      - Database roles identify consumers, never end users; the end user reaches the database only as the actor a backend asserts in a transaction-local setting, from its verified identity, checked against the backend's role (R1-3) (L311, L566).

    Rejected: P3 for the browser: wins only when no backend is possible (L314); localStorage acceptance (L320, L321) loses. P4 as stated loses; its narrow sense is kept: the cookie carries an identifier, never application state.

    Changed (R1): end user versus consumer role stated (MD-03).

    Changed (R3): no tokens in URLs except short-lived signed file URLs (X6).

    Would move it: client kind; instant revocation; no backend possible
