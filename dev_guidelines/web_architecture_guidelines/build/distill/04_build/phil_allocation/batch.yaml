- op: node.create
  uid: ALLOCATION.FORCES.6
  name: Changeability
  intent: 'The costs of database logic are explicit inputs to every placement: testing needs a live database, tooling and debugging are poor, the onboarding skill floor is higher and expressiveness is limited; portability is a sunk cost when the DBMS is a long-term commitment. Where the database holds what must hold for every consumer these costs are accepted and paid for with tooling.'
  parent: ALLOCATION.FORCES
  epistemic_state: known
  constraints:
  - State the costs of database logic as inputs to every placement.
  - Keep database logic in versioned migrations and test it against a live database in CI.
  design_notes: |-
    Positions: one, research and doctrine agreeing (L042, L472 MAINT, L041).

    Decision: the costs of database logic are explicit inputs to every placement: testing needs a live database, tooling and debugging are poor, the onboarding floor is higher, expressiveness is limited (L472, L042). Portability is sunk when the DBMS is a long-term commitment (L042). Under MD-03 these costs are accepted for what must hold for every consumer, and must be paid for with tooling: functions in versioned migrations, tested against a live database in CI. L472 (MAINT) is the max choice.

    Changed (R1): costs accepted under MD-03, with their tooling.
