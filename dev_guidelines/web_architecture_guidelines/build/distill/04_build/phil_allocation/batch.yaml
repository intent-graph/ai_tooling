  parent: ALLOCATION
  epistemic_state: 'known | undecided: awaiting maintainer, read visibility of rows with per-user rules when several backends share the database (GUARD.3, Q1)'
  constraints:
  - Browsers and agent clients echo checks only; they never decide.
  design_notes: 'Decision: roll-up. Deciding checks run in the database for rules about stored data, for multi-table operations and for per-role access; in the backend for meaning and access that need the end user''s identity, policy or request context, and for sessions. Browsers and agent clients only echo checks, for feedback.'
