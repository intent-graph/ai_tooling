  uid: TRANSVERSE.EVOLUTION.1
  name: Explicit Decisions
  intent: The decisions that are costly to get wrong are identified early, chosen from the properties they must induce, decided when enough is known, and recorded with their forces, alternatives and the condition that would reverse them. Later changes are tested against the constraints the decision set, automatically where a check exists.
  parent: TRANSVERSE.EVOLUTION
  epistemic_state: known`.
  constraints:
  - MUST identify the costly decisions early and record each with its forces, alternatives and the condition that would reverse it.
  - MUST decide each hard-to-reverse choice when enough is known, not up front for every one.
  - MUST record per-project decisions the same way, including the interface origin direction with its criteria and any adoption of row-level security with its conditions.
  - MUST test changes against the constraints the decision set, automatically where a check exists.
  design_notes: |-
    POSITIONS:
      - P1 architecture is the shared understanding of the decisions that are costly to get wrong; design effort goes there (L105).
      - P2 choose the properties first, then the constraints that induce them, and test proposed changes against those constraints (L106).
      - At stack level: one short decision record per architecturally significant decision, never edited once accepted, only superseded (L129 to L133, owned by PIG-WEB-TRANSVERSE.EVOLUTION.3).
      - Read with L073 (EVOLUTION.3): defer hard-to-reverse decisions until the product is understood.

    FORCES:
    P1 and P2 serve getting the irreversible parts right; the cost is writing them down. L073 serves not fixing what is not yet known.

    DECISION:
    P1 and P2, recorded, with their constraints checked automatically where possible.
      - The costly decisions are named early. The allocation placements are the first of them, decided from the forces (target hierarchy).
      - Each is decided when enough is known (L073) and recorded with its forces, its alternatives and the condition that would reverse it: the same form as the judge record and as J1's "would move it".
      - The per-project decisions the maintainer requires are recorded the same way: the interface origin direction with its criteria (MD-02); the adoption of row-level security under its three conditions (MD-01).
      - Changes are tested against the constraints the decision set, automatically where a check exists (L106, L110).
      - Identifying a decision early is not deciding it early: L073 governs the timing, P1 the attention.

    REJECTED:
    decisions left implicit in code (against L105); deciding every hard-to-reverse choice up front (against L073). Neither wins in this context.

    PLACEMENTS REALIZED:
    no skeleton link to a placement; the allocation placements are its first application.
