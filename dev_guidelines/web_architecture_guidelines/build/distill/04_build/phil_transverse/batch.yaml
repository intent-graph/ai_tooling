- op: node.create
  uid: TRANSVERSE.EVOLUTION.4
  name: Few Mature Technologies
  intent: The system adopts few, mature technologies, because novelty is a scarce budget and simplicity is a reliability property. A new technology enters only when an existing one's measured limit is reached and its perpetual operating cost is budgeted; this counts runtimes, stores, services and frameworks, not the choice of paradigm inside an adopted language.
  parent: TRANSVERSE.EVOLUTION
  epistemic_state: 'known | unvalidated: scope reconciliation with POLYGLOT`.'
  constraints:
  - MUST adopt few, mature technologies with known failure modes.
  - MUST let a new technology in only when an existing one's measured limit is reached and its perpetual operating cost is budgeted.
  - MUST count runtimes, stores, services and frameworks; the paradigm inside an adopted language is not limited by this rule.
  design_notes: |-
    POSITIONS:
      - P1 novelty is a scarce budget, spent on what differentiates the product (L081).
      - P2 prefer mature technology with known failure modes (L082).
      - P3 few distinct technologies covering the domain (L083, majority).
      - P4 weigh perpetual operating cost, not adoption convenience; consult others before adopting (L084).
      - P5 simplicity is a reliability property (L085).
      - P6, from the skeleton's conflicts link to python-kb-philosophy POLYGLOT: pick the right paradigm per problem.

    FORCES:
    P1 to P5 serve operability and reliability at the cost of sometimes using a less specialised tool; P6 serves fit per problem.

    DECISION:
    P1 to P5.
      - The system adopts few, mature technologies. A new technology enters only when an existing one's measured limit is reached and its perpetual operating cost is budgeted (L084).
      - In this stack that is POSTGRES_FIRST: Postgres hosts queue, schedules, derived caches and sessions until a measured limit; CACHE_STORE and JOB_HOST follow the same rule.
      - P6 is reconciled by scope, inferred. EVOLUTION.4 counts runtimes, stores, services and frameworks. The choice of paradigm inside an adopted language (POLYGLOT) is not limited by it, so the two do not compete.

    REJECTED:
    the best tool per problem across infrastructure, acceptable when the existing tool's measured limit is reached and the added operating cost is budgeted (L084; POSTGRES_FIRST's "would move it").

    PLACEMENTS REALIZED:
    no skeleton link to a philosophy placement; realized in the stack graph by PIG-WEB-ALLOCATION.POSTGRES_FIRST, CACHE_STORE and JOB_HOST (J1).
