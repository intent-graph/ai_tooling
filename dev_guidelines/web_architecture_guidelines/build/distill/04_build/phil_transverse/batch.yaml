- op: node.create
  uid: TRANSVERSE.OPERABILITY
  name: Operability
  intent: The running system is observed, tested and delivered as one whole across every tier, designed in from the start. One correlation id runs from the browser to the database transaction, with a separate security event log and a retention decision per record type; tests sit at the lowest level that catches each failure, with data logic tested on the real engine; one immutable build is promoted everywhere with database changes in the same pipeline.
  parent: TRANSVERSE
  epistemic_state: 'known | gap: owns no row (roll-up)`.'
  constraints:
  - MUST observe, test and deliver the system as one whole across every tier.
  - MUST carry one correlation id from the browser to the database transaction.
  - MUST keep the security event log apart from the business audit trail.
  - MUST promote one immutable build everywhere with database changes in the same pipeline.
  design_notes: |-
    DECISION:
    the roll-up of its three children. The running system is observed, tested and delivered as one whole across browser, backend, database and the other database consumers, designed in from the start (L096):
      - one correlation id runs from the browser to the database transaction; a separate security event log and a retention decision per record type;
      - tests at the lowest level that catches each failure, the database tier tested on the real engine, isolated by rollback by default, with commit-time and concurrent behaviour tested in a disposable database;
      - one immutable build promoted everywhere, database changes inside the same pipeline.

    PLACEMENTS REALIZED:
    through its children (ACT.4).

    REVIEW FIXES:
    test line updated after M2 (X4).
  impl_pointers:
  - build/distill/03_judge/J5_phil_transverse/records.md::TRANSVERSE.OPERABILITY
  - build/research/06_operations/result.md::OPS-C23
- op: node.create
  uid: TRANSVERSE.EVOLUTION
  name: Deliberate Evolution
  intent: 'The system changes deliberately: costly decisions are named, chosen from the properties they must induce, and recorded; growth happens in small tested increments without speculative features, with fit checked automatically. Several backends may share the database, each backend is one deployable not split into services without a measured need, few mature technologies are adopted, and teams are cut by capability with structure following them.'
  parent: TRANSVERSE
  epistemic_state: 'known | gap: owns no row (roll-up)`.'
  constraints:
  - MUST name, choose from required properties, and record the costly decisions.
  - MUST grow in small tested increments with fit checked automatically.
  - MUST NOT split a backend into services without a measured need.
  - MUST adopt a new technology only past a measured limit of an existing one.
  - MUST cut teams by capability, with a cross-schema business function owned by the team that owns the workflow.
  design_notes: |-
    DECISION:
    the roll-up of its five children:
      - the costly decisions are named, chosen from the properties they must induce, and recorded;
      - the system grows in small tested increments without speculative features, its fit checked automatically;
      - several backends may share the database (MD-03); each backend is one deployable, not split into services without a measured need, and a split happens only for independent deployability on proven boundaries;
      - it adopts few mature technologies, a new one only past a measured limit;
      - teams are cut by capability, and structure follows them; a cross-schema business function belongs to the team that owns the workflow.

    PLACEMENTS REALIZED:
    through its children (RECORD.1, RECORD.2, POSTGRES_FIRST in the stack graph).

    REVIEW FIXES:
    deployable line replaced after M3 (X5); ownership line after m5.
  impl_pointers:
  - build/distill/03_judge/J5_phil_transverse/records.md::TRANSVERSE.EVOLUTION
- op: node.create
  uid: TRANSVERSE.OPERABILITY.1
  name: Whole-Path Observability
  intent: Logs, metrics and traces are signals of one system, designed to be correlated by one id carried from the browser through the backend into the database transaction. Security events form their own record, apart from the business audit trail, and retention is a recorded decision per record type set by obligations, no shorter and no longer; secrets and unneeded personal data are never logged.
  parent: TRANSVERSE.OPERABILITY
  epistemic_state: 'known | unvalidated: correlation id carried into the database transaction and audit rows (L371, L566, L658)`.'
  constraints:
  - MUST carry one correlation id per user interaction from the browser through the backend into the database transaction, stamped on every log record, span, client event and audit row.
  - MUST give database consumers outside the request path their identity and ticket id in the session.
  - MUST record validation failures, authentication successes and failures, authorization failures, session failures, application errors and use of higher-risk functions in a security event log with its own store, integrity and retention.
  - MUST treat changes to privileges, roles, credentials, grants and the role-to-actor pairing as security events; MUST NOT put business data changes in the security log.
  - MUST record a retention decision per record type, set by legal, regulatory and contractual obligations, no shorter and no longer.
  - MUST NOT log or place in trace context anything secret or unneeded and personal.
  design_notes: |-
    POSITIONS:
      - P1 logs, metrics and traces are one system's signals, designed to be correlated (L095), across browser, server and database (L096; inferred synthesis).
      - P2 always log validation failures, authentication successes and failures, authorization failures, session failures, application errors and use of higher-risk functions; data-change events are optional extras (L098).
      - P3 retention is a recorded decision set by legal, regulatory and contractual obligations: no shorter, no longer (L048).
      - Read against ACT.4 (J1): business history is mandatory, written by database triggers in the same transaction, and kept apart from the security event log (L049, L392).

    FORCES:
    P1 serves diagnosis across tiers; its cost is propagating context everywhere. P2 serves detection of attacks. P3 serves accountability and privacy (L035) against the convenience of keeping everything.

    DECISION:
    P1, P2 and P3, with the two records apart.
      - One correlation id per user interaction, carried from the browser through the backend into the database transaction. It is stamped on every log record, span and client event (L371, L382), and on audit rows (L658 requires a correlation id for agent actions). Carrying it into the transaction alongside the actor (L566's transaction-local settings) is inferred; it reaches the work MD-03 places in database functions.
      - Database consumers outside the request path are part of the path: operator and owner sessions carry their identity and ticket id (L545; J1 access paths).
      - The security event log records P2's list (L098) and is a separate record with its own store, integrity and retention (L049, L392). Business data changes stay out of it: the business audit trail is the database's (ACT.4). Security-relevant changes (privileges, roles, credentials, grants, the role-to-actor pairing) are security events: they are data changes that L098 lists as "use of higher-risk functionality". L098's "optional" applies to the security log only, so there is no conflict with ACT.4.
      - Retention is a recorded decision per record type (application logs, traces, security event log, audit trail), set by obligations, no shorter and no longer (L048). Where no obligation exists, the decision still has to be recorded; the period is set per project (open, by design).
      - Nothing secret or unneeded and personal is logged or placed in trace context (L036, L375).

    REJECTED:
      - Per-tier silos of logs, metrics and traces: never (L095).
      - Data-change events in the security log as the business history: forbidden by ACT.4 (application-only audit).
      - Keeping logs indefinitely "in case": against L048 and L035; acceptable never without a recorded obligation.

    PLACEMENTS REALIZED:
    conflicts ACT.4 (skeleton link: the security event log and the business audit trail are kept apart). Rests on ACT.4's actor and role recording (J1 R1-3).

    REVIEW FIXES:
    m4 (only business data changes stay out of the security log; security-relevant changes are security events).
