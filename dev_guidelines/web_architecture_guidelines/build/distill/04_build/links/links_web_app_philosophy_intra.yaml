  shape:
    type: realizes
- op: link.create
  src: INTERACTION.VISUALIZE
  dst: ALLOCATION.PRESENT.1
  intent: Renders what the rendering placement gives the browser.
  shape:
    type: realizes
- op: link.create
  src: INTERACTION.VISUALIZE
  dst: ALLOCATION.PRESENT.2
  intent: Formats values for the reader where the placement says.
  shape:
    type: realizes
- op: link.create
  src: INTERACTION.COLLABORATE
  dst: ALLOCATION.GUARD.5
  intent: Surfaces conflicts with the policy the concurrency placement chose.
