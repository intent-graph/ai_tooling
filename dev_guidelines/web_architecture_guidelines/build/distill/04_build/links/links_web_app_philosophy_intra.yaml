    type: realizes
- op: link.create
  src: INTERACTION.COLLABORATE
  dst: ALLOCATION.PRESENT.3
  intent: Keeps presence and other ephemeral state where the placement says.
  shape:
    type: realizes
- op: link.create
  src: INTERACTION.COLLABORATE
  dst: ALLOCATION.GUARD.3
