    type: realizes
- op: link.create
  src: DATA.MAINTAIN
  dst: ALLOCATION.ACT.4
  intent: Audit and history are kept in the database where the audit placement says.
  shape:
    type: realizes
- op: link.create
  src: LOGIC.SECURE
  dst: ALLOCATION.GUARD.1
  intent: Performs the boundary checks the validation placement gives the backend.
  shape:
    type: realizes
- op: link.create
  src: LOGIC.SECURE
  dst: ALLOCATION.GUARD.3
  intent: Enforces the access decisions the authorization placement gives the backend.
  shape:
    type: realizes
- op: link.create
  src: LOGIC.SECURE
  dst: ALLOCATION.GUARD.4
  intent: Holds sessions and credentials as the identity placement sets.
  shape:
    type: realizes
- op: link.create
  src: LOGIC.ENFORCE
  dst: ALLOCATION.ACT.1
  intent: Holds the business rules and transitions the placement gives the backend.
  shape:
    type: realizes
- op: link.create
  src: LOGIC.ENFORCE
  dst: ALLOCATION.RULES.4
