  src: DATA.GUARD
  dst: ALLOCATION.GUARD.2
  intent: Enforces the invariants the placement gives the database.
  shape:
    type: realizes
- op: link.create
  src: DATA.GUARD
  dst: ALLOCATION.GUARD.5
  intent: Carries the concurrency control the placement gives the database.
  shape:
    type: realizes
