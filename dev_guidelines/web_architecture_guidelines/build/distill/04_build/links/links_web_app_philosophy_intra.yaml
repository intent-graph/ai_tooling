  src: INTERACTION.ENVIRONMENT.5
  dst: ALLOCATION.GUARD.6
  intent: Safe retries depend on the duplicate-suppression placement.
  shape:
    type: requires
- op: link.create
  src: INTERACTION.ENVIRONMENT.6
  dst: ALLOCATION.PRESENT.3
  intent: The URL is the authority for shareable view state.
