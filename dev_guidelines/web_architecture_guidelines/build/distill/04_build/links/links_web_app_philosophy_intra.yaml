    type: constrains
- op: link.create
  src: LOGIC.PROCESS
  dst: ALLOCATION.DERIVE.3
  intent: Process memory holds no cache shared beyond one request.
  shape:
    type: constrains
- op: link.create
  src: LOGIC.PROCESS
  dst: ALLOCATION.ACT.2
  intent: The backend delivers side effects from the staged outbox the placement sets.
  shape:
    type: realizes
- op: link.create
  src: LOGIC.PROCESS
  dst: ALLOCATION.ACT.3
  intent: Workers execute the deferred work the placement assigns to them.
  shape:
    type: realizes
- op: link.create
  src: LOGIC.EXPOSE
  dst: ALLOCATION.RECORD.2
  intent: Offers the backend interface through which browsers and agents reach data, and through which
