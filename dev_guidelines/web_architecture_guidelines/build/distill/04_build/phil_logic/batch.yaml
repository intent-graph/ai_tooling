- op: node.create
  uid: LOGIC.ENFORCE
  name: Business Core
  intent: 'One business core per backend, separable from transport and storage, holds only what the placements give the backend: workflow across operations, product policy not stored in the data, and external calls. It reaches every external system, the database function API included, through a port, one call per operation in its own transaction, so the logic stays testable alone and one rule has one authority.'
  parent: LOGIC
  epistemic_state: 'known | tension: L063 narrowed to the backend''s share and L066''s boundary owned by the database function (ACT.1, MD-03) | unvalidated: data in, decision out (P5 single exploratory source, joined with L614)'
  constraints:
  - 'Layers (P1, L062): adapters on the outside (HTML views, the JSON interface, the agent adapter, job runners) translate requests into use-case calls and shape results; they hold no rule (L633). Use cases on the inside carry the backend''s share: workflow across operations, product policy not stored in the data, external calls (ACT.1, GUARD.3).'
  - 'Ports for every external system, the database function API included (P3, L064). The core calls each business operation as one function call in its own transaction (J1 R1-4) and never composes several calls into one operation or wraps them in one transaction (ACT.1); a step that must be atomic with another is a new database function. Composition across domains happens in the database: a database function may call another domain''s published functions inside the same transaction; what is forbidden across domains is direct access to another domain''s tables, not calling its published functions (X3). L066''s "one explicit boundary per operation" holds with the function as its owner (L584).'
  - 'Testability, by share (P2, L063): the backend''s own logic (policy, workflow, orchestration of external calls) runs in isolation with fake adapters and no live database. The rules the database owns (invariants, operations, transitions, per-user write rules decidable from the row) are tested against a live database, as ACT.1 accepts (L042, L472); the backend never reimplements them to make its tests pass without one, except as a copy generated from or tested against the function (RULES.1). Test boundary (X4): logic tests on shared data run in never-committing transactions (L567); behaviour that only shows at commit (serialization retries, lock waits, deferred constraints, the outbox) is tested with committing sessions in a disposable database, never a shared one; concurrency tests for the rules GUARD.2 requires (Serializable with retry, locks) are part of the default test suite.'
  - 'Behaviour lives with its authority (P4, L065): rules about stored data live in the database''s writer functions, never in backend objects that would be a second authority; the backend''s own policy and workflow logic, when complex, lives in behaviour-rich domain objects with a thin use-case layer around them. A simple share is a transaction script (L226).'
  - 'Data in, decision out (P5''s first half, with L614): a use case gathers the data it needs in as few calls as possible (one read function or statement, never queries in loops), then decides in code that does no fetching; that keeps the decision testable without I/O and runnable from any driver (online, batch, agent).'
  design_notes: |-
    Decision: one business core per backend, separable from transport and storage, holding only what the placements give the backend.
    Positions:
    - P1 separate presentation, domain logic and data access; several presentations over one domain; test seams (L062).
    - P2 business logic free of UI and database entanglement, drivable by users, tests, batch jobs or other programs, runnable in isolation with test adapters and without a live database (L063).
    - P3 every external system (database, mail, payment, third-party API) reached through an adapter behind an application-owned port (L064).
    - P4 no anemic model in a complex domain: a thin service layer around behaviour-rich objects (L065).
    - P5 logic free of data fetching and network concerns, declaring its data dependencies up front, so it runs online, in batch or in cache invalidation, and dependency graphs can drive cache invalidation (L067; one exploratory source, contested by adoption only).
    - Placement rows cited: one core for every client, agents through an adapter that translates and shapes only (L633, RULES.4); multi-table operations as one database function, one writer function per state column (L584, L596, MAINT); the use-case layer owns the transaction boundary (L066); scale layering to domain complexity (L226, owned by PIG-WEB-LOGIC.ENFORCE.1); each extra round trip adds latency (L614).
    Forces: correctness (one rule, one place: L633, L596); changeability and testability (P1-P3); performance and latency (round trips, L614); cost of structure on simple domains (L226).
    Rejected:
    - All logic in the backend core, including multi-table operations and state transitions (application-first, L215, L066 as stated): rejected by MD-03 and ACT.1; acceptable when one backend is the only database consumer and the team's SQL skill is low (ACT.1's condition).
    - "Without a live database" for every business rule (L063 read literally): it would force a backend copy of the database's rules; narrowed to the backend's share (tension recorded).
    - Anemic services over data-only models for complex backend policy: rejected (L065); acceptable when the backend's share is simple CRUD orchestration (L226).
    - Rules or transitions in adapters, agent wrappers or prompts: never (L633).
    - Dependency graphs driving cache invalidation (P5's second half): not adopted; derived caches are database tables invalidated in the source transaction (DERIVE.3, L534). Acceptable when a derived store outside the database must be invalidated precisely and no transactional invalidation is available (inferred).
    Realizes: ACT.1 (the backend's share: workflow, product policy, external calls; one call per operation, no wrapping); requires RULES.4 (one core per backend, adapters translate only).
    Maintainer decision cited: MD-03 (several consumers share the database; multi-table operations belong to it).
    Tension recorded: L063 'testable without a live database' narrowed to the backend's own share; L066's use-case-owned transaction becomes one database function call per operation (ACT.1).
    Evidence gap: L067 rests on one exploratory source (contested by adoption only, no opposing source); adopted only for its up-front data dependency half, joined with L614; its cache-invalidation half is not adopted (DERIVE.3).
