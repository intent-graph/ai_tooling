- op: node.create
  uid: PIG-WEB-DATA.ORGANIZE.4
  name: Naming
  intent: Identifiers are lower-case snake_case, schema-qualified in production code, and carry role and type in the name (entity_id, _at, is_/has_/can_, named constraints), with no bare id or status in new tables. Conventions evolve forward only, so a name that reads without a dictionary stays stable and violations map to stable errors.
  parent: PIG-WEB-DATA.ORGANIZE
  epistemic_state: known
  constraints:
  - Schema qualification in every production reference also closes the search-path attack of L181 for functions that run with their owner's rights (GUARD.2).
  - Constraint names spelling source and target are what lets a violation map to a stable error (L495, GUARD.1).
  - The deprecated-column suffix is the expand phase of MAINTAIN.1; removal is its contract phase (L192).
  - 'Conventions evolve forward only: new objects follow the rule, legacy names change only through expand, migrate, contract (L474, J2 DATA.MAINTAIN).'
  design_notes: |-
    Question: how identifiers are named so that role and type read from the name.
    Positions: P1 identifier hygiene: lower-case snake_case, plural table names, no type prefixes, at most 63 bytes (silent truncation), every reference schema-qualified in production code (L505 MAINT; agrees L181). P2 names carry role and type: `<entity>_id`, `_at`, `is_/has_/can_`, `_ids`, `statuses`/`types`, `_to_` for link tables, constraint names spelling source and target, deprecated columns suffixed and removed later (L506 MAINT). P3 join-safe names in new tables: no bare `id`, `status`, `name`, `type`; key named for its entity, other columns share a short table prefix; audit columns unprefixed; legacy tables not renamed (L507 MAINT). No competing row.
    Forces: integrity of reading (no ambiguous join column, no silently truncated name, no search-path capture) and changeability (forward-only evolution) against brevity.
    Decision and grounds: P1 to P3 adopted whole (MAINT, uncontested, max).
      - Schema qualification in every production reference also closes the search-path attack of L181 for functions that run with their owner's rights (GUARD.2).
      - Constraint names spelling source and target are what lets a violation map to a stable error (L495, GUARD.1).
      - The deprecated-column suffix is the expand phase of MAINTAIN.1; removal is its contract phase (L192).
      - Conventions evolve forward only: new objects follow the rule, legacy names change only through expand, migrate, contract (L474, J2 DATA.MAINTAIN).
    Rejected: bare `id` and other ambiguous names in new tables: never (L507). Bulk renaming of legacy tables: rejected (L474); acceptable only through expand, migrate, contract.
    Realizes: TYPE_CHAIN (generated models inherit these names); J2 DATA.MAINTAIN (forward-only conventions).
