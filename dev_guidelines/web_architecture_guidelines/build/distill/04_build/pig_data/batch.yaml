- op: node.create
  uid: PIG-WEB-DATA.GUARD.3
  name: Row Security Policies
  intent: Row-level security is not enabled by default; it is acceptable only when the data model is simple, the scoping key leads every covered table's composite key, and no all-powerful administrator role must cross scopes. The acting user, and the person an agent acts for, always travel as transaction-local settings that writer functions and audit triggers require and check against the session role, because the actor is a claim and not a verified fact.
  parent: PIG-WEB-DATA.GUARD
  epistemic_state: 'known: MD-01 | conflict: L619, L688 favour row security when several consumers share the database (MD-03 default; recorded by J1) | undecided: awaiting maintainer, read visibility of rows with per-user rules when several backends share the database | unvalidated: the pairing table and function'
  constraints:
  - 'Row-level security is not enabled by default (MD-01). It is acceptable only when the data model is simple, the scoping key leads the composite key of every covered table (ORGANIZE.2), and no all-powerful administrator role must cross scopes. Where it is used: backend checks are kept (L128); the request role is neither owner nor superuser and FORCE is set where the owner connects (L310); policies get a design review and denial tests through the deployed role and connection path (L128, L310); policy columns are indexed (L619''s mechanics, cited via J1).'
  - 'Request context is always passed, row security or not, because writer functions and audit triggers need the actor (J1 GUARD.3, ACT.4): the backend sets the acting user, and the person an agent acts for, in transaction-local settings (`SET LOCAL` or `set_config(..., true)`) in a reserved namespace, derived from its verified identity (L311, L566, L685). Transaction-local scope is also what keeps context from leaking across pooled connections in transaction mode (L311, L200; INTERFACE.2).'
  - 'The actor is a claim, not a verified fact (J1 R1-3): writer functions and audit triggers refuse a write with no actor and check that the session role may assert that kind of actor (a backend an end user or agent, an operator or owner role only itself and, for owner-run jobs, a ticket id). The pairing lives in one table read by one function, so every check uses the same rule (inferred realization).'
  - Fixture context lives in a separate namespace that production code never reads (L566).
  design_notes: |-
    Question: how row-level security policies and the request context they read behave and are set.
    Positions:
      - P1 row security semantics: default deny once enabled; USING governs visibility, WITH CHECK written rows; permissive OR, restrictive AND (L309).
      - P2 skipped for superusers, BYPASSRLS roles and owners unless FORCE; bypassed by unique and foreign-key checks; sub-select policies can race and leak: non-owner, non-superuser request role and a design review; whether to use it rather than application filtering is not settled by the sources (L310).
      - P3 pass the application user or tenant with transaction-local settings, derived from the verified identity, never from a client id (L311).
      - P4 functions read request context from transaction-local settings in a reserved namespace; fixtures use a separate namespace production never reads (L566 MAINT).
      - Placement: ROW_SECURITY decided by MD-01 (not a default; acceptable under three conditions); L619 and L688 favour row security when several consumers share the database (tension recorded by J1).
    Forces: security in depth per user, against policy complexity, testability and the administrator roles row policies mesh badly with (MD-01).
    Decision and grounds:
      - Row-level security is not enabled by default (MD-01). It is acceptable only when the data model is simple, the scoping key leads the composite key of every covered table (ORGANIZE.2), and no all-powerful administrator role must cross scopes. Where it is used: backend checks are kept (L128); the request role is neither owner nor superuser and FORCE is set where the owner connects (L310); policies get a design review and denial tests through the deployed role and connection path (L128, L310); policy columns are indexed (L619's mechanics, cited via J1).
      - Request context is always passed, row security or not, because writer functions and audit triggers need the actor (J1 GUARD.3, ACT.4): the backend sets the acting user, and the person an agent acts for, in transaction-local settings (`SET LOCAL` or `set_config(..., true)`) in a reserved namespace, derived from its verified identity (L311, L566, L685). Transaction-local scope is also what keeps context from leaking across pooled connections in transaction mode (L311, L200; INTERFACE.2).
      - The actor is a claim, not a verified fact (J1 R1-3): writer functions and audit triggers refuse a write with no actor and check that the session role may assert that kind of actor (a backend an end user or agent, an operator or owner role only itself and, for owner-run jobs, a ticket id). The pairing lives in one table read by one function, so every check uses the same rule (inferred realization).
      - Fixture context lives in a separate namespace that production code never reads (L566).
    Awaiting maintainer (B1, X1): `undecided: awaiting maintainer, read visibility of rows with per-user rules when several backends share the database` (J1 Q1). Recorded default, J1's word for word: A provisional, with one written specification per rule and a shared denial suite; B acceptable when a per-user read rule must hold for two or more backends. Where B's condition holds, read functions join INTERFACE.1 and read this node's context: the "verified actor" they receive (X1) is the actor the backend derives from its verified identity, which to the database remains a claim checked against the session role (J1 R1-3). Row security stays not a default (MD-01) in either case; it remains acceptable under MD-01's three conditions.
    Rejected: row security by default (L619, L688 as defaults): rejected by MD-01; they win under MD-01's three conditions. Session-level settings for context: never (L311). Context from a client-supplied id: never (L311).
    Realizes: PIG-WEB-ALLOCATION.ROW_SECURITY; ALLOCATION.GUARD.3 (actor claim and pairing); ALLOCATION.ACT.4 (actor recorded).
