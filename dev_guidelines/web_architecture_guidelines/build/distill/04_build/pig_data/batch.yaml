- op: node.create
  uid: PIG-WEB-DATA.MAINTAIN.5
  name: Backup and Recovery
  intent: 'Recovery to a chosen moment is the default: base backups plus continuous WAL archiving to a repository on another host, with a backup counting only once a restore of it has been rehearsed on a schedule. Logical dumps serve portability only, fsync is never off, and synchronous_commit is relaxed only for data that may be lost on a crash.'
  parent: PIG-WEB-DATA.MAINTAIN
  epistemic_state: 'known | unvalidated: per-transaction synchronous_commit scope | gap: recovery objectives (how much loss, how long a restore) have no row'
  constraints:
  - 'Point-in-time recovery by default: base backups plus continuous WAL archiving to a repository on another host, with retention and tracked chains (L218, L222); the archive command strict (L218).'
  - Archiving tested and monitored before the first base backup; a backup counts only once a restore of it has been rehearsed, and restores are rehearsed on a schedule (L219).
  - Logical dumps (with roles dumped separately) only for portability and partial copies, never as the recovery plan (L220).
  - Configuration in version control (L221).
  - fsync on, write caches safe (L223); synchronous_commit on by default; off only per transaction or per role for data that may be lost on a crash, such as rebuildable caches (L223's trade-off made explicit; per-transaction scope inferred).
  design_notes: |-
    Question: how the database is backed up and proven restorable.
    Positions: (consensus): L218 recovery to a moment needs a base backup plus continuous WAL archiving; the archive command succeeds only on real success and refuses to overwrite; L219 archiving set up, tested and monitored before the first base backup; restores rehearsed (inferred wording); L220 pg_dump is a logical snapshot of one database, without roles, not point-in-time recovery; L221 configuration files are not restored by WAL replay and live in version control; L222 backup repository on a separate host, with retention and tracked full, differential, incremental chains; L223 fsync never off; safe write caches; synchronous_commit is the explicit durability and latency trade-off.
    Forces: durability and recoverability (integrity) against storage cost and commit latency.
    Decision and grounds: all adopted (max, uncontested).
      - Point-in-time recovery by default: base backups plus continuous WAL archiving to a repository on another host, with retention and tracked chains (L218, L222); the archive command strict (L218).
      - Archiving tested and monitored before the first base backup; a backup counts only once a restore of it has been rehearsed, and restores are rehearsed on a schedule (L219).
      - Logical dumps (with roles dumped separately) only for portability and partial copies, never as the recovery plan (L220).
      - Configuration in version control (L221).
      - fsync on, write caches safe (L223); synchronous_commit on by default; off only per transaction or per role for data that may be lost on a crash, such as rebuildable caches (L223's trade-off made explicit; per-transaction scope inferred).
    Rejected: logical dumps as the only backup: rejected (L220). fsync off: never (L223).
    Realizes: ALLOCATION.RECORD.1 (the system of record survives loss). High availability is deferred (MAINTAIN.7).
