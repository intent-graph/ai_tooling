- op: node.create
  uid: PIG-WEB-DATA.ORGANIZE.6
  name: Schemas and Tenancy
  intent: Schemas are business-domain namespaces with nothing in the shared public schema; the function API schema is the one technical namespace, justified by the permissions it carries. The default is a single tenant, so no tenancy mechanism is built; a multi-tenant project records its choice, with the tenant key leading every composite key and row-level security only under its three conditions.
  parent: PIG-WEB-DATA.ORGANIZE
  epistemic_state: 'known: MD-01 | unvalidated: multi-tenant criteria beyond L128 are inferred (light scope)'
  constraints:
  - Schemas are domain namespaces (L513, MAINT, max); no application object in `public`, and CREATE on `public` revoked (L180, L181).
  - 'The function API''s dedicated schema (DB_API) is a legitimate schema under L513''s "access need" criterion: it is the object that consumer roles receive USAGE and EXECUTE on (GUARD.2). It is the one technical namespace, and it is justified by permissions, not by layering (inferred; no conflict with L513).'
  - 'Tenancy: the default context is single tenant (J1), so no tenancy mechanism is built. When a project is multi-tenant, the choice is recorded per L128: separate databases where tenants are few and contractual or regulatory isolation is required; otherwise shared tables with the tenant key leading every composite key (ORGANIZE.2), so no row can reference another tenant''s row. Row-level security only under MD-01''s three conditions, with application checks kept and denial tested through the deployed role (L128, MD-01).'
  design_notes: |-
    Question: how schemas group objects and how tenants are isolated.
    Positions:
      - P1 tenant isolation is a recorded decision among separate databases, separate schemas, or shared tables with row-level security; with row security, keep application checks and test denial through the deployed role (L128, majority).
      - P2 schemas are namespaces by owner or purpose; nothing in the shared `public` schema (L180, inferred).
      - P3 schemas are business-domain namespaces, never technical layers; a new schema needs a distinct domain, an access need, team ownership or name isolation (L513 MAINT).
    Forces: integrity and security of isolation against operating cost; namespace clarity.
    Decision and grounds:
      - Schemas are domain namespaces (L513, MAINT, max); no application object in `public`, and CREATE on `public` revoked (L180, L181).
      - The function API's dedicated schema (DB_API) is a legitimate schema under L513's "access need" criterion: it is the object that consumer roles receive USAGE and EXECUTE on (GUARD.2). It is the one technical namespace, and it is justified by permissions, not by layering (inferred; no conflict with L513).
      - Tenancy: the default context is single tenant (J1), so no tenancy mechanism is built. When a project is multi-tenant, the choice is recorded per L128: separate databases where tenants are few and contractual or regulatory isolation is required; otherwise shared tables with the tenant key leading every composite key (ORGANIZE.2), so no row can reference another tenant's row. Row-level security only under MD-01's three conditions, with application checks kept and denial tested through the deployed role (L128, MD-01).
    Rejected: schemas as technical layers (one for views, one for tables): rejected (L513), except the function API schema above. Shared tables with row security by default for tenancy: rejected (MD-01).
    Realizes: PIG-WEB-ALLOCATION.DB_API (the API schema); PIG-WEB-ALLOCATION.ROW_SECURITY (tenancy without row security by default). Multi-tenancy is in light scope (skeleton).
