- op: node.create
  uid: PIG-WEB-DATA.GUARD.4
  name: Triggers
  intent: 'Triggers do a closed list of work that must be atomic with the write and hold for every writer: history rows, constraint triggers, same-transaction derived copies, JSON and actor validation, and updated_at stamped only when the row changes. Business transitions and multi-table operations stay in writer functions, and nothing in a trigger calls outside the database.'
  parent: PIG-WEB-DATA.GUARD
  epistemic_state: 'known | conflict: against L529 (MAINT) on updated_at | unvalidated: the stamp-on-change trigger form is inferred'
  constraints:
  - history rows (AFTER ROW, append-only; MAINTAIN.3, ACT.4);
  - constraint triggers for invariants no declarative constraint expresses, asserting the isolation level they need (GUARD.1, J1 GUARD.2), including the refusal of an active child of a soft-deleted parent (MAINTAIN.2) and dependencies lost by a Boyce-Codd decomposition (J2 DATA.ORGANIZE);
  - same-transaction maintenance of a derived copy at the top of the sync gradient (DERIVE.1, L532);
  - write-time validation of JSON documents (ORGANIZE.5, L511) and the actor checks of GUARD.3;
  - '`updated_at` (against L529): a narrow BEFORE UPDATE trigger sets it, and stamps only when the row changes (`NEW IS DISTINCT FROM OLD`, inferred; added after review, m3). Ground: under MD-03 rows are also written by owner-run data jobs and, under DB_API''s exception, by a consumer''s direct single-table write; only a trigger sets the column for every writer, as only a constraint binds every writer (J1 GUARD.2). A stale `updated_at` is not cosmetic: cache staleness checks depend on it (L537). (The earlier ground "timestamp-based readers, L594" is dropped after review, m3: L594 is about sequence ids, its extension to `updated_at` is inferred, and CONCURRENCY.5 forbids bare timestamp cursors anyway.) L216 lists exactly this use. L529''s reason, avoiding WAL traffic and needless trigger work, is met at the table: writers skip rows whose values would not change (an `IS DISTINCT FROM` predicate), and the trigger''s stamp-on-change form means a no-op update by any writer re-stamps nothing.'
  - 'Not in triggers: state transitions and multi-table business operations (the writer function, ACT.1, L596), outbox and job rows (written explicitly by the writer function, ACT.2), anything that calls outside the database (ACT.2). Each trigger is documented in its table''s comment, named so that name order is the intended firing order, and does not fire another trigger''s work (L216; the last clause inferred).'
  design_notes: |-
    Question: which work triggers may do and which stays with the writing code.
    Positions:
      - P1 triggers few, narrow and documented (updated_at, cross-table consistency, audit), because they hide side effects and fire in name order (L216, majority).
      - P2 a trigger runs in its statement's transaction and rolls back with it; BEFORE may skip or alter the row, AFTER sees the final value; use triggers where an invariant or side record must be atomic with the write (L217).
      - P3 updated_at is written by the code that updates the row, not a trigger; updates skip rows whose value would not change (L529 MAINT; contradicts L216).
      - Placements: ACT.1 gives state transitions and multi-table operations to writer functions, one per state column (L584, L596); ACT.4 gives history to triggers; GUARD.2 allows constraint triggers under Serializable or a lock; ACT.2 forbids external calls from inside the database.
    Forces: integrity (a side record or value that every writer produces) against transparency (hidden effects, L216) and write cost (L529).
    Decision and grounds: triggers do a closed list of work, each item one that must be atomic with the write and hold for every writer (L217):
      1. history rows (AFTER ROW, append-only; MAINTAIN.3, ACT.4);
      2. constraint triggers for invariants no declarative constraint expresses, asserting the isolation level they need (GUARD.1, J1 GUARD.2), including the refusal of an active child of a soft-deleted parent (MAINTAIN.2) and dependencies lost by a Boyce-Codd decomposition (J2 DATA.ORGANIZE);
      3. same-transaction maintenance of a derived copy at the top of the sync gradient (DERIVE.1, L532);
      4. write-time validation of JSON documents (ORGANIZE.5, L511) and the actor checks of GUARD.3;
      5. `updated_at` (against L529): a narrow BEFORE UPDATE trigger sets it, and stamps only when the row changes (`NEW IS DISTINCT FROM OLD`, inferred; added after review, m3). Ground: under MD-03 rows are also written by owner-run data jobs and, under DB_API's exception, by a consumer's direct single-table write; only a trigger sets the column for every writer, as only a constraint binds every writer (J1 GUARD.2). A stale `updated_at` is not cosmetic: cache staleness checks depend on it (L537). (The earlier ground "timestamp-based readers, L594" is dropped after review, m3: L594 is about sequence ids, its extension to `updated_at` is inferred, and CONCURRENCY.5 forbids bare timestamp cursors anyway.) L216 lists exactly this use. L529's reason, avoiding WAL traffic and needless trigger work, is met at the table: writers skip rows whose values would not change (an `IS DISTINCT FROM` predicate), and the trigger's stamp-on-change form means a no-op update by any writer re-stamps nothing.
      Not in triggers: state transitions and multi-table business operations (the writer function, ACT.1, L596), outbox and job rows (written explicitly by the writer function, ACT.2), anything that calls outside the database (ACT.2). Each trigger is documented in its table's comment, named so that name order is the intended firing order, and does not fire another trigger's work (L216; the last clause inferred).
    Rejected: L529's code-written `updated_at`: rejected; acceptable when every writer of the table is a writer function that sets it, with no direct-write grant and no owner-run job on that table. Triggers for business transitions: never (ACT.1). Triggers for "cross-table consistency" in L216's broad sense: only as items 2 or 3 above.
    Realizes: web-app-philosophy:ALLOCATION.ACT.1 (keeps trigger logic within what the placement allows the database); ALLOCATION.ACT.4; ALLOCATION.GUARD.2.
