operations:
- op: node.create
  uid: PIG-WEB-DATA
  name: Postgres Data Tier
  intent: 'Postgres is the system of record and holds everything that must hold whoever touches the data, because several backends and other consumers (reporting, consoles, scripts) share the database. It does this work in six ways: an organized schema, declared integrity and access, concurrency control, data maintenance over time, derived data kept in sync, and a function API reached through a pooler.'
  parent: ROOT
  epistemic_state: 'known | open child: MAINTAIN.2 (undecided: awaiting maintainer, question 1) | undecided: awaiting maintainer, read visibility of rows with per-user rules when several backends share the database | gap: collation (ORGANIZE.3)'
  design_notes: |-
    Question: how Postgres realizes the database share of each placement.
    Positions: none of its own (owns no row); roll-up of its six children.
    Decision and grounds: roll-up. Postgres is the system of record and holds everything that must hold whoever touches the data (RECORD.1, MD-03). It does that work in six ways:
      - organize: normalized tables, scope-leading composite keys for scoped rows and identity keys elsewhere, precise column types, names that carry role and type, bounded JSON validated against schemas held in the database, schemas as domain namespaces, and every index justified by a query (ORGANIZE);
      - guard: every rule a declarative constraint can express is declared; one role per consumer with narrow grants and no DELETE; no row-level security by default (MD-01); triggers only for a closed list of atomic side records (GUARD);
      - concurrency: Serializable with retry for every writing role, version checks on user-edited rows, transaction-scoped locks only, idempotent statements, commit-order-safe readers (CONCURRENCY);
      - maintain: online-safe versioned migrations with a drift gate, deletion chosen per table (default awaiting maintainer, question 1), trigger-written append-only history, human-run bulk jobs under a checklist, point-in-time recovery proven by restore (MAINTAIN);
      - derive: derived copies only with a sync plan and a drift guard, kept by a same-transaction trigger where any other writer exists; caches in classified, commented tables (DERIVE);
      - interface: the function API with its conventions and its compatibility rule, reached through a pooler with per-role limits and timeouts (INTERFACE).
    Rejected: none at this level.
    Realizes: refines web-app-philosophy:DATA (skeleton link). Through its children: RECORD.1, RECORD.2, RECORD.3, GUARD.2, GUARD.3 (per-role layer), GUARD.5, GUARD.6, ACT.1, ACT.3, ACT.4, DERIVE.1, DERIVE.3, and the stack placements DB_API, TYPE_CHAIN, ROW_SECURITY, CACHE_STORE.
  impl_pointers:
  - build/distill/03_judge/J6_pig_data/records.md::PIG-WEB-DATA
- op: node.create
  uid: PIG-WEB-DATA.ORGANIZE
  name: Schema Organization
  intent: The schema in migrations is the origin of every stored fact and of the function API's contract, and persistence models are generated from the live catalogue. It is laid out as normalized tables, keys that state scope, the most precise column types, names that read without a dictionary, bounded JSON validated in the database, schemas as domain namespaces, and indexes that each serve a stated query.
  parent: PIG-WEB-DATA
  epistemic_state: 'known | gap: collation (ORGANIZE.3)'
  design_notes: |-
    Question: how tables, keys, column types, names, JSON documents, namespaces and indexes are laid out in Postgres.
    Positions: none of its own; roll-up of ORGANIZE.1 to .7.
    Decision and grounds: roll-up. The schema in migrations is the origin of every stored fact and of the function API's contract (TYPE_CHAIN, RECORD.3); persistence models and function wrappers are generated from the live catalogue, so every organizing choice below is also a choice of what the backends' types say. The schema follows J2's "each fact once": normalized tables, repeating groups removed (ORGANIZE.1); keys that state scope (ORGANIZE.2); the most precise column type (ORGANIZE.3); names that read without a dictionary (ORGANIZE.4); JSON only where no relational shape exists, validated in the database (ORGANIZE.5); schemas as domain and access namespaces (ORGANIZE.6); indexes each serving a stated query (ORGANIZE.7).
    Rejected: none at this level.
    Realizes: PIG-WEB-ALLOCATION.TYPE_CHAIN (supplies the schema the type chain starts from: stored facts originate here). Refines web-app-philosophy:DATA.ORGANIZE.
  impl_pointers:
  - build/distill/03_judge/J6_pig_data/records.md::PIG-WEB-DATA.ORGANIZE
- op: node.create
  uid: PIG-WEB-DATA.GUARD
  name: Declared Integrity
  intent: Every rule a declarative constraint can express is declared and named, because only what is bound to the table holds for every writer. Each consumer has its own login role with narrow grants and no DELETE, row-level security is not a default, the acting user travels as a transaction-local claim that writer functions check, and triggers do only a closed list of atomic side work.
  parent: PIG-WEB-DATA
  epistemic_state: 'known | conflict: against L471 (inherited from J1), L493 (GUARD.1) and L529 (GUARD.4) | undecided: awaiting maintainer, read visibility of rows with per-user rules when several backends share the database'
  design_notes: |-
    Question: how Postgres declares integrity and access: constraints, roles, row policies and triggers.
    Positions: none of its own; roll-up of GUARD.1 to .4.
    Decision and grounds: roll-up. Every rule a declarative constraint can express is declared and named (GUARD.1); each consumer has its own login role in narrow group roles, no consumer holds DELETE or owns objects, functions that need rights the caller lacks are owned by narrow non-login roles, not by the owner role, and state columns are revoked from direct update (GUARD.2); row-level security is not a default (MD-01) and the acting user reaches the database only as a transaction-local claim that writer functions and audit triggers check (GUARD.3); triggers do a closed list of atomic side work and never business transitions (GUARD.4).
    Awaiting maintainer (X1): `undecided: awaiting maintainer, read visibility of rows with per-user rules when several backends share the database` (J1 Q1). Recorded default, J1's word for word: A provisional, with one written specification per rule and a shared denial suite; B acceptable when a per-user read rule must hold for two or more backends. In this tier: each backend filters these reads from one shared written specification, with a shared denial-test suite every backend runs; database read functions that receive the verified actor are acceptable when a per-user read rule must hold for two or more backends, and where B's condition holds, read functions join INTERFACE.1 and read GUARD.3's context. Consequence: roles that may SELECT the base tables (reporting, operator) see every row, comments included, unless their own role is restricted. The database's part otherwise is the per-role grants of GUARD.2.
    Realizes: refines web-app-philosophy:DATA.GUARD; through its children ALLOCATION.GUARD.2, GUARD.3 (per-role layer), ACT.1, ACT.4, ROW_SECURITY.
  impl_pointers:
  - build/distill/03_judge/J6_pig_data/records.md::PIG-WEB-DATA.GUARD
  - build/research/15_maintainer_doctrine/result.md::MAINT-C39
  - build/research/15_maintainer_doctrine/result.md::MAINT-C09
  - build/research/15_maintainer_doctrine/result.md::MAINT-C17
- op: node.create
  uid: PIG-WEB-DATA.CONCURRENCY
  name: Concurrency Mechanics
  intent: Every writing role runs Serializable with a whole-transaction retry owned by the caller, and user-edited rows also carry a version checked inside the writer function. Explicit locks are transaction-scoped and serve contention, queues and what Serializable cannot reach; inseparable changes are one statement, sequences are treated as gappy, and facts are written before the state label.
  parent: PIG-WEB-DATA
  epistemic_state: known
  design_notes: |-
    Question: how Postgres isolation, locks, atomic statements and sequences keep concurrent change correct.
    Positions: none of its own; roll-up of CONCURRENCY.1 to .6.
    Decision and grounds: roll-up. Every writing role runs Serializable with whole-transaction retry by the caller; user-edited rows also carry a version checked inside the writer function (CONCURRENCY.1, .2). Explicit locks are transaction-scoped and serve contention, queues and the cases Serializable does not cover (CONCURRENCY.3). Inseparable changes are one statement and re-runnable work is idempotent by form (CONCURRENCY.4). Sequences are gappy and do not follow commit order, so readers in commit order use a transaction horizon (CONCURRENCY.5). Multi-place facts are written facts first, label last (CONCURRENCY.6).
    Realizes: web-app-philosophy:ALLOCATION.GUARD.5 (concurrency control the placement gives the database); refines web-app-philosophy:DATA.GUARD.
  impl_pointers:
  - build/distill/03_judge/J6_pig_data/records.md::PIG-WEB-DATA.CONCURRENCY
- op: node.create
  uid: PIG-WEB-DATA.MAINTAIN
  name: Data Maintenance
  intent: Structure changes only through small, re-runnable, online-safe versioned migrations with a CI drift gate, and every change leaves trigger-written append-only history. Deletion is chosen per table from the reason the data is kept (the default for user-facing transactional data awaits the maintainer), large data changes are human-run batched jobs, and recovery to a moment is proven by rehearsed restores.
  parent: PIG-WEB-DATA
  epistemic_state: 'known | open child: MAINTAIN.2 (undecided: awaiting maintainer, question 1) | gap: personal-data erasure and high availability deferred'
  design_notes: |-
    Question: how Postgres schema and data are changed, retired, recorded and recovered over time.
    Positions: none of its own; roll-up of MAINTAIN.1 to .5 (.6 and .7 deferred).
    Decision and grounds: roll-up. Structure changes only through small, re-runnable, online-safe versioned migrations, with incompatible changes as expand, migrate, contract and a CI gate against drift (MAINTAIN.1). Deletion is chosen per table from the reason the data is kept; the default for user-facing transactional data awaits the maintainer (MAINTAIN.2, question 1; recommendation: archive by default). Every change leaves trigger-written, append-only history naming the consumer role and the claimed actor (MAINTAIN.3). Large data changes are human-run, batched, idempotent jobs with a convergence query (MAINTAIN.4). Recovery to a moment is possible and proven by rehearsed restores (MAINTAIN.5).
    Realizes: refines web-app-philosophy:DATA.MAINTAIN; through its children ALLOCATION.RECORD.3, ACT.3, ACT.4.
  impl_pointers:
  - build/distill/03_judge/J6_pig_data/records.md::PIG-WEB-DATA.MAINTAIN
- op: node.create
  uid: PIG-WEB-DATA.DERIVE
  name: Derived Data in Postgres
  intent: 'Postgres stores the minimum and derives the rest: a stored derived value is a copy chosen in the order generated column, same-transaction trigger, then cache table with stated staleness. Every copy has a sync plan in its table comment and a drift guard, and caches are classified, invalidated through a queue written in the source transaction, and never soft-deleted.'
  parent: PIG-WEB-DATA
  epistemic_state: known
  design_notes: |-
    Question: how Postgres holds derived values and caches and keeps them in sync with their sources.
    Positions: none of its own; roll-up of DERIVE.1 and .2 (.3 deferred).
    Decision and grounds: roll-up. Store the minimum and derive the rest (J2, L488). A stored derived value is a copy chosen in DERIVE.1's order (J1): generated column; same-transaction trigger (the writer function only when the source table admits no other writer); cache table with a stated staleness. Every copy has the sync plan of L469 in its table comment and the drift guard of L533, except generated columns, which cannot diverge (DERIVE.1). Caches are tables classified by recomputability, invalidated through a queue written in the source transaction, never served from process memory or soft-deleted (DERIVE.2).
    Realizes: refines web-app-philosophy:DATA.DERIVE; ALLOCATION.DERIVE.1, DERIVE.3, PIG-WEB-ALLOCATION.CACHE_STORE through its children.
  impl_pointers:
  - build/distill/03_judge/J6_pig_data/records.md::PIG-WEB-DATA.DERIVE
  - build/research/15_maintainer_doctrine/result.md::MAINT-C24
  - build/research/15_maintainer_doctrine/result.md::MAINT-C54
  - build/research/15_maintainer_doctrine/result.md::MAINT-C27
- op: node.create
  uid: PIG-WEB-DATA.INTERFACE
  name: Database Interface
  intent: The database offers a function API in its own schema, with one business operation per call in its own transaction, evolved by expand, migrate, contract under a catalogue gate, and with views kept off the contract. Consumers reach it through a transaction-mode pooler with per-role isolation, timeouts and connection limits.
  parent: PIG-WEB-DATA
  epistemic_state: 'known: MD-03 | undecided: awaiting maintainer, read visibility of rows with per-user rules when several backends share the database | gap: no philosophy counterpart'
  design_notes: |-
    Question: how the database offers itself to its consumers: functions, views and connections.
    Positions: none of its own; roll-up of INTERFACE.1 and .2.
    Decision and grounds: roll-up. The database offers a function API in its own schema, one call per business operation in its own transaction, evolved by expand, migrate, contract under a catalogue gate, with views kept off the contract (INTERFACE.1). Consumers reach it through a pooler in transaction mode, with role-level settings for isolation and timeouts and a connection limit per consumer role (INTERFACE.2).
    Awaiting maintainer (B1, X1): `undecided: awaiting maintainer, read visibility of rows with per-user rules when several backends share the database` (J1 Q1). Recorded default, J1's word for word: A provisional, with one written specification per rule and a shared denial suite; B acceptable when a per-user read rule must hold for two or more backends. Where B's condition holds, read functions join INTERFACE.1 and read GUARD.3's context.
    Realizes: PIG-WEB-ALLOCATION.DB_API; ALLOCATION.RECORD.2. Gap (J2's gap 1): no philosophy node holds the database interface; J2 proposed `DATA.INTERFACE` to the skeleton owner; until then this node has no same-branch refines link.
  impl_pointers:
  - build/distill/03_judge/J6_pig_data/records.md::PIG-WEB-DATA.INTERFACE
- op: node.create
  uid: PIG-WEB-DATA.ORGANIZE.1
  name: Tables and Normalization
  intent: Repeating groups become child tables with a foreign key, vertical splits of wide tables are a measured physical choice, and subtype tables share the parent's key. An array column is allowed only for a bounded, read-heavy set that references nothing, with its rules bound to the column, because no foreign key reaches inside an array.
  parent: PIG-WEB-DATA.ORGANIZE
  epistemic_state: 'known | unvalidated: binding the array check to the column is my reading of L489 under MD-03'
  constraints:
  - Repeating groups are always a child table (L169).
  - A vertical split of a wide table is a physical choice, made when a measured access pattern needs it, with the same key in each part and a one-to-one foreign key from each part to the main row (L489; the foreign key is inferred from J2's "each fact once"). The integrity and security reasons for splitting one-to-one attributes stay those of L470 (J2).
  - Type-specific tables (subtypes) share the parent's key, which is both their primary key and a foreign key to the parent (L489).
  - 'An array column is allowed only for a bounded, read-heavy set of values that reference nothing; its bound and element rules are declared, as a CHECK over an immutable function where the rule is row-local (L174, L494), or the write-time trigger of GUARD.4 where it is not. "Validated by a function" (L489) is met by binding that function to the column, not by asking every writer to call it (inferred; same ground as J1 GUARD.2: only what is bound to the table holds for every writer under MD-03).'
  design_notes: |-
    Question: how repeating groups, wide tables and arrays are handled in table design.
    Positions:
      - P1 repeating groups (Class1, Class2, Class3) move to a child table with a foreign key (L169; SRC-291, single source, no dissent).
      - P2 split very wide tables vertically only when needed, by access pattern, the same key in each part; type-specific tables share a common key set; arrays only for bounded, read-heavy sets validated by a function, never for unbounded sets or where references need integrity (L489 MAINT).
      - Inherited: third normal form by default and Boyce-Codd, fourth and fifth normal form where they apply, a dependency lost by a Boyce-Codd decomposition being enforced by a constraint trigger (J2, DATA.ORGANIZE, L037, L469); one-to-one attributes as nullable columns, split only for L470's reasons (J2).
    Forces: P1 serves integrity (one fact per row, a declared reference per member). P2 serves read and write performance of wide rows (vertical split) and query convenience (arrays) at the cost of a constraint the database cannot declare: no foreign key reaches inside an array.
    Decision and grounds: P1 and P2, with the array rule bound to the database.
      - Repeating groups are always a child table (L169).
      - A vertical split of a wide table is a physical choice, made when a measured access pattern needs it, with the same key in each part and a one-to-one foreign key from each part to the main row (L489; the foreign key is inferred from J2's "each fact once"). The integrity and security reasons for splitting one-to-one attributes stay those of L470 (J2).
      - Type-specific tables (subtypes) share the parent's key, which is both their primary key and a foreign key to the parent (L489).
      - An array column is allowed only for a bounded, read-heavy set of values that reference nothing; its bound and element rules are declared, as a CHECK over an immutable function where the rule is row-local (L174, L494), or the write-time trigger of GUARD.4 where it is not. "Validated by a function" (L489) is met by binding that function to the column, not by asking every writer to call it (inferred; same ground as J1 GUARD.2: only what is bound to the table holds for every writer under MD-03).
    Rejected: arrays for unbounded sets or members that reference rows: never (L489; a member cannot carry a foreign key). A vertical split without a measured access need: rejected; acceptable when L470's reasons apply instead.
    Realizes: J2 DATA.ORGANIZE; TYPE_CHAIN through the parent.
  impl_pointers:
  - build/distill/03_judge/J6_pig_data/records.md::PIG-WEB-DATA.ORGANIZE.1
  - build/research/14_thin_spots/result.md::THIN-C32
  - build/research/14_thin_spots/result.md::THIN-C36
  - build/research/01_data_tier/result.md::DATA-C12
  - build/research/15_maintainer_doctrine/result.md::MAINT-C24
  - build/research/15_maintainer_doctrine/result.md::MAINT-C71
  - build/research/15_maintainer_doctrine/result.md::MAINT-C72
  - build/research/15_maintainer_doctrine/result.md::MAINT-C10
- op: node.create
  uid: PIG-WEB-DATA.ORGANIZE.2
  name: Keys
  intent: Every table has an identity primary key, composite and led by the scope column where rows are scoped to a parent, so a child can never reference a row in another scope. Keys are 8-byte identity columns unless the table's size is bounded by design, and a UUID needs a stated reason and is then UUIDv7, because a key that overflows is repaired by rewriting the table at its largest.
  parent: PIG-WEB-DATA.ORGANIZE
  epistemic_state: 'known | conflict: partly against L503 (MAINT) on default key width | unvalidated: cross-scope reference integrity and client identifiers as a UUID reason are inferred; UUIDv7 locality rests on T4 benchmarks'
  constraints:
  - Every table has a primary key (L170).
  - 'Shape (L499 to L501, MAINT, max): a row scoped to a parent that most queries filter by gets a composite key led by the scope column, down to the most selective scope level and at most about four columns, with a surrogate below that (L500). Foreign keys to it carry every key column in order (L500), which also makes a cross-scope reference impossible: a child and the row it references share the scope by construction (inferred; the integrity gain L501 does not list). Top-level entities get a single surrogate key.'
  - 'Soft deletion is not a criterion of key shape: the doctrine''s own architecture note makes them independent and partial indexes work with any key (doctrine-internal tension 1 in the doctrine research result, `build/research/15_maintainer_doctrine/result.md`); only the scope question decides.'
  - 'Type: identity columns, never serial; no auto-number for natural or composite keys (L502).'
  - 'Width (partly against L503): 8-byte identity by default; a 4-byte key only for a table whose cardinality is bounded by design (lookup, status and type tables, configuration), not by a forecast. Types identical on both sides of every relationship (L503). Ground (corrected after review, m1): an overflowing key refuses writes, which is a loss of availability and changeability, not of integrity, since no stored fact becomes wrong. The verdict rests on J1''s tie-break, "the force whose loss is hardest to repair later wins": the narrow width''s failure is repaired by a rewrite of the table and of every referencing column at the moment the table is largest (L197), while the wide width costs 4 bytes per key column in rows and indexes, paid gradually and never needing a repair.'
  - 'UUIDs: only for L504''s reasons. When one is used it is UUIDv7, never UUIDv4 for a key (L179: index locality; SRC-325 is T4, so the locality claim is to be tested on the workload). Client-supplied identifiers for idempotent creates (GUARD.6, L655) are one such reason (integration, inferred). A UUIDv7''s timestamp is never the creation time (L178, ORGANIZE.3). A deterministic UUID in a stored generated column serves a public identifier over a composite natural key (L504).'
  design_notes: |-
    Question: which primary-key shape and type each table gets.
    Positions:
      - P1 every table has a primary key (L170, consensus).
      - P2 the key type is a recorded decision among bigint identity, UUIDv7 and UUIDv4 (L179, contested; identity compact but guessable and tied to one database; UUIDv7 time-ordered and non-enumerable; UUIDv4 poor locality, T4 benchmarks).
      - P3 shape by two questions: is the row scoped to a parent that most queries filter by, and does the table use soft deletion; scoped tables get a composite key led by the scope column (L499 MAINT); at most about four columns, foreign keys reference every column in order, row-value comparison in joins (L500 MAINT); costs and benefits stated (L501 MAINT).
      - P4 identity columns, not serial; no auto-number where a natural key exists or the key is composite (L502 MAINT; agrees L177).
      - P5 integer width by expected cardinality: 4 bytes under about two billion rows, 8 bytes for very large tables or keys referenced by large tables; identical types on both sides of every relationship (L503 MAINT), against the research recommendation of bigint by default (recorded in L503's positions).
      - P6 UUID keys only for a stated technical reason (global uniqueness, external integration, sequence contention); a deterministic UUID in a stored generated column when a public identifier must follow a composite natural key (L504 MAINT).
    Forces: integrity (a key states identity and, when composite, scope) against index width and query discipline (L501). P5's 4-byte default saves 4 bytes per key column in rows and indexes and costs a hard write failure at overflow, repaired by a table rewrite of the table and of every referencing column (L197, L503's own same-type rule) at the moment the table is largest.
    Decision and grounds:
      - Every table has a primary key (L170).
      - Shape (L499 to L501, MAINT, max): a row scoped to a parent that most queries filter by gets a composite key led by the scope column, down to the most selective scope level and at most about four columns, with a surrogate below that (L500). Foreign keys to it carry every key column in order (L500), which also makes a cross-scope reference impossible: a child and the row it references share the scope by construction (inferred; the integrity gain L501 does not list). Top-level entities get a single surrogate key.
      - Soft deletion is not a criterion of key shape: the doctrine's own architecture note makes them independent and partial indexes work with any key (doctrine-internal tension 1 in the doctrine research result, `build/research/15_maintainer_doctrine/result.md`); only the scope question decides.
      - Type: identity columns, never serial; no auto-number for natural or composite keys (L502).
      - Width (partly against L503): 8-byte identity by default; a 4-byte key only for a table whose cardinality is bounded by design (lookup, status and type tables, configuration), not by a forecast. Types identical on both sides of every relationship (L503). Ground (corrected after review, m1): an overflowing key refuses writes, which is a loss of availability and changeability, not of integrity, since no stored fact becomes wrong. The verdict rests on J1's tie-break, "the force whose loss is hardest to repair later wins": the narrow width's failure is repaired by a rewrite of the table and of every referencing column at the moment the table is largest (L197), while the wide width costs 4 bytes per key column in rows and indexes, paid gradually and never needing a repair.
      - UUIDs: only for L504's reasons. When one is used it is UUIDv7, never UUIDv4 for a key (L179: index locality; SRC-325 is T4, so the locality claim is to be tested on the workload). Client-supplied identifiers for idempotent creates (GUARD.6, L655) are one such reason (integration, inferred). A UUIDv7's timestamp is never the creation time (L178, ORGANIZE.3). A deterministic UUID in a stored generated column serves a public identifier over a composite natural key (L504).
      - Whether an internal key may appear outside the system (URLs, agent payloads) is the interface's decision (J7, the boundary L179 names); this node only guarantees that a non-enumerable alternate key can be added as a unique UUIDv7 or generated column.
    Rejected:
      - L503's 4-byte default by forecast: rejected; acceptable when the table's cardinality is bounded by design.
      - UUIDv4 as a key: rejected (L179, L504); acceptable never as a primary key; as a random token column it is outside this node.
      - Soft deletion as a key-shape criterion (L499's second question): rejected, doctrine-internal tension 1.
      - Single surrogate keys for scoped rows: rejected; acceptable when no query family filters by the parent and no cross-scope reference must be prevented.
    Realizes: J2 DATA.ORGANIZE; TYPE_CHAIN; supports GUARD.6 (client identifiers). MD-01's composite-key condition for row security is met by this shape where a scope exists, without implying row security.
  impl_pointers:
  - build/distill/03_judge/J6_pig_data/records.md::PIG-WEB-DATA.ORGANIZE.2
  - build/research/01_data_tier/result.md::DATA-C08
  - build/research/01_data_tier/result.md::DATA-C14
  - build/research/01_data_tier/result.md::DATA-C16
  - build/research/01_data_tier/result.md::DATA-C15
  - build/research/01_data_tier/result.md::DATA-C33
  - build/research/15_maintainer_doctrine/result.md::MAINT-C01
  - build/research/15_maintainer_doctrine/result.md::MAINT-C02
  - build/research/15_maintainer_doctrine/result.md::MAINT-C03
  - build/research/15_maintainer_doctrine/result.md::MAINT-C04
  - build/research/15_maintainer_doctrine/result.md::MAINT-C05
  - build/research/15_maintainer_doctrine/result.md::MAINT-C06
  - build/research/19_agent_users/result.md::AGENT-C30
- op: node.create
  uid: PIG-WEB-DATA.ORGANIZE.3
  name: Column Types
  intent: 'Column types are chosen for precision so the structure itself refuses wrong values: timestamptz for time, text with CHECK, numeric for quantities, lookup tables for enumerations, positive NOT NULL booleans, and created_at on every table with updated_at on those whose rows change. Values are stored canonical and formatted only where rendered; the collation choice is left open because no evidence grounds it.'
  parent: PIG-WEB-DATA.ORGANIZE
  epistemic_state: 'known | conflict: partly against L498 (MAINT): no updated_at on append-only tables | gap: collation has no row; left open with its requirements | unvalidated: that updated_at states nothing on append-only tables is inferred'
  constraints:
  - 'time: timestamptz everywhere; event times named for the event (`*_at`, ORGANIZE.4) and ordered by CHECK (L498); a UUIDv7 never stands for creation time (L178);'
  - 'text: `text` with a CHECK for any length limit; never char(n) or a length-limited varchar (L177, L494);'
  - 'money and quantities: numeric with declared precision; never `money` (L177);'
  - 'enumerations: a lookup table referenced by foreign key; CHECK IN only for short sets that are stable by definition (L497);'
  - 'booleans: NOT NULL, a default, a positive name (L497, L506);'
  - '`created_at` on every table, append-only tables included, where it is the record time; `updated_at` on every table whose rows are updated, written by the trigger of GUARD.4 (L498). Partial departure from L498 (recorded after review, m4): append-only tables (history, archive and queue rows) carry no `updated_at`, since their rows are never updated and the column would state nothing (inferred). Only `updated_at` departs; the record-time name stays `created_at`.'
  - 'Canonical storage: values are stored canonical (UTC instants, plain numbers, codes); formatting happens where the text is rendered (PRESENT.2, L632).'
  design_notes: |-
    Question: which column types are used for time, text, numbers, enumerations and flags.
    Positions:
      - P1 timestamptz, text with CHECK for limits, numeric (not money), identity columns, over timestamp without time zone, char(n), money and serial (L177, consensus).
      - P2 a UUIDv7 timestamp is not the creation time; keep an explicit timestamptz (L178).
      - P3 lookup table with a foreign key over a native enum; CHECK with an IN list only for short stable sets; booleans NOT NULL with a default, positively phrased (L497 MAINT).
      - P4 every table carries created_at and updated_at as timestamptz NOT NULL default now(); event times named for the event; ordering between timestamps is a CHECK; no timestamp without time zone (L498 MAINT).
      - Native enum types: named by L497 as the alternative it rejects; no row defends them.
    Forces: all serve integrity through precision (L485, J2). P3 trades a join for metadata and change without a type migration; native enums are compact but change only by type migration.
    Decision and grounds: P1 to P4 adopted (MAINT and research agree; max):
      - time: timestamptz everywhere; event times named for the event (`*_at`, ORGANIZE.4) and ordered by CHECK (L498); a UUIDv7 never stands for creation time (L178);
      - text: `text` with a CHECK for any length limit; never char(n) or a length-limited varchar (L177, L494);
      - money and quantities: numeric with declared precision; never `money` (L177);
      - enumerations: a lookup table referenced by foreign key; CHECK IN only for short sets that are stable by definition (L497);
      - booleans: NOT NULL, a default, a positive name (L497, L506);
      - `created_at` on every table, append-only tables included, where it is the record time; `updated_at` on every table whose rows are updated, written by the trigger of GUARD.4 (L498). Partial departure from L498 (recorded after review, m4): append-only tables (history, archive and queue rows) carry no `updated_at`, since their rows are never updated and the column would state nothing (inferred). Only `updated_at` departs; the record-time name stays `created_at`.
      - Canonical storage: values are stored canonical (UTC instants, plain numbers, codes); formatting happens where the text is rendered (PRESENT.2, L632).
    Rejected: L498's `updated_at` on append-only tables: rejected; acceptable when a table described as append-only in fact receives updates, which makes it an ordinary table. timestamp without time zone, char(n), money, serial: never (L177). Native enums: rejected; acceptable when the set is fixed by definition and carries no metadata, and then a CHECK IN serves the same purpose without a type (L497). A UUIDv7 as creation time: never (L178).
    Realizes: J2 DATA.ORGANIZE and DATA.GUARD (precise structure, L485); ALLOCATION.PRESENT.2 (canonical storage); ALLOCATION.DERIVE.2 (collation, open).
