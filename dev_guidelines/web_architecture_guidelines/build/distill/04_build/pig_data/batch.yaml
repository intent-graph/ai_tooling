- op: node.create
  uid: PIG-WEB-DATA.CONCURRENCY.1
  name: Default Concurrency Strategy
  intent: Serializable is the default isolation of every writing role, owner included, set on the role so it survives transaction pooling, with a version column checked in the write for user-edited rows. Every caller of a writer function owns a bounded retry of the whole call, because a serialization failure aborts the transaction and write skew survives weaker isolation.
  parent: PIG-WEB-DATA.CONCURRENCY
  epistemic_state: 'known | unvalidated: Serializable for the owner role and the job exception rule are inferred from L573; throughput under the default is not measured'
  constraints:
  - Serializable is the default isolation of every writing role, owner role included, set on the role (`ALTER ROLE ... SET default_transaction_isolation`), not per session, so it survives transaction pooling (L569, L203, L200). A lower-isolation writer anywhere voids the guarantee for all (L573), hence no writing role is exempt.
  - Writer functions and constraint triggers assert `serializable` and raise otherwise (J1 GUARD.2).
  - 'Retry: a serialization failure aborts the transaction, so the function cannot retry itself; the caller retries the whole call (one call is one transaction, J1 R1-4). Every consumer that calls a writer function owns a bounded retry; the shared specification names it (added after review, m6): the backend''s bounded retry wrapper at the use-case boundary (L575, J7), the job runner per idempotent batch (L543), and MD-03''s operator consoles and scripts (handed to J9 for console tooling).'
  - 'User-edited rows: a version column; the writer function takes the expected version and writes with it in the predicate (L676, CONCURRENCY.2); a lease row checked by the writer function where conflicts are frequent or lost work costly (L570, J1 GUARD.5).'
  - 'Read-only roles: reporting on the primary reads at Repeatable Read, or `SERIALIZABLE READ ONLY DEFERRABLE` where a report must be serializable (L574); reports on a replica accept snapshot anomalies (L573). No check that decides a write reads a replica (J2).'
  - '(b) where (a) cannot reach: a write that must be protected on a replica uses Repeatable Read plus explicit locks on the primary (L573); a human-run job that cannot run Serializable is a recorded exception under L545''s checklist and takes explicit locks on what it writes, because it voids the guarantee for concurrent traffic while it runs (L573; inferred).'
  design_notes: |-
    Question: which concurrency-control strategy is the default for transactions and for user-edited rows.
    Positions:
      - P1 a recorded choice among (a) Serializable with retry for all transactions, (b) default isolation plus selected locks and constraints, (c) optimistic version columns on user-edited rows (L568, contested: SRC-331 for (a); SRC-343 selected Serializable or locks; SRC-331 Repeatable Read plus locks where replicas must be protected; SRC-344, SRC-345 by conflict rate).
      - P2 Serializable for all writes and consistent reads needs no other effort; make it the default (`default_transaction_isolation`) with automatic retry (L569).
      - P3 optimistic when conflicts are rare, pessimistic (a lease checked by the write path) when frequent or when losing long work is unacceptable (L570).
      - Hand-off from J1 GUARD.2: the review recommends (a), J1 concurs (inferred); set the default per consumer role; writer functions assert it; replica reports accept snapshot anomalies (L573).
    Forces: correctness of every concurrent write (a) against retry handling and throughput under contention; (b) puts correctness on each developer finding each anomaly, and write skew survives Repeatable Read (L577); (c) solves a different problem, lost updates across requests and user think time (L475), and is needed whatever the isolation.
    Decision and grounds: (a) for transactions and (c) for user-edited rows, (b) only where (a) cannot reach.
      - Serializable is the default isolation of every writing role, owner role included, set on the role (`ALTER ROLE ... SET default_transaction_isolation`), not per session, so it survives transaction pooling (L569, L203, L200). A lower-isolation writer anywhere voids the guarantee for all (L573), hence no writing role is exempt.
      - Writer functions and constraint triggers assert `serializable` and raise otherwise (J1 GUARD.2).
      - Retry: a serialization failure aborts the transaction, so the function cannot retry itself; the caller retries the whole call (one call is one transaction, J1 R1-4). Every consumer that calls a writer function owns a bounded retry; the shared specification names it (added after review, m6): the backend's bounded retry wrapper at the use-case boundary (L575, J7), the job runner per idempotent batch (L543), and MD-03's operator consoles and scripts (handed to J9 for console tooling).
      - User-edited rows: a version column; the writer function takes the expected version and writes with it in the predicate (L676, CONCURRENCY.2); a lease row checked by the writer function where conflicts are frequent or lost work costly (L570, J1 GUARD.5).
      - Read-only roles: reporting on the primary reads at Repeatable Read, or `SERIALIZABLE READ ONLY DEFERRABLE` where a report must be serializable (L574); reports on a replica accept snapshot anomalies (L573). No check that decides a write reads a replica (J2).
      - (b) where (a) cannot reach: a write that must be protected on a replica uses Repeatable Read plus explicit locks on the primary (L573); a human-run job that cannot run Serializable is a recorded exception under L545's checklist and takes explicit locks on what it writes, because it voids the guarantee for concurrent traffic while it runs (L573; inferred).
    Rejected: (b) as the default: rejected; it leaves write skew to each author (L577). Acceptable as the exceptions above. (c) alone: rejected for transactions; it is a second, complementary layer.
