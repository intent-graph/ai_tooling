- op: node.create
  uid: PIG-WEB-DATA.INTERFACE.2
  name: Connections and Pooling
  intent: Consumers reach Postgres through an external pooler in transaction mode, so session state is avoided and context travels in transaction-local settings. Each consumer role gets its own connection limit, statement, lock and idle-in-transaction timeouts, and default isolation set on the role, with owner-run jobs and migrations on session-mode or direct connections.
  parent: PIG-WEB-DATA.INTERFACE
  epistemic_state: 'known | unvalidated: pool sizing formula is a T3 heuristic | gap: prepared-statement support in transaction-mode pooling by pooler version (research)'
  constraints:
  - 'An external pooler in transaction mode for backends and consoles; the design already avoids session state: context in transaction-local settings (L311, GUARD.3), only transaction-scoped advisory locks (L580), settings on the role, not the session (L203). Prepared statements, LISTEN and WITH HOLD cursors are not used through it (L200), which stays the safe default; a listener for database notifications connects directly or in session mode (J8, REALTIME.5). Two points added after review (m7), neither checked against a source: newer PgBouncer releases are reported to support protocol-level prepared statements in transaction mode (marked for research); and database drivers that cache prepared statements by default must be configured to match the pooler (handed to J7 for the backends and J9 for consoles and scripts).'
  - Owner-run jobs and migrations use session-mode or direct connections (detachable sessions, L545; concurrent index builds outside a transaction, L196).
  - Pool size per L199 as a starting point, measured on the workload (the formula is a heuristic).
  - 'Per consumer role (L201, L203): a connection limit, so BI or a script cannot starve the backends; statement_timeout, lock_timeout and idle_in_transaction_session_timeout set on the role (short for backends, longer for reporting, short lock_timeout for the owner''s DDL, L193); default isolation on the role (CONCURRENCY.1). Reserved slots keep administration possible (L201).'
  - idle_in_transaction_session_timeout on every role, so an abandoned transaction neither holds locks nor blocks vacuum (L202).
  - Remote connections over TLS with scram-sha-256 (L186, GUARD.2).
  design_notes: |-
    Question: how consumers connect, how connections are pooled and how sessions are bounded.
    Positions: (consensus): L199 small server-side concurrency (rule of thumb: cores times 2 plus effective spindles) enforced by an external pooler; max_connections slightly above the pool total (one T3 source for the formula); L200 transaction-mode pooling breaks session state (SET, LISTEN, WITH HOLD cursors, session advisory locks, prepared statements in PgBouncer's documented modes): avoid them or use session mode; L201 per-role connection limits and reserved slots keep administrative access when the pool saturates; L202 idle_in_transaction_session_timeout set; L203 lock_timeout, statement_timeout and idle timeouts per role or session, not globally.
    Forces: availability and integrity under load (no abandoned transaction holding locks, no consumer starving others) against connection convenience.
    Decision and grounds: all adopted (max), shaped to J1's access paths.
      - An external pooler in transaction mode for backends and consoles; the design already avoids session state: context in transaction-local settings (L311, GUARD.3), only transaction-scoped advisory locks (L580), settings on the role, not the session (L203). Prepared statements, LISTEN and WITH HOLD cursors are not used through it (L200), which stays the safe default; a listener for database notifications connects directly or in session mode (J8, REALTIME.5). Two points added after review (m7), neither checked against a source: newer PgBouncer releases are reported to support protocol-level prepared statements in transaction mode (marked for research); and database drivers that cache prepared statements by default must be configured to match the pooler (handed to J7 for the backends and J9 for consoles and scripts).
      - Owner-run jobs and migrations use session-mode or direct connections (detachable sessions, L545; concurrent index builds outside a transaction, L196).
      - Pool size per L199 as a starting point, measured on the workload (the formula is a heuristic).
      - Per consumer role (L201, L203): a connection limit, so BI or a script cannot starve the backends; statement_timeout, lock_timeout and idle_in_transaction_session_timeout set on the role (short for backends, longer for reporting, short lock_timeout for the owner's DDL, L193); default isolation on the role (CONCURRENCY.1). Reserved slots keep administration possible (L201).
      - idle_in_transaction_session_timeout on every role, so an abandoned transaction neither holds locks nor blocks vacuum (L202).
      - Remote connections over TLS with scram-sha-256 (L186, GUARD.2).
    Rejected: session-mode pooling for backends: rejected; acceptable when a consumer needs session state the design cannot avoid. Global timeouts in server configuration: rejected (L203).
    Realizes: PIG-WEB-ALLOCATION.DB_API (how consumers reach the API); ALLOCATION.RECORD.2 (one role per consumer, bounded). Topology of the pooler belongs to J9 (TRANSVERSE.TOPOLOGY).
