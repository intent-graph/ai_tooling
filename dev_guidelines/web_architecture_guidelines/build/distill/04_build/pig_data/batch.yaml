- op: node.create
  uid: PIG-WEB-DATA.ORGANIZE.5
  name: JSON Documents
  intent: JSON is stored as JSONB, only where no relational shape exists (an indivisible object, a flexible periphery on a normalized core), never for core entities or queried fields. Every stored document is validated on write by a trigger against schemas held in a registry table, so validation holds for every writer, and a breaking schema change adds a new named version beside the old.
  parent: PIG-WEB-DATA.ORGANIZE
  epistemic_state: 'known | unvalidated: binding validation by trigger extends L509 from L511 | gap: validator mechanism not read'
  constraints:
  - 'Use: L508''s list and L531''s cases (an indivisible object; a normalized core with a flexible periphery). Anything that drives logic, filtering or joins is a column (L508, L531).'
  - 'Validation: every stored JSON document is validated on write by a trigger that calls the registry''s validate function; function inputs and outputs that carry JSON validate through the same function. A CHECK cannot do it because the validator reads the registry and is not immutable (L174). This resolves doctrine-internal tension 4 (a direct write can bypass function-level validation) toward enforcement at the table, as J1 did for GUARD.2.'
  - 'Registry: source form, composition by reference, expanded forms regenerated (L510).'
  - 'Evolution: a relaxing change in place; a breaking change as a new named version beside the old one, the old one retired after its documents are migrated (L512; the same expand, migrate, contract as MAINTAIN.1). A breaking change to a stored document schema migrates the stored documents in the same release, so no table holds mixed versions (L511).'
  design_notes: |-
    Question: when JSON documents are stored and how their schemas are held and evolved.
    Positions:
      - P1 JSONB, never json, for semi-structured metadata, configuration, cached aggregates, external payloads and event data; not for core entities or often-queried fields; at most three levels; no binary; bounded size (L508 MAINT).
      - P2 documents crossing a boundary are validated against schemas held in a registry table, through one validate function every code path calls; schemas compose by reference (L509 MAINT).
      - P3 registry rows hold source form; expanded forms are derived artifacts (L510 MAINT).
      - P4 per-scope schemas layer on a base contract and are enforced by a write-time trigger; changing one is a data migration done with the schema; versioning planned (L511 MAINT).
      - P5 relax in place; a breaking change adds a new named version and soft-deletes the old one (L512 MAINT).
      - Related: L531 (indivisible object and flexible periphery as legitimate JSON uses).
    Forces: integrity of documents the relational schema cannot describe, against flexibility of semi-structured data. Validation that "every code path calls" (P2) holds only for writers that call it; a trigger (P4) holds for every writer.
    Decision and grounds: P1 to P5 adopted (MAINT, max), with validation bound to the table.
      - Use: L508's list and L531's cases (an indivisible object; a normalized core with a flexible periphery). Anything that drives logic, filtering or joins is a column (L508, L531).
      - Validation: every stored JSON document is validated on write by a trigger that calls the registry's validate function; function inputs and outputs that carry JSON validate through the same function. A CHECK cannot do it because the validator reads the registry and is not immutable (L174). This resolves doctrine-internal tension 4 (a direct write can bypass function-level validation) toward enforcement at the table, as J1 did for GUARD.2.
      - Registry: source form, composition by reference, expanded forms regenerated (L510).
      - Evolution: a relaxing change in place; a breaking change as a new named version beside the old one, the old one retired after its documents are migrated (L512; the same expand, migrate, contract as MAINTAIN.1). A breaking change to a stored document schema migrates the stored documents in the same release, so no table holds mixed versions (L511).
      - The validator's implementation (extension or SQL) was not read: open.
    Rejected: json (text) type: never (L508). JSON for core entities or queried fields: never. Validation only by convention in callers: rejected under MD-03; acceptable when a single writer path exists and the document never crosses a boundary (inferred).
    Realizes: J2 DATA.GUARD (precise structure); TYPE_CHAIN (document schemas are stored facts of the contract).
  impl_pointers:
