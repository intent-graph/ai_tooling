- op: node.create
  uid: PIG-WEB-DATA.CONCURRENCY.2
  name: Isolation Mechanics
  intent: Isolation is recorded per operation, read-modify-write never spans the backend and the database, and failed transactions (40001, 40P01) are retried as a whole call with bounded attempts. Critical invariants are backed by constraints, not isolation alone, and logic tests and commit-only concurrency tests are separated.
  parent: PIG-WEB-DATA.CONCURRENCY
  epistemic_state: known
  constraints:
  - 'The isolation of each operation is recorded (L571): Serializable by default; every deviation named with its reason (CONCURRENCY.1).'
  - 'Read-modify-write never spans the backend and the database: the change is one statement, or a version predicate, inside the writer function (L572, L676). A version write that affects zero rows raises a stable error the backend maps to a precondition failure (J1 GUARD.5; J7).'
  - 'Serializable kept cheap (L574): read-only transactions declared, transactions short (L228), connections bounded by the pooler (INTERFACE.2), predicates indexed (ORGANIZE.7), explicit locks that Serializable made redundant removed.'
  - 'Retry (L575): 40001 and 40P01 retried as the whole call, logic included, with a bounded number of attempts and backoff; 23505 not retried blindly (it may be persistent); the wrapper sits in the backend at the use-case boundary (J7, L066 as amended by J1: the function owns the transaction, the backend owns the retry), and every other caller of a writer function (job runner, consoles, scripts) owns its own bounded retry, named in the shared specification (m6; console tooling handed to J9).'
  - Critical invariants are constraints, not isolation alone, and the server stays on a current minor release (L576).
  - 'Tests (X4): logic tests on shared data run in never-committing transactions (L567). Behaviour that only shows at commit (serialization retries, lock waits, deferred constraints, the outbox) is tested with committing sessions in a disposable database, never a shared one. Concurrency tests for the rules GUARD.2 requires (Serializable with retry, locks) are part of the default test suite, not a gap.'
  design_notes: |-
    Question: how isolation levels behave, what they cost and how failed transactions are retried.
    Positions: (consensus; T1 and T2 sources): L571 choose and record isolation per use case, with the anomalies each level permits; L572 Read Committed re-evaluates a waiting UPDATE, so read-modify-write in code loses updates: one atomic statement, a row lock or a version; L573 Serializable's preconditions and limits; L574 keeping Serializable cheap; L575 retry 40001 and 40P01 as whole transactions, 23505 only with care, bounded attempts, the application owns the wrapper; L576 a documented level is not proof (Jepsen, SSI bugs): patch level current, critical invariants backed by constraints; L577 Repeatable Read is snapshot isolation, write skew remains; L676 the version predicate inside the write, then check the affected-row count.
    Forces: correctness under concurrency against throughput and retry cost.
    Decision and grounds: all adopted as the mechanics of CONCURRENCY.1 (max, uncontested).
      - The isolation of each operation is recorded (L571): Serializable by default; every deviation named with its reason (CONCURRENCY.1).
      - Read-modify-write never spans the backend and the database: the change is one statement, or a version predicate, inside the writer function (L572, L676). A version write that affects zero rows raises a stable error the backend maps to a precondition failure (J1 GUARD.5; J7).
      - Serializable kept cheap (L574): read-only transactions declared, transactions short (L228), connections bounded by the pooler (INTERFACE.2), predicates indexed (ORGANIZE.7), explicit locks that Serializable made redundant removed.
      - Retry (L575): 40001 and 40P01 retried as the whole call, logic included, with a bounded number of attempts and backoff; 23505 not retried blindly (it may be persistent); the wrapper sits in the backend at the use-case boundary (J7, L066 as amended by J1: the function owns the transaction, the backend owns the retry), and every other caller of a writer function (job runner, consoles, scripts) owns its own bounded retry, named in the shared specification (m6; console tooling handed to J9).
      - Critical invariants are constraints, not isolation alone, and the server stays on a current minor release (L576).
      - Tests (X4): logic tests on shared data run in never-committing transactions (L567). Behaviour that only shows at commit (serialization retries, lock waits, deferred constraints, the outbox) is tested with committing sessions in a disposable database, never a shared one. Concurrency tests for the rules GUARD.2 requires (Serializable with retry, locks) are part of the default test suite, not a gap.
    Rejected: read-modify-write in application code at Read Committed: never (L572, L676). Retrying only the failed statement: never (L575).
    Realizes: ALLOCATION.GUARD.5; ALLOCATION.GUARD.2.
