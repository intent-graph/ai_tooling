- op: node.create
  uid: PIG-WEB-DATA.MAINTAIN.4
  name: Bulk Data Jobs
  intent: 'Large data changes are batched, idempotent jobs run by a human after a checklist, not by automation: sharding only above about 10^7 rows, each batch its own Serializable transaction, a convergence query that must reach zero, and a stop plan. They run as the owner role with the operator and a ticket id as actor.'
  parent: PIG-WEB-DATA.MAINTAIN
  epistemic_state: known
  constraints:
  - Below the L540 threshold a data change is a batched data step outside the schema migration (L198, MAINTAIN.1); above it, a sharded job per L541 to L544.
  - Each batch is its own transaction under Serializable (CONCURRENCY.1), idempotent by form (CONCURRENCY.4, L587), its statements inseparable where they must be (L585); a procedure with transaction control is the tool for per-batch commits (L516, INTERFACE.1).
  - The job runs as the owner role under L545's checklist; it sets the operator and ticket id as actor (J1 R1-3, GUARD.3); a state column changes only through its writer function or as a recorded exception (J1 R1-6).
  - Convergence query at zero before the job is done; staleness window and convergence check stated for any asynchronous stream (L543, L482 via J1).
  design_notes: |-
    Question: how large data changes are batched, run, observed and recovered.
    Positions: (all MAINT, uncontested; agree L198, L410, L193, L196, L199): L540 shard one statement across workers only from about 10^7 to 10^9 rows; smaller work is an ordinary migration; L541 four decisions in order: batching key (key prefix or indexed foreign key, then numeric range, modulo last; keyset paging, offset never in the millions), work list, fan-out, observe and recover; L542 the work list from the data, no batch per giant entity; L543 each batch its own transaction; batches idempotent or self-limiting; a job log; retries only for idempotent batches; a convergence query that must reach zero; L544 disjoint rows; lock waits, dead tuples and replica lag as signals; pool sized by the smallest headroom; ramp up; shard data changes only, never DDL; L545 run by a human after a checklist: ticket id in the statement comment, end-to-end run on a copy, index-backed predicate verified by plan, written convergence query, stop plan, detachable session; automation may write the script but not run it.
    Forces: integrity and availability of live data during large changes, against job duration and operator effort.
    Decision and grounds: L540 to L545 adopted whole (MAINT, max), within J1's owner-run path.
      - Below the L540 threshold a data change is a batched data step outside the schema migration (L198, MAINTAIN.1); above it, a sharded job per L541 to L544.
      - Each batch is its own transaction under Serializable (CONCURRENCY.1), idempotent by form (CONCURRENCY.4, L587), its statements inseparable where they must be (L585); a procedure with transaction control is the tool for per-batch commits (L516, INTERFACE.1).
      - The job runs as the owner role under L545's checklist; it sets the operator and ticket id as actor (J1 R1-3, GUARD.3); a state column changes only through its writer function or as a recorded exception (J1 R1-6).
      - Convergence query at zero before the job is done; staleness window and convergence check stated for any asynchronous stream (L543, L482 via J1).
    Rejected: one giant statement over 10^7 rows or more: rejected (L540). Offset paging in the millions: never (L541). Automated execution of long data jobs: rejected (L545); J2 settled this against a reading of L046 that would automate them.
    Realizes: web-app-philosophy:ALLOCATION.ACT.3 (bulk data work as the deferred-work placement allows).
