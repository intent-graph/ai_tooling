  uid: PIG-WEB-DATA.ORGANIZE.7
  name: Indexes
  intent: Every foreign-key column leads some index, and every other index names the query pattern it serves in its comment or migration. Indexes on live tables are built concurrently, and predicates that writer functions filter by are indexed so Serializable keeps predicate locks narrow.
  parent: PIG-WEB-DATA.ORGANIZE
  epistemic_state: 'known | unvalidated: the predicate-lock reason is my link of L574 to L490'
  constraints:
  - Every foreign-key column (or column list, for composite keys) is the leading part of some index; an existing index whose leading columns are the foreign key covers it (inferred).
  - Every other index names the query pattern it serves, in its comment or migration (L490); unique, partial unique and exclusion constraints count as integrity indexes (GUARD.1).
  - Under Serializable (CONCURRENCY.1) an index on every predicate a writer function filters by also keeps predicate locks narrow, since sequential scans take relation-level predicate locks (L574).
  - Indexes on live tables are built concurrently (L196, MAINTAIN.1).
  design_notes: |-
    Question: which indexes exist and what justifies each.
    Positions: P1 index referencing columns explicitly; Postgres does not index foreign keys (L173, consensus). P2 index rules: foreign keys; partial indexes over active rows; block-range indexes for large, append-only, time-correlated tables; GIN only with its write cost in mind; equality columns first, then range, then sort; every index serves a query pattern (L490 MAINT; agrees L173, L175).
    Forces: read performance and the speed of foreign-key checks on parent deletes and updates, against write cost and storage.
    Decision and grounds: P1 and P2 adopted (max; MAINT and research agree).
      - Every foreign-key column (or column list, for composite keys) is the leading part of some index; an existing index whose leading columns are the foreign key covers it (inferred).
      - Every other index names the query pattern it serves, in its comment or migration (L490); unique, partial unique and exclusion constraints count as integrity indexes (GUARD.1).
      - Under Serializable (CONCURRENCY.1) an index on every predicate a writer function filters by also keeps predicate locks narrow, since sequential scans take relation-level predicate locks (L574).
      - Indexes on live tables are built concurrently (L196, MAINTAIN.1).
    Rejected: indexes without a stated query: rejected (L490); acceptable never in production schemas.
    Realizes: ALLOCATION.DERIVE.2 (the database reduces rows set-based, which needs these indexes); CONCURRENCY.2.
