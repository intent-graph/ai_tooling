- op: node.create
  uid: PIG-WEB-DATA.INTERFACE.1
  name: Functions and Views
  intent: Every write that is a business operation is a database function called once in its own transaction, named by entity, action and variant, granted per consumer role and, where it needs rights the caller lacks, owned by a narrow non-login role. Additive changes are free, a breaking change goes expand, migrate, contract unless every consumer ships with the migration, and the catalogue diff in CI keeps the interface description in sync.
  parent: PIG-WEB-DATA.INTERFACE
  epistemic_state: 'known: MD-03 | conflict: partly against L517 (MAINT) on breaking changes (counted here for both graphs); L187 rejected in favour of L516 | undecided: awaiting maintainer, read visibility of rows with per-user rules when several backends share the database | unvalidated: zero-call evidence, the override restriction, procedures limited to jobs'
  constraints:
  - 'One operation, one call (X3): one business operation is one database function call in its own transaction (J1 R1-4); backends never compose several calls into one operation. A database function may call another domain''s published functions inside the same transaction: composition across domains happens in the database. What is forbidden across domains is direct access to another domain''s tables, not calling its published functions.'
  - 'Ladder (L516): every write that is a business operation is a function (DB_API, L584, L596); simple reads query base tables, except tables guarded by per-user read functions where B''s condition holds (see "Awaiting maintainer"); a procedure only where transaction control is needed, which in practice means owner-run batch jobs (MAINTAIN.4): a procedure that commits inside cannot be a consumer''s call, since one call is one transaction (J1 R1-4; inferred).'
  - Views are never contract objects (L516; DB_API); where a throwaway view exists, L188's rules apply (security_invoker when the caller's rights must apply, security_barrier for filters).
  - 'Conventions (L530) adopted: entity, action, variant names; parameters validated first; a safe variant over a base operation; errors naming the function with stable codes, which, with named constraints (L495), the backends map to their interface errors (J7); one result row per affected table with action and count; a change log per function; set-based statements, a loop only when justified and documented. The override flag for blockable business rules is honoured only for roles granted it, and its use is recorded in history with the actor (GUARD.2, MAINTAIN.3; inferred: an unrestricted override would let any consumer bypass a rule the database is the authority for).'
  - 'Parameters the placements require: the expected version for user-edited rows (GUARD.5, CONCURRENCY.2), the idempotency key where the operation is not idempotent by design (GUARD.6), the business reason where history needs it (ACT.4); the actor comes from the transaction-local context, never from a parameter (GUARD.3).'
  - 'Security: EXECUTE revoked from PUBLIC and granted per consumer role (L185, GUARD.2); its owner''s rights only where the function must write what the caller cannot, the owner being a narrow non-login role of GUARD.2, never the owner role, with a fixed search_path (GUARD.2, M3).'
  - 'Evolution (partly against L517; this departure is counted here, once, for both graphs, X2): additive changes need nothing more (L517): new functions, new parameters with defaults. "Deployed together" stays acceptable only when every consumer of the changed object ships in the same deployment as the migration; otherwise a breaking change goes expand, migrate, contract. L517''s coordination with every consumer and "no formal version numbers, a new function name carries the change" are kept: the new behaviour ships as a new function or variant beside the old one (L530''s variant naming), every consuming team is coordinated with, consumers move, and the old function is removed in a change marked coordinated once no consumer calls it, checked by the catalogue diff in CI (DB_API) and by evidence of zero calls over a stated window (function call statistics; inferred, mechanism not read). Ground: under MD-03 backends, BI, consoles and scripts deploy on their own schedules, and the database and its consumers never deploy atomically (J2 DATA.MAINTAIN).'
  - 'Description in sync (X7, MD-02): "always in sync by process" and the compatibility window apply to the database function API catalogue as to every interface description consumers read; the catalogue diff in CI is that process here, and the generated wrappers are its consumer-side copy (TYPE_CHAIN).'
  - 'Functions ship as migrations (MAINTAIN.1) and are tested against a live database in CI (DB_API), under X4''s boundary (CONCURRENCY.2): logic tests in never-committing transactions, commit-only behaviour in a disposable database.'
  design_notes: |-
    Question: how database functions and views are written, named, secured and evolved.
    Positions:
      - P1 views run with owner's privileges by default; security_invoker when the caller's rights or row policies must apply; security_barrier for row-filter views (L188).
      - P2 tool ladder: plain query, then a function when a strong reason pays, then a procedure only where transaction control is needed; views off the path, acceptable only as throwaway objects; backends may query base tables for simple reads (L516 MAINT; contradicts L187).
      - P3 the function API evolves additively; a breaking change is coordinated with every consuming team and deployed together; no formal version numbers (L517 MAINT).
      - P4 conventions: names read entity, action, variant; mandatory parameters validated first; a validating "safe" variant wraps a base operation; errors name the function and carry stable codes, with an override flag for blockable business rules; results return one row per affected table with action and count; a change log per function; set-based statements over loops (L530 MAINT).
      - P5 a contract schema of views and functions hiding base tables (L187, contested; rejected by J1 in DB_API).
      - Placement DB_API (MD-03): function API in a dedicated schema; EXECUTE per consumer role; writes through functions, one call per transaction; simple reads on base tables; CI fails on a removed function or incompatible signature unless marked coordinated; wrappers generated from the catalogue. J2 flagged a narrowing of P3.
    Forces: integrity of every consumer's access (one operation, one call, one transaction) and changeability of the database behind it, against the coordination cost of an API several consumers deploy against on their own schedules.
    Decision and grounds: realization of DB_API (MD-03), the doctrine as the max except on breaking changes.
      - One operation, one call (X3): one business operation is one database function call in its own transaction (J1 R1-4); backends never compose several calls into one operation. A database function may call another domain's published functions inside the same transaction: composition across domains happens in the database. What is forbidden across domains is direct access to another domain's tables, not calling its published functions.
      - Ladder (L516): every write that is a business operation is a function (DB_API, L584, L596); simple reads query base tables, except tables guarded by per-user read functions where B's condition holds (see "Awaiting maintainer"); a procedure only where transaction control is needed, which in practice means owner-run batch jobs (MAINTAIN.4): a procedure that commits inside cannot be a consumer's call, since one call is one transaction (J1 R1-4; inferred).
      - Views are never contract objects (L516; DB_API); where a throwaway view exists, L188's rules apply (security_invoker when the caller's rights must apply, security_barrier for filters).
      - Conventions (L530) adopted: entity, action, variant names; parameters validated first; a safe variant over a base operation; errors naming the function with stable codes, which, with named constraints (L495), the backends map to their interface errors (J7); one result row per affected table with action and count; a change log per function; set-based statements, a loop only when justified and documented. The override flag for blockable business rules is honoured only for roles granted it, and its use is recorded in history with the actor (GUARD.2, MAINTAIN.3; inferred: an unrestricted override would let any consumer bypass a rule the database is the authority for).
      - Parameters the placements require: the expected version for user-edited rows (GUARD.5, CONCURRENCY.2), the idempotency key where the operation is not idempotent by design (GUARD.6), the business reason where history needs it (ACT.4); the actor comes from the transaction-local context, never from a parameter (GUARD.3).
      - Security: EXECUTE revoked from PUBLIC and granted per consumer role (L185, GUARD.2); its owner's rights only where the function must write what the caller cannot, the owner being a narrow non-login role of GUARD.2, never the owner role, with a fixed search_path (GUARD.2, M3).
      - Evolution (partly against L517; this departure is counted here, once, for both graphs, X2): additive changes need nothing more (L517): new functions, new parameters with defaults. "Deployed together" stays acceptable only when every consumer of the changed object ships in the same deployment as the migration; otherwise a breaking change goes expand, migrate, contract. L517's coordination with every consumer and "no formal version numbers, a new function name carries the change" are kept: the new behaviour ships as a new function or variant beside the old one (L530's variant naming), every consuming team is coordinated with, consumers move, and the old function is removed in a change marked coordinated once no consumer calls it, checked by the catalogue diff in CI (DB_API) and by evidence of zero calls over a stated window (function call statistics; inferred, mechanism not read). Ground: under MD-03 backends, BI, consoles and scripts deploy on their own schedules, and the database and its consumers never deploy atomically (J2 DATA.MAINTAIN).
      - Description in sync (X7, MD-02): "always in sync by process" and the compatibility window apply to the database function API catalogue as to every interface description consumers read; the catalogue diff in CI is that process here, and the generated wrappers are its consumer-side copy (TYPE_CHAIN).
      - Functions ship as migrations (MAINTAIN.1) and are tested against a live database in CI (DB_API), under X4's boundary (CONCURRENCY.2): logic tests in never-committing transactions, commit-only behaviour in a disposable database.
    Awaiting maintainer (B1, X1): `undecided: awaiting maintainer, read visibility of rows with per-user rules when several backends share the database` (J1 Q1). Recorded default, J1's word for word: A provisional, with one written specification per rule and a shared denial suite; B acceptable when a per-user read rule must hold for two or more backends. Where B's condition holds, read functions join this API: they receive the verified actor through GUARD.3's context (a claim to the database, checked against the session role), follow these conventions, and the tables they guard lose direct SELECT for the consumer roles that read through them.
    Rejected: P5, views as contract (L187): rejected (DB_API, L516); wins when a CRUD-dominant application is served by a database-as-API server with a strong Postgres team (L618 via J1). L517's "deployed together" as the general rule: rejected; acceptable under the condition above. An unrestricted override flag: rejected.
    Realizes: PIG-WEB-ALLOCATION.DB_API (writes the functions and views the placement calls for); ALLOCATION.RECORD.2; ALLOCATION.ACT.1 (operations as functions); ALLOCATION.GUARD.5, GUARD.6 (parameters).
