operations:
- op: node.create
  uid: PIG-WEB-ALLOCATION
  name: Stack Allocation
  intent: In the default stack Postgres carries the data, the function API every consumer calls, the per-role grants and the backing roles (queue, schedules, derived caches, sessions) until a measured limit; Python backends own sessions, per-user authorization, workflow and HTML rendering; browser JavaScript enhances; there is no JavaScript server tier and no row-level security by default. The database is shared by several consumers (MD-03), so what must hold whoever touches the data lives in Postgres.
  parent: ROOT
  epistemic_state: 'known | undecided: awaiting maintainer, read visibility of rows with per-user rules when several backends share the database (GUARD.3, Q1)'
  constraints:
  - Postgres hosts the backing roles (queue, schedules, derived caches, sessions, documents) until a measured limit for that role.
  - The database function API in a dedicated schema is the default contract to the data; no views in the contract.
  - Stored facts originate in the Postgres schema; the origin of interface-only facts is chosen per project and the description stays in sync by process (MD-02).
  - No row-level security by default (MD-01).
  - No request-time JavaScript server in the default; Python renders HTML.
  - Python backends own sessions, per-user authorization of product policy, workflow and HTML rendering.
  design_notes: 'Roll-up of the seven placements below; owns no ledger row. Context: MD-03 makes a shared database (several backends, BI, consoles, scripts) the default, replacing the earlier single-consumer context. Maintainer decisions applied: MD-01 (row security), MD-02 (interface description sync, origin per project), MD-03 (shared database, multi-table operations in database functions). Open: one clause, read visibility of rows with per-user rules (Q1, ALLOCATION.GUARD.3 in the philosophy graph); recorded default is each backend filtering from one shared specification with shared denial tests; fallback is database read functions receiving the verified actor, acceptable when a per-user read rule must hold for two or more backends (always the case under MD-03); roles that may SELECT base tables see every row unless their own role is restricted. Revisions: R1 (MD-01, MD-03), R2 and R3 changes sit in the children.'
  impl_pointers:
  - build/distill/03_judge/J1_allocation/records.md::PIG-WEB-ALLOCATION
- op: node.create
  uid: PIG-WEB-ALLOCATION.POSTGRES_FIRST
  name: Postgres First for Backing Roles
  intent: One Postgres carries the job queue, schedules, derived caches, sessions and documents until a measured limit for that role, because fewer components and sharing the data's transaction serve changeability and correctness. NOTIFY is a low-rate wake-up, never the message carrier.
  parent: PIG-WEB-ALLOCATION
  epistemic_state: 'known | unvalidated: L125 rests on T4 sources and the T1 SKIP LOCKED page; thresholds open (L126, L127)'
  constraints:
  - Postgres hosts the job queue, schedules, derived caches, sessions and documents until a measured limit for that role.
  - 'Each role names its trigger to leave Postgres: queue lock contention or backlog age; NOTIFY commit serialisation under write concurrency; cache latency or cache load on the primary.'
  - NOTIFY is a low-rate wake-up, never the message carrier (L127).
  - 'Authority: Postgres per role.'
  - 'Forbidden: a second store written beside Postgres without staging.'
  design_notes: 'Positions: P1 one Postgres until a measured limit (L125, L534, L604); P2 specialised services from the start or past the limit (L126, L417, L457). Forces: changeability (fewer components) and correctness (backing roles share the data''s transaction) against scalability. Decision: P1. Rejected: P2, acceptable past a measured limit, or where the framework''s only production backend is a service (Django''s channel layer on Redis, L457). Moved by: write concurrency, queue volume, fan-out processes. Tension: none recorded. Evidence gaps: L125 rests on T4 sources and the T1 SKIP LOCKED page; thresholds for queue contention (L126) and NOTIFY (L127) are open.'
  impl_pointers:
