operations:
- op: node.create
  uid: PIG-WEB-INTERACTION
  name: Browser and Agent Surface
  intent: 'The browser and the agent surface hold copies and decide nothing durable: Python renders HTML per request, enhanced with JavaScript only where a part is interactive, and agents reach the same HTTP core through an OAuth-protected adapter. Each holds only copies (the version it read, drafts, a server-state cache, its own credential), and every decision reaches a backend and the database''s writer functions.'
  parent: ROOT
  epistemic_state: 'known | undecided: awaiting maintainer, read visibility of rows with per-user rules when several backends share the database (inherited from ALLOCATION.GUARD.3, through REALTIME.4 and COLLABORATE.4)'
  design_notes: |-
    Decides: how browser JavaScript and the agent surface realize the interaction share of each placement.
    Rows: none (roll-up).
    Decision: roll-up of five children. Browsers get server-rendered HTML from Python, enhanced with JavaScript only where a part is interactive; agents get an OAuth-protected adapter over the same HTTP core. Neither decides anything durable: each holds copies (the version it read, drafts, a server-state cache, its own credential) and every decision reaches a backend and the database's writer functions.
      - Visualize: per-request HTML from Python, build-time output where the URL set is known, islands only under the rendering placement's criteria; view state in the URL; LCP content in the first HTML; WCAG 2.2 AA (VISUALIZE).
      - Edit: POST, then 303; the version travels with every edit and a stale write is shown as a conflict with both versions; layered duplicate suppression (EDIT).
      - Real time: polling, then server-sent events, then WebSocket for two-way traffic; events are hints keyed by a commit-safe cursor; Postgres wakes the connection processes, tables carry the data (REALTIME).
      - Collaborate: comments anchored by foreign key and target version, threads by parent pointer, tombstones and revisions, notifications as rows written with the comment, moderation as a recorded queue; a text engine only for long collaborative text, server-authoritative (COLLABORATE).
      - Agent: OpenAPI-described core, an MCP adapter for third-party agent hosts whose tool list and schemas are kept in sync like the description, protected-resource metadata, delegated identity recording user and agent, approval for irreversible effects held on the server, agent-shaped errors and per-agent quotas (AGENT).
      - Environment: feature detection, back/forward-cache eligibility, input saved on page hide (ENVIRONMENT).
    Realizes: refines INTERACTION (J4); through its children ALLOCATION.PRESENT.1 to .3, GUARD.3 to GUARD.6, ACT.2, ACT.4, RULES.4, PIG-WEB-ALLOCATION.JS_SERVER and POSTGRES_FIRST.
    Inherited open clause (from the authorization placement, through REALTIME.4 and COLLABORATE.4): awaiting maintainer, read visibility of rows with per-user rules when several backends share the database. Recorded default: each backend filters these reads from one shared written specification, with a shared denial-test suite every backend runs; database read functions that receive the verified actor stay acceptable when a per-user read rule must hold for two or more backends. Consequence: roles that may SELECT the base tables (reporting, operator) see every row, comments and change rows included, unless their own role is restricted; until the question is answered they get no SELECT on comment content or narrower-audience comments.
    Maintainer decisions applied: MD-01 (no row-level security by default; authorization stays a backend decision), MD-02 (interface description always in sync, origin per project, extended here to the agent tool surface), MD-03 (several consumers share the database; multi-table operations are database function calls).
    Contested rows decided by composing positions along conditions the default context fixes: push channel (L436), token binding (L641), agent protocol surface (L635), approval design (L646); automated traffic (L652) carried into AGENT.5. Two owned rows narrowed to fit settled placements: L437 (Redis only at a measured limit, by POSTGRES_FIRST) and L583 (multi-step writes are database functions, by MD-03).
    Evidence gaps: (1) no ledger row names AA; AA is grounded through the W3C conformance page plus the max rule, one legal floor at AA read (US ADA Title II rule, WCAG 2.1 AA), both sources not yet in the register, other jurisdictions not read; (2) the push-channel debate rests on a T3 guide and a T4 vendor, the SSE buffering claim on one vendor source; (3) the comment model rests mostly on single or inferred sources (L665, L669, L670, L683; L673 has none), legal moderation obligations not read; (4) agent identity and registration rest on moving specifications and drafts, agent-readable content on T4 and secondhand evidence; (5) a separate process type for long-lived connections (L458) and reconnect jitter (L454) are inferred; (6) no owned row chooses the enhancement library or the islands component library: left open; (7) the rate-limit partition (L651) is inferred, its combination a synthesis.
    Review: the adversarial review's findings on this unit are applied (read-visibility notation and consequence, no credentials in URLs, MCP tool schemas under the drift gate, scarce-goods flows, resolve right, POST for state-changing forms, 409 and 412/428 split, AA grounding, tombstones through deletion functions, per-tab drafts on sensitive pages, NOTIFY only for live subscribers, cursor horizon stall).
  impl_pointers:
  - build/distill/03_judge/J8_pig_interaction/records.md::PIG-WEB-INTERACTION
- op: node.create
  uid: PIG-WEB-INTERACTION.VISUALIZE
  name: Browser Rendering
  intent: Python renders HTML per request and ships JavaScript only for interactive parts; client state is held by kind, with navigable state in the URL; the largest-contentful-paint element sits in the first HTML with a small DOM and reserved space; and every full page meets WCAG 2.2 AA with native HTML before ARIA. This keeps first content fast, back, reload and sharing working, and the interface usable by everyone.
  parent: PIG-WEB-INTERACTION
  epistemic_state: 'known | gap: accessibility mandates of jurisdictions other than the one read (.4)'
  design_notes: |-
    Decides: how pages are rendered, hold client state, perform and stay accessible in the browser.
    Rows: none (roll-up).
    Decision: roll-up of .1 to .4: Python renders HTML per request and ships JavaScript only for interactive parts (.1); client state by kind, navigable state in the URL, a server-state cache only inside client-rendered islands (.2); the LCP element in the first HTML, small DOM, short tasks, reserved space (.3); WCAG 2.2 AA on every full page, native HTML before ARIA (.4).
    Realizes: refines INTERACTION.VISUALIZE (J4); ALLOCATION.PRESENT.1, PRESENT.3, PIG-WEB-ALLOCATION.JS_SERVER through its children.
  impl_pointers:
  - build/distill/03_judge/J8_pig_interaction/records.md::PIG-WEB-INTERACTION.VISUALIZE
- op: node.create
  uid: PIG-WEB-INTERACTION.EDIT
  name: Editing Without Loss
  intent: Every state-changing form POSTs and answers 303, and every edit of a user-edited record carries the version it read, so a stale write is shown as a conflict with both versions and is never merged silently or lost. Duplicate submissions are suppressed in layers, unsaved input survives the page, and one business operation is one database function call in its own transaction.
  parent: PIG-WEB-INTERACTION
  epistemic_state: 'known | unvalidated: conflict screen content and hidden-field transport inferred (L583 conflict UI inferred); 409 for a stale hidden-field version follows the HTTP interface''s mapping (L259); the handling of a form missing its version field and the per-tab draft rule inferred'
  constraints:
  - Every state-changing form POSTs; success answers 303 to the confirmation or the new resource (P1, L258); a failed validation re-renders the form with the user's input kept (inferred; status codes are the HTTP interface's). Search and filter forms submit with GET, so their state lands in the URL (VISUALIZE.2, L292).
  - 'The version travels with every edit of a user-edited record: a hidden field in HTML forms (a plain form cannot send If-Match, inferred), If-Match with the ETag from JavaScript and agent clients. The backend passes it to the writer function as the expected version (P2, L260). The maximum strictness among the sources is adopted: the condition is required, not optional, except for per-property last-writer-wins updates (toggles, status, assignment, ordering), which are sent without the record version (GUARD.5, L674) and are exempt. If-Match clients: a mismatch answers 412, a missing condition answers 428 on every endpoint editing such a record, per-property updates excepted (RFC 9110 defines both for conditional header fields). HTML forms: a version in a hidden field that no longer matches is a conflict with current state, answered 409 with the conflict form of decision 3 (the mapping of PIG-WEB-LOGIC.EXPOSE.2: 409 for a conflict with current state); a form missing its version field is rejected as malformed and re-rendered with current values (inferred).'
  - 'A stale write is shown, never merged silently: the response re-renders the form with the user''s input kept and the current values beside it, the fields changed by the other writer marked, and the new version embedded; the user reapplies (P3, L583).'
  - A patch applies all or nothing under its precondition (L675).
  - 'Duplicate submission, browser share (GUARD.6, L582): the submit control is disabled with a pending state; create forms carry a form token minted at render, sent as the idempotency key the writer function records with the effect; 303 after success.'
  - 'Unsaved input survives the page: saved on page hide (ENVIRONMENT.1, L294), restored on return, cleared after a successful submit. On pages that show sensitive data, drafts go to per-tab storage only or are not persisted, and are cleared at logout (VISUALIZE.2; inferred).'
  - 'Transactions (P5 under MD-03): one business operation is one database function call in its own transaction; the backend opens one transaction per database API call (atomic(durable=True) in Django asserts that it is outermost) and never composes several calls into one operation (J1 R1-4, DB_API); on_commit only for losable work (L600). Multi-step writes are database functions; a database function may call another domain''s published functions inside the same transaction, so composition across domains happens in the database, and only direct access to another domain''s tables is forbidden.'
  design_notes: |-
    Decides: how forms submit, and how concurrent and repeated edits are detected and shown.
    Rows: L258, L260, L583, L675. Cited: L475, L582, L674, L676 (DATA), L259, L269, L546, L655 (LOGIC), L292, L294, L600.
    Positions:
      - Submission: P1 POST, then 303 See Other to a GET page (L258, consensus T1).
      - Lost updates: P2 optimistic concurrency: the version travels with the edit; ETag and If-Match; 412 on mismatch; 428 where a lost update matters (L260, consensus on mechanism, strictness varies by source); P3 the conflict shown with both versions (L583, conflict UI inferred); P4 the server returns current state and merges automatically when changed fields are disjoint; a patch carries a precondition and applies all or nothing (L675, majority; field-level merge inferred).
      - Transactions (L583's Django part): P5 wrap multi-step writes in atomic, durable=True for the outermost transaction, on_commit callbacks discarded after a rolled-back savepoint.
    Forces: P1 serves no resubmission on reload, Back or bookmark. P2 and P3 serve no silent loss of anyone's work, at the cost of a conflict screen. P4 serves fewer conflict screens, at the cost of applying a combination of fields no user saw, which per-row invariants catch only if declared. P5 serves atomic backend writes; under MD-03 the multi-table write is one database function call.
    Decision (the rules are the constraints): (realizes GUARD.5 and GUARD.6 as settled):
    Rejected:
      - P4's automatic merge of disjoint fields: acceptable only for the properties GUARD.5 puts under per-property last-writer-wins (toggles, status, assignment, ordering, L674), which the client sends alone, without the record version. For other fields, a merged result nobody saw is not "without loss" of intent (inferred).
      - Optional preconditions (the Zalando and Google strictness in L260): wins never where a lost update matters, which is every user-edited record in the default.
      - 302 or 307 after POST: wins never (L258).
      - L583's "wrap multi-step writes" as several backend writes in one transaction: replaced by MD-03 (a database function per business operation); not a conflict with the row's intent (atomicity), which the function keeps.
    Realizes: ALLOCATION.GUARD.5 and GUARD.6 (skeleton links); ALLOCATION.PRESENT.3 (proposed: drafts in the browser); J4 INTERACTION.COLLABORATE decision 3.
    Hand-offs: the version predicate in the write (PIG-WEB-DATA.CONCURRENCY.2, L676); status codes and the idempotency-key contract (PIG-WEB-LOGIC.EXPOSE.2, .3, L269, L546); CSRF token on forms (PIG-WEB-LOGIC.SECURE.3); transaction handling (PIG-WEB-LOGIC.ENFORCE.2).
