- op: node.create
  uid: PIG-WEB-LOGIC.SECURE.4
  name: Federated Login and Tokens
  intent: Login is delegated to an OpenID Connect server (an external provider or a self-run one), with the Python backend as the confidential backend-for-frontend client using the code flow with PKCE, then an opaque server session; the required authentication context is requested and verified on every login. Agents hold short-lived, audience-bound, revocable tokens, and every JWT is verified with pinned algorithms.
  parent: PIG-WEB-LOGIC.SECURE
  epistemic_state: 'known | unvalidated: delegation ranked above an own store (L338 ranks neither; ranking mine); the acr/amr check and step-up (OpenID Connect Core, not in the ledger); sender-constraining support across agent hosts not read'
  constraints:
  - Login is delegated to an OpenID Connect server, recorded as a decision; an own credential store only when no such server can be used or run.
  - 'The backend is the confidential client (backend-for-frontend): code flow with PKCE, exact redirect-URI match, no open redirector, ID token validated (issuer, audience, expiry, nonce); provider tokens never reach the browser.'
  - The backend requests the required authentication context (`acr_values`, or a provider MFA policy yielding a known `amr`) and refuses a login whose ID token lacks it; sensitive operations require a fresh, sufficient context (`max_age`, `auth_time`).
  - Local identity keyed by issuer plus subject, never by e-mail; reauthenticate before any link change.
  - Agent tokens are issued for this server only (audience), short-lived and revocable; code flow with PKCE when acting for a human, client credentials when acting on their own; refresh tokens rotated or sender-constrained; access tokens sender-constrained (DPoP or mutual TLS) wherever supported.
  - Every JWT verified with pinned algorithms, `none` rejected, issuer, subject and audience checked, explicit `typ`.
  - Downstream calls use the backend's own token, never a forwarded one; an ID token is never an API credential.
  - No session token, bearer token or long-lived credential in a URL; the single-use authorization code in the redirect is not one.
  - 'Forbidden: implicit grant, password grant, shared static keys for agents (static keys only for short scripts), tokens held by browser JavaScript, accepting a login without checking the asserted authentication context.'
  design_notes: |-
    Positions: - P1 choose explicitly between delegating login to an external identity provider (OAuth 2, OpenID Connect, SAML) and operating an own credential store, and record the choice; no source ranks them (L338).
      - P2 the authorization code grant with PKCE, never the implicit grant; for agents acting for a human, the code flow with PKCE, exact redirect match, HTTPS; client credentials for agents acting on their own behalf; static keys only for short scripts (L339).
      - P3 redirect URIs matched by exact string, no open redirectors (L340).
      - P4 rotate or sender-constrain the refresh tokens of public clients; sender-constrain access tokens (mutual TLS or DPoP) (L341).
      - P5 validate the OpenID Connect ID token: issuer, audience containing the client id, expiry, nonce (L342).
      - P6 link federated identities by issuer plus subject, never by e-mail; reauthenticate before changing links (L343).
      - P7 a JWT verifier pins accepted algorithms, rejects `none`, validates issuer, subject and audience, and keeps token kinds distinguishable (L312).
      - Cited: backend-for-frontend when login goes through a provider (L313, GUARD.4); a server accepts only tokens issued for it and never forwards a client's token (L640); an ID token is never an API credential (L021 via J3).

    Forces: security (credential handling, token theft, token confusion); the cost and availability of an external dependency (P1's other side).

    Decision: 1. **Login is delegated to an OpenID Connect server**, recorded as a decision (P1): an external identity provider or a self-run OpenID Connect server, which removes cost and data-residency objections to a provider (review m11). Grounds: the backend then stores no password, and MFA, phishing-resistant authenticators and breached-password checks (SECURE.5) come from a service built for them; agents as users need OAuth authorization anyway (P2's agent half), which such a server supplies, while an own credential store would also need an own authorization server for agents (inferred).
      2. **The Python backend is the confidential client, backend-for-frontend** (L313, GUARD.4): code flow with PKCE (P2), exact redirect URIs and no open redirector (P3), ID token validated (P5), then an opaque server session (SECURE.2). Provider tokens never reach the browser. The authorization code in the redirect is single-use, short-lived and bound to PKCE, not a session or bearer token; no session token, bearer token or long-lived credential ever travels in a URL (X6).
      3. **The authentication context is verified, not assumed** (review M6; inferred from OpenID Connect Core 1.0, not in the ledger): the backend requests the required context (`acr_values`, or the provider's MFA policy that yields a known `amr`) and refuses a login whose ID token lacks it; for sensitive operations it requires a fresh, sufficient context (step-up with `max_age`, checking `auth_time`). Without this check a provider policy change could drop MFA while every other check passes, which is deciding on the caller's word (J3 LOGIC.SECURE).
      4. **Local identity** keyed by issuer plus subject; reauthentication before any link change (P6).
      5. **Agents**: tokens issued for this server only (audience, L640), short-lived and revocable (GUARD.4); code flow with PKCE when acting for a human, client credentials when acting on their own (P2); refresh tokens rotated or sender-constrained; access tokens sender-constrained (DPoP or mutual TLS) wherever the provider and the agent host support it (P4).
      6. **Every JWT** verified with pinned algorithms, `none` rejected, issuer, subject and audience checked, explicit `typ` (P7).
      7. Downstream calls use the backend's own token, never a forwarded one (L640).

    Rejected: - An own credential store: acceptable when no OpenID Connect server can be used or run, a self-run one included (review m11); SECURE.5 then applies in full, MFA included (P1; condition inferred).
      - Accepting a login without checking the asserted authentication context: never while MFA is required (review M6).
      - Implicit grant, password grant, shared static keys for agents: never (P2); static keys only for short-lived scripts (L339).
      - Account linking by e-mail: never (P6).
      - Tokens held by browser JavaScript: never by default (GUARD.4).
      - Bearer-only access tokens: acceptable when the provider or the agent host cannot sender-constrain, with a short lifetime and server-held revocation (inferred).

    Realizes: ALLOCATION.GUARD.4 (handles tokens where the identity placement allows them).
  impl_pointers:
  - build/distill/03_judge/J7_pig_logic/records.md::PIG-WEB-LOGIC.SECURE.4
