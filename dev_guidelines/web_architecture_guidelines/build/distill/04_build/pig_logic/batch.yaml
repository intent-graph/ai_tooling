- op: node.create
  uid: PIG-WEB-LOGIC.EXPOSE.2
  name: Status Codes and Errors
  intent: Every JSON error is `application/problem+json` with a stable `type` URI, the status that matches it and a `detail` that tells the caller how to correct the request without exposing internals; each named constraint and each stable function error code maps to one problem type, and blockable-rule errors map to a distinct type that names the override.
  parent: PIG-WEB-LOGIC.EXPOSE
  epistemic_state: 'known | unvalidated: the distinct problem type for blockable-rule errors (inferred from L530)'
  constraints:
  - Every JSON error is `application/problem+json` with a stable `type` URI per error kind and the matching status; `detail` helps the caller (agent tools included) correct the request and never exposes stack traces or internals; extensions are documented and ignored by clients that do not know them.
  - Each named constraint and each stable custom code a function raises maps to one problem type; a blockable business rule maps to a distinct type that names the override; the use case decides whether the override is set, after the policy module authorizes it, never by passing the flag through from the request.
  - 'Status mapping: stale version 412, missing required precondition 428, conflict with current state 409, well-formed but invalid input 422, malformed input 400, idempotency key reused with another payload 422.'
  - HTML responses use the same status codes, with a page for humans.
  - 'Forbidden: messages as the only error signal.'
  design_notes: |-
    Positions: - P1 precise codes: 409 for a conflict with current state, 412 for a failed precondition, 428 when a precondition is required, 422 for well-formed but unprocessable content (L259).
      - P2 errors as RFC 9457 problem details (`application/problem+json`) (L261, majority); against Google's `google.rpc.Status` with mandatory `ErrorInfo` and Azure's top-level `error` object with a code header.
      - P3 the body supplements the status line; its `detail` helps the client correct the problem, never exposes stack traces or internals (L262).
      - P4 clients ignore extension members they do not recognize, so problem types can evolve (L263).
      - Cited: a stable machine-readable identifier separate from the message (L052 via J3); correction hints for agent tools (L656); named constraints map to stable errors (L495 via GUARD.2); function errors name the function and carry stable custom codes, with an explicit override flag for blockable business rules (L530, MAINT, owned by DATA; review M7).

    Forces: machine handling by programs and agents; security (no internals); changeability.

    Decision: 1. Every JSON error is `application/problem+json` (P2) with a stable `type` URI per error kind (L052), the status that matches it (P1), and a `detail` that tells the caller, agent tools included, how to correct the request (L656), never internals (P3); extensions are documented and ignored by clients that do not know them (P4).
      2. **Database errors map to problem types**: each named constraint (L495) and each stable custom code a function raises (L530, MAINT; review M7) maps to one type. An error from a blockable business rule maps to a distinct type that names the override, so a caller sees that an authorized override exists; whether the override is set is decided by the use case after the policy module authorizes it (ENFORCE.1, SECURE.1), never by passing the flag through from the request. A stale version gives 412, a missing required precondition 428, a conflict with current state 409, well-formed but invalid input 422, malformed input 400, and an idempotency key reused with another payload 422 (L546).
      3. HTML responses use the same status codes, with a page for humans.

    Rejected: Google's and Azure's formats: acceptable when the API joins an ecosystem that already uses them (L261's other positions; condition inferred). Messages as the only error signal: never (L052).

    Realizes: no skeleton link; follows ALLOCATION.GUARD.5 (412, 428) and GUARD.1.
