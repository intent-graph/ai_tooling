  name: Origin and CORS
  intent: Pages, the JSON interface and the agent surface are served from one origin, with CORS off by default; a CDN host may serve static assets without credentials and user files come from the storage host. When a browser consumer on another origin must read responses, CORS uses an explicit allowlist.
  parent: PIG-WEB-LOGIC.EXPOSE
  epistemic_state: 'known | unvalidated: the single-origin default is a synthesis (L279); credentialed CORS limited to the team''s own origins (inferred)'
  constraints:
  - One origin for pages, the JSON interface and the agent surface; static assets may come from a CDN host without credentials; user files from the storage host.
  - 'CORS off by default; when needed: an explicit allowlist of origins, `Vary: Origin` when the allowed origin is computed, `Access-Control-Max-Age` for preflights.'
  - Credentialed cross-origin access (cookies) only for origins the same team operates; third parties use bearer tokens.
  - 'Forbidden: `*` with credentials; a separate API origin for the first-party interface.'
  design_notes: |-
    Positions: - P1 serve pages, their API and static paths from one public origin by default (one hostname, path routing at the proxy, one certificate, one HSTS scope); add CORS only for consumers that are truly cross-origin; a separate host for non-credentialed static assets or a CDN is common and harmless (L279; a synthesis, no source states the default).
      - P2 when a second origin must read responses: an explicit allowlist of origins, never `*` with credentials, `Vary: Origin` when the allowed origin is computed, preflights cached with `Access-Control-Max-Age` (L280).

    Forces: security (cookie scope, cross-origin reads); simplicity of operation.

    Decision: one origin for pages, the JSON interface and the agent surface (P1); static assets may come from a CDN host without credentials (P1); user files from the storage host (PROCESS.6). CORS is off by default. When a browser-based consumer on another origin must read responses: an explicit allowlist, never `*` with credentials, `Vary: Origin` when computed, `Access-Control-Max-Age` (P2). Credentialed cross-origin access (cookies) only for origins the same team operates; third parties use bearer tokens (SECURE.4) (inferred).

    Rejected: a separate API origin for the first-party interface: never by default (P1). `*` with credentials: never (P2).

