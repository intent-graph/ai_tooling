- op: node.create
  uid: PIG-WEB-LOGIC.EXPOSE.4
  name: Response Caching
  intent: 'Every response is labelled on purpose by a middleware default overridden per view: HTML `no-cache` with validators, personalised responses `private`, sensitive ones `no-store`, fingerprinted assets immutable, with `Vary` for every header the representation depends on; application caches live in Postgres with explicit expiry and versioned keys.'
  parent: PIG-WEB-LOGIC.EXPOSE
  epistemic_state: 'known | unvalidated: response caches in Postgres (CACHE_STORE, inferred)'
  constraints:
  - Every response carries an explicit `Cache-Control` from a middleware default, overridden per view on purpose.
  - HTML `no-cache` with validators; personalised HTML and JSON `private, no-cache`; sensitive pages and responses that set or contain a session identifier `no-store`; 429 responses `no-store`; fingerprinted assets `public, max-age=31536000, immutable`.
  - '`Vary` names every header the representation depends on, `Cookie` included for personalised responses; never `Vary: User-Agent`.'
  - Application caches (view, fragment) in Postgres tables, `UNLOGGED` when rebuildable; keys versioned and including the user or session for personalised content; each with an explicit expiry or invalidation plan.
  - A shared cache service only when measured cache latency or load on the primary demands it; never a per-process memory cache beyond one request.
  - 'Forbidden: heuristic caching by omission; personalised responses in shared caches.'
  design_notes: |-
    Positions: - P1 label every response cacheable or not on purpose with an explicit `Cache-Control`; send `Vary` for every request header the representation depends on, never `User-Agent` (L414).
      - P2 fingerprinted static assets `public, max-age=31536000, immutable`; HTML and unversioned resources `no-cache` with `ETag` or `Last-Modified`; `no-store` only when nothing may be stored (L415).
      - P3 personalised responses `private` (`no-store` when sensitive); a shared cache never reuses a response to a request carrying `Authorization` unless allowed (L416).
      - P4 page and view caches must vary on authentication, session and cookie state; the framework does not do it automatically (L418).
      - P5 every cache has an explicit expiry or invalidation plan and versioned keys (L419; inferred).
      - Placement: CACHE_STORE (derived-data caches in database tables; response and fragment caches shared by processes in Postgres, `UNLOGGED` when rebuildable; never per-process memory beyond one request; a cache service at a measured need).

    Forces: latency and load; correctness and privacy (stale or leaked responses).

    Decision: 1. **Every response labelled** by a middleware default, overridden per view on purpose (P1): HTML `no-cache` with validators (P2); personalised HTML and JSON `private, no-cache`; sensitive pages and responses that set or contain a session identifier `no-store` (P3, L327; same wording as SECURE.2, review m10); 429 responses `no-store` (L366); fingerprinted assets `public, max-age=31536000, immutable` (P2). `Vary` names every header the representation depends on, `Cookie` included for personalised responses (P1, P3).
      2. **Application caches**: view and fragment caches in Postgres tables as CACHE_STORE sets, `UNLOGGED` when rebuildable (L420); keys versioned and including the user or session for personalised content (P4, P5); each with an explicit expiry or invalidation plan (P5). Derived-data caches are database tables invalidated in the source transaction (DERIVE.3, L534), outside this node. Never a per-process memory cache beyond one request.
      3. A shared cache service (Redis, Memcached) when measured cache latency or load on the primary demands it (CACHE_STORE).

    Rejected: heuristic caching by omission: never (P1). Personalised responses in shared caches: never (P3). `Vary: User-Agent`: never (P1).

    Realizes: PIG-WEB-ALLOCATION.CACHE_STORE (uses the cache store the placement names).
