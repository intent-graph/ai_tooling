- op: node.create
  uid: INTERACTION.ENVIRONMENT
  name: Web Environment
  parent: INTERACTION
  intent: 'Seven properties of the web are accepted as given, each with the design response that keeps users able to work with the data: the runtime is unknown, pages have an unstable lifecycle, deployment is not atomic, stored responses cannot be recalled, the network fails, URLs are public and long-lived, and page script may be hostile.'
  epistemic_state: known
  constraints:
  - 'The runtime is unknown: core content and function work as HTML, enhanced in layers (.1).'
  - 'Pages are restored, frozen, discarded and opened in several tabs: the server stays the arbiter (.2).'
  - 'Deployment is not atomic: every client-server contract, the agent tool surface included, has an explicit compatibility window (.3).'
  - 'Stored responses cannot be recalled: cacheability is declared per URL, long lifetimes only for immutable URLs (.4).'
  - 'The network fails: the client degrades gracefully and retries only what is safe (.5).'
  - 'URLs are public and long-lived: stable, implementation-free, carrying navigable state, never a session token, bearer token or long-lived credential; short-lived single-purpose signed URLs for file delivery are the one exception (.6).'
  - 'Page script may be hostile: no credential readable by script, escaping first, CSP second, CSRF independent of CORS, uploads on another site (.7).'
  design_notes: |-
    Roll-up of the seven children; no owned ledger rows. Decides: which properties of browsers, networks, caches and URLs the design must accept as given.
    Each property with its design response:
    - unknown runtime: core content and function as HTML, enhanced in layers (.1);
    - unstable page lifecycle: the server stays the arbiter, the page refreshes and saves on lifecycle events (.2);
    - non-atomic deployment: explicit compatibility window per contract; a breaking change goes expand, migrate, contract (.3);
    - caches beyond reach: cacheability declared per URL (.4);
    - unreliable network: graceful degradation, retry only what is safe (.5);
    - URL as public interface: stable, implementation-free, navigable state, no credential in a URL, the signed-file-URL exception (.6);
    - hostile page script: no credential readable by script, escaping first, CSP second, CSRF independent of CORS, uploads on another site (.7).
    Review fix M2 (with X6): the credential-in-URL rule and its single exception are stated here and detailed in .6.
  impl_pointers:
  - build/distill/03_judge/J4_phil_interaction/records.md::INTERACTION.ENVIRONMENT
- op: node.create
  uid: INTERACTION.ENVIRONMENT.1
  name: Uncontrolled Client Runtime
  parent: INTERACTION.ENVIRONMENT
  intent: The design copes with browsers of unknown capability, speed and script completion by delivering core content and function as HTML that works without the latest capabilities, enhanced with CSS and JavaScript where supported. Everybody is a non-JavaScript user until the script has loaded, so the core read and write paths work as forms and links, and no feature works in only one browser, OS or device class.
  epistemic_state: known
  constraints:
  - Core read and write paths work as HTML forms and links (L002, L003).
  - Enhancement is added by feature detection, in loosely coupled layers, and fails without taking the core down (L002, L003).
  - No feature works in one browser, OS or device class only (L004).
  - Client-rendered islands, where the rendering placement admits them (L253's criteria), sit inside a page whose surrounding content and navigation still work as HTML.
  design_notes: |-
    Decides: how the design copes with browsers of unknown capability, speed and script completion.
    Rows: L002, L003, L004. Cited: L253, L016.
    Positions: P1 design for a range of support: core content and function as HTML that works without the latest capabilities, enhanced with CSS and JavaScript where supported, layers loosely coupled (L002, L003), no single-browser feature (L004); P2 one target runtime, core function requiring script (the client-rendered application, L253, as the default product shape).
    Forces: P1 serves everyone's ability to reach the data (everybody is a non-JavaScript user until the script has loaded, L003) and interaction latency through a small script budget (L016), at the cost of building the HTML path first; P2 serves rich interaction and one code path, at the cost of a blank or broken page whenever script is late, blocked or failing.
    Decision: P1 (consensus, T1 and T2). The island rule is inferred from PRESENT.1.
    Rejected: P2 as the default: wins only where most of the product meets L253's criteria (PRESENT.1's condition); even then no feature is limited to one browser, OS or device class (L004).
    Realizes: ALLOCATION.PRESENT.1 (the HTML-first rendering the placement gives the backend, enhanced in the browser).
