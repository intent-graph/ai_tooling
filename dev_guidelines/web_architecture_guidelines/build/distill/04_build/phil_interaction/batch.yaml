- op: node.create
  uid: INTERACTION.ENVIRONMENT.6
  name: URL as Public Interface
  parent: INTERACTION.ENVIRONMENT
  intent: 'URLs are the public, long-lived interface: stable and free of implementation details, with old addresses that keep resolving, and navigable or shareable view state lives in the URL. Because URLs are public and logged, no session token, bearer token or long-lived credential ever travels in one; short-lived, single-purpose, scope-limited signed URLs for file delivery are the one allowed exception.'
  epistemic_state: 'known | unvalidated: URL as contract between page parts rests on one T2 source (L018); no-credentials-in-URLs generalized from L459; the conditions on signed file URLs and the status of PKCE-bound authorization codes inferred'
  constraints:
  - URLs are stable and free of author, status, file extension and implementation details; the team owns the mapping from URL to resource over time (L017).
  - When a resource moves, its old URL keeps resolving to it.
  - View state that users navigate, bookmark or share lives in the URL (L018, L292).
  - No session token, bearer token or long-lived credential ever travels in a URL.
  - 'The one exception: a short-lived, single-purpose, scope-limited signed URL for file delivery, with lifetime and scope stated (L422).'
  - 'Signed file URL conditions: issued only after an authorization check of the requester; grants one operation on one object; expires quickly; served from another origin than the application; the issuing response is no-store and the page''s referrer policy does not leak it.'
  - One-time OAuth authorization codes in redirects, bound to the client by PKCE, are not a forbidden kind.
  design_notes: |-
    Decides: how URLs serve as stable public addresses and as the contract for navigable state.
    Rows: L017, L018. Cited: L292 (pig-web), L422 (pig-web logic), L459 (pig-web), PRESENT.3.
    Positions: P1 URLs are the public, long-lived interface: stable, free of author, status, file extension and implementation details, the mapping owned over time (L017); P2 the URL as the contract for state and between independently built parts of a page (L018, one T2 source); P3 view state held only in client memory (the alternative L292 rules out for navigable state).
    Forces: P1 serves everyone who links, bookmarks or cites the data, humans and agents, at the cost of maintaining the mapping; P2 serves shareable, restorable state and loose coupling between page parts; P3 serves simplicity of client code and breaks back, reload and sharing.
    Decision: P1 and P2. Redirect for moved resources is inferred. The credential rule is generalized from L459 (inferred). A presigned URL is a bearer token, so it is bounded like one (L422); the listed conditions are inferred. PKCE-bound one-time codes are single-use, short-lived and useless without the client's verifier, acceptable under the identity placement (inferred); they are recorded as none of the forbidden kinds rather than as a second exception, keeping "one allowed exception" exact (review M2 with X6).
    Rejected: P3: acceptable for ephemeral view state that nobody navigates to or shares (PRESENT.3). P2's second half (the URL as the channel between independently built page parts) is acceptable when independently built parts share a page; in the default context (one team, server-rendered) it reduces to the navigable-state rule. Any credential in a URL beyond the exception: wins never.
    Realizes: ALLOCATION.PRESENT.3 (the URL as the authority for shareable view state); link inferred, the skeleton draws none.
    Hand-offs: History API routing and fragment use (PIG-WEB-INTERACTION.VISUALIZE.2, L292); signed file-delivery URLs (PIG-WEB-LOGIC.PROCESS.4, .6, L422); authorization-code flow (PIG-WEB-LOGIC.SECURE.4, PIG-WEB-INTERACTION.AGENT.2).
    Evidence gaps: the URL as contract between page parts rests on one T2 source (L018).
  impl_pointers:
