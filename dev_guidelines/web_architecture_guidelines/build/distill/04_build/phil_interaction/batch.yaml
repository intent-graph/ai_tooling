operations:
- op: node.create
  uid: INTERACTION
  name: Interaction
  parent: ROOT
  intent: 'The interaction tier lets humans and agents see, edit and discuss the data through clients the team does not control, and decides nothing durable: it holds copies for feedback and latency, and every decision reaches a backend. Its four branches cover a perceivable interface, collaboration on shared data, agents as bounded users, and the properties of the web environment accepted as given.'
  epistemic_state: 'known | undecided: awaiting maintainer, read visibility of rows with per-user rules when several backends share the database (inherited from ALLOCATION.GUARD.3, through COLLABORATE)'
  constraints:
  - The interaction tier decides nothing durable; every decision reaches a backend (RULES.3).
  - Agents are users through an adapter on the same core, never a second implementation of the rules.
  - A comment is never more visible than its target on any surface the application serves.
  design_notes: |-
    Roll-up of the four children; no owned ledger rows. Decides: how users, human or agent, see, edit and discuss the data through clients the team does not control.
    Children at claim:
    - VISUALIZE: server-rendered HTML that works for everyone, people with disabilities included, enhanced where the browser supports it; values formatted for the reader by the tier that renders them.
    - COLLABORATE: pages correct on plain load, push as a hint, conflicts and visibility per the allocation placements; comments are entities with their own abilities and never more visible than their target on any surface the application serves; roles that may SELECT the base tables see what their grants allow, so their comment grants are restricted.
    - AGENT: agents are users through an adapter on the same core, with audience-bound tokens, narrow scopes, few purpose-specific tools, quotas, server-side audit, and no decision of their own.
    - ENVIRONMENT: seven properties accepted as given and designed for: unknown runtime, unstable page lifecycle, version skew, unrecallable caches, unreliable network, public URLs, hostile page script.
    Grounds: RULES.3 (L019, the browser cannot hold deciding checks).
    Realizes, through its children: ALLOCATION.PRESENT.1 to .3, GUARD.3, GUARD.5, GUARD.6, ACT.4, RULES.3, RULES.4, DERIVE.3. No conflict with any J1 placement.
    Inherited open clause: undecided: awaiting maintainer, read visibility of rows with per-user rules when several backends share the database (from ALLOCATION.GUARD.3, through COLLABORATE).
    Maintainer decisions: MD-01 respected (no row security by default), MD-03 shapes AGENT and COLLABORATE, MD-02 reaches the unit through ENVIRONMENT.3.
    Evidence gaps of the branch (5): VISUALIZE rests on one weak row (L005) and the conformance level is not grounded; L682's sequence-id cursor contradicts L594; L014's fallacies list read through a T4 copy; L648 applied to agents the application runs or serves is inferred; L687's leak-surface list is a synthesis.
  impl_pointers:
  - build/distill/03_judge/J4_phil_interaction/records.md::INTERACTION
  - build/research/05_identity_security/result.md::SEC-C01
  - build/research/03_contract/result.md::API-C02
  - build/research/04_presentation/result.md::UI-C18
  - build/research/18_allocation/result.md::ALLOC-C06
- op: node.create
  uid: INTERACTION.VISUALIZE
  name: Perceivable Interface
  parent: INTERACTION
  intent: 'Accessibility is a project requirement from the first design: a conformance target is stated before building and judged per full page, and the interface starts from native HTML semantics and keyboard operation, with users with disabilities taking part in early testing. Values are shown in the reader''s locale and time zone by the tier that renders them, because retrofitting accessibility at the end costs more and leaves parts that never conform.'
  epistemic_state: 'known | unvalidated: one weak T1 row (L005); the native-first consequence of PRESENT.1 is inferred | gap: conformance level not grounded (L300)'
  constraints:
  - Accessibility is a requirement from the first design; a conformance target is stated before building (L005, L300).
  - Conformance is judged per full page, embedded third-party content included (L300).
  - Start from native HTML semantics and keyboard operation; ARIA only where native elements cannot express the control (L301).
  - Values are shown in the reader's locale and time zone by the tier that renders the text; nothing pre-formatted comes from storage (PRESENT.2, L632).
  - Users with disabilities take part in early testing, not only at acceptance (L005).
  design_notes: |-
    Decides: how the interface stays usable by everyone, people with disabilities included.
    Rows: L005 (grounded, weak; SRC-165, T1). Cited: L003, L300, L301 (pig-web), L632 (via PRESENT.2).
    Positions: P1 accessibility as a requirement from the start, users involved early (L005); P2 accessibility added at the end as an audit and retrofit (rejected in L005).
    Forces: P1 serves the node's purpose (everyone can perceive and operate the interface) at the cost of design effort from the first page; P2 defers that cost and pays more later, with parts that never conform (inferred from L300: conformance is judged per full page, third-party content included).
    Decision: P1, as the max for the node's purpose. The native-first rule follows from the rendering placement: server-rendered HTML with enhancement (PRESENT.1, L003) carries native semantics by default (inferred).
    Rejected: P2 wins never. A retrofit is acceptable only for a page that already exists and is brought to the stated target, never as the plan for new pages.
    Realizes: ALLOCATION.PRESENT.1 (renders what the backend renders, enhanced in the browser; islands only under L253's criteria); ALLOCATION.PRESENT.2 (formats for the reader where the rendering happens).
    Hand-offs: the conformance level (A, AA or AAA) belongs to PIG-WEB-INTERACTION.VISUALIZE.4, which owns L300; the evidence read does not state AA as the default, so that choice needs a read source or stays open there.
    Evidence gap: one weak T1 row; business and legal case not found in what was read.
  impl_pointers:
  - build/distill/03_judge/J4_phil_interaction/records.md::INTERACTION.VISUALIZE
  - build/research/04_presentation/result.md::UI-C01
  - build/research/13_web_principles/result.md::WEB-C02
  - build/research/04_presentation/result.md::UI-C02
  - build/research/04_presentation/result.md::UI-C35
  - build/research/04_presentation/result.md::UI-C04
  - build/research/12_counter_voices/result.md::CV-C01
  - build/research/04_presentation/result.md::UI-C33
  - build/research/04_presentation/result.md::UI-C34
  - build/research/18_allocation/result.md::ALLOC-C37
- op: node.create
  uid: INTERACTION.COLLABORATE
  name: Collaboration on Data
  parent: INTERACTION
  intent: 'Several users discuss and change the same data and learn of each other''s changes through push as a hint over a correct pull: every page is correct on plain load and a client catches up from a server cursor that no later commit can fall behind. Comments are entities with their own target, author, lifecycle and separately checked abilities, and a comment is never more visible than its target on any surface the application serves.'
  epistemic_state: 'known | undecided: awaiting maintainer, read visibility of rows with per-user rules when several backends share the database (inherited from ALLOCATION.GUARD.3; recorded default: each backend filters from one shared written specification with a shared denial-test suite; reporting and operator comment grants restricted) | unvalidated: leak-surface list (L687, synthesis); channel order from one T3 source (L435); the comment-grant restriction for reporting and operator roles (inferred) | conflict: L682''s sequence-id cursor against L594, resolved for L594'
  constraints:
  - Every page is correct on plain load; a client that missed events catches up by fetching changes since a server-issued cursor and never trusts the events it happened to receive (L682, L006).
  - 'The catch-up cursor is one no later commit can fall behind; a sequence id is not such a cursor (L594). Realization: PIG-WEB-DATA.CONCURRENCY.5.'
  - 'Use the simplest channel that meets direction of flow, update frequency and tolerable latency: polling, then long polling or server-sent events, then a two-way channel; correctness never depends on the channel (L435).'
  - A stale write is rejected and the user sees the other change and reapplies; never a silent overwrite of the whole record; the browser and agent clients never resolve a conflict on their own (GUARD.5, L674).
  - Per-property last-writer-wins only for toggles, status, assignment and ordering; a text engine only for genuinely collaborative long-text fields (L674, L679, L677).
  - 'Presence is ephemeral: broadcast through a channel with a timeout, never written to tables; a persisted last-seen is a separate, coarse field (PRESENT.3, L681).'
  - A comment is its own entity with a mandatory target reference, its own author, lifecycle and permissions; comments are append-only rows that need no merge (L664, L679).
  - Read, comment, edit, resolve and moderate are separate abilities, deny by default, checked per object on every request, streams and exports included; none is implied by another (L686).
  - 'A comment is never more visible than its target, may have a narrower audience, and the same filter applies on every surface the application serves: counts, notifications, search results, history, exports, ETags and real-time channels (L686, L687).'
  - Notifications are created only for recipients who may see the target (L683).
  - 'Until the read-visibility question is answered: each backend filters per-user comment reads from one shared written specification that lists every secondary surface, with a shared denial-test suite every backend runs.'
  - 'Until the read-visibility question is answered: reporting and operator roles get no SELECT on comment content or on comments whose audience is narrower than their target; they read comments only through a projection limited to target-wide audiences, or not at all. Where a project does not apply this, the leak to those roles is a known limit stated where comments are documented.'
  - Agent writes are marked as agent-originated and pass the same abilities and visibility filters (L659).
  design_notes: |-
    Decides: how several users discuss and change the same data and learn of each other's changes.
    Rows: L006, L435, L664, L682, L686, L687. Cited: L594 (pig-web data), L671, L674, L677, L679, L681, L683, L659.
    Positions:
    - Freshness: P1 delivered events are the client's state (rejected in L682), or a client replica with a sync engine (L302, L677); P2 push is a hint over a correct pull (L682, L006).
    - Channel: P3 the simplest channel that meets the need (L435); P4 one two-way channel for everything (the WebSocket-first side of L436, owned by pig-web).
    - Comment model: P5 each comment its own entity with a mandatory target (L664); P6 comments embedded as columns or JSON in the annotated record (rejected in L664).
    - Abilities: P7 five separate abilities, deny by default, per object on every request (L686); P8 the comment right implied by the edit right or the reverse (rejected in L686).
    - Visibility: P9 a comment never more visible than its target, same filter on every secondary surface (L687); P10 the filter on the main list only (the leak L687 warns against).
    Forces: P2 serves correctness under dropped connections and several tabs, at the cost of a catch-up endpoint; P1 serves latency and offline use, at the cost of every replica becoming an authority (L302). P3 serves simplicity and operability; P4 serves one code path and two-way traffic, at the cost of long-lived connection servers. P5 and P7 serve confidentiality and least privilege (comments are edited, hidden or deleted without touching the data; reviewers and customers may comment without editing), at the cost of one more entity and more checks. P9 serves confidentiality; P10 serves only simplicity.
    Decision grounds:
    1. P2 (L682, L006). L682's "(sequence id)" is rejected as stated: a sequence id does not follow commit order, so a reader polling with "id greater than last seen" can skip a row forever (L594). Realization: PIG-WEB-DATA.CONCURRENCY.5.
    2. P3 (L435), one T3 source for the order.
    3. Concurrent edits surface the concurrency placement's policy (GUARD.5; L674, L679, L677).
    4. Presence per PRESENT.3 (L681).
    5. P5 (L664); append-only rows need no merge (L679).
    6. P7 (L686). Where each check lives follows GUARD.3 as settled: a rule decidable from the stored row and the actor (an author may edit their own comment; the target's author may resolve its threads, L671) is decided by the writer function; product roles that grant abilities (reviewer, customer, moderator) are each backend's product policy; the browser hides controls cosmetically. The unsourced "thread's opener may resolve" was dropped (review m2).
    7. P9 (L686, L687). Who applies the per-user read filter when several backends read the same comments is undecided: awaiting maintainer, read visibility of rows with per-user rules when several backends share the database (ALLOCATION.GUARD.3). Recorded default (MD-01 as written): each backend filters from one shared written specification with a shared denial-test suite. J1's fallback stays acceptable: database read functions that receive the verified actor, when a per-user read rule must hold for two or more backends. This node does not settle it.
       Consequence of the default (X1): roles that may SELECT the base tables (reporting, operator) see every row, comments included, unless their own role is restricted; the guarantee covers the surfaces the application serves and claims nothing stronger for those roles.
       Restriction required for comments until the question is answered (review M1; inferred from the confidentiality purpose of P9 and from the reporting role's column grants excluding personal data by default, J5 TRANSVERSE.SECURITY).
    8. Agents collaborate under the same rules (L659, pig-web).
    Rejected:
    - P1, delivered events as state: wins never. A client replica with a sync engine wins under the system-of-record placement's condition (offline use with user-owned data, RECORD.1), and even then catch-up uses a cursor.
    - P4 as the default: wins when traffic is two-way at high frequency (L435); the choice of push channel among server-sent events and WebSocket is the pig-web channel node's (L436).
    - P6: wins never for comments (they nearly always have other readers or writers than the record, L664). A single free-text note edited by exactly the people who edit the record is a field, not a comment (inferred).
    - P8: wins never (L686). P10: wins never (L687).
    Realizes: ALLOCATION.GUARD.5 (shows conflicts with the placement's policy; holds only the version it read); ALLOCATION.PRESENT.3 (presence on a channel with timeout, drafts in the browser, durable comments in the database); requires ALLOCATION.GUARD.3 (abilities and visibility follow the authorization placement, its open read clause included).
    Hand-offs: commit-ordered change cursor (PIG-WEB-DATA.CONCURRENCY.5, L594); push channel default (PIG-WEB-INTERACTION.REALTIME.1, L436); anchoring, threads, text engine fields, notification and moderation rows (PIG-WEB-INTERACTION.COLLABORATE.1 to .4); comment grants of reporting and operator roles (PIG-WEB-DATA.GUARD.2); comments as a named consequence of the read-visibility question's default (ALLOCATION.GUARD.3, allocation judge).
    Maintainer decisions: MD-01 respected (no row security by default; the read-visibility default is MD-01 as written); MD-03 shapes the row-decidable comment rules in writer functions.
    Evidence gaps: leak-surface list (L687) is a synthesis; channel order rests on one T3 source (L435); the comment-grant restriction is inferred; L682 conflicts with L594, resolved for L594.
  impl_pointers:
  - build/distill/03_judge/J4_phil_interaction/records.md::INTERACTION.COLLABORATE
  - build/research/11_realtime/result.md::RT-C37
  - build/research/12_counter_voices/result.md::CV-C08
  - build/research/18_allocation/result.md::ALLOC-C38
  - build/research/20_collaboration/result.md::C21
  - build/research/11_realtime/result.md::RT-C01
  - build/research/11_realtime/result.md::RT-C15
  - build/research/16_consistency_ordering/result.md::CONS-C20
  - build/research/19_agent_users/result.md::AGENT-C34
  - build/research/20_collaboration/result.md::C01
  - build/research/20_collaboration/result.md::C08
  - build/research/20_collaboration/result.md::C12
  - build/research/20_collaboration/result.md::C17
  - build/research/20_collaboration/result.md::C19
  - build/research/20_collaboration/result.md::C22
  - build/research/20_collaboration/result.md::C26
  - build/research/20_collaboration/result.md::C27
  - build/research/20_collaboration/result.md::C31
  - build/research/20_collaboration/result.md::C32
- op: node.create
  uid: INTERACTION.AGENT
  name: Agent Access
  parent: INTERACTION
  intent: An agent is one more user with bounded authority, served through an adapter on the same core that translates and shapes but never decides. Tokens are audience-bound and never forwarded, scopes are the narrowest, tools few and purpose-specific, consumption is limited by quota per agent identity, harmful flows are protected by name, and every agent action is audited on the server.
  epistemic_state: 'known | unvalidated: L648 applied to agents the application runs or serves (inferred); the identify-then-limit synthesis of L652 (inferred) | open: the list of scarce-goods flows where agents are excluded or a human must complete the flow, recorded per project'
  constraints:
  - The agent surface is an adapter to a backend that only translates and shapes; rules, validation, authorization and state transitions never live in the adapter or in prompts (RULES.4, L633).
  - Agents never connect to the database.
  - 'Agents never decide access: model output and client-supplied hints (tool annotations, claimed identity, client name) are untrusted input; the backend and the writer functions decide (GUARD.3; L644, L650).'
  - The server accepts only tokens issued for it and never forwards a caller's token; downstream calls use its own token (L640).
  - Each agent holds its own short-lived, revocable credential (GUARD.4).
  - Narrowest scopes, read scopes first, elevation on demand through a precise insufficient-scope challenge, no wildcard or omnibus scope; every request still authorized in server code (L642).
  - Few purpose-specific tools, each with only the permissions it needs; no raw shell, raw SQL or arbitrary URL fetch on the live system (L645).
  - Where the application runs or hosts an agent, no session holds untrusted input, private data and the power to change state or send outward together; if all three are needed, a supervised step or a split session (L648).
  - For agents the team does not run, no tool sends data to an arbitrary destination, and consequential or external effects go through the approval design (L646).
  - Agents that identify and authenticate themselves are admitted to every flow their scopes allow and limited by quota per agent identity (L652).
  - 'Flows whose automation harms the business (purchase, sign-up, booking, referral) are named and protected: per-flow limits for identified agents, approval by the owning user for irreversible effects, anonymous automation denied or challenged (L652, L034).'
  - On a flow that hands out scarce goods or rewards automation per account, completing the flow requires a human, or agents are excluded, whatever their identity; the list of such flows is a decision recorded per project.
  - Every mutation offered to agents that is not idempotent by design takes an idempotency key, recorded with the effect (GUARD.6).
  - Every agent action is logged on the server with acting identity, delegating subject, operation, correlation id and outcome, never only in a model transcript; agent-originated writes are marked in the data (ACT.4; L658, L659).
  design_notes: |-
    Decides: how agents act as users with bounded authority, verifiable identity and limited consumption.
    Rows: L640, L642, L645, L648, L652. Cited: L633, L644, L650, L646, L651, L658, L659, L034.
    Positions:
    - Tokens: P1 the server accepts only tokens issued for it and obtains its own for downstream calls (L640); P2 forwarding the client's token downstream (rejected in L640).
    - Scopes: P3 narrowest scopes, read first, elevation on demand (L642); P4 coarser scopes (acceptable in L642 for trusted first-party agents).
    - Tools: P5 few purpose-specific tools (L645); P6 open-ended tools: raw shell, raw SQL, arbitrary URL fetch (acceptable in L645 only inside a sandbox, SRC-398).
    - Session capabilities: P7 never untrusted input, private data and the power to change state or communicate externally in one session (L648); P8 rely on filtering the input (L649, pig-web: filters as an additional layer only).
    - Automated traffic: P9 deny non-human patterns on sensitive flows (L652 a, L034); P10 admit automated clients that identify and authenticate themselves, limited by quota (L652 b); P11 blanket bot blocking (rejected in L652).
    Forces: P1, P3, P5, P7 serve security and audit clarity (bounded authority), at the cost of consent friction, step-up round trips and fewer things an agent can do in one call. P4 and P6 serve capability and fewer round trips, at the cost of blast radius. P9 serves business integrity on flows whose automation harms the business; P10 serves agents as intended users; the ledger row states this trade-off itself ("serves business integrity against agent access", L652), and each side wins under its own condition. P11 serves neither once agents are users.
    Decision grounds: P1, P3, P5, P7, P10 with P9 as conditioned below; one core (RULES.4, L633); agents never decide access (GUARD.3; L644, L650); duplicate-safe (GUARD.6); accountable (ACT.4; L658; the backend asserts the user and the agent as the actor, R1-3 of the allocation records). Quotas are partitioned per agent identity so one runaway agent cannot exhaust its user's allowance (L651, pig-web). The application of L648 to external agents (tool shape and approval design instead of session control) is inferred.
    Rejected:
    - P2: wins never (L640).
    - P4: acceptable when the agent is first-party (built and run by the team) and every request is still authorized in server code (L642).
    - P6: acceptable only inside a sandbox that holds no authority and no connection to the system of record (L645, SRC-398; RECORD.2 forbids agent connections to the database).
    - P8 as the only control: wins never (L649); filters stay an additional layer.
    - P9 as the default for all automated traffic: rejected, since agents are intended users in the default context. P9 wins on the named harmful flows for anonymous automation, and wins outright on a flow that hands out scarce goods or rewards automation per account (limited stock, referral credit): per-agent quotas and owner approval do not stop one party running many accounts each with its own approved agent (L652 a: wins for scarce-inventory or abuse-prone flows; L034). The contest is resolved per flow by this condition, not dissolved.
    - P11: wins never where agents are intended users (L652).
    Realizes: requires ALLOCATION.RULES.4 (one more adapter on the same core); ALLOCATION.GUARD.3 (agents never decide access); ALLOCATION.GUARD.6 (agent retries absorbed by keys recorded with the effect); ALLOCATION.ACT.4 (agent actions recorded where history is written, both session role and claimed actor).
    Hand-offs: protocol and transport (PIG-WEB-INTERACTION.AGENT.1), discovery (.2), identity, delegation and agent-write marking (.3), approval designs and injection containment (.4, L646, L649), rate-limit partition and agent-shaped errors (.5, L651, L656, L657); scarce-goods flows closed to agents or requiring a human (.5).
    Maintainer decisions: MD-03 shapes the node (agents never connect to the database; the backend asserts the actor).
    Evidence gaps: L648 applied to agents the application runs or serves is inferred; the identify-then-limit synthesis of L652 is inferred.
  impl_pointers:
  - build/distill/03_judge/J4_phil_interaction/records.md::INTERACTION.AGENT
  - build/research/10_rate_limiting_uploads/result.md::RATE-C16
  - build/research/19_agent_users/result.md::AGENT-C01
  - build/research/19_agent_users/result.md::AGENT-C02
  - build/research/19_agent_users/result.md::AGENT-C10
  - build/research/19_agent_users/result.md::AGENT-C12
  - build/research/19_agent_users/result.md::AGENT-C14
