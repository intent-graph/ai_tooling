- op: node.create
  uid: INTERACTION.ENVIRONMENT.3
  name: Non-Atomic Deployment
  parent: INTERACTION.ENVIRONMENT
  intent: 'Client and server changes coexist because every client-server contract carries an explicit compatibility window at least as long as an old page can stay open (days): changes are additive, readers ignore what they do not know, and a breaking change goes expand, migrate, contract. Tabs keep old code for days, so assuming client and server deploy together breaks those users at each deploy.'
  epistemic_state: 'known | unvalidated: extension to form fields and agent tools inferred'
  constraints:
  - Every client-server contract has an explicit compatibility window, at least as long as an old page can stay open (L009).
  - Within the window, changes are additive and readers ignore what they do not know; nothing in use is removed (L056, L057).
  - Before removing or changing a behaviour, its current use is found, per consumer role (L058).
  - 'Every surface used by code the team does not redeploy at once is a contract under this window: JSON endpoints, HTML form fields and URLs posted by old pages, the agent tools and their schemas.'
  - 'Every interface description consumers read is always in sync with the implementation by process (MD-02, extended to every agent-facing interface): the HTTP description, the database function API catalogue and the agent tool surface; the compatibility window applies to each.'
  - 'A breaking change goes expand, migrate, contract: the new shape is added beside the old, each consumer moves, the old one is removed once no consumer uses it (L047); no client is silently broken.'
  - Lockstep deployment ("deployed together") is acceptable only when every consumer of the changed object ships in the same deployment; a browser tab never does.
  design_notes: |-
    Decides: how client and server changes coexist while old pages run against a new server.
    Rows: L009. Cited: L047, L056, L057, L058 (TRANSVERSE.CONTRACTS, J5 verdict), L277 (pig-web logic, contested), L517 (MAINT, via J5 and the cross-branch resolution on "deployed together"), MD-02.
    Positions: P1 every client-server contract has a compatibility window: compatible additions, tolerant readers, no removal while in use (L009, L056, L057, L058); P2 assume client and server deploy together (rejected in L009). Mechanisms for incompatible change, owned by pig-web (L277, contested): explicit versioned paths, or routing each client to the server version that served its code.
    Forces: P1 serves every user whose tab holds old code (tabs keep old code for days, L009), at the cost of carrying old shapes for the window; P2 serves simplicity and breaks those users at each deploy.
    Decision: P1 (consensus, T1 to T3). Extension of the window to form fields, URLs posted by old pages and agent tools is inferred (agents run code the team never deploys). A versioned path and routing each client to the server that served its code are the mechanisms that move old tabs during the migrate phase (L277; the mechanism is the pig-web choice). Review fixes: M3 with X7 (every interface description consumers read, agent tool surface included, always in sync); m1 with X2 (aligned with the TRANSVERSE.CONTRACTS verdict; the earlier gap "verdict not yet available" is dropped).
    Rejected: P2 wins never on the web (L009). "Deployed together" (L517) stays acceptable only when every consumer of the changed object ships in the same deployment; a browser tab never does, so for client-server contracts this condition does not hold (the departure from L517 is counted at the function-API node of the Postgres data tier, cited here only).
    Realizes: requires TRANSVERSE.CONTRACTS (compatible contract evolution: expand, migrate, contract for every contract, lockstep rejected for browser clients); aligned with that verdict.
    Hand-offs: skew policy mechanism (PIG-WEB-LOGIC.EXPOSE.7, L277); keeping the previous release's fingerprinted assets served during the window (PIG-WEB-TRANSVERSE.TOPOLOGY.4; not in the rows read, inferred); one origin and a drift gate for the agent tool surface (PIG-WEB-INTERACTION.AGENT.1, PIG-WEB-TRANSVERSE.CONTRACTS.1).
    Maintainer decisions: MD-02 (interface description always in sync by process; origin per project) reaches this node.
  impl_pointers:
