- op: node.create
  uid: INTERACTION.ENVIRONMENT.2
  name: Unstable Page Lifecycle
  parent: INTERACTION.ENVIRONMENT
  intent: 'Pages stay eligible for back/forward restore and refresh time-sensitive or sensitive state when restored from memory, and unsaved input is persisted when the page is hidden, never on unload. Two tabs are two concurrent writers: the server arbitrates through the version check and the idempotency keys, and client-side tab coordination is only an optimization.'
  epistemic_state: 'known | unvalidated: several-tab design as a general principle (L008); server arbitration across tabs inferred from GUARD.5, GUARD.6'
  constraints:
  - Pages stay eligible for back/forward restore; on restore from memory they refresh time-sensitive or sensitive state (L007, L293).
  - Unsaved input is persisted when the page is hidden, never on unload, since the browser may freeze or discard the page without notice (L294).
  - 'Two tabs editing the same data are two concurrent writers: the version check of GUARD.5 rejects the stale one; background work repeated by several tabs is absorbed by the keys of GUARD.6.'
  - Client-side coordination between tabs may reduce duplicate work and stale displays; correctness never depends on it (L008).
  design_notes: |-
    Decides: how state and side effects survive pages that are restored, frozen, discarded or open in several tabs.
    Rows: L007, L008. Cited: L293, L294 (pig-web), GUARD.5, GUARD.6.
    Positions: P1 back/forward is part of the interface: pages stay eligible for restore and refresh time-sensitive or sensitive state when restored from memory (L007, L293); P2 opt pages out of restore (no-store, unload handlers) to avoid stale views (rejected in L293 for non-sensitive pages). Several tabs: P3 coordinate shared work in the client (Web Locks; BroadcastChannel unverified) (L008); P4 the server as the arbiter of concurrent and repeated work, whatever the number of tabs (GUARD.5, GUARD.6).
    Forces: P1 serves instant navigation and correct displayed state; P2 serves freshness at the cost of every back navigation reloading. P3 serves less duplicate work and consistent display across tabs; P4 serves correctness, since two tabs are two concurrent clients the client cannot fully coordinate (a tab may be frozen or discarded).
    Decision: P1 with P4 as the ground and P3 as a copy. Correctness independent of client coordination is inferred from authority and copies (RULES.1).
    Rejected: P2: acceptable for pages that display sensitive data (no-store) (L293); never as a general freshness fix. P3 as the guard: wins never; kept as an optimization.
    Realizes: ALLOCATION.PRESENT.3 (in-progress state in the browser, durable state in the database), ALLOCATION.GUARD.5 and .6 (the server arbitrates across tabs); links inferred, the skeleton draws none.
    Hand-offs: lifecycle events and cache headers (PIG-WEB-INTERACTION.ENVIRONMENT.1).
    Evidence gaps: several-tab design as a general principle rests on L008; BroadcastChannel unverified.
  impl_pointers:
  - build/distill/03_judge/J4_phil_interaction/records.md::INTERACTION.ENVIRONMENT.2
