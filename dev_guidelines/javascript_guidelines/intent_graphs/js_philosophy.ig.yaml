- uid: CONTROL.FAILURE
  name: Failure has an owner
  intent: A failure in JavaScript travels one of two channels, synchronous throw or
    asynchronous rejection or event, and a failure nobody observes is lost or escalated
    by the host; every failure therefore has a named owner who handles it, passes
    it on with its origin, or lets the program end. Fail fast and never swallow silently
    are shared with Python and held by the inter link, not copied.
  epistemic_state: known | rolls up PIG-JS.CONTROL.PROMISES and PIG-JS.CONTROL.ERRORS;
    the asynchronous channel rests on one consensus fact
  design_notes: 'Fact [consensus]: An async function returns a new promise and turns
    every uncaught exception inside it into a rejection, so a failure in asynchronous
    code reaches callers only through the promise, never through a synchronous catch.'
  impl_pointers:
  - build/research/03_async/result.md::ASYNC-C07
  history:
  - who: agent:assembler
    date: 2026-10-13T18:37
    note: nodes, constraints, design notes, impl pointers and links from the integrated
