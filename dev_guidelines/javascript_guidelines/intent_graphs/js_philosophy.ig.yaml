  name: Visible conversion
  intent: Comparison and conversion are stated where they happen, so what an expression
    does follows from the declared kind of its operands, not from their values or
    from a coercion table the reader must recall.
  epistemic_state: 'known | unvalidated: inferred roll-up of PIG-JS.SUBSET.CONVERSION'
