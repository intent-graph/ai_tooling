      skeleton and ledger
- uid: SUBSET.BINDING
  name: Enforced binding and access
  intent: 'A name''s mutability and reach are declared and enforced by the language,
    not by naming convention or discipline: bindings are fixed by default, private
    means unreachable, and the receiver of a call is never implicit.'
  epistemic_state: 'known | unvalidated: inferred roll-up of PIG-JS.SUBSET.STRICTNESS.3,
    STRICTNESS.4, OBJECTS.1 and OBJECTS.3'
  history:
