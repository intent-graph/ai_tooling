meta:
  name: js-philosophy
  description: 'Product graph of the JavaScript guideline: eight principles on a predictable
    language subset, contracts, control of time and failure, locality of change, defense,
    dependencies, verification and runtime behaviour.'
nodes:
- uid: ROOT
  name: Solid JavaScript
  intent: JavaScript code whose behaviour is predictable, whose changes stay cheap
    and which resists attack, in the browser and in Node. JavaScript is permissive
    and widely misused; with strong principles it is made useful and safe by narrowing
    it to a checked subset rather than by avoiding it.
  epistemic_state: known
  history:
  - who: agent:assembler
    date: 2026-10-13T18:37
    note: init the js-philosophy product graph
  - who: agent:assembler
    date: 2026-10-13T18:37
    note: nodes, constraints, design notes, impl pointers and links from the integrated
      skeleton and ledger
- uid: SUBSET
  name: Predictable subset
  intent: 'Code does what its text says: the team writes in a checked subset of a
    permissive language, so no hidden conversion, silent loss of precision, silent
    failure, ambient default or surprise mutation decides an outcome.'
  epistemic_state: 'known | unvalidated: principle inferred as the roll-up of the
    PIG-JS.SUBSET decisions'
  design_notes: 'Deferred: Owned by the software development guideline: Reject a fixed
    tolerance as the general cure for float equality: choosing the tolerance is arbitrary
    and the relation differs-by-less-than-tolerance is not transitive (Goldberg).
    (software-development-philosophy:CONSTRUCTION.STATE.4)

    Deferred: Owned by the software development guideline: Separate immutability (nobody
    can change the state) from read-only restriction (only some clients may); the
    source is a taxonomy and shows no effect evidence, so no preference between them
    is derived. (software-development-philosophy:CONSTRUCTION.STATE.4)'
  impl_pointers:
  - build/research/01_lang/result.md::LANG-C29
  - build/research/04_struct/result.md::STRUCT-C66
  history:
  - who: agent:assembler
    date: 2026-10-13T18:37
    note: nodes, constraints, design notes, impl pointers and links from the integrated
      skeleton and ledger
- uid: CONTRACTS
  name: Contracts
  intent: Make intent checkable at build time through a type layer, while holding
    that the layer is a build-time artefact of a language that has no types at run
    time, so that what the checker passes says nothing about the data that arrives
    and is never taken as proof; only parsing that data at the trust boundary attests
    its shape.
  epistemic_state: 'known | unvalidated: intent narrowed at the split by the build,
    the general part is owned by the software development guideline'
  design_notes: 'Deferred: Owned by the software development guideline: Validate all
    data crossing a trust boundary, including data from internal APIs, queues and
    stored records, before the application uses it (software-development-philosophy:CONSTRUCTION.BOUNDARY.1)

    Deferred: Owned by the software development guideline: Server-side validation
    as a trusted service layer, never client-side validation as a security control:
    the architecture half is owned by the web-architecture guideline (software-development-philosophy:CONSTRUCTION.BOUNDARY.1)

    Deferred: Owned by the software development guideline: Use positive validation
    (allowlist of values, patterns, ranges, or comparison to an expected structure)
    rather than denylisting bad input (software-development-philosophy:CONSTRUCTION.BOUNDARY.2)

    Deferred: Owned by the software development guideline: Check syntax and semantics,
    including that combinations of related fields are reasonable (end date after start
    date) (software-development-philosophy:CONSTRUCTION.BOUNDARY.2)

    Deferred: Owned by the software development guideline: Make input handling a recognizer
    of valid inputs and keep input languages simple; do not hand-write ad-hoc recognizers
    (regex allow or deny lists) for complex input languages, which are unreliable
    (Sassaman et al., position of a 2011 technical report). (software-development-philosophy:CONSTRUCTION.BOUNDARY.2)

    Deferred: Owned by the software development guideline: Cap positional parameters:
    numerous parameters are hard to read and write because each parameter, its type
    and its order must be memorised (the rule default of 3 is a configuration default,
    not evidence) (software-development-philosophy:CONSTRUCTION.BOUNDARY.5)'
  impl_pointers:
