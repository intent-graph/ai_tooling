- uid: CONTROL.SCHEDULING
  name: One shared cooperative thread
  intent: All work of a program shares one thread that nothing preempts, with a fixed
    order between immediate continuations and later tasks and with time only as a
    lower bound; long work delays every other client, so code states what it needs
    and never relies on order or precision.
  epistemic_state: known | rolls up PIG-JS.CONTROL.SCHEDULING
  constraints:
  - 'MUST NOT block the event loop: a few threads serve every client, so a callback
    that runs long delays all clients and gives an attacker a denial-of-service lever.'
  design_notes: 'Rejected beliefs: Rejected belief: then on an already resolved promise
    runs immediately.

    Rejected beliefs: Rejected belief: setTimeout(fn, 0) runs at once or exactly on
    time.

    Fact [consensus]: Promise reactions never run synchronously, even for an already
    settled promise: they run as microtasks after the current run and the empty stack,
    before the event loop returns to timers and I/O.

    Fact [consensus]: A timer delay is a lower bound: the callback may run later and
    in unspecified relative order, so code never relies on timer precision.'
  impl_pointers:
