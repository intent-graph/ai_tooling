- uid: DEFENSE
  name: Defense
  intent: 'Input from outside the trust boundary is hostile; JavaScript sharpens this
    because a permissive language shares one runtime with untrusted code: hostile
    data must not become live markup in the page or a string that is compiled and
    run, code and content from another origin stays behind explicit boundaries, a
    hostile key must not rewrite what every object inherits, and one hostile input
    must not exhaust the single-threaded process.'
  epistemic_state: 'known | unvalidated: intent narrowed at the split by the build,
    the general part is owned by the software development guideline'
  design_notes: 'Deferred: Owned by the software development guideline: Never hardcode
    secrets in source code or committed configuration files. (software-development-philosophy:TRANSVERSE.CONFIG.1)

    Deferred: Owned by the software development guideline: Prefer built-in library
    functions to invoking OS commands at all; they cannot be manipulated into other
    tasks. (software-development-philosophy:CONSTRUCTION.DATA_NOT_CODE.1)

    Deferred: Owned by the software development guideline: Allowlist the executable
    and the arguments and run the process with the least privilege required when an
    OS command is unavoidable. (software-development-philosophy:CONSTRUCTION.DATA_NOT_CODE.1)

    Deferred: Owned by the software development guideline: Build queries with parameters
    passed separately from the query text; never concatenate or template untrusted
    values into it, because the database must receive code and data separately. (software-development-philosophy:CONSTRUCTION.DATA_NOT_CODE.2)

    Deferred: Owned by the software development guideline: Bind variables carry values
    only: identifiers, keywords and sort order never come from input; redesign the
    query or map the input through a fixed allowlist. (software-development-philosophy:CONSTRUCTION.DATA_NOT_CODE.2)

    Deferred: Owned by the software development guideline: Rejected: escaping all
    user input as the primary defence against SQL injection. OWASP calls it strongly
    discouraged, fragile, and not guaranteed to stop all injections. (software-development-philosophy:CONSTRUCTION.DATA_NOT_CODE.2)

    Deferred: Owned by the software development guideline: Run the application''s
    database account with least privilege as a second layer behind parameterization
    and validation. (software-development-philosophy:CONSTRUCTION.DATA_NOT_CODE.2)

    Deferred: Owned by the software development guideline: Belief rejected: NoSQL
    stores are immune to injection. A BSON query is an object, so string injection
    does not apply, but client-supplied objects used as field values inject query
    operators such as { $ne: "" }. (software-development-philosophy:CONSTRUCTION.DATA_NOT_CODE.2)

    Deferred: Owned by the software development guideline: Build file paths from internally
    generated or trusted names, not user-submitted filenames; where user filenames
    are unavoidable, apply strict allowlist validation. (software-development-philosophy:CONSTRUCTION.DATA_NOT_CODE.3)

    Deferred: Owned by the software development guideline: Exchange data across a
    trust boundary in a pure data format such as JSON, never in formats that carry
    types or code, and never deserialize untrusted data into executable structures.
    (software-development-philosophy:CONSTRUCTION.DATA_NOT_CODE.4)

    Deferred: Owned by the software development guideline: Sign serialized data and
    verify before deserializing (an HMAC where feasible) when the set of expected
    messages is known; populate a new object from validated fields instead of deserializing
    into the application''s own types. Language-neutral grounds only. (software-development-philosophy:CONSTRUCTION.DATA_NOT_CODE.4)

    Deferred: Owned by the software development guideline: Match the host of an outbound
    request against an allowlist and build the request yourself when the destination
    is known. (software-development-philosophy:CONSTRUCTION.DATA_NOT_CODE.3)

    Deferred: Owned by the software development guideline: Do not accept complete
    URLs from users when avoidable: URLs are hard to validate and the parser can be
    abused; accept validated hosts or addresses instead. (software-development-philosophy:CONSTRUCTION.DATA_NOT_CODE.3)

    Deferred: Owned by the software development guideline: Validate the resolved destination
    addresses against the permitted networks and make the client connect only to the
    validated addresses; a hostname check alone is not enough. (software-development-philosophy:CONSTRUCTION.DATA_NOT_CODE.3)

    Deferred: Owned by the software development guideline: Reject the entire JWT if
    any cryptographic operation in it fails to validate, and reject it if any validation
    step of the token specification fails. (software-development-philosophy:CONSTRUCTION.BOUNDARY.2)

    Deferred: Owned by the software development guideline: Disable document type definitions
    (reject DOCTYPE) when parsing untrusted XML; where DTDs are required, disable
    external entity resolution and external DTD loading and limit entity expansion.
    (software-development-philosophy:CONSTRUCTION.DATA_NOT_CODE.4)'
