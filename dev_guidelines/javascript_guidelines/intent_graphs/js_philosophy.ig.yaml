- uid: DEPENDENCIES.TRUST.1
  name: Every dependency is trusted code
  intent: Direct or transitive, development or runtime, every package acts with the
    application's privileges and is vetted as such.
  epistemic_state: 'known | unvalidated: dev-versus-runtime figures rest on a single
    T2 source'
  constraints:
  - 'MUST treat every dependency, direct or transitive, as trusted code running with
    the application''s full privileges: a malicious or compromised dependency is a
    first-order application risk.'
  design_notes: 'Rejected [single-source]: Rejected belief: the dependencies versus
    devDependencies split tells what ships to production. In the studied projects
    59 percent of runtime-configured dependencies were unused in production and 28.2
    percent of dev-configured ones were used; vet and audit both groups alike (folklore
    refuted, single T2 source).

    Fact [single-source]: Injection-capable APIs are common inside dependencies (2018
    study of 235,850 npm modules: eval in 9,111, exec in 7,686), so trusted code is
    not benign by default.'
  impl_pointers:
  - build/research/07_supply/result.md::SUPPLY-C01
  - build/research/06_runsec/result.md::RUNSEC-C21
  - build/research/07_supply/result.md::SUPPLY-C23
  history:
  - who: agent:assembler
    date: 2026-10-13T18:37
    note: nodes, constraints, design notes, impl pointers and links from the integrated
      skeleton and ledger
- uid: DEPENDENCIES.TRUST.2
  name: No containment inside the process
  intent: The runtime offers no privilege boundary between application code and its
    dependencies, so no design relies on one.
  epistemic_state: known
  constraints:
  - 'MUST NOT expect the runtime to contain a dependency: the permission boundary
    is the application''s, and per-package least privilege is a research proposal,
    not a shipped default.'
  design_notes: 'Rejected [consensus]: Rejected belief: dependencies are sandboxed
    or isolated inside the Node process. The runtime trusts all code in the process;
    any module can run arbitrary code with eval and write access to the file system
    achieves the same (folklore refuted by the Node threat model).'
  impl_pointers:
  - build/research/07_supply/result.md::SUPPLY-C02
  - build/research/06_runsec/result.md::RUNSEC-C41
  history:
  - who: agent:assembler
    date: 2026-10-13T18:37
    note: nodes, constraints, design notes, impl pointers and links from the integrated
      skeleton and ledger
- uid: DEPENDENCIES.THREATS.1
  name: Takeover of maintainership
  intent: Four incidents show that control of a maintainer account or of maintainership
    is a recurring route of compromise, so who maintains a package is a risk to weigh
    beside flaws in its code.
  epistemic_state: 'known | unvalidated: four incidents; their weight against code
    flaws is not measured'
  constraints:
  - 'MUST include takeover of maintainer accounts or maintainership among the threats
    planned for, next to vulnerable libraries: event-stream handover 2018, eslint-scope
    token theft 2018, debug phishing 2025 and the Shai-Hulud worm 2025 show that it
    recurs.'
  design_notes: 'Fact [single-source]: Expired maintainer-email domains are a takeover
    route: a study found 2,818 maintainer addresses on expired domains, making 8,494
    packages potentially hijackable.'
  impl_pointers:
  - build/research/07_supply/result.md::SUPPLY-C31
  - build/research/07_supply/result.md::SUPPLY-C30
  history:
  - who: agent:assembler
    date: 2026-10-13T18:37
    note: nodes, constraints, design notes, impl pointers and links from the integrated
      skeleton and ledger
- uid: DEPENDENCIES.THREATS.2
  name: Confusion is many mechanisms
  intent: Package confusion is a family of mechanisms, many semantic, so defences
    address the namespace and not only spelling.
  epistemic_state: 'known | unvalidated: single T2 source'
  design_notes: 'Rejected [single-source]: Rejected belief: package confusion is typing
    mistakes. A study of 1,200+ attacks found 13 confusion mechanisms, many semantic
    rather than syntactic (folklore refuted, single T2 source).

    Fact [single-source]: Typosquatting is the main technique in published malicious-package
    data: 61 percent of 174 malicious packages mimicked existing names, across three
    package ecosystems taken together (DIMVA 2020, T2).'
  impl_pointers:
  - build/research/07_supply/result.md::SUPPLY-C25
  - build/research/14_secgap2/result.md::SECGAP2-C49
  history:
  - who: agent:assembler
    date: 2026-10-13T18:37
    note: nodes, constraints, design notes, impl pointers and links from the integrated
      skeleton and ledger
- uid: DEPENDENCIES.ADMISSION.2
  name: Maintenance as a signal
  intent: Adoption weighs how many people maintain a package, how recently, and what
    it runs at install.
  epistemic_state: known
  constraints:
  - 'MUST judge maintenance before adoption: recent activity and a release within
    12 months, more than one maintainer; a few accounts or inactive maintainers are
    a measured weak link.'
  design_notes: 'Fact [majority]: Treat install scripts as a risk signal when evaluating
    a package.'
  impl_pointers:
  - build/research/07_supply/result.md::SUPPLY-C28
  - build/research/07_supply/result.md::SUPPLY-C29
  history:
  - who: agent:assembler
    date: 2026-10-13T18:37
    note: nodes, constraints, design notes, impl pointers and links from the integrated
      skeleton and ledger
- uid: DEPENDENCIES.EVIDENCE.1
  name: Provenance and signatures
  intent: Provenance and signatures state origin and integrity; assurance is graded
    and consumed as such, never read as safety.
  epistemic_state: 'known | unvalidated: rests on single-source claims only'
  constraints:
  - 'MUST read supply-chain assurance as graded: provenance alone is the lowest level,
    a hosted platform signing it the middle, hardened builds that resist tampering
    during the build the highest.'
  - MUST generate and consume SBOMs automatically in CI, and accept only signed components
    whose signatures are validated before use.
  design_notes: 'Rejected [single-source]: Rejected belief: a package with provenance
    is safe. Provenance links a package to its source and build; it does not guarantee
    absence of malicious code (folklore refuted by the npm documentation).

    Rejected [single-source]: Rejected belief: a signed package is a trustworthy package.
    Registry signatures detect tampering with tarball content by a mirror or proxy,
    not a malicious publisher (folklore refuted by the npm documentation).

    Fact [single-source]: Keyless signing with ephemeral keys tied to an OIDC identity
    and a transparency log lowers the key-management burden of artifact signing.'
  impl_pointers:
  - build/research/07_supply/result.md::SUPPLY-C18
  - build/research/07_supply/result.md::SUPPLY-C19
  - build/research/07_supply/result.md::SUPPLY-C33
  - build/research/07_supply/result.md::SUPPLY-C37
  - build/research/07_supply/result.md::SUPPLY-C34
  history:
  - who: agent:assembler
    date: 2026-10-13T18:37
    note: nodes, constraints, design notes, impl pointers and links from the integrated
      skeleton and ledger
- uid: DEPENDENCIES.EVIDENCE.2
  name: Audit findings
  intent: Vulnerability findings are triage input; reachability, not count, measures
    risk.
  epistemic_state: known
  design_notes: 'Rejected [consensus]: Rejected belief: every audit finding is an
    exploitable risk. Most package-level findings are unreachable (68.28 percent)
    and most alerts concern dependencies not shipped to production; treat findings
    as triage input, not as a measure of exploitability.'
  impl_pointers:
