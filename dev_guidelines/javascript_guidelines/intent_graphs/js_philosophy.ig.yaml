- uid: CONTROL
  name: Explicit control of time, failure and resources
  intent: Behaviour under delay, error and load stays predictable because every asynchronous
    operation, failure and resource of a JavaScript program has an owner, a bound
    and a defined end.
  epistemic_state: known | rolls up its five children
  history:
  - who: agent:assembler
    date: 2026-10-13T18:37
    note: nodes, constraints, design notes, impl pointers and links from the integrated
      skeleton and ledger
- uid: STRUCTURE
  name: Structure for locality of change
  intent: 'Organize code so that a change touches one place: what a module exports
    is state shared by every importer, because an importer cannot rebind it but can
    change it, so the sharing is made visible instead of left implicit.'
  epistemic_state: 'known | unvalidated: intent narrowed at the split by the build,
    the general part is owned by the software development guideline'
  design_notes: 'Deferred: Owned by the software development guideline: Decompose
    a system into modules by listing the design decisions that are difficult or likely
    to change and hiding each one inside one module, not by the steps of processing.
    (software-development-philosophy:CONSTRUCTION.HIDING.1)

    Deferred: Owned by the software development guideline: Distinguish an abstract
    data type (representation hidden behind operations) from an object (procedural
    interface, information hidden by procedural abstraction), and do not conflate
    the two when designing an API. (software-development-philosophy:CONSTRUCTION.HIDING.1)

    Deferred: Owned by the software development guideline: Keep each module''s public
    surface minimal at every level at which JavaScript can expose a name: named exports
    of a module, the package entry points, and class members. (software-development-philosophy:CONSTRUCTION.HIDING.1)

    Deferred: Owned by the software development guideline: Keep a module''s top level
    free of effects other than initialising its own exports, so that importing it
    is safe in any order and unused code can be dropped by tools. (software-development-philosophy:CONSTRUCTION.STATE.5)

    Deferred: Owned by the software development guideline: Demoted to fact: a lint
    rule can forbid imports by path or pattern, which makes mechanical enforcement
    of import direction possible; the claim that layer direction should be declared
    and enforced has no admitted ground (the rule documents environment fit, not layering),
    so the principle stays undecided. (software-development-philosophy:CONSTRUCTION.DEPENDENCY_DIRECTION.2)

    Deferred: Owned by the software development guideline: Name identifiers with whole
    words, not single letters or letter-deleting abbreviations: words gave about 19
    percent faster defect finding than letters or abbreviations in an experiment with
    72 professional C# developers, with no significant difference between letters
    and abbreviations. Transfer to JavaScript is inference. (software-development-philosophy:CONSTRUCTION.NAMING.1)

    Deferred: Owned by the software development guideline: Give one concept one word,
    made of common words and descriptive: holder positions of Google JS, Google TS,
    W3C TAG and Airbnb agree. Holder positions only, not evidence. (software-development-philosophy:CONSTRUCTION.NAMING.2)

    Deferred: Owned by the software development guideline: Derive a name by selecting
    the concepts, choosing words per concept, then composing the name; expect two
    developers to pick the same name only rarely (median 6.9 percent over 47 instances)
    but a chosen name to be understood. (software-development-philosophy:CONSTRUCTION.NAMING.3)

    Deferred: Owned by the software development guideline: Choose the paradigm per
    problem by intent: no admitted source supports choosing an object-oriented or
    a functional style inside JavaScript on defect-rate evidence. (software-development-philosophy:CONSTRUCTION.PARADIGM.1)

    Deferred: Owned by the software development guideline: Whether a paradigm lowers
    defects is contested and the studies compare languages, not paradigms inside one
    language: a modest language effect (Ray et al.), four of eleven languages significant
    with exceedingly small effects (reproduction), results largely replicated (rebuttal).
    (software-development-philosophy:CONSTRUCTION.PARADIGM.1)'
