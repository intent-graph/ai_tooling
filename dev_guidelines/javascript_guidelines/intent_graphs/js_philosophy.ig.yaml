    note: nodes, constraints, design notes, impl pointers and links from the integrated
      skeleton and ledger
- uid: DEPENDENCIES.CHANGE.1
  name: Reproducible tree
  intent: Every install resolves the same tree because the lockfile, not the manifest,
    fixes it; lockfile semantics are verified per manager, not assumed.
  epistemic_state: known
  constraints:
  - MUST commit the lockfile to version control so every install, in CI and deployment
    included, resolves the same tree.
  - 'MUST NOT rely on exact pins in the manifest alone: pinning a dependency does
    not pin its transitive dependencies, which only the lockfile fixes.'
  design_notes: 'Rejected [single-source]: Rejected belief: lockfile semantics are
    the same across package managers. A study of 7 managers found a wide variety of
    generation and content decisions; verify the behaviour of the manager in use.'
  impl_pointers:
  - build/research/07_supply/result.md::SUPPLY-C03
  - build/research/07_supply/result.md::SUPPLY-C05
  - build/research/07_supply/result.md::SUPPLY-C40
  history:
  - who: agent:assembler
    date: 2026-10-13T18:37
    note: nodes, constraints, design notes, impl pointers and links from the integrated
      skeleton and ledger
- uid: DEPENDENCIES.CHANGE.2
  name: Pin policy
  intent: 'Which versions may enter is fixed deliberately: the lockfile fixes the
    tree, direct dependencies of an application are exact, and release type is no
    guarantee of compatibility.'
  epistemic_state: 'known | conflict: ranges only, OpenSSF npm guide v1.1 (SRC-154,
    archived 2023); collective ecosystem pinning, SRC-287 | unclear: library scope
    is inferred'
  constraints:
  - 'MUST fix the installed tree by the committed lockfile (all transitives, integrity
    hashes) and declare the direct dependencies of an application at exact versions,
    so every change of a direct dependency is a reviewed diff. Acceptable when: version
    ranges for a published library, with the lockfile still committed for the application
    that consumes it; the library scope is inferred.'
  design_notes: 'Rejected [single-source]: Rejected belief: a minor or patch release
    of a dependency is non-breaking. 44 percent of manifesting breaking changes arrived
    in minor and patch releases (study; exact denominator unverified), which weighs
    against trusting ranges.'
  impl_pointers:
  - build/research/07_supply/result.md::SUPPLY-C06
  - build/research/04_struct/result.md::STRUCT-C67
  history:
  - who: agent:assembler
    date: 2026-10-13T18:37
    note: nodes, constraints, design notes, impl pointers and links from the integrated
      skeleton and ledger
- uid: DEPENDENCIES.CHANGE.3
  name: Lockfile review
  intent: A lockfile change is a code change and is reviewed like one.
  epistemic_state: 'known | unvalidated: claim is inferred from a listed attack vector
    | unvalidated: rests on single-source claims only | unvalidated: quote not obtained
    (SUPPLY-C07)'
  constraints:
  - 'MUST review lockfile diffs as part of code review: lockfile poisoning is a listed
    attack vector and the lockfile carries resolved URLs and integrity hashes.'
  impl_pointers:
  - build/research/07_supply/result.md::SUPPLY-C07
  history:
  - who: agent:assembler
    date: 2026-10-13T18:37
    note: nodes, constraints, design notes, impl pointers and links from the integrated
      skeleton and ledger
- uid: RUNTIME.MEMORY.1
  name: Reachability decides leaks
  intent: A leak is an object kept reachable from a root by a retainer; unreachable
    objects are collected whatever their mutual references, so cycles alone are not
    leaks.
  epistemic_state: 'known | unvalidated: quote tool-extracted | unvalidated: rests
    on single-source claims only'
  constraints:
  - 'MUST reason about leaks as reachability: engines free objects that are unreachable
    from roots, and circular references do not by themselves leak.'
  design_notes: 'Rejected beliefs: Belief that circular references cause memory leaks
    in JavaScript: refuted in the dissent audit on SRC-193, modern engines use mark-and-sweep
    reachability and no longer use reference counting.

    Sources cited: SRC-193'
  impl_pointers:
  - build/research/09_runtime/result.md::RUNTIME-C27
  history:
  - who: agent:assembler
    date: 2026-10-13T18:37
    note: nodes, constraints, design notes, impl pointers and links from the integrated
      skeleton and ledger
- uid: RUNTIME.MEMORY.2
  name: Bounded long-lived state
  intent: State that lives long is promoted into the collector's costlier region,
    so caches, sessions and other long-lived state carry an explicit bound.
  epistemic_state: 'known | unvalidated: bounding advice inferred, quote tool-extracted'
  constraints:
  - 'MUST keep long-lived state (caches, sessions) bounded: most objects die young,
    so the collector reclaims young objects often and cheaply and old objects rarely
    and at higher cost, and long-lived state is promoted to the costlier region.'
  impl_pointers:
  - build/research/09_runtime/result.md::RUNTIME-C53
  history:
  - who: agent:assembler
    date: 2026-10-13T18:37
    note: nodes, constraints, design notes, impl pointers and links from the integrated
      skeleton and ledger
