- uid: SUBSET.FAILURE
  name: Loud failure
  intent: 'A mistake stops the program at the mistake: code runs in the strictest
    mode its language offers, in which a misspelt name, a write to a locked value
    or an unowned receiver raises an error instead of silently changing state.'
  epistemic_state: 'known | unvalidated: inferred roll-up of PIG-JS.SUBSET.STRICTNESS.1,
    MUTATION.1 and OBJECTS.1'
  history:
  - who: agent:assembler
