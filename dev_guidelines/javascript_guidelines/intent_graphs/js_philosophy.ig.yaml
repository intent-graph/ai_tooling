- uid: RUNTIME
  name: Runtime behaviour
  intent: Code stays well behaved over time because its memory behaviour follows from
    what the collector can reach and from how long state lives, not from belief or
    folklore about references.
  epistemic_state: 'known | unvalidated: most grounds are single-source | unvalidated:
    intent narrowed at the split by the build, the general part is owned by the software
    development guideline'
  design_notes: 'Deferred: Owned by the software development guideline: Treat performance
    advice that rests on engine internals as dated single-body evidence that can describe
    a mechanism but cannot prescribe (no T1 specifies engine performance); make a
    performance belief a rule only through a measurement of the real workload. (software-development-philosophy:ASSURANCE.PERFORMANCE.5)

    Deferred: Owned by the software development guideline: Measure performance as
    a distribution, not a number: report start-up and steady state separately across
    several fresh VM invocations with several iterations each, give confidence intervals,
    and vary the experimental setup, because an innocuous setup change can bias results
    and flip conclusions. (software-development-philosophy:ASSURANCE.PERFORMANCE.5)'
