- uid: DEPENDENCIES
  name: Dependencies
  intent: 'Third-party code runs with the application''s full privileges, so each
    dependency is a trust decision: weighed against the routes by which trust is lost,
    vetted for maintenance and install-time behaviour before adoption, installed reproducibly,
    changed deliberately, and judged by evidence whose limits are known.'
  epistemic_state: 'known | unvalidated: intent narrowed at the split by the build,
    the general part is owned by the software development guideline'
  design_notes: 'Deferred: Owned by the software development guideline: Enable two-factor
    authentication on registry publishing accounts; phishing-resistant MFA on developer
    accounts is the response CISA recommends after account compromises. (software-development-philosophy:OWNERSHIP.LIFECYCLE.4)'
  impl_pointers:
  - build/research/07_supply/result.md::SUPPLY-C17
  history:
  - who: agent:assembler
    date: 2026-10-13T18:37
    note: nodes, constraints, design notes, impl pointers and links from the integrated
      skeleton and ledger
- uid: VERIFICATION
  name: Verification
  intent: 'Defects that people forget to look for are found by machines on every change,
    with a result that blocks the change: the checked subset and the type layer hold
    only while a tool checks them there.'
  epistemic_state: 'known | unvalidated: intent narrowed at the split by the build,
    the general part is owned by the software development guideline'
  design_notes: 'Deferred: Owned by the software development guideline: Dynamic checks
    find bad practices that static lint misses: on 200+ web sites in 2015, 28 dynamic
    checkers detected on average 49 problems per site that static analysis missed.
    Evidence of occurrence in 2015, not a current-language claim. (software-development-philosophy:ASSURANCE.RULES.2)

    Deferred: Owned by the software development guideline: Enable a linter or a safe
    language mode and address its warnings; the OpenSSF passing criteria make this
    a MUST. (software-development-philosophy:ASSURANCE.BEHAVIOUR.2)

    Deferred: Owned by the software development guideline: Apply at least one static-analysis
    tool beyond compiler warnings and safe modes to every proposed major production
    release before it ships. (software-development-philosophy:ASSURANCE.BEHAVIOUR.2)

    Deferred: Owned by the software development guideline: Combine several analysis
    tools in CI but never as the only mechanism, and write negative tests (what must
    not happen does not) so a passing suite means shipping. Held as the OpenSSF Best
    Practices Working Group''s position. (software-development-philosophy:ASSURANCE.RULES.2)

    Deferred: Owned by the software development guideline: Keep a policy that new
    major functionality gets automated tests, keep evidence that recent major changes
    followed it, and make the suite invocable in the language''s standard way. (software-development-philosophy:ASSURANCE.BEHAVIOUR.1)

    Deferred: Owned by the software development guideline: SHOULD NOT gate on a coverage
    number or use one as a quality target; use coverage to find under-tested code.
    Study: correlation with suite effectiveness is low to moderate once suite size
    is controlled (31,000 suites, five large Java systems); transfer to JavaScript
    inferred. (software-development-philosophy:ASSURANCE.BEHAVIOUR.6)

    Deferred: Owned by the software development guideline: Rejected position (OpenSSF
    passing criteria, T1): cover most or all branches, as a suggestion and not a numeric
    target; it would win for a project that adopts those criteria, and it is compatible
    with using coverage to locate code no test executes. (software-development-philosophy:ASSURANCE.BEHAVIOUR.6)

    Deferred: Owned by the software development guideline: Folklore rejected (restricted
    verdict, the dissent audit): high coverage means effective tests. Coverage finds
    code no test executes; it does not show that tests would detect a fault. (software-development-philosophy:ASSURANCE.BEHAVIOUR.6)

    Deferred: Owned by the software development guideline: Test behaviours through
    the public API, one test per behaviour rather than per method, DAMP over DRY.
    Google''s position (T3, single source), taken as the decision for lack of any
    other admitted position. (software-development-philosophy:ASSURANCE.BEHAVIOUR.4)

    Deferred: Owned by the software development guideline: Prefer real objects over
    mocks when they are fast and deterministic, because brittle tests fail on unrelated
    changes. Google''s position (T3, single source), taken as the decision for lack
    of any other admitted position. (software-development-philosophy:ASSURANCE.BEHAVIOUR.4)

    Deferred: Owned by the software development guideline: Google''s test mix is about
    80% narrow unit tests, 15% medium integration tests, 5% end-to-end. Acceptable
    when an organization with Google-like test infrastructure sets a mix; Google''s
    stated practice, not a general rule. (software-development-philosophy:ASSURANCE.BEHAVIOUR.4)

    Deferred: Owned by the software development guideline: A mutation score is the
    share of injected faults that tests kill: mutation analysis measures whether tests
    detect small seeded changes, which coverage cannot show. (software-development-philosophy:ASSURANCE.BEHAVIOUR.6)

    Deferred: Owned by the software development guideline: Run mutation testing incrementally
    on changed code during code review and filter mutants, instead of mutating the
    whole code base, when adopting it at scale. Abstract-level source, Google setting
    (24,000+ developers, 1,000+ projects). (software-development-philosophy:ASSURANCE.BEHAVIOUR.6)

    Deferred: Owned by the software development guideline: Property-based testing
    replaces hand-picked inputs with generated ones: a property is a checkable statement,
    inputs are generated at random, failures are shrunk to the smallest reproducing
    input (shrinking is fast-check''s, absent from the QuickCheck paper). (software-development-philosophy:ASSURANCE.BEHAVIOUR.6)

    Deferred: Owned by the software development guideline: Control the distribution
    of generated test data with custom generators: random testing is most effective
    when the distribution follows actual data, and a uniform distribution is often
    a poor default. (software-development-philosophy:ASSURANCE.BEHAVIOUR.6)

    Deferred: Owned by the software development guideline: The QuickCheck authors
    write properties in the same module as the functions they test, as checkable documentation.
    Acceptable when a team wants properties beside the code; the authors'' practice,
    outside the method the source is admitted for. (software-development-philosophy:ASSURANCE.BEHAVIOUR.6)

    Deferred: Owned by the software development guideline: Check new tests extensively
    when they are added: flaky tests come mostly from async waits (45% of studied
    fixes), concurrency and test-order dependency, and are flaky from the first run.
    Study of 201 commits in 51 mostly Java projects; transfer inferred. (software-development-philosophy:ASSURANCE.RULES.1)

    Deferred: Owned by the software development guideline: Clean the shared state
    between tests: 74% (14 of 19) of order-dependent flaky tests in the study were
    fixed that way. Java-dominated study; transfer inferred. (software-development-philosophy:ASSURANCE.RULES.1)

    Deferred: Owned by the software development guideline: Track the flaky-test rate:
    Google reports about 0.15% and says tests begin to lose value near 1% flakiness;
    treat approaching 1% as the point to act. Google''s figures (T3, single source),
    the only admitted threshold. (software-development-philosophy:ASSURANCE.RULES.1)

    Deferred: Owned by the software development guideline: Make the merge gate always
    run: a skipped required check must not let a merge through. (software-development-philosophy:ASSURANCE.RULES.3)'
