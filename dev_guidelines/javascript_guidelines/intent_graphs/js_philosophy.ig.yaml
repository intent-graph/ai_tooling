- uid: CONTROL.BOUNDS
  name: Every wait and every task has a bound and a stopper
  intent: Waiting has a time limit and running work has a party that can stop it,
    because a promise cannot be cancelled and an unbounded wait or task holds resources
    for as long as its slowest peer.
  epistemic_state: known | rolls up PIG-JS.CONTROL.BOUNDS
  design_notes: 'Rejected beliefs: Rejected belief: promises can be cancelled. Promise.all,
    Promise.race and a dropped reference stop nothing; the underlying operation must
    be cancelled.

    Fact [consensus]: A promise models settlement only and has no cancellation protocol;
    cancellation belongs to the operation that consumes an abort signal.'
  impl_pointers:
