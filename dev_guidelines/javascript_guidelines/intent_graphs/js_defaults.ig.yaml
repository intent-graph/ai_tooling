- uid: PIG-JS.DEFENSE.HOST.4
  name: Regex cost
  intent: Input length and repetition are bounded, nested quantifiers avoided, a non-backtracking
    engine preferred where one exists.
  epistemic_state: 'known | unvalidated: rests on claims marked inferred or open (RUNSEC-C35)'
  constraints:
  - MUST bound the length of untrusted input before regex matching and bound repetition
    counts in the pattern.
  - MUST write patterns without nested quantifiers or ambiguous alternation over the
    same characters; V8 Irregexp is a backtracking engine and crafted non-matching
    input forces exponential backtracking.
  - 'MUST prefer a non-backtracking regex engine where one is available and do not
    assume V8 offers one: V8''s is experimental, behind flags and unsupported for
    backreferences, lookarounds and the u and i flags (status of 2021, current status
    open). Belief restricted: V8 offers a non-backtracking engine for ReDoS defence.'
  - 'MUST require the regex to match the entire value when validating: use anchors
    at both ends. That ECMAScript $ does not accept a trailing newline is inferred,
    not stated on the cited page.'
  - 'Acceptable only when a match timeout exists (JavaScript has no built-in regex
    timeout): treat a timeout as a validation failure, not a pass.'
  design_notes: 'Judge record:

    Regex cost

    Positions: Bounded input and patterns, non-backtracking engine where available
    (OpenSSF, V8 blog, OWASP). Claims RUNSEC-C30 to C35, TYPES-C32.

    Forces: Availability against expressive patterns.

    Decision: Bound length and repetition, avoid nested quantifiers, anchor, prefer
    a non-backtracking engine where one exists.

    Rejected: Assuming V8 has a non-backtracking engine: restricted, experimental
    and flagged.'
  impl_pointers:
  - build/research/06_runsec/result.md::RUNSEC-C30
