- uid: PIG-JS.DEFENSE.HOST.3
  name: HTTP parsing and smuggling
  intent: The strict HTTP parser stays on, the front end normalizes ambiguous requests,
    and no control character reaches a header.
  epistemic_state: 'known | unvalidated: rests on single-source claims only'
  constraints:
  - MUST NOT set the insecureHTTPParser option when creating an HTTP server.
  - MUST configure the front-end server to normalize ambiguous requests, use HTTP/2
    end to end with downgrading disabled where possible, and keep monitoring smuggling
    vulnerabilities in Node and the front end.
  design_notes: 'Judge record:

    HTTP parsing and smuggling

    Positions: Strict parser plus front-end normalization (Node best practices, CVE-2026-58044).
    Claims SRVSEC-C57, C58, C59.

    Forces: Strictness against interoperability with sloppy clients.

    Decision: Never set insecureHTTPParser; normalize at the front end; HTTP/2 end
    to end where possible.

    Rejected: Lenient parser: accepts requests the strict one rejects.

    Fact [single-source]: Fact: a forwarding proxy rebuilding headers from req.headers
    while piping the body to a reused backend can be desynchronized, because Node
    omitted headers beyond maxHeadersCount from req.headers while still framing with
    them (CVE-2026-58044, Low; fixed in 22.23.2, 24.18.1, 26.5.1).'
