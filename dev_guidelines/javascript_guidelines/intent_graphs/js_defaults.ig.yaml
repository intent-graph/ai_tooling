- uid: PIG-JS.STRUCTURE.NODE.3
  name: Loading ESM from CommonJS
  intent: Load an ES module from CommonJS through require only when its graph has
    no top-level await, otherwise through dynamic import.
  epistemic_state: 'known | unvalidated: quote tool-extracted | unvalidated: rests
    on single-source claims only'
  constraints:
  - MUST use require() from CommonJS only for synchronous ES modules (no top-level
    await anywhere in the graph) and dynamic import() for the rest, which works in
    both module systems.
  design_notes: 'Judge record:

    Positions: require() of ESM without top-level await, import() otherwise (LANG-C61,
    STRUCT-C16; SRC-030, SRC-089) against the belief that CommonJS cannot load ESM

    Forces: The belief forces dynamic import everywhere; the mechanism allows synchronous
    require for graphs without top-level await

    Decision: Allow require only for graphs without top-level await, else dynamic
    import

    Rejected: Always dynamic import: wins when the graph may gain top-level await
    later, since ERR_REQUIRE_ASYNC_MODULE appears at run time

    Rejected [consensus]: Rejected folklore "CommonJS cannot load ES modules" (restricted:
    true only while the graph has top-level await): require() of an ES module works
    when the graph has no top-level await, otherwise Node throws ERR_REQUIRE_ASYNC_MODULE;
    require(esm) is no longer experimental as of Node 25.4.0.

    Sources cited: SRC-030, SRC-089'
