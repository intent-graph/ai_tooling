- uid: PIG-JS.STRUCTURE.LOADING.6
  name: Barrel files
  intent: Import from the defining module where a barrel re-exports many modules,
    and keep aggregation at a package's public entry point.
  epistemic_state: 'risky | unvalidated: single T3 source, one synthetic measurement
    on one machine; the scope ''many modules'' is inferred from how the measured cost
    scales | unvalidated: holder position only (the barrel-file article''s author)
    | conflict: barrels are a documented use of aggregation, MDN (no recommendation)'
  constraints:
  - 'SHOULD NOT use barrel files (re-export-only modules) to aggregate a package''s
    internals once they re-export many modules: every importer loads all re-exported
    modules eagerly, and the one measurement found the cost growing with the count
    (one synthetic measurement, one machine: 0.15 s for 500 modules, 48.44 s for 50,000);
    import from the defining module there, and keep a small barrel where the project''s
    own measurement shows no cost. Aggregation at a package''s public entry point
    stays. The blanket "get rid of all barrel files" is the author''s position and
    is not adopted.'
  design_notes: 'Judge record:

    Positions: Avoid internal barrels (STRUCT-C29; SRC-315 T3 measurement, SRC-086)
    against barrels as a convenience (MDN documents aggregation, no recommendation)
    and the blanket removal position

    Forces: A barrel couples each importer to every re-exported module; a public entry
    point is the one place aggregation earns its cost

    Decision: Import from the defining module where a barrel re-exports many modules
    (SHOULD NOT aggregate internals there); aggregate at the public entry point. Re-judged
    under best (RELAX): the cost in the one measurement grows with the module count
    (0.15 s at 500, 48.44 s at 50,000), so it supports not using large barrels, not
    never using an internal barrel; the mechanism, eager loading of everything re-exported,
    is MDN''s (T1); the measurement is T3, one machine, synthetic

    Rejected: Barrels everywhere: win where no measurement shows load cost and importers
    need many members, which is now the stated condition for small barrels; blanket
    removal of internal barrels (the former MUST NOT): best where the package is large
    enough for the measured cost to apply; blanket removal of all barrels wins if
    the public entry point is itself the problem

    Sources cited: SRC-086, SRC-315'
