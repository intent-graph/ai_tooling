    no CR, LF or CRLF, and neither send nor accept connection-specific fields such
    as Transfer-Encoding (ASVS 4.2.3 and 4.2.4, Level 3).
  design_notes: 'Judge record:

    Connection-specific fields

    Positions: (a) accept HTTP/2 and HTTP/3 requests only without CR, LF, CRLF and
    without connection-specific fields (ASVS 4.2.3, 4.2.4, Level 3); (b) no rule.
    Claim SECGAP2-C29.

    Forces: Downgrade and smuggling safety against compatibility.

    Decision: (a), flagged single-source.

    Rejected: (b): wins for HTTP/1.1-only services, where 4.2.4 does not apply.'
