- uid: PIG-JS.DEPENDENCIES.PUBLISH.1
  name: CI publishing credentials
  intent: Publishing from CI uses short-lived, workflow-bound credentials, and provenance
    follows from it.
  epistemic_state: known
  constraints:
  - MUST prefer trusted publishing (OIDC, short-lived workflow-specific credentials)
    over long-lived tokens when publishing an npm package from CI.
  design_notes: 'Judge record:

    Positions: (a) long-lived tokens in CI; (b) trusted publishing with OIDC and short-lived
    credentials: SUPPLY-C15 (SRC-160, SRC-141, SRC-155 OWASP, consensus); (c) stage-only
    tokens as the fallback (SUPPLY-C16, SRC-141).

    Forces: Trust wants no long-lived secret in CI; the cost is a supported CI provider
    and npm 11.5.1 or later with Node 22.14 or later (SRC-160).

    Decision: (b), provenance then generated automatically for public repositories
    (SUPPLY-C20). SUPPLY-C16 (token policy dates) is a dated fact, demoted from decision
    (SRC-141 restriction).

    Rejected: (a): legacy tokens are removed (Nov 2025) and direct publishing with
    a granular token ends (Jan 2027); it would win only where (b) is unavailable,
    then (c).

    Fact [single-source]: npm publishing tokens are narrowing: legacy tokens removed
    Nov 2025, bypass-2FA tokens lose account-governance rights Aug 2026, direct publishing
    with a granular token ends Jan 2027. Recorded as dated facts of npm policy.

    Fact [single-source]: npm provenance needs a cloud-hosted GitHub Actions runner
    with id-token: write and --provenance; under trusted publishing it is generated
    automatically for public repositories and packages.

    Fact [single-source]: Fact (SLSA levels): Build L1 provenance exists, L2 a hosted
    platform signs it, L3 hardened builds resist tampering during the build.

    Sources cited: SRC-141, SRC-155, SRC-160'
