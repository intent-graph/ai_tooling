- uid: PIG-JS.CONTROL.FLOW.2
  name: Pipelines and iteration
  intent: Streams are composed with the function that closes every stage on failure,
    and early exit semantics are known.
  epistemic_state: 'known | unvalidated: single T1 source for pipeline and finished
    rules'
  constraints:
  - 'MUST prefer stream.pipeline (or stream/promises pipeline) over readable.pipe():
    pipe does not close the destination when the source errors, which leaks resources.'
  - 'MUST pass cleanup: true to stream.finished if dangling listeners are unwanted,
    because it leaves error, end, finish and close listeners attached after settling.'
  design_notes: 'Judge record:

    Positions: pipeline over pipe (RUNTIME-C05; SRC-196); finished with cleanup (RUNTIME-C08;
    SRC-196); early exit semantics (RUNTIME-C07; SRC-196, SRC-197, SRC-204).

    Forces: resource closure on error against the older, shorter pipe call.

    Decision: pipeline; cleanup: true when listeners must not dangle.

    Rejected: pipe(), leaks the destination on source error; no condition named.

    Fact [consensus]: Early exit from for-await over a stream destroys a Node Readable
    or cancels a Web ReadableStream; to keep a Web stream open after break, take values()
    with preventCancel.

