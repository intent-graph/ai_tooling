- uid: PIG-JS.VERIFICATION.LINT.1.4
  name: Type-aware rules
  intent: Rules that need type information run, because the defects they find (a floating
    promise) are invisible to syntax-only rules.
  epistemic_state: 'known | gap: no admitted figure for the cost, see G-L20 | unvalidated:
    rests on single-source claims only'
  constraints:
  - 'MUST enable typed linting (parserOptions.projectService) to get rules that need
    type information, such as no-floating-promises, and budget for its cost: TypeScript
    analyzes the whole project before linting.'
  design_notes: 'Judge record:

    Positions: typed linting through `parserOptions.projectService` for rules such
    as no-floating-promises (QUALITY-C10; SRC-181); cost is a whole-project TypeScript
    analysis before linting. TypeScript 7.0 has no API until 7.1 (TYPES-C44; SRC-034).

    Forces: defects invisible to syntax rules against lint time.

    Decision: enable typed linting in TypeScript projects and budget its time. No
    admitted figure for the cost.

    Rejected: syntax-only linting, because no-floating-promises and similar rules
    need types; it wins where the project has no TypeScript project to analyze or
    where lint time is shown to block the workflow (inferred).

    Fact [single-source]: TypeScript 7.0 ships no programmatic API and a new, different
    API is expected in 7.1, so tools built on the compiler API depend on that release
    (the tool consequence is inferred).

    Sources cited: SRC-034, SRC-181'
  impl_pointers:
