- uid: PIG-JS.RUNTIME.MEASURE.2
  name: Engine-level tuning needs a measurement
  intent: Array element kinds, hidden classes, closure creation and prototype mutation
    are tuned only where a measurement shows the cost; mechanism alone does not justify
    restructuring.
  epistemic_state: 'known | conflict: restructuring on mechanism alone, MDN (SRC-083,
    SRC-088) | unvalidated: single T2 source for the measured statement (SRC-302)'
  constraints:
  - 'MUST NOT rewrite array code to avoid holey arrays for speed without measuring:
    V8 states the holey versus packed difference in real-world code is usually too
    small to matter or even be measurable; restructure for an engine cost only on
    a measurement of the real workload.'
  - 'Acceptable only when a profile shows the creation cost on a hot path: avoiding
    function creation inside functions where no closure is needed (each instance carries
    its own scope and closure); MDN states the cost without a measurement.'
  - 'Acceptable only when a profile shows the cost: setting an object''s prototype
    at creation rather than with setPrototypeOf or __proto__ as a speed motive (later
    changes disrupt engine optimisations and may cause deoptimising recompilation).'
  design_notes: 'Judge record:

    Positions: (a) measurement first; engine tuning only on a measured cost (RUNTIME-C55
    SRC-302 T2, RUNTIME-C63); (b) avoid the engine cost on mechanism, without measuring
    (STRUCT-C42 SRC-083 T1, STRUCT-C43 SRC-088 T1, both MDN, no figures; RUNTIME-C56
    SRC-303 T2 mechanism only).

    Forces: (a) serves measured behaviour, costs one measurement per candidate change;
    (b) cheap to apply, but V8 itself says the holey versus packed gap is usually
    unmeasurable and no T1 specifies engine performance.

    Decision: (a), the max rule for measured behaviour: no engine-level restructuring
    without a measurement of the real workload. (b) is kept as acceptable-when.

    Rejected: (b) on mechanism alone: wins when a profile shows closure creation or
    prototype deoptimisation on a hot path. Holey-array avoidance: wins only under
    a measurement; the belief is restricted in the dissent audit.

    Rejected beliefs: Restructuring code to dodge engine costs (holey arrays, nested
    function creation, prototype mutation) on mechanism alone, with no measurement
    of the real workload: rejected by the measurement-first rule; it wins when a profile
    shows the cost.

    Rejected beliefs: Belief that holey arrays must be avoided for speed (restricted
    in the dissent audit on SRC-302): V8''s own statement is that the difference is
    usually too small to matter; act only on a measurement.

    Fact [single-source]: V8 gives objects built with the same properties in the same
    order a shared hidden class and falls back to slow dictionary properties for frequently
    modified objects; this is mechanism only (2017, no measurements) and yields no
    tuning prescription.

    Sources cited: SRC-083, SRC-088, SRC-302, SRC-303'
