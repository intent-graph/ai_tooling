- uid: PIG-JS.DEFENSE.SECRETS.3
  name: Password storage
  intent: Passwords use Argon2id, else scrypt, bcrypt or PBKDF2 at OWASP minimums.
  epistemic_state: 'known | unvalidated: quote tool-extracted | unvalidated: single
    T1 position | unvalidated: rests on claims marked inferred or open (SRVSEC-C11)'
  constraints:
  - 'MUST store passwords with a slow, salted function at OWASP''s minimums: Argon2id
    (19 MiB, 2 iterations, parallelism 1), else scrypt (N=2^17, r=8, p=1), bcrypt
    (work factor 10 or more, 72-byte limit) for legacy, PBKDF2-HMAC-SHA-256 (600,000
    or more) when FIPS-140 is required; never plain text.'
  design_notes: 'Judge record:

    Password storage

    Positions: Argon2id first, scrypt, bcrypt, PBKDF2 for FIPS (OWASP Password Storage).
    Claims SRVSEC-C10, C11.

    Forces: Brute-force cost against compatibility constraints.

    Decision: Argon2id at 19 MiB, 2 iterations, parallelism 1, with the OWASP fallbacks
    by condition.

    Rejected: bcrypt, scrypt, PBKDF2: acceptable by OWASP''s conditions, FIPS or legacy.

    Fact [single-source]: Inferred fact: Node''s documented scrypt default cost is
    16384 (2^14, from a v10 page read through a digest), below OWASP''s 2^17; set
    cost explicitly. Demoted: the register asks for a verbatim read of the Node crypto
    page, which was not obtained.'
