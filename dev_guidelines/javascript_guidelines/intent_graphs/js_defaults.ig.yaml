- uid: PIG-JS.DEFENSE.PROTOTYPE.1
  name: Key writes and reads
  intent: No nested write with untrusted keys, no unfiltered merge and no __proto__
    accessor; the own-property read for untrusted keys is the rule of PIG-JS.SUBSET.OBJECTS.6.
  epistemic_state: known
  constraints:
  - MUST NOT perform dynamic nested property writes obj[key1][key2] = value with untrusted
    keys; if unavoidable, reject the keys __proto__, constructor and prototype before
    writing.
  - MUST NOT pass untrusted input to a recursive merge, deep clone or set-by-path
    helper that does not filter prototype-reaching keys (lodash before 4.17.12 defaultsDeep,
    CVE-2019-10744, CVSS 9.1, as the fact).
  - MUST avoid the __proto__ accessor in new code; use Object.getPrototypeOf and Object.setPrototypeOf
    (the legacy status rests on MDN, the Annex B text was unreadable).
  design_notes: 'Judge record:

    Key writes and reads

    Positions: Reject prototype keys, own-property reads, avoid __proto__ (MDN, OWASP,
    Node threat model). Claims RUNSEC-C02, C03, C07, C12.

    Forces: Safety against terse dynamic code.

    Decision: No untrusted nested writes or merges, Object.hasOwn, avoid __proto__
    in new code.

    Rejected: hasOwnProperty on the instance: SUBSET owns the choice of Object.hasOwn.'
