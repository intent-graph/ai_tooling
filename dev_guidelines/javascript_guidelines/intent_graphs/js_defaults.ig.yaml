- uid: PIG-JS.DEFENSE.DOM.2.3
  name: URL validation by parsing
  intent: A URL is validated by parsing it and comparing scheme, canonical host and
    effective port with an explicit allowlist, with userinfo and dangerous protocols
    refused, rather than by substring tests.
  epistemic_state: 'known | unvalidated: inferred from DOMSEC-C57, SECGAP2-C70, C71,
    C73 and C74, each step grounded by a claim but the composed rule stated whole
    by no source; parser-differential examples are open (SECGAP2-C75) | unvalidated:
    quote not obtained (DOMSEC-C57)'
  constraints:
  - 'MUST treat URL.canParse as a test of parsability only, not of permission: it
    returns true exactly where the URL constructor would succeed.'
  - MUST allow a destination only by comparing the parsed scheme, canonical host and
    effective port with an explicit allowlist, reject userinfo and ambiguous input,
    never match by raw prefix or suffix, and redirect with the validated URL rather
    than a transformed one.
  - MUST prefer a server-side mapping from a short id or token to the full target
    URL over accepting a URL from the user, and avoid redirects and forwards where
    possible.
  - 'MUST disallow dangerous URL protocols such as javascript: and data: when building
    URLs from untrusted data, and encode the data for its URL context.'
  - MUST use a URL parser that agrees with the consumer of the URL, meaning the redirect
    API and browser URL interpretation, because a validator and a consumer that parse
    differently can be made to disagree (inferred; no admitted source documents specific
    differentials).
  design_notes: 'Judge record:

    URL validation by parsing

    Positions: (a) parse (the parsing rule is owned by INJECTION.6.1), compare parsed
    scheme, canonical host and effective port with an allowlist, reject userinfo,
    refuse javascript: and data:, use a parser that agrees with the consumer (URL
    Standard, OWASP Unvalidated Redirects sheet, ASVS 1.2.2); (b) substring or prefix
    tests; (c) legacy url.parse. Claims DOMSEC-C57, SECGAP2-C70 to C74 (C75 open).

    Forces: One parse, one verdict, against the cost of an allowlist.

    Decision: (a), composed from grounded steps; the former gap on the javascript:
    scheme is closed by C73.

    Rejected: (b): a prefix or suffix test accepts attacker hosts that begin or end
    with an allowed string. (c): see INJECTION.6.1. Specific parser differentials
    stay open (C75).

    Rejected [single-source]: Validating a URL by substring tests: a substring test
    accepts hostile URLs that contain the allowed text; the parsed scheme and origin
    are judged against an allowlist instead.

    Fact [single-source]: Open: parser differential examples for URL validation (specific
    inputs that two parsers read differently) are grounded by no admitted source;
    the rules above are stated without examples.'
