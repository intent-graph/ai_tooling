- uid: PIG-JS.DEFENSE.SECRETS.6
  name: Leakage through output and memory
  intent: Errors reach clients generically, uninitialized Buffers and diagnostic reports
    do not leak, and a secure heap limits shared-host exposure.
  epistemic_state: 'known | unvalidated: rests on claims marked inferred or open (RUNTIME-C52)
    | unvalidated: quote not obtained (RUNTIME-C13, RUNTIME-C15, RUNTIME-C52)'
  constraints:
  - MUST return a generic message to clients on an unexpected or security-sensitive
    error; never expose stack traces, queries, secret keys or tokens in the response
    (ASVS 16.5.1, Level 2).
  - MUST use Buffer.alloc (zero-filled) rather than Buffer.allocUnsafe unless the
    contents are overwritten at once, because allocUnsafe memory can hold sensitive
    data from earlier allocations.
  - MUST NOT use the new Buffer() constructor; use Buffer.alloc or Buffer.from.
  - 'MUST treat diagnostic reports as sensitive: they include environment variables
    and network interfaces unless --report-exclude-env and --report-exclude-network
    are set (the sensitivity rule is inferred).'
  - MUST start Node with --secure-heap=n (not on Windows) and do not run a production
    app on a shared machine, to limit leaks from pointer overruns.
  design_notes: 'Judge record:

    Leakage through output and memory

    Positions: Generic errors, zero-filled buffers, protected reports, secure heap
    (ASVS 16.5.1, Node docs). Claims SRVSEC-C60, C63, RUNTIME-C13, C15, C52.

    Forces: Confidentiality against debuggability.

    Decision: Return generic error text, use Buffer.alloc, treat reports as sensitive,
    use --secure-heap on shared hosts.

    Rejected: Verbose errors to clients: rejected by ASVS.'
  impl_pointers:
