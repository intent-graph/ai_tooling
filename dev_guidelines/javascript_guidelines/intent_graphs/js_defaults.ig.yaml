- uid: PIG-JS.DEFENSE.HOST.3.1
  name: Header field values
  intent: No CR, LF or NUL reaches a header name or value, whether the application
    sets a header or passes a value to a client library; Node's own check is relied
    on and applied before a value is reused.
  epistemic_state: 'known | unvalidated: three rules rest on one source each (SECGAP2-C26,
    C27, C28)'
  constraints:
  - MUST call http.validateHeaderName and http.validateHeaderValue to apply Node's
    header check to any name or value that does not go through response.setHeader.
  - MUST reject any application-supplied string that contains CR, LF or NUL before
    it goes into response.writeEarlyHints or another Node API argument.
  - MUST reject a user-influenced headers.host that contains CR, LF or NUL before
    passing it to undici, and keep undici current (for the built-in fetch, upgrade
    Node).
  - MUST validate input against an accept-known-good list, canonicalize and decode
    it once before validating, and construct HTTP headers carefully from non-validated
    data.
  design_notes: 'Judge record:

    Header field values

    Positions: (a) reject CR, LF and NUL, validate with Node''s validators before
    reuse (setHeader throws on its own), reject application strings bound for other
    APIs (RFC 9110 5.5, Node http page, Node source, Node threat model, undici advisory,
    CWE-113). Claims SECGAP2-C24 to C28 (C23 on the philosophy node); (b) strip or
    replace characters silently.

    Forces: Rejection against repair; the application owns validation (C26).

    Decision: (a); a string is rejected, never repaired.

    Rejected: (b): RFC 9110 allows replacing with a space for a recipient, but a sender
    that repairs hides the injection; wins for a recipient that must tolerate legacy
    clients.

    Fact [single-source]: Fact (Node source, main branch at extraction): the strict
    header-value check rejects every character outside HTAB, 0x20 to 0x7e and 0x80
    to 0xff; the lenient check rejects only NUL, LF, CR and characters above 0xff.

    Fact [-]: Fact (Node http documentation): response.setHeader throws ERR_INVALID_CHAR
    for illegal header names or values; Node''s threat model counts CRLF in a writeEarlyHints
    link value as application misuse, not a Node vulnerability.

