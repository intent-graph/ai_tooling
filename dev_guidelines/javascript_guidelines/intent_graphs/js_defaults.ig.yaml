- uid: PIG-JS.VERIFICATION.LINT.1.3
  name: Strict rule set
  intent: Teams with enough TypeScript proficiency take the stricter set, accepting
    that it changes between minor versions.
  epistemic_state: 'known | unvalidated: rests on single-source claims only'
  constraints:
  - MUST extend typescript-eslint's strict config only if a nontrivial share of the
    developers are highly proficient in TypeScript, and expect its rule set to change
    outside major versions because it is not semver-stable.
  design_notes: 'Judge record:

    Positions: strict only if a nontrivial share of developers is highly proficient,
    set may change outside major versions (QUALITY-C09; SRC-054).

    Forces: stronger checking against onboarding cost and churn in findings.

    Decision: the max practice is the strict set; it is taken when the proficiency
    condition, which the project itself states, holds.

    Rejected: strict for every team, because the project''s own advice denies it;
    it would win once the team meets the condition. Recommended-only stays the floor
    (LINT.1.2).

    Sources cited: SRC-054'
