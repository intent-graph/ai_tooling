- uid: PIG-JS.CONTROL.ERRORS.4
  name: Emitter failures
  intent: An event emitter's error event always has a listener, and rejections of
    async listeners reach it.
  epistemic_state: 'known | unvalidated: single T1 source for captureRejections and
    events.once'
  constraints:
  - 'MUST attach an error listener to every EventEmitter that can emit one (sockets,
    streams, servers): an emitted error event without a listener is thrown and exits
    the process, a denial-of-service vector.'
  - MUST enable captureRejections (or Symbol.for nodejs.rejection) so rejections of
    async listeners reach the error path instead of becoming unhandled rejections.
  - 'MUST NOT await several events.once calls in sequence for events that can fire
    in the same turn: promise continuations run after the emitting stack, so events
    can be missed.'
  design_notes: 'Judge record:

    Positions: listener on every emitter (ASYNC-C23, RUNTIME-C31; SRC-081, SRC-065,
    SRC-078); captureRejections (RUNTIME-C32; SRC-081); sequential events.once (RUNTIME-C33;
    SRC-081).

    Forces: an emitted error without a listener ends the process (also a denial-of-service
    lever).

    Decision: always attach the listener; enable captureRejections; await same-turn
    events together.

    Rejected: no listener, no condition named; sequential events.once for same-turn
    events, loses events.

    Sources cited: SRC-065, SRC-078, SRC-081'
