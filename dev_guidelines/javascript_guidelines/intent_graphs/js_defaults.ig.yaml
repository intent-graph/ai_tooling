- uid: PIG-JS.VERIFICATION.LINT.2.2
  name: Tool failure is not a finding
  intent: A broken configuration is told apart from lint findings in CI, so a broken
    gate is not read as a pass or as code defects.
  epistemic_state: 'known | unvalidated: rests on single-source claims only'
  constraints:
  - MUST treat ESLint exit code 2 as a broken tool or configuration, distinct from
    exit code 1 (lint findings), when scripting CI.
  design_notes: 'Judge record:

    Positions: exit 0 clean, 1 findings, 2 configuration or internal error (QUALITY-C06;
    SRC-165).

    Forces: a broken gate must not read as a pass or as code defects.

    Decision: CI scripts distinguish exit 2 from exit 1 and treat 2 as a broken tool.

    Rejected: any non-zero is one failure, because it hides a broken configuration
    behind a code-defect message; wins only for a throwaway script (inferred).

    Sources cited: SRC-165'
