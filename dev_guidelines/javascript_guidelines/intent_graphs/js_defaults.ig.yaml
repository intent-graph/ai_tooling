- uid: PIG-JS.VERIFICATION.LINT.2.3
  name: Stale suppressions reported
  intent: A suppression that no longer suppresses anything is flagged, so old exceptions
    cannot hide new errors.
  epistemic_state: 'known | unvalidated: rests on single-source claims only'
  constraints:
  - MUST report unused eslint-disable directives (--report-unused-disable-directives,
    or the -severity variant, default warn) so obsolete suppressions cannot hide future
    errors.
  design_notes: 'Judge record:

    Positions: report unused disable directives, flag or severity variant, default
    warn (QUALITY-C07; SRC-165).

    Forces: stale exceptions hiding future errors against noise on first enabling.

    Decision: report unused directives; with LINT.2.1 the default warn binds.

    Rejected: leave them unreported, because obsolete suppressions then hide errors;
    it wins never as a default.

    Sources cited: SRC-165'
