- uid: PIG-JS.CONTROL.PROCESS.4
  name: Shutdown
  intent: A signal listener finishes cleanup and ends the process; servers close gracefully
    before connections are forced.
  epistemic_state: 'known | unvalidated: single T1 source; the must-exit rule is inferred
    | gap: shutdown contract owned by the web-architecture sibling'
  constraints:
  - MUST make a SIGTERM or SIGINT listener finish cleanup and end the process itself,
    because it replaces the default handler (inferred from the default-removal fact;
    the shutdown contract side belongs to the web-architecture sibling).
  - MUST shut an HTTP server down with server.close() (stops accepting; since v19
    closes idle connections), then closeAllConnections() only as a forceful last step
    called after close() to avoid a race.
