- uid: PIG-JS.CONTROL.PROMISES.3
  name: Every promise observed
  intent: 'No promise is dropped, silenced or misread: each is awaited, returned or
    given a rejection handler.'
  epistemic_state: 'known | unvalidated: single T1 rule documentation for the void
    and condition rules (quote tool-extracted)'
  constraints:
  - 'MUST NOT leave a promise floating: await it, return it or attach a rejection
    handler, because an unhandled rejection is a runtime error event.'
  - 'MUST NOT use the void operator to handle a promise: it silences the lint rule
    only, and the rejection stays unhandled.'
  - MUST NOT pass an async function where a void-returning callback is expected (event
    handlers, forEach); its promise is dropped and its rejection unhandled, so catch
    inside the handler.
  - 'MUST NOT use a promise as a condition (if, ternary, logical operators): a Promise
    object is always truthy, so await it first.'
  design_notes: 'Judge record:

    Positions: floating promise (ASYNC-C02; SRC-072, SRC-082, SRC-077); void as handling
    (ASYNC-C03; SRC-072); async function as void callback (ASYNC-C16; SRC-073, SRC-081);
    promise as condition (ASYNC-C17; SRC-073).

    Forces: explicit failure against convenience; each rule closes one way a rejection
    is lost.

    Decision: await, return or handle every promise; void is not handling; catch inside
    handlers; await before testing.

    Rejected: floating promises, void-as-handling, async handlers and promise conditions,
    each no condition named by an admitted source. The rule documents are positions
    of the rule''s holder, not a preference for that tool.

    Sources cited: SRC-072, SRC-073, SRC-077, SRC-081, SRC-082'
