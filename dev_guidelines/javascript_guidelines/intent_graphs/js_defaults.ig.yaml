- uid: PIG-JS.CONTROL.BOUNDS.2
  name: Timeouts
  intent: Waits are bounded by a timeout signal, a cancellable timer or a configured
    server timeout.
  epistemic_state: 'known | unvalidated: single T1 source for timers and server timeouts;
    do-not-disable rule inferred | unvalidated: quote not obtained (RUNTIME-C42)'
  constraints:
  - 'MUST put timeouts on awaited operations with AbortSignal.timeout(ms), which rejects
    with a TimeoutError distinct from a user AbortError; combine a user signal and
    a timeout with AbortSignal.any (MDN: the combined signal cannot say which fired;
    Node sets the reason to the signal that aborted).'
  - MUST prefer timers/promises with a signal option for cancellable waiting in Node,
    and clear or unref timers that must not keep the process alive.
  - 'MUST configure HTTP server timeouts (headersTimeout, requestTimeout, timeout,
    keepAliveTimeout) so slow or idle connections are dropped, and do not disable
    requestTimeout on a server exposed to untrusted clients (documented defaults read
    through a digest: 60000, 300000, 120000 and 5000 ms).'
  design_notes: 'Judge record:

    Positions: AbortSignal.timeout and any (ASYNC-C28; SRC-055, SRC-066, SRC-057);
    timers/promises with signal, unref (ASYNC-C34; SRC-067); server timeouts (ASYNC-C55,
    RUNTIME-C42; SRC-078, SRC-190).

    Forces: bounded waits against slow-client exhaustion; TimeoutError separates timeout
    from user abort.

    Decision: bound every awaited operation; configure server timeouts and never disable
    requestTimeout on an exposed server.

    Rejected: unbounded waits; disabling requestTimeout, no admitted source names
    a condition; the combined AbortSignal.any cannot name the first cause in MDN but
