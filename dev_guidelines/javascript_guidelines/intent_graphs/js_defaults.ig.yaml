- uid: PIG-JS.CONTROL.FLOW.1
  name: Backpressure
  intent: Writers stop when told to stop and resume when told to resume.
  epistemic_state: 'known | unvalidated: single T1 source, mechanism only (restricted),
    for push and data-listener rules'
  constraints:
  - 'MUST respect stream backpressure: stop writing once write() returns false and
    resume on the drain event; never call write() in a loop that ignores its return
    value.'
  - MUST NOT push() from a custom Readable when push() returns false; stop reading
    from the source until asked again.
  - MUST NOT wire a Readable to a Writable with a bare data listener that writes unconditionally;
    use pipe or pipeline.
  design_notes: 'Judge record:

    Positions: stop on write false (RUNTIME-C01; SRC-196, SRC-184); no push when not
    asked (RUNTIME-C02; SRC-184); no bare data listener (RUNTIME-C03; SRC-184).

    Forces: memory bound against code simplicity.

    Decision: obey the return values and use pipe or pipeline.

    Rejected: write loops ignoring the return value; bare data listeners; no condition
    named.

    Sources cited: SRC-184, SRC-196'
