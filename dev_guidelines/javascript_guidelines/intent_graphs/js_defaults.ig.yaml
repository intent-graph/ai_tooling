- uid: PIG-JS.STRUCTURE.SURFACE.3
  name: Read-only exported state
  intent: Never write to an import and export no mutable bindings, so state has one
    owner.
  epistemic_state: 'known | unvalidated: holder position only (Google JS, Google TS,
    Airbnb) for the strongest form (no mutable export); the mechanism is T1'
  constraints:
  - MUST NOT mutate exported variables outside module initialisation and do not export
    mutable bindings (no export let). Holder positions of Google JS, Google TS and
    Airbnb.
  design_notes: 'Judge record:

    Positions: No mutation of exported state and no mutable exports (STRUCT-C01, STRUCT-C03;
    SRC-087, SRC-239, SRC-244, SRC-312) against exported mutable bindings with live
    updates

    Forces: Live bindings let an exporter change what importers see, so state has
    hidden writers

    Decision: No mutable exports; initialise once, change only through functions.
    Re-judged under best (KEEP): the first half is a T1 mechanism (an import is a
    read-only live view); the second is the position of three guides (Google JS, Google
    TS, Airbnb) that agree, and what a mutable export gives, an observable value,
    is available through a function or an exported object at no loss for locality,
    so the strict form costs little; the documented observable exception stays as
    the rejected condition

    Rejected: Mutable live export: wins for a deliberate observable value owned by
    the exporter, if documented

    Fact [consensus]: An import is a read-only live view that only the exporter can
    reassign, so never write to an imported binding; ask the exporting module to change
    it.

    Sources cited: SRC-087, SRC-239, SRC-244, SRC-312'
