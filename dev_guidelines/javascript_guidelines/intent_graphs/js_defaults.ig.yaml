- uid: PIG-JS.RUNTIME.MEMORY.2
  name: Leak signals
  intent: Cheap signals, the emitter listener warning and the GC trace pattern, are
    read before anything is captured.
  epistemic_state: 'known | unvalidated: quote tool-extracted, the advice to justify
    raising the listener limit is inferred | unvalidated: rests on single-source claims
    only | unvalidated: quote not obtained (RUNTIME-C47)'
  constraints:
  - 'MUST read cheap leak signals before capturing anything: treat the EventEmitter
    warning (more than 10 listeners for one event) as a probable leak and raise the
    limit only for a justified fan-out; read --trace-gc output, where many Mark-sweep
    events collecting little suggest a leak (confirmed by lowering --max-old-space-size)
    and time between GCs below time in GC means starvation.'
  design_notes: 'Judge record:

    Positions: (a) read cheap signals first: listener warning, GC trace pattern (RUNTIME-C30
    SRC-081, RUNTIME-C47 SRC-198, both T1); (b) raise the listener limit to silence
    the warning (the position C30 warns against).

    Forces: (a) cheap and often decisive; (b) removes noise and hides a probable leak.

    Decision: (a); raising the limit only for a justified fan-out.

    Rejected: (b): wins when the fan-out is designed and its bound is known.

    Sources cited: SRC-081, SRC-198'
