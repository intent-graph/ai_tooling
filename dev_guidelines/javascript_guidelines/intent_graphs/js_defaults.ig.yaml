- uid: PIG-JS.DEFENSE.ORIGIN.3
  name: Third-party and service worker code
  intent: External scripts are pinned and integrity-checked, a data layer is not mistaken
    for a sandbox, and service workers come only from the own origin.
  epistemic_state: known
  constraints:
  - MUST pin externally hosted scripts and styles to static, versioned files and protect
    them with Subresource Integrity.
  - MUST write SRI as integrity="sha384-..." (sha256, sha384 or sha512; never MD5
    or SHA-1) plus crossorigin, and serve the page over a secure context.
  - 'MUST pin the versions of vendor scripts under SRI: SRI breaks on vendor updates,
    fails without CORS on the vendor host, and protects only content you reviewed.'
  - MUST register service workers only from your own origin, serve the worker script
    over HTTPS, and keep sensitive responses out of the Cache API.
  design_notes: 'Judge record:

    Third-party and service worker code

    Positions: Pin and SRI, separate origin for vendor scripts, own-origin service
    workers (MDN, W3C, OWASP). Claims DOMSEC-C38 to C40, C42, C58.

    Forces: Integrity of third-party code against the convenience of unpinned vendor
    updates.

    Decision: Pin versions with SRI (sha384 or stronger plus crossorigin), do not
    treat a data layer as a sandbox, register service workers from own origin only.

    Rejected: Unpinned third-party scripts: wins nowhere for pages with authority
    over user data.

    Rejected [single-source]: Belief rejected: a tag-manager data layer sandboxes
    third-party tags. A data layer is not a sandbox; container tags can still run
    custom JavaScript and deploy instantly.'
