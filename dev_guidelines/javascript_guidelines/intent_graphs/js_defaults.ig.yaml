    gives stronger guarantees of correctness
  design_notes: 'Judge record:

    Positions: strict on (default since 6.0); selected flags only. Forces: the family
    gives guarantees at an adoption cost on untyped code. Decision: strict on, no
    member turned off. Rejected: selected flags win while migrating an existing code
    base (inferred); typescript-eslint''s own "strict" lint config is a project position
    conditioned on proficiency, not a compiler choice (SRC-054, not evidence).

    Fact [consensus]: Mechanism: without noImplicitAny the compiler silently falls
    back to any where it cannot infer, and errors are missed

