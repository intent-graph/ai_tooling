- uid: PIG-JS.SUBSET.STRICTNESS.1
  name: Strict mode everywhere
  intent: Every file runs in strict mode, so a typo or an unowned receiver raises
    an error instead of creating a global or a hidden default.
  epistemic_state: 'known | unvalidated: practice inferred from MDN''s stated reasons;
    quote tool-extracted | unvalidated: rests on single-source claims only'
  constraints:
  - 'MUST run all code in strict mode: write ES modules or classes, which are strict
    by construction, and add the use strict directive only to classic scripts, because
    strict mode turns silent errors into thrown errors. Strict mode is a variant with
    changed semantics, not only a syntax filter.'
  design_notes: 'Judge record:

    Positions: strict everywhere (LANG-C02, LANG-C01); sloppy mode left on in scripts
    (nobody holds it); use strict per file by hand (LANG-C02 for classic scripts).

    Forces: predictability gains loud failure (LANG-C03); cost is none in modules
    and classes, one directive in scripts.

    Decision: all code strict, via modules or classes, directive only in classic scripts.

    Rejected: sloppy mode in legacy scripts; would win only for code that cannot be
    edited.

    Fact [consensus]: Module code and class bodies are always strict mode code (ECMA-262
    11.2.2), so they need no use strict directive.

    Fact [single-source]: In strict mode assigning to an undeclared identifier throws
    a ReferenceError; in sloppy mode it silently creates a global property, so a typo
    becomes a global variable.'
  impl_pointers:
  - build/research/01_lang/result.md::LANG-C02
