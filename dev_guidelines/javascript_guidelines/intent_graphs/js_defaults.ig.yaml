- uid: PIG-JS.DEFENSE.INJECTION.1.4
  name: Handlebars and EJS
  intent: 'The two template engines with admitted security guidance are used within
    what their own documents state: no unescaped output of untrusted values, no untrusted
    ASTs, no end-user access to EJS, current versions.'
  epistemic_state: 'known | unvalidated: rests on claims marked inferred or open (SECGAP2-C39)'
  constraints:
  - MUST NOT use triple-stash or return SafeString for untrusted values in Handlebars,
    and do not relax prototype-property access or enable allowCallsToHelperMissing.
  - MUST give templates written by users size and depth limits and process isolation,
    since they are untrusted programs for resource consumption.
  - MUST compile only ASTs that Handlebars produced from trusted template source,
    validate that compile arguments are strings, use the runtime-only build when templates
    are precompiled, and run Handlebars 4.7.9 or later.
  - MUST NOT give end users direct access to EJS rendering, templates or render options.
  - MUST run EJS 3.1.7 or later.
  design_notes: 'Judge record:

    Handlebars and EJS

    Positions: engine documents and advisories: Handlebars (security page, CVE-2026-33937),
    EJS (security policy, CVE-2022-29078). Claims SECGAP2-C33 to C37 (C39 open).

    Forces: Exact vendor statements against the lack of guidance for other engines.

    Decision: each statement as a MUST on its engine; version floors as MUST. Engine
    facts about those two engines only.

    Rejected: Extending the rules to Pug, Nunjucks or others: no admitted T1 states
    them (C39); wins when such a source is admitted.

    Fact [single-source]: Open: no admitted T1 states injection rules for template
    engines other than Handlebars and EJS (Pug, Nunjucks and others), so engine-specific
    rules can be given only for those two.

    Fact [-]: Fact (Handlebars and EJS documents): Handlebars escaping covers the
    HTML context only; EJS is effectively a JavaScript runtime, so end-user access
    is misuse and out of scope of its security policy, and its default escape covers
    HTML and quoted attributes only.

    Fact [-]: Fact (advisory, dated evidence): CVE-2022-29078, Critical 9.8, published
    2022-04-26: in EJS below 3.1.7 an attacker-controlled settings[view options][outputFunctionName]
    overwrote the output function name with an OS command executed at template compilation.'
