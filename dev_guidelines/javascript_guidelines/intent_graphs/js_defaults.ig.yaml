- uid: PIG-JS.DEFENSE.SECRETS.2.1
  name: Token and JWT verification
  intent: 'A token is accepted only after the verifier applies its own fixed policy:
    allowed algorithms, trusted pre-configured keys bound to the issuer, audience,
    validity time and type; nothing in the token chooses any of them.'
  epistemic_state: 'known | unvalidated: several MUSTs are strict forms of weaker
    wording (ASVS 9.1.2: ideally only symmetric or asymmetric; OWASP JWT sheet: if
    possible hardcode the algorithm, do not mix), exp is required where tokens grant
    API access (SECGAP2-C07), which is stricter than ASVS 9.2.1 (validity is checked
    if exp is present), and three rules rest on one source each (SECGAP2-C04, C08,
    C15)'
  constraints:
  - MUST verify a JWT against an algorithm allowlist fixed by the caller or by configuration,
    and never let the token's own header choose the verification algorithm.
  - MUST NOT accept an unsecured JWT (alg none); the verifier's allowlist must not
    contain None.
  - MUST take the key material for validating a token from trusted pre-configured
    sources for the issuer, never from a source the token itself names.
  - MUST validate that the keys used for a token belong to its issuer when it carries
    an iss claim, and reject a token whose iss is missing where the deployment relies
    on it.
  - 'MUST validate the audience: accept a token only if the recipient is named in
    aud, and reject it when aud is absent.'
  - MUST accept a token only while the verification time lies inside its validity
    span, and require exp where tokens grant API access.
  - MUST check that a token is of the correct type and meant for the intended purpose
    before accepting its contents.
  - MUST NOT let one verification call accept both symmetric and asymmetric algorithms
    for the same key material; prefer signatures over MACs.
  - MUST NOT use a human-memorizable password directly as the key of a keyed MAC such
    as HS256.
  design_notes: 'Judge record:

    Token and JWT verification

    Positions: (a) the verifier fixes algorithm, key source, issuer, audience, validity
    and type (RFC 8725 3.1, 3.3, 3.8, 3.9; ASVS 9.1.2, 9.1.3, 9.2.1 to 9.2.3; OWASP
    JWT sheets); (b) trust the token''s own alg and key hints. Claims SECGAP2-C01,
    C02, C04 to C09, C15, C17 (C16 deferred).

    Forces: Forgery resistance against the convenience of letting tokens describe
    themselves.

    Decision: (a), every check as a MUST; exp required where tokens grant API access
    (SECGAP2-C07), narrower than the former every-token rule; an unsecured token never;
    one call never accepts both symmetric and asymmetric algorithms for one key.

    Rejected: (b): refuted by the algorithm-confusion and alg-none attacks; wins under
    no grounded condition. Reading RFC 7519 section 8 alone as the algorithm policy:
    it states what libraries implement, not what a consumer accepts.

    Re-judged under best (RELAX, one row): the nine decision rows keep their strength;
    each mirrors a quoted RFC 8725 or ASVS requirement or a stated attack (algorithm
    confusion, alg none) and costs the caller one configuration line. The exception
    is the validity row: require exp on every token went beyond its claim, which scopes
    the requirement to tokens that grant API access, and ASVS 9.2.1 checks validity
    only if present. The rows on key source, token type and the memorizable password
    rest on one source each (SECGAP2-C04, C08, C15) but state RFC or ASVS text; kept,
    flagged.

    Rejected beliefs: a JWT with a valid-looking header can be trusted without a signature
    check (refuted by four sources on algorithm confusion and unsecured tokens).

    Rejected [consensus]: Belief rejected: the JWT specification requires accepting
    alg none. RFC 7519 section 8 makes HS256 and none mandatory to implement for libraries;
    RFC 8725 narrows what a consumer accepts, so a stand-alone read of section 8 does
    not settle algorithm policy.

    Deferred: Revocation and logout are a separate design question: a JWT stays valid
    until it expires, so a denylist of server-issued identifiers or a token status
    list is needed to cut it short. Session architecture is owned by web_architecture.'
