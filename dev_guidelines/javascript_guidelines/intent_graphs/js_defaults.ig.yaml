- uid: PIG-JS.CONTROL.PROMISES.4
  name: Combining and ordering async work
  intent: Independent work runs concurrently, started promises are combined before
    awaiting, and shared state is guarded across suspension points.
  epistemic_state: 'known | unvalidated: single T1 source for the early-rejection
    and stale-read rules (quote tool-extracted) | gap: concurrency limits not covered'
  constraints:
  - MUST NOT await two already-started promises one after the other when the second
    can reject first; combine them with Promise.all or Promise.allSettled before awaiting.
  - 'MUST use Promise.allSettled when every operation must finish: Promise.all rejects
    on the first rejection while the other operations keep running with outcomes unavailable.'
  - MUST run independent asynchronous operations concurrently, not in a sequential
    loop of awaits, unless a later operation depends on an earlier result.
  - 'MUST guard read-modify-write of shared variables across an await or yield: the
    value may have changed while the function was suspended.'
  design_notes: 'Judge record:

    Positions: sequential awaiting of started promises (ASYNC-C08; SRC-056); Promise.all
    against allSettled (ASYNC-C09; SRC-075, SRC-056, SRC-028); concurrent against
    sequential (ASYNC-C10; SRC-056, SRC-246, SRC-075); unguarded read-modify-write
    across await (ASYNC-C54; SRC-060).

    Forces: early rejection reporting and speed against ordering needs.

    Decision: combine started promises first; allSettled when every operation must
    finish; concurrent by default; guard shared state across suspension.

    Rejected: sequential awaiting wins when a later operation depends on an earlier
    result (ASYNC-C10); Promise.all wins when failing fast is wanted and the remaining
    outcomes are not needed (inferred from SRC-075); unguarded state, no condition
    named.

    Rejected beliefs: Rejected belief: Promise.all or Promise.race cancels the losing
    operations; they keep running.

    Sources cited: SRC-028, SRC-056, SRC-060, SRC-075, SRC-246'
