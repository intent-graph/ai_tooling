- uid: PIG-JS.RUNTIME.DIAGNOSE.2
  name: Event loop health in production
  intent: Event loop health is measured in production, not guessed, and each measurement
    observer is removed when done.
  epistemic_state: 'known | unvalidated: C23 no quote recorded, C24 quote tool-extracted
    | unvalidated: rests on single-source claims only | unvalidated: quote not obtained
    (RUNTIME-C23)'
  constraints:
  - MUST measure event-loop health in production with performance.eventLoopUtilization
    and perf_hooks.monitorEventLoopDelay rather than guessing, and disconnect each
    PerformanceObserver as soon as it is no longer needed, since a subscribed observer
    adds overhead.
  design_notes: 'Judge record:

    Positions: (a) measure with eventLoopUtilization and monitorEventLoopDelay, remove
    observers when done (RUNTIME-C23, C24, SRC-194 T1); (b) implicit: infer blocking
    from response times or from reading code.

    Forces: (a) direct measure of the event loop at low, bounded overhead; (b) no
    instrumentation, guesses.

    Decision: (a), grounded by the scheduling mechanism (RUNTIME-C19, SRC-080 mechanism
    only).

    Rejected: (b): wins never as evidence; it is only the trigger for taking the measurement.

    Fact [single-source]: Know how work is scheduled before diagnosing blocking: callbacks
    run on one event loop while a pool of k workers runs blocking I/O and CPU-heavy
    core operations (fs, dns.lookup, async crypto, async zlib); mechanism only, the
    offloading advice of SRC-080 is excluded by its restriction.

    Sources cited: SRC-080, SRC-194'
