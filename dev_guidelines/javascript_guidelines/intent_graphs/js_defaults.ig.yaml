- uid: PIG-JS.DEFENSE.INJECTION.1.1
  name: Strings as code
  intent: Untrusted strings never reach eval, Function or string timers; JSON.parse
    replaces eval for data.
  epistemic_state: 'known | unvalidated: quote not obtained (ASYNC-C33)'
  constraints:
  - MUST NOT pass untrusted strings to eval, the Function constructors, or the string
    form of setTimeout and setInterval; pass a function, not a string, to timers.
  - MUST parse data with JSON.parse, never eval; replace eval with bracket property
    access, callbacks or functions instead of string code.
  - MUST enforce the no-code-from-strings rule statically with the no-eval, no-implied-eval
    and no-new-func lint rules (rule names from the OWASP sheet; the ESLint rule pages
    are not in the register).
  - 'Acceptable only when dynamic evaluation is unavoidable: indirect eval with a
    "use strict" prefix, which reduces scope exposure and blocks no injection.'
  - 'Acceptable only when the code is a code loader: eval and Function(string) (Google''s
    JavaScript guide forbids them except there; a position of one style guide, not
    evidence).'
  design_notes: 'Judge record:

    Strings as code

    Positions: No code from strings (MDN, OWASP, CSP3, Synode study) against Google''s
    code-loader exception and indirect eval as mitigation. Claims DOMSEC-C03, ASYNC-C33,
    RUNSEC-C15 to C18, LANG-C49.

    Forces: Safety against the few legitimate dynamic-evaluation uses.

    Decision: Never evaluate untrusted strings, JSON.parse for data, enforce no-eval,
    no-implied-eval and no-new-func.

    Rejected: Google''s code-loader exception: wins for loaders the application itself
    writes. Indirect strict eval: only when evaluation is unavoidable, cuts scope
    exposure not injection.

    Rejected [consensus]: Belief rejected: new Function is a safe alternative to eval.
    It is also an injection sink and differs only in running in global scope.'
