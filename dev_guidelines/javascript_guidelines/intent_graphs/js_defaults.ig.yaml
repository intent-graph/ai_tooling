- uid: PIG-JS.SUBSET.CONVERSION.6
  name: Nullish defaults and chains
  intent: A default replaces only absence, and optional chaining is used within its
    syntactic limits.
  epistemic_state: 'known | unvalidated: quote tool-extracted | unvalidated: rests
    on single-source claims only'
  constraints:
  - 'MUST use ?? instead of the logical OR operator to supply a default whenever 0,
    the empty string, NaN or false are valid values: ?? falls back only for null and
    undefined.'
  - 'Acceptable only when all of 0, the empty string, NaN and false are invalid values:
    the logical OR operator as the default supplier; belief that it is the safe default
    is restricted to that condition (MDN nullish coalescing).'
  design_notes: 'Judge record:

    Positions: ?? for defaults (LANG-C50); logical OR for defaults (folklore).

    Forces: falsy-but-valid values (0, empty string, false) versus brevity.

    Decision: ?? whenever any falsy value is valid; parenthesise any mix (LANG-C51).

    Rejected: logical OR default; wins only if all falsy values are invalid.

    Fact [single-source]: Parenthesise when combining ?? with && or the logical OR
    operator: the unparenthesised mix is a SyntaxError.

    Fact [single-source]: Optional chaining returns undefined on a nullish operand,
    cannot be an assignment target, and does not guard an undeclared variable (ReferenceError).'
