- uid: PIG-JS.CONTROL.PROCESS.2
  name: Uncaught exceptions
  intent: Node's uncaughtException hook is used only for synchronous cleanup before
    the process ends, and uncaughtExceptionMonitor only to log; the end-and-restart
    contract itself is CONTROL.LIFECYCLE.
  epistemic_state: 'known | unvalidated: single T1 source (quote tool-extracted)'
  constraints:
  - 'MUST treat the unhandledRejection and uncaughtException hooks as last-resort
    reporting points, never as a way to carry on: after an uncaught exception the
    application state is undefined and resuming is unsafe, so use uncaughtException
    only for synchronous cleanup before exiting and let an external supervisor restart
    the process.LIFECYCLE holds as intent.'
  - 'MUST use uncaughtExceptionMonitor to log crashes without changing behaviour:
    it does not stop the process from crashing.'
  design_notes: 'Judge record:

    Positions: sync cleanup then exit, supervisor restarts (RUNTIME-C37; SRC-082);
    monitor only logs (RUNTIME-C38; SRC-082); resume (rejected).

    Forces: undefined state against availability.

    Decision: exit after synchronous cleanup, restart from outside; log with the monitor.

    Rejected: resuming after uncaughtException, Node docs: not safe; no condition
    named.

    Sources cited: SRC-082'
