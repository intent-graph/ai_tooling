- uid: PIG-JS.RUNTIME.MEASURE.1
  name: Profile before optimizing
  intent: The cost is located with the V8 profiler on the running application before
    any code is changed.
  epistemic_state: 'known | unvalidated: quote tool-extracted; the rule is inferred
    from the docs workflow | unvalidated: rests on single-source claims only'
  constraints:
  - 'MUST profile before optimizing: locate the cost with the V8 tick profiler (--prof,
    processed with --prof-process) before changing code; the Node.js docs example
    of a synchronous PBKDF2 dominating CPU time illustrates the workflow, its throughput
    figures are illustration only (Node version unstated), not evidence.'
  design_notes: 'Judge record:

    Positions: (a) profile the running application first, then change code (RUNTIME-C20,
    SRC-195 T1); (b) implicit: change code from reading it.

    Forces: (a) predictability of the outcome, cost of one profiling run; (b) no setup
    cost, risk of fixing the wrong place.

    Decision: (a). The docs example shows the wrong place: the hot spot was a synchronous
    hash, not the code that looked slow. Figures are illustration only.

    Rejected: (b): wins when the change is not a speed or memory change, for example
    a correctness fix.

    Sources cited: SRC-195'
