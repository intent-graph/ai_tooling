- uid: PIG-JS.DEPENDENCIES.INSTALL.1
  name: Frozen install
  intent: CI and production install exactly the committed lockfile and fail on any
    mismatch.
  epistemic_state: known
  constraints:
  - 'MUST install in CI and production with npm ci (or the manager''s frozen-lockfile
    equivalent), never npm install: it requires a lockfile, fails when lock and manifest
    disagree, removes node_modules first and never writes either file.'
  design_notes: 'Judge record:

    Positions: (a) npm install resolving from the manifest (the common default); (b)
    npm ci or the manager''s frozen-lockfile equivalent: SUPPLY-C04 (SRC-150, SRC-078,
    SRC-154, SRC-155, consensus), QUALITY-C42 (SRC-173, re-read from the v12 page).

    Forces: Trust wants the tree that was reviewed to be the tree installed; (a) costs
    convenience of silent lockfile refresh, (b) costs one explicit update step.

    Decision: (b) in CI and production, with a lockfile required; the lockfile is
    committed (DEPENDENCIES.CHANGE.1). Grounds: four T1 sources agree; the the dissent
    audit folklore audit confirms ''commit the lockfile and install with npm ci''.

    Rejected: (a): would win only in the deliberate update step that regenerates the
    lockfile, never in CI or production.

    Sources cited: SRC-078, SRC-150, SRC-154, SRC-155, SRC-173'
