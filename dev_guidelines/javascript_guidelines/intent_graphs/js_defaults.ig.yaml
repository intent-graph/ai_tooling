- uid: PIG-JS.DEPENDENCIES.SCREEN.3
  name: Typosquatting screening
  intent: A package name is checked against well-known names before adoption, so that
    a look-alike package is not installed by mistake.
  epistemic_state: 'undecided | missing: no admitted T1 source states a screening
    procedure for adding a dependency; the screening methods rest on one T3 paper
    and one T3 preprint'
  design_notes: 'Fact [single-source]: Fact (npm documentation): the registry states
    that it detects typosquat attacks and blocks the publishing of such packages,
    and encourages scoped packages so a private package is not substituted from the
    public registry; the same page says it cannot detect dependency confusion directly.

    Fact [single-source]: Fact (T3 preprint, venue unconfirmed): one published screening
    method flags a package whose name is lexically close to a popular package while
    its own popularity is below a threshold, and reported warnings on about 0.5 percent
    of installs with 2.5 percent time overhead; no claim that a tool should be used.

    Fact [single-source]: Fact (T3 preprint, venue unconfirmed): name similarity alone
    is not enough, since package confusion includes names that resemble the original
    semantically as well as syntactically; one metadata-based detector cut false positives
    from 80 to 28 percent at 14 seconds of added analysis.

    Fact [single-source]: Open: no admitted T1 states a typosquatting screening procedure
    for adding a dependency; the T1 sources give registry facts and repository provenance
    only, and the screening methods rest on one T3 paper and one T3 preprint.'
