- uid: PIG-JS.DEFENSE.INJECTION.2
  name: OS commands
  intent: A child process receives a program and an argument array, never a shell
    string built from input.
  epistemic_state: 'known | unvalidated: the stronger form (no shell string from input,
    sanitized or not) is inferred from OWASP''s parameterization principle; Node''s
    own sentence states only the unsanitized case'
  constraints:
  - 'MUST NOT build a shell command string from untrusted input, sanitized or not:
    pass the program and an argument array, never pass untrusted input to child_process.exec
    or execSync, and do not enable the shell option of spawn, execFile and their sync
    forms with untrusted input.'
  - MUST prefer spawn or execFile with an argument array to exec when running a single
    program, so arguments are never parsed by a shell.
  design_notes: 'Judge record:

    OS commands

    Positions: spawn or execFile with an argument array against exec with a sanitized
    string (Node docs, OWASP, Synode). Claims RUNSEC-C23, C24.

    Forces: Safety against convenience of shell strings.

    Decision: Argument array, no shell string built from untrusted input (sanitized
    or not), no shell option with input; prefer built-in library functions. The sanitized-exec
    exclusion is stronger than Node''s sentence and rests on OWASP''s parameterization
    principle (inferred).

    Rejected: exec with escaped input: refused, because sanitizing does not remove
    the shell parse; where a shell feature is truly needed, an allowlist of the executable
    and arguments and least privilege apply.'
