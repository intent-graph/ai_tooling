- uid: PIG-JS.SUBSET.EVOLUTION.5
  name: Statement termination
  intent: Every statement is terminated explicitly and every control structure is
    braced, so no statement boundary or scope is left to automatic insertion or indentation.
  epistemic_state: 'known | unvalidated: holder position only (Google JS); insertion
    hazards not extracted'
  constraints:
  - MUST terminate every statement with a semicolon and put braces on every control
    structure; never rely on automatic semicolon insertion. Ground is one style-guide
    position (Google JS); no admitted source documents the insertion hazards.
  - 'Acceptable only when a formatter and lint rules that catch insertion hazards
    both run in CI and the team adopts a no-semicolon style: reliance on automatic
    semicolon insertion (inferred; no admitted source states the hazards or the style).'
  design_notes: 'Judge record:

    Positions: explicit semicolons and braces, no reliance on automatic insertion
    (QUALITY-C19, Google JS, position only); reliance on insertion with a formatter
    and lint (no holder in the claim base).

    Forces: explicit termination makes statement boundaries independent of the next
    token and of line breaks, the predictability purpose; cost is typing, which a
    formatter removes.

    Decision: semicolon on every statement, braces on every control structure.

    Rejected: reliance on automatic insertion; would win where a formatter and hazard-catching
    lint rules both run in CI and the team adopts that style. No admitted source documents
    the hazards (not extracted: grounds are one position, flagged for review.

    Re-judged under best (KEEP): one holder (Google JS) and no hazard extracted. The
    two styles are equal in predictability when a formatter and a hazard-catching
    lint rule both run, and the guideline mandates a formatter and a lint gate (VERIFICATION);
    the semicolon is then free, since the formatter writes it, and works without either
    tool. Braces cost two characters and make a later edit safe (inferred); a formatter
    does not insert them, so they need a lint rule. Kept, flagged as a holder position;
    the no-semicolon style is best where the team has chosen it together with that
    tooling (the acceptable-when row).'
