- uid: PIG-JS.CONTROL.PROMISES.6
  name: Async functions over then chains
  intent: Asynchronous code is written with async functions and await by default,
    so failure travels one visible path; explicit chains remain where kept flat.
  epistemic_state: 'known | unvalidated: single T2 source, V8 team position of 2018
    (restricted to history, dated); chain exception inferred from the MDN position'
  constraints:
  - 'MUST prefer async functions and await over hand-written promise chains: the V8
    team advised this in 2018 after cutting await to one microtask tick for native
    promises (V8 7.2); a dated position of one holder, no admitted current measurement.'
  design_notes: 'Judge record:

    Positions: async functions and await over hand-written promise code (ASYNC-C52;
    SRC-249, V8 team, 2018, dated position); flat then chains, nested only to confine
    a catch (ASYNC-C15; SRC-075, MDN editorial position); async functions turn every
    uncaught exception into a rejection (ASYNC-C07; SRC-056, SRC-245, SRC-075); await
    is slower than chains (folklore).

    Forces: explicit failure: one syntax in which a thrown error and a rejection both
    leave through the function''s promise and try/catch (inferred from ASYNC-C07)
    against the new traps of await (ASYNC-C08, C10, C54, handled by PROMISES.4); speed,
    no admitted current measurement.

    Decision: async functions and await by default; chains are acceptable when kept
    flat (inferred from ASYNC-C15). Maximum demanded here is the only direction any
    admitted position takes.

    Rejected: hand-written chains as the default, wins when a flat chain is the whole
    function body or nesting must confine a catch (MDN position, inferred); the slower-await
    belief, refuted for 2018 only (SRC-249, history), a present-day gap would win
    only if an admitted current measurement showed one (open).

    Rejected beliefs: Rejected belief: async/await is slower than promise chains.
    The old three-tick cost is obsolete since V8 7.2 (history only; the present-day
    gap is open).

    Sources cited: SRC-056, SRC-075, SRC-245, SRC-249'
