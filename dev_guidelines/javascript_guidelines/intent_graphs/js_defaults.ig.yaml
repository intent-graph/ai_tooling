- uid: PIG-JS.DEPENDENCIES.UPDATE.2
  name: Supported runtime and toolchain
  intent: Production runs on versions that still receive security fixes, and the toolchain
    is pinned to what the framework supports.
  epistemic_state: 'known | unvalidated: rests on single-source claims only'
  constraints:
  - MUST run production Node.js on an Active or Maintenance LTS only.
  - MUST pin the toolchain (TypeScript and Node versions) to the compatibility table
    of the framework version in use, and lock the current minor where typings may
    change in minor releases.
  design_notes: 'Judge record:

    Positions: Runtime: (a) any Node release; (b) Active or Maintenance LTS only:
    TYPES-C45 (SRC-037); (c) Active LTS only (more demanding, no source). Toolchain:
    (d) float TypeScript and Node; (e) pin to the framework''s compatibility table:
    FW-C24 (SRC-207, Angular 22) and FW-C26 (SRC-231, Vue typings may change in minors).

    Forces: Security fixes reach only supported lines; frameworks couple to narrow
    TypeScript ranges; the cost is staying inside the table.

    Decision: (b) and (e). (c) is more demanding but no admitted source says Maintenance
    LTS is insufficient. Two framework sources, independent, support (e).

    Rejected: (a) Current in production: wins under no grounded condition (SRC-037
    labels Current non-LTS). (c): would win if a T1 source states that Maintenance
    LTS stops receiving fixes that matter. (d): wins only for a framework that publishes
    no compatibility table (none in the register).

    Fact [single-source]: Dated evidence at reading: Node v24 and v22 were LTS and
    v26 was Current; recheck against the release schedule.

    Fact [single-source]: Dated evidence: Angular 22 lists TypeScript >=6.0.0 <6.1.0
    with Node ^22.22.3, ^24.15.0 or ^26.0.0; Vue typings may change in minor releases.

    Sources cited: SRC-037, SRC-207, SRC-231'
