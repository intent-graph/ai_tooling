- uid: PIG-JS.CONTRACTS.ESCAPE.6
  name: No silent suppression directives
  intent: Type errors are fixed and never silenced by a silent directive; a suppression
    that reports when it becomes unnecessary is allowed only with a comment saying
    why
  epistemic_state: 'known | unvalidated: holder position only (Google TS, which bans
    all three), single T2 source; the allowed form of ts-expect-error is inferred
    and the recommended setting of ban-ts-comment is not extracted | conflict: Google
    TS guide bans ts-expect-error too (one T2 holder)'
  constraints:
  - MUST NOT suppress type errors with ts-ignore or ts-nocheck; allow ts-expect-error
    only with a description that says why, and give every legitimate lint suppression
    (for example any in a test mock) a comment documenting why; enforce it with the
    typescript-eslint rule ban-ts-comment at its recommended setting, which bans ts-ignore
    and ts-nocheck and allows ts-expect-error with a description (the setting is stated
    in the build's earlier text and in no extracted claim, open). Google TS guide,
    one T2 holder, bans all three.
  design_notes: 'Judge record:

    Positions: ban all three directives (Google TS guide); allow with a reason (no
    admitted holder; the handbook documents the directives). Forces: a ban forces
    the real fix; a directive is the only exit for a third-party typing bug (inferred).
    Decision: ban ts-ignore and ts-nocheck; ts-expect-error only with a description
    saying why; lint suppressions with a documented reason. Rejected: banning ts-expect-error
    too (Google TS guide, one T2 holder) wins where a team writes no type-level tests
    and wants zero directives (inferred condition); ts-ignore and ts-nocheck stay
    banned because they are silent (inferred). Scoping: the register restriction on
    SRC-244 is per slot; it is unrestricted for the quality slot, so QUALITY-C18 may
    ground the rule, and TYPES-C25 (types slot, position only) is kept as a fact row.
    Weakness: one T2 holder. Re-judged under best (RELAX): one T2 holder bans all
    three and no admitted source ranks them. They differ in what they hide: ts-nocheck
    switches off a whole file and ts-ignore hides an error with no later signal, while
    ts-expect-error reports when the suppressed line stops failing, so it cannot outlive
    its cause (inferred; the behaviour is TypeScript''s own and is not extracted as
    a claim, open: read it from the handbook). Banning ts-expect-error also removes
    the means of testing that a type rejects a value (inferred). Best for checkability:
    ban the two silent ones, allow the self-checking one with a stated reason. That
    is typescript-eslint''s recommended setting of ban-ts-comment as the build earlier
    described it (not extracted, open), so no override of the recommended set remains.

    Fact [single-source]: Same position restated in the types slot: Google holds that
    the three directives must not be used because an error usually has a larger cause
    better fixed directly; position only, the handbook documents them as suppression
    comments

    Sources cited: SRC-244'
