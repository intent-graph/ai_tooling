- uid: PIG-JS.CONTROL.SCHEDULING.3
  name: Workers
  intent: CPU-bound work moves to a few workers whose messages, failures and resources
    are explicit.
  epistemic_state: 'known | unvalidated: single T1 source for sparing use and resource
    limits | unvalidated: quote not obtained (ASYNC-C46)'
  constraints:
  - 'MUST use workers for CPU-intensive JavaScript, not for I/O: built-in asynchronous
    I/O is more efficient than workers can be.'
  - 'MUST use workers sparingly: the HTML Standard calls them relatively heavy-weight,
    with high startup cost and per-instance memory, not intended for large numbers.'
  - MUST transfer large buffers through the transfer list (the sender loses them)
    or share memory with SharedArrayBuffer, because thread messages are copied by
    structured clone; expect no DOM access in browser workers.
  - 'MUST handle both the error and exit events of a Worker (onerror and messageerror
    in browsers): an uncaught exception terminates the worker and surfaces only as
    events.'
  - MUST cap worker resources with resourceLimits where untrusted input drives the
    work; reaching a limit terminates the worker.
  design_notes: 'Judge record:

    Positions: workers for CPU only (ASYNC-C43; SRC-069, SRC-076); few workers (ASYNC-C44;
    SRC-063); clone or transfer (ASYNC-C45; SRC-069, SRC-076, SRC-063); handle error
    and exit (ASYNC-C46; SRC-069, SRC-063, SRC-076); resourceLimits (ASYNC-C47; SRC-069).

    Forces: CPU parallelism against startup and memory cost.

    Decision: CPU work only, sparingly, explicit transfer, both failure events handled,
    limits where untrusted input drives work.

    Rejected: workers for I/O, built-in async I/O is more efficient; many workers,
    heavy-weight (HTML Standard); no condition named for either.

    Sources cited: SRC-063, SRC-069, SRC-076'
