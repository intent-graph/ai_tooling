- uid: PIG-JS.SUBSET.MUTATION.1
  name: Shallow freeze
  intent: Freezing is relied on for one level only and only in strict code; deeper
    immutability is designed in.
  epistemic_state: known
  constraints:
  - 'MUST treat Object.freeze as shallow: nested objects stay mutable, so deep immutability
    needs recursive freezing (acyclic graphs only) or an immutable data design.'
  design_notes: 'Judge record:

    Positions: freeze is shallow (LANG-C38, C39); freeze as deep immutability (folklore).

    Forces: SetIntegrityLevel touches own keys only; strict-only throwing.

    Decision: rely on freeze for one level and in strict code; deep immutability by
    recursive freeze on acyclic graphs or an immutable design.

    Rejected: freeze as deep guarantee; wins never.

    Rejected beliefs: Object.freeze makes an object, or nested data, deeply immutable.
    SetIntegrityLevel touches own keys only (ECMA-262 7.3.15; MDN; folklore audit,
    refuted).

    Fact [consensus]: A write to a frozen object throws TypeError in strict code and
    is silently ignored in sloppy code, so freezing protects only code that runs strict.'
