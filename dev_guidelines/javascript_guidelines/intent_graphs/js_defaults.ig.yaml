- uid: PIG-JS.SUBSET.OBJECTS.3
  name: Language-enforced privacy
  intent: Private means unreachable from outside, by a mechanism the language enforces.
  epistemic_state: 'known | conflict: Google TS guide (TypeScript private, not hash
    fields), Google JS guide (optional trailing underscore), Airbnb (no underscores)
    | unvalidated: a rule has no claim of its own, it is the build''s judgment'
  constraints:
  - 'MUST mark private members with hash private fields wherever privacy must hold:
    access from outside is a SyntaxError and there is no reflective backdoor; never
    an underscore, which is a public property.'
  - 'Acceptable only when the build down-levels hash fields and the emit-size and
    performance cost is measured: TypeScript private instead (Google TS guide position
    with its stated reason); applies per compile target, never to native ES2022 output.'
  design_notes: 'Judge record:

    Positions: hash private fields (MDN, TC39); trailing underscore (Google JS); no
    underscores, they are public API (Airbnb); TypeScript private, no hash fields
    (Google TS).

    Forces: runtime-enforced privacy versus convention and emit-size cost on down-levelled
    output; the mechanism is undisputed.

    Decision: hash private fields wherever privacy must hold; an underscore never
    counts as privacy.

    Rejected: TypeScript private; wins on down-levelled targets where the emit cost
    is measured. Underscore convention; wins never as privacy.

    Re-judged under best (KEEP): already the best for its purpose and not the strictest:
    it applies only wherever privacy must hold, rests on consensus mechanism facts
    (MDN, TC39), and the one dissent (Google TS) is a compile-target cost carried
    as acceptable-when. Nothing to relax.

    Rejected [consensus]: Belief rejected: a leading underscore keeps a member private.
    Underscore names are ordinary public properties; WeakMap and closure emulations
    cannot match hash fields (MDN; folklore audit, refuted).

    Fact [consensus]: Hash private elements are enforced by the language: subclasses
    and outside code cannot reach them, and they cannot be proxied, enumerated, deleted,
    cloned by structuredClone, or affected by freeze and seal.'
  impl_pointers:
  - build/research/01_lang/result.md::LANG-C11
  - build/research/01_lang/result.md::LANG-C12
