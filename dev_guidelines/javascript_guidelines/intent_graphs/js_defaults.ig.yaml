- uid: PIG-JS.RUNTIME.METHOD.1
  name: Compare runs statistically
  intent: Comparisons use many runs and a significance test, with a stricter threshold
    when many comparisons are made.
  epistemic_state: 'known | unvalidated: Node figures single T2 source, JavaScript
    transfer of the principle inferred'
  constraints:
  - 'MUST compare benchmark results from many runs with a significance test, not single
    timings (Node core''s harness: 30 runs by default, unpaired Welch t-test, 5% false-positive
    risk per comparison); when comparing many benchmarks require at least two stars,
    since among 20 comparisons one shows significance by chance.'
  design_notes: 'Judge record:

    Positions: (a) many runs, significance test, two stars across many comparisons
    (RUNTIME-C58 SRC-304, SRC-307, SRC-305, three T2; RUNTIME-C59 SRC-304); (b) implicit:
    single timings.

    Forces: (a) serves trust in a reported difference, costs runs; (b) fast, cannot
    separate signal from noise.

    Decision: (a), with Node core''s figures (30 runs, Welch t-test) as the concrete
    instance; the transfer of the principle from Java and C is inferred.

    Rejected: (b): wins when the difference is orders of magnitude and a single run
    cannot plausibly be noise (not sourced, so recorded only as the condition).

    Sources cited: SRC-304, SRC-305, SRC-307'
