- uid: PIG-JS.RUNTIME.MEMORY.6
  name: Heap limit and the collector
  intent: The heap limit is read from the runtime and changed only for a measured
    need, and the collector is left to run itself.
  epistemic_state: 'known | unvalidated: the measured-need rule is inferred; no quote
    recorded for the limit statement | unvalidated: quote not obtained (RUNTIME-C48)'
  constraints:
  - MUST read the real limit from v8.getHeapStatistics().heap_size_limit and adjust
    old space with --max-old-space-size (MiB) only for a measured need; the docs state
    no container or cgroup behaviour for the default limit.
  design_notes: 'Judge record:

    Positions: (a) read heap_size_limit, change --max-old-space-size only for a measured
    need (RUNTIME-C48 SRC-199, SRC-202, SRC-079 T1); (b) call global.gc() as a leak
    remedy (RUNTIME-C49 SRC-199 T1, rejected there); (c) hand-tune around GC behaviour
    (RUNTIME-C54 SRC-301 T2: marking is concurrent since Node 10).

    Forces: (a) avoids unmeasured limits; (b) can hurt performance and does not fix
    retention; (c) the engine already does the work.

    Decision: (a), no manual collection.

    Rejected: (b) wins never as a leak remedy. (c) wins when a GC trace shows starvation
    (time between GCs below time in GC) and a measurement ties it to the setting.

    Rejected [single-source]: Using global.gc() (--expose-gc) as a leak remedy: rejected,
    manual collection does not disable normal GC and overuse can hurt performance.

    Fact [single-source]: Since Node.js v10 V8 marks live objects concurrently while
    JavaScript runs; the V8 team measured a 65% and 70% cut in main-thread marking
    time per cycle (mobile and desktop, 2018 workloads).

    Sources cited: SRC-079, SRC-199, SRC-202, SRC-301'
