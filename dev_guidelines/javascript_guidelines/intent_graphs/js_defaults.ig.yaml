- uid: PIG-JS.CONTROL.PROMISES.2
  name: Constructing promises
  intent: Promises are constructed only when no promise exists yet, and every constructed
    promise settles once on every path.
  epistemic_state: 'known | unvalidated: single T1 rule document for the executor
    rule (quote tool-extracted); T2 papers sharing a co-author for the others'
  constraints:
  - 'MUST NOT pass an async function as the executor of new Promise: an error thrown
    in it is lost and does not reject the new promise.'
  - MUST NOT wrap an existing promise in new Promise; return it so rejections keep
    flowing, and use util.promisify for error-first callbacks (the two supporting
    papers share a co-author).
  - 'MUST make every constructed promise settle on every code path and exactly once:
    reactions of a never-settled promise never run, and a second resolve has no effect.'
  design_notes: 'Judge record:

    Positions: async executor in new Promise (ASYNC-C11; SRC-059); wrapping an existing
    promise or hand-written promisification (ASYNC-C12; SRC-245, SRC-246); promise
    that may never settle or settle twice (ASYNC-C13; SRC-245).

    Forces: rejections must not be lost; one settlement per promise.

    Decision: no async executor; return the existing promise and use util.promisify;
    settle exactly once on every path.

    Rejected: async executor, drops the thrown error, no admitted source names a condition;
    wrapper pattern, drops inner rejections, no condition named; hand-written promisification,
    no condition named.

    Sources cited: SRC-059, SRC-245, SRC-246'
