- uid: PIG-JS.DEFENSE.INJECTION.1.3
  name: Template injection
  intent: 'A template is code: untrusted input never becomes template source, and
    user-supplied expression content is sanitized or off.'
  epistemic_state: 'known | unvalidated: the acceptable-when row rests on one T3 source
    (the author''s position)'
  constraints:
  - MUST NOT build a template from untrusted input; where there is no alternative,
    sanitize or strictly validate whatever untrusted input enters template creation.
  - MUST sanitize or disable user-supplied scriptable or expression template-language
    content such as Markdown, CSS or XSL stylesheets, and BBCode.
  - 'Acceptable only when user-supplied templates cannot be avoided: use a trivial
    template engine such as Mustache and sandbox the engine in a locked-down container
    as a complementary measure (the author''s position at T3; the Handlebars guide
    names isolation and allowlisted helpers instead).'
  design_notes: 'Judge record:

    Template injection

    Positions: (a) never build a template from untrusted input; (b) allow user templates
    in a trivial engine inside a sandbox (Kettle, T3); (c) isolation and allowlisted
    helpers (Handlebars guide). Claims SECGAP2-C30, C32, C38 (C31 on the philosophy
    node).

    Forces: Removal of the code-execution class against products that let users write
    templates.

    Decision: (a) as the MUST; (b) kept as acceptable-when user templates cannot be
    avoided, flagged as one T3 position that concedes execution may happen.

    Rejected: (b) as the rule: it accepts code execution and rests on one T3 author;
    wins when the product requires user-written templates. (c): kept as the Handlebars-specific
    rule of the next node.'
