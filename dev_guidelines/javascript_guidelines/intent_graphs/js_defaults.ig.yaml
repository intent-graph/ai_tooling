- uid: PIG-JS.STRUCTURE.SURFACE.1
  name: Named exports
  intent: Export by name only, so every importer uses the exporter's name.
  epistemic_state: 'known | conflict: default export for single-export modules, Airbnb
    | unvalidated: holder position only (Google JS, Google TS)'
  constraints:
  - 'MUST use named exports in all code and no default exports: a default export has
    no canonical name, each importer picks its own, and it encourages one namespacing
    object. Holder position of Google JS and Google TS; acceptable-when a default
    is needed to interoperate with CommonJS or AMD consumers.'
  design_notes: 'Judge record:

    Positions: Named only (STRUCT-C24; SRC-239, SRC-244) against default for single-export
    modules (SRC-312) and MDN''s neutral interop note (SRC-029)

    Forces: A default export has no canonical name, so renames cannot be found mechanically

    Decision: Named exports only. Re-judged under best (KEEP): the cause is a language
    fact (an importer picks any name for a default export, so a rename cannot be found
    mechanically), two guides give it as their reason, and the exception is already
    conditional (a tool or framework that mandates a default, CommonJS or AMD interop);
    the one dissent (Airbnb) carries no reason in the claim. Not stricter than its
    purpose needs

    Rejected: Default: wins when a framework or tool mandates a default export, or
    for CommonJS and AMD interop (the purpose MDN names)

    Sources cited: SRC-029, SRC-239, SRC-244, SRC-312'
