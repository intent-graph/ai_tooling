- uid: PIG-JS.CONTROL.SCHEDULING.2
  name: Event-loop blocking
  intent: Callback cost stays bounded by input size and synchronous blockers stay
    off the server's event loop.
  epistemic_state: 'known | unvalidated: single T1 source, mechanism only (restricted);
    the concrete API list is not admitted | unvalidated: rests on claims marked inferred
    or open (ASYNC-C41)'
  constraints:
  - 'MUST keep per-callback cost bounded relative to input size, JSON.parse and JSON.stringify
    included: they are linear but can take surprisingly long on large input.'
  - MUST treat synchronous core APIs (crypto, compression, file system, child process)
    as event-loop blockers in a server, because they run on the event-loop thread
    (inferred from the mechanism; no concrete API names are asserted as a rule).
  - 'Acceptable only when the work cannot move to a worker (condition inferred): a
    long computation that stays on the event loop is partitioned into small steps
    that yield between them (for instance with setImmediate).'
  design_notes: 'Judge record:

    Positions: bound callback cost (ASYNC-C39; SRC-080); synchronous core APIs block
    (ASYNC-C41; SRC-080, inferred); partition (ASYNC-C42; SRC-080); worker offload
    (see SCHEDULING.3).

    Forces: fairness among clients against implementation effort.

    Decision: bounded cost; keep synchronous blockers off server loops; partition
    only where work cannot move to a worker (inferred condition).

    Rejected: unbounded callback cost, no condition named; partitioning as the default,
    wins when a worker is not available (inferred).

    Fact [single-source]: The WICG scheduler APIs (postTask, yield, TaskController)
    are a draft for engines that ship them; Node exposes only experimental scheduler.wait
    and scheduler.yield; not a cross-browser recommendation.

    Sources cited: SRC-080'
