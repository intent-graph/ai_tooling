- uid: PIG-JS.CONTRACTS.LAYER.1
  name: Type layer is TypeScript
  intent: Write JavaScript projects in TypeScript with strict checking when a build
    or type-check step can be adopted; JSDoc-checked JavaScript is the stated alternative
    when none can
  epistemic_state: 'risky | conflict: JSDoc-checked JavaScript, none | unvalidated:
    decided by the build on T1 mechanism facts and one T2 holder | unvalidated: rests
    on claims marked inferred or open (TYPES-C46)'
  constraints:
  - MUST use TypeScript with strict checking as the type layer whenever the project
    can adopt a build or type-check step (compilation, or Node type stripping)
  - 'Acceptable only when no build or type-check step can be adopted: JSDoc-checked
    JavaScript with checkJs, accepting weaker checks (open objects, optional parameters,
    any initialisers) and the removal of some JSDoc forms in TypeScript 7.0.'
  design_notes: 'Judge record:

    Positions: TypeScript (Google JS guide, frozen, recommends migrating, SRC-239;
    Google TS guide, SRC-244; TYPES-C01); JSDoc-checked JavaScript (no advocate; documented
    by SRC-047, SRC-044; weaker checks TYPES-C40; JSDoc forms removed in 7.0, TYPES-C42);
    none (no holder; only SRC-240 measuring 15 percent detection). Forces: checkability
    is served most by the position whose checker sees the most (full type syntax,
    unions, strict family); its cost is a compile or type-check step, which Node type
    stripping lowers (TYPES-C03, C04). Decision: TypeScript with strict. Condition
    table: TypeScript wins when a build or type-check step can be adopted (compilation,
    or Node type stripping); JSDoc-checked JavaScript wins when none can (LAYER.2);
    no type layer wins under no admitted condition; native type syntax is not planned
    on (Stage 1, no run-time enforcement). The choice among them is the build''s judgment
    (the claim reads: decision for the maintainer), flagged. Rejected: JSDoc-checked
    JavaScript, because checking is weaker (open objects, optional parameters, any
    initialisers) and 7.0 drops forms; it wins where no build or type-check step can
    be adopted (LAYER.2). None, because no admitted holder argues for it and SRC-240
    measures benefit; it wins on no admitted evidence. Native type syntax, because
    it is Stage 1 with no run-time enforcement.

    Rejected [consensus]: Rejected basis: native type syntax in JavaScript is a Stage
    1 proposal (last presented 2023-09, annotations as comments, no run-time enforcement);
    status only, the advice not to plan on it is inferred

    Sources cited: SRC-044, SRC-047, SRC-239, SRC-240, SRC-244'
