    and no substitute for sanitization or local variables.
  - 'Acceptable only when the environment is high-sensitivity and tested for breakage:
    freeze built-in prototypes or lock down the realm (SES is MDN''s example); Object.freeze
    is shallow, belief rejected: freeze makes nested data immutable.'
  design_notes: 'Judge record:

    Hardening and evidence

    Positions: Freeze app-owned configuration; lockdown only where tested (MDN, OWASP)
    against never modifying built-ins (SUBSET). Claims DOMSEC-C52, RUNSEC-C08, C09,
    C11.

    Forces: Hardening depth against breakage of polyfills and libraries.

    Decision: Freeze configuration (shallow), lock down only in high-sensitivity tested
    environments, never rely on --disable-proto alone.

    Rejected: Never freeze built-ins: wins for general code, loses in high-sensitivity
    code where lockdown is tested.

    Rejected [consensus]: Belief rejected: --disable-proto fixes prototype pollution.
    It removes the __proto__ entry point only; constructor.prototype stays reachable.

    Fact [single-source]: Evidence only (T2 abstract): static analysis found 61 zero-day
    pollution flaws in npm packages, 11 with CVEs (ESEC/FSE 2021). Demoted to fact:
    the source is restricted to prevalence evidence, so the advice to keep packages
    patched is not grounded here.'
