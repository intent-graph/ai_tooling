  design_notes: 'Judge record:

    Positions: default pipeTo propagation (RUNTIME-C09; SRC-197); tee shares chunks
    (RUNTIME-C10; SRC-197); Node stability (RUNTIME-C11; SRC-204).

    Forces: interference between branches against copy cost (not measured).

    Decision: do not mutate chunks seen through tee.

    Rejected: mutation of shared chunks, no condition named (byte streams copy, per
    SRC-197).

    Fact [single-source]: Web Streams pipeTo propagates errors by default: a source
    error aborts the destination, a destination error cancels the source, and source
    close closes the destination, unless preventAbort, preventCancel or preventClose
    is set.

