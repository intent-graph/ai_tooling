- uid: PIG-JS.SUBSET.CONVERSION.1
  name: Strict equality
  intent: Values are compared without type conversion; the comparison result follows
    from the operands alone.
  epistemic_state: known
  constraints:
  - 'MUST compare with === and !==: strict equality never converts types and is almost
    always the correct comparison.'
  - 'Acceptable only when +0 and -0 must be distinguished (meta-programming): Object.is;
    everywhere else ===.'
  design_notes: 'Judge record:

    Positions: === everywhere (LANG-C17); == where the types are known (LANG-C27 measurement
    only).

    Forces: result follows from operands alone versus a measured fraction of redundant
    ==; cost none.

    Decision: === and !==; Object.is only for signed zero (acceptable-when, LANG-C20).

    Rejected: == with types known; would win never as a rule, since the types are
    not checked.

    Fact [consensus]: Loose equality is unpredictable from operand values alone: IsLooselyEqual
    converts operands through ToNumber and ToPrimitive, so [] == false and 3 == "03"
    are true.

    Fact [single-source]: A 2015 dynamic analysis of about 5 million equality checks
    found that most == sites always compare same-type values and could be === unchanged;
    a measurement on one corpus, not a rule.'
