- uid: PIG-JS.DEFENSE.ORIGIN.2.1
  name: Framing of the own page
  intent: The page forbids being framed by other origins with frame-ancestors on every
    response, sent as a header, with X-Frame-Options only as a fallback that states
    the same policy.
  epistemic_state: 'known | conflict: frame-ancestors alone, since ASVS 3.4.6 requires
    the directive and is silent on a fallback, and CSP3 with RFC 7034 hold that the
    directive supersedes the header; OWASP and MDN both also send X-Frame-Options
    | unvalidated: the same-policy condition for the fallback is inferred from the
    ALLOW-FROM support gap (SECGAP2-C67)'
  constraints:
  - MUST prevent framing with the CSP frame-ancestors directive on every response;
    where both frame-ancestors and X-Frame-Options are sent, browsers that support
    frame-ancestors ignore X-Frame-Options.
  - 'MUST send frame-ancestors as an HTTP response header, never in a meta element:
    CSP does not support it there.'
  - MUST send X-Frame-Options (DENY or SAMEORIGIN) as a fallback beside frame-ancestors,
    only where it states the same policy ('none' or 'self'); where frame-ancestors
    names other origins, omit it, because ALLOW-FROM cannot express them.
  design_notes: 'Judge record:

    Framing of the own page

    Positions: (a) frame-ancestors on every response as a header (ASVS 3.4.6, OWASP
    Clickjacking sheet, CSP3); (b) frame-ancestors and X-Frame-Options together (OWASP
    and MDN Clickjacking recommend both); (c) X-Frame-Options alone. Claims SECGAP2-C63,
    C64, C67, C68 (contested, C68).

    Forces: Coverage of older browsers against a second header that cannot express
    allowed framers.

    Decision (max rule): (a) plus a matching X-Frame-Options fallback where the policy
    is none or self; where other origins are allowed, omit it. The condition is inferred
    from the ALLOW-FROM support gap (C67).

    Rejected: frame-ancestors alone (ASVS requires the directive and is silent on
    a fallback; CSP3 and RFC 7034 hold that the directive supersedes): wins where
    every supported browser implements frame-ancestors. X-Frame-Options alone: ALLOW-FROM
    unsupported, loses to the directive.

    Fact [single-source]: Fact (RFC 7034): X-Frame-Options has the values DENY and
    SAMEORIGIN; ALLOW-FROM was an Internet Explorer extension never uniformly implemented,
    so it is not a way to name allowed framers.'
