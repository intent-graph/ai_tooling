- uid: PIG-JS.DEFENSE.INJECTION.5.4
  name: XML and external entities
  intent: XML from outside is parsed with DTDs and external entity resolution off,
    schema validation uses XSD, and a missing hardening setting is a failure, not
    a fallback.
  epistemic_state: 'known | unvalidated: rests on claims marked inferred or open (SECGAP2-C22)
    | unvalidated: rests on single-source claims only'
  constraints:
  - MUST treat a parser's missing or unsupported security setting as a configuration
    failure, and also restrict external access in XInclude, schema validation and
    style sheet processing, not only in parsing.
  - MUST prefer XSD over DTD for schema validation of XML input.
  - MUST keep fast-xml-parser at 4.5.4 or 5.3.6 or later and set processEntities to
    false when DOCTYPE entities are not needed.
  design_notes: 'Judge record:

    XML and external entities

    Positions: (a) DTDs off, external entities and external DTDs off, partial hardening
    a failure, XSD over DTD (OWASP XXE and XML Security sheets, ASVS 1.5.1); (b) parser
    defaults. Claims SECGAP2-C19 to C21 (C18 on the philosophy node, C22 open).

    Forces: Safety against not knowing which Node parsers resolve entities (C22).

    Decision: (a); fast-xml-parser version floor and processEntities false as a separate
    denial-of-service rule.

    Rejected: (b): Node parser defaults are not grounded, so they cannot be relied
    on; wins when a source states a parser''s defaults.

    Fact [single-source]: Open: which JavaScript XML parsers resolve external entities
    by default, and which options turn this off, is grounded by no admitted T1 source;
    no Node-specific XXE rule can be stated.

    Fact [-]: Fact (advisory, dated evidence): CVE-2026-26278, High 7.5, published
    2026-02-14: unlimited text-entity expansion in DOCTYPE lets a small input freeze
    the process; a denial of service, not an external-entity file read.'
