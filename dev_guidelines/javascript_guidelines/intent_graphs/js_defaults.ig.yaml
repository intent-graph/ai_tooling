- uid: PIG-JS.SUBSET.OBJECTS.6
  name: Own properties and enumeration
  intent: Own properties are tested and enumerated without visiting the prototype
    chain.
  epistemic_state: 'known | unvalidated: for-in rule on arrays single T2 source; hasOwn
    preference grounded for untrusted keys by two T1 sources (RUNSEC-C07, merged here),
    extension to all reads inferred'
  constraints:
  - 'MUST prefer Object.hasOwn(obj, key) over obj.hasOwnProperty(key), because the
    inherited method may be shadowed or absent on a null-prototype object; for untrusted-keyed
    reads, read with Object.hasOwn and iterate with Object.keys or for...of, never
    for...in, so inherited (possibly polluted) properties are not visited. Grounds:
    MDN prototype pollution and Node security best practices (two T1 sources) for
    untrusted keys, a style-guide position for the general preference; extending it
    to all reads is inferred.'
  - 'MUST NOT use for-in to iterate arrays: it visits all enumerable properties including
    inherited ones, not just elements (DLint evidence on 2015 sites).'
  - 'Acceptable only when the target lacks Object.hasOwn: obj.hasOwnProperty, because
    lookup and iteration traverse the prototype chain and one of the two own-property
    tests is necessary (MDN).'
  design_notes: 'Judge record:

    Positions: Object.hasOwn (LANG-C55); hasOwnProperty (STRUCT-C45); for-in on arrays
    (rejected by LANG-C26).

    Forces: an inherited method can be shadowed or absent; for-in visits inherited
    keys.

    Decision: Object.hasOwn; arrays iterated by element, not for-in.

    Rejected: hasOwnProperty; wins on targets without Object.hasOwn.'
