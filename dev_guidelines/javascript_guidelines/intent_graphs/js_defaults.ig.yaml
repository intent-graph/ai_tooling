- uid: PIG-JS.DEFENSE.INJECTION
  name: Injection classes
  intent: 'Each interpreter outside the page gets its own safe channel: no code from
    strings, no shell, parameters for queries, confined resolved paths, pure-data
    serialization and allowlisted resolved destinations.'
  epistemic_state: 'known | unvalidated: rests on single-source claims only'
  constraints:
  - MUST document where dangerous functionality is used (deserialization of untrusted
    data, raw file or binary parsing, dynamic code execution, direct memory manipulation);
    ASVS 15.1.5, Level 3.
  - MUST encode data in every logging component to prevent log injection (ASVS 16.4.1,
    Level 2).
  design_notes: 'Judge record:

    Injection classes

    Positions: Document dangerous functionality and encode logs (ASVS 15.1.5, 16.4.1).
    Claims RUNSEC-C45, SRVSEC-C46, SRVSEC-C61.

    Forces: Review visibility against documentation effort.

    Decision: Document where deserialization, dynamic code, raw parsing and memory
    manipulation are used; encode data in every logging component.

    Rejected: No documentation of dangerous functionality: loses under ASVS Level
    3 verification.'
  impl_pointers:
  - build/research/06_runsec/result.md::RUNSEC-C45
  - build/research/13_srvsec/result.md::SRVSEC-C46
  - build/research/13_srvsec/result.md::SRVSEC-C61
  history:
  - who: agent:assembler
    date: 2026-10-13T18:37
    note: tree of the defaults graph from the integrated skeleton (uid check skipped
      on attach)
  - who: agent:assembler
