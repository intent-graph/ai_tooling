- uid: PIG-JS.DEFENSE.INJECTION.3
  name: SQL and NoSQL queries
  intent: Values go through the driver's parameter channel, MongoDB filters take typed
    scalars, server-side JavaScript in the database is off.
  epistemic_state: 'known | conflict: escape dynamic identifiers with pg-format, node-postgres
    docs'
  constraints:
  - 'MUST render parameterization through the driver''s value channel: node-postgres
    query text with a parameter array; Prisma $queryRaw as a tagged template; never
    string-built SQL, and $queryRawUnsafe or Prisma.raw with untrusted input.'
  - MUST validate that each client-supplied MongoDB filter value has the expected
    scalar type and reject objects; disallow client-controlled query operators unless
    validated; never accept raw JSON queries or eval strings from clients.
  - 'MUST NOT let clients supply $where, mapReduce, $accumulator or $function expressions:
    they run JavaScript on the database server; disable server-side JavaScript when
    it is not needed.'
  - 'Acceptable only when names are genuinely dynamic (DDL): escape dynamic identifiers
    with the pg-format package, node-postgres'' documented answer; otherwise OWASP''s
    allowlist mapping or redesign applies and escaping is strongly discouraged.'
  design_notes: 'Judge record:

    SQL and NoSQL queries

    Positions: Parameters (OWASP, ASVS 1.2.4, driver docs) against escaping (node-postgres
    pg-format for identifiers, OWASP discouraged); validated scalars for MongoDB.
    Claims SRVSEC-C16, C18, C20, C21, C24 to C27.

    Forces: Strength of the separation against the need for dynamic identifiers.

    Decision: Parameterized values always; identifiers by fixed allowlist or redesign;
    MongoDB scalar types, no client operators, no client server-side JavaScript.

    Rejected: pg-format escaping: wins only for names that are genuinely dynamic,
    such as DDL.

    Fact [single-source]: Fact (mysql2 docs): execute() prepares and caches a statement
    (LRU, default 16,000); manually created prepare() statements are not cached and
    must be closed with statement.close(); the page makes no injection-safety statement.

    Fact [single-source]: Fact (Mongoose docs): sanitizeFilter() wraps nested objects
    with a key starting with $ in $eq; the setting is false by default and must be
    enabled.'
