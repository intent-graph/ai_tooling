- uid: PIG-JS.SUBSET.OBJECTS.1
  name: Explicit receiver
  intent: 'The receiver of a call is never implicit: no code relies on the global
    this, and callbacks keep the outer receiver lexically.'
  epistemic_state: known
  constraints:
  - 'MUST NOT rely on an implicit global this: in a plain function call this is undefined
    in strict code and globalThis in sloppy code.'
  - 'Acceptable only when a team adopts it as a convention: prefer arrow functions
    over f.bind(this) and const self = this (Google JS guide position, demoted from
    evidence).'
  - 'Acceptable only when a team adopts it as a convention: use this only in class
    constructors and methods, in arrows inside them, or in functions with an explicit
    @this (Google JS guide position, demoted from evidence).'
  design_notes: 'Judge record:

    Positions: never rely on implicit this (LANG-C04); arrows for lexical this (LANG-C06);
    Google conventions (LANG-C07, C08, demoted).

    Forces: this set at call time makes detached methods fail; the Google conventions
    are stronger but grounded only by a position.

    Decision: never rely on an implicit global this; use arrows for lexical this in
    nested callbacks.

    Rejected: restricting this to class code (LANG-C08) and arrows over bind everywhere
    (LANG-C07) as rules; would win as a team convention (acceptable-when).

    Fact [consensus]: A function''s this is set by how it is called, not where it
    is defined: a method detached from its object loses its receiver and sees undefined
    in strict code.

    Fact [single-source]: Arrow functions take this from the enclosing lexical context
    and call, apply and bind cannot change it, so they suit nested callbacks that
    need the outer this.'
