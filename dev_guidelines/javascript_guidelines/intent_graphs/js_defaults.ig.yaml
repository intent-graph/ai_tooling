- uid: PIG-JS.VERIFICATION.LINT.2.1
  name: Warnings fail the run
  intent: Warnings count as failures in CI, so nothing is tolerated by default silence.
  epistemic_state: 'known | unvalidated: rests on claims marked inferred or open (QUALITY-C05)
    | unvalidated: rests on single-source claims only'
  constraints:
  - MUST make CI fail on lint warnings, not only errors, with --max-warnings 0; without
    it warnings never change the exit status (default -1, no limit).
  design_notes: 'Judge record:

    Positions: `--max-warnings 0` so warnings change the exit status; default -1 means
    no limit (QUALITY-C05; SRC-165).

    Forces: no tolerated drift against the cost of cleaning up existing warnings first.

    Decision: CI runs with `--max-warnings 0`.

    Rejected: the default (warnings never fail), because the documented exit rule
    leaves them invisible to CI; it wins during a staged migration with a recorded
    end date (inferred).

    Sources cited: SRC-165'
