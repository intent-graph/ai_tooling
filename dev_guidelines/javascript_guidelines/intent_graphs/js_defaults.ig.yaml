- uid: PIG-JS.STRUCTURE.SURFACE.5
  name: No static-only container classes
  intent: Use the module as the namespace and export functions and constants individually.
  epistemic_state: 'known | conflict: stateless groupings as static methods, W3C TAG
    | unvalidated: holder position only (Google JS, Google TS)'
  constraints:
  - MUST NOT create classes holding only static members to namespace functions; export
    individual functions and constants from the module. Holder position of Google
    JS and Google TS.
  design_notes: 'Judge record:

    Positions: Module as namespace (LANG-C15, STRUCT-C26; SRC-239, SRC-244) against
    static-method groupings (STRUCT-C54; SRC-261)

    Forces: A module already namespaces and lets importers pick single functions

    Decision: Export functions individually. Re-judged under best (KEEP): a module
    already namespaces and lets importers pick one function (MDN, T1), both Google
    guides agree, and W3C TAG''s opposite is written for web platform APIs where no
    module namespace exists, a setting the rejected condition already names

    Rejected: Static-method groupings: win when designing a platform-style API where
    the host offers no module namespace (W3C TAG''s setting, transfer inferred)

    Rejected [single-source]: Rejected position of W3C TAG: a class is shaped for
    state, so stateless groupings are static methods rather than fake classes (guidance
    for web platform APIs; transfer to module code is inference).

    Sources cited: SRC-239, SRC-244, SRC-261'
