- uid: PIG-JS.DEFENSE.SECRETS.1
  name: Randomness
  intent: Tokens and keys come from the platform CSPRNG with at least 128 bits; Math.random
    and non-v4 UUIDs are rejected.
  epistemic_state: known
  constraints:
  - 'MUST draw secrets and tokens from the platform CSPRNG: crypto.randomBytes, randomInt
    or randomUUID in Node; crypto.getRandomValues in browsers (at most 65,536 bytes
    per call, QuotaExceededError above, so chunk). A security token needs a CSPRNG
    and at least 128 bits (ASVS 11.5.1).'
  design_notes: 'Judge record:

    Randomness

    Positions: CSPRNG with 128 bits (ASVS 11.5.1, MDN, OWASP) against Math.random.
    Claims SRVSEC-C01 to C04.

    Forces: Unpredictability against convenience.

    Decision: crypto.randomBytes, randomInt, randomUUID in Node; getRandomValues in
    browsers; version 4 UUIDs only.

    Rejected: Math.random: refuted by MDN. Version 1 UUIDs: embed time and MAC.

    Rejected [consensus]: Never use Math.random() for anything security-related (tokens,
    session ids, password resets, keys). Belief rejected: Math.random is random enough
    for ids and tokens (CWE-338).

    Rejected [consensus]: Belief rejected: any UUID is an unguessable id. Treat a
    UUID as random only if it is version 4 from a CSPRNG; version 1 embeds a timestamp
    and MAC address.'
