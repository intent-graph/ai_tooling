- uid: PIG-JS.DEFENSE.DOM.1
  name: Markup and attribute sinks
  intent: Untrusted data is inserted as text or built nodes; HTML-parsing sinks, event-handler
    attributes and unquoted attribute values never carry it.
  epistemic_state: 'known | conflict: setAttribute unconditionally safe, OWASP DOM
    XSS sheet | unvalidated: MDN TrustedScript condition inferred'
  constraints:
  - MUST NOT assign untrusted data to HTML-parsing sinks (innerHTML, outerHTML, insertAdjacentHTML,
    document.write, document.writeln); use a safe DOM API or a sanitizer.
  - MUST insert untrusted text with textContent, or build nodes with createElement
    and appendChild; never build markup from strings.
  - MUST NOT place untrusted data inside JavaScript code, event-handler attributes,
    or script and style contexts at all; encoding is context specific and unreliable
    there.
  - MUST quote every inserted attribute value in templates; an unquoted placeholder
    lets an attacker add an event-handler attribute.
  - MUST NOT set event-handler attributes from untrusted data with setAttribute, which
    is not unconditionally safe. Position held against OWASP's DOM XSS sheet, which
    lists setAttribute as a safe construction method; the MDN Trusted Types page lists
    its value argument as a TrustedScript sink, the condition (event-handler names)
    is inferred.
  design_notes: 'Judge record:

    Markup and attribute sinks

    Positions: Text-only insertion (OWASP, MDN, ASVS) against sanitizer-everywhere;
    setAttribute as safe construction (OWASP DOM XSS sheet) against setAttribute as
    a TrustedScript sink (MDN). Claims DOMSEC-C01, C02, C04, C05, C25.

    Forces: Safety against convenience of building markup from strings; encoding is
    context specific and unreliable in script and handler contexts.

    Decision: Insert text with textContent or built nodes, keep untrusted data out
    of HTML sinks, script, style and event-handler attributes, quote attributes, and
    never set event-handler attributes from untrusted data.

    Rejected: setAttribute as unconditionally safe (OWASP DOM XSS sheet): loses where
    the attribute name is an event handler, the condition inferred and to be read
    verbatim. Encoding into script contexts: rejected by OWASP itself as unreliable.

    Fact [single-source]: Catalogue of sinks beyond XSS (location for open redirection,
    document.cookie, postMessage, web storage setItem, JSON.parse, setAttribute) from
    a T3 source. Demoted to fact: the source is restricted to catalogue facts, so
    its advice is not used as a ground.

    Fact [single-source]: Dated prevalence evidence: 6,167 unique DOM XSS flaws over
    480 domains, 9.6 percent of the Alexa top 5000 (2013 study).'
