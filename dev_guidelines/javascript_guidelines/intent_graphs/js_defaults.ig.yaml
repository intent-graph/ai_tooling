    read all of it, so it holds no secrets.'
  - MUST validate data read from web storage and from messages as untrusted input,
    since attackers can write into them (rule is a synthesis of a T2 finding and a
    T3 catalogue, inferred).
  design_notes: 'Judge record:

    Web storage

    Positions: No secrets in Web Storage (OWASP, MDN, DOMSEC-C36) against tokens in
    storage for convenience. DOMSEC-C35 is owned by web_architecture.

    Forces: Safety against client-side session convenience.

    Decision: Web Storage holds no secrets; validate what is read from it and from
    messages.

    Rejected: Tokens in localStorage: rejected by OWASP session management as always
    readable by script.

    Deferred: Never keep authentication tokens, session identifiers or credentials
    in localStorage or sessionStorage. Owned by web_architecture as session and token
    architecture (routing note); the code-level mechanism is DOMSEC-C36 here. Confirmed
    folklore: tokens in web storage.'
