- uid: PIG-JS.DEPENDENCIES.FRAMEWORK_EVIDENCE.3
  name: Type support
  intent: How each framework relates to the type layer.
  epistemic_state: 'known | gap: htmx has no source'
  design_notes: 'Fact [single-source]: React ships no types of its own; they come
    from DefinitelyTyped. The JSX compiler options are framework configuration and
    are not adopted as a rule here.

    Fact [single-source]: Vue is written in TypeScript and all official packages bundle
    type declarations.

