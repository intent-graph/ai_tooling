- uid: PIG-JS.RUNTIME.MEMORY.5
  name: Intended retention
  intent: 'Only intended state stays reachable: weak collections for object-keyed
    metadata, no weak references, unpooled Buffers for long-retained chunks.'
  epistemic_state: 'known | unvalidated: quote tool-extracted; the ECMA-262 processing
    notes for WeakRef were not read | unvalidated: rests on single-source claims only
    | unvalidated: quote not obtained (RUNTIME-C14, RUNTIME-C29)'
  constraints:
  - 'MUST retain only what is intended: use WeakMap or WeakSet, not Map or Set, for
    object-keyed metadata that must not keep keys alive; avoid WeakRef and FinalizationRegistry
    (timing differs between engines, a cleanup callback may never run, a deref target
    stays alive until the end of the current job) and use try...finally for deterministic
    release; use Buffer.allocUnsafeSlow, not allocUnsafe, for small chunks retained
    for an indeterminate time, since pooled allocations keep the whole pool slab alive.'
  design_notes: 'Judge record:

    Positions: (a) WeakMap or WeakSet for object-keyed metadata, avoid WeakRef and
    FinalizationRegistry, allocUnsafeSlow for long-retained chunks (RUNTIME-C29, C28
    SRC-193, SRC-203; RUNTIME-C14 SRC-185; all T1); (b) use WeakRef and FinalizationRegistry
    for cleanup.

    Forces: (a) deterministic release, independent of collection timing; (b) convenience,
    behaviour differs between engines and a callback may never run.

    Decision: (a), the most demanding: the non-deterministic features are avoided.

    Rejected: (b): wins when no deterministic release exists and a missed cleanup
    is harmless.

    Sources cited: SRC-185, SRC-193, SRC-203'
