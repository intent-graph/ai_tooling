- uid: PIG-JS.STRUCTURE.DIRECTION.1
  name: No import cycles
  intent: Create no import cycle between modules, in ESM or CommonJS.
  epistemic_state: 'known | conflict: cycles are a supported mechanism, Node CommonJS
    docs (no recommendation) | unvalidated: single T1 ground (MDN advice, used from
    its slot-01 claim where the register leaves it unrestricted), quote tool-extracted;
    other holders are positions only, no source measures the cost'
  constraints:
  - 'MUST NOT create import cycles between modules, in ESM or CommonJS: MDN advises
    avoiding them and Google JS forbids them although the specification allows them;
    Node documents cycles as a supported mechanism through partial exports, and none
    of the sources measures a cost.'
  design_notes: 'Judge record:

    Positions: No cycles (STRUCT-C09, LANG-C64; SRC-029, SRC-239, SRC-313) against
    tolerating cycles (SRC-089 documents partial exports as supported)

    Forces: A cycle makes correctness depend on evaluation order; tolerance costs
    nothing until a binding is used early

    Decision: No import cycles

    Rejected: Tolerate: wins where a cycle is deliberate in CommonJS legacy code and
    no fault is observed, or where the detection cost exceeds the benefit

    Rejected [consensus]: Rejected folklore "cyclic imports always crash": an ESM
    cycle throws a ReferenceError only when a binding is used while still uninitialised,
    and a CommonJS cycle hands the importer an unfinished exports object; whether
    to forbid cycles is a separate question.

    Sources cited: SRC-029, SRC-089, SRC-239, SRC-313'
