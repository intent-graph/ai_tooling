- uid: PIG-JS.DEFENSE.ORIGIN.5
  name: CSP-ready code and policy handoff
  intent: Code runs under a strict CSP without exceptions; the policy and its deployment,
    CORS and JSONP rules belong to web_architecture.
  epistemic_state: 'known | deferred: policy deployment owned by web_architecture'
  constraints:
  - 'MUST write code that survives a strict CSP: no inline script, no inline event-handler
    attributes (use addEventListener), no string eval.'
  design_notes: 'Judge record:

    CSP-ready code and policy handoff

    Positions: Strict-CSP-compatible code (CSP3, OWASP) against inline script and
    handlers; policy design is owned by web_architecture. Claims DOMSEC-C27, C28 and
    the deferred rows.

    Forces: Safety against inline-code convenience.

    Decision: No inline script, no inline handlers, no string eval, so the strict
    policy can be deployed.

    Rejected: Domain-allowlist CSP as XSS protection: refuted by a 2016 measurement
    of 94.72 percent bypassable policies; the nonce or hash policy itself belongs
    to web_architecture.

    Rejected [consensus]: Belief rejected: a CSP with a domain allowlist stops XSS.
    Allowlists were bypassable in 94.72 percent of distinct deployed policies (2016
    measurement); nonce or hash based strict CSP is the policy side, owned by web_architecture.

    Deferred: CSP is a second layer behind secure code, not a first line of defence
    against injection. Deployment policy is owned by web_architecture; this guideline''s
    code rules stand without it.

    Deferred: Generate CSP nonces in a real HTML templating engine, never in middleware
    that stamps every script tag. Policy deployment, owned by web_architecture.

    Deferred: Do not use JSONP and keep authorization-dependent data out of script
    resources (XSSI). Response and header policy, owned by web_architecture.

    Deferred: Allow specific origins in Access-Control-Allow-Origin, never the wildcard
    on authenticated resources. Header policy, owned by web_architecture.

    Deferred: Angular documents per-request nonce CSP, Trusted Types enforcement,
    XSRF token handling and SSRF host validation for server rendering. Deployment
    options, owned by web_architecture.

    Deferred: SvelteKit offers CSP in hash, nonce or auto mode and a csrf trustedOrigins
    list where ''*'' disables the origin check. Deployment options, owned by web_architecture.'
