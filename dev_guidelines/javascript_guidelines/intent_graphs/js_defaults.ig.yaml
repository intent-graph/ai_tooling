- uid: PIG-JS.DEFENSE.DOM.4
  name: Trusted Types enforcement
  intent: Injection sinks accept only typed values produced by named policies, rolled
    out in report-only mode, then enforced; Trusted Types is a gate, not a sanitizer.
  epistemic_state: 'known | conflict: default policy as normal practice, Roth et al.
    USENIX 2024, for third-party code | unvalidated: rests on claims marked inferred
    or open (DOMSEC-C19, DOMSEC-C22) | unvalidated: quote not obtained (DOMSEC-C19)'
  constraints:
  - MUST enforce Trusted Types (require-trusted-types-for 'script') so injection sinks
    reject plain strings, and write code that passes Trusted values.
  - MUST use named Trusted Types policies; reserve the default policy for migrating
    legacy code and for third-party code that cannot be changed.
  - MUST roll Trusted Types out in report-only mode, fix violations by refactoring,
    then enforce.
  - MUST avoid TrustedScript sinks by design and never reuse an HTML sanitizer for
    script or URL sinks, because script sanitization is hard to impossible (the avoidance
    rule is a synthesis of a T2 observation, inferred).
  - MUST pass TrustedScript objects instead of strings to eval and Function in browsers,
    and prefer the trusted-types-eval CSP keyword to unsafe-eval.
  design_notes: 'Judge record:

    Trusted Types enforcement

    Positions: Enforce with named policies (MDN, W3C, DOMSEC-C15 and C17) against
    default policy as normal practice (Roth et al., USENIX 2024). Claims DOMSEC-C15,
    C16, C17, C18, C19, RUNSEC-C19, FW-C48.

    Forces: Strength of the gate against the cost of retrofitting third-party code
    that cannot pass typed values.

    Decision: Enforce require-trusted-types-for ''script'', named policies, report-only
    rollout, trusted-types-eval in place of unsafe-eval, no sanitizer reuse for script
    sinks.

    Rejected: Default policy as normal practice: wins only for third-party code that
    cannot be changed, as MDN and web.dev already allow. Trusted Types as sanitizer:
    refuted by MDN.

    Rejected [consensus]: Belief rejected: Trusted Types sanitizes input by itself.
    The API supplies no sanitizer; protection is exactly as good as the policy function
    you write.

    Fact [single-source]: Fact: Trusted Types is Baseline newly available since February
    2026; a tinyfill gives the same protection in older browsers if the code was tested
    with enforcement in a supporting browser.

    Fact [single-source]: Holder position only: Mozilla''s standards position on Trusted
    Types is positive since 2023-12-13 with stated concerns. Fact, not evidence for
    a practice.

    Fact [single-source]: Second-hand fact (inferred): a 2021 report cited by a USENIX
    2024 paper says Google deployed Trusted Types on 130 services with no client-side
    XSS in the protected applications; the cited report is not in the register.

    Fact [consensus]: Fact: with Trusted Types enforced, pass TrustedHTML to React;
    from React 19.3 React forwards such values without string coercion, earlier versions
    coerced them to strings and the browser rejected them.'
