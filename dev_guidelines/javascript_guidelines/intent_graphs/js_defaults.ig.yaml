- uid: PIG-JS.RUNTIME.MEMORY.4
  name: Production capture
  intent: In production the sampling heap profiler runs and snapshots are taken only
    where a crash is harmless and the trigger is never public.
  epistemic_state: 'known | unvalidated: quote tool-extracted; snapshot cost on current
    Node versions unmeasured here | unvalidated: quote not obtained (RUNTIME-C46)'
  constraints:
  - MUST use the sampling heap profiler in production (low overhead) and keep the
    allocation timeline out; take a heap snapshot only where the process can crash
    without harming availability (it stops the main thread and needs about twice the
    heap in memory) and never expose the trigger endpoint publicly.
  - 'Acceptable only when a snapshot is wanted at the moment the heap nears its limit:
    capture it with --heapsnapshot-near-heap-limit=N (stable); several snapshots may
    be written because collection during snapshotting can lower usage.'
  design_notes: 'Judge record:

    Positions: (a) sampling heap profiler in production, snapshots only where a crash
    is harmless, trigger never public (RUNTIME-C44 SRC-201, SRC-202; RUNTIME-C46 SRC-200,
    all T1); (b) near-heap-limit capture (RUNTIME-C50, SRC-079, SRC-202 T1); (c) belief
    that snapshots are infeasible on large heaps (RUNTIME-C57 SRC-306 T2, restricted
    belief).

    Forces: (a) low overhead, availability protected, attack surface closed; (b) automatic
    capture at the moment of interest; (c) false since V8 fixes.

    Decision: (a), the most demanding on availability and exposure.

    Rejected: (b): wins when a snapshot is wanted at that moment. (c): wins on older
    V8 than 11.5.130.

    Rejected beliefs: Belief that heap snapshots are infeasible on large production
    heaps (restricted in the dissent audit on SRC-306): true before the V8 fixes;
    do not assume infeasibility, measure on the Node version in use.

    Fact [single-source]: Heap snapshots of large production heaps were slow because
    of two V8 defects (string hashing, uncached line breaks; a 500 MB snapshot took
    over 30 minutes) fixed in V8 v11.5.130, cutting one case from 10 minutes to 6
    seconds; the Node version carrying the fix is not stated.

    Sources cited: SRC-079, SRC-200, SRC-201, SRC-202, SRC-306'
