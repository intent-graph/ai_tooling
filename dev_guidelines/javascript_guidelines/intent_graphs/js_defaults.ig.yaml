- uid: PIG-JS.DEPENDENCIES.INSTALL.2
  name: Install scripts blocked
  intent: Code that runs at install time is approved package by package, never by
    default.
  epistemic_state: known
  constraints:
  - MUST keep the default block on dependency install scripts (npm 12, pnpm 10 and
    later) and approve reviewed packages through an explicit allowlist (npm allowScripts,
    pinned to the exact version) rather than disabling the guard globally.
  - 'Acceptable only when the manager still runs scripts by default (npm before v12):
    disable lifecycle scripts for installs with --ignore-scripts or ignore-scripts=true
    and allowlist the few packages that need them.'
  design_notes: 'Judge record:

    Positions: (a) block install scripts by default and approve reviewed packages
    through an exact-version allowlist: SUPPLY-C08 (SRC-153, SRC-151), SUPPLY-C10
    (SRC-153, SRC-158, consensus); (b) disable scripts globally with --ignore-scripts
    and allowlist the few that need them: SUPPLY-C09 (SRC-078, SRC-155, SRC-288, consensus);
    (c) run all scripts, the pre-v12 npm default.

    Forces: Trust wants no code to run before review; the cost is a maintained allowlist
    and packages that legitimately build at install.

    Decision: (a): per-package approval pinned to the exact version, guard never disabled
    globally. Grounds: two independent bodies (npm docs, pnpm docs) and OWASP and
    Node guidance on the same risk; install scripts are a confirmed supply-chain risk
    (the dissent audit).

    Rejected: (b): acceptable when the manager still runs scripts by default (npm
    before v12, SRC-078 restriction), with an allowlist. (c): rejected, no admitted
    source supports it; wins under no stated condition. Disabling the guard globally
    on a default-block manager: rejected by SUPPLY-C10.

    Sources cited: SRC-078, SRC-151, SRC-153, SRC-155, SRC-158, SRC-288'
