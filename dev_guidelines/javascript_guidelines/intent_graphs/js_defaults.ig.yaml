    Forces: no extra dependency in the trust chain (DEPENDENCIES), CI-friendly exit
    status and no watch default, against stable coverage tooling and richer features
    elsewhere.

    Decision: node:test. Do not gate on its experimental coverage flag (consistent
    with D1: coverage is not a gate anyway).

    Rejected: Vitest, wins when the project already builds with Vite or needs stable
    coverage providers or its watch workflow. Jest, wins when a large existing Jest
    suite and its transforms are in place (migration cost, inferred).

    Fact [single-source]: Vitest requires Vite 6.4 or later and Node 22.12 or later,
    finds files with .test. or .spec. in the name, and runs in watch mode by default,
    so use vitest run in CI (CI advice inferred). Fact about Vitest only.

    Fact [single-source]: Vitest offers a V8 coverage provider (no pre-transpile step)
    and an Istanbul provider (instrumentation, any JavaScript runtime); since v3.2.0
    V8 coverage uses AST-based remapping. Fact about Vitest only.

    Fact [single-source]: Jest needs a transform (Babel presets or ts-jest) to run
    TypeScript and finds tests by .test.js naming in its examples. Fact about Jest
