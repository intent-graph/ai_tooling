- uid: PIG-JS.DEPENDENCIES.UPDATE.3
  name: Audit in CI
  intent: Known-vulnerability data is checked against the committed lockfile and read
    as triage.
  epistemic_state: 'known | unvalidated: no admitted source states running npm audit
    in CI as a practice (SRC-149 gives behaviour facts only) | unvalidated: rests
    on single-source claims only'
  constraints:
  - MUST run any known-vulnerability audit against the committed lockfile, never without
    one (results can differ on every run), and read findings as triage input (js-philosophy
    DEPENDENCIES.EVIDENCE.2).
  - 'Acceptable only when a team adopts npm audit as its known-vulnerability check:
    set audit-level to define the failing severity; no admitted source states running
    it in CI as a practice.'
  design_notes: 'Judge record:

    Positions: (a) run npm audit against the committed lockfile with audit-level:
    SUPPLY-C21 (SRC-149, SRC-152); (b) treat every finding as exploitable; (c) ignore
    audit as noise; (d) audit runtime dependencies only on the strength of the dependencies
    split.

    Forces: Known-vulnerability data is cheap and noisy: 68.28 percent of package-level
    impacts are unreachable (SUPPLY-C22, SRC-285, SRC-286).

    Decision: (a), findings read as triage input (DEPENDENCIES.EVIDENCE.2). Restriction
    check: SRC-149 grounds the behaviour (lockfile dependence, threshold), not audit
    accuracy, and no preference for npm over another tool is stated; the lockfile
    and triage rules are decisions on that ground; running npm audit as the check
    is acceptable-when, since no admitted source states it as a practice. Threshold
    value: undecided child UPDATE.3.1.

    Rejected: (b) and (c): refuted or unsupported by the two T2 studies (folklore
    refuted). (d): rejected by SUPPLY-C23 (28.2 percent of dev-configured dependencies
    were used in production). Audit without a lockfile: results differ per run (SUPPLY-C21).

    Sources cited: SRC-149, SRC-152, SRC-285, SRC-286'
