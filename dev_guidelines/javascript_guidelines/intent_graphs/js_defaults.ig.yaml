- uid: PIG-JS.SUBSET.STRICTNESS.2
  name: ES modules as the unit
  intent: Code is written as ES modules, which are strict, module-scoped, evaluated
    once and deferred.
  epistemic_state: known
  constraints:
  - 'MUST write ES modules: module code is strict, top-level declarations are module-scoped
    and not global, a module runs once however often it is imported, and top-level
    this is undefined.'
  design_notes: 'Judge record:

    Positions: ES modules (LANG-C57, STRUCT-C21); classic scripts and globals (implicit
    alternative).

    Forces: module scope and single evaluation remove ambient globals; cost is a build
    or type=module loading.

    Decision: write ES modules.

    Rejected: classic scripts with a directive; would win for a single-file page with
    no tooling.

    Fact [consensus]: Modules are strict and deferred by default, so do not add defer
    to module scripts and do not expect classic-script behaviour.'
