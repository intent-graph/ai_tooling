- uid: PIG-JS.CONTROL.ERRORS.2
  name: Catching
  intent: A catch acts on the failure; caught values are unknown until narrowed, and
    failures of asynchronous callbacks go through a channel the caller observes.
  epistemic_state: 'known | unvalidated: single T1 sources; the no-empty-catch rule
    rests on one style-guide position (Google JS)'
  constraints:
  - MUST treat caught values as unknown (useUnknownInCatchVariables) and narrow with
    instanceof Error before use, because a thrown value need not be an Error.
  - MUST NOT leave a catch block empty without a comment stating why taking no action
    is right (Google JS guide position).
  design_notes: 'Judge record:

    Positions: caught value unknown and narrowed (TYPES-C12; SRC-052); callback throws
    routed through a channel (ASYNC-C22; SRC-065); empty catch with a reason (ASYNC-C21;
    SRC-239, position only).

    Forces: a thrown value need not be an Error; try/catch cannot see asynchronous
    callbacks.

    Decision: unknown plus narrowing; route callback failures through rejection, error-first
    argument or emitter event. A catch that does nothing is forbidden unless a comment
    states why taking no action is right.

    Rejected: any-typed catch variable, no condition named; empty catch without a
    reason, no condition named.

    Fact [single-source]: In Node a throw inside an asynchronous callback escapes
    a surrounding try/catch; report the error through the promise rejection, the error-first
    callback argument or an emitter error event.

    Sources cited: SRC-052, SRC-065, SRC-239'
