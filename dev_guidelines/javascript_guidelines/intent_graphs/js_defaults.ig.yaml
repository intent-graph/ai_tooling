- uid: PIG-JS.DEFENSE.ORIGIN.6.2
  name: Methods and API endpoints
  intent: Safe methods never change state, and an API that relies on CORS preflight
    makes sure no request can reach it without one.
  epistemic_state: known
  constraints:
  - MUST NOT use GET, HEAD or OPTIONS for state-changing operations.
  - MUST rely on a custom request header or a non-simple Content-Type for an API endpoint,
    and so on a CORS preflight instead of a token, only when no request that triggers
    no preflight can reach the functionality.
  design_notes: 'Judge record:

    Methods and API endpoints

    Positions: (a) no state change through GET, HEAD or OPTIONS; preflight reliance
    only when no preflight-free request reaches the functionality (OWASP, MDN, ASVS
    3.5.1 to 3.5.3). Claims SECGAP2-C57, C60.

    Forces: Safe methods and simple requests skip the cross-site protections.

    Decision: (a).

    Rejected: state change through a safe method: wins under no condition.'
