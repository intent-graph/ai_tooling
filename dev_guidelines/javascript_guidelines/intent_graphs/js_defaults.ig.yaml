- uid: PIG-JS.DEFENSE.INJECTION.4.6
  name: Upload storage, names and limits
  intent: Uploads get server-generated names, live outside the web root, are never
    run as code, and are bounded in size, count and unpacked size before the file
    is accepted.
  epistemic_state: known
  constraints:
  - MUST name stored files with a server-generated name and never build a path from
    the uploaded file name; if a client name must be used, validate it strictly or
    ignore it.
  - MUST store uploads on a different server or outside the web root, and never execute
    files uploaded by untrusted input as server-side code.
  - MUST set explicit upload limits (file size, file count, fields, parts, quotas),
    because busboy and multer default fileSize, files and parts to Infinity.
  - 'MUST NOT add multer as global middleware: an attacker could upload files to a
    route the application did not anticipate.'
  - MUST check compressed uploads against a maximum uncompressed size and file count
    before uncompressing, and bound the pixel size of uploaded images.
  - MUST give an explicit Content-Disposition file name, and encode or sanitize names
    served in headers or attachments.
  design_notes: 'Judge record:

    Upload storage, names and limits

    Positions: (a) server-generated names, storage outside the web root, explicit
    limits, no global multer, decompression bounds, encoded served names (OWASP File
    Upload, ASVS 5.2.1, 5.2.3, 5.2.6, 5.3.1, 5.3.2, 5.4.1, 5.4.2, busboy and multer
    documentation); (b) library defaults. Claims SECGAP2-C41 to C45, C47.

    Forces: Containment and bounded cost against defaults of Infinity for file size,
    files and parts.

    Decision: (a), each as a MUST.

    Rejected: (b): the defaults are unbounded; wins under no grounded condition.'
