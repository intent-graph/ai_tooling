- uid: PIG-JS.DEFENSE.ORIGIN.4
  name: Web storage
  intent: Web Storage holds no secrets because every script of the origin reads it,
    and what is read from it or from messages is validated.
  epistemic_state: 'known | unvalidated: validation rule inferred from a T2 finding
    and a T3 catalogue'
  constraints:
