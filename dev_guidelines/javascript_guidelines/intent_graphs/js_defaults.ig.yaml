- uid: PIG-JS.DEFENSE.ORIGIN.2.2
  name: Frame-busting and double clicks
  intent: Frame-busting scripts are not a defence, and a sensitive action behind a
    double click needs server-enforced transaction authorization.
  epistemic_state: 'known | unvalidated: rests on single-source claims only | unvalidated:
    quote not obtained (SECGAP2-C65)'
  constraints:
  - MUST NOT rely on frame-busting JavaScript against clickjacking; simple scripts
    are defeated by double framing, onBeforeUnload manipulation and the sandbox attribute.
  - MUST guard a sensitive double-click action with server-enforced transaction authorization,
    because DoubleClickjacking targets a top-level window where framing restrictions
    do not apply.
  design_notes: 'Judge record:

    Frame-busting and double clicks

    Positions: (a) no frame-busting reliance, server-enforced authorization for sensitive
    double-click actions (OWASP Clickjacking sheet). Claims SECGAP2-C65, C66; (b)
    a frame-busting script.

    Forces: A defence outside the attacker''s frame context against a script inside
    it.

    Decision: (a).

    Rejected: (b): defeated by double framing, onBeforeUnload and the sandbox attribute;
    wins under no condition.

    Rejected beliefs: a frame-busting script stops clickjacking; the script runs inside
    the frame context that the attacker controls (OWASP Clickjacking sheet).'
