- uid: PIG-JS.SUBSET.NUMBERS.4
  name: Integers across JSON
  intent: Integers that exceed the safe range cross JSON as strings or through an
    explicit codec.
  epistemic_state: known
  constraints:
  - MUST transport 64-bit ids as strings, or convert them with an explicit replacer
    and reviver, because JSON.stringify throws a TypeError on a BigInt and JSON.parse
    corrupts integers beyond the safe range.
  design_notes: 'Judge record:

    Positions: ids as strings (LANG-C33, TYPES-C49); explicit replacer and reviver.

    Forces: JSON numbers are parsed to binary64 before any reviver; stringify throws
    on BigInt.

    Decision: strings or an explicit codec; never plain numbers beyond the safe range.

    Rejected: plain JSON numbers for 64-bit ids; wins never.

    Fact [single-source]: JSON.parse throws SyntaxError on invalid JSON and converts
    numbers to JavaScript numbers before any reviver runs, so large integers lose
    precision; transfer them as strings or read context.source.'
