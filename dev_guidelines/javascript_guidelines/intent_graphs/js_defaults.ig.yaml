- uid: PIG-JS.CONTROL.PROCESS.1
  name: Unhandled rejections
  intent: An unhandled rejection is treated as a defect that ends the process in Node
    and is reported in browsers.
  epistemic_state: known
  constraints:
  - 'MUST NOT assume an unhandled rejection only prints a warning in Node: it is raised
    as an uncaught exception by default (mode throw, since Node 15) and can terminate
    the process.'
  - MUST handle unhandled rejections in a browser through the cancelable unhandledrejection
    event on the global scope (window or worker); preventDefault suppresses the console
    report, and cross-origin script rejections do not fire it.
  design_notes: 'Judge record:

    Positions: default throw (ASYNC-C04, RUNTIME-C40; SRC-082, SRC-068, SRC-079);
    browser event (ASYNC-C06; SRC-077, SRC-075); warn-only belief.

    Forces: visible failure against tolerance.

    Decision: rely on the throw default in Node; report through unhandledrejection
    in browsers.

    Rejected: warn-only, true only before Node 15 (SRC-068, history); the non-default
    modes (SRC-079) have no condition named by an admitted source.

    Rejected beliefs: Rejected belief: unhandled rejections only print a warning.
    That was the Node default before Node 15.

