- uid: PIG-JS.DEFENSE.INJECTION.6.4
  name: Node fetch redirect semantics
  intent: Node's fetch is told what to do with a redirect (error when none is expected,
    manual with revalidation otherwise), its automatic header stripping is not relied
    on, and the Node release is kept current.
  epistemic_state: 'known | unvalidated: rests on single-source claims about undici''s
    code and documentation (SECGAP2-C86, C87, C89, C90, C91), read at an unpinned
    commit; Node documents none of it (SRVSEC-C37 open); the strict rule (error, or
    manual with revalidation) is the build''s choice over ASVS ''unless intended'''
  constraints:
  - 'MUST disable redirects in the backend HTTP client, or follow them only when intended
    and revalidate each target, because a redirect lets the remote server choose the
    next destination (ASVS 15.3.2, Level 2); with Node''s fetch, pass redirect: ''error''
    when the destination derives from untrusted input and no redirect is expected,
    and redirect: ''manual'' with revalidation of every Location target when one is,
    because fetch follows redirects by default.'
  - MUST keep the Node release current, because the built-in fetch bundles undici
    (process.versions.undici gives the version) and a Node upgrade is how it is fixed,
    and do not assume redirect header stripping covers every credential header.
  design_notes: 'Judge record:

    Node fetch redirect semantics

    Positions: (a) error when no redirect is expected, manual with revalidation otherwise,
    Node kept current, header stripping not relied on (undici code and advisories,
    MDN values, ASVS 15.3.2, OWASP SSRF); (b) follow redirects automatically. Claims
    SRVSEC-C35 to C37, SECGAP2-C86 to C91.

    Forces: Revalidation of each hop against transparent following; the advisories
    show header stripping has been incomplete.

    Decision: (a). The Fetch Standard gives manual mode an opaque-redirect response
    whose Location cannot be read (SRVSEC-C36), but undici''s code returns the actual
    response (C91), so revalidating every Location target is workable in Node; Node''s
    own pages are silent.

    Rejected: (b): wins only for known-trusted destinations.

    Fact [single-source]: Fact (Fetch Standard, defined for browsers): redirect mode
    error returns a network error on any redirect, manual returns an opaque-redirect
    response whose Location cannot be read, and following stops at 20 redirects.

    Fact [single-source]: Fact (Node globals page): Node''s built-in fetch is based
    upon undici, the bundled undici version is given by process.versions.undici, and
    the page documents no redirect or header-stripping behaviour for fetch.

    Fact [single-source]: Fact (undici main branch, unpinned): the fetch redirect
    step returns a network error at redirect count 20, removes authorization, proxy-authorization,
    cookie and host on a cross-origin redirect, and turns POST on 301 or 302 and any
    method other than GET or HEAD on 303 into GET with a null body.

    Fact [single-source]: Fact (undici documentation): RedirectHandler follows 300,
    301, 302, 303, 307 and 308 up to maxRedirections, does not replay consumed bodies,
    strips headers that refer to the original URL on every hop, and offers stripHeadersOnRedirect,
    stripHeadersOnCrossOriginRedirect (default null) and throwOnMaxRedirect (default
    false); it describes the dispatcher handler, not Node''s global fetch.

    Fact [-]: Fact (three undici advisories, all Low 3.9, dated evidence): CVE-2023-45143,
    fetch did not clear cookie before undici 5.26.2; CVE-2024-24758, fetch did not
    clear Proxy-Authorization up to 5.28.2 and in 6.0.0 to 6.6.0; CVE-2024-30260,
    undici.request, stream, pipeline and dispatch did not clear Proxy-Authorization
    before 5.28.4 and 6.11.1 (the advisory''s impact sentence also names Authorization;
    only Proxy-Authorization is claimed).'
