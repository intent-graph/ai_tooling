- uid: PIG-JS.SUBSET.CONVERSION.4
  name: Explicit conversion
  intent: A conversion is written as a call that names its target type; a conversion
    hidden in an operator is flagged as a readability convention.
  epistemic_state: 'known | unvalidated: positions only, no mechanism evidence | conflict:
    Pradel and Sen (T2, 2015 corpus) found 98.85 percent of implicit coercions likely
    harmless'
  constraints:
  - MUST write conversions explicitly with Boolean(), Number() and String() and flag
    the shorthands !!x, +x and empty-string concatenation with the lint rule no-implicit-coercion;
    state it as a readability convention, never as defect prevention.
  - 'Acceptable only when a team adopts it as a convention completing the explicit-conversion
    rule: never call new on Boolean, Number, String or Symbol, call them as functions
    to coerce (Google JS guide position, demoted from evidence).'
  - 'Acceptable only when a team does not adopt the lint rule: the shorthands, because
    the only measurement (Pradel and Sen, 2015 corpus) finds 98.85 percent of implicit
    coercions likely harmless; this is evidence of rarity of harm, never a rule.'
  design_notes: 'Judge record:

    Positions: forbid shorthands with the lint rule (SRC-003, Google, Airbnb); allow
    them (Pradel and Sen: harm rare).

    Forces: conversion visible at the site versus a measured low defect rate; the
    rule is readability, not defect prevention.

    Decision: explicit Boolean(), Number(), String() and no-implicit-coercion, stated
    as a readability convention with no defect claim. Max rule on predictability of
    reading.

    Rejected: allowing shorthands; wins where a team does not adopt the rule. Grounds
    are positions only, flagged for review.

    Fact [single-source]: The + operator turns an uninitialised variable into the
    text undefined when combined with a string, a rare and almost always unintended
    coercion (DLint evidence of occurrence on 2015 sites).

    Sources cited: SRC-003'
