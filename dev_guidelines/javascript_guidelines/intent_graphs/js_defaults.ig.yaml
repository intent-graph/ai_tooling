- uid: PIG-JS.DEFENSE.SECRETS.2
  name: Cryptographic APIs and tokens
  intent: 'SubtleCrypto designs are reviewed by a knowledgeable person, encryption
    uses authenticated modes, and a token is accepted only on the verifier''s terms:
    its algorithm, keys, issuer and audience are fixed by the verifier, never chosen
    by the token.'
  epistemic_state: 'known | unvalidated: single T1 source; Node crypto page truncated
    in every fetch | unvalidated: authenticated-encryption rule rests on one source
    (OWASP), restricted to principles'
  constraints:
  - MUST treat SubtleCrypto as a low-level toolkit that is easy to misuse; have a
    knowledgeable person review any design that uses it before claiming it is secure.
  - MUST use authenticated encryption modes only (AES in GCM or CCM, key of at least
    256 bits); the advice rests on one source, OWASP, restricted to principles.
  design_notes: 'Judge record:

    Cryptographic APIs and tokens

    Positions: Review of SubtleCrypto designs (MDN); authenticated mode (OWASP only).
    Claims SRVSEC-C12, C13, C14.

    Forces: Safety against developer discretion on low-level crypto.

    Decision: Have a knowledgeable person review any SubtleCrypto design; encrypt
