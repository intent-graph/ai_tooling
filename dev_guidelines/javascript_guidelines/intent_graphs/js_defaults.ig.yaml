    a measurement shows that maximal time or memory-allocation performance is required,
    as the Node.js docs advise.
  design_notes: 'Judge record:

    Positions: (a) callback file APIs where maximal time and memory-allocation performance
    is required, promises otherwise (RUNTIME-C16, SRC-188 T1); (b) implicit: callbacks
    everywhere for speed.

    Forces: (a) keeps the promise style that CONTROL favours, pays only on a need;
    (b) lowest overhead, loses the shared async style.

