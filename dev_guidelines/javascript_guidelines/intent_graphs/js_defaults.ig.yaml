- uid: PIG-JS.DEFENSE.SECRETS.5
  name: Secret handling
  intent: Secrets stay out of code, environment variables are a weaker fallback, and
    detection and rotation are routine.
  epistemic_state: 'known | unvalidated: source says consider (secrets detection at
    the developer level); SHOULD is the reading the source supports; rotation has
    no quote of its own, single source'
  constraints:
  - SHOULD run secret detection before commit (IDE, test cycle or pre-commit hook)
    and rotate secrets regularly; the source says consider enabling detection, rotation
    has no quote of its own, and no JavaScript-specific tooling is grounded.
  - 'Acceptable only when no dedicated secrets mechanism is possible: environment
    variables, a weaker channel that every module in the process can read. Belief
    restricted: environment variables are a safe place for secrets.'
  design_notes: 'Judge record:

    Secret handling

    Positions: No hardcoded secrets (OWASP, NDSS 2019 evidence) with environment variables
    as a weaker fallback. Claims RUNSEC-C47, C48.

    Forces: Safety against operational convenience.

    Decision: Secrets from a dedicated mechanism; environment variables only when
    nothing else is possible; SHOULD detect before commit; SHOULD rotate regularly.

    Rejected: Environment variables as safe store: refuted as restricted by OWASP
    and by the Node threat model. MUST for detection and rotation: best for a repository
    that can become public or holds production credentials (inferred).

    Re-judged under best (RELAX): OWASP says consider enabling detection, and the
    rotation half has no quote of its own and lies outside the register''s listed
    scope for that source (no hardcoded secrets, environment variables as the weaker
    option, pre-commit detection); a MUST was the build''s choice. SHOULD is what
    the source supports.'
