- uid: PIG-JS.DEFENSE.ORIGIN.6.1
  name: Primary defence
  intent: 'At least one primary defence stands: a synchronizer or signed double-submit
    token (unique per session, random, kept out of URLs and logs, compared in constant
    time) or a Sec-Fetch-Site check with an Origin or Referer fallback; the token
    is preferred, with the other layered behind it, where browsers may not send the
    header.'
  epistemic_state: 'known | unvalidated: the preference for the token and the layering
    behind it go beyond both sources, which list a Fetch Metadata check among the
    primary defences (OWASP, MDN) and require no token beside it; the acceptable-when
    row is the build''s judgment about the condition and has no claim of its own'
  constraints:
  - 'MUST protect every state-changing request that authenticated cookies can trigger
    with at least one primary CSRF defence: a synchronizer token or a signed double-submit
    cookie bound to the session, or a Sec-Fetch-Site check with an Origin or Referer
    fallback; prefer the token where the application serves browsers that may not
    send the header, and layer the second defence behind it.'
  - 'MUST apply the Sec-Fetch-Site check, wherever it is used (as the primary defence
    or as a layer behind the token), as follows: allow a state-changing request only
    when it is same-origin (same-site only where the threat model trusts sibling subdomains),
    otherwise leave state unchanged, and keep an Origin or Referer check for browsers
    that do not send the header.'
  - MUST compare CSRF tokens with a constant-time function.
  - MUST make a synchronizer CSRF token unique per user session, secret and unpredictable
    (a large random value from a secure method), and never let it appear in a URL
    or a server log; do not carry it in a GET request.
  - 'Acceptable only when every browser the application supports sends Sec-Fetch-Site:
    a Sec-Fetch-Site check without the Origin or Referer fallback (inferred condition,
    no admitted source states it).'
  design_notes: 'Judge record:

    Primary defence

    Positions: OWASP and MDN both list a Fetch Metadata check among the primary CSRF
    defences (OWASP: its own section beside token-based mitigation, before the defence
    in depth techniques; MDN: the third primary-defence bullet); neither says it suffices
    alone and neither requires a token beside it. OWASP allows same-site only where
    sibling subdomains are trusted and makes the Origin or Referer fallback mandatory
    for browsers without the header. Claims SECGAP2-C55, C56, C58, C69, C92.

    Forces: Independence from browser support against one fewer mechanism.

    Decision: at least one primary defence, the floor both sources set: a synchronizer
    or signed double-submit token bound to the session, or a Sec-Fetch-Site check
    (same-origin, same-site only when the threat model trusts sibling subdomains)
    with an Origin or Referer fallback; the token is preferred, with the other defence
    layered behind it, where browsers may not send the header; tokens unique per session,
    random, never in a URL, a GET request or a log, compared in constant time. The
    preference goes beyond both sources, flagged in epistemic_state.

    Rejected: a token required beside every Sec-Fetch-Site check (the build''s former
    choice, stricter than both sources, which list the check as a primary defence):
    best where the application serves browsers that may not send the header or protects
    high-value actions (inferred). A Sec-Fetch-Site check without the Origin or Referer
    fallback: kept as acceptable-when every supported browser sends the header, a
    build judgment about the condition.

    Re-judged under best (RELAX): both sources and the consensus claims (SECGAP2-C55,
    C56, C69) establish the floor: one primary defence, a Fetch Metadata check being
    one of them, with the Origin or Referer fallback for browsers without the header.
    That the token must be primary and the check only a layer is the build''s own
    and no source says it; a token works whatever the browser sends, which makes it
    the better first choice where the browser population is unknown, so it stays as
    a preference with the layering.

    Fact [consensus]: Fact (OWASP CSRF sheet, MDN): both list a Fetch Metadata check
    among the primary CSRF defences, not as defence in depth, and neither says it
    suffices alone; neither requires a token beside it, so the token as required primary
    defence was the build''s stricter choice and is now a preference.'
  impl_pointers:
  - build/research/14_secgap2/result.md::SECGAP2-C55
  - build/research/14_secgap2/result.md::SECGAP2-C56
  - build/research/14_secgap2/result.md::SECGAP2-C58
  - build/research/14_secgap2/result.md::SECGAP2-C69
