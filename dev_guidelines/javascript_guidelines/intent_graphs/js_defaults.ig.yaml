- uid: PIG-JS.CONTRACTS.LAYER.2
  name: JSDoc-checked JavaScript as the no-compile-step fallback
  intent: Where no compile step can exist, check JavaScript with the same compiler
    through JSDoc, naming its weaker guarantees
  epistemic_state: 'known | unvalidated: no admitted advocate; TypeScript 7.0 facts
    are vendor facts'
  constraints:
  - 'MUST check JavaScript with TypeScript where no compile step exists: enable checkJs
    for the project (or ts-check per file), types coming from JSDoc.'
  design_notes: 'Judge record:

    Positions: checkJs project-wide; ts-check per file (TYPES-C39). Forces: project-wide
    checking leaves no unchecked file; per-file allows gradual adoption. Decision:
    checkJs for the project, with the 7.0-safe tag set. Rejected: per-file ts-check
    wins during an incremental migration of an existing code base (inferred condition).

    Fact [single-source]: Checked JavaScript is weaker than TypeScript: object literals
    are open-ended, all parameters optional, null undefined and empty-array initialisers
    type as any even under strict null checks (TypeScript up to 6.x)

    Fact [single-source]: JSDoc type tags do not import at run time and tags the handbook
    does not list (for example async) are ignored, so a silent no-op is possible

    Fact [consensus]: TypeScript 7.0 no longer specially recognises enum tags, Closure-style
    function types, a standalone question mark and postfix bang in JSDoc, and its
    JSDoc inference is intentionally incomplete (vendor facts; the advice to avoid
    them is inferred)'
