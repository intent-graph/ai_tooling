- uid: PIG-JS.SUBSET.EVOLUTION.3
  name: No legacy syntax
  intent: Syntax that strict mode forbids or that blocks reasoning about names is
    not written.
  epistemic_state: known
  constraints:
  - 'MUST avoid legacy octal syntax: a 0-prefixed octal literal is a SyntaxError in
    strict mode and octal escape sequences are deprecated; write 0o, 0x and 0b prefixes.'
  - 'MUST NOT use the with statement: name resolution inside it is unknowable before
    runtime, it blocks optimisation and it is a SyntaxError in strict mode; use destructuring
    or a temporary variable.'
  design_notes: 'Judge record:

    Positions: no legacy octal, no with (LANG-C24, C46).

