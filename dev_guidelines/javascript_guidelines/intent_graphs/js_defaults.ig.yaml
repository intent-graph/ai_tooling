- uid: PIG-JS.SUBSET.OBJECTS.4
  name: Accessor properties
  intent: 'A property read costs nothing and changes nothing: an accessor is only
    a cheap view of stored state; behaviour that does work is an explicit method call.'
  epistemic_state: 'known | unvalidated: holder position only (Google JS, which bans
    accessors outright); the narrow form is the reading its reason supports, the boundary
    is inferred'
  constraints:
  - MUST limit accessor properties to cheap, side-effect-free views of stored state
    on a data-like object; behaviour that does work (computation, input or output,
    change of other state) is an ordinary method, because a property read that runs
    code hides its cost and side effects. Ground is one style-guide position (Google
    JS, which bans accessors outright) and the reason it gives; the narrow form is
    the part that reason supports, and its boundary is inferred. The compiler-support
    reason of the guide is a tooling point and is not carried.
  - 'Acceptable only when a team wants a rule that needs no judgment of cost: no getter
    or setter properties at all, methods only (Google JS guide position, the stricter
    form; inferred condition, no admitted source states it).'
  design_notes: 'Judge record:

    Positions: no accessor properties, use methods (STRUCT-C46, Google JS, position
    only); accessors allowed (implicit, no holder).

    Forces: a property read that runs code hides cost and side effects from the reader,
    which is the predictability purpose; cost is a call-style API.

    Decision: accessor properties only as cheap, side-effect-free views of stored
    state on a data-like object; behaviour that does work is a method.

    Rejected: no accessors at all (Google JS, the stricter form); would win where
    a team wants a rule a linter checks without judging cost (inferred condition).
    Accessors that do work: never, they hide cost and side effects. Grounds are one
    position, flagged for review.

    Re-judged under best (RELAX): the one ground is Google''s position and the reason
    it gives, that a property read which runs code is surprising. That reason supports
    limiting accessors that do work, not banning a cheap read of stored state, which
    hides nothing. The narrow form is what the reason supports; the ban is mechanically
    checkable and the narrow form needs judgment, which is why the ban stays as acceptable-when.
    Inferred boundary, one holder.'
  impl_pointers:
  - build/research/04_struct/result.md::STRUCT-C46
