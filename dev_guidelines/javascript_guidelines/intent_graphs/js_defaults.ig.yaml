    exception is inferred'
  constraints:
  - MUST declare object types by interface rather than type alias, because an interface
    can be extended and re-opened and an alias cannot (Google TS position, used as
    a position and not as evidence); const enum is already excluded by LAYER.4.
  design_notes: 'Judge record:

    Positions: interface for object types (Google TS guide, SRC-244, position; handbook
    fact: interfaces extend and re-open, aliases do not, SRC-043); type alias (no
    admitted holder). Forces: extension and re-opening keep one named shape across
    declarations, at the cost of accidental declaration merging (inferred). Decision:
    interface for object types; alias for unions, tuples, mapped and other forms an
    interface cannot express (inferred). Rejected: alias everywhere wins where accidental
    merging must be impossible (inferred). The restriction (position only) is respected:
    the position is used to choose among positions, not as evidence of a defect class.
    Re-judged under best (KEEP): one position (Google TS), no admitted dissent, and
    a handbook fact that interfaces extend and re-open. Not a strict-versus-lenient
    choice: the rule already sends unions, tuples and mapped types to aliases. No
    argument in the evidence shows either form checks better, so the sole ranking
    stands as the default; weak, flagged. It would reverse on an admitted source showing
    that accidental declaration merging causes defects (the rejected condition).

