- uid: PIG-JS.DEPENDENCIES.UPDATE.1
  name: Release-age cooldown
  intent: A freshly published version is not installed at once, while security fixes
    are never delayed.
  epistemic_state: 'known | gap: effectiveness unmeasured; claim relabelled single-source
    | unvalidated: rests on single-source claims only'
  constraints:
  - MUST enable a release-age cooldown where the tool has one (npm min-release-age
    from v11.10.0, pnpm minimumReleaseAge default 1440 minutes, Dependabot cooldown
    default 3 days) so fresh versions are not installed at once, and keep security
    updates outside the cooldown.
  design_notes: 'Judge record:

    Positions: (a) no cooldown, adopt versions at once; (b) tool-default cooldown:
    SUPPLY-C12 (T1 assertion SRC-078 §Mitigations; tool facts SRC-152, SRC-158, SRC-146)
    with security updates exempt (SUPPLY-C14); (c) a three-day cooldown as an OpenSSF
    position (QUALITY-C46, origin missing); (d) a longer custom duration: no source.

    Forces: Exposure window to a freshly hijacked release against lag in receiving
    fixes; effect unmeasured (SUPPLY-C13: one T1 assertion plus vendor figures from
    SRC-319).

    Decision: (b), with security updates outside the cooldown. The max rule picks
    the more demanding delay; the length stays at the tool default because (d) has
    no source (undecided child UPDATE.1.1). SUPPLY-C12''s ''consensus'' label is relabelled
    single-source. Grounds: one T1 assertion.

    Rejected: (a): wins for a version that fixes an exploited vulnerability, which
    is the security-update exemption. (c): not rejected as the body''s position, but
    its effectiveness claim is not used as evidence until the origin is found. (d):
    undecided.

    Sources cited: SRC-078, SRC-146, SRC-152, SRC-158, SRC-319'
