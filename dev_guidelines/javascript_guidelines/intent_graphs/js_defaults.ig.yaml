- uid: PIG-JS.DEFENSE.DOM.3
  name: Sanitizing HTML
  intent: Untrusted HTML that must be rendered goes through the native Sanitizer API
    where available, otherwise a reputable library, immediately before insertion and
    never modified afterwards.
  epistemic_state: 'known | conflict: library-first sanitizing, OWASP and MDN naming
    DOMPurify | unvalidated: advice to keep the sanitizer current is inferred'
  constraints:
  - MUST prefer Element.setHTML (Sanitizer API) to innerHTML when injecting untrusted
    HTML; keep a fallback while availability is limited.
  - 'MUST treat setHTMLUnsafe and the other Unsafe-suffixed methods as injection sinks:
    they sanitize nothing by default and are less safe than innerHTML; pass TrustedHTML.'
  - MUST NOT modify sanitized HTML afterwards; sanitize last, immediately before insertion.
  - 'Acceptable only when the native Sanitizer API is unavailable: sanitize with a
    reputable library, not hand-written code (OWASP names DOMPurify; the OWASP and
    MDN grounds are not independent, and the preference is OWASP''s position, not
    the library''s).'
  design_notes: 'Judge record:

    Sanitizing HTML

    Positions: Native setHTML (MDN, HTML Standard) against sanitizer library (OWASP
    names DOMPurify) against hand-written filters. Claims DOMSEC-C08, C09, C11, C12,
    C14, C23.

    Forces: Safety against availability: setHTML is limited-availability, a library
    is a security-critical dependency with a bypass history.

    Decision: setHTML where available, a reputable library as fallback, sanitize last,
    never modify afterwards, treat Unsafe-suffixed methods as sinks.

    Rejected: Library-first: wins where the target browsers lack setHTML, which is
    the stated condition for the fallback. Hand-written sanitizing: rejected by OWASP
    as hard to get right.

    Fact [single-source]: Fact: the sanitizer''s own advisory list shows repeated
    bypasses (10 advisories May to Oct 2026 on the first page, one High) and older
    jsdom is buggy server-side. Demoted to fact: the sources are restricted to facts,
    so the advice to keep it current stays an inference (inferred), noted here and
    not a decision.

    Fact [consensus]: Facts: a Trusted Types createHTML callback may wrap a vetted
    sanitizer, and DOMPurify can return TrustedHTML through RETURN_TRUSTED_TYPE; neither
    source grounds a preference for DOMPurify.'
