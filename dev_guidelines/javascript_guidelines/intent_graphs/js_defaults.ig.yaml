- uid: PIG-JS.VERIFICATION.LINT.1.1
  name: Config file and scoping
  intent: One flat configuration file at the project root, with rules scoped to files
    and ordered general to specific.
  epistemic_state: 'known | unvalidated: rests on single-source claims only'
  constraints:
  - MUST configure ESLint with a flat-config file eslint.config.js (or .mjs or .cjs)
    at the project root exporting an array of configuration objects; scope rules with
    files and ignores, and order objects from general to specific because later matching
    objects win.
  design_notes: 'Judge record:

    Positions: flat config at the root, `files` and `ignores`, later objects win (QUALITY-C01,
    C02; SRC-166). No competing position in admitted sources; the legacy eslintrc
    format is named only as not relied on (QUALITY-C28 note).

    Forces: predictability of what runs on which file (merge order is deterministic)
    against nothing; cost is one migration for old projects.

    Decision: one `eslint.config.js` (or .mjs or .cjs) at the root exporting an array,
    general objects first.

    Rejected: the legacy eslintrc format, because the admitted page documents only
    the flat format as current; it would win for a code base pinned to an ESLint version
    that predates flat config (condition inferred, no source).

    Sources cited: SRC-166'
  impl_pointers:
  - build/research/08_quality/result.md::QUALITY-C01
  - build/research/08_quality/result.md::QUALITY-C02
