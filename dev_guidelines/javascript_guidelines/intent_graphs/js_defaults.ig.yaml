- uid: PIG-JS.DEFENSE.INJECTION.6.2
  name: Connection to the validated address
  intent: The address is resolved once, checked, and connected to; DNS rebinding is
    the attack this closes.
  epistemic_state: 'known | unvalidated: pinned-connection recipe inferred from three
    rows | unvalidated: rests on single-source claims only'
  constraints:
  - MUST resolve the host name once with dns.resolve() or a custom lookup, check the
    address, and connect to that address, because Node networking APIs resolve names
    themselves with dns.lookup(); the pinned-connection recipe is a synthesis of three
    Node and OWASP rows (inferred).
  design_notes: 'Judge record:

    Connection to the validated address

    Positions: Resolve once, validate, connect to that address (OWASP SSRF, Node dns
    and net docs). Claims SRVSEC-C33, C34, C39.

    Forces: Rebinding resistance against code simplicity.

    Decision: Resolve to an address, check it, connect to the address.

    Rejected: Hostname check alone: refuted by DNS rebinding.

    Fact [single-source]: Fact: net.BlockList holds rules disabling inbound or outbound
    access to IP addresses, ranges and subnets, with check(); the blockList option
    of socket.connect() disables outbound TCP to them (added v15.0.0 and v14.18.0);
    its use as an SSRF deny-list is inferred.

    Fact [consensus]: Fact: DNS rebinding lets a page controlling a site and its DNS
    server present a local IP as its origin and bypass the same-origin policy; Node''s
    page frames the target as the debugging inspector.'
