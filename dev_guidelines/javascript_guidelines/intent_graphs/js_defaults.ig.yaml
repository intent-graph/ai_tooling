- uid: PIG-JS.DEFENSE.DOM.5
  name: DOM clobbering
  intent: Application state never lives on window or document, named-property reads
    are type-checked, and sanitizers neutralize id and name.
  epistemic_state: known
  constraints:
  - MUST check the type of document and window properties before sensitive use (instanceof)
    and declare variables explicitly.
  - MUST NOT store application globals on window or document; use local const and
    let variables and object properties.
  - MUST neutralize id and name attributes when sanitizing (DOMPurify SANITIZE_NAMED_PROPS,
    or Sanitizer removeAttribute); quoted as OWASP's advice, not a DOMPurify preference.
  design_notes: 'Judge record:

    DOM clobbering

    Positions: Local variables and type checks (OWASP clobbering sheet, ASVS 3.2.3)
    against globals on window. Claims DOMSEC-C49, C50, C51.

    Forces: Safety against the habit of globals.

    Decision: No globals on window or document, instanceof checks, neutralize id and
    name when sanitizing.

    Rejected: Globals on window: wins nowhere once untrusted HTML is possible.

