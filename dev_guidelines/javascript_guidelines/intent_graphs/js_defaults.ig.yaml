- uid: PIG-JS.STRUCTURE.LOADING.4
  name: Top-level await confined to entry points
  intent: Use top-level await only where no other module imports or requires the file,
    because it makes every importer wait.
  epistemic_state: 'known | conflict: top-level await is acceptable anywhere, champions
    in the TC39 proposal (education suffices) | unvalidated: scope of the rule inferred
    from the mechanism, no measurement of the hazard'
  constraints:
  - MUST use top-level await only in application entry points, never in a module that
    others import or that may be require()d; the proposal record shows critics (coordination
    and deadlock surprises) against champions (education suffices), and no source
    measures the hazard.
  design_notes: 'Judge record:

    Positions: Entry-point-only top-level await (STRUCT-C19, STRUCT-C18, LANG-C63;
    SRC-092, SRC-030, SRC-029) against top-level await anywhere (champions Borins
    and Startsev)

    Forces: An await in a shared module makes every importer asynchronous, so a leaf
    change spreads upward; entry points have no importers

    Decision: Entry points only

    Rejected: Anywhere: wins if a measurement shows the coordination hazard is negligible,
    or in scripts that nothing imports

    Fact [consensus]: A module with top-level await is an asynchronous dependency:
    every importer''s body waits for it, siblings are not blocked, and a never-resolving
    await ends a Node process with status 13.

    Sources cited: SRC-029, SRC-030, SRC-092'
