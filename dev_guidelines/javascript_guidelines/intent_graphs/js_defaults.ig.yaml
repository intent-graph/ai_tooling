  name: Owned scope for internal packages
  intent: Internal package names cannot be shadowed by a public package.
  epistemic_state: 'known | unvalidated: rests on single-source claims only'
  constraints:
  - MUST publish internal packages under an owned scope and route that scope to the
    private registry in .npmrc, so a public package cannot shadow an internal name.
  design_notes: 'Judge record:

