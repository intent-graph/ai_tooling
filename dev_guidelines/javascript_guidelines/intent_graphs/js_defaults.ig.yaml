- uid: PIG-JS.DEFENSE.SECRETS.2.2
  name: Token library settings
  intent: 'The JavaScript token libraries accept more than the policy allows unless
    told otherwise: the verify call gets an explicit algorithm list, the library is
    current, and decoding is never verification.'
  epistemic_state: 'known | unvalidated: rests on claims marked inferred or open (SECGAP2-C11,
    SECGAP2-C14)'
  constraints:
  - MUST run jsonwebtoken 9.0.0 or later and do not set allowInvalidAsymmetricKeyTypes.
  - MUST pass an explicit algorithms option to jsonwebtoken verify.
  - 'MUST NOT use jsonwebtoken decode on untrusted tokens as if it were verification:
    it does not check the signature.'
  - MUST pass algorithms to jose jwtVerify so the accepted set is the one the application
    chose.
  design_notes: 'Judge record:

    Token library settings

    Positions: (a) pass an explicit algorithms list to jsonwebtoken verify and to
    jose jwtVerify; (b) rely on the per-key-type default (jsonwebtoken) or all algorithms
    applicable to the key (jose). Claims SECGAP2-C10 to C14.

    Forces: The caller-fixed allowlist rule of the node above against less code.

    Decision: (a); jsonwebtoken 9.0.0 or later; decode is never verification. C11
    and C14 are inferred from the library defaults plus the allowlist rule, since
    no source tells the caller to always pass the option.

    Rejected: (b): wins only where the key type already fixes the single algorithm
    the application intends.

    Rejected beliefs: reading a decoded JWT payload is safe without verifying it;
    decode only parses (jsonwebtoken documentation).

    Fact [single-source]: Fact (jose v6 documentation): in jwtVerify the algorithms
    option is optional and defaults to all algorithms applicable to the key, alg none
    is never accepted, and the issuer and audience options require the claim to be
    present.

    Fact [-]: Fact (jsonwebtoken and jose documentation): allowInvalidAsymmetricKeyTypes
    exists only for backwards compatibility; when algorithms is omitted, jsonwebtoken
    accepts the set that follows the key type and jose jwtVerify accepts all algorithms
    applicable to the key. That passing algorithms is therefore needed is inferred
    from the caller-fixed allowlist rule.'
