  name: Connection-specific fields
  intent: HTTP/2 and HTTP/3 requests are accepted only without CR, LF or CRLF in fields
    and without connection-specific fields.
  epistemic_state: 'known | unvalidated: rests on single-source claims only'
  constraints:
