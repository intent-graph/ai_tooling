- uid: PIG-JS.DEFENSE.SECRETS.4
  name: Constant-time comparison
  intent: Secrets are compared with timingSafeEqual on equal-length digests; no hand-written
    constant-time code, no BigInt for crypto.
  epistemic_state: 'known | unvalidated: Node crypto text read in v6 docs only; the
    current timingSafeEqual entry could not be re-read (page truncated in every fetch,
    browser tool did not answer) | unvalidated: rests on claims marked inferred or
    open (SRVSEC-C14)'
  constraints:
  - 'MUST compare secrets, MACs and tokens with crypto.timingSafeEqual(), not with
    ===, == or startsWith: ordinary comparison time depends on the content.'
  - MUST give timingSafeEqual() inputs of equal byte length; it throws on unequal
    lengths, so compare fixed-length digests of both values rather than returning
    early (the hashing is inferred, the length rule is read in the v6 docs only).
  - 'MUST NOT assume surrounding code is constant-time because timingSafeEqual() was
    used: branches, early returns and length checks around it can leak timing.'
  - MUST NOT hand-write constant-time algorithms in JavaScript (the JIT can reintroduce
    data-dependent timing); use the built-in crypto APIs, or WebAssembly for algorithms
    Node lacks natively.
  - MUST avoid branching on secrets, and avoid using a secret as an index into memory
    when the attacker may share the machine.
  - 'MUST NOT use BigInt for cryptographic arithmetic on secrets: its operations are
    not constant-time.'
  design_notes: 'Judge record:

    Constant-time comparison

    Positions: timingSafeEqual on equal-length digests (Node docs, ASVS 11.2.4, CWE-208)
    against === comparison. Claims SRVSEC-C05 to C09, LANG-C34.

    Forces: Side-channel resistance against code simplicity.

    Decision: Use the built-in constant-time comparison and keep surrounding code
    branch-free on secrets; no hand-written constant-time JavaScript.

    Rejected: Ordinary comparison: leaks through timing.

    Fact [single-source]: Open: the current Node documentation for timingSafeEqual
    (version added, error class on unequal lengths) and for randomBytes, randomInt,
    randomUUID is not grounded; the crypto page is truncated in every fetch and v6
    and v12 digests disagree on the added version.'
