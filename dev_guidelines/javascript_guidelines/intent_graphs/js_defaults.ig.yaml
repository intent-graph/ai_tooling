- uid: PIG-JS.CONTROL.BOUNDS.1
  name: Abort signals
  intent: Cancellable operations accept a signal, check it first, reject with its
    reason, and use one controller per operation.
  epistemic_state: 'known | unvalidated: single T1 source for the pipeline signal'
  constraints:
  - 'MUST design cancellable async APIs to accept an AbortSignal option and, on abort,
    reject any unsettled promise with the signal''s reason (W3C TAG position: Promises
    for one-shot operations, cancelled with AbortSignal).'
  - MUST start such an API with signal.throwIfAborted() so an already aborted signal
    rejects at once.
  - 'MUST create a new AbortController per operation: an AbortSignal is one-shot,
    once aborted it stays aborted and the abort event fires once.'
  - MUST pass an AbortSignal as the last option to pipeline to cancel a transfer;
    abort destroys the pipeline with an AbortError.
  design_notes: 'Judge record:

    Positions: signal option rejecting with reason (ASYNC-C26, STRUCT-C53; SRC-057,
    SRC-055, SRC-066, SRC-261); throwIfAborted first (ASYNC-C27; SRC-055, SRC-066);
    one controller per operation (ASYNC-C29; SRC-055, SRC-066); signal to pipeline
    (RUNTIME-C06; SRC-196).

    Forces: a single platform primitive for cancellation against ad hoc tokens.

    Decision: AbortSignal everywhere cancellation is offered, with the four rules.

    Rejected: reusing one aborted controller, the signal is one-shot; assuming promises
    cancel (see CONTROL.BOUNDS).

    Sources cited: SRC-055, SRC-057, SRC-066, SRC-196, SRC-261'
