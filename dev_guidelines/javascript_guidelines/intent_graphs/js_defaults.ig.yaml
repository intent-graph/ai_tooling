- uid: PIG-JS.DEFENSE.DOM.6.1
  name: Escape hatches
  intent: Escape hatches of a framework are treated as sinks needing sanitized input;
    the per-framework documentation facts are recorded here.
  epistemic_state: known
  constraints:
  - MUST rely on framework default output encoding and treat every documented escape
    hatch of the framework in use as a sink that needs sanitized input.
  design_notes: 'Judge record:

    Escape hatches

    Positions: Default encoding plus escape hatches as sinks (OWASP XSS sheet, consensus).
    Claims DOMSEC-C55, FW-C02.

    Forces: Safety against framework convenience.

    Decision: Treat every documented escape hatch as a sink that receives sanitized
    input.

    Rejected: Framework output as safe in all paths: refuted by the hatches the framework
    documentation itself names.

    Fact [single-source]: Escape hatches by framework (dated evidence, framework documentation):
    React dangerouslySetInnerHTML, Angular bypassSecurityTrust, Lit unsafeHTML, Vue
    v-html, Svelte @html.

    Fact [single-source]: Fact (Angular docs): bypassSecurityTrust methods mark a
    value as trusted and skip sanitization; calling them on a possibly malicious value
    introduces a vulnerability.

    Fact [single-source]: Fact (React docs): dangerouslySetInnerHTML sets markup like
    innerHTML, so script-bearing markup executes; use it only with trusted and sanitized
    data.

    Fact [single-source]: Fact (Svelte docs): @html output is not escaped; escape
    it or populate it only with values under your control.

    Fact [single-source]: Fact (Vue docs): untrusted content is never a component
    template, and Vue is never mounted on nodes that may contain server-rendered user
    content.

    Fact [single-source]: Fact (Vue docs): v-html, user-provided URLs, styles and
    JavaScript in event attributes are unsafe unless sanitized; user-controlled HTML
    or CSS belongs in a sandboxed iframe.

    Fact [single-source]: Fact (Vue docs): XSS through user-supplied templates is
    not a Vue vulnerability, so the duty lies on application code.'
  impl_pointers:
  - build/research/05_domsec/result.md::DOMSEC-C55
