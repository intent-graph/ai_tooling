- uid: PIG-JS.DEFENSE.ORIGIN.6.3
  name: SameSite and CSRF libraries
  intent: SameSite is defence in depth set per cookie purpose, and csurf is not adopted
    for new code.
  epistemic_state: 'known | unvalidated: the csurf rule rests on a facts-only source
    (the repository archive notice) and is inferred; the Express blog wording was
    not re-confirmed (SECGAP2-C62)'
  constraints:
  - MUST use SameSite as defence in depth, set per cookie purpose, and do not rely
    on Lax for protection against anything but unsafe methods.
  - 'MUST NOT use csurf for new Express code: the repository is archived and read-only
    with no replacement named, and the Express Technical Committee calls it long difficult
    to maintain and better handled through frameworks or custom implementations.'
  design_notes: 'Judge record:

    SameSite and CSRF libraries

    Positions: (a) SameSite as depth, per cookie purpose; csurf not for new code (archive
    notice, Express blog); (b) SameSite Lax as the defence; (c) csurf. Claims SECGAP2-C61,
    C62.

    Forces: Defence in depth against reliance on one cookie attribute; a maintained
    dependency against an archived one.

    Decision: (a).

