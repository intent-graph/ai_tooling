- uid: PIG-JS.SUBSET.STRICTNESS.3
  name: Fixed bindings by default
  intent: A binding is fixed unless the code reassigns it, and a fixed binding is
    not mistaken for an immutable value.
  epistemic_state: known
  constraints:
  - MUST declare with const by default and use let only for variables that are reassigned.
  design_notes: 'Judge record:

    Positions: const by default (LANG-C36); let everywhere; belief that const means
    constant value (LANG-C35).

    Forces: a fixed binding states intent at the declaration; cost none.

    Decision: const unless reassigned.

    Rejected: let-by-default (no ground); the belief, refuted by MDN.

    Rejected beliefs: const makes a value constant. It fixes only the binding (MDN
    const and Object.freeze pages; folklore audit, refuted).

    Fact [consensus]: const makes the binding immutable, not the value: a const object
    or array can still be mutated.'
