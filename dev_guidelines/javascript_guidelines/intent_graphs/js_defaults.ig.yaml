- uid: PIG-JS.DEPENDENCIES.FRAMEWORK_EVIDENCE.1
  name: Support window
  intent: Whether a framework states which versions receive security fixes, and until
    when.
  epistemic_state: 'known | conflict: main htmx docs site documents 2.x as current
    (SRC-213) | unvalidated: htmx 4.0.0 release date open | gap: Svelte, Solid and
    Vue state no support window'
  constraints:
  - MUST pin the framework major to one its policy lists as supported and read the
    documentation set of that major; for a new adoption take the newest supported
    major.
  design_notes: 'Judge record:

    Positions: (a) the main htmx docs site documents 2.x (2.0.11): SRC-213; (b) the
    security policy and release page show 4.x current with 2.x and 1.9.x supported:
    SRC-212, SRC-214 (FW-C21, FW-C22).

    Forces: Newest supported major gets fixes longest; docs lag the release line.

    Decision: Pin a supported major and read its own documentation set; a new adoption
    takes the newest supported major (4.x). Mechanism is not contested, only documentation
    currency (the dissent audit). 4.0.0 release date is open.

    Rejected: (a) as the current line: wins for an existing project already on 2.x,
    while 2.x stays on the supported list. 1.9.x: same condition.

    Fact [single-source]: Dated evidence (htmx): its policy lists 4.x, 2.x and 1.9.x
    as supported and versions below 1.9 as unsupported, while the main docs site documents
    2.x and the policy and release page show 4.x.

    Fact [single-source]: Angular supports each major for about 24 months (12 active,
    12 LTS with critical and security fixes only); from v22 a major ships every 12
    months and deprecated APIs stay at least one major.

    Fact [single-source]: React follows semantic versioning on the Latest channel
    and backports security fixes to every affected major; no LTS programme is stated.

    Fact [single-source]: Svelte''s security policy states no supported-versions statement
    and the pages read give no other support policy.

    Fact [single-source]: Lit provides security updates for the latest two major versions
    and follows a 90-day disclosure deadline.

    Fact [single-source]: Solid''s security page states no supported versions; its
    process is email reporting with an embargo limited to core and security teams.

    Fact [single-source]: Open: no source states a release or support policy for Solid
    beyond the absence in FW-C29; only Angular, React, Vue, Lit and htmx state anything
    on versions.

    Sources cited: SRC-212, SRC-213, SRC-214'
