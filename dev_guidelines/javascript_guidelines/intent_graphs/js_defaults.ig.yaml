- uid: PIG-JS.DEPENDENCIES.FRAMEWORK_SHORTLIST.1
  name: Platform baseline
  intent: Framework-free components are the default and the first candidate.
  epistemic_state: 'known | unvalidated: the platform-first default is inferred from
    SUPPLY-C27 (ask first whether existing components suffice, single-source); FW-C46
    says only that the platform offers components | unvalidated: rests on single-source
    claims only'
  constraints:
  - 'MUST make the platform, with Web Components and no framework, the default and
    the first candidate: ask whether the platform suffices before adding a framework,
    adopt one when a requirement is not met by the platform, and test the adopted
    framework in isolation for unexpected indirect dependencies in production (SUPPLY-C27).'
  - MUST name custom elements with a hyphen; the standard distinguishes autonomous
    custom elements from customized built-in elements defined with an extends option.
  design_notes: 'Judge record:

    Positions: (a) the platform''s custom elements, shadow DOM and templates with
    no library: FW-C46 (SRC-235 MDN), FW-C47 (SRC-211 HTML Standard); (b) adopt a
    framework by default.

    Forces: Zero third-party runtime code against the work a framework saves.

    Decision: (a) is the default and the first candidate (DEPENDENCIES.ADMISSION.1,
    SUPPLY-C27); custom element names carry a hyphen (T1). The question whether the
    platform suffices comes first (SUPPLY-C27); the isolation test applies to what
    is adopted.

    Rejected: (b): wins when a requirement exists that the platform does not meet;
    the isolation test of SUPPLY-C27 applies to whatever is adopted and does not decide
    whether the platform suffices.

    Re-judged under best (RELAX): the build made the isolation test a gate on adoption;
    SUPPLY-C27 asks first whether existing components suffice and then tests the adopted
    dependency in isolation for unexpected indirect dependencies, so the gate overreached
    its source. Platform-first is kept: no third-party code is the strongest trust
    position, and SUPPLY-C27 supports the question (inferred, single-source).

    Fact [single-source]: The platform offers framework-free components: Web Components
    combine custom elements, shadow DOM and HTML templates with slot, with no library.

    Sources cited: SRC-211, SRC-235'
