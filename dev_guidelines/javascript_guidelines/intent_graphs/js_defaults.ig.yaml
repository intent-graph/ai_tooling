    whether the function is safe on its own is stated by no admitted source.
  epistemic_state: 'known | unvalidated: inferred from SECGAP2-C83, C84, C85, SRVSEC-C44
    and the general deserialization rules (SRVSEC-C45, RUNSEC-C44, held on the principle
    js-philosophy:DEFENSE.INJECTION.5); whether v8.deserialize is safe for untrusted
    bytes is open | unvalidated: rests on single-source claims only | unvalidated:
    the MUST NOT is the strict form of sources that say could or if available (CWE-502:
    use signing or sealing if available, an HMAC could be used; OWASP: they could
    sign them); no source says v8.deserialize is unsafe'
  constraints:
  - MUST NOT pass an untrusted buffer to v8.deserialize unless a trusted party's integrity
    check (for example an HMAC) over it has been verified, and copy the result into
    a new object from validated fields instead of using it directly.
  design_notes: 'Judge record:

    v8.deserialize

    Positions: (a) apply the general deserialization rules to it: integrity check
    first, new object from validated fields (CWE-502, ASVS 15.1.5, SRVSEC-C45, RUNSEC-C44);
    (b) treat it as safe; (c) treat it as unsafe and forbid it. Claims SRVSEC-C44,
    SECGAP2-C83 to C85.

    Forces: Safety on an unstated question against forbidding a built-in on no evidence.

    Decision: (a). It claims no more than the sources: whether the function is safe
    for untrusted bytes stays open (C85).

    Rejected: (b): no source says so. (c): no source says so; wins if the Node or
    V8 documentation states that the format is unsafe.

    Re-judged under best (KEEP): the rule applies the class-level mitigations (populate
    a new object; integrity check where feasible, SRVSEC-C45 and RUNSEC-C44) to one
    deserializer and claims nothing about the function itself. The MUST NOT is stricter
    than where feasible, and is kept because the V8 header says the deserializer reads
    what ValueSerializer wrote (C84), so bytes from an untrusted party are not its
    stated input; the alternative, a data-only format parsed and validated at the
    trust boundary, costs little; and the absence of a safety statement is not evidence
    of safety. It would relax if Node or V8 states that the function is safe for hostile
    bytes.

    Fact [consensus]: Fact: v8.deserialize(buffer) uses a DefaultDeserializer, calls
    readHeader then readValue, and its host-object reader takes a type index and byte
    length from the buffer and builds a typed array over the buffer or an aligned
    copy; the Node page and the source carry no trust requirement.

    Fact [single-source]: Fact (V8 header comments): ValueDeserializer reads data
    written by ValueSerializer or a compatible implementation, the format is built
    for the HTML structured clone algorithm, and ReadHeader may fail if the format
    is invalid; no comment says the input may be hostile.

    Fact [single-source]: Open: whether v8.deserialize is safe for untrusted bytes
    is stated by no admitted source (Node''s v8 page, its security policy and the
    V8 header carry no statement); the decision above applies the general deserialization
    rules and claims no more.'
