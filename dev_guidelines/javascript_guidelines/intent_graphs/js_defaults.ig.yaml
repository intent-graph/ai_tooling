- uid: PIG-JS.DEFENSE
  name: Defense defaults
  intent: Treat all data from outside the trust boundary as hostile and every interpreting
    sink as dangerous; use the platform's safe API for each sink, check what cannot
    be avoided against an allowlist, enforce the check in the language runtime where
    an API exists, and add a second layer for what slips through.
