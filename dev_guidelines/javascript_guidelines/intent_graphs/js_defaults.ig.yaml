- uid: PIG-JS.CONTROL.SCHEDULING.1
  name: Ordering and timer precision
  intent: Code does not rely on the order of timers and immediates or on exact delays,
    and defers work in the way that cannot starve I/O.
  epistemic_state: 'known | unvalidated: single T1 source for the nextTick rule'
  constraints:
  - 'MUST prefer setImmediate over process.nextTick for deferring work: a recursive
    nextTick loop starves I/O and never lets the loop reach the poll phase.'
  - MUST NOT depend on the order of setTimeout(0) versus setImmediate outside an I/O
    callback (non-deterministic); inside an I/O callback the immediate always runs
    first.
  design_notes: 'Judge record:

    Positions: setImmediate over nextTick (ASYNC-C36; SRC-071); no order dependence
    between setTimeout(0) and setImmediate (ASYNC-C37; SRC-071, SRC-067); clamps (ASYNC-C32;
    SRC-062, SRC-067).

    Forces: starvation of I/O against ease of reasoning.

    Decision: defer with setImmediate; never depend on timer-versus-immediate order
    outside I/O; know the clamps.

    Rejected: nextTick as general deferral, refuted (SRC-071), no condition named;
    zero-delay timers as immediate, refuted (SRC-062, SRC-067).

    Rejected beliefs: Rejected belief: process.nextTick is the right general-purpose
    way to defer. Node docs recommend setImmediate in all cases.

    Rejected beliefs: Rejected belief: 0 ms timers fire with no delay. Clamps apply
    in both runtimes.

    Fact [consensus]: Delay clamps: browsers raise nested timers (nesting level above
    5) to at least 4 ms; Node sets delays below 1, NaN or above 2147483647 to 1 ms.

    Sources cited: SRC-062, SRC-067, SRC-071'
