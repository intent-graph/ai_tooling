- uid: PIG-JS.RUNTIME.MEMORY.1
  name: Classify the memory problem
  intent: A memory problem is first classed as running out of memory or as inefficient
    use, which selects the tool.
  epistemic_state: 'known | unvalidated: quote tool-extracted | unvalidated: rests
    on single-source claims only | unvalidated: quote not obtained (RUNTIME-C26)'
  constraints:
  - 'MUST classify a memory problem first: running out of memory (growing use, restarts,
    retained objects) versus inefficient use (unexpected size, high GC activity);
    the three tools are heap profiler, heap snapshot and GC traces.'
  design_notes: 'Judge record:

    Positions: (a) classify first: running out of memory versus inefficient use, then
    pick heap profiler, snapshot or GC traces (RUNTIME-C26, SRC-192 T1); (b) implicit:
    take a snapshot at once.

    Forces: (a) picks the cheapest sufficient tool; (b) heavy capture before knowing
    the question.

    Decision: (a).

    Rejected: (b): wins when the process may crash harmlessly and the leak is already
    evident.

