- uid: PIG-JS.STRUCTURE.LOADING.1
  name: Imports run once and hoisted
  intent: Never use import order to sequence work; run repeatable work by exporting
    a function.
  epistemic_state: known
  constraints:
  - 'MUST NOT rely on import statement order to sequence work: import declarations
    are hoisted and the imported module''s effects run before the rest of the importing
    module.'
  - MUST treat module top-level code as running once, at first import, for every importer;
    to run code repeatedly, export a function and call it.
  design_notes: 'Judge record:

    Positions: No order reliance, run-once top level (STRUCT-C04, STRUCT-C05; SRC-087,
    SRC-029, SRC-089, SRC-256) against sequencing work by import order

    Forces: Hoisting runs imported effects first; run-once means a second import repeats
    nothing

    Decision: Never sequence by import order; export a function for repeatable work

    Rejected: Import-order sequencing: wins nowhere in ES modules (the mechanism contradicts
    it)

    Sources cited: SRC-029, SRC-087, SRC-089, SRC-256'
