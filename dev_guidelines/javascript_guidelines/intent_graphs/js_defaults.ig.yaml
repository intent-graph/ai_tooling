- uid: PIG-JS.VERIFICATION.LINT.1.2
  name: Baseline rule set
  intent: Every project starts from the tool's maintained recommended set, for TypeScript
    too, so that the floor is not hand-built.
  epistemic_state: 'known | unvalidated: baseline suitability inferred | unvalidated:
    rests on single-source claims only'
  constraints:
  - 'MUST start from ESLint''s recommended config (from @eslint/js) as the baseline
    rule set, and from typescript-eslint''s recommended config for TypeScript code,
    with its stylistic set as a separate opt-in that does not affect program logic.
    No rule is overridden: ban-ts-comment stays at its recommended setting (PIG-JS.CONTRACTS.ESCAPE.6).
    Baseline suitability is inferred from the markers.'
  design_notes: 'Judge record:

    Positions: recommended config as baseline (QUALITY-C03; SRC-167); typescript-eslint
    recommended as the drop-in TypeScript baseline, stylistic as separate opt-in (QUALITY-C04;
    SRC-054).

    Forces: correctness floor without hand-curation against over-reporting; the recommended
    set is maintained by the tool''s authors.

    Decision: start from recommended, add typescript-eslint recommended for TypeScript;
    keep stylistic rules out of the correctness gate.

    Rejected: a hand-built rule list as the floor, because the rules index marks the
    maintained set; it wins only where a project needs a rule the set lacks, added
    on top. Suitability of the baseline is inferred (the sources define the marker,
    not its sufficiency).

    Sources cited: SRC-054, SRC-167'
