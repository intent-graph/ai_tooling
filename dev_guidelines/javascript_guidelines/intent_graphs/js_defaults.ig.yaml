- uid: PIG-JS.VERIFICATION.LINT.2.4
  name: Repeat runs are cheap
  intent: Unchanged files are not re-linted, so the gate stays fast enough to run
    on every change.
  epistemic_state: 'known | unvalidated: rests on claims marked inferred or open (QUALITY-C08)
    | unvalidated: rests on single-source claims only'
  constraints:
  - MUST use ESLint's --cache for repeated runs; choose --cache-strategy content when
    file modification times change without content changes (fresh CI checkouts, inferred
    example).
  design_notes: 'Judge record:

    Positions: `--cache`, strategy `metadata` (default) or `content` (QUALITY-C08;
    SRC-165).

    Forces: gate speed against stale-cache risk on checkouts that reset modification
    times.

    Decision: use `--cache` and, where modification times change without content changes
    (fresh CI checkouts, inferred), `--cache-strategy content`.

    Rejected: no cache, because repeated runs relint unchanged files; wins when the
    cache directory cannot persist between runs (inferred).

    Sources cited: SRC-165'
  impl_pointers:
