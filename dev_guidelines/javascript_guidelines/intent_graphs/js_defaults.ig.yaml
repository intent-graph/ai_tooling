- uid: PIG-JS.SUBSET.OBJECTS.2
  name: Construction order
  intent: A class is declared before use and a derived class initialises its base
    before touching its own state.
  epistemic_state: 'known | unvalidated: quote tool-extracted (class declaration rule)'
  constraints:
