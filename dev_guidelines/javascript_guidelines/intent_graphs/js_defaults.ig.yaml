- uid: PIG-JS.DEFENSE.ORIGIN.1
  name: Cross-origin messages
  intent: A page listens only for messages it expects, verifies origin by exact match,
    validates every message and names an exact target origin.
  epistemic_state: known
  constraints:
  - MUST register a message event listener only if you expect cross-origin messages;
    no listener means no receiving surface.
  - MUST verify event.origin (and source where relevant) in message handlers before
    acting, and discard messages from untrusted origins.
  - MUST compare the origin by exact match against an allowlist of full origins; substring
    or indexOf tests are insecure.
  - MUST validate the syntax and type of every message after verifying the origin;
    a trusted sender can itself be compromised.
  - MUST pass an exact targetOrigin to postMessage, never '*', whenever the message
    carries anything confidential (MDN says always).
  design_notes: 'Judge record:

    Cross-origin messages

    Positions: Verified origin by exact match, validated payload, exact target (MDN,
    HTML Standard, ASVS 3.5.5, OWASP). Claims DOMSEC-C30 to C34.

    Forces: Safety against open messaging between windows.

    Decision: No listener without need, exact origin match, validate syntax and type,
    exact targetOrigin for confidential data (MDN says always).

    Rejected: Substring or indexOf origin tests: rejected by OWASP as very insecure.
    Wildcard target: loses when any confidential data is sent.'
