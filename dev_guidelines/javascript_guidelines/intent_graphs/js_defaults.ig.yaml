- uid: PIG-JS.DEFENSE.ORIGIN.2
  name: Frames and window links
  intent: Untrusted and vendor content lives in sandboxed iframes from a separate
    origin; target=_blank links carry rel=noopener noreferrer explicitly; the own
    page refuses to be framed.
  epistemic_state: 'known | conflict: explicit rel unnecessary because the HTML Standard
    implies noopener, HTML Standard'
  constraints:
  - MUST embed untrusted content in an iframe with the sandbox attribute and lift
    only the restrictions you need.
  - 'MUST NOT combine allow-scripts and allow-same-origin on a same-origin embedded
    document: it can remove its own sandbox.'
  - MUST serve untrusted content from a separate origin as well, because a sandbox
    is useless if the content is opened outside the frame.
  - MUST isolate vendor scripts in an iframe from a different origin so they cannot
    reach the host DOM or cookies.
  - 'MUST add rel=noopener noreferrer to target=_blank links explicitly. The HTML
    Standard implies noopener unless rel=opener is present, so the explicit rel is
    a harmless extra that covers browsers predating the default; belief restricted:
    every _blank link needs rel=noopener added.'
  design_notes: 'Judge record:

    Frames and window links

    Positions: Sandboxed iframe, separate origin, explicit noopener (MDN, OWASP) against
    implied noopener only (HTML Standard). Claims DOMSEC-C43 to C47.

    Forces: Containment strength against markup brevity.

    Decision: Sandbox untrusted content, separate origin, no allow-scripts with allow-same-origin,
    explicit rel=noopener noreferrer.

    Rejected: Implied noopener only (HTML Standard): wins on browsers that implement
    the default, so explicit rel is harmless extra. Sandbox without separate origin:
    loses if the content can be opened outside the frame.'
