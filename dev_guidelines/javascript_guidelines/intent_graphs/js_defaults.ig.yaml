- uid: PIG-JS.DEFENSE.ORIGIN
  name: Origin boundaries
  intent: 'Messages, frames, third-party scripts and storage are each treated as an
    origin boundary: verified senders, sandboxed and separate-origin untrusted content,
    integrity-pinned external code, no secrets in storage, and code that a strict
    CSP can run. Forged cross-site requests are refused by the page''s own checks.'
  epistemic_state: known
  history:
  - who: agent:assembler
