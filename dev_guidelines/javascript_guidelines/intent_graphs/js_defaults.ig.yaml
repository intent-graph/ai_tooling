- uid: PIG-JS.DEFENSE.HOST.1
  name: Permission model
  intent: The permission model is a seat belt for trusted code with narrow grants,
    known symlink and descriptor limits and a patched Node.
  epistemic_state: 'known | conflict: permission model contains hostile or compromised
    dependencies, Node best-practices page | unvalidated: rests on claims marked inferred
    or open (RUNSEC-C40)'
  constraints:
  - MUST NOT treat the permission model as a sandbox against malicious code; use it
    as a seat belt for trusted code and never as the only control. Position held against
    the Node best-practices page, which says it can help contain malicious or compromised
    dependencies.
  - MUST ensure that no path granted under --permission contains a relative symlink,
    and do not rely on the permission model to restrict code already holding open
    file descriptors (CVE-2025-55130 as the fact).
  - MUST grant the permission model the narrowest paths and capabilities needed and
    avoid the * wildcard (inferred from the denied-by-default design).
  design_notes: 'Judge record:

    Permission model

    Positions: Seat belt (Node permissions docs, threat model) against containment
    of hostile dependencies (Node best-practices page). Claims RUNSEC-C38 to C40,
    SRVSEC-C54.

    Forces: Realism about guarantees against the appeal of a sandbox.

    Decision: Seat belt for trusted code only, narrow grants, patched Node, never
    the only control.

    Rejected: Permission model as sandbox: wins nowhere given the documented limits
    and CVEs.

    Fact [single-source]: Fact: CVE-2026-58043 (High) showed path matching can over-grant
    across radix-tree prefix boundaries, so --allow-fs-read and --allow-fs-write are
    not a hard containment boundary; patched in 22.23.2, 24.18.1, 26.5.1.'
