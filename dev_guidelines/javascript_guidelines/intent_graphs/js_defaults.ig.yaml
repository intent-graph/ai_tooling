- uid: PIG-JS.SUBSET.CONVERSION.2
  name: Null and undefined checks
  intent: A check for absence names the values it tests, with no loose-equality exception.
  epistemic_state: 'known | conflict: Google JS guide and ESLint option null ignore
    allow == null as the one exception | unvalidated: a stylistic tie on an exact
    mechanism, the choice rests on the reader-cost argument (inferred); the acceptable-when
    row has no claim of its own'
  constraints:
  - 'MUST forbid every ==, the null check included: write x === null or x === undefined
    (ESLint eqeqeq default always); the equality mechanism of == null is exact, but
    one uniform rule costs the reader nothing to apply.'
  - 'Acceptable only when the code base encodes it in its lint configuration: == null
    as the single allowed ==, because ECMA-262 7.2.13 makes it true for null and undefined
    and for nothing else (Google JS guide exception; eqeqeq option null ignore).'
  design_notes: 'Judge record:

    Positions: forbid all == (eqeqeq always, Airbnb); allow == null only (Google JS,
    eqeqeq null ignore).

    Forces: both are exact in mechanism (ECMA-262 7.2.13); one uniform rule asks nothing
    of the reader, the exception asks the reader to know the one exception.

    Decision: forbid every ==, the null check included, on the reader-cost argument:
    both forms are exact, so the only difference left is that the exception costs
    the reader one more rule to recall.

    Rejected: == null as the one exception; would win where the code base already
    encodes it in lint and values brevity over uniformity (recorded as acceptable-when).

    Re-judged under best (KEEP): "the more demanding option" was the former reason
    and is withdrawn. The mechanism is a tie (ECMA-262 7.2.13 makes == null exact)
    and the dissent audit calls the dispute stylistic, so the deciding force is the
    branch purpose: what an expression does follows from its text without a recalled
    exception (SUBSET.VISIBLE). The uniform rule is also ESLint''s default and Airbnb''s
    and needs no configuration; its cost is two comparisons for one. A close call,
    inferred; == null is best where the code base already encodes null: ignore in
    lint and values brevity (the acceptable-when row).'
