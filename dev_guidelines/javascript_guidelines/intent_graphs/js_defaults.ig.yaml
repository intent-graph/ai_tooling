- uid: PIG-JS.ROOT
  name: Solid JavaScript defaults
  intent: 'The concrete rules that make JavaScript predictable, cheap to change and
    attack-resistant in the browser and in Node: the safe subset, the type layer and
    boundary parsing, explicit control of time and failure, locality of change, hostile-input
    defence, trusted dependencies, machine verification and measured runtime behaviour.
    Each rule is one decision traced to ledger rows.'
  epistemic_state: known
