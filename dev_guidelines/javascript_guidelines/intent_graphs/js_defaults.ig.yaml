- uid: PIG-JS.DEFENSE.INJECTION.4.1
  name: Containment check
  intent: A path is canonicalized, symlinks resolved, and only then compared to the
    base directory, never by a raw string-prefix test.
  epistemic_state: 'known | unvalidated: Node-specific recipe inferred, one T2 ground
    for canonicalization | unvalidated: rests on single-source claims only'
  constraints:
  - MUST canonicalize a path (resolve it, following symlinks) before checking that
    it lies under the intended base directory; a lexical prefix check on an unresolved
    path is insufficient. The Node-specific recipe is inferred.
  - MUST build the absolute path from trusted parts, or set the root option, with
    Express res.sendFile or res.download; with root set Express validates that the
    path resolves within it, even with '..'. Express facts, no framework preference.
  - 'MUST NOT rely on url.fileURLToPath() to prevent directory traversal: it decodes
    %2e%2e to ''..'' and normalizes; validate that the returned path stays inside
    the expected directory before any file system call.'
  - 'MUST NOT test containment by a raw string-prefix comparison of resolved paths:
    a sibling directory sharing the prefix passes, as /app/static-secret passes against
    /app/static (CVE-2026-48049 in @hapi/inert, fixed in 7.1.1).'
  - 'MUST NOT assume path.resolve(base, input) stays under base: segments are processed
    right to left and an absolute input replaces everything before it, so check the
    resolved result against the base.'
  design_notes: 'Judge record:

    Containment check

    Positions: Canonicalize then compare (CWE-22, Node docs on isAbsolute and normalize,
    Express root option). Claims RUNSEC-C27, C29, SRVSEC-C47, C48, C49, C51.

    Forces: Safety against lexical convenience.

    Decision: Resolve symlinks and normalize, then check containment; validate the
    result of fileURLToPath; set root in Express.

    Rejected: path.normalize or isAbsolute alone: refuted by the Node docs. Prefix-stripping
    sanitization: broken by the node-tar advisory.

    Containment check (slot 14 addition)

    Added: never a raw string-prefix comparison (CVE-2026-48049, claim SECGAP2-C76);
    path.resolve lets an absolute input replace the base (C78); isAbsolute and normalize
    facts merged into the rejected belief (C77, C79); Node leaves validation to the
    application (C80).

    Rejected [single-source]: Belief rejected: path.normalize or path.isAbsolute sanitizes
    user paths. isAbsolute tests only whether the literal path is absolute (and /baz/..
    is absolute); normalize resolves .. and . lexically and on POSIX may remove ..
    segments in ways that change how the file system resolves the path, so a normalized
    string is not a canonical path; neither checks containment or symlinks.

    Fact [single-source]: Fact (Express docs): the dotfiles option of sendFile and
    download defaults to ignore (other values allow, deny); leave it so hidden files
    are not served.

    Fact [single-source]: Fact: node-tar stripped one absolute root, so a path with
    repeated roots stayed absolute (CVE-2021-32804, fixed in 3.2.2, 4.4.14, 5.0.6,
    6.1.1); the lesson, validate the resolved path instead of stripping a prefix once,
    is inferred.

    Fact [single-source]: Fact (Node threat model): untrusted file paths passed to
    fs APIs without validation are not counted as a Node vulnerability; path validation
    is the application''s job.'
