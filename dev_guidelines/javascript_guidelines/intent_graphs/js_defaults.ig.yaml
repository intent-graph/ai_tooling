- uid: PIG-JS.CONTROL.PROMISES.1
  name: Chaining without loss
  intent: Every promise started inside a chain is returned into it, so later steps
    wait for the work they depend on.
  epistemic_state: 'known | unvalidated: single T2 source for the forked-chain case;
    single T1 editorial position for flat chains'
  constraints:
  - MUST return or await every promise created inside a then callback; an unreturned
    inner promise is lost to the chain and later handlers run early on incomplete
    data.
  - MUST keep promise chains flat and nest only deliberately, to confine a catch to
    the nested scope (MDN editorial position, recorded as the holder's position).
  design_notes: 'Judge record:

    Positions: return or await the inner promise (ASYNC-C01; SRC-075, SRC-245, SRC-072);
    return the promise p.then produced (ASYNC-C14; SRC-245); flat chains (ASYNC-C15;
    SRC-075) against nesting; leave the inner promise unreturned (folklore).

    Forces: predictability of order at no cost; flatness serves readability and catch
    scope.

    Decision: always return or await; return the then result; keep chains flat and
    nest only to confine a catch.

    Rejected: unreturned inner promise, refuted (SRC-075, SRC-072), never wins; returning
    p, loses the continuation, never wins; nesting by default, wins when a catch must
    cover only the inner scope (SRC-075).

    Rejected beliefs: Rejected belief: a missing return in a then callback is harmless.
    The dependent promise fulfils with undefined and later handlers run before the
    inner work finishes.

    Fact [single-source]: Return the promise that p.then(...) produced, not the original
    p; returning p forks the chain and the continuation result is lost.

    Sources cited: SRC-072, SRC-075, SRC-245'
