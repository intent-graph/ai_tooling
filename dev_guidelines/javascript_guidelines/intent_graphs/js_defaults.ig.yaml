- uid: PIG-JS.DEPENDENCIES.FRAMEWORK_SHORTLIST
  name: Framework short list
  intent: The candidates that show the trust evidence today, the platform first, then
    four frameworks; another framework joins by showing the same evidence.
  epistemic_state: 'risky | unvalidated: gates B and C are the build''s judgment,
    no admitted source states them; gate A is inferred from the supported-versions
    rule (TYPES-C45, SUPPLY-C36) | unvalidated: the list is a snapshot of what the
    admitted sources state, not a ranking | conflict: keep Vue and drop the platform
    baseline, an earlier proposal (inferred)'
  constraints:
  - 'MUST admit a framework to the short list when it states which versions receive
    security fixes (gate A, mandatory) and also has a documented escape and sanitization
    model (gate B) or a stated governance or maintenance body (gate C); treat the
    list as the candidates that show this evidence today: a framework not on it may
    be chosen once it shows the same evidence, and absence from the list for lack
    of evidence is not a rejection. Gate A follows from the guideline''s own rule
    to run only supported versions (TYPES-C45, SUPPLY-C36, SUPPLY-C28); gates B and
    C are the build''s judgment, no admitted source states them.'
  design_notes: 'Judge record:

    Positions: Candidates and their evidence are in the framework evidence matrix
    (build/research/10_frameworks/result.md, L3 full). Positions: (a) an earlier proposal:
    React, Angular, Vue, Lit, htmx, no framework as comparator; (b) this note: gates
    on trust evidence; (c) rank by popularity.

    Forces: Purpose is trust: third-party code with your privileges. The practice
    that serves trust best states what the code is, who maintains it and for how long
    it is patched, and adds the least third-party code. Framework documentation grounds
    facts about that framework only, so the gates are the build''s judgment, recorded
    here.

    Decision: Gate A (mandatory): the candidate states which versions receive security
    fixes, as the guideline itself runs only supported versions (TYPES-C45, SUPPLY-C36,
    SUPPLY-C28). Gate B: a documented escape and sanitization model (framework evidence
    matrix, owned by DEFENSE). Gate C: stated governance or maintenance body. Pass
    A and at least one of B or C. Short list, unranked among frameworks because no
    admitted source can rank them: (1) the platform with Web Components and no framework,
    default; (2) htmx; (3) Lit; (4) Angular; (5) React. Matrix: React A yes (FW-C25),
    B yes, C yes (FW-C31, provisional); Angular A yes (FW-C23, strongest), B yes,
    C open (FW-C35); Lit A yes (FW-C28), B open (FW-C16), C yes (FW-C34); htmx A yes
    (FW-C21), B yes, C open (FW-C35); Vue A no (FW-C26), B yes, C partial (FW-C32);
    Svelte A no (FW-C27), B yes, C open; Solid A no (FW-C29, FW-C30), B no (FW-C15,
    FW-C16), C partial (FW-C33). The list is a snapshot of the admitted evidence,
    not a closed set: a framework not on it joins when it shows gate A and one of
    B or C.

    Rejected: Vue: wins if an admitted source states a Vue security-fix window, and
    then names a legal entity or funding; it is the closest runner-up. Svelte: wins
    with a supported-versions statement and a governance source. Solid: wins with
    a support policy and a default-escaping description. (c) popularity: rejected,
    the standing rule; only React has a figure. ''A framework is always needed'':
    wins when a requirement is not met by the platform (SUPPLY-C27 test). Left off
    for missing evidence, not for merit; reopen when sources appear. A closed approved
    list (a team may choose only among these): wins where an organisation wants a
    fixed list for audit, which is a policy and not a trust finding (inferred).

    Re-judged under best (RELAX): the purpose is trust. Gate A has a grounded ancestor,
    the guideline''s own rule to run only supported versions (TYPES-C45, SUPPLY-C36,
    SUPPLY-C28). That Vue, Svelte and Solid are absent is a gap in the admitted sources,
    not a finding about the frameworks, so a closed list claimed more than the evidence
    gives. Best for trust: state what a candidate must show and what the build found,
    and let another framework in on the same evidence. Gates B and C stay the build''s
    judgment, flagged.'
