[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "md-structure-sync"
version = "0.1.0"
description = "Synchronize markdown table of contents and section line ranges"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[project.scripts]
md-structure-sync = "md_structure_sync.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/md_structure_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
