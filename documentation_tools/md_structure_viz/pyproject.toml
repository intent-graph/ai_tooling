[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "md-structure-viz"
version = "0.1.0"
description = "Visualize documentation structure in software repositories"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
md-doc-tree-simple = "md_structure_viz.cli:run_simple"
md-doc-tree-rich = "md_structure_viz.cli:run_rich"
md-doc-tree-full = "md_structure_viz.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/md_structure_viz"]
